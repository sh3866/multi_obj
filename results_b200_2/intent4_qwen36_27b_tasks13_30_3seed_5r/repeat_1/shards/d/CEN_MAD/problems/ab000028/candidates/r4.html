<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertical Limit | Descent Visual</title>
<style>
    :root {
        --c-bg-deep: #02040a;
        --c-bg-mid: #0f172a;
        --c-text-main: #ffffff;
        --c-text-muted: rgba(255, 255, 255, 0.5);
        --c-accent: #f97316; /* Safety Orange */
        --c-accent-glow: rgba(249, 115, 22, 0.4);
        --c-ui-grid: rgba(255, 255, 255, 0.08);
        --font-display: "Impact", "Arial Black", sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-bg-deep);
        color: var(--c-text-main);
        font-family: var(--font-mono);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
    }

    /* --- SCENE CONTAINER --- */
    .scene-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Critique #2: Vertical gradient sky, deep void to hazy horizon */
        background: linear-gradient(to bottom, #000000 0%, #020617 40%, #1e293b 80%, #475569 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- HUD OVERLAY --- */
    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* HUD Header - Minimalist */
    .hud-header {
        align-self: flex-start;
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.8;
        mix-blend-mode: screen;
    }

    .hud-header h1 {
        font-size: 1.25rem;
        color: #fff;
        font-weight: 400;
        margin-bottom: 0.1rem;
    }

    .hud-header .sub {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--c-text-muted);
        letter-spacing: 0.1em;
    }

    /* Critique #4: HUD Data Panel - Integrated, Low Opacity, Strict Grid */
    .hud-data {
        align-self: flex-start;
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        background: rgba(2, 6, 23, 0.4); /* Lower opacity */
        backdrop-filter: blur(8px);
        border-left: 1px solid var(--c-ui-grid);
        padding: 1rem 1.25rem;
        min-width: 240px;
    }

    .data-row {
        display: grid;
        grid-template-columns: 90px 1fr;
        align-items: baseline;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--c-ui-grid);
    }
    
    .data-row:last-child { border-bottom: none; }

    .data-label {
        font-size: 0.65rem;
        color: var(--c-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    .data-value {
        font-size: 1.1rem;
        color: #fff;
        font-weight: 400; /* Less bold, cleaner */
        text-align: right;
        letter-spacing: -0.02em;
    }

    .data-unit {
        font-size: 0.6rem;
        color: var(--c-text-muted);
        margin-left: 6px;
    }

    /* Critical data accent */
    .critical .data-value {
        color: var(--c-accent);
        text-shadow: 0 0 8px var(--c-accent-glow);
    }

    @media (max-width: 600px) {
        .ui-overlay { padding: 1.5rem; }
        .hud-data { min-width: 200px; }
        .data-value { font-size: 1rem; }
    }

</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
            <defs>
                <!-- Filters -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                
                <!-- Sky Gradient (Critique #2) -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#000000" />
                    <stop offset="50%" stop-color="#020617" />
                    <stop offset="90%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#64748b" />
                </linearGradient>

                <!-- Cliff Gradients (Critique #1) -->
                <linearGradient id="cliffBase" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#020617" />
                </linearGradient>
                
                <!-- Parachute Gradients (Critique #3) -->
                <linearGradient id="canopyLight" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#fdba74" /> <!-- Highlight -->
                    <stop offset="40%" stop-color="#ea580c" /> <!-- Main -->
                    <stop offset="100%" stop-color="#7c2d12" /> <!-- Shadow -->
                </linearGradient>
                
                <!-- Rim Light Gradient -->
                <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
                </linearGradient>
            </defs>

            <!-- 1. Background & Atmosphere (Critique #2) -->
            <g id="atmosphere">
                <!-- Distant Mountains (Low Contrast, Hazy) -->
                <path d="M0,600 L100,580 L250,620 L400,560 L600,610 L800,540 L1000,600 L1200,550 L1200,800 L0,800 Z" fill="#1e293b" opacity="0.3" />
                <path d="M0,650 L150,620 L300,660 L500,600 L700,650 L900,610 L1200,660 L1200,800 L0,800 Z" fill="#0f172a" opacity="0.5" />
                
                <!-- Horizon Glow -->
                <rect x="0" y="650" width="1200" height="150" fill="url(#skyGrad)" opacity="0.2" style="mix-blend-mode: screen;" />
            </g>

            <!-- 2. The Cliff (Right Side - Critique #1) -->
            <!-- Reconstructed Geometry: Jagged, Striated, Heavy -->
            <g id="cliff-group">
                <!-- Main Mass -->
                <path d="M1200,0 L920,0 L950,120 L890,200 L940,280 L880,360 L960,450 L900,550 L980,650 L920,750 L1200,800 L1200,0 Z" fill="url(#cliffBase)" />
                
                <!-- Striation Layers (Geological Weight) -->
                <g fill="#1e293b" opacity="0.6">
                    <polygon points="920,0 950,120 1200,120 1200,0" />
                    <polygon points="890,200 940,280 1200,280 1200,200" />
                    <polygon points="880,360 960,450 1200,450 1200,360" />
                    <polygon points="900,550 980,650 1200,650 1200,550" />
                </g>

                <!-- Detail Lines (Texture) -->
                <g stroke="#000000" stroke-width="2" opacity="0.5">
                    <path d="M950,120 L1200,120" />
                    <path d="M940,280 L1200,280" />
                    <path d="M960,450 L1200,450" />
                    <path d="M980,650 L1200,650" />
                </g>
                
                <!-- Jagged Edge Highlight (Silhouette against sky) -->
                <path d="M920,0 L950,120 L890,200 L940,280 L880,360 L960,450 L900,550 L980,650 L920,750" fill="none" stroke="#64748b" stroke-width="3" opacity="0.7" />
            </g>

            <!-- 3. Parachutist Group (Critique #3 & #5) -->
            <!-- Centered, Enlarged, Rim-lit, Dynamic Wind -->
            <g id="parachutist" transform="translate(450, 350)">
                
                <!-- Critique #5: Dynamic Wind Streaks (Tapered) -->
                <g id="wind-lines" fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.4">
                    <!-- Curves originating from canopy area -->
                    <path d="M-200,-150 C-100,-180 100,-100 300,-50" stroke-width="2" />
                    <path d="M-250,-50 C-100,-80 100,0 350,50" stroke-width="1.5" />
                    <path d="M-150,50 C-50,20 150,80 400,120" stroke-width="2.5" />
                    <path d="M-300,150 C-150,120 100,160 450,200" stroke-width="1" />
                </g>

                <!-- Canopy (Hero) -->
                <g id="canopy-group">
                    <!-- Main Canopy Shape (Low Poly Facets) -->
                    <path d="M-180,-100 C-180,-280 0,-300 0,-140 L0,-130 Z" fill="url(#canopyLight)" />
                    <path d="M0,-140 C0,-300 180,-280 180,-100 L180,-115 L0,-130 Z" fill="#9a3412" opacity="0.9" /> <!-- Right side shadow -->
                    
                    <!-- Canopy Rim Light (Critique #3) -->
                    <path d="M-180,-100 C-180,-280 0,-300 0,-140" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" filter="url(#glow)" />
                    
                    <!-- Vent/Bottom Shadow -->
                    <path d="M-180,-100 C-180,-280 180,-280 180,-100 C140,-80 60,-60 0,-70 C-60,-60 -140,-80 -180,-100 Z" fill="#2a0e05" opacity="0.8" />
                </g>

                <!-- Suspension Lines (Taut) -->
                <g id="lines" stroke="#e2e8f0" stroke-width="1.5" fill="none" opacity="0.7">
                    <!-- Left Lines -->
                    <line x1="-160" y1="-105" x2="-15" y2="110" />
                    <line x1="-90" y1="-145" x2="-15" y2="110" />
                    <line x1="-30" y1="-150" x2="-15" y2="110" />
                    <!-- Right Lines -->
                    <line x1="30" y1="-150" x2="15" y2="110" />
                    <line x1="90" y1="-145" x2="15" y2="110" />
                    <line x1="160" y1="-105" x2="15" y2="110" />
                </g>

                <!-- The Figure (Critique #3: Silhouette, Helmet, Leaning) -->
                <g id="human" transform="rotate(15, 0, 110)">
                    <!-- Harness/Backpack -->
                    <rect x="-14" y="105" width="28" height="40" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
                    
                    <!-- Torso (Dynamic Lean) -->
                    <path d="M-10,145 L-8,210 L8,210 L10,145 Z" fill="#020617" />
                    
                    <!-- Legs (Spread) -->
                    <path d="M-8,210 L-20,270 L-15,290" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M8,210 L15,260 L10,285" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Arms (Active) -->
                    <path d="M-8,150 L-25,180 L-20,190" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" />
                    <path d="M8,150 L20,185 L15,195" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" />
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="135" r="11" fill="#020617" />

                    <!-- Rim Light (Critique #3: Separation) -->
                    <g stroke="url(#rimLight)" stroke-width="1.5" fill="none" filter="url(#glow)">
                        <path d="M-10,145 L-8,210" /> <!-- Back -->
                        <path d="M-20,270 L-15,290" /> <!-- Leg -->
                        <path d="M-25,180 L-20,190" /> <!-- Arm -->
                        <path d="M-11,135 A 11 11 0 0 1 0,124" /> <!-- Helmet -->
                    </g>
                </g>
            </g>
            
        </svg>
    </div>

    <!-- HUD OVERLAY -->
    <div class="ui-overlay">
        
        <!-- Top Left: Title -->
        <div class="hud-header">
            <h1>Vertical Limit</h1>
            <div class="sub">Sector 7 // Descent Vector</div>
        </div>

        <!-- Bottom Left: Data Panel (Critique #4) -->
        <div class="hud-data">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value"><span id="alt-val">4,200</span><span class="data-unit">FT</span></span>
            </div>
            <div class="data-row critical">
                <span class="data-label">Vertical</span>
                <span class="data-value"><span id="vert-val">-850</span><span class="data-unit">FPM</span></span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind</span>
                <span class="data-value"><span id="wind-val">24</span><span class="data-unit">MPH NW</span></span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy</span>
                <span class="data-value" style="font-size: 0.9rem; letter-spacing: 0.1em;">NOMINAL</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const human = document.getElementById('human');
            const windLines = document.getElementById('wind-lines');
            const altVal = document.getElementById('alt-val');
            const vertVal = document.getElementById('vert-val');
            const windVal = document.getElementById('wind-val');
            
            let time = 0;
            let altitude = 4200;
            let verticalSpeed = -850;
            let windSpeed = 24;
            
            // Mouse interaction for parallax
            const scene = document.querySelector('.scene-container');
            let mouseX = 0;
            let mouseY = 0;
            let targetMouseX = 0;
            let targetMouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                targetMouseX = (e.clientX - rect.left) / rect.width - 0.5;
                targetMouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            function animate() {
                time += 0.005; // Majestic slow time
                
                // Smooth Parallax
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                // 1. Sway Motion (Heavy Canopy)
                const swayX = Math.sin(time) * 20;
                const swayY = Math.cos(time * 0.8) * 10;
                
                // 2. Pendulum Physics (Figure swings relative to canopy)
                const swing = Math.sin(time) * 12; 

                // 3. Wind Lines Animation (Flowing Right)
                // We animate the stroke-dashoffset or translate to simulate speed
                const windOffset = (time * 50) % 400;
                // Invert translation to make wind look like it's moving past
                windLines.setAttribute('transform', `translate(${-windOffset}, 0)`);

                // Apply Transforms
                // Center point is 450, 350
                const baseX = 450 + (mouseX * 40) + swayX;
                const baseY = 350 + (mouseY * 25) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);
                
                // Human swings relative to connection point (0, 110)
                human.setAttribute('transform', `rotate(${swing}, 0, 110)`);

                // Data Simulation
                altitude += verticalSpeed * 0.002; 
                if (altitude < 1200) altitude = 4500;
                if (altitude > 4000) altitude = 4200;
                
                // Fluctuate wind slightly
                windSpeed = 24 + Math.sin(time * 2) * 2;
                verticalSpeed = -850 + Math.cos(time * 1.5) * 50;

                altVal.innerText = Math.floor(altitude).toLocaleString();
                vertVal.innerText = Math.floor(verticalSpeed).toLocaleString();
                windVal.innerText = Math.floor(windSpeed);

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
