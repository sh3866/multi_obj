<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | Editorial Visual</title>
<style>
    :root {
        --c-text-main: #ffffff;
        --c-text-muted: rgba(255, 255, 255, 0.7);
        --c-accent: #06b6d4; /* Cyan rim light */
        --c-ui-accent: rgba(6, 182, 212, 0.6);
        --font-display: "Arial Black", "Impact", "Helvetica Neue", sans-serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #0f172a;
        color: var(--c-text-main);
        font-family: var(--font-body);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: block;
    }

    /* --- SCENE CONTAINER (Background) --- */
    .scene-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Deep atmospheric gradient */
        background: linear-gradient(to bottom, #020617 0%, #1e293b 40%, #475569 80%, #94a3b8 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- HUD OVERLAY (Foreground) --- */
    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 4rem;
    }

    /* HUD Header - Top Left */
    .hud-header {
        max-width: 400px;
        border-left: 2px solid var(--c-accent);
        padding-left: 1.5rem;
        background: linear-gradient(90deg, rgba(6, 182, 212, 0.05) 0%, transparent 100%);
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--c-accent);
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: var(--c-accent);
        box-shadow: 0 0 8px var(--c-accent);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 5rem;
        line-height: 0.85;
        font-weight: 900;
        margin-bottom: 0.5rem;
        color: #fff;
        letter-spacing: -0.04em;
        font-style: italic;
        text-transform: uppercase;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 span {
        color: rgba(255,255,255,0.9);
        display: block;
        font-size: 2.5rem;
        font-weight: 700;
        font-style: normal;
        margin-top: 0.25rem;
        letter-spacing: 0.1em;
    }

    /* HUD Footer - Bottom Right */
    .hud-footer {
        align-self: flex-end;
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .data-row {
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        gap: 1.5rem;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        padding-bottom: 0.25rem;
        margin-bottom: 0.5rem;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--c-accent);
        margin-bottom: 0.25rem;
    }

    .data-value {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 700;
        color: #fff;
        font-style: italic;
        text-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }

    .data-unit {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: rgba(255,255,255,0.6);
        margin-bottom: 0.4rem;
    }

    /* Decorative HUD Elements */
    .hud-crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 200px;
        height: 200px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
    .hud-crosshair::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        border: 1px dashed rgba(6, 182, 212, 0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .ui-overlay { padding: 1.5rem; }
        h1 { font-size: 3rem; }
        h1 span { font-size: 1.5rem; }
        .hud-footer { align-self: flex-start; text-align: left; }
        .data-row { justify-content: flex-start; }
        .hud-crosshair { display: none; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE (Full Bleed) -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
            <defs>
                <!-- Gradients -->
                <linearGradient id="cliffGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="100%" stop-color="#334155" />
                </linearGradient>

                <radialGradient id="skyGlow" cx="0.2" cy="0.3" r="0.9">
                    <stop offset="0%" stop-color="#475569" stop-opacity="0.5" />
                    <stop offset="100%" stop-color="#020617" stop-opacity="0" />
                </radialGradient>
                
                <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurMotion">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="8 2" />
                </filter>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- 1. Sky & Atmosphere -->
            <rect width="100%" height="100%" fill="url(#skyGlow)" />

            <!-- 2. Distant Mountains (Atmospheric Depth - Layered) -->
            <g id="bg-mountains">
                <!-- Far Range -->
                <path d="M0,550 L150,480 L300,520 L500,400 L700,500 L900,450 L1200,600 L1200,800 L0,800 Z" fill="#1e293b" opacity="0.8" />
                <!-- Mid Range -->
                <path d="M0,600 L200,500 L400,580 L600,450 L800,550 L1000,480 L1200,650 L1200,800 L0,800 Z" fill="#0f172a" opacity="0.9" />
                <!-- Valley Floor Mist -->
                <rect x="0" y="650" width="1200" height="150" fill="url(#mistGrad)" opacity="0.4" />
            </g>

            <!-- 3. The Main Cliff (Foreground Right - Jagged Geology) -->
            <g id="cliff-group">
                <!-- Main Cliff Mass -->
                <path d="M1200,0 L850,0 L880,120 L820,180 L890,250 L830,350 L920,420 L860,550 L960,650 L900,800 L1200,800 Z" fill="url(#cliffGrad)" />
                
                <!-- Geological Strata (Detailed Layering) -->
                <g stroke="#000000" stroke-width="3" fill="none" opacity="0.6">
                    <!-- Top Layer -->
                    <path d="M850,0 L880,120 L870,120 L850,10 Z" fill="#1e293b" stroke="#0f172a" />
                    <!-- Strata Lines -->
                    <path d="M880,120 L950,120 L940,150" />
                    <path d="M820,180 L920,180 L910,220" />
                    <path d="M890,250 L980,250 L970,290" />
                    <path d="M830,350 L950,350 L940,390" />
                    <path d="M920,420 L1000,420 L990,460" />
                    <path d="M860,550 L980,550 L970,600" />
                    <path d="M960,650 L1050,650 L1040,700" />
                </g>

                <!-- Rock Facets for 3D Volume -->
                <polygon points="850,0 880,120 820,180" fill="#020617" opacity="0.5" />
                <polygon points="890,250 920,420 860,550" fill="#000000" opacity="0.3" />
                <polygon points="960,650 900,800 1050,800" fill="#020617" opacity="0.6" />
                
                <!-- Jagged Edge Highlight -->
                <path d="M850,0 L880,120 L820,180 L890,250 L830,350 L920,420 L860,550 L960,650 L900,800" fill="none" stroke="#475569" stroke-width="1" />
            </g>

            <!-- 4. Parachutist Group -->
            <g id="parachutist" transform="translate(500, 300)">
                
                <!-- Wind / Speed Streaks (Dynamic Lines) -->
                <g id="wind-lines" stroke="#ffffff" stroke-width="2" opacity="0.4" filter="url(#blurMotion)">
                    <!-- Lines originate from left, pointing right -->
                    <line x1="-300" y1="-150" x2="-150" y2="-150" />
                    <line x1="-400" y1="-50" x2="-250" y2="-50" />
                    <line x1="-350" y1="50" x2="-200" y2="50" />
                    <line x1="-450" y1="150" x2="-300" y2="150" />
                    <line x1="-250" y1="250" x2="-100" y2="250" />
                </g>

                <!-- The Canopy (Volumetric Dome) -->
                <g id="canopy-group">
                    <!-- Main Orange Canopy -->
                    <path id="canopy" d="M-180,-100 C-180,-250 180,-250 180,-100 C120,-130 60,-110 0,-120 C-60,-110 -120,-130 -180,-100 Z" fill="#ea580c" />
                    
                    <!-- Shading/Folds (3D Illusion) -->
                    <path d="M-180,-100 C-180,-250 0,-250 0,-120 C-50,-110 -100,-120 -180,-100 Z" fill="#9a3412" opacity="0.7" /> <!-- Left Shadow -->
                    <path d="M0,-120 C0,-250 180,-250 180,-100 C100,-120 50,-110 0,-120 Z" fill="#fdba74" opacity="0.4" /> <!-- Right Highlight -->
                    <path d="M-90,-110 C-90,-200 90,-200 90,-110" fill="none" stroke="#7c2d12" stroke-width="2" opacity="0.5" /> <!-- Center Seam -->
                </g>

                <!-- Taut Harness Lines (Converging) -->
                <!-- Connecting canopy rim to harness point (0, 100) -->
                <g id="lines" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.9">
                    <path d="M-160,-105 L0,100" />
                    <path d="M-100,-130 L0,100" />
                    <path d="M-40,-135 L0,100" />
                    <path d="M0,-140 L0,100" />
                    <path d="M40,-135 L0,100" />
                    <path d="M100,-130 L0,100" />
                    <path d="M160,-105 L0,100" />
                </g>

                <!-- The Human Figure (Silhouette with Rim Light) -->
                <g id="human">
                    <!-- Harness/Backpack -->
                    <rect x="-15" y="95" width="30" height="40" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1" />
                    
                    <!-- Main Body Silhouette -->
                    <path d="M-10,135 L-8,200 L8,200 L10,135 Z" fill="#020617" />
                    
                    <!-- Limbs (Dynamic Pose - Dangling & Wind Resistance) -->
                    <!-- Left Leg -->
                    <path d="M-8,200 L-20,250 L-15,270" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Right Leg -->
                    <path d="M8,200 L15,240 L10,265" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Arms (Holding risers/controls) -->
                    <path d="M-10,140 L-25,165 L-15,175" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" />
                    <path d="M10,140 L25,165 L15,175" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" />
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="125" r="11" fill="#020617" />

                    <!-- Rim Light (Cyan glow to separate from dark background) -->
                    <g stroke="#06b6d4" stroke-width="2" fill="none" filter="url(#glow)">
                        <path d="M-10,135 L-8,200" /> <!-- Left Body Edge -->
                        <path d="M-20,250 L-15,270" /> <!-- Left Foot Edge -->
                        <path d="M-25,165 L-15,175" /> <!-- Left Hand Edge -->
                        <path d="M0,114 A 11 11 0 0 1 0,136" /> <!-- Helmet Highlight -->
                    </g>
                </g>
            </g>
            
            <!-- Dust/Particles near cliff (Foreground detail) -->
            <g fill="#ffffff" opacity="0.5">
                <circle cx="880" cy="350" r="2" />
                <circle cx="910" cy="380" r="3" />
                <circle cx="860" cy="420" r="1.5" />
                <circle cx="930" cy="480" r="2.5" />
                <circle cx="890" cy="550" r="1" />
            </g>

        </svg>
    </div>

    <!-- HUD OVERLAY (Foreground) -->
    <div class="ui-overlay">
        
        <!-- Top Left: Header -->
        <div class="hud-header">
            <div class="tag">Operation: Vertical Limit</div>
            <h1>Controlled<br><span>Descent</span></h1>
        </div>

        <!-- Center: Decorative Guide -->
        <div class="hud-crosshair"></div>

        <!-- Bottom Right: Data Dashboard -->
        <div class="hud-footer">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">4,200</span>
                <span class="data-unit">ft MSL</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Speed</span>
                <span class="data-value">24</span>
                <span class="data-unit">mph NW</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy Load</span>
                <span class="data-value">1.4</span>
                <span class="data-unit">G-Force</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const human = document.getElementById('human');
            const windLines = document.getElementById('wind-lines');
            const altVal = document.getElementById('alt-val');
            
            let time = 0;
            let altitude = 4200;
            
            // Mouse interaction for parallax effect
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            // Smooth mouse tracking
            let targetMouseX = 0;
            let targetMouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                // Normalize -1 to 1
                targetMouseX = (e.clientX - rect.left) / rect.width - 0.5;
                targetMouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            function animate() {
                time += 0.01; // Animation speed
                
                // 1. Smooth Parallax Interpolation
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                // 2. Floating Motion (Sine waves)
                // The parachute sways gently in the wind
                const swayX = Math.sin(time) * 20;
                const swayY = Math.cos(time * 0.7) * 10;
                
                // 3. Pendulum Physics (Human swings opposite to canopy)
                // Calculate swing angle based on sway velocity
                const swing = Math.sin(time) * 12; 
                
                // 4. Wind Lines Animation (Moving Left)
                const windOffset = (time * 50) % 200;
                windLines.setAttribute('transform', `translate(${-windOffset}, 0)`);

                // Apply transforms
                // Move the whole group based on mouse (parallax) + sway
                // Center of screen is approx 600, 400 in viewBox
                // We center the parachutist slightly to the left to balance the cliff on the right
                const baseX = 450 + (mouseX * 40) + swayX;
                const baseY = 350 + (mouseY * 30) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the canopy center
                // We rotate around the connection point (0, 100 in local space - where lines meet harness)
                human.setAttribute('transform', `rotate(${swing}, 0, 100)`);

                // Simulate Altitude Drop (Visual only)
                // Slowly decrement to show descent
                altitude -= 0.8; 
                if (altitude < 1000) altitude = 4500; // Reset loop
                
                // Update DOM occasionally to save performance
                if (Math.floor(time * 10) % 2 === 0) {
                    altVal.innerText = Math.floor(altitude).toLocaleString();
                }

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
