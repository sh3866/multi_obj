<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertical Limit | Descent Visual</title>
<style>
    :root {
        --c-text-main: #ffffff;
        --c-text-muted: rgba(255, 255, 255, 0.6);
        --c-accent: #ea580c; /* Safety Orange */
        --c-accent-dim: rgba(234, 88, 12, 0.4);
        --c-ui-grid: rgba(255, 255, 255, 0.15);
        --font-display: "Impact", "Arial Black", sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #020617;
        color: var(--c-text-main);
        font-family: var(--font-mono);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
    }

    /* --- SCENE CONTAINER --- */
    .scene-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Critique #1: Deep indigo to hazy teal gradient */
        background: linear-gradient(to bottom, #020617 0%, #0f172a 40%, #334155 80%, #94a3b8 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- HUD OVERLAY --- */
    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Critique #3: Typography & Hierarchy - HUD Header */
    .hud-header {
        align-self: flex-start;
        /* Critique #3: Reduced size, top-left, tracking */
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        line-height: 1;
        opacity: 0.9;
        mix-blend-mode: overlay; /* Blend slightly into background */
    }

    .hud-header h1 {
        font-size: 1.5rem; /* Significantly reduced */
        color: rgba(255, 255, 255, 0.9);
        font-weight: 700;
        margin-bottom: 0.25rem;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .hud-header .sub {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--c-accent);
        letter-spacing: 0.2em;
        font-weight: 700;
    }

    /* Critique #8: HUD Data Panel - Bottom Left, Grid, Monospace */
    .hud-data {
        align-self: flex-start;
        display: flex;
        flex-direction: column;
        gap: 0;
        background: rgba(2, 6, 23, 0.6);
        backdrop-filter: blur(4px);
        border-left: 2px solid var(--c-accent);
        padding: 1rem;
        min-width: 220px;
    }

    .data-row {
        display: grid;
        grid-template-columns: 80px 1fr;
        align-items: baseline;
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--c-ui-grid);
    }
    
    .data-row:last-child { border-bottom: none; }

    .data-label {
        font-size: 0.7rem;
        color: var(--c-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .data-value {
        font-size: 1.1rem;
        color: #fff;
        font-weight: 700;
        text-align: right;
    }

    .data-unit {
        font-size: 0.6rem;
        color: var(--c-accent);
        margin-left: 4px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
        .ui-overlay { padding: 1.5rem; }
        .hud-header h1 { font-size: 1.2rem; }
        .hud-data { min-width: 180px; }
    }

</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
            <defs>
                <!-- Critique #4: Faceted shading gradients (subtle) -->
                <linearGradient id="canopyLight" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#f97316" />
                    <stop offset="50%" stop-color="#ea580c" />
                    <stop offset="100%" stop-color="#9a3412" />
                </linearGradient>
                
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- 1. Background & Atmosphere -->
            <!-- Critique #1: Distant mountain range at bottom -->
            <g id="atmosphere">
                <!-- Far Horizon -->
                <path d="M0,650 L150,600 L300,630 L500,550 L700,620 L900,580 L1200,680 L1200,800 L0,800 Z" fill="#1e293b" opacity="0.4" />
                <!-- Mid Horizon -->
                <path d="M0,700 L200,650 L400,680 L600,600 L800,660 L1000,620 L1200,720 L1200,800 L0,800 Z" fill="#0f172a" opacity="0.7" />
                
                <!-- Atmospheric Haze -->
                <rect x="0" y="600" width="1200" height="200" fill="url(#mistGrad)" opacity="0.3" />
            </g>

            <!-- 2. The Cliff (Right Side) -->
            <!-- Critique #2: Massive, textured, sharp angular polygons, ochre/slate/charcoal -->
            <g id="cliff-group">
                <!-- Base Mass -->
                <path d="M1200,0 L850,0 L880,150 L830,220 L900,300 L850,400 L930,480 L880,600 L980,720 L920,800 L1200,800 Z" fill="#0f172a" />
                
                <!-- Strata Layer 1 (Ochre/Orange tones) -->
                <polygon points="850,0 880,150 1200,150 1200,0" fill="#475569" opacity="0.8" />
                <polygon points="830,220 900,300 1200,300 1200,220" fill="#334155" />
                
                <!-- Strata Layer 2 (Charcoal/Deep Slate) -->
                <polygon points="850,400 930,480 1200,480 1200,400" fill="#1e293b" />
                <polygon points="880,600 980,720 1200,720 1200,600" fill="#020617" />

                <!-- Faceted Detail & Texture -->
                <g stroke="#000" stroke-width="1" opacity="0.3">
                    <line x1="880" y1="150" x2="1200" y2="150" />
                    <line x1="900" y1="300" x2="1200" y2="300" />
                    <line x1="930" y1="480" x2="1200" y2="480" />
                    <line x1="980" y1="720" x2="1200" y2="720" />
                </g>
                
                <!-- Foreground jagged edge highlight -->
                <path d="M850,0 L880,150 L830,220 L900,300 L850,400 L930,480 L880,600 L980,720 L920,800" fill="none" stroke="#64748b" stroke-width="2" />
            </g>

            <!-- 3. Parachutist Group -->
            <g id="parachutist" transform="translate(450, 350)">
                
                <!-- Critique #7: Directional Wind Streaks (Curved) -->
                <g id="wind-lines" fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.3">
                    <path d="M-400,-100 Q-200,-120 0,-50" stroke-width="2" />
                    <path d="M-350,0 Q-150,-20 50,20" stroke-width="3" />
                    <path d="M-450,100 Q-250,80 20,150" stroke-width="1.5" />
                    <path d="M-300,200 Q-100,180 100,220" stroke-width="2" />
                    <path d="M-200,-200 Q-50,-220 100,-150" stroke-width="1" />
                </g>

                <!-- Critique #4: Parachute (Hero) - Faceted, Low-Poly, Crimson/Orange -->
                <g id="canopy-group">
                    <!-- Left Facet -->
                    <path d="M-160,-100 C-160,-240 0,-240 0,-130 L0,-120 Z" fill="#ea580c" />
                    <!-- Right Facet (Darker) -->
                    <path d="M0,-130 C0,-240 160,-240 160,-100 L160,-110 L0,-120 Z" fill="#c2410c" />
                    <!-- Center Facet (Highlight) -->
                    <path d="M-60,-115 C-60,-200 60,-200 60,-115 L0,-120 Z" fill="#fb923c" />
                    
                    <!-- Shadow underneath -->
                    <path d="M-160,-100 C-160,-240 160,-240 160,-100 C120,-80 60,-60 0,-70 C-60,-60 -120,-80 -160,-100 Z" fill="#431407" opacity="0.6" />
                </g>

                <!-- Critique #6: Suspension Lines - Tapered, Tension -->
                <g id="lines" stroke="#e2e8f0" stroke-width="1.5" fill="none" opacity="0.8">
                    <!-- Left side lines -->
                    <line x1="-140" y1="-105" x2="-10" y2="100" />
                    <line x1="-80" y1="-135" x2="-10" y2="100" />
                    <line x1="-20" y1="-140" x2="-10" y2="100" />
                    <!-- Right side lines -->
                    <line x1="20" y1="-140" x2="10" y2="100" />
                    <line x1="80" y1="-135" x2="10" y2="100" />
                    <line x1="140" y1="-105" x2="10" y2="100" />
                </g>

                <!-- Critique #5: The Figure - Solid Silhouette, Active Pose -->
                <g id="human" transform="rotate(10, 0, 100)">
                    <!-- Backpack/Harness -->
                    <rect x="-12" y="95" width="24" height="35" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
                    
                    <!-- Torso (Leaning into wind) -->
                    <path d="M-8,130 L-6,190 L6,190 L8,130 Z" fill="#020617" />
                    
                    <!-- Legs (Dynamic, separated) -->
                    <path d="M-6,190 L-15,240 L-10,260" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M6,190 L12,230 L8,255" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Arms (Reaching back/holding toggles) -->
                    <path d="M-5,135 L-20,160 L-15,170" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" />
                    <path d="M5,135 L15,165 L10,175" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" />
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="120" r="9" fill="#020617" />

                    <!-- Rim Light (Separation) -->
                    <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5" filter="url(#glow)">
                        <path d="M-8,130 L-6,190" />
                        <path d="M-15,240 L-10,260" />
                        <path d="M-20,160 L-15,170" />
                        <path d="M-9,120 A 9 9 0 0 1 0,111" />
                    </g>
                </g>
            </g>
            
            <!-- Foreground Particles (Speed) -->
            <g id="particles" fill="#ffffff">
                <circle cx="850" cy="400" r="2" opacity="0.6" />
                <circle cx="880" cy="450" r="1.5" opacity="0.4" />
                <circle cx="820" cy="500" r="2.5" opacity="0.5" />
            </g>

        </svg>
    </div>

    <!-- HUD OVERLAY -->
    <div class="ui-overlay">
        
        <!-- Top Left: Title -->
        <div class="hud-header">
            <h1>Controlled Descent</h1>
            <div class="sub">Sector 7 // Approach Vector</div>
        </div>

        <!-- Bottom Left: Data Panel -->
        <div class="hud-data">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value"><span id="alt-val">4,200</span><span class="data-unit">FT</span></span>
            </div>
            <div class="data-row">
                <span class="data-label">Vertical</span>
                <span class="data-value"><span id="vert-val">-850</span><span class="data-unit">FPM</span></span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind</span>
                <span class="data-value"><span id="wind-val">24</span><span class="data-unit">MPH NW</span></span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy</span>
                <span class="data-value">NOMINAL</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const human = document.getElementById('human');
            const windLines = document.getElementById('wind-lines');
            const altVal = document.getElementById('alt-val');
            const vertVal = document.getElementById('vert-val');
            const windVal = document.getElementById('wind-val');
            const particles = document.getElementById('particles');
            
            let time = 0;
            let altitude = 4200;
            let verticalSpeed = -850;
            let windSpeed = 24;
            
            // Mouse interaction for parallax
            const scene = document.querySelector('.scene-container');
            let mouseX = 0;
            let mouseY = 0;
            let targetMouseX = 0;
            let targetMouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                targetMouseX = (e.clientX - rect.left) / rect.width - 0.5;
                targetMouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            function animate() {
                time += 0.008; // Slower, more majestic time
                
                // Smooth Parallax
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                // 1. Sway Motion (Sine waves)
                // Slower sway for heavy canopy
                const swayX = Math.sin(time) * 15;
                const swayY = Math.cos(time * 0.8) * 8;
                
                // 2. Pendulum Physics
                const swing = Math.sin(time) * 8; // Less swing, more stable

                // 3. Wind Lines Animation
                const windOffset = (time * 40) % 300;
                windLines.setAttribute('transform', `translate(${-windOffset}, 0)`);

                // 4. Particle Animation (Drifting right)
                const particleOffset = (time * 60) % 100;
                particles.setAttribute('transform', `translate(${particleOffset}, 0)`);

                // Apply Transforms
                // Base position adjusted for composition
                const baseX = 450 + (mouseX * 30) + swayX;
                const baseY = 350 + (mouseY * 20) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);
                
                // Human swings relative to connection point
                human.setAttribute('transform', `rotate(${swing}, 0, 100)`);

                // Data Simulation
                altitude += verticalSpeed * 0.002; 
                if (altitude < 1200) altitude = 4500;
                if (altitude > 4000) altitude = 4200;
                
                // Fluctuate wind slightly
                windSpeed = 24 + Math.sin(time * 2) * 2;
                verticalSpeed = -850 + Math.cos(time * 1.5) * 50;

                altVal.innerText = Math.floor(altitude).toLocaleString();
                vertVal.innerText = Math.floor(verticalSpeed).toLocaleString();
                windVal.innerText = Math.floor(windSpeed);

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
