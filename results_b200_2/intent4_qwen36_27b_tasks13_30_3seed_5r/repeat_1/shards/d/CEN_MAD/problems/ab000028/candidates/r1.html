<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | Editorial Visual</title>
<style>
    :root {
        --c-text-main: #ffffff;
        --c-text-muted: rgba(255, 255, 255, 0.7);
        --c-accent: #06b6d4; /* Cyan rim light */
        --c-ui-bg: rgba(15, 23, 42, 0.65); /* Glassy dark blue */
        --font-display: "Arial Black", "Impact", "Helvetica Neue", sans-serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #0f172a;
        color: var(--c-text-main);
        font-family: var(--font-body);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: block; /* Full bleed layout */
    }

    /* --- SCENE CONTAINER (Background) --- */
    .scene-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Deep atmospheric gradient */
        background: linear-gradient(to bottom, #0f172a 0%, #334155 40%, #94a3b8 85%, #cbd5e1 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- UI OVERLAY (Foreground) --- */
    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none; /* Let clicks pass through to scene if needed */
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 4rem;
    }

    .content-card {
        pointer-events: auto;
        max-width: 500px;
        background: var(--c-ui-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2.5rem;
        border-radius: 4px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        transform: translateZ(0); /* Hardware accel */
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--c-accent);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: var(--c-accent);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--c-accent);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 4rem;
        line-height: 0.9;
        font-weight: 900;
        margin-bottom: 1.5rem;
        color: #fff;
        letter-spacing: -0.03em;
        font-style: italic; /* Kinetic feel */
        text-transform: uppercase;
    }

    h1 span {
        color: var(--c-text-muted);
        display: block;
        font-size: 2.5rem;
        font-weight: 700;
        font-style: normal;
        margin-top: 0.5rem;
        letter-spacing: 0.05em;
    }

    p.lead {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--c-text-muted);
        margin-bottom: 2.5rem;
        font-weight: 400;
    }

    /* --- DATA DASHBOARD --- */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        border-top: 1px solid rgba(255,255,255,0.15);
        padding-top: 1.5rem;
    }

    .data-point {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.5);
    }

    .data-value {
        font-family: var(--font-mono);
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
    }

    .data-unit {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: rgba(255,255,255,0.5);
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
        .ui-overlay {
            padding: 1.5rem;
            justify-content: flex-end;
        }
        .content-card {
            padding: 1.5rem;
        }
        h1 { font-size: 3rem; }
        h1 span { font-size: 1.5rem; }
        .dashboard { grid-template-columns: 1fr 1fr; }
        .data-point:last-child { grid-column: span 2; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE (Full Bleed) -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
            <defs>
                <!-- Gradients -->
                <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#475569" />
                    <stop offset="40%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#020617" />
                </linearGradient>

                <radialGradient id="skyGlow" cx="0.3" cy="0.4" r="0.8">
                    <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="transparent" />
                </radialGradient>

                <!-- Filters -->
                <filter id="blurMotion">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3 0" />
                </filter>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- 1. Sky & Atmosphere -->
            <rect width="100%" height="100%" fill="url(#skyGlow)" />

            <!-- 2. Distant Mountains (Atmospheric Depth) -->
            <g opacity="0.6">
                <path d="M0,600 L200,450 L400,550 L600,400 L1200,650 L1200,800 L0,800 Z" fill="#64748b" />
                <path d="M0,650 L150,580 L350,680 L550,520 L1200,750 L1200,800 L0,800 Z" fill="#475569" />
            </g>

            <!-- 3. The Main Cliff (Foreground Right) -->
            <!-- Drawn on the right to leave space for text on left -->
            <g id="cliff">
                <!-- Main Silhouette -->
                <path d="M1200,0 L750,0 L780,150 L720,200 L800,250 L750,350 L850,400 L780,500 L900,600 L800,800 L1200,800 Z" fill="url(#cliffGrad)" />
                
                <!-- Rock Strata / Texture (Horizontal lines) -->
                <g stroke="#0f172a" stroke-width="2" opacity="0.5">
                    <path d="M750,100 L820,100 L800,150" />
                    <path d="M720,200 L810,200 L790,250" />
                    <path d="M750,350 L860,350 L840,400" />
                    <path d="M780,500 L910,500 L880,600" />
                </g>

                <!-- Facets for 3D feel -->
                <polygon points="750,0 780,150 720,200" fill="#334155" opacity="0.3" />
                <polygon points="750,350 850,400 780,500" fill="#0f172a" opacity="0.4" />
            </g>

            <!-- 4. Parachutist Group -->
            <g id="parachutist" transform="translate(400, 350)">
                
                <!-- Wind / Speed Streaks (Behind Canopy) -->
                <g id="wind-lines" stroke="#ffffff" stroke-width="1" opacity="0.2" filter="url(#blurMotion)">
                    <line x1="-200" y1="-200" x2="-50" y2="-200" />
                    <line x1="-300" y1="-100" x2="-150" y2="-100" />
                    <line x1="-250" y1="50" x2="-100" y2="50" />
                    <line x1="-350" y1="200" x2="-150" y2="200" />
                </g>

                <!-- Taut Harness Lines (Thickened) -->
                <!-- Using a single path for cleaner rendering, connecting canopy rim to harness -->
                <path id="lines" d="M-140,-120 L0,80 L140,-120 M-100,-150 L0,80 L100,-150 M-50,-170 L0,80 L50,-170 M-20,-175 L0,80 L20,-175" 
                      stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.8" />

                <!-- The Canopy (Volumetric Dome) -->
                <!-- Using a complex curve to simulate 3D segments -->
                <path id="canopy" d="M-160,-100 C-160,-220 160,-220 160,-100 C100,-120 60,-100 0,-110 C-60,-100 -100,-120 -160,-100 Z" fill="#f59e0b" />
                
                <!-- Canopy Details (Shading/Folds) -->
                <path d="M-160,-100 C-160,-220 0,-220 0,-110 C-40,-100 -80,-110 -160,-100 Z" fill="#d97706" opacity="0.6" /> <!-- Left Shadow -->
                <path d="M0,-110 C0,-220 160,-220 160,-100 C80,-110 40,-100 0,-110 Z" fill="#fbbf24" opacity="0.3" /> <!-- Right Highlight -->

                <!-- The Human Figure (Silhouette with Rim Light) -->
                <g id="human">
                    <!-- Backpack -->
                    <rect x="-12" y="60" width="24" height="35" rx="4" fill="#1e293b" />
                    
                    <!-- Main Body Silhouette -->
                    <path d="M-8,95 L-5,150 L5,150 L8,95 Z" fill="#0f172a" />
                    
                    <!-- Limbs (Dynamic Pose - Dangling) -->
                    <!-- Left Leg -->
                    <path d="M-5,150 L-15,190 L-10,205" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Right Leg -->
                    <path d="M5,150 L15,185 L10,205" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Arms (Holding risers) -->
                    <path d="M-5,100 L-20,120 L-10,130" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
                    <path d="M5,100 L20,120 L10,130" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="85" r="9" fill="#0f172a" />

                    <!-- Rim Light (Cyan glow to separate from dark background) -->
                    <g stroke="#06b6d4" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.8">
                        <path d="M-8,95 L-5,150" /> <!-- Left Body Edge -->
                        <path d="M-15,190 L-10,205" /> <!-- Left Foot Edge -->
                        <path d="M-20,120 L-10,130" /> <!-- Left Hand Edge -->
                        <path d="M0,76 A 9 9 0 0 1 0,94" /> <!-- Helmet Highlight -->
                    </g>
                </g>
            </g>
            
            <!-- Dust/Particles near cliff (Foreground detail) -->
            <g fill="#ffffff" opacity="0.3">
                <circle cx="750" cy="350" r="1.5" />
                <circle cx="780" cy="380" r="2" />
                <circle cx="730" cy="400" r="1" />
                <circle cx="800" cy="450" r="1.5" />
            </g>

        </svg>
    </div>

    <!-- CONTENT / INTERACTION OVERLAY -->
    <div class="ui-overlay">
        <div class="content-card">
            <div class="tag">Operation: Vertical Limit</div>
            
            <h1>Controlled<br><span>Descent</span></h1>
            
            <p class="lead">
                Navigating the vertical gap between geological permanence and human fragility. 
                The interface between aerodynamic lift and the sheer drop.
            </p>

            <div class="dashboard">
                <div class="data-point">
                    <span class="data-label">Altitude</span>
                    <span class="data-value" id="alt-val">4,200</span>
                    <span class="data-unit">ft MSL</span>
                </div>
                <div class="data-point">
                    <span class="data-label">Wind Speed</span>
                    <span class="data-value">24</span>
                    <span class="data-unit">mph NW</span>
                </div>
                <div class="data-point">
                    <span class="data-label">Canopy Load</span>
                    <span class="data-value">1.4</span>
                    <span class="data-unit">G-Force</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const human = document.getElementById('human');
            const altVal = document.getElementById('alt-val');
            
            let time = 0;
            let altitude = 4200;
            
            // Mouse interaction for parallax effect
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            // Smooth mouse tracking
            let targetMouseX = 0;
            let targetMouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                // Normalize -1 to 1
                targetMouseX = (e.clientX - rect.left) / rect.width - 0.5;
                targetMouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            function animate() {
                time += 0.005; // Slower, smoother time
                
                // 1. Smooth Parallax Interpolation
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                // 2. Floating Motion (Sine waves)
                // The parachute sways gently in the wind
                const swayX = Math.sin(time) * 15;
                const swayY = Math.cos(time * 0.5) * 8;
                
                // 3. Pendulum Physics (Human swings opposite to canopy)
                // Calculate swing angle based on sway velocity
                const swing = Math.sin(time) * 8; 
                
                // 4. Breathing/Canopy Flex
                const flex = Math.sin(time * 3) * 2;

                // Apply transforms
                // Move the whole group based on mouse (parallax) + sway
                // Center of screen is approx 600, 400 in viewBox
                const baseX = 400 + (mouseX * 30) + swayX;
                const baseY = 350 + (mouseY * 20) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the canopy center
                // We rotate around the connection point (0, 80 in local space - where lines meet harness)
                // Note: We apply rotation to the human group
                human.setAttribute('transform', `rotate(${swing}, 0, 80)`);

                // Simulate Altitude Drop (Visual only)
                // Slowly decrement to show descent
                altitude -= 0.5; 
                if (altitude < 1000) altitude = 4500; // Reset loop
                
                // Update DOM occasionally to save performance
                if (Math.floor(time * 10) % 2 === 0) {
                    altVal.innerText = Math.floor(altitude).toLocaleString();
                }

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
