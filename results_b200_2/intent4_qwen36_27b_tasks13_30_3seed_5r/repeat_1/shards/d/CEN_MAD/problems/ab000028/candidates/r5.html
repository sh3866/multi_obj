<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | Visual Design Revision</title>
<style>
    :root {
        --c-bg-deep: #050914;
        --c-bg-atmos: #1e293b;
        --c-accent: #ff4d00; /* High-vis International Orange */
        --c-accent-dim: #9a3412;
        --c-cliff-dark: #020617;
        --c-cliff-light: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-bg-deep);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* --- SCENE CONTAINER --- */
    .scene-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Deep atmospheric depth gradient */
        background: linear-gradient(to bottom, #020617 0%, #0f172a 50%, #334155 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- ANIMATIONS --- */
    @keyframes drift {
        0% { transform: translateX(0); }
        100% { transform: translateX(100px); }
    }
    
    @keyframes sway {
        0% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
        100% { transform: rotate(-2deg); }
    }

</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1400 900">
            <defs>
                <!-- Filters -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                
                <filter id="blur-far">
                    <feGaussianBlur stdDeviation="6" />
                </filter>

                <!-- Gradients -->
                <!-- Sky: Deep Blue to Hazy Horizon -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="60%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#475569" />
                </linearGradient>

                <!-- Cliff Face: Shadow to Highlight -->
                <linearGradient id="cliffGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="0.3%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>

                <!-- Parachute Canopy: Volumetric -->
                <linearGradient id="canopyGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ff6b35" /> <!-- Highlight -->
                    <stop offset="40%" stop-color="#ff4d00" /> <!-- Main Orange -->
                    <stop offset="90%" stop-color="#c2410c" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#7c2d12" /> <!-- Deep Shadow -->
                </linearGradient>

                <!-- Rim Light -->
                <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Rock Texture Pattern -->
                <pattern id="rockStrata" width="100" height="100" patternUnits="userSpaceOnUse">
                    <path d="M0,0 Q50,10 100,0" fill="none" stroke="#000000" stroke-width="2" opacity="0.3"/>
                    <path d="M0,30 Q50,40 100,30" fill="none" stroke="#000000" stroke-width="1" opacity="0.2"/>
                    <path d="M0,70 Q50,60 100,70" fill="none" stroke="#000000" stroke-width="3" opacity="0.4"/>
                </pattern>
            </defs>

            <!-- 1. BACKGROUND & DEPTH -->
            <g id="world-background">
                <!-- Sky -->
                <rect width="1400" height="900" fill="url(#skyGrad)" />
                
                <!-- Distant Mountains (Atmospheric Perspective) -->
                <g opacity="0.4" filter="url(#blur-far)">
                    <path d="M-100,600 L100,550 L300,620 L500,580 L700,650 L900,590 L1100,640 L1300,580 L1500,650 L1500,900 L-100,900 Z" fill="#334155" />
                    <path d="M-100,700 L200,650 L400,720 L700,680 L1000,750 L1400,700 L1500,750 L1500,900 L-100,900 Z" fill="#0f172a" />
                </g>
            </g>

            <!-- 2. THE CLIFF (Right Side) -->
            <!-- Jagged, textured, imposing mass -->
            <g id="cliff-face">
                <!-- Base Shape -->
                <path d="M1400,0 L1100,0 L1120,80 L1080,150 L1150,250 L1050,350 L1120,480 L1020,600 L1100,750 L1050,900 L1400,900 Z" fill="url(#cliffGrad)" />
                <!-- Texture Overlay -->
                <path d="M1400,0 L1100,0 L1120,80 L1080,150 L1150,250 L1050,350 L1120,480 L1020,600 L1100,750 L1050,900 L1400,900 Z" fill="url(#rockStrata)" opacity="0.6" />
                
                <!-- Geometric Strata Lines (Depth) -->
                <g stroke="#020617" stroke-width="4" fill="none" opacity="0.8">
                    <path d="M1120,80 L1400,80" />
                    <path d="M1080,150 L1400,150" />
                    <path d="M1150,250 L1400,250" />
                    <path d="M1050,350 L1400,350" />
                    <path d="M1120,480 L1400,480" />
                    <path d="M1020,600 L1400,600" />
                    <path d="M1100,750 L1400,750" />
                </g>

                <!-- Edge Highlight (Rim light on rock) -->
                <path d="M1100,0 L1120,80 L1080,150 L1150,250 L1050,350 L1120,480 L1020,600 L1100,750 L1050,900" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5" />
            </g>

            <!-- 3. PARACHUTIST SUBJECT (Left/Center) -->
            <g id="parachutist-system" transform="translate(600, 400)">
                
                <!-- Motion Blur / Wind Streaks (Aggressive) -->
                <g id="wind-streaks" opacity="0.6">
                    <path d="M-300,-100 C-200,-120 0,-80 300,0" stroke="#ffffff" stroke-width="1" fill="none" stroke-dasharray="20 40" opacity="0.3" />
                    <path d="M-400,50 C-200,30 100,60 400,100" stroke="#ffffff" stroke-width="2" fill="none" stroke-dasharray="10 60" opacity="0.5" />
                    <path d="M-250,200 C-100,180 100,220 350,250" stroke="#ffffff" stroke-width="3" fill="none" stroke-dasharray="40 80" opacity="0.4" />
                    <path d="M-100,-250 C0,-260 200,-240 400,-200" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.2" />
                </g>

                <!-- Suspension Lines (Taut, converging) -->
                <g id="lines" stroke="#cbd5e1" stroke-width="1.2" opacity="0.7">
                    <!-- Left side lines -->
                    <line x1="-160" y1="-140" x2="-20" y2="220" />
                    <line x1="-90" y1="-190" x2="-20" y2="220" />
                    <line x1="-30" y1="-200" x2="-20" y2="220" />
                    <!-- Right side lines -->
                    <line x1="30" y1="-200" x2="20" y2="220" />
                    <line x1="90" y1="-190" x2="20" y2="220" />
                    <line x1="160" y1="-140" x2="20" y2="220" />
                </g>

                <!-- The Figure (Silhouette) -->
                <g id="human-figure" transform="translate(0, 220)">
                    <!-- Backpack/Harness -->
                    <rect x="-15" y="-10" width="30" height="45" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
                    
                    <!-- Torso (Leaning back into harness) -->
                    <path d="M-12,35 L-10,80 L10,80 L12,35 Z" fill="#020617" />
                    
                    <!-- Legs (Spread, wind resistance) -->
                    <path d="M-10,80 L-25,140 L-15,160" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10,80 L20,130 L10,155" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Arms (Active steering) -->
                    <path d="M-10,40 L-30,70 L-25,80" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" />
                    <path d="M10,40 L25,75 L20,85" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" />
                    
                    <!-- Head -->
                    <circle cx="0" cy="25" r="12" fill="#020617" />

                    <!-- Rim Light on Figure (Separation) -->
                    <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" filter="url(#glow)">
                        <path d="M-12,35 L-10,80" /> <!-- Back -->
                        <path d="M-11,25 A 12 12 0 0 1 0,13" /> <!-- Helmet -->
                        <path d="M-30,70 L-25,80" /> <!-- Arm -->
                        <path d="M-25,140 L-15,160" /> <!-- Leg -->
                    </g>
                </g>

                <!-- The Canopy (Volumetric, High Contrast) -->
                <g id="canopy">
                    <!-- Main Shape -->
                    <path d="M-180,-120 C-180,-300 0,-320 0,-160 L0,-150 Z" fill="url(#canopyGrad)" />
                    <path d="M0,-160 C0,-320 180,-300 180,-120 L180,-140 L0,-150 Z" fill="#9a3412" opacity="0.8" /> <!-- Right shadow -->
                    
                    <!-- Panel Geometry (Ribs) -->
                    <g stroke="#7c2d12" stroke-width="2" fill="none" opacity="0.6">
                        <path d="M-140,-130 C-140,-250 -50,-280 0,-155" />
                        <path d="M-90,-150 C-90,-260 -20,-290 0,-155" />
                        <path d="M40,-150 C40,-260 90,-280 140,-130" />
                        <path d="M90,-145 C90,-250 130,-260 170,-125" />
                    </g>

                    <!-- Canopy Rim Light (Top Edge) -->
                    <path d="M-180,-120 C-180,-300 0,-320 0,-160" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" filter="url(#glow)" />
                    <path d="M0,-160 C0,-320 180,-300 180,-120" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" filter="url(#glow)" />
                </g>
            </g>
            
        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist-system');
            const windStreaks = document.getElementById('wind-streaks');
            
            let time = 0;
            const scene = document.querySelector('.scene-container');
            let mouseX = 0;
            let mouseY = 0;
            let targetMouseX = 0;
            let targetMouseY = 0;

            // Mouse interaction for parallax depth
            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                // Normalize mouse position from -0.5 to 0.5
                targetMouseX = (e.clientX - rect.left) / rect.width - 0.5;
                targetMouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            function animate() {
                time += 0.01; 
                
                // Smooth Parallax Interpolation
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                // 1. Sway Motion (Heavy, slow pendulum)
                const swayX = Math.sin(time * 0.5) * 15;
                const swayY = Math.cos(time * 0.3) * 10;
                
                // 2. Wind Animation (Aggressive flow)
                // Move streaks right rapidly to simulate falling left/down relative to wind
                const windOffset = (time * 150) % 500;
                windStreaks.setAttribute('transform', `translate(${-windOffset}, 0)`);

                // Apply Transforms
                // Base position 600, 400
                const baseX = 600 + (mouseX * 60) + swayX; // Parallax + Sway
                const baseY = 400 + (mouseY * 40) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
