<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: High-contrast, Glossy, Architectural */
            --bg-color: #F7F9FC;
            --bg-gradient: radial-gradient(circle at 60% 30%, #FFFFFF 0%, #E2E8F0 60%, #CBD5E1 100%);
            --text-main: #1E293B; /* Deep Slate - High Contrast */
            --text-muted: #475569; 
            --text-faint: #64748B;
            
            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            align-items: center;
        }

        /* Left Column: Typography */
        .content-side {
            padding: 0 4rem 0 5rem;
            z-index: 2;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 7rem; /* Large Hero */
            line-height: 0.8;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            opacity: 0.85; /* Critique: Reduced opacity */
            font-weight: 400;
        }

        h1 span {
            display: block;
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 2rem;
            margin-top: 0.5rem;
            letter-spacing: 0;
            opacity: 0.9;
        }

        /* Spec Grid - Tightened Rhythm */
        .specs {
            margin-top: 5rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
            width: 100%;
            border-top: 1px solid rgba(30, 41, 59, 0.1);
            padding-top: 1.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .spec-item h3 {
            font-family: var(--font-body);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            margin-bottom: 0.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .spec-item p {
            font-family: var(--font-body);
            font-size: 1.25rem;
            color: var(--text-main);
            line-height: 1.1;
            font-weight: 600;
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 95%;
            max-width: 900px;
            overflow: visible;
        }

        /* Floor Context & Shadows */
        .floor-line {
            stroke: #CBD5E1;
            stroke-width: 1;
            opacity: 0.6;
        }

        .floor-shadow-anchor {
            fill: rgba(15, 23, 42, 0.25);
            filter: blur(6px);
        }
        
        .floor-shadow-diffuse {
            fill: rgba(15, 23, 42, 0.08);
            filter: blur(15px);
        }

        .wall-shadow {
            fill: rgba(15, 23, 42, 0.05);
            filter: blur(20px);
        }

        /* Flush Handle Interaction */
        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 265px 215px;
        }
        
        .flush-handle-group:hover {
            transform: rotate(5deg);
        }

        .flushing .flush-handle-group {
            transform: rotate(35deg);
            transition: transform 0.1s ease-in;
        }

        /* Water Vortex Animation */
        .water-vortex {
            transform-origin: 375px 365px;
            opacity: 0;
            transform: scale(0.5) rotate(0deg);
        }

        .flushing .water-vortex {
            animation: vortexAnim 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes vortexAnim {
            0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            60% { transform: scale(1.1) rotate(180deg); opacity: 0.6; }
            100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
        }

        /* Motion Lines Animation */
        .motion-lines {
            opacity: 0;
            transform-origin: 375px 365px;
        }

        .flushing .motion-lines {
            animation: motionAnim 1s ease-out forwards;
        }

        @keyframes motionAnim {
            0% { transform: scale(0.8); opacity: 0; }
            20% { opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 4rem; }
            .visual-side { height: 60vh; order: 1; }
            h1 { font-size: 4.5rem; }
            .specs { margin-top: 3rem; }
            header { padding: 1.5rem 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
            </div>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Filters -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                        <feOffset dx="0" dy="25" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.15"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>

                    <!-- Gradients: High Fidelity Ceramic -->
                    
                    <!-- Main Body: Gloss White -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#E2E8F0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
                    </linearGradient>

                    <!-- Specular Highlight (Sharp Edge) -->
                    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
                        <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
                        <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
                    </linearGradient>

                    <!-- Tank: Slightly deeper shadow for volume -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="10%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="90%" style="stop-color:#E2E8F0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:1" />
                    </linearGradient>

                    <!-- Metallic Handle: Chrome finish -->
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#94A3B8;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#CBD5E1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradient: Deep, clean blue -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.9" />
                        <stop offset="70%" style="stop-color:#BAE6FD;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:0.6" />
                    </radialGradient>
                </defs>

                <!-- 1. Architectural Context -->
                <!-- Floor Line -->
                <line x1="50" y1="640" x2="750" y2="640" class="floor-line" />
                
                <!-- Wall Shadow (Depth) -->
                <path d="M250,140 L480,140 L500,640 L230,640 Z" class="wall-shadow" />

                <!-- Floor Shadows -->
                <ellipse cx="380" cy="640" rx="140" ry="12" class="floor-shadow-anchor" />
                <ellipse cx="380" cy="645" rx="220" ry="35" class="floor-shadow-diffuse" />

                <!-- 2. Base Flange -->
                <g transform="translate(0, 635)">
                    <path d="M260,0 L500,0 L510,12 L250,12 Z" fill="#CBD5E1" />
                    <path d="M260,0 L500,0 L500,4 L260,4 Z" fill="#94A3B8" opacity="0.3" />
                    <!-- Bolts -->
                    <circle cx="280" cy="6" r="6" fill="#64748B" />
                    <circle cx="280" cy="6" r="2.5" fill="#1E293B" />
                    <circle cx="480" cy="6" r="6" fill="#64748B" />
                    <circle cx="480" cy="6" r="2.5" fill="#1E293B" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g filter="url(#softShadow)">
                    <!-- Bowl Body -->
                    <path d="M220,340 
                             C220,340 200,600 380,600 
                             C560,600 520,340 520,340 Z" 
                          fill="url(#ceramicGrad)" />
                    
                    <!-- Sharp Specular Highlight (Gloss) -->
                    <path d="M240,420 C230,500 270,570 380,570 C490,570 500,500 500,420 C470,450 300,450 240,420 Z" 
                          fill="url(#specularGrad)" opacity="0.5" />
                    
                    <!-- Inner Bowl Depth -->
                    <path d="M220,340 C220,320 520,320 520,340 L520,350 C520,350 500,330 370,330 C240,330 220,350 220,350 Z" 
                          fill="#CBD5E1" />
                </g>

                <!-- 4. Water & Flushing Action -->
                <g>
                    <!-- Water Surface -->
                    <ellipse cx="370" cy="355" rx="130" ry="24" fill="url(#waterGrad)" />
                    
                    <!-- Flushing Visuals (Vortex) -->
                    <g class="water-vortex">
                        <path d="M370,355 m-100,0 a100,20 0 1,0 200,0 a100,20 0 1,0 -200,0" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
                        <path d="M370,355 m-70,0 a70,14 0 1,0 140,0 a70,14 0 1,0 -140,0" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
                    </g>

                    <!-- Motion Lines (Speed) -->
                    <g class="motion-lines">
                        <path d="M300,355 Q370,320 440,355" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
                        <path d="M320,365 Q370,340 420,365" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    </g>
                </g>

                <!-- 5. Seat & Lid -->
                <g filter="url(#softShadow)">
                    <!-- Lid (Open) -->
                    <g transform="rotate(-15, 370, 330)">
                        <ellipse cx="370" cy="330" rx="140" ry="28" fill="url(#ceramicGrad)" />
                        <!-- Lid Thickness/Edge -->
                        <path d="M230,330 A140 28 0 0 0 510,330 L510,335 A140 28 0 0 1 230,335 Z" fill="#CBD5E1" opacity="0.4"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <ellipse cx="370" cy="355" rx="140" ry="28" fill="url(#ceramicGrad)" />
                    <!-- Seat Inner Shadow -->
                    <ellipse cx="370" cy="355" rx="130" ry="24" fill="none" stroke="#CBD5E1" stroke-width="3" opacity="0.8"/>
                    <!-- Seat Highlight -->
                    <path d="M240,355 A130 26 0 0 0 500,355" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
                </g>

                <!-- 6. Tank -->
                <g filter="url(#softShadow)">
                    <!-- Tank Body -->
                    <rect x="280" y="140" width="180" height="190" rx="14" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Vertical Sharp Specular) -->
                    <path d="M295,145 L295,325" stroke="white" stroke-width="14" opacity="0.7" stroke-linecap="round" filter="blur(1px)"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="278" y="138" width="184" height="10" rx="5" fill="#FFFFFF" />
                    
                    <!-- Tank Bottom Shadow Area -->
                    <path d="M280,320 L460,320 L460,330 C460,335 455,340 450,340 L290,340 C285,340 280,335 280,330 Z" fill="#94A3B8" opacity="0.15" />
                </g>

                <!-- 7. Flush Handle (Mechanical Precision) -->
                <g class="flush-handle-group" onclick="triggerFlush()">
                    <!-- Base Mount -->
                    <circle cx="265" cy="215" r="16" fill="#CBD5E1" />
                    <circle cx="265" cy="215" r="12" fill="#94A3B8" />
                    <circle cx="265" cy="215" r="4" fill="#475569" />
                    
                    <!-- Arm (Thicker, Solid) -->
                    <path d="M260,215 L190,240" stroke="url(#metalGrad)" stroke-width="12" stroke-linecap="round" class="handle-metal"/>
                    
                    <!-- Knob -->
                    <circle cx="190" cy="240" r="18" fill="url(#metalGrad)" class="handle-metal" />
                    <!-- Knob Highlight -->
                    <circle cx="185" cy="235" r="6" fill="white" opacity="0.9" filter="blur(0.5px)" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            
            // Prevent rapid clicking spamming animations
            if (svg.classList.contains('flushing')) return;

            // Add class to trigger CSS animations
            svg.classList.add('flushing');
            
            // Remove class after animation cycle (1.5 seconds)
            setTimeout(() => {
                svg.classList.remove('flushing');
            }, 1500);
        }
    </script>
</body>
</html>
