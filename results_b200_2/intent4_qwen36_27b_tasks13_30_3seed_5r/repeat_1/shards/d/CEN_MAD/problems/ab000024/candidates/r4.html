<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: High-contrast, Glossy, Architectural */
            --bg-color: #F4F6F8;
            --bg-gradient: radial-gradient(circle at 70% 40%, #FFFFFF 0%, #EDF2F7 60%, #E2E8F0 100%);
            --text-main: #102A43; /* Deeper Navy for Contrast */
            --text-muted: #486581;
            --text-faint: #778DA9;
            --accent-line: rgba(16, 42, 67, 0.08);

            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            align-items: center;
        }

        /* Left Column: Typography */
        .content-side {
            padding: 0 4rem 0 5rem;
            z-index: 2;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 6.5rem; /* Reduced slightly for better hierarchy */
            line-height: 0.9;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-weight: 400; /* Lighter weight */
        }

        h1 span {
            display: block;
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 2rem;
            margin-top: 0.5rem;
            letter-spacing: 0;
        }

        /* Spec Grid - Geometric Sans */
        .specs {
            margin-top: 4rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
            border-top: 1px solid var(--text-faint); /* Crisper line */
            padding-top: 1.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .spec-item h3 {
            font-family: var(--font-body);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            margin-bottom: 0.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .spec-item p {
            font-family: var(--font-body);
            font-size: 1.25rem;
            color: var(--text-main);
            line-height: 1.1;
            font-weight: 500; /* Clean sans-serif weight */
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            max-width: 850px;
        }

        /* Context Lines */
        .wall-line {
            stroke: var(--text-main);
            stroke-width: 1;
            opacity: 0.06;
        }
        
        .wall-corner-gradient {
            fill: url(#cornerShadow);
        }

        .floor-shadow-anchor {
            fill: rgba(16, 42, 67, 0.2);
            filter: blur(4px);
        }
        
        .floor-shadow-diffuse {
            fill: rgba(16, 42, 67, 0.05);
            filter: blur(20px);
        }

        /* Flush Handle Interaction */
        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 250px 215px;
        }
        
        .flush-handle-group:hover {
            transform: rotate(5deg);
        }

        .flushing .flush-handle-group {
            transform: rotate(35deg);
            transition: transform 0.08s ease-in;
        }

        /* Water Vortex Animation */
        .water-vortex {
            transform-origin: 375px 365px;
            opacity: 0;
            transform: scale(0.5) rotate(0deg);
            pointer-events: none;
        }

        .flushing .water-vortex {
            animation: vortexAnim 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes vortexAnim {
            0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            70% { transform: scale(1.2) rotate(360deg); opacity: 0.5; }
            100% { transform: scale(1.5) rotate(540deg); opacity: 0; }
        }

        /* Motion Lines Animation */
        .motion-lines {
            opacity: 0;
            transform-origin: 375px 365px;
        }

        .flushing .motion-lines {
            animation: motionAnim 0.8s ease-out forwards;
        }

        @keyframes motionAnim {
            0% { transform: scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 4rem; height: auto; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 4.5rem; }
            .specs { margin-top: 3rem; }
            header { padding: 1.5rem 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
            </div>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Filters -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
                        <feOffset dx="0" dy="30" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.2"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>

                    <!-- Gradients: High Fidelity Ceramic -->
                    
                    <!-- Main Body: Gloss White with sharper contrast -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="15%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="75%" style="stop-color:#E2E8F0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:1" />
                    </linearGradient>

                    <!-- Specular Highlight (Sharp Edge) -->
                    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
                        <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
                        <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
                    </linearGradient>

                    <!-- Tank: Slightly deeper shadow for volume -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="15%" style="stop-color:#F1F5F9;stop-opacity:1" />
                        <stop offset="85%" style="stop-color:#CBD5E1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                    </linearGradient>

                    <!-- Metallic Handle: Chrome finish -->
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#94A3B8;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#CBD5E1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradient: Deep, clean blue -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.9" />
                        <stop offset="70%" style="stop-color:#BAE6FD;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:0.6" />
                    </radialGradient>

                    <!-- Architectural Corner Shadow -->
                    <linearGradient id="cornerShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#102A43;stop-opacity:0.03" />
                        <stop offset="100%" style="stop-color:#102A43;stop-opacity:0" />
                    </linearGradient>
                </defs>

                <!-- 1. Architectural Context -->
                <!-- Faint Wall Corner -->
                <line x1="380" y1="0" x2="380" y2="650" class="wall-line" />
                <rect x="380" y="0" width="400" height="650" class="wall-corner-gradient" />

                <!-- Floor Line -->
                <line x1="50" y1="650" x2="750" y2="650" stroke="#CBD5E1" stroke-width="1" opacity="0.5" />

                <!-- Floor Shadows -->
                <ellipse cx="370" cy="650" rx="130" ry="8" class="floor-shadow-anchor" />
                <ellipse cx="370" cy="650" rx="200" ry="25" class="floor-shadow-diffuse" />

                <!-- 2. Base Flange (Plumbing Base) -->
                <g transform="translate(0, 645)">
                    <!-- Flange Body -->
                    <path d="M250,0 L490,0 L500,10 L240,10 Z" fill="#94A3B8" />
                    <!-- Flange Shadow/Detail -->
                    <path d="M250,0 L490,0 L490,3 L250,3 Z" fill="#64748B" opacity="0.5" />
                    <!-- Bolts -->
                    <circle cx="265" cy="5" r="5" fill="#1E293B" />
                    <circle cx="265" cy="5" r="2" fill="#64748B" />
                    <circle cx="475" cy="5" r="5" fill="#1E293B" />
                    <circle cx="475" cy="5" r="2" fill="#64748B" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g filter="url(#softShadow)">
                    <!-- Bowl Body -->
                    <path d="M210,340 
                             C210,340 190,610 370,610 
                             C550,610 530,340 530,340 Z" 
                          fill="url(#ceramicGrad)" />
                    
                    <!-- Sharp Specular Highlight (Gloss) -->
                    <path d="M235,400 C220,500 260,580 370,580 C480,580 505,500 505,400 C470,430 300,430 235,400 Z" 
                          fill="url(#specularGrad)" opacity="0.7" />
                    
                    <!-- Inner Bowl Depth / Rim Shadow -->
                    <path d="M210,340 C210,320 530,320 530,340 L530,350 C530,350 505,330 370,330 C235,330 210,350 210,350 Z" 
                          fill="#64748B" opacity="0.3" />
                </g>

                <!-- 4. Water & Flushing Action -->
                <g>
                    <!-- Water Surface -->
                    <ellipse cx="370" cy="355" rx="130" ry="24" fill="url(#waterGrad)" />
                    
                    <!-- Flushing Visuals (Vortex) -->
                    <g class="water-vortex">
                        <path d="M370,355 m-100,0 a100,20 0 1,0 200,0 a100,20 0 1,0 -200,0" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>
                        <path d="M370,355 m-70,0 a70,14 0 1,0 140,0 a70,14 0 1,0 -140,0" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
                        <path d="M370,355 m-40,0 a40,8 0 1,0 80,0 a40,8 0 1,0 -80,0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
                    </g>

                    <!-- Motion Lines (Speed) -->
                    <g class="motion-lines">
                        <path d="M300,355 Q370,320 440,355" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                        <path d="M320,365 Q370,340 420,365" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    </g>
                </g>

                <!-- 5. Seat & Lid -->
                <g filter="url(#softShadow)">
                    <!-- Lid (Open) -->
                    <g transform="rotate(-15, 370, 330)">
                        <ellipse cx="370" cy="330" rx="140" ry="28" fill="url(#ceramicGrad)" />
                        <!-- Lid Thickness/Edge -->
                        <path d="M230,330 A140 28 0 0 0 510,330 L510,335 A140 28 0 0 1 230,335 Z" fill="#94A3B8" opacity="0.3"/>
                        <!-- Lid Specular -->
                        <path d="M240,330 A130 25 0 0 0 500,330" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <ellipse cx="370" cy="355" rx="140" ry="28" fill="url(#ceramicGrad)" />
                    <!-- Seat Inner Shadow -->
                    <ellipse cx="370" cy="355" rx="130" ry="24" fill="none" stroke="#64748B" stroke-width="2" opacity="0.2"/>
                    <!-- Seat Highlight -->
                    <path d="M240,355 A130 26 0 0 0 500,355" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
                </g>

                <!-- 6. Tank -->
                <g filter="url(#softShadow)">
                    <!-- Tank Body -->
                    <rect x="280" y="140" width="180" height="190" rx="14" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Vertical Sharp Specular) -->
                    <path d="M295,145 L295,325" stroke="white" stroke-width="16" opacity="0.8" stroke-linecap="round" filter="blur(1px)"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="278" y="138" width="184" height="10" rx="5" fill="#FFFFFF" />
                    
                    <!-- Tank Bottom Shadow Area -->
                    <path d="M280,320 L460,320 L460,330 C460,335 455,340 450,340 L290,340 C285,340 280,335 280,330 Z" fill="#1E293B" opacity="0.1" />
                </g>

                <!-- 7. Flush Handle (Mechanical Precision) -->
                <g class="flush-handle-group" onclick="triggerFlush()">
                    <!-- Base Mount -->
                    <circle cx="250" cy="215" r="16" fill="#CBD5E1" />
                    <circle cx="250" cy="215" r="12" fill="#94A3B8" />
                    <circle cx="250" cy="215" r="4" fill="#1E293B" />
                    
                    <!-- Arm (Thicker, Solid) -->
                    <path d="M245,215 L170,240" stroke="url(#metalGrad)" stroke-width="12" stroke-linecap="round" class="handle-metal"/>
                    
                    <!-- Knob -->
                    <circle cx="170" cy="240" r="18" fill="url(#metalGrad)" class="handle-metal" />
                    <!-- Knob Highlight -->
                    <circle cx="165" cy="235" r="6" fill="white" opacity="0.9" filter="blur(0.5px)" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            
            // Prevent rapid clicking spamming animations
            if (svg.classList.contains('flushing')) return;

            // Add class to trigger CSS animations
            svg.classList.add('flushing');
            
            // Remove class after animation cycle (1.5 seconds)
            setTimeout(() => {
                svg.classList.remove('flushing');
            }, 1500);
        }
    </script>
</body>
</html>
