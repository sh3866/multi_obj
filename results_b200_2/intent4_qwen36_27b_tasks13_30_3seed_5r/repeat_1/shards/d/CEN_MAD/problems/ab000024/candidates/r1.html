<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: Quiet Luxury */
            --bg-color: #F5F5F0;
            --text-main: #1A1A1A;
            --text-muted: #555555;
            --text-faint: #888888;
            --accent: #1A1A1A;
            
            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', Times, serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #FFFFFF 0%, #F5F5F0 70%);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            align-items: center;
        }

        /* Left Column: Typography */
        .content-side {
            padding: 0 4rem 0 6rem;
            z-index: 2;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 6.5rem;
            line-height: 0.85;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-weight: 400;
        }

        h1 span {
            display: block;
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 2.5rem;
            margin-top: 0.5rem;
            letter-spacing: 0;
        }

        /* Spec Grid */
        .specs {
            margin-top: 4rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 1.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item h3 {
            font-family: var(--font-body);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            margin-bottom: 0.6rem;
            font-weight: 600;
        }

        .spec-item p {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--text-main);
            line-height: 1.2;
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 90%;
            max-width: 800px;
            overflow: visible;
        }

        /* Floor Shadow */
        .floor-shadow {
            fill: rgba(0,0,0,0.06);
            filter: blur(8px);
        }

        /* Flush Handle Interaction */
        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.1s ease-out;
            transform-origin: 220px 200px;
        }
        
        .flush-handle-group:hover .handle-metal {
            filter: brightness(1.1);
        }

        .flushing .flush-handle-group {
            transform: rotate(25deg);
            transition: transform 0.1s ease-in;
        }

        /* Water Ripple Animation */
        .water-ripple {
            transform-origin: 300px 310px;
            opacity: 0;
            transform: scale(0.8);
        }

        .flushing .water-ripple {
            animation: rippleAnim 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }

        @keyframes rippleAnim {
            0% { transform: scale(0.9); opacity: 0.4; stroke-width: 2px; }
            50% { transform: scale(1.15); opacity: 0.1; stroke-width: 1px; }
            100% { transform: scale(1.3); opacity: 0; stroke-width: 0.5px; }
        }

        /* Swirl Mist */
        .mist-swirl {
            opacity: 0;
            transform-origin: center;
        }
        
        .flushing .mist-swirl {
            animation: mistAnim 3s linear infinite;
        }

        @keyframes mistAnim {
            0% { transform: rotate(0deg) scale(0.9); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: rotate(360deg) scale(1.1); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 4rem; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 4rem; }
            h1 span { font-size: 1.8rem; }
            .specs { margin-top: 2rem; }
            header { padding: 1.5rem 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Filters -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
                        <feOffset dx="0" dy="15" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.15"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>

                    <!-- Gradients -->
                    <!-- Main Ceramic Body: Soft, diffuse white to light grey -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#FAFAFA;stop-opacity:1" />
                        <stop offset="85%" style="stop-color:#E8E8E8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#DCDCDC;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Tank: Slightly darker to show depth -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#F2F2F2;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    </linearGradient>

                    <!-- Metallic Handle: High gloss contrast -->
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#D0D0D0;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#A0A0A0;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradient -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.9" />
                        <stop offset="80%" style="stop-color:#B2EBF2;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#80DEEA;stop-opacity:0.3" />
                    </radialGradient>
                </defs>

                <!-- 1. Floor Shadow -->
                <ellipse cx="380" cy="620" rx="160" ry="18" class="floor-shadow" />

                <!-- 2. Base Flange (Realistic Fixture) -->
                <g transform="translate(0, 605)">
                    <!-- Flange Base -->
                    <path d="M280,0 L480,0 L490,15 L270,15 Z" fill="#EAE8E3" />
                    <!-- Flange Shadow/Depth -->
                    <path d="M280,0 L480,0 L480,5 L280,5 Z" fill="#D0D0D0" opacity="0.5" />
                    <!-- Bolts -->
                    <circle cx="300" cy="8" r="4" fill="#B0B0B0" />
                    <circle cx="460" cy="8" r="4" fill="#B0B0B0" />
                    <!-- Wall Connection -->
                    <rect x="360" y="-20" width="40" height="20" fill="#E0E0E0" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g filter="url(#softShadow)">
                    <!-- Bowl Body -->
                    <path d="M240,350 
                             C240,350 220,580 380,580 
                             C540,580 500,350 500,350 Z" 
                          fill="url(#ceramicGrad)" />
                    
                    <!-- Bowl Front Highlight (Gloss) -->
                    <path d="M260,400 C250,480 280,540 380,540 C480,540 490,480 480,400 C450,430 290,430 260,400 Z" 
                          fill="white" opacity="0.3" />
                    
                    <!-- Inner Bowl Depth (Back) -->
                    <path d="M240,350 C240,330 500,330 500,350 L500,360 C500,360 480,340 370,340 C260,340 240,360 240,360 Z" 
                          fill="#E0E0E0" />
                </g>

                <!-- 4. Water & Flushing Action -->
                <g>
                    <!-- Water Surface -->
                    <ellipse cx="370" cy="355" rx="125" ry="22" fill="url(#waterGrad)" />
                    
                    <!-- Flushing Visuals (Triggered by class) -->
                    <g class="water-ripple">
                        <ellipse cx="370" cy="355" rx="100" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2" />
                        <ellipse cx="370" cy="355" rx="70" ry="12" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
                    </g>
                    
                    <!-- Ethereal Mist -->
                    <g class="mist-swirl" transform="translate(370, 350)">
                        <path d="M-20,0 Q0,-30 20,0 T60,0" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
                        <path d="M-40,10 Q0,-10 40,10 T100,10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                    </g>
                </g>

                <!-- 5. Seat & Lid -->
                <g filter="url(#softShadow)">
                    <!-- Lid (Open) -->
                    <g transform="rotate(-15, 370, 330)">
                        <ellipse cx="370" cy="330" rx="135" ry="26" fill="url(#ceramicGrad)" />
                        <!-- Lid Thickness/Edge -->
                        <path d="M235,330 A135 26 0 0 0 505,330 L505,334 A135 26 0 0 1 235,334 Z" fill="#E0E0E0" opacity="0.4"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <ellipse cx="370" cy="355" rx="135" ry="26" fill="url(#ceramicGrad)" />
                    <!-- Seat Inner Shadow -->
                    <ellipse cx="370" cy="355" rx="125" ry="22" fill="none" stroke="#E0E0E0" stroke-width="2" opacity="0.8"/>
                    <!-- Seat Highlight -->
                    <path d="M240,355 A130 24 0 0 0 500,355" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
                </g>

                <!-- 6. Tank -->
                <g filter="url(#softShadow)">
                    <!-- Tank Body -->
                    <rect x="280" y="140" width="180" height="180" rx="12" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Vertical) -->
                    <path d="M290,145 L290,315" stroke="white" stroke-width="10" opacity="0.4" stroke-linecap="round"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="278" y="138" width="184" height="8" rx="4" fill="#F0F0F0" />
                    
                    <!-- Tank Bottom Shadow Area -->
                    <path d="M280,310 L460,310 L460,320 C460,325 455,330 450,330 L290,330 C285,330 280,325 280,320 Z" fill="#D0D0D0" opacity="0.3" />
                </g>

                <!-- 7. Flush Handle (Enlarged, Metallic) -->
                <g class="flush-handle-group" onclick="triggerFlush()">
                    <!-- Base Mount -->
                    <circle cx="260" cy="220" r="12" fill="#E0E0E0" />
                    
                    <!-- Arm -->
                    <path d="M250,220 L190,240" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" class="handle-metal"/>
                    
                    <!-- Knob -->
                    <circle cx="190" cy="240" r="14" fill="url(#metalGrad)" class="handle-metal" />
                    <!-- Knob Highlight -->
                    <circle cx="186" cy="236" r="4" fill="white" opacity="0.8" />
                </g>
                
                <!-- Decorative context: Abstract Plant (Minimalist) -->
                <g transform="translate(650, 550) scale(0.9)" opacity="0.8">
                    <path d="M0,100 L0,20" stroke="#E0E0E0" stroke-width="2" />
                    <path d="M0,50 Q-30,20 -20,-20 Q10,10 0,50" fill="#D7CCC8" />
                    <path d="M0,80 Q40,50 50,0 Q20,30 0,80" fill="#D7CCC8" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            
            // Add class to trigger CSS animations
            svg.classList.add('flushing');
            
            // Remove class after animation cycle (2 seconds)
            setTimeout(() => {
                svg.classList.remove('flushing');
            }, 2000);
        }
    </script>
</body>
</html>
