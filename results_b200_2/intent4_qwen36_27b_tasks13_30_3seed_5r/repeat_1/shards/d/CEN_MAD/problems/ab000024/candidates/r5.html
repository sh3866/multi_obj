<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: High-contrast, Architectural, Clean */
            --bg-color: #F8FAFC;
            --bg-gradient: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 100%);
            --text-main: #0F172A;
            --text-muted: #475569;
            --text-faint: #94A3B8;
            --accent-color: #334155;
            
            /* Typography */
            --font-display: 'Didot', 'Georgia', serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 3rem;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%;
            position: relative;
            align-items: center;
        }

        /* Left Column: Typography & Hierarchy */
        .content-side {
            padding: 0 4rem 0 5rem;
            z-index: 2;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Priority 4: Reduced visual weight, better balance */
        h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.95;
            letter-spacing: -0.02em;
            margin-bottom: 0;
            color: var(--text-muted); /* Lighter color */
            font-weight: 400;
        }

        h1 span {
            display: block;
            font-family: var(--font-display);
            font-style: italic;
            color: var(--text-main);
            font-size: 5rem;
            margin-top: 0.1em;
        }

        /* Priority 4: Single row layout, better baseline */
        .specs {
            margin-top: 3rem;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            width: 100%;
            border-top: 1px solid rgba(15, 23, 42, 0.1);
            padding-top: 1.5rem;
        }

        .spec-item {
            padding-right: 3rem;
            display: flex;
            flex-direction: column;
        }

        .spec-item:last-child {
            padding-right: 0;
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        .spec-item p {
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.2;
            font-weight: 400;
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            max-width: 900px;
        }

        /* Context Elements */
        .wall-plane { fill: #FFFFFF; }
        .floor-plane { fill: #E2E8F0; }
        .floor-line { stroke: #CBD5E1; stroke-width: 1; }
        .wall-shadow { fill: rgba(15, 23, 42, 0.04); }
        .ground-shadow { fill: rgba(15, 23, 42, 0.15); filter: blur(8px); }
        .ground-shadow-soft { fill: rgba(15, 23, 42, 0.05); filter: blur(25px); }

        /* Priority 1: Material Realism - Sharp Speculars */
        .ceramic-body {
            fill: url(#ceramicGrad);
            stroke: #94A3B8;
            stroke-width: 1;
            stroke-opacity: 0.1;
        }
        
        .ceramic-highlight {
            fill: url(#specularGrad);
            mix-blend-mode: overlay;
            opacity: 0.6;
        }

        .chrome-metal {
            fill: url(#chromeGrad);
            stroke: #64748B;
            stroke-width: 0.5;
        }

        /* Priority 5: Handle Interaction */
        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 240px 220px;
        }
        
        .flush-handle-group:hover {
            transform: rotate(5deg);
        }

        .flushing .flush-handle-group {
            transform: rotate(30deg);
            transition: transform 0.05s ease-in;
        }

        /* Priority 3: Visualizing Action */
        .water-vortex {
            transform-origin: 375px 365px;
            opacity: 0;
            transform: scale(0.5) rotate(0deg);
            pointer-events: none;
        }

        .flushing .water-vortex {
            animation: vortexAnim 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes vortexAnim {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            60% { transform: scale(1.1) rotate(360deg); opacity: 0.6; }
            100% { transform: scale(1.4) rotate(540deg); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 2rem; height: auto; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 3.5rem; }
            .specs { flex-wrap: wrap; margin-top: 2rem; }
            header { padding: 1.5rem 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L / 1.0 G</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
            </div>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Filters -->
                    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
                        <feOffset dx="10" dy="20" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.2"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>

                    <!-- Gradients: Material Realism -->
                    
                    <!-- Main Body: Sharp contrast to simulate gloss -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#E2E8F0;stop-opacity:1" />
                        <stop offset="90%" style="stop-color:#94A3B8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                    </linearGradient>

                    <!-- Specular Highlight: Sharp, directional -->
                    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
                        <stop offset="10%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
                        <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0" />
                        <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
                    </linearGradient>

                    <!-- Tank: Deeper shading for volume -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="15%" style="stop-color:#F1F5F9;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#CBD5E1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                    </linearGradient>

                    <!-- Chrome: Metallic -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#E2E8F0;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#94A3B8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.9" />
                        <stop offset="80%" style="stop-color:#7DD3FC;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:0.9" />
                    </radialGradient>
                </defs>

                <!-- 1. Context & Grounding (Priority 2) -->
                <!-- Wall Plane -->
                <rect x="0" y="0" width="800" height="550" class="wall-plane" />
                <!-- Floor Plane -->
                <polygon points="0,550 800,550 800,800 0,800" class="floor-plane" />
                <!-- Baseboard / Floor Line -->
                <line x1="0" y1="550" x2="800" y2="550" class="floor-line" />
                
                <!-- Wall Shadow (Directional from Top Left) -->
                <polygon points="380,0 550,0 550,550 380,550" class="wall-shadow" />

                <!-- Floor Shadow Anchor -->
                <ellipse cx="380" cy="610" rx="180" ry="40" class="ground-shadow" />
                <ellipse cx="380" cy="610" rx="250" ry="60" class="ground-shadow-soft" />

                <!-- 2. Base Flange (Priority 2) -->
                <g transform="translate(0, 595)">
                    <!-- Flange Body -->
                    <path d="M240,0 L500,0 L510,12 L230,12 Z" fill="#94A3B8" />
                    <!-- Shadow under flange -->
                    <path d="M230,12 L510,12 L510,15 L230,15 Z" fill="#64748B" opacity="0.4" />
                    <!-- Bolts -->
                    <circle cx="250" cy="6" r="4" fill="#334155" />
                    <circle cx="490" cy="6" r="4" fill="#334155" />
                </g>

                <!-- 3. Main Bowl Group (Priority 1) -->
                <g filter="url(#dropShadow)">
                    <!-- Bowl Body -->
                    <path d="M200,340 
                             C200,340 180,600 375,600 
                             C570,600 540,340 540,340 Z" 
                          class="ceramic-body" />
                    
                    <!-- Priority 1: Sharp Specular Highlight -->
                    <path d="M220,380 C210,480 250,580 375,580 C500,580 520,480 520,380 C480,400 300,400 220,380 Z" 
                          class="ceramic-highlight" />
                    
                    <!-- Inner Bowl Depth -->
                    <path d="M200,340 C200,320 540,320 540,340 L540,350 C540,350 510,330 375,330 C240,330 200,350 200,350 Z" 
                          fill="#64748B" opacity="0.4" />
                </g>

                <!-- 4. Water & Flushing Action (Priority 3) -->
                <g>
                    <!-- Water Surface -->
                    <ellipse cx="375" cy="360" rx="135" ry="26" fill="url(#waterGrad)" />
                    
                    <!-- Vortex Effect -->
                    <g class="water-vortex">
                        <path d="M375,360 m-100,0 a100,20 0 1,0 200,0 a100,20 0 1,0 -200,0" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.8"/>
                        <path d="M375,360 m-60,0 a60,12 0 1,0 120,0 a60,12 0 1,0 -120,0" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
                        <path d="M375,360 m-30,0 a30,6 0 1,0 60,0 a30,6 0 1,0 -60,0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
                    </g>
                </g>

                <!-- 5. Seat & Lid (Priority 1) -->
                <g filter="url(#dropShadow)">
                    <!-- Lid (Open) -->
                    <g transform="rotate(-15, 375, 330)">
                        <ellipse cx="375" cy="330" rx="145" ry="28" class="ceramic-body" />
                        <!-- Lid Thickness -->
                        <path d="M230,330 A145 28 0 0 0 520,330 L520,336 A145 28 0 0 1 230,336 Z" fill="#94A3B8" opacity="0.4"/>
                        <!-- Lid Highlight -->
                        <path d="M240,330 A135 26 0 0 0 510,330" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <ellipse cx="375" cy="360" rx="145" ry="28" class="ceramic-body" />
                    <!-- Seat Highlight -->
                    <path d="M240,360 A135 26 0 0 0 510,360" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
                </g>

                <!-- 6. Tank (Priority 1) -->
                <g filter="url(#dropShadow)">
                    <!-- Tank Body -->
                    <rect x="285" y="140" width="180" height="200" rx="10" class="ceramic-body" />
                    
                    <!-- Tank Highlight (Sharp Vertical) -->
                    <rect x="295" y="140" width="15" height="200" fill="url(#specularGrad)" opacity="0.7" />
                    
                    <!-- Tank Top Rim -->
                    <rect x="283" y="138" width="184" height="8" rx="4" fill="#FFFFFF" />
                    
                    <!-- Tank Bottom Shadow -->
                    <path d="M285,330 L465,330 L465,340 C465,345 460,350 455,350 L290,350 C285,350 285,345 285,340 Z" fill="#1E293B" opacity="0.1" />
                </g>

                <!-- 7. Flush Handle (Priority 5: Mechanical Joint) -->
                <g class="flush-handle-group" onclick="triggerFlush()">
                    <!-- Mechanical Joint Base -->
                    <rect x="235" y="200" width="10" height="40" rx="2" fill="#64748B" />
                    <circle cx="240" cy="220" r="14" class="chrome-metal" />
                    <circle cx="240" cy="220" r="6" fill="#1E293B" />
                    
                    <!-- Arm (Thicker, Connected) -->
                    <path d="M238,220 L160,245" stroke="url(#chromeGrad)" stroke-width="14" stroke-linecap="round" />
                    
                    <!-- Knob -->
                    <circle cx="160" cy="245" r="20" class="chrome-metal" />
                    <!-- Knob Highlight -->
                    <circle cx="155" cy="240" r="6" fill="white" opacity="0.9" filter="blur(1px)" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            
            // Prevent rapid clicking spamming animations
            if (svg.classList.contains('flushing')) return;

            // Add class to trigger CSS animations
            svg.classList.add('flushing');
            
            // Remove class after animation cycle (1.2 seconds)
            setTimeout(() => {
                svg.classList.remove('flushing');
            }, 1200);
        }
    </script>
</body>
</html>
