<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-color: #EAE8E3;
            --text-main: #2A2A2A;
            --text-muted: #666666;
            --accent: #2C3E50;
            --tile-line: #D8D6D1;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
        }

        /* Background Pattern */
        .wall-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--tile-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--tile-line) 1px, transparent 1px);
            background-size: 100px 100px;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3rem;
            margin-top: 0.5rem;
        }

        .specs {
            margin-top: 2rem;
            border-top: 1px solid var(--tile-line);
            padding-top: 1.5rem;
            display: flex;
            gap: 3rem;
        }

        .spec-item h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .spec-item p {
            font-size: 1.5rem;
            font-weight: 300;
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            max-width: 700px;
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.1));
        }

        /* Animations */
        .flush-btn {
            cursor: pointer;
            transition: fill 0.2s;
        }
        .flush-btn:hover {
            fill: #ddd;
        }
        .flush-btn:active {
            transform: scale(0.95);
            transform-origin: center;
        }

        .water-spray {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .flushing .water-spray {
            animation: sprayAnim 0.6s ease-out forwards;
        }

        @keyframes sprayAnim {
            0% { opacity: 0; transform: scale(0.5); }
            30% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.3); }
        }

        /* Interactive Button */
        .cta-btn {
            margin-top: 3rem;
            padding: 1rem 2rem;
            background: var(--text-main);
            color: #fff;
            border: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            width: fit-content;
            transition: transform 0.2s, background 0.2s;
        }
        .cta-btn:hover {
            background: #000;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3rem; }
            h1 span { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="wall-pattern"></div>

        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Gradients for Ceramic Realism -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#fdfdfd;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#f0f0f0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#dcdcdc;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#fcfcfc;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:rgba(0,0,0,0);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:rgba(0,0,0,0.05);stop-opacity:1" />
                    </linearGradient>

                    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
                        <feOffset dx="0" dy="10" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.2"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>

                    <!-- Water Gradient -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#B2EBF2;stop-opacity:0.2" />
                    </radialGradient>
                </defs>

                <!-- Floor Shadow -->
                <ellipse cx="300" cy="540" rx="140" ry="15" fill="#D1CFC8" opacity="0.6" />

                <!-- Base/Floor Connection -->
                <path d="M260,520 L340,520 L350,535 L250,535 Z" fill="#EAE8E3" />
                <!-- Plumbing Pipe (Subtle) -->
                <rect x="280" y="520" width="40" height="40" rx="20" fill="url(#tankGrad)" filter="url(#dropShadow)" />
                <rect x="295" y="520" width="10" height="40" fill="#D0D0D0" opacity="0.3"/>

                <!-- Main Bowl Group -->
                <g id="bowl" filter="url(#dropShadow)">
                    <!-- Bowl Body -->
                    <path d="M220,300 C220,300 200,480 300,480 C400,480 380,300 380,300 Z" fill="url(#ceramicGrad)" />
                    
                    <!-- Bowl Front Highlight (Gloss) -->
                    <path d="M240,350 C230,400 250,460 300,460 C350,460 370,400 360,350 C340,380 260,380 240,350 Z" fill="white" opacity="0.4" />
                    
                    <!-- Bowl Back (Hidden depth) -->
                    <path d="M220,300 C220,280 380,280 380,300 L380,320 C380,320 360,300 300,300 C240,300 220,320 220,320 Z" fill="#E0E0E0" />
                </g>

                <!-- Water in Bowl -->
                <ellipse cx="300" cy="305" rx="75" ry="12" fill="url(#waterGrad)" />
                
                <!-- Flush Action Visual (Hidden by default) -->
                <g id="flush-effect" class="water-spray">
                    <circle cx="300" cy="305" r="60" fill="none" stroke="#B2EBF2" stroke-width="1" opacity="0.5"/>
                    <circle cx="300" cy="305" r="40" fill="none" stroke="#E0F7FA" stroke-width="2" opacity="0.8"/>
                    <path d="M280,305 Q300,280 320,305" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <path d="M290,305 Q300,260 310,305" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    <!-- Splash particles -->
                    <circle cx="270" cy="290" r="2" fill="white" />
                    <circle cx="330" cy="295" r="1.5" fill="white" />
                    <circle cx="310" cy="280" r="2" fill="white" />
                </g>

                <!-- Seat & Lid -->
                <g id="seat" filter="url(#dropShadow)">
                    <!-- Lid (Open) -->
                    <g transform="rotate(-15, 300, 280)">
                        <ellipse cx="300" cy="280" rx="85" ry="22" fill="url(#ceramicGrad)" stroke="#E0E0E0" stroke-width="1"/>
                        <!-- Lid Thickness -->
                        <path d="M215,280 A85 22 0 0 0 385,280 L385,285 A85 22 0 0 1 215,285 Z" fill="#E0E0E0" opacity="0.5"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <ellipse cx="300" cy="300" rx="85" ry="22" fill="url(#ceramicGrad)" stroke="#D0D0D0" stroke-width="1"/>
                    <!-- Seat Inner Shadow -->
                    <ellipse cx="300" cy="300" rx="78" ry="18" fill="none" stroke="#E0E0E0" stroke-width="2" opacity="0.5"/>
                    <!-- Seat Highlight -->
                    <path d="M220,300 A80 20 0 0 0 380,300" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                </g>

                <!-- Tank -->
                <g id="tank" filter="url(#dropShadow)">
                    <!-- Tank Body -->
                    <rect x="230" y="120" width="140" height="160" rx="10" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight -->
                    <path d="M240,125 L240,275" stroke="white" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="228" y="118" width="144" height="8" rx="4" fill="#E8E8E8" />
                    
                    <!-- Tank Bottom Shadow -->
                    <path d="M230,270 L370,270 L370,280 C370,285 365,290 360,290 L240,290 C235,290 230,285 230,280 Z" fill="#D0D0D0" opacity="0.4" />
                </g>

                <!-- Flush Handle -->
                <g id="handle" transform="translate(220, 190)">
                    <!-- Arm -->
                    <path d="M0,0 L-20,20" stroke="#C0C0C0" stroke-width="4" stroke-linecap="round" />
                    <!-- Knob -->
                    <circle cx="-20" cy="20" r="8" fill="#B0B0B0" class="flush-btn" onclick="triggerFlush()" />
                    <circle cx="-20" cy="20" r="6" fill="#D0D0D0" />
                    <!-- Shadow under knob -->
                    <circle cx="-20" cy="22" r="6" fill="rgba(0,0,0,0.1)" />
                </g>
                
                <!-- Decorative context: Plant (Abstract) -->
                <g transform="translate(480, 450) scale(0.8)">
                    <rect x="-15" y="0" width="30" height="60" fill="#D7CCC8" rx="5" /> <!-- Pot -->
                    <path d="M0,0 Q-30,-40 -10,-80 Q10,-40 0,0" fill="#A1887F" opacity="0.3" /> <!-- Leaves -->
                    <path d="M0,0 Q30,-60 50,-100 Q20,-50 0,0" fill="#8D6E63" opacity="0.4" />
                    <path d="M0,0 Q-10,-80 20,-120 Q40,-60 0,0" fill="#A1887F" opacity="0.3" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
            
            // Sound effect (Optional, keeping it visual only as per constraints)
            // console.log("Whoosh!");
        }
    </script>
</body>
</html>
