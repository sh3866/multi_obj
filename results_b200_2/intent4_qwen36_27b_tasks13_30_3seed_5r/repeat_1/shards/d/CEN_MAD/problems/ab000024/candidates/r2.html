<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: Cool, Refined, Clinical yet Warm */
            --bg-color: #F0F2F5;
            --bg-gradient: radial-gradient(circle at 70% 40%, #FFFFFF 0%, #E2E8F0 60%, #CBD5E1 100%);
            --text-main: #0F172A; /* Deep Slate */
            --text-muted: #475569; /* Slate */
            --text-faint: #94A3B8;
            
            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', Times, serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%;
            position: relative;
            align-items: center;
        }

        /* Left Column: Typography */
        .content-side {
            padding: 0 4rem 0 6rem;
            z-index: 2;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 6.5rem;
            line-height: 0.85;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-weight: 400;
        }

        h1 span {
            display: block;
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 500; /* Critique: Increased weight */
            color: var(--text-muted);
            font-size: 2.5rem;
            margin-top: 0.5rem;
            letter-spacing: 0;
        }

        /* Spec Grid */
        .specs {
            margin-top: 4rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
            border-top: 1px solid rgba(15, 23, 42, 0.1);
            padding-top: 1.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item h3 {
            font-family: var(--font-body);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-faint);
            margin-bottom: 0.6rem;
            font-weight: 600;
        }

        .spec-item p {
            font-family: var(--font-body);
            font-size: 1.15rem;
            color: var(--text-main);
            line-height: 1.2;
            font-weight: 700; /* Critique: Bolded spec values */
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
            padding-bottom: 2rem;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 90%;
            max-width: 850px;
            overflow: visible;
        }

        /* Floor Shadow - Tighter, darker anchor */
        .floor-shadow-anchor {
            fill: rgba(15, 23, 42, 0.15);
            filter: blur(4px);
        }
        
        .floor-shadow-diffuse {
            fill: rgba(15, 23, 42, 0.05);
            filter: blur(12px);
        }

        /* Flush Handle Interaction */
        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 260px 210px;
        }
        
        .flush-handle-group:hover {
            transform: rotate(5deg);
        }

        .flushing .flush-handle-group {
            transform: rotate(35deg);
            transition: transform 0.1s ease-in;
        }

        /* Water Ripple Animation */
        .water-ripple {
            transform-origin: 370px 360px;
            opacity: 0;
            transform: scale(0.5);
        }

        .flushing .water-ripple {
            animation: rippleAnim 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes rippleAnim {
            0% { transform: scale(0.8); opacity: 0; stroke-width: 4px; }
            20% { opacity: 0.6; stroke-width: 2px; }
            100% { transform: scale(1.4); opacity: 0; stroke-width: 0.5px; }
        }

        /* Swirl Mist */
        .mist-swirl {
            opacity: 0;
            transform-origin: center;
        }
        
        .flushing .mist-swirl {
            animation: mistAnim 2s ease-out forwards;
        }

        @keyframes mistAnim {
            0% { transform: translateY(0) scale(0.9); opacity: 0; }
            30% { opacity: 0.4; }
            100% { transform: translateY(-30px) scale(1.2); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 4rem; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 4rem; }
            h1 span { font-size: 1.8rem; }
            .specs { margin-top: 2rem; }
            header { padding: 1.5rem 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
            </div>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Filters -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
                        <feOffset dx="0" dy="20" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.12"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>

                    <!-- Gradients: Critique #1 & #2 (Cool-grey, structured lighting) -->
                    
                    <!-- Main Ceramic Body: Cool white to slate grey -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="85%" style="stop-color:#E2E8F0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Tank: Slightly cooler to separate from bowl -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#F1F5F9;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
                    </linearGradient>

                    <!-- Metallic Handle: Chrome finish -->
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#94A3B8;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#F8FAFC;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#CBD5E1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradient: Deep, clean blue -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.9" />
                        <stop offset="70%" style="stop-color:#BAE6FD;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:0.6" />
                    </radialGradient>
                </defs>

                <!-- 1. Floor Shadows: Critique #3 (Ground the object) -->
                <!-- Tight Contact Shadow -->
                <ellipse cx="380" cy="625" rx="120" ry="10" class="floor-shadow-anchor" />
                <!-- Diffuse Shadow -->
                <ellipse cx="380" cy="630" rx="200" ry="30" class="floor-shadow-diffuse" />

                <!-- 2. Base Flange (Realistic Fixture) -->
                <g transform="translate(0, 615)">
                    <!-- Flange Base -->
                    <path d="M270,0 L490,0 L500,12 L260,12 Z" fill="#E2E8F0" />
                    <!-- Flange Shadow/Depth -->
                    <path d="M270,0 L490,0 L490,4 L270,4 Z" fill="#94A3B8" opacity="0.2" />
                    <!-- Bolts -->
                    <circle cx="290" cy="6" r="5" fill="#64748B" />
                    <circle cx="290" cy="6" r="2" fill="#1E293B" />
                    <circle cx="470" cy="6" r="5" fill="#64748B" />
                    <circle cx="470" cy="6" r="2" fill="#1E293B" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g filter="url(#softShadow)">
                    <!-- Bowl Body -->
                    <path d="M230,340 
                             C230,340 210,590 380,590 
                             C550,590 510,340 510,340 Z" 
                          fill="url(#ceramicGrad)" />
                    
                    <!-- Bowl Front Highlight (Gloss) -->
                    <path d="M250,400 C240,480 280,550 380,550 C480,550 490,480 490,400 C460,430 300,430 250,400 Z" 
                          fill="white" opacity="0.4" />
                    
                    <!-- Inner Bowl Depth (Back) -->
                    <path d="M230,340 C230,320 510,320 510,340 L510,350 C510,350 490,330 370,330 C250,330 230,350 230,350 Z" 
                          fill="#E2E8F0" />
                </g>

                <!-- 4. Water & Flushing Action -->
                <g>
                    <!-- Water Surface -->
                    <ellipse cx="370" cy="355" rx="130" ry="24" fill="url(#waterGrad)" />
                    
                    <!-- Flushing Visuals (Triggered by class) -->
                    <g class="water-ripple">
                        <ellipse cx="370" cy="355" rx="110" ry="20" fill="none" stroke="#FFFFFF" stroke-width="3" />
                        <ellipse cx="370" cy="355" rx="80" ry="14" fill="none" stroke="#FFFFFF" stroke-width="2" />
                    </g>
                    
                    <!-- Ethereal Mist (Silence Cue) -->
                    <g class="mist-swirl" transform="translate(370, 350)">
                        <path d="M-20,0 Q0,-30 20,0 T60,0" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
                        <path d="M-40,10 Q0,-10 40,10 T100,10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
                    </g>
                </g>

                <!-- 5. Seat & Lid -->
                <g filter="url(#softShadow)">
                    <!-- Lid (Open) -->
                    <g transform="rotate(-15, 370, 330)">
                        <ellipse cx="370" cy="330" rx="140" ry="28" fill="url(#ceramicGrad)" />
                        <!-- Lid Thickness/Edge -->
                        <path d="M230,330 A140 28 0 0 0 510,330 L510,335 A140 28 0 0 1 230,335 Z" fill="#CBD5E1" opacity="0.3"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <ellipse cx="370" cy="355" rx="140" ry="28" fill="url(#ceramicGrad)" />
                    <!-- Seat Inner Shadow -->
                    <ellipse cx="370" cy="355" rx="130" ry="24" fill="none" stroke="#CBD5E1" stroke-width="2" opacity="0.8"/>
                    <!-- Seat Highlight -->
                    <path d="M240,355 A130 26 0 0 0 500,355" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
                </g>

                <!-- 6. Tank -->
                <g filter="url(#softShadow)">
                    <!-- Tank Body -->
                    <rect x="280" y="140" width="180" height="190" rx="14" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Vertical Sharp Specular) -->
                    <path d="M295,145 L295,325" stroke="white" stroke-width="12" opacity="0.6" stroke-linecap="round" filter="blur(1px)"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="278" y="138" width="184" height="10" rx="5" fill="#FFFFFF" />
                    
                    <!-- Tank Bottom Shadow Area -->
                    <path d="M280,320 L460,320 L460,330 C460,335 455,340 450,340 L290,340 C285,340 280,335 280,330 Z" fill="#94A3B8" opacity="0.15" />
                </g>

                <!-- 7. Flush Handle (Enlarged, Metallic, Distinct) -->
                <g class="flush-handle-group" onclick="triggerFlush()">
                    <!-- Base Mount -->
                    <circle cx="260" cy="210" r="14" fill="#CBD5E1" />
                    <circle cx="260" cy="210" r="10" fill="#94A3B8" />
                    
                    <!-- Arm -->
                    <path d="M255,210 L185,235" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round" class="handle-metal"/>
                    
                    <!-- Knob -->
                    <circle cx="185" cy="235" r="16" fill="url(#metalGrad)" class="handle-metal" />
                    <!-- Knob Highlight -->
                    <circle cx="180" cy="230" r="5" fill="white" opacity="0.9" filter="blur(0.5px)" />
                </g>
                
                <!-- Decorative context: Minimalist Spa Element (Critique #5) -->
                <g transform="translate(680, 580)" opacity="0.8">
                    <!-- Vase -->
                    <path d="M-10,80 L10,80 L15,0 L-15,0 Z" fill="#E2E8F0" />
                    <!-- Minimalist Branch -->
                    <path d="M0,0 Q-20,-40 -40,-80" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round" />
                    <path d="M-10,-20 Q10,-30 20,-50" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round" />
                    <!-- Leaves (Soft shapes) -->
                    <circle cx="-40" cy="-80" r="6" fill="#F1F5F9" />
                    <circle cx="20" cy="-50" r="5" fill="#F1F5F9" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            
            // Prevent rapid clicking spamming animations
            if (svg.classList.contains('flushing')) return;

            // Add class to trigger CSS animations
            svg.classList.add('flushing');
            
            // Remove class after animation cycle (2 seconds)
            setTimeout(() => {
                svg.classList.remove('flushing');
            }, 2000);
        }
    </script>
</body>
</html>
