<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub // Nexus v3.1</title>
    <style>
        :root {
            /* Palette: Cyber-Industrial */
            --bg-deep: #05070a;
            --bg-panel: #0f1219;
            --bg-card: #161b26;
            --bg-card-hover: #202736;
            
            --accent-primary: #00e5ff; /* Cyan */
            --accent-primary-dim: rgba(0, 229, 255, 0.15);
            
            --accent-gold: #ffaa00; /* Industrial Warning */
            --accent-gold-dim: rgba(255, 170, 0, 0.15);
            
            --accent-danger: #ff3355;
            
            --status-online: #00ff9d;
            --status-ingame: #00e5ff;
            --status-offline: #4b5563;
            
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --text-bright: #ffffff;

            /* Unified Geometry */
            --radius-card: 8px;
            --radius-btn: 100px; /* Pill shape */
            
            --border-subtle: rgba(255,255,255,0.08);
            --border-highlight: rgba(255,255,255,0.2);
            
            --font-display: 'Segoe UI', 'Roboto', sans-serif;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Background: Cyber-Industrial Texture --- */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }
        
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1a233a 0%, var(--bg-deep) 70%);
            z-index: -1;
        }

        /* --- Layout --- */
        .app-container {
            width: 96vw;
            height: 92vh;
            max-width: 1600px;
            display: grid;
            grid-template-columns: 300px 1fr 360px;
            gap: 20px;
            position: relative;
        }

        /* --- Panels --- */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        /* Subtle Bevel */
        .panel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .panel-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.01);
        }

        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Typography --- */
        h1, h2, h3, h4, h5, h6 { margin: 0; }

        /* --- Avatars: Stylized Silhouettes --- */
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-card);
            background: #1a1f2b;
            position: relative;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        
        .avatar svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Status Indicator */
        .status-indicator {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            border: 2px solid var(--bg-panel);
            z-index: 2;
        }
        
        .status-online { background: var(--status-online); box-shadow: 0 0 5px var(--status-online); }
        .status-ingame { background: var(--status-ingame); box-shadow: 0 0 5px var(--status-ingame); }
        .status-offline { background: var(--status-offline); }

        /* --- Buttons: Tactile & Pill --- */
        .btn {
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-display);
            letter-spacing: 0.5px;
            font-size: 11px;
            text-transform: uppercase;
            border-radius: var(--radius-btn); /* Pill shape */
        }

        /* Primary: Tactile Solid (No massive glow) */
        .btn-primary {
            background: linear-gradient(180deg, #00e5ff 0%, #00b8cc 100%);
            color: #000;
            padding: 10px 20px;
            font-weight: 800;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.4),
                0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Secondary: Outline */
        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.3);
        }

        /* Specific States */
        .btn-accept {
            color: var(--status-online);
            border-color: rgba(0, 255, 157, 0.3);
        }
        .btn-accept:hover {
            background: rgba(0, 255, 157, 0.1);
            border-color: var(--status-online);
        }

        .btn-decline {
            color: var(--accent-danger);
            border-color: rgba(255, 51, 85, 0.3);
        }
        .btn-decline:hover {
            background: rgba(255, 51, 85, 0.1);
            border-color: var(--accent-danger);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 6px; /* Square for icon-only buttons */
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-bright);
        }

        /* --- Left Panel: Profile & Party --- */
        .profile-header {
            padding: 24px 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .profile-avatar-lg {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }
        .profile-info { flex: 1; }
        .profile-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-bright);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .profile-class {
            font-size: 10px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            background: var(--accent-primary-dim);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .party-section {
            padding: 20px;
            background: linear-gradient(180deg, rgba(255, 170, 0, 0.02) 0%, transparent 100%);
            flex: 1;
        }
        
        .party-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .party-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            border-left: 2px solid var(--accent-gold);
            transition: transform 0.2s;
            position: relative;
        }
        .party-member:hover {
            background: var(--bg-card-hover);
        }
        
        /* Invite Button directly on Party Row */
        .party-invite-btn {
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .party-member:hover .party-invite-btn {
            opacity: 1;
        }

        .party-slot-open {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px dashed var(--border-highlight);
            border-radius: var(--radius-card);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .party-slot-open:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: var(--accent-primary-dim);
        }

        /* --- Center Panel: List --- */
        .search-bar-container {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
        }
        
        /* Search Input: High Contrast */
        .search-input {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border-highlight);
            padding: 10px 12px 10px 36px;
            border-radius: var(--radius-btn);
            color: var(--text-bright);
            font-size: 13px;
            font-family: var(--font-mono);
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-primary-dim);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 14px;
            height: 14px;
        }

        /* Add Friend Button */
        .btn-add-friend {
            background: var(--bg-card);
            border: 1px solid var(--border-highlight);
            color: var(--text-bright);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-add-friend:hover {
            background: var(--accent-primary);
            color: #000;
            border-color: var(--accent-primary);
        }

        .tabs {
            display: flex;
            padding: 0 20px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--border-subtle);
        }
        .tab {
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab:hover { color: var(--text-main); }
        .tab.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }
        .badge {
            background: var(--accent-danger);
            color: white;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 10px;
            margin-left: 6px;
        }

        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .friends-list::-webkit-scrollbar { width: 4px; }
        .friends-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: var(--radius-card);
            cursor: pointer;
            transition: background 0.1s;
            border: 1px solid transparent;
        }
        .friend-item:hover {
            background: var(--bg-card-hover);
        }
        .friend-item.selected {
            background: var(--bg-card);
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary-dim);
        }

        .friend-details {
            flex: 1;
            margin-left: 12px;
        }
        .friend-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }
        .friend-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-family: var(--font-mono);
        }

        /* --- Right Panel: Detail --- */
        .detail-panel {
            position: relative;
        }
        
        .detail-header {
            height: 160px;
            background: linear-gradient(135deg, #1e2638, #0f111a);
            position: relative;
            overflow: hidden;
        }
        
        /* Thematic Detail BG */
        .detail-bg-art {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.3;
            mix-blend-mode: overlay;
        }

        .detail-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(0deg, var(--bg-panel) 10%, transparent 100%);
            z-index: 2;
        }

        .detail-avatar-large {
            width: 90px;
            height: 90px;
            border-radius: var(--radius-card);
            background: #1a1f2b;
            border: 2px solid var(--bg-panel);
            position: absolute;
            bottom: -35px;
            left: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 3;
        }

        .detail-content {
            padding: 50px 24px 24px;
        }

        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .stat-box {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 12px 5px;
            border-radius: var(--radius-card);
            border: 1px solid var(--border-subtle);
        }
        .stat-val {
            display: block;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-bright);
            margin-bottom: 2px;
            font-family: var(--font-mono);
        }
        .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn-full {
            grid-column: span 2;
        }

        /* Utilities */
        svg { fill: currentColor; }
        .text-gold { color: var(--accent-gold); }
        .text-cyan { color: var(--accent-primary); }

    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-gradient"></div>

    <div class="app-container">
        
        <!-- LEFT COLUMN: Profile (Top) & Party (Bottom) -->
        <div class="panel">
            
            <!-- 1. My Profile Header -->
            <div class="profile-header">
                <div class="avatar profile-avatar-lg" id="myAvatar">
                    <!-- JS Injected -->
                    <div class="status-indicator status-online"></div>
                </div>
                <div class="profile-info">
                    <div class="profile-name">NeonViper</div>
                    <div class="profile-class">Cybernetic Ranger</div>
                </div>
                <button class="btn btn-ghost" title="Settings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>

            <!-- 2. Active Party Section -->
            <div class="panel-header">
                <span class="panel-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Active Party (3/4)
                </span>
            </div>

            <div class="party-section">
                <div class="party-list">
                    <!-- Party Member 1 -->
                    <div class="party-member">
                        <div class="avatar" id="partyAvatar1">
                            <div class="status-indicator status-online"></div>
                        </div>
                        <div class="member-info">
                            <div class="friend-name">Sara_V</div>
                            <div class="friend-meta">Tank • Lv. 88</div>
                        </div>
                        <!-- Invite Button directly on Row -->
                        <button class="btn btn-ghost party-invite-btn" title="Invite to Game">
                             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        </button>
                    </div>
                    <!-- Party Member 2 -->
                    <div class="party-member">
                        <div class="avatar" id="partyAvatar2">
                            <div class="status-indicator status-ingame"></div>
                        </div>
                        <div class="member-info">
                            <div class="friend-name">K0dox</div>
                            <div class="friend-meta">DPS • In Game</div>
                        </div>
                        <!-- Invite Button directly on Row -->
                        <button class="btn btn-ghost party-invite-btn" title="Invite to Game">
                             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        </button>
                    </div>
                    <!-- Open Slot CTA -->
                    <div class="party-slot-open">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Invite Member
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER COLUMN: List -->
        <div class="panel">
            <!-- Header with Search & Add Friend -->
            <div class="search-bar-container">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="search-input" placeholder="Search callsigns..." id="searchInput">
                </div>
                <!-- Add Friend Button -->
                <button class="btn-add-friend" title="Add Friend">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                </button>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('all')">All Friends</div>
                <div class="tab" onclick="switchTab('online')">Online <span style="color:var(--accent-primary)">12</span></div>
                <div class="tab" onclick="switchTab('requests')">Requests <span class="badge">2</span></div>
            </div>

            <!-- List Container -->
            <div class="friends-list" id="friendsList">
                <!-- JS will populate this -->
            </div>
        </div>

        <!-- RIGHT COLUMN: Detail Panel -->
        <div class="panel detail-panel" id="detailPanel">
            <div class="detail-header">
                <!-- Background Art -->
                <svg class="detail-bg-art" viewBox="0 0 380 180" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--accent-primary);stop-opacity:0.2" />
                            <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
                        </linearGradient>
                    </defs>
                    <path d="M0 180 L190 50 L380 180 Z" fill="url(#grad1)"/>
                    <path d="M0 180 L100 120 L250 180 Z" fill="rgba(255,255,255,0.05)"/>
                </svg>
                <div class="detail-overlay">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                        <div>
                            <h2 style="margin:0; font-size:24px; letter-spacing: -0.5px; font-weight: 800;" id="detailName">Sara_V</h2>
                            <span style="color:var(--accent-primary); font-size:11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;" id="detailRole">Tank</span>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:8px; color:var(--text-muted);">FRIENDS SINCE</div>
                            <div style="font-weight:bold; font-size:11px; font-family: var(--font-mono);" id="detailSince">2023</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-avatar-large" id="detailAvatar">
                <!-- JS Injected -->
            </div>

            <div class="detail-content">
                <div class="stat-row">
                    <div class="stat-box">
                        <span class="stat-val text-gold" id="statLvl">88</span>
                        <span class="stat-label">Level</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val text-cyan" id="statWins">1204</span>
                        <span class="stat-label">Wins</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val" id="statKd">4.2</span>
                        <span class="stat-label">K/D</span>
                    </div>
                </div>

                <!-- Refined Button Grammar -->
                <div class="action-grid">
                    <!-- Primary: Invite (Tactile, Solid, Pill) -->
                    <button class="btn btn-primary action-btn-full">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        INVITE TO GAME
                    </button>
                    
                    <!-- Secondary: Battle (Outline, Pill) -->
                    <button class="btn btn-secondary">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        BATTLE
                    </button>
                    
                    <!-- Tertiary: Msg (Ghost, Pill) -->
                    <button class="btn btn-ghost" style="border: 1px solid rgba(255,255,255,0.1);">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        MSG
                    </button>
                </div>

                <div style="margin-top: 24px; border-top: 1px solid var(--border-subtle); padding-top: 16px;">
                    <div style="font-size: 10px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; font-weight: 700;">Recent Activity</div>
                    <div style="display: flex; gap: 10px; font-size: 11px; margin-bottom: 12px; color: var(--text-muted); align-items: flex-start;">
                        <svg style="color: var(--accent-primary); margin-top: 2px; flex-shrink: 0;" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                        <span>Won Ranked Match</span>
                        <span style="margin-left:auto; opacity:0.5; font-size:10px;">2m ago</span>
                    </div>
                    <div style="display: flex; gap: 10px; font-size: 11px; margin-bottom: 12px; color: var(--text-muted); align-items: flex-start;">
                        <svg style="color: var(--accent-gold); margin-top: 2px; flex-shrink: 0;" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        <span>Unlocked "Cyber Ninja"</span>
                        <span style="margin-left:auto; opacity:0.5; font-size:10px;">1h ago</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Mock Data ---
        const friends = [
            { id: 1, name: "Sara_V", role: "Tank", status: "online", lvl: 88, wins: 1204, kd: "4.2", date: "2023", color: "#2ecc71" },
            { id: 2, name: "BladeRunner", role: "Assassin", status: "online", lvl: 88, wins: 1204, kd: "4.2", date: "2023", color: "#e74c3c" },
            { id: 3, name: "Glitch_Witch", role: "Support", status: "online", lvl: 45, wins: 340, kd: "1.1", date: "2024", color: "#9b59b6" },
            { id: 4, name: "HeavyMetal", role: "Tank", status: "ingame", lvl: 92, wins: 5600, kd: "2.8", date: "2021", color: "#f39c12" },
            { id: 5, name: "ZeroCool", role: "Hacker", status: "offline", lvl: 12, wins: 45, kd: "0.8", date: "2024", color: "#3498db" },
            { id: 6, name: "NeonSpectre", role: "Sniper", status: "online", lvl: 67, wins: 890, kd: "3.5", date: "2022", color: "#2ecc71" },
            { id: 7, name: "CyberPunk99", role: "Ranger", status: "online", lvl: 55, wins: 600, kd: "1.9", date: "2023", color: "#e67e22" },
            { id: 8, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, wins: 120, kd: "1.2", date: "2023", color: "#34495e" },
            { id: 9, name: "PixelPioneer", role: "Engineer", status: "ingame", lvl: 74, wins: 1500, kd: "2.1", date: "2022", color: "#1abc9c" },
            { id: 10, name: "StarDust", role: "Scout", status: "online", lvl: 41, wins: 210, kd: "1.5", date: "2024", color: "#ff7979" },
        ];

        // --- Helper: Generate Stylized Character Silhouettes ---
        function getAvatarSVG(color, type) {
            // Style 1: Helmet/Visor
            const style1 = `<rect width="44" height="44" fill="#1a1f2b"/>
                 <path d="M12 36 L12 24 Q12 12 22 12 Q32 12 32 24 L32 36" fill="${color}" opacity="0.9"/>
                 <rect x="16" y="20" width="12" height="4" rx="2" fill="#fff" opacity="0.8"/>`;
            
            // Style 2: Hooded
            const style2 = `<rect width="44" height="44" fill="#1a1f2b"/>
                 <path d="M22 10 Q32 10 34 20 Q36 30 34 36 L10 36 Q8 30 10 20 Q12 10 22 10" fill="${color}" opacity="0.8"/>
                 <circle cx="22" cy="22" r="4" fill="#1a1f2b"/>`;

            // Style 3: Tech/Geometric
            const style3 = `<rect width="44" height="44" fill="#1a1f2b"/>
                 <polygon points="22,10 34,36 10,36" fill="${color}" opacity="0.8"/>
                 <rect x="18" y="22" width="8" height="8" fill="#1a1f2b"/>`;

            const styles = [style1, style2, style3];
            const shape = styles[type % styles.length];
            return `<svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">${shape}</svg>`;
        }

        function getStatusColor(status) {
            if(status === 'online') return 'status-online';
            if(status === 'ingame') return 'status-ingame';
            return 'status-offline';
        }

        // --- Render Functions ---
        const listContainer = document.getElementById('friendsList');
        
        // Initial Render: All Friends (Active Tab)
        function renderFriends(filter = 'all') {
            listContainer.innerHTML = '';
            
            let filtered = friends;
            if (filter === 'online') {
                filtered = friends.filter(f => f.status === 'online' || f.status === 'ingame');
            }

            filtered.forEach((friend, index) => {
                const el = document.createElement('div');
                el.className = 'friend-item';
                // Highlight first item by default
                if (index === 0) el.classList.add('selected');
                
                el.onclick = () => selectFriend(friend, el);
                
                el.innerHTML = `
                    <div class="avatar">
                        ${getAvatarSVG(friend.color, index)}
                        <div class="status-indicator ${getStatusColor(friend.status)}"></div>
                    </div>
                    <div class="friend-details">
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-meta">
                            ${friend.status === 'ingame' ? '<span style="color:var(--status-ingame)">In Match</span>' : friend.status.charAt(0).toUpperCase() + friend.status.slice(1)}
                        </div>
                    </div>
                `;
                listContainer.appendChild(el);
            });

            // Update detail panel to match first item
            if (filtered.length > 0) {
                updateDetailPanel(filtered[0]);
            }
        }

        function renderRequests() {
            listContainer.innerHTML = '';
            const requests = [
                { id: 100, name: "CyberPunk99", role: "Ranger", status: "online", lvl: 55, color: "#e67e22" },
                { id: 101, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, color: "#34495e" }
            ];

            requests.forEach((req, index) => {
                const el = document.createElement('div');
                el.className = 'friend-item';
                
                el.innerHTML = `
                    <div class="avatar">
                        ${getAvatarSVG(req.color, index + 1)}
                        <div class="status-indicator ${getStatusColor(req.status)}"></div>
                    </div>
                    <div class="friend-details">
                        <div class="friend-name">${req.name}</div>
                        <div class="friend-meta">
                            <span style="color: var(--text-muted);">Level ${req.lvl} • ${req.role}</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-secondary btn-accept">Accept</button>
                        <button class="btn btn-secondary btn-decline">Decline</button>
                    </div>
                `;
                listContainer.appendChild(el);
            });
        }

        // --- Init & Interactions ---
        
        // Initialize My Avatar
        document.getElementById('myAvatar').innerHTML = getAvatarSVG('#ffc857', 0);
        
        // Initialize Party Avatars
        document.getElementById('partyAvatar1').innerHTML = getAvatarSVG('#2ecc71', 0) + '<div class="status-indicator status-online"></div>';
        document.getElementById('partyAvatar2').innerHTML = getAvatarSVG('#3498db', 2) + '<div class="status-indicator status-ingame"></div>';

        // Update Detail Panel Content
        function updateDetailPanel(friend) {
            document.getElementById('detailName').textContent = friend.name;
            document.getElementById('detailRole').textContent = friend.role;
            document.getElementById('detailSince').textContent = friend.date;
            document.getElementById('statLvl').textContent = friend.lvl;
            document.getElementById('statWins').textContent = friend.wins;
            document.getElementById('statKd').textContent = friend.kd;
            
            const avatarContainer = document.getElementById('detailAvatar');
            avatarContainer.innerHTML = getAvatarSVG(friend.color, friend.id);
        }

        function selectFriend(friend, el) {
            document.querySelectorAll('.friend-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            updateDetailPanel(friend);
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if(tabName === 'all' || tabName === 'online') {
                renderFriends(tabName);
            } else {
                renderRequests();
            }
        }

        // Run Initial Render
        renderFriends('all');

    </script>
</body>
</html>
