<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loom | Rule-Based Game Generator</title>
    <style>
        :root {
            /* Palette: Slate, Felt, & Technical Accents */
            --bg-canvas: #0f1115; /* Darker base for contrast */
            --bg-panel: #1c1f26;
            --bg-surface: #242830;
            --bg-input: #15171b;
            
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            /* Accents */
            --accent-primary: #3b82f6;
            --accent-primary-glow: rgba(59, 130, 246, 0.3);
            --accent-secondary: #f59e0b;
            
            --border-subtle: rgba(255,255,255,0.06);
            --border-active: #3b82f6;

            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);

            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-tech: 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        header {
            height: 64px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: var(--bg-panel);
            flex-shrink: 0;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-primary);
            border-radius: 8px;
            display: grid;
            place-items: center;
            box-shadow: 0 0 20px var(--accent-primary-glow);
            transition: transform 0.3s ease;
        }
        
        .brand:hover .brand-icon {
            transform: rotate(90deg);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        /* --- Main Layout: Stage & Control --- */
        main {
            display: grid;
            grid-template-columns: 1fr 400px; /* Left is wide stage, Right is control */
            height: calc(100vh - 64px);
            width: 100%;
        }

        /* --- Left: The Stage (Preview) --- */
        .viewport {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Subtle Felt Texture */
            background-color: #131519;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* Ambient Glow behind board */
        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 80%; height: 80%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s ease;
        }

        #board-canvas {
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            border-radius: 4px;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: crosshair;
        }

        .viewport-overlay {
            position: absolute;
            bottom: 32px;
            left: 32px;
            background: rgba(28, 31, 38, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 100px;
            border: 1px solid var(--border-subtle);
            font-family: var(--font-tech);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 20px;
            z-index: 2;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .overlay-stat span {
            color: var(--accent-primary);
            font-weight: 700;
        }

        /* --- Right: Control Panel --- */
        .control-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .panel-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Scrollbar Styling */
        .panel-scroll-area::-webkit-scrollbar { width: 6px; }
        .panel-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .panel-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* Section Headers */
        .panel-section h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Validation Status */
        .validation-status {
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        .status-text {
            font-family: var(--font-tech);
            font-size: 12px;
            color: var(--success);
            font-weight: 600;
        }

        /* Inputs & Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="number"], select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: var(--font-tech); /* Technical feel */
            font-size: 13px;
            transition: all 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Sliders */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
        }

        .slider-header span:last-child {
            font-family: var(--font-tech);
            color: var(--accent-primary);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 4px var(--bg-panel); /* Creates the cutout effect */
            border: 2px solid var(--accent-primary);
            transition: transform 0.1s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Rule Editor Cards */
        .rule-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rule-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .rule-card:hover {
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-1px);
        }

        .rule-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--text-muted);
            transition: background 0.2s;
        }

        .rule-card:hover::before {
            background: var(--accent-primary);
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .rule-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }

        .tag {
            font-family: var(--font-tech);
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid transparent;
        }

        /* Rule Parameters */
        .rule-params {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .param-group label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* Toggles */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-surface);
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Footer Actions */
        .action-footer {
            padding: 24px;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font-ui);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.03);
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.2);
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                </svg>
            </div>
            LOOM
        </div>
        <div class="header-actions">
            <!-- Moved Generate Board here -->
            <button class="btn btn-primary" id="generateBtn" style="width: auto; padding: 8px 20px; font-size: 13px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"></path></svg>
                Generate Board
            </button>
        </div>
    </header>

    <main>
        <!-- Left: The Stage (Canvas) -->
        <section class="viewport">
            <div class="ambient-glow"></div>
            <canvas id="board-canvas"></canvas>
            
            <div class="viewport-overlay">
                <div class="overlay-stat">Status: <span>Preview</span></div>
                <div class="overlay-stat">Cells: <span id="cell-count">0</span></div>
                <div class="overlay-stat">Seed: <span id="seed-display">8492</span></div>
            </div>
        </section>

        <!-- Right: Controls & Rules -->
        <aside class="control-panel">
            <div class="panel-scroll-area">
                
                <!-- Validation Status (Moved to Top) -->
                <div class="validation-status">
                    <div class="status-dot"></div>
                    <div class="status-text">CONFIGURATION VALID</div>
                </div>

                <!-- Board Geometry (Moved from Left Sidebar) -->
                <div class="panel-section">
                    <h3>Board Geometry</h3>
                    <div class="control-group">
                        <div class="control-row">
                            <label>Grid Topology</label>
                            <select id="gridType">
                                <option value="hex">Hexagonal</option>
                                <option value="square">Square Grid</option>
                                <option value="isometric">Isometric</option>
                            </select>
                        </div>
                        <div class="input-row">
                            <div>
                                <label>Width (Cols)</label>
                                <input type="number" id="colsInput" value="10" min="3" max="20">
                            </div>
                            <div>
                                <label>Height (Rows)</label>
                                <input type="number" id="rowsInput" value="10" min="3" max="20">
                            </div>
                        </div>
                        <div class="slider-container">
                            <div class="slider-header">
                                <label>Cell Radius</label>
                                <span id="radiusVal">24px</span>
                            </div>
                            <input type="range" id="radiusInput" min="10" max="40" value="24">
                        </div>
                    </div>
                </div>

                <!-- Generators (Moved from Left Sidebar) -->
                <div class="panel-section">
                    <h3>Generators</h3>
                    <div class="control-group">
                        <div class="toggle-row">
                            <label style="margin:0">Terrain Noise</label>
                            <label class="switch">
                                <input type="checkbox" id="noiseToggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-row">
                            <label style="margin:0">Resource Clusters</label>
                            <label class="switch">
                                <input type="checkbox" id="clusterToggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="toggle-row">
                            <label style="margin:0">Obstacles</label>
                            <label class="switch">
                                <input type="checkbox" id="obstacleToggle">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="slider-container">
                            <div class="slider-header">
                                <label>Entropy</label>
                                <span id="chaosVal">40%</span>
                            </div>
                            <input type="range" id="chaosInput" min="0" max="100" value="40">
                        </div>
                    </div>
                </div>

                <!-- Rule Editor (Restructured) -->
                <div class="panel-section">
                    <h3>Rule Logic</h3>
                    <div class="rule-list">
                        
                        <!-- Rule 1 -->
                        <div class="rule-card">
                            <div class="rule-header">
                                <span class="rule-title">Movement Cost</span>
                                <span class="tag">Physics</span>
                            </div>
                            <div class="rule-params">
                                <div class="param-group">
                                    <label>Base Cost</label>
                                    <input type="number" value="2" min="1">
                                </div>
                                <div class="param-group">
                                    <label>Terrain Mod</label>
                                    <select>
                                        <option>Linear (+1)</option>
                                        <option>Exponential</option>
                                        <option>Flat</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Rule 2 -->
                        <div class="rule-card">
                            <div class="rule-header">
                                <span class="rule-title">Visibility</span>
                                <span class="tag">Fog of War</span>
                            </div>
                            <div class="rule-params" style="grid-template-columns: 1fr;">
                                <div class="param-group" style="display:flex; justify-content:space-between; align-items:center;">
                                    <label style="margin:0">Enable Limited View</label>
                                    <label class="switch">
                                        <input type="checkbox" checked>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Rule 3 -->
                        <div class="rule-card">
                            <div class="rule-header">
                                <span class="rule-title">Victory Condition</span>
                                <span class="tag">Game Loop</span>
                            </div>
                            <div class="rule-params" style="grid-template-columns: 1fr;">
                                <div class="param-group">
                                    <label>End State</label>
                                    <select>
                                        <option>Capture Center Node</option>
                                        <option>Eliminate Enemy</option>
                                        <option>Resource Hoard (1000)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Rule 4 -->
                        <div class="rule-card">
                            <div class="rule-header">
                                <span class="rule-title">Starting Zone</span>
                                <span class="tag">Setup</span>
                            </div>
                            <div class="rule-params" style="grid-template-columns: 1fr;">
                                <div class="param-group">
                                    <label>Placement</label>
                                    <select>
                                        <option>Random Corners</option>
                                        <option>Opposite Edges</option>
                                        <option>Centered</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Footer Action -->
            <div class="action-footer">
                <button class="btn btn-secondary" id="startGameBtn">
                    Start Game
                </button>
            </div>
        </aside>
    </main>

    <script>
        // --- Configuration & State ---
        const state = {
            cols: 10,
            rows: 10,
            type: 'hex',
            radius: 24,
            chaos: 0.4,
            noise: true,
            seed: Math.floor(Math.random() * 100000)
        };

        // --- DOM Elements ---
        const canvas = document.getElementById('board-canvas');
        const ctx = canvas.getContext('2d');
        const colsInput = document.getElementById('colsInput');
        const rowsInput = document.getElementById('rowsInput');
        const typeInput = document.getElementById('gridType');
        const radiusInput = document.getElementById('radiusInput');
        const chaosInput = document.getElementById('chaosInput');
        const generateBtn = document.getElementById('generateBtn');
        const cellCountDisplay = document.getElementById('cell-count');
        const seedDisplay = document.getElementById('seed-display');

        // --- Colors ---
        const colors = {
            water: '#1e3a8a', 
            sand: '#d97706',  
            grass: '#059669', 
            forest: '#064e3b', 
            mountain: '#475569', 
            obstacle: '#1e293b', 
        };

        // --- Simple Pseudo-Random Noise (Seeded) ---
        function pseudoRandom(x, y, seed) {
            let n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
            return n - Math.floor(n);
        }

        function smoothNoise(x, y, seed) {
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            const fx = x - ix;
            const fy = y - iy;
            
            const v1 = pseudoRandom(ix, iy, seed);
            const v2 = pseudoRandom(ix+1, iy, seed);
            const v3 = pseudoRandom(ix, iy+1, seed);
            const v4 = pseudoRandom(ix+1, iy+1, seed);

            const i1 = v1 * (1 - fx) + v2 * fx;
            const i2 = v3 * (1 - fx) + v4 * fx;
            return i1 * (1 - fy) + i2 * fy;
        }

        // --- Drawing Functions ---

        function drawHexagon(ctx, x, y, r) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const offsetX = r * Math.cos(angle);
                const offsetY = r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x + offsetX, y + offsetY);
                else ctx.lineTo(x + offsetX, y + offsetY);
            }
            ctx.closePath();
        }

        function getTerrainColor(val) {
            if (val < 0.35) return colors.water;
            if (val < 0.45) return colors.sand;
            if (val < 0.65) return colors.grass;
            if (val < 0.85) return colors.forest;
            return colors.mountain;
        }

        function renderBoard() {
            // 1. Setup Canvas Size
            const hexWidth = state.radius * 2;
            const hexHeight = Math.sqrt(3) * state.radius;
            const verticalSpacing = hexHeight;
            const horizontalSpacing = hexWidth * 0.75;

            const totalWidth = (state.cols * horizontalSpacing) + hexWidth;
            const totalHeight = (state.rows * verticalSpacing) + hexHeight;

            // High DPI scaling
            const dpr = window.devicePixelRatio || 1;
            canvas.width = totalWidth * dpr;
            canvas.height = totalHeight * dpr;
            canvas.style.width = `${totalWidth}px`;
            canvas.style.height = `${totalHeight}px`;
            ctx.scale(dpr, dpr);

            // Clear
            ctx.clearRect(0, 0, totalWidth, totalHeight);

            // 2. Draw Grid
            let cellCount = 0;
            
            for (let r = 0; r < state.rows; r++) {
                for (let c = 0; c < state.cols; c++) {
                    const xOffset = (r % 2) * (horizontalSpacing / 2);
                    const x = c * horizontalSpacing + xOffset + state.radius;
                    const y = r * verticalSpacing + state.radius;

                    const scale = 0.2 + (state.chaos * 0.5);
                    let noiseVal = state.noise ? smoothNoise(c * scale, r * scale, state.seed) : 0.5;
                    
                    let isObstacle = false;
                    if (document.getElementById('obstacleToggle').checked) {
                        if (pseudoRandom(c, r, state.seed + 999) > 0.85) isObstacle = true;
                    }

                    ctx.save();
                    
                    // Physical depth
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 4;

                    drawHexagon(ctx, x, y, state.radius - 1.5); 
                    
                    ctx.fillStyle = isObstacle ? colors.obstacle : getTerrainColor(noiseVal);
                    ctx.fill();

                    // Reset shadow for strokes
                    ctx.shadowColor = "transparent"; 
                    
                    // Top/Left Light Bevel
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = "rgba(255,255,255,0.15)";
                    ctx.stroke();
                    
                    // Inner subtle border
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(0,0,0,0.3)";
                    ctx.stroke();

                    // Inner Highlight (Gloss)
                    ctx.beginPath();
                    drawHexagon(ctx, x, y, state.radius - 3);
                    ctx.clip();
                    ctx.fillStyle = "rgba(255,255,255,0.06)";
                    ctx.beginPath();
                    ctx.arc(x - state.radius/3, y - state.radius/3, state.radius, 0, Math.PI*2);
                    ctx.fill();

                    ctx.restore();

                    cellCount++;
                }
            }

            cellCountDisplay.innerText = cellCount;
        }

        // --- Event Listeners ---

        function updateState() {
            state.cols = parseInt(colsInput.value);
            state.rows = parseInt(rowsInput.value);
            state.type = typeInput.value;
            state.radius = parseInt(radiusInput.value);
            state.chaos = parseInt(chaosInput.value) / 100;
            state.noise = document.getElementById('noiseToggle').checked;
            
            document.getElementById('radiusVal').innerText = `${state.radius}px`;
            document.getElementById('chaosVal').innerText = `${state.chaos * 100}%`;
            
            renderBoard();
        }

        [colsInput, rowsInput, typeInput, radiusInput, chaosInput].forEach(el => {
            el.addEventListener('input', updateState);
        });
        
        document.getElementById('noiseToggle').addEventListener('change', updateState);
        document.getElementById('obstacleToggle').addEventListener('change', updateState);

        // Generate Button
        generateBtn.addEventListener('click', () => {
            state.seed = Math.floor(Math.random() * 100000);
            seedDisplay.innerText = state.seed;
            
            // Button Animation
            const originalText = generateBtn.innerHTML;
            generateBtn.innerHTML = "Generating...";
            generateBtn.style.opacity = "0.8";
            
            setTimeout(() => {
                renderBoard();
                generateBtn.innerHTML = originalText;
                generateBtn.style.opacity = "1";
            }, 300);
        });

        // Initial Render
        seedDisplay.innerText = state.seed;
        renderBoard();

        window.addEventListener('resize', renderBoard);

    </script>
</body>
</html>
