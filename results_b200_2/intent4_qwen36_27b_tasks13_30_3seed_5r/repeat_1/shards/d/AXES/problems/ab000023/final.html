<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product: The Play Sign</title>
    <style>
        :root {
            /* Environment Palette - High-end Studio */
            --bg-wall: #D4D4D8;
            --bg-floor: #8A8F98;
            
            /* Sign Material - Pristine White */
            --sign-face: #FFFFFF;
            --sign-edge: #E5E5E5;
            
            /* Brand - Crisp Red */
            --brand-red: #E60023;
            --brand-red-dark: #990016;
            
            /* Hardware - Industrial Matte */
            --hw-dark: #18181B;
            --hw-light: #3F3F46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px; /* Deep perspective for realistic 3D */
        }

        /* --- The Environment (Floor & Lighting) --- */
        .studio-environment {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Floor Plane */
        .floor {
            position: absolute;
            top: 60%; /* Horizon line */
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, #71717A 0%, #52525B 100%);
            transform: perspective(600px) rotateX(55deg);
            transform-origin: top center;
        }

        /* Floor Texture (Subtle noise/grain via SVG pattern) */
        .floor::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            opacity: 0.5;
        }

        /* Lighting Vignette */
        .lighting-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, transparent 0%, rgba(0,0,0,0.3) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- The Product Scene --- */
        .product-scene {
            position: relative;
            width: 400px;
            height: 600px;
            transform-style: preserve-3d;
            z-index: 5;
            /* Initial Pose: Angled slightly to show depth */
            transform: rotateX(10deg) rotateY(-15deg) translateY(-50px);
            transition: transform 0.1s ease-out;
        }

        /* --- The Sign Object (3D Construction) --- */
        .sign {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 450px;
            transform-style: preserve-3d;
        }

        /* 1. The Face (Front) */
        .sign-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--sign-face);
            border-radius: 8px;
            transform: translateZ(15px); /* 15mm thickness offset */
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Edge crispness */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 60px; /* Space for top balance */
        }

        /* 2. The Thickness (Extrusion) */
        /* Using a solid block behind the face to simulate physical volume */
        .sign-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--sign-edge);
            border-radius: 8px;
            transform: translateZ(0px);
            /* Gradient to simulate lighting hitting the edge */
            background: linear-gradient(90deg, #E5E5E5 0%, #F4F4F5 50%, #DCDCDC 100%);
        }

        /* 3. The Emblem (Red Play Button) */
        /* Positioned in the lower-middle third per critique */
        .emblem-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-top: 80px; /* Push down */
            transform-style: preserve-3d;
        }

        .emblem {
            width: 100%;
            height: 100%;
            /* Lifted off the sign face slightly to cast shadow */
            transform: translateZ(5px); 
            filter: drop-shadow(0px 15px 10px rgba(0,0,0,0.25));
        }

        /* 4. The Hardware (Easel Stand) */
        /* Attached to the back/bottom, extending down to the floor */
        .stand {
            position: absolute;
            top: 420px; /* Bottom of sign */
            left: 50%;
            transform: translateX(-50%) rotateX(90deg) translateZ(-10px); /* Pivot at bottom */
            transform-origin: top center;
            transform-style: preserve-3d;
            width: 200px;
            height: 160px;
        }

        /* --- Floor Shadow (Grounding) --- */
        .ground-shadow {
            position: absolute;
            top: 580px; /* Floor level */
            left: 50%;
            width: 350px;
            height: 100px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 70%);
            transform: translateX(-50%) rotateX(90deg);
            filter: blur(12px);
            z-index: 1; /* Behind object */
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
        }

        /* --- Typography (Hierarchy Fix) --- */
        /* Moved to top-left "sky" area for contrast */
        .product-label {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 20;
            color: #18181B;
            pointer-events: none;
        }

        .product-label h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .product-label p {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #52525B;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .product-scene { transform: rotateX(10deg) rotateY(0deg) translateY(-20px) scale(0.8); }
            .product-label { top: 40px; left: 40px; }
            .product-label h1 { font-size: 1.5rem; }
        }

    </style>
</head>
<body>

    <!-- Background Environment -->
    <div class="studio-environment">
        <div class="floor"></div>
        <div class="lighting-overlay"></div>
    </div>

    <!-- UI Overlay (Top Left) -->
    <div class="product-label">
        <h1>Play Sign</h1>
        <p>Series 400 • Matte White</p>
    </div>

    <!-- Main 3D Scene -->
    <div class="product-scene" id="scene">
        
        <!-- Ground Shadow (Static position, dynamic opacity/scale) -->
        <div class="ground-shadow" id="shadow"></div>

        <!-- The Product Group -->
        <div class="sign" id="sign">
            
            <!-- 1. Sign Body (Thickness/Back) -->
            <div class="sign-body"></div>

            <!-- 2. Sign Face (Front) -->
            <div class="sign-face">
                
                <!-- The Emblem -->
                <div class="emblem-container">
                    <svg class="emblem" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Glossy Red Gradient (Light from Top-Left) -->
                            <radialGradient id="redGloss" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#FF4D6D" />
                                <stop offset="40%" stop-color="#E60023" />
                                <stop offset="100%" stop-color="#990016" />
                            </radialGradient>
                            
                            <!-- Inner Bevel for 3D Badge look -->
                            <filter id="badgeBevel" x="-10%" y="-10%" width="120%" height="120%">
                                <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
                                <!-- Highlight (Top Left) -->
                                <feOffset dx="-3" dy="-3" in="blur" result="offsetBlurHL"/>
                                <feComposite in="SourceAlpha" in2="offsetBlurHL" operator="out" result="inverseHL"/>
                                <feFlood flood-color="#FFFFFF" flood-opacity="0.5" result="colorHL"/>
                                <feComposite in="colorHL" in2="inverseHL" operator="in" result="highlight"/>
                                
                                <!-- Shadow (Bottom Right) -->
                                <feOffset dx="3" dy="3" in="blur" result="offsetBlurSH"/>
                                <feComposite in="SourceAlpha" in2="offsetBlurSH" operator="out" result="inverseSH"/>
                                <feFlood flood-color="#000000" flood-opacity="0.4" result="colorSH"/>
                                <feComposite in="colorSH" in2="inverseSH" operator="in" result="shadow"/>
                                
                                <feMerge>
                                    <feMergeNode in="SourceGraphic"/>
                                    <feMergeNode in="shadow"/>
                                    <feMergeNode in="highlight"/>
                                </feMerge>
                            </filter>
                        </defs>

                        <!-- Badge Base -->
                        <circle cx="100" cy="100" r="90" fill="url(#redGloss)" filter="url(#badgeBevel)" />
                        
                        <!-- Play Triangle (Crisp White) -->
                        <path d="M86 66 L136 100 L86 134 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
                    </svg>
                </div>

            </div>

            <!-- 3. Hardware (Easel Stand) -->
            <!-- Drawn in SVG to align perfectly with the sign's 3D space -->
            <div class="stand">
                <svg width="200" height="160" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="metalMatte" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#27272A" />
                            <stop offset="50%" stop-color="#52525B" />
                            <stop offset="100%" stop-color="#27272A" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Left Leg -->
                    <path d="M80 0 L100 0 L130 140 L110 140 Z" fill="url(#metalMatte)" />
                    <!-- Right Leg -->
                    <path d="M100 0 L120 0 L90 140 L70 140 Z" fill="url(#metalMatte)" opacity="0.8" />
                    
                    <!-- Base Feet (Rubber) -->
                    <rect x="105" y="140" width="30" height="6" rx="2" fill="#111" />
                    <rect x="65" y="140" width="30" height="6" rx="2" fill="#111" />
                    
                    <!-- Pivot Bolt -->
                    <circle cx="100" cy="0" r="6" fill="#111" stroke="#333" stroke-width="1"/>
                </svg>
            </div>

        </div>
    </div>

    <script>
        // Parallax Interaction Logic
        const scene = document.getElementById('scene');
        const shadow = document.getElementById('shadow');

        // Only enable parallax on devices with mouse
        if (window.matchMedia("(hover: hover)").matches) {
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth) * 2 - 1; // -1 to 1
                const y = (e.clientY / window.innerHeight) * 2 - 1; // -1 to 1

                // 1. Rotate Sign
                // Y-Axis rotation follows X mouse
                // X-Axis rotation follows Y mouse
                const rotY = -15 + (x * 15); 
                const rotX = 10 - (y * 10);
                
                scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-50px)`;

                // 2. Adjust Shadow
                // Shadow moves opposite to object tilt
                // If object tilts right (positive rotY), shadow moves left (negative X)
                const shadowX = x * -30; 
                const shadowScale = 1.2 - (y * 0.1); // Shadow shrinks as object lifts
                
                shadow.style.transform = `translateX(calc(-50% + ${shadowX}px)) rotateX(90deg) scale(${shadowScale})`;
                shadow.style.opacity = 0.5 - (Math.abs(y) * 0.1);
            });

            // Reset on leave
            document.addEventListener('mouseleave', () => {
                scene.style.transform = `rotateX(10deg) rotateY(-15deg) translateY(-50px)`;
                shadow.style.transform = `translateX(-50%) rotateX(90deg) scale(1.2)`;
                shadow.style.opacity = 0.5;
            });
        }
    </script>
</body>
</html>
