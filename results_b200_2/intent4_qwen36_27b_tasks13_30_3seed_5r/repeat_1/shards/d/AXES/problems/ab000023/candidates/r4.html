<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signage — Refined Studio Visual</title>
    <style>
        :root {
            /* Environment Palette - Refined Studio */
            --bg-wall-top: #E5E7EB;
            --bg-wall-bot: #D1D5DB;
            --bg-floor-top: #9CA3AF;
            --bg-floor-bot: #6B7280;
            
            /* Object Palette - Premium White */
            --sign-face: #FFFFFF;
            --sign-edge-light: #F3F4F6;
            --sign-edge-dark: #9CA3AF;
            --sign-bevel: #E5E7EB;
            
            /* Brand Palette - Crisp Red */
            --brand-red: #E60023;
            --brand-red-highlight: #FF4D6D;
            --brand-red-shadow: #990016;

            /* Hardware Palette - Matte Black Metal */
            --hw-metal: #1F2937;
            --hw-highlight: #4B5563;
            --hw-screw: #111827;

            /* Typography */
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111827; /* Deep background outside studio */
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- The Studio Environment --- */
        .studio-scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1500px; /* Deep perspective for 3D */
            background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall-bot) 50%, var(--bg-floor-top) 50%, var(--bg-floor-bot) 100%);
            overflow: hidden;
        }

        /* Subtle Floor Texture/Grid */
        .studio-scene::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 50%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform-origin: top center;
            transform: perspective(600px) rotateX(60deg);
            z-index: 1;
            pointer-events: none;
            mask-image: linear-gradient(to bottom, transparent, black 30%);
        }

        /* Vignette for focus */
        .studio-scene::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 40%, transparent 50%, rgba(0,0,0,0.4) 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- The 3D Sign Object --- */
        .sign-container {
            position: relative;
            width: 360px;
            height: 540px;
            transform-style: preserve-3d;
            /* Default Pose: Slightly angled */
            transform: rotateX(10deg) rotateY(-15deg) translateY(-20px);
            transition: transform 0.1s ease-out;
            z-index: 20;
        }

        /* 1. The Thickness (Extrusion) */
        /* We simulate thickness with multiple stacked layers to avoid complex geometry */
        .sign-thickness {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-edge-dark);
            border-radius: 12px;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
        }
        
        /* Stacking layers for depth (20px depth) */
        .sign-thickness:nth-child(1) { transform: translateZ(0px); }
        .sign-thickness:nth-child(2) { transform: translateZ(2px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(3) { transform: translateZ(4px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(4) { transform: translateZ(6px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(5) { transform: translateZ(8px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(6) { transform: translateZ(10px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(7) { transform: translateZ(12px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(8) { transform: translateZ(14px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(9) { transform: translateZ(16px); background: var(--sign-edge-light); }
        .sign-thickness:nth-child(10) { transform: translateZ(18px); background: var(--sign-edge-light); }

        /* 2. The Face (Front) */
        .sign-face {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-face);
            border-radius: 12px;
            transform: translateZ(20px);
            /* Matte finish lighting */
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 3. The Emblem (Play Button) */
        .emblem-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            /* Cast a shadow from the emblem onto the face */
            filter: drop-shadow(4px 8px 6px rgba(0,0,0,0.15));
        }

        /* 4. Hardware (Stand & Brackets) */
        .hardware-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            transform: translateZ(-5px); /* Sits slightly behind the face */
            pointer-events: none;
        }

        /* --- Floor Shadow --- */
        /* A separate element that moves independently to ground the object */
        .floor-shadow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 360px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 70%);
            transform-origin: top center;
            transform: translate(-50%, 220px) rotateX(90deg) scale(1.2);
            z-index: 5;
            filter: blur(8px);
            transition: transform 0.1s ease-out;
        }

        /* --- Typography / Label --- */
        .ui-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .ui-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            color: #1F2937; /* High contrast dark */
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(255,255,255,0.5);
        }

        .ui-sub {
            font-size: 0.75rem;
            font-weight: 600;
            color: #4B5563;
            letter-spacing: 0.1em;
            opacity: 0.9;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .sign-container {
                width: 280px;
                height: 420px;
            }
            .emblem-wrapper {
                width: 160px;
                height: 160px;
            }
        }

    </style>
</head>
<body>

    <div class="studio-scene" id="scene">
        
        <!-- Ground Shadow (Separate from object) -->
        <div class="floor-shadow" id="shadow"></div>

        <!-- The 3D Object Group -->
        <div class="sign-container" id="sign">
            
            <!-- Thickness Layers (Extrusion) -->
            <!-- These layers create the physical side profile -->
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>
            <div class="sign-thickness"></div>

            <!-- Main Face -->
            <div class="sign-face">
                
                <!-- Emblem -->
                <div class="emblem-wrapper">
                    <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Premium Red Gradient -->
                            <radialGradient id="redGloss" cx="35%" cy="35%" r="70%">
                                <stop offset="0%" stop-color="#FF4D6D" /> <!-- Highlight -->
                                <stop offset="40%" stop-color="#E60023" /> <!-- Base -->
                                <stop offset="100%" stop-color="#990016" /> <!-- Shadow -->
                            </radialGradient>
                            
                            <!-- Inner Bevel Filter -->
                            <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
                                <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
                                <feOffset dx="1" dy="1" result="offsetBlur"/>
                                <feComposite in="SourceAlpha" in2="offsetBlur" operator="out" result="inverse"/>
                                <feFlood flood-color="white" flood-opacity="0.4" result="color"/>
                                <feComposite in="color" in2="inverse" operator="in" result="highlight"/>
                                
                                <feOffset dx="-1" dy="-1" in="blur" result="offsetBlur2"/>
                                <feComposite in="SourceAlpha" in2="offsetBlur2" operator="out" result="inverse2"/>
                                <feFlood flood-color="black" flood-opacity="0.3" result="color2"/>
                                <feComposite in="color2" in2="inverse2" operator="in" result="shadow"/>
                                
                                <feMerge>
                                    <feMergeNode in="SourceGraphic"/>
                                    <feMergeNode in="shadow"/>
                                    <feMergeNode in="highlight"/>
                                </feMerge>
                            </filter>
                        </defs>

                        <!-- Red Circle -->
                        <circle cx="100" cy="100" r="90" fill="url(#redGloss)" filter="url(#bevel)" />
                        
                        <!-- Play Triangle -->
                        <!-- Centered perfectly -->
                        <path d="M86 66 L136 100 L86 134 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

            <!-- Hardware (Stand & Brackets) -->
            <svg class="hardware-back" viewBox="0 0 360 540" preserveAspectRatio="none">
                <defs>
                    <!-- Matte Black Metal Gradient -->
                    <linearGradient id="metalMatte" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#111827" />
                        <stop offset="20%" stop-color="#374151" />
                        <stop offset="50%" stop-color="#4B5563" />
                        <stop offset="80%" stop-color="#374151" />
                        <stop offset="100%" stop-color="#111827" />
                    </linearGradient>
                    
                    <!-- Screw Hole Shadow -->
                    <radialGradient id="screwShadow">
                        <stop offset="0%" stop-color="#000" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                    </radialGradient>
                </defs>

                <!-- 1. Wall Brackets (Top/Bottom Left) -->
                <g transform="translate(0,0)">
                    <!-- Top Bracket -->
                    <rect x="10" y="40" width="25" height="60" rx="3" fill="url(#metalMatte)" />
                    <!-- Screws Top -->
                    <circle cx="22" cy="50" r="3" fill="#000" stroke="#555" stroke-width="0.5" />
                    <circle cx="22" cy="80" r="3" fill="#000" stroke="#555" stroke-width="0.5" />
                    <circle cx="22" cy="50" r="1" fill="url(#screwShadow)" />
                    <circle cx="22" cy="80" r="1" fill="url(#screwShadow)" />

                    <!-- Bottom Bracket -->
                    <rect x="10" y="440" width="25" height="60" rx="3" fill="url(#metalMatte)" />
                    <!-- Screws Bottom -->
                    <circle cx="22" cy="450" r="3" fill="#000" stroke="#555" stroke-width="0.5" />
                    <circle cx="22" cy="480" r="3" fill="#000" stroke="#555" stroke-width="0.5" />
                </g>

                <!-- 2. Easel Stand (Bottom Center) -->
                <!-- Leg -->
                <path d="M160 540 L180 540 L195 480 L165 480 Z" fill="url(#metalMatte)" />
                <!-- Base Plate -->
                <rect x="140" y="535" width="100" height="8" rx="2" fill="url(#metalMatte)" />
                <!-- Connection Bolt -->
                <circle cx="180" cy="490" r="5" fill="#1F2937" stroke="#6B7280" stroke-width="1" />
            </svg>

        </div>

        <!-- Typography Footer -->
        <div class="ui-overlay">
            <div class="ui-title">Play Button Sign</div>
            <div class="ui-sub">Series 400 • Matte White • 24mm</div>
        </div>

    </div>

    <script>
        // Parallax Interaction Logic
        const scene = document.getElementById('scene');
        const sign = document.getElementById('sign');
        const shadow = document.getElementById('shadow');

        scene.addEventListener('mousemove', (e) => {
            // Calculate mouse position relative to center (-1 to 1)
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = (e.clientY / window.innerHeight) * 2 - 1;

            // 1. Rotate Sign
            // Y-Axis rotation follows X mouse movement
            // X-Axis rotation follows Y mouse movement (inverted)
            // Base rotation: rotateX(10) rotateY(-15)
            const rotY = -15 + (x * 20); // Range: -35 to 5
            const rotX = 10 - (y * 15);  // Range: -5 to 25
            
            sign.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-20px)`;

            // 2. Move Shadow
            // Shadow moves opposite to the light source/object tilt
            // If object tilts right (positive rotY), shadow moves left
            const shadowX = x * -60; 
            const shadowScale = 1.2 + (Math.abs(y) * 0.1); // Shadow shrinks slightly as object tilts up
            
            // Note: Shadow transform origin is top center, so we translate X and Scale
            shadow.style.transform = `translate(calc(-50% + ${shadowX}px), 220px) rotateX(90deg) scale(${shadowScale})`;
            
            // Shadow opacity gets lighter if object tilts "up" (away from floor)
            const shadowOpacity = 0.4 - (y * 0.1);
            shadow.style.opacity = Math.max(0.1, shadowOpacity);
        });

        // Reset on mouse leave
        scene.addEventListener('mouseleave', () => {
            sign.style.transform = `rotateX(10deg) rotateY(-15deg) translateY(-20px)`;
            shadow.style.transform = `translate(-50%, 220px) rotateX(90deg) scale(1.2)`;
            shadow.style.opacity = 0.4;
        });
    </script>
</body>
</html>
