<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signage — Studio Product Visual</title>
    <style>
        :root {
            /* Palette */
            --bg-gradient-top: #F0F2F5;
            --bg-gradient-bot: #D8DCE3;
            --bg-floor: #D1D5DB;
            
            --sign-white: #FFFFFF;
            --sign-edge: #E5E5E5;
            --sign-edge-shadow: #9CA3AF;
            
            --brand-red: #EF4444;
            --brand-red-dark: #B91C1C;
            
            --metal-light: #F3F4F6;
            --metal-base: #9CA3AF;
            --metal-dark: #4B5563;
            
            /* Typography */
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-gradient-top);
            color: #111827;
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Studio Environment --- */
        .studio-environment {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Clean studio gradient */
            background: radial-gradient(circle at 50% 30%, var(--bg-gradient-top), var(--bg-gradient-bot) 70%, var(--bg-floor) 100%);
            perspective: 2000px; /* Deep perspective for realistic 3D scaling */
            overflow: hidden;
        }

        /* Subtle vignette */
        .studio-environment::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.15) 100%);
            pointer-events: none;
            z-index: 10;
        }

        /* --- The Sign Object Container --- */
        .sign-stage {
            position: relative;
            width: 420px;
            height: 560px;
            /* Hero angle: Slight tilt for presence */
            transform: rotateX(8deg) rotateY(-5deg);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 20;
        }

        /* --- 3D Construction --- */
        
        /* 1. The Physical Body */
        .sign-body {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            transform-style: preserve-3d;
            /* Main Drop Shadow for the whole object */
            box-shadow: 0 40px 80px -10px rgba(0,0,0,0.25);
        }

        /* The Front Face (Pristine White) */
        .sign-face {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-white);
            border-radius: 20px;
            transform: translateZ(24px); /* Thickness depth */
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Subtle sheen to suggest material */
            background: linear-gradient(160deg, #ffffff 0%, #f9fafb 100%);
            /* Inner shadow to define the face against the edge */
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }

        /* The Extrusion (Thickness) - Constructed via layered shadows to match rounded corners */
        .sign-edge {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: transparent;
            transform: translateZ(0px);
            z-index: -1;
            /* Layered shadows to create a solid 3D block effect */
            box-shadow: 
                2px 2px 0px var(--sign-edge), 
                4px 4px 0px var(--sign-edge), 
                6px 6px 0px var(--sign-edge), 
                8px 8px 0px var(--sign-edge), 
                10px 10px 0px var(--sign-edge),
                12px 12px 0px var(--sign-edge),
                14px 14px 0px var(--sign-edge),
                16px 16px 0px var(--sign-edge),
                18px 18px 0px var(--sign-edge),
                20px 20px 0px var(--sign-edge),
                22px 22px 0px var(--sign-edge),
                24px 24px 0px var(--sign-edge-shadow); /* Darkest edge */
        }

        /* 2. The Emblem (Red Play Button) */
        .emblem-container {
            width: 220px;
            height: 220px;
            position: relative;
            z-index: 5;
            /* Drop shadow on the face */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        /* 3. Mounting Hardware (Industrial Stand) */
        .hardware-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            transform: translateZ(26px); /* Sits slightly in front of sign face */
        }

        /* --- Floor Shadow (Grounding) --- */
        .floor-shadow {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%) rotateX(90deg);
            width: 400px;
            height: 120px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            opacity: 0.9;
            filter: blur(8px);
        }

        /* --- Typography / Label --- */
        .ui-overlay {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            text-align: center;
            /* Shadow to separate text from floor gradient */
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        .ui-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #374151;
            margin-bottom: 6px;
        }

        .ui-sub {
            font-size: 0.8rem;
            font-weight: 500;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .sign-stage {
                width: 300px;
                height: 400px;
            }
            .emblem-container {
                width: 160px;
                height: 160px;
            }
            .ui-overlay { bottom: 30px; }
        }

    </style>
</head>
<body>

    <div class="studio-environment">
        
        <div class="sign-stage" id="signStage">
            <div class="sign-body">
                <!-- 3D Thickness Edge -->
                <div class="sign-edge"></div>

                <!-- Main Face -->
                <div class="sign-face">
                    <!-- Emblem -->
                    <div class="emblem-container">
                        <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <!-- Glossy Red Gradient -->
                                <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FF4D4D" />
                                    <stop offset="40%" stop-color="#EF4444" />
                                    <stop offset="100%" stop-color="#B91C1C" />
                                </linearGradient>
                                <!-- Inner Bevel for Emblem -->
                                <filter id="emblemBevel">
                                    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
                                    <feSpecularLighting in="blur" surfaceScale="5" specularConstant=".75" specularExponent="20" lighting-color="#ffaaaa" result="specOut">
                                        <fePointLight x="-50" y="-50" z="200"/>
                                    </feSpecularLighting>
                                    <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
                                    <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
                                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
                                </filter>
                            </defs>

                            <!-- Circle Base -->
                            <circle cx="100" cy="100" r="90" fill="url(#redGrad)" filter="url(#emblemBevel)" />
                            
                            <!-- White Triangle (Play Icon) -->
                            <!-- Centered geometrically -->
                            <path d="M85 65 L145 100 L85 135 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <!-- Hardware Layer (Industrial Stand) -->
                <svg class="hardware-layer" viewBox="0 0 420 560" preserveAspectRatio="none">
                    <defs>
                        <!-- Metal Gradient -->
                        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#9CA3AF" />
                            <stop offset="20%" stop-color="#F3F4F6" /> <!-- Highlight -->
                            <stop offset="50%" stop-color="#D1D5DB" />
                            <stop offset="80%" stop-color="#9CA3AF" />
                            <stop offset="100%" stop-color="#4B5563" /> <!-- Shadow -->
                        </linearGradient>
                        <!-- Screw Hole Gradient -->
                        <radialGradient id="holeGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="70%" stop-color="#1F2937" />
                            <stop offset="100%" stop-color="#374151" />
                        </radialGradient>
                        <filter id="hardwareShadow">
                            <feDropShadow dx="1" dy="2" stdDeviation="1" flood-opacity="0.3"/>
                        </filter>
                    </defs>

                    <!-- Vertical Mounting Rail (Back of sign) -->
                    <g filter="url(#hardwareShadow)">
                        <rect x="180" y="60" width="60" height="440" rx="6" fill="url(#metalGrad)" />
                        <!-- Rail Texture Lines -->
                        <line x1="210" y1="60" x2="210" y2="500" stroke="#6B7280" stroke-width="1" opacity="0.3" />
                    </g>

                    <!-- Top Mounting Bracket -->
                    <g transform="translate(180, 80)">
                        <rect x="0" y="0" width="60" height="24" rx="4" fill="#374151" />
                        <!-- Screw -->
                        <circle cx="30" cy="12" r="6" fill="#111" />
                        <circle cx="30" cy="12" r="3" fill="#333" />
                        <line x1="28" y1="12" x2="32" y2="12" stroke="#000" stroke-width="1" />
                    </g>

                    <!-- Bottom Mounting Bracket -->
                    <g transform="translate(180, 460)">
                        <rect x="0" y="0" width="60" height="24" rx="4" fill="#374151" />
                        <!-- Screw -->
                        <circle cx="30" cy="12" r="6" fill="#111" />
                        <circle cx="30" cy="12" r="3" fill="#333" />
                        <line x1="28" y1="12" x2="32" y2="12" stroke="#000" stroke-width="1" />
                    </g>
                </svg>
            </div>
        </div>

        <!-- Ground Shadow -->
        <div class="floor-shadow"></div>

        <!-- Typography -->
        <div class="ui-overlay">
            <div class="ui-title">PLAY_BUTTON_SGN</div>
            <div class="ui-sub">Series 400 • Matte White</div>
        </div>

    </div>

    <script>
        // Interaction: Subtle Parallax
        const stage = document.querySelector('.studio-environment');
        const sign = document.getElementById('signStage');
        const shadow = document.querySelector('.floor-shadow');

        stage.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = (e.clientY / window.innerHeight) * 2 - 1;

            // Rotate sign slightly based on mouse
            // Range: -8deg to 8deg
            const rotY = x * 8;
            const rotX = 8 - (y * 8); // Invert Y logic for natural tilt

            sign.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            // Move shadow slightly opposite to light source logic
            shadow.style.transform = `translateX(calc(-50% + ${x * 30}px)) rotateX(90deg)`;
        });

        // Reset on leave
        stage.addEventListener('mouseleave', () => {
            sign.style.transform = `rotateX(8deg) rotateY(-5deg)`;
            shadow.style.transform = `translateX(-50%) rotateX(90deg)`;
        });
    </script>
</body>
</html>
