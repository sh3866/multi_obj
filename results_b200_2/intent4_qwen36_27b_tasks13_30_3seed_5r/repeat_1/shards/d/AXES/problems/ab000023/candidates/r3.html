<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signage — Studio Product Visual</title>
    <style>
        :root {
            /* Environment Palette */
            --wall-top: #E2E8F0;
            --wall-bot: #CBD5E1;
            --floor-top: #94A3B8;
            --floor-bot: #64748B;
            --horizon: #C4CDD5;

            /* Object Palette */
            --sign-face: #FFFFFF;
            --sign-side: #E2E8F0;
            --sign-shadow: #94A3B8;
            
            /* Brand Palette */
            --brand-red: #E60023;
            --brand-red-dark: #990016;
            --brand-red-light: #FF4D6D;

            /* Hardware Palette (Matte/Industrial) */
            --hw-base: #334155;
            --hw-dark: #0F172A;
            --hw-metal: #94A3B8;

            /* Typography */
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--wall-bot);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Studio Environment (The Room) --- */
        .studio-environment {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2400px;
            overflow: hidden;
            /* Wall */
            background: linear-gradient(to bottom, var(--wall-top) 0%, var(--wall-bot) 55%, var(--horizon) 55%, var(--floor-top) 55.5%, var(--floor-bot) 100%);
        }

        /* Horizon Line / Baseboard */
        .studio-environment::before {
            content: '';
            position: absolute;
            top: 55%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,0.05);
            z-index: 1;
        }

        /* Vignette */
        .studio-environment::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(15, 23, 42, 0.2) 100%);
            pointer-events: none;
            z-index: 10;
        }

        /* --- The Sign Object Container --- */
        .sign-stage {
            position: relative;
            /* Proportions: 2:3 Poster Style */
            width: 400px;
            height: 600px;
            transform-style: preserve-3d;
            /* Initial Pose */
            transform: rotateX(5deg) rotateY(-10deg);
            transition: transform 0.1s linear; /* Fast response for parallax */
            z-index: 20;
        }

        /* --- 3D Construction Layers --- */
        
        /* 1. The Physical Body (Face) */
        .sign-face {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: var(--sign-face);
            /* Matte finish with subtle lighting gradient */
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            transform: translateZ(20px);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 2. The Extrusion (Thickness) */
        /* Using a pseudo-element on the container to create the solid block behind the face */
        .sign-stage::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: var(--sign-side);
            transform: translateZ(0px);
            /* Lighting on the side */
            box-shadow: inset -4px 0px 10px rgba(0,0,0,0.1); 
        }

        /* 3. The Emblem (Red Play Button) */
        .emblem-container {
            width: 240px; /* Dominant Scale */
            height: 240px;
            position: relative;
            z-index: 5;
            /* Soft shadow to lift from matte face */
            filter: drop-shadow(0 12px 16px rgba(0,0,0,0.15));
        }

        /* 4. Mounting Hardware (Minimal Industrial) */
        /* Moved to the side/bottom to unblock the emblem */
        .hardware-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15; /* Between face and edge */
            transform: translateZ(10px);
        }

        /* --- Floor Shadow --- */
        .floor-shadow {
            position: absolute;
            bottom: -100px;
            left: 50%;
            width: 420px;
            height: 100px;
            /* Transforms to lie on the floor plane */
            transform-origin: top center;
            transform: translateX(-50%) rotateX(90deg);
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            filter: blur(12px);
        }

        /* --- Typography / Label --- */
        .ui-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .ui-title {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #334155;
            text-transform: uppercase;
        }

        .ui-sub {
            font-size: 0.7rem;
            font-weight: 500;
            color: #64748B;
            letter-spacing: 0.05em;
            opacity: 0.8;
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .sign-stage {
                width: 300px;
                height: 450px;
            }
            .emblem-container {
                width: 180px;
                height: 180px;
            }
        }

    </style>
</head>
<body>

    <div class="studio-environment">
        
        <div class="sign-stage" id="signStage">
            
            <!-- Main Face -->
            <div class="sign-face">
                
                <!-- Emblem (Centered, Dominant) -->
                <div class="emblem-container">
                    <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Premium Glossy Red Gradient -->
                            <radialGradient id="redGloss" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#FF4D6D" />
                                <stop offset="50%" stop-color="#E60023" />
                                <stop offset="100%" stop-color="#990016" />
                            </radialGradient>
                            
                            <!-- Convex Filter for 3D Button feel -->
                            <filter id="convex3D" x="-20%" y="-20%" width="140%" height="140%">
                                <!-- Drop Shadow -->
                                <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" result="drop"/>
                                
                                <!-- Inner Shadow for depth -->
                                <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
                                <feOffset dx="2" dy="4" result="offsetBlur"/>
                                <feComposite in="SourceAlpha" in2="offsetBlur" operator="out" result="inverse"/>
                                <feFlood flood-color="black" flood-opacity="0.15" result="color"/>
                                <feComposite in="color" in2="inverse" operator="in" result="shadow"/>
                                
                                <!-- Inner Highlight (Bevel) -->
                                <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur2"/>
                                <feOffset dx="-2" dy="-2" result="offsetBlur2"/>
                                <feComposite in="SourceAlpha" in2="offsetBlur2" operator="out" result="inverse2"/>
                                <feFlood flood-color="white" flood-opacity="0.6" result="color2"/>
                                <feComposite in="color2" in2="inverse2" operator="in" result="highlight"/>

                                <!-- Merge -->
                                <feMerge>
                                    <feMergeNode in="drop"/>
                                    <feMergeNode in="SourceGraphic"/>
                                    <feMergeNode in="shadow"/>
                                    <feMergeNode in="highlight"/>
                                </feMerge>
                            </filter>
                        </defs>

                        <!-- Red Circle Base -->
                        <circle cx="100" cy="100" r="95" fill="url(#redGloss)" filter="url(#convex3D)" />
                        
                        <!-- Play Triangle (White) -->
                        <!-- Geometrically centered: width 60, height 104 approx. -->
                        <path d="M82 62 L142 100 L82 138 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

            <!-- Hardware Layer (Minimal, Non-obstructive, Matte) -->
            <!-- Positioned: Left side vertical rail, Bottom support -->
            <svg class="hardware-layer" viewBox="0 0 400 600" preserveAspectRatio="none">
                <defs>
                    <!-- Matte Metal Gradient -->
                    <linearGradient id="matteMetal" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1E293B" />
                        <stop offset="50%" stop-color="#475569" />
                        <stop offset="100%" stop-color="#1E293B" />
                    </linearGradient>
                    
                    <!-- Dark Bracket Gradient -->
                    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#334155" />
                        <stop offset="100%" stop-color="#0F172A" />
                    </linearGradient>
                </defs>

                <!-- Vertical Rail (Left Edge) -->
                <g transform="translate(30, 100)">
                    <!-- Rail Body -->
                    <rect x="0" y="0" width="16" height="400" rx="4" fill="url(#matteMetal)" />
                    <!-- Rail Shadow -->
                    <rect x="16" y="0" width="6" height="400" fill="rgba(0,0,0,0.2)" filter="blur(2px)"/>
                </g>

                <!-- Bottom Support Bracket -->
                <g transform="translate(30, 480)">
                    <!-- Bracket Body -->
                    <rect x="0" y="0" width="160" height="12" rx="2" fill="url(#bracketGrad)" />
                    <!-- Bracket Shadow -->
                    <rect x="0" y="12" width="160" height="15" fill="rgba(0,0,0,0.15)" filter="blur(3px)"/>
                    
                    <!-- Connecting Bolt -->
                    <circle cx="16" cy="6" r="4" fill="#000" />
                </g>
            </svg>
        </div>

        <!-- Ground Shadow -->
        <div class="floor-shadow"></div>

        <!-- Typography -->
        <div class="ui-overlay">
            <div class="ui-title">Play Button Sign</div>
            <div class="ui-sub">Series 400 • Matte White • 24mm</div>
        </div>

    </div>

    <script>
        // Interaction: Subtle Parallax for "Studio" feel
        const stage = document.querySelector('.studio-environment');
        const sign = document.getElementById('signStage');
        const shadow = document.querySelector('.floor-shadow');

        stage.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = (e.clientY / window.innerHeight) * 2 - 1;

            // Rotate sign slightly based on mouse
            // Limits: X: -5 to 15, Y: -15 to 5
            const rotY = -10 + (x * 10); 
            const rotX = 5 - (y * 8); 

            sign.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            // Move shadow slightly opposite to light source logic
            // Shadow moves left when object tilts right
            shadow.style.transform = `translateX(calc(-50% + ${x * -40}px)) rotateX(90deg)`;
        });

        // Reset on leave
        stage.addEventListener('mouseleave', () => {
            sign.style.transform = `rotateX(5deg) rotateY(-10deg)`;
            shadow.style.transform = `translateX(-50%) rotateX(90deg)`;
        });
    </script>
</body>
</html>
