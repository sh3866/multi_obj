<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        /* 
         * DESIGN SYSTEM & RESET
         * Focus: Diegetic UI, Unified Geometry (16px radius), Semantic Colors
         */
        :root {
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #E1F5FE;
            --c-primary: #FF6F00; /* Bouncy Orange */
            --c-primary-dark: #E65100;
            --c-accent: #0288D1; /* Bolt Blue */
            --c-gold: #FFD700;
            --c-gold-dark: #FFA000;
            --c-wood: #8D6E63;
            --c-wood-dark: #5D4037;
            --c-text: #263238;
            --c-white: #FFFFFF;
            --c-locked: #90A4AE;
            --radius-ui: 16px; /* Unified Geometry */
            --font-head: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
            background: #000;
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 1fr;
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, var(--c-sky-top) 0%, var(--c-sky-bot) 100%);
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        /* UI LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none; 
        }
        .ui-interactive {
            pointer-events: auto;
        }

        /* HEADER: TITLE & STATS */
        header {
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand {
            display: flex;
            flex-direction: column;
            transform: skewX(-5deg);
        }
        
        h1 {
            font-family: var(--font-head);
            font-size: 3.5rem;
            color: var(--c-white);
            text-transform: uppercase;
            /* Unified Shadow Style */
            filter: drop-shadow(4px 4px 0px var(--c-primary));
            line-height: 0.9;
        }
        
        .subtitle {
            font-family: var(--font-head);
            color: var(--c-accent);
            font-size: 1.2rem;
            background: var(--c-white);
            padding: 4px 16px;
            border-radius: var(--radius-ui);
            border: 2px solid var(--c-text);
            display: inline-block;
            margin-top: 8px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }

        .stats-bar {
            display: flex;
            gap: 15px;
        }

        .stat-pill {
            background: var(--c-white);
            padding: 8px 16px;
            border-radius: var(--radius-ui);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            border: 2px solid var(--c-text);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
            font-size: 1.1rem;
        }

        /* RIGHT PANEL: WORLD SELECTOR (Diegetic Map) */
        .world-map {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-end;
        }

        .world-node {
            width: 220px;
            height: 70px;
            background: var(--c-white);
            border: 2px solid var(--c-text);
            border-radius: var(--radius-ui);
            display: flex;
            align-items: center;
            padding: 0 15px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            position: relative;
        }

        .world-node::after {
            /* Visual connector line */
            content: '';
            position: absolute;
            left: 50%;
            bottom: -22px;
            width: 4px;
            height: 22px;
            background: var(--c-text);
            z-index: -1;
        }
        .world-node:last-child::after { display: none; }

        .world-node:hover {
            transform: translateY(-5px);
            box-shadow: 0 11px 0 rgba(0,0,0,0.1);
        }

        .world-node.active {
            background: var(--c-primary);
            border-color: var(--c-primary-dark);
            color: white;
            transform: scale(1.05) translateX(-10px);
            box-shadow: 6px 6px 0 var(--c-text);
        }
        
        .world-node.active h3 { color: white; }
        .world-node.active p { color: rgba(255,255,255,0.8); }

        .world-node.locked {
            background: #ECEFF1;
            opacity: 0.7;
            cursor: not-allowed;
        }

        .world-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid var(--c-text);
            flex-shrink: 0;
        }
        .w1 .world-icon { background: #81C784; }
        .w2 .world-icon { background: #FFB74D; }
        .w3 .world-icon { background: #4DD0E1; }

        .world-info h3 { font-size: 1rem; margin-bottom: 2px; color: var(--c-text); font-family: var(--font-head); }
        .world-info p { font-size: 0.8rem; color: #666; }
        .world-node.active .world-info p { color: #FFF; }

        /* BOTTOM LEFT: CONTROLS */
        .controls-guide {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
        }

        .key-cluster {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px;
            gap: 8px;
        }

        .key {
            width: 50px;
            height: 50px;
            background: var(--c-white);
            border: 2px solid var(--c-text);
            border-radius: var(--radius-ui);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
            font-family: var(--font-head);
        }

        .d-pad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px;
            gap: 6px;
        }
        .d-pad .key:nth-child(1) { grid-column: 2; grid-row: 1; } /* W */
        .d-pad .key:nth-child(2) { grid-column: 1; grid-row: 2; } /* A */
        .d-pad .key:nth-child(3) { grid-column: 2; grid-row: 2; } /* S */
        .d-pad .key:nth-child(4) { grid-column: 3; grid-row: 2; } /* D */

        .action-keys {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .key.action {
            background: var(--c-primary);
            color: white;
            width: 120px; /* Wider key */
            height: 50px;
            border-radius: var(--radius-ui);
        }

        /* BOTTOM CENTER: START BUTTON (Diegetic Spring) */
        .cta-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            /* Push it up slightly so it sits on the ground drawn in canvas */
            margin-bottom: 140px; 
        }

        .btn-start {
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-head);
            font-size: 1.8rem;
            text-transform: uppercase;
            padding: 12px 60px;
            border: 3px solid var(--c-text);
            border-radius: var(--radius-ui);
            cursor: pointer;
            box-shadow: 0 8px 0 var(--c-text), 0 15px 20px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            transition: all 0.1s;
            position: relative;
            z-index: 20;
            width: 300px;
            text-align: center;
        }

        .btn-start:hover {
            background: var(--c-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 0 var(--c-text), 0 15px 20px rgba(0,0,0,0.3);
        }

        .btn-start:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--c-text);
        }

        /* Diegetic Spring Base under button */
        .spring-base {
            width: 160px;
            height: 60px;
            background: #90A4AE;
            border: 3px solid var(--c-text);
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin-top: -15px; /* Tuck under button */
            position: relative;
            z-index: 19;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 10px,
                var(--c-text) 10px,
                var(--c-text) 14px
            );
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .world-map {
                position: relative;
                top: auto; right: auto;
                flex-direction: row;
                justify-content: center;
                transform: none;
                margin-top: 20px;
                flex-wrap: wrap;
            }
            .world-node::after { display: none; }
            .world-node { width: 160px; height: 50px; }
            .controls-guide { display: none; } /* Hide on small screens for simplicity */
            h1 { font-size: 2.5rem; }
            .cta-container { margin-bottom: 120px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <header class="ui-layer">
        <div class="brand">
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </div>
        <div class="stats-bar ui-interactive">
            <div class="stat-pill">
                <svg class="icon" style="width:24px;height:24px;" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" fill="#FFD700" stroke="#263238" stroke-width="2"/>
                    <path d="M12 6 L12 18" stroke="#F57F17" stroke-width="2"/>
                </svg>
                <span>1,240</span>
            </div>
            <div class="stat-pill">
                <svg class="icon" style="width:24px;height:24px;" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D32F2F" stroke="#263238" stroke-width="2"/>
                </svg>
                <span>5</span>
            </div>
        </div>
    </header>

    <!-- RIGHT: WORLD MAP (Diegetic) -->
    <aside class="world-map ui-layer ui-interactive">
        <div class="world-node w1 active">
            <div class="world-icon"></div>
            <div class="world-info">
                <h3>Spring Valley</h3>
                <p>Level 1-1</p>
            </div>
        </div>
        <div class="world-node w2 locked">
            <div class="world-icon"></div>
            <div class="world-info">
                <h3>Sand Springs</h3>
                <p>Locked</p>
            </div>
        </div>
        <div class="world-node w3 locked">
            <div class="world-icon"></div>
            <div class="world-info">
                <h3>Cloud Peak</h3>
                <p>Locked</p>
            </div>
        </div>
    </aside>

    <!-- CENTER: START BUTTON -->
    <div class="cta-container ui-layer">
        <button class="btn-start ui-interactive">Start Adventure</button>
        <div class="spring-base"></div>
    </div>

    <!-- LEFT: CONTROLS (Diegetic) -->
    <aside class="controls-guide ui-layer">
        <div class="key-cluster">
            <div class="d-pad">
                <div class="key">W</div>
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
            </div>
            <div class="action-keys">
                <div class="key action">SPACE</div>
                <div style="font-size:0.7rem; font-weight:bold; color:var(--c-text); margin-top:2px;">JUMP</div>
            </div>
        </div>
    </aside>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE
     * Draws the parallax background, platforms, and hero.
     * Focus: Depth, Layering, and Expressiveness.
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    // Resize handler
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Colors
    const C_GROUND = '#5D4037';
    const C_GRASS = '#7CB342';
    const C_GRASS_LIGHT = '#AED581';
    const C_BLOCK = '#8D6E63';
    const C_BLOCK_DARK = '#4E342E';
    const C_HERO = '#FF6F00';

    // Helper: Draw a rounded rect
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // Helper: Draw a classic block
    function drawBlock(x, y, size) {
        ctx.fillStyle = C_BLOCK;
        ctx.fillRect(x, y, size, size);
        // Bevel
        ctx.fillStyle = '#A1887F';
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        ctx.fillStyle = C_BLOCK_DARK;
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);
        // Question mark
        ctx.fillStyle = '#3E2723';
        ctx.font = 'bold ' + (size/2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 2);
    }

    // Helper: Draw Gold Block
    function drawGoldBlock(x, y, size, offset) {
        ctx.fillStyle = '#FFCA28';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = '#FFF59D';
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        ctx.fillStyle = '#FF8F00';
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);
        
        const pulse = Math.sin((frame + offset) * 0.1) * 0.2 + 0.8;
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold ' + (size/1.8) + 'px sans-serif';
        ctx.fillText('?', x + size/2, y + size/2 + 2);
    }

    // Helper: Draw Ground with depth
    function drawGround(y, h) {
        // Main Dirt
        ctx.fillStyle = C_GROUND;
        ctx.fillRect(0, y, width, h);
        
        // Grass Top
        ctx.fillStyle = C_GRASS;
        ctx.fillRect(0, y, width, 20);
        
        // Grass Highlights
        ctx.fillStyle = C_GRASS_LIGHT;
        for(let i=0; i<width; i+=40) {
            ctx.fillRect(i, y, 20, 6);
        }
    }

    // Helper: Draw Cloud
    function drawCloud(x, y, scale) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 10 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 50 * scale, y, 30 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    // Helper: Draw Coin
    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 3;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 5, 4, 10); 
    }

    // Helper: Draw Flag
    function drawFlag(x, y, h) {
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 6, h);
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(x+3, y, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+6, y+10);
        ctx.lineTo(x+60, y+30);
        ctx.lineTo(x+6, y+50);
        ctx.fill();
    }

    // Helper: Draw Hero (Expressive, Bouncy)
    function drawHero(x, y) {
        const bounceY = Math.abs(Math.sin(frame * 0.05)) * 20;
        const squash = Math.abs(Math.sin(frame * 0.1)) * 5;
        
        const heroX = x;
        const heroY = y - bounceY;

        // Shadow (scales with height)
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        const shadowScale = 1 - (bounceY / 60);
        ctx.ellipse(x, y, 40 * shadowScale, 10 * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // Spring Base
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(heroX - 20, heroY + 40, 40, 20);
        ctx.fillStyle = '#78909C';
        ctx.fillRect(heroX - 20, heroY + 40, 40, 5); // Highlight

        // Body (Circle)
        ctx.fillStyle = C_HERO;
        ctx.beginPath();
        // Squash and stretch logic
        ctx.ellipse(heroX, heroY, 45 - squash, 45 + squash, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Face Mask
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(heroX, heroY - 5, 30, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#263238';
        ctx.beginPath();
        ctx.arc(heroX - 10, heroY - 5, 4, 0, Math.PI*2);
        ctx.arc(heroX + 10, heroY - 5, 4, 0, Math.PI*2);
        ctx.fill();

        // Smile
        ctx.beginPath();
        ctx.arc(heroX, heroY + 5, 10, 0, Math.PI, false);
        ctx.stroke();
    }

    // SCENE OBJECTS
    const clouds = [
        {x: 100, y: 150, s: 1},
        {x: 400, y: 100, s: 0.8},
        {x: 800, y: 180, s: 1.2},
        {x: 1100, y: 120, s: 0.9}
    ];

    // Main Loop
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // Calculate Layout based on screen size to keep Hero on Left and Goal on Right
        const groundY = height - 150; // Base ground level
        const heroX = width * 0.25; // Hero at 25% width
        const blockSize = 50;

        // 1. Draw Clouds (Parallax)
        clouds.forEach(c => {
            let moveX = c.x + Math.sin(frame * 0.005 + c.x) * 20;
            drawCloud(moveX, c.y, c.s);
        });

        // 2. Draw Distant Mountains
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 150);
        ctx.lineTo(width * 0.5, groundY - 50);
        ctx.lineTo(width * 0.8, groundY - 200);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // 3. Draw Ground
        drawGround(groundY, height - groundY);

        // 4. Draw Platforms (Layered)
        // Platform 1 (Under Hero)
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, groundY - 100, 400, 100);
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(0, groundY - 100, 400, 20);
        
        // Platform 2 (Mid)
        const plat2X = width * 0.4;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat2X, groundY - 180, 200, 50);
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(plat2X, groundY - 180, 200, 20);

        // Platform 3 (High/Goal)
        const plat3X = width * 0.7;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat3X, groundY - 250, 300, 250);
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(plat3X, groundY - 250, 300, 20);

        // 5. Draw Blocks
        drawBlock(plat2X + 20, groundY - 240, blockSize);
        drawGoldBlock(plat2X + 80, groundY - 240, blockSize, 10);
        drawBlock(plat2X + 140, groundY - 240, blockSize);

        // 6. Draw Coins
        drawCoin(plat2X + 105, groundY - 290, 10);
        drawCoin(plat2X + 105, groundY - 330, 10);

        // 7. Draw Flag (Goal)
        drawFlag(plat3X + 200, groundY - 400, 150);

        // 8. Draw Hero (Interactive, Bouncy)
        // Position hero on the first platform
        drawHero(heroX, groundY - 100);

        requestAnimationFrame(loop);
    }

    loop();

</script>
</body>
</html>
