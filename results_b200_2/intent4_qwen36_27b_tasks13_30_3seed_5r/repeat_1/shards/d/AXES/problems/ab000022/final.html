<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        /* 
         * DESIGN SYSTEM REVISED (V4)
         * Focus: Visual Hierarchy, Cohesive Geometry, 
         * Parallax Depth, and "Spring" Physics.
         */
        :root {
            /* Palette: Vibrant, High Contrast */
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #E1F5FE;
            
            /* Hero & Accents */
            --c-hero: #FF6D00;
            --c-hero-dark: #E65100;
            --c-accent: #FFEA00; /* Bright Yellow */
            --c-accent-dark: #FBC02D;
            
            /* UI Materials */
            --c-paper: #FFFFFF;
            --c-ink: #1A237E; /* Deep Indigo for high contrast against bright colors */
            --c-dirt: #795548;
            --c-grass: #76FF03; /* Neon-ish green for vibrancy */
            --c-grass-dark: #64DD17;

            /* Unified Geometry: 16px radius for cards, 40px for buttons */
            --radius-card: 16px;
            --radius-btn: 40px;

            /* Shadows: "Sticker" Style (Offset solid shadow + white border) */
            --shadow-sticker: 
                0 0 0 4px var(--c-ink),
                8px 8px 0 rgba(0,0,0,0.2);
            
            --shadow-btn: 
                0 0 0 4px var(--c-ink),
                0 10px 0 var(--c-ink),
                0 20px 20px rgba(0,0,0,0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Verdana', 'Segoe UI', sans-serif;
            background: #1a1a1a;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* LAYOUT: Composition Balance */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI LAYER */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none; 
        }
        .ui-interactive {
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* HEADER: TOP LEFT (Balanced Anchor) */
        header {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 20;
            transform: rotate(-2deg);
        }
        
        h1 {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 5rem;
            color: var(--c-accent);
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
            /* Sticker Text Effect */
            -webkit-text-stroke: 3px var(--c-ink);
            paint-order: stroke fill;
            text-shadow: 
                0 8px 0 var(--c-ink),
                6px 10px 0 rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-family: 'Arial Black', sans-serif;
            color: var(--c-paper);
            font-size: 1.2rem;
            background: var(--c-hero);
            padding: 10px 20px;
            border-radius: 30px;
            border: 4px solid var(--c-ink);
            margin-top: 15px;
            margin-left: 10px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            transform: rotate(1deg);
        }

        /* RIGHT COLUMN: Unified Container for Stats & World Selector */
        .right-column {
            position: absolute;
            right: 60px;
            top: 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 30px;
            width: 260px;
        }

        /* STATS DASHBOARD (Top Right) */
        .stats-dashboard {
            background: var(--c-paper);
            border-radius: var(--radius-card);
            padding: 15px;
            box-shadow: var(--shadow-sticker);
            display: flex;
            justify-content: space-between;
            width: 100%;
            transform: rotate(1deg);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .stat-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid var(--c-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .icon-coin { background: #FFD700; }
        .icon-star { background: #4FC3F7; }
        .icon-gem { background: #E040FB; }

        .stat-val {
            font-family: 'Arial Black', sans-serif;
            font-size: 1.2rem;
            color: var(--c-ink);
        }

        /* WORLD SELECTOR: Unified "Tower" */
        .world-tower {
            position: relative;
            background: rgba(255,255,255,0.1); /* Subtle container */
            border-radius: var(--radius-card);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* The Connecting Spring Line */
        .tower-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 16px;
            background: repeating-linear-gradient(
                to bottom,
                var(--c-ink) 0,
                var(--c-ink) 6px,
                transparent 6px,
                transparent 14px
            );
            z-index: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px;
            opacity: 0.3;
        }

        .world-node {
            width: 220px;
            padding: 12px;
            background: var(--c-paper);
            border-radius: var(--radius-card);
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            box-shadow: var(--shadow-sticker);
            transition: transform 0.2s;
        }

        .world-node:hover {
            transform: scale(1.05) rotate(-1deg);
        }

        .world-node.active {
            background: var(--c-accent);
            transform: scale(1.1) rotate(1deg);
            box-shadow: 0 0 0 4px var(--c-ink), 10px 10px 0 rgba(0,0,0,0.2);
        }
        
        .world-node.locked {
            background: #ECEFF1;
            opacity: 0.7;
        }

        .world-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 3px solid var(--c-ink);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial Black', sans-serif;
            font-size: 1.4rem;
            color: var(--c-ink);
            flex-shrink: 0;
        }
        .w1 .world-icon { background: #A5D6A7; }
        .w2 .world-icon { background: #FFCC80; }
        .w3 .world-icon { background: #80DEEA; }

        .world-info h3 { 
            font-family: 'Arial Black', sans-serif; 
            font-size: 0.9rem; 
            color: var(--c-ink); 
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 2px;
        }
        .world-info p { font-size: 0.7rem; font-weight: bold; color: #546E7A; text-transform: uppercase; }
        .world-node.active .world-info p { color: var(--c-hero-dark); }

        /* START BUTTON: Elevated & Prominent */
        .cta-container {
            position: absolute;
            bottom: 80px; /* Lifted up */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 30;
        }

        .btn-start {
            background: var(--c-accent);
            color: var(--c-ink);
            font-family: 'Arial Black', sans-serif;
            font-size: 2.2rem;
            text-transform: uppercase;
            padding: 24px 80px;
            border-radius: var(--radius-btn);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            text-shadow: 0 2px 0 rgba(255,255,255,0.5);
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            /* Spring Animation */
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .btn-start:hover {
            background: #FFF176;
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 0 0 4px var(--c-ink), 0 25px 0 var(--c-ink), 0 35px 30px rgba(0,0,0,0.3);
        }

        .btn-start:active {
            transform: translateY(5px) scale(0.98);
            box-shadow: 0 0 0 4px var(--c-ink), 0 5px 0 var(--c-ink), 0 10px 10px rgba(0,0,0,0.3);
        }

        /* CONTROLS: Bottom Left (Separated from CTA) */
        .controls-guide {
            position: absolute;
            bottom: 40px;
            left: 60px;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            opacity: 0.9;
            transform: rotate(-2deg);
        }

        .key {
            width: 50px;
            height: 50px;
            background: var(--c-paper);
            border: 4px solid var(--c-ink);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--c-ink);
            box-shadow: 4px 4px 0 var(--c-ink);
            position: relative;
        }
        
        .key.wide { width: 120px; }
        
        .key span {
            font-size: 0.6rem;
            text-transform: uppercase;
            position: absolute;
            bottom: -20px;
            color: var(--c-ink);
            font-weight: bold;
            background: var(--c-paper);
            padding: 2px 6px;
            border-radius: 4px;
            border: 2px solid var(--c-ink);
        }

        /* Responsive */
        @media (max-width: 900px) {
            header { top: 30px; left: 30px; }
            h1 { font-size: 3rem; }
            .right-column { display: none; }
            .controls-guide { display: none; }
            .cta-container { bottom: 40px; }
            .btn-start { font-size: 1.5rem; padding: 20px 50px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <header class="ui-layer">
        <div class="brand">
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </div>
    </header>

    <!-- RIGHT COLUMN: Unified Stats & Map -->
    <aside class="right-column ui-layer">
        
        <!-- Stats Dashboard -->
        <div class="stats-dashboard ui-interactive">
            <div class="stat-item">
                <div class="stat-icon icon-coin">
                    <svg style="width:20px;height:20px;" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="8" fill="#FFF" stroke="#263238" stroke-width="2"/>
                        <text x="12" y="16" text-anchor="middle" font-weight="bold" font-size="12" fill="#263238">$</text>
                    </svg>
                </div>
                <span class="stat-val">1,240</span>
            </div>
            <div class="stat-item">
                <div class="stat-icon icon-star">
                    <svg style="width:20px;height:20px;" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#FFF" stroke="#263238" stroke-width="2"/>
                    </svg>
                </div>
                <span class="stat-val">85</span>
            </div>
            <div class="stat-item">
                <div class="stat-icon icon-gem">
                    <svg style="width:20px;height:20px;" viewBox="0 0 24 24">
                        <path d="M11.5 2l-8 5 1.5 10 6.5 5 6.5-5 1.5-10-8-5z" fill="#FFF" stroke="#263238" stroke-width="2"/>
                    </svg>
                </div>
                <span class="stat-val">12</span>
            </div>
        </div>

        <!-- World Tower -->
        <div class="world-tower">
            <div class="tower-line"></div>
            
            <div class="world-node w1 active ui-interactive">
                <div class="world-icon">1</div>
                <div class="world-info">
                    <h3>Spring Valley</h3>
                    <p>Current World</p>
                </div>
            </div>

            <div class="world-node w2 locked">
                <div class="world-icon">2</div>
                <div class="world-info">
                    <h3>Sand Springs</h3>
                    <p>Locked</p>
                </div>
            </div>

            <div class="world-node w3 locked">
                <div class="world-icon">3</div>
                <div class="world-info">
                    <h3>Cloud Peak</h3>
                    <p>Locked</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- CENTER: START BUTTON -->
    <div class="cta-container ui-layer">
        <button class="btn-start ui-interactive">Start Adventure</button>
    </div>

    <!-- LEFT: CONTROLS -->
    <aside class="controls-guide ui-layer">
        <div class="key">W<span>Up</span></div>
        <div class="key">A<span>Left</span></div>
        <div class="key">S<span>Down</span></div>
        <div class="key">D<span>Right</span></div>
        <div class="key wide">Space<span>Jump</span></div>
    </aside>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE V4
     * Improvements:
     * 1. Cohesive Parallax Scene: Mountains, Clouds, Hills.
     * 2. Integrated Gameplay: Hero, Platforms, Enemies, Goal in one flow.
     * 3. Vibrant "Sticker" Art Style on Canvas.
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---

    function drawCloud(x, y, scale, opacity) {
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 15 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 60 * scale, y - 5 * scale, 40 * scale, 0, Math.PI * 2);
        ctx.arc(x + 85 * scale, y + 5 * scale, 25 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawBlock(x, y, size, type) {
        // Base
        ctx.fillStyle = type === 'gold' ? '#FFCA28' : '#8D6E63';
        ctx.fillRect(x, y, size, size);
        
        // Sticker Border
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#1A237E';
        ctx.strokeRect(x, y, size, size);
        
        // Inner Bevel
        ctx.fillStyle = type === 'gold' ? '#FFF59D' : '#A1887F';
        ctx.fillRect(x+4, y+4, size-8, 6);
        ctx.fillRect(x+4, y+4, 6, size-8);
        
        // Icon
        ctx.fillStyle = '#1A237E';
        ctx.font = `bold ${size/1.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(type === 'gold' ? '★' : '?', x + size/2, y + size/2 + 2);
    }

    function drawGround(y, h) {
        // Layer 1: Dirt
        ctx.fillStyle = '#795548';
        ctx.fillRect(0, y, width, h);
        
        // Layer 2: Grass Top
        ctx.fillStyle = '#76FF03';
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.lineTo(width, y + 30);
        // Wavy grass edge
        for(let i=width; i>=0; i-=40) {
            ctx.lineTo(i, y + 30 + Math.sin(i + frame*0.05)*5);
        }
        ctx.fill();
        
        // Grass Shadow
        ctx.fillStyle = '#64DD17';
        ctx.beginPath();
        ctx.moveTo(0, y+30);
        for(let i=0; i<width; i+=40) {
            ctx.lineTo(i, y + 30 + Math.sin(i + frame*0.05)*5);
        }
        ctx.lineTo(width, y+35);
        ctx.lineTo(0, y+35);
        ctx.fill();
    }

    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1 + x) * 5;
        const scaleX = Math.abs(Math.cos(frame * 0.05 + x)); // 3D rotation
        
        ctx.save();
        ctx.translate(x, y + wobble);
        ctx.scale(scaleX, 1);
        
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#1A237E';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.fillStyle = '#FFF';
        ctx.fillRect(-2, -5, 4, 10); 
        
        ctx.restore();
    }

    function drawCastle(x, y, h) {
        // Main Tower
        ctx.fillStyle = '#9FA8DA'; 
        ctx.fillRect(x, y, 70, h);
        
        // Side Towers
        ctx.fillRect(x - 50, y + 50, 50, h - 50);
        ctx.fillRect(x + 70, y + 50, 50, h - 50);
        
        // Battlements
        ctx.fillStyle = '#7986CB';
        for(let i=0; i<4; i++) {
            ctx.fillRect(x - 45 + (i*15), y + 40, 10, 10);
            ctx.fillRect(x + 10 + (i*15), y - 15, 10, 10);
            ctx.fillRect(x + 75 + (i*15), y + 40, 10, 10);
        }

        // Door
        ctx.fillStyle = '#3E2723';
        ctx.beginPath();
        ctx.moveTo(x + 20, y + h);
        ctx.lineTo(x + 20, y + h - 40);
        ctx.arc(x + 35, y + h - 40, 15, Math.PI, 0);
        ctx.lineTo(x + 50, y + h);
        ctx.fill();

        // Flag
        ctx.strokeStyle = '#1A237E';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x+35, y-15); ctx.lineTo(x+35, y-60); ctx.stroke();
        ctx.fillStyle = '#FF5252';
        ctx.beginPath();
        ctx.moveTo(x+35, y-60);
        ctx.lineTo(x+70, y-45);
        ctx.lineTo(x+35, y-30);
        ctx.fill();
    }

    function drawEnemy(x, y) {
        const squish = Math.abs(Math.sin(frame * 0.15)) * 8;
        
        ctx.fillStyle = '#FF7043'; 
        ctx.beginPath();
        ctx.moveTo(x - 25, y);
        ctx.quadraticCurveTo(x - 30, y - 40 - squish, x, y - 50 - squish);
        ctx.quadraticCurveTo(x + 30, y - 40 - squish, x + 25, y);
        ctx.fill();
        
        // Feet
        ctx.fillStyle = '#1A237E';
        const walk = Math.sin(frame * 0.2) * 8;
        ctx.beginPath(); ctx.arc(x - 15 + walk, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 15 - walk, y, 10, 0, Math.PI*2); ctx.fill();
        
        // Face
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x - 10, y - 25, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 10, y - 25, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x - 10, y - 25, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 10, y - 25, 3, 0, Math.PI*2); ctx.fill();
        
        // Eyebrows
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x-15, y-35); ctx.lineTo(x-5, y-30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+15, y-35); ctx.lineTo(x+5, y-30); ctx.stroke();
    }

    function drawHero(x, y) {
        // Physics Simulation
        const bounceY = Math.abs(Math.sin(frame * 0.08)) * 80; 
        const squash = Math.abs(Math.sin(frame * 0.16)) * 10;
        
        const heroX = x; 
        const heroY = y - bounceY;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        const shadowScale = 1 - (bounceY / 120);
        ctx.ellipse(x, y, 40 * shadowScale, 12 * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // Spring Base
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(heroX - 30, heroY + 50, 60, 20);
        ctx.fillStyle = '#78909C';
        ctx.fillRect(heroX - 30, heroY + 50, 60, 6); 

        // Body
        ctx.fillStyle = '#FF6D00';
        ctx.beginPath();
        ctx.ellipse(heroX, heroY, 45 - squash, 45 + squash, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Rim Light
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#FF8A65';
        ctx.stroke();

        // Face Mask
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(heroX, heroY - 5, 32, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#1A237E';
        ctx.beginPath();
        ctx.arc(heroX - 12, heroY - 5, 5, 0, Math.PI*2);
        ctx.arc(heroX + 12, heroY - 5, 5, 0, Math.PI*2);
        ctx.fill();

        // Mouth
        ctx.beginPath();
        ctx.arc(heroX, heroY + 10, 10, 0, Math.PI, false);
        ctx.stroke();
    }

    // --- SCENE OBJECTS ---
    const clouds = [
        {x: 100, y: 120, s: 1.2, speed: 0.3},
        {x: 500, y: 180, s: 0.8, speed: 0.15},
        {x: 900, y: 90, s: 1.5, speed: 0.4},
        {x: 1300, y: 200, s: 1, speed: 0.2}
    ];

    // --- MAIN LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // Responsive Layout Calculations
        const groundY = height - 140; 
        const blockSize = 60;
        
        // 1. Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#4FC3F7');
        grad.addColorStop(1, '#E1F5FE');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Parallax Clouds
        clouds.forEach(c => {
            let moveX = (c.x + frame * c.speed) % (width + 200) - 100;
            drawCloud(moveX, c.y, c.s, 0.8);
        });

        // 3. Distant Mountains (Depth)
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 250);
        ctx.lineTo(width * 0.4, groundY - 120);
        ctx.lineTo(width * 0.6, groundY - 300);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // 4. Distant Hills (Mid Layer)
        ctx.fillStyle = 'rgba(118, 255, 3, 0.2)'; 
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.bezierCurveTo(width*0.3, groundY-120, width*0.7, groundY-120, width, groundY);
        ctx.fill();

        // 5. Ground (Foreground)
        drawGround(groundY, height - groundY);

        // 6. Platforms (Integrated Level Preview)
        // Platform 1 (Hero Ground)
        const p1W = 450;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, groundY - 120, p1W, 120);
        ctx.fillStyle = '#76FF03'; 
        ctx.fillRect(0, groundY - 120, p1W, 25);
        
        // Platform 2 (Mid)
        const plat2X = width * 0.45;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat2X, groundY - 200, 240, 60);
        ctx.fillStyle = '#76FF03';
        ctx.fillRect(plat2X, groundY - 200, 240, 25);

        // Platform 3 (High/Goal)
        const plat3X = width * 0.75;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat3X, groundY - 280, 350, 280);
        ctx.fillStyle = '#76FF03';
        ctx.fillRect(plat3X, groundY - 280, 350, 25);

        // 7. Blocks
        drawBlock(plat2X + 30, groundY - 270, blockSize, 'normal');
        drawBlock(plat2X + 100, groundY - 270, blockSize, 'gold');
        drawBlock(plat2X + 170, groundY - 270, blockSize, 'normal');

        // 8. Coins
        drawCoin(plat2X + 130, groundY - 330, 12);
        drawCoin(plat2X + 130, groundY - 370, 12);

        // 9. Enemy
        drawEnemy(plat2X + 120, groundY - 200);

        // 10. Castle (Distant Goal)
        drawCastle(plat3X + 250, groundY - 400, 180);

        // 11. Hero
        drawHero(width * 0.25, groundY - 120);

        requestAnimationFrame(loop);
    }

    loop();
</script>
