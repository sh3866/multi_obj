<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        /* 
         * DESIGN SYSTEM REVISED (V3)
         * Focus: "Sticker" UI, Squash & Stretch Aesthetic, 
         * Vertical Hierarchy, and Diegetic Integration.
         */
        :root {
            /* Palette: High Saturation, Vibrant */
            --c-sky-top: #29B6F6;
            --c-sky-bot: #E1F5FE;
            
            /* Hero: Orange/Bolt */
            --c-hero: #FF6D00;
            --c-hero-dark: #E65100;
            
            /* UI: "Sticker" Material */
            --c-paper: #FFFFFF;
            --c-ink: #263238; /* Dark Slate for high contrast */
            --c-accent: #FFEA00; /* Bright Yellow for CTAs */
            --c-accent-dark: #FBC02D;
            
            /* Environment */
            --c-grass: #00C853;
            --c-grass-shadow: #009624;
            --c-dirt: #8D6E63;
            --c-dirt-shadow: #5D4037;

            /* UI Styling */
            --radius-sticker: 24px;
            --radius-pill: 50px;
            
            /* The "Sticker" Shadow: White Border + Hard Drop Shadow */
            --shadow-sticker: 
                0 0 0 4px var(--c-ink),
                6px 6px 0 rgba(0,0,0,0.4);
            
            --shadow-btn: 
                0 0 0 4px var(--c-ink),
                0 8px 0 var(--c-ink),
                0 12px 20px rgba(0,0,0,0.3);

            /* Typography */
            --font-display: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
            --font-ui: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            background: #1a1a1a;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* LAYOUT: Vertical Hierarchy (Title -> Context -> Action) */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            /* Gentle kinetic tilt */
            transform: perspective(1000px) rotateX(1deg) scale(1.01);
            transform-origin: center center;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI LAYER */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none; 
        }
        .ui-interactive {
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* HEADER: TOP LEFT (Brand Anchor) */
        header {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 20;
        }

        .brand {
            transform: rotate(-2deg);
        }
        
        h1 {
            font-family: var(--font-display);
            font-size: 4.5rem;
            color: var(--c-accent);
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -1px;
            /* Sticker Text Effect */
            -webkit-text-stroke: 2px var(--c-ink);
            paint-order: stroke fill;
            text-shadow: 
                0 6px 0 var(--c-ink),
                4px 8px 0 rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-family: var(--font-display);
            color: var(--c-paper);
            font-size: 1rem;
            background: var(--c-hero);
            padding: 6px 16px;
            border-radius: 30px;
            border: 3px solid var(--c-ink);
            margin-top: 12px;
            margin-left: 4px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            transform: rotate(1deg);
        }

        /* GAME STATE ZONE: RIGHT SIDE (Unified Panel) */
        .game-state-panel {
            position: absolute;
            right: 50px;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: flex-end;
        }

        /* World Selector: Diegetic "Spring Coil" */
        .world-coil {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The Connecting Spring Line */
        .coil-line {
            position: absolute;
            top: 40px;
            bottom: 40px;
            width: 12px;
            background: repeating-linear-gradient(
                to bottom,
                var(--c-ink) 0,
                var(--c-ink) 4px,
                transparent 4px,
                transparent 8px
            );
            z-index: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 6px;
        }

        .world-node {
            width: 180px;
            padding: 12px;
            background: var(--c-paper);
            border-radius: var(--radius-sticker);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
            box-shadow: var(--shadow-sticker);
            transition: transform 0.2s;
        }

        .world-node:hover {
            transform: scale(1.05) rotate(1deg);
        }

        .world-node.active {
            background: var(--c-accent);
            transform: scale(1.1) rotate(-1deg);
            box-shadow: 0 0 0 4px var(--c-ink), 8px 8px 0 rgba(0,0,0,0.3);
        }
        
        .world-node.locked {
            background: #CFD8DC;
            opacity: 0.8;
            filter: grayscale(0.5);
        }

        .world-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--c-ink);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--c-ink);
        }
        .w1 .world-icon { background: #A5D6A7; }
        .w2 .world-icon { background: #FFCC80; }
        .w3 .world-icon { background: #80DEEA; }

        .world-info h3 { 
            font-family: var(--font-display); 
            font-size: 0.9rem; 
            color: var(--c-ink); 
            text-transform: uppercase;
            line-height: 1;
        }
        .world-info p { font-size: 0.75rem; font-weight: bold; color: #546E7A; text-transform: uppercase; }
        .world-node.active .world-info p { color: var(--c-hero-dark); }

        /* Collectible Counters (Grouped with World Selector) */
        .stats-pill {
            background: var(--c-paper);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            box-shadow: var(--shadow-sticker);
            font-size: 1.1rem;
            color: var(--c-ink);
            width: 140px;
            justify-content: space-between;
            margin-right: 10px; /* Offset from edge */
        }

        /* START BUTTON: BOTTOM CENTER (Diegetic Spring Pad) */
        .cta-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .btn-start {
            background: var(--c-accent);
            color: var(--c-ink);
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            padding: 20px 70px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            text-shadow: 0 2px 0 rgba(255,255,255,0.5);
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            /* Squash Animation */
            animation: breathe 2s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03, 0.97); }
        }

        .btn-start:hover {
            background: #FFF176;
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 0 0 4px var(--c-ink), 0 14px 0 var(--c-ink), 0 20px 30px rgba(0,0,0,0.3);
        }

        .btn-start:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 0 0 4px var(--c-ink), 0 2px 0 var(--c-ink), 0 5px 10px rgba(0,0,0,0.3);
        }

        /* The Mechanical Spring Base */
        .spring-mechanism {
            position: relative;
            width: 140px;
            height: 60px;
            margin-top: -20px; /* Tuck behind button */
            z-index: 1;
        }
        
        .spring-coil {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #90A4AE 20%, #CFD8DC 50%, #90A4AE 80%);
            border: 4px solid var(--c-ink);
            border-top: none;
            border-radius: 0 0 40px 40px;
            position: relative;
            overflow: hidden;
        }
        /* Spring Lines */
        .spring-coil::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 10px,
                var(--c-ink) 10px,
                var(--c-ink) 15px
            );
            opacity: 0.3;
        }

        .spring-pad-top {
            position: absolute;
            top: -15px;
            left: -10px;
            width: 160px;
            height: 20px;
            background: #78909C;
            border: 4px solid var(--c-ink);
            border-radius: 10px;
            z-index: -1;
        }

        /* CONTROLS: BOTTOM RIGHT (Clean, Minimal) */
        .controls-guide {
            position: absolute;
            bottom: 40px;
            right: 50px;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            opacity: 0.9;
        }

        .key {
            width: 44px;
            height: 44px;
            background: var(--c-paper);
            border: 3px solid var(--c-ink);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            color: var(--c-ink);
            box-shadow: 2px 2px 0 var(--c-ink);
        }
        
        .key.wide { width: 100px; }
        
        .key span {
            font-size: 0.6rem;
            text-transform: uppercase;
            position: absolute;
            bottom: -18px;
            color: var(--c-ink);
            font-weight: bold;
            background: rgba(255,255,255,0.8);
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            header { top: 20px; left: 20px; }
            h1 { font-size: 2.5rem; }
            .game-state-panel { display: none; } /* Simplify for mobile */
            .controls-guide { display: none; }
            .cta-container { bottom: 30px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <header class="ui-layer">
        <div class="brand">
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </div>
    </header>

    <!-- RIGHT: GAME STATE (World Map + Stats) -->
    <aside class="game-state-panel ui-layer">
        
        <!-- Stats -->
        <div class="stats-pill ui-interactive">
            <svg style="width:24px;height:24px;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" fill="#FFD700" stroke="#263238" stroke-width="2"/>
                <text x="12" y="16" text-anchor="middle" font-weight="bold" font-size="12" fill="#263238">$</text>
            </svg>
            <span>1,240</span>
        </div>

        <!-- Diegetic World Selector -->
        <div class="world-coil">
            <div class="coil-line"></div>
            
            <div class="world-node w1 active ui-interactive">
                <div class="world-icon">1</div>
                <div class="world-info">
                    <h3>Spring Valley</h3>
                    <p>Current World</p>
                </div>
            </div>

            <div class="world-node w2 locked">
                <div class="world-icon">2</div>
                <div class="world-info">
                    <h3>Sand Springs</h3>
                    <p>Locked</p>
                </div>
            </div>

            <div class="world-node w3 locked">
                <div class="world-icon">3</div>
                <div class="world-info">
                    <h3>Cloud Peak</h3>
                    <p>Locked</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- CENTER: START BUTTON -->
    <div class="cta-container ui-layer">
        <button class="btn-start ui-interactive">Start Adventure</button>
        <div class="spring-mechanism">
            <div class="spring-coil"></div>
            <div class="spring-pad-top"></div>
        </div>
    </div>

    <!-- RIGHT: CONTROLS (Moved from Left to Right to balance composition) -->
    <aside class="controls-guide ui-layer">
        <div class="key">W<span>Up</span></div>
        <div class="key wide">Space<span>Jump</span></div>
    </aside>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE V3
     * Improvements:
     * 1. Parallax Depth: Mountains, Clouds moving at different speeds.
     * 2. Gameplay Storytelling: Hero jumping towards a distant CASTLE.
     * 3. Diegetic Elements: Coins, Springs, Enemies integrated.
     * 4. Dynamic Hero: Animated jumping pose.
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---

    function drawCloud(x, y, scale, opacity) {
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 15 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 60 * scale, y - 5 * scale, 40 * scale, 0, Math.PI * 2);
        ctx.arc(x + 85 * scale, y + 5 * scale, 25 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawBlock(x, y, size, type) {
        // Base
        ctx.fillStyle = type === 'gold' ? '#FFCA28' : '#8D6E63';
        ctx.fillRect(x, y, size, size);
        
        // Sticker Border
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#263238';
        ctx.strokeRect(x, y, size, size);
        
        // Inner Bevel (Light Top/Left)
        ctx.fillStyle = type === 'gold' ? '#FFF59D' : '#A1887F';
        ctx.fillRect(x+4, y+4, size-8, 6);
        ctx.fillRect(x+4, y+4, 6, size-8);
        
        // Inner Bevel (Dark Bottom/Right)
        ctx.fillStyle = type === 'gold' ? '#FF8F00' : '#5D4037';
        ctx.fillRect(x+4, y+size-10, size-8, 6);
        ctx.fillRect(x+size-10, y+4, 6, size-8);
        
        // Icon
        ctx.fillStyle = '#263238';
        ctx.font = `bold ${size/1.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(type === 'gold' ? '★' : '?', x + size/2, y + size/2 + 2);
    }

    function drawGround(y, h) {
        // Layer 1: Dirt
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(0, y, width, h);
        
        // Layer 2: Grass Top (Curved for depth)
        ctx.fillStyle = '#00C853';
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.lineTo(width, y + 24);
        // Wavy grass edge
        for(let i=width; i>=0; i-=40) {
            ctx.lineTo(i, y + 24 + Math.sin(i + frame*0.05)*4);
        }
        ctx.fill();
        
        // Layer 3: Grass Highlight
        ctx.fillStyle = '#69F0AE';
        for(let i=0; i<width; i+=50) {
            ctx.fillRect(i + (frame*0.5)%50, y + 4, 20, 4);
        }
        
        // Layer 4: Dirt texture details
        ctx.fillStyle = '#5D4037';
        for(let i=0; i<width; i+=100) {
            ctx.fillRect(i + 20, y + 40, 10, 10);
            ctx.fillRect(i + 60, y + 70, 15, 15);
        }
    }

    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 4;
        const scaleX = Math.abs(Math.sin(frame * 0.05)); // 3D rotation effect
        
        ctx.save();
        ctx.translate(x, y + wobble);
        ctx.scale(scaleX, 1);
        
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = '#FFF';
        ctx.fillRect(-2, -5, 4, 10); 
        
        ctx.restore();
    }

    function drawCastle(x, y, h) {
        // Main Tower
        ctx.fillStyle = '#9FA8DA'; // Light Blue/Stone
        ctx.fillRect(x, y, 60, h);
        
        // Side Towers
        ctx.fillRect(x - 40, y + 40, 40, h - 40);
        ctx.fillRect(x + 60, y + 40, 40, h - 40);
        
        // Battlements
        ctx.fillStyle = '#7986CB';
        for(let i=0; i<3; i++) {
            ctx.fillRect(x - 35 + (i*20), y + 30, 10, 10);
            ctx.fillRect(x + 5 + (i*20), y - 10, 10, 10);
            ctx.fillRect(x + 65 + (i*20), y + 30, 10, 10);
        }

        // Windows
        ctx.fillStyle = '#263238';
        ctx.beginPath();
        ctx.arc(x + 30, y + 60, 8, 0, Math.PI*2);
        ctx.arc(x - 20, y + 80, 6, 0, Math.PI*2);
        ctx.arc(x + 80, y + 80, 6, 0, Math.PI*2);
        ctx.fill();

        // Door
        ctx.fillStyle = '#4E342E';
        ctx.beginPath();
        ctx.moveTo(x + 20, y + h);
        ctx.lineTo(x + 20, y + h - 30);
        ctx.arc(x + 30, y + h - 30, 10, Math.PI, 0);
        ctx.lineTo(x + 40, y + h);
        ctx.fill();

        // Flag on top
        ctx.strokeStyle = '#263238';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x+30, y-10); ctx.lineTo(x+30, y-50); ctx.stroke();
        ctx.fillStyle = '#FF5252';
        ctx.beginPath();
        ctx.moveTo(x+30, y-50);
        ctx.lineTo(x+60, y-40);
        ctx.lineTo(x+30, y-30);
        ctx.fill();
    }

    function drawEnemy(x, y) {
        const squish = Math.abs(Math.sin(frame * 0.1)) * 5;
        
        ctx.fillStyle = '#FF7043'; // Orange/Red enemy
        ctx.beginPath();
        ctx.moveTo(x - 20, y);
        ctx.quadraticCurveTo(x - 25, y - 30 - squish, x, y - 40 - squish);
        ctx.quadraticCurveTo(x + 25, y - 30 - squish, x + 20, y);
        ctx.fill();
        
        // Feet
        ctx.fillStyle = '#263238';
        const walk = Math.sin(frame * 0.2) * 5;
        ctx.beginPath(); ctx.arc(x - 12 + walk, y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 12 - walk, y, 8, 0, Math.PI*2); ctx.fill();
        
        // Angry Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x - 8, y - 20, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 8, y - 20, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x - 8, y - 20, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 8, y - 20, 2, 0, Math.PI*2); ctx.fill();
        
        // Eyebrows
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x-12, y-28); ctx.lineTo(x-4, y-24); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+12, y-28); ctx.lineTo(x+4, y-24); ctx.stroke();
    }

    function drawHero(x, y) {
        // Physics Simulation for "Jumping"
        const bounceY = Math.abs(Math.sin(frame * 0.05)) * 60; 
        const squash = Math.abs(Math.sin(frame * 0.1)) * 8;
        
        const heroX = x; 
        const heroY = y - bounceY;

        // Shadow (Dynamic based on height)
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        const shadowScale = 1 - (bounceY / 100);
        ctx.ellipse(x, y, 35 * shadowScale, 10 * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // Spring Base (Attached to feet)
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(heroX - 25, heroY + 45, 50, 15);
        ctx.fillStyle = '#78909C';
        ctx.fillRect(heroX - 25, heroY + 45, 50, 4); 

        // Body (Orange Circle)
        ctx.fillStyle = '#FF6D00';
        ctx.beginPath();
        ctx.ellipse(heroX, heroY, 40 - squash, 40 + squash, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Rim Light
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FF8A65';
        ctx.stroke();

        // Face Mask (White)
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(heroX, heroY - 5, 28, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes (Determined)
        ctx.fillStyle = '#263238';
        ctx.beginPath();
        ctx.arc(heroX - 10, heroY - 5, 4, 0, Math.PI*2);
        ctx.arc(heroX + 10, heroY - 5, 4, 0, Math.PI*2);
        ctx.fill();

        // Mouth (Smile)
        ctx.beginPath();
        ctx.arc(heroX, heroY + 8, 8, 0, Math.PI, false);
        ctx.stroke();
    }

    // --- SCENE OBJECTS ---
    const clouds = [
        {x: 100, y: 120, s: 1.2, speed: 0.2},
        {x: 500, y: 180, s: 0.8, speed: 0.1},
        {x: 900, y: 90, s: 1.5, speed: 0.3},
        {x: 1300, y: 200, s: 1, speed: 0.15}
    ];

    // --- MAIN LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // Responsive Layout Calculations
        const groundY = height - 120; 
        const blockSize = 50;
        
        // 1. Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#29B6F6');
        grad.addColorStop(1, '#E1F5FE');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Parallax Clouds
        clouds.forEach(c => {
            let moveX = (c.x + frame * c.speed) % (width + 200) - 100;
            drawCloud(moveX, c.y, c.s, 0.8);
        });

        // 3. Distant Mountains (Depth Layer)
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 200);
        ctx.lineTo(width * 0.4, groundY - 100);
        ctx.lineTo(width * 0.6, groundY - 250);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // 4. Distant Hills (Mid Layer)
        ctx.fillStyle = 'rgba(0, 200, 83, 0.3)'; 
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.bezierCurveTo(width*0.3, groundY-100, width*0.7, groundY-100, width, groundY);
        ctx.fill();

        // 5. Ground (Foreground)
        drawGround(groundY, height - groundY);

        // 6. Platforms (The "Level Preview")
        // Platform 1 (Under Hero)
        const p1W = 400;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, groundY - 100, p1W, 100);
        ctx.fillStyle = '#00C853'; // Grass
        ctx.fillRect(0, groundY - 100, p1W, 20);
        
        // Platform 2 (Mid)
        const plat2X = width * 0.4;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat2X, groundY - 180, 200, 50);
        ctx.fillStyle = '#00C853';
        ctx.fillRect(plat2X, groundY - 180, 200, 20);

        // Platform 3 (High/Goal)
        const plat3X = width * 0.7;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat3X, groundY - 250, 300, 250);
        ctx.fillStyle = '#00C853';
        ctx.fillRect(plat3X, groundY - 250, 300, 20);

        // 7. Blocks
        drawBlock(plat2X + 20, groundY - 240, blockSize, 'normal');
        drawBlock(plat2X + 80, groundY - 240, blockSize, 'gold');
        drawBlock(plat2X + 140, groundY - 240, blockSize, 'normal');

        // 8. Coins (Added per critique)
        drawCoin(plat2X + 105, groundY - 290, 10);
        drawCoin(plat2X + 105, groundY - 330, 10);

        // 9. Enemy
        drawEnemy(plat2X + 100, groundY - 180);

        // 10. Castle (Distant Goal - Replaced Flag per critique)
        drawCastle(plat3X + 220, groundY - 350, 150);

        // 11. Hero (Dynamic Jump - Added per critique)
        drawHero(width * 0.25, groundY - 100);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
