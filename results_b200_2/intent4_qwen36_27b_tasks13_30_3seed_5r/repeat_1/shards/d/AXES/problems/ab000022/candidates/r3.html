<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        /* 
         * DESIGN SYSTEM REVISED (V2)
         * Focus: "Flat 2.5D" UI, Cohesive Typography, 
         * Dynamic Layout, and Diegetic Interactions.
         */
        :root {
            /* Palette: High saturation, playful, unified */
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #E1F5FE;
            
            /* Character */
            --c-hero: #FF6F00;
            --c-hero-dark: #E65100;
            
            /* UI: Unified Yellow/Gold */
            --c-ui-primary: #FFD54F;
            --c-ui-primary-dark: #FFC107;
            --c-ui-text: #3E2723; /* Dark Brown for contrast */
            
            /* Environment */
            --c-grass: #66BB6A;
            --c-grass-dark: #388E3C;
            --c-dirt: #795548;
            --c-dirt-dark: #5D4037;
            
            /* UI Standard - The "Flat 2.5D" Style */
            --radius-card: 12px;
            --radius-btn: 50px; /* Pill shape */
            --shadow-hard: 0 4px 0 rgba(0,0,0,0.2); /* Consistent hard shadow */
            --shadow-float: 0 10px 20px rgba(0,0,0,0.15);
            
            /* Typography */
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-ui: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            background: #222;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* LAYOUT: Z-Pattern Flow */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            /* Subtle tilt for kinetic energy */
            transform: perspective(1000px) rotateX(2deg) scale(1.02);
            transform-origin: center center;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI LAYER */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none; 
        }
        .ui-interactive {
            pointer-events: auto;
            cursor: pointer;
        }

        /* HEADER: TOP LEFT (Brand) */
        header {
            position: absolute;
            top: 40px;
            left: 50px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .brand {
            transform: rotate(-3deg);
            filter: drop-shadow(0 8px 0 rgba(0,0,0,0.1));
        }
        
        h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            color: var(--c-ui-primary);
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -2px;
            /* Clean 2.5D Text Effect */
            text-shadow: 
                0 0 0 4px var(--c-ui-text),
                0 6px 0 var(--c-ui-text);
        }
        
        .subtitle {
            font-family: var(--font-display);
            color: var(--c-white);
            font-size: 1.2rem;
            background: var(--c-hero);
            padding: 8px 20px;
            border-radius: 30px;
            border: 3px solid var(--c-ui-text);
            margin-top: 10px;
            margin-left: 6px;
            box-shadow: var(--shadow-hard);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
        }

        /* COLLECTIBLES: TOP LEFT (Below Title) */
        .stats-bar {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-pill {
            background: var(--c-white);
            padding: 8px 16px;
            border-radius: var(--radius-btn);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            border: 3px solid var(--c-ui-text);
            box-shadow: var(--shadow-hard);
            font-size: 1.2rem;
            color: var(--c-ui-text);
            width: 140px;
            justify-content: center;
        }

        /* WORLD SELECTOR: TOP RIGHT (Diegetic Map) */
        .world-map {
            position: absolute;
            right: 50px;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 0;
            align-items: flex-start;
        }

        .world-node {
            width: 220px; /* Strict width constraint */
            padding: 12px 16px;
            background: var(--c-white);
            border: 3px solid var(--c-ui-text);
            border-radius: var(--radius-card);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-hard);
            position: relative;
            margin-bottom: 24px;
        }

        /* Connecting Path */
        .world-node::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            width: 4px;
            height: 24px;
            background: repeating-linear-gradient(
                to bottom,
                var(--c-ui-text) 0,
                var(--c-ui-text) 4px,
                transparent 4px,
                transparent 8px
            );
            z-index: -1;
        }
        .world-node:last-child::before { display: none; }

        .world-node:hover {
            transform: translateX(-8px) scale(1.02);
            z-index: 2;
        }

        .world-node.active {
            background: var(--c-ui-primary);
            transform: translateX(-12px) scale(1.05);
            box-shadow: 0 8px 0 var(--c-ui-text);
        }
        
        .world-node.locked {
            background: #ECEFF1;
            border-color: #B0BEC5;
            color: #90A4AE;
        }

        .world-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid var(--c-ui-text);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--c-ui-text);
        }
        .w1 .world-icon { background: #81C784; }
        .w2 .world-icon { background: #FFB74D; }
        .w3 .world-icon { background: #4DD0E1; }

        .world-info {
            text-align: left;
        }
        .world-info h3 { 
            font-family: var(--font-display); 
            font-size: 1rem; 
            color: var(--c-ui-text); 
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .world-info p { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }

        /* CONTROLS: BOTTOM LEFT (Clean Cluster) */
        .controls-guide {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }

        .key-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .key-row {
            display: flex;
            gap: 8px;
        }

        .key {
            width: 50px;
            height: 50px;
            background: var(--c-white);
            border: 3px solid var(--c-ui-text);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--c-ui-text);
            box-shadow: var(--shadow-hard);
            position: relative;
        }
        
        .key span.label {
            font-size: 0.55rem;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 1px;
        }

        /* D-Pad Layout */
        .d-pad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px;
            gap: 6px;
        }
        .d-pad .key:nth-child(1) { grid-column: 2; grid-row: 1; } /* W */
        .d-pad .key:nth-child(2) { grid-column: 1; grid-row: 2; } /* A */
        .d-pad .key:nth-child(3) { grid-column: 2; grid-row: 2; } /* S */
        .d-pad .key:nth-child(4) { grid-column: 3; grid-row: 2; } /* D */

        .action-key {
            width: 120px;
            background: var(--c-hero);
            color: white;
            border-radius: 10px;
        }
        .action-key span.label { color: rgba(255,255,255,0.9); }

        /* START BUTTON: BOTTOM CENTER (Diegetic Spring) */
        .cta-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 40px;
        }

        .btn-start {
            background: var(--c-ui-primary);
            color: var(--c-ui-text);
            font-family: var(--font-display);
            font-size: 2.2rem;
            text-transform: uppercase;
            padding: 18px 80px;
            border: 4px solid var(--c-ui-text);
            border-radius: var(--radius-btn);
            cursor: pointer;
            /* Unified Shadow System */
            box-shadow: 0 8px 0 var(--c-ui-text), 0 15px 20px rgba(0,0,0,0.3);
            text-shadow: 0 2px 0 rgba(255,255,255,0.4);
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 20;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            background: #FFEB3B;
            transform: translateY(-6px);
            box-shadow: 0 14px 0 var(--c-ui-text), 0 25px 30px rgba(0,0,0,0.3);
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--c-ui-text), 0 5px 10px rgba(0,0,0,0.3);
        }

        /* Diegetic Spring Base */
        .spring-base {
            width: 100px;
            height: 60px;
            background: #90A4AE;
            border: 4px solid var(--c-ui-text);
            border-top: none;
            border-radius: 0 0 20px 20px;
            margin-top: -15px; /* Tuck under */
            position: relative;
            z-index: 19;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 6px,
                var(--c-ui-text) 6px,
                var(--c-ui-text) 10px
            );
        }
        .spring-top {
            position: absolute;
            top: -25px;
            left: -15px;
            width: 130px;
            height: 25px;
            background: #CFD8DC;
            border: 4px solid var(--c-ui-text);
            border-radius: 12px;
            z-index: 19;
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) {
            header { top: 20px; left: 20px; }
            h1 { font-size: 3rem; }
            .world-map { display: none; } /* Hide on mobile for simplicity */
            .controls-guide { display: none; }
            .cta-container { bottom: 20px; }
            .btn-start { font-size: 1.5rem; padding: 14px 50px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <header class="ui-layer">
        <div class="brand">
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </div>
        <div class="stats-bar ui-interactive">
            <div class="stat-pill">
                <!-- Inline SVG Coin -->
                <svg style="width:24px;height:24px;" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" fill="#FFD700" stroke="#3E2723" stroke-width="2"/>
                    <text x="12" y="16" text-anchor="middle" font-weight="bold" font-size="12" fill="#3E2723">$</text>
                </svg>
                <span>1,240</span>
            </div>
            <div class="stat-pill">
                <!-- Inline SVG Heart -->
                <svg style="width:24px;height:24px;" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#E53935" stroke="#3E2723" stroke-width="2"/>
                </svg>
                <span>x5</span>
            </div>
        </div>
    </header>

    <!-- RIGHT: WORLD MAP -->
    <aside class="world-map ui-layer ui-interactive">
        <div class="world-node w1 active">
            <div class="world-icon">1</div>
            <div class="world-info">
                <h3>Spring Valley</h3>
                <p>Current World</p>
            </div>
        </div>
        <div class="world-node w2 locked">
            <div class="world-icon">2</div>
            <div class="world-info">
                <h3>Sand Springs</h3>
                <p>Locked</p>
            </div>
        </div>
        <div class="world-node w3 locked">
            <div class="world-icon">3</div>
            <div class="world-info">
                <h3>Cloud Peak</h3>
                <p>Locked</p>
            </div>
        </div>
    </aside>

    <!-- CENTER: START BUTTON -->
    <div class="cta-container ui-layer">
        <button class="btn-start ui-interactive">Start Adventure</button>
        <div class="spring-base">
            <div class="spring-top"></div>
        </div>
    </div>

    <!-- LEFT: CONTROLS -->
    <aside class="controls-guide ui-layer">
        <div class="key-group">
            <div class="d-pad">
                <div class="key">W<span class="label">Up</span></div>
                <div class="key">A<span class="label">Left</span></div>
                <div class="key">S<span class="label">Down</span></div>
                <div class="key">D<span class="label">Right</span></div>
            </div>
        </div>
        <div class="key-group">
            <div class="key action-key">SPACE<span class="label">Jump</span></div>
        </div>
    </aside>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE V2
     * Improvements:
     * 1. Parallax Depth: Mountains, Hills, Clouds moving at different speeds.
     * 2. Gameplay Storytelling: Hero jumping towards a distant goal (Flag).
     * 3. Collectibles: Coins added to the level.
     * 4. Dynamic Hero: Animated jumping pose.
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---

    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawCloud(x, y, scale, opacity) {
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 15 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 60 * scale, y - 5 * scale, 40 * scale, 0, Math.PI * 2);
        ctx.arc(x + 85 * scale, y + 5 * scale, 25 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawBlock(x, y, size) {
        // Block body
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(x, y, size, size);
        
        // Inner Bevel (Light Top/Left)
        ctx.fillStyle = '#A1887F';
        ctx.fillRect(x, y, size, 6);
        ctx.fillRect(x, y, 6, size);
        
        // Inner Bevel (Dark Bottom/Right)
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(x, y + size - 6, size, 6);
        ctx.fillRect(x + size - 6, y, 6, size);
        
        // Question Mark
        ctx.fillStyle = '#3E2723';
        ctx.font = `bold ${size/1.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 4);
    }

    function drawGoldBlock(x, y, size, offset) {
        const pulse = Math.sin((frame + offset) * 0.1) * 5;
        
        ctx.fillStyle = '#FFCA28';
        ctx.fillRect(x, y, size, size);
        
        // Bevel
        ctx.fillStyle = '#FFF59D';
        ctx.fillRect(x, y, size, 6);
        ctx.fillRect(x, y, 6, size);
        ctx.fillStyle = '#FF8F00';
        ctx.fillRect(x, y + size - 6, size, 6);
        ctx.fillRect(x + size - 6, y, 6, size);
        
        // Star
        ctx.fillStyle = '#FFF';
        ctx.font = `bold ${size/1.8}px sans-serif`;
        ctx.fillText('★', x + size/2, y + size/2 + 4);
    }

    function drawGround(y, h) {
        // Layer 1: Dirt
        ctx.fillStyle = '#795548';
        ctx.fillRect(0, y, width, h);
        
        // Layer 2: Grass Top
        ctx.fillStyle = '#66BB6A';
        ctx.fillRect(0, y, width, 24);
        
        // Layer 3: Grass Highlight
        ctx.fillStyle = '#81C784';
        for(let i=0; i<width; i+=50) {
            let offset = (frame * 0.5) % 50; 
            ctx.fillRect(i + offset, y + 2, 20, 4);
        }
        
        // Layer 4: Dirt texture details
        ctx.fillStyle = '#5D4037';
        for(let i=0; i<width; i+=100) {
            ctx.fillRect(i + 20, y + 40, 10, 10);
            ctx.fillRect(i + 60, y + 70, 15, 15);
        }
    }

    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 4;
        const scaleX = Math.abs(Math.sin(frame * 0.05)); // 3D rotation effect
        
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scaleX, 1);
        
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = '#FFF';
        ctx.fillRect(-2, -5, 4, 10); 
        
        ctx.restore();
    }

    function drawFlag(x, y, h) {
        // Pole
        ctx.fillStyle = '#CFD8DC';
        ctx.fillRect(x, y, 8, h);
        
        // Ball top
        ctx.fillStyle = '#FF5722';
        ctx.beginPath(); ctx.arc(x+4, y, 10, 0, Math.PI*2); ctx.fill();
        
        // Flag Cloth (Billowing)
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+8, y+10);
        ctx.quadraticCurveTo(x+50, y+20 + Math.sin(frame*0.1)*10, x+80, y+30);
        ctx.lineTo(x+8, y+60);
        ctx.fill();
        
        // Stripes
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.moveTo(x+8, y+25);
        ctx.quadraticCurveTo(x+40, y+35 + Math.sin(frame*0.1)*10, x+70, y+40);
        ctx.lineTo(x+8, y+50);
        ctx.fill();
    }

    function drawEnemy(x, y) {
        const squish = Math.abs(Math.sin(frame * 0.1)) * 5;
        
        ctx.fillStyle = '#8D6E63'; // Brown
        ctx.beginPath();
        ctx.moveTo(x - 20, y);
        ctx.quadraticCurveTo(x - 25, y - 30 - squish, x, y - 40 - squish);
        ctx.quadraticCurveTo(x + 25, y - 30 - squish, x + 20, y);
        ctx.fill();
        
        // Feet
        ctx.fillStyle = '#3E2723';
        const walk = Math.sin(frame * 0.2) * 5;
        ctx.beginPath(); ctx.arc(x - 12 + walk, y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 12 - walk, y, 8, 0, Math.PI*2); ctx.fill();
        
        // Angry Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x - 8, y - 20, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 8, y - 20, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x - 8, y - 20, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 8, y - 20, 2, 0, Math.PI*2); ctx.fill();
        
        // Eyebrows
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x-12, y-28); ctx.lineTo(x-4, y-24); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+12, y-28); ctx.lineTo(x+4, y-24); ctx.stroke();
    }

    function drawHero(x, y) {
        // Physics Simulation for "Jumping"
        const bounceY = Math.abs(Math.sin(frame * 0.05)) * 60; // Higher jump
        const squash = Math.abs(Math.sin(frame * 0.1)) * 8;
        
        const heroX = x + (frame * 0.5) % 100; // Slight forward drift
        const heroY = y - bounceY;

        // Shadow (Dynamic based on height)
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        const shadowScale = 1 - (bounceY / 100);
        ctx.ellipse(x, y, 35 * shadowScale, 10 * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // Spring Base (Attached to feet)
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(heroX - 25, heroY + 45, 50, 15);
        ctx.fillStyle = '#78909C';
        ctx.fillRect(heroX - 25, heroY + 45, 50, 4); 

        // Body (Orange Circle)
        ctx.fillStyle = '#FF6F00';
        ctx.beginPath();
        ctx.ellipse(heroX, heroY, 40 - squash, 40 + squash, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Rim Light
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FF8A65';
        ctx.stroke();

        // Face Mask (White)
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(heroX, heroY - 5, 28, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes (Determined)
        ctx.fillStyle = '#263238';
        ctx.beginPath();
        ctx.arc(heroX - 10, heroY - 5, 4, 0, Math.PI*2);
        ctx.arc(heroX + 10, heroY - 5, 4, 0, Math.PI*2);
        ctx.fill();

        // Mouth (Smile)
        ctx.beginPath();
        ctx.arc(heroX, heroY + 8, 8, 0, Math.PI, false);
        ctx.stroke();
    }

    // --- SCENE OBJECTS ---
    const clouds = [
        {x: 100, y: 120, s: 1.2, speed: 0.2},
        {x: 500, y: 180, s: 0.8, speed: 0.1},
        {x: 900, y: 90, s: 1.5, speed: 0.3},
        {x: 1300, y: 200, s: 1, speed: 0.15}
    ];

    // --- MAIN LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // Responsive Layout Calculations
        const groundY = height - 120; 
        const blockSize = 50;
        
        // 1. Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#4FC3F7');
        grad.addColorStop(1, '#E1F5FE');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Parallax Clouds
        clouds.forEach(c => {
            let moveX = (c.x + frame * c.speed) % (width + 200) - 100;
            drawCloud(moveX, c.y, c.s, 0.8);
        });

        // 3. Distant Mountains (Depth Layer)
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 200);
        ctx.lineTo(width * 0.4, groundY - 100);
        ctx.lineTo(width * 0.6, groundY - 250);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // 4. Distant Hills (Mid Layer)
        ctx.fillStyle = 'rgba(102, 187, 106, 0.4)'; 
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.bezierCurveTo(width*0.3, groundY-100, width*0.7, groundY-100, width, groundY);
        ctx.fill();

        // 5. Ground (Foreground)
        drawGround(groundY, height - groundY);

        // 6. Platforms (The "Level Preview")
        // Platform 1 (Under Hero)
        const p1W = 400;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, groundY - 100, p1W, 100);
        ctx.fillStyle = '#66BB6A'; // Grass
        ctx.fillRect(0, groundY - 100, p1W, 20);
        
        // Platform 2 (Mid)
        const plat2X = width * 0.4;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat2X, groundY - 180, 200, 50);
        ctx.fillStyle = '#66BB6A';
        ctx.fillRect(plat2X, groundY - 180, 200, 20);

        // Platform 3 (High/Goal)
        const plat3X = width * 0.7;
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(plat3X, groundY - 250, 300, 250);
        ctx.fillStyle = '#66BB6A';
        ctx.fillRect(plat3X, groundY - 250, 300, 20);

        // 7. Blocks
        drawBlock(plat2X + 20, groundY - 240, blockSize);
        drawGoldBlock(plat2X + 80, groundY - 240, blockSize, 10);
        drawBlock(plat2X + 140, groundY - 240, blockSize);

        // 8. Coins (Added per critique)
        drawCoin(plat2X + 105, groundY - 290, 10);
        drawCoin(plat2X + 105, groundY - 330, 10);

        // 9. Enemy
        drawEnemy(plat2X + 100, groundY - 180);

        // 10. Flag (Distant Goal - Added per critique)
        drawFlag(plat3X + 220, groundY - 400, 150);

        // 11. Hero (Dynamic Jump - Added per critique)
        drawHero(width * 0.25, groundY - 100);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
