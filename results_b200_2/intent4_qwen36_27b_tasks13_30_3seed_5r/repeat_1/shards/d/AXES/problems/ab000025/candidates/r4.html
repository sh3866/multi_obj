<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial: Tactile Interface</title>
    <style>
        :root {
            --bg-dark: #050507;
            --bg-accent: #121418;
            --text-primary: #d1d5db;
            --text-secondary: #6b7280;
            --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: var(--font-display);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* Stage Container */
        #art-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 60% 40%, #1a1d26 0%, #020203 80%);
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.06;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main SVG Container */
        svg {
            height: 96vh;
            width: auto;
            max-width: 96vw;
            z-index: 5;
            /* Editorial crop feel */
            transform: scale(1.05); 
        }

        /* UI Overlay Elements */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .editorial-tag {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-primary);
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .editorial-tag::before {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-primary);
        }

        .technical-data {
            font-family: monospace;
            font-size: 10px;
            color: var(--text-secondary);
            text-align: right;
            line-height: 1.4;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    
    <!-- UI Elements -->
    <div class="ui-layer">
        <div class="editorial-tag">
            <span>Human / Interface</span>
        </div>
        <div class="technical-data">
            FIG. 04A<br>
            GRIP_ANALYSIS<br>
            RENDER_V2.0
        </div>
    </div>

    <div id="art-stage">
        <!-- ViewBox adjusted for tighter crop -->
        <svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- ================= SKIN TEXTURES ================= -->
                
                <!-- Skin Gradient: Complex lighting for volume -->
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#e8cbb3" /> <!-- Highlight -->
                    <stop offset="35%" stop-color="#c49f82" /> <!-- Midtone -->
                    <stop offset="80%" stop-color="#7a4b33" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#3a1e12" /> <!-- Deep Shadow -->
                </linearGradient>

                <!-- Subsurface Scattering (Warm edge glow) -->
                <linearGradient id="skinSSS" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff7040" stop-opacity="0" />
                    <stop offset="50%" stop-color="#ff7040" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#ff7040" stop-opacity="0" />
                </linearGradient>

                <!-- Deep Crease Shadow -->
                <linearGradient id="creaseShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2a1205" stop-opacity="0.9" />
                    <stop offset="50%" stop-color="#2a1205" stop-opacity="0.5" />
                    <stop offset="100%" stop-color="#2a1205" stop-opacity="0.1" />
                </linearGradient>

                <!-- Nail Gradient (Pearlescent) -->
                <linearGradient id="nailGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#fff0e6" />
                    <stop offset="40%" stop-color="#ffe0c8" />
                    <stop offset="100%" stop-color="#e6cca8" />
                </linearGradient>

                <!-- ================= DEVICE MATERIALS ================= -->

                <!-- Titanium Frame -->
                <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#555" />
                    <stop offset="20%" stop-color="#222" />
                    <stop offset="50%" stop-color="#111" />
                    <stop offset="80%" stop-color="#333" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <!-- Screen Base -->
                <linearGradient id="screenBase" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#1a1c23" />
                    <stop offset="100%" stop-color="#050508" />
                </linearGradient>

                <!-- Screen Glow (Abstract UI) -->
                <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
                    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </radialGradient>

                <!-- Glass Reflection (Diagonal Sheen) -->
                <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
                    <stop offset="15%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="42%" stop-color="#ffffff" stop-opacity="0.2" />
                    <stop offset="45%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurContact" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="5" />
                </filter>
                <filter id="blurDeep" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="40" />
                </filter>
                <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#000" flood-opacity="0.8"/>
                </filter>
            </defs>

            <!-- BACKGROUND AMBIENT -->
            <rect width="100%" height="100%" fill="url(#screenGlow)" opacity="0.5" transform="translate(0, 0)" />

            <!-- ========================================== -->
            <!-- LAYER 1: DEVICE (BACKGROUND)               -->
            <!-- ========================================== -->
            <!-- Rotated slightly for dynamic composition -->
            <g id="device" transform="translate(140, 120) rotate(-15)">
                
                <!-- Device Body (Titanium) -->
                <rect x="0" y="0" width="180" height="460" rx="28" fill="url(#titaniumFrame)" filter="url(#dropShadow)" />
                
                <!-- Inner Bezel -->
                <rect x="3" y="3" width="174" height="454" rx="25" fill="#000" />

                <!-- Screen -->
                <rect x="4" y="4" width="172" height="452" rx="24" fill="url(#screenBase)" />

                <!-- Screen Content (Abstract UI) -->
                <g opacity="0.9">
                    <!-- Abstract App Card 1 -->
                    <rect x="18" y="100" width="144" height="140" rx="20" fill="#252936" />
                    <circle cx="90" cy="170" r="40" fill="#2d3242" />
                    <!-- Abstract App Card 2 -->
                    <rect x="18" y="260" width="144" height="80" rx="20" fill="#252936" />
                    <!-- Abstract Text Lines -->
                    <rect x="18" y="360" width="100" height="6" rx="3" fill="#3a3f4e" />
                    <rect x="18" y="380" width="140" height="6" rx="3" fill="#3a3f4e" />
                    <rect x="18" y="400" width="80" height="6" rx="3" fill="#3a3f4e" />
                </g>

                <!-- Hardware Details -->
                <!-- Dynamic Island -->
                <rect x="60" y="16" width="60" height="14" rx="7" fill="#000" />
                <circle cx="108" cy="23" r="3.5" fill="#050505" /> <!-- Camera -->
                <rect x="65" y="23" width="20" height="2" rx="1" fill="#1a1a1a" /> <!-- Speaker -->

                <!-- Glass Reflection Overlay -->
                <rect x="4" y="4" width="172" height="452" rx="24" fill="url(#glassSheen)" style="mix-blend-mode: screen;" />
                
                <!-- Edge Glare (Rim Light) -->
                <path d="M 4 28 Q 4 4 28 4 L 152 4 Q 176 4 176 28 L 176 432 Q 176 456 152 456 L 28 456 Q 4 456 4 432" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
            </g>

            <!-- ========================================== -->
            <!-- LAYER 2: THE HAND (FOREGROUND)             -->
            <!-- ========================================== -->
            <!-- Reconstructed for anatomy: Palm base, tapered fingers, thumb crossing -->
            <g id="hand" transform="translate(0, 0)">

                <!-- A. FINGERS (Wrapping Right Side) -->
                <!-- Positioned to overlap the phone edge -->
                <g id="fingers-right">
                    
                    <!-- Index Finger -->
                    <g>
                        <!-- Main Digit (Tapered, pressing into curve) -->
                        <path d="M 340 280 C 390 270, 430 280, 440 305 C 440 325, 380 335, 340 320 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle Joint (Protrusion) -->
                        <path d="M 350 285 C 365 275, 375 285, 370 295 C 360 305, 345 295, 350 285 Z" fill="url(#skinGradient)" />
                        <!-- Nail (Visible on side, pearlescent) -->
                        <ellipse cx="430" cy="305" rx="6" ry="9" fill="url(#nailGradient)" transform="rotate(20 430 305)" />
                        <!-- Specular Highlight -->
                        <path d="M 360 285 C 380 275, 400 280, 415 290" stroke="#fff" stroke-width="2" stroke-opacity="0.6" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 340 280 L 340 320" stroke="#000" stroke-width="8" opacity="0.5" filter="url(#blurContact)" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M 340 325 C 395 315, 435 325, 445 350 C 445 370, 385 380, 340 365 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 360 325 C 375 315, 385 325, 380 335 C 370 345, 355 335, 360 325 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <ellipse cx="435" cy="348" rx="6" ry="9" fill="url(#nailGradient)" transform="rotate(20 435 348)" />
                        <path d="M 365 330 C 390 320, 410 325, 420 335" stroke="#fff" stroke-width="2" stroke-opacity="0.6" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 340 325 L 340 365" stroke="#000" stroke-width="8" opacity="0.5" filter="url(#blurContact)" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M 340 370 C 390 360, 425 370, 425 395 C 425 415, 380 425, 340 410 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 355 370 C 370 360, 380 370, 375 380 C 365 390, 350 380, 355 370 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <ellipse cx="415" cy="393" rx="5" ry="8" fill="url(#nailGradient)" transform="rotate(20 415 393)" />
                        <path d="M 360 375 C 385 365, 405 370, 410 380" stroke="#fff" stroke-width="2" stroke-opacity="0.6" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 340 370 L 340 410" stroke="#000" stroke-width="8" opacity="0.5" filter="url(#blurContact)" />
                    </g>

                    <!-- Pinky Finger (Shortest, tucked) -->
                    <g>
                        <path d="M 340 415 C 370 405, 395 415, 395 435 C 395 450, 360 460, 340 445 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 350 415 C 360 410, 370 420, 365 430 C 355 440, 345 430, 350 415 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <ellipse cx="385" cy="433" rx="4" ry="7" fill="url(#nailGradient)" transform="rotate(20 385 433)" />
                        <path d="M 355 420 C 370 410, 385 415, 390 425" stroke="#fff" stroke-width="2" stroke-opacity="0.6" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 340 415 L 340 445" stroke="#000" stroke-width="8" opacity="0.5" filter="url(#blurContact)" />
                    </g>
                </g>

                <!-- B. PALM & WRIST (Support) -->
                <!-- Smaller scale, distinct anatomy -->
                <g id="palm-base">
                    <!-- The main volume of the hand -->
                    <path d="M 300 460 
                             C 360 460, 420 560, 420 660 
                             C 420 760, 350 820, 250 820 
                             C 150 820, 120 720, 150 620 
                             C 170 540, 220 490, 300 460 Z" 
                          fill="url(#skinGradient)" />
                    
                    <!-- Palm Creases (Anatomical realism) -->
                    <g fill="none" stroke="url(#creaseShadow)" stroke-width="4" opacity="0.8" filter="url(#blurContact)">
                        <!-- Life Line -->
                        <path d="M 260 500 C 300 550, 280 650, 200 700" />
                        <!-- Head Line -->
                        <path d="M 180 580 C 230 580, 280 600, 320 620" />
                        <!-- Thumb Base Crease (Thenar) -->
                        <path d="M 200 480 C 220 500, 240 520, 280 520" />
                    </g>

                    <!-- Subsurface Scattering Overlay (Warmth on edges) -->
                    <path d="M 300 460 C 360 460, 420 560, 420 660 C 420 760, 350 820, 250 820" fill="none" stroke="url(#skinSSS)" stroke-width="10" filter="url(#blurContact)" opacity="0.6" />
                </g>

                <!-- C. THE THUMB (Interaction Point) -->
                <!-- Originating from palm base, crossing over screen -->
                <g id="thumb" transform="translate(0, 0)">
                    
                    <!-- Metacarpal Base (Thenar Eminence - Muscular) -->
                    <path d="M 220 540 C 240 500, 250 450, 240 400 L 270 400 C 280 450, 270 500, 260 540 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 240 400 C 240 350, 260 310, 290 300 L 305 320 C 280 340, 260 370, 270 400 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Tip (Pad) - The "Contact" Zone -->
                    <!-- Slightly flattened shape to imply pressure on screen -->
                    <path d="M 290 300 C 310 290, 330 300, 320 320 C 310 335, 280 330, 270 320 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Nail (Top side) -->
                    <ellipse cx="305" cy="305" rx="8" ry="12" fill="url(#nailGradient)" transform="rotate(35 305 305)" />
                    
                    <!-- Joint Crease -->
                    <path d="M 265 355 C 275 365, 285 370, 280 380" stroke="url(#creaseShadow)" stroke-width="3" fill="none" />
                    
                    <!-- Knuckle Highlight -->
                    <path d="M 250 370 C 260 360, 270 365, 275 375" stroke="#fff" stroke-width="2" fill="none" opacity="0.6" filter="url(#blurContact)" />
                </g>

                <!-- D. SHADOWS & INTERACTION -->
                
                <!-- 1. Thumb Cast Shadow (On Screen) -->
                <!-- Simulates the thumb blocking light, grounding it on the screen -->
                <ellipse cx="310" cy="330" rx="35" ry="25" fill="#000" opacity="0.7" filter="url(#blurContact)" transform="rotate(-15 310 330)" style="mix-blend-mode: multiply;" />

                <!-- 2. Palm Cast Shadow (On Phone Bottom) -->
                <rect x="200" y="420" width="140" height="80" fill="#000" opacity="0.6" filter="url(#blurContact)" />

                <!-- 3. Rim Light (Separation) -->
                <!-- Cool white light on the left edge of the hand -->
                <path d="M 300 460 C 270 510, 230 610, 270 710" stroke="#fff" stroke-width="3" fill="none" opacity="0.4" filter="url(#blurContact)" />
                
                <!-- Warm Rim on right fingers -->
                <path d="M 440 305 C 455 355, 455 405, 425 455" stroke="#ffad60" stroke-width="3" fill="none" opacity="0.5" filter="url(#blurContact)" />

            </g>
        </svg>
    </div>
</body>
</html>
