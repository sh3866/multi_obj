<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial: The Grip</title>
    <style>
        :root {
            --bg-deep: #030406;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            font-family: var(--font-sans);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cinematic Vignette & Noise */
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, #161922 0%, #050508 70%);
            overflow: hidden;
        }

        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.07;
            pointer-events: none;
            z-index: 100;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* The Art */
        svg {
            height: 100%;
            width: auto;
            max-width: 100%;
            display: block;
            margin: 0 auto;
            /* Subtle scale for impact */
            transform: scale(1.05); 
        }

        /* Minimal Metadata - strictly subtle */
        .meta {
            position: absolute;
            bottom: 24px;
            left: 24px;
            font-size: 10px;
            color: #ffffff;
            opacity: 0.3;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 500;
            z-index: 10;
            display: flex;
            gap: 20px;
        }
        
        .meta span {
            border-left: 1px solid rgba(255,255,255,0.2);
            padding-left: 10px;
        }

    </style>
</head>
<body>

    <div class="stage">
        <div class="noise"></div>
        
        <!-- Metadata -->
        <div class="meta">
            Grip_Analysis <span>Fig. 04A</span>
        </div>

        <!-- Main Illustration -->
        <svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- ================= SKIN GRADIENTS ================= -->
                
                <!-- Main Skin: High contrast, deep shadows, warm highlights -->
                <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#e6cbb3" /> <!-- Bone highlight -->
                    <stop offset="40%" stop-color="#c49f82" /> <!-- Flesh -->
                    <stop offset="85%" stop-color="#7a4b33" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#2a1205" /> <!-- Deep Occlusion -->
                </linearGradient>

                <!-- Screen Reflection on Skin: Cool blue/purple glow -->
                <linearGradient id="screenReflect" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
                    <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.2" />
                    <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </linearGradient>

                <!-- Nail: Translucent, pearlescent -->
                <linearGradient id="nailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#fff0e6" stop-opacity="0.9" />
                    <stop offset="50%" stop-color="#ffe0c8" stop-opacity="0.7" />
                    <stop offset="100%" stop-color="#e6cca8" stop-opacity="0.8" />
                </linearGradient>

                <!-- ================= DEVICE GRADIENTS ================= -->
                
                <!-- Titanium Chassis -->
                <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#444" />
                    <stop offset="20%" stop-color="#111" />
                    <stop offset="50%" stop-color="#222" />
                    <stop offset="80%" stop-color="#000" />
                    <stop offset="100%" stop-color="#333" />
                </linearGradient>

                <!-- Screen Display -->
                <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#1a1c23" />
                    <stop offset="100%" stop-color="#050508" />
                </linearGradient>

                <!-- Glass Glare -->
                <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.15" />
                    <stop offset="20%" stop-color="#fff" stop-opacity="0.0" />
                    <stop offset="45%" stop-color="#fff" stop-opacity="0.0" />
                    <stop offset="47%" stop-color="#fff" stop-opacity="0.1" />
                    <stop offset="50%" stop-color="#fff" stop-opacity="0.0" />
                    <stop offset="100%" stop-color="#fff" stop-opacity="0.02" />
                </linearGradient>

                <!-- Filters -->
                <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                <filter id="deepBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="12" />
                </filter>
                <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="8" />
                </filter>
                <!-- Contact Shadow (Squish) -->
                <filter id="contactShadow">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
                    <feOffset dx="2" dy="4" result="offsetBlur"/>
                    <feFlood flood-color="#000" flood-opacity="0.6" result="shadowColor"/>
                    <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
                    <feMerge>
                        <feMergeNode in="shadow"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- BACKGROUND GLOW -->
            <circle cx="300" cy="400" r="300" fill="#6366f1" opacity="0.15" filter="url(#deepBlur)" />

            <!-- ========================================== -->
            <!-- LAYER 1: THE DEVICE (BACK)                 -->
            <!-- ========================================== -->
            <g id="phone" transform="translate(240, 180) rotate(-12)">
                
                <!-- Device Drop Shadow -->
                <rect x="-10" y="-10" width="220" height="520" rx="40" fill="#000" opacity="0.6" filter="url(#deepBlur)" transform="translate(20, 40)" />

                <!-- Titanium Body -->
                <rect x="0" y="0" width="200" height="500" rx="36" fill="url(#metal)" />
                
                <!-- Inner Bezel (Black) -->
                <rect x="4" y="4" width="192" height="492" rx="32" fill="#000" />

                <!-- Screen Content -->
                <rect x="5" y="5" width="190" height="490" rx="31" fill="url(#screenBg)" />
                
                <!-- Screen UI Elements (Abstract) -->
                <g opacity="0.8">
                    <!-- Top Notch -->
                    <rect x="65" y="20" width="70" height="16" rx="8" fill="#000" />
                    
                    <!-- Abstract Content Blocks -->
                    <rect x="20" y="80" width="160" height="120" rx="16" fill="#252936" opacity="0.8" />
                    <circle cx="100" cy="140" r="35" fill="#3a3f4e" />
                    
                    <rect x="20" y="230" width="160" height="40" rx="12" fill="#252936" opacity="0.6" />
                    <rect x="20" y="290" width="120" height="6" rx="3" fill="#3a3f4e" />
                    <rect x="20" y="310" width="140" height="6" rx="3" fill="#3a3f4e" />
                    <rect x="20" y="330" width="90" height="6" rx="3" fill="#3a3f4e" />
                </g>

                <!-- Glass Reflection -->
                <rect x="5" y="5" width="190" height="490" rx="31" fill="url(#glare)" style="mix-blend-mode: screen;" />
                
                <!-- Screen Edge Glow (Rim Light) -->
                <path d="M 5 36 Q 5 5 36 5 L 164 5 Q 195 5 195 36 L 195 464 Q 195 495 164 495 L 36 495 Q 5 495 5 464" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
            </g>

            <!-- ========================================== -->
            <!-- LAYER 2: THE HAND (FOREGROUND)             -->
            <!-- ========================================== -->
            <g id="hand">

                <!-- A. PALM & WRIST (The Support) -->
                <!-- Darker, receding into shadow to emphasize the grip -->
                <g id="palm">
                    <!-- Main Volume -->
                    <path d="M 360 480 
                             C 420 480, 480 580, 490 680 
                             C 500 780, 400 850, 320 850 
                             C 240 850, 200 750, 220 650 
                             C 240 550, 280 490, 360 480 Z" 
                          fill="url(#skinBase)" />
                    
                    <!-- Palm Creases (Depth) -->
                    <g fill="none" stroke="#2a1205" stroke-width="6" opacity="0.7" filter="url(#softBlur)">
                        <!-- Life Line -->
                        <path d="M 280 520 C 320 580, 300 680, 240 730" />
                        <!-- Head Line -->
                        <path d="M 220 600 C 280 600, 340 620, 380 640" />
                        <!-- Thenar Eminence (Thumb base muscle) -->
                        <path d="M 240 500 C 260 520, 280 540, 320 540" />
                    </g>

                    <!-- Subsurface Scattering (Warm edge glow) -->
                    <path d="M 360 480 C 420 480, 480 580, 490 680 C 500 780, 400 850, 320 850" fill="none" stroke="#ff7040" stroke-width="12" filter="url(#softBlur)" opacity="0.4" />
                </g>

                <!-- B. FINGERS (The Grip) -->
                <!-- Wrapping around the RIGHT edge of the phone -->
                <g id="fingers">
                    
                    <!-- Index Finger -->
                    <g>
                        <!-- Phalanx 1 & 2 (Tapered) -->
                        <path d="M 380 300 C 430 290, 460 300, 470 325 C 470 345, 410 355, 380 340 Z" fill="url(#skinBase)" />
                        
                        <!-- Knuckle Joint (Highlight) -->
                        <ellipse cx="410" cy="315" rx="12" ry="10" fill="#fff" opacity="0.1" filter="url(#softBlur)" />
                        
                        <!-- Nail (Side view, pearlescent) -->
                        <ellipse cx="465" cy="325" rx="5" ry="8" fill="url(#nailGrad)" transform="rotate(25 465 325)" />
                        
                        <!-- Cast Shadow on Phone Edge -->
                        <path d="M 380 300 L 380 340" stroke="#000" stroke-width="10" opacity="0.6" filter="url(#shadowBlur)" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M 380 345 C 440 335, 470 345, 480 370 C 480 390, 420 400, 380 385 Z" fill="url(#skinBase)" />
                        
                        <!-- Knuckle -->
                        <ellipse cx="420" cy="360" rx="12" ry="10" fill="#fff" opacity="0.1" filter="url(#softBlur)" />
                        
                        <!-- Nail -->
                        <ellipse cx="475" cy="368" rx="5" ry="8" fill="url(#nailGrad)" transform="rotate(25 475 368)" />
                        
                        <!-- Cast Shadow -->
                        <path d="M 380 345 L 380 385" stroke="#000" stroke-width="10" opacity="0.6" filter="url(#shadowBlur)" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M 380 390 C 430 380, 460 390, 460 415 C 460 435, 410 445, 380 430 Z" fill="url(#skinBase)" />
                        
                        <!-- Knuckle -->
                        <ellipse cx="410" cy="405" rx="11" ry="9" fill="#fff" opacity="0.1" filter="url(#softBlur)" />
                        
                        <!-- Nail -->
                        <ellipse cx="455" cy="413" rx="5" ry="7" fill="url(#nailGrad)" transform="rotate(25 455 413)" />
                        
                        <!-- Cast Shadow -->
                        <path d="M 380 390 L 380 430" stroke="#000" stroke-width="10" opacity="0.6" filter="url(#shadowBlur)" />
                    </g>

                    <!-- Pinky Finger (Short, tucked) -->
                    <g>
                        <path d="M 380 435 C 410 425, 435 435, 435 455 C 435 470, 400 480, 380 465 Z" fill="url(#skinBase)" />
                        
                        <!-- Knuckle -->
                        <ellipse cx="400" cy="450" rx="10" ry="8" fill="#fff" opacity="0.1" filter="url(#softBlur)" />
                        
                        <!-- Nail -->
                        <ellipse cx="430" cy="453" rx="4" ry="6" fill="url(#nailGrad)" transform="rotate(25 430 453)" />
                        
                        <!-- Cast Shadow -->
                        <path d="M 380 435 L 380 465" stroke="#000" stroke-width="10" opacity="0.6" filter="url(#shadowBlur)" />
                    </g>
                </g>

                <!-- C. THE THUMB (The Interaction) -->
                <!-- Pressing against the SCREEN surface -->
                <g id="thumb">
                    
                    <!-- Thenar Base (Muscle) -->
                    <path d="M 260 540 C 280 500, 290 450, 280 400 L 310 400 C 320 450, 310 500, 300 540 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 280 400 C 280 350, 300 310, 330 300 L 345 320 C 320 340, 300 370, 310 400 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Tip (Pad) - Flattened for contact -->
                    <path d="M 330 300 C 350 290, 370 300, 360 320 C 350 335, 320 330, 310 320 Z" fill="url(#skinBase)" />
                    
                    <!-- Contact Compression (Indentation shadow) -->
                    <path d="M 330 300 C 350 290, 370 300, 360 320" fill="none" stroke="#1a0d05" stroke-width="3" opacity="0.8" filter="url(#softBlur)" />

                    <!-- Nail (Top side) -->
                    <ellipse cx="345" cy="305" rx="8" ry="12" fill="url(#nailGrad)" transform="rotate(35 345 305)" />
                    
                    <!-- Joint Crease -->
                    <path d="M 305 355 C 315 365, 325 370, 320 380" stroke="#2a1205" stroke-width="3" fill="none" opacity="0.8" />
                    
                    <!-- Knuckle Highlight -->
                    <path d="M 290 370 C 300 360, 310 365, 315 375" stroke="#fff" stroke-width="2" fill="none" opacity="0.5" filter="url(#softBlur)" />
                </g>

                <!-- D. INTERACTION LIGHTING -->
                
                <!-- 1. Screen Glow on Thumb -->
                <!-- The screen light hits the thumb pad -->
                <ellipse cx="340" cy="315" rx="25" ry="15" fill="url(#screenReflect)" filter="url(#softBlur)" style="mix-blend-mode: screen;" />

                <!-- 2. Thumb Cast Shadow (On Screen) -->
                <!-- Grounds the thumb to the glass -->
                <ellipse cx="355" cy="335" rx="30" ry="20" fill="#000" opacity="0.7" filter="url(#shadowBlur)" transform="rotate(-15 355 335)" style="mix-blend-mode: multiply;" />

                <!-- 3. Palm Cast Shadow (On Phone Bottom) -->
                <rect x="250" y="450" width="150" height="100" fill="#000" opacity="0.5" filter="url(#deepBlur)" />

                <!-- 4. Rim Lights (Separation from BG) -->
                <!-- Cool light on left edge of hand -->
                <path d="M 300 500 C 270 550, 230 650, 270 750" stroke="#a5b4fc" stroke-width="2" fill="none" opacity="0.3" filter="url(#softBlur)" />
                
                <!-- Warm light on right fingers (Backlight) -->
                <path d="M 470 325 C 485 375, 485 425, 455 475" stroke="#ffad60" stroke-width="3" fill="none" opacity="0.4" filter="url(#softBlur)" />

            </g>
        </svg>
    </div>
</body>
</html>
