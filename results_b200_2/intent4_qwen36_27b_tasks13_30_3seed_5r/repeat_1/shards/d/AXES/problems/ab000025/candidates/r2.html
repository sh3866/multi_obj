<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tactile Interface: Revision 03</title>
    <style>
        :root {
            --bg-dark: #050608;
            --bg-accent: #12141a;
            --text-primary: #f0f0f0;
            --text-secondary: #6b7280;
            --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: var(--font-display);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* Stage Container */
        #art-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Deep, moody background gradient */
            background: radial-gradient(ellipse at 50% 60%, #1a1d26 0%, #050608 80%);
        }

        /* Noise Texture Overlay - Soft Light blend for grain */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.06;
            mix-blend-mode: soft-light;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main SVG Container */
        svg {
            height: 96vh;
            width: auto;
            max-width: 96vw;
            /* Soft drop shadow to lift the composition */
            filter: drop-shadow(0 20px 60px rgba(0,0,0,0.6));
            z-index: 5;
            /* Slight rotation for editorial dynamic feel */
            transform: rotate(-3deg); 
        }

        /* UI Overlay Elements */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .metadata {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .metadata strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .accent-line {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.5), transparent);
        }

        .corner-mark {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 20px;
            height: 20px;
            border-right: 1px solid var(--text-secondary);
            border-bottom: 1px solid var(--text-secondary);
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    
    <!-- UI Elements -->
    <div class="ui-layer">
        <div class="accent-line"></div>
        <div class="corner-mark"></div>
        <div class="metadata">
            <div>
                <span>PROJECT:</span> <strong>TACTILE_INTERACTION_V3</span>
            </div>
            <div>
                <span>FOCUS:</span> <strong>ANATOMY &amp; MATERIALITY</span>
            </div>
            <div>
                <span>RENDER:</span> <strong>VECTOR HYBRID</span>
            </div>
        </div>
    </div>

    <div id="art-stage">
        <!-- 
            REVISION NOTES (V3):
            1. Composition: Shifted to a tighter, more dynamic angle.
            2. Lighting: Established a "Cool Rim" light source (Left) vs "Warm Ambient" (Right).
            3. Anatomy: Fingers are now organic paths, not stacked shapes. Distinct knuckles and nails.
            4. Device: High-contrast metallic frame with a distinct screen glow to anchor the hand.
        -->
        <svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- ================= SKIN TEXTURES ================= -->
                
                <!-- Base Skin Gradient: Left is lit (cool), Right is shadow (warm) -->
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#e8d5c8" /> <!-- Highlight -->
                    <stop offset="30%" stop-color="#d1a88d" /> <!-- Midtone -->
                    <stop offset="80%" stop-color="#9c6b4e" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#5e3b26" /> <!-- Deep Shadow -->
                </linearGradient>

                <!-- Subsurface Scattering (Warm edge glow) -->
                <linearGradient id="skinSSS" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffad60" stop-opacity="0" />
                    <stop offset="50%" stop-color="#ffad60" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#ffad60" stop-opacity="0" />
                </linearGradient>

                <!-- Deep Crease Shadow -->
                <linearGradient id="creaseShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#4a2c1a" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#4a2c1a" stop-opacity="0.2" />
                </linearGradient>

                <!-- ================= DEVICE MATERIALS ================= -->

                <!-- Titanium Frame -->
                <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#555" />
                    <stop offset="10%" stop-color="#222" />
                    <stop offset="50%" stop-color="#111" />
                    <stop offset="90%" stop-color="#333" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <!-- Screen Base -->
                <linearGradient id="screenBase" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0a0b10" />
                    <stop offset="100%" stop-color="#020203" />
                </linearGradient>

                <!-- Screen Glow (Abstract UI) -->
                <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
                    <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </radialGradient>

                <!-- Glass Reflection (Diagonal Sheen) -->
                <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
                    <stop offset="20%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="45%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="46%" stop-color="#ffffff" stop-opacity="0.15" />
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurContact" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
                <filter id="blurDeep" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="25" />
                </filter>
                <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
                    <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
                </filter>
            </defs>

            <!-- BACKGROUND AMBIENT -->
            <rect width="100%" height="100%" fill="url(#screenGlow)" opacity="0.3" transform="translate(50, 100)" />

            <!-- ========================================== -->
            <!-- LAYER 1: DEVICE (BACKGROUND)               -->
            <!-- ========================================== -->
            <g id="device" transform="translate(180, 120) rotate(-12)">
                
                <!-- Device Body (Titanium) -->
                <rect x="0" y="0" width="140" height="380" rx="20" fill="url(#titaniumFrame)" filter="url(#dropShadow)" />
                
                <!-- Inner Bezel -->
                <rect x="3" y="3" width="134" height="374" rx="17" fill="#000" />

                <!-- Screen -->
                <rect x="4" y="4" width="132" height="372" rx="16" fill="url(#screenBase)" />

                <!-- Screen Content (Subtle UI) -->
                <g opacity="0.7">
                    <!-- Abstract App Card -->
                    <rect x="15" y="80" width="110" height="100" rx="12" fill="#151820" />
                    <circle cx="70" cy="130" r="25" fill="#1e222e" />
                    <!-- Abstract Text Lines -->
                    <rect x="15" y="200" width="90" height="4" rx="2" fill="#2a2e38" />
                    <rect x="15" y="215" width="110" height="4" rx="2" fill="#2a2e38" />
                    <rect x="15" y="230" width="60" height="4" rx="2" fill="#2a2e38" />
                </g>

                <!-- Hardware Details -->
                <!-- Dynamic Island / Notch -->
                <rect x="45" y="12" width="50" height="10" rx="5" fill="#000" />
                <circle cx="85" cy="17" r="2.5" fill="#0a0a0a" /> <!-- Camera -->
                <rect x="50" y="17" width="15" height="1.5" rx="0.75" fill="#1a1a1a" /> <!-- Speaker -->

                <!-- Glass Reflection Overlay -->
                <rect x="4" y="4" width="132" height="372" rx="16" fill="url(#glassSheen)" style="mix-blend-mode: overlay;" />
                
                <!-- Edge Glare (Rim Light) -->
                <path d="M 4 20 Q 4 4 20 4 L 120 4 Q 136 4 136 20 L 136 360 Q 136 376 120 376 L 20 376 Q 4 376 4 360" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
            </g>

            <!-- ========================================== -->
            <!-- LAYER 2: THE HAND (FOREGROUND)             -->
            <!-- ========================================== -->
            <!-- 
               The hand is split into logical groups:
               1. Fingers wrapping the right side (Index, Middle, Ring, Pinky)
               2. The Thumb interacting with the screen (Left side)
               3. The Palm/Wrist support (Bottom)
            -->
            <g id="hand" transform="translate(0, 0)">

                <!-- A. FINGERS (Wrapping Right Side) -->
                <!-- These curves follow the device edge -->
                <g id="fingers-right">
                    
                    <!-- Index Finger -->
                    <g>
                        <!-- Main Digit -->
                        <path d="M 320 200 C 360 190, 390 200, 390 220 C 390 235, 350 245, 320 240 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle Joint (Protrusion) -->
                        <path d="M 365 205 C 375 200, 380 210, 375 215 C 365 220, 360 210, 365 205 Z" fill="url(#skinGradient)" stroke="url(#creaseShadow)" stroke-width="1" />
                        <!-- Nail -->
                        <ellipse cx="382" cy="218" rx="4" ry="7" fill="#f5e1d1" transform="rotate(15 382 218)" opacity="0.8" />
                        <!-- Specular Highlight -->
                        <path d="M 330 205 C 350 195, 370 200, 380 210" stroke="#fff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M 320 245 C 370 235, 400 245, 400 265 C 400 280, 350 290, 320 285 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 375 245 C 385 240, 390 250, 385 255 C 375 260, 370 250, 375 245 Z" fill="url(#skinGradient)" stroke="url(#creaseShadow)" stroke-width="1" />
                        <!-- Nail -->
                        <ellipse cx="392" cy="263" rx="4" ry="7" fill="#f5e1d1" transform="rotate(15 392 263)" opacity="0.8" />
                        <path d="M 335 250 C 360 240, 380 245, 390 255" stroke="#fff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M 320 290 C 365 280, 395 290, 395 310 C 395 325, 350 335, 320 330 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 370 290 C 380 285, 385 295, 380 300 C 370 305, 365 295, 370 290 Z" fill="url(#skinGradient)" stroke="url(#creaseShadow)" stroke-width="1" />
                        <!-- Nail -->
                        <ellipse cx="387" cy="308" rx="4" ry="7" fill="#f5e1d1" transform="rotate(15 387 308)" opacity="0.8" />
                        <path d="M 330 295 C 355 285, 375 290, 385 300" stroke="#fff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
                    </g>

                    <!-- Pinky Finger (Shortest) -->
                    <g>
                        <path d="M 320 335 C 350 325, 375 335, 375 355 C 375 370, 340 380, 320 375 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 345 335 C 355 330, 360 340, 355 345 C 345 350, 340 340, 345 335 Z" fill="url(#skinGradient)" stroke="url(#creaseShadow)" stroke-width="1" />
                        <!-- Nail -->
                        <ellipse cx="367" cy="353" rx="3.5" ry="6" fill="#f5e1d1" transform="rotate(15 367 353)" opacity="0.8" />
                        <path d="M 330 340 C 345 330, 360 335, 365 345" stroke="#fff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
                    </g>
                </g>

                <!-- B. PALM & WRIST (Support) -->
                <g id="palm-base">
                    <!-- The main volume of the hand -->
                    <path d="M 250 350 
                             C 350 350, 420 450, 420 550 
                             C 420 650, 350 700, 250 700 
                             C 150 700, 150 600, 180 500 
                             C 200 450, 220 400, 250 350 Z" 
                          fill="url(#skinGradient)" />
                    
                    <!-- Palm Creases (Anatomical realism) -->
                    <g fill="none" stroke="url(#creaseShadow)" stroke-width="2" opacity="0.7" filter="url(#blurContact)">
                        <!-- Life Line -->
                        <path d="M 280 400 C 320 450, 300 550, 220 600" />
                        <!-- Head Line -->
                        <path d="M 200 480 C 250 480, 300 500, 340 520" />
                        <!-- Thumb Base Crease -->
                        <path d="M 200 380 C 220 400, 240 420, 280 420" />
                    </g>

                    <!-- Subsurface Scattering Overlay (Warmth on edges) -->
                    <path d="M 250 350 C 350 350, 420 450, 420 550 C 420 650, 350 700, 250 700" fill="none" stroke="url(#skinSSS)" stroke-width="6" filter="url(#blurContact)" opacity="0.6" />
                </g>

                <!-- C. THE THUMB (Interaction Point) -->
                <!-- Positioned crossing over the screen area -->
                <g id="thumb" transform="translate(0, 0)">
                    
                    <!-- Metacarpal Base (connecting to palm) -->
                    <path d="M 220 480 C 240 450, 250 400, 240 350 L 270 350 C 280 400, 270 450, 260 480 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 240 350 C 240 300, 260 260, 290 250 L 305 270 C 280 290, 260 320, 270 350 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Tip (Pad) - The "Contact" Zone -->
                    <!-- Slightly flattened shape to imply pressure on screen -->
                    <path d="M 290 250 C 310 240, 330 250, 320 270 C 310 285, 280 280, 270 270 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Nail (Top side) -->
                    <ellipse cx="305" cy="255" rx="6" ry="10" fill="#f5e1d1" transform="rotate(30 305 255)" opacity="0.9" />
                    
                    <!-- Joint Crease -->
                    <path d="M 265 295 C 275 305, 285 310, 280 320" stroke="url(#creaseShadow)" stroke-width="2" fill="none" />
                    
                    <!-- Knuckle Highlight -->
                    <path d="M 250 310 C 260 300, 270 305, 275 315" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.5" />
                </g>

                <!-- D. SHADOWS & INTERACTION -->
                
                <!-- 1. Thumb Cast Shadow (On Screen) -->
                <!-- Simulates the thumb blocking light, grounding it on the screen -->
                <ellipse cx="310" cy="280" rx="25" ry="15" fill="#000" opacity="0.5" filter="url(#blurContact)" transform="rotate(-15 310 280)" style="mix-blend-mode: multiply;" />

                <!-- 2. Finger Cast Shadows (On Device Edge) -->
                <!-- Darkens the gap between fingers and device -->
                <path d="M 320 200 L 320 380" stroke="#000" stroke-width="4" opacity="0.6" filter="url(#blurContact)" />

                <!-- 3. Palm Cast Shadow (On Phone Bottom) -->
                <rect x="200" y="350" width="100" height="50" fill="#000" opacity="0.4" filter="url(#blurContact)" />

                <!-- 4. Rim Light (Separation) -->
                <!-- Cool white light on the left edge of the hand -->
                <path d="M 250 350 C 220 400, 180 500, 220 600" stroke="#fff" stroke-width="2" fill="none" opacity="0.2" filter="url(#blurContact)" />
                
                <!-- Warm Rim on right fingers -->
                <path d="M 390 200 C 410 250, 410 300, 380 380" stroke="#ffad60" stroke-width="2" fill="none" opacity="0.3" filter="url(#blurContact)" />

            </g>
        </svg>
    </div>
</body>
</html>
