<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactile Interface: Revision 04</title>
    <style>
        :root {
            --bg-dark: #08090c;
            --bg-accent: #14161b;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: var(--font-display);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* Stage Container */
        #art-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Deep, moody background gradient */
            background: radial-gradient(circle at 50% 50%, #1a1d26 0%, #050608 70%);
        }

        /* Noise Texture Overlay - Soft Light blend for grain */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.08;
            mix-blend-mode: soft-light;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main SVG Container */
        svg {
            height: 92vh;
            width: auto;
            max-width: 96vw;
            /* Soft drop shadow to lift the composition */
            filter: drop-shadow(0 30px 80px rgba(0,0,0,0.8));
            z-index: 5;
            /* Slight rotation for editorial dynamic feel */
            transform: rotate(-4deg); 
        }

        /* UI Overlay Elements */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .metadata {
            position: absolute;
            top: 40px;
            left: 40px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            line-height: 1.6;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .metadata strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .accent-line {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.3);
            margin-bottom: 10px;
        }

        .corner-mark {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 20px;
            height: 20px;
            border-right: 1px solid var(--text-secondary);
            border-bottom: 1px solid var(--text-secondary);
            opacity: 0.3;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    
    <!-- UI Elements -->
    <div class="ui-layer">
        <div class="accent-line"></div>
        <div class="metadata">
            <div><span>REV:</span> <strong>04</span></div>
            <div><span>OBJ:</span> <strong>ERGO_GRIP_ANALYSIS</span></div>
            <div><span>STATUS:</span> <strong>FINAL_RENDER</span></div>
        </div>
        <div class="corner-mark"></div>
    </div>

    <div id="art-stage">
        <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- ================= SKIN TEXTURES ================= -->
                
                <!-- Base Skin Gradient: Complex lighting for volume -->
                <linearGradient id="skinGradient" x1="10%" y1="0%" x2="90%" y2="100%">
                    <stop offset="0%" stop-color="#f0dcc8" /> <!-- Highlight -->
                    <stop offset="30%" stop-color="#d1a88d" /> <!-- Midtone -->
                    <stop offset="75%" stop-color="#9c6b4e" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#4a2c1a" /> <!-- Deep Shadow -->
                </linearGradient>

                <!-- Subsurface Scattering (Warm edge glow) -->
                <linearGradient id="skinSSS" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff9050" stop-opacity="0" />
                    <stop offset="60%" stop-color="#ff9050" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#ff9050" stop-opacity="0" />
                </linearGradient>

                <!-- Deep Crease Shadow -->
                <linearGradient id="creaseShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#3a1c0a" stop-opacity="0.9" />
                    <stop offset="50%" stop-color="#3a1c0a" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#3a1c0a" stop-opacity="0.1" />
                </linearGradient>

                <!-- ================= DEVICE MATERIALS ================= -->

                <!-- Titanium Frame -->
                <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#444" />
                    <stop offset="20%" stop-color="#1a1a1a" />
                    <stop offset="50%" stop-color="#0a0a0a" />
                    <stop offset="80%" stop-color="#222" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <!-- Screen Base -->
                <linearGradient id="screenBase" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#1a1c23" />
                    <stop offset="100%" stop-color="#050508" />
                </linearGradient>

                <!-- Screen Glow (Abstract UI) -->
                <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
                    <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </radialGradient>

                <!-- Glass Reflection (Diagonal Sheen) -->
                <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
                    <stop offset="15%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="42%" stop-color="#ffffff" stop-opacity="0.15" />
                    <stop offset="45%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurContact" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                <filter id="blurDeep" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="30" />
                </filter>
                <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
                    <feDropShadow dx="10" dy="20" stdDeviation="15" flood-color="#000" flood-opacity="0.7"/>
                </filter>
            </defs>

            <!-- BACKGROUND AMBIENT -->
            <rect width="100%" height="100%" fill="url(#screenGlow)" opacity="0.4" transform="translate(50, 50)" />

            <!-- ========================================== -->
            <!-- LAYER 1: DEVICE (BACKGROUND)               -->
            <!-- ========================================== -->
            <!-- Centered slightly higher to reduce palm dominance -->
            <g id="device" transform="translate(220, 150) rotate(-12)">
                
                <!-- Device Body (Titanium) -->
                <rect x="0" y="0" width="160" height="420" rx="24" fill="url(#titaniumFrame)" filter="url(#dropShadow)" />
                
                <!-- Inner Bezel -->
                <rect x="3" y="3" width="154" height="414" rx="21" fill="#000" />

                <!-- Screen -->
                <rect x="4" y="4" width="152" height="412" rx="20" fill="url(#screenBase)" />

                <!-- Screen Content (Subtle UI) -->
                <g opacity="0.8">
                    <!-- Abstract App Card -->
                    <rect x="15" y="90" width="130" height="120" rx="16" fill="#1e2230" />
                    <circle cx="80" cy="150" r="30" fill="#2a3040" />
                    <!-- Abstract Text Lines -->
                    <rect x="15" y="230" width="100" height="6" rx="3" fill="#2a2e38" />
                    <rect x="15" y="250" width="130" height="6" rx="3" fill="#2a2e38" />
                    <rect x="15" y="270" width="70" height="6" rx="3" fill="#2a2e38" />
                </g>

                <!-- Hardware Details -->
                <!-- Dynamic Island / Notch -->
                <rect x="55" y="14" width="50" height="12" rx="6" fill="#000" />
                <circle cx="95" cy="20" r="3" fill="#050505" /> <!-- Camera -->
                <rect x="60" y="20" width="18" height="2" rx="1" fill="#1a1a1a" /> <!-- Speaker -->

                <!-- Glass Reflection Overlay -->
                <rect x="4" y="4" width="152" height="412" rx="20" fill="url(#glassSheen)" style="mix-blend-mode: overlay;" />
                
                <!-- Edge Glare (Rim Light) -->
                <path d="M 4 24 Q 4 4 24 4 L 136 4 Q 156 4 156 24 L 156 396 Q 156 416 136 416 L 24 416 Q 4 416 4 396" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
            </g>

            <!-- ========================================== -->
            <!-- LAYER 2: THE HAND (FOREGROUND)             -->
            <!-- ========================================== -->
            <g id="hand" transform="translate(0, 0)">

                <!-- A. FINGERS (Wrapping Right Side) -->
                <!-- Redrawn to be tapered and organic, pressing against the device -->
                <g id="fingers-right">
                    
                    <!-- Index Finger -->
                    <g>
                        <!-- Main Digit (Tapered) -->
                        <path d="M 360 230 C 400 220, 430 230, 435 250 C 435 265, 390 275, 360 270 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle Joint (Protrusion) -->
                        <path d="M 370 235 C 385 225, 395 235, 390 245 C 380 255, 365 245, 370 235 Z" fill="url(#skinGradient)" />
                        <!-- Nail (Visible on side) -->
                        <ellipse cx="425" cy="248" rx="5" ry="8" fill="#f5e1d1" transform="rotate(20 425 248)" opacity="0.9" />
                        <!-- Specular Highlight -->
                        <path d="M 370 235 C 390 225, 410 230, 420 240" stroke="#fff" stroke-width="2" stroke-opacity="0.5" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 360 230 L 360 270" stroke="#000" stroke-width="6" opacity="0.4" filter="url(#blurContact)" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M 360 275 C 410 265, 440 275, 445 295 C 445 310, 390 320, 360 315 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 380 275 C 395 265, 405 275, 400 285 C 390 295, 375 285, 380 275 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <ellipse cx="435" cy="293" rx="5" ry="8" fill="#f5e1d1" transform="rotate(20 435 293)" opacity="0.9" />
                        <path d="M 375 280 C 400 270, 420 275, 430 285" stroke="#fff" stroke-width="2" stroke-opacity="0.5" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 360 275 L 360 315" stroke="#000" stroke-width="6" opacity="0.4" filter="url(#blurContact)" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M 360 320 C 405 310, 435 320, 435 340 C 435 355, 390 365, 360 360 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 375 320 C 390 310, 400 320, 395 330 C 385 340, 370 330, 375 320 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <ellipse cx="425" cy="338" rx="5" ry="8" fill="#f5e1d1" transform="rotate(20 425 338)" opacity="0.9" />
                        <path d="M 370 325 C 395 315, 415 320, 425 330" stroke="#fff" stroke-width="2" stroke-opacity="0.5" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 360 320 L 360 360" stroke="#000" stroke-width="6" opacity="0.4" filter="url(#blurContact)" />
                    </g>

                    <!-- Pinky Finger (Shortest) -->
                    <g>
                        <path d="M 360 365 C 390 355, 415 365, 415 385 C 415 400, 380 410, 360 405 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <path d="M 365 365 C 375 360, 385 370, 380 380 C 370 390, 360 380, 365 365 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <ellipse cx="405" cy="383" rx="4" ry="7" fill="#f5e1d1" transform="rotate(20 405 383)" opacity="0.9" />
                        <path d="M 370 370 C 385 360, 400 365, 405 375" stroke="#fff" stroke-width="2" stroke-opacity="0.5" fill="none" filter="url(#blurContact)" />
                        <!-- Cast Shadow on Phone -->
                        <path d="M 360 365 L 360 405" stroke="#000" stroke-width="6" opacity="0.4" filter="url(#blurContact)" />
                    </g>
                </g>

                <!-- B. PALM & WRIST (Support) -->
                <!-- Scaled down, shifted to bottom-left to not block view -->
                <g id="palm-base">
                    <!-- The main volume of the hand -->
                    <path d="M 320 400 
                             C 380 400, 450 500, 450 600 
                             C 450 700, 380 750, 280 750 
                             C 180 750, 150 650, 180 550 
                             C 200 480, 250 430, 320 400 Z" 
                          fill="url(#skinGradient)" />
                    
                    <!-- Palm Creases (Anatomical realism) -->
                    <g fill="none" stroke="url(#creaseShadow)" stroke-width="3" opacity="0.8" filter="url(#blurContact)">
                        <!-- Life Line -->
                        <path d="M 280 450 C 320 500, 300 600, 220 650" />
                        <!-- Head Line -->
                        <path d="M 200 530 C 250 530, 300 550, 340 570" />
                        <!-- Thumb Base Crease -->
                        <path d="M 200 430 C 220 450, 240 470, 280 470" />
                    </g>

                    <!-- Subsurface Scattering Overlay (Warmth on edges) -->
                    <path d="M 320 400 C 380 400, 450 500, 450 600 C 450 700, 380 750, 280 750" fill="none" stroke="url(#skinSSS)" stroke-width="8" filter="url(#blurContact)" opacity="0.5" />
                </g>

                <!-- C. THE THUMB (Interaction Point) -->
                <!-- Positioned crossing over the screen area, distinct anatomy -->
                <g id="thumb" transform="translate(0, 0)">
                    
                    <!-- Metacarpal Base (connecting to palm) -->
                    <path d="M 220 500 C 240 470, 250 420, 240 370 L 270 370 C 280 420, 270 470, 260 500 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 240 370 C 240 320, 260 280, 290 270 L 305 290 C 280 310, 260 340, 270 370 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Tip (Pad) - The "Contact" Zone -->
                    <!-- Slightly flattened shape to imply pressure on screen -->
                    <path d="M 290 270 C 310 260, 330 270, 320 290 C 310 305, 280 300, 270 290 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Nail (Top side) -->
                    <ellipse cx="305" cy="275" rx="7" ry="11" fill="#f5e1d1" transform="rotate(35 305 275)" opacity="0.95" />
                    
                    <!-- Joint Crease -->
                    <path d="M 265 315 C 275 325, 285 330, 280 340" stroke="url(#creaseShadow)" stroke-width="2.5" fill="none" />
                    
                    <!-- Knuckle Highlight -->
                    <path d="M 250 330 C 260 320, 270 325, 275 335" stroke="#fff" stroke-width="2" fill="none" opacity="0.6" filter="url(#blurContact)" />
                </g>

                <!-- D. SHADOWS & INTERACTION -->
                
                <!-- 1. Thumb Cast Shadow (On Screen) -->
                <!-- Simulates the thumb blocking light, grounding it on the screen -->
                <ellipse cx="310" cy="300" rx="30" ry="20" fill="#000" opacity="0.6" filter="url(#blurContact)" transform="rotate(-15 310 300)" style="mix-blend-mode: multiply;" />

                <!-- 2. Palm Cast Shadow (On Phone Bottom) -->
                <rect x="220" y="380" width="120" height="60" fill="#000" opacity="0.5" filter="url(#blurContact)" />

                <!-- 3. Rim Light (Separation) -->
                <!-- Cool white light on the left edge of the hand -->
                <path d="M 320 400 C 290 450, 250 550, 290 650" stroke="#fff" stroke-width="3" fill="none" opacity="0.3" filter="url(#blurContact)" />
                
                <!-- Warm Rim on right fingers -->
                <path d="M 435 250 C 450 300, 450 350, 420 400" stroke="#ffad60" stroke-width="3" fill="none" opacity="0.4" filter="url(#blurContact)" />

            </g>
        </svg>
    </div>
</body>
</html>
