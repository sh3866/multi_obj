<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tactile Interface: Revision 02</title>
    <style>
        :root {
            --bg-color: #050608;
            --text-primary: #e0e0e0;
            --text-secondary: #5a606b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* The canvas for the illustration */
        #art-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1a1c23 0%, #050608 100%);
        }

        /* Grain for texture */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main SVG Container - Tight Crop */
        svg {
            height: 95vh;
            width: auto;
            max-width: 95vw;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.8));
            z-index: 2;
        }

        /* Minimal, strict metadata overlay - aligned to grid */
        .metadata {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            z-index: 5;
            opacity: 0.6;
            line-height: 1.5;
        }

        .metadata span {
            display: block;
        }
        
        .accent-line {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 40px;
            height: 1px;
            background: #333;
            z-index: 5;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    
    <!-- Minimal UI Elements -->
    <div class="accent-line"></div>
    <div class="metadata">
        <span>STUDY: TACTILE_04</span>
        <span>FOCUS: THUMB_ARTICULATION</span>
        <span>LIGHT: 5600K_HARD</span>
    </div>

    <div id="art-stage">
        <!-- 
            REVISION NOTES:
            1. Composition: Tight crop on the grip. Removed dead space.
            2. Anatomy: Continuous paths for fingers, distinct knuckles, organic curves.
            3. Lighting: High contrast. Deep shadows in creases. Strong rim light.
            4. Material: Phone has glass reflection and metallic edge. Skin has subsurface tones.
        -->
        <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- SKIN GRADIENTS: Complex, multi-stop for realism -->
                <!-- Base Skin: Warm peach to cool brown -->
                <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f4d0b8" />
                    <stop offset="40%" stop-color="#e0a98b" />
                    <stop offset="100%" stop-color="#a66a46" />
                </linearGradient>
                
                <!-- Deep Shadow: For creases and under fingers -->
                <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8f5233" />
                    <stop offset="100%" stop-color="#3a1c0e" />
                </linearGradient>

                <!-- Specular Highlight: Sharp rim light -->
                <linearGradient id="skinSpecular" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>

                <!-- DEVICE GRADIENTS -->
                <!-- Titanium/Black Metal Frame -->
                <linearGradient id="deviceFrame" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#333" />
                    <stop offset="20%" stop-color="#111" />
                    <stop offset="50%" stop-color="#444" /> <!-- Edge highlight -->
                    <stop offset="80%" stop-color="#0a0a0a" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <!-- Screen Glass -->
                <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1a1c23" />
                    <stop offset="50%" stop-color="#0b0c10" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <!-- Screen Reflection (Diagonal Sheen) -->
                <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
                    <stop offset="30%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.05)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurSoft">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                
                <filter id="blurDeep">
                    <feGaussianBlur stdDeviation="15" />
                </filter>
            </defs>

            <!-- BACKGROUND VIGNETTE/DEPTH -->
            <circle cx="300" cy="400" r="300" fill="#000" filter="url(#blurDeep)" opacity="0.6" />

            <!-- ========================================== -->
            <!-- THE DEVICE (Background Layer)              -->
            <!-- ========================================== -->
            <g id="smartphone" transform="translate(250, 100) rotate(-8)">
                
                <!-- Phone Body/Frame -->
                <rect x="0" y="0" width="160" height="440" rx="24" fill="url(#deviceFrame)" stroke="#000" stroke-width="2" />
                
                <!-- Screen Area -->
                <rect x="4" y="4" width="152" height="432" rx="20" fill="url(#screenGlass)" />
                
                <!-- Screen Content (Abstract UI) -->
                <g opacity="0.4">
                    <rect x="15" y="60" width="130" height="130" rx="15" fill="#1e2129" />
                    <circle cx="80" cy="125" r="40" fill="#252933" />
                    <rect x="15" y="210" width="100" height="6" rx="3" fill="#333" />
                    <rect x="15" y="230" width="120" height="6" rx="3" fill="#333" />
                    <rect x="15" y="250" width="80" height="6" rx="3" fill="#333" />
                    <!-- Bottom Dock -->
                    <rect x="15" y="390" width="130" height="30" rx="10" fill="#1e2129" />
                </g>

                <!-- Camera Island -->
                <rect x="50" y="12" width="60" height="12" rx="6" fill="#000" />
                <circle cx="90" cy="18" r="3" fill="#111" /> <!-- Lens -->
                <rect x="55" y="18" width="30" height="1.5" rx="0.75" fill="#222" /> <!-- Speaker -->

                <!-- Glass Reflection Overlay (The "Sheen") -->
                <path d="M 0 0 L 160 0 L 160 200 L 0 300 Z" fill="url(#glassReflection)" style="mix-blend-mode: overlay;" pointer-events="none"/>
                
                <!-- Screen Edge Glare (Rim Light on Glass) -->
                <path d="M 4 4 Q 24 4 24 24 L 24 416 Q 24 436 4 436" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
            </g>

            <!-- ========================================== -->
            <!-- THE HAND (Foreground Layer)                -->
            <!-- ========================================== -->
            <g id="hand" transform="translate(0, 20)">
                
                <!-- 1. WRIST & PALM BASE (Behind phone fingers, but visible at bottom) -->
                <!-- Connects to bottom of screen -->
                <path d="M 180 450 Q 220 600 200 750 L 450 750 Q 480 600 400 480 Q 380 420 300 420 Z" fill="url(#skinBase)" />
                
                <!-- Palm Creases (Anatomy) -->
                <g stroke="url(#skinShadow)" stroke-width="3" fill="none" opacity="0.6" filter="url(#blurSoft)">
                    <path d="M 220 500 Q 280 480 350 520" /> <!-- Heart line approx -->
                    <path d="M 210 550 Q 260 540 320 560" /> <!-- Head line approx -->
                </g>

                <!-- 2. FINGERS (Wrapping from the Right) -->
                <!-- These overlap the phone to create the grip -->
                <g id="fingers-right">
                    
                    <!-- Index Finger -->
                    <g transform="translate(0, 0)">
                        <!-- Main Digit -->
                        <path d="M 380 250 Q 430 240 445 260 Q 450 280 400 290 L 380 290 Z" fill="url(#skinBase)" />
                        <!-- Knuckle Shadow (Contact point) -->
                        <ellipse cx="425" cy="265" rx="8" ry="12" fill="url(#skinShadow)" opacity="0.8" transform="rotate(-15 425 265)" />
                        <!-- Nail -->
                        <ellipse cx="440" cy="265" rx="4" ry="8" fill="#f0dcc8" opacity="0.8" transform="rotate(-15 440 265)" />
                        <!-- Highlight -->
                        <path d="M 390 255 Q 420 245 440 255" stroke="url(#skinSpecular)" stroke-width="2" fill="none" opacity="0.5" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(0, 45)">
                        <path d="M 380 250 Q 440 240 455 260 Q 460 280 400 290 L 380 290 Z" fill="url(#skinBase)" />
                        <ellipse cx="435" cy="265" rx="8" ry="12" fill="url(#skinShadow)" opacity="0.8" transform="rotate(-15 435 265)" />
                        <ellipse cx="450" cy="265" rx="4" ry="8" fill="#f0dcc8" opacity="0.8" transform="rotate(-15 450 265)" />
                        <path d="M 390 255 Q 430 245 450 255" stroke="url(#skinSpecular)" stroke-width="2" fill="none" opacity="0.5" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(0, 90)">
                        <path d="M 380 250 Q 435 240 450 260 Q 455 280 400 290 L 380 290 Z" fill="url(#skinBase)" />
                        <ellipse cx="430" cy="265" rx="8" ry="12" fill="url(#skinShadow)" opacity="0.8" transform="rotate(-15 430 265)" />
                        <ellipse cx="445" cy="265" rx="4" ry="8" fill="#f0dcc8" opacity="0.8" transform="rotate(-15 445 265)" />
                        <path d="M 390 255 Q 425 245 445 255" stroke="url(#skinSpecular)" stroke-width="2" fill="none" opacity="0.5" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(0, 135)">
                        <path d="M 380 250 Q 420 240 435 260 Q 440 280 400 290 L 380 290 Z" fill="url(#skinBase)" />
                        <ellipse cx="415" cy="265" rx="7" ry="11" fill="url(#skinShadow)" opacity="0.8" transform="rotate(-15 415 265)" />
                        <ellipse cx="430" cy="265" rx="3" ry="7" fill="#f0dcc8" opacity="0.8" transform="rotate(-15 430 265)" />
                        <path d="M 390 255 Q 415 245 430 255" stroke="url(#skinSpecular)" stroke-width="2" fill="none" opacity="0.5" />
                    </g>

                    <!-- Contact Shadows (Fingers pressing into phone) -->
                    <!-- These are dark paths exactly where the fingers meet the phone edge -->
                    <g fill="#000" opacity="0.6" style="mix-blend-mode: multiply;">
                        <path d="M 380 250 L 390 250 Q 400 265 390 280 L 380 280 Z" /> <!-- Index -->
                        <path d="M 380 295 L 395 295 Q 405 310 395 330 L 380 330 Z" /> <!-- Middle -->
                        <path d="M 380 340 L 390 340 Q 400 355 390 370 L 380 370 Z" /> <!-- Ring -->
                        <path d="M 380 385 L 385 385 Q 395 400 385 420 L 380 420 Z" /> <!-- Pinky -->
                    </g>
                </g>

                <!-- 3. THE THUMB (Wrapping from Left) -->
                <!-- This is the focal point of the interaction -->
                <g id="thumb" transform="translate(0, 0)">
                    
                    <!-- Thumb Base (Metacarpal) -->
                    <path d="M 100 500 Q 150 450 180 350 L 210 360 Q 180 460 140 520 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 180 350 Q 200 300 230 280 L 250 295 Q 220 320 200 370 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Tip (The Pad touching screen) -->
                    <!-- Drawn larger to emphasize pressure -->
                    <path d="M 230 280 Q 260 270 280 290 Q 285 305 250 295 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Joint Crease (Anatomy detail) -->
                    <path d="M 215 315 Q 225 325 220 340" stroke="url(#skinShadow)" stroke-width="2" fill="none" opacity="0.8" />
                    
                    <!-- Thumb Nail -->
                    <ellipse cx="265" cy="285" rx="5" ry="9" fill="#f2e6d9" opacity="0.9" transform="rotate(45 265 285)" />
                    
                    <!-- Highlight on Knuckle -->
                    <path d="M 220 300 Q 230 290 245 295" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.6" />
                </g>

                <!-- 4. GLOBAL SHADOWS & HIGHLIGHTS -->
                
                <!-- Cast Shadow from Thumb onto Phone Screen -->
                <ellipse cx="260" cy="290" rx="25" ry="15" fill="#000" opacity="0.4" filter="url(#blurSoft)" transform="rotate(-10 260 290)" />
                
                <!-- Cast Shadow from Fingers onto Phone Back (Visualized as darkening the right edge) -->
                <rect x="400" y="200" width="20" height="300" fill="#000" opacity="0.3" filter="url(#blurSoft)" />

                <!-- Rim Light on Hand (Separating from dark background) -->
                <path d="M 120 500 Q 160 450 190 360" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" />
                <path d="M 430 250 Q 450 260 460 280" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" />

            </g>
        </svg>
    </div>
</body>
</html>
