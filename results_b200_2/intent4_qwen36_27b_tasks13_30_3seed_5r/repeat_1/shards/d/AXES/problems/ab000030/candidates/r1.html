<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub // Nexus</title>
    <style>
        :root {
            /* Palette: Cyberpunk Neon & Deep Tech */
            --bg-deep: #050508;
            --bg-panel: #0f1016;
            --bg-panel-glass: rgba(15, 16, 22, 0.85);
            --bg-card: #181a24;
            --bg-card-hover: #222636;
            
            --primary: #00f0ff; /* Cyan - Primary Action */
            --primary-dim: #00f0ff33;
            --secondary: #ff0055; /* Magenta - Danger/Battle */
            --secondary-dim: #ff005533;
            --accent: #fcee0a; /* Electric Yellow - Highlights */
            
            --status-online: #00ff9d;
            --status-party: #fcee0a;
            --status-offline: #444c63;
            --status-ingame: #00f0ff;
            
            --text-main: #ffffff;
            --text-muted: #7a829e;
            
            --radius-sm: 4px;
            --radius-md: 8px;
            
            --font-tech: 'Courier New', Courier, monospace;
            --font-ui: system-ui, -apple-system, sans-serif;
            
            --shadow-glow: 0 0 20px var(--primary-dim);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Background & Atmosphere --- */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--bg-panel) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-panel) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.2;
            z-index: -2;
        }
        
        /* Noise Texture */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 100;
        }

        .bg-gradient {
            position: absolute;
            top: -20%; left: -20%; width: 140%; height: 140%;
            background: radial-gradient(circle at 50% 30%, #1a1c2e 0%, var(--bg-deep) 60%);
            z-index: -1;
        }

        /* --- Layout: Top Party Strip --- */
        .party-strip {
            height: 80px;
            background: var(--bg-panel);
            border-bottom: 1px solid #2a2e3d;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .party-label {
            font-family: var(--font-tech);
            color: var(--accent);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 100px;
        }
        .party-label span { color: var(--text-muted); font-size: 10px; }

        .party-members-scroll {
            display: flex;
            gap: 15px;
            flex: 1;
            overflow-x: auto;
            align-items: center;
        }

        /* Party Member Card */
        .party-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            min-width: 180px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .party-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }

        .party-card.active {
            border-color: var(--accent);
            background: linear-gradient(90deg, rgba(252, 238, 10, 0.1) 0%, transparent 100%);
        }

        .party-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            position: relative;
        }
        
        /* Health Bar on Party Card */
        .hp-bar {
            position: absolute;
            bottom: -4px;
            left: 0; width: 100%; height: 3px;
            background: #333;
        }
        .hp-fill { height: 100%; background: var(--status-online); width: 80%; }

        .party-info h4 { margin: 0; font-size: 13px; font-weight: 600; }
        .party-info div { font-size: 10px; color: var(--text-muted); font-family: var(--font-tech); }

        /* Empty Slot */
        .party-slot {
            border: 1px dashed #333;
            border-radius: var(--radius-md);
            width: 180px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 12px;
            font-family: var(--font-tech);
            cursor: pointer;
            transition: 0.2s;
        }
        .party-slot:hover { border-color: var(--primary); color: var(--primary); }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr; /* List | Detail */
            gap: 0;
            overflow: hidden;
        }

        /* --- Left Col: Friends List --- */
        .list-panel {
            background: var(--bg-panel-glass);
            border-right: 1px solid #2a2e3d;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .search-header {
            padding: 20px;
            border-bottom: 1px solid #2a2e3d;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            padding: 10px 10px 10px 35px;
            color: var(--text-main);
            border-radius: var(--radius-sm);
            font-family: var(--font-tech);
            font-size: 13px;
            transition: 0.2s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-dim);
        }
        .search-icon {
            position: absolute; left: 10px; top: 11px; width: 14px; color: var(--text-muted);
        }

        /* Tabs */
        .tabs-nav {
            display: flex;
            gap: 20px;
            position: relative;
        }
        .tab-btn {
            background: none; border: none;
            color: var(--text-muted);
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            padding-bottom: 5px;
            position: relative;
            transition: color 0.2s;
        }
        .tab-btn.active { color: var(--text-main); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }
        .badge-count {
            background: var(--secondary);
            color: white;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 4px;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* Friend Rows */
        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .friends-list::-webkit-scrollbar { width: 4px; }
        .friends-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .friend-row {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 4px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .friend-row:hover { background: rgba(255,255,255,0.03); }
        
        .friend-row.selected {
            background: rgba(0, 240, 255, 0.05);
            border-color: var(--primary-dim);
        }
        .friend-row.selected .friend-name { color: var(--primary); }

        .avatar-wrapper {
            position: relative;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .avatar-box {
            width: 44px; height: 44px;
            border-radius: var(--radius-sm);
            background: #222;
            overflow: hidden;
            border: 1px solid #333;
        }
        .status-indicator {
            position: absolute;
            bottom: -2px; right: -2px;
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
        }

        .friend-meta { flex: 1; }
        .friend-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; transition: 0.2s; }
        .friend-sub { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }

        /* Request Card Style */
        .request-card {
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.05) 0%, transparent 100%);
            border-left: 2px solid var(--secondary);
        }
        .request-actions {
            display: flex; gap: 5px; margin-left: auto;
        }
        .req-btn {
            width: 24px; height: 24px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
        }
        .req-accept { background: var(--status-online); color: #000; }
        .req-decline { background: #333; color: var(--text-muted); }

        /* --- Right Col: Detail Panel --- */
        .detail-panel {
            position: relative;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
        }

        /* Dynamic Header */
        .detail-hero {
            height: 200px;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #2a2e3d;
        }
        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.4;
            background-size: cover; background-position: center;
            filter: grayscale(0.5) contrast(1.2);
            transition: background 0.5s;
        }
        .hero-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, transparent 0%, var(--bg-deep) 100%);
        }
        
        .detail-content {
            padding: 0 30px 30px;
            position: relative;
            z-index: 2;
            margin-top: -50px; /* Pull up over hero */
            flex: 1;
        }

        .profile-header-group {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 25px;
        }

        .big-avatar {
            width: 100px; height: 100px;
            border-radius: 12px;
            border: 3px solid var(--bg-deep);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            background: #222;
            overflow: hidden;
        }

        .profile-text h2 {
            margin: 0; font-size: 28px; letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .profile-text .title {
            font-family: var(--font-tech);
            color: var(--primary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid #222;
            padding: 12px;
            text-align: center;
            border-radius: var(--radius-sm);
        }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--text-main); display: block; }
        .stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* Action Buttons */
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            border: none;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-dim);
        }
        .btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 25px var(--primary);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-main);
        }
        .btn-secondary:hover {
            border-color: var(--text-main);
            background: rgba(255,255,255,0.05);
        }

        .btn-danger {
            border: 1px solid var(--secondary);
            color: var(--secondary);
        }
        .btn-danger:hover {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 15px var(--secondary-dim);
        }

        /* Activity Feed */
        .feed-section h3 {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }
        .feed-item {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            align-items: flex-start;
        }
        .feed-icon-box {
            width: 30px; height: 30px;
            background: #181a24;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
        }
        .feed-content { flex: 1; }
        .feed-text { color: var(--text-main); margin-bottom: 2px; }
        .feed-time { color: var(--text-muted); font-size: 11px; font-family: var(--font-tech); }

        /* Empty State */
        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
        }
        .empty-state svg { width: 60px; height: 60px; opacity: 0.2; margin-bottom: 20px; }

        /* Utilities */
        svg { fill: currentColor; }
        .glow-text { text-shadow: 0 0 10px currentColor; }
        
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>

    <!-- TOP STRIP: Active Party -->
    <div class="party-strip">
        <div class="party-label">
            PARTY
            <span>ACTIVE (3/4)</span>
        </div>
        <div class="party-members-scroll" id="partyList">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="main-content">
        
        <!-- LEFT: Friends List -->
        <div class="list-panel">
            <div class="search-header">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="search-input" placeholder="SEARCH DATABASE..." id="searchInput">
                </div>
                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchTab('all')">All Friends</button>
                    <button class="tab-btn" onclick="switchTab('online')">Online</button>
                    <button class="tab-btn" onclick="switchTab('requests')">Requests <span class="badge-count">2</span></button>
                </div>
            </div>

            <div class="friends-list" id="friendsList">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- RIGHT: Detail Panel -->
        <div class="detail-panel" id="detailPanel">
            <!-- Content injected via JS -->
        </div>

    </div>

    <script>
        // --- Mock Data ---
        const currentUser = {
            name: "NeonViper",
            role: "Cybernetic Ranger",
            lvl: 42,
            color: "#ffc857"
        };

        const partyMembers = [
            { name: "Sara_V", role: "Tank", status: "online", hp: 80, color: "#2ecc71", id: 101 },
            { name: "K0dox", role: "DPS", status: "ingame", hp: 45, color: "#3498db", id: 102 },
            { name: "BladeRunner", role: "Assassin", status: "online", hp: 100, color: "#e74c3c", id: 1 } // Link to friends list
        ];

        const friends = [
            { id: 1, name: "BladeRunner", role: "Assassin", status: "online", lvl: 88, wins: 1204, kd: "4.2", date: "2023", color: "#e74c3c", inParty: true },
            { id: 2, name: "Glitch_Witch", role: "Support", status: "online", lvl: 45, wins: 340, kd: "1.1", date: "2024", color: "#9b59b6" },
            { id: 3, name: "HeavyMetal", role: "Tank", status: "ingame", lvl: 92, wins: 5600, kd: "2.8", date: "2021", color: "#f39c12" },
            { id: 4, name: "ZeroCool", role: "Hacker", status: "offline", lvl: 12, wins: 45, kd: "0.8", date: "2024", color: "#3498db" },
            { id: 5, name: "NeonSpectre", role: "Sniper", status: "online", lvl: 67, wins: 890, kd: "3.5", date: "2022", color: "#2ecc71" },
            { id: 6, name: "CyberPunk99", role: "Ranger", status: "online", lvl: 55, wins: 600, kd: "1.9", date: "2023", color: "#e67e22" },
            { id: 7, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, wins: 120, kd: "1.2", date: "2023", color: "#34495e" },
            { id: 8, name: "PixelPioneer", role: "Engineer", status: "ingame", lvl: 74, wins: 1500, kd: "2.1", date: "2022", color: "#1abc9c" },
            { id: 9, name: "StarDust", role: "Scout", status: "online", lvl: 41, wins: 210, kd: "1.5", date: "2024", color: "#ff7979" },
            { id: 10, name: "Titan_X", role: "Heavy", status: "offline", lvl: 99, wins: 9999, kd: "5.5", date: "2020", color: "#95a5a6" },
        ];

        const requests = [
            { id: 101, name: "GhostProtocol", role: "Unknown", color: "#fff" },
            { id: 102, name: "SynthWave", role: "Unknown", color: "#00f0ff" }
        ];

        // --- Render Logic ---

        // 1. Render Party Strip
        function renderParty() {
            const container = document.getElementById('partyList');
            container.innerHTML = '';

            partyMembers.forEach(p => {
                const el = document.createElement('div');
                el.className = `party-card ${p.inParty ? 'active' : ''}`; // 'active' highlights current party members
                el.innerHTML = `
                    <div class="party-avatar">
                        ${generateAvatar(p.color, p.id)}
                        <div class="hp-bar"><div class="hp-fill" style="width:${p.hp}%"></div></div>
                    </div>
                    <div class="party-info">
                        <h4>${p.name}</h4>
                        <div>${p.role} • ${p.status === 'ingame' ? 'FIGHTING' : 'READY'}</div>
                    </div>
                `;
                el.onclick = () => selectFriendById(p.id);
                container.appendChild(el);
            });

            // Add empty slot
            const slot = document.createElement('div');
            slot.className = 'party-slot';
            slot.innerHTML = `+ INVITE MEMBER`;
            container.appendChild(slot);
        }

        // 2. Render Friends List
        let currentTab = 'all';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderList();
        }

        function renderList() {
            const container = document.getElementById('friendsList');
            container.innerHTML = '';

            let data = [];
            if (currentTab === 'requests') {
                data = requests.map(r => ({...r, type: 'request'}));
            } else {
                data = friends.filter(f => f.type !== 'request');
                if (currentTab === 'online') data = data.filter(f => f.status === 'online' || f.status === 'ingame');
            }

            if(data.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:#555;">NO RESULTS FOUND</div>`;
                return;
            }

            data.forEach(friend => {
                const el = document.createElement('div');
                
                if(friend.type === 'request') {
                    el.className = 'friend-row request-card';
                    el.innerHTML = `
                        <div class="avatar-wrapper">
                            <div class="avatar-box">${generateAvatar(friend.color, friend.id)}</div>
                        </div>
                        <div class="friend-meta">
                            <div class="friend-name">${friend.name}</div>
                            <div class="friend-sub">WANTS TO CONNECT</div>
                        </div>
                        <div class="request-actions">
                            <button class="req-btn req-accept">✓</button>
                            <button class="req-btn req-decline">✕</button>
                        </div>
                    `;
                } else {
                    el.className = `friend-row ${selectedId === friend.id ? 'selected' : ''}`;
                    el.onclick = () => selectFriend(friend, el);
                    
                    const statusColor = friend.status === 'online' ? 'var(--status-online)' : 
                                       friend.status === 'ingame' ? 'var(--status-ingame)' : 'var(--status-offline)';
                    
                    el.innerHTML = `
                        <div class="avatar-wrapper">
                            <div class="avatar-box">${generateAvatar(friend.color, friend.id)}</div>
                            <div class="status-indicator" style="background: ${statusColor}"></div>
                        </div>
                        <div class="friend-meta">
                            <div class="friend-name">${friend.name} ${friend.inParty ? '<span style="color:var(--accent); font-size:10px;">[PARTY]</span>' : ''}</div>
                            <div class="friend-sub">
                                LVL ${friend.lvl} • ${friend.role}
                            </div>
                        </div>
                        ${friend.status === 'online' ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>` : ''}
                    `;
                }
                container.appendChild(el);
            });
        }

        // 3. Render Detail Panel
        let selectedId = 1; // Default select BladeRunner

        function selectFriend(friend, el) {
            selectedId = friend.id;
            renderList(); // Update selection styles
            renderDetail(friend);
        }

        function selectFriendById(id) {
            const friend = friends.find(f => f.id === id);
            if(friend) {
                selectedId = id;
                renderList();
                renderDetail(friend);
                // Scroll list to item
                const row = document.querySelector(`.friend-row.selected`);
                if(row) row.scrollIntoView({behavior: "smooth", block: "center"});
            }
        }

        function renderDetail(friend) {
            const panel = document.getElementById('detailPanel');
            panel.innerHTML = `
                <div class="detail-hero">
