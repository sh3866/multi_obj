<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub // Nexus</title>
    <style>
        :root {
            /* Palette: Warm Tech & Lived-in Sci-Fi */
            --bg-deep: #111217;
            --bg-panel: #1a1c24;
            --bg-panel-light: #232631;
            --bg-card: #2a2e3d;
            --bg-card-hover: #32374a;
            
            /* Accents */
            --primary: #3b82f6; /* System Blue */
            --primary-glow: rgba(59, 130, 246, 0.4);
            --secondary: #ef4444; /* Combat Red */
            --secondary-glow: rgba(239, 68, 68, 0.4);
            --accent-warm: #f59e0b; /* Status Gold */
            
            /* Status Colors */
            --status-online: #10b981;
            --status-party: #f59e0b;
            --status-offline: #64748b;
            --status-ingame: #3b82f6;
            
            /* Text */
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            
            /* UI Constants */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            
            /* Typography */
            --font-ui: system-ui, -apple-system, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            
            /* Shadows & Borders */
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --border-subtle: 1px solid rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Background Atmosphere --- */
        .bg-texture {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(17, 18, 23, 0.95), rgba(17, 18, 23, 0.95)),
                url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E');
            z-index: -2;
        }
        
        .bg-glow {
            position: absolute;
            top: -10%; left: 20%; width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* --- Header: Player Profile & Party --- */
        .header-strip {
            height: 70px;
            background: var(--bg-panel);
            border-bottom: 1px solid #2a2e3d;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 20;
        }

        /* User Profile Identity */
        .user-identity {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            min-width: 220px;
        }
        .user-avatar {
            width: 42px; height: 42px;
            border-radius: var(--radius-md);
            border: 2px solid var(--accent-warm);
            background: #222;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }
        .user-info h3 { margin: 0; font-size: 14px; color: var(--text-main); font-weight: 700; }
        .user-info div { font-size: 11px; color: var(--accent-warm); font-family: var(--font-mono); letter-spacing: 0.5px; }

        /* Party Strip */
        .party-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .party-label {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-right: 5px;
        }
        
        .party-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 5px; /* Scrollbar space */
            scrollbar-width: none;
        }
        .party-scroll::-webkit-scrollbar { display: none; }

        .party-member {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            min-width: 160px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .party-member:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }
        
        /* Demoted Avatar Style */
        .mini-avatar {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            background: #111;
            overflow: hidden;
            opacity: 0.8; /* Lower saturation/contrast */
        }
        .mini-avatar svg { width: 100%; height: 100%; }

        .member-info h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--text-main); }
        .member-info span { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }

        .invite-party-btn {
            border: 1px dashed var(--text-dim);
            background: transparent;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .invite-party-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        /* --- Main Content Layout --- */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 340px 1fr;
            overflow: hidden;
        }

        /* --- Left: Friends List --- */
        .list-panel {
            background: var(--bg-panel);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        /* Search & Tabs Grouping */
        .controls-area {
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .search-wrapper {
            position: relative;
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 12px 10px 36px;
            color: var(--text-main);
            border-radius: var(--radius-sm);
            font-family: var(--font-ui);
            font-size: 13px;
            transition: 0.2s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0,0,0,0.5);
        }
        .search-icon {
            position: absolute; left: 10px; top: 11px; width: 14px; color: var(--text-dim); pointer-events: none;
        }

        .tabs-nav {
            display: flex;
            gap: 24px;
            position: relative;
        }
        .tab-btn {
            background: none; border: none;
            color: var(--text-muted);
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--text-main); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -16px; left: 0; width: 100%; height: 2px;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }
        
        .badge {
            background: var(--secondary);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 700;
            box-shadow: 0 0 5px rgba(239, 68, 68, 0.4);
        }

        /* List Items */
        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        .friend-row {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: transparent;
        }
        .friend-row:hover { background: rgba(255,255,255,0.03); }
        
        .friend-row.selected {
            background: rgba(59, 130, 246, 0.08);
            border-color: rgba(59, 130, 246, 0.2);
        }
        .friend-row.selected .friend-name { color: var(--primary); }

        /* Unified Avatar Component */
        .avatar-container {
            position: relative;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .avatar-box {
            width: 44px; height: 44px;
            border-radius: var(--radius-md); /* Unified Rounded Square */
            background: #222;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-box svg { width: 100%; height: 100%; }
        
        .status-dot {
            position: absolute;
            bottom: -2px; right: -2px;
            width: 12px; height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
        }

        .friend-meta { flex: 1; min-width: 0; }
        .friend-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .friend-sub { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        
        .lvl-badge {
            background: rgba(255,255,255,0.1);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Request Card Specifics */
        .request-card {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.05) 0%, transparent 100%);
            border-left: 2px solid var(--secondary);
        }
        .request-actions { display: flex; gap: 6px; }
        .req-btn {
            width: 28px; height: 28px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            transition: 0.2s;
        }
        .req-accept { background: var(--status-online); color: #000; }
        .req-accept:hover { background: #fff; }
        .req-decline { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .req-decline:hover { background: var(--secondary); color: #fff; }

        /* --- Right: Detail Panel --- */
        .detail-panel {
            position: relative;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
        }

        /* Hero Section */
        .detail-hero {
            height: 180px;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: grayscale(0.4) contrast(1.1);
        }
        .hero-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, transparent 0%, var(--bg-deep) 100%);
        }
        
        .detail-content {
            padding: 0 32px 32px;
            position: relative;
            z-index: 2;
            margin-top: -40px;
            flex: 1;
        }

        .profile-header-group {
            display: flex;
            align-items: flex-end;
            gap: 24px;
            margin-bottom: 24px;
        }

        .big-avatar {
            width: 90px; height: 90px;
            border-radius: var(--radius-lg);
            border: 3px solid var(--bg-deep);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            background: #222;
            overflow: hidden;
        }

        .profile-text h2 {
            margin: 0; font-size: 26px; letter-spacing: -0.5px;
            color: var(--text-main);
        }
        .profile-text .role-title {
            font-family: var(--font-mono);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
            opacity: 0.9;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 14px;
            text-align: center;
            border-radius: var(--radius-sm);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.1); }
        .stat-val { font-size: 18px; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 4px; }
        .stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* Action Buttons: Tactile & Clear */
        .action-bar {
            display: grid;
            grid-template-columns: 1.5fr 1fr; /* Invite larger */
            gap: 12px;
            margin-bottom: 32px;
        }

        .btn {
            border: none;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        
        /* Metallic/Glow effect for buttons */
        .btn::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--secondary);
        }
        .btn-secondary:hover {
            background: var(--secondary);
            color: #fff;
            box-shadow: 0 4px 12px var(--secondary-glow);
        }

        /* Activity Feed */
        .feed-section {
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
        .feed-section h3 {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0 0 16px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px;
        }
        .feed-section h3::after {
            content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.05);
        }

        .feed-item {
            display: flex;
            gap: 14px;
            margin-bottom: 16px;
            font-size: 13px;
            align-items: flex-start;
        }
        .feed-icon-box {
            width: 32px; height: 32px;
            background: var(--bg-panel);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .feed-content { flex: 1; }
        .feed-text { color: var(--text-main); margin-bottom: 3px; font-weight: 500; }
        .feed-time { color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); }

        /* Utilities */
        svg { fill: currentColor; }
        .glow-text { text-shadow: 0 0 10px currentColor; }

    </style>
</head>
<body>

    <div class="bg-texture"></div>
    <div class="bg-glow"></div>

    <!-- TOP STRIP: User & Party -->
    <div class="header-strip">
        <!-- 1. Player Profile Header -->
        <div class="user-identity">
            <div class="user-avatar">
                <!-- Inline SVG Avatar -->
                <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="16" fill="none" stroke="#f59e0b" stroke-width="2"/>
                    <circle cx="20" cy="20" r="8" fill="#f59e0b"/>
                </svg>
            </div>
            <div class="user-info">
                <h3>NeonViper</h3>
                <div>LVL 42 • RANGER</div>
            </div>
        </div>

        <!-- 2. Party Strip (Demoted Visuals) -->
        <div class="party-container">
            <div class="party-label">Party</div>
            <div class="party-scroll" id="partyList">
                <!-- Populated by JS -->
            </div>
            <button class="invite-party-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                INVITE
            </button>
        </div>
    </div>

    <div class="main-content">
        
        <!-- LEFT: Friends List -->
        <div class="list-panel">
            <div class="controls-area">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <!-- 3. Renamed Search -->
                    <input type="text" class="search-input" placeholder="Search Friends..." id="searchInput">
                </div>
                <div class="tabs-nav">
                    <button class="tab-btn active" onclick="switchTab('all')">All Friends</button>
                    <button class="tab-btn" onclick="switchTab('online')">Online</button>
                    <button class="tab-btn" onclick="switchTab('requests')">Requests <span class="badge">2</span></button>
                </div>
            </div>

            <div class="friends-list" id="friendsList">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- RIGHT: Detail Panel -->
        <div class="detail-panel" id="detailPanel">
            <!-- Content injected via JS -->
        </div>

    </div>

    <script>
        // --- Mock Data ---
        const partyMembers = [
            { name: "Sara_V", role: "Tank", status: "online", hp: 80, color: "#10b981", id: 101 },
            { name: "K0dox", role: "DPS", status: "ingame", hp: 45, color: "#3b82f6", id: 102 },
            { name: "BladeRunner", role: "Assassin", status: "online", hp: 100, color: "#ef4444", id: 1 }
        ];

        const friends = [
            { id: 1, name: "BladeRunner", role: "Assassin", status: "online", lvl: 88, wins: 1204, kd: "4.2", date: "2023", color: "#ef4444", inParty: true },
            { id: 2, name: "Glitch_Witch", role: "Support", status: "online", lvl: 45, wins: 340, kd: "1.1", date: "2024", color: "#8b5cf6" },
            { id: 3, name: "HeavyMetal", role: "Tank", status: "ingame", lvl: 92, wins: 5600, kd: "2.8", date: "2021", color: "#f59e0b" },
            { id: 4, name: "ZeroCool", role: "Hacker", status: "offline", lvl: 12, wins: 45, kd: "0.8", date: "2024", color: "#64748b" },
            { id: 5, name: "NeonSpectre", role: "Sniper", status: "online", lvl: 67, wins: 890, kd: "3.5", date: "2022", color: "#10b981" },
            { id: 6, name: "CyberPunk99", role: "Ranger", status: "online", lvl: 55, wins: 600, kd: "1.9", date: "2023", color: "#f97316" },
            { id: 7, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, wins: 120, kd: "1.2", date: "2023", color: "#475569" },
            { id: 8, name: "PixelPioneer", role: "Engineer", status: "ingame", lvl: 74, wins: 1500, kd: "2.1", date: "2022", color: "#14b8a6" },
            { id: 9, name: "StarDust", role: "Scout", status: "online", lvl: 41, wins: 210, kd: "1.5", date: "2024", color: "#f43f5e" },
            { id: 10, name: "Titan_X", role: "Heavy", status: "offline", lvl: 99, wins: 9999, kd: "5.5", date: "2020", color: "#94a3b8" },
        ];

        const requests = [
            { id: 101, name: "GhostProtocol", role: "Unknown", color: "#fff" },
            { id: 102, name: "SynthWave", role: "Unknown", color: "#3b82f6" }
        ];

        // --- Render Logic ---

        // 1. Render Party Strip
        function renderParty() {
            const container = document.getElementById('partyList');
            container.innerHTML = '';

            partyMembers.forEach(p => {
                const el = document.createElement('div');
                el.className = 'party-member';
                // Demoted Avatar Style
                el.innerHTML = `
                    <div class="mini-avatar">
                        ${generateAvatar(p.color, p.id)}
                    </div>
                    <div class="member-info">
                        <h4>${p.name}</h4>
                        <span>${p.role}</span>
                    </div>
                `;
                el.onclick = () => selectFriendById(p.id);
                container.appendChild(el);
            });
        }

        // 2. Render Friends List
        let currentTab = 'all';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.closest('.tab-btn').classList.add('active');
            renderList();
        }

        function renderList() {
            const container = document.getElementById('friendsList');
            container.innerHTML = '';

            let data = [];
            if (currentTab === 'requests') {
                // 3. Populate Requests
                data = requests.map(r => ({...r, type: 'request'}));
            } else {
                data = friends.filter(f => f.type !== 'request');
                if (currentTab === 'online') data = data.filter(f => f.status === 'online' || f.status === 'ingame');
            }

            if(data.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-dim);">NO RESULTS FOUND</div>`;
                return;
            }

            data.forEach(friend => {
                const el = document.createElement('div');
                
                if(friend.type === 'request') {
                    el.className = 'friend-row request-card';
                    el.innerHTML = `
                        <div class="avatar-container">
                            <div class="avatar-box">${generateAvatar(friend.color, friend.id)}</div>
                        </div>
                        <div class="friend-meta">
                            <div class="friend-name">${friend.name}</div>
                            <div class="friend-sub">WANTS TO CONNECT</div>
                        </div>
                        <div class="request-actions">
                            <button class="req-btn req-accept">✓</button>
                            <button class="req-btn req-decline">✕</button>
                        </div>
                    `;
                } else {
                    el.className = `friend-row ${selectedId === friend.id ? 'selected' : ''}`;
                    el.onclick = () => selectFriend(friend, el);
                    
                    const statusColor = friend.status === 'online' ? 'var(--status-online)' : 
                                       friend.status === 'ingame' ? 'var(--status-ingame)' : 'var(--status-offline)';
                    
                    el.innerHTML = `
                        <div class="avatar-container">
                            <div class="avatar-box">${generateAvatar(friend.color, friend.id)}</div>
                            <div class="status-dot" style="background: ${statusColor}"></div>
                        </div>
                        <div class="friend-meta">
                            <div class="friend-name">
                                ${friend.name} 
                                ${friend.inParty ? '<span style="color:var(--status-party); font-size:10px; margin-left:4px;">[PARTY]</span>' : ''}
                            </div>
                            <div class="friend-sub">
                                <span class="lvl-badge">LVL ${friend.lvl}</span>
                                ${friend.role}
                            </div>
                        </div>
                    `;
                }
                container.appendChild(el);
            });
        }

        // 3. Render Detail Panel
        let selectedId = 1;

        function selectFriend(friend, el) {
            selectedId = friend.id;
            renderList(); // Update selection styles
            renderDetail(friend);
        }

        function selectFriendById(id) {
            const friend = friends.find(f => f.id === id);
            if(friend) {
                selectedId = id;
                renderList();
                renderDetail(friend);
                const row = document.querySelector(`.friend-row.selected`);
                if(row) row.scrollIntoView({behavior: "smooth", block: "center"});
            }
        }

        function renderDetail(friend) {
            const panel = document.getElementById('detailPanel');
            
            // Dynamic background based on character color
            const bgHex = friend.color.replace('#', '');
            
            panel.innerHTML = `
                <div class="detail-hero">
                    <div class="hero-bg" style="background-color: #${bgHex}; opacity: 0.15;"></div>
                    <!-- Abstract Geometric BG -->
                    <svg style="position:absolute; width:100%; height:100%; opacity:0.1;" viewBox="0 0 400 200" preserveAspectRatio="none">
                         <path d="M0 200 L200 0 L400 200 Z" fill="${friend.color}" />
                         <rect x="0" y="0" width="400" height="200" fill="url(#gridPattern)" />
                         <defs>
                             <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
                                 <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"/>
                             </pattern>
                         </defs>
                    </svg>
                    <div class="hero-gradient"></div>
                </div>

                <div class="detail-content">
                    <div class="profile-header-group">
                        <div class="big-avatar">${generateAvatar(friend.color, friend.id)}</div>
                        <div class="profile-text">
                            <h2>${friend.name}</h2>
                            <span class="role-title" style="color: ${friend.color}">${friend.role}</span>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-val">${friend.lvl}</span>
                            <span class="stat-lbl">Level</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-val">${friend.wins}</span>
                            <span class="stat-lbl">Wins</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-val">${friend.kd}</span>
                            <span class="stat-lbl">K/D Ratio</span>
                        </div>
                    </div>

                    <!-- 4. Clarified Action Hierarchy -->
                    <div class="action-bar">
                        <button class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                            INVITE TO MATCH
                        </button>
                        <button class="btn btn-secondary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                            BATTLE
                        </button>
                    </div>

                    <div class="feed-section">
                        <h3>Recent Activity</h3>
                        <div class="feed-item">
                            <div class="feed-icon-box">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                            </div>
                            <div class="feed-content">
                                <div class="feed-text">Won Ranked Match (Squad)</div>
                                <div class="feed-time">2 MINUTES AGO</div>
                            </div>
                        </div>
                        <div class="feed-item">
                            <div class="feed-icon-box">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            <div class="feed-content">
                                <div class="feed-text">Unlocked "Cyber Ninja" Title</div>
                                <div class="feed-time">1 HOUR AGO</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Helper: Generate SVG Avatars (Unified Component) ---
        function generateAvatar(color, id) {
            // Deterministic shapes based on ID
            const shapes = [
                // Cyber Circle
                `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="16" fill="none" stroke="${color}" stroke-width="2"/><circle cx="20" cy="20" r="8" fill="${color}"/></svg>`,
                // Hexagon
                `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><polygon points="20,2 38,12 38,28 20,38 2,28 2,12" fill="none" stroke="${color}" stroke-width="2"/><circle cx="20" cy="20" r="4" fill="${color}"/></svg>`,
                // Square
                `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="28" height="28" fill="none" stroke="${color}" stroke-width="2"/><rect x="14" y="14" width="12" height="12" fill="${color}"/></svg>`,
                // Triangle
                `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><polygon points="20,4 38,36 2,36" fill="none" stroke="${color}" stroke-width="2"/><circle cx="20" cy="26" r="4" fill="${color}"/></svg>`
            ];
            return shapes[id % shapes.length];
        }

        // Initialize
        renderParty();
        renderList();
        selectFriendById(1); // Default selection

    </script>
</body>
</html>
