<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: Deep Slate background to pop the white ceramic, warm wood floor */
            --bg-color: #2C3136; 
            --bg-gradient: linear-gradient(135deg, #2C3136 0%, #1A1D20 100%);
            --text-main: #F0F0F0;
            --text-muted: #A0A5A9;
            --accent-line: rgba(255, 255, 255, 0.1);
            
            /* Typography */
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-main);
            z-index: 20;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 3rem;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: var(--text-main);
        }
        
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--text-main);
            transition: width 0.3s ease;
        }
        nav a:hover::after {
            width: 100%;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 50% 50%;
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            padding: 0 4rem;
        }

        /* Left Column: Typography & Hierarchy */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 2rem;
            z-index: 5;
            position: relative;
        }

        h1 {
            font-size: 6rem;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-weight: 300; /* Lighter weight for elegance */
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3.5rem;
            margin-top: 0.5rem;
            margin-left: 1rem;
        }

        /* Specs Grid - Connected visually */
        .specs-container {
            margin-top: 3rem;
            display: flex;
            align-items: flex-start;
            position: relative;
        }

        /* Vertical Line anchoring specs to product */
        .specs-container::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: -100px; /* Extends down */
            width: 1px;
            background: linear-gradient(to bottom, var(--text-main), transparent);
            opacity: 0.2;
        }

        .specs {
            padding-left: 2rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.3;
        }

        /* Interactive Button - Refined, Outline Style */
        .cta-btn {
            margin-top: 4rem;
            padding: 1rem 3rem;
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 4px;
        }

        .cta-btn:hover {
            border-color: var(--text-main);
            background: rgba(255,255,255,0.05);
            transform: translateY(-2px);
        }
        
        .cta-btn:active {
            transform: translateY(0);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Ground the object */
            position: relative;
            z-index: 1;
            padding-bottom: 2rem;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 90%;
            max-height: 900px;
            /* Deep shadow to pop against dark background */
            filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.6));
        }

        /* Animations */
        .water-spray {
            opacity: 0;
            transform-origin: 400px 420px;
        }

        .flushing .water-spray {
            animation: sprayAnim 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .flushing .water-surface {
            animation: waterDip 1.2s ease-in-out;
        }

        .flushing .tank-water {
            animation: tankDrain 1.2s ease-in-out;
        }

        /* Handle Animation */
        .handle-group {
            transition: transform 0.1s ease;
            transform-origin: 250px 240px; /* Pivot point at the tank wall */
        }
        
        .flushing .handle-group {
            animation: handlePress 0.5s ease-in-out;
        }

        @keyframes handlePress {
            0% { transform: rotate(0deg); }
            40% { transform: rotate(-15deg); } /* Press down */
            100% { transform: rotate(0deg); }
        }

        @keyframes sprayAnim {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            20% { opacity: 1; transform: scale(1.1) translateY(0); }
            100% { opacity: 0; transform: scale(1.2) translateY(-10px); }
        }

        @keyframes waterDip {
            0% { transform: translateY(0) scaleY(1); }
            30% { transform: translateY(10px) scaleY(0.8); } /* Dip down */
            100% { transform: translateY(0) scaleY(1); }
        }
        
        @keyframes tankDrain {
            0% { transform: translateY(0); }
            40% { transform: translateY(10px); }
            100% { transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 4rem; }
            h1 span { font-size: 2.5rem; }
            .content-side { padding-right: 1rem; }
            header { padding: 2rem; }
            main { padding: 0 2rem; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 2rem; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3rem; }
            nav { display: none; }
            header { justify-content: center; }
            .specs { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="specs">
                    <div class="spec-item">
                        <h3>Flow Rate</h3>
                        <p>3.8 L</p>
                    </div>
                    <div class="spec-item">
                        <h3>Material</h3>
                        <p>Vitreous<br>Ceramic</p>
                    </div>
                    <div class="spec-item">
                        <h3>Finish</h3>
                        <p>Matte White</p>
                    </div>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Ceramic Gradient: Soft lighting, not glossy -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#F2F2F2;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#E0E0E0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#CFCFCF;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Tank Gradient: Slightly cooler to differentiate -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#F0F0F0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradient -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" style="stop-color:#9EBBCA;stop-opacity:0.9" />
                        <stop offset="80%" style="stop-color:#6A92A3;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#4A7283;stop-opacity:0.9" />
                    </radialGradient>
                    
                    <!-- Chrome Gradient for Handle -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#E0E0E0" />
                        <stop offset="40%" style="stop-color:#FFFFFF" />
                        <stop offset="100%" style="stop-color:#999999" />
                    </linearGradient>

                    <!-- Floor Shadow Gradient -->
                    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#000000;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
                    </radialGradient>
                </defs>

                <!-- 1. Context: Floor & Environment -->
                <g id="context">
                    <!-- Floor Plane -->
                    <path d="M0,750 L800,750 L800,900 L0,900 Z" fill="#24282C" />
                    <!-- Wood Floor Lines (Subtle) -->
                    <g opacity="0.15" stroke="#FFF" stroke-width="1">
                        <line x1="0" y1="780" x2="800" y2="780" />
                        <line x1="0" y1="820" x2="800" y2="820" />
                        <line x1="0" y1="870" x2="800" y2="870" />
                        <!-- Perspective -->
                        <path d="M100,750 L0,900 M300,750 L200,900 M500,750 L600,900 M700,750 L900,900" />
                    </g>
                    
                    <!-- Floor Shadow for Toilet Base -->
                    <ellipse cx="400" cy="760" rx="220" ry="35" fill="url(#floorShadow)" />
                </g>

                <!-- 2. Plumbing Base (Flange) -->
                <g id="base-connection">
                    <!-- Flange -->
                    <path d="M240,750 C240,735 560,735 560,750 L560,760 C560,775 240,775 240,760 Z" fill="#D0D0D0" />
                    <!-- Shadow under flange -->
                    <path d="M240,760 C240,775 560,775 560,760 L560,765 C560,780 240,780 240,765 Z" fill="#000000" opacity="0.3" />
                    <!-- Bolts -->
                    <circle cx="270" cy="755" r="5" fill="#808080" />
                    <circle cx="530" cy="755" r="5" fill="#808080" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g id="bowl">
                    <!-- Bowl Back Wall (Depth) -->
                    <path d="M260,420 C260,390 540,390 540,420 L540,460 C540,460 260,460 260,460 Z" fill="#E8E8E8" />
                    
                    <!-- Bowl Front Body (Rich Volume) -->
                    <!-- Redesigned curves for better proportion -->
                    <path d="M260,420 C260,420 220,750 400,750 C580,750 540,420 540,420 Z" fill="url(#ceramicGrad)" />
                    
                    <!-- Front Highlight (Soft Gloss) -->
                    <path d="M280,500 C270,650 320,730 400,730 C480,730 530,650 520,500 C500,550 300,550 280,500 Z" fill="#FFFFFF" opacity="0.25" filter="blur(4px)" />
                </g>

                <!-- 4. Water in Bowl -->
                <g id="water-group">
                    <!-- Water Surface -->
                    <ellipse class="water-surface" cx="400" cy="435" rx="120" ry="28" fill="url(#waterGrad)" />
                    <!-- Inner shadow for depth -->
                    <ellipse cx="400" cy="435" rx="115" ry="24" fill="none" stroke="#3A6273" stroke-width="2" opacity="0.3" />
                </g>
                
                <!-- 5. Flush Action Visual -->
                <g id="flush-effect" class="water-spray">
                    <!-- Swirl/Ripples -->
                    <circle cx="400" cy="435" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
                    <circle cx="400" cy="435" r="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
                    <circle cx="400" cy="435" r="90" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
                    
                    <!-- Dynamic Splash Particles -->
                    <path d="M400,435 Q360,350 370,300" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                    <path d="M400,435 Q440,340 430,280" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                    <path d="M400,435 Q400,330 400,270" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
                    
                    <circle cx="360" cy="310" r="3" fill="white" />
                    <circle cx="440" cy="290" r="3.5" fill="white" />
                    <circle cx="400" cy="250" r="2" fill="white" />
                </g>

                <!-- 6. Seat & Lid -->
                <g id="seat">
                    <!-- Lid (Open, leaning back) -->
                    <!-- Using a group to rotate the lid naturally -->
                    <g transform="rotate(-25, 400, 420)">
                        <!-- Lid Top -->
                        <path d="M270,420 C270,380 530,380 530,420 C530,460 270,460 270,420 Z" fill="url(#ceramicGrad)" stroke="#E0E0E0" stroke-width="0.5"/>
                        <!-- Lid Edge/Thickness -->
                        <path d="M270,420 C270,460 530,460 530,420 L530,428 C530,468 270,468 270,428 Z" fill="#E8E8E8" />
                        <!-- Highlight on Lid -->
                        <path d="M290,410 C290,395 510,395 510,410" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <path d="M270,440 C270,400 530,400 530,440 C530,480 270,480 270,440 Z" fill="url(#ceramicGrad)" stroke="#D0D0D0" stroke-width="0.5"/>
                    <!-- Seat Inner Rim Shadow -->
                    <path d="M280,440 C280,415 520,415 520,440" fill="none" stroke="#000000" stroke-width="1" opacity="0.05"/>
                    <!-- Seat Highlight -->
                    <path d="M280,440 C280,420 520,420 520,440" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
                </g>

                <!-- 7. Tank (3D Volume) -->
                <g id="tank">
                    <!-- Tank Body -->
                    <!-- Rounded rectangle with depth -->
                    <rect x="290" y="180" width="220" height="240" rx="15" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Soft edge light) -->
                    <path d="M298,188 L298,412" stroke="white" stroke-width="8" opacity="0.5" stroke-linecap="round" filter="blur(2px)"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="285" y="175" width="230" height="10" rx="5" fill="#FFFFFF" opacity="0.9" />
                    
                    <!-- Water Level in Tank (Visual Cue) -->
                    <g class="tank-water" opacity="0.5">
                        <rect x="300" y="195" width="200" height="210" rx="8" fill="url(#waterGrad)" />
                    </g>
                    
                    <!-- Connection to Bowl (Shadow gap) -->
                    <path d="M290,420 L510,420 L510,430 C510,440 500,445 490,445 L310,445 C300,445 290,440 290,430 Z" fill="#D0D0D0" />
                </g>

                <!-- 8. Flush Handle (Refined Chrome) -->
                <!-- Positioned on the front face of the tank -->
                <g id="handle" class="handle-group" transform="translate(290, 240)">
                    <!-- Arm -->
                    <path d="M0,0 L-35,35" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" filter="drop-shadow(2px 2px 4px rgba(0,0,0,0.3))"/>
                    <!-- Knob (Interactive) -->
                    <g class="flush-btn" onclick="triggerFlush()" style="cursor: pointer;">
                        <circle cx="-35" cy="35" r="14" fill="url(#chromeGrad)" />
                        <!-- Bevel/Highlight -->
                        <circle cx="-38" cy="32" r="8" fill="white" opacity="0.7" filter="blur(1px)"/>
                        <!-- Inner shadow -->
                        <circle cx="-35" cy="35" r="13" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                    </g>
                </g>
                
                <!-- 9. Decorative context: Plant -->
                <g transform="translate(650, 680) scale(0.9)" opacity="0.85">
                    <!-- Pot -->
                    <path d="M-25,0 L25,0 L30,90 L-30,90 Z" fill="#3A3F44" />
                    <path d="M-25,0 L0,18 L25,0" fill="#2A2F34" opacity="0.6"/>
                    <!-- Leaves -->
                    <path d="M0,0 Q-60,-50 -40,-130 Q20,-60 0,0" fill="#4A5055" opacity="0.9" />
                    <path d="M0,0 Q60,-70 90,-120 Q50,-60 0,0" fill="#353A3F" opacity="0.9" />
                    <path d="M0,0 Q-20,-110 40,-170 Q60,-100 0,0" fill="#50555A" opacity="0.9" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            const handle = document.getElementById('handle');
            
            // Reset animation
            effect.classList.remove('flushing');
            handle.classList.remove('flushing');
            
            // Trigger reflow to restart animation
            void effect.offsetWidth; 
            
            // Add animation class
            effect.classList.add('flushing');
            handle.classList.add('flushing');
        }
    </script>
</body>
</html>
