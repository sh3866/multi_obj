<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: High-end, spa-like, moody but clean */
            --bg-color: #E8E6E1; /* Soft plaster */
            --bg-gradient: radial-gradient(circle at 70% 60%, #F5F4F1 0%, #DCDAD5 100%);
            --text-main: #1A1A1A;
            --text-muted: #636363;
            --accent: #2C3E50;
            
            /* Typography */
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
            z-index: 20;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 3rem;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: var(--text-main);
        }
        
        /* Subtle underline effect */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--text-main);
            transition: width 0.3s ease;
        }
        nav a:hover::after {
            width: 100%;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem 0 6rem;
            z-index: 5;
            position: relative;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.95;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            color: var(--text-main);
            font-weight: 300; /* Lighter weight for elegance */
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3.5rem;
            margin-top: 0.5rem;
            margin-left: 1rem;
        }

        .specs {
            margin-top: 3rem;
            display: flex;
            gap: 4rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Interactive Button - Refined */
        .cta-btn {
            margin-top: 4rem;
            padding: 1.2rem 3rem;
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(26, 26, 26, 0.2);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(5px);
            border-radius: 2px;
        }

        .cta-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--text-main);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        
        .cta-btn:active {
            transform: translateY(0);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            perspective: 1000px;
        }

        /* SVG Styles */
        svg {
            width: 90%;
            height: 90%;
            max-height: 800px;
            /* Soft shadow for the whole object */
            filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.15));
        }

        /* Animations */
        .water-spray {
            opacity: 0;
            transform-origin: 300px 320px;
        }

        .flushing .water-spray {
            animation: sprayAnim 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        
        .flushing .water-surface {
            animation: waterDip 0.8s ease-in-out;
        }

        @keyframes sprayAnim {
            0% { opacity: 0; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.2); }
        }

        @keyframes waterDip {
            0% { transform: translateY(0); }
            30% { transform: translateY(10px); }
            100% { transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 2.5rem; }
            .content-side { padding: 0 2rem; }
            header { padding: 2rem; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 2rem; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3rem; }
            nav { display: none; }
            header { justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Removed grid pattern for cleaner, spa-like background -->

        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration - Redesigned for Material Realism -->
            <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Ceramic Gradient: Matte but dimensional -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#FDFDFD;stop-opacity:1" />
                        <stop offset="85%" style="stop-color:#EBEBEB;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#D8D8D8;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Tank Gradient: Slightly darker to separate from bowl -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#F4F4F4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#E5E5E5;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradient: Deep and rich -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" style="stop-color:#D4E7F0;stop-opacity:0.9" />
                        <stop offset="70%" style="stop-color:#8EB8CC;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#7A9AAE;stop-opacity:0.9" />
                    </radialGradient>
                    
                    <!-- Shadow Gradient for depth under rim -->
                    <linearGradient id="rimShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#000000;stop-opacity:0.15" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
                    </linearGradient>

                    <!-- Chrome Gradient for Handle -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#E0E0E0" />
                        <stop offset="50%" style="stop-color:#FFFFFF" />
                        <stop offset="100%" style="stop-color:#999999" />
                    </linearGradient>

                    <!-- Soft Drop Shadow Filter -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
                        <feOffset dx="0" dy="15" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.15"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>
                </defs>

                <!-- Floor Shadow -->
                <ellipse cx="300" cy="560" rx="160" ry="25" fill="#000000" opacity="0.08" filter="blur(4px)" />

                <!-- Base/Floor Connection (Realistic Flange) -->
                <g id="base-connection">
                    <!-- Shadow under flange -->
                    <path d="M250,530 C250,520 350,520 350,530 L350,535 C350,545 250,545 250,535 Z" fill="#B0B0B0" opacity="0.3" />
                    <!-- Flange body -->
                    <path d="M255,525 C255,515 345,515 345,525 L345,535 C345,545 255,545 255,535 Z" fill="url(#tankGrad)" stroke="#E0E0E0" stroke-width="1"/>
                    <!-- Bolt details -->
                    <circle cx="265" cy="530" r="3" fill="#B0B0B0" />
                    <circle cx="335" cy="530" r="3" fill="#B0B0B0" />
                </g>

                <!-- Main Bowl Group -->
                <g id="bowl" filter="url(#softShadow)">
                    <!-- Bowl Back Wall (Depth) -->
                    <path d="M210,280 C210,260 390,260 390,280 L390,300 C390,300 210,300 210,300 Z" fill="#D0D0D0" opacity="0.6" />
                    
                    <!-- Bowl Front Body -->
                    <path d="M210,280 C210,280 190,500 300,500 C410,500 390,280 390,280 Z" fill="url(#ceramicGrad)" />
                    
                    <!-- Bowl Front Highlight (Soft Gloss) -->
                    <path d="M230,320 C220,400 260,480 300,480 C340,480 380,400 370,320 C350,350 250,350 230,320 Z" fill="url(#rimShadow)" style="mix-blend-mode: overlay;" opacity="0.3" />
                </g>

                <!-- Water in Bowl -->
                <g id="water-group">
                    <ellipse class="water-surface" cx="300" cy="295" rx="85" ry="18" fill="url(#waterGrad)" />
                    <!-- Inner shadow for depth -->
                    <ellipse cx="300" cy="295" rx="80" ry="15" fill="none" stroke="#5C8A99" stroke-width="2" opacity="0.2" />
                </g>
                
                <!-- Flush Action Visual (Integrated) -->
                <g id="flush-effect" class="water-spray">
                    <!-- Ripples -->
                    <circle cx="300" cy="295" r="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
                    <circle cx="300" cy="295" r="45" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
                    <circle cx="300" cy="295" r="70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
                    
                    <!-- Splash Particles -->
                    <path d="M300,295 Q280,250 290,230" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
                    <path d="M300,295 Q320,240 310,220" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
                    <circle cx="285" cy="240" r="1.5" fill="white" />
                    <circle cx="315" cy="230" r="2" fill="white" />
                    <circle cx="300" cy="210" r="1" fill="white" />
                </g>

                <!-- Seat & Lid -->
                <g id="seat" filter="url(#softShadow)">
                    <!-- Lid (Open, leaning back) -->
                    <g transform="rotate(-15, 300, 275)">
                        <!-- Lid Top -->
                        <path d="M215,275 C215,250 385,250 385,275 C385,300 215,300 215,275 Z" fill="url(#ceramicGrad)" stroke="#E0E0E0" stroke-width="0.5"/>
                        <!-- Lid Edge/Thickness -->
                        <path d="M215,275 C215,300 385,300 385,275 L385,278 C385,303 215,303 215,278 Z" fill="#E8E8E8" />
                        <!-- Highlight on Lid -->
                        <path d="M230,265 C230,255 370,255 370,265" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <path d="M215,295 C215,270 385,270 385,295 C385,320 215,320 215,295 Z" fill="url(#ceramicGrad)" stroke="#D0D0D0" stroke-width="0.5"/>
                    <!-- Seat Inner Rim Shadow -->
                    <path d="M225,295 C225,278 375,278 375,295" fill="none" stroke="#000000" stroke-width="1" opacity="0.05"/>
                    <!-- Seat Highlight -->
                    <path d="M225,295 C225,280 375,280 375,295" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
                </g>

                <!-- Tank -->
                <g id="tank" filter="url(#softShadow)">
                    <!-- Tank Body -->
                    <rect x="230" y="120" width="140" height="160" rx="8" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Soft edge light) -->
                    <path d="M238,128 L238,272" stroke="white" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="228" y="118" width="144" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
                    
                    <!-- Connection to Bowl (Shadow gap) -->
                    <path d="M230,280 L370,280 L370,290 C370,295 365,300 360,300 L240,300 C235,300 230,295 230,290 Z" fill="#E0E0E0" />
                </g>

                <!-- Flush Handle (Refined Chrome) -->
                <g id="handle" transform="translate(225, 190)">
                    <!-- Arm -->
                    <path d="M0,0 L-25,25" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round" filter="drop-shadow(2px 2px 2px rgba(0,0,0,0.2))"/>
                    <!-- Knob (Interactive) -->
                    <g class="flush-btn" onclick="triggerFlush()" style="cursor: pointer;">
                        <circle cx="-25" cy="25" r="10" fill="url(#chromeGrad)" />
                        <!-- Bevel/Highlight -->
                        <circle cx="-27" cy="23" r="6" fill="white" opacity="0.6" filter="blur(1px)"/>
                        <!-- Inner shadow -->
                        <circle cx="-25" cy="25" r="9" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
                    </g>
                </g>
                
                <!-- Decorative context: Plant (More organic) -->
                <g transform="translate(490, 460) scale(0.9)" opacity="0.8">
                    <!-- Pot -->
                    <path d="M-15,0 L15,0 L20,70 L-20,70 Z" fill="#D7CCC8" />
                    <path d="M-15,0 L0,10 L15,0" fill="#BCAAA4" opacity="0.5"/>
                    <!-- Leaves (Softer shapes) -->
                    <path d="M0,0 Q-40,-30 -20,-90 Q10,-40 0,0" fill="#8D6E63" opacity="0.8" />
                    <path d="M0,0 Q40,-50 60,-90 Q30,-40 0,0" fill="#A1887F" opacity="0.9" />
                    <path d="M0,0 Q-10,-80 20,-130 Q40,-70 0,0" fill="#795548" opacity="0.8" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            const handle = document.getElementById('handle');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
            
            // Subtle handle press animation via JS
            const handleGroup = handle.querySelector('.flush-btn');
            if(handleGroup) {
                handleGroup.style.transform = 'translate(2px, 2px)';
                setTimeout(() => {
                    handleGroup.style.transform = 'translate(0,0)';
                }, 150);
            }
        }
    </script>
</body>
</html>
