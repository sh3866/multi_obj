<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | The Silent Flush</title>
    <style>
        :root {
            /* Palette: Deep Charcoal & Porcelain White */
            --bg-dark: #0f1115;
            --bg-wall: #16191f;
            --text-main: #F0F0F0;
            --text-muted: #9CA3AF;
            --accent-gold: #D4AF37;
            --accent-gold-dim: #8a7424;
            
            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-serif: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: absolute;
            width: 100%;
            top: 0;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Left Column: Typography & Hierarchy */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            z-index: 5;
            position: relative;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-weight: 400;
        }

        h1 span.highlight {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--text-muted);
        }

        /* Specs Grid */
        .specs-container {
            margin-top: 3rem;
            padding-left: 2rem;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem 2rem;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1rem;
            font-weight: 300;
            color: var(--text-main);
        }

        /* Interactive Button - Refined */
        .cta-btn {
            margin-top: 4rem;
            padding: 1rem 2.5rem;
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            width: fit-content;
            font-weight: 500;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 4px;
        }

        .cta-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-main);
            transform: translateY(-1px);
        }
        
        .cta-btn:active {
            transform: translateY(1px);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at 50% 60%, #2a2e35 0%, var(--bg-dark) 80%);
            overflow: hidden;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 1000px;
            overflow: visible;
        }

        /* Animations */
        .water-surface {
            transition: transform 0.2s ease-out;
            transform-origin: 400px 460px;
        }

        .flushing .water-surface {
            animation: waterDip 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flushing .tank-water {
            animation: tankDrain 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flushing .water-ripple {
            animation: rippleAnim 1.5s ease-out;
        }

        .flushing .swirl {
            animation: swirlSpin 1.5s ease-out;
        }

        .handle-group {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 300px 260px;
            cursor: pointer;
        }
        
        .flushing .handle-group {
            animation: handlePress 0.4s ease-in-out;
        }

        @keyframes handlePress {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(30deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes waterDip {
            0% { transform: scale(1) translateY(0); }
            20% { transform: scale(0.9) translateY(5px); }
            40% { transform: scale(1.05) translateY(-2px); }
            60% { transform: scale(0.98) translateY(2px); }
            100% { transform: scale(1) translateY(0); }
        }
        
        @keyframes tankDrain {
            0% { transform: translateY(0); }
            30% { transform: translateY(40px); }
            100% { transform: translateY(0); }
        }

        @keyframes rippleAnim {
            0% { opacity: 0; transform: scale(0.2); stroke-width: 4px; }
            10% { opacity: 1; }
            100% { opacity: 0; transform: scale(2.5); stroke-width: 1px; }
        }

        @keyframes swirlSpin {
            0% { transform: rotate(0deg) scale(0.8); opacity: 0; }
            20% { opacity: 0.6; transform: rotate(45deg) scale(1); }
            100% { transform: rotate(180deg) scale(1.2); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 3.5rem; }
            .content-side { padding: 0 2rem; }
            main { padding: 0 2rem; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 2rem; }
            .visual-side { height: 50vh; order: 1; background: var(--bg-dark); }
            h1 { font-size: 2.5rem; }
            nav { display: none; }
            header { justify-content: center; }
            .specs-container { grid-template-columns: 1fr; gap: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span class="highlight">Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L / 1.0 GPF</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>High-Gloss Matte</p>
                </div>
                <div class="spec-item">
                    <h3>Acoustics</h3>
                    <p>30dB Silent Flush</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Gradients for High-Gloss Ceramic -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#F8F8F8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#F4F4F4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#F2F2F2" />
                        <stop offset="50%" style="stop-color:#B0B0B0" />
                        <stop offset="100%" style="stop-color:#707070" />
                    </linearGradient>

                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#F9F295" />
                        <stop offset="25%" style="stop-color:#D4AF37" />
                        <stop offset="75%" style="stop-color:#8a7424" />
                        <stop offset="100%" style="stop-color:#4a3d12" />
                    </linearGradient>

                    <!-- Water Gradient -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#A8D0E6;stop-opacity:0.8" />
                        <stop offset="80%" style="stop-color:#6FAAC1;stop-opacity:0.9" />
                        <stop offset="100%" style="stop-color:#4A8099;stop-opacity:1" />
                    </radialGradient>

                    <!-- Shadow Gradient -->
                    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#000000;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
                    </radialGradient>

                    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
                        <feOffset dx="0" dy="15" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.4"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>
                </defs>

                <!-- 1. Context: Bathroom Environment -->
                <g id="context">
                    <!-- Wall -->
                    <rect x="0" y="0" width="800" height="900" fill="url(#wallGrad)" />
                    <!-- Floor Plane (Subtle Tile) -->
                    <path d="M0,750 L800,750 L800,900 L0,900 Z" fill="#1a1d23" />
                    
                    <!-- Floor Lines (Perspective) -->
                    <g opacity="0.05" stroke="#FFF" stroke-width="2">
                        <line x1="0" y1="800" x2="800" y2="800" />
                        <line x1="0" y1="860" x2="800" y2="860" />
                        <!-- Perspective Lines -->
                        <path d="M150,750 L0,900 M300,750 L150,900 M500,750 L650,900 M650,750 L800,900" />
                    </g>
                    
                    <!-- Floor Shadow for Toilet Base -->
                    <ellipse cx="400" cy="780" rx="260" ry="50" fill="url(#floorShadow)" />
                </g>

                <!-- 2. Plumbing Base (Flange) -->
                <g id="base-connection">
                    <!-- Flange Base -->
                    <path d="M230,760 C230,745 570,745 570,760 L570,790 C570,805 230,805 230,790 Z" fill="#D0D0D0" />
                    <!-- Shadow under flange -->
                    <path d="M230,790 C230,805 570,805 570,790 L570,795 C570,810 230,810 230,795 Z" fill="#000000" opacity="0.5" />
                    <!-- Bolts -->
                    <circle cx="260" cy="775" r="5" fill="#888" />
                    <circle cx="540" cy="775" r="5" fill="#888" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g id="bowl" filter="url(#drop-shadow)">
                    <!-- Bowl Back Wall (Depth) -->
                    <path d="M240,420 C240,390 560,390 560,420 L560,460 C560,460 240,460 240,460 Z" fill="#E0E0E0" />
                    
                    <!-- Bowl Front Body (Rich Volume) -->
                    <path d="M240,420 C240,420 200,780 400,780 C600,780 560,420 560,420 Z" fill="url(#ceramicGrad)" />
                    
                    <!-- Front Highlight (Soft Gloss) - Enhanced -->
                    <path d="M260,520 C250,680 320,760 400,760 C480,760 540,680 530,520 C510,580 290,580 260,520 Z" fill="#FFFFFF" opacity="0.4" filter="blur(8px)" />
                    
                    <!-- Rim Shadow -->
                    <path d="M240,420 C240,450 560,450 560,420 L560,435 C560,465 240,465 240,435 Z" fill="#000000" opacity="0.08" />
                </g>

                <!-- 4. Water in Bowl -->
                <g id="water-group">
                    <!-- Water Surface -->
                    <ellipse class="water-surface" cx="400" cy="445" rx="140" ry="35" fill="url(#waterGrad)" />
                    
                    <!-- Inner Shadow for depth -->
                    <ellipse cx="400" cy="445" rx="135" ry="32" fill="none" stroke="#4A7283" stroke-width="3" opacity="0.4" />
                    
                    <!-- Swirl Effect (Hidden until flush) -->
                    <path class="swirl" d="M400,445 C400,445 430,420 460,445 C490,470 440,490 400,460 C360,430 350,410 390,410 C430,410 450,430 400,445 Z" fill="#FFFFFF" opacity="0" />

                    <!-- Visual Cue: Ripple (Hidden until flush) -->
                    <circle class="water-ripple" cx="400" cy="445" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0" />
                </g>

                <!-- 5. Seat & Lid -->
                <g id="seat">
                    <!-- Seat (Down) -->
                    <path d="M250,445 C250,405 550,405 550,445 C550,485 250,485 250,445 Z" fill="url(#ceramicGrad)" stroke="#E8E8E8" stroke-width="1"/>
                    
                    <!-- Seat Inner Rim Shadow -->
                    <path d="M260,445 C260,420 540,420 540,445" fill="none" stroke="#000000" stroke-width="1" opacity="0.05"/>
                    <!-- Seat Highlight -->
                    <path d="M260,445 C260,425 540,425 540,445" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                    
                    <!-- Lid (Open, leaning back) -->
                    <g transform="rotate(-25, 400, 445)">
                        <!-- Lid Top -->
                        <path d="M250,445 C250,405 550,405 550,445 C550,485 250,485 250,445 Z" fill="url(#ceramicGrad)" stroke="#E8E8E8" stroke-width="1"/>
                        <!-- Lid Edge/Thickness -->
                        <path d="M250,445 C250,485 550,485 550,445 L550,453 C550,493 250,493 250,453 Z" fill="#E8E8E8" />
                        <!-- Highlight on Lid -->
                        <path d="M270,435 C270,420 530,420 530,435" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
                    </g>
                </g>

                <!-- 6. Tank (3D Volume) -->
                <g id="tank">
                    <!-- Tank Body -->
                    <rect x="270" y="180" width="260" height="240" rx="24" fill="url(#tankGrad)" filter="url(#drop-shadow)" />
                    
                    <!-- Tank Highlight (Soft edge light) -->
                    <path d="M280,190 L280,410" stroke="white" stroke-width="12" opacity="0.5" stroke-linecap="round" filter="blur(4px)"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="265" y="175" width="270" height="12" rx="6" fill="#FFFFFF" opacity="0.95" />
                    
                    <!-- Water Level in Tank (Visual Cue) -->
                    <g class="tank-water" opacity="0.6">
                        <rect x="285" y="195" width="230" height="210" rx="10" fill="url(#waterGrad)" />
                    </g>
                    
                    <!-- Connection to Bowl (Shadow gap) -->
                    <path d="M270,420 L530,420 L530,430 C530,445 270,445 270,430 Z" fill="#D0D0D0" />
                </g>

                <!-- 7. Flush Handle (Refined Brass) -->
                <!-- Positioned on the front face of the tank -->
                <g id="handle" class="handle-group" transform="translate(285, 260)" onclick="triggerFlush()">
                    <!-- Arm (3D Cylinder look) -->
                    <path d="M0,0 L-40,40" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" filter="url(#drop-shadow)"/>
                    
                    <!-- Knob (Interactive) -->
                    <g class="flush-btn">
                        <circle cx="-40" cy="40" r="14" fill="url(#goldGrad)" />
                        <!-- Bevel/Highlight -->
                        <circle cx="-43" cy="37" r="6" fill="white" opacity="0.6" filter="blur(1px)"/>
                        <!-- Inner shadow -->
                        <circle cx="-40" cy="40" r="13" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
                    </g>
                </g>
                
                <!-- 8. Decorative context: Plant -->
                <g transform="translate(680, 650) scale(1.1)" opacity="0.9">
                    <!-- Pot -->
                    <path d="M-30,0 L30,0 L40,110 L-40,110 Z" fill="#2a2b2e" />
                    <path d="M-30,0 L0,25 L30,0" fill="#1c1d1f" opacity="0.6"/>
                    <!-- Leaves (More organic shapes) -->
                    <path d="M0,0 Q-80,-60 -50,-160 Q30,-80 0,0" fill="#3E4449" opacity="0.95" />
                    <path d="M0,0 Q80,-90 120,-150 Q70,-70 0,0" fill="#2C3034" opacity="0.95" />
                    <path d="M0,0 Q-30,-140 50,-200 Q80,-120 0,0" fill="#4A5055" opacity="0.95" />
                    <!-- Leaf Highlights -->
                    <path d="M0,0 Q-80,-60 -50,-160" fill="none" stroke="#555" stroke-width="1" opacity="0.5" />
                    <path d="M0,0 Q80,-90 120,-150" fill="none" stroke="#444" stroke-width="1" opacity="0.5" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const handle = document.getElementById('handle');
            
            // Reset animation
            svg.classList.remove('flushing');
            handle.classList.remove('flushing');
            
            // Trigger reflow to restart animation
            void svg.offsetWidth; 
            
            // Add animation class
            svg.classList.add('flushing');
            handle.classList.add('flushing');
        }
    </script>
</body>
</html>
