<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: Warm Dark Stone & Soft Porcelain */
            --bg-dark: #1c1d1f;
            --bg-light: #2a2b2e;
            --text-main: #F5F5F5;
            --text-muted: #8F9093;
            --accent: #D4D4D4;
            
            /* Typography */
            --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 70% 50%, #2e3034 0%, var(--bg-dark) 70%);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%;
            position: relative;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 4rem;
            align-items: center;
        }

        /* Left Column: Typography & Hierarchy */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 2rem;
            z-index: 5;
            position: relative;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 300;
        }

        h1 em {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3rem;
            display: block;
            margin-top: 0.5rem;
            margin-left: 0.2rem;
        }

        /* Specs Grid - Anchored */
        .specs-container {
            margin-top: 2rem;
            display: flex;
            align-items: flex-start;
            position: relative;
            padding-left: 1rem;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }

        .specs {
            padding-left: 2rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.2;
        }

        /* Interactive Button - High Contrast */
        .cta-btn {
            margin-top: 3rem;
            padding: 1.1rem 2.5rem;
            background: var(--text-main);
            color: var(--bg-dark);
            border: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            width: fit-content;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 2px;
        }

        .cta-btn:hover {
            background: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .cta-btn:active {
            transform: translateY(0);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            max-height: 900px;
            overflow: visible;
        }

        /* Animations */
        .water-surface {
            transition: transform 0.2s ease-out;
            transform-origin: 400px 440px;
        }

        .flushing .water-surface {
            animation: waterDip 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flushing .tank-water {
            animation: tankDrain 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flushing .water-ripple {
            animation: rippleAnim 1.5s ease-out;
        }

        .handle-group {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 295px 250px;
        }
        
        .flushing .handle-group {
            animation: handlePress 0.4s ease-in-out;
        }

        @keyframes handlePress {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(25deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes waterDip {
            0% { transform: scale(1) translateY(0); }
            20% { transform: scale(0.9) translateY(5px); }
            40% { transform: scale(1.05) translateY(-2px); }
            60% { transform: scale(0.98) translateY(2px); }
            100% { transform: scale(1) translateY(0); }
        }
        
        @keyframes tankDrain {
            0% { transform: translateY(0); }
            30% { transform: translateY(40px); }
            100% { transform: translateY(0); }
        }

        @keyframes rippleAnim {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 4rem; }
            .specs { grid-template-columns: repeat(3, 1fr); gap: 1rem; }
            main { padding: 0 2rem; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 2rem; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3rem; }
            nav { display: none; }
            header { justify-content: center; }
            .specs { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <em>Refined.</em>
            </h1>
            
            <div class="specs-container">
                <div class="specs">
                    <div class="spec-item">
                        <h3>Flow Rate</h3>
                        <p>3.8 L</p>
                    </div>
                    <div class="spec-item">
                        <h3>Material</h3>
                        <p>Vitreous<br>Ceramic</p>
                    </div>
                    <div class="spec-item">
                        <h3>Finish</h3>
                        <p>Matte White</p>
                    </div>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Gradients for Matte Ceramic -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#F2F2F2;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#D8D8D8;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#F4F4F4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#E0E0E0" />
                        <stop offset="50%" style="stop-color:#FFFFFF" />
                        <stop offset="100%" style="stop-color:#999999" />
                    </linearGradient>

                    <!-- Water Gradient -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#B8D8E6;stop-opacity:0.9" />
                        <stop offset="80%" style="stop-color:#7FAAC1;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#5A8AA3;stop-opacity:0.9" />
                    </radialGradient>

                    <!-- Shadow Gradient -->
                    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#000000;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
                    </radialGradient>

                    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
                        <feOffset dx="0" dy="10" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.3"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>
                </defs>

                <!-- 1. Context: Floor & Environment -->
                <g id="context">
                    <!-- Floor Plane (Subtle Texture) -->
                    <path d="M0,780 L800,780 L800,900 L0,900 Z" fill="#202225" />
                    <!-- Floor Lines (Clean Vector Perspective) -->
                    <g opacity="0.1" stroke="#FFF" stroke-width="1">
                        <line x1="0" y1="810" x2="800" y2="810" />
                        <line x1="0" y1="850" x2="800" y2="850" />
                        <line x1="0" y1="900" x2="800" y2="900" />
                        <!-- Perspective Lines -->
                        <path d="M150,780 L0,900 M300,780 L150,900 M500,780 L650,900 M650,780 L800,900" />
                    </g>
                    
                    <!-- Floor Shadow for Toilet Base -->
                    <ellipse cx="400" cy="790" rx="240" ry="45" fill="url(#floorShadow)" />
                </g>

                <!-- 2. Plumbing Base (Flange) -->
                <g id="base-connection">
                    <!-- Flange -->
                    <path d="M220,780 C220,765 580,765 580,780 L580,805 C580,820 220,820 220,805 Z" fill="#C8C8C8" />
                    <!-- Shadow under flange -->
                    <path d="M220,805 C220,820 580,820 580,805 L580,810 C580,825 220,825 220,810 Z" fill="#000000" opacity="0.4" />
                    <!-- Bolts -->
                    <circle cx="250" cy="792" r="6" fill="#888" />
                    <circle cx="550" cy="792" r="6" fill="#888" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g id="bowl">
                    <!-- Bowl Back Wall (Depth) -->
                    <path d="M250,420 C250,390 550,390 550,420 L550,460 C550,460 250,460 250,460 Z" fill="#E0E0E0" />
                    
                    <!-- Bowl Front Body (Rich Volume) -->
                    <path d="M250,420 C250,420 210,780 400,780 C590,780 550,420 550,420 Z" fill="url(#ceramicGrad)" />
                    
                    <!-- Front Highlight (Soft Gloss) -->
                    <path d="M270,520 C260,680 320,760 400,760 C480,760 540,680 530,520 C510,580 290,580 270,520 Z" fill="#FFFFFF" opacity="0.3" filter="blur(6px)" />
                    
                    <!-- Rim Shadow -->
                    <path d="M250,420 C250,450 550,450 550,420 L550,435 C550,465 250,465 250,435 Z" fill="#000000" opacity="0.05" />
                </g>

                <!-- 4. Water in Bowl -->
                <g id="water-group">
                    <!-- Water Surface -->
                    <ellipse class="water-surface" cx="400" cy="440" rx="130" ry="30" fill="url(#waterGrad)" />
                    
                    <!-- Inner Shadow for depth -->
                    <ellipse cx="400" cy="440" rx="125" ry="28" fill="none" stroke="#4A7283" stroke-width="2" opacity="0.4" />
                    
                    <!-- Visual Cue: Ripple (Hidden until flush) -->
                    <circle class="water-ripple" cx="400" cy="440" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0" />
                </g>

                <!-- 5. Seat & Lid -->
                <g id="seat">
                    <!-- Seat (Down) -->
                    <path d="M260,445 C260,405 540,405 540,445 C540,485 260,485 260,445 Z" fill="url(#ceramicGrad)" stroke="#E8E8E8" stroke-width="1"/>
                    
                    <!-- Seat Inner Rim Shadow -->
                    <path d="M270,445 C270,420 530,420 530,445" fill="none" stroke="#000000" stroke-width="1" opacity="0.05"/>
                    <!-- Seat Highlight -->
                    <path d="M270,445 C270,425 530,425 530,445" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                    
                    <!-- Lid (Open, leaning back) -->
                    <g transform="rotate(-25, 400, 445)">
                        <!-- Lid Top -->
                        <path d="M260,445 C260,405 540,405 540,445 C540,485 260,485 260,445 Z" fill="url(#ceramicGrad)" stroke="#E8E8E8" stroke-width="1"/>
                        <!-- Lid Edge/Thickness -->
                        <path d="M260,445 C260,485 540,485 540,445 L540,453 C540,493 260,493 260,453 Z" fill="#E8E8E8" />
                        <!-- Highlight on Lid -->
                        <path d="M280,435 C280,420 520,420 520,435" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    </g>
                </g>

                <!-- 6. Tank (3D Volume) -->
                <g id="tank">
                    <!-- Tank Body -->
                    <rect x="280" y="180" width="240" height="240" rx="20" fill="url(#tankGrad)" filter="url(#drop-shadow)" />
                    
                    <!-- Tank Highlight (Soft edge light) -->
                    <path d="M290,190 L290,410" stroke="white" stroke-width="10" opacity="0.4" stroke-linecap="round" filter="blur(3px)"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="275" y="175" width="250" height="12" rx="6" fill="#FFFFFF" opacity="0.95" />
                    
                    <!-- Water Level in Tank (Visual Cue) -->
                    <g class="tank-water" opacity="0.6">
                        <rect x="295" y="195" width="210" height="210" rx="10" fill="url(#waterGrad)" />
                    </g>
                    
                    <!-- Connection to Bowl (Shadow gap) -->
                    <path d="M280,420 L520,420 L520,430 C520,445 280,445 280,430 Z" fill="#D0D0D0" />
                </g>

                <!-- 7. Flush Handle (Refined Chrome) -->
                <!-- Positioned on the front face of the tank -->
                <g id="handle" class="handle-group" transform="translate(280, 250)">
                    <!-- Arm (3D Cylinder look) -->
                    <path d="M0,0 L-35,35" stroke="url(#chromeGrad)" stroke-width="10" stroke-linecap="round" />
                    
                    <!-- Knob (Interactive) -->
                    <g class="flush-btn" onclick="triggerFlush()" style="cursor: pointer;">
                        <circle cx="-35" cy="35" r="16" fill="url(#chromeGrad)" />
                        <!-- Bevel/Highlight -->
                        <circle cx="-39" cy="31" r="8" fill="white" opacity="0.8" filter="blur(1px)"/>
                        <!-- Inner shadow -->
                        <circle cx="-35" cy="35" r="15" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                    </g>
                </g>
                
                <!-- 8. Decorative context: Plant -->
                <g transform="translate(680, 650) scale(1.1)" opacity="0.9">
                    <!-- Pot -->
                    <path d="M-30,0 L30,0 L40,110 L-40,110 Z" fill="#2a2b2e" />
                    <path d="M-30,0 L0,25 L30,0" fill="#1c1d1f" opacity="0.6"/>
                    <!-- Leaves (More organic shapes) -->
                    <path d="M0,0 Q-80,-60 -50,-160 Q30,-80 0,0" fill="#3E4449" opacity="0.95" />
                    <path d="M0,0 Q80,-90 120,-150 Q70,-70 0,0" fill="#2C3034" opacity="0.95" />
                    <path d="M0,0 Q-30,-140 50,-200 Q80,-120 0,0" fill="#4A5055" opacity="0.95" />
                    <!-- Leaf Highlights -->
                    <path d="M0,0 Q-80,-60 -50,-160" fill="none" stroke="#555" stroke-width="1" opacity="0.5" />
                    <path d="M0,0 Q80,-90 120,-150" fill="none" stroke="#444" stroke-width="1" opacity="0.5" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const handle = document.getElementById('handle');
            
            // Reset animation
            svg.classList.remove('flushing');
            handle.classList.remove('flushing');
            
            // Trigger reflow to restart animation
            void svg.offsetWidth; 
            
            // Add animation class
            svg.classList.add('flushing');
            handle.classList.add('flushing');
        }
    </script>
</body>
</html>
