<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            /* Palette: Refined, moody, spa-like but with stronger contrast */
            --bg-color: #D6D3CC; 
            --bg-gradient: radial-gradient(circle at 60% 40%, #EBE9E4 0%, #C8C5BE 60%, #B0ADA5 100%);
            --text-main: #1C1C1C;
            --text-muted: #5A5A5A;
            --accent: #2F3E46;
            
            /* Typography */
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-main);
            z-index: 20;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 3rem;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: var(--text-main);
        }
        
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--text-main);
            transition: width 0.3s ease;
        }
        nav a:hover::after {
            width: 100%;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%; /* Adjusted split for better visual balance */
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            padding: 0 2rem;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 2rem 0 4rem;
            z-index: 5;
            position: relative;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            letter-spacing: -0.03em;
            margin-bottom: 2.5rem;
            color: var(--text-main);
            font-weight: 400;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3rem;
            margin-top: 0.5rem;
            margin-left: 0.5rem;
        }

        /* Specs Grid - Stricter Rhythm */
        .specs {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.3;
        }

        /* Interactive Button - Stronger Hierarchy */
        .cta-btn {
            margin-top: 3.5rem;
            padding: 1rem 3rem;
            background: var(--text-main); /* Solid fill for contrast */
            color: #FFFFFF;
            border: 1px solid var(--text-main);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 2px;
        }

        .cta-btn:hover {
            background: transparent;
            color: var(--text-main);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .cta-btn:active {
            transform: translateY(0);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            max-height: 850px;
            /* Stronger Drop Shadow to ground the object */
            filter: drop-shadow(0px 40px 50px rgba(0,0,0,0.25));
        }

        /* Animations */
        .water-spray {
            opacity: 0;
            transform-origin: 320px 340px;
        }

        .flushing .water-spray {
            animation: sprayAnim 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .flushing .water-surface {
            animation: waterDip 1s ease-in-out;
        }

        .flushing .tank-water {
            animation: tankDrain 1s ease-in-out;
        }

        @keyframes sprayAnim {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            15% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(1.1) translateY(-5px); }
        }

        @keyframes waterDip {
            0% { transform: translateY(0); }
            20% { transform: translateY(15px); }
            100% { transform: translateY(0); }
        }
        
        @keyframes tankDrain {
            0% { transform: translateY(0); }
            20% { transform: translateY(5px); }
            100% { transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 2.5rem; }
            .content-side { padding: 0 2rem; }
            header { padding: 2rem; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 2rem; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3rem; }
            nav { display: none; }
            header { justify-content: center; }
            .specs { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration - Redesigned for Context, Material & Dimension -->
            <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Advanced Ceramic Gradient: Simulating Volume and Light -->
                    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#F2F2F2;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#E0E0E0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Tank Gradient: Slightly cooler tone to separate from bowl -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#F0F0F0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#DCDCDC;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradient: Deep, rich blue-grey -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" style="stop-color:#C4D7E0;stop-opacity:0.9" />
                        <stop offset="70%" style="stop-color:#8EB8CC;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#6A92A3;stop-opacity:0.9" />
                    </radialGradient>
                    
                    <!-- Chrome Gradient for Handle -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#E0E0E0" />
                        <stop offset="50%" style="stop-color:#FFFFFF" />
                        <stop offset="100%" style="stop-color:#999999" />
                    </linearGradient>

                    <!-- Floor Shadow Gradient -->
                    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
                    </radialGradient>

                    <!-- Soft Drop Shadow Filter for Product Parts -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
                        <feOffset dx="0" dy="15" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.15"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>
                </defs>

                <!-- 1. Context: Bathroom Environment -->
                <g id="context">
                    <!-- Wall/Floor Junction -->
                    <line x1="0" y1="600" x2="800" y2="600" stroke="#C4C1BA" stroke-width="2" />
                    
                    <!-- Floor Tiles (Subtle Perspective) -->
                    <g opacity="0.3" stroke="#AFA9A1" stroke-width="1">
                        <line x1="0" y1="650" x2="800" y2="650" />
                        <line x1="0" y1="720" x2="800" y2="720" />
                        <line x1="0" y1="800" x2="800" y2="800" />
                        <!-- Perspective lines -->
                        <path d="M100,600 L0,800 M300,600 L200,800 M500,600 L600,800 M700,600 L900,800" />
                    </g>
                    
                    <!-- Floor Shadow for Toilet Base -->
                    <ellipse cx="400" cy="620" rx="180" ry="30" fill="url(#floorShadow)" />
                </g>

                <!-- 2. Base/Floor Connection (Functional Plumbing) -->
                <g id="base-connection">
                    <!-- Flange (Wax ring area) -->
                    <path d="M260,600 C260,590 540,590 540,600 L540,615 C540,625 260,625 260,615 Z" fill="#E8E8E8" />
                    <!-- Shadow under flange -->
                    <path d="M260,615 C260,625 540,625 540,615 L540,620 C540,630 260,630 260,620 Z" fill="#000000" opacity="0.1" />
                    <!-- Bolts -->
                    <circle cx="290" cy="608" r="4" fill="#B0B0B0" />
                    <circle cx="510" cy="608" r="4" fill="#B0B0B0" />
                </g>

                <!-- 3. Main Bowl Group -->
                <g id="bowl" filter="url(#softShadow)">
                    <!-- Bowl Back Wall (Depth) -->
                    <path d="M280,350 C280,330 520,330 520,350 L520,380 C520,380 280,380 280,380 Z" fill="#E0E0E0" />
                    
                    <!-- Bowl Front Body (Rich Volume) -->
                    <path d="M280,350 C280,350 240,600 400,600 C560,600 520,350 520,350 Z" fill="url(#ceramicGrad)" />
                    
                    <!-- Front Highlight (Soft Gloss) -->
                    <path d="M300,400 C290,500 330,580 400,580 C470,580 510,500 500,400 C480,430 320,430 300,400 Z" fill="#FFFFFF" opacity="0.3" filter="blur(2px)" />
                </g>

                <!-- 4. Water in Bowl -->
                <g id="water-group">
                    <ellipse class="water-surface" cx="400" cy="365" rx="105" ry="22" fill="url(#waterGrad)" />
                    <!-- Inner shadow for depth -->
                    <ellipse cx="400" cy="365" rx="100" ry="18" fill="none" stroke="#5C8A99" stroke-width="2" opacity="0.2" />
                </g>
                
                <!-- 5. Flush Action Visual (Integrated Swirl) -->
                <g id="flush-effect" class="water-spray">
                    <!-- Swirl/Ripples -->
                    <circle cx="400" cy="365" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
                    <circle cx="400" cy="365" r="55" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
                    <circle cx="400" cy="365" r="85" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
                    
                    <!-- Dynamic Splash Particles -->
                    <path d="M400,365 Q370,300 380,270" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
                    <path d="M400,365 Q430,290 420,250" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
                    <path d="M400,365 Q400,280 400,240" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
                    
                    <circle cx="375" cy="280" r="2" fill="white" />
                    <circle cx="425" cy="260" r="2.5" fill="white" />
                    <circle cx="400" cy="230" r="1.5" fill="white" />
                    <circle cx="390" cy="310" r="1" fill="white" />
                    <circle cx="415" cy="300" r="1.5" fill="white" />
                </g>

                <!-- 6. Seat & Lid -->
                <g id="seat" filter="url(#softShadow)">
                    <!-- Lid (Open, leaning back) -->
                    <g transform="rotate(-20, 400, 350)">
                        <!-- Lid Top -->
                        <path d="M290,350 C290,320 510,320 510,350 C510,380 290,380 290,350 Z" fill="url(#ceramicGrad)" stroke="#E0E0E0" stroke-width="0.5"/>
                        <!-- Lid Edge/Thickness -->
                        <path d="M290,350 C290,380 510,380 510,350 L510,358 C510,388 290,388 290,358 Z" fill="#E8E8E8" />
                        <!-- Highlight on Lid -->
                        <path d="M310,340 C310,330 490,330 490,340" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <path d="M290,370 C290,340 510,340 510,370 C510,400 290,400 290,370 Z" fill="url(#ceramicGrad)" stroke="#D0D0D0" stroke-width="0.5"/>
                    <!-- Seat Inner Rim Shadow -->
                    <path d="M300,370 C300,353 500,353 500,370" fill="none" stroke="#000000" stroke-width="1" opacity="0.05"/>
                    <!-- Seat Highlight -->
                    <path d="M300,370 C300,355 500,355 500,370" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
                </g>

                <!-- 7. Tank -->
                <g id="tank" filter="url(#softShadow)">
                    <!-- Tank Body -->
                    <rect x="310" y="150" width="180" height="190" rx="12" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Soft edge light) -->
                    <path d="M318,158 L318,332" stroke="white" stroke-width="6" opacity="0.6" stroke-linecap="round" filter="blur(1px)"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="308" y="148" width="184" height="8" rx="4" fill="#FFFFFF" opacity="0.9" />
                    
                    <!-- Water Level in Tank (Visual Cue) -->
                    <g class="tank-water" opacity="0.6">
                        <rect x="320" y="160" width="160" height="170" rx="4" fill="url(#waterGrad)" opacity="0.3" />
                    </g>
                    
                    <!-- Connection to Bowl (Shadow gap) -->
                    <path d="M310,340 L490,340 L490,350 C490,355 485,360 480,360 L320,360 C315,360 310,355 310,350 Z" fill="#E0E0E0" />
                </g>

                <!-- 8. Flush Handle (Refined Chrome) -->
                <g id="handle" transform="translate(305, 230)">
                    <!-- Arm -->
                    <path d="M0,0 L-30,30" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" filter="drop-shadow(2px 2px 2px rgba(0,0,0,0.2))"/>
                    <!-- Knob (Interactive) -->
                    <g class="flush-btn" onclick="triggerFlush()" style="cursor: pointer;">
                        <circle cx="-30" cy="30" r="12" fill="url(#chromeGrad)" />
                        <!-- Bevel/Highlight -->
                        <circle cx="-32" cy="28" r="7" fill="white" opacity="0.6" filter="blur(1px)"/>
                        <!-- Inner shadow -->
                        <circle cx="-30" cy="30" r="11" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
                    </g>
                </g>
                
                <!-- 9. Decorative context: Plant (Stylistic Match) -->
                <g transform="translate(680, 550) scale(0.8)" opacity="0.9">
                    <!-- Pot -->
                    <path d="M-20,0 L20,0 L25,80 L-25,80 Z" fill="#B0ADA5" />
                    <path d="M-20,0 L0,15 L20,0" fill="#9E9B94" opacity="0.5"/>
                    <!-- Leaves (Softer, Matte shapes matching the palette) -->
                    <path d="M0,0 Q-50,-40 -30,-110 Q10,-50 0,0" fill="#A3A099" opacity="0.8" />
                    <path d="M0,0 Q50,-60 80,-100 Q40,-50 0,0" fill="#8C8982" opacity="0.9" />
                    <path d="M0,0 Q-15,-100 30,-150 Q50,-90 0,0" fill="#96938C" opacity="0.8" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            const handle = document.getElementById('handle');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
            
            // Subtle handle press animation via JS
            const handleGroup = handle.querySelector('.flush-btn');
            if(handleGroup) {
                handleGroup.style.transform = 'translate(3px, 3px)';
                setTimeout(() => {
                    handleGroup.style.transform = 'translate(0,0)';
                }, 150);
            }
        }
    </script>
</body>
</html>
