<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | Editorial Illustration</title>
<style>
    :root {
        --c-sky-top: #0f172a;
        --c-sky-bot: #1e293b;
        --c-rock-dark: #020617;
        --c-rock-light: #1e293b;
        --c-rock-highlight: #334155;
        --c-accent: #f59e0b;
        --c-accent-glow: #fbbf24;
        --c-text-main: #f8fafc;
        --c-text-muted: #94a3b8;
        --font-display: "Impact", "Haettenschweiler", "Arial Narrow Bold", sans-serif;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-sky-top);
        color: var(--c-text-main);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: block;
    }

    /* --- SCENE CONTAINER --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--c-sky-top) 0%, var(--c-sky-bot) 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- OVERLAY UI (Minimalist/Editorial) --- */
    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 4rem;
        z-index: 10;
    }

    /* Header - Editorial Style */
    .header {
        pointer-events: auto;
        max-width: 500px;
        mix-blend-mode: difference; /* Ensures visibility against light/dark */
    }

    .tag {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--c-accent);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .tag::before {
        content: '';
        display: block;
        width: 40px;
        height: 3px;
        background: var(--c-accent);
    }

    h1 {
        font-family: var(--font-display);
        font-size: clamp(4rem, 8vw, 8rem);
        line-height: 0.85;
        letter-spacing: -0.02em;
        color: white;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        /* Text shadow for separation */
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    p.lead {
        font-size: 1rem;
        line-height: 1.6;
        color: rgba(255,255,255,0.9);
        max-width: 300px;
        font-weight: 400;
        border-left: 2px solid var(--c-accent);
        padding-left: 1rem;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* Footer / HUD - Floating & Contextual */
    .hud-footer {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        gap: 2rem;
        pointer-events: auto;
    }

    .telemetry-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        text-align: right;
        background: linear-gradient(90deg, rgba(15,23,42,0) 0%, rgba(15,23,42,0.8) 100%);
        padding: 1rem 2rem 1rem 1rem;
        border-left: 1px solid rgba(255,255,255,0.1);
    }

    .telemetry-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .telemetry-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--c-text-muted);
        margin-bottom: 0.1rem;
    }

    .telemetry-value {
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.25rem;
        font-weight: 700;
        color: white;
    }

    /* Subtle slider styling */
    .controls {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    .slider-wrapper {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    input[type="range"] {
        width: 100px;
        height: 1px;
        background: rgba(255,255,255,0.3);
        border-radius: 2px;
        appearance: none;
        outline: none;
        cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 0; /* Square for tech feel */
        background: var(--c-accent);
        cursor: pointer;
    }

</style>
</head>
<body>

    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1400 900">
            <defs>
                <!-- Gradients -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="40%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#334155" />
                </linearGradient>

                <linearGradient id="cliffGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#000000" />
                    <stop offset="50%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>

                <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f59e0b" />
                    <stop offset="60%" stop-color="#d97706" />
                    <stop offset="100%" stop-color="#b45309" />
                </linearGradient>

                <!-- Filters -->
                <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6" />
                </filter>
                
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="15" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Clip Path for Cliff Texture -->
                <clipPath id="cliffClip">
                    <path d="M-50,-50 L200,-50 L200,150 L280,200 L250,350 L350,400 L300,550 L400,650 L350,800 L450,950 L-50,950 Z" />
                </clipPath>
            </defs>

            <!-- 1. Background: Sky & Atmosphere -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />

            <!-- Distant Mountains (Atmospheric Depth) -->
            <g id="distant-mountains" opacity="0.4">
                <!-- Far Left -->
                <path d="M0,900 L0,500 L200,400 L400,550 L400,900 Z" fill="#1e293b" />
                <!-- Center/Right -->
                <path d="M600,900 L600,600 L900,450 L1200,650 L1400,500 L1400,900 Z" fill="#1e293b" />
                <!-- Closest Distant -->
                <path d="M800,900 L800,700 L1100,600 L1400,800 L1400,900 Z" fill="#0f172a" opacity="0.8" />
            </g>

            <!-- 2. The Main Cliff (Foreground Left - Heavy, Textured) -->
            <g id="cliff-group">
                <!-- Base Shape -->
                <path d="M-50,-50 L200,-50 L200,150 L280,200 L250,350 L350,400 L300,550 L400,650 L350,800 L450,950 L-50,950 Z" 
                      fill="url(#cliffGrad)" />
                
                <!-- Geological Strata / Texture -->
                <g clip-path="url(#cliffClip)">
                    <!-- Darker layers -->
                    <path d="M-100,100 L500,250 L500,300 L-100,150 Z" fill="#020617" opacity="0.5" />
                    <path d="M-100,350 L500,500 L500,520 L-100,370 Z" fill="#020617" opacity="0.7" />
                    <path d="M-100,600 L500,750 L500,780 L-100,630 Z" fill="#020617" opacity="0.6" />
                    
                    <!-- Highlights/Edges -->
                    <path d="M-100,200 L500,350 L500,360 L-100,190 Z" fill="#334155" opacity="0.3" />
                    <path d="M-100,450 L500,600 L500,610 L-100,440 Z" fill="#334155" opacity="0.3" />
                    
                    <!-- Jagged cracks -->
                    <path d="M200,150 L280,200 L250,350 L350,400 L300,550 L400,650 L350,800 L450,950" 
                          stroke="#000" stroke-width="4" fill="none" />
                    <path d="M200,150 L280,200 L250,350 L350,400 L300,550 L400,650 L350,800 L450,950" 
                          stroke="#475569" stroke-width="1" fill="none" opacity="0.5" />
                </g>
                
                <!-- Leading Edge Highlight -->
                <path d="M200,150 L280,200 L250,350 L350,400 L300,550 L400,650 L350,800 L450,950" 
                      stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" />
            </g>

            <!-- 3. Parachutist Group -->
            <g id="parachutist" transform="translate(750, 450)">
                
                <!-- Wind Lines (Motion Cues) - Dynamic Generation in JS -->
                <g id="wind-lines"></g>

                <!-- Shadow on Cliff/Ground (Visual Anchor) -->
                <ellipse id="shadow" cx="-200" cy="600" rx="60" ry="15" fill="#000" opacity="0.4" filter="url(#glow)" />

                <!-- Taut Harness Lines -->
                <g id="lines" stroke="#cbd5e1" stroke-width="1" fill="none" opacity="0.7">
                    <!-- Lines connect canopy to human -->
                    <path d="M-110,-140 L0,120 L110,-140" />
                    <path d="M-80,-140 L0,120 L80,-140" />
                    <path d="M-50,-140 L0,120 L50,-140" />
                    <path d="M-20,-140 L0,120 L20,-140" />
                    <path d="M0,-140 L0,120" />
                </g>

                <!-- The Canopy -->
                <g id="canopy-group">
                    <!-- Main Shape -->
                    <path id="canopy" d="M-130,-140 Q0,-290 130,-140 Q0,-210 -130,-140 Z" fill="url(#canopyGrad)" filter="url(#dropShadow)" />
                    
                    <!-- Canopy Folds (Geometric Precision) -->
                    <g stroke="#92400e" stroke-width="1.5" opacity="0.5" fill="none">
                        <path d="M-130,-140 Q-65,-220 0,-180 Q65,-220 130,-140" />
                        <path d="M-90,-140 Q-45,-250 0,-200 Q45,-250 90,-140" />
                        <path d="M-50,-140 Q-25,-280 0,-220 Q25,-280 50,-140" />
                        <!-- Vertical Ribs -->
                        <path d="M-90,-140 L-45,-200" />
                        <path d="M90,-140 L45,-200" />
                        <path d="M-45,-140 L0,-220" />
                        <path d="M45,-140 L0,-220" />
                    </g>
                </g>

                <!-- The Human Figure (Stylized, Expressive) -->
                <g id="human" filter="url(#dropShadow)">
                    <!-- Backpack/Rig -->
                    <rect x="-15" y="100" width="30" height="35" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
                    
                    <!-- Body (Silhouette) -->
                    <path d="M0,120 L-10,175 L10,175 Z" fill="#020617" />
                    
                    <!-- Limbs (Dynamic Pose - Tension) -->
                    <g stroke="#020617" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <!-- Legs (Knees bent, bracing) -->
                        <path d="M-10,175 L-20,215 L-10,230" /> 
                        <path d="M10,175 L25,205 L15,225" />
                        
                        <!-- Arms (Holding toggles out) -->
                        <path d="M-5,125 L-35,150 L-25,160" /> 
                        <path d="M5,125 L35,150 L25,160" />
                    </g>

                    <!-- Helmet -->
                    <circle cx="0" cy="112" r="10" fill="#cbd5e1" />
                    <path d="M-10,112 Q0,102 10,112" fill="#94a3b8" opacity="0.6" />
                </g>
            </g>
        </svg>

        <!-- UI Overlay -->
        <div class="ui-overlay">
            <div class="header">
                <div class="tag">Operation: Vertical</div>
                <h1>Gravity<br>Well.</h1>
                <p class="lead">
                    The relationship between geological permanence and human fragility.
                </p>
            </div>

            <div class="hud-footer">
                <div class="controls">
                    <div class="slider-wrapper">
                        <span style="font-size:0.6rem; color:var(--c-text-muted); letter-spacing:0.1em; text-transform:uppercase;">Sim Speed</span>
                        <input type="range" id="speedControl" min="0" max="100" value="30">
                    </div>
                </div>

                <div class="telemetry-group">
                    <div class="telemetry-item">
                        <span class="telemetry-label">Altitude</span>
                        <span class="telemetry-value" id="alt-val">4,200</span> <span style="font-size:0.8em; opacity:0.5">ft</span>
                    </div>
                    <div class="telemetry-item">
                        <span class="telemetry-label">Wind</span>
                        <span class="telemetry-value" id="wind-val">24</span> <span style="font-size:0.8em; opacity:0.5">mph</span>
                    </div>
                    <div class="telemetry-item">
                        <span class="telemetry-label">Status</span>
                        <span class="telemetry-value" style="color:var(--c-accent);">NOMINAL</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachuteGroup = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const shadow = document.getElementById('shadow');
            const windLinesGroup = document.getElementById('wind-lines');
            
            const altVal = document.getElementById('alt-val');
            const windVal = document.getElementById('wind-val');
            const speedControl = document.getElementById('speedControl');
            
            let time = 0;
            let speed = 30;
            let altitude = 4200;

            // Mouse interaction for parallax
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;
            });

            speedControl.addEventListener('input', (e) => {
                speed = parseInt(e.target.value);
                const baseWind = 24;
                const extraWind = (speed / 100) * 15;
                windVal.innerText = Math.floor(baseWind + extraWind);
            });

            // Generate wind lines
            const windPaths = [];
            const lineCount = 12;
            for(let i=0; i<lineCount; i++) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                // Varying opacity and stroke width for depth
                const opacity = Math.random() * 0.3 + 0.1;
                const width = Math.random() * 1.5 + 0.5;
                path.setAttribute("stroke", `rgba(255,255,255,${opacity})`);
                path.setAttribute("stroke-width", width);
                path.setAttribute("stroke-linecap", "round");
                windLinesGroup.appendChild(path);
                
                windPaths.push({
                    el: path,
                    x: Math.random() * 800 + 200, // Start right side
                    y: Math.random() * 600 + 100,
                    length: Math.random() * 150 + 50,
                    speed: Math.random() * 0.8 + 0.3
                });
            }

            function animate() {
                time += 0.01 * (speed / 30);
                
                // 1. Floating Motion (Sine waves)
                const swayX = Math.sin(time) * 20;
                const swayY = Math.cos(time * 0.5) * 15;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time * 0.9) * 10;
                
                // 3. Breathing/Canopy Flex
                const flex = Math.sin(time * 4) * 5;

                // Apply transforms
                // Base position (Center Right) + Mouse Parallax + Sway
                const baseX = 750 + (mouseX * 50) + swayX;
                const baseY = 450 + (mouseY * 50) + swayY;
                
                parachuteGroup.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the connection point
                human.setAttribute('transform', `rotate(${swing}, 0, 120)`);

                // Flex the canopy shape slightly
                const topY = -290 + flex;
                const botY = -210 + (flex * 0.5);
                canopy.setAttribute('d', `M-130,-140 Q0,${topY} 130,-140 Q0,${botY} -130,-140 Z`);

                // Animate Wind Lines (Speed Cues)
                windPaths.forEach(w => {
                    w.x -= w.speed * (speed / 10) * 2; // Faster movement
                    if (w.x < -300) {
                        w.x = 1000; // Reset to right
                        w.y = Math.random() * 600 + 100; // Randomize height
                    }
                    
                    // Draw line moving left
                    w.el.setAttribute('d', `M${w.x},${w.y} L${w.x + w.length},${w.y}`);
                });

                // Shadow Logic
                // Shadow moves opposite to figure (relative to light source) and scales with height
                const shadowScale = 1 - (speed/200); 
                shadow.setAttribute('transform', `translate(${-swayX * 2}, ${-swayY * 2}) scale(${shadowScale})`);
                shadow.setAttribute('opacity', 0.2 + (speed/200));

                // Simulate Altitude Drop based on speed
                if (speed > 10) {
                    altitude -= (speed * 0.05);
                    if (altitude < 1000) altitude = 4500; // Reset loop
                }
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
