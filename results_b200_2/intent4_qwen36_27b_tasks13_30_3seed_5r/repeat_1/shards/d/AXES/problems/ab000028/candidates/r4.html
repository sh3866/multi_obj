<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Well | Descent Illustration</title>
<style>
    :root {
        --c-sky-top: #0B1120;
        --c-sky-bot: #334155;
        --c-rock-shadow: #020617;
        --c-rock-base: #1e293b;
        --c-rock-highlight: #334155;
        --c-accent: #F97316;
        --c-accent-glow: #fb923c;
        --c-text-main: #f8fafc;
        --c-text-muted: #64748b;
        --font-display: "Impact", "Arial Black", sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-sky-top);
        color: var(--c-text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }

    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, var(--c-sky-top) 0%, #111827 50%, #1e293b 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- UI OVERLAY --- */
    /* Reduced visual weight, integrated into negative space */
    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem;
        z-index: 10;
    }

    .header {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .tag {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--c-accent);
        opacity: 0.9;
    }

    h1 {
        font-family: var(--font-display);
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: rgba(255, 255, 255, 0.9);
        text-transform: uppercase;
        text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hud-footer {
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        pointer-events: auto;
    }

    .telemetry-panel {
        background: rgba(2, 6, 23, 0.7);
        backdrop-filter: blur(8px);
        border-left: 2px solid var(--c-accent);
        padding: 1rem 1.5rem;
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.5rem 1.5rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .t-label {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--c-text-muted);
    }

    .t-val {
        font-family: var(--font-mono);
        font-size: 0.9rem;
        font-weight: 700;
        color: white;
        text-align: right;
    }

</style>
</head>
<body>

    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 900">
            <defs>
                <!-- Sky Gradient -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0B1120" />
                    <stop offset="60%" stop-color="#1E293B" />
                    <stop offset="100%" stop-color="#475569" />
                </linearGradient>

                <!-- Canopy Gradient -->
                <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f97316" />
                    <stop offset="40%" stop-color="#ea580c" />
                    <stop offset="100%" stop-color="#7c2d12" />
                </linearGradient>

                <!-- Rim Light for Canopy -->
                <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
                    <stop offset="20%" stop-color="#fff" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                </linearGradient>

                <!-- Filter for Atmospheric Haze -->
                <filter id="blurHaze">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                
                <filter id="dropShadow">
                    <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6" />
                </filter>
            </defs>

            <!-- 1. Background: Distant Mountains (Depth) -->
            <g id="distant-landscape" opacity="0.4">
                <path d="M0,900 L0,500 L200,400 L500,600 L800,350 L1100,550 L1600,400 L1600,900 Z" fill="#0f172a" />
                <path d="M0,900 L0,600 L300,500 L700,700 L1000,450 L1600,650 L1600,900 Z" fill="#1e293b" />
            </g>

            <!-- 2. The Dominant Cliff (Left Foreground) -->
            <!-- Replaces sidebar with jagged geological mass -->
            <g id="cliff-group">
                <!-- Base Rock -->
                <path d="M-100,-100 L250,-100 L350,100 L280,220 L450,450 L320,600 L500,850 L380,1000 L-100,1000 Z" 
                      fill="#0f172a" />
                
                <!-- Shadow Side (Left) -->
                <path d="M-100,-100 L250,-100 L350,100 L280,220 L450,450 L320,600 L500,850 L380,1000 L-100,1000 Z" 
                      fill="url(#skyGrad)" opacity="0.3" />

                <!-- Geological Strata (Layers) -->
                <g stroke="#020617" stroke-width="4" fill="none" opacity="0.6">
                    <path d="M-100,150 L350,100 L330,150" stroke-width="2" />
                    <path d="M-100,300 L280,220 L260,280" stroke-width="3" />
                    <path d="M-100,550 L450,450 L420,520" stroke-width="5" />
                    <path d="M-100,800 L320,600 L300,700" stroke-width="6" />
                </g>

                <!-- Rock Texture / Facets (Editorial Style) -->
                <g fill="#1e293b" opacity="0.8">
                    <polygon points="250,-100 350,100 280,220" />
                    <polygon points="350,100 450,450 280,220" />
                    <polygon points="280,220 450,450 320,600" />
                </g>

                <!-- Rim Light on Edge (Danger/Highlight) -->
                <path d="M250,-100 L350,100 L280,220 L450,450 L320,600 L500,850 L380,1000" 
                      stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.6" />
                <path d="M250,-100 L350,100 L280,220 L450,450 L320,600 L500,850 L380,1000" 
                      stroke="#fff" stroke-width="1" fill="none" opacity="0.3" transform="translate(-3,-3)" />
            </g>

            <!-- 3. The Parachutist (Primary Focal Point) -->
            <!-- Positioned center-right, diagonal axis -->
            <g id="parachutist" transform="translate(900, 450)">
                
                <!-- Wind Streaks (Motion Cues) -->
                <g id="wind-lines" stroke="#cbd5e1" stroke-linecap="round" opacity="0.4"></g>

                <!-- Suspension Lines -->
                <g id="lines" stroke="#e2e8f0" stroke-width="1" fill="none">
                    <!-- Left Side -->
                    <path d="M-160,-180 L-5,160" />
                    <path d="M-120,-180 L-2,160" />
                    <path d="M-80,-180 L0,160" />
                    <path d="M-40,-180 L2,160" />
                    <!-- Right Side -->
                    <path d="M160,-180 L5,160" />
                    <path d="M120,-180 L2,160" />
                    <path d="M80,-180 L0,160" />
                    <path d="M40,-180 L-2,160" />
                </g>

                <!-- The Canopy -->
                <g id="canopy-group" filter="url(#dropShadow)">
                    <!-- Main Inflated Shape -->
                    <path id="canopy-shape" d="M-180,-180 Q0,-380 180,-180 Q0,-240 -180,-180 Z" fill="url(#canopyGrad)" />
                    
                    <!-- Canopy Cells (Geometry) -->
                    <g stroke="#7c2d12" stroke-width="1.5" fill="none" opacity="0.5">
                        <path d="M-180,-180 Q-90,-300 0,-260 Q90,-300 180,-180" />
                        <path d="M-140,-180 Q-70,-320 0,-280 Q70,-320 140,-180" />
                        <!-- Vertical Ribs -->
                        <path d="M-180,-180 L-90,-260" />
                        <path d="M180,-180 L90,-260" />
                        <path d="M-140,-180 L-70,-280" />
                        <path d="M140,-180 L70,-280" />
                        <path d="M0,-180 L0,-340" />
                    </g>
                    
                    <!-- Rim Light -->
                    <path d="M-180,-180 Q0,-380 180,-180" fill="none" stroke="url(#rimLight)" stroke-width="4" />
                </g>

                <!-- The Human Figure -->
                <g id="human">
                    <!-- Backpack / Rig -->
                    <rect x="-10" y="150" width="20" height="35" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
                    
                    <!-- Torso -->
                    <path d="M0,160 L-8,230 L8,230 Z" fill="#020617" />
                    
                    <!-- Limbs (Dynamic Pose) -->
                    <g stroke="#020617" stroke-width="7" stroke-linecap="round" fill="none">
                        <!-- Legs (Braced) -->
                        <path d="M-8,230 L-20,270 L-10,290" /> 
                        <path d="M8,230 L25,265 L15,295" />
                        
                        <!-- Arms (Holding toggles) -->
                        <path d="M-5,165 L-40,190 L-35,205" /> 
                        <path d="M5,165 L40,190 L35,205" />
                    </g>

                    <!-- Helmet -->
                    <circle cx="0" cy="150" r="10" fill="#cbd5e1" />
                    <path d="M-6,150 Q0,140 6,150" fill="#fff" opacity="0.8" />
                </g>
            </g>
        </svg>

        <!-- UI Overlay -->
        <div class="ui-overlay">
            <div class="header">
                <div class="tag">Extraction Protocol</div>
                <h1>Gravity<br>Well.</h1>
            </div>

            <div class="hud-footer">
                <div class="telemetry-panel">
                    <span class="t-label">Altitude</span>
                    <span class="t-val" id="alt-val">4,200 ft</span>

                    <span class="t-label">Wind</span>
                    <span class="t-val" id="wind-val">24 mph</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachuteGroup = document.getElementById('parachutist');
            const canopyShape = document.getElementById('canopy-shape');
            const human = document.getElementById('human');
            const windLinesGroup = document.getElementById('wind-lines');
            
            const altVal = document.getElementById('alt-val');
            const windVal = document.getElementById('wind-val');
            
            let time = 0;
            let altitude = 4200;

            // Mouse interaction for parallax
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;
            });

            // Generate wind lines
            const windPaths = [];
            const lineCount = 30; 
            for(let i=0; i<lineCount; i++) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const opacity = Math.random() * 0.5 + 0.1;
                const width = Math.random() * 2 + 0.5;
                path.setAttribute("stroke", `rgba(255,255,255,${opacity})`);
                path.setAttribute("stroke-width", width);
                windLinesGroup.appendChild(path);
                
                windPaths.push({
                    el: path,
                    x: Math.random() * 1400 + 100, 
                    y: Math.random() * 900,
                    length: Math.random() * 300 + 100,
                    speed: Math.random() * 2 + 1
                });
            }

            function animate() {
                time += 0.02;
                
                // 1. Floating Motion (Sine waves)
                const swayX = Math.sin(time) * 40;
                const swayY = Math.cos(time * 0.8) * 25;
                
                // 2. Pendulum Physics (Human swings)
                const swing = Math.sin(time * 1.1) * 15;
                
                // 3. Breathing/Canopy Flex
                const flex = Math.sin(time * 3) * 10;

                // Apply transforms
                // Base position (Center Right) + Mouse Parallax + Sway
                const baseX = 900 + (mouseX * 50) + swayX;
                const baseY = 450 + (mouseY * 50) + swayY;
                
                parachuteGroup.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure
                human.setAttribute('transform', `rotate(${swing}, 0, 160)`);

                // Flex the canopy shape
                const topY = -380 + flex;
                const botY = -240 + (flex * 0.5);
                canopyShape.setAttribute('d', `M-180,-180 Q0,${topY} 180,-180 Q0,${botY} -180,-180 Z`);

                // Animate Wind Lines
                windPaths.forEach(w => {
                    w.x -= w.speed * 2; 
                    if (w.x < -500) {
                        w.x = 1500; 
                        w.y = Math.random() * 900; 
                    }
                    
                    // Draw line moving left
                    w.el.setAttribute('d', `M${w.x},${w.y} L${w.x + w.length},${w.y}`);
                });

                // Simulate Altitude Drop
                altitude -= 1.5;
                if (altitude < 1000) altitude = 4500; 
                altVal.innerText = Math.floor(altitude).toLocaleString() + ' ft';

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
