<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Altitude Descent | Editorial Illustration</title>
<style>
    :root {
        --c-sky-top: #020617;
        --c-sky-bot: #334155;
        --c-rock-face: #0f172a;
        --c-rock-accents: #1e293b;
        --c-accent: #f97316;
        --c-accent-bright: #fdba74;
        --c-text-main: #f8fafc;
        --c-text-muted: #94a3b8;
        --font-display: "Arial Black", "Impact", "Helvetica Neue", sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-sky-top);
        color: var(--c-text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }

    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        /* Editorial Illustration Style Gradient */
        background: linear-gradient(to bottom, var(--c-sky-top) 0%, #1e293b 60%, #475569 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
        /* Crisp edges for vector illustration feel */
        shape-rendering: geometricPrecision; 
    }

    /* --- UI OVERLAY --- */
    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 3rem;
        z-index: 10;
    }

    /* Header - Top Left, Smaller Scale per Critique */
    .header {
        pointer-events: auto;
        max-width: 400px;
    }

    .tag {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--c-accent);
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .tag::before {
        content: '';
        display: block;
        width: 20px;
        height: 2px;
        background: var(--c-accent);
    }

    h1 {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 5vw, 4.5rem); /* Reduced scale */
        line-height: 0.9;
        letter-spacing: -0.03em;
        color: white;
        text-transform: uppercase;
        margin-bottom: 1rem;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    p.lead {
        font-size: 0.9rem;
        line-height: 1.5;
        color: rgba(255,255,255,0.8);
        max-width: 280px;
        border-left: 2px solid var(--c-accent);
        padding-left: 1rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Footer / HUD - Bottom Right, Grid Aligned per Critique */
    .hud-footer {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        gap: 3rem;
        pointer-events: auto;
    }

    .telemetry-grid {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.5rem 2rem;
        text-align: right;
        background: rgba(2, 6, 23, 0.6);
        padding: 1rem 1.5rem;
        border: 1px solid rgba(255,255,255,0.1);
        border-right: 3px solid var(--c-accent);
        backdrop-filter: blur(4px);
    }

    .telemetry-label {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--c-text-muted);
        align-self: center;
    }

    .telemetry-value {
        font-family: var(--font-mono);
        font-size: 1.1rem;
        font-weight: 700;
        color: white;
        align-self: center;
    }

    .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: var(--c-accent);
        border-radius: 50%;
        margin-right: 8px;
        box-shadow: 0 0 10px var(--c-accent);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
    }

</style>
</head>
<body>

    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 900">
            <defs>
                <!-- Gradients -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="60%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#334155" />
                </linearGradient>

                <linearGradient id="cliffFaceGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>

                <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f97316" />
                    <stop offset="50%" stop-color="#ea580c" />
                    <stop offset="100%" stop-color="#9a3412" />
                </linearGradient>

                <!-- Filters -->
                <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000" flood-opacity="0.7" />
                </filter>

                <!-- Cliff Texture Pattern -->
                <pattern id="rockTexture" width="100" height="100" patternUnits="userSpaceOnUse">
                    <path d="M0,100 L50,50 L100,100 Z" fill="none" stroke="#000" stroke-width="1" opacity="0.3"/>
                    <path d="M-20,20 L120,20 L120,40 L-20,40 Z" fill="#000" opacity="0.2"/>
                </pattern>
            </defs>

            <!-- 1. Background: Sky -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />

            <!-- 2. Distant Landscape (Depth) -->
            <g id="distant-mountains" opacity="0.6">
                <!-- Layer 1: Far -->
                <path d="M0,900 L0,550 L300,450 L600,600 L900,400 L1200,550 L1600,450 L1600,900 Z" fill="#0f172a" />
                <!-- Layer 2: Mid -->
                <path d="M0,900 L0,650 L400,550 L800,700 L1100,500 L1600,600 L1600,900 Z" fill="#1e293b" />
            </g>

            <!-- 3. The Dominant Cliff (Left) -->
            <g id="cliff-group">
                <!-- Main Faceted Shape -->
                <path d="M-100,-100 L350,-100 L450,150 L380,280 L520,400 L420,550 L600,700 L480,900 L-100,900 Z" 
                      fill="url(#cliffFaceGrad)" />
                
                <!-- Texture Overlay -->
                <path d="M-100,-100 L350,-100 L450,150 L380,280 L520,400 L420,550 L600,700 L480,900 L-100,900 Z" 
                      fill="url(#rockTexture)" />

                <!-- Geological Strata (Visible Layers) -->
                <g opacity="0.8">
                    <path d="M-100,100 L450,150 L400,180 L-100,130 Z" fill="#020617" />
                    <path d="M-100,300 L380,280 L350,320 L-100,330 Z" fill="#020617" />
                    <path d="M-100,500 L520,400 L480,450 L-100,550 Z" fill="#020617" />
                    <path d="M-100,700 L420,550 L380,600 L-100,750 Z" fill="#020617" />
                    <path d="M-100,900 L600,700 L550,750 L-100,900 Z" fill="#020617" />
                </g>

                <!-- Leading Edge Highlight (The "Edge" of danger) -->
                <path d="M350,-100 L450,150 L380,280 L520,400 L420,550 L600,700 L480,900" 
                      stroke="#475569" stroke-width="3" fill="none" />
                <path d="M350,-100 L450,150 L380,280 L520,400 L420,550 L600,700 L480,900" 
                      stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.5" transform="translate(-2, -2)" />
            </g>

            <!-- 4. Parachutist Group (Center Stage) -->
            <!-- Positioned closer to cliff edge -->
            <g id="parachutist" transform="translate(850, 450)">
                
                <!-- Wind Lines (Motion Cues) -->
                <g id="wind-lines"></g>

                <!-- Taut Harness Lines (Geometric Precision) -->
                <g id="lines" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.8">
                    <!-- Converging lines -->
                    <path d="M-120,-160 L0,130 L120,-160" />
                    <path d="M-90,-160 L0,130 L90,-160" />
                    <path d="M-60,-160 L0,130 L60,-160" />
                    <path d="M-30,-160 L0,130 L30,-160" />
                    <path d="M0,-160 L0,130" />
                </g>

                <!-- The Canopy (Voluminous, Billowing) -->
                <g id="canopy-group" filter="url(#heavyShadow)">
                    <!-- Main Shape -->
                    <path id="canopy" d="M-140,-160 Q0,-320 140,-160 Q0,-230 -140,-160 Z" fill="url(#canopyGrad)" />
                    
                    <!-- Internal Geometry (Cells) -->
                    <g stroke="#7c2d12" stroke-width="2" fill="none" opacity="0.4">
                        <!-- Arcs -->
                        <path d="M-140,-160 Q-70,-250 0,-210 Q70,-250 140,-160" />
                        <path d="M-100,-160 Q-50,-280 0,-240 Q50,-280 100,-160" />
                        <path d="M-60,-160 Q-30,-310 0,-260 Q30,-310 60,-160" />
                        <!-- Vertical Ribs -->
                        <path d="M-140,-160 L-70,-210" />
                        <path d="M140,-160 L70,-210" />
                        <path d="M-100,-160 L-50,-240" />
                        <path d="M100,-160 L50,-240" />
                        <path d="M-60,-160 L-30,-260" />
                        <path d="M60,-160 L30,-260" />
                        <path d="M0,-160 L0,-280" />
                    </g>
                </g>

                <!-- The Human Figure (Dynamic Silhouette) -->
                <g id="human">
                    <!-- Backpack/Rig -->
                    <rect x="-12" y="110" width="24" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
                    
                    <!-- Body (Solid Silhouette) -->
                    <path d="M0,130 L-12,190 L12,190 Z" fill="#020617" />
                    
                    <!-- Limbs (Expressive, Tension) -->
                    <g stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <!-- Legs (Braced against wind) -->
                        <path d="M-12,190 L-25,230 L-15,250" /> 
                        <path d="M12,190 L30,220 L20,245" />
                        
                        <!-- Arms (Holding toggles, extended) -->
                        <path d="M-8,135 L-40,160 L-35,175" /> 
                        <path d="M8,135 L40,160 L35,175" />
                    </g>

                    <!-- Helmet (Reflective) -->
                    <circle cx="0" cy="122" r="12" fill="#cbd5e1" />
                    <path d="M-8,122 Q0,110 8,122" fill="#f8fafc" opacity="0.8" />
                </g>
            </g>
        </svg>

        <!-- UI Overlay -->
        <div class="ui-overlay">
            <div class="header">
                <div class="tag">Alpine Extraction</div>
                <h1>Gravity<br>Well.</h1>
                <p class="lead">
                    Geological permanence vs. human fragility.
                </p>
            </div>

            <div class="hud-footer">
                <div class="telemetry-grid">
                    <span class="telemetry-label">Altitude</span>
                    <span class="telemetry-value" id="alt-val">4,200 <span style="font-size:0.6em; color:var(--c-text-muted)">ft</span></span>

                    <span class="telemetry-label">Wind Speed</span>
                    <span class="telemetry-value" id="wind-val">24 <span style="font-size:0.6em; color:var(--c-text-muted)">mph</span></span>

                    <span class="telemetry-label">Status</span>
                    <span class="telemetry-value" style="color:var(--c-accent);"><span class="status-indicator"></span>NOMINAL</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachuteGroup = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const windLinesGroup = document.getElementById('wind-lines');
            
            const altVal = document.getElementById('alt-val');
            const windVal = document.getElementById('wind-val');
            
            let time = 0;
            let speed = 30; // Base speed
            let altitude = 4200;

            // Mouse interaction for parallax
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;
            });

            // Generate wind lines
            const windPaths = [];
            const lineCount = 25; // More lines for better density
            for(let i=0; i<lineCount; i++) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const opacity = Math.random() * 0.4 + 0.1;
                const width = Math.random() * 2 + 1;
                path.setAttribute("stroke", `rgba(255,255,255,${opacity})`);
                path.setAttribute("stroke-width", width);
                path.setAttribute("stroke-linecap", "round");
                windLinesGroup.appendChild(path);
                
                windPaths.push({
                    el: path,
                    x: Math.random() * 1200 + 200, 
                    y: Math.random() * 800 + 50,
                    length: Math.random() * 200 + 100,
                    speed: Math.random() * 1.5 + 0.5
                });
            }

            function animate() {
                time += 0.015 * (speed / 30);
                
                // 1. Floating Motion (Sine waves)
                const swayX = Math.sin(time) * 30;
                const swayY = Math.cos(time * 0.7) * 20;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time * 0.9) * 12;
                
                // 3. Breathing/Canopy Flex
                const flex = Math.sin(time * 4) * 8;

                // Apply transforms
                // Base position (Closer to cliff edge: 850) + Mouse Parallax + Sway
                const baseX = 850 + (mouseX * 40) + swayX;
                const baseY = 450 + (mouseY * 40) + swayY;
                
                parachuteGroup.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the connection point
                human.setAttribute('transform', `rotate(${swing}, 0, 130)`);

                // Flex the canopy shape slightly (Billowing effect)
                const topY = -320 + flex;
                const botY = -230 + (flex * 0.6);
                canopy.setAttribute('d', `M-140,-160 Q0,${topY} 140,-160 Q0,${botY} -140,-160 Z`);

                // Animate Wind Lines (Speed Cues)
                windPaths.forEach(w => {
                    w.x -= w.speed * (speed / 15) * 3; // Faster movement
                    if (w.x < -400) {
                        w.x = 1400; // Reset to right
                        w.y = Math.random() * 800 + 50; // Randomize height
                    }
                    
                    // Draw line moving left
                    w.el.setAttribute('d', `M${w.x},${w.y} L${w.x + w.length},${w.y}`);
                });

                // Simulate Altitude Drop based on speed
                if (speed > 5) {
                    altitude -= (speed * 0.08);
                    if (altitude < 1000) altitude = 4500; // Reset loop
                }
                altVal.innerHTML = Math.floor(altitude).toLocaleString() + ' <span style="font-size:0.6em; color:var(--c-text-muted)">ft</span>';

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
