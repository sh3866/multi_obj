<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Well | Descent Illustration</title>
<style>
    :root {
        --c-bg-top: #02040a;
        --c-bg-bot: #1e293b;
        --c-cliff-dark: #050914;
        --c-cliff-light: #1e293b;
        --c-cliff-rip: #334155;
        --c-accent: #f97316;
        --c-accent-glow: #fb923c;
        --c-text: #f8fafc;
        --c-text-dim: #64748b;
        --font-display: "Arial Black", "Helvetica Neue", sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-bg-top);
        color: var(--c-text);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .scene-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* SVG Styling */
    svg.scene {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- UI OVERLAY SYSTEM --- */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        padding: clamp(1.5rem, 4vw, 3rem);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Header: Sharp, Geometric, Editorial */
    .header {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        mix-blend-mode: screen;
    }

    .tag {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: var(--c-accent);
        text-transform: uppercase;
        opacity: 0.9;
    }

    h1 {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 5vw, 4.5rem);
        line-height: 0.85;
        letter-spacing: -0.03em;
        color: rgba(255, 255, 255, 0.95);
        text-transform: uppercase;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        font-weight: 800;
    }

    /* HUD: Connected, Technical, Polished */
    .hud-container {
        position: absolute;
        bottom: clamp(1.5rem, 4vw, 3rem);
        right: clamp(1.5rem, 4vw, 3rem);
        display: flex;
        align-items: flex-end;
        gap: 2rem;
    }

    .telemetry {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border-top: 3px solid var(--c-accent);
        border-right: 1px solid rgba(255,255,255,0.1);
        padding: 1.25rem;
        display: grid;
        grid-template-columns: max-content max-content;
        gap: 0.75rem 1.5rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        min-width: 240px;
    }

    .hud-row {
        display: contents;
    }

    .t-label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--c-text-dim);
        text-align: right;
    }

    .t-val {
        font-family: var(--font-mono);
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--c-text);
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    /* Connecting Line Graphic (SVG overlay) */
    .hud-link {
        position: absolute;
        bottom: clamp(4.5rem, 10vw, 8rem);
        right: calc(clamp(1.5rem, 4vw, 3rem) + 240px); /* Offset by panel width approx */
        height: 150px;
        width: 100px;
        pointer-events: none;
    }

</style>
</head>
<body>

    <div class="scene-wrapper">
        <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Atmospheric Sky Gradient -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#02040a" />
                    <stop offset="50%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#334155" />
                </linearGradient>

                <!-- Distant Mountain Gradient (Atmospheric Depth) -->
                <linearGradient id="mountGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#0f172a" />
                </linearGradient>

                <!-- Cliff Strata Gradient -->
                <linearGradient id="cliffGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>

                <!-- Canopy Gradient (Warm Light Source) -->
                <radialGradient id="canopyGrad" cx="0.5" cy="0.5" r="0.6">
                    <stop offset="0%" stop-color="#fb923c" />
                    <stop offset="60%" stop-color="#ea580c" />
                    <stop offset="100%" stop-color="#7c2d12" />
                </radialGradient>

                <!-- Orange Glow Filter -->
                <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="25" result="blur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="1.5"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <!-- 1. Background: Sky & Distant Landscape -->
            <rect width="1600" height="900" fill="url(#skyGrad)" />
            
            <g id="distant-mountains" opacity="0.6">
                <!-- Far Peaks -->
                <path d="M0,900 L0,550 L250,450 L500,600 L800,400 L1100,550 L1400,350 L1600,450 L1600,900 Z" 
                      fill="#1e293b" stroke="#334155" stroke-width="1" />
                <!-- Near Peaks (Hazy) -->
                <path d="M0,900 L0,650 L300,500 L600,700 L900,500 L1200,650 L1600,500 L1600,900 Z" 
                      fill="#0f172a" opacity="0.8" />
            </g>

            <!-- 2. The Dominant Cliff (Left Foreground) -->
            <!-- Heavy, jagged geometry with clear rock layers -->
            <g id="cliff-structure">
                <!-- Main Mass -->
                <path d="M-50,-50 L350,-50 L350,150 L280,250 L420,450 L300,650 L480,950 L-50,950 Z" 
                      fill="url(#cliffGrad)" />
                
                <!-- Strata / Rock Layers (Horizontal cuts) -->
                <g stroke="#020617" stroke-linecap="square" opacity="0.8">
                    <path d="M-50,150 L350,150" stroke-width="4" />
                    <path d="M280,250 L350,250" stroke-width="4" />
                    <path d="M-50,450 L420,450" stroke-width="6" />
                    <path d="M300,650 L380,650" stroke-width="6" />
                    <path d="M-50,850 L480,850" stroke-width="8" />
                </g>

                <!-- Textured Facets (Light & Shadow) -->
                <g opacity="0.5">
                    <polygon points="350,-50 280,250 350,250" fill="#334155" />
                    <polygon points="420,450 300,650 400,650" fill="#0f172a" />
                    <polygon points="300,650 480,950 350,950" fill="#334155" />
                </g>

                <!-- Dynamic Rim Light on Cliff Edge (Contrast) -->
                <path d="M350,-50 L350,150 L280,250 L420,450 L300,650 L480,950" 
                      stroke="#cbd5e1" stroke-width="3" fill="none" opacity="0.4" />
            </g>

            <!-- 3. The Parachutist (Center Stage, Diagonal Axis) -->
            <g id="parachutist-system" transform="translate(950, 400)">
                
                <!-- Wind Streaks (Speed Lines) -->
                <g id="wind-layer" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
                    <!-- Generated via JS -->
                </g>

                <!-- Connection Line to HUD (Visual Hierarchy) -->
                <path id="hud-connector" d="M0,350 L400,200" stroke="#f97316" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.5" />

                <!-- Suspension Lines -->
                <g id="lines" stroke="#e2e8f0" stroke-width="1.5" fill="none" opacity="0.9">
                    <!-- Left -->
                    <path d="M-140,-160 L-5,200" />
                    <path d="M-100,-160 L-2,200" />
                    <path d="M-60,-160 L0,200" />
                    <!-- Right -->
                    <path d="M140,-160 L5,200" />
                    <path d="M100,-160 L2,200" />
                    <path d="M60,-160 L0,200" />
                </g>

                <!-- The Canopy (High Contrast, Glowing) -->
                <g id="canopy-group" filter="url(#orangeGlow)">
                    <!-- Main Shape -->
                    <path id="canopy-shape" d="M-160,-160 Q0,-360 160,-160 Q0,-220 -160,-160 Z" fill="url(#canopyGrad)" />
                    
                    <!-- Canopy Cells (Volume) -->
                    <g stroke="#9a3412" stroke-width="2" fill="none" opacity="0.6">
                        <path d="M-160,-160 Q-80,-300 0,-260 Q80,-300 160,-160" />
                        <path d="M-120,-160 Q-60,-320 0,-280 Q60,-320 120,-160" />
                        <path d="M-80,-160 Q-40,-330 0,-290 Q40,-330 80,-160" />
                    </g>
                </g>

                <!-- The Human Figure (Solid Silhouette, Strain) -->
                <g id="human-figure">
                    <!-- Harness/Backpack -->
                    <rect x="-12" y="180" width="24" height="40" rx="4" fill="#020617" stroke="#f97316" stroke-width="1" />
                    
                    <!-- Body -->
                    <path d="M0,190 L-10,260 L10,260 Z" fill="#0f172a" />
                    
                    <!-- Limbs (Action Pose) -->
                    <g stroke="#0f172a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <!-- Legs (Bracing against wind) -->
                        <path d="M-8,260 L-25,310 L-15,340" />
                        <path d="M8,260 L20,305 L10,345" />
                        <!-- Arms (Reaching/Control) -->
                        <path d="M-5,195 L-45,220 L-50,240" />
                        <path d="M5,195 L50,215 L55,235" />
                    </g>

                    <!-- Helmet (Highlight) -->
                    <circle cx="0" cy="180" r="11" fill="#cbd5e1" />
                    <path d="M-6,180 Q0,170 6,180" fill="#fff" opacity="0.9" />
                </g>
            </g>
        </svg>

        <!-- UI Overlay -->
        <div class="ui-layer">
            <div class="header">
                <div class="tag">Extraction Protocol // Active</div>
                <h1>Gravity<br>Well.</h1>
            </div>

            <div class="hud-container">
                <!-- Visual Link -->
                <svg class="hud-link" viewBox="0 0 100 150" preserveAspectRatio="none">
                    <line x1="0" y1="150" x2="100" y2="0" stroke="#f97316" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
                    <circle cx="100" cy="0" r="4" fill="#f97316" />
                </svg>

                <div class="telemetry">
                    <div class="hud-row">
                        <span class="t-label">Altitude</span>
                        <span class="t-val" id="alt-val">4,200 ft</span>
                    </div>
                    <div class="hud-row">
                        <span class="t-label">Descent Rate</span>
                        <span class="t-val" id="rate-val">1,800 fpm</span>
                    </div>
                    <div class="hud-row">
                        <span class="t-label">Wind Shear</span>
                        <span class="t-val" id="wind-val">24 mph</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const system = document.getElementById('parachutist-system');
            const canopyShape = document.getElementById('canopy-shape');
            const humanFigure = document.getElementById('human-figure');
            const windLayer = document.getElementById('wind-layer');
            const hudConnector = document.getElementById('hud-connector');
            
            const altVal = document.getElementById('alt-val');
            const rateVal = document.getElementById('rate-val');
            const windVal = document.getElementById('wind-val');
            
            let time = 0;
            let altitude = 4200;
            let windSpeed = 24;

            // Mouse Parallax State
            const wrapper = document.querySelector('.scene-wrapper');
            let mouseX = 0;
            let mouseY = 0;

            wrapper.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) - 0.5;
                mouseY = (e.clientY / window.innerHeight) - 0.5;
            });

            // Generate Wind Lines
            const windPaths = [];
            const lineCount = 40; 
            for(let i=0; i<lineCount; i++) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                windLayer.appendChild(path);
                windPaths.push({
                    el: path,
                    x: Math.random() * 2000, 
                    y: Math.random() * 1200,
                    length: Math.random() * 400 + 150,
                    speed: Math.random() * 15 + 10, // Faster for action feel
                    opacity: Math.random() * 0.4 + 0.1
                });
            }

            function animate() {
                time += 0.015;
                
                // 1. Floating/Swaying Motion (The "Descent" feel)
                // Sway is larger to show wind resistance
                const swayX = Math.sin(time * 0.8) * 50; 
                const swayY = Math.cos(time * 0.6) * 30;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swingAngle = Math.sin(time * 0.8) * 8;
                
                // 3. Canopy Flex (Breathing)
                const flex = Math.sin(time * 4) * 15;

                // Apply Transforms
                // Base Position + Parallax + Sway
                const baseX = 950 + (mouseX * 60) + swayX;
                const baseY = 400 + (mouseY * 40) + swayY;
                
                system.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing Human
                humanFigure.setAttribute('transform', `rotate(${swingAngle}, 0, 200)`);

                // Flex Canopy
                // Changing the bezier control points to simulate air pressure
                const topControl = -360 + flex;
                const botControl = -220 + (flex * 0.6);
                canopyShape.setAttribute('d', `M-160,-160 Q0,${topControl} 160,-160 Q0,${botControl} -160,-160 Z`);

                // Update HUD Connector Line to track human position
                // We need to calculate the world position of the human relative to the SVG
                // Approximate math for visual effect:
                const humanWorldX = baseX;
                const humanWorldY = baseY + 200; // Feet position
                const hudTargetX = window.innerWidth - 150; // Approx right side
                const hudTargetY = window.innerHeight - 150;
                
                // Map screen coords to SVG viewBox coords (approximate 1600x900)
                const svgW = 1600;
                const svgH = 900;
                const scaleX = svgW / window.innerWidth;
                const scaleY = svgH / window.innerHeight;

                const connStartX = 0; // Relative to system group
                const connStartY = 350; // Relative to system group
                
                // We draw a dashed line from the human feet towards the HUD area
                // Since the human moves, the line start moves. The end is fixed in screen space.
                // Actually, simpler: Draw line from Human (0, 350) to a fixed point in the group's coordinate space?
                // No, the HUD is HTML. Let's just draw a line pointing generally "down-right" from the human.
                hudConnector.setAttribute('d', `M0,350 L${300 + (mouseX*100)},${200 + (mouseY*100)}`);

                // Animate Wind Lines (Fast streaks)
                windPaths.forEach(w => {
                    w.x -= w.speed; 
                    if (w.x < -1000) {
                        w.x = 2000; 
                        w.y = Math.random() * 1200; 
                    }
                    
                    // Draw line
                    w.el.setAttribute('d', `M${w.x},${w.y} L${w.x + w.length},${w.y}`);
                    w.el.setAttribute('opacity', w.opacity);
                });

                // Simulate Data
                altitude -= 2.5;
                if (altitude < 1200) altitude = 4500; 
                altVal.innerText = Math.floor(altitude).toLocaleString() + ' ft';
                
                // Fluctuating wind
                windSpeed = 24 + Math.sin(time * 2) * 5;
                windVal.innerText = Math.floor(windSpeed) + ' mph';

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
