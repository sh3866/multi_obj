<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            --c-sky-top: #29B6F6;
            --c-sky-bot: #E1F5FE;
            --c-primary: #FF6F00;
            --c-primary-light: #FFA040;
            --c-accent: #0288D1;
            --c-dark: #263238;
            --c-white: #FFFFFF;
            --font-head: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
            background: #000;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 1fr auto;
        }

        /* CANVAS BACKGROUND */
        #world-canvas {
            grid-row: 1 / -1;
            grid-column: 1 / -1;
            z-index: 1;
        }

        /* UI LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            grid-row: 1 / -1;
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: auto 1fr auto;
            pointer-events: none;
        }

        /* HEADER */
        header {
            grid-column: 1 / -1;
            grid-row: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 40px 50px;
        }

        .brand {
            text-align: left;
            animation: title-drop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(-50px);
        }
        
        h1 {
            font-family: var(--font-head);
            font-size: 5rem;
            color: var(--c-white);
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -3px;
            text-shadow: 
                5px 5px 0px var(--c-primary),
                10px 10px 0px rgba(0,0,0,0.2);
            transform: skewX(-8deg);
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-family: var(--font-head);
            color: var(--c-accent);
            font-size: 1.5rem;
            background: var(--c-white);
            padding: 8px 25px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            transform: skewX(-8deg);
            border: 3px solid var(--c-dark);
            margin-left: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            animation: slide-in 0.8s 0.2s ease-out forwards;
            opacity: 0;
            transform: translateX(50px);
        }

        .stat-pill {
            background: var(--c-white);
            padding: 10px 25px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--c-dark);
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            border: 3px solid var(--c-dark);
            transform: rotate(3deg);
            transition: transform 0.2s;
        }
        .stat-pill:hover { transform: rotate(0deg) scale(1.05); }
        .stat-pill:nth-child(2) { transform: rotate(-3deg); }
        .stat-pill:nth-child(2):hover { transform: rotate(0deg) scale(1.05); }

        /* LEFT PANEL */
        .world-selector {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 0 50px;
            justify-content: center;
            pointer-events: auto;
        }

        .world-card {
            background: rgba(255,255,255,0.95);
            padding: 18px;
            border-radius: 20px;
            border: 4px solid var(--c-dark);
            box-shadow: 0 10px 0 rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: slide-in-left 0.6s ease-out forwards;
        }

        .world-card:nth-child(1) { animation-delay: 0.3s; }
        .world-card:nth-child(2) { animation-delay: 0.4s; }
        .world-card:nth-child(3) { animation-delay: 0.5s; }

        .world-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 0 rgba(0,0,0,0.15);
        }

        .world-card.active {
            background: var(--c-white);
            border-color: var(--c-primary);
            transform: scale(1.08);
            box-shadow: 0 12px 0 var(--c-primary);
            z-index: 2;
        }

        .world-card.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 8px;
            background: var(--c-primary);
        }

        .world-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--c-dark);
            flex-shrink: 0;
            position: relative;
        }
        .w1 .world-icon { background: #81C784; }
        .w2 .world-icon { background: #FFB74D; }
        .w3 .world-icon { background: #4DD0E1; }

        .world-info h3 { font-size: 1.2rem; color: var(--c-dark); line-height: 1; font-weight: 900; }
        .world-info p { font-size: 0.9rem; color: #666; margin-top: 4px; font-weight: 600; }

        /* CENTER STAGE */
        .center-stage {
            grid-column: 2;
            grid-row: 2 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 60px;
            pointer-events: none;
        }

        /* HERO CSS */
        .hero-container {
            width: 200px;
            height: 220px;
            position: relative;
            margin-bottom: 80px;
            animation: hero-bounce 1.5s infinite ease-in-out;
        }

        .hero-body {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle at 35% 35%, #FF8A65, var(--c-primary));
            border-radius: 50%;
            position: absolute;
            bottom: 30px;
            left: 20px;
            border: 5px solid var(--c-dark);
            box-shadow: inset -15px -15px 0 rgba(0,0,0,0.15);
            z-index: 2;
        }

        .hero-face {
            position: absolute;
            top: 40px;
            left: 35px;
            width: 90px;
            height: 50px;
            background: #FFF;
            border-radius: 50px 50px 20px 20px;
            border: 4px solid var(--c-dark);
            overflow: hidden;
        }
        
        .hero-eye {
            width: 16px;
            height: 24px;
            background: var(--c-dark);
            border-radius: 50%;
            position: absolute;
            top: 18px;
            animation: blink 4s infinite;
        }
        .hero-eye.left { left: 20px; }
        .hero-eye.right { right: 20px; }

        .hero-mouth {
            width: 40px;
            height: 20px;
            background: var(--c-dark);
            border-radius: 0 0 30px 30px;
            position: absolute;
            bottom: 10px;
            left: 25px;
        }

        .hero-spring {
            width: 80px;
            height: 60px;
            background: #90A4AE;
            position: absolute;
            bottom: 0;
            left: 60px;
            border-radius: 15px;
            border: 5px solid var(--c-dark);
            z-index: 1;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 12px,
                var(--c-dark) 12px,
                var(--c-dark) 16px
            );
        }

        .hero-shadow {
            width: 130px;
            height: 25px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            position: absolute;
            bottom: -20px;
            left: 35px;
            animation: shadow-scale 1.5s infinite ease-in-out;
        }

        /* BUTTON */
        .btn-start {
            pointer-events: auto;
            background: linear-gradient(180deg, var(--c-primary-light) 0%, var(--c-primary) 100%);
            color: var(--c-white);
            font-family: var(--font-head);
            font-size: 2.5rem;
            text-transform: uppercase;
            padding: 25px 90px;
            border: 5px solid var(--c-dark);
            border-radius: 70px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 
                0 12px 0 var(--c-dark),
                inset 0 8px 0 rgba(255,255,255,0.3);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            animation: btn-pulse 2s infinite, btn-pop 0.6s 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        .btn-start:active {
            transform: translateY(12px) !important;
            box-shadow: 0 0 0 var(--c-dark) !important;
        }

        .btn-start::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 60px 60px 0 0;
        }

        /* RIGHT PANEL */
        .controls-guide {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0 50px 50px 0;
            pointer-events: auto;
            opacity: 0;
            animation: slide-in-right 0.8s 0.6s ease-out forwards;
        }

        .key-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            gap: 8px;
        }
        .d-pad .key:nth-child(1) { grid-column: 2; }
        .d-pad .key:nth-child(2) { grid-column: 1; grid-row: 2; }
        .d-pad .key:nth-child(3) { grid-column: 2; grid-row: 2; }
        .d-pad .key:nth-child(4) { grid-column: 3; grid-row: 2; }

        .key {
            width: 60px;
            height: 60px;
            background: var(--c-white);
            border: 4px solid var(--c-dark);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.4rem;
            color: var(--c-dark);
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            font-family: var(--font-head);
        }

        .key.action {
            background: var(--c-accent);
            color: white;
            width: 90px;
            height: 70px;
            border-radius: 18px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .controls-text {
            color: var(--c-white);
            font-weight: 900;
            text-shadow: 3px 3px 0 var(--c-dark);
            font-size: 1rem;
            text-align: right;
            margin-top: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* FOOTER */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px 30px;
            color: var(--c-white);
            font-weight: 800;
            text-shadow: 2px 2px 0 var(--c-dark);
            font-size: 1.1rem;
        }

        /* ANIMATIONS */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            10% { transform: translateY(0) scale(1.1, 0.9); }
            50% { transform: translateY(-35px) scale(0.95, 1.05); }
            90% { transform: translateY(0) scale(1.1, 0.9); }
        }
        @keyframes shadow-scale {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(0.7); opacity: 0.1; }
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }
        @keyframes btn-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        @keyframes title-drop {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-in {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slide-in-left {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slide-in-right {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes btn-pop {
            to { opacity: 1; transform: scale(1); }
        }

        /* RESPONSIVE */
        @media (max-width: 1100px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto auto;
            }
            header { grid-row: 1; grid-column: 1; justify-content: center; padding: 20px; }
            .brand { text-align: center; }
            .stats-bar { display: none; }
            .world-selector {
                grid-row: 2; grid-column: 1;
                flex-direction: row;
                padding: 20px;
                justify-content: center;
            }
            .center-stage { grid-row: 2; grid-column: 1; padding-bottom: 100px; }
            .controls-guide { grid-row: 3; grid-column: 1; align-items: center; }
            footer { grid-row: 4; padding: 0 20px 20px; }
            h1 { font-size: 3rem; }
            .world-card { width: 100%; max-width: 250px; }
        }
    </style>
</head>
<body>

<div id="app">
    <canvas id="world-canvas"></canvas>

    <div class="ui-layer">
        <header>
            <div class="brand">
                <h1>Bouncy<br>& Bolt</h1>
                <div class="subtitle">The Great Spring Adventure</div>
            </div>
            <div class="stats-bar">
                <div class="stat-pill">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFD700">
                        <circle cx="12" cy="12" r="10" stroke="#F57F17" stroke-width="2"/>
                        <text x="12" y="16" text-anchor="middle" font-weight="bold" font-size="14" fill="#F57F17">$</text>
                    </svg>
                    <span>1,240</span>
                </div>
                <div class="stat-pill">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="#D32F2F">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span>5</span>
                </div>
            </div>
        </header>

        <aside class="world-selector">
            <div class="world-card w1 active">
                <div class="world-icon"></div>
                <div class="world-info">
                    <h3>Spring Valley</h3>
                    <p>Level 1-1</p>
                </div>
            </div>
            <div class="world-card w2">
                <div class="world-icon"></div>
                <div class="world-info">
                    <h3>Sand Springs</h3>
                    <p>Locked</p>
                </div>
            </div>
            <div class="world-card w3">
                <div class="world-icon"></div>
                <div class="world-info">
                    <h3>Cloud Peak</h3>
                    <p>Locked</p>
                </div>
            </div>
        </aside>

        <main class="center-stage">
            <div class="hero-container">
                <div class="hero-body">
                    <div class="hero-face">
                        <div class="hero-eye left"></div>
                        <div class="hero-eye right"></div>
                        <div class="hero-mouth"></div>
                    </div>
                </div>
                <div class="hero-spring"></div>
                <div class="hero-shadow"></div>
            </div>
            <button class="btn-start">Start Adventure</button>
        </main>

        <aside class="controls-guide">
            <div class="key-group">
                <div class="d-pad">
                    <div class="key">W</div>
                    <div class="key">A</div>
                    <div class="key">S</div>
                    <div class="key">D</div>
                </div>
            </div>
            <div class="key-group">
                <div class="key action">SPACE</div>
                <div class="controls-text">Jump to Bounce!</div>
            </div>
        </aside>

        <footer>
            <div>© 2023 Bouncy Games</div>
            <div>Press ENTER to Start</div>
        </footer>
    </div>
</div>

<script>
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Colors
    const C_SKY_TOP = '#29B6F6';
    const C_SKY_BOT = '#E1F5FE';
    const C_GROUND = '#5D4037';
    const C_GRASS = '#7CB342';
    const C_GRASS_LIGHT = '#AED581';
    const C_MOUNTAIN = '#90A4AE';
    const C_MOUNTAIN_FAR = '#B0BEC5';

    // Helpers
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawBlock(x, y, size) {
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = '#A1887F';
        ctx.fillRect(x, y, size, 6);
        ctx.fillRect(x, y, 6, size);
        ctx.fillStyle = '#4E342E';
        ctx.fillRect(x, y + size - 6, size, 6);
        ctx.fillRect(x + size - 6, y, 6, size);
        ctx.fillStyle = '#3E2723';
        ctx.font = 'bold ' + (size/2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 3);
    }

    function drawGoldBlock(x, y, size, offset) {
        ctx.fillStyle = '#FFCA28';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = '#FFF59D';
        ctx.fillRect(x, y, size, 6);
        ctx.fillRect(x, y, 6, size);
        ctx.fillStyle = '#FF8F00';
        ctx.fillRect(x, y + size - 6, size, 6);
        ctx.fillRect(x + size - 6, y, 6, size);
        const pulse = Math.sin((frame + offset) * 0.1) * 0.2 + 0.8;
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold ' + (size/1.8) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 3);
    }

    function drawGround(y, h) {
        ctx.fillStyle = C_GROUND;
        ctx.fillRect(0, y, width, h);
        ctx.fillStyle = C_GRASS;
        ctx.fillRect(0, y, width, 25);
        ctx.fillStyle = C_GRASS_LIGHT;
        for(let i=0; i<width; i+=50) {
            ctx.fillRect(i, y, 25, 8);
        }
    }

    function drawCloud(x, y, scale) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(x, y, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 30 * scale, y - 15 * scale, 40 * scale, 0, Math.PI * 2);
        ctx.arc(x + 60 * scale, y, 35 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 3;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 6, 4, 12);
    }

    function drawFlag(x, y, h) {
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 8, h);
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(x+4, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+8, y+15);
        ctx.lineTo(x+70, y+35);
        ctx.lineTo(x+8, y+55);
        ctx.fill();
    }

    // Particles
    const particles = [];
    function spawnParticle() {
        if(Math.random() > 0.05) return;
        particles.push({
            x: Math.random() * width,
            y: height - 100,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            life: 100,
            color: Math.random() > 0.5 ? '#FFF' : '#FFD700'
        });
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    const clouds = [
        {x: 100, y: 150, s: 1},
        {x: 400, y: 100, s: 0.8},
        {x: 800, y: 180, s: 1.2},
        {x: 1100, y: 120, s: 0.9}
    ];

    const platforms = [
        {x: -50, y: 0, w: 450, h: 120},
        {x: 500, y: 60, w: 250, h: 60},
        {x: 800, y: -30, w: 350, h: 150},
        {x: 1200, y: 30, w: 250, h: 90}
    ];

    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        const groundY = height - 180;

        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Far Mountains
        ctx.fillStyle = C_MOUNTAIN_FAR;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 250);
        ctx.lineTo(width * 0.5, groundY);
        ctx.lineTo(width * 0.8, groundY - 200);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // Near Mountains
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.3, groundY - 150);
        ctx.lineTo(width * 0.6, groundY);
        ctx.lineTo(width * 0.9, groundY - 100);
        ctx.lineTo(width, groundY);
        ctx.fill();

        clouds.forEach(c => {
            let moveX = c.x + Math.sin(frame * 0.005 + c.x) * 20;
            drawCloud(moveX, c.y, c.s);
        });

        platforms.forEach(p => {
            const py = groundY - p.h;
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(p.x, py, p.w, p.h);
            ctx.fillStyle = '#7CB342';
            ctx.fillRect(p.x, py, p.w, 25);
            ctx.fillStyle = '#AED581';
            for(let i=0; i<p.w; i+=50) {
                ctx.fillRect(p.x + i, py, 25, 8);
            }
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<p.w; i+=60) {
                for(let j=25; j<p.h; j+=40) {
                    ctx.beginPath();
                    ctx.arc(p.x + i + 20, py + j, 5, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        });

        const blockSize = 60;
        drawBlock(550, groundY - 200, blockSize);
        drawGoldBlock(620, groundY - 200, blockSize, 10);
        drawBlock(690, groundY - 200, blockSize);

        drawBlock(850, groundY - 280, blockSize);
        drawBlock(920, groundY - 280, blockSize);
        drawGoldBlock(990, groundY - 280, blockSize, 5);

        drawCoin(585, groundY - 260, 12);
        drawCoin(930, groundY - 340, 12);
        drawCoin(750, groundY - 120, 12);

        drawFlag(1250, groundY - 280, 280);

        spawnParticle();
        updateParticles();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
