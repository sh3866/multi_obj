<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            /* Palette - More vibrant, "gamey" colors */
            --c-primary: #FF3D00;
            --c-primary-light: #FF6E40;
            --c-secondary: #FFD740;
            --c-secondary-dark: #FFAB00;
            --c-accent: #00E5FF;
            --c-dark: #263238;
            --c-text: #FFFFFF;
            --c-bg-overlay: rgba(13, 19, 26, 0.4);
            
            /* UI Sizing */
            --ui-radius: 16px;
            --ui-radius-sm: 8px;
            --ui-stroke: 3px;
            
            /* Fonts */
            --font-head: 'Arial Black', 'Impact', 'Segoe UI Black', system-ui, sans-serif;
            --font-ui: 'Verdana', 'Segoe UI', system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            background: #000;
            color: var(--c-text);
        }

        /* LAYOUT GRID */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 340px 1fr 340px;
            grid-template-rows: auto 1fr auto;
            padding: 2rem;
            gap: 1.5rem;
        }

        /* BACKGROUND CANVAS */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* UI WRAPPER - Glassmorphism & Depth */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: 340px 1fr 340px;
            grid-template-rows: auto 1fr auto;
            pointer-events: none; 
        }

        /* HEADER AREA */
        .header-zone {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .brand-area {
            pointer-events: auto;
            transform: skewY(-3deg);
        }

        h1 {
            font-family: var(--font-head);
            font-size: 5rem;
            color: var(--c-white);
            line-height: 0.85;
            letter-spacing: -2px;
            text-transform: uppercase;
            /* 3D Text Effect */
            text-shadow: 
                0 0 10px rgba(0,0,0,0.2),
                4px 4px 0 var(--c-primary),
                8px 8px 0 var(--c-dark);
            margin-bottom: 0.2rem;
            transform: rotate(-3deg);
            animation: title-entrance 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .subtitle-pill {
            background: linear-gradient(90deg, var(--c-accent), #00B8D4);
            color: var(--c-dark);
            font-family: var(--font-head);
            font-size: 1.5rem;
            padding: 0.5rem 2rem;
            border: var(--ui-stroke) solid var(--c-white);
            border-radius: 50px;
            box-shadow: 0 6px 0 var(--c-dark);
            display: inline-block;
            transform: rotate(2deg);
            animation: title-entrance 1s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
        }

        .stats-area {
            display: flex;
            gap: 1rem;
            pointer-events: auto;
            animation: slide-down 0.8s 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.95);
            border: var(--ui-stroke) solid var(--c-dark);
            border-radius: 50px;
            padding: 0.4rem 1.5rem 0.4rem 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 6px 0 var(--c-dark);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .stat-badge:hover { transform: translateY(-4px); box-shadow: 0 10px 0 var(--c-dark); }
        
        .stat-badge::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: rgba(255,255,255,0.6);
            border-radius: 50px 50px 0 0;
        }

        .stat-badge svg { width: 32px; height: 32px; z-index: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.2)); }
        .stat-val { font-family: var(--font-head); font-size: 1.4rem; color: var(--c-dark); z-index: 1; }

        /* LEFT PANEL: WORLDS */
        .world-panel {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            justify-content: center;
            pointer-events: auto;
            padding-left: 1rem;
        }

        .world-card {
            background: rgba(255, 255, 255, 0.9);
            border: var(--ui-stroke) solid var(--c-dark);
            border-radius: var(--ui-radius);
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            animation: slide-right 0.7s ease-out forwards;
            position: relative;
        }
        
        .world-card:nth-child(1) { animation-delay: 0.5s; }
        .world-card:nth-child(2) { animation-delay: 0.6s; }
        .world-card:nth-child(3) { animation-delay: 0.7s; }

        .world-card:hover { transform: translateX(12px) scale(1.02); }
        
        .world-card.active {
            background: #FFF;
            border-color: var(--c-primary);
            transform: scale(1.05);
            box-shadow: 0 12px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }
        .world-card.active::after {
            content: 'SELECTED';
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--c-primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
            border: 2px solid var(--c-dark);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .w-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            border: 3px solid var(--c-dark);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
        }
        /* Inner Icon Art */
        .w-icon::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
        }

        .w1 .w-icon { background: #66BB6A; }
        .w2 .w-icon { background: #FFB74D; }
        .w3 .w-icon { background: #4DD0E1; }

        .w-info h3 { font-family: var(--font-head); font-size: 1.2rem; line-height: 1; margin-bottom: 4px; color: var(--c-dark); }
        .w-info p { font-size: 0.9rem; color: #555; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        /* CENTER STAGE */
        .center-stage {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 3rem;
        }

        /* HERO CSS - Redesigned for Character Appeal */
        .hero-container {
            position: relative;
            width: 280px;
            height: 320px;
            margin-bottom: 5rem;
            animation: hero-bounce 2.5s infinite ease-in-out;
            z-index: 5;
        }

        .hero-body {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 35% 35%, #FF8A65, var(--c-primary));
            border-radius: 50%;
            position: absolute;
            bottom: 80px;
            left: 40px;
            border: 4px solid var(--c-dark);
            box-shadow: 
                inset -15px -15px 0 rgba(0,0,0,0.15),
                inset 10px 10px 0 rgba(255,255,255,0.3);
            z-index: 2;
        }

        /* Visor - More Expressive */
        .hero-visor {
            position: absolute;
            top: 60px; left: 10px;
            width: 180px; height: 90px;
            background: #FFF;
            border-radius: 45px;
            border: 4px solid var(--c-dark);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.05);
        }
        
        .hero-eyes {
            display: flex;
            gap: 30px;
        }
        .eye {
            width: 24px; height: 24px;
            background: var(--c-dark);
            border-radius: 50%;
            animation: blink 4s infinite;
            position: relative;
        }
        /* Eye shine */
        .eye::after {
            content: '';
            position: absolute;
            top: 4px; left: 6px;
            width: 8px; height: 8px;
            background: #FFF;
            border-radius: 50%;
        }

        /* Spring - Mechanical Detail */
        .hero-spring {
            width: 120px; height: 90px;
            background: #ECEFF1;
            position: absolute;
            bottom: 30px; left: 80px;
            border: 4px solid var(--c-dark);
            border-radius: 12px;
            z-index: 1;
            background-image: repeating-linear-gradient(
                0deg,
                transparent, transparent 12px,
                var(--c-dark) 12px, var(--c-dark) 16px
            );
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2);
        }
        /* Spring Coils (Visual Overlay) */
        .hero-spring::after {
            content: '';
            position: absolute;
            top: 0; left: -10px; right: -10px; bottom: 0;
            border: 4px solid var(--c-dark);
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(0,0,0,0.1) 0%, rgba(255,255,255,0.8) 50%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        .hero-shadow {
            width: 160px; height: 24px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            position: absolute;
            bottom: 0; left: 60px;
            animation: shadow-scale 2.5s infinite ease-in-out;
            filter: blur(4px);
        }

        /* START BUTTON - Epic & Tactile */
        .btn-start {
            pointer-events: auto;
            background: linear-gradient(180deg, #FFEB3B 0%, var(--c-secondary) 40%, var(--c-primary) 100%);
            color: var(--c-white);
            font-family: var(--font-head);
            font-size: 3rem;
            text-transform: uppercase;
            padding: 1.8rem 5rem;
            border: 4px solid var(--c-dark);
            border-radius: 120px;
            cursor: pointer;
            box-shadow: 
                0 15px 0 var(--c-dark),
                inset 0 10px 20px rgba(255,255,255,0.5);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
            animation: btn-pop 0.8s 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0);
            letter-spacing: 2px;
        }

        /* Button Shine Animation */
        .btn-start::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-20deg);
            animation: btn-shine 3s infinite;
        }

        .btn-start:hover {
            transform: translateY(-6px);
            box-shadow: 0 21px 0 var(--c-dark), inset 0 10px 20px rgba(255,255,255,0.5);
        }
        .btn-start:active {
            transform: translateY(5px);
            box-shadow: 0 10px 0 var(--c-dark), inset 0 10px 20px rgba(255,255,255,0.5);
        }

        /* RIGHT PANEL: CONTROLS */
        .controls-panel {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 2rem;
            pointer-events: auto;
            padding-right: 1rem;
            opacity: 0;
            animation: slide-left 0.8s 0.7s ease-out forwards;
        }

        .key-cluster {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 12px;
            transform: rotate(-5deg);
        }
        .key {
            background: #ECEFF1;
            border: 3px solid var(--c-dark);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-size: 1.8rem;
            box-shadow: 0 6px 0 var(--c-dark);
            color: var(--c-dark);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
        }
        .key::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to bottom, #FFF, transparent);
            border-radius: 14px 14px 0 0;
        }
        .key:hover { transform: translateY(4px); box-shadow: 0 2px 0 var(--c-dark); }
        
        .k-up { grid-column: 2; grid-row: 1; }
        .k-left { grid-column: 1; grid-row: 2; }
        .k-down { grid-column: 2; grid-row: 2; }
        .k-right { grid-column: 3; grid-row: 2; }

        .key-action {
            width: 160px; height: 80px;
            background: var(--c-accent);
            color: var(--c-dark);
            border-radius: 24px;
            margin-top: 15px;
            align-self: flex-end;
            font-size: 1.4rem;
            letter-spacing: 2px;
            box-shadow: 0 8px 0 var(--c-dark);
            font-family: var(--font-head);
        }
        .key-action:hover { transform: translateY(4px); box-shadow: 0 4px 0 var(--c-dark); }

        .controls-label {
            text-align: right;
            color: var(--c-white);
            font-weight: 900;
            text-shadow: 2px 2px 0 var(--c-dark);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* FOOTER */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            color: var(--c-white);
            font-weight: 800;
            text-shadow: 2px 2px 0 var(--c-dark);
            font-size: 1.1rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* ANIMATIONS */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            10% { transform: translateY(0) scale(1.15, 0.85); }
            50% { transform: translateY(-50px) scale(0.9, 1.1); }
            90% { transform: translateY(0) scale(1.15, 0.85); }
        }
        @keyframes shadow-scale {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(0.5); opacity: 0.1; }
        }
        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
        @keyframes title-entrance { from { opacity: 0; transform: translateY(-60px) rotate(-5deg); } to { opacity: 1; transform: translateY(0) rotate(-3deg); } }
        @keyframes slide-down { to { opacity: 1; transform: translateY(0); } }
        @keyframes slide-right { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slide-left { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes btn-pop { to { opacity: 1; transform: scale(1); } }
        @keyframes btn-shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* RESPONSIVE */
        @media (max-width: 1100px) {
            .ui-layer { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
            .header-zone { grid-row: 1; justify-content: center; margin-bottom: 1rem; }
            .stats-area { display: none; }
            .world-panel { grid-row: 2; flex-direction: row; justify-content: center; padding: 0; overflow-x: auto; }
            .world-card { min-width: 220px; }
            .center-stage { grid-row: 3; padding-bottom: 2rem; }
            .controls-panel { grid-row: 4; align-items: center; padding: 0; margin-bottom: 2rem; }
            footer { grid-row: 5; justify-content: center; gap: 1rem; }
            h1 { font-size: 3.5rem; }
            .hero-container { transform: scale(0.8); margin-bottom: 2rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <canvas id="world-canvas"></canvas>

    <div class="ui-layer">
        <!-- HEADER -->
        <header class="header-zone">
            <div class="brand-area">
                <h1>Bouncy<br>& Bolt</h1>
                <div class="subtitle-pill">The Great Spring Adventure</div>
            </div>
            <div class="stats-area">
                <div class="stat-badge">
                    <svg viewBox="0 0 24 24" fill="#FFC107" stroke="#263238" stroke-width="2">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                        <circle cx="12" cy="12" r="6" fill="#FFF"/>
                        <path d="M11 7v10M7 11h8" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                    <span class="stat-val">1,240</span>
                </div>
                <div class="stat-badge">
                    <svg viewBox="0 0 24 24" fill="#E91E63" stroke="#263238" stroke-width="2">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span class="stat-val">5</span>
                </div>
            </div>
        </header>

        <!-- LEFT: WORLDS -->
        <aside class="world-panel">
            <div class="world-card w1 active">
                <div class="w-icon"></div>
                <div class="w-info">
                    <h3>Spring Valley</h3>
                    <p>Level 1-1</p>
                </div>
            </div>
            <div class="world-card w2">
                <div class="w-icon"></div>
                <div class="w-info">
                    <h3>Sand Springs</h3>
                    <p>Locked</p>
                </div>
            </div>
            <div class="world-card w3">
                <div class="w-icon"></div>
                <div class="w-info">
                    <h3>Cloud Peak</h3>
                    <p>Locked</p>
                </div>
            </div>
        </aside>

        <!-- CENTER: HERO & CTA -->
        <main class="center-stage">
            <div class="hero-container">
                <div class="hero-body">
                    <div class="hero-visor">
                        <div class="hero-eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                    </div>
                </div>
                <div class="hero-spring"></div>
                <div class="hero-shadow"></div>
            </div>
            <button class="btn-start">Start Adventure</button>
        </main>

        <!-- RIGHT: CONTROLS -->
        <aside class="controls-panel">
            <div class="key-cluster">
                <div class="key k-up">W</div>
                <div class="key k-left">A</div>
                <div class="key k-down">S</div>
                <div class="key k-right">D</div>
            </div>
            <div class="key key-action">SPACE</div>
            <div class="controls-label">Jump to Bounce!</div>
        </aside>

        <!-- FOOTER -->
        <footer>
            <div>© 2023 Bouncy Games</div>
            <div>Press ENTER to Start</div>
        </footer>
    </div>
</div>

<script>
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Palette - Enhanced
    const C_SKY_TOP = '#4FC3F7';
    const C_SKY_BOT = '#E1F5FE';
    const C_GROUND = '#5D4037';
    const C_GRASS = '#66BB6A';
    const C_GRASS_LIGHT = '#81C784';
    const C_MOUNTAIN = '#B0BEC5';
    const C_MOUNTAIN_FAR = '#CFD8DC';
    const C_STROKE = '#263238';

    // Helpers
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawBlock(x, y, size, isGold) {
        const mainColor = isGold ? '#FFCA28' : '#8D6E63';
        const lightColor = isGold ? '#FFF59D' : '#A1887F';
        const darkColor = isGold ? '#FF8F00' : '#4E342E';
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x + 8, y + 8, size, size);

        // Base
        ctx.fillStyle = mainColor;
        ctx.fillRect(x, y, size, size);
        
        // Bevel
        ctx.fillStyle = lightColor;
        ctx.fillRect(x, y, size, 8);
        ctx.fillRect(x, y, 8, size);
        
        ctx.fillStyle = darkColor;
        ctx.fillRect(x, y + size - 8, size, 8);
        ctx.fillRect(x + size - 8, y, 8, size);

        // Content
        const pulse = Math.sin((frame + (isGold ? 10 : 0)) * 0.1) * 0.2 + 0.8;
        ctx.fillStyle = isGold ? '#FFF' : '#3E2723';
        ctx.font = 'bold ' + (size/1.8) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 3);
        
        // Shine for gold
        if(isGold) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/3 * pulse, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function drawGround(y, h) {
        // Dirt
        ctx.fillStyle = C_GROUND;
        ctx.fillRect(0, y, width, h);
        
        // Grass Top
        ctx.fillStyle = C_GRASS;
        ctx.fillRect(0, y, width, 25);
        
        // Grass Highlights
        ctx.fillStyle = C_GRASS_LIGHT;
        for(let i=0; i<width; i+=50) {
            ctx.fillRect(i, y, 25, 8);
        }
        
        // Texture dots
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        for(let i=0; i<width; i+=80) {
            for(let j=y+40; j<height; j+=60) {
                ctx.beginPath();
                ctx.arc(i + (j%20), j, 4, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }

    function drawCloud(x, y, scale) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(x, y, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 30 * scale, y - 15 * scale, 40 * scale, 0, Math.PI * 2);
        ctx.arc(x + 60 * scale, y, 35 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 5;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Inner detail
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 6, 4, 12);
    }

    function drawFlag(x, y, h) {
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 8, h);
        
        // Ball on top
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(x+4, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = C_STROKE; ctx.lineWidth = 2; ctx.stroke();

        // Flag
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+8, y+15);
        ctx.lineTo(x+70, y+35);
        ctx.lineTo(x+8, y+55);
        ctx.fill();
        ctx.stroke();
    }

    // Particles
    const particles = [];
    function spawnParticle() {
        if(Math.random() > 0.05) return;
        particles.push({
            x: Math.random() * width,
            y: height - 100,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            life: 100,
            color: Math.random() > 0.5 ? '#FFF' : '#FFD700'
        });
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    const clouds = [
        {x: 100, y: 150, s: 1},
        {x: 400, y: 100, s: 0.8},
        {x: 800, y: 180, s: 1.2},
        {x: 1100, y: 120, s: 0.9}
    ];

    const platforms = [
        {x: -50, y: 0, w: 450, h: 120},
        {x: 500, y: 60, w: 250, h: 60},
        {x: 800, y: -30, w: 350, h: 150},
        {x: 1200, y: 30, w: 250, h: 90}
    ];

    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        const groundY = height - 180;

        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Far Mountains
        ctx.fillStyle = C_MOUNTAIN_FAR;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 250);
        ctx.lineTo(width * 0.5, groundY);
        ctx.lineTo(width * 0.8, groundY - 200);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // Near Mountains
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.3, groundY - 150);
        ctx.lineTo(width * 0.6, groundY);
        ctx.lineTo(width * 0.9, groundY - 100);
        ctx.lineTo(width, groundY);
        ctx.fill();

        clouds.forEach(c => {
            let moveX = c.x + Math.sin(frame * 0.005 + c.x) * 20;
            drawCloud(moveX, c.y, c.s);
        });

        // Draw Platforms
        platforms.forEach(p => {
            const py = groundY - p.h;
            // Dirt
            ctx.fillStyle = C_GROUND;
            ctx.fillRect(p.x, py, p.w, p.h);
            // Grass
            ctx.fillStyle = C_GRASS;
            ctx.fillRect(p.x, py, p.w, 25);
            // Grass Detail
            ctx.fillStyle = C_GRASS_LIGHT;
            for(let i=0; i<p.w; i+=50) {
                ctx.fillRect(p.x + i, py, 25, 8);
            }
            // Dirt Texture
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<p.w; i+=60) {
                for(let j=25; j<p.h; j+=40) {
                    ctx.beginPath();
                    ctx.arc(p.x + i + 20, py + j, 5, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        });

        // Draw Ground
        drawGround(groundY, height - groundY);

        const blockSize = 60;
        // Blocks
        drawBlock(550, groundY - 200, blockSize);
        drawBlock(620, groundY - 200, blockSize, true); // Gold
        drawBlock(690, groundY - 200, blockSize);

        drawBlock(850, groundY - 280, blockSize);
        drawBlock(920, groundY - 280, blockSize);
        drawBlock(990, groundY - 280, blockSize, true); // Gold

        // Coins
        drawCoin(585, groundY - 260, 12);
        drawCoin(930, groundY - 340, 12);
        drawCoin(750, groundY - 120, 12);

        // Flag
        drawFlag(1250, groundY - 280, 280);

        spawnParticle();
        updateParticles();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
