<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            --c-primary: #FF5722;
            --c-primary-dark: #D84315;
            --c-secondary: #FFC107;
            --c-secondary-dark: #FFA000;
            --c-blue: #03A9F4;
            --c-blue-dark: #0288D1;
            --c-text: #37474F;
            --c-white: #FFFFFF;
            --c-stroke: #263238;
            
            --font-head: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
            --font-ui: 'Verdana', 'Segoe UI', sans-serif;
            
            --shadow-solid: 5px 5px 0px var(--c-stroke);
            --shadow-solid-lg: 8px 8px 0px var(--c-stroke);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            background: var(--c-blue);
            color: var(--c-text);
        }

        /* LAYOUT GRID */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: auto 1fr auto;
            padding: 2rem;
            gap: 1rem;
        }

        /* BACKGROUND CANVAS */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* UI WRAPPER */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: auto 1fr auto;
            pointer-events: none; /* Let clicks pass to canvas if needed, but we re-enable on children */
        }

        /* HEADER AREA */
        .header-zone {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .brand-area {
            pointer-events: auto;
            transform: skewY(-2deg);
        }

        h1 {
            font-family: var(--font-head);
            font-size: 4.5rem;
            color: var(--c-white);
            line-height: 0.9;
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 6px 6px 0 var(--c-stroke);
            margin-bottom: 0.5rem;
            transform: rotate(-2deg);
            animation: title-entrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .subtitle-pill {
            background: var(--c-white);
            color: var(--c-blue-dark);
            font-family: var(--font-head);
            font-size: 1.4rem;
            padding: 0.4rem 1.5rem;
            border: 3px solid var(--c-stroke);
            border-radius: 50px;
            box-shadow: var(--shadow-solid);
            display: inline-block;
            transform: rotate(1deg);
            animation: title-entrance 0.8s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .stats-area {
            display: flex;
            gap: 1.5rem;
            pointer-events: auto;
            animation: slide-down 0.6s 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        .stat-badge {
            background: var(--c-white);
            border: 3px solid var(--c-stroke);
            border-radius: 50px;
            padding: 0.5rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: var(--shadow-solid);
            transition: transform 0.2s;
        }
        .stat-badge:hover { transform: scale(1.05) rotate(-2deg); }
        .stat-badge svg { width: 28px; height: 28px; }
        .stat-val { font-family: var(--font-head); font-size: 1.2rem; color: var(--c-stroke); }

        /* LEFT PANEL: WORLDS */
        .world-panel {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            justify-content: center;
            pointer-events: auto;
            padding-left: 1rem;
        }

        .world-card {
            background: rgba(255,255,255,0.95);
            border: 3px solid var(--c-stroke);
            border-radius: 18px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-solid);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            animation: slide-right 0.6s ease-out forwards;
        }
        
        .world-card:nth-child(1) { animation-delay: 0.4s; }
        .world-card:nth-child(2) { animation-delay: 0.5s; }
        .world-card:nth-child(3) { animation-delay: 0.6s; }

        .world-card:hover { transform: translateX(10px); }
        
        .world-card.active {
            background: var(--c-white);
            border-color: var(--c-primary);
            transform: scale(1.1);
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }
        .world-card.active .w-icon { background: var(--c-primary); }
        .world-card.active::after {
            content: 'PLAY';
            position: absolute;
            right: -10px;
            background: var(--c-primary);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            border: 2px solid var(--c-stroke);
        }

        .w-icon {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 3px solid var(--c-stroke);
            background: #ddd;
            flex-shrink: 0;
        }
        .w1 .w-icon { background: #81C784; }
        .w2 .w-icon { background: #FFB74D; }
        .w3 .w-icon { background: #4DD0E1; }

        .w-info h3 { font-family: var(--font-head); font-size: 1.1rem; line-height: 1; margin-bottom: 4px; }
        .w-info p { font-size: 0.85rem; color: #666; font-weight: bold; }

        /* CENTER STAGE */
        .center-stage {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 3rem;
        }

        /* HERO CSS (Redesigned) */
        .hero-container {
            position: relative;
            width: 240px;
            height: 260px;
            margin-bottom: 4rem;
            animation: hero-bounce 2s infinite ease-in-out;
        }

        .hero-body {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at 30% 30%, #FFAB91, var(--c-primary));
            border-radius: 50%;
            position: absolute;
            bottom: 60px;
            left: 30px;
            border: 4px solid var(--c-stroke);
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1);
            z-index: 2;
        }

        /* Visor */
        .hero-visor {
            position: absolute;
            top: 55px; left: 15px;
            width: 150px; height: 70px;
            background: #FFF;
            border-radius: 40px;
            border: 4px solid var(--c-stroke);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hero-eyes {
            display: flex;
            gap: 15px;
        }
        .eye {
            width: 20px; height: 20px;
            background: var(--c-stroke);
            border-radius: 50%;
            animation: blink 4s infinite;
        }

        /* Spring */
        .hero-spring {
            width: 100px; height: 70px;
            background: #CFD8DC;
            position: absolute;
            bottom: 20px; left: 70px;
            border: 4px solid var(--c-stroke);
            border-radius: 10px;
            z-index: 1;
            background-image: repeating-linear-gradient(
                0deg,
                transparent, transparent 10px,
                var(--c-stroke) 10px, var(--c-stroke) 14px
            );
        }

        .hero-shadow {
            width: 140px; height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            position: absolute;
            bottom: 0; left: 50px;
            animation: shadow-scale 2s infinite ease-in-out;
        }

        /* START BUTTON */
        .btn-start {
            pointer-events: auto;
            background: linear-gradient(180deg, var(--c-secondary) 0%, var(--c-primary) 100%);
            color: var(--c-white);
            font-family: var(--font-head);
            font-size: 2.8rem;
            text-transform: uppercase;
            padding: 1.5rem 4rem;
            border: 4px solid var(--c-stroke);
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 
                0 10px 0 var(--c-stroke),
                inset 0 8px 0 rgba(255,255,255,0.4);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
            animation: btn-pop 0.6s 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0);
        }

        .btn-start:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 0 var(--c-stroke), inset 0 8px 0 rgba(255,255,255,0.4);
        }
        .btn-start:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 var(--c-stroke), inset 0 8px 0 rgba(255,255,255,0.4);
        }

        /* RIGHT PANEL: CONTROLS */
        .controls-panel {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 2rem;
            pointer-events: auto;
            padding-right: 2rem;
            opacity: 0;
            animation: slide-left 0.6s 0.6s ease-out forwards;
        }

        .key-cluster {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
        }
        .key {
            background: var(--c-white);
            border: 3px solid var(--c-stroke);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-size: 1.5rem;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            color: var(--c-stroke);
            transition: transform 0.1s;
        }
        .key:hover { transform: translateY(2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
        
        .k-up { grid-column: 2; grid-row: 1; }
        .k-left { grid-column: 1; grid-row: 2; }
        .k-down { grid-column: 2; grid-row: 2; }
        .k-right { grid-column: 3; grid-row: 2; }

        .key-action {
            width: 100px; height: 80px;
            background: var(--c-blue);
            color: white;
            border-radius: 20px;
            margin-top: 10px;
            align-self: flex-end;
            font-size: 1.2rem;
            letter-spacing: 1px;
            box-shadow: 6px 6px 0 var(--c-stroke);
        }
        .key-action:hover { transform: translateY(2px); box-shadow: 4px 4px 0 var(--c-stroke); }

        .controls-label {
            text-align: right;
            color: var(--c-white);
            font-weight: 900;
            text-shadow: 2px 2px 0 var(--c-stroke);
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        /* FOOTER */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            color: var(--c-white);
            font-weight: 800;
            text-shadow: 2px 2px 0 var(--c-stroke);
            font-size: 1rem;
            opacity: 0.9;
        }

        /* ANIMATIONS */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            10% { transform: translateY(0) scale(1.1, 0.9); }
            50% { transform: translateY(-40px) scale(0.95, 1.05); }
            90% { transform: translateY(0) scale(1.1, 0.9); }
        }
        @keyframes shadow-scale {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(0.6); opacity: 0.1; }
        }
        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
        @keyframes title-entrance { from { opacity: 0; transform: translateY(-50px) rotate(-5deg); } to { opacity: 1; transform: translateY(0) rotate(-2deg); } }
        @keyframes slide-down { to { opacity: 1; transform: translateY(0); } }
        @keyframes slide-right { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slide-left { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes btn-pop { to { opacity: 1; transform: scale(1); } }

        /* RESPONSIVE */
        @media (max-width: 1100px) {
            .ui-layer { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
            .header-zone { grid-row: 1; justify-content: center; margin-bottom: 1rem; }
            .stats-area { display: none; } /* Hide stats on small screens for cleaner look */
            .world-panel { grid-row: 2; flex-direction: row; justify-content: center; padding: 0; overflow-x: auto; }
            .world-card { min-width: 200px; }
            .center-stage { grid-row: 3; padding-bottom: 2rem; }
            .controls-panel { grid-row: 4; align-items: center; padding: 0; margin-bottom: 2rem; }
            footer { grid-row: 5; justify-content: center; gap: 1rem; }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <canvas id="world-canvas"></canvas>

    <div class="ui-layer">
        <!-- HEADER -->
        <header class="header-zone">
            <div class="brand-area">
                <h1>Bouncy<br>& Bolt</h1>
                <div class="subtitle-pill">The Great Spring Adventure</div>
            </div>
            <div class="stats-area">
                <div class="stat-badge">
                    <svg viewBox="0 0 24 24" fill="#FFC107" stroke="#263238" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 7v10M9 10h6" stroke="#FFF" stroke-width="2"/>
                    </svg>
                    <span class="stat-val">1,240</span>
                </div>
                <div class="stat-badge">
                    <svg viewBox="0 0 24 24" fill="#E91E63" stroke="#263238" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span class="stat-val">5</span>
                </div>
            </div>
        </header>

        <!-- LEFT: WORLDS -->
        <aside class="world-panel">
            <div class="world-card w1 active">
                <div class="w-icon"></div>
                <div class="w-info">
                    <h3>Spring Valley</h3>
                    <p>Level 1-1</p>
                </div>
            </div>
            <div class="world-card w2">
                <div class="w-icon"></div>
                <div class="w-info">
                    <h3>Sand Springs</h3>
                    <p>Locked</p>
                </div>
            </div>
            <div class="world-card w3">
                <div class="w-icon"></div>
                <div class="w-info">
                    <h3>Cloud Peak</h3>
                    <p>Locked</p>
                </div>
            </div>
        </aside>

        <!-- CENTER: HERO & CTA -->
        <main class="center-stage">
            <div class="hero-container">
                <div class="hero-body">
                    <div class="hero-visor">
                        <div class="hero-eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                    </div>
                </div>
                <div class="hero-spring"></div>
                <div class="hero-shadow"></div>
            </div>
            <button class="btn-start">Start Adventure</button>
        </main>

        <!-- RIGHT: CONTROLS -->
        <aside class="controls-panel">
            <div class="key-cluster">
                <div class="key k-up">W</div>
                <div class="key k-left">A</div>
                <div class="key k-down">S</div>
                <div class="key k-right">D</div>
            </div>
            <div class="key key-action">SPACE</div>
            <div class="controls-label">Jump to Bounce!</div>
        </aside>

        <!-- FOOTER -->
        <footer>
            <div>© 2023 Bouncy Games</div>
            <div>Press ENTER to Start</div>
        </footer>
    </div>
</div>

<script>
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Palette
    const C_SKY_TOP = '#4FC3F7';
    const C_SKY_BOT = '#E1F5FE';
    const C_GROUND = '#5D4037';
    const C_GRASS = '#66BB6A';
    const C_GRASS_LIGHT = '#81C784';
    const C_MOUNTAIN = '#B0BEC5';
    const C_MOUNTAIN_FAR = '#CFD8DC';
    const C_STROKE = '#263238';

    // Helpers
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawBlock(x, y, size, isGold) {
        const mainColor = isGold ? '#FFCA28' : '#8D6E63';
        const lightColor = isGold ? '#FFF59D' : '#A1887F';
        const darkColor = isGold ? '#FF8F00' : '#4E342E';
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(x + 6, y + 6, size, size);

        // Base
        ctx.fillStyle = mainColor;
        ctx.fillRect(x, y, size, size);
        
        // Bevel
        ctx.fillStyle = lightColor;
        ctx.fillRect(x, y, size, 6);
        ctx.fillRect(x, y, 6, size);
        
        ctx.fillStyle = darkColor;
        ctx.fillRect(x, y + size - 6, size, 6);
        ctx.fillRect(x + size - 6, y, 6, size);

        // Content
        const pulse = Math.sin((frame + (isGold ? 10 : 0)) * 0.1) * 0.2 + 0.8;
        ctx.fillStyle = isGold ? '#FFF' : '#3E2723';
        ctx.font = 'bold ' + (size/2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 3);
        
        // Shine for gold
        if(isGold) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/3 * pulse, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function drawGround(y, h) {
        // Dirt
        ctx.fillStyle = C_GROUND;
        ctx.fillRect(0, y, width, h);
        
        // Grass Top
        ctx.fillStyle = C_GRASS;
        ctx.fillRect(0, y, width, 25);
        
        // Grass Highlights
        ctx.fillStyle = C_GRASS_LIGHT;
        for(let i=0; i<width; i+=50) {
            ctx.fillRect(i, y, 25, 8);
        }
        
        // Texture dots
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        for(let i=0; i<width; i+=80) {
            for(let j=y+40; j<height; j+=60) {
                ctx.beginPath();
                ctx.arc(i + (j%20), j, 4, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }

    function drawCloud(x, y, scale) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(x, y, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 30 * scale, y - 15 * scale, 40 * scale, 0, Math.PI * 2);
        ctx.arc(x + 60 * scale, y, 35 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 5;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Inner detail
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 6, 4, 12);
    }

    function drawFlag(x, y, h) {
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 8, h);
        
        // Ball on top
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(x+4, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = C_STROKE; ctx.lineWidth = 2; ctx.stroke();

        // Flag
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+8, y+15);
        ctx.lineTo(x+70, y+35);
        ctx.lineTo(x+8, y+55);
        ctx.fill();
        ctx.stroke();
    }

    // Particles
    const particles = [];
    function spawnParticle() {
        if(Math.random() > 0.05) return;
        particles.push({
            x: Math.random() * width,
            y: height - 100,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            life: 100,
            color: Math.random() > 0.5 ? '#FFF' : '#FFD700'
        });
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    const clouds = [
        {x: 100, y: 150, s: 1},
        {x: 400, y: 100, s: 0.8},
        {x: 800, y: 180, s: 1.2},
        {x: 1100, y: 120, s: 0.9}
    ];

    const platforms = [
        {x: -50, y: 0, w: 450, h: 120},
        {x: 500, y: 60, w: 250, h: 60},
        {x: 800, y: -30, w: 350, h: 150},
        {x: 1200, y: 30, w: 250, h: 90}
    ];

    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        const groundY = height - 180;

        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Far Mountains
        ctx.fillStyle = C_MOUNTAIN_FAR;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 250);
        ctx.lineTo(width * 0.5, groundY);
        ctx.lineTo(width * 0.8, groundY - 200);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // Near Mountains
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.3, groundY - 150);
        ctx.lineTo(width * 0.6, groundY);
        ctx.lineTo(width * 0.9, groundY - 100);
        ctx.lineTo(width, groundY);
        ctx.fill();

        clouds.forEach(c => {
            let moveX = c.x + Math.sin(frame * 0.005 + c.x) * 20;
            drawCloud(moveX, c.y, c.s);
        });

        // Draw Platforms
        platforms.forEach(p => {
            const py = groundY - p.h;
            // Dirt
            ctx.fillStyle = C_GROUND;
            ctx.fillRect(p.x, py, p.w, p.h);
            // Grass
            ctx.fillStyle = C_GRASS;
            ctx.fillRect(p.x, py, p.w, 25);
            // Grass Detail
            ctx.fillStyle = C_GRASS_LIGHT;
            for(let i=0; i<p.w; i+=50) {
                ctx.fillRect(p.x + i, py, 25, 8);
            }
            // Dirt Texture
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<p.w; i+=60) {
                for(let j=25; j<p.h; j+=40) {
                    ctx.beginPath();
                    ctx.arc(p.x + i + 20, py + j, 5, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        });

        // Draw Ground
        drawGround(groundY, height - groundY);

        const blockSize = 60;
        // Blocks
        drawBlock(550, groundY - 200, blockSize);
        drawBlock(620, groundY - 200, blockSize, true); // Gold
        drawBlock(690, groundY - 200, blockSize);

        drawBlock(850, groundY - 280, blockSize);
        drawBlock(920, groundY - 280, blockSize);
        drawBlock(990, groundY - 280, blockSize, true); // Gold

        // Coins
        drawCoin(585, groundY - 260, 12);
        drawCoin(930, groundY - 340, 12);
        drawCoin(750, groundY - 120, 12);

        // Flag
        drawFlag(1250, groundY - 280, 280);

        spawnParticle();
        updateParticles();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
