<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | Editorial Visual</title>
<style>
    :root {
        --c-sky-top: #1e293b;
        --c-sky-bot: #94a3b8;
        --c-cliff-dark: #0f172a;
        --c-cliff-light: #334155;
        --c-accent: #f59e0b; /* Amber for canopy */
        --c-accent-glow: #fbbf24;
        --c-text-main: #f8fafc;
        --c-text-muted: #94a3b8;
        --font-display: "Georgia", "Times New Roman", serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-sky-top);
        color: var(--c-text-main);
        font-family: var(--font-body);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr;
    }

    /* --- VISUAL SCENE CONTAINER --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, #1e293b 0%, #475569 60%, #94a3b8 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- UI / EDITORIAL LAYOUT --- */
    .content-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem;
        background: #ffffff;
        color: #0f172a;
        z-index: 10;
        box-shadow: -10px 0 40px rgba(0,0,0,0.2);
    }

    .tag {
        font-family: var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--c-accent);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 20px;
        height: 2px;
        background: var(--c-accent);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 4.5rem;
        line-height: 0.95;
        font-weight: 400;
        margin-bottom: 2rem;
        color: #0f172a;
        letter-spacing: -0.02em;
    }

    h1 span {
        font-style: italic;
        color: var(--c-accent);
    }

    p.lead {
        font-size: 1.125rem;
        line-height: 1.6;
        color: #475569;
        max-width: 480px;
        margin-bottom: 3rem;
    }

    /* --- DATA DASHBOARD --- */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        border-top: 1px solid #e2e8f0;
        padding-top: 2rem;
    }

    .data-point {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .data-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
    }

    .data-value {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
    }

    .data-unit {
        font-size: 0.875rem;
        font-weight: 400;
        color: #64748b;
    }

    /* --- INTERACTIVE CONTROLS --- */
    .controls {
        margin-top: auto;
        padding-top: 2rem;
    }

    .slider-group {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    input[type="range"] {
        flex-grow: 1;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        appearance: none;
        outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--c-accent);
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.1);
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 900px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: 60vh 1fr;
        }
        .scene-container { order: 1; }
        .content-panel { 
            order: 2; 
            padding: 2rem; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        h1 { font-size: 3rem; }
        .dashboard { grid-template-columns: 1fr 1fr; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 800">
            <defs>
                <!-- Gradients -->
                <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#334155" />
                    <stop offset="50%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#0f172a" />
                </linearGradient>
                
                <radialGradient id="sunGlow" cx="0.8" cy="0.2" r="0.6">
                    <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="transparent" />
                </radialGradient>

                <filter id="blurSmall">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
                </filter>
            </defs>

            <!-- Background Sky & Sun -->
            <rect width="100%" height="100%" fill="url(#sunGlow)" />

            <!-- Distant Mountains (Depth) -->
            <path d="M0,600 L150,500 L300,580 L450,480 L600,550 L800,450 L800,800 L0,800 Z" fill="#64748b" opacity="0.4" />
            <path d="M0,650 L200,550 L350,620 L500,520 L800,600 L800,800 L0,800 Z" fill="#475569" opacity="0.6" />

            <!-- The Main Cliff (Foreground Left) -->
            <g id="cliff">
                <!-- Base Shape -->
                <path d="M0,0 L250,0 L250,150 L280,150 L260,200 L310,220 L280,280 L350,320 L300,380 L380,450 L320,550 L400,700 L0,800 Z" fill="url(#cliffGrad)" />
                
                <!-- Rock Strata (Texture) -->
                <path d="M250,150 L280,150 L260,200 L310,220" fill="none" stroke="#475569" stroke-width="2" />
                <path d="M280,280 L350,320 L300,380" fill="none" stroke="#475569" stroke-width="3" />
                <path d="M380,450 L320,550" fill="none" stroke="#475569" stroke-width="4" />
                
                <!-- Geometric Facets (Lighting) -->
                <polygon points="250,0 250,150 280,150" fill="#475569" opacity="0.3" />
                <polygon points="260,200 310,220 280,280" fill="#475569" opacity="0.2" />
                <polygon points="350,320 300,380 380,450" fill="#475569" opacity="0.1" />
            </g>

            <!-- Parachutist Group (Animated) -->
            <g id="parachutist" transform="translate(500, 300)">
                
                <!-- Canopy Shadow on Ground (Visual Anchor) -->
                <ellipse cx="0" cy="500" rx="60" ry="15" fill="black" opacity="0.2" filter="url(#blurSmall)" />

                <!-- Taut Harness Lines -->
                <path id="lines" d="M-100,-150 L0,100 L100,-150 M-80,-150 L0,100 L80,-150 M-50,-150 L0,100 L50,-150 M-20,-150 L0,100 L20,-150" 
                      stroke="#e2e8f0" stroke-width="1" fill="none" opacity="0.8" />

                <!-- The Canopy -->
                <path id="canopy" d="M-120,-150 Q0,-280 120,-150 Q0,-200 -120,-150 Z" fill="var(--c-accent)" />
                <!-- Canopy Folds (Visual Polish) -->
                <path d="M-80,-150 Q-40,-220 0,-180 Q40,-220 80,-150" fill="none" stroke="#d97706" stroke-width="2" opacity="0.5" />
                <path d="M-120,-150 Q-60,-190 -20,-150" fill="none" stroke="#d97706" stroke-width="1" opacity="0.3" />
                <path d="M120,-150 Q60,-190 20,-150" fill="none" stroke="#d97706" stroke-width="1" opacity="0.3" />

                <!-- The Human Figure -->
                <g id="human">
                    <!-- Backpack -->
                    <rect x="-15" y="80" width="30" height="40" rx="5" fill="#334155" />
                    <!-- Body -->
                    <path d="M0,100 L-10,160 L10,160 Z" fill="#1e293b" />
                    <!-- Limbs (Dynamic Pose) -->
                    <path d="M-10,160 L-20,190 L-15,200" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" /> <!-- Left Leg -->
                    <path d="M10,160 L25,185 L15,205" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" /> <!-- Right Leg -->
                    <path d="M-5,105 L-25,125 L-15,135" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" /> <!-- Left Arm -->
                    <path d="M5,105 L25,125 L15,135" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" /> <!-- Right Arm -->
                    <!-- Helmet -->
                    <circle cx="0" cy="90" r="10" fill="#cbd5e1" />
                </g>
            </g>

            <!-- Wind / Speed Lines -->
            <g id="wind-lines" stroke="#ffffff" stroke-width="1" opacity="0.3">
                <line x1="800" y1="100" x2="850" y2="100" />
                <line x1="750" y1="250" x2="820" y2="250" />
                <line x1="800" y1="400" x2="880" y2="400" />
                <line x1="780" y1="550" x2="830" y2="550" />
                <line x1="700" y1="700" x2="800" y2="700" />
            </g>
        </svg>
    </div>

    <!-- CONTENT / INTERACTION -->
    <div class="content-panel">
        <div class="tag">Operation: High Altitude</div>
        
        <h1>Controlled<br><span>Descent.</span></h1>
        
        <p class="lead">
            Navigating the vertical gap between geological permanence and human fragility. 
            A study in tension, aerodynamics, and the quiet moments of freefall.
        </p>

        <div class="dashboard">
            <div class="data-point">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">4,200</span>
                <span class="data-unit">ft</span>
            </div>
            <div class="data-point">
                <span class="data-label">Wind Speed</span>
                <span class="data-value">24</span>
                <span class="data-unit">mph</span>
            </div>
            <div class="data-point">
                <span class="data-label">Canopy Load</span>
                <span class="data-value">12</span>
                <span class="data-unit">kg</span>
            </div>
        </div>

        <div class="controls">
            <div class="slider-group">
                <span class="data-label">Simulation Speed</span>
                <input type="range" id="speedControl" min="0" max="100" value="30">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const lines = document.getElementById('lines');
            const human = document.getElementById('human');
            const altVal = document.getElementById('alt-val');
            const speedControl = document.getElementById('speedControl');
            
            let time = 0;
            let speed = 30;
            let altitude = 4200;

            // Mouse interaction for parallax effect
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Slider interaction
            speedControl.addEventListener('input', (e) => {
                speed = parseInt(e.target.value);
            });

            function animate() {
                time += 0.01 * (speed / 30);
                
                // 1. Floating Motion (Sine waves)
                // The parachute sways gently
                const swayX = Math.sin(time) * 20;
                const swayY = Math.cos(time * 0.5) * 10;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time) * 15;
                
                // 3. Breathing/Canopy Flex
                const flex = Math.sin(time * 4) * 5;

                // Apply transforms
                // Move the whole group based on mouse (parallax) + sway
                const baseX = 500 + (mouseX * 40) + swayX;
                const baseY = 300 + (mouseY * 40) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the canopy center
                // We rotate around the connection point (0, 100 in local space)
                human.setAttribute('transform', `rotate(${swing}, 0, 100)`);

                // Flex the canopy shape slightly
                // Original: M-120,-150 Q0,-280 120,-150 Q0,-200 -120,-150 Z
                const topY = -280 + flex;
                const botY = -200 + (flex * 0.5);
                canopy.setAttribute('d', `M-120,-150 Q0,${topY} 120,-150 Q0,${botY} -120,-150 Z`);

                // Update Lines dynamically to match canopy flex
                // We adjust the top anchor points of the lines
                const lineOffset = flex * 0.8;
                lines.setAttribute('d', `
                    M-100,-150 L0,100 L100,-150 
                    M-80,-150 L0,100 L80,-150 
                    M-50,-150 L0,100 L50,-150 
                    M-20,-150 L0,100 L20,-150
                `);

                // Simulate Altitude Drop based on speed
                if (speed > 10) {
                    altitude -= (speed * 0.05);
                    if (altitude < 1000) altitude = 4500; // Reset
                }
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
