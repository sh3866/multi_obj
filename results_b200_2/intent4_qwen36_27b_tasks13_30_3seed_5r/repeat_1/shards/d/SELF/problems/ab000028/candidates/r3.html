<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | High-Altitude Editorial</title>
<style>
    :root {
        /* Palette: Refined Slate & Burnished Amber */
        --c-sky-top: #020617;
        --c-sky-mid: #0f172a;
        --c-sky-bot: #334155;
        
        --c-cliff-deep: #0f172a;
        --c-cliff-mid: #1e293b;
        --c-cliff-light: #334155;
        --c-cliff-highlight: #475569;
        
        --c-canopy-base: #d97706;
        --c-canopy-top: #f59e0b;
        --c-canopy-highlight: #fef3c7;
        
        --c-ui-bg: #ffffff;
        --c-ui-text: #0f172a;
        --c-ui-muted: #64748b;
        --c-ui-border: #e2e8f0;
        
        --font-display: "Georgia", "Times New Roman", serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Consolas", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-ui-bg);
        color: var(--c-ui-text);
        font-family: var(--font-body);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: grid;
        grid-template-columns: 55% 45%;
    }

    /* --- VISUAL SCENE (Left Panel) --- */
    .scene-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 70% 20%, #1e293b 0%, var(--c-sky-top) 100%);
        cursor: crosshair;
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- EDITORIAL UI (Right Panel) --- */
    .content-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem 5rem;
        background: var(--c-ui-bg);
        z-index: 10;
        border-left: 1px solid var(--c-ui-border);
    }

    /* Typography & Hierarchy */
    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--c-canopy-base);
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 30px;
        height: 2px;
        background: var(--c-canopy-base);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 5.5rem;
        line-height: 0.9;
        font-weight: 400;
        margin-bottom: 2.5rem;
        color: var(--c-ui-text);
        letter-spacing: -0.03em;
    }

    h1 em {
        font-style: italic;
        color: var(--c-canopy-base);
        display: block;
        font-size: 1.1em;
    }

    p.lead {
        font-size: 1.25rem;
        line-height: 1.6;
        color: var(--c-ui-muted);
        max-width: 520px;
        margin-bottom: 4rem;
        font-weight: 400;
    }

    /* --- DATA DASHBOARD --- */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        border-top: 1px solid var(--c-ui-border);
        padding-top: 2.5rem;
    }

    .data-point {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--c-ui-muted);
        font-weight: 600;
    }

    .data-value {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 700;
        color: var(--c-ui-text);
        letter-spacing: -0.02em;
    }

    .data-unit {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--c-ui-muted);
    }

    /* --- CONTROLS --- */
    .controls {
        margin-top: auto;
        padding-top: 4rem;
    }

    .slider-group {
        display: flex;
        align-items: center;
        gap: 1.5rem;
    }

    input[type="range"] {
        flex-grow: 1;
        height: 4px;
        background: var(--c-ui-border);
        border-radius: 2px;
        appearance: none;
        outline: none;
        transition: background 0.2s;
    }

    input[type="range"]:hover {
        background: #cbd5e1;
    }

    input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--c-canopy-base);
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 960px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: 50vh 1fr;
            overflow-y: auto;
        }
        .scene-wrapper { order: 1; }
        .content-panel { 
            order: 2; 
            padding: 2.5rem; 
            border-left: none;
            border-top: 1px solid var(--c-ui-border);
        }
        h1 { font-size: 3.5rem; }
        .dashboard { grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-wrapper" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 800">
            <defs>
                <!-- Atmospheric Gradients -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="60%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>

                <radialGradient id="sunGlow" cx="0.75" cy="0.15" r="0.7">
                    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
                    <stop offset="50%" stop-color="#d97706" stop-opacity="0.05" />
                    <stop offset="100%" stop-color="transparent" />
                </radialGradient>

                <!-- Cliff Gradients -->
                <linearGradient id="cliffFace" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="60%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>
                
                <linearGradient id="cliffHighlight" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#334155" />
                </linearGradient>

                <!-- Parachute Gradients -->
                <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fef3c7" />
                    <stop offset="20%" stop-color="#f59e0b" />
                    <stop offset="100%" stop-color="#b45309" />
                </linearGradient>

                <!-- Filters -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="12" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                
                <filter id="shadowBlur">
                    <feGaussianBlur stdDeviation="8" />
                </filter>
                
                <filter id="fogBlur">
                    <feGaussianBlur stdDeviation="15" />
                </filter>

                <!-- Patterns -->
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.1"/>
                </pattern>
            </defs>

            <!-- Background Layer -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />
            <rect width="100%" height="100%" fill="url(#sunGlow)" />
            <rect width="100%" height="100%" fill="url(#grid)" opacity="0.3" />

            <!-- Distant Mountains (Atmospheric Depth) -->
            <g opacity="0.6">
                <path d="M0,750 L200,600 L450,700 L700,550 L1000,650 L1000,800 L0,800 Z" fill="#1e293b" />
                <path d="M0,800 L300,680 L600,780 L900,650 L1000,750 L1000,800 L0,800 Z" fill="#334155" />
            </g>

            <!-- The Main Cliff (Foreground Left) -->
            <!-- Complex jagged geometry for realism -->
            <path id="main-cliff" 
                  d="M0,0 L200,0 L200,100 L250,150 L220,200 L300,280 L260,350 L350,450 L300,520 L400,650 L350,720 L450,800 L0,800 Z" 
                  fill="url(#cliffFace)" />
            
            <!-- Cliff Texture / Strata Lines -->
            <g opacity="0.2">
                <path d="M200,100 L250,150 L220,200" stroke="#475569" stroke-width="2" fill="none" />
                <path d="M300,280 L260,350 L350,450" stroke="#475569" stroke-width="3" fill="none" />
                <path d="M300,520 L400,650 L350,720" stroke="#475569" stroke-width="4" fill="none" />
            </g>

            <!-- Parachutist Group -->
            <g id="parachutist" transform="translate(650, 350)">
                
                <!-- Ground Shadow (Dynamic) -->
                <ellipse id="ground-shadow" cx="0" cy="550" rx="100" ry="25" fill="#000000" opacity="0.3" filter="url(#shadowBlur)" />

                <!-- Harness Lines -->
                <g id="lines" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" fill="none">
                    <!-- Outer Lines -->
                    <path d="M-110,-160 Q-60,-80 0,90 Q60,-80 110,-160" />
                    <!-- Inner Lines -->
                    <path d="M-70,-160 Q-30,-80 0,90 Q30,-80 70,-160" />
                    <!-- Center Lines -->
                    <path d="M-30,-160 Q-15,-80 0,90 Q15,-80 30,-160" />
                    <path d="M-10,-160 L0,90 L10,-160" />
                </g>

                <!-- The Canopy -->
                <g id="canopy-group">
                    <!-- Main Shape -->
                    <path id="canopy" 
                          d="M-140,-160 Q0,-340 140,-160 Q0,-240 -140,-160 Z" 
                          fill="url(#canopyGrad)" 
                          filter="url(#glow)" />
                    
                    <!-- Canopy Folds (Detail) -->
                    <path d="M-110,-160 Q-50,-220 0,-180 Q50,-220 110,-160" fill="none" stroke="#b45309" stroke-width="2" opacity="0.5" />
                    <path d="M-140,-160 Q-70,-200 0,-180 Q70,-200 140,-160" fill="none" stroke="#92400e" stroke-width="1" opacity="0.4" />
                </g>

                <!-- The Human Figure -->
                <g id="human">
                    <!-- Backpack -->
                    <rect x="-14" y="75" width="28" height="38" rx="4" fill="#0f172a" />
                    <!-- Body (Sleek Silhouette) -->
                    <path d="M0,90 L-10,145 L10,145 Z" fill="#020617" />
                    <!-- Limbs (Dynamic Pose) -->
                    <path d="M-10,145 L-22,185 L-14,195" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10,145 L26,180 L16,200" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M-5,95 L-26,115 L-16,128" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M5,95 L26,115 L16,128" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Helmet -->
                    <circle cx="0" cy="85" r="10" fill="#cbd5e1" />
                </g>
            </g>

            <!-- Wind / Motion Lines -->
            <g id="wind-lines" stroke="#ffffff" stroke-width="1" opacity="0.15">
                <line x1="850" y1="120" x2="920" y2="120" />
                <line x1="800" y1="280" x2="880" y2="280" />
                <line x1="860" y1="450" x2="950" y2="450" />
                <line x1="780" y1="600" x2="850" y2="600" />
            </g>
            
            <!-- Atmospheric Fog Overlay -->
            <rect width="100%" height="100%" fill="#020617" opacity="0.1" filter="url(#fogBlur)" style="mix-blend-mode: overlay;" />
        </svg>
    </div>

    <!-- CONTENT / INTERACTION -->
    <div class="content-panel">
        <div class="tag">Operation: High Altitude</div>
        
        <h1>Controlled<br><em>Descent.</em></h1>
        
        <p class="lead">
            Navigating the vertical gap between geological permanence and human fragility. 
            A study in tension, aerodynamics, and the quiet moments of freefall.
        </p>

        <div class="dashboard">
            <div class="data-point">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">4,105</span>
                <span class="data-unit">ft</span>
            </div>
            <div class="data-point">
                <span class="data-label">Wind Speed</span>
                <span class="data-value">24</span>
                <span class="data-unit">mph</span>
            </div>
            <div class="data-point">
                <span class="data-label">Canopy Load</span>
                <span class="data-value">12</span>
                <span class="data-unit">kg</span>
            </div>
        </div>

        <div class="controls">
            <div class="slider-group">
                <span class="data-label">Simulation Speed</span>
                <input type="range" id="speedControl" min="0" max="100" value="30">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const groundShadow = document.getElementById('ground-shadow');
            const altVal = document.getElementById('alt-val');
            const speedControl = document.getElementById('speedControl');
            
            let time = 0;
            let speed = 30;
            let altitude = 4105;

            // Mouse interaction for parallax effect
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Slider interaction
            speedControl.addEventListener('input', (e) => {
                speed = parseInt(e.target.value);
            });

            function animate() {
                time += 0.01 * (speed / 30);
                
                // 1. Floating Motion (Sine waves)
                // The parachute sways gently
                const swayX = Math.sin(time) * 25;
                const swayY = Math.cos(time * 0.5) * 15;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                // Using a secondary sine wave for organic lag
                const swing = Math.sin(time - 0.5) * 12;
                
                // 3. Breathing/Canopy Flex
                const flex = Math.sin(time * 4) * 8;

                // Apply transforms
                // Move the whole group based on mouse (parallax) + sway
                // Base position is centered in the visual space
                const baseX = 650 + (mouseX * 60) + swayX;
                const baseY = 350 + (mouseY * 60) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the canopy center
                // We rotate around the connection point (0, 90 in local space)
                human.setAttribute('transform', `rotate(${swing}, 0, 90)`);

                // Flex the canopy shape slightly
                const topY = -340 + flex;
                const botY = -240 + (flex * 0.5);
                canopy.setAttribute('d', `M-140,-160 Q0,${topY} 140,-160 Q0,${botY} -140,-160 Z`);

                // Dynamic Shadow (moves opposite to light source/movement)
                const shadowX = (baseX - 650) * -0.5;
                const shadowScale = 1 + (Math.sin(time) * 0.05);
                groundShadow.setAttribute('transform', `translate(${shadowX}, 0) scale(${shadowScale})`);

                // Simulate Altitude Drop based on speed
                if (speed > 10) {
                    altitude -= (speed * 0.05);
                    if (altitude < 1200) altitude = 4500; // Reset
                }
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
