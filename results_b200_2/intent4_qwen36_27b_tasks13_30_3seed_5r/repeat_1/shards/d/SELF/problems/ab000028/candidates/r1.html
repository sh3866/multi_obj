<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | High-Altitude Editorial</title>
<style>
    :root {
        /* Palette: Dramatic Slate & Amber */
        --c-sky-top: #0f172a;
        --c-sky-mid: #334155;
        --c-sky-bot: #64748b;
        
        --c-cliff-base: #020617;
        --c-cliff-light: #1e293b;
        --c-cliff-accent: #334155;
        
        --c-canopy: #f59e0b;
        --c-canopy-shadow: #b45309;
        --c-canopy-highlight: #fbbf24;
        
        --c-ui-bg: #ffffff;
        --c-ui-text: #0f172a;
        --c-ui-muted: #64748b;
        
        --font-display: "Georgia", "Times New Roman", serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-ui-bg);
        color: var(--c-ui-text);
        font-family: var(--font-body);
        overflow: hidden; /* App-like feel */
        height: 100vh;
        width: 100vw;
        display: grid;
        grid-template-columns: 1fr 1fr; /* Split screen */
    }

    /* --- VISUAL SCENE (Left Panel) --- */
    .scene-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Deep atmospheric gradient */
        background: radial-gradient(circle at 80% 20%, #475569 0%, var(--c-sky-top) 80%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- EDITORIAL UI (Right Panel) --- */
    .content-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem;
        background: var(--c-ui-bg);
        z-index: 10;
    }

    /* Typography & Hierarchy */
    .tag {
        font-family: var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--c-canopy);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 24px;
        height: 2px;
        background: var(--c-canopy);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 5rem;
        line-height: 0.9;
        font-weight: 400;
        margin-bottom: 2rem;
        color: var(--c-ui-text);
        letter-spacing: -0.03em;
    }

    h1 em {
        font-style: italic;
        color: var(--c-canopy);
        display: block;
    }

    p.lead {
        font-size: 1.125rem;
        line-height: 1.7;
        color: var(--c-ui-muted);
        max-width: 500px;
        margin-bottom: 3rem;
    }

    /* --- DATA DASHBOARD --- */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        border-top: 1px solid #e2e8f0;
        padding-top: 2.5rem;
    }

    .data-point {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .data-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--c-ui-muted);
        font-weight: 600;
    }

    .data-value {
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--c-ui-text);
        letter-spacing: -0.02em;
    }

    .data-unit {
        font-size: 0.875rem;
        font-weight: 400;
        color: var(--c-ui-muted);
    }

    /* --- CONTROLS --- */
    .controls {
        margin-top: auto;
        padding-top: 3rem;
    }

    .slider-group {
        display: flex;
        align-items: center;
        gap: 1.5rem;
    }

    input[type="range"] {
        flex-grow: 1;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        appearance: none;
        outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--c-canopy);
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 900px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: 55vh 1fr;
            overflow-y: auto; /* Allow scroll on mobile */
        }
        .scene-wrapper { order: 1; }
        .content-panel { 
            order: 2; 
            padding: 2.5rem; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.05);
        }
        h1 { font-size: 3.5rem; }
        .dashboard { grid-template-columns: 1fr 1fr; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-wrapper" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 800">
            <defs>
                <!-- Atmospheric Gradients -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0f172a" />
                    <stop offset="50%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#475569" />
                </linearGradient>

                <radialGradient id="sunGlow" cx="0.8" cy="0.2" r="0.8">
                    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2" />
                    <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.05" />
                    <stop offset="100%" stop-color="transparent" />
                </radialGradient>

                <!-- Cliff Gradients -->
                <linearGradient id="cliffFace" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="80%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#334155" />
                </linearGradient>

                <!-- Parachute Gradients -->
                <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fbbf24" />
                    <stop offset="60%" stop-color="#f59e0b" />
                    <stop offset="100%" stop-color="#b45309" />
                </linearGradient>

                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                
                <filter id="shadowBlur">
                    <feGaussianBlur stdDeviation="6" />
                </filter>
            </defs>

            <!-- Background Layer -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />
            <rect width="100%" height="100%" fill="url(#sunGlow)" />

            <!-- Distant Mountains (Atmospheric Depth) -->
            <g opacity="0.5">
                <path d="M0,700 L200,550 L400,650 L600,500 L800,600 L1000,450 L1000,800 L0,800 Z" fill="#334155" />
                <path d="M0,750 L300,650 L500,720 L700,600 L1000,650 L1000,800 L0,800 Z" fill="#475569" />
            </g>

            <!-- The Main Cliff (Foreground Left) -->
            <!-- Jagged, imposing silhouette -->
            <path id="main-cliff" 
                  d="M0,0 L180,0 L180,80 L220,120 L190,180 L260,250 L220,320 L320,400 L280,480 L380,580 L320,650 L420,800 L0,800 Z" 
                  fill="url(#cliffFace)" />
            
            <!-- Cliff Texture / Strata Lines -->
            <g opacity="0.3">
                <path d="M180,80 L220,120 L190,180" stroke="#475569" stroke-width="2" fill="none" />
                <path d="M260,250 L220,320 L320,400" stroke="#475569" stroke-width="3" fill="none" />
                <path d="M280,480 L380,580 L320,650" stroke="#475569" stroke-width="4" fill="none" />
            </g>

            <!-- Parachutist Group -->
            <g id="parachutist" transform="translate(650, 350)">
                
                <!-- Ground Shadow (Dynamic) -->
                <ellipse id="ground-shadow" cx="0" cy="550" rx="80" ry="20" fill="#000000" opacity="0.3" filter="url(#shadowBlur)" />

                <!-- Harness Lines -->
                <!-- Using multiple lines for realism -->
                <g id="lines" stroke="#f8fafc" stroke-width="1.5" opacity="0.7" fill="none">
                    <path d="M-110,-160 Q-60,-80 0,90 Q60,-80 110,-160" /> <!-- Outer -->
                    <path d="M-80,-160 Q-40,-80 0,90 Q40,-80 80,-160" /> <!-- Mid -->
                    <path d="M-40,-160 Q-20,-80 0,90 Q20,-80 40,-160" /> <!-- Inner -->
                    <path d="M-15,-160 L0,90 L15,-160" /> <!-- Center -->
                </g>

                <!-- The Canopy -->
                <g id="canopy-group">
                    <!-- Main Shape -->
                    <path id="canopy" 
                          d="M-130,-160 Q0,-320 130,-160 Q0,-220 -130,-160 Z" 
                          fill="url(#canopyGrad)" 
                          filter="url(#glow)" />
                    
                    <!-- Canopy Folds (Detail) -->
                    <path d="M-100,-160 Q-50,-220 0,-180 Q50,-220 100,-160" fill="none" stroke="#d97706" stroke-width="2" opacity="0.6" />
                    <path d="M-130,-160 Q-65,-200 0,-180 Q65,-200 130,-160" fill="none" stroke="#92400e" stroke-width="1" opacity="0.4" />
                </g>

                <!-- The Human Figure -->
                <g id="human">
                    <!-- Backpack -->
                    <rect x="-12" y="75" width="24" height="35" rx="4" fill="#1e293b" />
                    <!-- Body (Sleek Silhouette) -->
                    <path d="M0,90 L-8,140 L8,140 Z" fill="#0f172a" />
                    <!-- Limbs (Dynamic Pose) -->
                    <path d="M-8,140 L-18,175 L-12,185" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M8,140 L22,170 L12,190" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M-4,95 L-22,115 L-14,125" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M4,95 L22,115 L14,125" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Helmet -->
                    <circle cx="0" cy="85" r="9" fill="#cbd5e1" />
                </g>
            </g>

            <!-- Wind / Motion Lines -->
            <g id="wind-lines" stroke="#ffffff" stroke-width="1" opacity="0.2">
                <line x1="850" y1="120" x2="920" y2="120" />
                <line x1="800" y1="280" x2="880" y2="280" />
                <line x1="860" y1="450" x2="950" y2="450" />
                <line x1="780" y1="600" x2="850" y2="600" />
            </g>
        </svg>
    </div>

    <!-- CONTENT / INTERACTION -->
    <div class="content-panel">
        <div class="tag">Operation: High Altitude</div>
        
        <h1>Controlled<br><em>Descent.</em></h1>
        
        <p class="lead">
            Navigating the vertical gap between geological permanence and human fragility. 
            A study in tension, aerodynamics, and the quiet moments of freefall.
        </p>

        <div class="dashboard">
            <div class="data-point">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">4,105</span>
                <span class="data-unit">ft</span>
            </div>
            <div class="data-point">
                <span class="data-label">Wind Speed</span>
                <span class="data-value">24</span>
                <span class="data-unit">mph</span>
            </div>
            <div class="data-point">
                <span class="data-label">Canopy Load</span>
                <span class="data-value">12</span>
                <span class="data-unit">kg</span>
            </div>
        </div>

        <div class="controls">
            <div class="slider-group">
                <span class="data-label">Simulation Speed</span>
                <input type="range" id="speedControl" min="0" max="100" value="30">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const groundShadow = document.getElementById('ground-shadow');
            const altVal = document.getElementById('alt-val');
            const speedControl = document.getElementById('speedControl');
            
            let time = 0;
            let speed = 30;
            let altitude = 4105;

            // Mouse interaction for parallax effect
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Slider interaction
            speedControl.addEventListener('input', (e) => {
                speed = parseInt(e.target.value);
            });

            function animate() {
                time += 0.01 * (speed / 30);
                
                // 1. Floating Motion (Sine waves)
                // The parachute sways gently
                const swayX = Math.sin(time) * 25;
                const swayY = Math.cos(time * 0.5) * 15;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                // Using a secondary sine wave for organic lag
                const swing = Math.sin(time - 0.5) * 12;
                
                // 3. Breathing/Canopy Flex
                const flex = Math.sin(time * 4) * 6;

                // Apply transforms
                // Move the whole group based on mouse (parallax) + sway
                // Base position is centered in the visual space
                const baseX = 650 + (mouseX * 50) + swayX;
                const baseY = 350 + (mouseY * 50) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the canopy center
                // We rotate around the connection point (0, 90 in local space)
                human.setAttribute('transform', `rotate(${swing}, 0, 90)`);

                // Flex the canopy shape slightly
                const topY = -320 + flex;
                const botY = -220 + (flex * 0.5);
                canopy.setAttribute('d', `M-130,-160 Q0,${topY} 130,-160 Q0,${botY} -130,-160 Z`);

                // Dynamic Shadow (moves opposite to light source/movement)
                const shadowX = (baseX - 650) * -0.5;
                const shadowScale = 1 + (Math.sin(time) * 0.05);
                groundShadow.setAttribute('transform', `translate(${shadowX}, 0) scale(${shadowScale})`);

                // Simulate Altitude Drop based on speed
                if (speed > 10) {
                    altitude -= (speed * 0.05);
                    if (altitude < 1200) altitude = 4500; // Reset
                }
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
