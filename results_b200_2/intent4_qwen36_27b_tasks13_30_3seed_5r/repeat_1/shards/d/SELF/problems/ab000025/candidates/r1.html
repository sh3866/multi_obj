<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Interface: The Grip</title>
    <style>
        :root {
            --bg: #0f1012;
            --text-main: #e0e0e0;
            --text-muted: #5c6370;
            --accent: #ff4757;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            font-family: var(--font-display);
            -webkit-font-smoothing: antialiased;
        }

        /* Cinematic Grain */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #000000 120%);
            z-index: 50;
            pointer-events: none;
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Sidebar Styling */
        .sidebar {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0.9;
        }

        .title-block h1 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-main);
        }

        .title-block p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .data-list {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .data-row span:first-child {
            color: #444;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        /* Center Stage */
        .center-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The Illustration */
        #main-svg {
            height: 90vh;
            width: auto;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6));
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.01); }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
            .sidebar { display: none; } /* Hide sidebars on small screens to focus on art */
            .center-stage { height: 100%; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="container">
        <!-- Left Panel -->
        <div class="sidebar">
            <div class="title-block">
                <h1>Human Interface</h1>
                <p>Study No. 04 — The Grip</p>
            </div>
            <div class="data-list">
                <div class="data-row"><span>Subject</span> <span>Right Hand</span></div>
                <div class="data-row"><span>Device</span> <span>Titanium Black</span></div>
                <div class="data-row"><span>Lighting</span> <span>5600K Studio</span></div>
                <div class="data-row"><span>Focus</span> <span>Thumb Joint</span></div>
                <div class="data-row"><span>Render</span> <span>Vector/SVG</span></div>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                LIVE RENDER
            </div>
        </div>

        <!-- Center: The Art -->
        <div class="center-stage">
            <svg id="main-svg" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients -->
                    <linearGradient id="skinLight" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f4d0b8" />
                        <stop offset="50%" stop-color="#e0b89a" />
                        <stop offset="100%" stop-color="#c49a7c" />
                    </linearGradient>
                    <linearGradient id="skinDark" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#b58260" />
                        <stop offset="100%" stop-color="#7a4e32" />
                    </linearGradient>
                    <radialGradient id="skinHighlight" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>

                    <!-- Device Gradients -->
                    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#0a0a0a" />
                        <stop offset="50%" stop-color="#2a2a2a" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>
                    <linearGradient id="screenGloss" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                        <stop offset="40%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="blurSmall">
                        <feGaussianBlur stdDeviation="2" />
                    </filter>
                    <filter id="shadowBlur">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>
                </defs>

                <!-- Background Depth -->
                <g id="bg-layer">
                    <circle cx="250" cy="350" r="200" fill="#111" filter="url(#shadowBlur)" opacity="0.5" />
                </g>

                <!-- 1. THE HAND (BACK LAYER - Palm & Wrist) -->
                <g id="hand-palm">
                    <!-- Wrist/Palm Base -->
                    <path d="M 160 550 Q 140 700 180 750 L 320 750 Q 360 700 340 550 Z" fill="url(#skinLight)" />
                    <!-- Palm Creases -->
                    <path d="M 170 600 Q 200 650 180 700" fill="none" stroke="#a67c52" stroke-width="2" opacity="0.4" />
                    <path d="M 330 600 Q 300 650 320 700" fill="none" stroke="#a67c52" stroke-width="2" opacity="0.4" />
                </g>

                <!-- 2. THE DEVICE -->
                <g id="device" transform="translate(150, 150) rotate(-4)">
                    <!-- Drop Shadow on Palm -->
                    <rect x="20" y="20" width="130" height="400" rx="20" fill="#000" opacity="0.4" filter="url(#shadowBlur)" transform="translate(10, 10)" />

                    <!-- Main Chassis -->
                    <rect x="0" y="0" width="130" height="400" rx="20" fill="url(#phoneBody)" stroke="#333" stroke-width="1" />
                    
                    <!-- Screen -->
                    <rect x="4" y="4" width="122" height="392" rx="16" fill="#080808" />
                    
                    <!-- Screen UI (Abstract) -->
                    <g opacity="0.8">
                        <rect x="15" y="50" width="100" height="110" rx="8" fill="#111" />
                        <circle cx="65" cy="105" r="35" fill="#1a1a1a" />
                        <rect x="15" y="180" width="80" height="6" rx="3" fill="#222" />
                        <rect x="15" y="200" width="60" height="6" rx="3" fill="#222" />
                        <rect x="15" y="220" width="90" height="6" rx="3" fill="#222" />
                    </g>

                    <!-- Hardware Details -->
                    <rect x="45" y="12" width="40" height="12" rx="6" fill="#000" /> <!-- Camera Pill -->
                    <circle cx="75" cy="18" r="2.5" fill="#111" /> <!-- Lens -->
                    <rect x="55" y="26" width="20" height="2" rx="1" fill="#222" /> <!-- Speaker -->

                    <!-- Edge Highlights (Bezel) -->
                    <path d="M 2 20 Q 2 2 20 2 L 110 2 Q 128 2 128 20 L 128 380 Q 128 398 110 398 L 20 398 Q 2 398 2 380 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
                    
                    <!-- Gloss Reflection -->
                    <path d="M 0 0 L 130 0 L 130 100 L 0 200 Z" fill="url(#screenGloss)" style="mix-blend-mode: overlay;" />
                </g>

                <!-- 3. THE HAND (FRONT LAYER - Fingers & Thumb) -->
                <g id="hand-front">
                    
                    <!-- Right Side Fingers (Wrapping around) -->
                    <g id="fingers">
                        <!-- Index -->
                        <path d="M 280 220 Q 330 210 340 230 Q 345 245 280 250 Z" fill="url(#skinLight)" />
                        <!-- Middle -->
                        <path d="M 280 260 Q 340 250 350 270 Q 355 285 280 290 Z" fill="url(#skinLight)" />
                        <!-- Ring -->
                        <path d="M 280 300 Q 335 290 345 310 Q 350 325 280 330 Z" fill="url(#skinLight)" />
                        <!-- Pinky -->
                        <path d="M 280 340 Q 320 330 330 350 Q 335 365 280 370 Z" fill="url(#skinLight)" />
                    </g>

                    <!-- Finger Shadows (Contact points on phone) -->
                    <g fill="#000" opacity="0.3" style="mix-blend-mode: multiply;">
                        <path d="M 280 220 L 290 220 Q 300 235 290 250 L 280 250 Z" />
                        <path d="M 280 260 L 290 260 Q 300 275 290 290 L 280 290 Z" />
                        <path d="M 280 300 L 290 300 Q 300 315 290 330 L 280 330 Z" />
                        <path d="M 280 340 L 285 340 Q 295 355 285 370 L 280 370 Z" />
                    </g>

                    <!-- Finger Knuckles (Creases) -->
                    <g stroke="#8c5e3f" stroke-width="1.5" fill="none" opacity="0.5">
                        <path d="M 315 225 Q 320 230 315 235" />
                        <path d="M 325 265 Q 330 270 325 275" />
                        <path d="M 320 305 Q 325 310 320 315" />
                        <path d="M 305 345 Q 310 350 305 355" />
                    </g>

                    <!-- Fingernails -->
                    <g fill="#f2e6d9" opacity="0.8">
                        <ellipse cx="335" cy="232" rx="3" ry="6" transform="rotate(-10 335 232)" />
                        <ellipse cx="345" cy="272" rx="3" ry="6" transform="rotate(-5 345 272)" />
                        <ellipse cx="340" cy="312" rx="3" ry="6" transform="rotate(0 340 312)" />
                        <ellipse cx="325" cy="352" rx="3" ry="5" transform="rotate(5 325 352)" />
                    </g>

                    <!-- Thumb (The Anchor) -->
                    <g id="thumb" transform="translate(-5, 10)">
                        <!-- Thumb Base (Muscle) -->
                        <path d="M 120 500 Q 140 450 160 400 L 180 400 Q 160 460 150 510 Z" fill="url(#skinDark)" />
                        
                        <!-- Thumb Shaft -->
                        <path d="M 160 400 Q 180 340 210 310 L 230 325 Q 200 360 180 410 Z" fill="url(#skinLight)" />
                        
                        <!-- Thumb Tip (On Screen) -->
                        <path d="M 210 310 Q 240 300 250 320 Q 255 335 230 325 Z" fill="url(#skinLight)" />
                        
                        <!-- Thumb Nail -->
                        <ellipse cx="242" cy="315" rx="4" ry="7" transform="rotate(40 242 315)" fill="#f2e6d9" opacity="0.9" />
                        
                        <!-- Thumb Joint Crease -->
                        <path d="M 195 340 Q 205 345 200 355" stroke="#8c5e3f" stroke-width="2" fill="none" opacity="0.7" />
                    </g>

                    <!-- Thumb Contact Shadow on Screen -->
                    <ellipse cx="235" cy="320" rx="18" ry="12" fill="#000" opacity="0.4" transform="rotate(-15 235 320)" style="mix-blend-mode: multiply;" />

                </g>

                <!-- Global Highlights (Speculars) -->
                <g style="mix-blend-mode: screen;">
                    <!-- Thumb Knuckle Highlight -->
                    <ellipse cx="200" cy="340" rx="4" ry="10" fill="#fff" opacity="0.3" transform="rotate(30 200 340)" />
                    <!-- Phone Bezel Highlight -->
                    <path d="M 152 170 Q 152 152 170 152 L 260 152 Q 278 152 278 170" fill="none" stroke="#fff" stroke-width="1" opacity="0.4" />
                </g>

            </svg>
        </div>

        <!-- Right Panel -->
        <div class="sidebar">
            <div class="quote-block">
                <p style="font-style: italic; color: var(--text-muted); line-height: 1.6; text-align: right; font-size: 12px;">
                    "The device is no longer a tool held in the hand, but an extension of the palm."
                </p>
            </div>
            <div class="data-list" style="text-align: right;">
                <div class="data-row" style="flex-direction: row-reverse;"><span>Resolution</span> <span>Vector</span></div>
                <div class="data-row" style="flex-direction: row-reverse;"><span>Palette</span> <span>Monochrome</span></div>
                <div class="data-row" style="flex-direction: row-reverse;"><span>Mood</span> <span>Editorial</span></div>
            </div>
            <div style="text-align: right; margin-top: auto;">
                <div style="width: 40px; height: 40px; border: 1px solid #333; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;">
                    <div style="width: 8px; height: 8px; background: var(--accent); border-radius: 50%;"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
