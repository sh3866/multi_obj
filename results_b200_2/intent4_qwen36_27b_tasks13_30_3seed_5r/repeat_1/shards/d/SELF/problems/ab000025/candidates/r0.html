<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tactile Interface</title>
    <style>
        :root {
            --bg-color: #0a0b0e;
            --text-primary: #f0f2f5;
            --text-secondary: #8b9bb4;
            --accent: #ff4d4d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* Grain overlay for film texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        /* Typography & UI Elements */
        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0.8;
        }

        .header h1 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-weight: 600;
        }

        .header span {
            display: block;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .specs {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .specs div {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The SVG Container */
        #illustration-container {
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 800px;
            /* Subtle floating animation */
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Lighting effects on SVG */
        .light-sweep {
            animation: sweep 8s infinite ease-in-out;
        }

        @keyframes sweep {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, #0a0b0e 100%);
            z-index: 5;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="layout-grid">
        <!-- Left Sidebar: Context -->
        <div class="sidebar">
            <div class="header">
                <h1>Human Interface</h1>
                <span>Study No. 04 — The Grip</span>
            </div>
            <div class="specs">
                <div><span>Subject</span> <span>Right Hand</span></div>
                <div><span>Device</span> <span>Titanium/Black</span></div>
                <div><span>Lighting</span> <span>Studio 5600K</span></div>
                <div><span>Focus</span> <span>Thumb Joint</span></div>
                <div><span>Render</span> <span>Vector/SVG</span></div>
            </div>
        </div>

        <!-- Center: The Illustration -->
        <div class="center-stage">
            <svg id="illustration-container" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e0b693" />
                        <stop offset="100%" stop-color="#b58260" />
                    </linearGradient>
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#8c5e3f" />
                        <stop offset="100%" stop-color="#5a3a25" />
                    </linearGradient>
                    <radialGradient id="skinHighlight" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffdbac" />
                        <stop offset="100%" stop-color="#d4a373" stop-opacity="0" />
                    </radialGradient>

                    <!-- Device Gradients -->
                    <linearGradient id="deviceFrame" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="20%" stop-color="#4a4a4a" />
                        <stop offset="50%" stop-color="#2a2a2a" />
                        <stop offset="80%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>
                    <linearGradient id="screenReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
                        <stop offset="40%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
                    </linearGradient>
                    
                    <!-- Finger Joint Shadows -->
                    <filter id="innerShadow">
                        <feOffset dx="0" dy="2"/>
                        <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                        <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
                        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                    </filter>

                    <filter id="softBlur">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                </defs>

                <!-- Background Elements (Subtle Depth) -->
                <g id="background-layer" opacity="0.3">
                    <circle cx="250" cy="350" r="150" fill="#111" filter="url(#softBlur)" />
                </g>

                <!-- THE HAND (Back Layer) -->
                <g id="hand-back">
                    <!-- Palm/Wrist Base -->
                    <path d="M 120 450 Q 100 600 150 750 L 350 750 Q 380 600 320 450 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb (Back of hand side) -->
                    <!-- We draw the thumb base here, but the top will be in front of phone -->
                </g>

                <!-- THE DEVICE -->
                <g id="device" transform="translate(130, 150) rotate(-5)">
                    <!-- Main Body -->
                    <rect x="0" y="0" width="140" height="400" rx="20" fill="#000" stroke="url(#deviceFrame)" stroke-width="2" />
                    
                    <!-- Screen -->
                    <rect x="4" y="4" width="132" height="392" rx="16" fill="#050505" />
                    
                    <!-- Screen Content (Abstract) -->
                    <rect x="10" y="40" width="120" height="120" rx="10" fill="#111" />
                    <circle cx="70" cy="100" r="30" fill="#1a1a1a" />
                    <rect x="10" y="180" width="100" height="8" rx="4" fill="#222" />
                    <rect x="10" y="200" width="80" height="8" rx="4" fill="#222" />
                    <rect x="10" y="220" width="110" height="8" rx="4" fill="#222" />

                    <!-- Camera Notch/Island -->
                    <rect x="40" y="10" width="60" height="15" rx="7.5" fill="#000" />
                    <circle cx="85" cy="17.5" r="3" fill="#111" /> <!-- Lens -->
                    
                    <!-- Speaker -->
                    <rect x="55" y="16" width="30" height="2" rx="1" fill="#222" />

                    <!-- Reflections -->
                    <path d="M 0 0 L 140 0 L 140 400 L 0 400 Z" fill="url(#screenReflection)" style="mix-blend-mode: overlay;" />
                    <!-- Edge Highlight -->
                    <path d="M 2 20 Q 2 2 20 2 L 120 2 Q 138 2 138 20 L 138 380 Q 138 398 120 398 L 20 398 Q 2 398 2 380 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
                </g>

                <!-- THE HAND (Front Layer - Fingers & Thumb) -->
                <g id="hand-front">
                    
                    <!-- Fingers (Right side of phone) -->
                    <g id="fingers" filter="url(#innerShadow)">
                        <!-- Index Finger -->
                        <path d="M 270 200 Q 320 190 330 210 Q 335 225 280 230 L 270 230 Z" fill="url(#skinBase)" />
                        <!-- Middle Finger -->
                        <path d="M 270 240 Q 330 230 340 250 Q 345 265 280 270 L 270 270 Z" fill="url(#skinBase)" />
                        <!-- Ring Finger -->
                        <path d="M 270 280 Q 325 270 335 290 Q 340 305 280 310 L 270 310 Z" fill="url(#skinBase)" />
                        <!-- Pinky Finger -->
                        <path d="M 270 320 Q 310 310 320 330 Q 325 345 280 350 L 270 350 Z" fill="url(#skinBase)" />
                    </g>

                    <!-- Finger Knuckle Details (Creases) -->
                    <g stroke="#8c5e3f" stroke-width="1" fill="none" opacity="0.6">
                        <path d="M 305 205 Q 310 210 305 215" />
                        <path d="M 315 245 Q 320 250 315 255" />
                        <path d="M 310 285 Q 315 290 310 295" />
                        <path d="M 295 325 Q 300 330 295 335" />
                    </g>

                    <!-- Fingernails -->
                    <g fill="#f2e6d9" opacity="0.9">
                        <ellipse cx="325" cy="212" rx="3" ry="6" transform="rotate(-10 325 212)" />
                        <ellipse cx="335" cy="252" rx="3" ry="6" transform="rotate(-5 335 252)" />
                        <ellipse cx="330" cy="292" rx="3" ry="6" transform="rotate(0 330 292)" />
                        <ellipse cx="315" cy="332" rx="3" ry="5" transform="rotate(5 315 332)" />
                    </g>

                    <!-- Thumb (Wrapping from left) -->
                    <g id="thumb" filter="url(#innerShadow)">
                        <!-- Thumb Base/Connection to Palm -->
                        <path d="M 100 450 Q 120 400 140 350 L 160 350 Q 140 420 130 460 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Shaft -->
                        <path d="M 140 350 Q 160 300 180 280 L 195 295 Q 170 320 155 370 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Tip (Resting on screen) -->
                        <path d="M 180 280 Q 210 270 220 290 Q 225 305 195 295 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Nail -->
                        <ellipse cx="212" cy="285" rx="4" ry="7" transform="rotate(45 212 285)" fill="#f2e6d9" opacity="0.9" />
                        
                        <!-- Thumb Joint Crease -->
                        <path d="M 175 310 Q 185 315 180 325" stroke="#8c5e3f" stroke-width="1.5" fill="none" opacity="0.7" />
                    </g>

                    <!-- Contact Shadows (Where skin touches phone) -->
                    <g fill="#000" opacity="0.4" style="mix-blend-mode: multiply;">
                        <!-- Thumb pad shadow -->
                        <ellipse cx="205" cy="285" rx="15" ry="10" transform="rotate(-15 205 285)" />
                        <!-- Finger side shadows -->
                        <path d="M 270 200 L 280 200 Q 290 215 280 230 L 270 230 Z" />
                        <path d="M 270 240 L 285 240 Q 295 255 285 270 L 270 270 Z" />
                        <path d="M 270 280 L 280 280 Q 290 295 280 310 L 270 310 Z" />
                        <path d="M 270 320 L 275 320 Q 285 335 285 350 L 270 350 Z" />
                    </g>

                </g>

                <!-- Global Light/Specular Highlights -->
                <g class="light-sweep" style="mix-blend-mode: screen;">
                    <!-- Specular on Thumb -->
                    <ellipse cx="200" cy="280" rx="3" ry="8" fill="#fff" opacity="0.6" transform="rotate(45 200 280)" />
                    <!-- Specular on Index Finger Knuckle -->
                    <circle cx="315" cy="210" r="2" fill="#fff" opacity="0.5" />
                </g>

            </svg>
        </div>

        <!-- Right Sidebar: Meta -->
        <div class="sidebar">
            <div class="specs" style="text-align: right;">
                <p style="margin-bottom: 20px; font-style: italic; color: #666;">
                    "The device is no longer a tool held in the hand, but an extension of the palm."
                </p>
                <div><span>Resolution</span> <span>Vector</span></div>
                <div><span>Palette</span> <span>Monochrome</span></div>
                <div><span>Mood</span> <span>Editorial</span></div>
            </div>
            
            <div class="footer">
                <div style="width: 40px; height: 40px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                    <div style="width: 10px; height: 10px; background: var(--accent); border-radius: 50%;"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
