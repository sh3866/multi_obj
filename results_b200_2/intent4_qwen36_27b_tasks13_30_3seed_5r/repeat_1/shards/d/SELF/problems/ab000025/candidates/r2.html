<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Interface: The Grip</title>
    <style>
        :root {
            --bg: #050505;
            --text-main: #e8e8e8;
            --text-muted: #666666;
            --accent: #ff3b30;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            font-family: var(--font-display);
            -webkit-font-smoothing: antialiased;
        }

        /* High-End Grain */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette - tighter and deeper */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
            z-index: 90;
            pointer-events: none;
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Sidebar Styling */
        .sidebar {
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0.8;
        }

        .title-block h1 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            color: var(--text-main);
        }

        .title-block p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        .data-list {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 20px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-transform: uppercase;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent);
            animation: pulse 3s infinite ease-in-out;
        }

        /* Center Stage */
        .center-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The Illustration */
        #main-svg {
            height: 85vh;
            width: auto;
            /* Subtle floating animation */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .center-stage { height: 100%; }
            #main-svg { height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="container">
        <!-- Left Panel -->
        <div class="sidebar">
            <div class="title-block">
                <h1>Human Interface</h1>
                <p>Study No. 04 — The Grip</p>
            </div>
            <div class="data-list">
                <div class="data-row"><span>Subject</span> <span>Right Hand</span></div>
                <div class="data-row"><span>Device</span> <span>Titanium Black</span></div>
                <div class="data-row"><span>Lighting</span> <span>5600K Studio</span></div>
                <div class="data-row"><span>Focus</span> <span>Thumb Joint</span></div>
                <div class="data-row"><span>Render</span> <span>Vector/SVG</span></div>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                LIVE RENDER
            </div>
        </div>

        <!-- Center: The Art -->
        <div class="center-stage">
            <svg id="main-svg" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- SKIN TEXTURES & GRADIENTS -->
                    <!-- Soft, warm skin gradient -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f5d0b5" />
                        <stop offset="40%" stop-color="#e0b496" />
                        <stop offset="100%" stop-color="#b88f74" />
                    </linearGradient>
                    
                    <!-- Deep shadow for crevices -->
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#8a5a42" />
                        <stop offset="100%" stop-color="#5e3624" />
                    </linearGradient>

                    <!-- Specular Highlight -->
                    <radialGradient id="skinSpecular" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>

                    <!-- DEVICE MATERIALS -->
                    <!-- Titanium Bezel -->
                    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="15%" stop-color="#333333" /> <!-- Highlight -->
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="85%" stop-color="#222222" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <!-- Screen Dark Glass -->
                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#0a0a0a" />
                        <stop offset="100%" stop-color="#020202" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="blurHeavy">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>
                    <filter id="blurSoft">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="dropShadow">
                        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
                    </filter>
                </defs>

                <!-- BACKGROUND DEPTH -->
                <g id="bg-layer">
                    <!-- Subtle spotlight on hand -->
                    <ellipse cx="200" cy="350" rx="180" ry="250" fill="#ffffff" opacity="0.03" filter="url(#blurHeavy)" />
                </g>

                <!-- 1. THE HAND (BASE LAYER - Palm & Wrist) -->
                <g id="hand-palm" transform="translate(0, 0)">
                    <!-- Wrist Base -->
                    <path d="M 140 480 L 120 700 L 280 700 L 260 480 Z" fill="url(#skinBase)" />
                    
                    <!-- Palm Creases (Anatomy) -->
                    <g stroke="#a67c52" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
                        <!-- Thenar Eminence (Thumb muscle) -->
                        <path d="M 145 500 Q 160 550 140 600" />
                        <!-- Heart Line -->
                        <path d="M 250 520 Q 200 580 160 620" />
                        <!-- Head Line -->
                        <path d="M 255 550 Q 190 600 150 650" />
                    </g>

                    <!-- Palm Shadow cast by fingers -->
                    <path d="M 140 480 Q 200 460 260 480 L 260 550 Q 200 520 140 550 Z" fill="url(#skinShadow)" opacity="0.4" />
                </g>

                <!-- 2. THE DEVICE -->
                <!-- Positioned slightly rotated for dynamic feel -->
                <g id="device" transform="translate(130, 100) rotate(-6)">
                    <!-- Device Drop Shadow on Palm -->
                    <rect x="20" y="20" width="140" height="420" rx="24" fill="#000" opacity="0.5" filter="url(#blurSoft)" />

                    <!-- Main Chassis -->
                    <rect x="0" y="0" width="140" height="420" rx="24" fill="url(#titanium)" />
                    
                    <!-- Inner Bezel Depth -->
                    <rect x="2" y="2" width="136" height="416" rx="22" fill="#000" />

                    <!-- Screen -->
                    <rect x="4" y="4" width="132" height="412" rx="20" fill="url(#screenGlass)" />
                    
                    <!-- Screen Content (Abstract UI) -->
                    <g opacity="0.6">
                        <!-- App Card 1 -->
                        <rect x="12" y="80" width="116" height="140" rx="16" fill="#151515" />
                        <circle cx="70" cy="150" r="40" fill="#1a1a1a" />
                        <rect x="20" y="100" width="60" height="8" rx="4" fill="#333" />
                        
                        <!-- App Card 2 -->
                        <rect x="12" y="240" width="116" height="100" rx="16" fill="#151515" />
                        <rect x="20" y="260" width="80" height="8" rx="4" fill="#333" />
                        <rect x="20" y="280" width="50" height="8" rx="4" fill="#333" />
                    </g>

                    <!-- Hardware Details -->
                    <!-- Dynamic Island / Notch -->
                    <rect x="40" y="12" width="60" height="18" rx="9" fill="#000" />
                    <circle cx="85" cy="21" r="3" fill="#111" /> <!-- Lens -->
                    <circle cx="85" cy="21" r="1" fill="#050505" /> <!-- Aperture -->

                    <!-- Gloss Reflection (Diagonal) -->
                    <path d="M 0 0 L 140 0 L 140 80 L 0 250 Z" fill="url(#screenSpecular)" style="mix-blend-mode: overlay;" opacity="0.3" />
                </g>

                <!-- 3. THE HAND (FRONT LAYER - Fingers & Thumb) -->
                <g id="hand-front">
                    
                    <!-- RIGHT SIDE FINGERS (Wrapping around) -->
                    <!-- Using precise bezier curves for knuckle anatomy -->
                    <g id="fingers" transform="translate(0, 0)">
                        
                        <!-- Index Finger -->
                        <g transform="translate(270, 200)">
                            <path d="M 0 0 C 10 0, 30 -10, 50 -5 C 60 -2, 60 10, 50 15 C 30 20, 10 10, 0 10 Z" fill="url(#skinBase)" />
                            <!-- Knuckle Crease -->
                            <path d="M 35 -2 Q 40 5 35 12" stroke="#8c5e3f" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <!-- Nail -->
                            <ellipse cx="52" cy="5" rx="4" ry="7" transform="rotate(10)" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Middle Finger -->
                        <g transform="translate(270, 250)">
                            <path d="M 0 0 C 15 0, 40 -5, 60 0 C 70 3, 70 15, 60 20 C 40 25, 15 15, 0 15 Z" fill="url(#skinBase)" />
                            <path d="M 40 -2 Q 45 5 40 12" stroke="#8c5e3f" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="62" cy="10" rx="4" ry="8" transform="rotate(5)" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Ring Finger -->
                        <g transform="translate(270, 300)">
                            <path d="M 0 0 C 10 0, 30 -5, 50 -2 C 60 0, 60 12, 50 18 C 30 22, 10 12, 0 12 Z" fill="url(#skinBase)" />
                            <path d="M 35 0 Q 40 6 35 14" stroke="#8c5e3f" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="52" cy="8" rx="4" ry="7" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Pinky Finger -->
                        <g transform="translate(270, 350)">
                            <path d="M 0 0 C 5 0, 20 -2, 35 0 C 45 2, 45 12, 35 16 C 20 20, 5 12, 0 12 Z" fill="url(#skinBase)" />
                            <path d="M 25 0 Q 30 4 25 12" stroke="#8c5e3f" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="37" cy="8" rx="3.5" ry="6" fill="#f2e6d9" opacity="0.8" />
                        </g>
                    </g>

                    <!-- THUMB (The Anchor) -->
                    <g id="thumb" transform="translate(0, 0)">
                        <!-- Thumb Base (Thenar Eminence) -->
                        <path d="M 130 450 Q 150 420 160 380 L 180 380 Q 170 430 160 460 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Shaft -->
                        <path d="M 160 380 Q 180 320 210 290 L 230 305 Q 200 340 180 390 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Tip (Contacting Screen) -->
                        <path d="M 210 290 Q 240 280 250 300 Q 255 315 230 305 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Nail (Cropped by screen edge) -->
                        <ellipse cx="242" cy="295" rx="5" ry="8" transform="rotate(45)" fill="#f2e6d9" opacity="0.9" />
                        
                        <!-- Thumb Joint Crease -->
                        <path d="M 195 330 Q 205 335 200 345" stroke="#8c5e3f" stroke-width="2" fill="none" opacity="0.8" />
                    </g>

                    <!-- CONTACT SHADOWS (Crucial for depth) -->
                    <g fill="#000" opacity="0.5" style="mix-blend-mode: multiply;">
                        <!-- Fingers casting shadow on phone -->
                        <rect x="265" y="200" width="10" height="170" filter="url(#blurSoft)" />
                        <!-- Thumb casting shadow on screen -->
                        <ellipse cx="235" cy="300" rx="20" ry="15" transform="rotate(-20 235 300)" />
                    </g>

                </g>

                <!-- GLOBAL HIGHLIGHTS (Speculars) -->
                <g style="mix-blend-mode: screen;">
                    <!-- Thumb Knuckle Highlight -->
                    <ellipse cx="190" cy="320" rx="5" ry="12" fill="#fff" opacity="0.4" transform="rotate(45 190 320)" />
                    <!-- Phone Bezel Highlight -->
                    <path d="M 132 122 Q 132 102 152 102 L 248 102 Q 268 102 268 122" fill="none" stroke="#fff" stroke-width="1" opacity="0.3" />
                </g>

            </svg>
        </div>

        <!-- Right Panel -->
        <div class="sidebar">
            <div class="quote-block">
                <p style="font-style: italic; color: var(--text-muted); line-height: 1.8; text-align: right; font-size: 11px; font-weight: 300;">
                    "The device is no longer a tool held in the hand, but an extension of the palm."
                </p>
            </div>
            <div class="data-list" style="text-align: right;">
                <div class="data-row" style="flex-direction: row-reverse;"><span>Resolution</span> <span>Vector</span></div>
                <div class="data-row" style="flex-direction: row-reverse;"><span>Palette</span> <span>Monochrome</span></div>
                <div class="data-row" style="flex-direction: row-reverse;"><span>Mood</span> <span>Editorial</span></div>
            </div>
            <div style="text-align: right; margin-top: auto;">
                <div style="width: 40px; height: 40px; border: 1px solid #333; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;">
                    <div style="width: 6px; height: 6px; background: var(--accent); border-radius: 50%;"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
