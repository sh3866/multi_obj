<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Interface: The Grip</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text-main: #dcdcdc;
            --text-muted: #555555;
            --accent: #ff4500;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Menlo', 'Courier New', monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            font-family: var(--font-display);
            -webkit-font-smoothing: antialiased;
            cursor: crosshair;
        }

        /* Cinematic Grain Overlay */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Deep Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, #000000 120%);
            z-index: 90;
            pointer-events: none;
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Left Panel - Minimalist Data */
        .panel-left {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            color: var(--text-main);
            opacity: 0.9;
        }

        .header p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .specs {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .spec-row:hover {
            color: var(--text-main);
            padding-left: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--accent);
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .status-dot {
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        /* Right Panel - Visual & Quote */
        .panel-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 60px;
            position: relative;
        }

        .quote {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 300px;
            text-align: right;
            font-weight: 300;
            margin-bottom: 60px;
            font-style: italic;
        }

        /* Center Stage */
        .center-stage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through */
        }

        /* The Illustration */
        #main-svg {
            height: 90vh;
            width: auto;
            transform: scale(0.95);
            animation: breathe 8s ease-in-out infinite;
            filter: drop-shadow(0 0 50px rgba(0,0,0,0.8));
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.95) translateY(0); }
            50% { transform: scale(0.95) translateY(-15px); }
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; }
            .panel-left, .panel-right { display: none; }
            .center-stage { pointer-events: auto; }
            #main-svg { height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="container">
        <!-- Left Panel -->
        <div class="panel-left">
            <div class="header">
                <h1>Human Interface</h1>
                <p>Study No. 04 — The Grip</p>
            </div>
            <div class="specs">
                <div class="spec-row"><span>Subject</span> <span>Right Hand</span></div>
                <div class="spec-row"><span>Device</span> <span>Titanium Black</span></div>
                <div class="spec-row"><span>Lighting</span> <span>5600K Studio</span></div>
                <div class="spec-row"><span>Focus</span> <span>Thumb Joint</span></div>
                <div class="spec-row"><span>Render</span> <span>Vector/SVG</span></div>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                LIVE RENDER
            </div>
        </div>

        <!-- Center: The Art -->
        <div class="center-stage">
            <svg id="main-svg" viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- SKIN TEXTURES & GRADIENTS -->
                    <!-- Base Skin: Warm, natural tones -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e6cbb3" />
                        <stop offset="50%" stop-color="#d4a373" />
                        <stop offset="100%" stop-color="#b07d4f" />
                    </linearGradient>
                    
                    <!-- Deep Shadow for crevices -->
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#6e4628" />
                        <stop offset="100%" stop-color="#4a2e1b" />
                    </linearGradient>

                    <!-- Specular Highlight -->
                    <radialGradient id="skinSpecular" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>

                    <!-- DEVICE MATERIALS -->
                    <!-- Titanium Bezel -->
                    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#222222" />
                        <stop offset="20%" stop-color="#444444" /> <!-- Edge Light -->
                        <stop offset="50%" stop-color="#151515" />
                        <stop offset="80%" stop-color="#2a2a2a" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <!-- Screen Dark Glass -->
                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#121212" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="blurHeavy">
                        <feGaussianBlur stdDeviation="20" />
                    </filter>
                    <filter id="blurSoft">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>
                    <filter id="contactShadow">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                </defs>

                <!-- BACKGROUND DEPTH -->
                <g id="bg-layer">
                    <!-- Subtle spotlight on hand -->
                    <ellipse cx="250" cy="400" rx="200" ry="300" fill="#ffffff" opacity="0.04" filter="url(#blurHeavy)" />
                </g>

                <!-- 1. THE HAND (BASE LAYER - Palm & Wrist) -->
                <g id="hand-palm" transform="translate(0, 0)">
                    <!-- Wrist Base - Tapered -->
                    <path d="M 200 550 L 180 800 L 320 800 L 300 550 Z" fill="url(#skinBase)" />
                    
                    <!-- Palm Creases (Anatomy) -->
                    <g stroke="#8c5e3f" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
                        <!-- Thenar Eminence (Thumb muscle) -->
                        <path d="M 210 580 Q 230 650 200 720" />
                        <!-- Heart Line -->
                        <path d="M 310 580 Q 260 660 210 700" />
                        <!-- Head Line -->
                        <path d="M 315 620 Q 250 680 200 740" />
                    </g>

                    <!-- Palm Shadow cast by fingers -->
                    <path d="M 200 550 Q 250 530 300 550 L 300 620 Q 250 590 200 620 Z" fill="url(#skinShadow)" opacity="0.3" />
                </g>

                <!-- 2. THE DEVICE -->
                <!-- Positioned slightly rotated for dynamic feel -->
                <g id="device" transform="translate(180, 150) rotate(-4)">
                    <!-- Device Drop Shadow on Palm -->
                    <rect x="30" y="30" width="140" height="440" rx="24" fill="#000" opacity="0.6" filter="url(#blurSoft)" />

                    <!-- Main Chassis -->
                    <rect x="0" y="0" width="140" height="440" rx="24" fill="url(#titanium)" />
                    
                    <!-- Inner Bezel Depth -->
                    <rect x="2" y="2" width="136" height="436" rx="22" fill="#000" />

                    <!-- Screen -->
                    <rect x="4" y="4" width="132" height="432" rx="20" fill="url(#screenGlass)" />
                    
                    <!-- Screen Content (Abstract UI - Minimal) -->
                    <g opacity="0.5">
                        <!-- App Card 1 -->
                        <rect x="12" y="90" width="116" height="150" rx="16" fill="#1a1a1a" />
                        <circle cx="70" cy="165" r="45" fill="#222" />
                        <rect x="20" y="110" width="60" height="6" rx="3" fill="#333" />
                        
                        <!-- App Card 2 -->
                        <rect x="12" y="260" width="116" height="110" rx="16" fill="#1a1a1a" />
                        <rect x="20" y="280" width="80" height="6" rx="3" fill="#333" />
                        <rect x="20" y="295" width="50" height="6" rx="3" fill="#333" />
                    </g>

                    <!-- Hardware Details -->
                    <!-- Dynamic Island / Notch -->
                    <rect x="40" y="12" width="60" height="18" rx="9" fill="#000" />
                    <circle cx="85" cy="21" r="3" fill="#111" /> <!-- Lens -->
                    <circle cx="85" cy="21" r="1" fill="#050505" /> <!-- Aperture -->

                    <!-- Gloss Reflection (Diagonal) -->
                    <path d="M 0 0 L 140 0 L 140 100 L 0 300 Z" fill="url(#skinSpecular)" style="mix-blend-mode: overlay;" opacity="0.2" />
                </g>

                <!-- 3. THE HAND (FRONT LAYER - Fingers & Thumb) -->
                <g id="hand-front">
                    
                    <!-- RIGHT SIDE FINGERS (Wrapping around) -->
                    <!-- Using precise bezier curves for knuckle anatomy -->
                    <g id="fingers" transform="translate(0, 0)">
                        
                        <!-- Index Finger -->
                        <g transform="translate(320, 280)">
                            <path d="M 0 0 C 10 0, 30 -10, 50 -5 C 60 -2, 60 10, 50 15 C 30 20, 10 10, 0 10 Z" fill="url(#skinBase)" />
                            <!-- Knuckle Crease -->
                            <path d="M 35 -2 Q 40 5 35 12" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <!-- Nail -->
                            <ellipse cx="52" cy="5" rx="4" ry="7" transform="rotate(10)" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Middle Finger -->
                        <g transform="translate(320, 340)">
                            <path d="M 0 0 C 15 0, 40 -5, 60 0 C 70 3, 70 15, 60 20 C 40 25, 15 15, 0 15 Z" fill="url(#skinBase)" />
                            <path d="M 40 -2 Q 45 5 40 12" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="62" cy="10" rx="4" ry="8" transform="rotate(5)" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Ring Finger -->
                        <g transform="translate(320, 400)">
                            <path d="M 0 0 C 10 0, 30 -5, 50 -2 C 60 0, 60 12, 50 18 C 30 22, 10 12, 0 12 Z" fill="url(#skinBase)" />
                            <path d="M 35 0 Q 40 6 35 14" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="52" cy="8" rx="4" ry="7" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Pinky Finger -->
                        <g transform="translate(320, 460)">
                            <path d="M 0 0 C 5 0, 20 -2, 35 0 C 45 2, 45 12, 35 16 C 20 20, 5 12, 0 12 Z" fill="url(#skinBase)" />
                            <path d="M 25 0 Q 30 4 25 12" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="37" cy="8" rx="3.5" ry="6" fill="#f2e6d9" opacity="0.8" />
                        </g>
                    </g>

                    <!-- THUMB (The Anchor) -->
                    <g id="thumb" transform="translate(0, 0)">
                        <!-- Thumb Base (Thenar Eminence) -->
                        <path d="M 180 520 Q 200 490 210 450 L 230 450 Q 220 500 210 530 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Shaft -->
                        <path d="M 210 450 Q 230 390 260 360 L 280 375 Q 250 410 230 460 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Tip (Contacting Screen) -->
                        <path d="M 260 360 Q 290 350 300 370 Q 305 385 280 375 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Nail (Cropped by screen edge) -->
                        <ellipse cx="292" cy="365" rx="5" ry="8" transform="rotate(45)" fill="#f2e6d9" opacity="0.9" />
                        
                        <!-- Thumb Joint Crease -->
                        <path d="M 245 400 Q 255 405 250 415" stroke="#6e4628" stroke-width="2" fill="none" opacity="0.8" />
                    </g>

                    <!-- CONTACT SHADOWS (Crucial for depth) -->
                    <g fill="#000" opacity="0.6" style="mix-blend-mode: multiply;">
                        <!-- Fingers casting shadow on phone -->
                        <rect x="315" y="280" width="10" height="200" filter="url(#contactShadow)" />
                        <!-- Thumb casting shadow on screen -->
                        <ellipse cx="285" cy="370" rx="20" ry="15" transform="rotate(-20 285 370)" filter="url(#contactShadow)" />
                    </g>

                </g>

                <!-- GLOBAL HIGHLIGHTS (Speculars) -->
                <g style="mix-blend-mode: screen;">
                    <!-- Thumb Knuckle Highlight -->
                    <ellipse cx="240" cy="390" rx="5" ry="12" fill="#fff" opacity="0.3" transform="rotate(45 240 390)" />
                    <!-- Phone Bezel Highlight -->
                    <path d="M 182 172 Q 182 152 202 152 L 298 152 Q 318 152 318 172" fill="none" stroke="#fff" stroke-width="1" opacity="0.3" />
                </g>

            </svg>
        </div>

        <!-- Right Panel -->
        <div class="panel-right">
            <div class="quote">
                "The device is no longer a tool held in the hand, but an extension of the palm."
            </div>
            <div class="specs">
                <div class="spec-row" style="flex-direction: row-reverse;"><span>Resolution</span> <span>Vector</span></div>
                <div class="spec-row" style="flex-direction: row-reverse;"><span>Palette</span> <span>Monochrome</span></div>
                <div class="spec-row" style="flex-direction: row-reverse;"><span>Mood</span> <span>Editorial</span></div>
            </div>
        </div>
    </div>

</body>
</html>
