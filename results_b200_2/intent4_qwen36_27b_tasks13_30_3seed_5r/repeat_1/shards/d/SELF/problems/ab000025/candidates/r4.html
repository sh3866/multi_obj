<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Interface: The Grip — Redesign</title>
    <style>
        :root {
            --bg: #050505;
            --text-main: #e0e0e0;
            --text-muted: #666666;
            --accent: #ff4d00;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Menlo', 'Courier New', monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            font-family: var(--font-display);
            -webkit-font-smoothing: antialiased;
        }

        /* High-Res Noise */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Lighting Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(20,20,20,0) 0%, #000000 130%);
            z-index: 90;
            pointer-events: none;
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Typography & Panels */
        .panel {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-left { align-items: flex-start; }
        .panel-right { align-items: flex-end; text-align: right; }

        h1 {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin: 0;
            color: var(--text-main);
            opacity: 0.8;
        }

        h2 {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .specs {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted);
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        
        .panel-right .spec-row { justify-content: space-between; flex-direction: row-reverse; }

        .spec-row:hover { color: var(--text-main); }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--accent);
            letter-spacing: 2px;
            margin-top: auto;
            padding-top: 40px;
        }

        .status-dot {
            width: 3px;
            height: 3px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 3s infinite;
        }

        .quote {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 280px;
            font-weight: 300;
            margin-bottom: 40px;
            font-style: italic;
        }

        /* Center Stage */
        .center-stage {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #main-svg {
            height: 85vh;
            width: auto;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; }
            .panel { display: none; }
            .center-stage { pointer-events: auto; }
            #main-svg { height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="container">
        <!-- Left Panel -->
        <div class="panel panel-left">
            <div>
                <h1>Human Interface</h1>
                <h2>Study No. 04 — The Grip</h2>
            </div>
            <div class="specs">
                <div class="spec-row"><span>Subject</span> <span>Right Hand</span></div>
                <div class="spec-row"><span>Device</span> <span>Titanium Black</span></div>
                <div class="spec-row"><span>Lighting</span> <span>5600K Studio</span></div>
                <div class="spec-row"><span>Focus</span> <span>Thumb Joint</span></div>
                <div class="spec-row"><span>Render</span> <span>Vector/SVG</span></div>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                LIVE RENDER
            </div>
        </div>

        <!-- Center: The Art -->
        <div class="center-stage">
            <svg id="main-svg" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- ADVANCED SKIN GRADIENTS -->
                    <!-- Base Skin: Subtle radial for 3D volume -->
                    <radialGradient id="skinBase" cx="50%" cy="50%" r="75%">
                        <stop offset="0%" stop-color="#e6b89c" />
                        <stop offset="60%" stop-color="#d19a75" />
                        <stop offset="100%" stop-color="#a66d4b" />
                    </radialGradient>
                    
                    <!-- Deep Shadow: For under-curling fingers -->
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#7a4525" />
                        <stop offset="100%" stop-color="#4a2612" />
                    </linearGradient>

                    <!-- Specular: Oily skin highlight -->
                    <linearGradient id="skinSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </linearGradient>

                    <!-- DEVICE MATERIALS -->
                    <!-- Titanium Bezel: Complex reflection -->
                    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="15%" stop-color="#3d3d3d" />
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="85%" stop-color="#2b2b2b" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <!-- Screen Glass: Deep black with subtle blue tint -->
                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#0d0d0d" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="blurHeavy">
                        <feGaussianBlur stdDeviation="25" />
                    </filter>
                    <filter id="blurSoft">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="contactShadow">
                        <feGaussianBlur stdDeviation="2" />
                    </filter>
                </defs>

                <!-- BACKGROUND DEPTH -->
                <g id="bg-layer">
                    <ellipse cx="200" cy="400" rx="150" ry="250" fill="#ffffff" opacity="0.03" filter="url(#blurHeavy)" />
                </g>

                <!-- 1. THE HAND (BASE LAYER - Palm & Wrist) -->
                <g id="hand-palm">
                    <!-- Wrist: Tapered, organic -->
                    <path d="M 160 500 L 140 800 L 260 800 L 240 500 Z" fill="url(#skinBase)" />
                    
                    <!-- Palm Creases (Anatomy): Softer, darker -->
                    <g stroke="#8c5e3f" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round">
                        <!-- Thenar Eminence (Thumb muscle) -->
                        <path d="M 170 520 Q 190 600 160 680" />
                        <!-- Heart Line -->
                        <path d="M 250 520 Q 200 620 160 660" />
                        <!-- Head Line -->
                        <path d="M 255 560 Q 190 640 150 700" />
                    </g>

                    <!-- Palm Shadow cast by fingers -->
                    <path d="M 160 500 Q 200 480 240 500 L 240 580 Q 200 550 160 580 Z" fill="url(#skinShadow)" opacity="0.4" />
                </g>

                <!-- 2. THE DEVICE -->
                <!-- Rotated slightly for natural grip angle -->
                <g id="device" transform="translate(130, 150) rotate(-3)">
                    <!-- Device Drop Shadow on Palm -->
                    <rect x="20" y="20" width="140" height="440" rx="24" fill="#000" opacity="0.7" filter="url(#blurSoft)" />

                    <!-- Main Chassis -->
                    <rect x="0" y="0" width="140" height="440" rx="24" fill="url(#titanium)" />
                    
                    <!-- Inner Bezel Depth -->
                    <rect x="2" y="2" width="136" height="436" rx="22" fill="#000" />

                    <!-- Screen -->
                    <rect x="4" y="4" width="132" height="432" rx="20" fill="url(#screenGlass)" />
                    
                    <!-- Screen Content (Abstract UI - Minimal) -->
                    <g opacity="0.6">
                        <!-- App Card 1 -->
                        <rect x="12" y="80" width="116" height="160" rx="16" fill="#1a1a1a" />
                        <circle cx="70" cy="160" r="40" fill="#222" />
                        <rect x="20" y="100" width="70" height="6" rx="3" fill="#333" />
                        
                        <!-- App Card 2 -->
                        <rect x="12" y="260" width="116" height="110" rx="16" fill="#1a1a1a" />
                        <rect x="20" y="280" width="80" height="6" rx="3" fill="#333" />
                        <rect x="20" y="295" width="50" height="6" rx="3" fill="#333" />
                    </g>

                    <!-- Hardware Details -->
                    <!-- Dynamic Island / Notch -->
                    <rect x="40" y="12" width="60" height="18" rx="9" fill="#000" />
                    <circle cx="85" cy="21" r="3" fill="#111" /> <!-- Lens -->
                    <circle cx="85" cy="21" r="1" fill="#050505" /> <!-- Aperture -->

                    <!-- Gloss Reflection (Diagonal) -->
                    <path d="M 0 0 L 140 0 L 140 120 L 0 350 Z" fill="url(#skinSpecular)" style="mix-blend-mode: overlay;" opacity="0.15" />
                </g>

                <!-- 3. THE HAND (FRONT LAYER - Fingers & Thumb) -->
                <g id="hand-front">
                    
                    <!-- RIGHT SIDE FINGERS (Wrapping around) -->
                    <!-- Using precise bezier curves for knuckle anatomy -->
                    <g id="fingers" transform="translate(0, 0)">
                        
                        <!-- Index Finger -->
                        <g transform="translate(270, 280)">
                            <path d="M 0 0 C 15 0, 40 -10, 60 -5 C 70 -2, 70 10, 60 15 C 40 20, 15 10, 0 10 Z" fill="url(#skinBase)" />
                            <!-- Knuckle Crease -->
                            <path d="M 45 -2 Q 50 5 45 12" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <!-- Nail -->
                            <ellipse cx="62" cy="5" rx="4" ry="7" transform="rotate(10)" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Middle Finger -->
                        <g transform="translate(270, 340)">
                            <path d="M 0 0 C 20 0, 50 -5, 70 0 C 80 3, 80 15, 70 20 C 50 25, 20 15, 0 15 Z" fill="url(#skinBase)" />
                            <path d="M 50 -2 Q 55 5 50 12" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="72" cy="10" rx="4" ry="8" transform="rotate(5)" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Ring Finger -->
                        <g transform="translate(270, 400)">
                            <path d="M 0 0 C 15 0, 40 -5, 60 -2 C 70 0, 70 12, 60 18 C 40 22, 15 12, 0 12 Z" fill="url(#skinBase)" />
                            <path d="M 45 0 Q 50 6 45 14" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="62" cy="8" rx="4" ry="7" fill="#f2e6d9" opacity="0.8" />
                        </g>

                        <!-- Pinky Finger -->
                        <g transform="translate(270, 460)">
                            <path d="M 0 0 C 10 0, 30 -2, 45 0 C 55 2, 55 12, 45 16 C 30 20, 10 12, 0 12 Z" fill="url(#skinBase)" />
                            <path d="M 35 0 Q 40 4 35 12" stroke="#6e4628" stroke-width="1.5" fill="none" opacity="0.6"/>
                            <ellipse cx="47" cy="8" rx="3.5" ry="6" fill="#f2e6d9" opacity="0.8" />
                        </g>
                    </g>

                    <!-- THUMB (The Anchor) -->
                    <g id="thumb" transform="translate(0, 0)">
                        <!-- Thumb Base (Thenar Eminence) -->
                        <path d="M 150 520 Q 170 490 180 450 L 200 450 Q 190 500 180 530 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Shaft -->
                        <path d="M 180 450 Q 200 390 230 360 L 250 375 Q 220 410 200 460 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Tip (Contacting Screen) -->
                        <path d="M 230 360 Q 260 350 270 370 Q 275 385 250 375 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Nail (Cropped by screen edge) -->
                        <ellipse cx="262" cy="365" rx="5" ry="8" transform="rotate(45)" fill="#f2e6d9" opacity="0.9" />
                        
                        <!-- Thumb Joint Crease -->
                        <path d="M 215 400 Q 225 405 220 415" stroke="#6e4628" stroke-width="2" fill="none" opacity="0.8" />
                    </g>

                    <!-- CONTACT SHADOWS (Crucial for depth) -->
                    <g fill="#000" opacity="0.6" style="mix-blend-mode: multiply;">
                        <!-- Fingers casting shadow on phone -->
                        <rect x="265" y="280" width="10" height="200" filter="url(#contactShadow)" />
                        <!-- Thumb casting shadow on screen -->
                        <ellipse cx="235" cy="370" rx="20" ry="15" transform="rotate(-20 235 370)" filter="url(#contactShadow)" />
                    </g>

                </g>

                <!-- GLOBAL HIGHLIGHTS (Speculars) -->
                <g style="mix-blend-mode: screen;">
                    <!-- Thumb Knuckle Highlight -->
                    <ellipse cx="190" cy="390" rx="5" ry="12" fill="#fff" opacity="0.3" transform="rotate(45 190 390)" />
                    <!-- Phone Bezel Highlight -->
                    <path d="M 132 172 Q 132 152 152 152 L 248 152 Q 268 152 268 172" fill="none" stroke="#fff" stroke-width="1" opacity="0.3" />
                </g>

            </svg>
        </div>

        <!-- Right Panel -->
        <div class="panel panel-right">
            <div class="quote">
                "The device is no longer a tool held in the hand, but an extension of the palm."
            </div>
            <div class="specs">
                <div class="spec-row"><span>Resolution</span> <span>Vector</span></div>
                <div class="spec-row"><span>Palette</span> <span>Monochrome</span></div>
                <div class="spec-row"><span>Mood</span> <span>Editorial</span></div>
            </div>
        </div>
    </div>

</body>
</html>
