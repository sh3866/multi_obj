<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-color: #EBE9E4; /* Warmer, stone-like off-white */
            --text-main: #1A1A1A;
            --text-muted: #5C5C5C;
            --accent: #3E3E3E;
            --grid-line: rgba(0, 0, 0, 0.04);
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Refined Grid Background */
        .wall-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 120px 120px;
            z-index: 0;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: var(--text-main);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%;
            position: relative;
            z-index: 1;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            position: relative;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-weight: 700;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3.5rem;
            margin-top: 0.5rem;
            margin-left: 0.2rem;
        }

        .specs-container {
            margin-top: 4rem;
            display: flex;
            gap: 4rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 2rem;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.75rem;
            font-weight: 300;
            color: var(--text-main);
            line-height: 1.2;
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* SVG Container */
        .svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            height: 85vh;
            width: auto;
            /* High-end soft shadow */
            filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.08)); 
        }

        /* Interactive Elements */
        .cta-btn {
            margin-top: 3rem;
            padding: 1.1rem 2.2rem;
            background: var(--text-main);
            color: #fff;
            border: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            font-weight: 600;
            border-radius: 2px;
        }

        .cta-btn:hover {
            background: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 20px 20px;
        }

        .flush-handle-group:hover .handle-cap {
            fill: #E0E0E0;
        }

        .flush-handle-group:active {
            transform: rotate(15deg);
        }

        /* Flush Animation */
        .flush-wave {
            opacity: 0;
            transform-origin: center;
        }

        .flushing .flush-wave {
            animation: waterSuck 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes waterSuck {
            0% { opacity: 0; transform: scale(1.2); }
            20% { opacity: 1; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(0.1); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; overflow-y: auto; }
            .content-side { padding: 3rem 2rem; order: 2; }
            .visual-side { height: 60vh; order: 1; }
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 2rem; }
            .specs-container { flex-direction: column; gap: 2rem; }
            svg { height: 60vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="wall-grid"></div>

        <div class="content-side">
            <h1>
                Silence.
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <div class="svg-container">
                <!-- Improved SVG Illustration -->
                <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                    <defs>
                        <!-- Superior Ceramic Gradients -->
                        <linearGradient id="ceramicBase" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="15%" style="stop-color:#F7F7F7;stop-opacity:1" />
                            <stop offset="60%" style="stop-color:#EAEAEA;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D4D4D4;stop-opacity:1" />
                        </linearGradient>
                        
                        <linearGradient id="tankSide" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
                        </linearGradient>

                        <linearGradient id="seatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
                        </linearGradient>

                        <!-- Water Depth -->
                        <radialGradient id="waterDepth" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="60%" style="stop-color:#E1F5FE;stop-opacity:0.6" />
                            <stop offset="100%" style="stop-color:#B3E5FC;stop-opacity:0.9" />
                        </radialGradient>

                        <!-- Soft Shadows -->
                        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
                            <feOffset dx="0" dy="15" result="offsetblur"/>
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.15"/>
                            </feComponentTransfer>
                            <feMerge> 
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/> 
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Floor Shadow -->
                    <ellipse cx="300" cy="620" rx="160" ry="20" fill="#000" opacity="0.06" />
                    <ellipse cx="300" cy="620" rx="100" ry="10" fill="#000" opacity="0.1" />

                    <!-- Floor Flange (Subtle) -->
                    <rect x="285" y="600" width="30" height="15" fill="#DDD" />

                    <!-- Main Bowl Group -->
                    <g id="bowl" filter="url(#softShadow)">
                        <!-- Bowl Base -->
                        <path d="M210,320 C210,320 190,550 300,580 C410,550 390,320 390,320 Z" fill="url(#ceramicBase)" />
                        
                        <!-- Bowl Front Curve Highlight (The "Gloss") -->
                        <path d="M230,400 C220,480 260,550 300,560 C340,550 380,480 370,400 C350,450 250,450 230,400 Z" fill="white" opacity="0.5" />
                        
                        <!-- Inner Bowl Shadow -->
                        <path d="M210,320 C210,320 390,320 390,320 C390,320 370,350 300,350 C230,350 210,320 210,320 Z" fill="#D0D0D0" opacity="0.4" />
                    </g>

                    <!-- Water Surface -->
                    <ellipse cx="300" cy="330" rx="85" ry="18" fill="url(#waterDepth)" />
                    
                    <!-- Flush Animation Layer -->
                    <g id="flush-effect">
                        <circle cx="300" cy="330" r="80" fill="none" stroke="#81D4FA" stroke-width="2" class="flush-wave" />
                        <circle cx="300" cy="330" r="50" fill="none" stroke="#81D4FA" stroke-width="3" class="flush-wave" style="animation-delay: 0.1s"/>
                        <!-- Water Particles -->
                        <circle cx="280" cy="310" r="3" fill="#81D4FA" class="flush-wave" style="animation-delay: 0.05s"/>
                        <circle cx="320" cy="315" r="2" fill="#81D4FA" class="flush-wave" style="animation-delay: 0.15s"/>
                        <circle cx="290" cy="350" r="4" fill="#81D4FA" class="flush-wave" style="animation-delay: 0.05s"/>
                    </g>

                    <!-- Seat & Lid -->
                    <g id="seat">
                        <!-- Seat Base (Down) -->
                        <ellipse cx="300" cy="320" rx="95" ry="26" fill="url(#seatGrad)" stroke="#E0E0E0" stroke-width="1"/>
                        <!-- Seat Inner Rim Shadow -->
                        <ellipse cx="300" cy="320" rx="88" ry="22" fill="none" stroke="#D0D0D0" stroke-width="1" opacity="0.5"/>
                        
                        <!-- Lid (Closed/Up Visual) -->
                        <g transform="translate(300, 310) rotate(-15)">
                            <ellipse cx="0" cy="0" rx="92" ry="25" fill="url(#ceramicBase)" />
                            <!-- Lid Thickness Edge -->
                            <path d="M-92,0 A92 25 0 0 0 92,0 L92,4 A92 25 0 0 1 -92,4 Z" fill="#E0E0E0" opacity="0.8"/>
                        </g>
                    </g>

                    <!-- Tank -->
                    <g id="tank" filter="url(#softShadow)">
                        <!-- Tank Body -->
                        <rect x="230" y="100" width="140" height="180" rx="12" fill="url(#ceramicBase)" />
                        
                        <!-- Tank Side Depth (3D effect) -->
                        <path d="M370,112 L370,268 C370,274 376,280 382,280 L382,100 L370,100 Z" fill="url(#tankSide)" />
                        
                        <!-- Tank Top Highlight -->
                        <path d="M235,105 L365,105" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                        
                        <!-- Tank Front Subtle Reflection -->
                        <rect x="240" y="110" width="8" height="160" rx="4" fill="white" opacity="0.3" />
                    </g>

                    <!-- Flush Handle (Detailed) -->
                    <g id="handle" transform="translate(210, 180)">
                        <g class="flush-handle-group" onclick="triggerFlush()">
                            <!-- Stem -->
                            <rect x="0" y="18" width="4" height="10" fill="#999" />
                            <!-- Arm -->
                            <line x1="2" y1="20" x2="-15" y2="35" stroke="#C0C0C0" stroke-width="4" stroke-linecap="round" />
                            <!-- Knob -->
                            <circle cx="-15" cy="35" r="6" fill="#A0A0A0" class="handle-cap" />
                            <circle cx="-15" cy="35" r="4" fill="#E0E0E0" />
                        </g>
                    </g>

                    <!-- Context: Minimalist Plant -->
                    <g transform="translate(480, 550)">
                        <!-- Pot -->
                        <rect x="-10" y="0" width="20" height="40" fill="#D7CCC8" rx="2" />
                        <!-- Leaves (Abstract Vector) -->
                        <path d="M0,0 C-15,-20 -20,-60 0,-90 C10,-60 5,-30 0,0" fill="#B0BEC5" opacity="0.8" />
                        <path d="M0,0 C15,-30 25,-70 10,-100 C5,-70 5,-30 0,0" fill="#90A4AE" opacity="0.6" />
                    </g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
        }
    </script>
</body>
</html>
