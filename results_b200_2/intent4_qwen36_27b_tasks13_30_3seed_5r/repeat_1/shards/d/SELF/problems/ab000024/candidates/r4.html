<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-color: #F2F2F0;
            --text-main: #1A1A1A;
            --text-muted: #555555;
            --accent: #222222;
            --grid-line: rgba(0, 0, 0, 0.03);
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Architectural Grid Background */
        .wall-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 120px 120px;
            z-index: 0;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 3rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .logo::after {
            content: '';
            display: block;
            width: 40px;
            height: 4px;
            background: var(--text-main);
            margin-top: 12px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 4rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.02em;
        }

        nav a:hover {
            color: var(--text-main);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            z-index: 1;
            padding: 0 4rem;
            align-items: center;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 6rem;
            line-height: 0.9;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 4rem;
            margin-top: 0.5rem;
            margin-left: 0.2rem;
        }

        .specs-container {
            margin-top: 8rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4rem;
            padding-bottom: 3rem;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.3;
            font-family: var(--font-body);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100%;
        }

        /* SVG Container */
        .svg-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        svg {
            height: 95vh;
            width: auto;
            max-width: 100%;
        }

        /* Interactive Elements */
        .cta-btn {
            margin-top: 2rem;
            padding: 1.4rem 3.5rem;
            background: var(--text-main);
            color: #fff;
            border: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            font-weight: 600;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .cta-btn:hover {
            background: #000;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 12px 12px;
        }

        .flush-handle-group:hover .handle-cap {
            fill: #EAEAEA;
        }

        .flush-handle-group:active {
            transform: rotate(30deg);
        }

        /* Flush Animation */
        .flush-wave {
            opacity: 0;
            transform-origin: center;
        }

        .flushing .flush-wave {
            animation: waterSuck 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .flushing .water-surface {
            animation: waterLevel 1.2s ease-in-out forwards;
        }

        @keyframes waterSuck {
            0% { opacity: 0; transform: scale(1.5); }
            15% { opacity: 1; transform: scale(0.9); }
            100% { opacity: 0; transform: scale(0.05); }
        }

        @keyframes waterLevel {
            0% { transform: translateY(0); }
            60% { transform: translateY(15px); }
            100% { transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; overflow-y: auto; height: auto; display: block; }
            .content-side { padding: 4rem 2rem; order: 2; }
            .visual-side { height: 50vh; order: 1; padding: 2rem 0; }
            h1 { font-size: 4rem; }
            h1 span { font-size: 2.5rem; }
            .specs-container { grid-template-columns: 1fr; gap: 2rem; margin-top: 4rem; }
            svg { height: 45vh; }
            header { padding: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="wall-grid"></div>

        <div class="content-side">
            <h1>
                Silence.
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <div class="svg-container">
                <!-- High-Fidelity SVG Illustration -->
                <svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                    <defs>
                        <!-- Premium Ceramic Gradient (Soft White to Cool Grey) -->
                        <linearGradient id="ceramicBase" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#F7F7F7;stop-opacity:1" />
                            <stop offset="85%" style="stop-color:#E0E0E0;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Tank Side Depth -->
                        <linearGradient id="tankSide" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
                        </linearGradient>

                        <!-- Water Gradient (Deep Teal/Blue) -->
                        <radialGradient id="waterDepth" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="60%" style="stop-color:#E0F2F1;stop-opacity:0.8" />
                            <stop offset="90%" style="stop-color:#80CBC4;stop-opacity:0.9" />
                            <stop offset="100%" style="stop-color:#009688;stop-opacity:1" />
                        </radialGradient>

                        <!-- Metallic Gradient for Handle -->
                        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#D4D4D4;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
                        </linearGradient>

                        <!-- Advanced Soft Shadow -->
                        <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
                            <feOffset dx="0" dy="30" result="offsetblur"/>
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.08"/>
                            </feComponentTransfer>
                            <feMerge> 
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/> 
                            </feMerge>
                        </filter>
                        
                        <!-- Inner Shadow for Bowl Depth -->
                        <filter id="innerShadow">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
                            <feOffset dx="0" dy="8" result="offsetblur"/>
                            <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
                            <feFlood flood-color="#000" flood-opacity="0.15"/>
                            <feComposite in2="shadowDiff" operator="in"/>
                            <feComposite in2="SourceGraphic" operator="over"/>
                        </filter>
                    </defs>

                    <!-- Floor Shadow (Realistic Gradient) -->
                    <ellipse cx="250" cy="710" rx="180" ry="25" fill="#000" opacity="0.04" />
                    <ellipse cx="250" cy="710" rx="100" ry="15" fill="#000" opacity="0.08" />

                    <!-- Floor Flange (Plumbing Base) -->
                    <rect x="235" y="695" width="30" height="10" fill="#CCC" opacity="0.5" />

                    <!-- MAIN BOWL GROUP -->
                    <g id="bowl" filter="url(#softShadow)">
                        <!-- Bowl Base Shape (Refined Curves) -->
                        <path d="M170,420 C170,420 140,650 250,700 C360,650 330,420 330,420 Z" fill="url(#ceramicBase)" />
                        
                        <!-- Bowl Front Highlight (The "Gloss") -->
                        <path d="M190,500 C180,600 220,680 250,690 C280,680 320,600 310,500 C290,560 210,560 190,500 Z" fill="white" opacity="0.6" filter="blur(4px)" />
                        
                        <!-- Subtle Side Shadow -->
                        <path d="M310,500 C320,600 280,700 250,710 C250,710 360,650 330,420 C330,420 310,500 310,500 Z" fill="#000" opacity="0.03" />
                    </g>

                    <!-- Water Surface -->
                    <g class="water-surface">
                        <ellipse cx="250" cy="430" rx="75" ry="18" fill="url(#waterDepth)" />
                        <!-- Inner Bowl Shadow Ring -->
                        <path d="M175,430 A75 18 0 0 0 325,430" stroke="#000" stroke-width="3" fill="none" opacity="0.04" />
                    </g>
                    
                    <!-- Flush Animation Layer -->
                    <g id="flush-effect" transform="translate(250, 430)">
                        <circle cx="0" cy="0" r="70" fill="none" stroke="#80CBC4" stroke-width="4" class="flush-wave" />
                        <circle cx="0" cy="0" r="50" fill="none" stroke="#80CBC4" stroke-width="5" class="flush-wave" style="animation-delay: 0.1s"/>
                        <circle cx="0" cy="0" r="30" fill="#E0F2F1" opacity="0.9" class="flush-wave" style="animation-delay: 0.05s"/>
                    </g>

                    <!-- SEAT & LID -->
                    <g id="seat">
                        <!-- Seat Base (Down) -->
                        <ellipse cx="250" cy="420" rx="90" ry="26" fill="url(#ceramicBase)" stroke="#EAEAEA" stroke-width="1"/>
                        <!-- Seat Rim Highlight -->
                        <ellipse cx="250" cy="420" rx="85" ry="22" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
                        
                        <!-- Lid (Slightly Open) -->
                        <g transform="translate(250, 415) rotate(-35)">
                            <!-- Lid Body -->
                            <ellipse cx="0" cy="0" rx="88" ry="24" fill="url(#ceramicBase)" />
                            <!-- Lid Edge/Thickness -->
                            <path d="M-88,0 A88 24 0 0 0 88,0 L88,5 A88 24 0 0 1 -88,5 Z" fill="#E8E8E8" opacity="0.9"/>
                            <!-- Lid Highlight -->
                            <path d="M-70,-5 A70 20 0 0 1 70,-5" stroke="white" stroke-width="5" fill="none" opacity="0.8" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- TANK -->
                    <g id="tank" filter="url(#softShadow)">
                        <!-- Tank Body -->
                        <rect x="190" y="150" width="120" height="180" rx="10" fill="url(#ceramicBase)" />
                        
                        <!-- Tank Side Depth (3D) -->
                        <path d="M310,160 L310,320 C310,325 315,330 320,330 L320,150 L310,150 Z" fill="url(#tankSide)" />
                        
                        <!-- Tank Top Edge Highlight -->
                        <path d="M195,155 L305,155" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
                        
                        <!-- Tank Front Reflection -->
                        <rect x="200" y="160" width="10" height="160" rx="5" fill="white" opacity="0.6" />
                        
                        <!-- Connection to Bowl (Shadow) -->
                        <path d="M190,330 L310,330 L310,350 C310,360 190,360 190,350 Z" fill="#D0D0D0" opacity="0.5" />
                    </g>

                    <!-- FLUSH HANDLE (Detailed) -->
                    <g id="handle" transform="translate(165, 230)">
                        <g class="flush-handle-group" onclick="triggerFlush()">
                            <!-- Stem Base -->
                            <rect x="0" y="12" width="6" height="12" fill="#888" rx="2" />
                            <!-- Arm -->
                            <line x1="3" y1="18" x2="-20" y2="35" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round" />
                            <!-- Knob -->
                            <circle cx="-20" cy="35" r="7" fill="url(#chromeGrad)" class="handle-cap" />
                            <!-- Knob Highlight -->
                            <circle cx="-22" cy="33" r="2" fill="white" opacity="0.9" />
                        </g>
                    </g>

                    <!-- Context: Minimalist Plant -->
                    <g transform="translate(420, 600)">
                        <!-- Pot -->
                        <rect x="-12" y="0" width="24" height="50" fill="#D7CCC8" rx="3" />
                        <rect x="-12" y="0" width="24" height="5" fill="#C2B8B3" rx="2" />
                        <!-- Pot Shadow -->
                        <rect x="-12" y="0" width="12" height="50" fill="#000" opacity="0.05" />
                        
                        <!-- Leaves (Abstract, Organic) -->
                        <path d="M0,0 C-20,-35 -30,-80 0,-120 C15,-80 10,-35 0,0" fill="#B0BEC5" opacity="0.9" />
                        <path d="M0,0 C20,-40 40,-100 20,-130 C5,-100 5,-40 0,0" fill="#90A4AE" opacity="0.8" />
                        <path d="M0,0 C-10,-25 -15,-60 -5,-90 C5,-60 5,-25 0,0" fill="#CFD8DC" opacity="0.9" />
                    </g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
        }
    </script>
</body>
</html>
