<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-color: #F4F4F2; /* Warmer, more gallery-like off-white */
            --text-main: #181818;
            --text-muted: #666666;
            --accent: #000000;
            --grid-line: rgba(0, 0, 0, 0.04);
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Architectural Grid - Refined */
        .wall-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 200px 200px; /* More spacious grid */
            z-index: 0;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 3.5rem 5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .logo {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .logo::after {
            content: '';
            display: block;
            width: 50px;
            height: 6px;
            background: var(--text-main);
            margin-top: 16px;
            border-radius: 1px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 3rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--text-main);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%;
            position: relative;
            z-index: 1;
            padding: 0 5rem;
            align-items: center;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding-bottom: 4rem;
        }

        h1 {
            font-size: 7rem;
            line-height: 0.85;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 4.5rem;
            margin-top: 0.8rem;
            margin-left: 0.1rem;
        }

        .specs-container {
            margin-top: 6rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding-bottom: 3rem;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 2rem;
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            font-weight: 700;
        }

        .spec-item p {
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.4;
            font-family: var(--font-body);
            letter-spacing: -0.01em;
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100%;
        }

        /* SVG Container */
        .svg-container {
            width: 100%;
            height: 100%;
            position: relative;
            /* Scale up slightly for better impact */
            transform: scale(1.1); 
        }

        svg {
            height: 95vh;
            width: auto;
            max-width: 100%;
            overflow: visible;
        }

        /* Interactive Elements */
        .cta-btn {
            margin-top: 2rem;
            padding: 1.6rem 4rem;
            background: var(--text-main);
            color: #fff;
            border: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 600;
            border-radius: 2px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .cta-btn:hover {
            background: #000;
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.18);
        }

        /* Flush Handle Interactions */
        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 10px 10px;
        }

        .flush-handle-group:hover .handle-cap {
            fill: #F0F0F0;
        }

        .flush-handle-group:active {
            transform: rotate(35deg);
        }

        /* Flush Animation - Refined */
        .flush-wave {
            opacity: 0;
            transform-origin: center;
            stroke-dasharray: 100;
            stroke-dashoffset: 0;
        }

        .flushing .flush-wave {
            animation: waterSuck 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .flushing .water-surface {
            animation: waterLevel 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .flushing .water-foam {
            animation: foamBurst 1.4s ease-out forwards;
        }

        @keyframes waterSuck {
            0% { opacity: 0; transform: scale(1.2); stroke-width: 10; }
            20% { opacity: 1; transform: scale(0.8); stroke-width: 4; }
            100% { opacity: 0; transform: scale(0.05); stroke-width: 2; }
        }

        @keyframes waterLevel {
            0% { transform: translateY(0); }
            40% { transform: translateY(25px); }
            100% { transform: translateY(0); }
        }
        
        @keyframes foamBurst {
            0% { opacity: 0; transform: scale(0.8); }
            30% { opacity: 0.6; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; overflow-y: auto; height: auto; display: block; }
            .content-side { padding: 4rem 2rem; order: 2; }
            .visual-side { height: 60vh; order: 1; padding: 2rem 0; }
            h1 { font-size: 4.5rem; }
            h1 span { font-size: 3rem; }
            .specs-container { grid-template-columns: 1fr; gap: 2rem; margin-top: 4rem; }
            svg { height: 50vh; }
            header { padding: 2rem; }
            .svg-container { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="wall-grid"></div>

        <div class="content-side">
            <h1>
                Silence.
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <div class="svg-container">
                <!-- High-Fidelity SVG Illustration - Redesigned -->
                <svg viewBox="0 0 500 850" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                    <defs>
                        <!-- Premium Ceramic Gradient (More nuanced white/grey) -->
                        <linearGradient id="ceramicBase" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#FDFDFD;stop-opacity:1" />
                            <stop offset="80%" style="stop-color:#EAEAEA;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D4D4D4;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Tank Side Depth (Darker for contrast) -->
                        <linearGradient id="tankSide" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" />
                        </linearGradient>

                        <!-- Water Gradient (Cleaner, deeper blue) -->
                        <radialGradient id="waterDepth" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#F0F9FA;stop-opacity:0.9" />
                            <stop offset="70%" style="stop-color:#B2DFDB;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#009688;stop-opacity:0.9" />
                        </radialGradient>

                        <!-- Metallic Gradient for Handle (Chrome) -->
                        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#E0E0E0;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#A0A0A0;stop-opacity:1" />
                        </linearGradient>

                        <!-- Advanced Soft Shadow -->
                        <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="25" result="blur"/>
                            <feOffset dx="0" dy="35" result="offsetblur"/>
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.06"/>
                            </feComponentTransfer>
                            <feMerge> 
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/> 
                            </feMerge>
                        </filter>
                        
                        <!-- Inner Shadow for Bowl Depth -->
                        <filter id="innerShadow">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
                            <feOffset dx="0" dy="12" result="offsetblur"/>
                            <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
                            <feFlood flood-color="#000" flood-opacity="0.12"/>
                            <feComposite in2="shadowDiff" operator="in"/>
                            <feComposite in2="SourceGraphic" operator="over"/>
                        </filter>
                    </defs>

                    <!-- Floor Shadow (Realistic Gradient) -->
                    <ellipse cx="250" cy="780" rx="200" ry="30" fill="#000" opacity="0.03" />
                    <ellipse cx="250" cy="780" rx="120" ry="20" fill="#000" opacity="0.07" />

                    <!-- Floor Flange (Plumbing Base) -->
                    <rect x="230" y="765" width="40" height="12" fill="#CCC" opacity="0.4" />

                    <!-- MAIN BOWL GROUP -->
                    <g id="bowl" filter="url(#softShadow)">
                        <!-- Bowl Base Shape (Refined Curves, slightly wider) -->
                        <path d="M160,480 C160,480 130,720 250,780 C370,720 340,480 340,480 Z" fill="url(#ceramicBase)" />
                        
                        <!-- Bowl Front Highlight (The "Gloss") - Refined -->
                        <path d="M180,560 C170,660 210,760 250,770 C290,760 330,660 320,560 C290,620 210,620 180,560 Z" fill="white" opacity="0.7" filter="blur(6px)" />
                        
                        <!-- Subtle Side Shadow -->
                        <path d="M320,560 C330,660 290,780 250,790 C250,790 370,720 340,480 C340,480 320,560 320,560 Z" fill="#000" opacity="0.04" />
                    </g>

                    <!-- Water Surface -->
                    <g class="water-surface">
                        <ellipse cx="250" cy="490" rx="85" ry="22" fill="url(#waterDepth)" />
                        <!-- Inner Bowl Shadow Ring -->
                        <path d="M165,490 A85 22 0 0 0 335,490" stroke="#000" stroke-width="4" fill="none" opacity="0.05" />
                    </g>
                    
                    <!-- Flush Animation Layer -->
                    <g id="flush-effect" transform="translate(250, 490)">
                        <!-- Vortex Rings -->
                        <circle cx="0" cy="0" r="80" fill="none" stroke="#80CBC4" stroke-width="4" class="flush-wave" />
                        <circle cx="0" cy="0" r="60" fill="none" stroke="#80CBC4" stroke-width="5" class="flush-wave" style="animation-delay: 0.1s"/>
                        <circle cx="0" cy="0" r="40" fill="none" stroke="#80CBC4" stroke-width="6" class="flush-wave" style="animation-delay: 0.2s"/>
                        <!-- Foam Center -->
                        <circle cx="0" cy="0" r="35" fill="#E0F2F1" opacity="0.9" class="water-foam" />
                    </g>

                    <!-- SEAT & LID -->
                    <g id="seat">
                        <!-- Seat Base (Down) -->
                        <ellipse cx="250" cy="480" rx="100" ry="30" fill="url(#ceramicBase)" stroke="#EAEAEA" stroke-width="1"/>
                        <!-- Seat Rim Highlight -->
                        <ellipse cx="250" cy="480" rx="95" ry="26" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
                        
                        <!-- Lid (Slightly Open) -->
                        <g transform="translate(250, 475) rotate(-35)">
                            <!-- Lid Body -->
                            <ellipse cx="0" cy="0" rx="98" ry="28" fill="url(#ceramicBase)" />
                            <!-- Lid Edge/Thickness -->
                            <path d="M-98,0 A98 28 0 0 0 98,0 L98,6 A98 28 0 0 1 -98,6 Z" fill="#E8E8E8" opacity="0.9"/>
                            <!-- Lid Highlight -->
                            <path d="M-80,-8 A80 24 0 0 1 80,-8" stroke="white" stroke-width="6" fill="none" opacity="0.8" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- TANK -->
                    <g id="tank" filter="url(#softShadow)">
                        <!-- Tank Body -->
                        <rect x="190" y="180" width="120" height="190" rx="12" fill="url(#ceramicBase)" />
                        
                        <!-- Tank Side Depth (3D) -->
                        <path d="M310,192 L310,358 C310,364 316,370 322,370 L322,180 L310,180 Z" fill="url(#tankSide)" />
                        
                        <!-- Tank Top Edge Highlight -->
                        <path d="M196,186 L304,186" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
                        
                        <!-- Tank Front Reflection -->
                        <rect x="202" y="192" width="12" height="170" rx="6" fill="white" opacity="0.6" />
                        
                        <!-- Connection to Bowl (Shadow) -->
                        <path d="M190,370 L310,370 L310,390 C310,400 190,400 190,390 Z" fill="#D0D0D0" opacity="0.5" />
                    </g>

                    <!-- FLUSH HANDLE (Detailed) -->
                    <g id="handle" transform="translate(165, 260)">
                        <g class="flush-handle-group" onclick="triggerFlush()">
                            <!-- Stem Base -->
                            <rect x="0" y="10" width="8" height="14" fill="#888" rx="3" />
                            <!-- Arm -->
                            <line x1="4" y1="17" x2="-22" y2="38" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" />
                            <!-- Knob -->
                            <circle cx="-22" cy="38" r="8" fill="url(#chromeGrad)" class="handle-cap" />
                            <!-- Knob Highlight -->
                            <circle cx="-24" cy="36" r="2.5" fill="white" opacity="0.9" />
                        </g>
                    </g>

                    <!-- Context: Minimalist Plant (Cleaner shapes) -->
                    <g transform="translate(430, 650)">
                        <!-- Pot -->
                        <rect x="-14" y="0" width="28" height="60" fill="#D7CCC8" rx="4" />
                        <rect x="-14" y="0" width="28" height="6" fill="#C2B8B3" rx="2" />
                        <!-- Pot Shadow -->
                        <rect x="-14" y="0" width="14" height="60" fill="#000" opacity="0.05" />
                        
                        <!-- Leaves (Abstract, Organic) -->
                        <path d="M0,0 C-25,-40 -35,-90 0,-140 C20,-90 15,-40 0,0" fill="#B0BEC5" opacity="0.9" />
                        <path d="M0,0 C25,-45 45,-110 20,-140 C5,-110 5,-45 0,0" fill="#90A4AE" opacity="0.8" />
                        <path d="M0,0 C-12,-30 -18,-70 -6,-100 C6,-70 6,-30 0,0" fill="#CFD8DC" opacity="0.9" />
                    </g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
        }
    </script>
</body>
</html>
