<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-color: #F0F0EC;
            --bg-gradient: radial-gradient(circle at 70% 40%, #F7F7F5 0%, #EBEBE6 100%);
            --text-main: #1C1C1C;
            --text-muted: #666666;
            --accent: #2A2A2A;
            --grid-line: rgba(0, 0, 0, 0.04);
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Architectural Grid Background */
        .wall-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: 0;
            pointer-events: none;
            mask-image: radial-gradient(circle at 60% 50%, black 30%, transparent 90%);
        }

        /* Header */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }
        
        .logo span {
            display: block;
            width: 30px;
            height: 3px;
            background: var(--text-main);
            margin-top: 8px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 3rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.02em;
            position: relative;
        }

        nav a:hover {
            color: var(--text-main);
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--text-main);
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Main Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%;
            position: relative;
            z-index: 1;
            padding-bottom: 2rem;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 0 0 5rem;
            position: relative;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3.5rem;
            margin-top: 0.5rem;
            margin-left: 0.1rem;
        }

        .specs-container {
            margin-top: 6rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3rem;
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 2rem;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.2;
            font-family: var(--font-body);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            padding-bottom: 8vh;
        }

        /* SVG Container */
        .svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            height: 90vh;
            width: auto;
            /* No drop-shadow on SVG itself, shadows are internal */
        }

        /* Interactive Elements */
        .cta-btn {
            margin-top: 3rem;
            padding: 1.2rem 3rem;
            background: var(--text-main);
            color: #fff;
            border: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            font-weight: 600;
            border-radius: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .cta-btn:hover {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 15px 15px;
        }

        .flush-handle-group:hover .handle-cap {
            fill: #E0E0E0;
        }

        .flush-handle-group:active {
            transform: rotate(25deg);
        }

        /* Flush Animation */
        .flush-wave {
            opacity: 0;
            transform-origin: center;
        }

        .flushing .flush-wave {
            animation: waterSuck 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .flushing .water-surface {
            animation: waterLevel 1s ease-in-out forwards;
        }

        @keyframes waterSuck {
            0% { opacity: 0; transform: scale(1.2); }
            20% { opacity: 1; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(0.05); }
        }

        @keyframes waterLevel {
            0% { transform: translateY(0); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; overflow-y: auto; height: auto; display: block; }
            .content-side { padding: 3rem 2rem; order: 2; }
            .visual-side { height: 50vh; order: 1; padding-bottom: 0; }
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 2rem; }
            .specs-container { grid-template-columns: 1fr; gap: 1.5rem; }
            svg { height: 40vh; }
            header { padding: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura<span></span></div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="wall-grid"></div>

        <div class="content-side">
            <h1>
                Silence.
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <div class="svg-container">
                <!-- High-Fidelity SVG Illustration -->
                <svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                    <defs>
                        <!-- Premium Ceramic Gradient (Subtle warmth) -->
                        <linearGradient id="ceramicBase" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="20%" style="stop-color:#F9F9F9;stop-opacity:1" />
                            <stop offset="80%" style="stop-color:#EAEAEA;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#DCDCDC;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Tank Side Depth -->
                        <linearGradient id="tankSide" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#C5C5C5;stop-opacity:1" />
                        </linearGradient>

                        <!-- Water Gradient (Deep, cool blue) -->
                        <radialGradient id="waterDepth" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="70%" style="stop-color:#E8F6F8;stop-opacity:0.6" />
                            <stop offset="95%" style="stop-color:#B3E5FC;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#81D4FA;stop-opacity:1" />
                        </radialGradient>

                        <!-- Metallic Gradient for Handle -->
                        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#E0E0E0;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" />
                        </linearGradient>

                        <!-- Advanced Soft Shadow -->
                        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
                            <feOffset dx="5" dy="25" result="offsetblur"/>
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.15"/>
                            </feComponentTransfer>
                            <feMerge> 
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/> 
                            </feMerge>
                        </filter>
                        
                        <!-- Inner Shadow for Bowl Depth -->
                        <filter id="innerShadow">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
                            <feOffset dx="0" dy="6" result="offsetblur"/>
                            <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
                            <feFlood flood-color="#000" flood-opacity="0.2"/>
                            <feComposite in2="shadowDiff" operator="in"/>
                            <feComposite in2="SourceGraphic" operator="over"/>
                        </filter>
                    </defs>

                    <!-- Floor Shadow (Realistic Gradient) -->
                    <ellipse cx="300" cy="720" rx="220" ry="30" fill="#000" opacity="0.03" />
                    <ellipse cx="300" cy="720" rx="150" ry="20" fill="#000" opacity="0.06" />
                    <ellipse cx="300" cy="720" rx="80" ry="10" fill="#000" opacity="0.1" />

                    <!-- Floor Flange (Plumbing Base) -->
                    <rect x="285" y="700" width="30" height="15" fill="#CCC" opacity="0.6" />

                    <!-- MAIN BOWL GROUP -->
                    <g id="bowl" filter="url(#softShadow)">
                        <!-- Bowl Base Shape (Refined Curves) -->
                        <path d="M210,400 C210,400 190,650 300,710 C410,650 390,400 390,400 Z" fill="url(#ceramicBase)" />
                        
                        <!-- Bowl Front Highlight (The "Gloss") -->
                        <path d="M230,480 C220,580 260,680 300,690 C340,680 380,580 370,480 C350,540 250,540 230,480 Z" fill="white" opacity="0.7" filter="blur(3px)" />
                        
                        <!-- Subtle Side Shadow -->
                        <path d="M370,480 C380,580 340,690 300,710 C300,710 410,650 390,400 C390,400 370,480 370,480 Z" fill="#000" opacity="0.04" />
                    </g>

                    <!-- Water Surface -->
                    <g class="water-surface">
                        <ellipse cx="300" cy="410" rx="88" ry="20" fill="url(#waterDepth)" />
                        <!-- Inner Bowl Shadow Ring -->
                        <path d="M212,410 A88 20 0 0 0 388,410" stroke="#000" stroke-width="2" fill="none" opacity="0.05" />
                    </g>
                    
                    <!-- Flush Animation Layer -->
                    <g id="flush-effect" transform="translate(300, 410)">
                        <circle cx="0" cy="0" r="85" fill="none" stroke="#81D4FA" stroke-width="3" class="flush-wave" />
                        <circle cx="0" cy="0" r="60" fill="none" stroke="#81D4FA" stroke-width="4" class="flush-wave" style="animation-delay: 0.1s"/>
                        <circle cx="0" cy="0" r="35" fill="#E1F5FE" opacity="0.8" class="flush-wave" style="animation-delay: 0.05s"/>
                    </g>

                    <!-- SEAT & LID -->
                    <g id="seat">
                        <!-- Seat Base (Down) -->
                        <ellipse cx="300" cy="400" rx="105" ry="30" fill="url(#ceramicBase)" stroke="#EAEAEA" stroke-width="1"/>
                        <!-- Seat Rim Highlight -->
                        <ellipse cx="300" cy="400" rx="100" ry="26" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
                        
                        <!-- Lid (Slightly Open) -->
                        <g transform="translate(300, 395) rotate(-30)">
                            <!-- Lid Body -->
                            <ellipse cx="0" cy="0" rx="102" ry="28" fill="url(#ceramicBase)" />
                            <!-- Lid Edge/Thickness -->
                            <path d="M-102,0 A102 28 0 0 0 102,0 L102,6 A102 28 0 0 1 -102,6 Z" fill="#E8E8E8" opacity="0.9"/>
                            <!-- Lid Highlight -->
                            <path d="M-85,-6 A85 22 0 0 1 85,-6" stroke="white" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- TANK -->
                    <g id="tank" filter="url(#softShadow)">
                        <!-- Tank Body -->
                        <rect x="225" y="120" width="150" height="200" rx="12" fill="url(#ceramicBase)" />
                        
                        <!-- Tank Side Depth (3D) -->
                        <path d="M375,132 L375,308 C375,314 381,320 387,320 L387,120 L375,120 Z" fill="url(#tankSide)" />
                        
                        <!-- Tank Top Edge Highlight -->
                        <path d="M230,125 L370,125" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
                        
                        <!-- Tank Front Reflection -->
                        <rect x="235" y="130" width="12" height="180" rx="6" fill="white" opacity="0.5" />
                        
                        <!-- Connection to Bowl (Shadow) -->
                        <path d="M225,320 L375,320 L375,340 C375,350 225,350 225,340 Z" fill="#D0D0D0" opacity="0.5" />
                    </g>

                    <!-- FLUSH HANDLE (Detailed) -->
                    <g id="handle" transform="translate(195, 200)">
                        <g class="flush-handle-group" onclick="triggerFlush()">
                            <!-- Stem Base -->
                            <rect x="0" y="15" width="6" height="15" fill="#888" rx="2" />
                            <!-- Arm -->
                            <line x1="3" y1="22" x2="-22" y2="40" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" />
                            <!-- Knob -->
                            <circle cx="-22" cy="40" r="8" fill="url(#chromeGrad)" class="handle-cap" />
                            <!-- Knob Highlight -->
                            <circle cx="-24" cy="38" r="2.5" fill="white" opacity="0.9" />
                        </g>
                    </g>

                    <!-- Context: Minimalist Plant (Better Craft) -->
                    <g transform="translate(490, 620)">
                        <!-- Pot -->
                        <rect x="-15" y="0" width="30" height="60" fill="#D7CCC8" rx="4" />
                        <rect x="-15" y="0" width="30" height="6" fill="#C2B8B3" rx="3" />
                        <!-- Pot Shadow -->
                        <rect x="-15" y="0" width="15" height="60" fill="#000" opacity="0.05" />
                        
                        <!-- Leaves (Abstract, Organic) -->
                        <path d="M0,0 C-25,-40 -35,-100 0,-150 C20,-100 15,-40 0,0" fill="#B0BEC5" opacity="0.9" />
                        <path d="M0,0 C25,-50 50,-120 25,-160 C10,-120 5,-40 0,0" fill="#90A4AE" opacity="0.8" />
                        <path d="M0,0 C-15,-30 -20,-80 -10,-120 C5,-80 5,-30 0,0" fill="#CFD8DC" opacity="0.9" />
                    </g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
        }
    </script>
</body>
</html>
