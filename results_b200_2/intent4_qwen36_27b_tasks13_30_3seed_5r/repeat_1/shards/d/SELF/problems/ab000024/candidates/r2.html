<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-color: #EBE9E4;
            --bg-gradient: radial-gradient(circle at 60% 50%, #F2F0EB 0%, #EBE9E4 100%);
            --text-main: #1A1A1A;
            --text-muted: #6E6E6E;
            --accent: #2C2C2C;
            --grid-line: rgba(0, 0, 0, 0.03);
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Refined Grid Background */
        .wall-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 140px 140px;
            z-index: 0;
            pointer-events: none;
            mask-image: radial-gradient(circle at 60% 50%, black 40%, transparent 100%);
        }

        /* Header */
        header {
            padding: 3rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
            position: relative;
        }
        
        .logo::after {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-main);
            margin-top: 6px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 3rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            letter-spacing: 0.02em;
        }

        nav a:hover {
            color: var(--text-main);
        }

        /* Main Layout */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            z-index: 1;
            padding-bottom: 2rem;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 0 0 4rem;
            position: relative;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3.2rem;
            margin-top: 0.2rem;
            margin-left: 0.1rem;
        }

        .specs-container {
            margin-top: 5rem;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2rem;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 2rem;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.3;
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            padding-bottom: 5vh;
        }

        /* SVG Container */
        .svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            height: 85vh;
            width: auto;
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.06)); 
        }

        /* Interactive Elements */
        .cta-btn {
            margin-top: 4rem;
            padding: 1.2rem 2.5rem;
            background: var(--text-main);
            color: #fff;
            border: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            font-weight: 600;
            border-radius: 2px;
        }

        .cta-btn:hover {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .flush-handle-group {
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 15px 15px;
        }

        .flush-handle-group:hover .handle-cap {
            fill: #EAEAEA;
        }

        .flush-handle-group:active {
            transform: rotate(20deg);
        }

        /* Flush Animation */
        .flush-wave {
            opacity: 0;
            transform-origin: center;
        }

        .flushing .flush-wave {
            animation: waterSuck 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes waterSuck {
            0% { opacity: 0; transform: scale(1.3); }
            10% { opacity: 1; transform: scale(0.9); }
            100% { opacity: 0; transform: scale(0.1); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            .content-side { padding: 3rem 2rem; order: 2; }
            .visual-side { height: 60vh; order: 1; padding-bottom: 0; }
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 2rem; }
            .specs-container { grid-template-columns: 1fr; gap: 1.5rem; }
            svg { height: 40vh; }
            header { padding: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="wall-grid"></div>

        <div class="content-side">
            <h1>
                Silence.
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Matte White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <div class="svg-container">
                <!-- High-Fidelity SVG Illustration -->
                <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                    <defs>
                        <!-- Premium Ceramic Gradient (Subtle warmth) -->
                        <linearGradient id="ceramicBase" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#F9F9F9;stop-opacity:1" />
                            <stop offset="85%" style="stop-color:#E5E5E5;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D8D8D8;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Tank Side Depth -->
                        <linearGradient id="tankSide" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#C8C8C8;stop-opacity:1" />
                        </linearGradient>

                        <!-- Water Gradient (Deep, cool blue) -->
                        <radialGradient id="waterDepth" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="60%" style="stop-color:#E1F5FE;stop-opacity:0.4" />
                            <stop offset="90%" style="stop-color:#B3E5FC;stop-opacity:0.7" />
                            <stop offset="100%" style="stop-color:#81D4FA;stop-opacity:0.9" />
                        </radialGradient>

                        <!-- Metallic Gradient for Handle -->
                        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#D0D0D0;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
                        </linearGradient>

                        <!-- Advanced Soft Shadow -->
                        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
                            <feOffset dx="0" dy="20" result="offsetblur"/>
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.12"/>
                            </feComponentTransfer>
                            <feMerge> 
                                <feMergeNode/>
                                <feMergeNode in="SourceGraphic"/> 
                            </feMerge>
                        </filter>
                        
                        <!-- Inner Shadow for Bowl Depth -->
                        <filter id="innerShadow">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
                            <feOffset dx="0" dy="5" result="offsetblur"/>
                            <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
                            <feFlood flood-color="black" flood-opacity="0.15"/>
                            <feComposite in2="shadowDiff" operator="in"/>
                            <feComposite in2="SourceGraphic" operator="over"/>
                        </filter>
                    </defs>

                    <!-- Floor Shadow (Realistic Gradient) -->
                    <ellipse cx="300" cy="660" rx="180" ry="25" fill="#000" opacity="0.04" />
                    <ellipse cx="300" cy="660" rx="120" ry="15" fill="#000" opacity="0.08" />
                    <ellipse cx="300" cy="660" rx="60" ry="8" fill="#000" opacity="0.12" />

                    <!-- Floor Flange -->
                    <rect x="285" y="645" width="30" height="15" fill="#DDD" opacity="0.5" />

                    <!-- MAIN BOWL GROUP -->
                    <g id="bowl" filter="url(#softShadow)">
                        <!-- Bowl Base Shape -->
                        <path d="M220,380 C220,380 200,600 300,640 C400,600 380,380 380,380 Z" fill="url(#ceramicBase)" />
                        
                        <!-- Bowl Front Highlight (The "Gloss") -->
                        <path d="M240,450 C230,530 270,610 300,620 C330,610 370,530 360,450 C340,500 260,500 240,450 Z" fill="white" opacity="0.6" filter="blur(2px)" />
                        
                        <!-- Subtle Side Shadow -->
                        <path d="M360,450 C370,530 330,610 300,620 C300,620 380,600 380,380 C380,380 360,450 360,450 Z" fill="#000" opacity="0.05" />
                    </g>

                    <!-- Water Surface -->
                    <ellipse cx="300" cy="390" rx="82" ry="18" fill="url(#waterDepth)" />
                    
                    <!-- Flush Animation Layer (Hidden until triggered) -->
                    <g id="flush-effect" transform="translate(300, 390)">
                        <circle cx="0" cy="0" r="80" fill="none" stroke="#81D4FA" stroke-width="2" class="flush-wave" />
                        <circle cx="0" cy="0" r="50" fill="none" stroke="#81D4FA" stroke-width="3" class="flush-wave" style="animation-delay: 0.1s"/>
                        <!-- Water Particles -->
                        <circle cx="-20" cy="-10" r="3" fill="#81D4FA" class="flush-wave" style="animation-delay: 0.05s"/>
                        <circle cx="20" cy="-5" r="2" fill="#81D4FA" class="flush-wave" style="animation-delay: 0.15s"/>
                        <circle cx="0" cy="10" r="4" fill="#81D4FA" class="flush-wave" style="animation-delay: 0.05s"/>
                    </g>

                    <!-- SEAT & LID -->
                    <g id="seat">
                        <!-- Seat Base (Down) -->
                        <ellipse cx="300" cy="380" rx="98" ry="28" fill="url(#ceramicBase)" stroke="#EAEAEA" stroke-width="1"/>
                        <!-- Seat Rim Highlight -->
                        <ellipse cx="300" cy="380" rx="94" ry="24" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
                        
                        <!-- Lid (Slightly Open) -->
                        <!-- Using a group to rotate the lid naturally -->
                        <g transform="translate(300, 375) rotate(-25)">
                            <!-- Lid Body -->
                            <ellipse cx="0" cy="0" rx="96" ry="26" fill="url(#ceramicBase)" />
                            <!-- Lid Edge/Thickness -->
                            <path d="M-96,0 A96 26 0 0 0 96,0 L96,5 A96 26 0 0 1 -96,5 Z" fill="#E8E8E8" opacity="0.9"/>
                            <!-- Lid Highlight -->
                            <path d="M-80,-5 A80 20 0 0 1 80,-5" stroke="white" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- TANK -->
                    <g id="tank" filter="url(#softShadow)">
                        <!-- Tank Body -->
                        <rect x="230" y="140" width="140" height="190" rx="15" fill="url(#ceramicBase)" />
                        
                        <!-- Tank Side Depth (3D) -->
                        <path d="M370,155 L370,315 C370,321 376,327 382,327 L382,140 L370,140 Z" fill="url(#tankSide)" />
                        
                        <!-- Tank Top Edge Highlight -->
                        <path d="M235,145 L365,145" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                        
                        <!-- Tank Front Reflection -->
                        <rect x="240" y="150" width="10" height="170" rx="5" fill="white" opacity="0.4" />
                        
                        <!-- Connection to Bowl (Shadow) -->
                        <path d="M230,330 L370,330 L370,350 C370,360 230,360 230,350 Z" fill="#D0D0D0" opacity="0.4" />
                    </g>

                    <!-- FLUSH HANDLE (Detailed) -->
                    <g id="handle" transform="translate(205, 220)">
                        <g class="flush-handle-group" onclick="triggerFlush()">
                            <!-- Stem Base -->
                            <rect x="0" y="15" width="5" height="12" fill="#888" rx="2" />
                            <!-- Arm -->
                            <line x1="2.5" y1="20" x2="-18" y2="38" stroke="url(#chromeGrad)" stroke-width="5" stroke-linecap="round" />
                            <!-- Knob -->
                            <circle cx="-18" cy="38" r="7" fill="url(#chromeGrad)" class="handle-cap" />
                            <!-- Knob Highlight -->
                            <circle cx="-20" cy="36" r="2" fill="white" opacity="0.8" />
                        </g>
                    </g>

                    <!-- Context: Minimalist Plant (Better Craft) -->
                    <g transform="translate(480, 580)">
                        <!-- Pot -->
                        <rect x="-12" y="0" width="24" height="50" fill="#D7CCC8" rx="3" />
                        <rect x="-12" y="0" width="24" height="5" fill="#C2B8B3" rx="2" />
                        
                        <!-- Leaves (Abstract, Organic) -->
                        <path d="M0,0 C-20,-30 -30,-80 0,-120 C15,-80 10,-30 0,0" fill="#B0BEC5" opacity="0.9" />
                        <path d="M0,0 C20,-40 40,-90 20,-130 C10,-90 5,-30 0,0" fill="#90A4AE" opacity="0.8" />
                        <path d="M0,0 C-10,-20 -15,-60 -5,-90 C5,-60 5,-20 0,0" fill="#CFD8DC" opacity="0.9" />
                    </g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            
            // Reset animation
            effect.classList.remove('flushing');
            void effect.offsetWidth; // Trigger reflow
            
            // Add animation class
            effect.classList.add('flushing');
        }
    </script>
</body>
</html>
