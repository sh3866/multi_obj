<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Nexus // Rebuilt</title>
    <style>
        :root {
            /* Palette: Deep Void & Neon Amber */
            --bg-app: #09090b;
            --bg-panel: #131318;
            --bg-panel-highlight: #1c1c24;
            --bg-glass: rgba(19, 19, 24, 0.7);
            
            --primary: #ffb703;
            --primary-dim: rgba(255, 183, 3, 0.15);
            --primary-glow: rgba(255, 183, 3, 0.4);
            
            --accent: #00f5d4;
            --accent-dim: rgba(0, 245, 212, 0.15);
            
            --status-online: #2ec4b6;
            --status-ingame: #4361ee;
            --status-party: #f72585;
            --status-offline: #4a4e69;
            
            --text-main: #ffffff;
            --text-sub: #94a1b2;
            --text-dim: #5f6368;
            
            --danger: #ef233c;
            
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 24px;
            
            --border: 1px solid rgba(255,255,255,0.08);
            --border-hover: 1px solid rgba(255,255,255,0.2);
            
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Consolas', 'Monaco', monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1d29 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* --- Layout --- */
        .app-container {
            width: 96vw;
            height: 92vh;
            max-width: 1600px;
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 24px;
            position: relative;
        }

        .panel {
            background: var(--bg-panel);
            border: var(--border);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            position: relative;
        }

        /* --- Typography & Utilities --- */
        h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.5px; }
        .text-muted { color: var(--text-sub); }
        .text-xs { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .mono { font-family: var(--font-mono); }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-center { display: flex; justify-content: center; align-items: center; }
        
        .btn {
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Left Column: Profile & Party --- */
        .profile-header {
            padding: 30px 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            border-bottom: var(--border);
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow behind avatar */
        .profile-header::before {
            content: '';
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            width: 150px; height: 150px;
            background: var(--primary);
            filter: blur(60px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 0;
        }

        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            z-index: 1;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-dim);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #222;
            overflow: hidden;
            border: 2px solid var(--bg-panel);
        }

        .level-pill {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-panel);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 9px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 1px;
            z-index: 2;
        }

        .player-identity {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .player-identity h2 { font-size: 20px; margin-bottom: 4px; }
        .player-title { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; display: block; }

        .profile-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-ghost {
            background: rgba(255,255,255,0.05);
            color: var(--text-sub);
            padding: 8px;
            flex: 1;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

        /* Party Section */
        .party-section {
            padding: 20px;
            flex: 1;
        }
        .section-header {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .party-count { color: var(--text-dim); font-size: 12px; font-family: var(--font-mono); }

        .party-slot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-panel-highlight);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        /* Active Party Highlight */
        .party-slot.active-party {
            border-left: 3px solid var(--status-party);
            background: linear-gradient(90deg, rgba(247, 37, 133, 0.1) 0%, transparent 100%);
        }

        .mini-avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #333;
            position: relative;
            flex-shrink: 0;
        }
        
        .status-indicator {
            position: absolute;
            bottom: -1px; right: -1px;
            width: 8px; height: 8px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
        }

        .slot-info { flex: 1; overflow: hidden; }
        .slot-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-role { font-size: 10px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }

        .slot-action {
            opacity: 0;
            transition: opacity 0.2s;
            color: var(--text-sub);
        }
        .party-slot:hover .slot-action { opacity: 1; }
        .party-slot:hover { background: #222; }

        /* --- Center Column: Friends List --- */
        .search-area {
            padding: 20px;
            border-bottom: var(--border);
            background: rgba(0,0,0,0.2);
        }
        .search-box {
            position: relative;
        }
        .search-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 15px 10px 40px;
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-dim);
        }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: var(--text-dim); width: 14px; height: 14px;
        }

        .tabs {
            display: flex;
            padding: 0 20px;
            background: rgba(0,0,0,0.1);
            border-bottom: var(--border);
        }
        .tab {
            padding: 15px 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .tab:hover { color: var(--text-sub); }
        .tab.active {
            color: var(--primary);
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary);
            box-shadow: 0 -2px 5px var(--primary-dim);
        }
        .badge {
            background: var(--danger);
            color: white;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 700;
        }

        .list-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        /* Custom Scrollbar */
        .list-area::-webkit-scrollbar { width: 4px; }
        .list-area::-webkit-scrollbar-track { background: transparent; }
        .list-area::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 4px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .friend-item:hover {
            background: rgba(255,255,255,0.03);
        }
        .friend-item.selected {
            background: var(--bg-panel-highlight);
            border-color: var(--primary-dim);
        }
        .friend-item.selected .friend-name { color: var(--primary); }

        .friend-avatar {
            width: 44px; height: 44px;
            border-radius: 8px;
            background: #222;
            margin-right: 15px;
            position: relative;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .friend-avatar svg { width: 100%; height: 100%; }

        .friend-info { flex: 1; }
        .friend-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; transition: color 0.2s; }
        .friend-status-text { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
        
        .action-icons {
            display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s;
        }
        .friend-item:hover .action-icons { opacity: 1; }
        .icon-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--primary); color: #000; }

        /* --- Right Column: Detail Panel --- */
        .detail-panel {
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, var(--bg-panel) 100%);
        }

        .detail-header {
            height: 160px;
            position: relative;
            border-bottom: var(--border);
            overflow: hidden;
        }
        .detail-header-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, var(--primary-dim), transparent 70%);
            opacity: 0.5;
        }
        .detail-header-content {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(0deg, var(--bg-panel) 10%, transparent);
        }

        .detail-avatar-wrap {
            width: 70px; height: 70px;
            border-radius: 12px;
            border: 2px solid var(--bg-panel);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: absolute;
            bottom: -35px; left: 20px;
            background: #222;
            z-index: 10;
        }

        .detail-body {
            padding: 45px 20px 20px; /* Top padding clears avatar */
            flex: 1;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 12px 5px;
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .stat-val { display: block; font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .stat-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-main {
            grid-column: span 2;
            background: var(--primary);
            color: #000;
            padding: 12px;
            font-weight: 800;
            border-radius: var(--radius-sm);
            box-shadow: 0 0 15px var(--primary-dim);
            position: relative;
            overflow: hidden;
        }
        .btn-main::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }

        .btn-action {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-action:hover { background: rgba(255,255,255,0.1); border-color: var(--text-sub); }
        
        .btn-danger { border-color: rgba(239, 35, 60, 0.3); color: var(--danger); }
        .btn-danger:hover { background: rgba(239, 35, 60, 0.1); border-color: var(--danger); }

        .activity-log {
            margin-top: 30px;
            border-top: var(--border);
            padding-top: 15px;
        }
        .log-item {
            display: flex; gap: 10px;
            font-size: 12px; margin-bottom: 12px;
            color: var(--text-sub);
        }
        .log-icon { color: var(--accent); margin-top: 2px; }
        .log-time { margin-left: auto; color: var(--text-dim); font-size: 10px; }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- LEFT: Profile & Party -->
        <div class="panel">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar-ring"></div>
                    <div class="avatar-img" id="myAvatar"></div>
                    <div class="level-pill">LVL 42</div>

                <div class="player-identity">

                    <span class="player-title">Cybernetic Ranger</span>

            </div>

            <div class="party-section">
                <div class="section-header">
                    <span class="text-xs text-muted">Active Party</span>
                    <span class="party-count">3/4</span>

                <!-- Party Member 1 (Active) -->
                <div class="party-slot active-party">
                    <div class="mini-avatar" id="party1Avatar">
                        <div class="status-indicator" style="background: var(--status-online);"></div>

                    </div>
                    <div class="slot-action">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

                    </div>
                    <div class="slot-info">

                        <div class="slot-role">

                    <div class="slot-action">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>

                </div>

                <!-- Empty Slot -->
                <div class="party-slot" style="opacity: 0.4; border-style: dashed;">
                    <div class="mini-avatar" style="display:flex; align-items:center; justify-content:center; background: transparent;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    </div>
                    <div class="slot-info">
                        <div class="slot-name">Open Slot</div>
                        <div class="slot-role">Waiting...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER: Friends List -->
        <div class="panel">
            <div class="search-area">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="search-input" placeholder="Search friends or callsign...">
                </div>
            </div>

            <div class="tabs">
                <div class="tab active">All Friends</div>
                <div class="tab">Online <span style="color:var(--status-online); margin-left:4px;">12</span></div>
                <div class="tab">Requests <span class="badge">2</span></div>
            </div>

            <div class="list-area" id="friendsList">
                <!-- JS Injected -->
            </div>
        </div>

        <!-- RIGHT: Detail Panel -->
        <div class="panel detail-panel">
            <div class="detail-header">
                <div class="detail-header-bg"></div>
                <div class="detail-header-content flex-between">

                        <svg class="log-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        <span>Unlocked "Cyber Ninja"</span>
                        <span class="log-time">1h ago</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Data ---
        const friends = [
            { id: 1, name: "BladeRunner", role: "Assassin", status: "online", lvl: 88, wins: 1204, kd: "4.2", date: "2023", color: "#ef233c", shape: 0 },
            { id: 2, name: "Glitch_Witch", role: "Support", status: "online", lvl: 45, wins: 340, kd: "1.1", date: "2024", color: "#9b59b6", shape: 1 },
            { id: 3, name: "HeavyMetal", role: "Tank", status: "ingame", lvl: 92, wins: 5600, kd: "2.8", date: "2021", color: "#f39c12", shape: 2 },
            { id: 4, name: "ZeroCool", role: "Hacker", status: "offline", lvl: 12, wins: 45, kd: "0.8", date: "2024", color: "#3498db", shape: 3 },
            { id: 5, name: "NeonSpectre", role: "Sniper", status: "online", lvl: 67, wins: 890, kd: "3.5", date: "2022", color: "#2ec4b6", shape: 0 },
            { id: 6, name: "CyberPunk99", role: "Ranger", status: "online", lvl: 55, wins: 600, kd: "1.9", date: "2023", color: "#e67e22", shape: 1 },
            { id: 7, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, wins: 120, kd: "1.2", date: "2023", color: "#34495e", shape: 2 },
            { id: 8, name: "PixelPioneer", role: "Eng", status: "ingame", lvl: 74, wins: 1500, kd: "2.1", date: "2022", color: "#1abc9c", shape: 3 },
            { id: 9, name: "StarDust", role: "Scout", status: "online", lvl: 41, wins: 210, kd: "1.5", date: "2024", color: "#ff7979", shape: 0 },
        ];

        // --- Graphics Generators ---
        function getAvatarSVG(color, shapeType) {
            const shapes = [
                // Circle / Face
                `<circle cx="24" cy="24" r="12" fill="${color}"/><circle cx="24" cy="24" r="18" stroke="${color}" stroke-width="2" fill="none" opacity="0.5"/>`,
                // Square / Tech
                `<rect x="10" y="10" width="28" height="28" rx="4" fill="${color}"/><rect x="16" y="16" width="16" height="16" fill="#131318"/>`,
                // Triangle / Hazard
                `<polygon points="24,6 42,40 6,40" fill="${color}"/>`,
                // Hexagon / Sci-fi
                `<path d="M24 6 L40 15 L40 33 L24 42 L8 33 L8 15 Z" fill="none" stroke="${color}" stroke-width="3"/><circle cx="24" cy="24" r="4" fill="${color}"/>`
            ];
            return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">${shapes[shapeType % shapes.length]}</svg>`;
        }

        function getStatusColor(status) {
            if(status === 'online') return 'var(--status-online)';
            if(status === 'ingame') return 'var(--status-ingame)';
            return 'var(--status-offline)';
        }

        // --- Render Logic ---
        const listContainer = document.getElementById('friendsList');
        
        function renderList() {
            listContainer.innerHTML = '';
            friends.forEach((friend) => {
                const el = document.createElement('div');
                el.className = 'friend-item fade-in';
                el.onclick = () => selectFriend(friend, el);
                
                // Generate Avatar
                const avatarHTML = getAvatarSVG(friend.color, friend.shape);
                const statusColor = getStatusColor(friend.status);
                const statusText = friend.status === 'ingame' ? 'In Match' : friend.status.charAt(0).toUpperCase() + friend.status.slice(1);

                el.innerHTML = `
                    <div class="friend-avatar">
                        ${avatarHTML}
                        <div class="status-indicator" style="background: ${statusColor};"></div>
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-status-text">
                            <span style="color: ${statusColor}">●</span> ${statusText}
                        </div>
                    </div>
                    <div class="action-icons">
                        <div class="icon-btn" title="Invite">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        </div>
                        <div class="icon-btn" title="Message">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        </div>
                    </div>
                `;
                listContainer.appendChild(el);
            });
        }

        function selectFriend(friend, el) {
            // UI Toggle
            document.querySelectorAll('.friend-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');

            // Update Detail Panel
            document.getElementById('detailName').textContent = friend.name;
            document.getElementById('detailRole').textContent = friend.role;
            document.getElementById('detailSince').textContent = friend.date;
            document.getElementById('statLvl').textContent = friend.lvl;
            document.getElementById('statWins').textContent = friend.wins;
            document.getElementById('statKd').textContent = friend.kd;
            
            // Update Avatar
            const detailAvatar = document.getElementById('detailAvatar');
            detailAvatar.innerHTML = `<div style="width:100%; height:100%; overflow:hidden; border-radius:12px;">${getAvatarSVG(friend.color, friend.shape)}</div>`;
            
            // Update Header Gradient
            const header = document.querySelector('.detail-header-bg');
            header.style.background = `radial-gradient(circle at top right, ${friend.color}40, transparent 70%)`;

            // Animation
            const body = document.querySelector('.detail-body');
            body.classList.remove('fade-in');
            void body.offsetWidth; // trigger reflow
            body.classList.add('fade-in');
        }

        // Init
        document.getElementById('myAvatar').innerHTML = getAvatarSVG('#ffb703', 0);
        document.getElementById('party1Avatar').innerHTML = getAvatarSVG('#2ec4b6', 1);
        document.getElementById('party2Avatar').innerHTML = getAvatarSVG('#4361ee', 3);
        
        renderList();

    </script>
</body>
</html>
