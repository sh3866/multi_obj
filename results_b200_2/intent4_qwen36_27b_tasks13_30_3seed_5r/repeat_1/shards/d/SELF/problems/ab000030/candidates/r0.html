<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub // Nexus</title>
    <style>
        :root {
            /* Palette: Deep Space & Neon Amber */
            --bg-deep: #0b0c10;
            --bg-panel: #12141d;
            --bg-card: #1b1e2b;
            --bg-card-hover: #242838;
            
            --primary: #ffc857; /* Amber Gold */
            --primary-dim: #ffc85740;
            --secondary: #45a29e; /* Teal/Cyan */
            --secondary-dim: #45a29e30;
            
            --status-online: #2ecc71;
            --status-party: #f1c40f;
            --status-offline: #57606f;
            --status-ingame: #3498db;
            
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            
            --danger: #e74c3c;
            
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            
            --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
            --glow-text: 0 0 10px rgba(255, 200, 87, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Grid Effect */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--bg-panel) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-panel) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            z-index: -1;
        }
        .bg-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 90%);
            z-index: -1;
        }

        /* Main Layout */
        .app-container {
            width: 95vw;
            height: 90vh;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 20px;
            position: relative;
        }

        /* Common Components */
        .panel {
            background: var(--bg-panel);
            border: 1px solid #2a2e3d;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #2a2e3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }

        .panel-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .btn {
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            text-transform: uppercase;
        }
        .btn-primary:hover {
            background: #ffdb85;
            transform: translateY(-1px);
            box-shadow: 0 0 15px var(--primary-dim);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            text-transform: uppercase;
            border: 1px solid transparent;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        .btn-icon {
            background: transparent;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 50%;
        }
        .btn-icon:hover {
            background: rgba(255,255,255,0.1);
            color: var(--primary);
        }

        /* Left Column: Profile & Party */
        .profile-section {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #2a2e3d;
            background: linear-gradient(180deg, rgba(69, 162, 158, 0.1) 0%, transparent 100%);
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }

        .avatar-ring {
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            border: 2px solid var(--secondary);
            box-shadow: 0 0 15px var(--secondary-dim);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #333;
            overflow: hidden;
            position: relative;
        }
        
        .avatar-img svg {
            width: 100%;
            height: 100%;
        }

        .level-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--bg-card);
            border: 2px solid var(--bg-panel);
            color: var(--primary);
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .player-name {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .player-title {
            color: var(--secondary);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }

        .party-tracker {
            padding: 20px;
        }
        
        .party-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            border-left: 3px solid var(--status-party);
            transition: transform 0.2s;
        }
        .party-member:hover {
            transform: translateX(5px);
            background: var(--bg-card-hover);
        }

        .mini-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #444;
            position: relative;
        }
        
        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
        }

        .member-info {
            flex: 1;
            overflow: hidden;
        }
        .member-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .member-role {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Center Column: Friends List */
        .search-bar {
            padding: 15px 20px;
            border-bottom: 1px solid #2a2e3d;
        }
        .search-input-wrapper {
            position: relative;
        }
        .search-input {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid #2a2e3d;
            padding: 10px 15px 10px 40px;
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: var(--primary);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .tabs {
            display: flex;
            padding: 0 20px;
            background: rgba(0,0,0,0.2);
        }
        .tab {
            padding: 12px 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            position: relative;
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .badge {
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        /* Custom Scrollbar */
        .friends-list::-webkit-scrollbar {
            width: 6px;
        }
        .friends-list::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        .friends-list::-webkit-scrollbar-thumb {
            background: #2a2e3d;
            border-radius: 3px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .friend-item:hover {
            background: var(--bg-card);
        }
        .friend-item.selected {
            background: var(--bg-card);
            border-color: var(--primary-dim);
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .friend-avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #333;
            margin-right: 15px;
            position: relative;
            flex-shrink: 0;
        }

        .friend-details {
            flex: 1;
        }
        .friend-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .friend-status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        
        /* Right Column: Detail Panel */
        .detail-panel {
            position: relative;
        }
        
        .detail-header {
            height: 140px;
            background: linear-gradient(45deg, #2b3045, #1b1e2b);
            position: relative;
            border-bottom: 1px solid #2a2e3d;
        }
        
        .detail-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(0deg, var(--bg-panel) 0%, transparent 100%);
        }

        .detail-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #333;
            border: 3px solid var(--bg-panel);
            position: absolute;
            bottom: -40px;
            left: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .detail-content {
            padding: 50px 20px 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .stat-box {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: var(--radius-sm);
            flex: 1;
            margin: 0 5px;
        }
        .stat-val {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid #2a2e3d;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }
        .action-btn.danger {
            color: var(--danger);
            border-color: rgba(231, 76, 60, 0.3);
        }
        .action-btn.danger:hover {
            background: rgba(231, 76, 60, 0.1);
            border-color: var(--danger);
        }
        .action-btn.highlight {
            grid-column: span 2;
            background: var(--primary);
            color: #000;
            border: none;
        }
        .action-btn.highlight:hover {
            background: #ffdb85;
            box-shadow: 0 0 15px var(--primary-dim);
        }

        .activity-feed {
            margin-top: 30px;
            border-top: 1px solid #2a2e3d;
            padding-top: 20px;
        }
        .feed-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .feed-item {
            display: flex;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }
        .feed-icon {
            color: var(--secondary);
        }

        /* Animations */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 200, 87, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 200, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 200, 87, 0); }
        }
        
        .pulse-btn {
            animation: pulse 2s infinite;
        }

        /* Utility for SVGs */
        svg {
            fill: currentColor;
        }

    </style>
</head>

            { id: 7, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, wins: 120, kd: "1.2", date: "2023", color: "#34495e" },
            { id: 8, name: "PixelPioneer", role: "Engineer", status: "ingame", lvl: 74, wins: 1500, kd: "2.1", date: "2022", color: "#1abc9c" },
            { id: 9, name: "StarDust", role: "Scout", status: "online", lvl: 41, wins: 210, kd: "1.5", date: "2024", color: "#ff7979" },
            { id: 10, name: "Titan_X", role: "Heavy", status: "offline", lvl: 99, wins: 9999, kd: "5.5", date: "2020", color: "#95a5a6" },
        ];

        // --- Helper: Generate SVG Avatars ---
        function getAvatarSVG(color, type) {
            // Simple procedural avatar generation
            const shapes = [
                `<circle cx="24" cy="24" r="12" fill="${color}"/><circle cx="24" cy="24" r="20" stroke="${color}" stroke-width="2" fill="none"/>`,
                `<rect x="10" y="10" width="28" height="28" rx="5" fill="${color}"/><rect x="16" y="16" width="16" height="16" fill="#0b0c10"/>`,
                `<polygon points="24,4 44,44 4,44" fill="${color}"/>`,
                `<path d="M24 4 L44 44 L4 44 Z" fill="none" stroke="${color}" stroke-width="3"/><circle cx="24" cy="30" r="6" fill="${color}"/>`
            ];
            const shape = shapes[type % shapes.length];
            return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">${shape}</svg>`;
        }

        function getStatusColor(status) {
            if(status === 'online') return 'var(--status-online)';
            if(status === 'ingame') return 'var(--status-ingame)';
            return 'var(--status-offline)';
        }

        // --- Render Functions ---
        const listContainer = document.getElementById('friendsList');
        const detailPanel = document.getElementById('detailPanel');
        
        // Initial Render of List
        function renderList() {
            listContainer.innerHTML = '';
            friends.forEach((friend, index) => {
                const el = document.createElement('div');
                el.className = 'friend-item';
                el.onclick = () => selectFriend(friend, el);
                
                el.innerHTML = `
                    <div class="friend-avatar">
                        ${getAvatarSVG(friend.color, index)}
                        <div class="status-dot" style="background: ${getStatusColor(friend.status)}; bottom:-2px; right:-2px; border-color:var(--bg-panel);"></div>
                    </div>
                    <div class="friend-details">
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-status">
                            <span class="status-indicator" style="background: ${getStatusColor(friend.status)}"></span>
                            ${friend.status === 'ingame' ? 'In Match' : friend.status.charAt(0).toUpperCase() + friend.status.slice(1)}
                        </div>
                    </div>
                    ${friend.status === 'online' ? `<button class="btn-icon" style="opacity:0.5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>` : ''}
                `;
                listContainer.appendChild(el);
            });
        }

        // Selection Logic
        let currentSelection = null;

        function selectFriend(friend, el) {
            // UI Toggle
            document.querySelectorAll('.friend-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');

            // Update Detail Panel
            document.getElementById('detailName').textContent = friend.name;
            document.getElementById('detailRole').textContent = friend.role;
            document.getElementById('detailSince').textContent = friend.date;
            document.getElementById('statLvl').textContent = friend.lvl;
            document.getElementById('statWins').textContent = friend.wins;
            document.getElementById('statKd').textContent = friend.kd;
            
            // Update Avatar in Detail
            const avatarContainer = document.getElementById('detailAvatar');
            avatarContainer.innerHTML = `<div style="width:100%; height:100%; overflow:hidden; border-radius:12px;">${getAvatarSVG(friend.color, friend.id)}</div>`;
            
            // Update Header BG Gradient based on color
            const header = document.querySelector('.detail-header');
            header.style.background = `linear-gradient(45deg, ${friend.color}40, #1b1e2b)`;
            
            // Animate panel slightly
            detailPanel.style.transform = "scale(1.02)";
            setTimeout(() => detailPanel.style.transform = "scale(1)", 100);
        }

        // Initialize My Avatar
        document.getElementById('myAvatar').innerHTML = getAvatarSVG('#ffc857', 0);

        // Run
        renderList();

    </script>
</body>
</html>
