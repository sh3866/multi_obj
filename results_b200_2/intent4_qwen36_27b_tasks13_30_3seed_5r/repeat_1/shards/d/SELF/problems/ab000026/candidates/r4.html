<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with Tiles</title>
<style>
  :root {
    --wood-dark: #2c1e14;
    --wood-mid: #4a3525;
    --wood-light: #6b4c35;
    --felt-dark: #0f1e14;
    --felt-mid: #253d2b;
    --felt-light: #3a5c42;
    --tile-cream: #f7f5ed;
    --tile-shadow: #d8d4c4;
    --pip-color: #1a1815;
    --pip-highlight: #3a3630;
    --gold-primary: #d4af37;
    --gold-bright: #f4d03f;
    --gold-dim: #8a7020;
    --gold-glow: rgba(212, 175, 55, 0.6);
    --text-light: #e8e6df;
    --text-muted: #9ca89e;
    --text-dim: #6b7a6e;
    --red-accent: #c0392b;
    --red-glow: rgba(192, 57, 43, 0.4);
    --shadow-deep: rgba(0, 0, 0, 0.6);
    --shadow-mid: rgba(0, 0, 0, 0.35);
    --shadow-soft: rgba(0, 0, 0, 0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #0a0805;
    color: var(--text-light);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    -webkit-font-smoothing: antialiased;
  }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Outer wooden frame with realistic bevel */
  .wood-frame {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, #5a3a25 0%, #3e2723 15%, #2a1a10 50%, #3e2723 85%, #5a3a25 100%);
    z-index: 0;
  }

  .wood-frame::before {
    content: '';
    position: absolute;
    inset: 10px;
    background: linear-gradient(180deg, #5a3a25 0%, #3e2723 100%);
    border: 1px solid rgba(212, 175, 55, 0.06);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.03);
  }

  .wood-frame::after {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(93, 64, 55, 0.6);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
  }

  /* Felt table surface with depth */
  .table-felt {
    position: absolute;
    top: 22px;
    left: 22px;
    right: 22px;
    bottom: 22px;
    background: radial-gradient(ellipse at 50% 30%, var(--felt-light) 0%, var(--felt-mid) 35%, var(--felt-dark) 75%, #0a1510 100%);
    z-index: 1;
    overflow: hidden;
  }

  /* Felt texture overlay */
  .table-felt::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
  }

  /* Inner shadow for depth */
  .table-felt::after {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 120px 30px rgba(0,0,0,0.4);
    pointer-events: none;
    z-index: 2;
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    position: absolute;
    top: 30px;
    left: 42px;
    right: 42px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
  }

  .opponent-section {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .opponent-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--wood-mid), var(--wood-dark));
    border: 2px solid rgba(212, 175, 55, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .opponent-info-text .name {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.3px;
    color: var(--text-light);
  }

  .opponent-info-text .tile-count {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-top: 2px;
    font-style: italic;
  }

  /* Center score area */
  .center-info {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .title-group {
    text-align: center;
  }

  .game-title {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--gold-primary);
    text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 40px rgba(212, 175, 55, 0.1);
  }

  .game-subtitle {
    font-size: 11px;
    font-style: italic;
    letter-spacing: 5px;
    color: var(--text-muted);
    margin-top: 1px;
    opacity: 0.7;
  }

  .scores-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-card {
    background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
    border: 1px solid rgba(212, 175, 55, 0.1);
    border-radius: 8px;
    padding: 7px 20px;
    text-align: center;
    min-width: 78px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .score-card .sc-label {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .score-card .sc-value {
    font-size: 22px;
    font-weight: bold;
    color: var(--gold-primary);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    font-variant-numeric: tabular-nums;
  }

  .turn-indicator {
    background: linear-gradient(135deg, rgba(192, 57, 43, 0.35), rgba(192, 57, 43, 0.15));
    border: 1px solid rgba(192, 57, 43, 0.5);
    border-radius: 8px;
    padding: 7px 18px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #ff9a8a;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(192, 57, 43, 0.2);
    animation: turnPulse 2.5s ease-in-out infinite;
  }

  @keyframes turnPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(192, 57, 43, 0.15); }
    50% { box-shadow: 0 0 28px rgba(192, 57, 43, 0.4); }
  }

  /* Right cue panel */
  .cue-panel {
    background: linear-gradient(135deg, rgba(0,0,0,0.45), rgba(0,0,0,0.6));
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 12px 16px;
    width: 200px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .cue-panel .cue-title {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--gold-primary);
    margin-bottom: 6px;
  }

  .cue-panel .cue-text {
    font-size: 11px;
    color: var(--text-light);
    line-height: 1.5;
    font-style: italic;
    opacity: 0.75;
  }

  .match-endpoints {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .endpoint-badge {
    background: linear-gradient(180deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.04));
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 16px;
    font-weight: bold;
    color: var(--gold-primary);
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    font-variant-numeric: tabular-nums;
  }

  /* ===== BOARD AREA ===== */
  .board-area {
    position: absolute;
    top: 110px;
    bottom: 165px;
    left: 55px;
    right: 55px;
    z-index: 5;
  }

  #chain-svg {
    width: 100%;
    height: 100%;
  }

  /* ===== DRAW PILE ===== */
  .draw-pile-area {
    position: absolute;
    bottom: 185px;
    left: 55px;
    z-index: 15;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .draw-pile-area:hover {
    transform: translateY(-6px);
  }

  .draw-pile-area:hover .draw-label {
    color: var(--gold-primary);
  }

  .draw-label {
    text-align: center;
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--text-muted);
    margin-top: 8px;
    transition: color 0.2s;
  }

  .draw-count {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    color: var(--gold-primary);
    margin-top: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* ===== HAND AREA ===== */
  .hand-container {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hand-label-text {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 5px;
    color: var(--text-muted);
    margin-bottom: 6px;
    opacity: 0.6;
  }

  .hand-rack {
    display: flex;
    gap: 5px;
    padding: 14px 22px 10px;
    background: linear-gradient(180deg, rgba(25, 18, 10, 0.95), rgba(15, 10, 5, 0.98));
    border-radius: 14px 14px 0 0;
    border: 1px solid rgba(212, 175, 55, 0.08);
    border-bottom: none;
    align-items: flex-end;
    box-shadow: 0 -8px 35px rgba(0,0,0,0.5), 0 -2px 10px rgba(0,0,0,0.3);
  }

  /* Hand tiles */
  .hand-tile {
    width: 54px;
    height: 94px;
    border-radius: 7px;
    background: var(--tile-cream);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    flex-shrink: 0;
    box-shadow:
      0 4px 10px rgba(0,0,0,0.45),
      0 8px 24px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -1px 0 rgba(0,0,0,0.05);
  }

  .hand-tile::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 10%, rgba(255,255,255,0.5) 50%, transparent 90%);
  }

  .hand-tile:hover {
    transform: translateY(-16px) scale(1.06);
    box-shadow:
      0 16px 40px rgba(0,0,0,0.5),
      0 6px 16px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.8);
    z-index: 30;
  }

  .hand-tile.playable {
    border: 2px solid var(--gold-primary);
    box-shadow:
      0 4px 10px rgba(0,0,0,0.45),
      0 8px 24px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.7),
      0 0 14px rgba(212, 175, 55, 0.25);
  }

  .hand-tile.playable::after {
    content: '';
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold-primary);
    box-shadow: 0 0 10px var(--gold-primary), 0 0 20px rgba(212, 175, 55, 0.25);
    animation: playablePulse 2s ease-in-out infinite;
  }

  @keyframes playablePulse {
    0%, 100% { box-shadow: 0 0 8px var(--gold-primary); }
    50% { box-shadow: 0 0 16px var(--gold-primary), 0 0 28px rgba(212, 175, 55, 0.25); }
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    background: rgba(15, 12, 8, 0.95);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 12px;
    color: var(--text-light);
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
    font-family: 'Georgia', serif;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    white-space: nowrap;
  }

  .tooltip.visible { opacity: 1; }

  /* Responsive */
  @media (max-width: 900px) {
    .top-bar { flex-direction: column; height: auto; padding: 8px 16px; gap: 6px; }
    .center-info { flex-direction: column; gap: 4px; }
    .hand-rack { gap: 3px; padding: 10px 12px 8px; }
    .hand-tile { width: 40px; height: 70px; }
    .board-area { left: 14px; right: 14px; top: 120px; bottom: 105px; }
    .cue-panel { display: none; }
    .draw-pile-area { left: 16px; bottom: 115px; }
    .score-card { padding: 5px 12px; min-width: 65px; }
    .score-card .sc-value { font-size: 16px; }
    .opponent-section { gap: 8px; }
    .game-title { font-size: 16px; letter-spacing: 5px; }
  }
</style>
</head>
<body>

<div id="game-container">
  <div class="wood-frame"></div>
  <div class="table-felt"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="opponent-section">
      <div class="opponent-avatar">🎭</div>
      <div class="opponent-info-text">
        <div class="name">Opponent</div>
        <div class="tile-count">5 tiles remaining</div>
      </div>
    </div>

    <div class="center-info">
      <div class="title-group">
        <div class="game-title">Play with Tiles</div>
        <div class="game-subtitle">Dominoes</div>
      </div>
      <div class="scores-group">
        <div class="score-card">
          <div class="sc-label">You</div>
          <div class="sc-value" id="player-score">42</div>
        </div>
        <div class="turn-indicator">Your Turn</div>
        <div class="score-card">
          <div class="sc-label">Opponent</div>
          <div class="sc-value" id="opponent-score">35</div>
        </div>
      </div>
    </div>

    <div class="cue-panel">
      <div class="cue-title">Match Values</div>
      <div class="cue-text">Play a tile matching the open ends of the chain.</div>
      <div class="match-endpoints">
        <div class="endpoint-badge" title="Left end">5</div>
        <div class="endpoint-badge" title="Right end">3</div>
      </div>
    </div>
  </div>

  <!-- Board SVG -->
  <div class="board-area">
    <svg id="chain-svg" viewBox="0 0 1100 500" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="tileGradBoard" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#faf8f2;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ede9db;stop-opacity:1" />
        </linearGradient>
        <filter id="tileShadowBoard">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/>
        </filter>
        <filter id="pipShadow">
          <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#000" flood-opacity="0.25"/>
        </filter>
        <filter id="glowGold">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Pip patterns -->
        <g id="pip-0"></g>
        <g id="pip-1">
          <circle cx="0" cy="0" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-2">
          <circle cx="-7" cy="-7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-3">
          <circle cx="-7" cy="-7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="0" cy="0" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-4">
          <circle cx="-7" cy="-7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="-7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="-7" cy="7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-5">
          <circle cx="-7" cy="-7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="-7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="0" cy="0" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="-7" cy="7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="7" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-6">
          <circle cx="-7" cy="-8" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="-8" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="-7" cy="0" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="0" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="-7" cy="8" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
          <circle cx="7" cy="8" r="4.5" fill="#1a1815" filter="url(#pipShadow)"/>
        </g>
      </defs>
    </svg>
  </div>

  <!-- Draw Pile -->
  <div class="draw-pile-area" id="draw-pile">
    <svg width="52" height="82" viewBox="0 0 52 82">
      <defs>
        <filter id="drawShadow">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
        </filter>
      </defs>
      <!-- Stack of tiles (backs) -->
      <rect x="2" y="5" width="48" height="76" rx="6" fill="#3e2723" stroke="#5d4037" stroke-width="1" filter="url(#drawShadow)"/>
      <rect x="0" y="2" width="48" height="76" rx="6" fill="#4a3020" stroke="#5d4037" stroke-width="1" filter="url(#drawShadow)"/>
      <rect x="-2" y="0" width="48" height="76" rx="6" fill="#5a3a25" stroke="#6d4c41" stroke-width="1"/>
      <!-- Back pattern -->
      <g transform="translate(22, 38)" opacity="0.18">
        <circle cx="0" cy="0" r="13" fill="none" stroke="#8a7020" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="7" fill="#8a7020"/>
        <circle cx="0" cy="0" r="2.5" fill="#3e2723"/>
      </g>
    </svg>
    <div class="draw-label">Draw</div>
    <div class="draw-count">12</div>
  </div>

  <!-- Player Hand -->
  <div class="hand-container">
    <div class="hand-label-text">Your Hand</div>
    <div class="hand-rack" id="hand-area"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function() {
  const SVG_NS = "http://www.w3.org/2000/svg";

  const TILE_W = 64;
  const TILE_H = 106;
  const GAP = 12;

  // Chain of dominoes on the board
  const chain = [
    { a: 6, b: 2 },
    { a: 2, b: 5 },
    { a: 5, b: 3 },
    { a: 3, b: 4 },
    { a: 4, b: 1 },
    { a: 1, b: 6 },
    { a: 6, b: 3 },
    { a: 3, b: 3 },
  ];

  // Player's hand tiles
  const playerHand = [
    { a: 4, b: 1, playable: false },
    { a: 3, b: 6, playable: true },
    { a: 2, b: 4, playable: false },
    { a: 5, b: 5, playable: true },
    { a: 1, b: 3, playable: true },
    { a: 4, b: 4, playable: false },
    { a: 2, b: 2, playable: false },
  ];

  function createPipGroup(n, cx, cy) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('transform', `translate(${cx}, ${cy})`);
    const ref = document.getElementById(`pip-${n}`);
    if (ref) {
      ref.childNodes.forEach(node => {
        const clone = node.cloneNode(true);
        g.appendChild(clone);
      });
    }
    return g;
  }

  function createBoardTile(tile, x, y, angle) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('transform', `translate(${x}, ${y}) rotate(${angle})`);

    // Tile body
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', -TILE_W / 2);
    rect.setAttribute('y', -TILE_H / 2);
    rect.setAttribute('width', TILE_W);
    rect.setAttribute('height', TILE_H);
    rect.setAttribute('rx', 6);
    rect.setAttribute('fill', 'url(#tileGradBoard)');
    rect.setAttribute('stroke', '#c0b89e');
    rect.setAttribute('stroke-width', '1');
    rect.setAttribute('filter', 'url(#tileShadowBoard)');
    g.appendChild(rect);

    // Top highlight for subtle 3D
    const hl = document.createElementNS(SVG_NS, 'rect');
    hl.setAttribute('x', -TILE_W / 2 + 3);
    hl.setAttribute('y', -TILE_H / 2 + 3);
    hl.setAttribute('width', TILE_W - 6);
    hl.setAttribute('height', TILE_H / 2 - 6);
    hl.setAttribute('rx', 4);
    hl.setAttribute('fill', 'rgba(255,255,255,0.08)');
    g.appendChild(hl);

    // Divider line
    const div = document.createElementNS(SVG_NS, 'line');
    div.setAttribute('x1', -TILE_W / 2 + 9);
    div.setAttribute('y1', 0);
    div.setAttribute('x2', TILE_W / 2 - 9);
    div.setAttribute('y2', 0);
    div.setAttribute('stroke', '#c0b89e');
    div.setAttribute('stroke-width', '1.2');
    g.appendChild(div);

    // Pips
    g.appendChild(createPipGroup(tile.a, 0, -TILE_H / 4));
    g.appendChild(createPipGroup(tile.b, 0, TILE_H / 4));

    return g;
  }

  function createHandTileSVG(tile) {
    const g = document.createElementNS(SVG_NS, 'g');
    const isPlayable = tile.playable;

    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', 0);
    rect.setAttribute('y', 0);
    rect.setAttribute('width', 54);
    rect.setAttribute('height', 94);
    rect.setAttribute('rx', 7);
    rect.setAttribute('fill', 'url(#tileGradBoard)');
    rect.setAttribute('stroke', isPlayable ? '#d4af37' : '#c0b89e');
    rect.setAttribute('stroke-width', isPlayable ? '2' : '1');
    g.appendChild(rect);

    const div = document.createElementNS(SVG_NS, 'line');
    div.setAttribute('x1', 7);
    div.setAttribute('y1', 47);
    div.setAttribute('x2', 47);
    div.setAttribute('y2', 47);
    div.setAttribute('stroke', '#c0b89e');
    div.setAttribute('stroke-width', '1.2');
    g.appendChild(div);

    g.appendChild(createPipGroup(tile.a, 27, 23.5));
    g.appendChild(createPipGroup(tile.b, 27, 70.5));

    return g;
  }

  // Render board chain — auto-layout
  const svg = document.getElementById('chain-svg');
  const totalChainWidth = chain.length * TILE_W + (chain.length - 1) * GAP;
  const startX = (1100 - totalChainWidth) / 2;
  const centerY = 250;

  chain.forEach((tile, i) => {
    const x = startX + i * (TILE_W + GAP) + TILE_W / 2;
    svg.appendChild(createBoardTile(tile, x, centerY, 0));
  });

  // End point markers
  function createEndPoint(cx, cy, value) {
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('transform', `translate(${cx}, ${cy})`);

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('r', 16);
    circle.setAttribute('fill', 'rgba(212, 175, 55, 0.08)');
    circle.setAttribute('stroke', '#d4af37');
    circle.setAttribute('stroke-width', '1.8');
    circle.setAttribute('stroke-dasharray', '5,4');
    circle.setAttribute('filter', 'url(#glowGold)');
    circle.classList.add('end-circle');
    g.appendChild(circle);

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dy', '5');
    text.setAttribute('fill', '#d4af37');
    text.setAttribute('font-size', '15');
    text.setAttribute('font-family', 'Georgia, serif');
    text.setAttribute('font-weight', 'bold');
    text.setAttribute('filter', 'url(#glowGold)');
    text.textContent = value;
    g.appendChild(text);

    return { group: g, circle };
  }

  const leftEndX = startX - GAP - 8;
  const rightEndX = startX + totalChainWidth + GAP + 8;
  const leftEnd = createEndPoint(leftEndX, centerY, '5');
  const rightEnd = createEndPoint(rightEndX, centerY, '3');
  svg.appendChild(leftEnd.group);
  svg.appendChild(rightEnd.group);

  // Animate end markers
  function animateEnds() {
    const t = Date.now() / 1000;
    const scale = 1 + 0.06 * Math.sin(t * 2);
    const opacity = 0.08 + 0.08 * Math.sin(t * 2);
    [leftEnd.circle, rightEnd.circle].forEach(c => {
      c.setAttribute('r', 16 * scale);
      c.setAttribute('fill', `rgba(212, 175, 55, ${opacity})`);
    });
    requestAnimationFrame(animateEnds);
  }
  animateEnds();

  // Render player hand
  const handArea = document.getElementById('hand-area');
  playerHand.forEach((tile, i) => {
    const tileDiv = document.createElement('div');
    tileDiv.className = `hand-tile${tile.playable ? ' playable' : ''}`;

    const svgTile = document.createElementNS(SVG_NS, 'svg');
    svgTile.setAttribute('width', '54');
    svgTile.setAttribute('height', '94');
    svgTile.setAttribute('viewBox', '0 0 54 94');
    svgTile.style.overflow = 'visible';
    svgTile.appendChild(createHandTileSVG(tile));
    tileDiv.appendChild(svgTile);

    // Tooltip
    tileDiv.addEventListener('mouseenter', (e) => {
      const tt = document.getElementById('tooltip');
      tt.textContent = `Tile: ${tile.a} | ${tile.b}${tile.playable ? ' — Can play!' : ''}`;
      tt.classList.add('visible');
    });
    tileDiv.addEventListener('mousemove', (e) => {
      const tt = document.getElementById('tooltip');
      tt.style.left = (e.clientX + 16) + 'px';
      tt.style.top = (e.clientY - 12) + 'px';
    });
    tileDiv.addEventListener('mouseleave', () => {
      document.getElementById('tooltip').classList.remove('visible');
    });

    // Click animation
    tileDiv.addEventListener('click', () => {
      if (tile.playable) {
        tileDiv.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        tileDiv.style.transform = 'translateY(-26px) scale(0.86)';
        tileDiv.style.opacity = '0.4';
        setTimeout(() => {
          tileDiv.style.transform = '';
          tileDiv.style.opacity = '';
        }, 400);
      }
    });

    handArea.appendChild(tileDiv);
  });

  // Draw pile click
  document.getElementById('draw-pile').addEventListener('click', function() {
    this.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
    this.style.transform = 'translateY(-6px) scale(0.94)';
    setTimeout(() => { this.style.transform = ''; }, 250);
  });

})();
</script>
</body>
</html>
