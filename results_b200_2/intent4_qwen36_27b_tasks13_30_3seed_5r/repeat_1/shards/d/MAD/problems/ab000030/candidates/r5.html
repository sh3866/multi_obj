<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub // Nexus - Revised</title>
    <style>
        :root {
            /* Palette: Cyber-Noir (Refined) */
            --bg-body: #08080c;
            --bg-panel: #121218;
            --bg-panel-gradient: linear-gradient(180deg, #1a1b26 0%, #0f1014 100%);
            
            --primary: #ffaa00; /* Amber - High Contrast */
            --secondary: #00f0ff; /* Cyan - Accent */
            --danger: #ff3344; /* Red - High Contrast */
            
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            
            --border-color: rgba(255, 255, 255, 0.1);
            --border-highlight: rgba(255, 255, 255, 0.2);
            
            /* Critique 2: 0px Radius for Cyberpunk feel */
            --radius-btn: 0px; 
            --radius-panel: 0px;
            
            --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        * { box-sizing: border-box; user-select: none; outline: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Atmosphere */
        .bg-atmosphere {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: var(--bg-body);
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
        }
        
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        .app-container {
            width: 96vw;
            height: 94vh;
            max-width: 1600px;
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 16px; /* Tighter grid */
            position: relative;
            z-index: 1;
        }

        /* Common Components */
        .panel {
            background: var(--bg-panel-gradient);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        
        /* Scanline Texture */
        .panel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
            opacity: 0.6;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }

        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* Critique 2: Flat, High-Contrast Buttons */
        .btn {
            border: none;
            cursor: pointer;
            font-weight: 800;
            font-family: var(--font-ui);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: var(--radius-btn); /* Sharp corners */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: none; /* No glow */
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-primary:active { transform: translateY(1px); }

        /* Critique 2: Solid Red for Battle */
        .btn-battle {
            background: var(--danger);
            color: #fff;
            box-shadow: none;
        }
        .btn-battle:hover { filter: brightness(1.1); }
        .btn-battle:active { transform: translateY(1px); }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
            background: rgba(255,255,255,0.03);
        }

        /* Left Column: Profile & Party */
        .profile-section {
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.03) 0%, transparent 100%);
        }

        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
        }

        .cyber-frame {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border: 1px solid var(--border-highlight);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }
        
        .avatar-img svg { width: 100%; height: 100%; display: block; }
        
        .level-badge {
            position: absolute;
            bottom: -5px; right: -5px;
            background: #0b0c14;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            font-size: 9px;
            font-family: var(--font-mono);
            font-weight: 800;
            padding: 2px 4px;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        .player-name {
            font-size: 16px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .player-title {
            color: var(--secondary);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: block;
            font-weight: 600;
            opacity: 0.9;
        }

        .party-container {
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border-color);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .party-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
        }
        
        .party-list { padding: 10px 0; flex: 1; }

        .party-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }
        
        /* Critique 2: Subtle Dark Highlight & Thin Cyan Border */
        .party-member.active-member {
            background: rgba(0, 240, 255, 0.03);
            border-left: 2px solid var(--secondary);
        }

        .mini-avatar {
            width: 32px;
            height: 32px;
            background: #050508;
            position: relative;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .mini-avatar svg { width: 100%; height: 100%; }
        
        .status-dot {
            position: absolute;
            bottom: -2px; right: -2px;
            width: 8px; height: 8px;
            border-radius: 50%; 
            border: 2px solid var(--bg-panel);
            z-index: 2;
        }
        .status-online { background: var(--secondary); }
        .status-ingame { background: var(--primary); }

        .member-info { flex: 1; overflow: hidden; }
        .member-name {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }
        .member-role {
            font-size: 9px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Critique 3: Open Slot - Dashed Border, Dark BG */
        .party-slot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.2);
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background 0.2s;
        }
        .party-slot:hover { background: rgba(255, 255, 255, 0.03); }

        .slot-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            background: rgba(0,0,0,0.3);
            border: 1px dashed rgba(255,255,255,0.2);
            font-size: 14px;
        }
        .slot-text {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Center Column: Friends List */
        /* Critique 3: Add Friend Input visually grouped */
        .add-friend-bar {
            padding: 16px 20px;
            background: transparent; /* Removed heavy divider background */
        }
        
        .input-group {
            display: flex;
            background: #050508;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }
        .input-group:focus-within { border-color: var(--secondary); }

        .add-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 15px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 12px;
        }
        .add-input::placeholder {
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .btn-add-action {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 0 16px;
            font-weight: 800;
            font-size: 9px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 1px solid rgba(0,0,0,0.2);
        }
        .btn-add-action:hover { background: #fff; }

        .tabs {
            display: flex;
            background: #000;
            border-bottom: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            padding: 14px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            position: relative;
        }
        .tab:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .tab.active {
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            border-bottom: 2px solid var(--primary);
        }

        .badge {
            background: var(--danger);
            color: white;
            font-size: 8px;
            padding: 1px 4px;
            margin-left: 4px;
            font-weight: 800;
            vertical-align: middle;
        }

        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .friends-list::-webkit-scrollbar { width: 4px; }
        .friends-list::-webkit-scrollbar-track { background: #000; }
        .friends-list::-webkit-scrollbar-thumb { background: #333; }

        /* Critique 3: Consistent 8px Grid for list items */
        .friend-item {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .friend-item:hover { background: rgba(255,255,255,0.03); }
        
        /* Critique 2: Subtle selection state */
        .friend-item.selected {
            background: rgba(0, 240, 255, 0.05);
        }
        .friend-item.selected::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--secondary);
        }

        .friend-avatar {
            width: 40px;
            height: 40px;
            background: #050508;
            margin-right: 16px;
            position: relative;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .friend-avatar svg { width: 100%; height: 100%; }

        .friend-details { flex: 1; }
        .friend-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-main);
        }
        .friend-status {
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        /* Request Actions */
        .request-actions { display: flex; gap: 8px; }
        .btn-req {
            padding: 4px 8px;
            font-size: 8px;
            text-transform: uppercase;
            font-weight: 700;
            border-radius: 0;
            cursor: pointer;
            border: 1px solid;
        }
        .btn-accept { background: rgba(0, 255, 136, 0.1); color: var(--secondary); border-color: var(--secondary); }
        .btn-accept:hover { background: var(--secondary); color: #000; }
        .btn-decline { background: rgba(255, 51, 68, 0.1); color: var(--danger); border-color: var(--danger); }
        .btn-decline:hover { background: var(--danger); color: #fff; }

        /* Right Column: Detail Panel */
        .detail-panel { position: relative; }
        
        .detail-header {
            height: 120px;
            background: linear-gradient(135deg, #1a1c2e 0%, #0b0c14 100%);
            position: relative;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }
        
        .detail-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 16px 20px;
            background: linear-gradient(0deg, var(--bg-panel) 20%, transparent 100%);
            z-index: 2;
        }

        .detail-name {
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 800;
        }
        .detail-role {
            color: var(--secondary);
            font-size: 9px;
            font-family: var(--font-mono);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
        }

        .detail-avatar-large {
            width: 70px;
            height: 70px;
            background: #050508;
            border: 1px solid var(--border-highlight);
            position: absolute;
            bottom: -35px; left: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 3;
            overflow: hidden;
        }
        .detail-avatar-large svg { width: 100%; height: 100%; }

        .detail-content { padding: 50px 20px 20px; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 8px;
        }
        .stat-box {
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 8px 5px;
            flex: 1;
            border: 1px solid var(--border-color);
        }
        .stat-val {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
            font-family: var(--font-mono);
        }
        .stat-label {
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        /* Critique 4: Hierarchy - Invite Solid Primary, Battle Solid Danger */
        .btn-invite { grid-column: span 2; height: 40px; background: var(--primary); color: #000; }
        .btn-battle { height: 36px; background: var(--danger); color: #fff; }
        .btn-msg { height: 36px; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

        /* Critique 4: Social Detail - Mutual Friends / Last Played */
        .social-detail-section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .social-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }
        .mutual-friends-row {
            display: flex;
            gap: -5px;
        }
        .mutual-avatar {
            width: 28px; height: 28px;
            border: 2px solid var(--bg-panel);
            margin-left: -8px;
            background: #222;
            position: relative;
        }
        .mutual-avatar:first-child { margin-left: 0; }
        .mutual-avatar svg { width: 100%; height: 100%; }
        
        .last-played-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .lp-icon { color: var(--secondary); }

        svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div class="bg-atmosphere"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        
        <!-- LEFT COLUMN: User & Party -->
        <div class="panel">
            <div class="profile-section">
                <div class="avatar-container">
                    <div class="cyber-frame">
                        <div class="avatar-img" id="myAvatar"></div>
                    </div>
                    <div class="level-badge">LVL 42</div>
                </div>
                <h1 class="player-name">NeonViper</h1>
                <span class="player-title">Cybernetic Ranger</span>
                
                <div style="display: flex; gap: 8px; justify-content: center; margin-top: 15px;">
                    <button class="btn btn-secondary" style="flex:1; font-size: 9px; height: 28px;">PROFILE</button>
                    <button class="btn btn-secondary" style="flex:1; font-size: 9px; height: 28px;">SETTINGS</button>
                </div>
            </div>

            <div class="party-container">
                <div class="party-header">
                    <span class="panel-title" style="color: var(--secondary);">Active Party (3/4)</span>
                    <button class="btn btn-secondary" style="padding: 2px 6px;">
                        <svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
                
                <div class="party-list">
                    <!-- Party Member 1 -->
                    <div class="party-member active-member">
                        <div class="mini-avatar" id="party1Avatar"></div>
                        <div class="member-info">
                            <div class="member-name">Sara_V</div>
                            <div class="member-role">Tank • Online</div>
                        </div>
                    </div>
                    
                    <!-- Party Member 2 -->
                    <div class="party-member active-member">
                        <div class="mini-avatar" id="party2Avatar"></div>
                        <div class="member-info">
                            <div class="member-name">K0dox</div>
                            <div class="member-role">DPS • In Game</div>
                        </div>
                    </div>
                    
                    <!-- Critique 3: Vacancy Slot -->
                    <div class="party-slot">
                        <div class="slot-icon">+</div>
                        <div class="slot-text">Open Slot</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER COLUMN: Friends List -->
        <div class="panel">
            <!-- Critique 3: Add Friend Input visually grouped -->
            <div class="add-friend-bar">
                <div class="input-group">
                    <input type="text" class="add-input" placeholder="ENTER CALLSIGN">
                    <button class="btn-add-action">ADD</button>
                </div>
            </div>

            <div class="tabs">
                <!-- Critique 1: Active Tab is All Friends -->
                <div class="tab active" onclick="switchTab('all')">All Friends</div>
                <div class="tab" onclick="switchTab('online')">Online</div>
                <div class="tab" onclick="switchTab('requests')">Requests <span class="badge">2</span></div>
            </div>

            <div class="friends-list" id="friendsList">
                <!-- JS Populated -->
            </div>
        </div>

        <!-- RIGHT COLUMN: Detail Panel -->
        <div class="panel detail-panel" id="detailPanel">
            <div class="detail-header" id="detailHeader">
                <!-- Background Art -->
                <svg style="position:absolute; bottom:0; right:0; width:100%; height:100%; opacity:0.05;" viewBox="0 0 300 140" preserveAspectRatio="none">
                    <path d="M0 140 L150 0 L300 140 Z" fill="var(--primary)"/>
                </svg>
                <div class="detail-overlay">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                        <div>
                            <h2 class="detail-name" id="detailName">BladeRunner</h2>
                            <span class="detail-role" id="detailRole">Assassin</span>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:8px; color:var(--text-muted); letter-spacing:1px;">LINKED SINCE</div>
                            <div style="font-weight:bold; font-size:11px; font-family: var(--font-mono);" id="detailSince">2023</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-avatar-large" id="detailAvatar"></div>

            <div class="detail-content">
                <div class="stat-row">
                    <div class="stat-box">
                        <span class="stat-val" id="statLvl">88</span>
                        <span class="stat-label">LVL</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val" id="statWins">1,204</span>
                        <span class="stat-label">WINS</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val" id="statKd">4.2</span>
                        <span class="stat-label">K/D</span>
                    </div>
                </div>

                <!-- Critique 2 & 4: Unified Button System with Hierarchy -->
                <div class="action-grid">
                    <button class="btn btn-invite">
                        <svg width="14" height="14" viewBox="0 0 24 24" style="fill:none;"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>
                        INVITE TO GAME
                    </button>
                    <button class="btn btn-battle">
                        <svg width="12" height="12" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        BATTLE
                    </button>
                    <button class="btn btn-msg">
                        <svg width="12" height="12" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        MSG
                    </button>
                </div>

                <!-- Critique 4: Social Detail -->
                <div class="social-detail-section">
                    <span class="social-label">Mutual Friends (2)</span>
                    <div class="mutual-friends-row" id="mutualFriendsContainer">
                        <!-- JS Populated -->
                    </div>
                    
                    <div class="last-played-info">
                        <svg class="lp-icon" width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>Last played: 2 hours ago</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Mock Data ---
        const friends = [
            { id: 1, name: "BladeRunner", role: "Assassin", status: "online", lvl: 88, wins: 1204, kd: "4.2", date: "2023", color: "#e74c3c" },
            { id: 2, name: "Glitch_Witch", role: "Support", status: "online", lvl: 45, wins: 340, kd: "1.1", date: "2024", color: "#9b59b6" },
            { id: 3, name: "HeavyMetal", role: "Tank", status: "ingame", lvl: 92, wins: 5600, kd: "2.8", date: "2021", color: "#f39c12" },
            { id: 4, name: "ZeroCool", role: "Hacker", status: "offline", lvl: 12, wins: 45, kd: "0.8", date: "2024", color: "#3498db" },
            { id: 5, name: "NeonSpectre", role: "Sniper", status: "online", lvl: 67, wins: 890, kd: "3.5", date: "2022", color: "#2ecc71" },
            { id: 6, name: "CyberPunk99", role: "Ranger", status: "online", lvl: 55, wins: 600, kd: "1.9", date: "2023", color: "#e67e22" },
            { id: 7, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, wins: 120, kd: "1.2", date: "2023", color: "#34495e" },
            { id: 8, name: "PixelPioneer", role: "Engineer", status: "ingame", lvl: 74, wins: 1500, kd: "2.1", date: "2022", color: "#1abc9c" },
            { id: 9, name: "StarDust", role: "Scout", status: "online", lvl: 41, wins: 210, kd: "1.5", date: "2024", color: "#ff7979" },
            { id: 10, name: "Titan_X", role: "Heavy", status: "offline", lvl: 99, wins: 9999, kd: "5.5", date: "2020", color: "#95a5a6" },
        ];

        const requests = [
            { id: 101, name: "Ghost_Rider", role: "Unknown", color: "#7f8c8d" },
            { id: 102, name: "Neon_Ninja", role: "Unknown", color: "#e74c3c" }
        ];

        // --- Helper: Generate Unified Cybernetic SVG Avatars ---
        function getAvatarSVG(color, type) {
            const t0 = `<rect x="10" y="10" width="28" height="28" fill="${color}" opacity="0.2"/><path d="M15 20 L24 15 L33 20 L24 25 Z" fill="${color}"/><circle cx="24" cy="24" r="2" fill="#fff"/>`;
            const t1 = `<circle cx="24" cy="24" r="16" fill="${color}" opacity="0.1"/><path d="M24 10 L38 38 H10 Z" fill="${color}"/><rect x="20" y="20" width="8" height="8" fill="#000"/>`;
            const t2 = `<path d="M10 10 H38 V38 H10 Z" fill="${color}" opacity="0.15"/><path d="M15 15 H33 V33 H15 Z" fill="none" stroke="${color}" stroke-width="2"/><circle cx="24" cy="24" r="6" fill="${color}"/>`;
            
            const shapes = [t0, t1, t2];
            const shape = shapes[type % shapes.length];
            return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">${shape}</svg>`;
        }

        // --- Render Functions ---
        const listContainer = document.getElementById('friendsList');
        
        // Populate Party Avatars
        const partyAvatars = document.querySelectorAll('.mini-avatar');
        partyAvatars[0].innerHTML = getAvatarSVG('#2ecc71', 2) + `<div class="status-dot status-online"></div>`;
        partyAvatars[1].innerHTML = getAvatarSVG('#00f0ff', 1) + `<div class="status-dot status-ingame"></div>`;

        function renderList(type) {
            listContainer.innerHTML = '';
            
            if (type === 'requests') {
                requests.forEach((req, index) => {
                    const el = document.createElement('div');
                    el.className = 'friend-item';
                    el.innerHTML = `
                        <div class="friend-avatar">
                            ${getAvatarSVG(req.color, index)}
                        </div>
                        <div class="friend-details">
                            <div class="friend-name">${req.name}</div>
                            <div class="friend-status">
                                <span style="color:var(--secondary)">PENDING REQUEST</span>
                            </div>
                        </div>
                        <div class="request-actions">
                            <button class="btn-req btn-accept">Y</button>
                            <button class="btn-req btn-decline">N</button>
                        </div>
                    `;
                    listContainer.appendChild(el);
                });
            } else {
                friends.forEach((friend, index) => {
                    const el = document.createElement('div');
                    el.className = 'friend-item';
                    if(friend.id === 1) el.classList.add('selected');
                    el.onclick = () => selectFriend(friend, el);
                    
                    el.innerHTML = `
                        <div class="friend-avatar">
                            ${getAvatarSVG(friend.color, index)}
                            <div class="status-dot" style="background: ${getStatusColor(friend.status)}; ${friend.status==='online'?'box-shadow:0 0 5px '+getStatusColor(friend.status):''}"></div>
                        </div>
                        <div class="friend-details">
                            <div class="friend-name">${friend.name}</div>
                            <div class="friend-status">
                                ${friend.status === 'ingame' ? 'IN MATCH' : friend.status.toUpperCase()}
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(el);
                });
            }
        }

        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderList(type);
        }

        function getStatusColor(status) {
            if(status === 'online') return 'var(--secondary)'; // Changed to Cyan for consistency
            if(status === 'ingame') return 'var(--primary)'; // Amber for In Game
            return 'var(--text-muted)';
        }

        function selectFriend(friend, el) {
            document.querySelectorAll('.friend-item').forEach(i => i.classList.remove('selected'));
            if(el) el.classList.add('selected');

            document.getElementById('detailName').textContent = friend.name;
            document.getElementById('detailRole').textContent = friend.role;
            document.getElementById('detailSince').textContent = friend.date;
            document.getElementById('statLvl').textContent = friend.lvl;
            document.getElementById('statWins').textContent = friend.wins.toLocaleString();
            document.getElementById('statKd').textContent = friend.kd;
            
            const avatarContainer = document.getElementById('detailAvatar');
            avatarContainer.innerHTML = getAvatarSVG(friend.color, friend.id);
            
            const header = document.getElementById('detailHeader');
            header.style.background = `linear-gradient(135deg, ${friend.color}20 0%, #0b0c14 100%)`;

            // Critique 4: Populate Mutual Friends (Mocked)
            const mutualContainer = document.getElementById('mutualFriendsContainer');
            mutualContainer.innerHTML = '';
            // Mock logic: grab 2 random other friends as mutuals
            const mutuals = friends.filter(f => f.id !== friend.id).sort(() => 0.5 - Math.random()).slice(0, 2);
            mutuals.forEach((m, i) => {
                mutualContainer.innerHTML += `
                    <div class="mutual-avatar">
                        ${getAvatarSVG(m.color, i)}
                    </div>
                `;
            });
        }

        // Initialize My Avatar
        document.getElementById('myAvatar').innerHTML = getAvatarSVG('#ffd700', 0);

        // Run: Critique 1 - Default to All Friends
        renderList('all'); 
        // Keep detail panel populated with BladeRunner for context
        selectFriend(friends[0], null);

    </script>
</body>
</html>
