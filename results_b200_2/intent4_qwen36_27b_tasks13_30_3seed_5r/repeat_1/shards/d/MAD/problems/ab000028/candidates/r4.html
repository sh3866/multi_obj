<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlled Descent | Editorial Visual</title>
<style>
    :root {
        /* Palette - High Contrast & Editorial */
        --c-bg-dark: #020617;
        --c-bg-panel: #f8fafc;
        --c-text-main: #0f172a;
        --c-text-muted: #64748b;
        --c-accent: #f59e0b; /* Amber - Strict UI Accent */
        --c-accent-dim: rgba(245, 158, 11, 0.1);
        
        /* Typography */
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-bg-dark);
        color: var(--c-text-main);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
    }

    /* --- LEFT: VISUAL SCENE --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Deep atmospheric gradient */
        background: linear-gradient(to bottom, #0f172a 0%, #1e293b 50%, #334155 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- RIGHT: EDITORIAL PANEL --- */
    .content-panel {
        position: relative;
        background: var(--c-bg-panel);
        display: flex;
        flex-direction: column;
        padding: 4rem 3rem;
        box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        z-index: 10;
    }

    /* Header Section */
    .header {
        margin-bottom: 2rem;
        border-bottom: 4px solid var(--c-text-main);
        padding-bottom: 1.5rem;
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--c-text-muted);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }
    
    .tag-indicator {
        width: 10px;
        height: 10px;
        background: var(--c-accent);
        border-radius: 2px;
    }

    h1 {
        font-size: 4.5rem;
        line-height: 0.85;
        font-weight: 900;
        color: var(--c-text-main);
        letter-spacing: -0.04em;
        text-transform: uppercase;
    }

    /* Lead Text */
    .lead {
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--c-text-muted);
        max-width: 380px;
        margin-bottom: auto;
        padding-left: 0;
        border-left: none;
    }

    /* Data Grid - Strict Alignment */
    .dashboard {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin-top: auto;
        background: #ffffff;
        padding: 2rem;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
    }

    .data-point {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 0.5rem;
    }

    .data-point:last-child {
        border-bottom: none;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--c-text-muted);
        font-weight: 600;
    }

    .data-value-group {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 0.6rem;
    }

    .data-value {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--c-accent); /* Accent on Value */
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
    }

    .data-unit {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--c-text-main); /* Unit is dark */
        font-weight: 700;
        text-transform: uppercase;
        opacity: 0.6;
    }

    /* Footer */
    .footer {
        margin-top: 3rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
        letter-spacing: 0.05em;
    }

    /* Responsive */
    @media (max-width: 900px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: 50vh 1fr;
        }
        .scene-container { order: 1; }
        .content-panel { 
            order: 2; 
            padding: 2rem; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        }
        h1 { font-size: 3.5rem; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 800">
            <defs>
                <!-- Mist Gradient for Atmospheric Depth -->
                <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
                    <stop offset="100%" stop-color="#64748b" stop-opacity="0.6" />
                </linearGradient>
                
                <!-- Filters -->
                <filter id="shadowDrop" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
                </filter>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Background Sky -->
            <rect width="100%" height="100%" fill="#0f172a" />

            <!-- Distant Landscape (Depth Layer 1) -->
            <g opacity="0.4" fill="#334155">
                <path d="M0,650 L150,580 L350,660 L550,520 L800,620 L1000,500 L1000,800 L0,800 Z" />
            </g>

            <!-- The Main Cliff (Foreground Left) -->
            <g id="cliff">
                <!-- Base Mass -->
                <path d="M0,0 L420,0 L380,120 L440,180 L390,320 L480,380 L410,520 L520,620 L450,800 L0,800 Z" 
                      fill="#020617" />
                
                <!-- Layered Rock Details (Jagged/Geological) -->
                <g fill="#0f172a" stroke="#1e293b" stroke-width="1">
                    <!-- Layer 1 -->
                    <path d="M380,120 L420,120 L440,180 L400,190 L360,130 Z" />
                    <!-- Layer 2 -->
                    <path d="M390,320 L480,380 L460,410 L380,350 Z" />
                    <!-- Layer 3 -->
                    <path d="M410,520 L520,620 L490,660 L400,560 Z" />
                    <!-- Texture Scratches -->
                    <path d="M390,140 L410,135 M400,340 L430,330 M420,540 L450,530" stroke="#000" stroke-width="2" fill="none" />
                </g>

                <!-- Cliff Rim Highlight -->
                <path d="M420,0 L380,120 L440,180 L390,320 L480,380 L410,520 L520,620 L450,800" 
                      fill="none" 
                      stroke="#334155" 
                      stroke-width="4" 
                      opacity="0.6" />
            </g>

            <!-- Mist Overlay (Atmospheric Depth) -->
            <rect x="0" y="500" width="100%" height="300" fill="url(#mistGrad)" pointer-events="none" />

            <!-- Parachutist Group -->
            <g id="parachutist" transform="translate(650, 350)">
                
                <!-- Suspension Lines (Thick, Taut, Solid) -->
                <!-- Connected to the center of the figure -->
                <g id="lines" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9">
                    <line x1="-140" y1="-130" x2="0" y2="80" />
                    <line x1="-70" y1="-160" x2="0" y2="80" />
                    <line x1="0" y1="-170" x2="0" y2="80" />
                    <line x1="70" y1="-160" x2="0" y2="80" />
                    <line x1="140" y1="-130" x2="0" y2="80" />
                </g>

                <!-- The Canopy (Stylized Flat Vector Dome) -->
                <!-- No glossy gradients, just flat shape -->
                <path id="canopy" 
                      d="M-170,-130 Q0,-260 170,-130 Q0,-170 -170,-130 Z" 
                      fill="#f59e0b" 
                      filter="url(#shadowDrop)" />
                
                <!-- Canopy Paneling (Flat Vector Details) -->
                <g stroke="#d97706" stroke-width="2" fill="none" opacity="0.5">
                    <path d="M-170,-130 Q-85,-260 0,-260" />
                    <path d="M170,-130 Q85,-260 0,-260" />
                    <path d="M-85,-150 Q-42,-260 0,-260" />
                    <path d="M85,-150 Q42,-260 0,-260" />
                </g>

                <!-- The Human Figure (Solid Silhouette) -->
                <!-- White/Light Grey for high contrast against dark cliff/sky -->
                <g id="human" fill="#f8fafc">
                    <!-- Backpack / Rigger Plate -->
                    <rect x="-22" y="75" width="44" height="45" rx="4" fill="#cbd5e1" />
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="70" r="12" fill="#f8fafc" />
                    
                    <!-- Torso & Legs (Seated Harness Pose) -->
                    <!-- A solid shape representing the body mass -->
                    <path d="
                        M -15,85 
                        L 15,85 
                        L 18,130 
                        L 10,180 
                        L -10,180 
                        L -18,130 
                        Z" 
                    />

                    <!-- Arms (Gripping lines) -->
                    <!-- Drawn as paths with round caps -->
                    <g stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <!-- Left Arm -->
                        <path d="M-12,95 L-35,110 L-15,125" />
                        <!-- Right Arm -->
                        <path d="M12,95 L35,110 L15,125" />
                    </g>
                </g>
            </g>

            <!-- Dynamic Motion Cues (Wind Trails) -->
            <g id="wind-lines">
                <!-- Generated by JS -->
            </g>
        </svg>
    </div>

    <!-- CONTENT / INTERACTION -->
    <div class="content-panel">
        
        <div class="header">
            <div class="tag">
                <div class="tag-indicator"></div>
                Mission: Vertical Gap
            </div>
            <h1>Controlled<br>Descent.</h1>
        </div>
        
        <p class="lead">
            Navigating the space between geological permanence and human fragility. 
            The parachute acts as a buffer against gravity, creating a moment of suspended time.
        </p>

        <!-- Data Grid -->
        <div class="dashboard">
            <div class="data-point">
                <span class="data-label">Altitude</span>
                <div class="data-value-group">
                    <span class="data-value" id="alt-val">4,168</span>
                    <span class="data-unit">ft</span>
                </div>
            </div>
            
            <div class="data-point">
                <span class="data-label">Wind Speed</span>
                <div class="data-value-group">
                    <span class="data-value">24</span>
                    <span class="data-unit">mph</span>
                </div>
            </div>
            
            <div class="data-point">
                <span class="data-label">Canopy Tension</span>
                <div class="data-value-group">
                    <span class="data-value">88</span>
                    <span class="data-unit">%</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <span>SYS.AERO.VISUALS</span>
            <span>REC: ACTIVE</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const altVal = document.getElementById('alt-val');
            const windGroup = document.getElementById('wind-lines');
            
            let time = 0;
            let altitude = 4168;

            // Mouse interaction for parallax
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Create tapered wind streaks (SVG Paths)
            function createWindStreaks() {
                windGroup.innerHTML = '';
                for(let i=0; i<20; i++) {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    // Start positions (Randomized)
                    const startX = Math.random() * 1000;
                    const startY = Math.random() * 800;
                    // Length
                    const len = 100 + Math.random() * 250;
                    
                    // Draw a tapered shape
                    const d = `M${startX},${startY} L${startX + len},${startY + 10} L${startX + len},${startY + 12} L${startX},${startY + 2} Z`;
                    
                    path.setAttribute("d", d);
                    path.setAttribute("fill", "#ffffff");
                    path.setAttribute("opacity", Math.random() * 0.1 + 0.05);
                    
                    path.dataset.x = startX;
                    path.dataset.y = startY;
                    path.dataset.len = len;
                    
                    windGroup.appendChild(path);
                }
            }
            createWindStreaks();

            function animate() {
                time += 0.015;
                
                // 1. Floating Motion (Sway)
                const swayX = Math.sin(time) * 25;
                const swayY = Math.cos(time * 0.6) * 15;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time) * 8;
                
                // 3. Canopy Flex (Breathing effect - slightly flatter than before)
                const flex = Math.sin(time * 2) * 5;

                // Apply Transforms
                // Parallax + Sway
                const baseX = 650 + (mouseX * 40) + swayX;
                const baseY = 350 + (mouseY * 20) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing Human
                human.setAttribute('transform', `rotate(${swing}, 0, 100)`);

                // Flex Canopy
                const topY = -260 + flex;
                const botY = -170 + (flex * 0.5);
                canopy.setAttribute('d', `M-170,-130 Q0,${topY} 170,-130 Q0,${botY} -170,-130 Z`);

                // Animate Wind Trails
                const trails = windGroup.children;
                for(let i=0; i<trails.length; i++) {
                    let cx = parseFloat(trails[i].dataset.x);
                    let cy = parseFloat(trails[i].dataset.y);
                    const len = parseFloat(trails[i].dataset.len);
                    
                    // Move diagonally UP-LEFT (Simulating forward/downward momentum)
                    cx -= 4; 
                    cy -= 2;

                    // Reset if off screen
                    if(cx < -400 || cy < -400) {
                        cx = 1200 + Math.random() * 200;
                        cy = Math.random() * 900;
                        trails[i].dataset.x = cx;
                        trails[i].dataset.y = cy;
                    }
                    
                    // Update Path Data
                    trails[i].setAttribute("d", `M${cx},${cy} L${cx + len},${cy + 10} L${cx + len},${cy + 12} L${cx},${cy + 2} Z`);
                }

                // Simulate Altitude Drop
                altitude -= 0.5;
                if (altitude < 1000) altitude = 4500;
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
