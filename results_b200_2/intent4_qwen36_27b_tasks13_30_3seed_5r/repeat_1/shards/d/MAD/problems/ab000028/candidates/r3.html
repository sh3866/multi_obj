<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlled Descent | Editorial Visual</title>
<style>
    :root {
        /* Palette - Deep & Atmospheric */
        --c-bg-dark: #020617;
        --c-bg-panel: #f8fafc;
        --c-text-main: #0f172a;
        --c-text-muted: #64748b;
        --c-accent: #f59e0b; /* Amber - Matches Canopy */
        --c-accent-glow: rgba(245, 158, 11, 0.2);
        
        /* Typography */
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-bg-dark);
        color: var(--c-text-main);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1.4fr 0.6fr;
    }

    /* --- LEFT: VISUAL SCENE --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, #0f172a 0%, #1e293b 40%, #475569 80%, #94a3b8 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- RIGHT: EDITORIAL PANEL --- */
    .content-panel {
        position: relative;
        background: var(--c-bg-panel);
        display: flex;
        flex-direction: column;
        padding: 3rem;
        box-shadow: -20px 0 50px rgba(0,0,0,0.3);
        z-index: 10;
    }

    /* Header Section */
    .header {
        margin-bottom: 3rem;
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--c-accent);
        margin-bottom: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: var(--c-accent);
        box-shadow: 0 0 10px var(--c-accent);
    }

    h1 {
        font-size: 3.8rem;
        line-height: 0.9;
        font-weight: 900;
        color: var(--c-text-main);
        letter-spacing: -0.03em;
        text-transform: uppercase;
    }

    /* Lead Text */
    .lead {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--c-text-muted);
        max-width: 340px;
        margin-bottom: auto;
        border-left: 3px solid var(--c-accent);
        padding-left: 1.5rem;
    }

    /* Data Grid */
    .dashboard {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        border-top: 1px solid #cbd5e1;
        padding-top: 2rem;
        margin-top: auto;
    }

    .data-point {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: baseline;
        width: 100%;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--c-text-muted);
        font-weight: 600;
    }

    .data-value-group {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 0.5rem;
    }

    .data-value {
        font-size: 2rem;
        font-weight: 800;
        color: var(--c-text-main);
        letter-spacing: -0.02em;
    }

    .data-unit {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--c-accent);
        font-weight: 700;
        text-transform: uppercase;
    }

    /* Footer */
    .footer {
        margin-top: 2rem;
        padding-top: 1.5rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #cbd5e1;
    }

    /* Responsive */
    @media (max-width: 900px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: 50vh 1fr;
        }
        .scene-container { order: 1; }
        .content-panel { 
            order: 2; 
            padding: 2rem; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        }
        h1 { font-size: 3rem; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 800">
            <defs>
                <!-- Atmospheric Depth Gradients -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="50%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#64748b" />
                </linearGradient>

                <!-- Canopy Gradient: Smooth, Volumetric Amber/Orange -->
                <radialGradient id="canopyGrad" cx="0.5" cy="0.3" r="0.8">
                    <stop offset="0%" stop-color="#fef3c7" /> <!-- Highlight -->
                    <stop offset="30%" stop-color="#f59e0b" /> <!-- Main Color -->
                    <stop offset="80%" stop-color="#b45309" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#78350f" /> <!-- Deep Shadow -->
                </radialGradient>

                <!-- Filters -->
                <filter id="blurLarge" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
                </filter>
                <filter id="shadowDrop" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
                </filter>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Background Sky -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />

            <!-- Distant Landscape (Depth Layer 1) -->
            <g opacity="0.3" fill="#334155" filter="url(#blurLarge)">
                <path d="M0,600 L200,550 L400,620 L600,500 L800,600 L1000,520 L1000,800 L0,800 Z" />
            </g>

            <!-- The Main Cliff (Foreground Left) -->
            <!-- Solid, dark mass, NO wireframe white stroke -->
            <g id="cliff" filter="url(#shadowDrop)">
                <!-- Main Mass -->
                <path d="M0,0 L380,0 L340,100 L400,140 L360,250 L450,300 L380,420 L480,500 L400,650 L550,800 L0,800 Z" 
                      fill="#020617" />
                
                <!-- Geological Strata (Texture) -->
                <!-- Using darker polygons/lines to define rock layers, not glowing strokes -->
                <g fill="#0f172a" opacity="0.6">
                    <path d="M340,100 L380,100 L400,140 L360,150 Z" />
                    <path d="M360,250 L450,300 L440,320 L350,270 Z" />
                    <path d="M380,420 L480,500 L460,530 L360,450 Z" />
                    <path d="M400,650 L550,800 L500,800 L380,680 Z" />
                </g>

                <!-- Subtle Rim Light (Atmospheric Haze) -->
                <!-- Soft, wide blur to separate cliff from sky, not a hard line -->
                <path d="M380,0 L340,100 L400,140 L360,250 L450,300 L380,420 L480,500 L400,650 L550,800" 
                      fill="none" 
                      stroke="#475569" 
                      stroke-width="12" 
                      opacity="0.3" 
                      filter="url(#blurLarge)"/>
            </g>

            <!-- Parachutist Group (Animated) -->
            <!-- Positioned to float clearly in front of the cliff -->
            <g id="parachutist" transform="translate(650, 300)">
                
                <!-- Taut Harness Lines -->
                <!-- Thin, slightly curved to suggest tension -->
                <path id="lines" 
                      d="M-130,-140 Q-50,-50 0,90 M130,-140 Q50,-50 0,90" 
                      stroke="#ffffff" 
                      stroke-width="1.5" 
                      fill="none" 
                      opacity="0.8" />

                <!-- The Canopy (Dome Shape) -->
                <!-- Smooth bezier curve, not flat arc -->
                <path id="canopy" 
                      d="M-160,-140 Q0,-300 160,-140 Q0,-180 -160,-140 Z" 
                      fill="url(#canopyGrad)" 
                      filter="url(#shadowDrop)" />
                
                <!-- Canopy Folds (Volume definition) -->
                <g opacity="0.2" fill="#000000">
                    <path d="M-160,-140 Q-60,-180 0,-150 L0,-140 Z" />
                    <path d="M160,-140 Q60,-180 0,-150 L0,-140 Z" />
                </g>

                <!-- The Human Figure (High Contrast Silhouette) -->
                <g id="human">
                    <!-- Backpack / Rigger Plate -->
                    <path d="M-20,85 L20,85 L22,130 L-22,130 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="80" r="11" fill="#020617" />
                    <!-- Visor Highlight -->
                    <path d="M4,78 Q8,78 10,80" stroke="#475569" stroke-width="2" fill="none" />
                    
                    <!-- Torso (Stylized) -->
                    <path d="M-14,92 Q0,125 14,92 Z" fill="#020617" />
                    
                    <!-- Limbs (Dangling, Fragile) -->
                    <g stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <!-- Legs -->
                        <path d="M-10,125 L-15,175 L-5,190" />
                        <path d="M10,125 L20,170 L10,185" />
                        
                        <!-- Arms (Gripping lines) -->
                        <path d="M-10,100 L-35,115 L-25,130" />
                        <path d="M10,100 L35,115 L25,130" />
                    </g>
                    
                    <!-- Rim Light on Human (Separation) -->
                    <circle cx="0" cy="80" r="11" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.5" />
                </g>
            </g>

            <!-- Dynamic Motion Cues (Wind Trails) -->
            <g id="wind-lines">
                <!-- Generated by JS -->
            </g>
        </svg>
    </div>

    <!-- CONTENT / INTERACTION -->
    <div class="content-panel">
        
        <div class="header">
            <div class="tag">Mission: Vertical Gap</div>
            <h1>Controlled<br>Descent.</h1>
        </div>
        
        <p class="lead">
            Navigating the space between geological permanence and human fragility. 
            The parachute acts as a buffer against gravity, creating a moment of suspended time.
        </p>

        <!-- Data Grid: Anchored to the scene rhythm -->
        <div class="dashboard">
            <div class="data-point">
                <span class="data-label">Altitude</span>
                <div class="data-value-group">
                    <span class="data-value" id="alt-val">4,200</span>
                    <span class="data-unit">ft</span>
                </div>
            </div>
            
            <div class="data-point">
                <span class="data-label">Wind Speed</span>
                <div class="data-value-group">
                    <span class="data-value">24</span>
                    <span class="data-unit">mph</span>
                </div>
            </div>
            
            <div class="data-point">
                <span class="data-label">Canopy Tension</span>
                <div class="data-value-group">
                    <span class="data-value">88</span>
                    <span class="data-unit">%</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <span>SYS.AERO.VISUALS</span>
            <span>REC: ACTIVE</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const altVal = document.getElementById('alt-val');
            const windGroup = document.getElementById('wind-lines');
            
            let time = 0;
            let altitude = 4200;

            // Mouse interaction for parallax
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Create tapered wind streaks (SVG Paths)
            function createWindStreaks() {
                windGroup.innerHTML = '';
                for(let i=0; i<15; i++) {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    // Start positions (Randomized)
                    const startX = Math.random() * 1000;
                    const startY = Math.random() * 800;
                    // Length
                    const len = 100 + Math.random() * 200;
                    
                    // Draw a tapered shape: Top point -> Bottom wide -> Bottom point
                    // We will animate the translation of this path
                    const d = `M${startX},${startY} L${startX + len},${startY + 20} L${startX + len},${startY + 22} L${startX},${startY + 2} Z`;
                    
                    path.setAttribute("d", d);
                    path.setAttribute("fill", "#ffffff");
                    path.setAttribute("opacity", Math.random() * 0.15 + 0.05);
                    
                    // Store initial values in dataset for animation
                    path.dataset.x = startX;
                    path.dataset.y = startY;
                    path.dataset.len = len;
                    
                    windGroup.appendChild(path);
                }
            }
            createWindStreaks();

            function animate() {
                time += 0.015;
                
                // 1. Floating Motion (Sway)
                const swayX = Math.sin(time) * 20;
                const swayY = Math.cos(time * 0.6) * 15;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time) * 6;
                
                // 3. Canopy Flex (Breathing effect)
                const flex = Math.sin(time * 2) * 8;

                // Apply Transforms
                // Parallax + Sway
                const baseX = 650 + (mouseX * 30) + swayX;
                const baseY = 300 + (mouseY * 15) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing Human
                human.setAttribute('transform', `rotate(${swing}, 0, 100)`);

                // Flex Canopy
                const topY = -300 + flex;
                const botY = -180 + (flex * 0.5);
                canopy.setAttribute('d', `M-160,-140 Q0,${topY} 160,-140 Q0,${botY} -160,-140 Z`);

                // Animate Wind Trails
                const trails = windGroup.children;
                for(let i=0; i<trails.length; i++) {
                    let cx = parseFloat(trails[i].dataset.x);
                    let cy = parseFloat(trails[i].dataset.y);
                    const len = parseFloat(trails[i].dataset.len);
                    
                    // Move diagonally UP-LEFT (Wind blowing down-right relative to ground)
                    // Or DOWN-RIGHT if we want to simulate falling through air.
                    // Let's simulate falling: Wind lines move UP relative to the viewer.
                    // Wait, usually wind lines in "descent" art sweep across to show speed.
                    // Let's make them sweep diagonally UP-LEFT to show forward/downward momentum.
                    
                    cx -= 3; 
                    cy -= 1.5;

                    // Reset if off screen
                    if(cx < -300 || cy < -300) {
                        cx = 1200 + Math.random() * 200;
                        cy = Math.random() * 900;
                        trails[i].dataset.x = cx;
                        trails[i].dataset.y = cy;
                    }
                    
                    // Update Path Data
                    trails[i].setAttribute("d", `M${cx},${cy} L${cx + len},${cy + 20} L${cx + len},${cy + 22} L${cx},${cy + 2} Z`);
                }

                // Simulate Altitude Drop
                altitude -= 0.5;
                if (altitude < 1000) altitude = 4500;
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
