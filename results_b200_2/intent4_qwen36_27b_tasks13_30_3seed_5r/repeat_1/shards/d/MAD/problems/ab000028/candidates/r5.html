<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlled Descent | HUD Visual</title>
<style>
    :root {
        /* Palette - Atmospheric & Editorial */
        --c-sky-top: #0f172a;
        --c-sky-bottom: #1e293b;
        --c-rock-dark: #020617;
        --c-rock-light: #0f172a;
        --c-rock-stripe: #334155;
        --c-accent: #ff5500; /* High-vis Safety Orange */
        --c-text-white: #ffffff;
        --c-text-dim: rgba(255, 255, 255, 0.6);
        
        /* Typography */
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-sky-top);
        color: var(--c-text-white);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: relative;
    }

    /* --- BACKGROUND SCENE (SVG) --- */
    .scene-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Gradient sky */
        background: linear-gradient(to bottom, var(--c-sky-top) 0%, #1a2333 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- OVERLAY UI (HUD & TYPOGRAPHY) --- */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none; /* Let clicks pass to scene if needed */
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Header */
    .header {
        margin-top: 2rem;
    }

    .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: var(--c-accent);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        font-weight: 700;
    }

    .eyebrow::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: var(--c-accent);
        box-shadow: 0 0 10px var(--c-accent);
    }

    h1 {
        font-size: 5rem;
        line-height: 0.9;
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        color: var(--c-text-white);
        mix-blend-mode: overlay; /* Subtle blend with sky */
        text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* HUD Data Cluster */
    .hud-cluster {
        position: absolute;
        top: 25%;
        left: 5%;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .hud-label {
        font-family: var(--font-sans);
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--c-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.2rem;
    }

    .hud-value {
        font-family: var(--font-mono);
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--c-accent);
        text-shadow: 0 0 15px rgba(255, 85, 0, 0.3);
        font-variant-numeric: tabular-nums;
    }

    .hud-unit {
        font-size: 0.9rem;
        color: var(--c-text-white);
        opacity: 0.8;
        margin-left: 0.3rem;
    }

    /* Bottom Info */
    .footer-info {
        max-width: 300px;
        border-left: 2px solid var(--c-accent);
        padding-left: 1.5rem;
        margin-bottom: 2rem;
    }

    .footer-text {
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--c-text-dim);
        font-weight: 400;
    }

    .coordinates {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--c-text-dim);
        margin-top: 1rem;
        opacity: 0.5;
    }

    /* Responsive */
    @media (max-width: 900px) {
        .ui-layer { padding: 1.5rem; }
        h1 { font-size: 3rem; }
        .hud-cluster { top: auto; bottom: 2rem; left: 1.5rem; flex-direction: row; align-items: flex-end; }
        .hud-value { font-size: 1.8rem; }
        .footer-info { display: none; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 800">
            <defs>
                <!-- Filters -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
                </filter>
            </defs>

            <!-- 1. Background Sky (CSS handles gradient, this is for potential stars/particles) -->
            <rect width="100%" height="100%" fill="transparent" />

            <!-- 2. Distant Landscape (Atmospheric Depth) -->
            <g opacity="0.3" fill="#475569">
                <path d="M0,650 L150,580 L350,660 L550,520 L800,620 L1000,500 L1000,800 L0,800 Z" />
            </g>
            <g opacity="0.2" fill="#64748b">
                <path d="M0,700 L200,600 L400,720 L700,550 L1000,680 L1000,800 L0,800 Z" />
            </g>

            <!-- 3. The Cliff (Jagged, Layered, Left Edge) -->
            <g id="cliff-face">
                <!-- Base Mass -->
                <path d="M0,0 L350,0 L300,100 L380,180 L320,300 L420,380 L360,500 L480,600 L400,800 L0,800 Z" 
                      fill="var(--c-rock-dark)" />
                
                <!-- Strata Layers (Geological Weight) -->
                <g stroke="var(--c-rock-stripe)" stroke-width="2" fill="var(--c-rock-light)" opacity="0.8">
                    <!-- Layer 1 -->
                    <path d="M300,100 L380,180 L360,190 L280,110 Z" />
                    <!-- Layer 2 -->
                    <path d="M320,300 L420,380 L400,390 L300,310 Z" />
                    <!-- Layer 3 -->
                    <path d="M360,500 L480,600 L460,610 L340,510 Z" />
                    <!-- Layer 4 -->
                    <path d="M400,800 L480,600 L460,610 L400,800 Z" />
                </g>
                
                <!-- Jagged Highlights -->
                <path d="M350,0 L300,100 L380,180 L320,300 L420,380 L360,500 L480,600 L400,800" 
                      fill="none" 
                      stroke="#64748b" 
                      stroke-width="3" 
                      opacity="0.4" />
            </g>

            <!-- 4. Motion Blur / Wind Trails -->
            <g id="wind-lines">
                <!-- Generated by JS -->
            </g>

            <!-- 5. Parachutist Group -->
            <g id="parachutist" transform="translate(600, 300)">
                
                <!-- Suspension Lines -->
                <g id="lines" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7">
                    <!-- Lines fanning out -->
                    <line x1="-120" y1="-120" x2="0" y2="60" />
                    <line x1="-60" y1="-140" x2="0" y2="60" />
                    <line x1="0" y1="-150" x2="0" y2="60" />
                    <line x1="60" y1="-140" x2="0" y2="60" />
                    <line x1="120" y1="-120" x2="0" y2="60" />
                </g>

                <!-- The Canopy (Organic, Billowing) -->
                <path id="canopy" 
                      d="M-150,-100 Q-75,-220 0,-230 Q75,-220 150,-100 Q0,-150 -150,-100 Z" 
                      fill="var(--c-accent)" 
                      filter="url(#shadow)" />
                
                <!-- Canopy Detail (Paneling for 3D volume) -->
                <g stroke="#b91c0c" stroke-width="1.5" fill="none" opacity="0.4">
                    <path d="M-150,-100 Q-75,-220 0,-230" />
                    <path d="M150,-100 Q75,-220 0,-230" />
                    <path d="M-75,-120 Q-37,-220 0,-230" />
                    <path d="M75,-120 Q37,-220 0,-230" />
                    <!-- Bottom skirt -->
                    <path d="M-150,-100 Q0,-150 150,-100" stroke="#7f1d1d" stroke-width="3" opacity="0.8"/>
                </g>

                <!-- The Human Figure (Dynamic Silhouette) -->
                <g id="human" fill="#0f172a">
                    <!-- Legs (Dangling, relaxed but tensioned) -->
                    <path d="M -10,60 L -20,140 L -5,145 L 5,100 L 15,150 L 25,145 L 10,60 Z" />
                    
                    <!-- Torso (Seated position) -->
                    <path d="M -15,60 L 15,60 L 10,100 L -10,100 Z" />
                    
                    <!-- Head (Helmet) -->
                    <circle cx="0" cy="50" r="10" />
                    
                    <!-- Arms (Gripping toggles - reaching up) -->
                    <g stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <!-- Left Arm -->
                        <path d="M-8,65 L-30,40 L-15,30" />
                        <!-- Right Arm -->
                        <path d="M8,65 L30,40 L15,30" />
                    </g>
                </g>
            </g>
        </svg>
    </div>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <div class="header">
            <div class="eyebrow">System: Stable</div>
            <h1>Controlled<br>Descent</h1>
        </div>

        <!-- Floating HUD Data -->
        <div class="hud-cluster">
            <div class="hud-item">
                <span class="hud-label">Altitude</span>
                <span class="hud-value"><span id="alt-val">4,168</span><span class="hud-unit">ft</span></span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Wind Speed</span>
                <span class="hud-value">24<span class="hud-unit">mph</span></span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Tension</span>
                <span class="hud-value">88<span class="hud-unit">%</span></span>
            </div>
        </div>

        <div class="footer-info">
            <p class="footer-text">
                Navigating the space between geological permanence and human fragility. The parachute acts as a buffer against gravity, creating a moment of suspended time.
            </p>
            <div class="coordinates">
                44.2° N, 110.5° W<br>
                SECTOR 7G // VISUAL CONFIRMED
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const altVal = document.getElementById('alt-val');
            const windGroup = document.getElementById('wind-lines');
            
            let time = 0;
            let altitude = 4168;

            // Mouse interaction for parallax
            const scene = document.querySelector('.scene-container');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Create tapered wind streaks
            function createWindStreaks() {
                windGroup.innerHTML = '';
                for(let i=0; i<15; i++) {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    const startX = Math.random() * 1000;
                    const startY = Math.random() * 800;
                    const len = 150 + Math.random() * 300; // Longer streaks
                    
                    // Draw tapered shape
                    const d = `M${startX},${startY} L${startX + len},${startY + 5} L${startX + len},${startY + 8} L${startX},${startY + 3} Z`;
                    
                    path.setAttribute("d", d);
                    path.setAttribute("fill", "#ffffff");
                    path.setAttribute("opacity", Math.random() * 0.15 + 0.02);
                    
                    path.dataset.x = startX;
                    path.dataset.y = startY;
                    path.dataset.len = len;
                    
                    windGroup.appendChild(path);
                }
            }
            createWindStreaks();

            function animate() {
                time += 0.02;
                
                // 1. Floating Motion (Sway)
                // Slower, heavier sway for the parachute
                const swayX = Math.sin(time * 0.8) * 15;
                const swayY = Math.cos(time * 0.5) * 10;
                
                // 2. Pendulum Physics (Human swings slightly delayed)
                const swing = Math.sin(time * 0.8 + 0.5) * 12;
                
                // 3. Canopy Flex (Breathing)
                const flex = Math.sin(time * 1.5) * 8;

                // Apply Transforms
                // Base position centered right, adjusted by mouse parallax
                const baseX = 600 + (mouseX * 30) + swayX;
                const baseY = 300 + (mouseY * 15) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing Human (rotate around hips)
                human.setAttribute('transform', `rotate(${swing}, 0, 70)`);

                // Flex Canopy (change control points)
                const topY = -230 + flex;
                const botY = -150 + (flex * 0.3);
                canopy.setAttribute('d', `M-150,-100 Q-75,${topY} 0,${topY} Q75,${topY} 150,-100 Q0,${botY} -150,-100 Z`);

                // Animate Wind Trails
                const trails = windGroup.children;
                for(let i=0; i<trails.length; i++) {
                    let cx = parseFloat(trails[i].dataset.x);
                    let cy = parseFloat(trails[i].dataset.y);
                    const len = parseFloat(trails[i].dataset.len);
                    
                    // Move diagonally UP-LEFT (Simulating forward/downward momentum)
                    cx -= 6; // Faster wind
                    cy -= 3;

                    // Reset if off screen
                    if(cx < -500 || cy < -200) {
                        cx = 1200 + Math.random() * 200;
                        cy = Math.random() * 900;
                        trails[i].dataset.x = cx;
                        trails[i].dataset.y = cy;
                    }
                    
                    // Update Path Data
                    trails[i].setAttribute("d", `M${cx},${cy} L${cx + len},${cy + 5} L${cx + len},${cy + 8} L${cx},${cy + 3} Z`);
                }

                // Simulate Altitude Drop
                altitude -= 0.8;
                if (altitude < 1000) altitude = 4500;
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
