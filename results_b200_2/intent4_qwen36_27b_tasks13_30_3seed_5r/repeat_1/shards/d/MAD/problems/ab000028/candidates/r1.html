<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlled Descent | Editorial Visual</title>
<style>
    :root {
        /* Palette */
        --c-bg-dark: #0f172a;
        --c-bg-panel: #f8fafc;
        --c-text-main: #0f172a;
        --c-text-muted: #64748b;
        --c-accent: #f59e0b;
        --c-accent-dark: #b45309;
        --c-sky-top: #0f172a;
        --c-sky-mid: #334155;
        --c-sky-bot: #94a3b8;
        
        /* Typography */
        --font-serif: "Georgia", "Times New Roman", serif;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-bg-dark);
        color: var(--c-text-main);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
    }

    /* --- LEFT: VISUAL SCENE --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--c-sky-top) 0%, var(--c-sky-mid) 50%, var(--c-sky-bot) 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- RIGHT: EDITORIAL PANEL --- */
    .content-panel {
        position: relative;
        background: var(--c-bg-panel);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 4rem;
        box-shadow: -20px 0 60px rgba(0,0,0,0.3);
        z-index: 20;
    }

    /* Header Section */
    .header {
        margin-bottom: 2rem;
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--c-accent-dark);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: var(--c-accent);
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    h1 {
        font-family: var(--font-serif);
        font-size: 4.5rem;
        line-height: 0.9;
        font-weight: 400;
        color: var(--c-text-main);
        letter-spacing: -0.03em;
    }

    h1 em {
        font-style: italic;
        color: var(--c-text-muted);
        font-weight: 300;
    }

    /* Lead Text */
    .lead {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--c-text-muted);
        max-width: 400px;
        margin-bottom: 4rem;
        border-left: 1px solid #e2e8f0;
        padding-left: 1.5rem;
    }

    /* Data Grid */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        border-top: 2px solid var(--c-text-main);
        padding-top: 2rem;
    }

    .data-point {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--c-text-muted);
        font-weight: 600;
    }

    .data-value {
        font-family: var(--font-mono);
        font-size: 2rem;
        font-weight: 700;
        color: var(--c-text-main);
        letter-spacing: -0.05em;
    }

    .data-unit {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--c-accent-dark);
        font-weight: 600;
    }

    /* Footer */
    .footer {
        margin-top: auto;
        padding-top: 2rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--c-text-muted);
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #e2e8f0;
    }

    /* Animations */
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 900px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: 50vh 1fr;
        }
        .scene-container { order: 1; }
        .content-panel { 
            order: 2; 
            padding: 2rem; 
            box-shadow: 0 -20px 60px rgba(0,0,0,0.2);
        }
        h1 { font-size: 3rem; }
        .dashboard { grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .data-value { font-size: 1.5rem; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 800">
            <defs>
                <!-- Sky Gradient -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0f172a" />
                    <stop offset="40%" stop-color="#334155" />
                    <stop offset="100%" stop-color="#94a3b8" />
                </linearGradient>

                <!-- Canopy Gradient (Volume) -->
                <radialGradient id="canopyGrad" cx="0.5" cy="0.8" r="0.8">
                    <stop offset="0%" stop-color="#fbbf24" />
                    <stop offset="70%" stop-color="#f59e0b" />
                    <stop offset="100%" stop-color="#b45309" />
                </radialGradient>

                <!-- Figure Gradient (Rim Light) -->
                <linearGradient id="figureGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#334155" />
                </linearGradient>

                <!-- Blur for depth -->
                <filter id="blurSmall">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
                </filter>
                <filter id="blurLarge">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
                </filter>
            </defs>

            <!-- Background Sky -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />

            <!-- Distant Mountains (Depth Layer 1) -->
            <g opacity="0.3" fill="#1e293b">
                <path d="M0,600 L150,520 L300,650 L450,480 L600,600 L800,450 L800,800 L0,800 Z" />
            </g>
            
            <!-- Distant Mountains (Depth Layer 2) -->
            <g opacity="0.5" fill="#334155">
                <path d="M0,650 L200,580 L350,700 L500,550 L800,650 L800,800 L0,800 Z" />
            </g>

            <!-- The Main Cliff (Foreground Left) -->
            <g id="cliff">
                <!-- Base Shape -->
                <path d="M0,0 L220,0 L220,100 L260,120 L240,180 L300,200 L270,260 L340,300 L290,360 L370,440 L310,520 L400,700 L0,800 Z" fill="#0f172a" />
                
                <!-- Geometric Strata (Texture & Light) -->
                <path d="M220,100 L260,120 L240,180" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none" />
                <path d="M270,260 L340,300 L290,360" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none" />
                <path d="M370,440 L310,520" stroke="#64748b" stroke-width="8" stroke-linecap="round" fill="none" />
                
                <!-- Facets for 3D effect -->
                <polygon points="220,0 220,100 260,120" fill="#1e293b" />
                <polygon points="240,180 300,200 270,260" fill="#1e293b" />
                <polygon points="290,360 340,300 270,260" fill="#334155" opacity="0.5"/>
                <polygon points="310,520 370,440 290,360" fill="#334155" opacity="0.3"/>
            </g>

            <!-- Parachutist Group (Animated) -->
            <g id="parachutist" transform="translate(550, 300)">
                
                <!-- Taut Harness Lines -->
                <!-- Lines connect Canopy (top) to Human (bottom) -->
                <path id="lines" d="M-110,-140 L0,80 L110,-140 M-70,-140 L0,80 L70,-140 M-30,-140 L0,80 L30,-140" 
                      stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" />

                <!-- The Canopy -->
                <!-- Redesigned with volume -->
                <path id="canopy" d="M-130,-140 Q0,-290 130,-140 Q0,-180 -130,-140 Z" fill="url(#canopyGrad)" />
                
                <!-- Canopy Folds (Shadows) -->
                <g opacity="0.2" fill="#78350f">
                    <path d="M-130,-140 Q-65,-180 0,-150 L0,-140 Z" />
                    <path d="M130,-140 Q65,-180 0,-150 L0,-140 Z" />
                    <path d="M-65,-140 Q-32,-180 0,-150 L0,-140 Z" />
                    <path d="M65,-140 Q32,-180 0,-150 L0,-140 Z" />
                </g>

                <!-- The Human Figure (Stylized Silhouette) -->
                <g id="human">
                    <!-- Backpack -->
                    <rect x="-18" y="70" width="36" height="45" rx="4" fill="#1e293b" />
                    
                    <!-- Torso -->
                    <path d="M-12,85 Q0,120 12,85 Z" fill="url(#figureGrad)" />
                    
                    <!-- Head -->
                    <circle cx="0" cy="75" r="8" fill="#0f172a" />
                    
                    <!-- Limbs (Dynamic Pose) -->
                    <!-- Legs dangling -->
                    <path d="M-10,115 L-15,155 L-5,165" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10,115 L20,150 L10,160" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Arms gripping risers -->
                    <path d="M-10,90 L-35,105 L-20,115" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10,90 L35,105 L20,115" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                </g>
            </g>

            <!-- Wind / Speed Lines (Motion Cues) -->
            <g id="wind-lines" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
                <!-- Animated via JS -->
            </g>
        </svg>
    </div>

    <!-- CONTENT / INTERACTION -->
    <div class="content-panel">
        
        <div class="header">
            <div class="tag">Operation: High Altitude</div>
            <h1>Controlled<br><em>Descent.</em></h1>
        </div>
        
        <p class="lead">
            Navigating the vertical gap between geological permanence and human fragility. 
            A study in tension, aerodynamics, and the quiet moments of freefall.
        </p>

        <div class="dashboard">
            <div class="data-point">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">4,200</span>
                <span class="data-unit">ft</span>
            </div>
            <div class="data-point">
                <span class="data-label">Wind Speed</span>
                <span class="data-value">24</span>
                <span class="data-unit">mph</span>
            </div>
            <div class="data-point">
                <span class="data-label">Canopy Load</span>
                <span class="data-value">12</span>
                <span class="data-unit">kg</span>
            </div>
        </div>

        <div class="footer">
            <span>SYS.OMNIDIRECTIONAL</span>
            <span>V. 2.0.4</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const lines = document.getElementById('lines');
            const human = document.getElementById('human');
            const altVal = document.getElementById('alt-val');
            const windGroup = document.getElementById('wind-lines');
            
            let time = 0;
            let altitude = 4200;

            // Mouse interaction for parallax effect
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Create dynamic wind streaks
            function createWindStreaks() {
                windGroup.innerHTML = '';
                for(let i=0; i<15; i++) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", Math.random() * 800);
                    line.setAttribute("y1", Math.random() * 800);
                    line.setAttribute("x2", Math.random() * 800);
                    line.setAttribute("y2", Math.random() * 800);
                    line.setAttribute("opacity", Math.random() * 0.3);
                    windGroup.appendChild(line);
                }
            }
            createWindStreaks();

            function animate() {
                time += 0.015;
                
                // 1. Floating Motion (Sine waves)
                const swayX = Math.sin(time) * 25;
                const swayY = Math.cos(time * 0.6) * 15;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time) * 12;
                
                // 3. Breathing/Canopy Flex
                const flex = Math.sin(time * 3) * 8;

                // Apply transforms
                // Move the whole group based on mouse (parallax) + sway
                // Center is roughly 550, 300
                const baseX = 550 + (mouseX * 50) + swayX;
                const baseY = 300 + (mouseY * 30) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the connection point (0, 80 in local space)
                human.setAttribute('transform', `rotate(${swing}, 0, 80)`);

                // Flex the canopy shape slightly
                const topY = -290 + flex;
                const botY = -180 + (flex * 0.5);
                canopy.setAttribute('d', `M-130,-140 Q0,${topY} 130,-140 Q0,${botY} -130,-140 Z`);

                // Update wind streaks position to simulate speed
                const lines = windGroup.children;
                for(let i=0; i<lines.length; i++) {
                    let x1 = parseFloat(lines[i].getAttribute("x1"));
                    let y1 = parseFloat(lines[i].getAttribute("y1"));
                    let x2 = parseFloat(lines[i].getAttribute("x2"));
                    let y2 = parseFloat(lines[i].getAttribute("y2"));
                    
                    // Move diagonally up-left
                    x1 -= 3;
                    y1 -= 3;
                    x2 -= 3;
                    y2 -= 3;

                    // Reset if off screen
                    if(x2 < -100 || y2 < -100) {
                        x1 = 800 + Math.random() * 200;
                        y1 = Math.random() * 800;
                        x2 = x1 + 50;
                        y2 = y1 + 50;
                    }

                    lines[i].setAttribute("x1", x1);
                    lines[i].setAttribute("y1", y1);
                    lines[i].setAttribute("x2", x2);
                    lines[i].setAttribute("y2", y2);
                }

                // Simulate Altitude Drop
                altitude -= 0.5;
                if (altitude < 1000) altitude = 4500; // Reset loop
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
