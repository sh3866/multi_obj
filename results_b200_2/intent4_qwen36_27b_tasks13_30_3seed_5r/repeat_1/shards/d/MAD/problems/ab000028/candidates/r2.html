<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlled Descent | Editorial Visual</title>
<style>
    :root {
        /* Palette */
        --c-bg-dark: #020617; /* Slate 950 */
        --c-bg-panel: #f8fafc; /* Slate 50 */
        --c-text-main: #0f172a;
        --c-text-muted: #64748b;
        --c-accent: #f59e0b; /* Amber */
        --c-accent-dark: #b45309;
        --c-cliff-light: #cbd5e1; /* Rim light color */
        
        /* Typography */
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--c-bg-dark);
        color: var(--c-text-main);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1.4fr 0.6fr; /* Wider scene area */
    }

    /* --- LEFT: VISUAL SCENE --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Atmospheric Gradient */
        background: linear-gradient(to bottom, #1e1b4b 0%, #312e81 30%, #475569 70%, #94a3b8 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- RIGHT: EDITORIAL PANEL --- */
    .content-panel {
        position: relative;
        background: var(--c-bg-panel);
        display: flex;
        flex-direction: column;
        padding: 3rem;
        box-shadow: -10px 0 40px rgba(0,0,0,0.2);
        z-index: 10;
    }

    /* Header Section */
    .header {
        margin-bottom: 4rem;
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.65rem;
        font-weight: 700;
        color: var(--c-accent-dark);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 6px;
        height: 6px;
        background: var(--c-accent);
        border-radius: 50%;
    }

    h1 {
        font-family: var(--font-sans); /* Unified font family */
        font-size: 3.5rem; /* Reduced size */
        line-height: 0.95;
        font-weight: 800; /* Heavier weight for impact */
        color: var(--c-text-main);
        letter-spacing: -0.04em;
    }

    /* Lead Text */
    .lead {
        font-size: 0.95rem;
        line-height: 1.5;
        color: var(--c-text-muted);
        max-width: 320px;
        margin-bottom: auto;
        border-left: 2px solid var(--c-text-main);
        padding-left: 1.5rem;
    }

    /* Data Grid - Strict Baseline Grid */
    .dashboard {
        display: flex;
        flex-direction: column;
        gap: 1.5rem; /* Vertical rhythm */
        border-top: 1px solid #e2e8f0;
        padding-top: 1.5rem;
        margin-top: auto; /* Push to bottom */
    }

    .data-point {
        display: grid;
        grid-template-columns: 1fr 1fr; /* Label | Value */
        align-items: baseline;
        width: 100%;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--c-text-muted);
        font-weight: 600;
    }

    .data-value-group {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 0.5rem;
    }

    .data-value {
        font-family: var(--font-sans); /* Unified font */
        font-size: 1.5rem; /* Reduced size */
        font-weight: 700;
        color: var(--c-text-main);
        letter-spacing: -0.02em;
    }

    .data-unit {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        color: var(--c-text-muted);
        text-transform: uppercase;
    }

    /* Footer */
    .footer {
        margin-top: 2rem;
        padding-top: 1rem;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        color: #cbd5e1;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #e2e8f0;
    }

    /* Responsive */
    @media (max-width: 900px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: 55vh 1fr;
        }
        .scene-container { order: 1; }
        .content-panel { 
            order: 2; 
            padding: 2rem; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        }
        h1 { font-size: 2.5rem; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 800">
            <defs>
                <!-- Sky Gradient -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0f172a" />
                    <stop offset="40%" stop-color="#334155" />
                    <stop offset="100%" stop-color="#94a3b8" />
                </linearGradient>

                <!-- Canopy Gradient (Volume & Light) -->
                <radialGradient id="canopyGrad" cx="0.5" cy="0.2" r="0.9">
                    <stop offset="0%" stop-color="#fcd34d" /> <!-- Highlight -->
                    <stop offset="50%" stop-color="#f59e0b" />
                    <stop offset="100%" stop-color="#78350f" /> <!-- Shadow -->
                </radialGradient>

                <!-- Blur Filters for Depth -->
                <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
                </filter>
                <filter id="blurLarge" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
                </filter>
                
                <!-- Cliff Texture Gradient -->
                <linearGradient id="cliffGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>
            </defs>

            <!-- Background Sky -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />

            <!-- Distant Mountains (Depth Layer 1 - Far) -->
            <g opacity="0.2" fill="#1e293b" filter="url(#blurLarge)">
                <path d="M0,600 L150,520 L300,650 L450,480 L600,600 L800,450 L1000,550 L1000,800 L0,800 Z" />
            </g>
            
            <!-- Distant Mountains (Depth Layer 2 - Mid) -->
            <g opacity="0.4" fill="#334155" filter="url(#blurSmall)">
                <path d="M0,650 L200,580 L350,700 L500,550 L800,650 L1000,600 L1000,800 L0,800 Z" />
            </g>

            <!-- The Main Cliff (Foreground Left) - Overhauled -->
            <g id="cliff">
                <!-- Base Shape: Jagged and Textured -->
                <path d="M0,0 L350,0 L320,120 L380,160 L340,240 L420,280 L360,380 L460,460 L390,560 L500,720 L0,800 Z" fill="url(#cliffGrad)" />
                
                <!-- Geological Strata (Rock Layers) -->
                <!-- Darker internal lines to suggest depth -->
                <path d="M320,120 L380,160 L340,240" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
                <path d="M360,380 L420,280 L340,240" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
                <path d="M390,560 L460,460 L360,380" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
                <path d="M0,800 L500,720 L390,560" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1"/>
                
                <!-- Rim Light (Edge Highlight) -->
                <!-- Separates cliff from background -->
                <path d="M350,0 L320,120 L380,160 L340,240 L420,280 L360,380 L460,460 L390,560 L500,720" 
                      fill="none" 
                      stroke="#cbd5e1" 
                      stroke-width="3" 
                      stroke-linecap="round" 
                      stroke-linejoin="round"
                      opacity="0.6"
                      filter="url(#blurSmall)"/>
                
                <!-- Secondary sharp rim light -->
                <path d="M350,0 L320,120 L380,160 L340,240 L420,280 L360,380 L460,460 L390,560 L500,720" 
                      fill="none" 
                      stroke="#f8fafc" 
                      stroke-width="1" 
                      stroke-linecap="round" 
                      stroke-linejoin="round"
                      opacity="0.8"/>
            </g>

            <!-- Parachutist Group (Animated) -->
            <!-- Increased Scale significantly -->
            <g id="parachutist" transform="translate(600, 350)">
                
                <!-- Taut Harness Lines -->
                <!-- Connecting Canopy to Human -->
                <path id="lines" d="M-140,-160 L0,100 L140,-160 M-90,-160 L0,100 L90,-160 M-40,-160 L0,100 L40,-160" 
                      stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />

                <!-- The Canopy -->
                <!-- Distorted shape for wind shear/lift -->
                <path id="canopy" d="M-160,-150 Q0,-320 150,-140 Q0,-180 -160,-150 Z" fill="url(#canopyGrad)" />
                
                <!-- Canopy Folds (Shadows/Detail) -->
                <g opacity="0.25" fill="#451a03">
                    <path d="M-160,-150 Q-80,-200 0,-170 L0,-150 Z" />
                    <path d="M150,-140 Q75,-200 0,-170 L0,-150 Z" />
                    <path d="M-80,-150 Q-40,-200 0,-170 L0,-150 Z" />
                    <path d="M80,-140 Q40,-200 0,-170 L0,-150 Z" />
                </g>

                <!-- The Human Figure (Detailed Silhouette) -->
                <g id="human">
                    <!-- Backpack / Rigger Plate -->
                    <rect x="-22" y="90" width="44" height="50" rx="6" fill="#0f172a" />
                    
                    <!-- Torso -->
                    <path d="M-15,105 Q0,145 15,105 Z" fill="#020617" />
                    
                    <!-- Head -->
                    <circle cx="0" cy="95" r="10" fill="#020617" />
                    
                    <!-- Limbs (Dynamic Pose - Dangling) -->
                    <!-- Legs -->
                    <path d="M-12,140 L-18,190 L-8,205" fill="none" stroke="#020617" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12,140 L25,185 L15,200" fill="none" stroke="#020617" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Arms (Gripping risers) -->
                    <path d="M-12,110 L-45,130 L-30,145" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12,110 L45,130 L30,145" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                </g>
            </g>

            <!-- Wind / Speed Lines (Motion Cues) -->
            <g id="wind-lines" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5">
                <!-- Generated by JS -->
            </g>
        </svg>
    </div>

    <!-- CONTENT / INTERACTION -->
    <div class="content-panel">
        
        <div class="header">
            <div class="tag">Operation: High Altitude</div>
            <h1>Controlled<br>Descent.</h1>
        </div>
        
        <p class="lead">
            Navigating the vertical gap between geological permanence and human fragility. 
            A study in tension, aerodynamics, and the quiet moments of freefall.
        </p>

        <!-- Data Grid: Vertical Baseline Grid Implementation -->
        <div class="dashboard">
            <div class="data-point">
                <span class="data-label">Altitude</span>
                <div class="data-value-group">
                    <span class="data-value" id="alt-val">4,200</span>
                    <span class="data-unit">ft</span>
                </div>
            </div>
            
            <div class="data-point">
                <span class="data-label">Wind Speed</span>
                <div class="data-value-group">
                    <span class="data-value">24</span>
                    <span class="data-unit">mph</span>
                </div>
            </div>
            
            <div class="data-point">
                <span class="data-label">Canopy Load</span>
                <div class="data-value-group">
                    <span class="data-value">12</span>
                    <span class="data-unit">kg</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <span>SYS.OMNIDIRECTIONAL</span>
            <span>V. 2.0.4</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopy = document.getElementById('canopy');
            const human = document.getElementById('human');
            const altVal = document.getElementById('alt-val');
            const windGroup = document.getElementById('wind-lines');
            
            let time = 0;
            let altitude = 4200;

            // Mouse interaction for parallax effect
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                mouseX = (e.clientX - rect.left) / rect.width - 0.5;
                mouseY = (e.clientY - rect.top) / rect.height - 0.5;
            });

            // Create dynamic wind streaks
            function createWindStreaks() {
                windGroup.innerHTML = '';
                for(let i=0; i<20; i++) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    // Random positions
                    line.setAttribute("x1", Math.random() * 1000);
                    line.setAttribute("y1", Math.random() * 800);
                    // Length varies
                    const length = 50 + Math.random() * 100;
                    line.setAttribute("x2", parseFloat(line.getAttribute("x1")) - length);
                    line.setAttribute("y2", parseFloat(line.getAttribute("y1")) - (length * 0.5)); // Diagonal up-left
                    line.setAttribute("opacity", Math.random() * 0.4 + 0.1);
                    windGroup.appendChild(line);
                }
            }
            createWindStreaks();

            function animate() {
                time += 0.015;
                
                // 1. Floating Motion (Sine waves) - Smoother
                const swayX = Math.sin(time) * 30;
                const swayY = Math.cos(time * 0.6) * 20;
                
                // 2. Pendulum Physics (Human swings slightly opposite to canopy drift)
                const swing = Math.sin(time) * 8;
                
                // 3. Breathing/Canopy Flex (Wind Shear)
                const flex = Math.sin(time * 2.5) * 10;

                // Apply transforms
                // Center is roughly 600, 350
                // Parallax influence
                const baseX = 600 + (mouseX * 40) + swayX;
                const baseY = 350 + (mouseY * 20) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the connection point (0, 100 in local space)
                human.setAttribute('transform', `rotate(${swing}, 0, 100)`);

                // Flex the canopy shape slightly (Wind Shear)
                // Modifying the bezier control points
                const topY = -320 + flex;
                const botY = -180 + (flex * 0.5);
                // Slight asymmetry for wind effect
                const leftX = -160 + (Math.sin(time*2)*5);
                const rightX = 150 - (Math.sin(time*2)*5);
                
                canopy.setAttribute('d', `M${leftX},-150 Q0,${topY} ${rightX},-140 Q0,${botY} ${leftX},-150 Z`);

                // Update wind streaks position to simulate speed
                const lines = windGroup.children;
                for(let i=0; i<lines.length; i++) {
                    let x1 = parseFloat(lines[i].getAttribute("x1"));
                    let y1 = parseFloat(lines[i].getAttribute("y1"));
                    
                    // Move diagonally up-left (Wind direction)
                    x1 -= 4; 
                    y1 -= 2;

                    // Reset if off screen
                    if(x1 < -200 || y1 < -200) {
                        x1 = 1000 + Math.random() * 200;
                        y1 = Math.random() * 800;
                        lines[i].setAttribute("x1", x1);
                        lines[i].setAttribute("y1", y1);
                        
                        // Recalculate end point
                        const length = 50 + Math.random() * 100;
                        lines[i].setAttribute("x2", x1 - length);
                        lines[i].setAttribute("y2", y1 - (length * 0.5));
                    } else {
                        lines[i].setAttribute("x1", x1);
                        lines[i].setAttribute("y1", y1);
                        // Update x2/y2 to keep length constant relative to movement
                        let x2 = parseFloat(lines[i].getAttribute("x2"));
                        let y2 = parseFloat(lines[i].getAttribute("y2"));
                        x2 -= 4;
                        y2 -= 2;
                        lines[i].setAttribute("x2", x2);
                        lines[i].setAttribute("y2", y2);
                    }
                }

                // Simulate Altitude Drop
                altitude -= 0.8;
                if (altitude < 1000) altitude = 4500; // Reset loop
                altVal.innerText = Math.floor(altitude).toLocaleString();

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
