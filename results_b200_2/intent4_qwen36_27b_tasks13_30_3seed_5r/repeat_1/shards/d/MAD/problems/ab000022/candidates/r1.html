<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            /* Color Palette */
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #B3E5FC;
            --c-primary: #FF6F00; /* Bouncy Orange */
            --c-primary-dark: #E65100;
            --c-accent: #0288D1; /* Bolt Blue */
            --c-gold: #FFD700;
            --c-dark: #263238;
            --c-text: #FFFFFF;
            
            /* UI Grammar */
            --border-radius-ui: 8px; /* Vectorized Pixel standard */
            --shadow-hard: 4px 4px 0px rgba(0,0,0,0.25);
            --shadow-button: 0px 12px 0px #BF360C; /* Squash shadow */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Verdana', 'Segoe UI', sans-serif;
            background: #000;
            color: var(--c-text);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            display: grid;
            grid-template-columns: 1fr;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            grid-template-rows: 100px 1fr 120px;
            pointer-events: none;
        }

        /* 1. HEADER: TOP LEFT BRAND */
        header {
            grid-column: 1;
            grid-row: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 3.5rem;
            color: var(--c-white);
            text-transform: uppercase;
            text-shadow: 4px 4px 0px var(--c-primary), 6px 6px 0px rgba(0,0,0,0.3);
            line-height: 0.9;
            transform: skewX(-8deg);
            letter-spacing: -2px;
        }

        .subtitle {
            font-family: 'Arial Black', sans-serif;
            color: var(--c-dark);
            font-size: 1rem;
            background: var(--c-accent);
            padding: 6px 16px;
            border-radius: var(--border-radius-ui);
            display: inline-block;
            margin-top: 10px;
            transform: skewX(-8deg);
            box-shadow: var(--shadow-hard);
            width: fit-content;
        }

        /* 2. LEFT: PORTALS (World Select) */
        .world-selector {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .portal {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Portal Ring Styles */
        .portal::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 6px solid var(--c-white);
            box-shadow: 0 0 15px var(--c-white), inset 0 0 10px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .portal::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), transparent);
            z-index: 2;
        }

        /* Portal Variants */
        .p1 { background: #4CAF50; box-shadow: 0 0 20px #4CAF50; }
        .p2 { background: #FFB74D; box-shadow: 0 0 20px #FFB74D; opacity: 0.5; filter: grayscale(0.8); }
        .p3 { background: #26C6DA; box-shadow: 0 0 20px #26C6DA; opacity: 0.5; filter: grayscale(0.8); }

        .portal:hover { transform: scale(1.1); }
        .portal.active { transform: scale(1.2); }
        .portal.active::after { animation: swirl 2s infinite linear; }

        .portal-label {
            position: absolute;
            left: 100px;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: var(--border-radius-ui);
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .portal:hover .portal-label { opacity: 1; }

        /* 3. RIGHT: CONTROLS (Grouped) */
        .controls-guide {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 40px;
            pointer-events: auto;
        }

        .controls-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .key-group {
            display: grid;
            gap: 6px;
        }
        .d-pad {
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(2, 40px);
        }
        .d-pad .k:nth-child(1) { grid-column: 2; grid-row: 1; }
        .d-pad .k:nth-child(2) { grid-column: 1; grid-row: 2; }
        .d-pad .k:nth-child(3) { grid-column: 2; grid-row: 2; }
        .d-pad .k:nth-child(4) { grid-column: 3; grid-row: 2; }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .k {
            width: 40px; height: 40px;
            background: #FFF;
            border-radius: var(--border-radius-ui);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--c-dark);
            box-shadow: 0 4px 0 #999;
            font-family: monospace;
            font-size: 1.2rem;
        }

        .k.big {
            width: 100px; height: 40px;
            background: var(--c-primary);
            color: white;
            box-shadow: 0 4px 0 var(--c-primary-dark);
        }

        .control-text {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 4. START BUTTON (Bottom Right) */
        .start-area {
            grid-column: 3;
            grid-row: 3;
            padding: 0 40px 40px 0;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .btn-start {
            background: linear-gradient(180deg, #FF8A65 0%, var(--c-primary) 100%);
            color: var(--c-white);
            font-family: 'Arial Black', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            padding: 20px 60px;
            border: 4px solid var(--c-dark);
            border-radius: 50px; /* Pill shape */
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: var(--shadow-button);
            position: relative;
            transform: rotate(-2deg);
        }

        /* Squash and Stretch Gradient Highlight */
        .btn-start::after {
            content: '';
            position: absolute;
            top: 5px; left: 10px; right: 10px; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
            border-radius: 40px 40px 10px 10px;
            pointer-events: none;
        }

        .btn-start:active {
            transform: rotate(-2deg) translateY(10px);
            box-shadow: 0 2px 0 #BF360C;
        }

        .btn-start span {
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            /* Ensure legibility */
            -webkit-text-stroke: 1px rgba(0,0,0,0.1); 
        }

        /* COLLECTIBLES COUNTER (Top Right) */
        .stats-bar {
            grid-column: 3;
            grid-row: 1;
            padding: 30px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .stat-pill {
            background: var(--c-white);
            padding: 8px 16px;
            border-radius: var(--border-radius-ui);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            color: var(--c-dark);
            box-shadow: var(--shadow-hard);
            border: 2px solid var(--c-dark);
            font-family: monospace;
            font-size: 1.2rem;
        }

        /* ANIMATIONS */
        @keyframes swirl {
            0% { transform: rotate(0deg) scale(0.9); opacity: 0.8; }
            50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
            100% { transform: rotate(360deg) scale(0.9); opacity: 0.8; }
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .world-selector {
                grid-column: 1; grid-row: 3;
                flex-direction: row;
                padding: 20px;
            }
            .controls-guide {
                grid-column: 1; grid-row: 2;
                position: absolute;
                bottom: 120px; right: 20px;
                padding: 10px;
            }
            .controls-container {
                transform: scale(0.8);
                transform-origin: right bottom;
            }
            .start-area {
                grid-column: 1; grid-row: 3;
                justify-content: center;
                padding: 20px;
            }
            header { padding: 15px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- TOP LEFT: BRAND -->
        <header>
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </header>

        <!-- TOP RIGHT: STATS -->
        <div class="stats-bar">
            <div class="stat-pill">
                <span style="color: #FBC02D; font-size: 1.4rem;">●</span> 1,240
            </div>
            <div class="stat-pill">
                <span style="color: #D32F2F; font-size: 1.4rem;">♥</span> 5
            </div>
        </div>

        <!-- LEFT: DIEGETIC PORTALS -->
        <aside class="world-selector">
            <div class="portal p1 active">
                <div class="portal-label">Spring Valley</div>
            </div>
            <div class="portal p2">
                <div class="portal-label">Sand Springs</div>
            </div>
            <div class="portal p3">
                <div class="portal-label">Cloud Peak</div>
            </div>
        </aside>

        <!-- BOTTOM RIGHT: CONTROLS (Grouped) -->
        <aside class="controls-guide">
            <div class="controls-container">
                <div class="key-group d-pad">
                    <div class="k">W</div>
                    <div class="k">A</div>
                    <div class="k">S</div>
                    <div class="k">D</div>
                </div>
                <div class="action-group">
                    <div class="k big">SPACE</div>
                    <div class="control-text">Jump to Bounce</div>
                </div>
            </div>
        </aside>

        <!-- BOTTOM RIGHT: START BUTTON -->
        <div class="start-area">
            <button class="btn-start"><span>Start Adventure</span></button>
        </div>

    </div>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE
     * Focus: Parallax depth, Gameplay Storytelling (Left to Right composition)
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Colors
    const C_SKY = '#4FC3F7';
    const C_GROUND = '#5D4037';
    const C_GRASS = '#7CB342';
    const C_GRASS_LIT = '#AED581';

    // Helper: Draw Rounded Rect
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // Helper: Draw Block
    function drawBlock(x, y, size) {
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(x, y, size, size);
        // Bevel
        ctx.fillStyle = '#A1887F';
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        ctx.fillStyle = '#4E342E';
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);
        // Detail
        ctx.fillStyle = '#3E2723';
        ctx.font = 'bold ' + (size/2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 2);
    }

    // Helper: Draw Gold Block
    function drawGoldBlock(x, y, size, offset) {
        ctx.fillStyle = '#FFCA28';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = '#FFF59D';
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        ctx.fillStyle = '#FF8F00';
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);
        
        // Pulse
        const scale = 1 + Math.sin((frame + offset) * 0.1) * 0.05;
        ctx.save();
        ctx.translate(x + size/2, y + size/2);
        ctx.scale(scale, scale);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold ' + (size/1.8) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 2);
        ctx.restore();
    }

    // Helper: Draw Cloud
    function drawCloud(x, y, scale, opacity) {
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 10 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 50 * scale, y, 30 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    // Helper: Draw Coin
    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 3;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 5, 4, 10);
    }

    // Helper: Draw Enemy (Spiky Ball)
    function drawEnemy(x, y, size) {
        const bounce = Math.sin(frame * 0.15) * 5;
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath();
        ctx.arc(x, y + bounce, size/2, 0, Math.PI*2);
        ctx.fill();
        // Spikes
        for(let i=0; i<8; i++) {
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.rotate((i * Math.PI * 2) / 8 + frame * 0.05);
            ctx.fillStyle = '#B71C1C';
            ctx.fillRect(-4, -size/2 - 5, 8, 10);
            ctx.restore();
        }
        // Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x-5, y+bounce-2, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+5, y+bounce-2, 4, 0, Math.PI*2); ctx.fill();
    }

    // Helper: Draw Flag
    function drawFlag(x, y, h) {
        // Pole
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 6, h);
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(x+3, y, 8, 0, Math.PI*2); ctx.fill();
        
        // Flag cloth
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+6, y+10);
        ctx.lineTo(x+60, y+30 + Math.sin(frame*0.1)*5);
        ctx.lineTo(x+6, y+50);
        ctx.fill();
    }

    // PARTICLES
    const particles = [];
    function spawnParticle() {
        if(Math.random() > 0.08) return;
        particles.push({
            x: Math.random() * width,
            y: height - 100,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            life: 100,
            color: Math.random() > 0.5 ? '#FFF' : '#FFD700'
        });
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    // HERO CHARACTER DRAWING (Canvas)
    function drawHero(x, y) {
        const bounce = Math.sin(frame * 0.1) * 10;
        const squash = Math.cos(frame * 0.1) * 2;
        
        ctx.save();
        ctx.translate(x, y + bounce);
        
        // Spring
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(-15, 20, 30, 20);
        ctx.fillStyle = '#546E7A';
        for(let i=0; i<4; i++) {
            ctx.fillRect(-15, 20 + i*5, 30, 2);
        }

        // Body
        ctx.fillStyle = '#FF6F00';
        ctx.beginPath();
        ctx.arc(0, 0 + squash, 40 - squash, 0, Math.PI * 2);
        ctx.fill();
        
        // Face
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(10, -5, 20, 15, 0, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#263238';
        ctx.beginPath(); ctx.arc(15, -8, 4, 0, Math.PI*2); ctx.fill(); // Right eye (forward)
        ctx.beginPath(); ctx.arc(5, -8, 4, 0, Math.PI*2); ctx.fill();  // Left eye

        // Mouth
        ctx.beginPath();
        ctx.arc(12, 2, 8, 0, Math.PI, false);
        ctx.stroke();

        ctx.restore();
    }

    // SCENE OBJECTS
    const clouds = [
        {x: 100, y: 150, s: 1},
        {x: 400, y: 100, s: 0.8},
        {x: 800, y: 180, s: 1.2},
        {x: 1100, y: 120, s: 0.9}
    ];

    // Main Loop
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#4FC3F7');
        grad.addColorStop(1, '#B3E5FC');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        const groundY = height - 150; 

        // 1. Clouds
        clouds.forEach(c => {
            let moveX = c.x + Math.sin(frame * 0.005 + c.x) * 20;
            drawCloud(moveX, c.y, c.s, 0.8);
        });

        // 2. Distant Mountains
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 200);
        ctx.lineTo(width * 0.5, groundY);
        ctx.lineTo(width * 0.8, groundY - 150);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // 3. Platforms (Storytelling Layout)
        
        // Start Platform (Left) - Hero stands here
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, groundY, 400, 150); // Main ground
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(0, groundY, 400, 20);
        // Grass detail
        ctx.fillStyle = '#AED581';
        for(let i=0; i<400; i+=40) ctx.fillRect(i, groundY, 20, 6);

        // Mid Platforms
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(450, groundY - 100, 200, 50);
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(450, groundY - 100, 200, 15);

        ctx.fillStyle = '#5D4037';
        ctx.fillRect(700, groundY - 200, 300, 50);
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(700, groundY - 200, 300, 15);

        // Goal Platform (Right)
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(1050, groundY - 100, 300, 250);
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(1050, groundY - 100, 300, 20);

        // 4. Blocks & Coins
        drawBlock(500, groundY - 230, 50);
        drawGoldBlock(560, groundY - 230, 50, 10);
        drawBlock(620, groundY - 230, 50);
        
        drawCoin(535, groundY - 280, 10);
        drawCoin(840, groundY - 260, 10);

        // 5. Enemy
        drawEnemy(800, groundY - 250, 40);

        // 6. Goal Flag (Far Right)
        drawFlag(1200, groundY - 350, 350);

        // 7. HERO (Far Left, looking right)
        drawHero(150, groundY - 40);

        // 8. Particles
        spawnParticle();
        updateParticles();

        requestAnimationFrame(loop);
    }

    loop();

</script>
</body>
</html>
