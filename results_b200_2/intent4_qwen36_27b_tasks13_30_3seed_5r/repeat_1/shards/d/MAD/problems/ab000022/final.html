<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring & Bolt - The Great Adventure</title>
    <style>
        :root {
            /* Palette - Thematic & Cohesive */
            --c-sky: #81D4FA;
            --c-primary: #FF9800; 
            --c-primary-dark: #E65100;
            --c-primary-light: #FFE0B2;
            --c-ui-bg: #FFFFFF;
            --c-ui-text: #263238;
            --c-stroke: #263238;
            
            /* UI Grammar - "Bubbly" Style */
            --radius-ui: 16px;
            --stroke-ui: 3px;
            --shadow-solid: 4px 4px 0px var(--c-stroke);
            
            /* World Colors */
            --c-grass: #7CB342;
            --c-sand: #FFB74D;
            --c-sky: #4FC3F7;

            /* Typography */
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--c-sky);
            color: var(--c-ui-text);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            /* 3 Column Layout: Left Brand, Center Empty (Canvas), Right Bottom Controls */
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            pointer-events: none;
        }

        /* --- SHARED UI COMPONENTS --- */
        .ui-element {
            background: var(--c-ui-bg);
            border: var(--stroke-ui) solid var(--c-stroke);
            border-radius: var(--radius-ui);
            box-shadow: var(--shadow-solid);
            pointer-events: auto;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 1. HEADER (Top Left - Brand) */
        header {
            grid-column: 1;
            grid-row: 1;
            padding: 40px;
            pointer-events: none;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            color: var(--c-ui-bg);
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
            /* Outline effect */
            -webkit-text-stroke: 2px var(--c-stroke);
            text-shadow: 4px 4px 0 var(--c-stroke);
            transform: skewX(-5deg);
        }
        h1 span {
            color: var(--c-primary);
            -webkit-text-stroke: 2px var(--c-stroke);
            display: block;
            font-size: 1.2em;
        }

        /* 2. TOP RIGHT: COLLECTIBLES (Demoted, Lower Contrast) */
        .stats-container {
            grid-column: 3;
            grid-row: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
            opacity: 0.9;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.8);
            border: 2px solid var(--c-stroke);
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.9rem;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
        }

        /* 3. BOTTOM LEFT: CONTROLS (Demoted, Lower Opacity) */
        .controls-guide {
            grid-column: 1;
            grid-row: 3;
            padding: 30px;
            display: flex;
            align-items: flex-end;
            pointer-events: auto;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .controls-guide:hover { opacity: 1; }

        .key {
            width: 24px; height: 24px;
            background: #FFF;
            border: 2px solid var(--c-stroke);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.65rem;
            color: var(--c-stroke);
            margin-right: 4px;
        }
        .key.jumper {
            width: 60px;
            background: var(--c-primary);
            color: white;
            border-color: var(--c-stroke);
            margin-left: 6px;
        }

        /* 4. CENTER-BOTTOM: GAMEPLAY AREA (World Selector + CTA) */
        .gameplay-dock {
            grid-column: 2;
            grid-row: 3;
            padding: 0 20px 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            pointer-events: none; /* Let clicks pass through gaps */
        }

        /* The World Map Selector (Gamified) */
        .world-map {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.9);
            border: var(--stroke-ui) solid var(--c-stroke);
            border-radius: 50px;
            box-shadow: var(--shadow-solid);
            align-items: center;
        }

        .world-portal {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--c-stroke);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #eee;
        }

        .world-portal::after {
            content: '';
            position: absolute;
            top: -4px; right: -4px; bottom: -4px; left: -4px;
            border-radius: 50%;
            border: 2px dashed rgba(0,0,0,0.1);
            animation: spin 10s linear infinite;
        }

        .world-portal:hover { transform: translateY(-5px); }
        
        .world-portal.active {
            transform: scale(1.15);
            border-width: 4px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .wp-grass { background: var(--c-grass); }
        .wp-sand { background: var(--c-sand); }
        .wp-sky { background: var(--c-sky); }

        /* The Start Button (Elevated) */
        .btn-start {
            pointer-events: auto;
            font-family: var(--font-display);
            font-size: 1.5rem;
            text-transform: uppercase;
            padding: 15px 40px;
            background: var(--c-primary);
            color: var(--c-ui-bg);
            border: var(--stroke-ui) solid var(--c-stroke);
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            
            /* Solid geometric shadow, no blur */
            box-shadow: 0 6px 0 var(--c-stroke);
            
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 var(--c-stroke);
            background: var(--c-primary-light);
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--c-stroke);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 2.5rem; }
            .ui-layer { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
            header { grid-column: 1; padding: 20px; }
            .stats-container { grid-column: 1; flex-direction: row; justify-content: flex-end; padding: 20px; }
            .controls-guide { display: none; } /* Hide on mobile */
            .gameplay-dock { grid-column: 1; padding: 20px; }
            .world-map { display: none; } /* Simplified for mobile */
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- TOP LEFT: BRAND -->
        <header>
            <h1>Spring<br><span>& Bolt</span></h1>
        </header>

        <!-- TOP RIGHT: STATS (Demoted) -->
        <div class="stats-container">
            <div class="stat-pill"><span style="color:#FBC02D">●</span> 1,240</div>
            <div class="stat-pill"><span style="color:#00E5FF">♦</span> 08</div>
        </div>

        <!-- CENTER BOTTOM: WORLD SELECTOR + CTA -->
        <div class="gameplay-dock">
            
            <!-- World Map -->
            <div class="world-map">
                <div class="world-portal wp-grass active" title="Grassland">🌿</div>
                <div class="world-portal wp-sand" title="Dunes">🏜️</div>
                <div class="world-portal wp-sky" title="Sky High">☁️</div>
            </div>

            <!-- Start Button -->
            <button class="btn-start">Start Adventure</button>
        </div>

        <!-- BOTTOM LEFT: CONTROLS (Demoted) -->
        <aside class="controls-guide">
            <div style="display:flex; align-items:center;">
                <div class="key">W</div>
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
                <div class="key jumper">SPACE</div>
            </div>
        </aside>

    </div>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE
     * Focus: Parallax, Depth, and "Bubbly" Geometry
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- CONSTANTS ---
    const STROKE_W = 3;
    const COLOR_STROKE = '#263238';
    
    // --- DRAWING HELPERS ---
    
    // Draw a solid color rect with a rounded top (Platform style)
    function drawPlatform(x, y, w, h, colorTop, colorBody) {
        ctx.save();
        ctx.lineWidth = STROKE_W;
        ctx.strokeStyle = COLOR_STROKE;
        ctx.lineJoin = 'round';

        // Body
        ctx.fillStyle = colorBody;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 8);
        ctx.fill();
        ctx.stroke();

        // Grass/Top Layer
        ctx.fillStyle = colorTop;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h * 0.35, [8, 8, 0, 0]);
        ctx.fill();
        ctx.stroke();
        
        ctx.restore();
    }

    // Draw a perfect circle with stroke (Coins/Portals)
    function drawBubble(x, y, r, color) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = STROKE_W;
        ctx.strokeStyle = COLOR_STROKE;
        ctx.stroke();
    }

    // --- LAYERS ---

    // 1. BACKGROUND (Sky + Far Hills)
    function drawBackground() {
        // Sky (Solid Color per Critique)
        ctx.fillStyle = '#81D4FA';
        ctx.fillRect(0, 0, width, height);

        // Distant Hills (Parallax Layer 1)
        const time = frame * 0.05;
        ctx.fillStyle = '#B3E5FC';
        ctx.beginPath();
        ctx.moveTo(0, height);
        // Curvy hills
        for(let i=0; i<=width; i+=100) {
            ctx.lineTo(i, height - 250 + Math.sin((i + time)/300) * 50);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#4FC3F7';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // 2. MIDGROUND (Clouds + Goal)
    function drawMidground() {
        const time = frame * 0.1;
        
        // Clouds
        for(let i=0; i<4; i++) {
            let cx = ((i * 400) + (time * (i%2===0 ? 1 : -0.5))) % (width + 200) - 100;
            let cy = 150 + (i * 60);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.arc(cx + 40, cy - 10, 40, 0, Math.PI * 2);
            ctx.arc(cx + 80, cy, 30, 0, Math.PI * 2);
            ctx.fill();
            // Simple stroke for clouds
            ctx.strokeStyle = '#E1F5FE';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // DISTANT GOAL (The Castle/Flag) - Far Right
        const gx = width * 0.85;
        const gy = height - 250; // Sitting on the midground hill
        
        // Flag Pole
        ctx.strokeStyle = '#5D4037';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - 120); ctx.stroke();
        
        // Flag (Bubbly shape)
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(gx, gy - 120);
        ctx.bezierCurveTo(gx + 40, gy - 100, gx + 60, gy - 140, gx + 80, gy - 120);
        ctx.lineTo(gx, gy - 80);
        ctx.fill();
        ctx.strokeStyle = COLOR_STROKE;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // 3. FOREGROUND (The "Level" & Hero)
    function drawLevel() {
        // Ground Plane (Connects everything to bottom)
        const groundY = height - 100;
        
        // Main Ground
        drawPlatform(0, groundY, width, 200, '#7CB342', '#795548');

        // Floating Platforms
        const p1Y = groundY - 150;
        drawPlatform(width * 0.3, p1Y, 160, 40, '#7CB342', '#795548');
        
        const p2Y = p1Y - 100;
        drawPlatform(width * 0.55, p2Y, 160, 40, '#7CB342', '#795548');

        // Interactives
        // Mystery Block
        const mx = width * 0.3 + 60;
        const my = p1Y - 70;
        drawBubble(mx, my, 25, '#FFCA28');
        ctx.fillStyle = COLOR_STROKE;
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', mx, my + 2);

        // Coins
        const cY = p1Y - 120;
        for(let i=0; i<3; i++) {
            const bounce = Math.sin(frame * 0.1 + i) * 5;
            drawBubble(width * 0.3 + 60 + (i*40), cY + bounce, 10, '#FFD54F');
        }

        // Enemy (Simple Spiky Ball)
        const ex = width * 0.55 + 60;
        const ey = p2Y - 30;
        const eBounce = Math.abs(Math.sin(frame * 0.08)) * -10;
        
        ctx.save();
        ctx.translate(ex, ey + eBounce);
        ctx.rotate(frame * 0.05);
        
        // Body
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = STROKE_W; ctx.strokeStyle = COLOR_STROKE; ctx.stroke();
        
        // Spikes
        for(let i=0; i<6; i++) {
            ctx.rotate(Math.PI/3);
            ctx.fillStyle = '#B71C1C';
            ctx.beginPath(); ctx.moveTo(15, -5); ctx.lineTo(25, 0); ctx.lineTo(15, 5); ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    }

    // 4. HERO (The Mascot - Grounded)
    function drawHero() {
        // Position: Standing on the first platform
        const hx = width * 0.3 + 80;
        const hy = height - 150 - 40 - 50; // Platform Y - Thickness - Hero Height/2

        // Idle Animation
        const squash = Math.cos(frame * 0.1) * 4;
        const breathe = Math.sin(frame * 0.05) * 2;

        ctx.save();
        ctx.translate(hx, hy + squash);

        // Spring Base (Connecting to ground)
        ctx.strokeStyle = '#546E7A';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-20, 40); ctx.lineTo(20, 40); // Feet
        ctx.stroke();
        
        // Coils
        ctx.strokeStyle = '#90A4AE';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for(let i=0; i<5; i++) {
            ctx.moveTo(-15, 40 + i*3); ctx.lineTo(15, 40 + i*3);
        }
        ctx.stroke();

        // Body (Orange Bot) - Round/Bubbly
        ctx.fillStyle = '#FF9800'; 
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = STROKE_W;
        ctx.strokeStyle = COLOR_STROKE;
        ctx.stroke();

        // Goggles
        ctx.fillStyle = '#263238';
        ctx.beginPath(); ctx.roundRect(-30, -15, 60, 22, 10); ctx.fill();
        
        // Glass
        ctx.fillStyle = '#E0F7FA';
        ctx.beginPath(); ctx.arc(0, -4, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        
        // Eyes (Looking Right towards Button)
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(8, -5, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-6, -5, 3, 0, Math.PI*2); ctx.fill();

        // Antenna
        ctx.strokeStyle = '#37474F'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, -60); ctx.stroke();
        ctx.fillStyle = '#F44336';
        ctx.beginPath(); ctx.arc(0, -60, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        // Arm Gesturing Right (Towards Start Button)
        ctx.lineCap = 'round';
        ctx.lineWidth = 14;
        ctx.strokeStyle = COLOR_STROKE;
        ctx.beginPath(); ctx.moveTo(20, 10); ctx.quadraticCurveTo(50, 20, 55, 40); ctx.stroke();
        ctx.strokeStyle = '#FF9800';
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(20, 10); ctx.quadraticCurveTo(50, 20, 55, 40); ctx.stroke();

        ctx.restore();
    }

    // 5. FRAMING (Foreground Bushes)
    function drawForeground() {
        // Left Bush
        ctx.fillStyle = '#33691E';
        ctx.beginPath();
        ctx.moveTo(-50, height);
        ctx.lineTo(-50, height - 120);
        ctx.bezierCurveTo(0, height - 220, 150, height - 180, 200, height - 40);
        ctx.lineTo(200, height);
        ctx.fill();
        ctx.strokeStyle = COLOR_STROKE; ctx.lineWidth = STROKE_W; ctx.stroke();
        
        // Right Bush
        ctx.beginPath();
        ctx.moveTo(width + 50, height);
        ctx.lineTo(width + 50, height - 80);
        ctx.bezierCurveTo(width, height - 180, width - 150, height - 150, width - 200, height);
        ctx.fill();
        ctx.stroke();
    }

    // MAIN LOOP
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMidground();
        drawLevel();
        drawHero();
        drawForeground();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
