<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #B3E5FC;
            --c-primary: #FF6F00; 
            --c-primary-dark: #E65100;
            --c-accent: #0288D1;
            --c-dark: #263238;
            --c-white: #FFFFFF;
            
            /* UI Grammar - Flat 2.0 */
            --border-radius-ui: 16px; 
            --shadow-flat: 6px 6px 0px rgba(0,0,0,0.2);
            --shadow-button: 0px 14px 0px #BF360C;
            --font-main: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-main);
            background: #000;
            color: var(--c-white);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 120px 1fr 140px;
            pointer-events: none; /* Let clicks pass to canvas if needed */
        }

        /* 1. HEADER: TOP LEFT */
        header {
            grid-column: 1;
            grid-row: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: auto;
        }

        h1 {
            font-size: 4.5rem;
            color: var(--c-white);
            text-transform: uppercase;
            /* Strong contrast fix */
            text-shadow: 5px 5px 0px var(--c-dark), 8px 8px 0px rgba(0,0,0,0.2);
            line-height: 0.9;
            letter-spacing: -2px;
            transform: skewX(-6deg);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--c-white);
            background: var(--c-accent);
            padding: 8px 20px;
            border-radius: var(--border-radius-ui);
            display: inline-block;
            margin-top: 15px;
            transform: skewX(-6deg);
            box-shadow: var(--shadow-flat);
            width: fit-content;
            border: 3px solid var(--c-dark);
        }

        /* 2. TOP RIGHT: COLLECTIBLES (Expanded & Unified) */
        .stats-bar {
            grid-column: 3;
            grid-row: 1;
            padding: 40px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .stat-pill {
            background: var(--c-white);
            padding: 8px 16px;
            border-radius: 50px; /* Pill shape */
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            color: var(--c-dark);
            box-shadow: var(--shadow-flat);
            border: 3px solid var(--c-dark);
            font-size: 1.4rem;
            min-width: 100px;
            justify-content: center;
        }

        /* 3. LEFT: WORLD SELECTOR */
        .world-selector {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 20px;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .portal {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--c-dark);
        }

        /* Portal Styles */
        .portal::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }

        .p1 { background: #66BB6A; }
        .p2 { background: #FFA726; filter: grayscale(0.8); opacity: 0.6; }
        .p3 { background: #26C6DA; filter: grayscale(0.8); opacity: 0.6; }

        .portal:hover { transform: scale(1.1) rotate(5deg); }
        .portal.active { transform: scale(1.15); z-index: 2; }
        
        /* Active Portal Animation */
        .portal.active::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9), transparent);
            animation: pulse 1.5s infinite alternate;
        }

        /* 4. BOTTOM LEFT: CONTROLS (Relocated & Diegetic) */
        .controls-guide {
            grid-column: 1;
            grid-row: 3;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            pointer-events: auto;
        }

        /* Diegetic Wooden Sign */
        .signpost-container {
            background: #795548; /* Wood */
            border: 4px solid var(--c-dark);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transform: rotate(-3deg);
            box-shadow: var(--shadow-flat);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Wood Nails */
        .signpost-container::before, .signpost-container::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            background: #4E342E;
            border-radius: 50%;
            top: 10px;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }
        .signpost-container::before { left: 10px; }
        .signpost-container::after { right: 10px; }

        .controls-row {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .key-group {
            display: grid;
            grid-template-columns: repeat(3, 36px);
            gap: 6px;
        }
        /* D-pad layout */
        .key-group .k:nth-child(1) { grid-column: 2; }
        .key-group .k:nth-child(2) { grid-column: 1; grid-row: 2; }
        .key-group .k:nth-child(3) { grid-column: 2; grid-row: 2; }
        .key-group .k:nth-child(4) { grid-column: 3; grid-row: 2; }

        .k {
            width: 36px; height: 36px;
            background: #FFF;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--c-dark);
            box-shadow: 0 4px 0 #999;
            font-family: monospace;
            border: 2px solid var(--c-dark);
        }

        .k.big {
            width: 110px; height: 40px;
            background: var(--c-primary);
            color: white;
            box-shadow: 0 4px 0 var(--c-primary-dark);
        }

        .sign-text {
            color: #D7CCC8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        }

        /* 5. BOTTOM CENTER: CTA (Relocated & Flat 2.0) */
        .start-area {
            grid-column: 2;
            grid-row: 3;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .btn-start {
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-main);
            font-size: 2rem;
            text-transform: uppercase;
            padding: 20px 70px;
            border: 4px solid var(--c-dark);
            border-radius: 20px; /* Slightly squared pill */
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: var(--shadow-button);
            position: relative;
            /* No gradients, pure Flat 2.0 */
        }

        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 0 4px 0 #BF360C;
        }
        
        /* Hover effect: Lift slightly */
        .btn-start:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 0 #BF360C;
        }

        /* ANIMATIONS */
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                gap: 20px;
            }
            header { grid-column: 1; grid-row: 1; padding: 20px; }
            h1 { font-size: 3rem; }
            .stats-bar { grid-column: 1; grid-row: 2; justify-content: center; padding: 10px; }
            .world-selector { grid-column: 1; grid-row: 3; flex-direction: row; justify-content: center; padding: 0; }
            .controls-guide { grid-column: 1; grid-row: 3; position: absolute; bottom: 140px; left: 20px; align-items: flex-start; }
            .signpost-container { transform: scale(0.8) rotate(-3deg); transform-origin: bottom left; }
            .start-area { grid-column: 1; grid-row: 4; padding: 20px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- TOP LEFT: BRAND -->
        <header>
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </header>

        <!-- TOP RIGHT: STATS -->
        <div class="stats-bar">
            <div class="stat-pill">
                <span style="color: #FBC02D; text-shadow: 1px 1px 0 #F57F17;">●</span> 1,240
            </div>
            <div class="stat-pill">
                <span style="color: #00E5FF; text-shadow: 1px 1px 0 #00B8D4;">♦</span> 08
            </div>
            <div class="stat-pill">
                <span style="color: #FFD54F; text-shadow: 1px 1px 0 #FF8F00;">★</span> 5
            </div>
        </div>

        <!-- LEFT: WORLD SELECTOR -->
        <aside class="world-selector">
            <div class="portal p1 active"></div>
            <div class="portal p2"></div>
            <div class="portal p3"></div>
        </aside>

        <!-- BOTTOM LEFT: CONTROLS (Diegetic Sign) -->
        <aside class="controls-guide">
            <div class="signpost-container">
                <div class="controls-row">
                    <div class="key-group">
                        <div class="k">W</div>
                        <div class="k">A</div>
                        <div class="k">S</div>
                        <div class="k">D</div>
                    </div>
                    <div class="key-group">
                        <div class="k big">SPACE</div>
                    </div>
                </div>
                <div class="sign-text">Move & Jump</div>
            </div>
        </aside>

        <!-- BOTTOM CENTER: START BUTTON -->
        <div class="start-area">
            <button class="btn-start">Start Adventure</button>
        </div>

    </div>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE
     * Focus: Parallax depth, Gameplay Storytelling, Mascot Character
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---

    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // --- SCENE ELEMENTS ---

    // 1. CLOUDS
    const clouds = [
        {x: 100, y: 150, s: 1.2, speed: 0.2},
        {x: 400, y: 100, s: 0.8, speed: 0.1},
        {x: 800, y: 180, s: 1.5, speed: 0.3},
        {x: 1100, y: 120, s: 0.9, speed: 0.15}
    ];

    function drawCloud(c) {
        ctx.fillStyle = `rgba(255, 255, 255, 0.8)`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 30 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 25 * c.s, c.y - 10 * c.s, 35 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 50 * c.s, c.y, 30 * c.s, 0, Math.PI * 2);
        ctx.fill();
    }

    // 2. PARALLAX MOUNTAINS
    function drawMountains() {
        // Far layer
        ctx.fillStyle = '#E1F5FE'; // Very light blue
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height - 200);
        ctx.lineTo(width * 0.25, height - 450);
        ctx.lineTo(width * 0.5, height - 250);
        ctx.lineTo(width * 0.75, height - 500);
        ctx.lineTo(width, height - 300);
        ctx.lineTo(width, height);
        ctx.fill();
    }

    // 3. MID-GROUND HILLS
    function drawHills() {
        ctx.fillStyle = '#AED581'; // Light Green
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.quadraticCurveTo(width * 0.2, height - 250, width * 0.5, height - 100);
        ctx.quadraticCurveTo(width * 0.8, height + 50, width, height - 200);
        ctx.lineTo(width, height);
        ctx.fill();
    }

    // 4. GAMEPLAY ELEMENTS
    function drawBlock(x, y, size) {
        // Main Dirt
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(x, y, size, size);
        // Grass Top
        ctx.fillStyle = '#7CB342';
        ctx.fillRect(x, y, size, 12);
        // Bevels
        ctx.fillStyle = '#8D6E63'; // Light
        ctx.fillRect(x, y + 12, size, 4);
        ctx.fillRect(x, y + 12, 4, size - 12);
        ctx.fillStyle = '#3E2723'; // Dark
        ctx.fillRect(x + size - 4, y + 12, 4, size - 12);
        ctx.fillRect(x, y + size - 4, size, 4);
        
        // Texture lines
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(x + 10, y + 20, size - 20, 2);
        ctx.fillRect(x + 10, y + 35, size - 20, 2);
    }

    function drawGoldBlock(x, y, size) {
        ctx.fillStyle = '#FFCA28';
        ctx.fillRect(x, y, size, size);
        // Bevels
        ctx.fillStyle = '#FFF59D';
        ctx.fillRect(x, y, size, 6);
        ctx.fillRect(x, y, 6, size);
        ctx.fillStyle = '#FF8F00';
        ctx.fillRect(x + size - 6, y, 6, size);
        ctx.fillRect(x, y + size - 6, size, 6);
        
        // Question Mark
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold ' + (size/1.8) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 2);
    }

    function drawCoin(x, y) {
        const r = 12;
        const wobble = Math.sin(frame * 0.1) * 2;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r + wobble, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Shine
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 6, 4, 12);
    }

    function drawEnemy(x, y) {
        const bounce = Math.abs(Math.sin(frame * 0.1)) * -10;
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath();
        ctx.arc(x, y + bounce, 20, 0, Math.PI*2);
        ctx.fill();
        
        // Spikes
        for(let i=0; i<8; i++) {
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.rotate((i * Math.PI * 2) / 8 + frame * 0.05);
            ctx.fillStyle = '#B71C1C';
            ctx.beginPath();
            ctx.moveTo(-5, -20);
            ctx.lineTo(5, -20);
            ctx.lineTo(0, -32);
            ctx.fill();
            ctx.restore();
        }
        // Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x-6, y+bounce-4, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+6, y+bounce-4, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x-6, y+bounce-4, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+6, y+bounce-4, 2, 0, Math.PI*2); ctx.fill();
    }

    function drawFlag(x, y) {
        // Pole
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 6, 350);
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(x+3, y, 10, 0, Math.PI*2); ctx.fill();
        
        // Flag cloth (Waving)
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+6, y+15);
        ctx.quadraticCurveTo(x+50, y+30 + Math.sin(frame*0.1)*10, x+60, y+40);
        ctx.lineTo(x+6, y+60);
        ctx.fill();
    }

    // 5. FOREGROUND (Window Effect)
    function drawForeground() {
        const y = height - 50;
        ctx.fillStyle = '#33691E'; // Dark Green
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, y);
        // Bushy curve
        ctx.bezierCurveTo(100, y-80, 300, y-80, 400, y);
        ctx.bezierCurveTo(500, y+80, 700, y-80, 800, y);
        ctx.bezierCurveTo(900, y-80, 1100, y-80, 1200, y);
        ctx.lineTo(width, y);
        ctx.lineTo(width, height);
        ctx.fill();

        // Leaves detail
        ctx.fillStyle = '#558B2F';
        ctx.beginPath();
        ctx.arc(100, y-20, 30, 0, Math.PI*2);
        ctx.arc(150, y-30, 40, 0, Math.PI*2);
        ctx.fill();
    }

    // 6. HERO CHARACTER (Mascot)
    function drawHero(x, y) {
        const bounce = Math.abs(Math.sin(frame * 0.08)) * 20;
        const squash = Math.cos(frame * 0.08) * 5;
        
        ctx.save();
        ctx.translate(x, y - bounce);
        
        // Spring Base (Underneath)
        ctx.fillStyle = '#546E7A';
        ctx.fillRect(-25, 35 + squash, 50, 15);
        // Spring Coils
        ctx.strokeStyle = '#90A4AE';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for(let i=0; i<4; i++) {
            ctx.moveTo(-25, 35 + squash + (i*4));
            ctx.lineTo(25, 35 + squash + ((i+1)*4));
        }
        ctx.stroke();

        // Body (Round Bot)
        ctx.fillStyle = '#FF6F00'; // Orange
        ctx.beginPath();
        ctx.arc(0, 0 + squash, 45 - (squash/2), 0, Math.PI * 2);
        ctx.fill();
        // Darker Rim
        ctx.strokeStyle = '#E65100';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Goggles
        ctx.fillStyle = '#263238';
        ctx.beginPath();
        ctx.roundRect(-35, -15 + squash, 70, 25, 8);
        ctx.fill();

        // Lens (Glass)
        ctx.fillStyle = '#E0F7FA';
        ctx.beginPath();
        ctx.arc(0, -2 + squash, 22, 0, Math.PI * 2);
        ctx.fill();
        
        // Eyes (Inside Goggles)
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(8, -4 + squash, 4, 0, Math.PI*2); ctx.fill(); // Right
        ctx.beginPath(); ctx.arc(-8, -4 + squash, 4, 0, Math.PI*2); ctx.fill(); // Left

        // Shine on Goggles
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(12, -8 + squash, 4, 0, Math.PI*2); ctx.fill();

        // Antenna
        ctx.strokeStyle = '#37474F';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -45 + squash);
        ctx.lineTo(0, -65 + squash);
        ctx.stroke();
        ctx.fillStyle = '#F44336';
        ctx.beginPath(); ctx.arc(0, -65 + squash, 6, 0, Math.PI*2); ctx.fill();

        // Arms (Dynamic)
        ctx.strokeStyle = '#FF6F00';
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        
        // Left Arm (Waving)
        ctx.beginPath();
        ctx.moveTo(-30, 10 + squash);
        ctx.quadraticCurveTo(-60, -20 + squash, -50, -40 + squash);
        ctx.stroke();

        // Right Arm (Pumping)
        ctx.beginPath();
        ctx.moveTo(30, 10 + squash);
        ctx.quadraticCurveTo(60, 30 + squash, 40, 50 + squash);
        ctx.stroke();

        ctx.restore();
    }

    // PARTICLES
    const particles = [];
    function spawnParticle() {
        if(Math.random() > 0.05) return;
        particles.push({
            x: Math.random() * width,
            y: height - 100,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            life: 100,
            color: Math.random() > 0.5 ? '#FFF' : '#FFD700'
        });
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    // MAIN LOOP
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // 1. Sky Background
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#4FC3F7');
        grad.addColorStop(1, '#B3E5FC');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Distant Mountains
        drawMountains();

        // 3. Clouds
        clouds.forEach(c => {
            c.x += c.speed;
            if(c.x > width + 100) c.x = -100;
            drawCloud(c);
        });

        // 4. Mid-ground Hills
        drawHills();

        const groundY = height - 180; 

        // 5. Platforms (Storytelling Layout)
        
        // Start Platform (Left)
        drawBlock(0, groundY, 400); // Base ground
        
        // Mid Platforms
        drawBlock(450, groundY - 100, 200);
        drawBlock(700, groundY - 200, 300);

        // Goal Platform (Right)
        drawBlock(1050, groundY - 100, 300);

        // 6. Interactive Elements
        drawBlock(500, groundY - 230, 50);
        drawGoldBlock(560, groundY - 230, 50);
