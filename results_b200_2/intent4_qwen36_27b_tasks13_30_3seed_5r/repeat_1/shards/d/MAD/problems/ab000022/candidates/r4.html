<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring & Bolt - The Great Adventure</title>
    <style>
        :root {
            /* Palette - Vibrant & Playful */
            --c-sky-top: #4DD0E1;
            --c-sky-bot: #E0F7FA;
            --c-primary: #FF6D00; 
            --c-primary-light: #FFAB91;
            --c-primary-dark: #E65100;
            --c-accent: #00BCD4;
            --c-dark: #263238;
            --c-dark-overlay: rgba(38, 50, 56, 0.85);
            --c-white: #FFFFFF;
            
            /* UI Grammar - Unified Style */
            --border-radius-ui: 12px;
            --stroke-ui: 3px;
            --shadow-ui: 4px 4px 0px rgba(0,0,0,0.2);
            
            /* Typography */
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
            background: #000;
            color: var(--c-dark);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            /* Layout: Left Sidebar, Main Center, Right Stats */
            grid-template-columns: 320px 1fr 280px;
            /* Layout: Header, Content, Footer */
            grid-template-rows: 100px 1fr 160px;
            pointer-events: none;
        }

        /* --- SHARED UI COMPONENTS --- */
        .ui-panel {
            background: var(--c-white);
            border: var(--stroke-ui) solid var(--c-dark);
            border-radius: var(--border-radius-ui);
            box-shadow: var(--shadow-ui);
            pointer-events: auto;
        }

        /* 1. HEADER (Top Left) */
        header {
            grid-column: 1;
            grid-row: 1;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            pointer-events: auto;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            color: var(--c-white);
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -1px;
            /* Strong outline for readability */
            text-shadow: 
                3px 3px 0 var(--c-dark), 
                -1px -1px 0 var(--c-dark),  
                1px -1px 0 var(--c-dark),
                -1px 1px 0 var(--c-dark),
                0px 6px 0 var(--c-primary-dark);
            transform: skewX(-6deg);
        }

        /* 2. TOP RIGHT: COLLECTIBLES (Grouped) */
        .stats-container {
            grid-column: 3;
            grid-row: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 12px;
            pointer-events: auto;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.95);
            border: var(--stroke-ui) solid var(--c-dark);
            border-radius: var(--border-radius-ui);
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .stat-icon { font-size: 1.2rem; }

        /* 3. LEFT: WORLD SELECTOR (Integrated Cluster) */
        .world-selector {
            grid-column: 1;
            grid-row: 2;
            padding: 0 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
            /* Align closer to center */
            align-items: flex-end; 
        }

        .world-title {
            font-family: var(--font-display);
            background: var(--c-accent);
            color: var(--c-white);
            padding: 8px 16px;
            border: var(--stroke-ui) solid var(--c-dark);
            border-radius: var(--border-radius-ui);
            box-shadow: var(--shadow-ui);
            text-align: center;
            transform: rotate(-2deg);
            margin-bottom: 10px;
        }

        .world-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .world-node {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: var(--c-white);
            border: var(--stroke-ui) solid var(--c-dark);
            border-radius: var(--border-radius-ui);
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: var(--shadow-ui);
            width: 100%;
        }

        .world-node:hover { transform: translateX(5px); }
        .world-node.active { background: #E0F7FA; transform: scale(1.05); z-index: 2; }

        .node-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--c-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .node-text {
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* 4. BOTTOM LEFT: CONTROLS (Refined) */
        .controls-guide {
            grid-column: 1;
            grid-row: 3;
            padding: 20px 30px;
            display: flex;
            align-items: flex-end;
            pointer-events: auto;
        }

        .controls-panel {
            background: var(--c-dark-overlay);
            border: var(--stroke-ui) solid rgba(255,255,255,0.2);
            border-radius: var(--border-radius-ui);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(5px);
        }

        .key-cluster { display: flex; gap: 4px; }
        .key {
            width: 28px; height: 28px;
            background: #FFF;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.7rem;
            box-shadow: 0 2px 0 #999;
            color: var(--c-dark);
        }
        .key.jumper {
            width: 80px;
            background: var(--c-primary);
            color: white;
            box-shadow: 0 2px 0 var(--c-primary-dark);
            font-size: 0.7rem;
            margin-left: 10px;
        }
        
        .controls-text {
            color: rgba(255,255,255,0.8);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 5. BOTTOM CENTER: START BUTTON (Hero Action) */
        .start-area {
            grid-column: 2;
            grid-row: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            padding-bottom: 30px;
        }

        .btn-start {
            font-family: var(--font-display);
            font-size: 2.2rem;
            text-transform: uppercase;
            padding: 18px 60px;
            background: var(--c-primary);
            color: var(--c-white);
            border: var(--stroke-ui) solid var(--c-dark);
            border-radius: 50px; /* Pill shape */
            cursor: pointer;
            position: relative;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            
            /* Prominent Shadow/Glow */
            box-shadow: 
                0 0 0 var(--stroke-ui) var(--c-dark),
                0 12px 0 var(--c-primary-dark),
                0 20px 30px rgba(0,0,0,0.4),
                0 0 40px rgba(255, 109, 0, 0.4);
            
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .btn-start:hover {
            transform: translateY(-6px) scale(1.05);
            background: var(--c-primary-light);
            box-shadow: 
                0 0 0 var(--stroke-ui) var(--c-dark),
                0 18px 0 var(--c-primary-dark),
                0 30px 40px rgba(0,0,0,0.5),
                0 0 60px rgba(255, 109, 0, 0.6);
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 var(--stroke-ui) var(--c-dark),
                0 4px 0 var(--c-primary-dark),
                0 5px 10px rgba(0,0,0,0.4);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto auto;
            }
            header { grid-column: 1; grid-row: 1; padding: 15px; }
            h1 { font-size: 2rem; }
            .stats-container { grid-column: 1; grid-row: 2; flex-direction: row; justify-content: center; padding: 10px; }
            .world-selector { 
                grid-column: 1; grid-row: 3; 
                align-items: center; 
                padding: 0;
            }
            .world-list { flex-direction: row; }
            .world-title { display: none; }
            .controls-guide { grid-column: 1; grid-row: 4; justify-content: center; padding: 10px; }
            .start-area { grid-column: 1; grid-row: 5; padding: 20px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- TOP LEFT: BRAND -->
        <header>
            <h1>Spring<br>& Bolt</h1>
        </header>

        <!-- TOP RIGHT: STATS (Unified Grammar) -->
        <div class="stats-container">
            <div class="stat-row">
                <span class="stat-icon" style="color: #FBC02D;">●</span> 1,240
            </div>
            <div class="stat-row">
                <span class="stat-icon" style="color: #00E5FF;">♦</span> 08
            </div>
            <div class="stat-row">
                <span class="stat-icon" style="color: #FFD54F;">★</span> 5
            </div>
        </div>

        <!-- LEFT: WORLD SELECTOR (Moved closer to center) -->
        <aside class="world-selector">
            <div class="world-title">Select World</div>
            <div class="world-list">
                <div class="world-node active">
                    <div class="node-icon" style="background: #66BB6A;">🌿</div>
                    <div class="node-text">Grassland</div>
                </div>
                <div class="world-node">
                    <div class="node-icon" style="background: #FFA726;">🏜️</div>
                    <div class="node-text">Dunes</div>
                </div>
                <div class="world-node">
                    <div class="node-icon" style="background: #26C6DA;">☁️</div>
                    <div class="node-text">Sky High</div>
                </div>
            </div>
        </aside>

        <!-- BOTTOM LEFT: CONTROLS (Refined, less weight) -->
        <aside class="controls-guide">
            <div class="controls-panel">
                <div class="key-cluster">
                    <div class="key">W</div>
                    <div class="key">A</div>
                    <div class="key">S</div>
                    <div class="key">D</div>
                </div>
                <div class="key key jumper">SPACE</div>
                <div class="controls-text">Move & Jump</div>
            </div>
        </aside>

        <!-- BOTTOM CENTER: START BUTTON -->
        <div class="start-area">
            <button class="btn-start">Start Adventure</button>
        </div>

    </div>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE
     * Focus: Parallax, Texture, "Juice", and Narrative Depth
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;
    
    // Dynamic scaling for high DPI
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---
    const STROKE_W = 4;
    const COLOR_DARK = '#263238';
    const COLOR_DIRT = '#795548';
    const COLOR_GRASS = '#7CB342';
    const COLOR_GRASS_DARK = '#558B2F';

    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // --- LAYERS ---

    // 1. BACKGROUND (Sky + Far Mountains)
    function drawBackground() {
        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#4FC3F7');
        grad.addColorStop(1, '#E1F5FE');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Far Mountains (Parallax Layer 1 - Faint)
        ctx.fillStyle = '#B3E5FC'; 
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height - 250);
        // Jagged peaks
        ctx.lineTo(width * 0.15, height - 400);
        ctx.lineTo(width * 0.3, height - 280);
        ctx.lineTo(width * 0.5, height - 550);
        ctx.lineTo(width * 0.7, height - 350);
        ctx.lineTo(width * 0.85, height - 480);
        ctx.lineTo(width, height - 300);
        ctx.lineTo(width, height);
        ctx.fill();
        
        // Subtle stroke for mountains
        ctx.strokeStyle = '#81D4FA';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // 2. MIDGROUND (Hills + Clouds)
    function drawMidground() {
        // Clouds
        const time = frame * 0.02;
        for(let i=0; i<5; i++) {
            let cx = ((i * 300) + (time * (i+1)*10)) % (width + 200) - 100;
            let cy = 100 + (i * 40);
            let scale = 0.8 + (i % 3) * 0.3;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(cx, cy, 30 * scale, 0, Math.PI * 2);
            ctx.arc(cx + 25 * scale, cy - 10 * scale, 35 * scale, 0, Math.PI * 2);
            ctx.arc(cx + 50 * scale, cy, 30 * scale, 0, Math.PI * 2);
            ctx.fill();
            
            // Line art stroke on clouds
            ctx.strokeStyle = '#E1F5FE';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Rolling Hills (Parallax Layer 2)
        ctx.fillStyle = '#C5E1A5'; // Lighter green
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.quadraticCurveTo(width * 0.25, height - 300, width * 0.5, height - 150);
        ctx.quadraticCurveTo(width * 0.75, height - 50, width, height - 250);
        ctx.lineTo(width, height);
        ctx.fill();
        
        ctx.strokeStyle = '#9CCC65';
        ctx.lineWidth = STROKE_W;
        ctx.stroke();
    }

    // 3. GAMEPLAY ELEMENTS (The "Level")
    function drawLevel() {
        const groundY = height - 180;

        // --- TEXTURED BLOCK FUNCTION ---
        function drawTexturedBlock(x, y, w, h) {
            // Dirt Base
            ctx.fillStyle = COLOR_DIRT;
            ctx.fillRect(x, y, w, h);
            
            // Grass Top
            ctx.fillStyle = COLOR_GRASS;
            ctx.fillRect(x, y, w, 18);
            
            // Dirt Speckles (Procedural detail)
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(x + 10, y + 30, 6, 6);
            ctx.fillRect(x + w - 20, y + 50, 4, 4);
            ctx.fillRect(x + w/2, y + h - 10, 8, 4);

            // Grass Tufts
            ctx.fillStyle = COLOR_GRASS_DARK;
            for(let i=0; i<w; i+=25) {
                ctx.beginPath();
                ctx.moveTo(x + i, y);
                ctx.lineTo(x + i + 5, y - 5);
                ctx.lineTo(x + i + 10, y);
                ctx.fill();
            }

            // Outline
            ctx.strokeStyle = COLOR_DARK;
            ctx.lineWidth = STROKE_W;
            ctx.strokeRect(x, y, w, h);
            
            // Inner Detail Line
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 18); ctx.lineTo(x + w - 5, y + 18);
            ctx.stroke();
        }

        // --- PLATFORMS ---
        // Start Ground
        drawTexturedBlock(0, groundY, 500, 100);
        
        // Floating Platforms
        drawTexturedBlock(600, groundY - 80, 180, 50);
        drawTexturedBlock(850, groundY - 160, 180, 50);
        
        // Goal Ground
        drawTexturedBlock(1100, groundY - 80, 500, 100);

        // --- INTERACTIVES ---
        // Mystery Block
        drawRoundRect(650, groundY - 210, 50, 50, 5);
        ctx.fillStyle = '#FFCA28'; ctx.fill();
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = STROKE_W; ctx.stroke();
        // Bevel
        ctx.fillStyle = '#FFF59D'; ctx.fillRect(656, groundY - 204, 38, 10);
        // Q Mark
        ctx.fillStyle = COLOR_DARK; ctx.font = 'bold 30px sans-serif'; ctx.fillText('?', 662, groundY - 175);

        // Coins
        const coinY = groundY - 240;
        [680, 720, 760].forEach((cx, i) => {
            const bounce = Math.sin(frame * 0.1 + i) * 5;
            ctx.fillStyle = '#FFD700';
            ctx.beginPath(); ctx.arc(cx, coinY + bounce, 12, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#FFF'; ctx.fillRect(cx-2, coinY + bounce - 6, 4, 12);
        });

        // Enemy (Spiky)
        const ex = 900, ey = groundY - 210;
        const eBounce = Math.abs(Math.sin(frame * 0.1)) * -10;
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(ex, ey + eBounce, 22, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = STROKE_W; ctx.stroke();
        // Spikes
        for(let i=0; i<8; i++) {
            ctx.save(); ctx.translate(ex, ey + eBounce); ctx.rotate((i*45 + frame*2)*Math.PI/180);
            ctx.fillStyle = '#B71C1C'; ctx.beginPath(); ctx.moveTo(-6, -22); ctx.lineTo(6, -22); ctx.lineTo(0, -35); ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        // --- DISTANT GOAL (Narrative Anchor) ---
        const gx = 1350;
        // Castle silhouette in distance (Right side)
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(gx, groundY - 200, 40, 200); // Tower
        ctx.fillRect(gx - 30, groundY - 150, 30, 150); // Left wall
        ctx.fillRect(gx + 40, groundY - 150, 30, 150); // Right wall
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = STROKE_W;
        ctx.strokeRect(gx, groundY - 200, 40, 200);
        ctx.strokeRect(gx - 30, groundY - 150, 30, 150);
        ctx.strokeRect(gx + 40, groundY - 150, 30, 150);
        
        // Flag on tower
        ctx.fillStyle = '#FF5722';
        ctx.beginPath(); ctx.moveTo(gx+20, groundY-200); ctx.lineTo(gx+60, groundY-180); ctx.lineTo(gx+20, groundY-160); ctx.fill();
        ctx.stroke();
    }

    // 4. HERO (The Mascot)
    function drawHero() {
        const hx = 250; // Fixed position for menu
        const hy = height - 220;
        
        // Idle Animation
        const squash = Math.cos(frame * 0.1) * 3;
        const breathe = Math.sin(frame * 0.05) * 2;
        
        ctx.save();
        ctx.translate(hx, hy);

        // Spring Base
        ctx.fillStyle = '#546E7A';
        ctx.fillRect(-25, 40 + squash, 50, 15);
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = STROKE_W; ctx.strokeRect(-25, 40 + squash, 50, 15);
        
        // Coils
        ctx.strokeStyle = '#90A4AE'; ctx.lineWidth = 4; ctx.beginPath();
        for(let i=0; i<4; i++) {
            ctx.moveTo(-25, 40 + squash + (i*4)); ctx.lineTo(25, 40 + squash + ((i+1)*4));
        }
        ctx.stroke();

        // Body (Orange Bot)
        ctx.fillStyle = '#FF6D00'; 
        ctx.beginPath();
        ctx.arc(0, 0 + squash, 45 - (squash/2), 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = STROKE_W; ctx.stroke();

        // Goggles
        ctx.fillStyle = '#263238';
        ctx.beginPath(); ctx.roundRect(-35, -15 + squash, 70, 25, 8); ctx.fill();
        // Glass
        ctx.fillStyle = '#E0F7FA';
        ctx.beginPath(); ctx.arc(0, -2 + squash, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(8, -4 + squash, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(-8, -4 + squash, 4, 0, Math.PI*2); ctx.fill();
        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(12, -8 + squash, 4, 0, Math.PI*2); ctx.fill();

        // Antenna
        ctx.strokeStyle = '#37474F'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -45 + squash); ctx.lineTo(0, -65 + squash); ctx.stroke();
        ctx.fillStyle = '#F44336';
        ctx.beginPath(); ctx.arc(0, -65 + squash, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        // Arms
        ctx.lineCap = 'round';
        // Left
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(-30, 10 + squash); ctx.quadraticCurveTo(-60, -20 + squash, -50, -40 + squash); ctx.stroke();
        ctx.strokeStyle = '#FF6D00'; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(-30, 10 + squash); ctx.quadraticCurveTo(-60, -20 + squash, -50, -40 + squash); ctx.stroke();
        // Right
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(30, 10 + squash); ctx.quadraticCurveTo(60, 30 + squash, 40, 50 + squash); ctx.stroke();
        ctx.strokeStyle = '#FF6D00'; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(30, 10 + squash); ctx.quadraticCurveTo(60, 30 + squash, 40, 50 + squash); ctx.stroke();

        ctx.restore();
    }

    // 5. FOREGROUND (Framing)
    function drawForeground() {
        // Left Bush
        ctx.fillStyle = '#33691E';
        ctx.beginPath();
        ctx.moveTo(-50, height);
        ctx.lineTo(-50, height - 150);
        ctx.bezierCurveTo(0, height - 250, 150, height - 200, 200, height - 50);
        ctx.lineTo(200, height);
        ctx.fill();
        ctx.strokeStyle = COLOR_DARK; ctx.lineWidth = STROKE_W; ctx.stroke();
        
        // Right Bush
        ctx.beginPath();
        ctx.moveTo(width + 50, height);
        ctx.lineTo(width + 50, height - 100);
        ctx.bezierCurveTo(width, height - 200, width - 150, height - 150, width - 200, height);
        ctx.fill();
        ctx.stroke();
    }

    // MAIN LOOP
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMidground();
        drawLevel();
        drawHero();
        drawForeground();

        requestAnimationFrame(loop);
    }

    loop();
