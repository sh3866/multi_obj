<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #E1F5FE;
            --c-primary: #FF6F00; 
            --c-primary-light: #FFB74D;
            --c-primary-dark: #E65100;
            --c-accent: #0288D1;
            --c-dark: #263238;
            --c-white: #FFFFFF;
            --c-ui-bg: rgba(255, 255, 255, 0.85);
            
            /* UI Grammar - Neo-Brutalism / Flat 2.0 */
            --border-radius-ui: 16px; 
            --shadow-ui: 6px 6px 0px rgba(0,0,0,0.2);
            --stroke-width: 4px;
            --font-main: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-main);
            background: #000;
            color: var(--c-dark);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            /* 3 Columns: Left UI, Center Empty, Right UI */
            grid-template-columns: 350px 1fr 350px;
            /* 3 Rows: Header, Main, Footer */
            grid-template-rows: 120px 1fr 140px;
            pointer-events: none; /* Let clicks pass through empty spaces */
        }

        /* 1. HEADER: TOP LEFT (Title) */
        header {
            grid-column: 1;
            grid-row: 1;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: auto;
        }

        h1 {
            font-size: 4rem;
            color: var(--c-white);
            text-transform: uppercase;
            text-shadow: 
                5px 5px 0px var(--c-dark), 
                -2px -2px 0 var(--c-dark),  
                2px -2px 0 var(--c-dark),
                -2px 2px 0 var(--c-dark);
            line-height: 0.9;
            letter-spacing: -2px;
            transform: skewX(-5deg);
        }

        /* 2. TOP RIGHT: COLLECTIBLES (Unified System) */
        .stats-bar {
            grid-column: 3;
            grid-row: 1;
            padding: 30px 40px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .stat-pill {
            background: var(--c-white);
            padding: 8px 20px;
            border-radius: var(--border-radius-ui);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            color: var(--c-dark);
            box-shadow: var(--shadow-ui);
            border: var(--stroke-width) solid var(--c-dark);
            font-size: 1.2rem;
            min-width: 110px;
            justify-content: space-between;
        }

        .stat-icon { font-size: 1.4rem; }

        /* 3. LEFT: WORLD SELECTOR (Carousel/Nodes) */
        .world-selector {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 20px 40px;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .world-label {
            background: var(--c-white);
            border: var(--stroke-width) solid var(--c-dark);
            padding: 8px 16px;
            border-radius: var(--border-radius-ui);
            font-weight: 900;
            box-shadow: var(--shadow-ui);
            margin-bottom: 10px;
            transform: rotate(-2deg);
            z-index: 2;
        }

        .portal-container {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .portal {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            border: var(--stroke-width) solid var(--c-dark);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }

        /* Portal Styles */
        .p1 { background: #66BB6A; } /* Grass World */
        .p2 { background: #FFA726; filter: grayscale(0.6); opacity: 0.7; } /* Desert */
        .p3 { background: #26C6DA; filter: grayscale(0.6); opacity: 0.7; } /* Sky */

        .portal:hover { transform: scale(1.1); }
        .portal.active { transform: scale(1.2); z-index: 2; filter: grayscale(0); opacity: 1; }
        
        .portal.active::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 4px dashed var(--c-white);
            animation: spin 10s linear infinite;
        }

        /* 4. BOTTOM LEFT: CONTROLS (Semi-transparent, unobtrusive) */
        .controls-guide {
            grid-column: 1;
            grid-row: 3;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            pointer-events: auto;
        }

        .controls-box {
            background: rgba(38, 50, 56, 0.8); /* Dark semi-transparent */
            backdrop-filter: blur(4px);
            border: 3px solid var(--c-white);
            border-radius: var(--border-radius-ui);
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .controls-row {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .key-group {
            display: grid;
            grid-template-columns: repeat(3, 32px);
            gap: 5px;
        }
        /* D-pad layout */
        .key-group .k:nth-child(1) { grid-column: 2; }
        .key-group .k:nth-child(2) { grid-column: 1; grid-row: 2; }
        .key-group .k:nth-child(3) { grid-column: 2; grid-row: 2; }
        .key-group .k:nth-child(4) { grid-column: 3; grid-row: 2; }

        .k {
            width: 32px; height: 32px;
            background: #FFF;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--c-dark);
            box-shadow: 0 3px 0 #999;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .k.big {
            width: 90px; height: 36px;
            background: var(--c-primary);
            color: white;
            box-shadow: 0 3px 0 var(--c-primary-dark);
            font-size: 0.8rem;
        }

        .sign-text {
            color: var(--c-white);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            opacity: 0.9;
        }

        /* 5. BOTTOM CENTER: START BUTTON (Thematic 3D Block) */
        .start-area {
            grid-column: 2;
            grid-row: 3;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .btn-start-wrapper {
            position: relative;
            /* Perspective for 3D feel */
            transform-style: preserve-3d;
            perspective: 800px;
        }

        .btn-start {
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-main);
            font-size: 2rem;
            text-transform: uppercase;
            padding: 20px 60px;
            border: var(--stroke-width) solid var(--c-dark);
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            position: relative;
            box-shadow: 
                0 0 0 var(--stroke-width) var(--c-dark),
                0 15px 0 var(--c-primary-dark), /* The 3D extrusion */
                0 20px 20px rgba(0,0,0,0.3);   /* Drop shadow */
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }

        /* The "Spring" effect on hover */
        .btn-start:hover {
            background: var(--c-primary-light);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 0 0 var(--stroke-width) var(--c-dark),
                0 20px 0 var(--c-primary-dark),
                0 25px 30px rgba(0,0,0,0.3);
        }

        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 
                0 0 0 var(--stroke-width) var(--c-dark),
                0 5px 0 var(--c-primary-dark),
                0 5px 10px rgba(0,0,0,0.3);
        }

        /* Decoration on button */
        .btn-start::before {
            content: '';
            position: absolute;
            top: 8px; left: 20px;
            width: 10px; height: 10px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            box-shadow: 10px -5px 0 rgba(255,255,255,0.4);
        }

        /* 6. BOTTOM RIGHT: Placeholder for balance or extra info (Empty for now) */
        .spacer {
            grid-column: 3;
            grid-row: 3;
        }

        /* ANIMATIONS */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
            }
            header { grid-column: 1; grid-row: 1; padding: 20px; }
            h1 { font-size: 2.5rem; }
            .stats-bar { grid-column: 1; grid-row: 2; justify-content: center; padding: 10px; }
            .world-selector { 
                grid-column: 1; grid-row: 3; 
                flex-direction: row; 
                justify-content: center; 
                padding: 0; 
                margin-bottom: 20px;
            }
            .portal-container { flex-direction: row; }
            .controls-guide { 
                grid-column: 1; grid-row: 4; 
                position: absolute; 
                bottom: 100px; left: 20px; 
                align-items: flex-start; 
                z-index: 20;
            }
            .controls-box { transform: scale(0.8); transform-origin: bottom left; }
            .start-area { grid-column: 1; grid-row: 5; padding: 20px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- TOP LEFT: BRAND -->
        <header>
            <h1>Bouncy<br>& Bolt</h1>
        </header>

        <!-- TOP RIGHT: STATS -->
        <div class="stats-bar">
            <div class="stat-pill">
                <span class="stat-icon" style="color: #FBC02D;">●</span> 1,240
            </div>
            <div class="stat-pill">
                <span class="stat-icon" style="color: #00E5FF;">♦</span> 08
            </div>
            <div class="stat-pill">
                <span class="stat-icon" style="color: #FFD54F;">★</span> 5
            </div>
        </div>

        <!-- LEFT: WORLD SELECTOR -->
        <aside class="world-selector">
            <div class="world-label">SELECT WORLD</div>
            <div class="portal-container">
                <div class="portal p1 active"></div>
                <div class="portal p2"></div>
                <div class="portal p3"></div>
            </div>
        </aside>

        <!-- BOTTOM LEFT: CONTROLS (Unified UI) -->
        <aside class="controls-guide">
            <div class="controls-box">
                <div class="controls-row">
                    <div class="key-group">
                        <div class="k">W</div>
                        <div class="k">A</div>
                        <div class="k">S</div>
                        <div class="k">D</div>
                    </div>
                    <div class="key-group">
                        <div class="k big">SPACE</div>
                    </div>
                </div>
                <div class="sign-text">Move & Jump</div>
            </div>
        </aside>

        <!-- BOTTOM CENTER: START BUTTON -->
        <div class="start-area">
            <div class="btn-start-wrapper">
                <button class="btn-start">Start Adventure</button>
            </div>
        </div>

        <div class="spacer"></div>

    </div>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE
     * Focus: Parallax depth, Gameplay Storytelling, Mascot Character
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---
    // Consistent "Thick Stroke" style for game assets
    const GAME_STROKE = 4;
    const GAME_COLOR_DARK = '#263238';

    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // --- SCENE ELEMENTS ---

    // 1. CLOUDS
    const clouds = [
        {x: 100, y: 150, s: 1.2, speed: 0.2},
        {x: 400, y: 100, s: 0.8, speed: 0.1},
        {x: 800, y: 180, s: 1.5, speed: 0.3},
        {x: 1100, y: 120, s: 0.9, speed: 0.15}
    ];

    function drawCloud(c) {
        ctx.fillStyle = `rgba(255, 255, 255, 0.9)`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 30 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 25 * c.s, c.y - 10 * c.s, 35 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 50 * c.s, c.y, 30 * c.s, 0, Math.PI * 2);
        ctx.fill();
        // Subtle outline for cartoon feel
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // 2. PARALLAX MOUNTAINS
    function drawMountains() {
        // Far layer
        ctx.fillStyle = '#E1F5FE'; 
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height - 200);
        ctx.lineTo(width * 0.25, height - 450);
        ctx.lineTo(width * 0.5, height - 250);
        ctx.lineTo(width * 0.75, height - 500);
        ctx.lineTo(width, height - 300);
        ctx.lineTo(width, height);
        ctx.fill();
        
        // Outline for mountains
        ctx.strokeStyle = '#B3E5FC';
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    // 3. MID-GROUND HILLS
    function drawHills() {
        ctx.fillStyle = '#AED581'; // Light Green
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.quadraticCurveTo(width * 0.2, height - 250, width * 0.5, height - 100);
        ctx.quadraticCurveTo(width * 0.8, height + 50, width, height - 200);
        ctx.lineTo(width, height);
        ctx.fill();
        
        // Outline
        ctx.strokeStyle = '#7CB342';
        ctx.lineWidth = GAME_STROKE;
        ctx.stroke();
    }

    // 4. GAMEPLAY ELEMENTS
    function drawBlock(x, y, size) {
        // Main Dirt
        ctx.fillStyle = '#795548'; 
        ctx.fillRect(x, y, size, size);
        
        // Grass Top (Continuous look)
        ctx.fillStyle = '#7CB342'; 
        ctx.fillRect(x, y, size, 15);
        
        // Thick Outline
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = GAME_STROKE;
        ctx.strokeRect(x, y, size, size);

        // Details (Crosshatch)
        ctx.beginPath();
        ctx.moveTo(x + 10, y + 15); ctx.lineTo(x + 15, y + 20);
        ctx.moveTo(x + 15, y + 15); ctx.lineTo(x + 10, y + 20);
        ctx.stroke();
    }

    function drawGoldBlock(x, y, size) {
        ctx.fillStyle = '#FFCA28';
        ctx.fillRect(x, y, size, size);
        
        // Bevel effect
        ctx.fillStyle = '#FFF59D';
        ctx.fillRect(x + 6, y + 6, size - 12, size - 12);
        
        // Outline
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = GAME_STROKE;
        ctx.strokeRect(x, y, size, size);
        
        // Question Mark
        ctx.fillStyle = GAME_COLOR_DARK;
        ctx.font = 'bold ' + (size/1.5) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 2);
    }

    function drawCoin(x, y) {
        const r = 12;
        const wobble = Math.sin(frame * 0.1) * 2;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r + wobble, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Outline
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Shine
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 6, 4, 12);
    }

    function drawEnemy(x, y) {
        const bounce = Math.abs(Math.sin(frame * 0.1)) * -10;
        
        // Body
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath();
        ctx.arc(x, y + bounce, 20, 0, Math.PI*2);
        ctx.fill();
        
        // Outline
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = GAME_STROKE;
        ctx.stroke();
        
        // Spikes
        for(let i=0; i<8; i++) {
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.rotate((i * Math.PI * 2) / 8 + frame * 0.05);
            ctx.fillStyle = '#B71C1C';
            ctx.beginPath();
            ctx.moveTo(-5, -20);
            ctx.lineTo(5, -20);
            ctx.lineTo(0, -32);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }
        // Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x-6, y+bounce-4, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+6, y+bounce-4, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x-6, y+bounce-4, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+6, y+bounce-4, 2, 0, Math.PI*2); ctx.fill();
    }

    function drawFlag(x, y) {
        // Pole
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 6, 350);
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = GAME_STROKE;
        ctx.strokeRect(x, y, 6, 350);
        
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath(); ctx.arc(x+3, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.stroke();
        
        // Flag cloth (Waving)
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+6, y+15);
        ctx.quadraticCurveTo(x+50, y+30 + Math.sin(frame*0.1)*10, x+60, y+40);
        ctx.lineTo(x+6, y+60);
        ctx.fill();
        ctx.stroke();
    }

    // 5. FOREGROUND (Window Effect)
    function drawForeground() {
        const y = height - 80;
        ctx.fillStyle = '#33691E'; // Dark Green
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, y);
        // Bushy curve
        ctx.bezierCurveTo(100, y-80, 300, y-80, 400, y);
        ctx.bezierCurveTo(500, y+80, 700, y-80, 800, y);
        ctx.bezierCurveTo(900, y-80, 1100, y-80, 1200, y);
        ctx.lineTo(width, y);
        ctx.lineTo(width, height);
        ctx.fill();

        // Thick Outline
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = GAME_STROKE;
        ctx.stroke();

        // Leaves detail
        ctx.fillStyle = '#558B2F';
        ctx.beginPath();
        ctx.arc(100, y-20, 30, 0, Math.PI*2);
        ctx.arc(150, y-30, 40, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
    }

    // 6. HERO CHARACTER (Mascot)
    function drawHero(x, y) {
        const bounce = Math.abs(Math.sin(frame * 0.08)) * 20;
        const squash = Math.cos(frame * 0.08) * 5;
        
        ctx.save();
        ctx.translate(x, y - bounce);
        
        // Spring Base (Underneath)
        ctx.fillStyle = '#546E7A';
        ctx.fillRect(-25, 35 + squash, 50, 15);
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = GAME_STROKE;
        ctx.strokeRect(-25, 35 + squash, 50, 15);
        
        // Spring Coils
        ctx.strokeStyle = '#90A4AE';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for(let i=0; i<4; i++) {
            ctx.moveTo(-25, 35 + squash + (i*4));
            ctx.lineTo(25, 35 + squash + ((i+1)*4));
        }
        ctx.stroke();

        // Body (Round Bot)
        ctx.fillStyle = '#FF6F00'; // Orange
        ctx.beginPath();
        ctx.arc(0, 0 + squash, 45 - (squash/2), 0, Math.PI * 2);
        ctx.fill();
        
        // Thick Outline
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = GAME_STROKE;
        ctx.stroke();

        // Goggles
        ctx.fillStyle = '#263238';
        ctx.beginPath();
        ctx.roundRect(-35, -15 + squash, 70, 25, 8);
        ctx.fill();

        // Lens (Glass)
        ctx.fillStyle = '#E0F7FA';
        ctx.beginPath();
        ctx.arc(0, -2 + squash, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Eyes (Inside Goggles)
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(8, -4 + squash, 4, 0, Math.PI*2); ctx.fill(); // Right
        ctx.beginPath(); ctx.arc(-8, -4 + squash, 4, 0, Math.PI*2); ctx.fill(); // Left

        // Shine on Goggles
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(12, -8 + squash, 4, 0, Math.PI*2); ctx.fill();

        // Antenna
        ctx.strokeStyle = '#37474F';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -45 + squash);
        ctx.lineTo(0, -65 + squash);
        ctx.stroke();
        ctx.fillStyle = '#F44336';
        ctx.beginPath(); ctx.arc(0, -65 + squash, 6, 0, Math.PI*2); ctx.fill();
        ctx.stroke();

        // Arms (Dynamic)
        ctx.strokeStyle = '#FF6F00';
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        ctx.strokeStyle = GAME_COLOR_DARK; // Outline arms first
        ctx.lineWidth = 16;
        
        // Left Arm (Waving)
        ctx.beginPath();
        ctx.moveTo(-30, 10 + squash);
        ctx.quadraticCurveTo(-60, -20 + squash, -50, -40 + squash);
        ctx.stroke();
        // Inner arm
        ctx.strokeStyle = '#FF6F00';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(-30, 10 + squash);
        ctx.quadraticCurveTo(-60, -20 + squash, -50, -40 + squash);
        ctx.stroke();

        // Right Arm (Pumping)
        ctx.strokeStyle = GAME_COLOR_DARK;
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.moveTo(30, 10 + squash);
        ctx.quadraticCurveTo(60, 30 + squash, 40, 50 + squash);
        ctx.stroke();
        ctx.strokeStyle = '#FF6F00';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(30, 10 + squash);
        ctx.quadraticCurveTo(60, 30 + squash, 40, 50 + squash);
        ctx.stroke();

        ctx.restore();
    }

    // PARTICLES
    const particles = [];
    function spawnParticle() {
        if(Math.random() > 0.05) return;
        particles.push({
            x: Math.random() * width,
            y: height - 100,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            life: 100,
            color: Math.random() > 0.5 ? '#FFF' : '#FFD700'
        });
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    // MAIN LOOP
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // 1. Sky Background
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#4FC3F7');
        grad.addColorStop(1, '#E1F5FE');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Distant Mountains
        drawMountains();

        // 3. Clouds
        clouds.forEach(c => {
            c.x += c.speed;
            if(c.x > width + 100) c.x = -100;
            drawCloud(c);
        });

        // 4. Mid-ground Hills
        drawHills();

        const groundY = height - 200; 

        // 5. Platforms (Continuous Environment)
        
        // Start Platform (Left) - Long continuous ground
        drawBlock(0, groundY, 600); 
        
        // Mid Platforms - Connected by a slight ramp or just floating blocks
        drawBlock(650, groundY - 80, 200);
        drawBlock(900, groundY - 160, 200);

        // Goal Platform (Right)
        drawBlock(1150, groundY - 80, 400);

        // 6. Interactive Elements
        drawBlock(700, groundY - 210, 50);
        drawGoldBlock(760, groundY - 210, 50);
        drawBlock(820, groundY - 210, 50);
        
        drawCoin(735, groundY - 260);
        drawCoin(980, groundY - 220);
        drawCoin(1000, groundY - 250);

        // 7. Enemy
        drawEnemy(950, groundY - 210);

        // 8. Goal Flag
        drawFlag(1300, groundY - 230);

        // 9. HERO (Center-Left, Dynamic Pose)
        drawHero(250, groundY - 40);

        // 10. Foreground (Window Effect)
        drawForeground();

        // 11. Particles
        spawnParticle();
        updateParticles();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
