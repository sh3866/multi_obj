<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loom | Workshop Edition</title>
    <style>
        :root {
            /* Identity: Digital Workshop */
            --bg-workshop: #1a1c21; /* Dark slate base */
            --bg-workshop-texture: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 4px);
            
            --glass-bg: rgba(26, 28, 33, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(12px);
            
            --accent-primary: #00E5FF; /* Electric Blue */
            --accent-glow: rgba(0, 229, 255, 0.3);
            
            --validation-warn: #FFB300; /* Amber */
            --validation-bg: rgba(255, 179, 0, 0.1);
            
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Courier New", Consolas, "Liberation Mono", monospace; /* Technical aesthetic */
            
            --radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-workshop);
            background-image: var(--bg-workshop-texture);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        header {
            height: 60px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(26, 28, 33, 0.9);
            backdrop-filter: var(--glass-blur);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: var(--text-main);
            border-radius: 4px;
            position: relative;
        }
        .brand-icon::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; width: 6px; height: 6px;
            background: var(--bg-workshop);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* --- Layout Grid --- */
        main {
            display: grid;
            /* Left: 340px, Center: 60% (approx), Right: 340px */
            grid-template-columns: 340px 1fr 340px;
            height: calc(100vh - 60px);
            width: 100%;
        }

        /* --- Panels (Shared) --- */
        aside {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            z-index: 10;
        }

        /* Left Panel: Glassmorphism "Creative" */
        .left-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--glass-border);
        }

        /* Right Panel: Technical "Code" */
        .right-panel {
            background: #15171c; /* Slightly darker, solid */
            border-left: 1px solid var(--glass-border);
        }

        .section-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 24px;
            margin-top: 24px;
        }
        
        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .panel-content {
            padding: 0 24px;
        }

        /* --- Form Elements --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Inputs: Standardized 6px radius, 1px border */
        input[type="number"], 
        select, 
        input[type="text"] {
            background: rgba(0,0,0,0.2);
            border: 1px solid #333;
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: var(--radius);
            font-family: var(--font-mono); /* Technical aesthetic */
            font-size: 13px;
            width: 100%;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--accent-primary);
        }

        /* Monospaced Data Values */
        .data-value {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            min-width: 40px;
            text-align: right;
        }

        /* Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* Toggles */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        
        .switch {
            position: relative;
            width: 36px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            border-radius: 20px;
            transition: .3s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: rgba(0, 229, 255, 0.3); }
        input:checked + .slider:before { transform: translateX(16px); background-color: var(--accent-primary); }

        /* --- Center: The Hero Board --- */
        .viewport {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Vignette / Felt Effect */
            background: radial-gradient(circle at center, #2a2d38 0%, #16181d 80%);
        }

        /* Subtle Grid Background */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle, black 40%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle, black 40%, transparent 90%);
            pointer-events: none;
        }

        #board-canvas {
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); /* Deep shadow for physical presence */
            border-radius: 4px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: crosshair;
        }

        /* --- Right Panel: Rules (Technical) --- */
        .rule-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid #333;
            border-radius: var(--radius);
            padding: 16px; /* Increased vertical padding */
            margin-bottom: 12px;
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .rule-title {
            font-family: var(--font-mono); /* Monospaced Headers */
            font-weight: 700;
            font-size: 13px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .rule-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent-primary);
            background: rgba(0, 229, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .rule-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .rule-row:last-child { margin-bottom: 0; }

        .rule-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* --- Validation Summary (Gatekeeper) --- */
        .validation-card {
            background: var(--validation-bg);
            border: 1px solid var(--validation-warn);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
        }

        .validation-icon {
            color: var(--validation-warn);
            font-family: var(--font-mono);
            font-weight: bold;
        }

        .validation-content h4 {
            font-size: 12px;
            font-weight: 600;
            color: var(--validation-warn);
            margin-bottom: 2px;
        }
        .validation-content p {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* --- Buttons --- */
        .btn {
            padding: 10px 20px;
            border-radius: var(--radius);
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Primary: Electric Blue */
        .btn-generate {
            background: var(--accent-primary);
            color: #000;
            width: 100%;
            box-shadow: 0 0 15px var(--accent-glow);
            margin-top: 10px;
            margin-bottom: 24px;
        }
        .btn-generate:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Secondary: Header Action */
        .btn-start {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 8px 16px;
        }
        .btn-start:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--text-main);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            LOOM
        </div>
        
        <div class="header-actions">
            <button class="btn btn-start" id="startGameBtn">
                Start Game
            </button>
        </div>
    </header>

    <main>
        <!-- Left: Creative Controls (Glassmorphism) -->
        <aside class="left-panel">
            
            <div class="section-header">Board Geometry</div>
            <div class="panel-content">
                <div class="control-group">
                    <div class="control-row">
                        <label>Topology</label>
                        <select id="gridType">
                            <option value="hex">Hexagonal</option>
                            <option value="square">Square Grid</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <label>Dimensions</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="number" id="colsInput" value="9" min="3" max="20" style="width: 60px;">
                            <span style="color:#666; align-self:center;">×</span>
                            <input type="number" id="rowsInput" value="9" min="3" max="20" style="width: 60px;">
                        </div>
                    </div>
                    <div>
                        <div class="control-row">
                            <label>Cell Scale</label>
                            <span id="radiusVal" class="data-value">28px</span>
                        </div>
                        <input type="range" id="radiusInput" min="15" max="45" value="28">
                    </div>
                </div>
            </div>

            <div class="section-header">Generators</div>
            <div class="panel-content">
                <div class="control-group">
                    <div class="toggle-row">
                        <label>Perlin Noise</label>
                        <label class="switch">
                            <input type="checkbox" id="noiseToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <label>Resource Clusters</label>
                        <label class="switch">
                            <input type="checkbox" id="clusterToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div>
                        <div class="control-row">
                            <label>Entropy</label>
                            <span id="chaosVal" class="data-value">0.40</span>
                        </div>
                        <input type="range" id="chaosInput" min="0" max="100" value="40">
                    </div>
                </div>
            </div>

            <!-- Gatekeeper: Validation & Generate -->
            <div class="panel-content" style="margin-top: auto; padding-bottom: 32px;">
                <div class="validation-card">
                    <div class="validation-icon">⚠</div>
                    <div class="validation-content">
                        <h4>Unstable Seed</h4>
                        <p>Grid topology is valid, but resource density is low. Generate to resolve.</p>
                    </div>
                </div>

                <button class="btn btn-generate" id="generateBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"></path></svg>
                    Generate Board
                </button>
            </div>
        </aside>

        <!-- Center: Hero Canvas -->
        <section class="viewport">
            <div class="grid-bg"></div>
            <canvas id="board-canvas"></canvas>
        </section>

        <!-- Right: Technical Rules (Monospace/Code) -->
        <aside class="right-panel">
            
            <div class="section-header">Rule Logic</div>
            <div class="panel-content">
                
                <!-- Rule Card 1 -->
                <div class="rule-card">
                    <div class="rule-header">
                        <span class="rule-title">Movement</span>
                        <span class="rule-tag">Physics</span>
                    </div>
                    <div class="rule-row">
                        <span class="rule-label">Base Cost</span>
                        <input type="number" value="2" style="width: 60px;">
                    </div>
                    <div class="rule-row">
                        <span class="rule-label">Slope Mod</span>
                        <input type="range" min="0" max="5" value="1" style="width: 80px;">
                    </div>
                </div>

                <!-- Rule Card 2 -->
                <div class="rule-card">
                    <div class="rule-header">
                        <span class="rule-title">Visibility</span>
                        <span class="rule-tag">Fog</span>
                    </div>
                    <div class="rule-row">
                        <span class="rule-label">Radius</span>
                        <input type="number" value="4" style="width: 60px;">
                    </div>
                    <div class="rule-row">
                        <span class="rule-label">Decay</span>
                        <select style="width: 80px; font-size: 11px;">
                            <option>Linear</option>
                            <option>Exponential</option>
                        </select>
                    </div>
                </div>

                <!-- Rule Card 3 -->
                <div class="rule-card">
                    <div class="rule-header">
                        <span class="rule-title">Victory</span>
                        <span class="rule-tag">GameLoop</span>
                    </div>
                    <div class="rule-row">
                        <span class="rule-label">Condition</span>
                        <select style="width: 100%;">
                            <option>Capture Flag</option>
                            <option>Annihilation</option>
                            <option>Point Dominance</option>
                        </select>
                    </div>
                </div>

                <div class="section-header">Initial Layout</div>
                <div class="panel-content">
                    <div class="control-group">
                        <div class="rule-row">
                            <span class="rule-label">P1 Spawn</span>
                            <select style="width: 100%;">
                                <option>Top Left</option>
                                <option>Random</option>
                            </select>
                        </div>
                        <div class="rule-row">
                            <span class="rule-label">Starting Units</span>
                            <input type="number" value="4" style="width: 60px;">
                        </div>
                    </div>
                </div>

            </div>
        </aside>
    </main>

    <script>
        // --- Configuration & State ---
        const state = {
            cols: 9,
            rows: 9,
            type: 'hex',
            radius: 28,
            chaos: 0.4,
            noise: true,
            seed: Math.floor(Math.random() * 100000)
        };

        // --- DOM Elements ---
        const canvas = document.getElementById('board-canvas');
        const ctx = canvas.getContext('2d');
        const colsInput = document.getElementById('colsInput');
        const rowsInput = document.getElementById('rowsInput');
        const typeInput = document.getElementById('gridType');
        const radiusInput = document.getElementById('radiusInput');
        const chaosInput = document.getElementById('chaosInput');
        const generateBtn = document.getElementById('generateBtn');

        // --- Colors (High Saturation) ---
        const colors = {
            water: '#0077B6',    // Vibrant Blue
            sand: '#FFB703',     // Bright Amber
            grass: '#2EC4B6',    // Teal
            forest: '#023047',   // Deep Slate Blue
            mountain: '#8D99AE', // Steel Grey
            obstacle: '#212529', // Dark Charcoal
            highlight: 'rgba(255,255,255,0.15)'
        };

        // --- Noise Logic ---
        function pseudoRandom(x, y, seed) {
            let n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
            return n - Math.floor(n);
        }

        function smoothNoise(x, y, seed) {
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            const fx = x - ix;
            const fy = y - iy;
            
            const v1 = pseudoRandom(ix, iy, seed);
            const v2 = pseudoRandom(ix+1, iy, seed);
            const v3 = pseudoRandom(ix, iy+1, seed);
            const v4 = pseudoRandom(ix+1, iy+1, seed);

            const i1 = v1 * (1 - fx) + v2 * fx;
            const i2 = v3 * (1 - fx) + v4 * fx;
            return i1 * (1 - fy) + i2 * fy;
        }

        // --- Drawing ---
        function drawHexagon(ctx, x, y, r) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                // Pointy top for "honeycomb" feel, or flat top. Let's do pointy top.
                // Adjust angle for pointy top: -Math.PI/6
                const angleAdj = angle - Math.PI/6; 
                const offsetX = r * Math.cos(angleAdj);
                const offsetY = r * Math.sin(angleAdj);
                if (i === 0) ctx.moveTo(x + offsetX, y + offsetY);
                else ctx.lineTo(x + offsetX, y + offsetY);
            }
            ctx.closePath();
        }

        function getTerrainColor(val) {
            if (val < 0.35) return colors.water;
            if (val < 0.45) return colors.sand;
            if (val < 0.65) return colors.grass;
            if (val < 0.85) return colors.forest;
            return colors.mountain;
        }

        function renderBoard() {
            // 1. Setup Canvas Size
            // Pointy top hex dimensions
            const hexWidth = Math.sqrt(3) * state.radius;
            const hexHeight = 2 * state.radius;
            const verticalSpacing = hexHeight * 0.75;
            const horizontalSpacing = hexWidth;

            const totalWidth = (state.cols * horizontalSpacing) + (hexWidth/2);
            const totalHeight = (state.rows * verticalSpacing) + hexHeight;

            // High DPI scaling
            const dpr = window.devicePixelRatio || 1;
            canvas.width = totalWidth * dpr;
            canvas.height = totalHeight * dpr;
            canvas.style.width = `${totalWidth}px`;
            canvas.style.height = `${totalHeight}px`;
            ctx.scale(dpr, dpr);

            ctx.clearRect(0, 0, totalWidth, totalHeight);

            // 2. Draw Grid
            for (let r = 0; r < state.rows; r++) {
                for (let c = 0; c < state.cols; c++) {
                    // Offset odd columns for pointy top hex
                    const yOffset = (c % 2) * (verticalSpacing); 
                    const x = c * horizontalSpacing + (hexWidth/2);
                    const y = r * verticalSpacing + yOffset + state.radius;

                    // Generate Terrain
                    const scale = 0.2 + (state.chaos * 0.4);
                    let noiseVal = state.noise ? smoothNoise(c * scale, r * scale, state.seed) : 0.5;
                    
                    let isObstacle = false;
                    if (document.getElementById('obstacleToggle')?.checked) {
                         if (pseudoRandom(c, r, state.seed + 999) > 0.85) isObstacle = true;
                    }

                    ctx.save();
                    
                    // Shadow
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 4;

                    drawHexagon(ctx, x, y, state.radius - 1.5); // -1.5 for gap
                    
                    ctx.fillStyle = isObstacle ? colors.obstacle : getTerrainColor(noiseVal);
                    ctx.fill();

                    // Inner Bevel/Stroke
                    ctx.shadowColor = "transparent"; 
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(0,0,0,0.2)";
                    ctx.stroke();

                    // Top Highlight (Glass effect)
                    ctx.beginPath();
                    drawHexagon(ctx, x, y, state.radius - 1.5);
                    ctx.clip();
                    ctx.fillStyle = "rgba(255,255,255,0.08)";
                    ctx.beginPath();
                    ctx.arc(x, y, state.radius, 0, Math.PI*2);
                    ctx.fill();

                    ctx.restore();
                }
            }
        }

        // --- Event Listeners ---
        function updateState() {
            state.cols = parseInt(colsInput.value);
            state.rows = parseInt(rowsInput.value);
            state.type = typeInput.value;
            state.radius = parseInt(radiusInput.value);
            state.chaos = parseInt(chaosInput.value) / 100;
            state.noise = document.getElementById('noiseToggle').checked;
            
            document.getElementById('radiusVal').innerText = `${state.radius}px`;
            document.getElementById('chaosVal').innerText = state.chaos.toFixed(2);
            
            renderBoard();
        }

        [colsInput, rowsInput, typeInput, radiusInput, chaosInput].forEach(el => {
            el.addEventListener('input', updateState);
        });
        
        document.getElementById('noiseToggle').addEventListener('change', updateState);

        // Generate Button
        generateBtn.addEventListener('click', () => {
            state.seed = Math.floor(Math.random() * 100000);
            
            // Update Validation UI to "Success" temporarily
            const vCard = document.querySelector('.validation-card');
            const vIcon = document.querySelector('.validation-icon');
            const vTitle = document.querySelector('.validation-content h4');
            const vText = document.querySelector('.validation-content p');
            
            vCard.style.borderColor = '#2EC4B6';
            vCard.style.background = 'rgba(46, 196, 182, 0.1)';
            vIcon.innerText = '✓';
            vIcon.style.color = '#2EC4B6';
            vTitle.innerText = 'Board Generated';
            vTitle.style.color = '#2EC4B6';
            vText.innerText = `Seed ${state.seed} locked. Topology stable.`;

            renderBoard();
        });

        // Initial Render
        renderBoard();
        window.addEventListener('resize', renderBoard);

    </script>
</body>
</html>
