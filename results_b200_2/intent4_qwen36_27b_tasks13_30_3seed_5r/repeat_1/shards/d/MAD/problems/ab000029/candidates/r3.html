<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loom | Workshop Edition</title>
    <style>
        :root {
            /* Visual System Unification: Professional Dark UI */
            --bg-app: #0f1115;
            --bg-panel: #181b21;
            --bg-input: #0b0d10;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.15);
            
            --primary: #007AFF; /* Professional Blue */
            --primary-hover: #0062cc;
            --primary-glow: rgba(0, 122, 255, 0.25);
            
            --text-main: #f0f0f0;
            --text-muted: #8b949e;
            --text-dim: #484f58;
            
            --status-warn: #e3b341;
            --status-warn-bg: rgba(227, 179, 65, 0.15);
            --status-ok: #3fb950;
            --status-ok-bg: rgba(63, 185, 80, 0.15);

            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        header {
            height: 56px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg-panel);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            background: var(--text-main);
            border-radius: var(--radius-sm);
            position: relative;
        }
        .brand-icon::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; width: 4px; height: 4px;
            background: var(--bg-app);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* --- Layout Grid --- */
        main {
            display: grid;
            /* Left: Config (320px), Center: Viewport, Right: Rules (320px) */
            grid-template-columns: 320px 1fr 320px;
            height: calc(100vh - 56px);
            width: 100%;
        }

        /* --- Panels (Shared) --- */
        aside {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--bg-panel);
        }

        .left-panel {
            border-right: 1px solid var(--border-subtle);
            z-index: 10;
        }

        .right-panel {
            border-left: 1px solid var(--border-subtle);
            z-index: 10;
        }

        /* Scrollbar Styling */
        aside::-webkit-scrollbar { width: 6px; }
        aside::-webkit-scrollbar-track { background: transparent; }
        aside::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        aside::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Section Headers */
        .section-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
            padding: 20px 24px 8px 24px;
            display: flex;
            align-items: center;
        }
        
        .panel-content {
            padding: 0 24px 24px 24px;
        }

        /* --- Form Elements (Standardized) --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 8px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Inputs: Unified Style */
        input[type="number"], 
        select, 
        input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: var(--radius-md);
            font-family: var(--font-ui);
            font-size: 12px;
            width: 100%;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.15);
        }

        .data-value {
            font-family: var(--font-ui);
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
            min-width: 35px;
            text-align: right;
        }

        /* Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); }

        /* Toggles */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        
        .switch {
            position: relative;
            width: 32px;
            height: 18px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            border-radius: 20px;
            transition: .2s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-main);
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(14px); }

        /* --- Center: The Hero Board --- */
        .viewport {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Grounding Background */
            background: #131519;
            background-image: 
                radial-gradient(circle at center, #1e2128 0%, #0f1115 100%);
        }

        /* Grid Overlay */
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        #board-canvas {
            /* Isometric 3D Effect via Shadow */
            box-shadow: 
                0 20px 40px -10px rgba(0,0,0,0.6), 
                0 0 0 1px rgba(255,255,255,0.05);
            border-radius: 4px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: crosshair;
            z-index: 2;
        }

        /* --- Right Panel: Rule Editor (Accordion) --- */
        
        /* Accordion Section */
        details.accordion {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            overflow: hidden;
        }
        
        details.accordion[open] {
            border-color: var(--border-active);
        }

        details.accordion summary {
            list-style: none;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            transition: background 0.2s;
        }
        
        details.accordion summary:hover {
            background: rgba(255,255,255,0.04);
        }
        
        details.accordion summary::-webkit-details-marker { display: none; }
        
        details.accordion summary::after {
            content: '+';
            font-weight: 400;
            font-size: 14px;
            color: var(--text-muted);
        }
        
        details.accordion[open] summary::after {
            content: '−';
        }

        .accordion-content {
            padding: 12px 16px;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-panel);
        }

        .rule-tag {
            font-size: 10px;
            color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .rule-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .rule-row:last-child { margin-bottom: 0; }

        /* --- Validation Feedback (Inline) --- */
        .validation-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--status-warn-bg);
            border: 1px solid rgba(227, 179, 65, 0.3);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .status-icon {
            font-family: monospace;
            font-size: 14px;
            color: var(--status-warn);
        }

        .validation-text {
            font-size: 11px;
            color: var(--status-warn);
            line-height: 1.3;
        }

        /* --- Buttons --- */
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: none;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Primary Action: Generate (Blue) */
        .btn-generate {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 10px var(--primary-glow);
        }
        .btn-generate:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* Secondary Action: Start Game (Ghost) */
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }
        .btn-ghost:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255,255,255,0.03);
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            LOOM
        </div>
        
        <div class="header-actions">
            <!-- 1. RESTRUCTURE: Generate moved to Header -->
            <button class="btn btn-generate" id="generateBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"></path></svg>
                Generate Board
            </button>
            
            <!-- 5. COLOR & HIERARCHY: Start Game is Ghost -->
            <button class="btn btn-ghost" id="startGameBtn">
                Start Game
            </button>
        </div>
    </header>

    <main>
        <!-- Left: Geometry & Generation Controls -->
        <aside class="left-panel">
            
            <div class="section-header">Board Geometry</div>
            <div class="panel-content">
                <div class="control-group">
                    <div class="control-row">
                        <label>Topology</label>
                        <select id="gridType">
                            <option value="hex">Hexagonal</option>
                            <option value="square">Square Grid</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <label>Dimensions</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="number" id="colsInput" value="9" min="3" max="20" style="width: 50px;">
                            <span style="color:var(--text-dim);">×</span>
                            <input type="number" id="rowsInput" value="9" min="3" max="20" style="width: 50px;">
                        </div>
                    </div>
                    <div>
                        <div class="control-row">
                            <label>Cell Scale</label>
                            <span id="radiusVal" class="data-value">28px</span>
                        </div>
                        <input type="range" id="radiusInput" min="15" max="45" value="28">
                    </div>
                </div>
            </div>

            <div class="section-header">Generators</div>
            <div class="panel-content">
                <div class="control-group">
                    <div class="toggle-row">
                        <label>Perlin Noise</label>
                        <label class="switch">
                            <input type="checkbox" id="noiseToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <label>Resource Clusters</label>
                        <label class="switch">
                            <input type="checkbox" id="clusterToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div>
                        <div class="control-row">
                            <label>Entropy</label>
                            <span id="chaosVal" class="data-value">0.40</span>
                        </div>
                        <input type="range" id="chaosInput" min="0" max="100" value="40">
                    </div>
                </div>
            </div>
            
            <!-- Spacer to push validation down if needed, or keep near bottom -->
            <div style="flex:1"></div>

            <!-- 6. VALIDATION: Inline Status -->
            <div class="panel-content">
                <div class="validation-inline" id="validationBox">
                    <div class="status-icon">⚠</div>
                    <div class="validation-text">Unstable Seed. Low density detected.</div>
                </div>
            </div>

        </aside>

        <!-- Center: Hero Canvas -->
        <section class="viewport">
            <div class="grid-overlay"></div>
            <canvas id="board-canvas"></canvas>
        </section>

        <!-- Right: Expanded Rule Editor -->
        <aside class="right-panel">
            
            <div class="section-header">Rule Editor</div>
            <div class="panel-content">
                
                <!-- 2. EXPAND RIGHT PANEL: Accordion Layout -->
                
                <!-- Initial Layout: Elevated -->
                <div class="control-group" style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
                    <div style="font-size: 12px; font-weight: 600; margin-bottom: 12px; color: var(--text-main);">Initial Layout</div>
                    <div class="rule-row">
                        <span class="rule-label">P1 Spawn</span>
                        <select style="width: 120px;">
                            <option>Top Left</option>
                            <option>Random</option>
                        </select>
                    </div>
                    <div class="rule-row">
                        <span class="rule-label">Starting Units</span>
                        <input type="number" value="4" style="width: 60px;">
                    </div>
                </div>

                <div style="height: 16px;"></div> <!-- Spacer -->

                <!-- Accordion: Movement -->
                <details class="accordion" open>
                    <summary>
                        <span>Movement Logic</span>
                        <span class="rule-tag">Physics</span>
                    </summary>
                    <div class="accordion-content">
                        <div class="rule-row">
                            <span class="rule-label">Base Cost</span>
                            <input type="number" value="2" style="width: 60px;">
                        </div>
                        <div class="rule-row">
                            <span class="rule-label">Slope Mod</span>
                            <input type="range" min="0" max="5" value="1" style="width: 80px;">
                        </div>
                    </div>
                </details>

                <!-- Accordion: Visibility -->
                <details class="accordion">
                    <summary>
                        <span>Visibility</span>
                        <span class="rule-tag">Fog</span>
                    </summary>
                    <div class="accordion-content">
                        <div class="rule-row">
                            <span class="rule-label">Radius</span>
                            <input type="number" value="4" style="width: 60px;">
                        </div>
                        <div class="rule-row">
                            <span class="rule-label">Decay</span>
                            <select style="width: 80px; font-size: 11px;">
                                <option>Linear</option>
                                <option>Exponential</option>
                            </select>
                        </div>
                    </div>
                </details>

                <!-- Accordion: Victory -->
                <details class="accordion">
                    <summary>
                        <span>Victory Conditions</span>
                        <span class="rule-tag">Loop</span>
                    </summary>
                    <div class="accordion-content">
                        <div class="rule-row">
                            <span class="rule-label">Win Mode</span>
                            <select style="width: 100%;">
                                <option>Capture Flag</option>
                                <option>Annihilation</option>
                                <option>Point Dominance</option>
                            </select>
                        </div>
                    </div>
                </details>

            </div>
        </aside>
    </main>

    <script>
        // --- Configuration & State ---
        const state = {
            cols: 9,
            rows: 9,
            type: 'hex',
            radius: 28,
            chaos: 0.4,
            noise: true,
            seed: Math.floor(Math.random() * 100000)
        };

        // --- DOM Elements ---
        const canvas = document.getElementById('board-canvas');
        const ctx = canvas.getContext('2d');
        const colsInput = document.getElementById('colsInput');
        const rowsInput = document.getElementById('rowsInput');
        const typeInput = document.getElementById('gridType');
        const radiusInput = document.getElementById('radiusInput');
        const chaosInput = document.getElementById('chaosInput');
        const generateBtn = document.getElementById('generateBtn');
        const validationBox = document.getElementById('validationBox');

        // --- Colors (Refined Palette) ---
        const colors = {
            water: '#1e3a8a',    // Deep Blue
            sand: '#ca8a04',     // Muted Gold
            grass: '#15803d',    // Forest Green
            forest: '#064e3b',   // Deep Pine
            mountain: '#374151', // Slate Grey
            obstacle: '#111827', // Dark Charcoal
            highlight: 'rgba(255,255,255,0.1)'
        };

        // --- Noise Logic ---
        function pseudoRandom(x, y, seed) {
            let n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
            return n - Math.floor(n);
        }

        function smoothNoise(x, y, seed) {
            const ix = Math.floor(x);
            const iy = Math.floor(y);
            const fx = x - ix;
            const fy = y - iy;
            
            const v1 = pseudoRandom(ix, iy, seed);
            const v2 = pseudoRandom(ix+1, iy, seed);
            const v3 = pseudoRandom(ix, iy+1, seed);
            const v4 = pseudoRandom(ix+1, iy+1, seed);

            const i1 = v1 * (1 - fx) + v2 * fx;
            const i2 = v3 * (1 - fx) + v4 * fx;
            return i1 * (1 - fy) + i2 * fy;
        }

        // --- Drawing ---
        function drawHexagon(ctx, x, y, r) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                // Pointy top
                const angleAdj = angle - Math.PI/6; 
                const offsetX = r * Math.cos(angleAdj);
                const offsetY = r * Math.sin(angleAdj);
                if (i === 0) ctx.moveTo(x + offsetX, y + offsetY);
                else ctx.lineTo(x + offsetX, y + offsetY);
            }
            ctx.closePath();
        }

        function getTerrainColor(val) {
            if (val < 0.35) return colors.water;
            if (val < 0.45) return colors.sand;
            if (val < 0.65) return colors.grass;
            if (val < 0.85) return colors.forest;
            return colors.mountain;
        }

        function renderBoard() {
            // 1. Setup Canvas Size
            const hexWidth = Math.sqrt(3) * state.radius;
            const hexHeight = 2 * state.radius;
            const verticalSpacing = hexHeight * 0.75;
            const horizontalSpacing = hexWidth;

            const totalWidth = (state.cols * horizontalSpacing) + (hexWidth/2);
            const totalHeight = (state.rows * verticalSpacing) + hexHeight;

            // High DPI scaling
            const dpr = window.devicePixelRatio || 1;
            canvas.width = totalWidth * dpr;
            canvas.height = totalHeight * dpr;
            canvas.style.width = `${totalWidth}px`;
            canvas.style.height = `${totalHeight}px`;
            ctx.scale(dpr, dpr);

            ctx.clearRect(0, 0, totalWidth, totalHeight);

            // 2. Draw Grid
            for (let r = 0; r < state.rows; r++) {
                for (let c = 0; c < state.cols; c++) {
                    const yOffset = (c % 2) * (verticalSpacing); 
                    const x = c * horizontalSpacing + (hexWidth/2);
                    const y = r * verticalSpacing + yOffset + state.radius;

                    const scale = 0.2 + (state.chaos * 0.4);
                    let noiseVal = state.noise ? smoothNoise(c * scale, r * scale, state.seed) : 0.5;
                    
                    let isObstacle = false;
                    if (pseudoRandom(c, r, state.seed + 999) > 0.95) isObstacle = true;

                    ctx.save();
                    
                    // 4. BOARD PRESENTATION: Isometric Shadow
                    ctx.shadowColor = "rgba(0,0,0,0.4)";
                    ctx.shadowBlur = 12;
                    ctx.shadowOffsetY = 6;

                    drawHexagon(ctx, x, y, state.radius - 1.5);
                    
                    ctx.fillStyle = isObstacle ? colors.obstacle : getTerrainColor(noiseVal);
                    ctx.fill();

                    // Inner Bevel
                    ctx.shadowColor = "transparent"; 
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(0,0,0,0.3)";
                    ctx.stroke();

                    // Top Highlight
                    ctx.beginPath();
                    drawHexagon(ctx, x, y, state.radius - 1.5);
                    ctx.clip();
                    
                    // Simple gradient for 3D cylinder look
                    const grad = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
                    grad.addColorStop(0, "rgba(255,255,255,0.15)");
                    grad.addColorStop(0.5, "rgba(255,255,255,0.05)");
                    grad.addColorStop(1, "rgba(0,0,0,0.1)");
                    
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x, y, state.radius, 0, Math.PI*2);
                    ctx.fill();

                    ctx.restore();
                }
            }
        }

        // --- Event Listeners ---
        function updateState() {
            state.cols = parseInt(colsInput.value);
            state.rows = parseInt(rowsInput.value);
            state.type = typeInput.value;
            state.radius = parseInt(radiusInput.value);
            state.chaos = parseInt(chaosInput.value) / 100;
            state.noise = document.getElementById('noiseToggle').checked;
            
            document.getElementById('radiusVal').innerText = `${state.radius}px`;
            document.getElementById('chaosVal').innerText = state.chaos.toFixed(2);
            
            renderBoard();
            
            // Reset validation visual on change
            resetValidation();
        }

        function resetValidation() {
            validationBox.style.borderColor = "rgba(227, 179, 65, 0.3)";
            validationBox.style.background = "var(--status-warn-bg)";
            validationBox.querySelector('.status-icon').innerText = "⚠";
            validationBox.querySelector('.status-icon').style.color = "var(--status-warn)";
            validationBox.querySelector('.validation-text').innerText = "Unstable Seed. Low density detected.";
            validationBox.querySelector('.validation-text').style.color = "var(--status-warn)";
        }

        [colsInput, rowsInput, typeInput, radiusInput, chaosInput].forEach(el => {
            el.addEventListener('input', updateState);
        });
        
        document.getElementById('noiseToggle').addEventListener('change', updateState);

        // Generate Button Action
        generateBtn.addEventListener('click', () => {
            state.seed = Math.floor(Math.random() * 100000);
            
            // Update Validation UI
            validationBox.style.borderColor = "rgba(63, 185, 80, 0.4)";
            validationBox.style.background = "var(--status-ok-bg)";
            validationBox.querySelector('.status-icon').innerText = "✓";
            validationBox.querySelector('.status-icon').style.color = "var(--status-ok)";
            validationBox.querySelector('.validation-text').innerText = "Board Generated. Topology stable.";
            validationBox.querySelector('.validation-text').style.color = "var(--status-ok)";

            renderBoard();
        });

        // Initial Render
        renderBoard();
        window.addEventListener('resize', renderBoard);

    </script>
</body>
</html>
