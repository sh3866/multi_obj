<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with Tiles</title>
<style>
  :root {
    --felt-base: #2b5a38;
    --felt-edge: #122617;
    --wood-rim: #2e1e15;
    --wood-light: #4a2e18;
    --ivory-top: #fdfbf7;
    --ivory-side: #dcd6c8;
    --ivory-shadow: #b8b0a0;
    --pip-color: #111;
    --gold: #d4af37;
    --gold-dim: #8a7420;
    --text-main: #e8e6df;
    --text-muted: #9ea99e;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    font-family: var(--font-stack);
    background: #080808;
    color: var(--text-main);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* --- Background & Materiality --- */
  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, var(--felt-base), var(--felt-edge) 80%);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Felt Texture Overlay */
  #game-container::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
  }

  /* Vignette */
  #game-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Wooden Rim */
  .rim {
    position: absolute;
    inset: 0;
    border: 16px solid var(--wood-rim);
    border-image: linear-gradient(to bottom, #5c3a21, #2e1e15, #1a1008) 1;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    z-index: 10;
    pointer-events: none;
  }

  /* --- UI: Typography & Layout --- */
  .ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
  }

  .brand {
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.3);
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid rgba(212, 175, 55, 0.2);
    backdrop-filter: blur(4px);
  }

  .scores {
    display: flex;
    gap: 24px;
  }

  .score-pill {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.05);
    padding: 6px 20px;
    border-radius: 20px;
    text-align: center;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
  }

  .score-pill.active {
    border-color: var(--gold-dim);
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
  }

  .score-pill .label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .score-pill .val {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
  }

  /* --- Board & Chain --- */
  #board-svg {
    width: 100%;
    height: 100%;
    z-index: 5;
    overflow: visible;
  }

  /* --- Interactive Elements --- */
  
  /* Draw Pile */
  .draw-pile-container {
    position: absolute;
    left: 60px;
    bottom: 180px;
    z-index: 15;
    pointer-events: auto;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .draw-pile-container:hover {
    transform: translateY(-5px);
  }

  .draw-pile-container:active {
    transform: scale(0.95);
  }

  .pile-label {
    margin-top: 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 600;
  }

  .pile-count {
    font-size: 12px;
    color: var(--gold);
    font-weight: bold;
  }

  /* Match Values Panel (Top Right) */
  .match-panel {
    position: absolute;
    top: 24px;
    right: 24px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 8px 12px;
    pointer-events: auto;
    display: flex;
    gap: 12px;
    backdrop-filter: blur(4px);
  }

  .match-val {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .match-val span {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .val-badge {
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
  }

  /* Player Hand Area */
  .hand-rack {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 30px;
    background: linear-gradient(180deg, rgba(46, 30, 21, 0.85) 0%, rgba(26, 16, 8, 0.95) 100%);
    border-radius: 16px 16px 0 0;
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-bottom: none;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    z-index: 30;
    pointer-events: auto;
  }

  /* --- The Tile Component (Shared) --- */
  .tile {
    width: 56px;
    height: 100px;
    border-radius: 6px;
    position: relative;
    /* 3D Look */
    background: linear-gradient(135deg, #fff 0%, #f0ece4 50%, #e0dcd4 100%);
    box-shadow: 
      0 1px 0 #fff inset,
      0 -1px 0 rgba(0,0,0,0.1) inset,
      2px 4px 6px rgba(0,0,0,0.4),
      2px 2px 0px var(--ivory-side), /* Side depth */
      4px 4px 0px var(--ivory-shadow); /* Side depth 2 */
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .tile-half {
    flex: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .tile-divider {
    position: absolute;
    top: 50%;
    left: 4px;
    right: 4px;
    height: 1px;
    background: rgba(0,0,0,0.15);
    transform: translateY(-0.5px);
    z-index: 2;
  }

  /* Pips */
  .pip {
    width: 6px;
    height: 6px;
    background: var(--pip-color);
    border-radius: 50%;
    position: absolute;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.2);
  }

  /* Pip Positions */
  .p-1 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .p-2-1 { top: 25%; left: 25%; }
  .p-2-2 { bottom: 25%; right: 25%; }
  .p-3-1 { top: 25%; left: 25%; }
  .p-3-2 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .p-3-3 { bottom: 25%; right: 25%; }
  .p-4-1 { top: 25%; left: 25%; }
  .p-4-2 { top: 25%; right: 25%; }
  .p-4-3 { bottom: 25%; left: 25%; }
  .p-4-4 { bottom: 25%; right: 25%; }
  .p-5-1 { top: 25%; left: 25%; }
  .p-5-2 { top: 25%; right: 25%; }
  .p-5-3 { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .p-5-4 { bottom: 25%; left: 25%; }
  .p-5-5 { bottom: 25%; right: 25%; }
  .p-6-1 { top: 20%; left: 25%; }
  .p-6-2 { top: 20%; right: 25%; }
  .p-6-3 { top: 50%; left: 25%; transform: translateY(-50%); }
  .p-6-4 { top: 50%; right: 25%; transform: translateY(-50%); }
  .p-6-5 { bottom: 20%; left: 25%; }
  .p-6-6 { bottom: 20%; right: 25%; }

  /* --- Hand Interactions --- */
  .hand-tile {
    cursor: pointer;
    margin-bottom: 0;
  }
  
  .hand-tile:hover {
    transform: translateY(-15px) scale(1.05);
    z-index: 10;
    box-shadow: 
      2px 10px 15px rgba(0,0,0,0.5),
      2px 4px 0px var(--ivory-side), 
      4px 6px 0px var(--ivory-shadow);
  }

  /* Playable Indicator */
  .hand-tile.playable {
    box-shadow: 
      0 0 0 2px var(--gold), /* Glow ring */
      2px 4px 6px rgba(0,0,0,0.4),
      2px 2px 0px var(--ivory-side), 
      4px 4px 0px var(--ivory-shadow);
  }
  
  .hand-tile.playable:hover {
    box-shadow: 
      0 0 0 2px var(--gold),
      2px 10px 15px rgba(0,0,0,0.5),
      2px 4px 0px var(--ivory-side), 
      4px 6px 0px var(--ivory-shadow);
  }

  /* --- Board Chain Specifics --- */
  .board-tile {
    /* Smaller scale for board view */
    width: 40px; 
    height: 72px;
    box-shadow: 
      1px 2px 3px rgba(0,0,0,0.4),
      1px 1px 0px var(--ivory-side),
      2px 2px 0px var(--ivory-shadow);
  }
  
  .board-tile .pip {
    width: 4px;
    height: 4px;
  }

  /* Glow Indicator */
  .glow-indicator {
    animation: pulse-glow 2s infinite ease-in-out;
  }
  
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 0.8; transform: scale(1.1); }
  }

</style>
</head>
<body>

<div id="game-container">
  <div class="rim"></div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="top-bar">
      <div class="brand">Play with Tiles</div>
      
      <div class="scores">
        <div class="score-pill active">
          <div class="label">Your Score</div>
          <div class="val">42</div>
        </div>
        <div class="score-pill">
          <div class="label">Opponent</div>
          <div class="val">35</div>
        </div>
      </div>

      <div class="match-panel">
        <div class="match-val">
          <span>Left End</span>
          <div class="val-badge">5</div>
        </div>
        <div class="match-val">
          <span>Right End</span>
          <div class="val-badge">3</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Draw Pile -->
  <div class="draw-pile-container" id="draw-pile">
    <svg width="46" height="70" viewBox="0 0 46 70">
      <!-- Stack layers -->
      <rect x="2" y="4" width="40" height="64" rx="4" fill="#2e1e15" stroke="#1a1008" stroke-width="1" filter="url(#drawShadow)"/>
      <rect x="1" y="2" width="40" height="64" rx="4" fill="#3a2518" stroke="#2e1e15" stroke-width="1" filter="url(#drawShadow)"/>
      <rect x="0" y="0" width="40" height="64" rx="4" fill="#4a2e18" stroke="#5c3a21" stroke-width="1"/>
      <!-- Texture on top card -->
      <rect x="4" y="4" width="32" height="56" rx="2" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </svg>
    <div class="pile-label">Draw Pile</div>
    <div class="pile-count">12</div>
  </div>

  <!-- Main Board SVG -->
  <svg id="board-svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="drawShadow">
        <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
      </filter>
      <filter id="glowFilter">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
    <!-- The Chain Group -->
    <g id="chain-group"></g>
    
    <!-- End Point Markers (Injected via JS) -->
    <g id="markers-group"></g>
  </svg>

  <!-- Player Hand Rack -->
  <div class="hand-rack" id="hand-rack">
    <!-- Tiles injected via JS -->
  </div>
</div>

<script>
/**
 * Helper to generate pip HTML structure based on number
 */
function getPipHTML(n) {
  const pips = [];
  const classes = {
    1: ['p-1'],
    2: ['p-2-1', 'p-2-2'],
    3: ['p-3-1', 'p-3-2', 'p-3-3'],
    4: ['p-4-1', 'p-4-2', 'p-4-3', 'p-4-4'],
    5: ['p-5-1', 'p-5-2', 'p-5-3', 'p-5-4', 'p-5-5'],
    6: ['p-6-1', 'p-6-2', 'p-6-3', 'p-6-4', 'p-6-5', 'p-6-6']
  };
  
  if (n === 0) return '';
  
  return classes[n].map(c => `<div class="pip ${c}"></div>`).join('');
}

/**
 * Create a Tile DOM Element
 * @param {number} top - Top half value
 * @param {number} bottom - Bottom half value
 * @param {boolean} isHand - Whether it's in the hand (affects size class)
 * @param {boolean} playable - Is it a valid move?
 */
function createTile(top, bottom, isHand = true, playable = false) {
  const div = document.createElement('div');
  div.className = `tile ${isHand ? 'hand-tile' : 'board-tile'} ${playable ? 'playable' : ''}`;
  
  // Construct Inner HTML
  div.innerHTML = `
    <div class="tile-inner">
      <div class="tile-half">${getPipHTML(top)}</div>
      <div class="tile-divider"></div>
      <div class="tile-half">${getPipHTML(bottom)}</div>
    </div>
  `;
  return div;
}

/**
 * Game Logic & Rendering
 */
document.addEventListener('DOMContentLoaded', () => {
  
  // --- Data ---
  // A simulated chain of dominoes. 
  // x, y are coordinates on the SVG grid. angle is rotation.
  const chainData = [
    { t: 6, b: 2, x: 150, y: 300, r: 0 },
    { t: 2, b: 5, x: 220, y: 300, r: 0 },
    { t: 5, b: 3, x: 290, y: 300, r: 0 },
    { t: 3, b: 4, x: 360, y: 300, r: 0 },
    { t: 4, b: 1, x: 430, y: 300, r: 0 },
    { t: 1, b: 6, x: 500, y: 300, r: 0 },
    { t: 6, b: 3, x: 570, y: 300, r: 0 },
    { t: 3, b: 3, x: 640, y: 300, r: 0 },
  ];

  const handData = [
    { t: 5, b: 1, playable: true },
    { t: 3, b: 6, playable: true },
    { t: 2, b: 4, playable: false },
    { t: 5, b: 5, playable: true },
    { t: 1, b: 3, playable: true },
    { t: 4, b: 4, playable: false },
    { t: 2, b: 2, playable: false },
  ];

  // --- Render Board Chain ---
  const chainGroup = document.getElementById('chain-group');
  
  chainData.forEach(tile => {
    const el = createTile(tile.t, tile.b, false);
    // Wrap in SVG foreignObject
    const fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
    fo.setAttribute("x", tile.x - 20); // Center offset (width/2)
    fo.setAttribute("y", tile.y - 36); // Center offset (height/2)
    fo.setAttribute("width", 40);
    fo.setAttribute("height", 72);
    
    // Rotation transform
    fo.setAttribute("transform", `rotate(${tile.r}, ${tile.x}, ${tile.y})`);
    
    fo.appendChild(el);
    chainGroup.appendChild(fo);
  });

  // --- Render End Markers (Integrated Glow) ---
  const markersGroup = document.getElementById('markers-group');
  
  // Left Marker
  const leftMarker = document.createElementNS("http://www.w3.org/2000/svg", "g");
  leftMarker.setAttribute("transform", "translate(110, 300)");
  leftMarker.innerHTML = `
    <circle cx="0" cy="0" r="24" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="6,4" class="glow-indicator" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="16" fill="rgba(212, 175, 55, 0.1)" class="glow-indicator"/>
  `;
  markersGroup.appendChild(leftMarker);

  // Right Marker
  const rightMarker = document.createElementNS("http://www.w3.org/2000/svg", "g");
  rightMarker.setAttribute("transform", "translate(680, 300)");
  rightMarker.innerHTML = `
    <circle cx="0" cy="0" r="24" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="6,4" class="glow-indicator" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="16" fill="rgba(212, 175, 55, 0.1)" class="glow-indicator"/>
  `;
  markersGroup.appendChild(rightMarker);

  // --- Render Hand ---
  const handRack = document.getElementById('hand-rack');
  
  handData.forEach((tile, index) => {
    const el = createTile(tile.t, tile.b, true, tile.playable);
    
    // Add simple click feedback
    el.addEventListener('click', () => {
      if (tile.playable) {
        el.style.transform = 'translateY(-20px) scale(0.95)';
        el.style.opacity = '0.7';
        setTimeout(() => {
          el.style.transform = '';
          el.style.opacity = '1';
        }, 150);
      }
    });

    handRack.appendChild(el);
  });

  // --- Draw Pile Interaction ---
  const drawPile = document.getElementById('draw-pile');
  drawPile.addEventListener('click', () => {
    drawPile.style.transform = 'scale(0.95) translateY(2px)';
    setTimeout(() => {
      drawPile.style.transform = '';
    }, 150);
  });

});
</script>
</body>
</html>
