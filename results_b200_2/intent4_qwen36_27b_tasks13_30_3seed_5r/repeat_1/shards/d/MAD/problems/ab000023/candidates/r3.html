<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Product Scene</title>
    <style>
        :root {
            /* Environment Colors */
            --bg-wall: #F4F4F6;
            --bg-floor: #E3E3E8;
            --bg-shadow: #D1D1D6;
            
            /* Product Colors */
            --sign-front: #FFFFFF;
            --sign-side: #E0E0E5;
            --sign-bottom: #B0B0B8;
            
            /* Hardware Colors */
            --metal-base: #2A2A2E;
            --metal-top: #5C5C60;
            --metal-shine: #7A7A80;
            
            /* Brand Colors */
            --brand-red-light: #FF4D4D;
            --brand-red-dark: #CC0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Environment Setup --- */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, var(--bg-wall) 100%);
        }

        /* The Horizon Line */
        .horizon {
            position: absolute;
            top: 55%; 
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.05);
            z-index: 1;
        }

        /* The Floor Plane */
        .floor {
            position: absolute;
            top: 55%;
            left: -50%;
            width: 200%;
            height: 50%;
            background: linear-gradient(to bottom, var(--bg-floor), var(--bg-shadow));
            transform-origin: top center;
            transform: rotateX(60deg);
            z-index: 2;
            pointer-events: none;
        }

        /* --- The Product Assembly --- */
        /* We use CSS 3D Transforms to construct the isometric view */
        .assembly-wrapper {
            position: relative;
            width: 300px;
            height: 450px;
            z-index: 10;
            transform-style: preserve-3d;
            /* Base Isometric Orientation */
            transform: rotateX(20deg) rotateY(-35deg);
            transition: transform 0.1s ease-out;
        }

        /* --- Mounting Hardware (Stand) --- */
        .stand {
            position: absolute;
            transform-style: preserve-3d;
            /* Center the stand at the bottom of the sign */
            top: 380px; 
            left: 50%;
            margin-left: -25px;
        }

        /* Vertical Pillar */
        .pillar {
            position: absolute;
            width: 10px;
            height: 100px;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
        }
        
        .pillar-face {
            position: absolute;
            width: 10px;
            height: 100px;
            background: linear-gradient(to right, var(--metal-top), var(--metal-base));
        }
        .pillar-front { transform: translateZ(5px); }
        .pillar-right { transform: rotateY(90deg) translateZ(5px); background: var(--metal-base); }

        /* Base Plate */
        .base-plate {
            position: absolute;
            width: 100px;
            height: 60px;
            bottom: 0;
            left: -45px;
            transform-style: preserve-3d;
        }

        .plate-top {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--metal-shine);
            border-radius: 4px;
            transform: translateZ(8px);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .plate-side {
            position: absolute;
            width: 100%;
            height: 8px;
            background: var(--metal-base);
            bottom: 0;
            border-radius: 0 0 4px 4px;
        }
        .plate-front { transform: rotateX(-90deg) translateZ(52px) translateY(4px); }
        .plate-right { transform: rotateY(90deg) rotateX(-90deg) translateZ(50px) translateY(4px) translateX(-50px); }

        /* --- The Sign Object (3D Construction) --- */
        .sign-block {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 450px;
            transform-style: preserve-3d;
        }

        /* 1. Front Face */
        .face-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--sign-front);
            transform: translateZ(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            /* Subtle noise texture via CSS */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* 2. Side Extrusion (Right) */
        .face-side {
            position: absolute;
            width: 30px; /* Thickness */
            height: 100%;
            right: 0;
            top: 0;
            background: var(--sign-side);
            transform-origin: left center;
            transform: rotateY(90deg);
        }

        /* 3. Bottom Extrusion */
        .face-bottom {
            position: absolute;
            width: 100%;
            height: 30px; /* Thickness */
            bottom: 0;
            left: 0;
            background: var(--sign-bottom);
            transform-origin: top center;
            transform: rotateX(-90deg);
        }

        /* --- The Emblem --- */
        .emblem-container {
            width: 160px;
            height: 160px;
            /* Slight bevel effect on the emblem */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        /* --- Grounding Shadow --- */
        .contact-shadow {
            position: absolute;
            width: 300px;
            height: 300px;
            top: 450px; /* Aligned with bottom of sign */
            left: 0;
            transform: rotateX(90deg) translateZ(10px); /* Lay flat on floor */
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            filter: blur(8px);
        }
        
        /* Shadow of the stand specifically */
        .stand-shadow {
            position: absolute;
            width: 120px;
            height: 80px;
            bottom: -10px; /* relative to wrapper */
            left: 90px;
            transform: rotateX(90deg) translateZ(10px);
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, transparent 70%);
            filter: blur(4px);
            z-index: -1;
        }

    </style>
</head>
<body>

    <div class="scene-container" id="sceneContainer">
        
        <!-- Wall/Floor Divider -->
        <div class="horizon"></div>
        
        <!-- Floor Plane -->
        <div class="floor"></div>

        <!-- The Product Assembly -->
        <div class="assembly-wrapper" id="assembly">
            
            <!-- Grounding Shadows (Attached to wrapper to move with perspective) -->
            <div class="contact-shadow"></div>
            <div class="stand-shadow"></div>

            <!-- The Sign Block -->
            <div class="sign-block">
                <!-- Front Face -->
                <div class="face-front">
                    <div class="emblem-container">
                        <svg viewBox="0 0 200 200" width="100%" height="100%">
                            <defs>
                                <!-- Glossy Acrylic Gradient -->
                                <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="var(--brand-red-light)" />
                                    <stop offset="100%" stop-color="var(--brand-red-dark)" />
                                </linearGradient>
                                
                                <!-- Gloss Highlight -->
                                <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
                                    <stop offset="50%" stop-color="rgba(255,255,255,0)" />
                                    <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
                                </linearGradient>
                            </defs>

                            <!-- Main Red Circle -->
                            <circle cx="100" cy="100" r="85" fill="url(#redGradient)" />
                            
                            <!-- Gloss Overlay for physical feel -->
                            <circle cx="100" cy="100" r="85" fill="url(#glossHighlight)" />
                            
                            <!-- Inner rim light -->
                            <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

                            <!-- Play Button Triangle -->
                            <!-- Geometrically Centered: Center of 200x200 is 100,100. 
                                 Triangle centroid calculation for visual balance. -->
                            <path d="M 82 68 L 142 100 L 82 132 Z" fill="#FFFFFF" stroke="#FFF" stroke-width="1" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <!-- Right Side Face (Thickness) -->
                <div class="face-side"></div>

                <!-- Bottom Face (Thickness) -->
                <div class="face-bottom"></div>
            </div>

            <!-- Mounting Hardware -->
            <div class="stand">
                <!-- Vertical Pillar -->
                <div class="pillar">
                    <div class="pillar-face pillar-front"></div>
                    <div class="pillar-face pillar-right"></div>
                </div>
                
                <!-- Base Plate -->
                <div class="base-plate">
                    <div class="plate-top"></div>
                    <div class="plate-side plate-front"></div>
                    <div class="plate-side plate-right"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Interaction Logic to enhance the 3D feel
        const assembly = document.getElementById('assembly');
        const scene = document.getElementById('sceneContainer');

        // Base rotation values (Isometric-ish)
        const baseRotX = 20;
        const baseRotY = -35;
        
        let targetRotX = baseRotX;
        let targetRotY = baseRotY;
        let currentRotX = baseRotX;
        let currentRotY = baseRotY;

        scene.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;
            
            // Calculate percentage from center (-1 to 1)
            const xPct = (clientX / innerWidth - 0.5) * 2;
            const yPct = (clientY / innerHeight - 0.5) * 2;

            // Define interaction range (degrees)
            const range = 15;

            // Target rotations
            targetRotY = baseRotY + (xPct * range); 
            targetRotX = baseRotX + (yPct * -range); // Invert Y for natural feel
        });

        // Smooth Animation Loop
        function animate() {
            // Linear interpolation (Lerp) for smooth movement
            const ease = 0.05;
            
            currentRotX += (targetRotX - currentRotX) * ease;
            currentRotY += (targetRotY - currentRotY) * ease;

            assembly.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
            
            requestAnimationFrame(animate);
        }

        animate();

        scene.addEventListener('mouseleave', () => {
            targetRotX = baseRotX;
            targetRotY = baseRotY;
        });
    </script>
</body>
</html>
