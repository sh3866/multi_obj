<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product Scene</title>
    <style>
        :root {
            /* Environment Colors */
            --wall-top: #F2F2F2;
            --wall-bottom: #E0E0E0;
            --floor-top: #D8D8D8;
            --floor-bottom: #C5C5C5;
            --horizon-color: #CFCFCF;
            
            /* Product Colors */
            --sign-face-top: #FFFFFF;
            --sign-face-bottom: #F4F4F4;
            --sign-edge-top: #E8E8E8;
            --sign-edge-side: #D0D0D0;
            
            /* Brand & Hardware */
            --brand-red: #E62B2B;
            --metal-dark: #3A3A3A;
            --metal-light: #7A7A7A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--wall-top);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            perspective: 1200px; /* Deep perspective */
        }

        /* --- Environment Setup --- */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Studio Vignette */
            background: radial-gradient(circle at 50% 30%, #FFFFFF 0%, var(--wall-top) 50%, var(--wall-bottom) 100%);
        }

        /* The Horizon Line */
        .horizon {
            position: absolute;
            top: 65%; /* Sign sits mostly on wall, feet on floor */
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--horizon-color);
            box-shadow: 0 1px 0 rgba(255,255,255,0.5);
            z-index: 1;
        }

        /* The Floor Plane */
        .floor {
            position: absolute;
            top: 65%;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to bottom, var(--floor-top), var(--floor-bottom));
            transform-origin: top center;
            transform: perspective(600px) rotateX(45deg) scale(1.5);
            z-index: 2;
            pointer-events: none;
        }

        /* --- The Sign Assembly --- */
        .sign-assembly {
            position: relative;
            width: 320px;
            height: 480px;
            z-index: 10;
            /* Idle State: Slight tilt */
            transform: rotateX(0deg) rotateY(0deg) translateY(0px);
            transition: transform 0.1s ease-out;
        }

        /* --- Hardware (Brackets) --- */
        /* Positioned behind the sign */
        .bracket {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateZ(-10px); /* Slightly behind sign face */
            width: 140px;
            height: 12px;
            z-index: 1;
        }

        .bracket-top { top: 40px; }
        .bracket-bottom { bottom: 40px; }

        .bracket-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--metal-light) 0%, var(--metal-dark) 100%);
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
        }

        /* Screws */
        .screw {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: radial-gradient(circle at 30% 30%, #999, #222);
            border-radius: 50%;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        
        .screw::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 1px;
            background: #000;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .screw-l { left: 10px; }
        .screw-r { right: 10px; }

        /* Shadow of bracket onto the wall/sign */
        .bracket-shadow {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.15);
            filter: blur(4px);
            z-index: -1;
            border-radius: 2px;
        }

        /* --- The Sign Object (3D Construction) --- */
        
        /* 1. Side Extrusion (Thickness) */
        /* This creates the physical depth. We translate it Z-backwards. */
        .sign-extrusion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            /* Gradient simulates light hitting the top edge, shadow on the side */
            background: linear-gradient(to bottom, var(--sign-edge-top), var(--sign-edge-side));
            transform: translateZ(-15px); /* 15px depth */
            z-index: 0;
            box-shadow: 
                /* Ambient shadow cast on the wall behind it */
                0 20px 50px rgba(0,0,0,0.15),
                /* Inner shadow to define the front edge */
                inset 0 0 20px rgba(0,0,0,0.05);
        }

        /* 2. Front Face */
        .sign-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            /* Subtle volume gradient: Lighter top-left, darker bottom-right */
            background: linear-gradient(135deg, var(--sign-face-top) 0%, var(--sign-face-bottom) 100%);
            /* Crisp edge definition */
            border: 1px solid rgba(255,255,255,0.9); 
            /* Slight inner shadow for glass/plastic feel */
            box-shadow: inset 0 0 30px rgba(0,0,0,0.02);
            
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transform: translateZ(0);
            overflow: hidden;
        }

        /* --- The Emblem --- */
        .emblem-container {
            width: 160px;
            height: 160px;
            position: relative;
        }

        svg.emblem {
            width: 100%;
            height: 100%;
            overflow: visible;
            /* Filter for the emblem's own drop shadow on the sign face */
            filter: drop-shadow(0 10px 15px rgba(200, 0, 0, 0.25));
        }

        /* --- Grounding Shadow --- */
        /* Cast onto the floor */
        .floor-shadow {
            position: absolute;
            top: 65%; /* Aligned with horizon */
            left: 50%;
            transform: translateX(-50%) perspective(500px) rotateX(60deg) scale(1.2, 0.6);
            width: 300px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, transparent 70%);
            z-index: 3;
            pointer-events: none;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div class="scene-container" id="sceneContainer">
        
        <!-- Wall/Floor Divider -->
        <div class="horizon"></div>
        
        <!-- Floor Plane -->
        <div class="floor"></div>

        <!-- Grounding Shadow (Static base, moves slightly with JS) -->
        <div class="floor-shadow" id="floorShadow"></div>

        <!-- The Product Assembly -->
        <div class="sign-assembly" id="signAssembly">
            
            <!-- Hardware: Top Bracket -->
            <div class="bracket bracket-top">
                <div class="bracket-shadow"></div>
                <div class="bracket-body">
                    <div class="screw screw-l"></div>
                    <div class="screw screw-r"></div>
                </div>
            </div>

            <!-- Hardware: Bottom Bracket -->
            <div class="bracket bracket-bottom">
                <div class="bracket-shadow"></div>
                <div class="bracket-body">
                    <div class="screw screw-l"></div>
                    <div class="screw screw-r"></div>
                </div>
            </div>

            <!-- Sign 3D Body -->
            
            <!-- Side Extrusion (Thickness) -->
            <div class="sign-extrusion"></div>

            <!-- Front Face -->
            <div class="sign-face">
                <div class="emblem-container">
                    <svg class="emblem" viewBox="0 0 200 200">
                        <defs>
                            <!-- Crisp Red Gradient -->
                            <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF3B3B;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
                            </linearGradient>
                        </defs>

                        <!-- Main Red Circle -->
                        <circle cx="100" cy="100" r="85" fill="url(#redGrad)" />
                        
                        <!-- Subtle inner stroke for definition -->
                        <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

                        <!-- Play Button Triangle -->
                        <!-- Centered geometrically -->
                        <path class="play-triangle" d="M 85 65 L 145 100 L 85 135 Z" fill="#FFFFFF" stroke="#FFF" stroke-width="1" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Interaction Logic
        const assembly = document.getElementById('signAssembly');
        const shadow = document.getElementById('floorShadow');
        const scene = document.getElementById('sceneContainer');

        scene.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;
            
            // Calculate percentage from center (-1 to 1)
            const xPct = (clientX / innerWidth - 0.5) * 2;
            const yPct = (clientY / innerHeight - 0.5) * 2;

            // 1. Rotate the Sign
            // Max rotation 10deg
            const rotateY = xPct * 10; 
            const rotateX = -yPct * 10;

            assembly.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 2. Move the Floor Shadow opposite to the sign to simulate light source logic
            // If sign tilts right, shadow moves slightly left/behind
            const shadowX = -xPct * 20; 
            const shadowY = yPct * 10;

            // Apply shadow transform (perspective is handled in CSS, we just translate)
            shadow.style.transform = `translateX(calc(-50% + ${shadowX}px)) perspective(500px) rotateX(60deg) scale(1.2, 0.6)`;
        });

        scene.addEventListener('mouseleave', () => {
            // Reset to center
            assembly.style.transform = `rotateX(0deg) rotateY(0deg)`;
            shadow.style.transform = `translateX(-50%) perspective(500px) rotateX(60deg) scale(1.2, 0.6)`;
        });
    </script>
</body>
</html>
