<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Scene: Video Emblem</title>
    <style>
        :root {
            /* Environment & Lighting */
            --bg-top: #FFFFFF;
            --bg-bottom: #D8DBDF;
            --shadow-color: rgba(30, 30, 30, 0.25);
            
            /* Sign Materials */
            --sign-face-top: #FFFFFF;
            --sign-face-bottom: #F2F2F4; /* Very subtle off-white for volume */
            --sign-edge-right: #B8B8B8;
            --sign-edge-bottom: #909090;
            
            /* Hardware (Chrome/Metal) */
            --metal-light: #F5F5F5;
            --metal-mid: #888888;
            --metal-dark: #444444;
            --metal-shadow: #1a1a1a;
            
            /* Brand (Signal Red) */
            --brand-red-start: #FF3333; /* Highlight */
            --brand-red-mid: #E62117;   /* Core Brand Color */
            --brand-red-end: #A60000;   /* Shadow */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 30%, var(--bg-top) 0%, var(--bg-bottom) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            perspective: 1200px;
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Floor Plane */
        .floor {
            position: absolute;
            top: 60%;
            left: -50%;
            width: 200%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.4) 20%, rgba(0,0,0,0.05) 100%);
            transform: rotateX(75deg);
            transform-origin: top center;
            pointer-events: none;
            z-index: 0;
        }

        /* --- The Main Assembly (Sign + Stand) --- */
        .assembly {
            position: relative;
            width: 600px;
            height: 400px;
            transform-style: preserve-3d;
            /* Initial View: Slight isometric tilt */
            transform: rotateX(15deg) rotateY(-25deg);
            transition: transform 0.1s linear;
        }

        /* --- The Sign --- */
        .sign {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 400px;
            transform-style: preserve-3d;
        }

        /* Front Face */
        .face-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--sign-face-top);
            border-radius: 16px;
            transform: translateZ(25px); /* Thickness */
            
            /* Surface Gradient for subtle volume */
            background: linear-gradient(135deg, #FFFFFF 0%, var(--sign-face-bottom) 100%);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Edge definition */
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Right Extrusion (Side) */
        .face-side {
            position: absolute;
            width: 50px; /* Extrusion depth */
            height: 100%;
            right: 0;
            top: 0;
            background: linear-gradient(to bottom, var(--sign-edge-right), var(--sign-edge-bottom));
            transform-origin: left center;
            transform: rotateY(90deg);
            border-radius: 0 8px 8px 0;
        }

        /* Bottom Extrusion */
        .face-bottom {
            position: absolute;
            width: 100%;
            height: 50px;
            bottom: 0;
            left: 0;
            background: linear-gradient(to right, var(--sign-edge-bottom), var(--sign-edge-right));
            transform-origin: top center;
            transform: rotateX(-90deg);
            border-radius: 0 0 8px 8px;
        }

        /* --- The Emblem (SVG) --- */
        .emblem-wrapper {
            width: 240px;
            height: 240px;
            /* Shadow for depth on the sign face */
            filter: drop-shadow(0px 12px 12px rgba(0,0,0,0.15));
            transform: translateZ(2px);
        }

        /* --- The Stand (Hardware) --- */
        /* Centered below sign */
        .stand {
            position: absolute;
            top: 400px;
            left: 50%;
            transform-style: preserve-3d;
            transform: translateX(-50%) translateZ(25px); /* Align with sign face Z */
        }

        /* Vertical Pillar */
        .pillar {
            position: absolute;
            width: 20px;
            height: 100px;
            top: -100px;
            left: -10px;
            transform-style: preserve-3d;
        }

        .pillar-face {
            position: absolute;
            width: 20px;
            height: 100px;
            background: linear-gradient(to right, var(--metal-mid), var(--metal-light), var(--metal-mid));
            border-radius: 2px;
        }
        .pillar-front { transform: translateZ(10px); }
        .pillar-right { 
            transform: rotateY(90deg) translateZ(10px); 
            background: linear-gradient(to right, var(--metal-dark), var(--metal-mid));
        }

        /* Base Plate (Oval/Footprint) */
        .base {
            position: absolute;
            top: -10px;
            left: -80px;
            width: 160px;
            height: 60px;
            transform-style: preserve-3d;
        }

        .base-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--metal-light), var(--metal-mid));
            border-radius: 50%; /* Oval shape */
            transform: translateZ(10px);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }
        
        /* Base Thickness (Bottom) */
        .base-bottom {
            position: absolute;
            width: 100%;
            height: 10px;
            bottom: 0;
            left: 0;
            background: var(--metal-shadow);
            transform-origin: top center;
            transform: rotateX(-90deg);
            border-radius: 50%;
        }

        /* --- Shadows --- */
        
        /* Contact Shadow: Sign meeting the pole */
        .shadow-contact-sign {
            position: absolute;
            width: 60px;
            height: 15px;
            top: 400px;
            left: 50%;
            transform: translateX(-50%) rotateX(90deg) translateZ(25px);
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, transparent 80%);
            z-index: 1;
            pointer-events: none;
        }

        /* Contact Shadow: Pole meeting the base */
        .shadow-contact-base {
            position: absolute;
            width: 40px;
            height: 20px;
            top: -100px; /* Top of the stand div (which is the pole bottom) */
            left: -20px;
            transform: rotateX(90deg) translateZ(10px);
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Floor Shadow: Sign */
        .shadow-floor-sign {
            position: absolute;
            width: 600px;
            height: 400px;
            top: 400px;
            left: 0;
            transform: rotateX(90deg) translateZ(10px) translateX(80px) translateY(50px);
            background: radial-gradient(ellipse at center, var(--shadow-color) 0%, transparent 60%);
            filter: blur(20px);
            pointer-events: none;
            z-index: -1;
        }

        /* Floor Shadow: Base */
        .shadow-floor-base {
            position: absolute;
            width: 180px;
            height: 100px;
            top: 0;
            left: -90px;
            transform: rotateX(90deg) translateZ(10px) translateX(30px) translateY(20px);
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, transparent 70%);
            filter: blur(10px);
            pointer-events: none;
            z-index: -1;
        }

    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="floor"></div>

        <div class="assembly" id="assembly">
            
            <!-- Shadows -->
            <div class="shadow-floor-sign"></div>
            <div class="shadow-contact-sign"></div>
            <div class="stand">
                <div class="shadow-contact-base"></div>
                <div class="shadow-floor-base"></div>
            </div>

            <!-- The Sign -->
            <div class="sign">
                <!-- Front Face -->
                <div class="face-front">
                    <div class="emblem-wrapper">
                        <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <!-- High Saturation Signal Red Gradient -->
                                <linearGradient id="redGrad" x1="10%" y1="0%" x2="90%" y2="100%">
                                    <stop offset="0%" stop-color="var(--brand-red-start)" />
                                    <stop offset="50%" stop-color="var(--brand-red-mid)" />
                                    <stop offset="100%" stop-color="var(--brand-red-end)" />
                                </linearGradient>
                                
                                <!-- Inner Bevel Filter for 3D button look -->
                                <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
                                    <!-- Drop Shadow -->
                                    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
                                    <feOffset dx="1" dy="3" result="offsetBlur"/>
                                    <feFlood flood-color="rgba(0,0,0,0.3)" result="shadowColor"/>
                                    <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
                                    
                                    <!-- Inner Shadow (Bottom Right) -->
                                    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur2"/>
                                    <feOffset dx="2" dy="2" in="blur2" result="highlightOffset"/>
                                    <feComposite in="SourceAlpha" in2="highlightOffset" operator="out" result="inverse"/>
                                    <feFlood flood-color="rgba(0,0,0,0.25)" result="shadow"/>
                                    <feComposite in="shadow" in2="inverse" operator="in" result="innerShadow"/>
                                    
                                    <!-- Inner Highlight (Top Left) -->
                                    <feOffset dx="-2" dy="-2" in="blur2" result="hlOffset"/>
                                    <feComposite in="SourceAlpha" in2="hlOffset" operator="out" result="inverseHl"/>
                                    <feFlood flood-color="rgba(255,255,255,0.5)" result="hlColor"/>
                                    <feComposite in="hlColor" in2="inverseHl" operator="in" result="innerHighlight"/>

                                    <feMerge>
                                        <feMergeNode in="shadow"/>
                                        <feMergeNode in="SourceGraphic"/>
                                        <feMergeNode in="innerShadow"/>
                                        <feMergeNode in="innerHighlight"/>
                                    </feMerge>
                                </filter>
                            </defs>

                            <!-- Main Red Button -->
                            <circle cx="100" cy="100" r="85" fill="url(#redGrad)" filter="url(#bevel)" />
                            
                            <!-- Geometric Play Icon -->
                            <!-- Slightly offset to center visually -->
                            <path d="M 88 62 L 148 100 L 88 138 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <!-- Side Extrusion -->
                <div class="face-side"></div>

                <!-- Bottom Extrusion -->
                <div class="face-bottom"></div>
            </div>

            <!-- The Stand -->
            <div class="stand">
                <!-- Pillar -->
                <div class="pillar">
                    <div class="pillar-face pillar-front"></div>
                    <div class="pillar-face pillar-right"></div>
                </div>
                
                <!-- Base Plate -->
                <div class="base">
                    <div class="base-face"></div>
                    <div class="base-bottom"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Interactive Parallax Effect
        const scene = document.getElementById('scene');
        const assembly = document.getElementById('assembly');

        // Configuration
        const baseRotX = 15;
        const baseRotY = -25;
        const maxRot = 12; // Reduced slightly for more subtle, premium feel

        let targetRotX = baseRotX;
        let targetRotY = baseRotY;
        let currentRotX = baseRotX;
        let currentRotY = baseRotY;

        // Event Listener for Mouse Movement
        document.addEventListener('mousemove', (e) => {
            const { innerWidth, innerHeight } = window;
            
            // Calculate mouse position relative to center (-1 to 1)
            const xPct = (e.clientX / innerWidth - 0.5) * 2;
            const yPct = (e.clientY / innerHeight - 0.5) * 2;

            // Update target rotation
            targetRotY = baseRotY + (xPct * maxRot);
            targetRotX = baseRotX + (yPct * -maxRot); 
        });

        // Animation Loop (Lerp for smoothness)
        function animate() {
            const ease = 0.08; 

            // Linear Interpolation
            currentRotX += (targetRotX - currentRotX) * ease;
            currentRotY += (targetRotY - currentRotY) * ease;

            assembly.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
