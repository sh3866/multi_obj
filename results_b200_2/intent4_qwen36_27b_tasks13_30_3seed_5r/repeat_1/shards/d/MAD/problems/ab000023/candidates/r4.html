<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Scene: Video Emblem</title>
    <style>
        :root {
            /* Lighting & Environment */
            --bg-top: #F9F9FB;
            --bg-bottom: #DADCE0;
            --shadow-color: rgba(20, 20, 25, 0.25);
            
            /* Sign Material (Matte White) */
            --sign-face: #FFFFFF;
            --sign-edge: #E8E8EC;
            --sign-bottom: #D1D1D6;
            
            /* Hardware (Polished Metal) */
            --metal-light: #F0F0F0;
            --metal-mid: #A0A0A5;
            --metal-dark: #555558;
            --metal-shadow: #222225;
            
            /* Brand (Vibrant Red) */
            --brand-red-start: #FF2A2A;
            --brand-red-end: #CC0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 30%, var(--bg-top) 0%, var(--bg-bottom) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            perspective: 1500px; /* Deep perspective for realism */
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Floor Plane - Infinite illusion */
        .floor {
            position: absolute;
            top: 60%;
            left: -50%;
            width: 200%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.1) 20%, rgba(0,0,0,0.02) 100%);
            transform: rotateX(75deg);
            transform-origin: top center;
            pointer-events: none;
            z-index: 0;
        }

        /* --- The Main Assembly (Sign + Stand) --- */
        .assembly {
            position: relative;
            width: 600px; /* Scaled up 2x */
            height: 400px;
            transform-style: preserve-3d;
            /* Initial Isometric View */
            transform: rotateX(15deg) rotateY(-25deg);
            transition: transform 0.1s linear; /* Smoothed by JS */
        }

        /* --- The Sign --- */
        .sign {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 400px;
            transform-style: preserve-3d;
        }

        /* Front Face */
        .face-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--sign-face);
            border-radius: 12px;
            transform: translateZ(20px); /* 20px thickness */
            
            /* Matte Finish Simulation */
            background: linear-gradient(135deg, #FFFFFF 0%, #F7F7F9 100%);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Side Face (Right) */
        .face-side {
            position: absolute;
            width: 40px; /* Extrusion depth */
            height: 100%;
            right: 0;
            top: 0;
            background: var(--sign-edge);
            transform-origin: left center;
            transform: rotateY(90deg);
            border-radius: 0 4px 4px 0;
        }

        /* Bottom Face */
        .face-bottom {
            position: absolute;
            width: 100%;
            height: 40px;
            bottom: 0;
            left: 0;
            background: var(--sign-bottom);
            transform-origin: top center;
            transform: rotateX(-90deg);
            border-radius: 0 0 4px 4px;
        }

        /* --- The Emblem (SVG) --- */
        .emblem-wrapper {
            width: 220px;
            height: 220px;
            /* Casts a shadow onto the sign face */
            filter: drop-shadow(0px 15px 15px rgba(0,0,0,0.25));
            transform: translateZ(2px); /* Slightly raised */
        }

        /* --- The Stand (Hardware) --- */
        /* Positioned to connect to the bottom-center of the sign */
        .stand {
            position: absolute;
            top: 400px; /* Align with sign bottom */
            left: 50%;
            transform-style: preserve-3d;
            transform: translateX(-50%) translateZ(20px); /* Offset for sign thickness center */
        }

        /* Vertical Pillar */
        .pillar {
            position: absolute;
            width: 24px;
            height: 120px;
            top: -120px;
            left: -12px; /* Center align */
            transform-style: preserve-3d;
        }

        .pillar-face {
            position: absolute;
            width: 24px;
            height: 120px;
            background: linear-gradient(to right, var(--metal-mid), var(--metal-light), var(--metal-mid));
            border-radius: 4px;
        }
        .pillar-front { transform: translateZ(12px); }
        .pillar-right { 
            transform: rotateY(90deg) translateZ(12px); 
            background: linear-gradient(to right, var(--metal-dark), var(--metal-mid));
        }

        /* Base Plate */
        .base {
            position: absolute;
            top: -10px; /* Slight overlap */
            left: -80px;
            width: 160px;
            height: 80px;
            transform-style: preserve-3d;
        }

        .base-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--metal-light), var(--metal-mid));
            border-radius: 8px;
            transform: translateZ(12px);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Base Thickness (Bottom) */
        .base-bottom {
            position: absolute;
            width: 100%;
            height: 12px;
            bottom: 0;
            left: 0;
            background: var(--metal-shadow);
            transform-origin: top center;
            transform: rotateX(-90deg);
            border-radius: 0 0 8px 8px;
        }

        /* --- Shadows --- */
        /* Shadow of the sign on the floor */
        .shadow-sign {
            position: absolute;
            width: 600px;
            height: 400px;
            top: 400px;
            left: 0;
            transform: rotateX(90deg) translateZ(10px) translateX(60px) translateY(40px);
            background: radial-gradient(ellipse at center, var(--shadow-color) 0%, transparent 70%);
            filter: blur(15px);
            pointer-events: none;
            z-index: -1;
        }

        /* Shadow of the base on the floor */
        .shadow-base {
            position: absolute;
            width: 180px;
            height: 100px;
            top: 0;
            left: -90px;
            transform: rotateX(90deg) translateZ(10px) translateX(20px) translateY(20px);
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, transparent 70%);
            filter: blur(8px);
            pointer-events: none;
            z-index: -1;
        }

    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="floor"></div>

        <div class="assembly" id="assembly">
            
            <!-- Shadows -->
            <div class="shadow-sign"></div>
            <div class="stand">
                <div class="shadow-base"></div>
            </div>

            <!-- The Sign -->
            <div class="sign">
                <!-- Front Face -->
                <div class="face-front">
                    <div class="emblem-wrapper">
                        <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <!-- Red Gradient for 3D feel -->
                                <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="var(--brand-red-start)" />
                                    <stop offset="100%" stop-color="var(--brand-red-end)" />
                                </linearGradient>
                                
                                <!-- Inner Shadow/Bevel Filter -->
                                <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
                                    <feOffset dx="2" dy="4" result="offsetBlur"/>
                                    <feFlood flood-color="rgba(0,0,0,0.3)" result="shadowColor"/>
                                    <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
                                    <!-- Highlight -->
                                    <feOffset dx="-1" dy="-1" in="blur" result="highlightOffset"/>
                                    <feFlood flood-color="rgba(255,255,255,0.4)" result="highlightColor"/>
                                    <feComposite in="highlightColor" in2="highlightOffset" operator="in" result="highlight"/>
                                    <feMerge>
                                        <feMergeNode in="shadow"/>
                                        <feMergeNode in="SourceGraphic"/>
                                        <feMergeNode in="highlight"/>
                                    </feMerge>
                                </filter>
                            </defs>

                            <!-- Main Red Button -->
                            <circle cx="100" cy="100" r="85" fill="url(#redGrad)" filter="url(#bevel)" />
                            
                            <!-- Geometric Play Icon -->
                            <!-- Centered precisely -->
                            <path d="M 85 65 L 145 100 L 85 135 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <!-- Side Extrusion -->
                <div class="face-side"></div>

                <!-- Bottom Extrusion -->
                <div class="face-bottom"></div>
            </div>

            <!-- The Stand -->
            <div class="stand">
                <!-- Pillar -->
                <div class="pillar">
                    <div class="pillar-face pillar-front"></div>
                    <div class="pillar-face pillar-right"></div>
                </div>
                
                <!-- Base Plate -->
                <div class="base">
                    <div class="base-face"></div>
                    <div class="base-bottom"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Interactive Parallax Effect
        const scene = document.getElementById('scene');
        const assembly = document.getElementById('assembly');

        // Configuration
        const baseRotX = 15;
        const baseRotY = -25;
        const maxRot = 15; // Max degrees of movement

        let targetRotX = baseRotX;
        let targetRotY = baseRotY;
        let currentRotX = baseRotX;
        let currentRotY = baseRotY;

        // Event Listener for Mouse Movement
        document.addEventListener('mousemove', (e) => {
            const { innerWidth, innerHeight } = window;
            
            // Calculate mouse position relative to center (-1 to 1)
            const xPct = (e.clientX / innerWidth - 0.5) * 2;
            const yPct = (e.clientY / innerHeight - 0.5) * 2;

            // Update target rotation
            // Note: Rotating Y moves object horizontally, Rotating X moves vertically
            targetRotY = baseRotY + (xPct * maxRot);
            targetRotX = baseRotX + (yPct * -maxRot); // Invert Y for natural tilt
        });

        // Animation Loop (Lerp for smoothness)
        function animate() {
            const ease = 0.08; // Smoothing factor

            // Linear Interpolation
            currentRotX += (targetRotX - currentRotX) * ease;
            currentRotY += (targetRotY - currentRotY) * ease;

            assembly.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
