<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product Scene</title>
    <style>
        :root {
            --wall-top: #EBEBEB;
            --wall-bottom: #DCDCDC;
            --floor-color: #E5E5E5;
            --floor-shadow: #CFCFCF;
            --sign-face: #FFFFFF;
            --sign-edge-top: #F0F0F0;
            --sign-edge-side: #D8D8D8;
            --brand-red: #D91C1C;
            --metal-dark: #2A2A2A;
            --metal-light: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--wall-top);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            perspective: 1000px;
        }

        /* --- Environment --- */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Studio lighting gradient */
            background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, var(--wall-top) 40%, var(--wall-bottom) 100%);
            overflow: hidden;
        }

        /* Vertical line for wall corner/depth */
        .wall-detail {
            position: absolute;
            top: 0;
            left: 15%;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent 85%, rgba(0,0,0,0.05) 100%);
            z-index: 0;
        }
        
        .wall-detail::after {
            content: '';
            position: absolute;
            top: 0;
            left: -1px;
            width: 2px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.03), transparent);
        }

        /* Floor Plane */
        .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%; /* Floor takes up bottom 25% */
            background: linear-gradient(to bottom, var(--wall-bottom), var(--floor-color));
            border-top: 1px solid rgba(0,0,0,0.05);
            transform-origin: bottom center;
            transform: perspective(600px) rotateX(20deg) scale(1.2);
            z-index: 0;
            pointer-events: none;
        }

        /* --- The Sign Assembly --- */
        .sign-assembly {
            position: relative;
            width: 360px;
            height: 460px;
            z-index: 10;
            /* Initial subtle tilt */
            transform: rotateX(2deg) rotateY(-2deg);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.15)); /* Soft global shadow */
        }

        .sign-assembly:hover {
            transform: rotateX(0deg) rotateY(0deg) scale(1.01);
        }

        /* --- Mounting Hardware (Brackets) --- */
        .bracket {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 24px;
            z-index: 1; /* Behind sign */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bracket-top { top: 40px; }
        .bracket-bottom { bottom: 40px; }

        /* The metal bar */
        .bracket-bar {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--metal-light), var(--metal-dark));
            border-radius: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Screws */
        .screw {
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, #666, #111);
            border-radius: 50%;
            position: relative;
            z-index: 2;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .screw::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 2px;
            width: 6px;
            height: 1px;
            background: #000;
            transform: rotate(45deg);
        }
        
        .screw::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 2px;
            width: 6px;
            height: 1px;
            background: #000;
            transform: rotate(-45deg);
        }

        .screw-l { position: absolute; left: 12px; }
        .screw-r { position: absolute; right: 12px; }

        /* Shadow cast by brackets on the wall */
        .bracket-shadow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            filter: blur(4px);
            transform: translateY(12px) scale(1.05);
            z-index: -1;
            opacity: 0.6;
        }

        /* --- The Sign Object (3D) --- */
        
        /* Side Extrusion (Thickness) */
        .sign-extrusion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(to right, #EAEAEA, #D0D0D0); /* Simulating light from left */
            transform: translateZ(-20px); /* 20mm thickness */
            box-shadow: -5px 10px 20px rgba(0,0,0,0.1);
            z-index: 0;
        }

        /* Right Edge Highlight/Shadow for depth */
        .sign-extrusion::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 15px;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.05));
            border-radius: 0 8px 8px 0;
        }

        /* Front Face */
        .sign-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFFFFF 0%, #FAFAFA 100%);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.8); /* Rim light */
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.02), /* Subtle inner depth */
                0 0 0 1px rgba(0,0,0,0.05); /* Crisp edge */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transform: translateZ(0);
        }

        /* --- The Emblem --- */
        .emblem-container {
            width: 180px;
            height: 180px;
            position: relative;
            /* Subtle texture on the plastic surface */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* SVG Styling */
        svg.emblem {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .circle-bg {
            fill: var(--brand-red);
            /* Inner shadow/rim light for tactile feel */
            filter: drop-shadow(0 4px 6px rgba(160, 0, 0, 0.4));
        }
        
        .circle-inner-shadow {
            fill: none;
            stroke: rgba(0,0,0,0.15);
            stroke-width: 2px;
        }

        .circle-rim {
            fill: none;
            stroke: rgba(255,255,255,0.2);
            stroke-width: 2px;
        }

        .play-triangle {
            fill: #FFFFFF;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
        }

        /* --- Contact Shadows --- */
        .contact-shadow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: rgba(0,0,0,0.15);
            filter: blur(2px);
            z-index: 6;
            border-radius: 50%;
        }
        .cs-top { top: 64px; } /* Just below top bracket */
        .cs-bottom { bottom: 64px; } /* Just above bottom bracket */

        /* --- Floor Shadow (Grounding) --- */
        .floor-shadow {
            position: absolute;
            bottom: 15%; /* Position on floor plane */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 60px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, transparent 70%);
            z-index: 0;
            filter: blur(8px);
        }

    </style>
</head>
<body>

    <div class="scene-container">
        <!-- Wall detail for spatial context -->
        <div class="wall-detail"></div>
        
        <!-- Floor Plane -->
        <div class="floor"></div>

        <!-- Grounding Shadow -->
        <div class="floor-shadow"></div>

        <!-- The Product -->
        <div class="sign-assembly" id="signAssembly">
            
            <!-- Top Bracket -->
            <div class="bracket bracket-top">
                <div class="bracket-shadow"></div>
                <div class="bracket-bar"></div>
                <div class="screw screw-l"></div>
                <div class="screw screw-r"></div>
            </div>

            <!-- Bottom Bracket -->
            <div class="bracket bracket-bottom">
                <div class="bracket-shadow"></div>
                <div class="bracket-bar"></div>
                <div class="screw screw-l"></div>
                <div class="screw screw-r"></div>
            </div>

            <!-- Contact Shadows (Where hardware meets sign) -->
            <div class="contact-shadow cs-top"></div>
            <div class="contact-shadow cs-bottom"></div>

            <!-- Sign 3D Body -->
            <!-- Extrusion (Thickness) -->
            <div class="sign-extrusion"></div>

            <!-- Front Face -->
            <div class="sign-face">
                <div class="emblem-container">
                    <svg class="emblem" viewBox="0 0 200 200">
                        <defs>
                            <!-- Gradient for the red circle to give it volume -->
                            <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#E82A2A;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#C21010;stop-opacity:1" />
                            </linearGradient>
                            <!-- Clip path for inner shadow -->
                            <clipPath id="circleClip">
                                <circle cx="100" cy="100" r="80" />
                            </clipPath>
                        </defs>

                        <!-- Main Red Circle -->
                        <circle cx="100" cy="100" r="80" fill="url(#redGrad)" />
                        
                        <!-- Inner Shadow (Top Left) -->
                        <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="4" opacity="0.5" transform="translate(2, -2)" />
                        
                        <!-- Rim Light (Bottom Right) -->
                        <circle cx="100" cy="100" r="79" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" transform="translate(-1, 1)" />

                        <!-- Play Button Triangle -->
                        <!-- Geometrically centered: Width 60, Height 104. Center is approx (100, 100) -->
                        <path class="play-triangle" d="M 82 62 L 142 100 L 82 138 Z" stroke="#FFF" stroke-width="1" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Subtle interaction to bring the sign to life
        const assembly = document.getElementById('signAssembly');
        const scene = document.querySelector('.scene-container');

        scene.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;
            
            // Calculate percentage from center (-1 to 1)
            const xPct = (clientX / innerWidth - 0.5) * 2;
            const yPct = (clientY / innerHeight - 0.5) * 2;

            // Apply subtle rotation
            // X axis rotation depends on Y mouse pos (tilting up/down)
            // Y axis rotation depends on X mouse pos (turning left/right)
            const rotateY = xPct * 5; 
            const rotateX = -yPct * 5;

            assembly.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        scene.addEventListener('mouseleave', () => {
            // Reset to idle state
            assembly.style.transform = `rotateX(2deg) rotateY(-2deg)`;
        });
    </script>
</body>
</html>
