<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-tone: #F2F0EB;
            --text-main: #1A1A1A;
            --text-muted: #5E5E5E;
            --accent: #2C3E50;
            --border-ghost: rgba(26, 26, 26, 0.15);
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-tone);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Layout */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 2.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            position: relative;
            overflow: hidden;
        }

        /* Background Vignette */
        .bg-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 50%, rgba(255,255,255,0.8) 0%, rgba(242,240,235,0.4) 60%, rgba(200,195,185,0.9) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.85;
            letter-spacing: -0.04em;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-weight: 700;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3.5rem;
            margin-top: 0.2rem;
            margin-left: 0.2rem;
        }

        .specs-container {
            margin-top: 1.5rem; /* Tighter spacing */
            display: flex;
            gap: 4rem;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }

        .spec-item p {
            font-size: 1.75rem;
            font-weight: 300;
            line-height: 1.2;
            color: var(--text-main);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            max-width: 800px;
            /* Removed static drop shadow from SVG element to handle inside SVG for realism */
        }

        /* Interactive Button */
        .cta-btn {
            margin-top: 2.5rem;
            padding: 1rem 2.5rem;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main); /* Outlined style */
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-btn:hover {
            background: var(--text-main);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Animations */
        .flush-btn-handle {
            cursor: pointer;
            transition: transform 0.1s;
            transform-origin: 0px 0px; /* Pivot at connection point */
        }
        
        .flushing .flush-btn-handle {
            animation: pressHandle 0.3s ease-out forwards;
        }

        .water-vortex {
            opacity: 0;
            transform-origin: center;
            transform: scale(0.8);
        }

        .flushing .water-vortex {
            animation: vortexSpin 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes pressHandle {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-25deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes vortexSpin {
            0% { opacity: 0; transform: scale(0.8) rotate(0deg); }
            20% { opacity: 1; transform: scale(1.0) rotate(45deg); }
            80% { opacity: 1; transform: scale(1.1) rotate(180deg); }
            100% { opacity: 0; transform: scale(1.2) rotate(200deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 3rem; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 2.5rem; }
            header { padding: 1.5rem 2rem; }
            .specs-container { gap: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Soft, warm vignette background -->
        <div class="bg-vignette"></div>

        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- 1. VITREOUS CERAMIC GRADIENTS -->
                    
                    <!-- Main Body Gradient: Simulates a curved cylinder -->
                    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" /> <!-- Shadow edge -->
                        <stop offset="15%" style="stop-color:#FFFFFF;stop-opacity:1" /> <!-- Highlight edge -->
                        <stop offset="40%" style="stop-color:#F9F9F9;stop-opacity:1" /> <!-- Mid tone -->
                        <stop offset="85%" style="stop-color:#E0E0E0;stop-opacity:1" /> <!-- Shadow start -->
                        <stop offset="100%" style="stop-color:#C8C8C8;stop-opacity:1" /> <!-- Shadow edge -->
                    </linearGradient>

                    <!-- Tank Gradient: Slightly different curve -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
                        <stop offset="10%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#F0F0F0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#C5C5C5;stop-opacity:1" />
                    </linearGradient>

                    <!-- Chrome/Metallic Gradient for Handle -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#F0F0F0" />
                        <stop offset="50%" style="stop-color:#A0A0A0" />
                        <stop offset="100%" style="stop-color:#E0E0E0" />
                    </linearGradient>

                    <!-- Floor Shadow Gradient -->
                    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#000000;stop-opacity:0.35" />
                        <stop offset="60%" style="stop-color:#000000;stop-opacity:0.1" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
                    </radialGradient>

                    <!-- Blur for Water -->
                    <filter id="waterBlur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                </defs>

                <!-- 4. GROUNDING: Realistic Multi-layered Shadow -->
                <!-- Contact Shadow (Dark, tight) -->
                <ellipse cx="400" cy="660" rx="110" ry="20" fill="rgba(0,0,0,0.3)" filter="url(#waterBlur)" />
                <!-- Ambient Shadow (Softer, wider) -->
                <ellipse cx="400" cy="660" rx="160" ry="30" fill="url(#floorShadow)" />

                <!-- Architectural Base Flange -->
                <path d="M310,640 C310,655 340,665 400,665 C460,665 490,655 490,640 L480,635 C480,645 450,655 400,655 C350,655 320,645 320,635 Z" fill="#B0B0B0" opacity="0.8"/>

                <!-- Plumbing Pipe (Hidden behind mostly, but visible base) -->
                <path d="M360,635 L360,600 L440,600 L440,635 C440,645 420,655 400,655 C380,655 360,645 360,635 Z" fill="url(#tankGrad)" />

                <!-- Main Bowl Group -->
                <g id="bowl">
                    <!-- Bowl Body -->
                    <path d="M280,380 C280,380 250,620 400,620 C550,620 520,380 520,380 Z" fill="url(#ceramicBody)" />
                    
                    <!-- 1. SPECULAR HIGHLIGHT (The 'Wet' Sheen) -->
                    <!-- A sharp, bright curve on the left to simulate reflection -->
                    <path d="M295,420 C295,420 310,550 360,580 C320,550 310,450 315,420 Z" fill="#FFFFFF" opacity="0.9" filter="url(#waterBlur)" />
                    <!-- Secondary smaller highlight -->
                    <path d="M480,400 C490,450 470,520 440,550" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none"/>

                    <!-- Bowl Back Rim (Depth) -->
                    <path d="M280,380 C280,350 520,350 520,380 C520,410 280,410 280,380 Z" fill="#E8E8E8" />
                </g>

                <!-- 2. VISUALIZE FLUSH: Water Vortex -->
                <!-- Base water level -->
                <ellipse cx="400" cy="375" rx="110" ry="18" fill="#E0F7FA" opacity="0.6" />
                
                <!-- The Vortex Effect (Animated) -->
                <g id="flush-effect" class="water-vortex">
                    <!-- Swirl shape -->
                    <path d="M400,375 Q350,360 340,385 Q330,410 380,400 Q430,390 450,365 Q470,340 420,350 Q380,360 400,375 Z" fill="#B2EBF2" filter="url(#waterBlur)" opacity="0.8"/>
                    <!-- Inner swirl -->
                    <circle cx="400" cy="375" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" filter="url(#waterBlur)"/>
                </g>

                <!-- Seat & Lid -->
                <g id="seat">
                    <!-- Lid (Open/Up) -->
                    <g transform="rotate(-15, 400, 360)">
                        <!-- Lid Face -->
                        <path d="M290,360 C290,330 510,330 510,360 C510,390 290,390 290,360 Z" fill="url(#ceramicBody)" />
                        <!-- Lid Edge Thickness -->
                        <path d="M290,360 C290,390 510,390 510,360 L505,365 C505,395 295,395 295,365 Z" fill="#D0D0D0" opacity="0.5"/>
                        <!-- Lid Highlight -->
                        <path d="M300,365 C300,340 420,340 420,365" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
                    </g>
                    
                    <!-- Seat (Down) -->
                    <ellipse cx="400" cy="380" rx="115" ry="25" fill="url(#ceramicBody)" stroke="#E0E0E0" stroke-width="1"/>
                    <!-- Seat Inner Shadow -->
                    <ellipse cx="400" cy="380" rx="108" ry="22" fill="none" stroke="#D0D0D0" stroke-width="1" opacity="0.4"/>
                </g>

                <!-- Tank -->
                <g id="tank">
                    <!-- Tank Body -->
                    <rect x="310" y="150" width="180" height="210" rx="15" fill="url(#tankGrad)" />
                    
                    <!-- 1. SPECULAR HIGHLIGHT (Sharp reflection on tank) -->
                    <path d="M325,160 L325,350" stroke="white" stroke-width="6" opacity="0.5" stroke-linecap="round" filter="url(#waterBlur)" />
                    
                    <!-- Tank Top Rim -->
                    <rect x="308" y="148" width="184" height="10" rx="5" fill="#FFFFFF" />
                    
                    <!-- Connection to Bowl -->
                    <path d="M310,360 L490,360 L490,370 C490,375 485,380 480,380 L320,380 C315,380 310,375 310,370 Z" fill="#E0E0E0" opacity="0.8" />
                </g>

                <!-- 3. REFINED FLUSH HANDLE -->
                <!-- Metallic Finish, larger scale, tactile -->
                <g id="handle" transform="translate(320, 240)">
                    <!-- Arm Base -->
                    <circle cx="0" cy="0" r="6" fill="#808080" />
                    
                    <!-- The Arm -->
                    <g class="flush-btn-handle">
                        <path d="M0,0 L-35,15" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.2))" />
                        <!-- The Knob (Brushed Chrome) -->
                        <circle cx="-35" cy="15" r="12" fill="url(#chromeGrad)" stroke="#999" stroke-width="1" filter="drop-shadow(1px 2px 3px rgba(0,0,0,0.3))" />
                        <!-- Knob Highlight -->
                        <circle cx="-37" cy="13" r="3" fill="white" opacity="0.6" />
                    </g>
                </g>
                
                <!-- Context: Minimalist Plant (Abstract & Soft) -->
                <g transform="translate(620, 550) scale(0.6)" opacity="0.8">
                    <!-- Pot -->
                    <path d="M-20,0 L20,0 L15,80 L-15,80 Z" fill="#EAE8E3" />
                    <!-- Leaves (Soft shapes) -->
                    <path d="M0,0 Q-40,-60 -20,-120 Q0,-60 0,0" fill="#A8B5A5" opacity="0.8" /> 
                    <path d="M0,0 Q40,-80 60,-140 Q20,-70 0,0" fill="#95A590" opacity="0.9" />
                    <path d="M0,0 Q-20,-100 10,-160 Q30,-80 0,0" fill="#809080" opacity="0.8" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            const handle = document.querySelector('.flush-btn-handle');
            
            // Reset animations
            effect.classList.remove('flushing');
            handle.classList.remove('flushing'); // Reuse class name logic or add specific class
            
            // Trigger reflow to restart CSS animations
            void effect.offsetWidth; 
            void handle.offsetWidth;
            
            // Add animation classes
            effect.classList.add('flushing');
            handle.classList.add('flushing');
        }
    </script>
</body>
</html>
