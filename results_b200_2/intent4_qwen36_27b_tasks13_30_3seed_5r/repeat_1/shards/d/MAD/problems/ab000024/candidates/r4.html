<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-wall: #1a1a1c;
            --bg-floor: #111112;
            --text-main: #F5F5F7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            margin-left: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        nav a:hover {
            opacity: 1;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 45% 55%;
            position: relative;
            overflow: hidden;
        }

        /* Priority 3: Contextual Environment - Spotlight Effect */
        .bg-context {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 70% 60%, #2c2c30 0%, #151517 60%, #0a0a0b 100%);
        }

        /* Subtle Tiled Wall Texture */
        .bg-wall-tiles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 200px 200px;
            opacity: 0.7;
        }

        /* Floor Plane */
        .bg-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to bottom, #18181a, #0d0d0e);
            transform: perspective(800px) rotateX(45deg);
            transform-origin: bottom;
            opacity: 0.8;
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            z-index: 2;
            position: relative;
        }

        /* Priority 5: Hierarchy */
        h1 {
            font-size: 4.5rem; 
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 1rem;
            color: var(--text-main);
            font-weight: 700; 
            text-transform: uppercase;
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 2rem;
            margin-top: 1rem;
            letter-spacing: -0.02em;
            text-transform: none;
        }

        .specs-container {
            margin-top: 3rem;
            display: flex;
            gap: 4rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1.5rem;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .spec-item p {
            font-size: 1.2rem;
            font-weight: 300;
            color: var(--text-main);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            z-index: 1;
            padding-bottom: 5vh;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            max-width: 700px;
            overflow: visible;
        }

        /* Priority 5: UI Polish - Button */
        .action-area {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .cta-btn {
            padding: 1rem 3rem;
            background: var(--text-main);
            color: var(--bg-wall);
            border: none;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cta-btn:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255,255,255,0.1);
        }

        .cta-btn:active {
            transform: translateY(1px);
        }

        /* Animations */
        .flush-btn-handle {
            cursor: pointer;
            transform-origin: 0px 0px;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .flushing .flush-btn-handle {
            animation: pressHandle 0.2s ease-in-out forwards;
        }

        /* Priority 4: Vortex Animation */
        .water-vortex {
            opacity: 0;
            transform-origin: 400px 500px;
        }

        .flushing .water-vortex {
            animation: vortexSpin 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .water-surface {
            transition: transform 0.5s ease;
        }
        
        .flushing .water-surface {
            transform: scale(0.9);
        }

        @keyframes pressHandle {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-35deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes vortexSpin {
            0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            20% { opacity: 0.9; transform: scale(1.1) rotate(45deg); }
            100% { opacity: 0; transform: scale(1.5) rotate(180deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; justify-content: flex-start; padding-top: 2rem; }
            .visual-side { height: 60vh; order: 1; padding-bottom: 0; }
            h1 { font-size: 3rem; }
            .action-area { bottom: 5vh; }
            .bg-floor { height: 20%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
        </nav>
    </header>

    <main>
        <!-- Priority 5: Darker Background -->
        <div class="bg-context">
            <div class="bg-wall-tiles"></div>
            <div class="bg-floor"></div>
        </div>

        <div class="content-side">
            <!-- Priority 5: Alignment & Hierarchy -->
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs-container">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
            </div>
        </div>

        <div class="visual-side">
            <!-- Priority 1, 2, 3, 4: SVG Redraw -->
            <svg viewBox="0 0 800 850" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Priority 2: Complex Material Gradients -->
                    
                    <!-- Main Ceramic: Simulating subsurface scattering and volume -->
                    <radialGradient id="ceramicBody" cx="30%" cy="30%" r="80%" fx="20%" fy="20%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#F2F2F7;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#C7C7CC;stop-opacity:1" />
                        <stop offset="95%" style="stop-color:#8E8E93;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#636366;stop-opacity:1" />
                    </radialGradient>

                    <!-- Tank: Slightly cooler, reflecting ambient light -->
                    <linearGradient id="tankGloss" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#E5E5EA;stop-opacity:1" />
                        <stop offset="25%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#E5E5EA;stop-opacity:1" />
                        <stop offset="90%" style="stop-color:#AEAEB2;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#636366;stop-opacity:1" />
                    </linearGradient>

                    <!-- Chrome: Sharp metallic reflection -->
                    <linearGradient id="chromePolish" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFFFFF" />
                        <stop offset="20%" style="stop-color:#8E8E93" />
                        <stop offset="50%" style="stop-color:#C7C7CC" />
                        <stop offset="80%" style="stop-color:#48484A" />
                        <stop offset="100%" style="stop-color:#1C1C1E" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="ambientBlur">
                        <feGaussianBlur stdDeviation="20" />
                    </filter>
                    
                    <!-- Clip Path for internal shadows -->
                    <clipPath id="tankClip">
                        <path d="M310,200 C310,180 490,180 490,200 L490,460 C490,480 310,480 310,460 Z" />
                    </clipPath>
                </defs>

                <!-- Priority 3: Grounding & Shadows -->
                <!-- Ambient Floor Shadow (Soft, wide) -->
                <ellipse cx="400" cy="770" rx="220" ry="40" fill="#000000" opacity="0.6" filter="url(#ambientBlur)" />
                
                <!-- Contact Shadow (Sharp, dark, tight to base) -->
                <path d="M320,760 C320,790 480,790 480,760 Z" fill="#000000" opacity="0.8" filter="url(#softBlur)" />
                
                <!-- Floor Flange / Trapway Anchor -->
                <ellipse cx="400" cy="760" rx="35" ry="8" fill="#2C2C2E" />
                <ellipse cx="400" cy="760" rx="20" ry="4" fill="#000000" opacity="0.8" />

                <!-- Priority 1: Geometric Reconstruction (Connected Tank & Bowl) -->
                <g id="toilet-body">
                    
                    <!-- TANK (Rear) -->
                    <!-- Tank sits directly on the bowl rear rim -->
                    <g id="tank-group">
                        <!-- Tank Main Body -->
                        <path d="M310,200 C310,180 490,180 490,200 L490,460 C490,480 310,480 310,460 Z" fill="url(#tankGloss)" />
                        
                        <!-- Tank Left Specular Highlight -->
                        <path d="M320,190 L320,460" stroke="#FFFFFF" stroke-width="8" opacity="0.5" filter="url(#softBlur)" />
                        <path d="M320,190 L320,460" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
                        
                        <!-- Tank Right Edge Shadow -->
                        <path d="M480,200 L480,460" stroke="#000000" stroke-width="4" opacity="0.1" filter="url(#softBlur)" />
                        
                        <!-- Tank Lid -->
                        <rect x="305" y="190" width="190" height="12" rx="4" fill="#FFFFFF" />
                        <rect x="305" y="195" width="190" height="7" rx="2" fill="#E5E5EA" />
                    </g>

                    <!-- BOWL (Front) -->
                    <g id="bowl-group">
                        <!-- Bowl Main Body - Connects seamlessly to tank bottom -->
                        <path d="M260,480 
                                 C260,480 240,700 400,760 
                                 C560,700 540,480 540,480 
                                 L310,480 L490,480 Z" 
                              fill="url(#ceramicBody)" />
                        
                        <!-- Bowl Rim Light (Top Edge) -->
                        <path d="M260,480 C260,450 540,450 540,480" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
                        
                        <!-- Left Specular Highlight (Volume) -->
                        <path d="M280,530 C280,530 300,650 360,740 C330,650 300,550 300,530 Z" 
                              fill="#FFFFFF" opacity="0.4" filter="url(#softBlur)" />
                        
                        <!-- Right Side Shadow (Depth) -->
                        <path d="M520,530 C520,530 500,650 460,740" stroke="#000000" stroke-width="8" opacity="0.1" filter="url(#softBlur)" />
                    </g>
                </g>

                <!-- SEAT & LID -->
                <g id="seat-group">
                    <!-- Seat (Upright/Flushed against tank) -->
                    <g transform="rotate(-5, 400, 480)">
                        <!-- Seat Base -->
                        <path d="M290,470 C290,430 510,430 510,470 C510,500 290,500 290,470 Z" fill="url(#ceramicBody)" />
                        <!-- Seat Thickness/Edge -->
                        <path d="M290,470 C290,500 510,500 510,470" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
                        <!-- Hinge Shadow -->
                        <ellipse cx="400" cy="470" rx="15" ry="5" fill="#000000" opacity="0.2" filter="url(#softBlur)"/>
                    </g>
                </g>

                <!-- PRIORITY 4: FLUSH ACTION CUE (Vortex) -->
                <g id="water-level">
                    <!-- Water Surface -->
                    <ellipse cx="400" cy="485" rx="120" ry="18" fill="#E5F4FF" opacity="0.6" class="water-surface" />
                    
                    <!-- The Vortex (Hidden by default) -->
                    <path class="water-vortex" 
                          d="M400,485 
                             C400,485 380,465 420,465 
                             C460,465 450,505 400,505 
                             C350,505 360,465 400,465 
                             C440,465 430,505 400,505" 
                          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
                </g>

                <!-- HANDLE (Flusher) -->
                <g id="handle" transform="translate(325, 300)">
                    <!-- Stem Base -->
                    <circle cx="0" cy="0" r="8" fill="#1C1C1E" />
                    <circle cx="0" cy="0" r="6" fill="#48484A" />
                    
                    <!-- The Arm -->
                    <g class="flush-btn-handle">
                        <path d="M0,0 L-45,20" stroke="url(#chromePolish)" stroke-width="6" stroke-linecap="round" />
                        <!-- The Knob (3D Sphere) -->
                        <circle cx="-45" cy="20" r="10" fill="url(#chromePolish)" />
                        <!-- Knob Specular -->
                        <circle cx="-48" cy="17" r="2" fill="#FFFFFF" opacity="0.9" />
                    </g>
                </g>

            </svg>

            <!-- Priority 5: Button Placement -->
            <div class="action-area">
                <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
            </div>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const vortex = document.querySelector('.water-vortex');
            const handle = document.querySelector('.flush-btn-handle');
            const waterSurface = document.querySelector('.water-surface');
            
            // Reset animations
            vortex.classList.remove('flushing');
            handle.classList.remove('flushing');
            svg.classList.remove('flushing');
            waterSurface.style.transform = "scale(1)";
            
            // Trigger reflow to restart CSS animations
            void vortex.offsetWidth; 
            
            // Start animations
            vortex.classList.add('flushing');
            handle.classList.add('flushing');
            svg.classList.add('flushing');
            
            // JS-driven water level drop
            setTimeout(() => {
                waterSurface.style.transform = "scale(0.85)";
                waterSurface.style.opacity = "0.3";
            }, 200);
            
            setTimeout(() => {
                waterSurface.style.transform = "scale(1)";
                waterSurface.style.opacity = "0.6";
            }, 1500);
        }
    </script>
</body>
</html>
