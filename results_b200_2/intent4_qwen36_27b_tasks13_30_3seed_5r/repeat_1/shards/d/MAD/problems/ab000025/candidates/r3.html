<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip (Final)</title>
    <style>
        :root {
            --bg-deep: #050505;
            --bg-surface: #1a1a1c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Stage setup for cinematic framing */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 60% 40%, #2a2a2c 0%, #080808 70%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Film Grain Overlay - Subtle texture */
        .grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* The Main Illustration Container - Tighter Crop */
        .illustration-container {
            width: 100%;
            height: 100%;
            /* Removed fixed max-widths to allow full screen immersion */
            position: relative;
            z-index: 5;
            /* Dynamic breathing animation */
            animation: breathe 12s ease-in-out infinite;
            transform-origin: center center;
        }

        svg.main-art {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.03) translate(-5px, -5px); }
        }

        /* Typography Overlay - Watermark style */
        .editorial-text {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255,255,255,0.3);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            z-index: 15;
            pointer-events: none;
            text-align: right;
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <div class="stage">
        <div class="grain"></div>

        <div class="illustration-container">
            <!-- viewBox adjusted for tighter, diagonal composition -->
            <svg class="main-art" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <!-- LIGHTING ENVIRONMENT -->
                    
                    <!-- SCREEN GLOW (Warm, intense) -->
                    <radialGradient id="screenGlow" cx="50%" cy="50%" r="70%">
                        <stop offset="0%" stop-color="#ffccaa" stop-opacity="0.4"/>
                        <stop offset="30%" stop-color="#ffaa66" stop-opacity="0.2"/>
                        <stop offset="100%" stop-color="#ffaa66" stop-opacity="0"/>
                    </radialGradient>

                    <!-- SKIN GRADIENTS (High Fidelity) -->
                    <!-- Base Skin: Warm, rich tones -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#EAC0A2" />
                        <stop offset="50%" stop-color="#D69B7A" />
                        <stop offset="100%" stop-color="#A86D52" />
                    </linearGradient>

                    <!-- Skin Shadow: Deep, cool undertones -->
                    <linearGradient id="skinShadow" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#4A2E22" />
                        <stop offset="100%" stop-color="#7A4533" />
                    </linearGradient>

                    <!-- DEVICE GRADIENTS -->
                    <!-- Titanium Body -->
                    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#444" />
                        <stop offset="40%" stop-color="#222" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <!-- Metallic Edge Bevel -->
                    <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#888" />
                        <stop offset="50%" stop-color="#333" />
                        <stop offset="100%" stop-color="#555" />
                    </linearGradient>

                    <!-- Screen Glass -->
                    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
                        <stop offset="15%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="85%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
                    </linearGradient>

                    <!-- FILTERS -->
                    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                    
                    <filter id="blurAO" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>

                    <!-- Shadow Shape for realistic depth -->
                    <filter id="dropShadow">
                        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
                    </filter>
                </defs>

                <!-- ================= BACKGROUND LAYER ================= -->
                <!-- Subtle vignette handled by CSS, here we add ambient light -->
                <rect width="100%" height="100%" fill="url(#screenGlow)" opacity="0.1" style="mix-blend-mode: screen;"/>

                <!-- ================= THE DEVICE (Back) ================= -->
                <!-- Tilted slightly for dynamic energy -->
                <g id="smartphone" transform="translate(300, 400) rotate(-15)">
                    <!-- Main Chassis (Tall) -->
                    <rect x="-75" y="-210" width="150" height="420" rx="24" fill="url(#titanium)" stroke="url(#bevel)" stroke-width="1" />
                    
                    <!-- Screen Area (Inner) -->
                    <rect x="-71" y="-206" width="142" height="412" rx="20" fill="#050505" />
                    
                    <!-- Screen Content/Glow -->
                    <rect x="-71" y="-206" width="142" height="412" rx="20" fill="url(#screenGlow)" opacity="0.9" />
                    
                    <!-- Glass Reflections -->
                    <path d="M -70 -200 L 70 -100 L 70 100 L -70 200 Z" fill="url(#glassReflect)" style="mix-blend-mode: overlay;" />
                    
                    <!-- Camera Island (Modern Pill Shape) -->
                    <rect x="-35" y="-190" width="70" height="20" rx="10" fill="#0a0a0a" stroke="#222" stroke-width="0.5" />
                    <!-- Lenses -->
                    <circle cx="-15" cy="-180" r="4" fill="#111" />
                    <circle cx="-15" cy="-180" r="1.5" fill="#444" /> <!-- Glint -->
                    <circle cx="15" cy="-180" r="4" fill="#111" />
                    <circle cx="15" cy="-180" r="1.5" fill="#444" /> <!-- Glint -->
                    
                    <!-- Speaker Grill -->
                    <line x1="-20" y1="-204" x2="20" y2="-204" stroke="#222" stroke-width="2" stroke-linecap="round"/>

                    <!-- Side Buttons (Left side of device in this view) -->
                    <rect x="-78" y="-100" width="3" height="25" rx="1" fill="#333" />
                    <rect x="-78" y="-65" width="3" height="25" rx="1" fill="#333" />
                </g>

                <!-- ================= THE HAND (Anatomy & Interaction) ================= -->
                <!-- Grouped to ensure cohesive rotation if needed -->
                <g id="hand-anatomy">

                    <!-- 1. FOREARM & WRIST -->
                    <!-- Anchored bottom right, tapering to palm -->
                    <path d="M 800 900 L 550 650 Q 500 550 480 500 L 350 600 L 600 900 Z" fill="url(#skinBase)" />
                    <!-- Wrist Crease -->
                    <path d="M 480 500 Q 520 550 500 600" stroke="url(#skinShadow)" stroke-width="12" fill="none" filter="url(#blurSoft)" opacity="0.7"/>

                    <!-- 2. PALM BASE -->
                    <!-- Connects wrist to fingers -->
                    <path d="M 480 500 Q 550 450 580 550 Q 550 650 450 700 L 350 600 Z" fill="url(#skinBase)" />
                    
                    <!-- 3. FINGERS (Wrapping around the BACK/RIGHT edge) -->
                    <!-- Note: These are drawn to overlap the device edge slightly -->
                    
                    <!-- Index Finger -->
                    <g id="finger-index" transform="translate(440, 380) rotate(25)">
                        <!-- Phalanx 1 -->
                        <path d="M 0 0 C 25 -10, 45 10, 45 20 L 10 20 C 10 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <!-- Phalanx 2 -->
                        <path d="M 40 15 C 60 10, 80 25, 80 35 L 50 35 C 50 25, 35 20, 40 15 Z" fill="url(#skinBase)" />
                        <!-- Phalanx 3 (Tip) -->
                        <path d="M 75 30 C 95 25, 110 35, 105 45 L 70 40 C 65 35, 70 30, 75 30 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="100" cy="36" rx="6" ry="4" fill="#e8d0bf" opacity="0.8" transform="rotate(-10 100 36)" />
                        <!-- Knuckle Crease -->
                        <path d="M 40 15 Q 45 25 50 15" stroke="#8a5a42" stroke-width="1.5" fill="none" opacity="0.6"/>
                    </g>

                    <!-- Middle Finger -->
                    <g id="finger-middle" transform="translate(450, 430) rotate(20)">
                        <path d="M 0 0 C 25 -5, 50 10, 50 25 L 15 25 C 15 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 45 20 C 65 15, 90 30, 90 45 L 55 45 C 55 30, 35 25, 45 20 Z" fill="url(#skinBase)" />
                        <path d="M 85 40 C 105 35, 120 50, 115 60 L 80 55 C 75 45, 80 40, 85 40 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="110" cy="50" rx="6" ry="4" fill="#e8d0bf" opacity="0.8" transform="rotate(-5 110 50)" />
                    </g>

                    <!-- Ring Finger -->
                    <g id="finger-ring" transform="translate(455, 480) rotate(15)">
                        <path d="M 0 0 C 20 -5, 45 10, 45 20 L 10 20 C 10 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 40 15 C 60 10, 80 25, 80 40 L 50 40 C 50 25, 30 20, 40 15 Z" fill="url(#skinBase)" />
                        <path d="M 75 35 C 95 30, 110 45, 105 55 L 70 50 C 65 40, 70 35, 75 35 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="100" cy="46" rx="5" ry="3.5" fill="#e8d0bf" opacity="0.8" />
                    </g>

                    <!-- Pinky Finger -->
                    <g id="finger-pinky" transform="translate(450, 530) rotate(10)">
                        <path d="M 0 0 C 15 -5, 35 5, 35 15 L 5 15 C 5 5, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 30 10 C 45 5, 65 20, 65 30 L 40 30 C 40 20, 25 15, 30 10 Z" fill="url(#skinBase)" />
                        <path d="M 60 25 C 75 20, 85 35, 80 45 L 55 40 C 50 35, 55 25, 60 25 Z" fill="url(#skinBase)" />
                    </g>

                    <!-- 4. THUMB (The Anchor on Front) -->
                    <!-- Crosses over the screen -->
                    <g id="thumb-group">
                        <!-- Thenar Eminence (Muscle Base) -->
                        <path d="M 420 650 Q 350 600 320 550 Q 350 500 420 550 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Shaft (Proximal) -->
                        <path d="M 400 600 Q 340 550 280 520 Q 250 500 260 480 Q 280 460 320 490 Q 380 530 420 600 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Tip (Distal) -->
                        <path d="M 260 480 Q 230 440 240 410 Q 250 400 265 420 Q 280 440 280 480 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Nail -->
                        <ellipse cx="252" cy="420" rx="7" ry="10" transform="rotate(-45 252 420)" fill="#f5e6d8" opacity="0.9" />
                        <!-- Nail Specular -->
                        <ellipse cx="252" cy="418" rx="3" ry="6" transform="rotate(-45 252 418)" fill="#fff" opacity="0.5" />

                        <!-- Joint Crease -->
                        <path d="M 320 520 Q 300 500 290 510" stroke="#8a5a42" stroke-width="2" fill="none" opacity="0.6" />
                    </g>

                </g>

                <!-- ================= INTERACTION & LIGHTING ================= -->
                
                <!-- 1. Contact Shadows (Ambient Occlusion) -->
                <!-- Shadows cast BY the hand ONTO the phone -->
                <g id="contact-shadows" filter="url(#blurSoft)">
                    <!-- Fingers on back edge (Right side of phone) -->
                    <!-- Note: Coordinates roughly approximate the overlap points -->
                    <path d="M 440 380 L 460 380 L 460 410 L 440 410 Z" fill="#000" opacity="0.8" /> <!-- Index -->
                    <path d="M 450 430 L 470 430 L 470 460 L 450 460 Z" fill="#000" opacity="0.8" /> <!-- Middle -->
                    <path d="M 455 480 L 475 480 L 475 510 L 455 510 Z" fill="#000" opacity="0.8" /> <!-- Ring -->
                    <path d="M 450 530 L 465 530 L 465 560 L 450 560 Z" fill="#000" opacity="0.8" /> <!-- Pinky -->
                    
                    <!-- Thumb on screen (Front) - Softer shadow -->
                    <ellipse cx="260" cy="460" rx="30" ry="15" transform="rotate(-45 260 460)" fill="#000" opacity="0.5" />
                </g>

                <!-- 2. Cast Shadows (Hand onto Forearm/Background) -->
                <path d="M 420 550 Q 480 600 480 700 L 380 700 Z" fill="url(#skinShadow)" opacity="0.6" filter="url(#blurAO)" />

                <!-- 3. Screen Glow Reflection on Skin -->
                <!-- The thumb and palm should glow slightly from the screen light -->
                <g style="mix-blend-mode: screen; pointer-events: none;">
                    <!-- Glow on Thumb Tip -->
                    <path d="M 260 480 Q 230 440 240 410 Q 250 400 265 420 Q 280 440 280 480 Z" fill="url(#screenGlow)" opacity="1.0" />
                    <!-- Glow on Palm edge -->
                    <path d="M 320 490 Q 350 530 420 600 L 400 650 Q 340 550 320 490 Z" fill="url(#screenGlow)" opacity="0.7" />
                </g>

                <!-- 4. Specular Highlights (Key Light) -->
                <g style="mix-blend-mode: overlay; pointer-events: none;">
                    <!-- Highlight on Knuckles (Fingers) -->
                    <circle cx="450" cy="395" r="4" fill="white" opacity="0.6" filter="blur(1px)" />
                    <circle cx="460" cy="445" r="4" fill="white" opacity="0.6" filter="blur(1px)" />
                    <circle cx="465" cy="495" r="4" fill="white" opacity="0.6" filter="blur(1px)" />
                    
                    <!-- Highlight on Thumb Tip -->
                    <ellipse cx="255" cy="430" rx="5" ry="10" transform="rotate(-45 255 430)" fill="white" opacity="0.5" filter="blur(1px)" />
                    
                    <!-- Highlight on Forearm -->
                    <path d="M 600 750 Q 550 650 520 550" stroke="white" stroke-width="10" fill="none" opacity="0.2" filter="blur(5px)" />
                </g>

            </svg>
        </div>

        <div class="editorial-text">
            FIG 2.0 — ANATOMY & LIGHTING<br>
            REVISION: TIGHT CROP
        </div>
    </div>

</body>
</html>
