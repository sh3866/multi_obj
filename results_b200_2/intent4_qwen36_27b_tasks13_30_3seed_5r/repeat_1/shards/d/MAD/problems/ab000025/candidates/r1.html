<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip</title>
    <style>
        :root {
            --bg-color: #121214;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The main stage - strictly cropped composition */
        .canvas-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 30% 30%, #2a2a2e 0%, #0f0f10 70%);
        }

        /* Subtle film grain for texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* The Illustration */
        svg.illustration {
            width: 100%;
            height: 100%;
            max-width: 800px; /* Constrain width for desktop viewing */
            max-height: 1200px;
            /* Soft shadow to lift from background */
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6));
        }

        /* Subtle breathing animation */
        @keyframes breathe {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.01) rotate(0.5deg); }
        }
        
        .animate-group {
            animation: breathe 8s ease-in-out infinite;
            transform-origin: center;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="canvas-stage">
        <svg class="illustration animate-group" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- LIGHTING & SKIN GRADIENTS -->
                <!-- Base Skin Tone (Warm) -->
                <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#eac0a2" />
                    <stop offset="50%" stop-color="#d49e83" />
                    <stop offset="100%" stop-color="#b87b62" />
                </linearGradient>
                
                <!-- Deep Shadow Skin Tone (Crevices) -->
                <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8a5a42" />
                    <stop offset="100%" stop-color="#4a2e22" />
                </linearGradient>

                <!-- Key Light Highlight (Top Left) -->
                <radialGradient id="keyLight" cx="20%" cy="20%" r="80%">
                    <stop offset="0%" stop-color="#fff5eb" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#d49e83" stop-opacity="0" />
                </radialGradient>

                <!-- DEVICE GRADIENTS -->
                <!-- Titanium/Space Grey Body -->
                <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2b2b2b" />
                    <stop offset="20%" stop-color="#1a1a1a" />
                    <stop offset="80%" stop-color="#111" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <!-- Edge Bevel (Metallic) -->
                <linearGradient id="deviceEdge" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#555" />
                    <stop offset="30%" stop-color="#222" />
                    <stop offset="70%" stop-color="#111" />
                    <stop offset="100%" stop-color="#666" />
                </linearGradient>

                <!-- Screen Glass Reflection -->
                <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="40%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="80%" stop-color="rgba(255,255,255,0.05)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.2)" />
                </linearGradient>

                <!-- FILTERS -->
                <!-- Soft blur for ambient occlusion/shadows -->
                <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" />
                </filter>
                
                <!-- Inner shadow for anatomical depth -->
                <filter id="innerShadow">
                    <feOffset dx="0" dy="3"/>
                    <feGaussianBlur stdDeviation="3" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.4" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
            </defs>

            <!-- 1. THE DEVICE (Back Layer) -->
            <g id="device" transform="translate(220, 120) rotate(-6)">
                <!-- Main Casing -->
                <rect x="0" y="0" width="160" height="460" rx="28" fill="url(#deviceBody)" stroke="url(#deviceEdge)" stroke-width="2" />
                
                <!-- Screen Area -->
                <rect x="6" y="6" width="148" height="448" rx="22" fill="#000" />
                
                <!-- Screen Reflection (Diagonal streak) -->
                <path d="M 10 10 L 150 100 L 150 350 L 10 440 Z" fill="url(#screenGlass)" style="mix-blend-mode: overlay; opacity: 0.5;" />
                
                <!-- Hardware Details -->
                <!-- Camera Island -->
                <rect x="45" y="20" width="70" height="22" rx="11" fill="#0a0a0a" stroke="#222" stroke-width="1" />
                <circle cx="60" cy="31" r="4" fill="#111" /> <!-- Lens -->
                <circle cx="60" cy="31" r="1.5" fill="#333" /> <!-- Glint -->
                <circle cx="95" cy="31" r="2" fill="#111" /> <!-- Sensor -->

                <!-- Side Buttons (Volume/Power) -->
                <rect x="-3" y="120" width="4" height="30" rx="2" fill="#222" /> <!-- Vol Up -->
                <rect x="-3" y="160" width="4" height="30" rx="2" fill="#222" /> <!-- Vol Down -->
                <rect x="159" y="140" width="3" height="50" rx="1.5" fill="#222" /> <!-- Power -->
            </g>

            <!-- 2. THE HAND (Organic Construction) -->
            <g id="hand-system" filter="url(#innerShadow)">
                
                <!-- WRIST & PALM BASE -->
                <!-- The foundation, connecting from bottom right -->
                <path d="M 420 850 Q 350 750 300 650 L 250 600 L 320 450 L 450 550 Z" fill="url(#skinBase)" />
                
                <!-- Palm Shadow (Cast by fingers wrapping) -->
                <path d="M 320 450 Q 350 500 300 600 L 250 600 Z" fill="url(#skinShadow)" opacity="0.6" />

                <!-- THUMB (The Anchor) -->
                <g id="thumb-group">
                    <!-- Thenar Eminence (Thumb muscle base) -->
                    <path d="M 260 580 Q 220 520 230 480 Q 260 460 300 500 Z" fill="url(#skinShadow)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 280 520 Q 220 480 180 420 Q 160 380 180 360 L 200 370 Q 230 420 290 500 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Phalanges (Knuckles) -->
                    <!-- Proximal -->
                    <path d="M 280 520 Q 240 490 190 440 L 210 450 Q 250 490 290 500 Z" fill="url(#skinBase)" />
                    <!-- Distal -->
                    <path d="M 190 440 Q 170 400 180 360 L 200 370 Q 210 410 210 450 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Tip (Contacting Screen) -->
                    <path d="M 180 360 Q 170 330 195 330 Q 210 340 200 370 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Nail -->
                    <ellipse cx="192" cy="345" rx="6" ry="9" transform="rotate(-30 192 345)" fill="#f5e6d8" opacity="0.9" />
                    <ellipse cx="192" cy="345" rx="4" ry="7" transform="rotate(-30 192 345)" fill="#fff" opacity="0.2" /> <!-- Specular -->

                    <!-- Joint Crease (Webbing) -->
                    <path d="M 260 560 Q 240 530 220 500" stroke="#8a5a42" stroke-width="2" fill="none" opacity="0.5" />
                </g>

                <!-- FINGERS (Wrapping from Right) -->
                <!-- These are drawn as overlapping organic paths -->
                
                <!-- Index Finger -->
                <g id="finger-index">
                    <path d="M 380 420 Q 360 360 330 340 Q 310 330 300 340 Q 320 370 360 400 Z" fill="url(#skinBase)" />
                    <!-- Knuckle -->
                    <circle cx="370" cy="430" r="12" fill="url(#skinBase)" />
                    <!-- Nail -->
                    <ellipse cx="310" cy="335" rx="4" ry="7" transform="rotate(-45 310 335)" fill="#f5e6d8" />
                </g>

                <!-- Middle Finger -->
                <g id="finger-middle">
                    <path d="M 390 460 Q 370 400 340 380 Q 320 370 310 380 Q 330 410 370 440 Z" fill="url(#skinBase)" />
                    <!-- Knuckle -->
                    <circle cx="385" cy="470" r="14" fill="url(#skinBase)" />
                    <!-- Nail -->
                    <ellipse cx="320" cy="375" rx="4" ry="7" transform="rotate(-40 320 375)" fill="#f5e6d8" />
                </g>

                <!-- Ring Finger -->
                <g id="finger-ring">
                    <path d="M 390 500 Q 370 440 340 420 Q 320 410 310 420 Q 330 450 370 480 Z" fill="url(#skinBase)" />
                    <!-- Knuckle -->
                    <circle cx="385" cy="510" r="13" fill="url(#skinBase)" />
                    <!-- Nail -->
                    <ellipse cx="320" cy="415" rx="4" ry="7" transform="rotate(-35 320 415)" fill="#f5e6d8" />
                </g>

                <!-- Pinky Finger -->
                <g id="finger-pinky">
                    <path d="M 380 540 Q 360 480 335 460 Q 315 450 305 460 Q 325 490 360 520 Z" fill="url(#skinBase)" />
                    <!-- Knuckle -->
                    <circle cx="375" cy="550" r="11" fill="url(#skinBase)" />
                    <!-- Nail -->
                    <ellipse cx="315" cy="455" rx="3.5" ry="6" transform="rotate(-30 315 455)" fill="#f5e6d8" />
                </g>

                <!-- Contact Shadows (Where fingers press against device) -->
                <!-- Cast onto the phone from the fingers -->
                <g fill="#000" opacity="0.5" filter="url(#blurShadow)">
                    <!-- Index Contact -->
                    <ellipse cx="310" cy="340" rx="10" ry="5" transform="rotate(-10 310 340)" />
                    <!-- Middle Contact -->
                    <ellipse cx="320" cy="380" rx="10" ry="5" transform="rotate(-10 320 380)" />
                    <!-- Ring Contact -->
                    <ellipse cx="320" cy="420" rx="10" ry="5" transform="rotate(-10 320 420)" />
                    <!-- Pinky Contact -->
                    <ellipse cx="310" cy="460" rx="9" ry="4" transform="rotate(-10 310 460)" />
                    <!-- Thumb Contact -->
                    <ellipse cx="195" cy="350" rx="15" ry="10" transform="rotate(45 195 350)" />
                </g>

            </g>

            <!-- 3. FINISHING TOUCHES (Lighting & Speculars) -->
            <g style="mix-blend-mode: overlay; pointer-events: none;">
                <!-- Key Light Overlay on Skin -->
                <path d="M 280 520 Q 220 480 180 420 Q 160 380 180 360 L 200 370 Q 230 420 290 500 Z" fill="url(#keyLight)" opacity="0.5" />
                
                <!-- Specular Highlight on Thumb Tip (Shiny skin) -->
                <ellipse cx="195" cy="345" rx="3" ry="6" transform="rotate(45 195 345)" fill="#fff" opacity="0.4" filter="blur(1px)" />
                
                <!-- Specular on Knuckles -->
                <circle cx="385" cy="470" r="4" fill="#fff" opacity="0.3" filter="blur(2px)" />
                <circle cx="370" cy="430" r="3" fill="#fff" opacity="0.3" filter="blur(2px)" />
            </g>

            <!-- Device Screen Glint (Final Polish) -->
            <path d="M 226 126 L 376 276 L 376 326 L 226 176 Z" fill="white" opacity="0.08" style="mix-blend-mode: screen;" />

        </svg>
    </div>

</body>
</html>
