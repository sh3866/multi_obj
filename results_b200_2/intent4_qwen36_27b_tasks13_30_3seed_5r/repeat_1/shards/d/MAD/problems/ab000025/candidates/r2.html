<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip (Revised)</title>
    <style>
        :root {
            --bg-deep: #050505;
            --bg-surface: #1a1a1c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Stage setup for cinematic framing */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #222225 0%, #080808 80%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Film Grain Overlay */
        .grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* The Main Illustration Container */
        .illustration-container {
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 900px;
            position: relative;
            z-index: 5;
            /* Subtle breathing animation */
            animation: breathe 10s ease-in-out infinite;
            transform-origin: center center;
        }

        svg.main-art {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-5px); }
        }

        /* Typography Overlay for Editorial Feel */
        .editorial-text {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 15;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="stage">
        <div class="grain"></div>

        <div class="illustration-container">
            <svg class="main-art" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <!-- LIGHTING ENVIRONMENT -->
                    <!-- Main Key Light (Top Left) -->
                    <radialGradient id="lightKey" cx="20%" cy="10%" r="80%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>

                    <!-- SCREEN GLOW (Warm) -->
                    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
                        <stop offset="0%" stop-color="#ffaa66" stop-opacity="0.35"/>
                        <stop offset="40%" stop-color="#ffaa66" stop-opacity="0.15"/>
                        <stop offset="100%" stop-color="#ffaa66" stop-opacity="0"/>
                    </radialGradient>

                    <!-- SKIN GRADIENTS (Organic & Volumetric) -->
                    <!-- Base Skin: Warm, rich tones -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#EAC0A2" />
                        <stop offset="40%" stop-color="#D69B7A" />
                        <stop offset="100%" stop-color="#A86D52" />
                    </linearGradient>

                    <!-- Skin Shadow: Deep, cool undertones for crevices -->
                    <linearGradient id="skinShadow" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#5C3426" />
                        <stop offset="100%" stop-color="#8F523E" />
                    </linearGradient>

                    <!-- Specular Highlight for oily/wet skin look -->
                    <radialGradient id="skinSpecular" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFF" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
                    </radialGradient>

                    <!-- DEVICE GRADIENTS -->
                    <!-- Titanium Body -->
                    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3a3a3a" />
                        <stop offset="25%" stop-color="#2a2a2a" />
                        <stop offset="75%" stop-color="#111" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>

                    <!-- Metallic Edge Bevel -->
                    <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#666" />
                        <stop offset="50%" stop-color="#222" />
                        <stop offset="100%" stop-color="#444" />
                    </linearGradient>

                    <!-- Screen Glass -->
                    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
                        <stop offset="20%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="80%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
                    </linearGradient>

                    <!-- FILTERS -->
                    <!-- Soft Blur for Shadows -->
                    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    
                    <!-- Heavy Blur for Ambient Occlusion -->
                    <filter id="blurAO" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" />
                    </filter>
                </defs>

                <!-- ================= BACKGROUND LAYER ================= -->
                <rect width="100%" height="100%" fill="url(#lightKey)" opacity="0.1" style="mix-blend-mode: overlay;"/>

                <!-- ================= THE DEVICE (Back) ================= -->
                <!-- Positioned centrally, slightly rotated -->
                <g id="smartphone" transform="translate(220, 100) rotate(-4)">
                    <!-- Main Chassis -->
                    <rect x="0" y="0" width="150" height="420" rx="24" fill="url(#titanium)" stroke="url(#bevel)" stroke-width="1.5" />
                    
                    <!-- Screen Area -->
                    <rect x="4" y="4" width="142" height="412" rx="20" fill="#050505" />
                    
                    <!-- Screen Content/Glow (Abstract) -->
                    <rect x="4" y="4" width="142" height="412" rx="20" fill="url(#screenGlow)" opacity="0.8" />
                    
                    <!-- Glass Reflections -->
                    <path d="M 10 10 L 140 100 L 140 300 L 10 400 Z" fill="url(#glassReflect)" style="mix-blend-mode: overlay;" />
                    <path d="M 140 100 L 140 400 L 100 400 L 100 100 Z" fill="white" opacity="0.05" style="mix-blend-mode: screen;" />

                    <!-- Camera Island (Top) -->
                    <rect x="35" y="15" width="80" height="24" rx="12" fill="#0a0a0a" stroke="#222" stroke-width="1" />
                    <!-- Lenses -->
                    <circle cx="55" cy="27" r="5" fill="#111" />
                    <circle cx="55" cy="27" r="2" fill="#333" /> <!-- Lens Glint -->
                    <circle cx="95" cy="27" r="5" fill="#111" />
                    <circle cx="95" cy="27" r="2" fill="#333" /> <!-- Lens Glint -->
                    <!-- Sensor -->
                    <circle cx="75" cy="27" r="2" fill="#222" />

                    <!-- Side Buttons -->
                    <!-- Left (Vol) -->
                    <rect x="-2" y="100" width="3" height="25" rx="1" fill="#222" />
                    <rect x="-2" y="135" width="3" height="25" rx="1" fill="#222" />
                    <!-- Right (Power) -->
                    <rect x="149" y="120" width="3" height="40" rx="1" fill="#222" />
                </g>

                <!-- ================= THE HAND (Anatomy & Interaction) ================= -->
                <!-- Group to handle global hand rotation if needed -->
                <g id="hand-anatomy">

                    <!-- 1. FOREARM & WRIST (Grounding the image) -->
                    <!-- Extends from bottom right, tapering up to the palm -->
                    <path d="M 550 800 L 420 500 Q 380 450 320 480 L 280 650 L 550 900 Z" fill="url(#skinBase)" />
                    <!-- Wrist shadow/crease -->
                    <path d="M 380 480 Q 420 520 400 580" stroke="url(#skinShadow)" stroke-width="10" fill="none" filter="url(#blurSoft)" opacity="0.6"/>

                    <!-- 2. PALM BASE -->
                    <!-- The fleshy part of the hand behind the phone -->
                    <path d="M 320 480 Q 380 400 450 450 Q 480 550 420 650 L 280 650 Z" fill="url(#skinBase)" />
                    
                    <!-- 3. FINGERS (Wrapping around the BACK/RIGHT edge) -->
                    <!-- These need to overlap the phone slightly to show grip -->
                    
                    <!-- Index Finger -->
                    <g id="finger-index" transform="translate(370, 320) rotate(15)">
                        <!-- Phalanx 1 (Proximal) -->
                        <path d="M 0 0 C 20 -10, 40 10, 40 20 L 10 20 C 10 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <!-- Phalanx 2 (Middle) -->
                        <path d="M 35 15 C 50 10, 70 25, 70 35 L 40 35 C 40 25, 25 20, 35 15 Z" fill="url(#skinBase)" />
                        <!-- Phalanx 3 (Distal/Tip) -->
                        <path d="M 65 30 C 80 25, 95 35, 90 45 L 60 40 C 55 35, 60 30, 65 30 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="85" cy="36" rx="6" ry="4" fill="#e8d0bf" opacity="0.8" transform="rotate(-10 85 36)" />
                        <!-- Knuckle Crease -->
                        <path d="M 35 15 Q 40 25 45 15" stroke="#8a5a42" stroke-width="1" fill="none" opacity="0.5"/>
                    </g>

                    <!-- Middle Finger -->
                    <g id="finger-middle" transform="translate(380, 370) rotate(12)">
                        <path d="M 0 0 C 20 -5, 45 10, 45 25 L 15 25 C 15 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 40 20 C 60 15, 85 30, 85 45 L 50 45 C 50 30, 30 25, 40 20 Z" fill="url(#skinBase)" />
                        <path d="M 80 40 C 100 35, 115 50, 110 60 L 75 55 C 70 45, 75 40, 80 40 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="105" cy="50" rx="6" ry="4" fill="#e8d0bf" opacity="0.8" transform="rotate(-5 105 50)" />
                    </g>

                    <!-- Ring Finger -->
                    <g id="finger-ring" transform="translate(385, 420) rotate(8)">
                        <path d="M 0 0 C 15 -5, 40 10, 40 20 L 10 20 C 10 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 35 15 C 55 10, 75 25, 75 40 L 45 40 C 45 25, 25 20, 35 15 Z" fill="url(#skinBase)" />
                        <path d="M 70 35 C 90 30, 105 45, 100 55 L 65 50 C 60 40, 65 35, 70 35 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="95" cy="46" rx="5" ry="3.5" fill="#e8d0bf" opacity="0.8" />
                    </g>

                    <!-- Pinky Finger -->
                    <g id="finger-pinky" transform="translate(380, 470) rotate(5)">
                        <path d="M 0 0 C 10 -5, 30 5, 30 15 L 5 15 C 5 5, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 25 10 C 40 5, 60 20, 60 30 L 35 30 C 35 20, 20 15, 25 10 Z" fill="url(#skinBase)" />
                        <path d="M 55 25 C 70 20, 80 35, 75 45 L 50 40 C 45 35, 50 25, 55 25 Z" fill="url(#skinBase)" />
                    </g>

                    <!-- 4. THUMB (The Anchor on Front) -->
                    <!-- Connects to wrist, crosses over the screen -->
                    <g id="thumb-group">
                        <!-- Thenar Eminence (Muscle Base) -->
                        <path d="M 300 600 Q 250 550 220 500 Q 250 450 300 500 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Shaft (Proximal) -->
                        <path d="M 280 540 Q 230 500 180 480 Q 150 470 160 450 Q 180 430 220 460 Q 260 500 300 540 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Tip (Distal) -->
                        <path d="M 160 450 Q 130 420 140 390 Q 150 380 165 400 Q 180 420 180 450 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Nail -->
                        <ellipse cx="152" cy="400" rx="7" ry="10" transform="rotate(-45 152 400)" fill="#f5e6d8" opacity="0.9" />
                        <!-- Nail Specular -->
                        <ellipse cx="152" cy="398" rx="3" ry="6" transform="rotate(-45 152 398)" fill="#fff" opacity="0.4" />

                        <!-- Joint Crease -->
                        <path d="M 220 480 Q 200 460 190 470" stroke="#8a5a42" stroke-width="2" fill="none" opacity="0.6" />
                    </g>

                </g>

                <!-- ================= INTERACTION & LIGHTING ================= -->
                
                <!-- 1. Contact Shadows (Ambient Occlusion) -->
                <!-- Shadows cast BY the hand ONTO the phone -->
                <g id="contact-shadows" filter="url(#blurSoft)">
                    <!-- Fingers on back edge (Right side of phone) -->
                    <path d="M 370 320 L 385 320 L 385 350 L 370 350 Z" fill="#000" opacity="0.7" /> <!-- Index -->
                    <path d="M 380 370 L 395 370 L 395 400 L 380 400 Z" fill="#000" opacity="0.7" /> <!-- Middle -->
                    <path d="M 385 420 L 400 420 L 400 450 L 385 450 Z" fill="#000" opacity="0.7" /> <!-- Ring -->
                    <path d="M 380 470 L 390 470 L 390 500 L 380 500 Z" fill="#000" opacity="0.7" /> <!-- Pinky -->
                    
                    <!-- Thumb on screen (Front) -->
                    <ellipse cx="160" cy="430" rx="25" ry="15" transform="rotate(-45 160 430)" fill="#000" opacity="0.6" />
                </g>

                <!-- 2. Cast Shadows (Hand onto Forearm/Background) -->
                <path d="M 300 500 Q 350 550 350 650 L 250 650 Z" fill="url(#skinShadow)" opacity="0.5" filter="url(#blurAO)" />

                <!-- 3. Screen Glow Reflection on Skin -->
                <!-- The thumb and palm should glow slightly from the screen light -->
                <g style="mix-blend-mode: screen; pointer-events: none;">
                    <!-- Glow on Thumb -->
                    <path d="M 160 450 Q 130 420 140 390 Q 150 380 165 400 Q 180 420 180 450 Z" fill="url(#screenGlow)" opacity="0.8" />
                    <!-- Glow on Palm edge -->
                    <path d="M 220 460 Q 250 500 300 540 L 280 600 Q 240 500 220 460 Z" fill="url(#screenGlow)" opacity="0.6" />
                </g>

                <!-- 4. Specular Highlights (Key Light) -->
                <g style="mix-blend-mode: overlay; pointer-events: none;">
                    <!-- Highlight on Knuckles (Fingers) -->
                    <circle cx="370" cy="335" r="4" fill="white" opacity="0.5" filter="blur(1px)" />
                    <circle cx="380" cy="385" r="4" fill="white" opacity="0.5" filter="blur(1px)" />
                    <circle cx="385" cy="435" r="4" fill="white" opacity="0.5" filter="blur(1px)" />
                    
                    <!-- Highlight on Thumb Tip -->
                    <ellipse cx="155" cy="410" rx="5" ry="10" transform="rotate(-45 155 410)" fill="white" opacity="0.4" filter="blur(1px)" />
                    
                    <!-- Highlight on Forearm -->
                    <path d="M 450 700 Q 400 600 380 500" stroke="white" stroke-width="8" fill="none" opacity="0.2" filter="blur(4px)" />
                </g>

            </svg>
        </div>

        <div class="editorial-text">
            Fig 1.0 — Haptic Interface Study<br>
            Composition & Lighting Revision
        </div>
    </div>

</body>
</html>
