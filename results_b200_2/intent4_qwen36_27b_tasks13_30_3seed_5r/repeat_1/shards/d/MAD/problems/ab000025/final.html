<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip (Revision 3.0)</title>
    <style>
        :root {
            --bg-deep: #050506;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Stage setup */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, #18181b 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Noise Texture */
        .grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Illustration */
        .illustration-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg.main-art {
            width: 100%;
            height: 100%;
            max-width: 600px; /* tighter crop */
            max-height: 900px;
            filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.5));
        }

        /* Typography - Subordinated */
        .editorial-text {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.25);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            z-index: 15;
            pointer-events: none;
            line-height: 1.4;
            font-weight: 400;
            opacity: 0.6;
            transform: translateY(5px);
            transition: opacity 0.5s ease;
        }
        
        .editorial-text:hover {
            opacity: 1;
        }
        
        .editorial-text span {
            display: block;
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="grain"></div>

        <div class="illustration-container">
            <!-- viewBox adjusted to center the composition -->
            <svg class="main-art" viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- ================= SKIN MATERIALS ================= -->
                    <!-- Complex skin gradient to simulate volume -->
                    <linearGradient id="skinVolume" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#EAC0A2" /> <!-- Highlight -->
                        <stop offset="35%" stop-color="#D49A78" /> <!-- Midtone -->
                        <stop offset="80%" stop-color="#8C5235" /> <!-- Shadow -->
                        <stop offset="100%" stop-color="#4A2515" /> <!-- Deep Shadow -->
                    </linearGradient>

                    <linearGradient id="skinDark" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#7A3B23" />
                        <stop offset="100%" stop-color="#3D1A0D" />
                    </linearGradient>

                    <!-- ================= DEVICE MATERIALS ================= -->
                    <!-- Titanium Frame -->
                    <linearGradient id="titaniumBody" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#5a5a5e" />
                        <stop offset="20%" stop-color="#2a2a2c" />
                        <stop offset="50%" stop-color="#111113" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <!-- Screen Content (Deep Blue Glow) -->
                    <radialGradient id="screenGlow" cx="50%" cy="50%" r="70%">
                        <stop offset="0%" stop-color="#aaddff" stop-opacity="0.9"/>
                        <stop offset="30%" stop-color="#4488ff" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                    </radialGradient>
                    
                    <!-- Glass Sheen -->
                    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.3)" />
                        <stop offset="15%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="85%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
                    </linearGradient>

                    <!-- Screen Reflection (Hand on Glass) -->
                    <linearGradient id="handReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                    </linearGradient>

                    <!-- ================= FILTERS ================= -->
                    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                    
                    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>

                    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="1.5"/>
                        </feComponentTransfer>
                    </filter>
                </defs>

                <!-- ================= BACKGROUND AMBIENT ================= -->
                <!-- Blue ambient light from screen -->
                <rect width="100%" height="100%" fill="url(#screenGlow)" opacity="0.1" style="mix-blend-mode: screen;"/>

                <!-- ================= THE DEVICE (BACK LAYER) ================= -->
                <!-- Centered, slightly tilted -->
                <g id="smartphone" transform="translate(250, 400) rotate(-15)">
                    
                    <!-- Device Body -->
                    <rect x="-70" y="-240" width="140" height="480" rx="24" fill="url(#titaniumBody)" stroke="#000" stroke-width="2" />
                    
                    <!-- Screen Area -->
                    <rect x="-66" y="-236" width="132" height="472" rx="20" fill="#010102" />
                    
                    <!-- Screen Glow Content -->
                    <rect x="-66" y="-236" width="132" height="472" rx="20" fill="url(#screenGlow)" opacity="0.9" />
                    
                    <!-- Hardware Details -->
                    <g id="camera-island">
                        <!-- Dynamic Island -->
                        <rect x="-30" y="-220" width="60" height="22" rx="11" fill="#000" />
                        <!-- Camera Lenses (Simulated Reflection) -->
                        <circle cx="-15" cy="-209" r="4" fill="#111" stroke="#222" stroke-width="0.5"/>
                        <circle cx="15" cy="-209" r="4" fill="#111" stroke="#222" stroke-width="0.5"/>
                        <!-- Glints -->
                        <circle cx="-16" cy="-210" r="1.5" fill="#fff" opacity="0.5"/>
                        <circle cx="14" cy="-210" r="1.5" fill="#fff" opacity="0.5"/>
                    </g>

                    <!-- Glass Reflections -->
                    <path d="M -65 -230 L 65 -50 L 65 100 L -65 230 Z" fill="url(#glassSheen)" style="mix-blend-mode: overlay;" />
                    
                    <!-- Bezel Highlight -->
                    <rect x="-66" y="-236" width="132" height="472" rx="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
                </g>

                <!-- ================= THE HAND (MID LAYER - BACK FINGERS) ================= -->
                <!-- Fingers wrapping around the RIGHT edge of the phone -->
                <g id="hand-back">
                    
                    <!-- Forearm/Wrist Connection -->
                    <path d="M 550 850 L 400 600 Q 350 500 320 450 L 480 550 L 600 900 Z" fill="url(#skinVolume)" />
                    <!-- Forearm Muscle Highlight -->
                    <path d="M 550 800 L 420 580" stroke="#EAC0A2" stroke-width="20" stroke-linecap="round" opacity="0.2" filter="url(#blurSoft)" />

                    <!-- 1. Index Finger -->
                    <g transform="translate(320, 310) rotate(20)">
                        <!-- Phalanx 1 (Proximal) -->
                        <path d="M 0 0 C 20 -10, 40 5, 40 20 L 10 20 C 10 5, 0 0, 0 0 Z" fill="url(#skinVolume)" />
                        <!-- Phalanx 2 (Middle) -->
                        <path d="M 35 15 C 55 5, 75 20, 75 30 L 45 30 C 45 20, 30 15, 35 15 Z" fill="url(#skinVolume)" />
                        <!-- Phalanx 3 (Distal) - Curving over edge -->
                        <path d="M 70 25 C 90 20, 105 30, 100 40 L 65 35 C 60 30, 65 25, 70 25 Z" fill="url(#skinVolume)" />
                        <!-- Nail -->
                        <ellipse cx="98" cy="33" rx="4" ry="2.5" fill="#e0cbb9" opacity="0.8" transform="rotate(-15 98 33)" />
                        <!-- Crease -->
                        <path d="M 35 15 Q 40 25 45 15" stroke="#5A2E1C" stroke-width="1.5" fill="none" opacity="0.6"/>
                    </g>

                    <!-- 2. Middle Finger -->
                    <g transform="translate(330, 360) rotate(15)">
                        <path d="M 0 0 C 25 -5, 45 10, 45 25 L 15 25 C 15 10, 0 0, 0 0 Z" fill="url(#skinVolume)" />
                        <path d="M 40 20 C 60 15, 80 30, 80 45 L 50 45 C 50 30, 30 25, 40 20 Z" fill="url(#skinVolume)" />
                        <path d="M 75 40 C 95 35, 110 50, 105 60 L 70 55 C 65 45, 70 40, 75 40 Z" fill="url(#skinVolume)" />
                        <!-- Nail -->
                        <ellipse cx="103" cy="48" rx="4" ry="2.5" fill="#e0cbb9" opacity="0.8" />
                    </g>

                    <!-- 3. Ring Finger -->
                    <g transform="translate(335, 410) rotate(10)">
                        <path d="M 0 0 C 20 -5, 40 10, 40 20 L 10 20 C 10 10, 0 0, 0 0 Z" fill="url(#skinVolume)" />
                        <path d="M 35 15 C 55 10, 75 25, 75 40 L 45 40 C 45 25, 25 20, 35 15 Z" fill="url(#skinVolume)" />
                        <path d="M 70 35 C 90 30, 105 45, 100 55 L 65 50 C 60 40, 65 35, 70 35 Z" fill="url(#skinVolume)" />
                        <!-- Nail -->
                        <ellipse cx="98" cy="46" rx="3.5" ry="2" fill="#e0cbb9" opacity="0.8" />
                    </g>

                    <!-- 4. Pinky Finger -->
                    <g transform="translate(335, 460) rotate(5)">
                        <path d="M 0 0 C 15 -5, 30 5, 30 15 L 5 15 C 5 5, 0 0, 0 0 Z" fill="url(#skinVolume)" />
                        <path d="M 25 10 C 40 5, 60 20, 60 30 L 35 30 C 35 20, 20 15, 25 10 Z" fill="url(#skinVolume)" />
                        <path d="M 55 25 C 70 20, 80 35, 75 45 L 50 40 C 45 35, 50 25, 55 25 Z" fill="url(#skinVolume)" />
                    </g>

                    <!-- Palm Base (Connecting fingers to wrist) -->
                    <!-- Volumetric curve -->
                    <path d="M 320 290 Q 400 320 420 480 L 500 580 L 340 530 Z" fill="url(#skinVolume)" />
                </g>

                <!-- ================= INTERACTION SHADOWS (DEPTH) ================= -->
                <!-- Shadows cast BY the back fingers ONTO the phone edge -->
                <g id="back-contact-shadows" filter="url(#contactShadow)" fill="#000" opacity="0.9">
                    <!-- Index Shadow -->
                    <path d="M 400 340 L 420 340 L 420 370 L 400 370 Z" transform="rotate(-15 250 400)" />
                    <!-- Middle Shadow -->
                    <path d="M 405 390 L 425 390 L 425 420 L 405 420 Z" transform="rotate(-15 250 400)" />
                    <!-- Ring Shadow -->
                    <path d="M 410 440 L 430 440 L 430 470 L 410 470 Z" transform="rotate(-15 250 400)" />
                    <!-- Pinky Shadow -->
                    <path d="M 410 490 L 425 490 L 425 520 L 410 520 Z" transform="rotate(-15 250 400)" />
                </g>

                <!-- ================= THE HAND (FRONT LAYER - THUMB) ================= -->
                <!-- Thumb overlapping the SCREEN -->
                <g id="hand-front">
                    
                    <!-- Thenar Eminence (Base muscle) -->
                    <path d="M 340 550 Q 260 520 240 470 Q 260 420 340 470 Z" fill="url(#skinDark)" opacity="0.95"/>
                    
                    <!-- Thumb Shaft (Proximal Phalanx) -->
                    <!-- Using bezier curves for smooth anatomical shape -->
                    <path d="M 320 530 Q 260 490 210 460 Q 180 440 190 420 Q 210 400 250 430 Q 300 470 340 530 Z" fill="url(#skinVolume)" />
                    
                    <!-- Thumb Tip (Distal Phalanx) -->
                    <path d="M 190 420 Q 160 380 170 350 Q 180 340 195 360 Q 210 380 210 420 Z" fill="url(#skinVolume)" />
                    
                    <!-- Thumb Nail -->
                    <ellipse cx="178" cy="365" rx="5" ry="9" transform="rotate(-45 178 365)" fill="#f5e6d8" opacity="0.85" />
                    <!-- Nail Specular Highlight -->
                    <ellipse cx="178" cy="363" rx="1.5" ry="4" transform="rotate(-45 178 363)" fill="#fff" opacity="0.7" />

                    <!-- Thumb Joint Crease -->
                    <path d="M 250 430 Q 230 410 220 420" stroke="#5A2E1C" stroke-width="2" fill="none" opacity="0.8" filter="url(#blurSoft)"/>
                </g>

                <!-- ================= LIGHTING & FINISHING TOUCHES ================= -->
                
                <!-- 1. Screen Glow Reflection on Thumb (Front) -->
                <path d="M 190 420 Q 160 380 170 350 Q 180 340 195 360 Q 210 380 210 420 Z" fill="url(#screenGlow)" style="mix-blend-mode: screen; opacity: 0.9;"/>
                
                <!-- 2. Screen Reflection of Thumb (On Glass) -->
                <!-- A faint ghost of the thumb on the screen surface -->
                <path d="M 190 420 Q 160 380 170 350 Q 180 340 195 360 Q 210 380 210 420 Z" fill="url(#handReflection)" transform="translate(10, -5)" style="mix-blend-mode: overlay; opacity: 0.8;" />

                <!-- 3. Cast Shadow of Thumb on Screen -->
                <ellipse cx="200" cy="430" rx="35" ry="12" transform="rotate(-45 200 430)" fill="#000" opacity="0.5" filter="url(#blurSoft)" />

                <!-- 4. Global Specular Highlights (Rim Light) -->
                <g style="mix-blend-mode: overlay; pointer-events: none;">
                    <!-- Knuckle Highlights (Subtle) -->
                    <circle cx="380" cy="330" r="3" fill="white" opacity="0.6" filter="blur(1px)" />
                    <circle cx="390" cy="380" r="3" fill="white" opacity="0.6" filter="blur(1px)" />
                    <circle cx="395" cy="430" r="3" fill="white" opacity="0.6" filter="blur(1px)" />
                    
                    <!-- Thumb Tip Highlight -->
                    <ellipse cx="180" cy="370" rx="3" ry="6" transform="rotate(-45 180 370)" fill="white" opacity="0.5" filter="blur(1px)" />
                    
                    <!-- Device Edge Highlight (Right side) -->
                    <line x1="310" y1="160" x2="310" y2="640" stroke="white" stroke-width="1" opacity="0.4" filter="blur(0.5px)" transform="rotate(-15 250 400)" />
                    
                    <!-- Device Top Edge Highlight -->
                    <line x1="180" y1="160" x2="320" y2="160" stroke="white" stroke-width="0.5" opacity="0.2" transform="rotate(-15 250 400)" />
                </g>

            </svg>
        </div>

        <div class="editorial-text">
            FIG 3.0 — VOLUMETRIC RECONSTRUCTION<br>
            <span>UNIFIED LIGHTING MODEL</span>
        </div>
    </div>

</body>
</html>
