<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip (Revision 2.0)</title>
    <style>
        :root {
            --bg-deep: #030304;
            --bg-surface: #121214;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Stage setup */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1d 0%, #050505 90%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Noise Texture */
        .grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Illustration */
        .illustration-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            /* Subtle float */
            animation: breathe 10s ease-in-out infinite;
            transform-origin: center center;
        }

        svg.main-art {
            width: 100%;
            height: 100%;
            display: block;
            max-width: 800px; /* Constraint for readability on ultra-wide */
            max-height: 1000px;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-5px); }
        }

        /* Typography */
        .editorial-text {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 15;
            pointer-events: none;
            line-height: 1.6;
            font-weight: 500;
        }
        
        .editorial-text span {
            display: block;
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="grain"></div>

        <div class="illustration-container">
            <!-- viewBox centered on the action -->
            <svg class="main-art" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- LIGHTING & MATERIALS -->

                    <!-- Skin Gradients -->
                    <!-- Base Skin: Rich, warm, complex -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E5C0A3" />
                        <stop offset="40%" stop-color="#C69C80" />
                        <stop offset="100%" stop-color="#8C5A45" />
                    </linearGradient>

                    <!-- Shadow Skin: Deep reds/browns -->
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#5E3020" />
                        <stop offset="100%" stop-color="#2A150D" />
                    </linearGradient>

                    <!-- Screen Glow: Cool blue/white contrast -->
                    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
                        <stop offset="0%" stop-color="#aaccff" stop-opacity="0.8"/>
                        <stop offset="40%" stop-color="#6699ff" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                    </radialGradient>
                    
                    <!-- Screen Reflection: Hand silhouette -->
                    <linearGradient id="handReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                    </linearGradient>

                    <!-- Device Materials -->
                    <linearGradient id="titaniumBody" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3a3a3d" />
                        <stop offset="50%" stop-color="#1a1a1c" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
                        <stop offset="20%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="80%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    
                    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="12" />
                    </filter>

                    <filter id="contactShadowBlur">
                        <feGaussianBlur stdDeviation="2" />
                    </filter>
                </defs>

                <!-- ================= BACKGROUND AMBIENT ================= -->
                <rect width="100%" height="100%" fill="url(#screenGlow)" opacity="0.15" style="mix-blend-mode: screen;"/>

                <!-- ================= THE DEVICE (BACK LAYER) ================= -->
                <!-- Positioned to be held. Tilted slightly. -->
                <g id="smartphone" transform="translate(280, 450) rotate(-12)">
                    
                    <!-- Device Body -->
                    <rect x="-80" y="-230" width="160" height="460" rx="28" fill="url(#titaniumBody)" stroke="#000" stroke-width="1" />
                    
                    <!-- Screen Area (Deep Black) -->
                    <rect x="-76" y="-226" width="152" height="452" rx="24" fill="#020203" />
                    
                    <!-- Screen Content (Abstract Glow) -->
                    <rect x="-76" y="-226" width="152" height="452" rx="24" fill="url(#screenGlow)" opacity="0.8" />
                    
                    <!-- Hardware Details -->
                    <g id="camera-island">
                        <!-- Dynamic Island / Notch -->
                        <rect x="-35" y="-215" width="70" height="24" rx="12" fill="#000" />
                        <!-- Lenses -->
                        <circle cx="-15" cy="-203" r="3.5" fill="#111" stroke="#333" stroke-width="0.5"/>
                        <circle cx="15" cy="-203" r="3.5" fill="#111" stroke="#333" stroke-width="0.5"/>
                        <!-- Glints -->
                        <circle cx="-16" cy="-204" r="1" fill="#fff" opacity="0.6"/>
                        <circle cx="14" cy="-204" r="1" fill="#fff" opacity="0.6"/>
                    </g>

                    <!-- Glass Reflections (Surface) -->
                    <path d="M -75 -220 L 75 -50 L 75 100 L -75 220 Z" fill="url(#glassSheen)" style="mix-blend-mode: overlay;" />
                    
                    <!-- Screen Edge Highlight (Bezel) -->
                    <rect x="-76" y="-226" width="152" height="452" rx="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
                </g>

                <!-- ================= THE HAND (MID LAYER - BACK FINGERS) ================= -->
                <!-- Fingers wrapping AROUND the right edge of the phone -->
                <g id="hand-back">
                    
                    <!-- Forearm/Wrist Connection (Bottom Right) -->
                    <path d="M 600 900 L 450 650 Q 420 550 400 500 L 550 600 L 700 900 Z" fill="url(#skinBase)" />
                    <!-- Forearm Highlight -->
                    <path d="M 600 800 L 480 600" stroke="#EAC0A2" stroke-width="15" stroke-linecap="round" opacity="0.15" filter="url(#blurSoft)" />

                    <!-- 1. Index Finger (Top) -->
                    <g transform="translate(360, 340) rotate(15)">
                        <!-- Phalanx 1 (Connected to palm) -->
                        <path d="M 0 0 C 30 -10, 50 10, 50 25 L 15 25 C 15 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <!-- Phalanx 2 -->
                        <path d="M 45 20 C 65 10, 85 25, 85 35 L 55 35 C 55 25, 40 20, 45 20 Z" fill="url(#skinBase)" />
                        <!-- Phalanx 3 (Tip) - Curving over edge -->
                        <path d="M 80 30 C 100 25, 115 35, 110 45 L 75 40 C 70 35, 75 30, 80 30 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="108" cy="38" rx="5" ry="3" fill="#e0cbb9" opacity="0.7" transform="rotate(-10 108 38)" />
                        <!-- Crease -->
                        <path d="M 45 20 Q 50 30 55 20" stroke="#8a5a42" stroke-width="1.5" fill="none" opacity="0.5"/>
                    </g>

                    <!-- 2. Middle Finger -->
                    <g transform="translate(370, 390) rotate(10)">
                        <path d="M 0 0 C 30 -5, 55 10, 55 25 L 20 25 C 20 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 50 20 C 70 15, 95 30, 95 45 L 60 45 C 60 30, 40 25, 50 20 Z" fill="url(#skinBase)" />
                        <path d="M 90 40 C 110 35, 125 50, 120 60 L 85 55 C 80 45, 85 40, 90 40 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="118" cy="48" rx="5" ry="3" fill="#e0cbb9" opacity="0.7" />
                    </g>

                    <!-- 3. Ring Finger -->
                    <g transform="translate(375, 440) rotate(5)">
                        <path d="M 0 0 C 25 -5, 50 10, 50 20 L 15 20 C 15 10, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 45 15 C 65 10, 85 25, 85 40 L 55 40 C 55 25, 35 20, 45 15 Z" fill="url(#skinBase)" />
                        <path d="M 80 35 C 100 30, 115 45, 110 55 L 75 50 C 70 40, 75 35, 80 35 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="108" cy="46" rx="4.5" ry="3" fill="#e0cbb9" opacity="0.7" />
                    </g>

                    <!-- 4. Pinky Finger -->
                    <g transform="translate(375, 490) rotate(0)">
                        <path d="M 0 0 C 20 -5, 40 5, 40 15 L 10 15 C 10 5, 0 0, 0 0 Z" fill="url(#skinBase)" />
                        <path d="M 35 10 C 50 5, 70 20, 70 30 L 45 30 C 45 20, 30 15, 35 10 Z" fill="url(#skinBase)" />
                        <path d="M 65 25 C 80 20, 90 35, 85 45 L 60 40 C 55 35, 60 25, 65 25 Z" fill="url(#skinBase)" />
                    </g>

                    <!-- Palm Base (Connecting fingers to wrist) -->
                    <path d="M 360 320 Q 450 350 480 500 L 550 600 L 380 550 Z" fill="url(#skinBase)" />
                </g>

                <!-- ================= INTERACTION SHADOWS (DEPTH) ================= -->
                <!-- Shadows cast BY the back fingers ONTO the phone edge -->
                <g id="back-contact-shadows" filter="url(#contactShadowBlur)" fill="#000" opacity="0.8">
                    <!-- Index Shadow -->
                    <path d="M 455 370 L 470 370 L 470 400 L 455 400 Z" />
                    <!-- Middle Shadow -->
                    <path d="M 460 420 L 475 420 L 475 450 L 460 450 Z" />
                    <!-- Ring Shadow -->
                    <path d="M 465 470 L 480 470 L 480 500 L 465 500 Z" />
                    <!-- Pinky Shadow -->
                    <path d="M 465 520 L 475 520 L 475 550 L 465 550 Z" />
                </g>

                <!-- ================= THE HAND (FRONT LAYER - THUMB) ================= -->
                <!-- Thumb overlapping the SCREEN -->
                <g id="hand-front">
                    
                    <!-- Thenar Eminence (Base muscle) -->
                    <path d="M 380 580 Q 300 550 280 500 Q 300 450 380 500 Z" fill="url(#skinShadow)" opacity="0.9"/>
                    
                    <!-- Thumb Shaft (Proximal Phalanx) -->
                    <path d="M 360 560 Q 300 520 250 490 Q 220 470 230 450 Q 250 430 290 460 Q 340 500 380 560 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Tip (Distal Phalanx) -->
                    <path d="M 230 450 Q 200 410 210 380 Q 220 370 235 390 Q 250 410 250 450 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Nail -->
                    <ellipse cx="218" cy="395" rx="6" ry="10" transform="rotate(-45 218 395)" fill="#f5e6d8" opacity="0.9" />
                    <!-- Nail Specular Highlight -->
                    <ellipse cx="218" cy="393" rx="2" ry="5" transform="rotate(-45 218 393)" fill="#fff" opacity="0.6" />

                    <!-- Thumb Joint Crease -->
                    <path d="M 290 460 Q 270 440 260 450" stroke="#7a4533" stroke-width="2" fill="none" opacity="0.7" filter="url(#blurSoft)"/>
                </g>

                <!-- ================= LIGHTING & FINISHING TOUCHES ================= -->
                
                <!-- 1. Screen Glow Reflection on Thumb (Front) -->
                <path d="M 230 450 Q 200 410 210 380 Q 220 370 235 390 Q 250 410 250 450 Z" fill="url(#screenGlow)" style="mix-blend-mode: screen; opacity: 0.8;"/>
                
                <!-- 2. Screen Reflection of Thumb (On Glass) -->
                <!-- A faint ghost of the thumb on the screen surface -->
                <path d="M 230 450 Q 200 410 210 380 Q 220 370 235 390 Q 250 410 250 450 Z" fill="url(#handReflection)" transform="translate(10, -5)" style="mix-blend-mode: overlay; opacity: 0.6;" />

                <!-- 3. Cast Shadow of Thumb on Screen -->
                <ellipse cx="240" cy="460" rx="40" ry="15" transform="rotate(-45 240 460)" fill="#000" opacity="0.4" filter="url(#blurSoft)" />

                <!-- 4. Global Specular Highlights (Rim Light) -->
                <g style="mix-blend-mode: overlay; pointer-events: none;">
                    <!-- Knuckle Highlights -->
                    <circle cx="430" cy="360" r="3" fill="white" opacity="0.5" filter="blur(1px)" />
                    <circle cx="440" cy="410" r="3" fill="white" opacity="0.5" filter="blur(1px)" />
                    <circle cx="445" cy="460" r="3" fill="white" opacity="0.5" filter="blur(1px)" />
                    
                    <!-- Thumb Tip Highlight -->
                    <ellipse cx="220" cy="400" rx="4" ry="8" transform="rotate(-45 220 400)" fill="white" opacity="0.4" filter="blur(1px)" />
                    
                    <!-- Device Edge Highlight (Right side) -->
                    <line x1="350" y1="220" x2="350" y2="680" stroke="white" stroke-width="1" opacity="0.3" filter="blur(0.5px)" transform="rotate(-12 300 450)" />
                </g>

            </svg>
        </div>

        <div class="editorial-text">
            FIG 2.1 — RECONSTRUCTED ANATOMY<br>
            <span>PHYSICAL CONTACT & MATERIAL UNIFICATION</span>
        </div>
    </div>

</body>
</html>
