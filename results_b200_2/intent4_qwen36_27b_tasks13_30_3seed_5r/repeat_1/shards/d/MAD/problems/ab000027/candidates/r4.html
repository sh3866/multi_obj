<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trifolium repens | Specimen Study</title>
    <style>
        :root {
            /* Palette: Botanical Paper & Ink */
            --bg-color: #F4F1EA; 
            --ink-color: #2F332E; 
            --accent-color: #5C6858; 
            --line-color: #8C9688;
            
            /* Typography */
            --font-serif: "Didot", "Bodoni MT", "Playfair Display", "Georgia", serif;
            --font-sans: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-sans);
            position: relative;
        }

        /* Paper Texture */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Container */
        .study-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Header --- */
        .header {
            position: absolute;
            top: 8vh;
            left: 5vw;
            z-index: 10;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--ink-color);
            margin-bottom: 0.5rem;
        }

        .metadata {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-color);
            display: block;
            opacity: 0.8;
            border-top: 1px solid var(--line-color);
            padding-top: 0.5rem;
            display: inline-block;
        }

        /* --- Illustration Area --- */
        .illustration-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg#specimen-svg {
            height: 80vh;
            width: auto;
            shape-rendering: geometricPrecision;
            filter: drop-shadow(0px 10px 15px rgba(45, 65, 45, 0.15));
        }

        /* --- Annotations --- */
        .annotation-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .annotation {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .annotation.delay-1 { animation-delay: 0.8s; }
        .annotation.delay-2 { animation-delay: 1.2s; }
        .annotation.delay-3 { animation-delay: 1.6s; }

        .annotation-label {
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.75rem;
            color: var(--ink-color);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .annotation-sub {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        /* Visual Anchors (Dots) */
        .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 2px var(--bg-color);
        }

        /* Responsive Positioning */
        @media (max-width: 768px) {
            .header {
                top: 5vh;
                left: 5vw;
            }
            .annotation {
                display: none; 
            }
            svg#specimen-svg {
                height: 60vh;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="grain-overlay"></div>

    <div class="study-container">
        
        <!-- Header -->
        <header class="header">
            <h1>Trifolium repens</h1>
            <span class="metadata">Specimen 042 • White Clover</span>
        </header>

        <!-- Illustration Area -->
        <div class="illustration-area" id="canvas">
            
            <!-- Scientific Annotations -->
            <div class="annotation-group">
                <!-- Serration Annotation -->
                <div class="annotation delay-1" style="top: 22%; right: 15%;">
                    <div class="annotation-label">Serration</div>
                    <div class="annotation-sub">Crenate margins</div>
                </div>

                <!-- Vein Structure Annotation -->
                <div class="annotation delay-2" style="top: 50%; left: 18%;">
                    <div class="annotation-label">Venation</div>
                    <div class="annotation-sub">Pinnate network</div>
                </div>

                <!-- Petiole Annotation -->
                <div class="annotation delay-3" style="bottom: 20%; right: 25%;">
                    <div class="annotation-label">Petiole</div>
                    <div class="annotation-sub">Texture: Glabrous</div>
                </div>
            </div>

            <!-- SVG Illustration -->
            <svg id="specimen-svg" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Lighting: Top Left -->
                    <!-- Stem Gradient: Subtle texture -->
                    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#5E7559;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#85A381;stop-opacity:1" /> <!-- Highlight -->
                        <stop offset="100%" style="stop-color:#3E563C;stop-opacity:1" /> <!-- Shadow -->
                    </linearGradient>

                    <!-- Leaf Gradient: Deep forest to vibrant yellow-green -->
                    <radialGradient id="leafGrad" cx="30%" cy="30%" r="80%">
                        <stop offset="0%" style="stop-color:#A8C69E;stop-opacity:1" /> <!-- Highlight -->
                        <stop offset="40%" style="stop-color:#6B8E6A;stop-opacity:1" /> <!-- Mid -->
                        <stop offset="100%" style="stop-color:#3B5238;stop-opacity:1" /> <!-- Deep Shadow -->
                    </radialGradient>

                    <!-- Vein Shadow Gradient -->
                    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#3E563C;stop-opacity:0.4" />
                        <stop offset="100%" style="stop-color:#3E563C;stop-opacity:0.1" />
                    </linearGradient>

                    <!-- Detailed Leaflet Path: Cordate (Heart) shape with organic serration -->
                    <!-- The path uses small bezier curves (C) to simulate natural crenate teeth -->
                    <path id="detailed-leaflet" d="
                        M 0,0 
                        C -10,-15 -25,-30 -35,-50 
                        C -45,-70 -55,-90 -50,-110 
                        C -48,-120 -45,-135 -40,-150
                        C -35,-165 -25,-175 -15,-175
                        C -10,-175 -5,-170 -5,-165
                        C -8,-165 -12,-168 -15,-172
                        C -18,-160 -18,-145 -15,-130
                        C -20,-135 -25,-145 -22,-155
                        C -25,-145 -25,-130 -20,-120
                        C -25,-115 -28,-110 -25,-100
                        C -28,-95 -30,-90 -25,-85
                        C -20,-85 -15,-80 -10,-75
                        C -5,-75 5,-75 10,-75
                        C 15,-80 20,-85 25,-85
                        C 30,-90 28,-95 25,-100
                        C 28,-110 25,-115 20,-120
                        C 25,-130 25,-145 22,-155
                        C 25,-145 20,-135 20,-130
                        C 23,-145 18,-165 15,-175
                        C 25,-175 35,-165 40,-150
                        C 45,-135 48,-120 50,-110
                        C 55,-90 45,-70 35,-50
                        C 25,-30 10,-15 0,0 Z
                    " fill="url(#leafGrad)" stroke="#3B5238" stroke-width="1"/>

                    <!-- Organic Vein Network -->
                    <g id="veins" fill="none" stroke="#3B5238" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
                        <!-- Midrib -->
                        <path d="M 0,-5 Q -2,-60 0,-165" stroke-width="2" stroke="url(#veinGrad)"/>
                        <!-- Lateral Veins (Left) -->
                        <path d="M -1,-20 Q -15,-30 -25,-45" stroke-width="1.2" />
                        <path d="M -2,-60 Q -20,-70 -35,-90" stroke-width="1.2" />
                        <path d="M -2,-100 Q -15,-110 -25,-130" stroke-width="1" />
                        <path d="M -3,-140 Q -10,-150 -15,-160" stroke-width="0.8" />
                        <!-- Lateral Veins (Right) -->
                        <path d="M 1,-20 Q 15,-30 25,-45" stroke-width="1.2" />
                        <path d="M 2,-60 Q 20,-70 35,-90" stroke-width="1.2" />
                        <path d="M 2,-100 Q 15,-110 25,-130" stroke-width="1" />
                        <path d="M 3,-140 Q 10,-150 15,-160" stroke-width="0.8" />
                    </g>

                    <!-- Chlorotic 'V' Marking (Common in White Clover) -->
                    <path id="v-marking" d="M 0,-50 L -10,-85 L 0,-78 L 10,-85 Z" fill="#E0F0E0" opacity="0.5" />
                </defs>

                <!-- Plant Group: Centered -->
                <g id="plant-group" transform="translate(400, 850)">
                    
                    <!-- Main Stem (Curved, textured) -->
                    <path d="M 0,0 C -60,-150 -40,-300 10,-450" fill="none" stroke="url(#stemGrad)" stroke-width="12" stroke-linecap="round"/>
                    
                    <!-- Secondary Stem (Detail) -->
                    <path d="M -10,-180 C -50,-170 -70,-190 -80,-220" fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
                    <use href="#detailed-leaflet" transform="translate(-80, -220) rotate(-45) scale(0.35)" />

                    <!-- The Clover Head (Tri-foliate) -->
                    <g transform="translate(10, -450)">
                        
                        <!-- Center Leaflet -->
                        <g transform="rotate(0) scale(1.2)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>

                        <!-- Left Leaflet -->
                        <g transform="rotate(-60) translate(-45, -5) rotate(10) scale(1.1)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>

                        <!-- Right Leaflet -->
                        <g transform="rotate(60) translate(45, -5) rotate(-10) scale(1.15)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>
                        
                        <!-- Center Node (Oxalis-like junction) -->
                        <circle cx="0" cy="0" r="5" fill="#3B5238" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const plantGroup = document.getElementById('plant-group');
            const canvas = document.getElementById('canvas');
            const annotations = document.querySelectorAll('.annotation');

            // --- 1. Dynamic Dots (No Lines) ---
            // We place visual anchors near the plant features based on screen coordinates
            
            function updateDots() {
                const svgEl = document.getElementById('specimen-svg');
                const svgRect = svgEl.getBoundingClientRect();
                
                // Define approximate visual targets based on the SVG viewBox (800x900)
                // mapped to the visible screen bounding box.
                
                // 1. Serration target: Top Right Leaflet edge
                // In SVG space approx: x=550, y=250
                const target1 = { 
                    x: svgRect.left + (svgRect.width * 0.72), 
                    y: svgRect.top + (svgRect.height * 0.30) 
                };
                
                // 2. Vein target: Center Leaflet midrib
                // In SVG space approx: x=400, y=450
                const target2 = { 
                    x: svgRect.left + (svgRect.width * 0.50), 
                    y: svgRect.top + (svgRect.height * 0.55) 
                };

                // 3. Petiole target: Stem curve
                // In SVG space approx: x=350, y=650
                const target3 = { 
                    x: svgRect.left + (svgRect.width * 0.45), 
                    y: svgRect.top + (svgRect.height * 0.75) 
                };

                const targets = [target1, target2, target3];

                // Clear existing dots
                const existingDots = document.querySelectorAll('.dot');
                existingDots.forEach(dot => dot.remove());

                // Create new dots
                targets.forEach((target, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    // Add slight animation delay matching text
                    dot.style.animation = `fadeIn 1.5s ease-out forwards ${1 + (index * 0.3)}s`;
                    dot.style.opacity = '0'; // Start hidden for animation
                    dot.style.left = target.x + 'px';
                    dot.style.top = target.y + 'px';
                    canvas.appendChild(dot);
                });
            }

            // Initial draw
            updateDots();
            // Redraw on resize
            window.addEventListener('resize', updateDots);

            // --- 2. Refined Parallax Logic ---
            // Subtle movement to simulate organic weight
            if (window.matchMedia("(min-width: 1025px)").matches && !('ontouchstart' in window)) {
                document.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const mouseX = (e.clientX - centerX) / (window.innerWidth / 2);
                    const mouseY = (e.clientY - centerY) / (window.innerHeight / 2);

                    // Subtle movement
                    const moveX = mouseX * 8; 
                    const moveY = mouseY * 8;
                    
                    // Subtle rotation
                    const rotate = mouseX * 1;

                    // Apply transform
                    // Base transform is translate(400, 850) inside SVG
                    plantGroup.style.transform = `translate(${400 + (moveX)}px, ${850 + (moveY)}px) rotate(${rotate}deg)`;
                });
            }
        });
    </script>
</body>
</html>
