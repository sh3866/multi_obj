<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trifolium repens | Specimen 042</title>
    <style>
        :root {
            /* Palette: Warm Paper & Ink */
            --bg-color: #F9F7F2; 
            --ink-color: #2C2C2C; 
            --accent-color: #6B705C; /* Muted Sage/Olive */
            --line-color: #A0A09A;
            
            /* Typography */
            --font-serif: "Didot", "Bodoni MT", "Playfair Display", "Georgia", serif;
            --font-sans: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-sans);
            position: relative;
        }

        /* Subtle Grain Texture for Paper Feel */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Container */
        .study-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 1600px;
        }

        /* --- Header --- */
        .header {
            position: absolute;
            top: 5vh;
            left: 5vw;
            z-index: 10;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 4vw, 4rem);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.02em;
            color: var(--ink-color);
        }

        .metadata {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            margin-top: 0.5rem;
            display: block;
            opacity: 0.8;
        }

        /* --- Illustration Area --- */
        .illustration-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg#specimen-svg {
            height: 85vh; /* Dominant scale */
            width: auto;
            shape-rendering: geometricPrecision;
            /* Flat 2D style, no drop shadow */
        }

        /* --- Annotations --- */
        .annotation-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .annotation {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            opacity: 0; /* Fade in via JS or CSS animation */
            animation: fadeIn 1.5s ease-out forwards;
        }

        .annotation.delay-1 { animation-delay: 0.5s; }
        .annotation.delay-2 { animation-delay: 0.8s; }
        .annotation.delay-3 { animation-delay: 1.1s; }

        .annotation-label {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 0.9rem;
            color: var(--ink-color);
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .annotation-sub {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--line-color);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Leader Lines */
        .leader-line {
            position: absolute;
            background-color: var(--line-color);
            height: 1px;
            transform-origin: left center;
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: var(--ink-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Responsive Positioning */
        @media (max-width: 768px) {
            .header {
                top: 4vh;
                left: 5vw;
            }
            .annotation {
                display: none; /* Simplify on mobile */
            }
            svg#specimen-svg {
                height: 60vh;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="grain-overlay"></div>

    <div class="study-container">
        
        <!-- Header -->
        <header class="header">
            <h1>Trifolium repens</h1>
            <span class="metadata">Specimen 042 — Botanical Study</span>
        </header>

        <!-- Illustration Area -->
        <div class="illustration-area" id="canvas">
            
            <!-- Scientific Annotations -->
            <div class="annotation-group">
                <!-- Serration Annotation -->
                <div class="annotation delay-1" style="top: 25%; right: 12%;">
                    <div class="annotation-label">Serration</div>
                    <div class="annotation-sub">Margins: Acute teeth</div>
                    <!-- Line will be positioned via JS -->
                </div>

                <!-- Vein Structure Annotation -->
                <div class="annotation delay-2" style="top: 55%; left: 15%;">
                    <div class="annotation-label">Vein Structure</div>
                    <div class="annotation-sub">Retain pattern</div>
                </div>

                <!-- Petiole Annotation -->
                <div class="annotation delay-3" style="bottom: 25%; right: 20%;">
                    <div class="annotation-label">Petiole</div>
                    <div class="annotation-sub">Curvature: Natural</div>
                </div>
            </div>

            <!-- SVG Illustration -->
            <svg id="specimen-svg" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients for organic depth -->
                    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" style="stop-color:#3E563C;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#557352;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#7A9E78;stop-opacity:1" />
                    </linearGradient>

                    <!-- Complex Leaf Gradient: Variegated green -->
                    <radialGradient id="leafGrad" cx="40%" cy="30%" r="90%">
                        <stop offset="0%" style="stop-color:#96B893;stop-opacity:1" /> <!-- Light center -->
                        <stop offset="60%" style="stop-color:#6B8E6A;stop-opacity:1" /> <!-- Mid tone -->
                        <stop offset="100%" style="stop-color:#4A6B47;stop-opacity:1" /> <!-- Dark edge -->
                    </radialGradient>

                    <!-- Vein Gradient -->
                    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#D0E8D0;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#D0E8D0;stop-opacity:0.2" />
                    </linearGradient>

                    <!-- Detailed Leaflet Path: Heart shape with organic serration -->
                    <!-- The path uses small lines (L) to simulate natural teeth rather than a jagged filter -->
                    <path id="detailed-leaflet" d="
                        M 0,0 
                        C -20,-30 -45,-60 -45,-90 
                        C -45,-115 -28,-138 -12,-155
                        L -16,-148 L -22,-155 L -12,-145 L -16,-135
                        C -5,-138 5,-138 15,-135
                        L 12,-142 L 18,-150 L 22,-158 L 28,-152
                        C 42,-130 52,-110 52,-90
                        C 52,-60 28,-30 12,-5
                        C 6,-5 3,-2 0,-10
                        C -3,-2 -6,-5 0,0 Z
                    " fill="url(#leafGrad)" stroke="#3E563C" stroke-width="0.5"/>

                    <!-- Veins Group -->
                    <g id="veins" fill="none" stroke="url(#veinGrad)" stroke-linecap="round">
                        <!-- Midrib -->
                        <path d="M 0,-5 Q -2,-60 0,-130" stroke-width="2.5" stroke="#C5E0C4"/>
                        <!-- Lateral Veins (Left) -->
                        <path d="M 0,-30 Q -15,-35 -25,-45" stroke-width="1.5" />
                        <path d="M -2,-70 Q -15,-75 -25,-90" stroke-width="1.5" />
                        <path d="M -2,-110 Q -10,-115 -15,-125" stroke-width="1" />
                        <!-- Lateral Veins (Right) -->
                        <path d="M 0,-50 Q 15,-55 25,-65" stroke-width="1.5" />
                        <path d="M 0,-90 Q 15,-95 25,-110" stroke-width="1.5" />
                        <path d="M 2,-110 Q 10,-115 15,-125" stroke-width="1" />
                    </g>

                    <!-- Chlorotic 'V' Marking (Common in White Clover) -->
                    <path id="v-marking" d="M 0,-45 L -14,-85 L 0,-75 L 14,-85 Z" fill="#E8F5E9" opacity="0.6" />
                </defs>

                <!-- Plant Group: Centered and Scaled -->
                <g id="plant-group" transform="translate(400, 850)">
                    
                    <!-- Main Stem (Curved) -->
                    <path d="M 0,0 C -50,-150 -50,-300 0,-450" fill="none" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round"/>
                    
                    <!-- Small Side Stem (Detail) -->
                    <path d="M -15,-150 C -40,-140 -60,-160 -70,-180" fill="none" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
                    <use href="#detailed-leaflet" transform="translate(-70, -180) rotate(-45) scale(0.4)" />

                    <!-- The Clover Head (Tri-foliate) -->
                    <g transform="translate(0, -450)">
                        
                        <!-- Center Leaflet -->
                        <g transform="rotate(0) scale(1.1)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>

                        <!-- Left Leaflet -->
                        <g transform="rotate(-55) translate(-40, -10) rotate(15) scale(1.0)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>

                        <!-- Right Leaflet -->
                        <g transform="rotate(55) translate(40, -10) rotate(-15) scale(1.05)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>
                        
                        <!-- Center Node -->
                        <circle cx="0" cy="0" r="6" fill="#3E563C" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const plantGroup = document.getElementById('plant-group');
            const canvas = document.getElementById('canvas');
            const annotations = document.querySelectorAll('.annotation');

            // --- 1. Dynamic Leader Lines ---
            // We draw lines from the text to the plant using SVG overlay or HTML elements
            // Here we create visual lines using HTML elements positioned absolutely
            
            function drawLines() {
                // Define targets relative to the SVG viewbox (0,0 is top left of SVG)
                // We need to map SVG coordinates to Screen coordinates
                const svgEl = document.getElementById('specimen-svg');
                const svgRect = svgEl.getBoundingClientRect();
                
                // Helper to map SVG coord (x,y) to Screen coord
                // The SVG viewBox is 800x900. 
                // Note: The plant is translated in SVG space. We need screen targets.
                // Let's approximate visual targets based on the layout:
                // 1. Serration (Top Right Leaflet edge)
                // 2. Vein (Center Leaflet midrib)
                // 3. Petiole (Stem curve)
                
                // Approximate percentages of the SVG's visible bounding box
                // 1. Serration target: ~75% width, ~30% height of SVG
                const target1 = { 
                    x: svgRect.left + (svgRect.width * 0.72), 
                    y: svgRect.top + (svgRect.height * 0.32) 
                };
                
                // 2. Vein target: ~40% width, ~60% height of SVG
                const target2 = { 
                    x: svgRect.left + (svgRect.width * 0.40), 
                    y: svgRect.top + (svgRect.height * 0.60) 
                };

                // 3. Petiole target: ~50% width, ~80% height of SVG
                const target3 = { 
                    x: svgRect.left + (svgRect.width * 0.50), 
                    y: svgRect.top + (svgRect.height * 0.80) 
                };

                const targets = [target1, target2, target3];

                annotations.forEach((ann, index) => {
                    const rect = ann.getBoundingClientRect();
                    const target = targets[index];

                    // Remove old lines if exist
                    const oldLine = ann.querySelector('.leader-line');
                    if (oldLine) oldLine.remove();
                    const oldDot = ann.querySelector('.dot');
                    if (oldDot) oldDot.remove();

                    // Create Dot at Target
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.style.left = target.x + 'px';
                    dot.style.top = target.y + 'px';
                    canvas.appendChild(dot);

                    // Create Line
                    const line = document.createElement('div');
                    line.className = 'leader-line';
                    
                    const startX = rect.right; // Start from right of text
                    const startY = rect.top + (rect.height / 2);
                    
                    const deltaX = target.x - startX;
                    const deltaY = target.y - startY;
                    
                    const length = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                    const angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI;

                    line.style.width = length + 'px';
                    line.style.left = startX + 'px';
                    line.style.top = startY + 'px';
                    line.style.transform = `rotate(${angle}deg)`;
                    
                    canvas.appendChild(line);
                });
            }

            // Initial draw
            drawLines();
            // Redraw on resize
            window.addEventListener('resize', drawLines);


            // --- 2. Refined Parallax Logic ---
            if (window.matchMedia("(min-width: 1025px)").matches && !('ontouchstart' in window)) {
                document.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const mouseX = (e.clientX - centerX) / (window.innerWidth / 2);
                    const mouseY = (e.clientY - centerY) / (window.innerHeight / 2);

                    // Subtle movement
                    const moveX = mouseX * 10; 
                    const moveY = mouseY * 10;
                    
                    // Subtle rotation
                    const rotate = mouseX * 1.5;

                    // Apply transform
                    // Base transform is translate(400, 850) inside SVG
                    // We apply CSS transform to the group to shift it relative to that
                    // Note: To keep it clean, we rely on the SVG viewBox scaling, 
                    // so we translate in SVG units roughly.
                    // 10px screen movement is roughly 10-15px in SVG space depending on scale.
                    
                    plantGroup.style.transform = `translate(${400 + (moveX * 2)}px, ${850 + (moveY * 2)}px) rotate(${rotate}deg)`;
                });
            }
        });
    </script>
</body>
</html>
