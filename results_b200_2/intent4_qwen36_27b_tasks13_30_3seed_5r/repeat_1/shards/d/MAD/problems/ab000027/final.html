<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trifolium repens | Specimen Study</title>
    <style>
        :root {
            /* Palette: Refined Botanical */
            --bg-color: #F2F0E9; /* Warmer, creamier paper tone */
            --ink-color: #242822; /* Deep charcoal/green-black for high contrast */
            --accent-color: #4A5D48; /* Muted sage for secondary text */
            --line-color: #8C9688;
            
            /* Typography */
            --font-serif: "Didot", "Bodoni MT", "Playfair Display", "Georgia", serif;
            --font-sans: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-sans);
            position: relative;
        }

        /* 
           CRITIQUE 1: Layering & Texture Isolation 
           We separate the background texture from the foreground specimen.
        */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            /* SVG Noise Filter applied here */
            filter: url(#paper-noise);
            background-color: var(--bg-color);
        }

        .specimen-layer {
            position: relative;
            z-index: 10; /* Sits on top of noise */
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Header --- */
        .header {
            position: absolute;
            top: 8vh;
            left: 5vw;
            z-index: 20;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--ink-color);
            margin-bottom: 0.8rem;
        }

        .metadata-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .metadata {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em; /* CRITIQUE 5: Increased tracking */
            color: var(--ink-color);
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .divider {
            width: 100%; /* CRITIQUE 5: Relative to title width */
            max-width: 200px;
            height: 1px;
            background-color: var(--ink-color);
            opacity: 0.5;
        }

        /* --- Illustration Area --- */
        .illustration-area {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg#specimen-svg {
            height: 85vh; /* CRITIQUE 4: Scaled up for presence */
            width: auto;
            shape-rendering: geometricPrecision;
            /* Clean vector finish - NO filter here */
        }

        /* --- Annotations --- */
        .annotation-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .annotation {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .annotation.delay-1 { animation-delay: 0.8s; }
        .annotation.delay-2 { animation-delay: 1.2s; }
        .annotation.delay-3 { animation-delay: 1.6s; }

        .annotation-label {
            font-family: var(--font-sans);
            font-weight: 700; /* CRITIQUE 5: Increased weight */
            font-size: 0.7rem;
            color: var(--ink-color); /* CRITIQUE 5: Darker ink */
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .annotation-sub {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        /* Visual Anchors (Dots) */
        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--ink-color); /* High contrast dot */
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 4px var(--bg-color); /* Halo effect */
            z-index: 15;
        }

        /* Responsive Positioning */
        @media (max-width: 768px) {
            .header {
                top: 5vh;
                left: 5vw;
            }
            h1 { font-size: 2rem; }
            .annotation { display: none; }
            svg#specimen-svg { height: 60vh; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- CRITIQUE 1: Isolated Background Texture Layer -->
    <div class="bg-layer">
        <!-- The noise filter is defined in the main SVG defs but applied here via CSS -->
    </div>

    <!-- CRITIQUE 1: Clean Specimen Layer -->
    <div class="specimen-layer">
        
        <!-- Header -->
        <header class="header">
            <h1>Trifolium repens</h1>
            <div class="metadata-container">
                <span class="metadata">Specimen 042 • White Clover</span>
                <div class="divider"></div>
            </div>
        </header>

        <!-- Illustration Area -->
        <div class="illustration-area" id="canvas">
            
            <!-- Scientific Annotations -->
            <div class="annotation-group">
                <!-- Serration Annotation -->
                <div class="annotation delay-1" style="top: 18%; right: 12%;">
                    <div class="annotation-label">Serration</div>
                    <div class="annotation-sub">Crenate margins</div>
                </div>

                <!-- Vein Structure Annotation -->
                <div class="annotation delay-2" style="top: 45%; left: 15%;">
                    <div class="annotation-label">Venation</div>
                    <div class="annotation-sub">Pinnate network</div>
                </div>

                <!-- Petiole Annotation -->
                <div class="annotation delay-3" style="bottom: 15%; right: 20%;">
                    <div class="annotation-label">Petiole</div>
                    <div class="annotation-sub">Texture: Glabrous</div>
                </div>
            </div>

            <!-- SVG Illustration -->
            <svg id="specimen-svg" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- CRITIQUE 1: Noise Filter for Background Only -->
                    <filter id="paper-noise">
                        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" stitchTiles="stitch"/>
                        <feColorMatrix type="saturate" values="0" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.12" /> <!-- Subtle opacity -->
                        </feComponentTransfer>
                        <feBlend in="SourceGraphic" mode="multiply" />
                    </filter>

                    <!-- CRITIQUE 3: Layered Palette -->
                    <!-- Deep Forest Green (Shadow) to Lime Green (Highlight) -->
                    <radialGradient id="leafGrad" cx="35%" cy="35%" r="75%">
                        <stop offset="0%" style="stop-color:#AED581;stop-opacity:1" /> <!-- Bright Lime Highlight -->
                        <stop offset="40%" style="stop-color:#558B2F;stop-opacity:1" /> <!-- Mid Green -->
                        <stop offset="85%" style="stop-color:#1B5E20;stop-opacity:1" /> <!-- Deep Forest Shadow -->
                        <stop offset="100%" style="stop-color:#0D3B13;stop-opacity:1" /> <!-- Edge Shadow -->
                    </radialGradient>

                    <!-- Variegation Overlay (Natural white patch) -->
                    <radialGradient id="variegationGrad" cx="50%" cy="40%" r="50%">
                        <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
                    </radialGradient>

                    <!-- CRITIQUE 2: Tapering Veins -->
                    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:0.7" /> <!-- Thick/Dark Base -->
                        <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:0.1" /> <!-- Thin/Faint Tip -->
                    </linearGradient>

                    <!-- Stem Gradient -->
                    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#33691E;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#689F38;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
                    </linearGradient>

                    <!-- CRITIQUE 2: Botanical Geometry (Crenate Serration) -->
                    <!-- A complex path with small bezier "bites" to simulate scalloped edges -->
                    <path id="detailed-leaflet" d="
                        M 0,0 
                        C -15,-15 -35,-35 -45,-60 
                        C -50,-65 -45,-75 -35,-75 C -38,-65 -35,-60 -30,-55
                        C -45,-65 -50,-80 -40,-95 C -42,-85 -38,-80 -35,-75
                        C -50,-90 -50,-110 -35,-125 C -40,-115 -35,-110 -30,-105
                        C -40,-120 -35,-140 -20,-155 C -25,-145 -20,-140 -18,-135
                        C -20,-150 -10,-165 0,-170 C -5,-160 -5,-155 -5,-150
                        C 0,-155 5,-155 10,-150
                        C 5,-160 5,-165 0,-170 C 10,-165 20,-150 20,-135
                        C 18,-140 25,-145 30,-155 C 20,-140 15,-120 30,-105
                        C 35,-110 40,-115 40,-95 C 45,-80 50,-65 30,-55
                        C 35,-60 38,-65 42,-75 C 50,-75 55,-65 50,-60
                        C 40,-35 20,-15 0,0 Z
                    " fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="1.5" stroke-opacity="0.5"/>

                    <!-- CRITIQUE 2: Integrated Vein Structure -->
                    <g id="veins" fill="none" stroke="url(#veinGrad)" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Midrib: Thickest at base -->
                        <path d="M 0,-5 Q -5,-60 0,-160" stroke-width="3" />
                        
                        <!-- Lateral Veins Left: Tapering -->
                        <path d="M -1,-25 Q -20,-40 -35,-60" stroke-width="2" />
                        <path d="M -2,-65 Q -25,-80 -40,-95" stroke-width="1.5" />
                        <path d="M -2,-105 Q -15,-120 -25,-135" stroke-width="1" />
                        <path d="M -3,-145 Q -10,-155 -15,-160" stroke-width="0.5" />
                        
                        <!-- Lateral Veins Right: Tapering -->
                        <path d="M 1,-25 Q 20,-40 35,-60" stroke-width="2" />
                        <path d="M 2,-65 Q 25,-80 40,-95" stroke-width="1.5" />
                        <path d="M 2,-105 Q 15,-120 25,-135" stroke-width="1" />
                        <path d="M 3,-145 Q 10,-155 15,-160" stroke-width="0.5" />
                    </g>

                    <!-- Variegation Marking -->
                    <path id="v-marking" d="M 0,-60 L -12,-100 L 0,-90 L 12,-100 Z" fill="url(#variegationGrad)" opacity="0.8" />
                </defs>

                <!-- CRITIQUE 4: Centered Composition -->
                <g id="plant-group" transform="translate(400, 800)">
                    
                    <!-- Main Stem (Curved, textured) -->
                    <!-- Using a slightly thicker stroke for presence -->
                    <path d="M 0,0 C -50,-150 -30,-300 10,-420" fill="none" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round"/>
                    
                    <!-- Secondary Stem (Detail) -->
                    <path d="M -8,-180 C -60,-170 -80,-190 -90,-230" fill="none" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
                    <use href="#detailed-leaflet" transform="translate(-90, -230) rotate(-45) scale(0.4)" />

                    <!-- The Clover Head (Tri-foliate) -->
                    <g transform="translate(10, -420)">
                        
                        <!-- Center Leaflet -->
                        <g transform="rotate(0) scale(1.3)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>

                        <!-- Left Leaflet -->
                        <g transform="rotate(-55) translate(-45, -5) rotate(10) scale(1.2)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>

                        <!-- Right Leaflet -->
                        <g transform="rotate(55) translate(45, -5) rotate(-10) scale(1.25)">
                            <use href="#detailed-leaflet" />
                            <use href="#veins" />
                            <use href="#v-marking" />
                        </g>
                        
                        <!-- Center Node -->
                        <circle cx="0" cy="0" r="6" fill="#1B5E20" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const plantGroup = document.getElementById('plant-group');
            const canvas = document.getElementById('canvas');
            const annotations = document.querySelectorAll('.annotation');

            // --- 1. Dynamic Dots (No Lines) ---
            // We place visual anchors near the plant features based on screen coordinates
            
            function updateDots() {
                const svgEl = document.getElementById('specimen-svg');
                const svgRect = svgEl.getBoundingClientRect();
                
                // Define approximate visual targets based on the SVG viewBox (800x900)
                // mapped to the visible screen bounding box.
                
                // 1. Serration target: Top Right Leaflet edge
                const target1 = { 
                    x: svgRect.left + (svgRect.width * 0.68), 
                    y: svgRect.top + (svgRect.height * 0.28) 
                };
                
                // 2. Vein target: Center Leaflet midrib
                const target2 = { 
                    x: svgRect.left + (svgRect.width * 0.50), 
                    y: svgRect.top + (svgRect.height * 0.50) 
                };

                // 3. Petiole target: Stem curve
                const target3 = { 
                    x: svgRect.left + (svgRect.width * 0.46), 
                    y: svgRect.top + (svgRect.height * 0.72) 
                };

                const targets = [target1, target2, target3];

                // Clear existing dots
                const existingDots = document.querySelectorAll('.dot');
                existingDots.forEach(dot => dot.remove());

                // Create new dots
                targets.forEach((target, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    // Add slight animation delay matching text
                    dot.style.animation = `fadeIn 1.5s ease-out forwards ${1 + (index * 0.3)}s`;
                    dot.style.opacity = '0'; // Start hidden for animation
                    dot.style.left = target.x + 'px';
                    dot.style.top = target.y + 'px';
                    canvas.appendChild(dot);
                });
            }

            // Initial draw
            updateDots();
            // Redraw on resize
            window.addEventListener('resize', updateDots);

            // --- 2. Refined Parallax Logic ---
            // Subtle movement to simulate organic weight
            if (window.matchMedia("(min-width: 1025px)").matches && !('ontouchstart' in window)) {
                document.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const mouseX = (e.clientX - centerX) / (window.innerWidth / 2);
                    const mouseY = (e.clientY - centerY) / (window.innerHeight / 2);

                    // Subtle movement
                    const moveX = mouseX * 10; 
                    const moveY = mouseY * 10;
                    
                    // Subtle rotation
                    const rotate = mouseX * 1.5;

                    // Apply transform
                    // Base transform is translate(400, 800) inside SVG
                    plantGroup.style.transform = `translate(${400 + (moveX)}px, ${800 + (moveY)}px) rotate(${rotate}deg)`;
                });
            }
        });
    </script>
</body>
</html>
