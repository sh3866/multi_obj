<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veilbound</title><style>*{box-sizing:border-box}body{margin:0;background:#100d1a;color:#f1edf8;font:14px Inter,system-ui,sans-serif;overflow:hidden}.app{height:768px;background:radial-gradient(circle at 55% 35%,#282042 0,#100d1a 55%);display:grid;grid-template-rows:68px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #3b3154;background:#151021cc}.brand{font:700 20px Georgia,serif;letter-spacing:.18em}.brand b{color:#d7a9ff}.resources{display:flex;gap:12px}.chip{padding:8px 13px;border:1px solid #44385d;border-radius:99px;color:#b8accd;font-size:11px}.chip strong{color:#fff}.main{display:grid;grid-template-columns:270px 1fr 270px;gap:18px;padding:20px 24px 24px;min-height:0}.panel{border:1px solid #3a3050;background:#171222d9;border-radius:14px;padding:16px;min-height:0}.panel h2{font:700 14px Georgia,serif;letter-spacing:.1em;margin:0 0 4px}.muted{font-size:11px;color:#807491;margin-bottom:15px}.spirits{display:grid;gap:9px}.spirit{position:relative;border:1px solid #3a3150;background:#20192d;border-radius:10px;padding:11px;display:grid;grid-template-columns:42px 1fr;gap:10px;cursor:pointer}.spirit.selected{border-color:#c48df0;background:#2b2040}.orb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 26%,#241633 70%);font-size:20px;box-shadow:0 0 18px color-mix(in srgb,var(--c),transparent 55%)}.spirit strong{display:block;font-size:12px}.spirit small{color:#8f829f;font-size:10px}.lvl{position:absolute;right:8px;top:8px;color:#d1b3e8;font-size:9px}.summon{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#bc85e7;color:#1a1021;font-weight:900;cursor:pointer}.arena{position:relative;border:1px solid #3a3150;border-radius:14px;overflow:hidden;background:linear-gradient(#19142a88,#19142ae8),repeating-linear-gradient(90deg,transparent 0 49px,#5b467417 50px),repeating-linear-gradient(0deg,transparent 0 49px,#5b467417 50px)}.arena:after{content:'';position:absolute;left:10%;right:10%;bottom:105px;height:70px;border:1px solid #68518155;border-radius:50%;transform:perspective(300px) rotateX(58deg);box-shadow:0 0 45px #a76fd82c}.banner{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;z-index:2}.name small{display:block;color:#8b7e9f;font-size:9px;letter-spacing:.12em}.name strong{font:700 15px Georgia,serif}.health{width:170px;height:7px;background:#372c46;border-radius:9px;margin-top:6px;overflow:hidden}.health i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#d04f76,#fa929c);transition:.4s}.enemy{position:absolute;right:20%;top:28%;text-align:center}.enemyBody{font-size:96px;filter:drop-shadow(0 0 22px #e14e7c66);animation:float 2.8s ease-in-out infinite}.ally{position:absolute;left:20%;bottom:25%;text-align:center;opacity:.15;transform:scale(.8);transition:.45s}.ally.active{opacity:1;transform:scale(1)}.allyBody{font-size:82px;filter:drop-shadow(0 0 22px #b981ef88);animation:float 2.3s ease-in-out infinite}.unitLabel{font-size:11px;font-weight:800;background:#181121bb;border:1px solid #4a385e;border-radius:12px;padding:5px 9px}.circle{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);width:165px;height:54px;border:1px solid #c798e866;border-radius:50%;box-shadow:0 0 25px #bd7be955,inset 0 0 25px #bd7be933;opacity:0;transition:.3s}.circle.on{opacity:1;animation:pulse .8s ease}.actions{display:grid;gap:8px;margin-top:12px}button.action{padding:12px;border:1px solid #443653;background:#241b31;color:#eee7f6;border-radius:8px;text-align:left;cursor:pointer}.action strong{display:block;font-size:12px}.action small{color:#9686a6}.action:disabled{opacity:.4}.battle{background:#d25778!important;border-color:#d25778!important;color:#fff!important}.log{height:174px;overflow:hidden;font:11px/1.55 ui-monospace,monospace;color:#b8a9c8;border-top:1px solid #392e49;padding-top:12px}.log b{color:#d7a9ff}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.25);opacity:.5}}</style></head><body><div class="app"><header class="top"><div class="brand">VEIL<b>BOUND</b></div><div class="resources"><span class="chip">AETHER <strong id="mana">6 / 6</strong></span><span class="chip">SHARDS <strong id="shards">120</strong></span></div></header><main class="main"><aside class="panel"><h2>SPIRIT GRIMOIRE</h2><div class="muted">Choose a bonded companion</div><div class="spirits" id="spirits"></div><button class="summon" id="summon">Summon selected spirit</button></aside><section class="arena"><div class="banner"><div class="name"><small>ENCOUNTER</small><strong>Thornveil Warden</strong><div class="health"><i id="hp"></i></div></div><div class="name" style="text-align:right"><small>ENEMY INTENT</small><strong id="intent">Charging · 8 damage</strong></div></div><div class="enemy"><div class="enemyBody">♜</div><span class="unitLabel">WARDEN · LV. 4</span></div><div class="ally" id="ally"><div class="allyBody" id="allyBody">✦</div><span class="unitLabel" id="allyLabel">NO SPIRIT</span></div><div class="circle" id="circle"></div></section><aside class="panel"><h2>SPIRIT COMMANDS</h2><div class="muted" id="role">Summon a spirit to reveal its abilities.</div><div class="actions"><button class="action battle" id="battle" disabled><strong>Battle — basic assault</strong><small>Deal spirit-scaled damage</small></button><button class="action" id="skill" disabled><strong id="skillName">Signature skill</strong><small id="skillDesc">Unique to each spirit</small></button><button class="action" id="focus" disabled><strong>Focus bond</strong><small>Restore 2 aether · improve next action</small></button></div><h2 style="margin-top:20px">BATTLE CHRONICLE</h2><div class="log" id="log">The veil is quiet.<br>Select a spirit from the grimoire.</div></aside></main></div><script>(()=>{'use strict';const spirits=[{name:'Emberfox',icon:'✦',color:'#ff7b67',role:'Aggressive · hunts the weakest target',skill:'Cinder Rush',desc:'18 damage and Burn',power:12},{name:'Mosswarden',icon:'❈',color:'#65d29a',role:'Guardian · protects allies and moves obstacles',skill:'Rootbind',desc:'Stun enemy; reveal puzzle paths',power:8},{name:'Tidewisp',icon:'◈',color:'#6bbcff',role:'Adaptive · copies elemental weaknesses',skill:'Echo Current',desc:'Chain attack and restore aether',power:10}];let selected=0,active=null,mana=6,enemyHP=100,turn=0,busy=false,levels=[1,1,1],xp=[0,0,0];const list=document.querySelector('#spirits'),log=document.querySelector('#log');function renderList(){list.innerHTML='';spirits.forEach((s,i)=>{const d=document.createElement('div');d.className='spirit '+(i===selected?'selected':'');d.innerHTML=`<div class="orb" style="--c:${s.color}">${s.icon}</div><div><strong>${s.name}</strong><small>${s.role.split(' · ')[0]}</small></div><span class="lvl">LV.${levels[i]}</span>`;d.onclick=()=>{if(busy)return;selected=i;renderList()};list.append(d)})}function write(t){log.innerHTML=`<b>›</b> ${t}<br>`+log.innerHTML.split('<br>').slice(0,7).join('<br>')}function summon(){if(busy)return;if(mana<2){write('Not enough aether. Focus your bond.');return}busy=true;mana-=2;active=selected;document.querySelector('#mana').textContent=`${mana} / 6`;const s=spirits[active],ally=document.querySelector('#ally'),circle=document.querySelector('#circle');document.querySelector('#allyBody').textContent=s.icon;document.querySelector('#allyBody').style.color=s.color;document.querySelector('#allyLabel').textContent=`${s.name.toUpperCase()} · LV. ${levels[active]}`;document.querySelector('#role').textContent=s.role;document.querySelector('#skillName').textContent=s.skill;document.querySelector('#skillDesc').textContent=s.desc;circle.classList.add('on');setTimeout(()=>{ally.classList.add('active');circle.classList.remove('on');busy=false;enable();write(`${s.name} crossed the veil. Bond established.`)},450)}function enable(){for(const id of['battle','skill','focus'])document.querySelector('#'+id).disabled=active===null||busy}function attack(special=false){if(active===null||busy)return;const cost=special?2:0;if(mana<cost){write('Insufficient aether for that ability.');return}busy=true;mana-=cost;const s=spirits[active],damage=s.power+levels[active]*2+(special?8:0);enemyHP=Math.max(0,enemyHP-damage);document.querySelector('#mana').textContent=`${mana} / 6`;document.querySelector('#hp').style.width=enemyHP+'%';document.querySelector('.enemyBody').animate([{transform:'translateX(0)'},{transform:'translateX(18px)',filter:'brightness(2)'},{transform:'translateX(0)'}],{duration:380});write(`${s.name} used ${special?s.skill:'Spirit Strike'} for ${damage} damage.`);turn++;xp[active]+=special?20:12;if(xp[active]>=40){xp[active]-=40;levels[active]++;write(`${s.name} reached level ${levels[active]} — power increased.`);renderList();document.querySelector('#allyLabel').textContent=`${s.name.toUpperCase()} · LV. ${levels[active]}`}setTimeout(()=>{if(enemyHP===0){write('Warden purified! 35 shards recovered.');document.querySelector('#intent').textContent='DEFEATED';document.querySelector('#shards').textContent='155'}else{document.querySelector('#intent').textContent=turn%2?'Guarding · armor up':'Charging · 8 damage';write(turn%2?'The Warden raises thorn armor.':'The Warden attacks; your spirit intercepts.')}busy=false;enable()},500)}document.querySelector('#summon').onclick=summon;document.querySelector('#battle').onclick=()=>attack(false);document.querySelector('#skill').onclick=()=>attack(true);document.querySelector('#focus').onclick=()=>{if(active===null||busy)return;mana=Math.min(6,mana+2);document.querySelector('#mana').textContent=`${mana} / 6`;write(`${spirits[active].name} focuses the bond. Aether restored.`)};renderList()})();</script></body></html>
