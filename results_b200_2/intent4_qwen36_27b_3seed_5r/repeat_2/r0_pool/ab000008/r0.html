<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Game</title>
    <style>
        :root {
            --c-bg: #050011;
            --c-grid: #2b004f;
            --c-sun-top: #ffcc00;
            --c-sun-bot: #ff0055;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-hit: #ffffff;
            --font-main: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND LAYERS --- */
        
        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        /* 2. The Retro Sun */
        .sun-container {
            position: absolute;
            bottom: 35%; /* Sits on the horizon */
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 300px;
            height: 300px;
            background: linear-gradient(to bottom, var(--c-sun-top), var(--c-sun-bot));
            border-radius: 50%;
            box-shadow: 0 0 40px var(--c-sun-bot), 0 0 80px var(--c-sun-top);
            position: relative;
            mask-image: linear-gradient(to bottom, 
                black 0%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 55%, 
                transparent 55%, transparent 60%, 
                black 60%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 75%, 
                transparent 75%, transparent 80%, 
                black 80%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 95%, 
                transparent 95%, transparent 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 55%, 
                transparent 55%, transparent 60%, 
                black 60%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 75%, 
                transparent 75%, transparent 80%, 
                black 80%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 95%, 
                transparent 95%, transparent 100%
            );
        }

        /* 3. The Grid Floor (Perspective) */
        .grid-container {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 40%;
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 100%), /* Fade into void */
                linear-gradient(90deg, var(--c-grid) 1px, transparent 1px),
                linear-gradient(0deg, var(--c-grid) 1px, transparent 1px);
            background-size: 
                40px 40px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            box-shadow: 0 -20px 50px rgba(255, 0, 85, 0.2);
            animation: gridScroll 1s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        /* --- GAME HIGHWAY (UI) --- */
        
        .highway-wrapper {
            position: relative;
            z-index: 10;
            width: 400px;
            height: 500px;
            display: flex;
            justify-content: center;
            /* Slight tilt to match perspective */
            transform: perspective(800px) rotateX(15deg); 
            transform-origin: bottom center;
            margin-bottom: 50px;
        }

        .highway {
            width: 200px;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-left: 2px solid var(--c-cyan);
            border-right: 2px solid var(--c-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .lane {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Lane Colors on Hover/Active */
        .lane:nth-child(1):hover { background: rgba(255, 0, 255, 0.1); }
        .lane:nth-child(2):hover { background: rgba(0, 243, 255, 0.1); }
        .lane:nth-child(3):hover { background: rgba(0, 255, 102, 0.1); }
        .lane:nth-child(4):hover { background: rgba(255, 230, 0, 0.1); }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--c-hit);
            box-shadow: 0 0 10px var(--c-cyan), 0 0 20px var(--c-cyan);
            z-index: 12;
        }

        /* The Falling Notes (CSS Animation) */
        .note {
            position: absolute;
            width: 100%;
            height: 20px;
            border-radius: 4px;
            box-shadow: 0 0 10px currentColor;
            opacity: 0.8;
        }

        /* Keyframes for notes */
        @keyframes fall {
            0% { top: -20px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Specific Note Styles */
        .n1 { background-color: var(--c-magenta); color: var(--c-magenta); animation: fall 2s linear infinite; top: -20px; }
        .n2 { background-color: var(--c-cyan); color: var(--c-cyan); animation: fall 2s linear infinite 0.5s; top: -20px; }
        .n3 { background-color: var(--c-green); color: var(--c-green); animation: fall 2s linear infinite 1.2s; top: -20px; }
        .n4 { background-color: var(--c-yellow); color: var(--c-yellow); animation: fall 2s linear infinite 0.8s; top: -20px; }

        /* --- TYPOGRAPHY & CONTROLS --- */

        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-bottom: -100px; /* Pull up over the grid */
            pointer-events: none; /* Let clicks pass through to start button */
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -4px;
            color: #fff;
            text-shadow: 
                3px 3px 0px var(--c-magenta),
                -2px -2px 0px var(--c-cyan);
            font-weight: 900;
            /* Pixelated text rendering trick */
            shape-outside: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            filter: drop-shadow(0 0 15px rgba(255, 0, 255, 0.6));
        }

        h1 span {
            display: block;
            font-size: 2rem;
            letter-spacing: 10px;
            color: var(--c-cyan);
            text-shadow: 2px 2px 0 var(--c-magenta);
            margin-top: 10px;
        }

        /* Glitch Animation for Title */
        h1 {
            animation: glitch 3s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .start-btn {
            pointer-events: auto;
            background: transparent;
            border: 4px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: var(--font-main);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            box-shadow: 0 0 15px var(--c-cyan), inset 0 0 15px var(--c-cyan);
            margin-top: 20px;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--c-cyan), inset 0 0 30px var(--c-cyan);
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 50%, black 150%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    <div class="grid-container"></div>
    
    <!-- UI Layer -->
    <div class="highway-wrapper">
        <div class="highway">
            <!-- 4 Lanes -->
            <div class="lane">
                <div class="note n1"></div>
                <div class="note n1" style="animation-delay: 2.5s"></div>
            </div>
            <div class="lane">
                <div class="note n2"></div>
                <div class="note n2" style="animation-delay: 2.2s"></div>
            </div>
            <div class="lane">
                <div class="note n3"></div>
                <div class="note n3" style="animation-delay: 1.8s"></div>
            </div>
            <div class="lane">
                <div class="note n4"></div>
                <div class="note n4" style="animation-delay: 2.8s"></div>
            </div>
            <!-- Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- Content -->
    <div class="content-layer">
        <h1>
            PIXEL<br>DANCE
            <span>RHYTHM PROTOCOL</span>
        </h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 150;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.6), // Only in top 60%
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() * 2
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3; // Twinkle
                ctx.beginPath();
                ctx.rect(star.x, star.y, star.size, star.size); // Square pixels
                ctx.fill();
                
                // Move stars (warp effect)
                star.y += star.z * 0.5;
                if (star.y > height * 0.6) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Simple visual feedback on click
            btn.innerHTML = "LOADING...";
            btn.style.background = "var(--c-magenta)";
            btn.style.borderColor = "var(--c-magenta)";
            btn.style.boxShadow = "0 0 30px var(--c-magenta)";
            btn.style.color = "#fff";
            
            // Simulate loading then reset for demo purposes
            setTimeout(() => {
                alert("INITIALIZING RHYTHM ENGINE...");
                btn.innerHTML = "START GAME";
                btn.style.background = "transparent";
                btn.style.borderColor = "var(--c-cyan)";
                btn.style.boxShadow = "0 0 15px var(--c-cyan)";
                btn.style.color = "var(--c-cyan)";
            }, 500);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
