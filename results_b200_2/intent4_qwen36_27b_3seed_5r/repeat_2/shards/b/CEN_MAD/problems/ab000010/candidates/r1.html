<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Sphere of Life</title>
<style>
    :root {
        --bg-color: #030305;
        --panel-bg: rgba(10, 10, 15, 0.65);
        --panel-border: rgba(255, 255, 255, 0.1);
        --text-primary: #ffffff;
        --text-secondary: #8f9bb3;
        --accent-cyan: #00f3ff;
        --accent-magenta: #ff00ff;
        --accent-violet: #bd00ff;
        --font-stack: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        /* Justify left to make room for canvas to expand, panel is absolute/fixed */
        justify-content: flex-start; 
    }

    /* Layout Container */
    #app {
        position: relative;
        width: 100%;
        height: 100%;
    }

    /* The Canvas - The Void */
    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        cursor: grab;
        width: 100%;
        height: 100%;
    }

    canvas:active {
        cursor: grabbing;
    }

    /* Control Panel - Sidebar */
    #controls {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        width: 300px;
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 30px;
        z-index: 10;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 24px;
        transition: opacity 0.3s ease;
    }

    /* Typography */
    h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0 0 8px 0;
        color: #fff;
        text-transform: uppercase;
        background: linear-gradient(90deg, #fff, var(--text-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0;
        line-height: 1.5;
        font-weight: 400;
    }

    /* UI Components */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-secondary);
    }

    .value-display {
        color: var(--accent-cyan);
        font-family: 'Courier New', monospace;
        font-weight: 700;
    }

    /* Sliders - Neon Style */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: var(--accent-cyan);
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 10px var(--accent-cyan), 0 0 20px rgba(0, 243, 255, 0.4);
        border: 2px solid #fff;
        transition: transform 0.1s;
    }
    
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
    }

    /* Buttons */
    .btn-row {
        display: flex;
        gap: 12px;
        margin-top: 5px;
    }

    button {
        flex: 1;
        padding: 12px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.03);
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: var(--font-stack);
    }

    button:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.3);
        transform: translateY(-1px);
    }

    button:active {
        transform: translateY(1px);
    }

    /* Primary Action: Randomize */
    button.primary {
        background: var(--accent-cyan);
        color: #000;
        border: 1px solid var(--accent-cyan);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    button.primary:hover {
        background: #fff;
        border-color: #fff;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    }

    /* Secondary: Pause/Play */
    button.secondary {
        border-color: var(--accent-magenta);
        color: var(--accent-magenta);
    }
    
    button.secondary:hover {
        background: rgba(255, 0, 255, 0.1);
        box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
    }

    /* Stats - Grouped */
    .stats-container {
        margin-top: 10px;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
    }

    .stat-label {
        font-size: 10px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }

    .stat-val {
        font-size: 18px;
        font-weight: 300;
        font-family: 'Courier New', monospace;
        color: #fff;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* Mobile adjustments */
    @media (max-width: 800px) {
        #controls {
            right: 0;
            bottom: 0;
            top: auto;
            transform: none;
            width: 100%;
            border-radius: 24px 24px 0 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
            padding: 30px 20px;
            max-height: 40vh;
            overflow-y: auto;
        }
        
        canvas {
            cursor: default;
        }
    }
</style>
</head>
<body>

<div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
        <div>
            <h1>Neon Sphere</h1>
            <div class="subtitle">Conway's Game of Life on a 3D manifold.</div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Simulation Speed</span>
                <span class="value-display" id="speedVal">50%</span>
            </div>
            <input type="range" id="speed" min="1" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Cell Density</span>
                <span class="value-display" id="densityVal">50%</span>
            </div>
            <input type="range" id="density" min="10" max="90" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Rotation</span>
                <span class="value-display" id="rotVal">Auto</span>
            </div>
            <input type="range" id="rotation" min="0" max="100" value="20">
        </div>

        <div class="btn-row">
            <button id="btnReset" class="primary">Randomize</button>
            <button id="btnStep">Step</button>
            <button id="btnPause" class="secondary">Pause</button>
        </div>

        <div class="stats-container">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Population</span>
                    <span class="stat-val" id="popCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Generation</span>
                    <span class="stat-val" id="genCount">0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * Configuration & State
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // Simulation State
    let width, height;
    let cx, cy;
    let radius;
    
    // Sphere Grid Parameters - Increased density for "small cells"
    const RINGS = 40; // Latitude lines
    const SEGMENTS = 80; // Longitude lines
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Game State
    let grid = new Int8Array(TOTAL_CELLS); // 0 or 1
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visual Parameters
    let rotationSpeed = 0.002;
    let simSpeed = 50; // 1-100
    let cellDensity = 0.5;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction State
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Handle high DPI displays for crisp lines
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        
        cx = width / 2;
        cy = height / 2;
        
        // Sphere size relative to screen, but constrained to leave room for sidebar
        // If sidebar is visible, shift center slightly left or reduce radius
        const sidebarWidth = (window.innerWidth > 800) ? 380 : 0;
        const availableWidth = width - sidebarWidth;
        
        // Center canvas content slightly to the left to balance sidebar visually
        if (window.innerWidth > 800) {
            cx = (width - sidebarWidth) / 2 + (sidebarWidth * 0.1);
        } else {
            cx = width / 2;
        }
        
        radius = Math.min(availableWidth, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    
    // Map grid index to 3D coordinates on sphere surface
    function getCellCoords(index) {
        const ring = index % RINGS;
        const segment = Math.floor(index / RINGS);
        
        // Phi goes from 0 to PI (top to bottom)
        const phi = (ring / RINGS) * Math.PI;
        // Theta goes from 0 to 2PI (around)
        const theta = (segment / SEGMENTS) * 2 * Math.PI;
        
        return {
            x: Math.sin(phi) * Math.cos(theta),
            y: Math.cos(phi),
            z: Math.sin(phi) * Math.sin(theta)
        };
    }

    function rotatePoint(x, y, z, rotY, rotX) {
        // Rotate Y
        let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
        let z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
        
        // Rotate X
        let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
        let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
        
        return { x: x1, y: y2, z: z2 };
    }

    function project(x, y, z) {
        // Simple perspective projection
        const fov = 4.0;
        const zOffset = fov + z; 
        const scale = radius * (fov / zOffset);
        
        return {
            x: cx + x * scale,
            y: cy - y * scale, // Flip Y for canvas
            scale: scale,
            depth: z
        };
    }

    /**
     * Game Logic (Conway's on Sphere)
     */
    function getNeighbors(r, s) {
        let count = 0;
        
        // Check 8 neighbors (wrapping around sphere topology)
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        
        // Swap buffers
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering
     */
    function draw() {
        // Clear with dark background (void)
        ctx.fillStyle = '#030305';
        ctx.fillRect(0, 0, width, height);
        
        // Update Rotation if not dragging
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        // Calculate positions for all cells
        const cells = [];
        
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const r = i % RINGS;
            const s = Math.floor(i / RINGS);
            
            const pos3D = getCellCoords(i);
            const rotated = rotatePoint(pos3D.x, pos3D.y, pos3D.z, rotY, rotX);
            const projected = project(rotated.x, rotated.y, rotated.z);
            
            // Only draw if facing somewhat towards camera
            if (rotated.z > -0.2) {
                cells.push({
                    x: projected.x,
                    y: projected.y,
                    z: rotated.z, // Depth for sorting
                    scale: projected.scale,
                    alive: grid[i]
                });
            }
        }
        
        // Sort by depth (painters algorithm) - draw back cells first
        cells.sort((a, b) => a.z - b.z);
        
        // Draw cells
        for (let cell of cells) {
            if (cell.alive) {
                // "Neon-on-Void" Palette
                // Depth mapping:
                // Front (z ~ 1): Cyan (#00f3ff)
                // Mid (z ~ 0.5): Violet (#bd00ff)
                // Back (z ~ 0): Magenta (#ff00ff)
                
                // Calculate Hue
                // 180 (Cyan) -> 280 (Purple) -> 300 (Magenta)
                let hue = 180 + (1 - cell.z) * 120; 
                
                // Lightness & Saturation
                let lightness = 45 + (cell.z * 20); // Brighter in front
                let alpha = 0.2 + (cell.z * 0.8); // Fade back cells
                
                ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
                
                // Draw Small Square/Pixel instead of circle
                // Size calculation: slightly larger than a dot to look like a grid unit
                const size = Math.max(1.5, 3.5 * (cell.scale / 4.0)); 
                
                // Draw Square
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
                
                // Add "Bloom" / Glow for front-most cells
                if (cell.z > 0.7) {
                    // Glow color is lighter and more transparent
                    ctx.fillStyle = `hsla(${hue}, 100%, 80%, 0.6)`;
                    const glowSize = size * 0.6;
                    ctx.fillRect(cell.x - glowSize/2, cell.y - glowSize/2, glowSize, glowSize);
                }
            }
        }
        
        // Subtle wireframe outline for the sphere to ground it
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.98, 0, Math.PI * 2);
        ctx.stroke();
        
        // Inner shadow gradient to give volume
        const grad = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(1, 'rgba(0,0,0,0.8)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        // Simulation Step Logic
        if (!isPaused) {
            // Throttle simulation speed
            const threshold = Math.max(1, 101 - simSpeed);
            if (frameCount % Math.floor(threshold / 10) === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.0001;
                rotVal.innerText = 'Auto';
            }
        });

        document.getElementById('btnReset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            updatePauseButton(true);
        });

        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseButton(isPaused);
        });
    }
    
    function updatePauseButton(paused) {
        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.innerText = paused ? 'Play' : 'Pause';
        // Visual toggle for active state could be added here if desired
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop;
        document.getElementById('genCount').innerText = generation;
    }

    // Start
    init();

</script>
</body>
</html>
