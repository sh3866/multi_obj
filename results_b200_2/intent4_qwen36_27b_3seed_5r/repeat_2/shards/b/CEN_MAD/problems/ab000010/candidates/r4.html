<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere Life | Volumetric Automata</title>
<style>
    :root {
        --bg-color: #050508;
        --panel-bg: rgba(20, 20, 25, 0.65);
        --panel-border: rgba(255, 255, 255, 0.1);
        --accent-primary: #00f3ff;
        --accent-secondary: #ff00ff;
        --text-main: #ffffff;
        --text-muted: #8b9bb4;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Background Atmosphere */
    #bg-gradient {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 30% 50%, #1a1a2e 0%, var(--bg-color) 70%);
        z-index: -1;
        pointer-events: none;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas {
        display: block;
        /* Allow canvas to bleed for glow effects */
        margin: -20px; 
    }

    /* Control Panel */
    #controls {
        width: 360px;
        height: 100%;
        background: var(--panel-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-left: 1px solid var(--panel-border);
        display: flex;
        flex-direction: column;
        padding: 40px 32px;
        z-index: 10;
        overflow-y: auto;
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    /* Typography */
    h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0 0 8px 0;
        color: var(--text-main);
        text-transform: uppercase;
    }

    .subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0 0 40px 0;
        line-height: 1.4;
    }

    /* Dashboard Section (Stats) */
    .dashboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 32px;
    }

    .dash-card {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--panel-border);
        padding: 16px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
    }

    .dash-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        opacity: 0.5;
    }

    .dash-label {
        font-size: 10px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
    }

    .dash-value {
        font-family: var(--font-mono);
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
    }

    /* Controls Section */
    .section-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
    }
    .section-title::after {
        content: '';
        flex-grow: 1;
        height: 1px;
        background: var(--panel-border);
        margin-left: 12px;
    }

    .control-group {
        margin-bottom: 28px;
    }

    .control-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .control-label {
        font-size: 13px;
        font-weight: 500;
        color: #ccc;
    }

    .control-val {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent-primary);
    }

    /* Custom Range Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: var(--text-main);
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 0 0 4px rgba(0,0,0,0.5);
        border: 2px solid var(--accent-primary);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
    }

    /* Buttons */
    .action-row {
        display: flex;
        gap: 12px;
        margin-top: auto; /* Push to bottom if flex col */
    }

    button {
        flex: 1;
        padding: 14px;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-main);
        font-family: var(--font-ui);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    button:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
    }

    .btn-primary {
        background: var(--text-main);
        color: var(--bg-color);
        border-color: var(--text-main);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .btn-primary:hover {
        background: #fff;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    }

    .btn-primary.paused {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
        color: #000;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    /* Responsive */
    @media (max-width: 900px) {
        body { flex-direction: column; }
        #canvas-container { height: 55%; }
        #controls { 
            width: 100%; 
            height: 45%; 
            border-left: none; 
            border-top: 1px solid var(--panel-border);
        }
    }
</style>
</head>
<body>

<div id="bg-gradient"></div>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="controls">
    <div>
        <h1>Sphere Life</h1>
        <div class="subtitle">Volumetric Cellular Automata<br>on a 3D Manifold</div>
    </div>

    <!-- Unified Dashboard -->
    <div class="dashboard">
        <div class="dash-card">
            <span class="dash-label">Population</span>
            <span class="dash-value" id="popCount">0</span>
        </div>
        <div class="dash-card">
            <span class="dash-label">Generation</span>
            <span class="dash-value" id="genCount">0</span>
        </div>
    </div>

    <div class="section-title">Simulation Parameters</div>

    <div class="control-group">
        <div class="control-header">
            <span class="control-label">Simulation Speed</span>
            <span class="control-val" id="speedVal">Normal</span>
        </div>
        <input type="range" id="speed" min="0" max="100" value="50">
    </div>

    <div class="control-group">
        <div class="control-header">
            <span class="control-label">Rotation Speed</span>
            <span class="control-val" id="rotVal">Auto</span>
        </div>
        <input type="range" id="rotation" min="0" max="100" value="20">
    </div>

    <div class="control-group">
        <div class="control-header">
            <span class="control-label">Initial Density</span>
            <span class="control-val" id="densityVal">40%</span>
        </div>
        <input type="range" id="density" min="10" max="90" value="40">
    </div>

    <div class="action-row">
        <button id="btnReset">Randomize</button>
        <button id="btnStep">Step</button>
        <button id="btnPause" class="btn-primary">Pause</button>
    </div>
</div>

<script>
    /**
     * Configuration
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for speed
    
    // High Res Grid: 80 rings x 160 segments = 12,800 cells. 
    // Manageable for 2D Canvas if drawn as small rects.
    const RINGS = 80; 
    const SEGMENTS = 160; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // State
    let grid = new Int8Array(TOTAL_CELLS);
    let age = new Int16Array(TOTAL_CELLS); // Track age for semantic color
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let nextAge = new Int16Array(TOTAL_CELLS);
    
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visuals
    let rotationSpeed = 0.002;
    let simSpeed = 50; 
    let cellDensity = 0.4;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    
    // Dimensions
    let width, height, cx, cy, radius;
    
    // Precomputed Geometry
    const coords3D = [];
    for (let r = 0; r < RINGS; r++) {
        for (let s = 0; s < SEGMENTS; s++) {
            const phi = (r / RINGS) * Math.PI;
            const theta = (s / SEGMENTS) * 2 * Math.PI;
            coords3D.push({
                x: Math.sin(phi) * Math.cos(theta),
                y: Math.cos(phi),
                z: Math.sin(phi) * Math.sin(theta)
            });
        }
    }

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        const dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap DPR for performance
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        
        const sidebarWidth = (window.innerWidth > 900) ? 360 : 0;
        const availableWidth = width - sidebarWidth;
        
        cx = availableWidth / 2;
        cy = height / 2;
        
        radius = Math.min(availableWidth, height) * 0.38;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const isAlive = Math.random() < cellDensity;
            grid[i] = isAlive ? 1 : 0;
            // Reset age
            age[i] = isAlive ? Math.floor(Math.random() * 20) : 0;
        }
        updateStats();
    }

    /**
     * Math & 3D Projection
     */
    function rotatePoint(p, rotY, rotX) {
        // Rotate Y
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.x * sinY + p.z * cosY;
        
        // Rotate X
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = p.y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    /**
     * Game Logic
     */
    function getNeighbors(r, s) {
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    if (neighbors === 2 || neighbors === 3) {
                        nextGrid[idx] = 1;
                        nextAge[idx] = age[idx] + 1;
                    } else {
                        nextGrid[idx] = 0;
                        nextAge[idx] = 0;
                    }
                } else {
                    if (neighbors === 3) {
                        nextGrid[idx] = 1;
                        nextAge[idx] = 1; // Born
                    } else {
                        nextGrid[idx] = 0;
                        nextAge[idx] = 0;
                    }
                }
            }
        }
        
        // Swap buffers
        let tempG = grid; grid = nextGrid; nextGrid = tempG;
        let tempA = age; age = nextAge; nextAge = tempA;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering
     */
    function draw() {
        // Clear
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);
        
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        const fov = 2.5; // Field of View
        
        // 1. Project & Cull
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const p = coords3D[i];
            const rotated = rotatePoint(p, rotY, rotX);
            
            // Simple Culling: Only draw front hemisphere + slight rim
            // Z goes from -1 (back) to 1 (front). 
            if (rotated.z > -0.1) {
                const scale = radius * (fov / (fov + rotated.z));
                cells.push({
                    x: cx + rotated.x * scale,
                    y: cy - rotated.y * scale, // Flip Y for canvas
                    z: rotated.z,
                    scale: scale,
                    alive: grid[i],
                    cellAge: age[i]
                });
            }
        }
        
        // Sort Back to Front (Painter's Algorithm)
        // Essential for depth perception
        cells.sort((a, b) => a.z - b.z);
        
        // 2. Draw Cells
        // We draw a dark rect for EVERY cell to create the "Grid" texture
        // We draw a colored rect only if ALIVE.
        
        // Performance Optimization: Batch drawing by size if possible, 
        // but here we iterate once.
        
        for (let cell of cells) {
            // Calculate Cell Size based on projection
            // Using small squares for the "Geometric" look
            const size = Math.max(1.5, (cell.scale / fov) * 3.5);
            
            // --- DEAD CELL (The Grid Structure) ---
            // Draw dark grey/black to create the sphere volume
            const depthAlpha = (cell.z + 0.1) / 1.1; // 0 to 1
            const deadAlpha = 0.1 + (depthAlpha * 0.3); // Faint in back, visible in front
            
            ctx.fillStyle = `rgba(20, 20, 25, ${deadAlpha})`;
            ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
            
            // --- LIVE CELL (The Organism) ---
            if (cell.alive) {
                // Semantic Color:
                // Young (1-5): Cyan/White
                // Mature (6-15): Teal/Blue
                // Old (16+): Purple/Amber
                
                let r, g, b;
                const a = cell.cellAge;
                
                if (a < 5) { // Young
                    r = 255; g = 255; b = 255; // White hot
                } else if (a < 15) { // Mature
                    r = 0; g = 243; b = 255; // Cyan
                } else if (a < 30) { // Old
                    r = 150; g = 50; b = 255; // Purple
                } else { // Very Old
                    r = 255; g = 100; b = 50; // Amber
                }

                // Volumetric Lighting (Dot Product Simulation)
                // Cells on the front (z=1) are brighter. Cells on the edge (z=0) are darker.
                // Simple linear mapping of Z to brightness.
                const lightIntensity = 0.3 + (cell.z * 0.7); 
                
                // Bloom Effect
                // We use shadowBlur for the glow. 
                // To save perf, only apply heavy glow to front-facing cells.
                if (cell.z > 0.5) {
                    ctx.shadowBlur = 10 * cell.z;
                    ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.8)`;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${lightIntensity})`;
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
            }
        }
        
        // Reset Shadow for next frame
        ctx.shadowBlur = 0;

        // 3. Rim Lighting (Atmosphere)
        // A subtle gradient on the very edge to sell the sphere shape
        const grad = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius * 1.05);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.5, 'rgba(0, 243, 255, 0.05)'); // Cyan tint
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.05, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        if (!isPaused) {
            // Speed control: lower value = faster updates (fewer frames between steps)
            const frameskip = Math.max(1, Math.floor(100 - simSpeed));
            if (frameCount % frameskip === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            if(simSpeed < 30) speedVal.innerText = 'Slow';
            else if(simSpeed > 70) speedVal.innerText = 'Fast';
            else speedVal.innerText = 'Normal';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.00015;
                rotVal.innerText = 'Auto';
            }
        });

        document.getElementById('btnReset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            updatePauseButton(true);
        });

        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseButton(isPaused);
        });
    }
    
    function updatePauseButton(paused) {
        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.innerText = paused ? 'Resume' : 'Pause';
        if(paused) pauseBtn.classList.add('paused');
        else pauseBtn.classList.remove('paused');
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                // Clamp X rotation to prevent flipping
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop;
        document.getElementById('genCount').innerText = generation;
    }

    // Start
    init();

</script>
</body>
</html>
