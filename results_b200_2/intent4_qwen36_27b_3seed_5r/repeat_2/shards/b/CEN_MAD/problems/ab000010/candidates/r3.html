<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Sphere Life</title>
<style>
    :root {
        --bg-void: #030305;
        --panel-bg: rgba(12, 12, 16, 0.6);
        --panel-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.03);
        
        --text-primary: #e0e0e0;
        --text-secondary: #666677;
        --text-dim: #444455;
        
        --neon-cyan: #00f3ff;
        --neon-magenta: #ff00ff;
        --neon-white: #ffffff;
        
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-void);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        user-select: none;
    }

    /* Canvas Container */
    #canvas-container {
        position: relative;
        flex-grow: 1;
        height: 100%;
        cursor: grab;
        overflow: hidden;
        background: radial-gradient(circle at center, #0a0a12 0%, var(--bg-void) 80%);
    }
    
    #canvas-container:active {
        cursor: grabbing;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* Control Panel - Sidebar */
    #controls {
        width: 340px;
        height: 100%;
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-left: 1px solid var(--panel-border);
        display: flex;
        flex-direction: column;
        padding: 32px;
        box-sizing: border-box;
        z-index: 10;
        overflow-y: auto;
        /* Scanline/Hardware texture effect */
        background-image: linear-gradient(0deg, transparent 50%, rgba(0,0,0,0.2) 50%);
        background-size: 100% 4px;
    }

    /* Typography */
    h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0 0 4px 0;
        color: var(--text-primary);
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        margin: 0 0 32px 0;
        line-height: 1.5;
        letter-spacing: 0.5px;
    }

    /* Sections */
    .section {
        margin-bottom: 24px;
        background: var(--glass-highlight);
        border: 1px solid var(--panel-border);
        padding: 20px;
        border-radius: 8px;
    }

    .section-header {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-secondary);
        margin: 0 0 20px 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .section-header::before {
        content: '';
        display: block;
        width: 8px;
        height: 1px;
        background: var(--neon-cyan);
    }

    /* Data Readouts - HUD Style */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 24px;
    }

    .stat-box {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--panel-border);
        padding: 16px;
        border-radius: 6px;
        position: relative;
        overflow: hidden;
    }

    .stat-box::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 2px; height: 100%;
        background: var(--neon-magenta);
        opacity: 0.5;
    }
    
    .stat-box:nth-child(2)::after {
        background: var(--neon-cyan);
    }

    .stat-label {
        display: block;
        font-size: 9px;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .stat-value {
        font-family: var(--font-mono);
        font-size: 28px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1;
    }

    /* Controls & Sliders */
    .control-row {
        margin-bottom: 24px;
    }
    
    .control-row:last-child {
        margin-bottom: 0;
    }

    .control-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
    }

    .control-label {
        font-size: 12px;
        font-weight: 600;
        color: #ccc;
    }

    .control-value {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--neon-cyan);
        text-shadow: 0 0 5px rgba(0, 243, 255, 0.3);
    }

    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 0; /* Square for tech feel */
        background: var(--text-primary);
        cursor: pointer;
        margin-top: -7px;
        box-shadow: 0 0 0 2px var(--bg-void), 0 0 0 4px var(--neon-magenta);
        transition: transform 0.1s;
    }
    
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 0;
    }

    /* Buttons */
    .btn-group {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }

    button {
        flex: 1;
        padding: 12px 0;
        border: 1px solid var(--panel-border);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: var(--font-ui);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-secondary);
    }

    button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        border-color: rgba(255,255,255,0.3);
    }

    /* Primary Action: Pause/Play */
    .btn-primary {
        background: var(--text-primary);
        color: var(--bg-void);
        border-color: var(--text-primary);
    }

    .btn-primary:hover {
        background: #fff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    
    .btn-primary.paused {
        background: var(--neon-cyan);
        border-color: var(--neon-cyan);
        color: var(--bg-void);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    /* Responsive */
    @media (max-width: 900px) {
        body {
            flex-direction: column;
        }
        
        #canvas-container {
            height: 55%;
        }

        #controls {
            width: 100%;
            height: 45%;
            border-left: none;
            border-top: 1px solid var(--panel-border);
            padding: 24px;
        }
    }
</style>
</head>
<body>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="controls">
    <div>
        <h1>Neon Sphere</h1>
        <div class="subtitle">High-density cellular automata<br>on a closed manifold.</div>
    </div>

    <!-- Stats Section: HUD Style -->
    <div class="stats-grid">
        <div class="stat-box">
            <span class="stat-label">Population</span>
            <span class="stat-value" id="popCount">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Generation</span>
            <span class="stat-value" id="genCount">0</span>
        </div>
    </div>

    <!-- Controls Section: Unified Block -->
    <div class="section">
        <div class="section-header">Simulation Parameters</div>
        
        <div class="control-row">
            <div class="control-header">
                <span class="control-label">Speed</span>
                <span class="control-value" id="speedVal">Normal</span>
            </div>
            <input type="range" id="speed" min="0" max="100" value="50">
        </div>

        <div class="control-row">
            <div class="control-header">
                <span class="control-label">Rotation</span>
                <span class="control-value" id="rotVal">Auto</span>
            </div>
            <input type="range" id="rotation" min="0" max="100" value="20">
        </div>
        
        <div class="control-row">
            <div class="control-header">
                <span class="control-label">Initial Density</span>
                <span class="control-value" id="densityVal">40%</span>
            </div>
            <input type="range" id="density" min="10" max="90" value="40">
        </div>

        <!-- Action Buttons: Moved up to connect with parameters -->
        <div class="btn-group">
            <button id="btnReset">Randomize</button>
            <button id="btnStep">Step</button>
            <button id="btnPause" class="btn-primary">Pause</button>
        </div>
    </div>
</div>

<script>
    /**
     * Configuration & State
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let width, height;
    let cx, cy;
    let radius;
    
    // Simulation State - High Resolution
    // Reduced slightly from original to ensure 60fps with the heavier rendering pass
    const RINGS = 90; 
    const SEGMENTS = 90; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Game State
    let grid = new Int8Array(TOTAL_CELLS); 
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visual Parameters
    let rotationSpeed = 0.002;
    let simSpeed = 50; 
    let cellDensity = 0.4;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction State
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        
        const sidebarWidth = (window.innerWidth > 900) ? 340 : 0;
        const availableWidth = width - sidebarWidth;
        
        cx = availableWidth / 2 + (sidebarWidth * 0.1);
        cy = height / 2;
        
        radius = Math.min(availableWidth, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    const coords3D = [];
    for (let r = 0; r < RINGS; r++) {
        for (let s = 0; s < SEGMENTS; s++) {
            const phi = (r / RINGS) * Math.PI;
            const theta = (s / SEGMENTS) * 2 * Math.PI;
            
            coords3D.push({
                x: Math.sin(phi) * Math.cos(theta),
                y: Math.cos(phi),
                z: Math.sin(phi) * Math.sin(theta)
            });
        }
    }

    function rotatePoint(p, rotY, rotX) {
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.x * sinY + p.z * cosY;
        
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = p.y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    /**
     * Game Logic
     */
    function getNeighbors(r, s) {
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering - Neon Point Cloud System
     */
    function draw() {
        // Clear with slight transparency for trails? No, crisp clear for this aesthetic.
        ctx.fillStyle = '#030305';
        ctx.fillRect(0, 0, width, height);
        
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        const fov = 3.5;
        
        // 1. Project & Sort
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const p = coords3D[i];
            const rotated = rotatePoint(p, rotY, rotX);
            
            // Simple Z-buffer culling
            if (rotated.z > -0.1) {
                const scale = radius * (fov / (fov + rotated.z));
                cells.push({
                    x: cx + rotated.x * scale,
                    y: cy - rotated.y * scale,
                    z: rotated.z,
                    scale: scale,
                    alive: grid[i]
                });
            }
        }
        
        // Sort by depth (Back to Front)
        cells.sort((a, b) => a.z - b.z);
        
        // 2. Draw Sphere Base (Void)
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
        ctx.fill();
        
        // 3. Draw Cells (The Point Cloud)
        for (let cell of cells) {
            if (cell.alive) {
                // Cyberpunk Palette: Cyan (Back) -> Magenta (Front) -> White (Hotspot)
                const t = (cell.z + 0.1) / 1.1;
                
                // Color Logic
                let color;
                if (t < 0.5) {
                    // Cyan to Purple
                    color = `rgba(0, 243, 255, ${0.4 + t})`;
                } else {
                    // Purple to Magenta/White
                    color = `rgba(255, ${255 - (t*200)}, 255, ${0.6 + t})`;
                }

                // Size based on perspective
                // Using fillRect for "pixel" look, or arc for "light" look.
                // Critique asked for "pixels or small geometric shapes".
                const size = Math.max(1.5, 3.5 * (cell.scale / fov));
                
                // Main Cell
                ctx.fillStyle = color;
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
                
                // Bloom/Glow (Only on bright cells to save perf)
                if (cell.z > 0.6) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${(cell.z - 0.6) * 0.5})`;
                    ctx.fillRect(cell.x, cell.y, size/3, size/3);
                }
            }
        }
        
        // 4. Rim Lighting (The Edge)
        const grad = ctx.createRadialGradient(cx, cy, radius * 0.95, cx, cy, radius * 1.05);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.5, 'rgba(0, 243, 255, 0.1)'); // Cyan Rim
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.05, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        if (!isPaused) {
            const frameskip = Math.max(1, Math.floor(100 - simSpeed));
            if (frameCount % frameskip === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            if(simSpeed < 10) speedVal.innerText = 'Slow';
            else if(simSpeed > 80) speedVal.innerText = 'Fast';
            else speedVal.innerText = 'Normal';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.00015;
                rotVal.innerText = 'Auto';
            }
        });

        document.getElementById('btnReset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            updatePauseButton(true);
        });

        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseButton(isPaused);
        });
    }
    
    function updatePauseButton(paused) {
        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.innerText = paused ? 'Resume' : 'Pause';
        if(paused) pauseBtn.classList.add('paused');
        else pauseBtn.classList.remove('paused');
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop;
        document.getElementById('genCount').innerText = generation;
    }

    // Start
    init();

</script>
</body>
</html>
