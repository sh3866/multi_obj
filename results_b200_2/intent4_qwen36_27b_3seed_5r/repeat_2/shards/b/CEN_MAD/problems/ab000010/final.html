<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere Life | Volumetric Automata</title>
<style>
    :root {
        --bg-color: #050505;
        --panel-bg: #0a0a0a;
        --panel-border: #222;
        --accent-primary: #00f3ff;
        --accent-secondary: #ff00ff;
        --text-main: #ffffff;
        --text-muted: #666;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: row; /* Sidebar on Right */
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
        background: radial-gradient(circle at center, #111 0%, #000 100%);
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* Control Panel */
    #controls {
        width: 320px;
        min-width: 320px;
        height: 100%;
        background: var(--panel-bg);
        border-left: 1px solid var(--panel-border);
        display: flex;
        flex-direction: column;
        padding: 40px 32px;
        z-index: 10;
        overflow-y: auto;
        box-shadow: -10px 0 40px rgba(0,0,0,0.8);
    }

    /* Typography */
    h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0 0 8px 0;
        color: var(--text-main);
        text-transform: uppercase;
        background: linear-gradient(90deg, #fff, #999);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0 0 40px 0;
        line-height: 1.5;
        font-weight: 400;
    }

    /* Dashboard Section (Stats) */
    .dashboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 40px;
    }

    .dash-card {
        background: #111;
        border: 1px solid var(--panel-border);
        padding: 16px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .dash-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .dash-value {
        font-family: var(--font-mono);
        font-size: 20px;
        font-weight: 700;
        color: var(--text-main);
    }

    /* Controls Section */
    .section-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 8px;
    }

    .control-group {
        margin-bottom: 32px;
    }

    .control-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .control-label {
        font-size: 13px;
        font-weight: 600;
        color: #ccc;
    }

    .control-val {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent-primary);
    }

    /* Custom Range Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: var(--text-main);
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #333;
        border-radius: 2px;
    }

    /* Buttons */
    .action-row {
        display: flex;
        gap: 12px;
        margin-top: auto; 
    }

    button {
        flex: 1;
        padding: 14px;
        border: 1px solid var(--panel-border);
        background: #111;
        color: var(--text-main);
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    button:hover {
        background: #222;
        border-color: #444;
    }

    .btn-primary {
        background: var(--text-main);
        color: #000;
        border-color: var(--text-main);
    }

    .btn-primary:hover {
        background: #ddd;
    }

    /* Responsive */
    @media (max-width: 900px) {
        body { flex-direction: column-reverse; }
        #canvas-container { height: 60%; }
        #controls { 
            width: 100%; 
            height: 40%; 
            border-left: none; 
            border-top: 1px solid var(--panel-border);
            padding: 24px;
        }
    }
</style>
</head>
<body>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="controls">
    <div>
        <h1>Sphere Life</h1>
        <div class="subtitle">Volumetric Cellular Automata<br>Projected on 3D Manifold</div>
    </div>

    <!-- Unified Dashboard -->
    <div class="dashboard">
        <div class="dash-card">
            <span class="dash-label">Population</span>
            <span class="dash-value" id="popCount">0</span>
        </div>
        <div class="dash-card">
            <span class="dash-label">Generation</span>
            <span class="dash-value" id="genCount">0</span>
        </div>
    </div>

    <div class="section-title">Simulation Parameters</div>

    <div class="control-group">
        <div class="control-header">
            <span class="control-label">Simulation Speed</span>
            <span class="control-val" id="speedVal">Normal</span>
        </div>
        <input type="range" id="speed" min="0" max="100" value="50">
    </div>

    <div class="control-group">
        <div class="control-header">
            <span class="control-label">Rotation Speed</span>
            <span class="control-val" id="rotVal">Auto</span>
        </div>
        <input type="range" id="rotation" min="0" max="100" value="20">
    </div>

    <div class="control-group">
        <div class="control-header">
            <span class="control-label">Initial Density</span>
            <span class="control-val" id="densityVal">40%</span>
        </div>
        <input type="range" id="density" min="10" max="90" value="40">
    </div>

    <div class="action-row">
        <button id="btnReset">Randomize</button>
        <button id="btnStep">Step</button>
        <button id="btnPause" class="btn-primary">Pause</button>
    </div>
</div>

<script>
    /**
     * Configuration
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false }); 
    
    // Grid Resolution (Lat/Lon)
    const RINGS = 80; 
    const SEGMENTS = 160; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // State
    let grid = new Int8Array(TOTAL_CELLS);
    let age = new Int16Array(TOTAL_CELLS); 
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let nextAge = new Int16Array(TOTAL_CELLS);
    
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visuals
    let rotationSpeed = 0.002;
    let simSpeed = 50; 
    let cellDensity = 0.4;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    
    // Dimensions
    let width, height, cx, cy, radius;
    
    // Precomputed Geometry (Standard Spherical Coordinates)
    const coords3D = [];
    for (let r = 0; r < RINGS; r++) {
        for (let s = 0; s < SEGMENTS; s++) {
            // Phi: 0 to PI (Top to Bottom)
            const phi = (r / RINGS) * Math.PI;
            // Theta: 0 to 2PI (Around)
            const theta = (s / SEGMENTS) * 2 * Math.PI;
            
            // Standard Sphere Projection:
            // x = sin(phi)cos(theta)
            // y = cos(phi)
            // z = sin(phi)sin(theta)
            coords3D.push({
                x: Math.sin(phi) * Math.cos(theta),
                y: Math.cos(phi),
                z: Math.sin(phi) * Math.sin(theta)
            });
        }
    }

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        // FIX CANVAS ASPECT RATIO: Match display size exactly
        const container = document.getElementById('canvas-container');
        width = container.clientWidth;
        height = container.clientHeight;
        
        // Handle High DPI (Retina) for crisp text/lines, but cap at 2x for performance
        const dpr = Math.min(window.devicePixelRatio || 1, 2); 
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        
        // Normalize coordinate system to CSS pixels
        ctx.scale(dpr, dpr);
        
        cx = width / 2;
        cy = height / 2;
        
        // Sphere Radius based on container
        radius = Math.min(width, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const isAlive = Math.random() < cellDensity;
            grid[i] = isAlive ? 1 : 0;
            age[i] = isAlive ? Math.floor(Math.random() * 20) : 0;
        }
        updateStats();
    }

    /**
     * Math & 3D Projection
     */
    function rotatePoint(p, rotY, rotX) {
        // Rotation Matrix Y
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.x * sinY + p.z * cosY;
        
        // Rotation Matrix X
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = p.y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    /**
     * Game Logic (Conway's Rules)
     */
    function getNeighbors(r, s) {
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                // Wrap around edges (Manifold topology)
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    if (neighbors === 2 || neighbors === 3) {
                        nextGrid[idx] = 1;
                        nextAge[idx] = age[idx] + 1;
                    } else {
                        nextGrid[idx] = 0;
                        nextAge[idx] = 0;
                    }
                } else {
                    if (neighbors === 3) {
                        nextGrid[idx] = 1;
                        nextAge[idx] = 1;
                    } else {
                        nextGrid[idx] = 0;
                        nextAge[idx] = 0;
                    }
                }
            }
        }
        
        // Swap buffers
        let tempG = grid; grid = nextGrid; nextGrid = tempG;
        let tempA = age; age = nextAge; nextAge = tempA;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering
     */
    function draw() {
        // Clear Canvas
        ctx.clearRect(0, 0, width, height);
        
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        const fov = 2.5; // Field of View
        
        // 1. Project & Cull
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const p = coords3D[i];
            const rotated = rotatePoint(p, rotY, rotX);
            
            // CULLING: Only draw front hemisphere (z > 0)
            // This fixes the "tunnel" effect and creates a sphere.
            // We add a small epsilon (0.05) to hide cells exactly on the edge line.
            if (rotated.z > 0.05) {
                // Perspective Projection
                // x2d = x * (fov / (fov + z))
                const scale = radius * (fov / (fov + rotated.z));
                cells.push({
                    x: cx + rotated.x * scale,
                    y: cy - rotated.y * scale, // Flip Y for screen coords
                    z: rotated.z,
                    scale: scale,
                    alive: grid[i],
                    cellAge: age[i]
                });
            }
        }
        
        // Sort Back to Front (Painter's Algorithm)
        // Crucial for correct overlap rendering
        cells.sort((a, b) => a.z - b.z);
        
        // 2. Draw Cells
        for (let cell of cells) {
            // Calculate Cell Size
            // Adjust size based on projection scale to maintain density
            const size = Math.max(1.5, (cell.scale / fov) * 3.5);
            
            // --- LIVE CELL ---
            if (cell.alive) {
                // Palette: Cyan -> Magenta based on age
                let r, g, b;
                const a = cell.cellAge;
                
                if (a < 5) { 
                    r = 255; g = 255; b = 255; // Spark (White)
                } else if (a < 20) { 
                    r = 0; g = 243; b = 255; // Young (Cyan)
                } else if (a < 50) { 
                    r = 200; g = 0; b = 255; // Mature (Purple)
                } else { 
                    r = 255; g = 0; b = 255; // Old (Magenta)
                }

                // Lighting: Front (z=1) is bright, Edge (z=0) is dark
                const lightIntensity = 0.3 + (cell.z * 0.7); 
                
                // Glow Effect
                // Only apply heavy glow to front-facing cells for performance
                if (cell.z > 0.5) {
                    ctx.shadowBlur = 8 * cell.z;
                    ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.8)`;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${lightIntensity})`;
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
            } 
            // --- DEAD CELL (Grid Structure) ---
            else {
                // Draw a very faint grid to show the sphere surface volume
                // This creates the "dark background" but with texture
                const depthAlpha = cell.z * 0.15; // Faint in back, slightly visible in front
                ctx.fillStyle = `rgba(255, 255, 255, ${depthAlpha})`;
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
            }
        }
        
        // Reset Shadow
        ctx.shadowBlur = 0;

        // 3. Atmosphere / Rim Lighting
        // Adds a subtle glow around the sphere edge
        const grad = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.05);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.7, 'rgba(0, 243, 255, 0.02)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.1, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        if (!isPaused) {
            // Speed control: lower value = faster updates
            const frameskip = Math.max(1, Math.floor(100 - simSpeed));
            if (frameCount % frameskip === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            if(simSpeed < 30) speedVal.innerText = 'Slow';
            else if(simSpeed > 70) speedVal.innerText = 'Fast';
            else speedVal.innerText = 'Normal';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.00015;
                rotVal.innerText = 'Auto';
            }
        });

        document.getElementById('btnReset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            updatePauseButton(true);
        });

        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseButton(isPaused);
        });
    }
    
    function updatePauseButton(paused) {
        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.innerText = paused ? 'Resume' : 'Pause';
        if(paused) pauseBtn.classList.add('paused');
        else pauseBtn.classList.remove('paused');
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                // Clamp X rotation to prevent flipping upside down
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop;
        document.getElementById('genCount').innerText = generation;
    }

    // Start
    init();

</script>
</body>
</html>
