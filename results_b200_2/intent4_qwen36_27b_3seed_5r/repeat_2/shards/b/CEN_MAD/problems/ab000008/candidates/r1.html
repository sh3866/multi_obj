<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette: Deep Space & Neon */
            --bg-deep: #050011;
            --grid-line: rgba(255, 0, 255, 0.25);
            --grid-glow: rgba(255, 0, 255, 0.6);
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --text-white: #ffffff;
            
            /* Dimensions */
            --highway-width: 320px;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-white);
            font-family: 'Courier New', Courier, monospace; /* Fallback */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- 1. BACKGROUND & ATMOSPHERE --- */

        /* The "Data Storm" Canvas */
        #data-storm {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* The Volumetric Sun (CSS only) */
        .sun-container {
            position: absolute;
            top: 20%; /* High in the sky */
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        .retro-sun {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ffcc00 0%, #ff0055 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 60px rgba(255, 0, 85, 0.5),
                0 0 120px rgba(255, 0, 85, 0.3);
            position: relative;
            /* Hard pixelated cutouts for the sun */
            -webkit-mask-image: linear-gradient(
                to bottom, 
                black 0%, black 60%, 
                transparent 60%, transparent 63%,
                black 63%, black 70%,
                transparent 70%, transparent 74%,
                black 74%, black 85%,
                transparent 85%, transparent 90%,
                black 90%, black 100%
            );
            mask-image: linear-gradient(
                to bottom, 
                black 0%, black 60%, 
                transparent 60%, transparent 63%,
                black 63%, black 70%,
                transparent 70%, transparent 74%,
                black 74%, black 85%,
                transparent 85%, transparent 90%,
                black 90%, black 100%
            );
        }

        /* The Grid Floor */
        .grid-container {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 60%;
            background: 
                /* Vertical Lines */
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                /* Horizontal Lines */
                linear-gradient(0deg, var(--grid-line) 1px, transparent 1px);
            background-size: 60px 60px;
            /* Perspective Transform to create the floor plane */
            transform: perspective(600px) rotateX(65deg);
            transform-origin: top center;
            z-index: 2;
            /* Fade out at the horizon */
            mask-image: linear-gradient(to top, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 20%, transparent 100%);
            animation: gridScroll 2s linear infinite;
            box-shadow: 0 -100px 100px rgba(255, 0, 255, 0.1); /* Horizon glow */
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- 2. GAMEPLAY PREVIEW (HIGHWAY) --- */
        
        /* 
           The Wrapper handles the 3D tilt. 
           It sits on top of the grid, appearing to rise from it.
        */
        .highway-wrapper {
            position: absolute;
            bottom: 15%; /* Positioned over the grid */
            width: var(--highway-width);
            height: 400px;
            z-index: 10;
            /* Tilt the whole assembly back */
            transform: perspective(800px) rotateX(25deg) scale(0.9); 
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
        }

        .highway-tube {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-left: 4px solid var(--neon-cyan);
            border-right: 4px solid var(--neon-cyan);
            /* Strong neon glow */
            box-shadow: 
                0 0 20px var(--neon-cyan),
                inset 0 0 20px rgba(0, 243, 255, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            /* Pixelated corners */
            clip-path: polygon(
                0% 0%, 100% 0%, 
                100% 95%, 95% 100%, 5% 100%, 0% 95%
            );
        }

        .lane {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--text-white);
            box-shadow: 
                0 0 10px var(--text-white),
                0 0 20px var(--neon-magenta);
            z-index: 12;
            /* Make the hit line pixelated */
            mask-image: repeating-linear-gradient(90deg, black 0, black 10px, transparent 10px, transparent 12px);
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 100%;
            height: 24px;
            /* Pixelated blocks instead of rounded pills */
            box-shadow: 0 0 8px currentColor;
            opacity: 0; /* Start hidden */
            z-index: 11;
        }

        /* Animation for falling notes */
        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Specific Note Colors & Timing */
        .n-magenta { background-color: var(--neon-magenta); color: var(--neon-magenta); animation: fall 2.5s linear infinite; }
        .n-cyan    { background-color: var(--neon-cyan); color: var(--neon-cyan); animation: fall 2.5s linear infinite 0.6s; }
        .n-green   { background-color: var(--neon-green); color: var(--neon-green); animation: fall 2.5s linear infinite 1.2s; }
        .n-yellow  { background-color: var(--neon-yellow); color: var(--neon-yellow); animation: fall 2.5s linear infinite 1.8s; }

        /* --- 3. TYPOGRAPHY & UI --- */

        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: -60px; /* Adjust based on highway position */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 
           PIXEL FONT IDENTITY
           Using text-shadow to create a hard, aliased drop shadow 
           and RGB split (chromatic aberration).
        */
        h1 {
            font-family: "Courier New", "Courier", monospace;
            font-weight: 900;
            font-size: 5rem;
            line-height: 0.9;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #fff;
            
            /* Hard Shadow */
            text-shadow: 6px 6px 0px #000; 
            
            /* RGB Split / Chromatic Aberration */
            text-shadow: 
                -3px 0 0 var(--neon-magenta), 
                3px 0 0 var(--neon-cyan),
                6px 6px 0px #000; /* Keep the hard shadow */
            
            animation: glitch-skew 4s infinite linear alternate-reverse;
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            letter-spacing: 8px;
            color: var(--neon-cyan);
            margin-top: 15px;
            text-shadow: 2px 2px 0 var(--neon-magenta);
            opacity: 0.9;
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(0deg); }
            21% { transform: skew(-2deg); }
            22% { transform: skew(0deg); }
            60% { transform: skew(0deg); }
            61% { transform: skew(1deg); }
            62% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        /* --- 4. START BUTTON --- */
        
        .start-btn {
            margin-top: 30px;
            background: transparent;
            border: 4px solid var(--neon-magenta);
            color: var(--neon-magenta);
            font-family: "Courier New", Courier, monospace;
            font-weight: 900;
            font-size: 1.8rem;
            padding: 15px 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s steps(2); /* Pixelated transition */
            
            /* Initial Glow */
            box-shadow: 
                0 0 15px var(--neon-magenta),
                inset 0 0 15px var(--neon-magenta);
            
            /* Pixelated corners */
            clip-path: polygon(
                10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%
            );
        }

        .start-btn:hover {
            background: var(--neon-magenta);
            color: #000;
            box-shadow: 
                0 0 40px var(--neon-magenta),
                inset 0 0 20px var(--neon-magenta);
            transform: scale(1.05) translateY(-2px);
        }

        .start-btn:active {
            transform: scale(0.95) translateY(2px);
        }

        /* --- 5. OVERLAYS --- */
        
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 40%, #000000 120%);
            z-index: 998;
            pointer-events: none;
        }

        /* CRT Flicker */
        .crt-flicker {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.02);
            opacity: 0;
            z-index: 997;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.01; }
            50% { opacity: 0.04; }
            100% { opacity: 0.01; }
        }

    </style>
</head>
<body>

    <!-- Background: Data Storm -->
    <canvas id="data-storm"></canvas>

    <!-- Background: Retro Sun -->
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>

    <!-- Background: Perspective Grid -->
    <div class="grid-container"></div>
    
    <!-- Gameplay Preview: Highway -->
    <div class="highway-wrapper">
        <div class="highway-tube">
            <!-- Lane 1 -->
            <div class="lane">
                <div class="note n-magenta"></div>
                <div class="note n-magenta" style="animation-delay: 1.2s"></div>
            </div>
            <!-- Lane 2 -->
            <div class="lane">
                <div class="note n-cyan"></div>
                <div class="note n-cyan" style="animation-delay: 0.8s"></div>
            </div>
            <!-- Lane 3 -->
            <div class="lane">
                <div class="note n-green"></div>
                <div class="note n-green" style="animation-delay: 1.5s"></div>
            </div>
            <!-- Lane 4 -->
            <div class="lane">
                <div class="note n-yellow"></div>
                <div class="note n-yellow" style="animation-delay: 0.4s"></div>
            </div>
            <!-- Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- UI: Typography & Button -->
    <div class="content-layer">
        <h1>
            PIXEL<br>DANCE
            <span>RHYTHM PROTOCOL</span>
        </h1>
        <button class="start-btn">START</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="crt-flicker"></div>

    <script>
        // --- DATA STORM GENERATOR ---
        // Replaces the simple starfield with a "Digital Rain" effect
        const canvas = document.getElementById('data-storm');
        const ctx = canvas.getContext('2d');

        let width, height;
        let drops = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Create drops based on width
            const columns = Math.floor(width / 20); // 20px width per column
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops.push({
                    x: i * 20,
                    y: Math.random() * height,
                    speed: Math.random() * 3 + 1, // Variable speed
                    char: Math.floor(Math.random() * 16).toString(16) // Hex characters
                });
            }
        }

        function draw() {
            // Clear with slight fade for trail effect? No, let's do crisp pixels.
            ctx.clearRect(0, 0, width, height);
            
            ctx.font = '16px monospace';
            ctx.textAlign = 'center';

            drops.forEach(drop => {
                // Randomize color occasionally
                if(Math.random() > 0.95) {
                    ctx.fillStyle = '#00f3ff'; // Cyan
                } else {
                    ctx.fillStyle = 'rgba(255, 0, 255, 0.4)'; // Faint Magenta
                }
                
                // Draw Hex Character
                ctx.fillText(drop.char, drop.x, drop.y);
                
                // Move
                drop.y += drop.speed;
                
                // Reset if off screen
                if (drop.y > height) {
                    drop.y = -20;
                    drop.speed = Math.random() * 3 + 1;
                    drop.char = Math.floor(Math.random() * 16).toString(16);
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            const originalText = btn.innerText;
            btn.innerHTML = "INIT...";
            btn.style.background = "var(--neon-cyan)";
            btn.style.borderColor = "var(--neon-cyan)";
            btn.style.color = "#000";
            btn.style.boxShadow = "0 0 50px var(--neon-cyan)";
            
            // Simulate transition
            setTimeout(() => {
                alert("SYSTEM READY. ENTERING RHYTHM PROTOCOL.");
                // Reset
                btn.innerHTML = originalText;
                btn.style.background = "transparent";
                btn.style.borderColor = "var(--neon-magenta)";
                btn.style.color = "var(--neon-magenta)";
                btn.style.boxShadow = "0 0 15px var(--neon-magenta)";
            }, 800);
        });

        // Start
        init();
        draw();

    </script>
</body>
</html>
