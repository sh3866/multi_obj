<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette: Synthwave 2088 */
            --bg-deep: #050010;
            --bg-grid: #1a0b2e;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-yellow: #ffe600;
            --neon-purple: #bd00ff;
            --text-white: #ffffff;
            
            /* Dimensions */
            --lane-w: 70px;
            --highway-w: 280px; /* 4 * 70 */
            --pixel-size: 4px; /* Base unit for grid elements */
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-white);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* --- 1. BACKGROUND & ATMOSPHERE --- */

        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Ensure starfield looks retro */
            image-rendering: pixelated; 
        }

        /* The Wireframe Grid Floor */
        .grid-container {
            position: absolute;
            bottom: -30%; /* Move down to anchor vanishing point */
            left: -50%;
            width: 200%;
            height: 70%;
            background: 
                linear-gradient(90deg, rgba(189, 0, 255, 0.2) 2px, transparent 2px),
                linear-gradient(0deg, rgba(189, 0, 255, 0.2) 2px, transparent 2px);
            background-size: 60px 60px;
            /* Perspective matches the vanishing point logic */
            transform: perspective(400px) rotateX(75deg);
            transform-origin: 50% 0%;
            z-index: 1;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 60%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 60%);
            animation: gridScroll 0.8s linear infinite;
            pointer-events: none;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- 2. GAMEPLAY PREVIEW (THE STAGE) --- */
        
        /* 
           Layout Change: The highway is now the central "Stage".
           It occupies the middle of the screen, emerging from the grid.
        */
        .highway-wrapper {
            position: absolute;
            top: 15%; /* Positioned higher up */
            left: 50%;
            transform: translateX(-50%);
            width: var(--highway-w);
            height: 55vh; /* Takes up significant vertical space */
            z-index: 5;
            perspective: 600px;
        }

        .highway-container {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            /* Tilt the stage back to match floor perspective */
            transform: rotateX(35deg);
            position: relative;
        }

        .highway-track {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-left: var(--pixel-size) solid var(--neon-cyan);
            border-right: var(--pixel-size) solid var(--neon-cyan);
            position: relative;
            overflow: hidden;
            /* Pixelated Grid on Track */
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: var(--lane-w) 50px;
        }

        /* Hit Line: Crisp, Aliased Glow */
        .hit-line {
            position: absolute;
            bottom: 40px;
            left: calc(var(--pixel-size) * -1);
            width: calc(100% + var(--pixel-size) * 2);
            height: var(--pixel-size);
            background: var(--text-white);
            /* Hard shadow for phosphor bleed effect */
            box-shadow: 
                0 0 5px var(--text-white),
                0 0 10px var(--text-white),
                0 0 20px var(--neon-magenta);
            z-index: 20;
            transform: translateZ(10px);
            animation: hitPulse 0.8s infinite steps(2);
        }

        @keyframes hitPulse {
            0% { opacity: 1; box-shadow: 0 0 5px var(--text-white), 0 0 15px var(--neon-magenta); }
            50% { opacity: 0.8; }
            100% { opacity: 1; box-shadow: 0 0 10px var(--text-white), 0 0 25px var(--neon-magenta); }
        }

        /* Notes: Pixel Blocks */
        .note {
            position: absolute;
            width: 50px;
            height: 20px; /* Flatter, blockier shape */
            left: 10px; /* Center in 70px lane */
            z-index: 15;
            opacity: 0;
            transform: translateZ(10px);
            /* Pixel shading via box-shadow instead of gradients */
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5); 
            /* Remove smooth rendering */
            image-rendering: pixelated;
        }

        /* Animation Loop */
        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Lane Positions */
        .lane-1 { left: 10px; }
        .lane-2 { left: 80px; }
        .lane-3 { left: 150px; }
        .lane-4 { left: 220px; }

        /* Note Colors & Trails */
        .n-1 { background-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan), inset 0 0 0 2px #fff; animation: fall 1.5s linear infinite; }
        .n-2 { background-color: var(--neon-magenta); box-shadow: 0 0 8px var(--neon-magenta), inset 0 0 0 2px #fff; animation: fall 1.5s linear infinite 0.375s; }
        .n-3 { background-color: var(--neon-yellow); box-shadow: 0 0 8px var(--neon-yellow), inset 0 0 0 2px #fff; animation: fall 1.5s linear infinite 0.75s; }
        .n-4 { background-color: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple), inset 0 0 0 2px #fff; animation: fall 1.5s linear infinite 1.125s; }

        /* --- 3. TYPOGRAPHY & UI --- */

        /* 
           Layout: Title is centered in the sky (Identity).
           Subtitle is subtle.
        */
        .content-layer {
            position: relative;
            z-index: 30;
            text-align: center;
            margin-top: 5vh; /* Tighter to top */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title: Geometric Pixel Font */
        h1 {
            /* Fallback to monospace but styled heavily */
            font-family: 'Courier New', monospace; 
            font-weight: 900;
            font-size: 5rem;
            line-height: 0.9;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #fff;
            position: relative;
            
            /* Pixel Shadow */
            text-shadow: 
                4px 4px 0px #000,
                8px 8px 0px rgba(0,0,0,0.5);
            
            /* CRT Scanline on Text */
            background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 95%, rgba(0,0,0,0.2) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            
            animation: glitch-text 4s infinite;
        }

        /* Glitch Layers */
        h1::before, h1::after {
            content: "PIXEL\nDANCE";
            white-space: pre;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            background: transparent;
        }

        h1::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-4px, 0);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--neon-magenta);
            z-index: -2;
            transform: translate(4px, 0);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { transform: translate(-4px, 0); clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%); }
            20% { transform: translate(-4px, 0); }
            21% { transform: translate(4px, 0); clip-path: polygon(0 10%, 100% 10%, 100% 60%, 0 60%); }
            22% { transform: translate(-4px, 0); clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%); }
            100% { transform: translate(-4px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { transform: translate(4px, 0); clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
            40% { transform: translate(4px, 0); }
            41% { transform: translate(-4px, 0); clip-path: polygon(0 20%, 100% 20%, 100% 80%, 0 80%); }
            42% { transform: translate(4px, 0); clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
            100% { transform: translate(4px, 0); }
        }

        /* Subtitle: Reduced Weight */
        .subtitle {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 8px;
            color: var(--neon-cyan);
            margin-top: 5px;
            margin-bottom: 40px; /* Space before button */
            text-shadow: 0 0 5px var(--neon-cyan);
            text-transform: uppercase;
            opacity: 0.7;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        /* --- 4. START BUTTON (Component Grammar) --- */
        
        /* 
           Positioned at bottom center, anchoring the stage.
           Styled as a chamfered 8-bit block.
        */
        .start-btn-container {
            position: absolute;
            bottom: 8%; /* Anchored near bottom */
            z-index: 40;
        }

        .start-btn {
            background: var(--neon-magenta);
            border: none;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            padding: 15px 60px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            
            /* Pixelated Shape via Clip Path */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
            
            /* Hard 3D Shadow */
            box-shadow: 
                0 6px 0 #880033,
                0 10px 20px rgba(255, 0, 85, 0.4);
            
            transition: transform 0.1s, box-shadow 0.1s;
            animation: btn-glow 1.5s infinite alternate;
        }

        @keyframes btn-glow {
            from { box-shadow: 0 6px 0 #880033, 0 0 10px var(--neon-magenta); }
            to { box-shadow: 0 6px 0 #880033, 0 0 30px var(--neon-magenta); }
        }

        .start-btn:hover {
            transform: translateY(-2px);
            background: #ff3377;
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 #880033, 
                inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- 5. OVERLAYS --- */
        
        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 1px, rgba(0,0,0,0.15) 1px, rgba(0,0,0,0.15) 2px);
            background-size: 100% 2px;
            z-index: 999;
            pointer-events: none;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 60%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Background: Scrolling Starfield -->
    <canvas id="starfield"></canvas>

    <!-- Background: Wireframe Grid -->
    <div class="grid-container"></div>
    
    <!-- Gameplay Preview: The Highway Stage -->
    <div class="highway-wrapper">
        <div class="highway-container">
            <div class="highway-track">
                <!-- Hit Line -->
                <div class="hit-line"></div>

                <!-- Notes: Increased density for rhythm feel -->
                <!-- Lane 1 (Cyan) -->
                <div class="note n-1 lane-1" style="animation-delay: 0s;"></div>
                <div class="note n-1 lane-1" style="animation-delay: 0.75s;"></div>
                <div class="note n-1 lane-1" style="animation-delay: 1.5s;"></div>
                
                <!-- Lane 2 (Magenta) -->
                <div class="note n-2 lane-2" style="animation-delay: 0.375s;"></div>
                <div class="note n-2 lane-2" style="animation-delay: 1.125s;"></div>

                <!-- Lane 3 (Yellow) -->
                <div class="note n-3 lane-3" style="animation-delay: 0.2s;"></div>
                <div class="note n-3 lane-3" style="animation-delay: 0.9s;"></div>
                <div class="note n-3 lane-3" style="animation-delay: 1.6s;"></div>

                <!-- Lane 4 (Purple) -->
                <div class="note n-4 lane-4" style="animation-delay: 0.6s;"></div>
                <div class="note n-4 lane-4" style="animation-delay: 1.3s;"></div>
            </div>
        </div>
    </div>

    <!-- UI: Typography & Button -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
        <div class="subtitle">Rhythm Protocol</div>
    </div>

    <!-- UI: Action Button -->
    <div class="start-btn-container">
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        // Optimized for performance and "Warp Speed" aesthetic
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            stars = [];
            const numStars = 200; // More stars for density
            
            for (let i = 0; i < numStars; i++) {
                stars.push(createStar());
            }
        }

        function createStar() {
            return {
                x: Math.random() * width - width / 2,
                y: Math.random() * height - height / 2,
                z: Math.random() * width // Depth
            };
        }

        function draw() {
            // Dark background with slight trail effect
            ctx.fillStyle = "rgba(5, 0, 16, 0.6)"; 
            ctx.fillRect(0, 0, width, height);
            
            const cx = width / 2;
            const cy = height / 2; // Vanishing point center

            stars.forEach(star => {
                // Move star closer
                star.z -= 8; // Faster warp speed

                // Reset if passed camera
                if (star.z <= 0) {
                    star.x = Math.random() * width - width / 2;
                    star.y = Math.random() * height - height / 2;
                    star.z = width;
                }

                // Project 3D to 2D
                // Using a perspective divisor
                const scale = 800 / star.z; 
                const x2d = (star.x * scale) + cx;
                const y2d = (star.y * scale) + cy;

                // Draw star
                // Size grows as it gets closer (linear scaling)
                const size = Math.max(0, (width - star.z) / 400);
                
                // Only draw if within screen bounds
                if (size > 0 && x2d > 0 && x2d < width && y2d > 0 && y2d < height) {
                    
                    // Color logic
                    const rand = Math.random();
                    if (rand > 0.95) ctx.fillStyle = "#ff0055"; // Magenta
                    else if (rand > 0.90) ctx.fillStyle = "#00f3ff"; // Cyan
                    else ctx.fillStyle = "#ffffff"; // White

                    // Draw square pixel
                    // Using Math.floor to snap to pixel grid for retro feel
                    ctx.fillRect(Math.floor(x2d), Math.floor(y2d), Math.max(1, size), Math.max(1, size));
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Glitch transition effect
            document.body.style.transform = "skewX(10deg)";
            document.body.style.filter = "contrast(1.5) brightness(1.2)";
            
            setTimeout(() => {
                document.body.style.transform = "none";
                document.body.style.filter = "none";
                // Simulate game start
                const btnText = btn.innerText;
                btn.innerText = "LOADING...";
                setTimeout(() => {
                    alert("SYSTEM READY. ENTERING RHYTHM PROTOCOL.");
                    btn.innerText = btnText;
                }, 500);
            }, 200);
        });

        // Start
        init();
        draw();

    </script>
</body>
</html>
