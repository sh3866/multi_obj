<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette: Synthwave 2088 */
            --bg-deep: #080014;
            --bg-grid: #1a0b2e;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-yellow: #ffe600;
            --neon-purple: #bd00ff;
            --text-white: #ffffff;
            
            /* Dimensions */
            --lane-w: 60px;
            --highway-w: 240px; /* 4 * 60 */
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-white);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Top alignment for hierarchy */
        }

        /* --- 1. BACKGROUND & ATMOSPHERE --- */

        /* The Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Pixelated 8-Bit Sun */
        .sun-container {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--neon-yellow) 0%, var(--neon-magenta) 100%);
            /* Pixelated horizontal stripes via SVG mask encoded in data URI */
            -webkit-mask-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='100' height='50' fill='black'/%3E%3Crect x='0' y='55' width='100' height='3' fill='black'/%3E%3Crect x='0' y='62' width='100' height='3' fill='white'/%3E%3Crect x='0' y='70' width='100' height='4' fill='black'/%3E%3Crect x='0' y='78' width='100' height='5' fill='white'/%3E%3Crect x='0' y='88' width='100' height='6' fill='black'/%3E%3Crect x='0' y='98' width='100' height='8' fill='white'/%3E%3C/svg%3E");
            mask-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='100' height='50' fill='black'/%3E%3Crect x='0' y='55' width='100' height='3' fill='black'/%3E%3Crect x='0' y='62' width='100' height='3' fill='white'/%3E%3Crect x='0' y='70' width='100' height='4' fill='black'/%3E%3Crect x='0' y='78' width='100' height='5' fill='white'/%3E%3Crect x='0' y='88' width='100' height='6' fill='black'/%3E%3Crect x='0' y='98' width='100' height='8' fill='white'/%3E%3C/svg%3E");
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            image-rendering: pixelated;
            box-shadow: 0 0 40px var(--neon-magenta);
        }

        /* The Wireframe Grid Floor */
        .grid-container {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 60%;
            background: 
                linear-gradient(90deg, rgba(189, 0, 255, 0.3) 1px, transparent 1px),
                linear-gradient(0deg, rgba(189, 0, 255, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(70deg);
            transform-origin: top center;
            z-index: 2;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 10%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 10%, transparent 80%);
            animation: gridScroll 1s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        /* --- 2. GAMEPLAY PREVIEW (HIGHWAY) --- */
        
        .highway-wrapper {
            position: absolute;
            top: 45%; /* Lower down to separate from title */
            width: var(--highway-w);
            height: 300px;
            z-index: 10;
            perspective: 800px;
        }

        /* The 3D Container */
        .highway-container {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(40deg);
            position: relative;
            /* Floor glow */
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        /* The Tracks */
        .highway-track {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid var(--neon-cyan);
            border-right: 4px solid var(--neon-cyan);
            position: relative;
            overflow: hidden;
            /* Make it look like a physical track */
            background-image: linear-gradient(90deg, transparent 95%, rgba(255,255,255,0.1) 95%);
            background-size: 60px 100%; /* Matches lane width */
        }

        /* 3D Hit Line (The "Neon Bar") */
        .hit-line {
            position: absolute;
            bottom: 30px;
            left: -10px;
            width: calc(100% + 20px);
            height: 12px;
            background: var(--text-white);
            box-shadow: 
                0 0 15px var(--text-white),
                0 0 30px var(--neon-magenta),
                inset 0 0 5px var(--neon-magenta);
            z-index: 15;
            transform: translateZ(10px); /* Lift it up */
            animation: hitPulse 0.5s infinite alternate;
        }

        @keyframes hitPulse {
            0% { box-shadow: 0 0 10px var(--text-white), 0 0 20px var(--neon-magenta); }
            100% { box-shadow: 0 0 20px var(--text-white), 0 0 40px var(--neon-magenta); opacity: 0.9; }
        }

        /* Notes */
        .note {
            position: absolute;
            width: 50px;
            height: 50px;
            left: 5px; /* Center in 60px lane */
            box-shadow: 0 0 10px currentColor, inset 0 0 5px rgba(255,255,255,0.5);
            border: 2px solid #fff;
            z-index: 12;
            opacity: 0;
            transform: translateZ(10px);
        }

        /* Note Shapes */
        .note::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40%; height: 40%;
            background: rgba(255,255,255,0.4);
        }

        /* Animation Loop */
        @keyframes fall {
            0% { top: -60px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 320px; opacity: 0; }
        }

        /* Lane Colors */
        .lane-1 { left: 0px; }
        .lane-2 { left: 60px; }
        .lane-3 { left: 120px; }
        .lane-4 { left: 180px; }

        .n-1 { background-color: var(--neon-cyan); color: var(--neon-cyan); animation: fall 2s linear infinite; }
        .n-2 { background-color: var(--neon-magenta); color: var(--neon-magenta); animation: fall 2s linear infinite 0.5s; }
        .n-3 { background-color: var(--neon-yellow); color: var(--neon-yellow); animation: fall 2s linear infinite 1.1s; }
        .n-4 { background-color: var(--neon-purple); color: var(--neon-purple); animation: fall 2s linear infinite 1.6s; }

        /* --- 3. TYPOGRAPHY & UI --- */

        .content-layer {
            position: relative;
            z-index: 30;
            text-align: center;
            margin-top: 8vh; /* Pushed up */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title: Pixel Font Style */
        h1 {
            font-family: 'Courier New', Courier, monospace; /* Fallback, but styled pixel-like */
            font-weight: 900;
            font-size: 4.5rem;
            line-height: 1;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -3px;
            color: #fff;
            position: relative;
            
            /* Hard Stepped Pixel Shadow */
            text-shadow: 
                4px 4px 0px #000,
                6px 6px 0px #000;

            /* Chromatic Aberration (Glitch) */
            animation: glitch-text 3s infinite;
        }

        /* Glitch Layers */
        h1::before, h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-3px, 0);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--neon-magenta);
            z-index: -2;
            transform: translate(3px, 0);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { transform: translate(-3px, 0); }
            20% { transform: translate(-3px, 0); }
            21% { transform: translate(3px, 0); }
            22% { transform: translate(-3px, 0); }
            100% { transform: translate(-3px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { transform: translate(3px, 0); }
            40% { transform: translate(3px, 0); }
            41% { transform: translate(-3px, 0); }
            42% { transform: translate(3px, 0); }
            100% { transform: translate(3px, 0); }
        }

        /* Subtitle */
        .subtitle {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 12px;
            color: var(--neon-cyan);
            margin-top: 10px;
            text-shadow: 2px 2px 0 var(--neon-magenta);
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* --- 4. START BUTTON --- */
        
        /* Elevated, Bright, Distinct */
        .start-btn {
            margin-top: 50px; /* More whitespace */
            background: var(--neon-magenta);
            border: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 2rem;
            padding: 20px 70px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            box-shadow: 
                0 6px 0 #880033, /* Hard 3D bottom */
                0 10px 20px rgba(255, 0, 85, 0.5), /* Glow */
                inset 0 2px 0 rgba(255,255,255,0.4); /* Highlight */
            
            /* Pixelated Corners */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            
            transition: transform 0.1s, box-shadow 0.1s;
            animation: btn-glow 2s infinite alternate;
        }

        @keyframes btn-glow {
            from { box-shadow: 0 6px 0 #880033, 0 0 10px var(--neon-magenta); }
            to { box-shadow: 0 6px 0 #880033, 0 0 25px var(--neon-magenta); }
        }

        .start-btn:hover {
            transform: translateY(-2px);
            background: #ff3377;
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 #880033, 
                inset 0 0 20px rgba(0,0,0,0.3);
        }

        /* --- 5. OVERLAYS --- */
        
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 50%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Background: Scrolling Starfield -->
    <canvas id="starfield"></canvas>

    <!-- Background: Pixelated Sun -->
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>

    <!-- Background: Wireframe Grid -->
    <div class="grid-container"></div>
    
    <!-- Gameplay Preview: Highway -->
    <div class="highway-wrapper">
        <div class="highway-container">
            <div class="highway-track">
                <!-- Hit Line (3D Bar) -->
                <div class="hit-line"></div>

                <!-- Floating Notes (Populated to show gameplay loop) -->
                <!-- Lane 1 (Cyan) -->
                <div class="note n-1 lane-1" style="animation-delay: 0s;"></div>
                <div class="note n-1 lane-1" style="animation-delay: 1.8s;"></div>
                
                <!-- Lane 2 (Magenta) -->
                <div class="note n-2 lane-2" style="animation-delay: 0.5s;"></div>
                <div class="note n-2 lane-2" style="animation-delay: 2.3s;"></div>

                <!-- Lane 3 (Yellow) -->
                <div class="note n-3 lane-3" style="animation-delay: 1.1s;"></div>
                <div class="note n-3 lane-3" style="animation-delay: 2.9s;"></div>

                <!-- Lane 4 (Purple) -->
                <div class="note n-4 lane-4" style="animation-delay: 1.6s;"></div>
                <div class="note n-4 lane-4" style="animation-delay: 0.2s;"></div>
            </div>
        </div>
    </div>

    <!-- UI: Typography & Button -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
        <div class="subtitle">Rhythm Protocol</div>
        <button class="start-btn">START</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        // Creates a sense of forward motion through space
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            stars = [];
            const numStars = 150;
            
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width - width / 2,
                    y: Math.random() * height - height / 2,
                    z: Math.random() * width // Depth
                });
            }
        }

        function draw() {
            // Fade effect for trails
            ctx.fillStyle = "rgba(8, 0, 20, 0.4)"; 
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = "#ffffff";
            
            // Center of screen for perspective
            const cx = width / 2;
            const cy = height / 2;

            stars.forEach(star => {
                // Move star closer
                star.z -= 4; // Speed

                // Reset if passed camera
                if (star.z <= 0) {
                    star.x = Math.random() * width - width / 2;
                    star.y = Math.random() * height - height / 2;
                    star.z = width;
                }

                // Project 3D to 2D
                const scale = 1000 / star.z; // Perspective divisor
                const x2d = (star.x * scale) + cx;
                const y2d = (star.y * scale) + cy;

                // Draw star
                const size = Math.max(0, (1000 - star.z) / 500);
                if (size > 0 && x2d > 0 && x2d < width && y2d > 0 && y2d < height) {
                    // Randomly color some stars cyan/magenta for theme
                    if (Math.random() > 0.98) ctx.fillStyle = "#00f3ff";
                    else if (Math.random() > 0.98) ctx.fillStyle = "#ff0055";
                    else ctx.fillStyle = "#ffffff";

                    ctx.fillRect(x2d, y2d, size + 1, size + 1); // Square stars for pixel feel
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Glitch transition effect
            document.body.style.transform = "skewX(20deg)";
            document.body.style.filter = "hue-rotate(90deg)";
            
            setTimeout(() => {
                document.body.style.transform = "none";
                document.body.style.filter = "none";
                alert("SYSTEM READY. ENTERING RHYTHM PROTOCOL.");
            }, 200);
        });

        // Start
        init();
        draw();

    </script>
</body>
</html>
