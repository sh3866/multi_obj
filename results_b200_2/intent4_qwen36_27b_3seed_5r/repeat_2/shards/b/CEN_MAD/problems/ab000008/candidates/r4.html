<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette: High Contrast Synthwave */
            --bg-deep: #050010;
            --bg-grid: #2a0e45;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-yellow: #ffe600;
            --neon-purple: #bd00ff;
            --text-white: #ffffff;
            
            /* Dimensions */
            --lane-w: 64px;
            --highway-w: 256px; /* 4 * 64 */
            --pixel-unit: 4px;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-white);
            /* Using a system monospace stack to simulate pixel font without network */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- 1. BACKGROUND & ATMOSPHERE --- */

        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            image-rendering: pixelated; 
        }

        /* The Wireframe Grid Floor - Strengthened */
        .grid-container {
            position: absolute;
            bottom: -20%; 
            left: -50%;
            width: 200%;
            height: 60%;
            /* Stronger grid lines */
            background: 
                linear-gradient(90deg, rgba(189, 0, 255, 0.4) 2px, transparent 2px),
                linear-gradient(0deg, rgba(189, 0, 255, 0.4) 2px, transparent 2px);
            background-size: 80px 80px;
            transform: perspective(400px) rotateX(65deg);
            transform-origin: 50% 0%;
            z-index: 1;
            /* Harder fade */
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 40%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 40%);
            animation: gridScroll 0.6s linear infinite;
            pointer-events: none;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }

        /* --- 2. TYPOGRAPHY (CRITICAL OVERHAUL) --- */

        .content-layer {
            position: relative;
            z-index: 50;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: -40px; /* Overlap highway slightly */
        }

        /* Title: Blocky, Pixelated, Hard Shadow */
        h1 {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 4.5rem;
            line-height: 1;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -4px;
            color: #fff;
            position: relative;
            
            /* HARD Drop Shadow (No Blur) */
            text-shadow: 
                6px 6px 0px #000,
                10px 10px 0px rgba(0,0,0,0.4);
            
            /* Slight scaling to make it look wider/blockier */
            transform: scaleX(1.1);
        }

        /* Glitch Layers for Title */
        h1::before, h1::after {
            content: "PIXEL";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.7;
        }

        h1::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-4px, 0);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--neon-magenta);
            z-index: -2;
            transform: translate(4px, 0);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { transform: translate(-4px, 0); clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%); }
            20% { transform: translate(-4px, 0); }
            21% { transform: translate(4px, 0); clip-path: polygon(0 10%, 100% 10%, 100% 60%, 0 60%); }
            22% { transform: translate(-4px, 0); clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%); }
            100% { transform: translate(-4px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { transform: translate(4px, 0); clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
            40% { transform: translate(4px, 0); }
            41% { transform: translate(-4px, 0); clip-path: polygon(0 20%, 100% 20%, 100% 80%, 0 80%); }
            42% { transform: translate(4px, 0); clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
            100% { transform: translate(4px, 0); }
        }

        /* Subtitle: Monospaced, Reduced Opacity */
        .subtitle {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            margin-top: 8px;
            text-transform: uppercase;
            opacity: 0.6;
            text-shadow: none;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        /* --- 3. GAMEPLAY PREVIEW (THE HIGHWAY) --- */
        
        .highway-wrapper {
            position: relative;
            width: var(--highway-w);
            height: 35vh; /* Compact vertical stack */
            z-index: 10;
            perspective: 600px;
            margin: 10px 0;
        }

        .highway-container {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(30deg);
            position: relative;
            /* Pixelated Border */
            border: var(--pixel-unit) solid var(--neon-cyan);
            box-shadow: 
                0 0 0 4px #000, 
                0 0 15px var(--neon-cyan);
            background: #000;
        }

        .highway-track {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            /* Aliased Grid on Track */
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: var(--lane-w) 40px;
        }

        /* Hit Line: Hard Edged */
        .hit-line {
            position: absolute;
            bottom: 20px;
            left: -4px;
            width: calc(100% + 8px);
            height: var(--pixel-unit);
            background: var(--text-white);
            /* Hard shadow for phosphor bleed */
            box-shadow: 
                0 0 0 2px #000,
                0 0 10px var(--neon-magenta),
                0 0 20px var(--neon-magenta);
            z-index: 20;
        }

        /* Notes: 8-bit Blocks */
        .note {
            position: absolute;
            width: 48px; /* Snapped to grid */
            height: 16px;
            left: 8px; /* Center in 64px lane */
            z-index: 15;
            opacity: 0;
            /* Pixel shading via solid inset borders instead of gradients */
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.2);
        }

        @keyframes fall {
            0% { top: -40px; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .lane-1 { left: 8px; }
        .lane-2 { left: 72px; }
        .lane-3 { left: 136px; }
        .lane-4 { left: 200px; }

        .n-1 { background-color: var(--neon-cyan); animation: fall 1.2s linear infinite; }
        .n-2 { background-color: var(--neon-magenta); animation: fall 1.2s linear infinite 0.3s; }
        .n-3 { background-color: var(--neon-yellow); animation: fall 1.2s linear infinite 0.6s; }
        .n-4 { background-color: var(--neon-purple); animation: fall 1.2s linear infinite 0.9s; }

        /* --- 4. START BUTTON (BUTTON CRAFT) --- */
        
        .start-btn-container {
            position: relative;
            z-index: 40;
            margin-top: 15px; /* Tight spacing */
        }

        .start-btn {
            background: var(--neon-magenta);
            border: 4px solid #fff;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 15px 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            
            /* Stepped Pixel Border using Box Shadow trick */
            box-shadow: 
                inset -4px -4px 0px 0px #880033,
                inset 4px 4px 0px 0px #ff6699,
                0 0 0 4px #000,
                6px 6px 0px 4px rgba(0,0,0,0.5),
                0 0 20px var(--neon-magenta);

            transition: transform 0.05s;
            image-rendering: pixelated;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background: #ff3377;
            box-shadow: 
                inset -4px -4px 0px 0px #880033,
                inset 4px 4px 0px 0px #ff6699,
                0 0 0 4px #000,
                8px 8px 0px 4px rgba(0,0,0,0.5),
                0 0 30px var(--neon-magenta);
        }

        .start-btn:active {
            transform: scale(0.98) translateY(4px);
            box-shadow: 
                inset -4px -4px 0px 0px #880033,
                inset 4px 4px 0px 0px #ff6699,
                0 0 0 4px #000,
                2px 2px 0px 4px rgba(0,0,0,0.5);
        }

        /* --- 5. OVERLAYS --- */
        
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 1px, rgba(0,0,0,0.2) 1px, rgba(0,0,0,0.2) 2px);
            background-size: 100% 4px; /* Larger scanlines for retro look */
            z-index: 999;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 50%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Background: Scrolling Starfield -->
    <canvas id="starfield"></canvas>

    <!-- Background: Wireframe Grid -->
    <div class="grid-container"></div>
    
    <!-- Unified Vertical Stack -->
    
    <!-- 1. Title -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
        <div class="subtitle">Rhythm Protocol</div>
    </div>

    <!-- 2. Gameplay Preview (Highway) -->
    <div class="highway-wrapper">
        <div class="highway-container">
            <div class="highway-track">
                <!-- Hit Line -->
                <div class="hit-line"></div>

                <!-- Notes: Pixel Blocks -->
                <!-- Lane 1 (Cyan) -->
                <div class="note n-1 lane-1" style="animation-delay: 0s;"></div>
                <div class="note n-1 lane-1" style="animation-delay: 0.6s;"></div>
                <div class="note n-1 lane-1" style="animation-delay: 1.2s;"></div>
                
                <!-- Lane 2 (Magenta) -->
                <div class="note n-2 lane-2" style="animation-delay: 0.3s;"></div>
                <div class="note n-2 lane-2" style="animation-delay: 0.9s;"></div>

                <!-- Lane 3 (Yellow) -->
                <div class="note n-3 lane-3" style="animation-delay: 0.15s;"></div>
                <div class="note n-3 lane-3" style="animation-delay: 0.75s;"></div>

                <!-- Lane 4 (Purple) -->
                <div class="note n-4 lane-4" style="animation-delay: 0.45s;"></div>
                <div class="note n-4 lane-4" style="animation-delay: 1.05s;"></div>
            </div>
        </div>
    </div>

    <!-- 3. Start Button -->
    <div class="start-btn-container">
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            stars = [];
            const numStars = 150;
            
            for (let i = 0; i < numStars; i++) {
                stars.push(createStar());
            }
        }

        function createStar() {
            return {
                x: Math.random() * width - width / 2,
                y: Math.random() * height - height / 2,
                z: Math.random() * width
            };
        }

        function draw() {
            // Clear with deep background color
            ctx.fillStyle = "rgba(5, 0, 16, 1)"; 
            ctx.fillRect(0, 0, width, height);
            
            const cx = width / 2;
            const cy = height / 2;

            stars.forEach(star => {
                star.z -= 15; // Warp speed

                if (star.z <= 0) {
                    star.x = Math.random() * width - width / 2;
                    star.y = Math.random() * height - height / 2;
                    star.z = width;
                }

                const scale = 600 / star.z; 
                const x2d = (star.x * scale) + cx;
                const y2d = (star.y * scale) + cy;

                // Pixelated sizing
                const size = Math.max(1, Math.floor(3 * scale));
                
                if (size > 0 && x2d > 0 && x2d < width && y2d > 0 && y2d < height) {
                    // Neon colors
                    const rand = Math.random();
                    if (rand > 0.95) ctx.fillStyle = "#ff0055";
                    else if (rand > 0.90) ctx.fillStyle = "#00f3ff";
                    else ctx.fillStyle = "#ffffff";

                    // Draw Square (Pixel)
                    ctx.fillRect(Math.floor(x2d), Math.floor(y2d), size, size);
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            btn.innerText = "LOADING...";
            document.body.style.transform = "scale(1.1)";
            document.body.style.filter = "brightness(1.5) contrast(1.2)";
            
            setTimeout(() => {
                document.body.style.transform = "none";
                document.body.style.filter = "none";
                alert("SYSTEM READY. ENTERING RHYTHM PROTOCOL.");
                btn.innerText = "START GAME";
            }, 300);
        });

        // Start
        init();
        draw();

    </script>
</body>
</html>
