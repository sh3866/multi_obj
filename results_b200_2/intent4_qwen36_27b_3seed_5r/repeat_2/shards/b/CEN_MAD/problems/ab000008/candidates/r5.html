<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-deep: #050010;
            --c-cyan: #00f3ff;
            --c-magenta: #ff0055;
            --c-yellow: #ffe600;
            --c-white: #ffffff;
            --c-grid: #2a0e45;
            --p-unit: 4px;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--c-deep);
            color: var(--c-white);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace; /* Fallback base */
        }

        /* --- 1. ATMOSPHERE: STARS & GRID --- */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .grid-floor {
            position: absolute;
            top: 40%; left: -50%; width: 200%; height: 60%;
            background: 
                linear-gradient(90deg, var(--c-magenta) 1px, transparent 1px),
                linear-gradient(0deg, var(--c-magenta) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(600px) rotateX(75deg);
            animation: gridMove 1s linear infinite;
            z-index: 1;
            mask-image: linear-gradient(to bottom, transparent 10%, black 40%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 10%, black 40%, black 100%);
            opacity: 0.4;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* --- 2. LAYOUT & TYPOGRAPHY --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* Pixel Font Simulation */
        .pixel-text {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-transform: uppercase;
            -webkit-font-smoothing: none;
            text-rendering: geometricPrecision;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            margin: 0 0 10px 0;
            letter-spacing: -4px;
            color: var(--c-white);
            text-shadow: 
                4px 4px 0px #000,
                6px 6px 0px var(--c-cyan);
            position: relative;
        }

        /* Glitch effect layers */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.7;
        }
        h1::before { color: var(--c-magenta); z-index: -1; transform: translate(-4px, -2px); }
        h1::after { color: var(--c-cyan); z-index: -2; transform: translate(4px, 2px); }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: var(--c-yellow);
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
            background: #000;
            padding: 4px 12px;
            border: 2px solid var(--c-yellow);
            box-shadow: 4px 4px 0 rgba(255,230,0,0.3);
        }

        /* --- 3. HIGHWAY (1-POINT PERSPECTIVE) --- */
        .highway-stage {
            width: 320px;
            height: 200px;
            perspective: 600px;
            position: relative;
            margin-bottom: 30px;
        }

        .highway-board {
            width: 100%; height: 100%;
            transform: rotateX(45deg);
            transform-origin: 50% 100%;
            background: #000;
            border: 4px solid var(--c-cyan);
            /* Stepped Glow (Pixel Bloom) */
            box-shadow: 
                0 0 0 4px #000,
                0 0 0 8px var(--c-cyan),
                0 0 20px var(--c-cyan);
            position: relative;
            overflow: hidden;
        }

        /* Lanes Grid */
        .lane-grid {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.15) 2px, transparent 2px);
            background-size: 25% 100%;
            background-position: 25% 0, 50% 0, 75% 0;
            background-repeat: no-repeat;
        }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 0; left: -4px; right: -4px;
            height: 4px;
            background: var(--c-white);
            box-shadow: 0 0 10px var(--c-white);
            z-index: 5;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 24%; 
            height: 32px;
            border: 2px solid #fff;
            box-shadow: inset 0 0 0 4px rgba(0,0,0,0.3);
            opacity: 0;
            animation: fall 1.5s linear infinite;
        }

        .note::after {
            content:''; position: absolute; top:4px; left:4px; right:4px; height:4px; background:rgba(255,255,255,0.5);
        }

        @keyframes fall {
            0% { transform: translateY(-50px); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(200px); opacity: 1; }
        }

        .n-1 { left: 0; background: var(--c-cyan); animation-delay: 0.0s; }
        .n-2 { left: 25%; background: var(--c-magenta); animation-delay: 0.4s; }
        .n-3 { left: 50%; background: var(--c-yellow); animation-delay: 0.8s; }
        .n-4 { left: 75%; background: var(--c-cyan); animation-delay: 1.2s; }

        /* Secondary notes for rhythm density */
        .n-1b { left: 0; background: var(--c-cyan); animation-delay: 0.7s; }
        .n-2b { left: 25%; background: var(--c-magenta); animation-delay: 1.1s; }

        /* --- 4. BUTTON (BLOCKY & DISTINCT) --- */
        .btn-start {
            background: var(--c-magenta);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            padding: 20px 40px;
            cursor: pointer;
            position: relative;
            /* Pixel Art Border via Box Shadow */
            box-shadow: 
                inset -6px -6px 0px 0px #880033,
                inset 6px 6px 0px 0px #ff88aa,
                0 0 0 4px #000,
                6px 6px 0px 4px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .btn-start:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        .btn-start:active {
            transform: scale(0.98) translate(4px, 4px);
            box-shadow: 
                inset -6px -6px 0px 0px #880033,
                inset 6px 6px 0px 0px #ff88aa,
                0 0 0 4px #000,
                2px 2px 0px 4px rgba(0,0,0,0.5);
        }

        /* --- 5. OVERLAYS --- */
        .scanlines {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 999;
            pointer-events: none;
        }
        .vignette {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle, transparent 60%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <canvas id="starfield"></canvas>
    <div class="grid-floor"></div>

    <div class="content-wrapper">
        <h1 class="pixel-text" data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
        <div class="subtitle pixel-text">RHYTHM PROTOCOL</div>

        <div class="highway-stage">
            <div class="highway-board">
                <div class="lane-grid"></div>
                <div class="hit-line"></div>
                <!-- Notes -->
                <div class="note n-1"></div>
                <div class="note n-1b"></div>
                <div class="note n-2"></div>
                <div class="note n-2b"></div>
                <div class="note n-3"></div>
                <div class="note n-4"></div>
            </div>
        </div>

        <button class="btn-start pixel-text" onclick="startGame()">START GAME</button>
    </div>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // STARFIELD WARP ENGINE
        const cvs = document.getElementById('starfield');
        const ctx = cvs.getContext('2d');
        let w, h;
        const stars = [];
        const count = 200;

        function resize() {
            w = cvs.width = window.innerWidth;
            h = cvs.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.x = Math.random() * w - w/2;
                this.y = Math.random() * h - h/2;
                this.z = Math.random() * w;
            }
            update() {
                this.z -= 15;
                if (this.z <= 0) {
                    this.z = w;
                    this.x = Math.random() * w - w/2;
                    this.y = Math.random() * h - h/2;
                }
            }
            draw() {
                const sx = (this.x * (w/this.z)) + w/2;
                const sy = (this.y * (w/this.z)) + h/2;
                const size = Math.max(1, (w/this.z) * 2);
                
                // Draw square pixels
                ctx.fillStyle = (Math.random() > 0.95) ? '#ff0055' : '#ffffff';
                ctx.fillRect(Math.floor(sx), Math.floor(sy), Math.floor(size), Math.floor(size));
            }
        }

        for(let i=0; i<count; i++) stars.push(new Star());

        function loop() {
            ctx.fillStyle = '#050010';
            ctx.fillRect(0, 0, w, h);
            stars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(loop);
        }
        loop();

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerText = "INITIALIZING...";
            document.body.style.filter = "contrast(1.5) brightness(1.2)";
            setTimeout(() => {
                document.body.style.filter = "none";
                alert("SYSTEM READY. ENTERING PROTOCOL.");
                btn.innerText = "START GAME";
            }, 500);
        }
    </script>
</body>
</html>
