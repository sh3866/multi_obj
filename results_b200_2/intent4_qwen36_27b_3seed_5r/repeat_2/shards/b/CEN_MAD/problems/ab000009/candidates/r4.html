<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Modern Slate & Cream */
            --bg-body: #0f172a; /* Deep Slate Background */
            --bg-panel: #1e293b; /* Panel Background */
            --bg-panel-border: #334155;
            
            /* Board Colors: Neutral Cool Tones */
            --board-light: #e8e9eb; /* Cool Off-White */
            --board-dark: #7d8796;  /* Slate Blue/Grey */
            
            /* UI Text */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            /* Interactive Colors */
            --primary-accent: #3b82f6; /* Blue for active states */
            --btn-primary-bg: #3b82f6;
            --btn-primary-hover: #2563eb;
            
            /* Dimensions */
            --square-size: clamp(35px, 9vw, 80px);
            --board-total-size: calc(var(--square-size) * 8);
            
            /* Spacing & Radius */
            --radius-lg: 16px;
            --radius-md: 8px;
            --radius-sm: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Layout */
        .interface-container {
            display: flex;
            gap: 48px;
            align-items: center;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            justify-content: center;
        }

        /* --- The Chessboard Frame --- */
        .board-frame {
            background-color: var(--bg-panel);
            padding: 16px;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--bg-panel-border);
        }

        /* Horizontal Coordinate Strip */
        .file-strip {
            display: grid;
            grid-template-columns: repeat(8, var(--square-size));
            margin-left: 28px; /* Offset for rank strip */
            margin-bottom: 6px;
        }
        .file-strip span {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .board-inner {
            display: flex;
            align-items: flex-start;
        }

        /* Vertical Coordinate Strip */
        .rank-strip {
            display: grid;
            grid-template-rows: repeat(8, var(--square-size));
            margin-right: 6px;
            width: 24px;
        }
        .rank-strip span {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* The Grid */
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, var(--square-size));
            grid-template-rows: repeat(8, var(--square-size));
            width: var(--board-total-size);
            height: var(--board-total-size);
            border: 4px solid var(--bg-panel);
            border-radius: var(--radius-sm);
            position: relative;
            background-color: var(--bg-panel); /* Gap fill color */
            gap: 1px; /* Optional subtle separation */
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* No drop shadow for cleaner look */
            z-index: 10;
        }
        .piece:hover { transform: scale(1.1) translateY(-2px); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 380px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(var(--board-total-size) + 48px); /* Match board height + padding */
            border: 1px solid var(--bg-panel-border);
        }

        /* Header */
        .panel-header {
            padding: 24px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--bg-panel-border);
        }

        .game-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .player-row:last-child { margin-bottom: 0; }

        /* Active State: Distinct Visual */
        .player-row.active {
            background: rgba(59, 130, 246, 0.1); /* Subtle blue tint */
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        .player-icon.white { background: #e8e9eb; border-color: #cbd5e1; }
        .player-icon.black { background: #1e293b; border-color: #475569; }

        .player-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .player-row.active .player-name { color: var(--text-primary); }

        .timer {
            font-family: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
            font-size: 1rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 6px 12px;
            border-radius: 6px;
            letter-spacing: 0.05em;
            min-width: 70px;
            text-align: center;
        }
        .player-row.active .timer {
            color: var(--text-primary);
            background: rgba(0,0,0,0.4);
            font-weight: 600;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: var(--bg-panel);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            font-size: 0.9rem;
        }

        .history-table th {
            text-align: left;
            padding: 16px 24px 12px 24px;
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--bg-panel-border);
            position: sticky;
            top: 0;
            background: var(--bg-panel);
        }
        .history-table th:last-child { text-align: right; padding-right: 24px; }

        .history-table td {
            padding: 10px 24px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .history-table td:last-child { text-align: right; padding-right: 24px; }
        
        /* Zebra Striping */
        .history-table tr:nth-child(even) { background-color: rgba(255,255,255,0.02); }
        
        .history-table td:first-child { 
            color: var(--text-muted); 
            width: 40px; 
            font-family: monospace;
            font-size: 0.8rem;
        }

        /* Controls */
        .controls {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--bg-panel-border);
            background: rgba(0,0,0,0.1);
        }

        .btn {
            border: none;
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
            text-align: center;
        }

        /* Primary Action: New Game */
        .btn-primary {
            background-color: var(--btn-primary-bg);
            grid-column: span 2; /* Full width */
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { 
            background-color: var(--btn-primary-hover); 
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Secondary Actions: Undo / Draw */
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--bg-panel-border);
            color: var(--text-secondary);
        }
        .btn-secondary:hover { 
            background-color: rgba(255,255,255,0.05); 
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media (max-width: 900px) {
            .interface-container { flex-direction: column; gap: 32px; }
            .panel { width: var(--board-total-size); height: auto; max-height: 400px; }
            .board-inner { margin: 0 auto; }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        
        <!-- Board Section -->
        <div class="board-frame">
            <!-- Top File Labels -->
            <div class="file-strip">
                <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
            
            <div class="board-inner">
                <!-- Left Rank Labels -->
                <div class="rank-strip">
                    <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
                </div>

                <!-- The Grid -->
                <div class="chessboard" id="board">
                    <!-- Generated by JS -->
                </div>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="game-title">Standard • Classical</div>
                
                <!-- White Status (Active) -->
                <div class="player-row active" id="bar-white">
                    <div class="player-info">
                        <div class="player-icon white"></div>
                        <span class="player-name">White</span>
                    </div>
                    <div class="timer" id="timer-white">10:00</div>
                </div>

                <!-- Black Status -->
                <div class="player-row" id="bar-black">
                    <div class="player-info">
                        <div class="player-icon black"></div>
                        <span class="player-name">Black</span>
                    </div>
                    <div class="timer" id="timer-black">10:00</div>
                </div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <!-- Hierarchy Fixed: Secondary buttons first visually or logically, Primary is the big action -->
                <button class="btn btn-secondary">Undo</button>
                <button class="btn btn-secondary">Draw</button>
                <button class="btn btn-primary" onclick="resetBoard()">New Game</button>
            </div>
        </div>

    </div>

<script>

        }
    };

    // --- Game State ---
    // Standard starting position
    const initialBoard = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black (row 0)
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White (row 7)
    ];

    const boardEl = document.getElementById('board');
    const historyEl = document.getElementById('move-history');

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on position for the initial setup
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function populateHistory() {
        const dummyMoves = [
            { n: 1, w: 'e4', b: 'e5' },
            { n: 2, w: 'Nf3', b: 'Nc6' },
            { n: 3, w: 'Bb5', b: 'a6' },
            { n: 4, w: 'Ba4', b: 'Nf6' }
        ];

        historyEl.innerHTML = '';
        dummyMoves.forEach(move => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${move.n}.</td>
                <td>${move.w}</td>
                <td>${move.b}</td>
            `;
            historyEl.appendChild(tr);
        });
    }

    function resetBoard() {
        // 1. Clear Board
        renderBoard();
        
        // 2. Reset Move History
        populateHistory();
        
        // 3. Reset UI State
        document.getElementById('bar-white').classList.add('active');
        document.getElementById('bar-black').classList.remove('active');
        document.getElementById('timer-white').innerText = "10:00";
        document.getElementById('timer-black').innerText = "10:00";
    }

    // Initial Render
    renderBoard();
    populateHistory();
</script>
</body>
</html>
