<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Sophisticated & Tactile */
            --bg-body: #151516;
            --bg-panel: #202124;
            
            /* Board Colors: Warm Cream & Charcoal */
            --board-light: #EBE0D5;
            --board-dark: #302E2B;
            
            /* UI Text */
            --text-primary: #ece8e1;
            --text-secondary: #8b949e;
            --text-accent: #A0AAB5;

            /* Dimensions */
            --square-size: clamp(40px, 9vw, 80px);
            --icon-size: 82%; 
            
            /* Spacing */
            --spacing: 24px;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Layout */
        .interface-container {
            display: flex;
            gap: 40px;
            align-items: center;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }

        /* --- The Chessboard --- */
        .board-wrapper {
            position: relative;
            padding: 0; 
            border-radius: 4px;
            /* Subtle noise texture for tactile feel */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: calc(var(--square-size) * 8);
            height: calc(var(--square-size) * 8);
            border-radius: 2px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Palette Implementation */
        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Coordinates: High Contrast & Bigger */
        .coord {
            position: absolute;
            font-size: 0.75rem; 
            font-weight: 800;
            pointer-events: none;
            line-height: 1;
            font-family: 'Courier New', monospace;
            opacity: 0.8;
        }
        .coord.rank { top: 5px; left: 5px; }
        .coord.file { bottom: 4px; right: 5px; }

        /* Pieces: Solid Vector Integration */
        .piece {
            width: var(--icon-size);
            height: var(--icon-size);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Subtle drop shadow for physical weight */
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.4));
            z-index: 2;
        }
        .piece:hover { transform: scale(1.08) translateY(-2px); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 320px;
            background: var(--bg-panel);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(var(--square-size) * 8);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Header / Status */
        .panel-header {
            padding: 20px 24px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .game-title {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .status-bar:last-child { margin-bottom: 0; }
        
        /* Active Player Styling */
        .status-bar.active { opacity: 1; }
        .status-bar.active .player-name { color: #fff; font-weight: 700; }
        .status-bar.active .timer { 
            background: #302E2B; 
            border-color: #4a4846; 
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            border: 1px solid #222;
        }
        .player-dot.white-dot { background: #EBE0D5; border-color: #ccc; }
        .player-dot.black-dot { background: #302E2B; border-color: #111; }

        .player-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .timer {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            background: #151516;
            padding: 6px 12px;
            border-radius: 4px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 70px;
            text-align: center;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: var(--bg-panel);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .history-table th {
            text-align: left;
            padding: 12px 24px;
            color: var(--text-secondary);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-table td {
            padding: 6px 24px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        
        /* Alternating Row Backgrounds */
        .history-table tbody tr:nth-child(odd) { background-color: rgba(255,255,255,0.02); }
        .history-table tbody tr:nth-child(even) { background-color: transparent; }
        
        .history-table td:first-child { 
            color: var(--text-secondary); 
            width: 35px;
            font-size: 0.75rem;
            text-align: center;
        }

        /* Controls */
        .controls {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.1);
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-accent);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.3); }
        
        /* Elevated Primary Buttons */
        .btn-primary {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
            color: #fff;
        }
        .btn-primary:hover { background: rgba(255,255,255,0.15); }

        /* Demoted Destructive Button */
        .btn-danger {
            grid-column: span 2;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-decoration: underline;
            opacity: 0.7;
        }
        .btn-danger:hover { opacity: 1; background: transparent; color: #ff6b6b; border: none; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        @media (max-width: 850px) {
            .interface-container { flex-direction: column; gap: 24px; }
            .panel { width: calc(var(--square-size) * 8); height: auto; max-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        
        <!-- Board Section -->
        <div class="board-wrapper">
            <div class="chessboard" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="game-title">Classical Chess • Game #8241</div>
                
                <!-- White Status -->
                <div class="status-bar active" id="bar-white">
                    <div class="player-info">
                        <div class="player-dot white-dot"></div>
                        <span class="player-name">White</span>
                    </div>
                    <div class="timer" id="timer-white">10:00</div>
                </div>

                <!-- Black Status -->
                <div class="status-bar" id="bar-black">
                    <div class="player-info">
                        <div class="player-dot black-dot"></div>
                        <span class="player-name">Black</span>
                    </div>
                    <div class="timer" id="timer-black">10:00</div>
                </div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Sample Moves for visual demo -->
                        <tr>
                            <td>1</td>
                            <td>e4</td>
                            <td>e5</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Nf3</td>
                            <td>Nc6</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Bb5</td>
                            <td>a6</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn btn-primary">Undo</button>
                <button class="btn btn-primary">Draw</button>
                <button class="btn">Resign</button>
                <button class="btn btn-danger" onclick="resetBoard()">Start New Game</button>
            </div>
        </div>

    </div>

<script>
    // --- SVG Assets: Solid Staunton Silhouettes ---
    // Using simple, high-contrast paths. No strokes.

            q: '<svg viewBox="0 0 45 45"><g fill="#EBE0D5" fill-rule="evenodd"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 2.5 3 1 5 1 2.5 0 2.5-2.5 6-2.5s3.5 2.5 6 2.5c2 0 4 1.5 5-1 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/></g></svg>',
            k: '<svg viewBox="0 0 45 45"><g fill="#EBE0D5" fill-rule="evenodd"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 0-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>'
        },
        b: {
            p: '<svg viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#302E2B" /></svg>',
            r: '<svg viewBox="0 0 45 45"><path d="M9 39h27v-3H9v3zM12.5 32l1.5-2.5h17l1.5 2.5h-20zM13 36v-4h19v4H13zM11 14V9h4v2h5V9h5v2h5V9h4v5" stroke-linecap="butt"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5c1.71.37 3 2.22 3 4.5v3H11v-3c0-2.28 1.29-4.13 3-4.5V17h17z"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="#302E2B" fill-rule="evenodd"/></svg>',
            n: '<svg viewBox="0 0 45 45"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.32-2.58 2.9-3 3-3.45.84-7.2 4.14-8 6-1.27 3.09-1.67 6.45-2 10h22c-1.27-3.09-1.67-6.45-2-10-.84-1.86-4.55-5.16-8-6-.42-.1-3.38-.68-3-3z" fill="#302E2B" fill-rule="evenodd"/><path d="M9.5 25.5A4.5 4.5 0 1 1 5 21a4.5 4.5 0 0 1 4.5 4.5z" fill="#302E2B"/></svg>',
            b: '<svg viewBox="0 0 45 45"><g fill="#302E2B" fill-rule="evenodd"><path d="M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.38 0 10.11.48 13.5 1.45V30H9v6z"/><path d="M15 24c4 1 11 1 15 0v-8c0-6-4.5-11-7.5-11s-7.5 5-7.5 11v8z"/><path d="M22.5 9c-3 0-4.5 3-4.5 6 0 2 1 4 4.5 4s4.5-2 4.5-4c0-3-1.5-6-4.5-6z"/></g><path d="M15 30c0-3 3-6 7.5-6s7.5 3 7.5 6" fill="#302E2B"/></svg>',
            q: '<svg viewBox="0 0 45 45"><g fill="#302E2B" fill-rule="evenodd"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 2.5 3 1 5 1 2.5 0 2.5-2.5 6-2.5s3.5 2.5 6 2.5c2 0 4 1.5 5-1 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/></g></svg>',

        }
    };

    // --- Game State ---
    const initialBoard = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black (row 0)
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White (row 7)
    ];

    const boardEl = document.getElementById('board');
    const historyEl = document.getElementById('move-history');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Coordinates: Rank on Left, File on Bottom
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Piece Placement
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on position for the initial setup
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    // Map 'p' to 'p', etc.
                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function resetBoard() {
        // 1. Clear Board
        renderBoard();
        
        // 2. Clear Move History
        historyEl.innerHTML = '';
        
        // 3. Reset UI State
        document.getElementById('bar-white').classList.add('active');
        document.getElementById('bar-black').classList.remove('active');
    }

    // Initial Render
    renderBoard();
</script>
</body>
</html>
