<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    /* Palette: Deep Atmospheric */
    --bg-deep: #050714;
    --bg-indigo: #171b38;
    --primary: #fb923c; /* Orange for caught status */
    --primary-glow: rgba(251, 146, 60, 0.3);
    --accent: #818cf8;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    
    /* Typography */
    --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: none; /* Hide default cursor */
  }

  /* --- Background Layers (CSS Parallax) --- */
  .scene-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* 1. Deep Gradient */
  .layer-bg {
    background: radial-gradient(circle at 50% 120%, var(--bg-indigo) 0%, var(--bg-deep) 70%);
    z-index: 0;
  }

  /* 2. Nebula Blobs */
  .layer-nebula {
    z-index: 1;
    opacity: 0.6;
    filter: blur(80px);
    transition: transform 0.1s linear;
  }
  
  .blob {
    position: absolute;
    border-radius: 50%;
  }
  .blob-1 { width: 60vw; height: 60vw; background: #3b0764; top: -10%; left: -10%; opacity: 0.4; }
  .blob-2 { width: 50vw; height: 50vw; background: #1e3a8a; bottom: -10%; right: -10%; opacity: 0.3; }

  /* 3. Stars */
  .layer-stars {
    z-index: 2;
    background-image: 
      radial-gradient(1px 1px at 10% 10%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 40% 50%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 50% 20%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 70% 10%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 80% 40%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.7), transparent);
    background-size: 550px 550px;
    animation: driftStars 100s linear infinite;
  }

  @keyframes driftStars {
    from { background-position: 0 0; }
    to { background-position: 0 1000px; }
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 10;
  }

  /* HUD */
  header {
    position: absolute;
    top: 2rem;
    left: 3rem;
    z-index: 20;
    pointer-events: none;
  }

  .title-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    color: var(--text-main);
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  /* Relocated Pill under title */
  .session-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border);
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    width: fit-content;
  }

  .session-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .session-value {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-main);
    font-variant-numeric: tabular-nums;
  }

  /* Total Completion Stat (Top Right) */
  .total-stat {
    position: absolute;
    top: 2rem;
    right: 3rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1rem;
    border-radius: 99px;
    pointer-events: auto;
  }

  .total-percent {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent);
  }

  .total-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
  }

  /* Bottom Action Bar */
  .action-bar {
    position: absolute;
    bottom: 2.5rem;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
  }

  /* Glassmorphism Button */
  .btn-collect {
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text-main);
    padding: 0.8rem 2.5rem;
    font-size: 0.9rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .btn-collect:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  
  .btn-collect:active {
    transform: translateY(0);
    background: rgba(255, 255, 255, 0.05);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -20px);
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast h3 { 
    font-size: 0.9rem; 
    font-weight: 600; 
    color: var(--text-main); 
    margin-bottom: 0.1rem; 
  }
  .toast p { 
    font-size: 0.75rem; 
    color: var(--accent); 
    text-transform: uppercase; 
    letter-spacing: 0.05em;
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Background Layers -->
  <div class="scene-layer layer-bg"></div>
  <div class="scene-layer layer-nebula" id="nebulaLayer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <div class="scene-layer layer-stars"></div>

  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <div class="session-pill">
        <span class="session-label">SESSION</span>
        <span class="session-value" id="score">0</span>
      </div>
    </div>
  </header>

  <div class="total-stat">
    <span class="total-percent">74%</span>
    <span class="total-label">Total</span>
  </div>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3 id="catchName">Mist Sprite</h3>
    <p>Captured</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Revised Logic
 * Focus: "Aether Spirits" visuals, Player Net interaction, Smooth Physics
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');
const nebulaLayer = document.getElementById('nebulaLayer');

// State
let width, height;
let score = 0;
let mouse = { x: 0, y: 0 };
let mouseHistory = []; // For net trail
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  
  // Parallax Effect on Nebula
  const moveX = (e.clientX - width / 2) * 0.02;
  const moveY = (e.clientY - height / 2) * 0.02;
  nebulaLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
});

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.025;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.02;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = '600 14px system-ui';
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 15 + 15; // Base size
    this.speedX = (Math.random() - 0.5) * 0.8;
    this.speedY = (Math.random() - 0.5) * 0.8;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.color = this.getColor();
    this.caught = false;
    this.caughtTimer = 0;
  }

  getColor() {
    // Aether Palette
    const colors = ['#38bdf8', '#818cf8', '#34d399', '#f472b6', '#fb923c'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  update() {
    // Bobbing Animation (Living Scene)
    this.wobble += 0.03;
    const bobY = Math.sin(this.wobble) * 0.5;

    if (!this.caught) {
      // Drift movement
      this.x += this.speedX;
      this.y += this.speedY + bobY;
      this.angle += 0.01;

      // Soft Wall wrapping
      if (this.x < -50) this.x = width + 50;
      if (this.x > width + 50) this.x = -50;
      if (this.y < -50) this.y = height + 50;
      if (this.y > height + 50) this.y = -50;

      // Interaction: Catch Logic
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 50) { // Catch radius
        this.catch();
      }
    } else {
      // Caught State: Spiral into the net
      this.caughtTimer += 0.1;
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      
      // Move towards mouse
      this.x += dx * 0.15;
      this.y += dy * 0.15;
      
      // Shrink
      this.size *= 0.9;
      
      // Spiral effect
      const spiralX = Math.cos(this.caughtTimer) * 10;
      const spiralY = Math.sin(this.caughtTimer) * 10;
      this.x += spiralX * 0.1;
      this.y += spiralY * 0.1;

      if (this.size < 1) {
        this.init(); // Respawn elsewhere
      }
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual feedback
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "CAPTURED"));
    
    // Show Toast
    const names = ["Mist Sprite", "Ember Wisp", "Crystal Shard", "Void Moth", "Aether Mite"];
    catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    // Rotate slightly
    ctx.rotate(Math.sin(this.wobble * 0.5) * 0.2);
    
    // Soft Body Glow (Aether Spirit style)
    ctx.shadowBlur = 30;
    ctx.shadowColor = this.color;
    
    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    
    // Draw Organic Blob
    const points = 6;
    for (let i = 0; i <= points; i++) {
      const a = (Math.PI * 2 / points) * i + this.wobble * 0.2;
      // Varying radius for organic feel
      const r = this.size + Math.sin(this.wobble + i * 1.5) * (this.size * 0.3);
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.quadraticCurveTo(
        Math.cos(a - (Math.PI/points)) * r, 
        Math.sin(a - (Math.PI/points)) * r, 
        px, py
      );
    }
    ctx.closePath();
    ctx.fill();

    // Inner Core (Highlight)
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(this.size * 0.2, -this.size * 0.2, this.size * 0.25, 0, Math.PI*2);
    ctx.fill();

    // Caught Icon (Matches creature palette logic)
    if (this.caught) {
       ctx.strokeStyle = this.color;
       ctx.lineWidth = 2;
       ctx.beginPath();
       ctx.arc(0, 0, this.size + 5, 0, Math.PI*2);
       ctx.stroke();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Draw The Net (Player Avatar)
function drawNet() {
  // Add current position to history for trail
  mouseHistory.push({x: mouse.x, y: mouse.y});
  if (mouseHistory.length > 5) mouseHistory.shift();

  ctx.save();
  
  // Draw Trail
  ctx.beginPath();
  if(mouseHistory.length > 0) {
    ctx.moveTo(mouseHistory[0].x, mouseHistory[0].y);
    for(let i=1; i<mouseHistory.length; i++) {
      ctx.lineTo(mouseHistory[i].x, mouseHistory[i].y);
    }
  }
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.lineWidth = 20;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Draw Active Net Head
  ctx.translate(mouse.x, mouse.y);
  
  // Net Opening (Glowing Ring)
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(255,255,255,0.5)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 40, 0, Math.PI * 2);
  ctx.stroke();

  // Net Grid (Semi-transparent)
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1;
  
  // Simple Grid pattern
  const gridSize = 10;
  const radius = 40;
  ctx.beginPath();
  for (let i = -radius; i <= radius; i += gridSize) {
    // Vertical-ish lines
    ctx.moveTo(i, -Math.sqrt(Math.max(0, radius*radius - i*i)));
    ctx.lineTo(i, Math.sqrt(Math.max(0, radius*radius - i*i)));
    // Horizontal-ish lines
    ctx.moveTo(-Math.sqrt(Math.max(0, radius*radius - i*i)), i);
    ctx.lineTo(Math.sqrt(Math.max(0, radius*radius - i*i)), i);
  }
  ctx.stroke();

  // Center Reticle
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// Init Creatures
for (let i = 0; i < 6; i++) {
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  time += 0.01;
  
  // Clear Canvas
  ctx.clearRect(0, 0, width, height);
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    // Visual feedback on button click
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    // Center explosion effect
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
</body>
</html>
