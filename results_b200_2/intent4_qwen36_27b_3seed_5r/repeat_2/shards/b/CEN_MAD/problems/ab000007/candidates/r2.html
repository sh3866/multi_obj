<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    /* Palette: Deep Aether */
    --bg-deep: #020205;
    --bg-panel: rgba(10, 15, 30, 0.6);
    --accent-primary: #38bdf8; /* Cyan */
    --accent-rare: #f472b6;    /* Pink */
    --accent-gold: #fbbf24;    /* Gold */
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    
    /* Typography */
    --font-ui: system-ui, -apple-system, sans-serif;
    --font-data: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    cursor: none; /* Hide default cursor completely */
  }

  /* --- Background Layers (Living Scene) --- */
  .scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
  }

  /* 1. Deep Nebula Gradient */
  .layer-nebula {
    position: absolute;
    width: 150vw; height: 150vh;
    top: -25%; left: -25%;
    background: 
      radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.4) 0%, transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(126, 34, 206, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.2) 0%, transparent 50%);
    filter: blur(60px);
    animation: nebulaDrift 20s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes nebulaDrift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-20px, -10px) scale(1.05); }
  }

  /* 2. Starfield Canvas (Behind Game) */
  #starCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
  }

  /* --- Main Game Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2;
  }

  /* --- HUD & UI --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none; /* Let clicks pass through to canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Top Bar: Glassmorphism Container */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .hud-panel {
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 1rem 1.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  /* Left Panel: Title & Session */
  .title-group h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 0.5rem;
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
  }

  .session-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 0.5rem;
  }

  .data-label {
    font-family: var(--font-data);
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .data-value {
    font-family: var(--font-data);
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent-primary);
  }

  /* Right Panel: Total Stats */
  .total-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .count-display {
    font-family: var(--font-data);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }

  .count-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.25rem;
  }

  /* Bottom Action Bar */
  .bottom-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    padding-bottom: 1rem; /* Lift slightly */
  }

  /* Primary Action Button */
  .btn-collect {
    background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 1rem 3rem;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 4px; /* Slightly sharper corners for tech feel */
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 
      0 0 0 1px rgba(0,0,0,0.2),
      0 4px 15px rgba(14, 165, 233, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.3),
      inset 0 -2px 5px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }

  .btn-collect::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
  }

  .btn-collect:hover {
    transform: translateY(-2px);
    box-shadow: 
      0 0 0 1px rgba(0,0,0,0.2),
      0 8px 25px rgba(14, 165, 233, 0.6),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }

  .btn-collect:active {
    transform: translateY(1px);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translate(-50%, -20px);
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid var(--accent-primary);
    backdrop-filter: blur(8px);
    padding: 0.8rem 1.5rem;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast h3 { 
    font-size: 0.9rem; 
    font-weight: 600; 
    color: var(--text-main); 
    margin-bottom: 0.1rem; 
  }
  .toast p { 
    font-family: var(--font-data);
    font-size: 0.7rem; 
    color: var(--accent-primary); 
    text-transform: uppercase; 
    letter-spacing: 0.1em;
  }

  /* Player Avatar Container */
  .player-anchor {
    position: absolute;
    bottom: 100px; /* Above button */
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    z-index: 5;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .player-glow {
    position: absolute;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.4) 0%, transparent 70%);
    animation: pulse 3s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }

</style>
</head>
<body>

<div class="scene-container">
  <div class="layer-nebula"></div>
  <canvas id="starCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
</div>

<div class="ui-layer">
  
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="hud-panel title-group">
      <h1>Aether Catcher</h1>
      <div class="session-row">
        <span class="data-label">SESSION</span>
        <span class="data-value" id="score">00</span>
      </div>
    </div>

    <div class="hud-panel total-panel">
      <div class="count-display"><span id="totalCaught">12</span>/<span id="totalCount">16</span></div>
      <div class="count-label">Total Collection</div>
    </div>
  </header>

  <!-- Player Avatar (Visual Anchor) -->
  <div class="player-anchor">
    <div class="player-glow"></div>
    <!-- Simple SVG Drone Avatar -->
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 10L30 25H10L20 10Z" fill="#38bdf8" fill-opacity="0.8"/>
      <circle cx="20" cy="20" r="4" fill="#fff"/>
      <path d="M10 25L20 35L30 25" stroke="#38bdf8" stroke-width="2"/>
    </svg>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3 id="catchName">Unknown Entity</h3>
    <p>Specimen Captured</p>
  </div>

  <!-- Bottom Action Bar -->
  <div class="bottom-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Revised Logic
 * Focus: Distinct Creature Shapes, Custom Cursor, Starfield, Player Anchor
 */

const starCanvas = document.getElementById('starCanvas');
const starCtx = starCanvas.getContext('2d');
const gameCanvas = document.getElementById('gameCanvas');
const ctx = gameCanvas.getContext('2d');

const scoreEl = document.getElementById('score');
const totalCaughtEl = document.getElementById('totalCaught');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let totalCaught = 12;
let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let stars = [];
let time = 0;

// --- Resize Handling ---
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  
  // Star Canvas
  starCanvas.width = width;
  starCanvas.height = height;
  initStars();

  // Game Canvas
  gameCanvas.width = width;
  gameCanvas.height = height;
}

// --- Starfield Logic ---
class Star {
  constructor() {
    this.init();
  }
  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 1.5;
    this.alpha = Math.random() * 0.5 + 0.1;
    this.blinkSpeed = Math.random() * 0.02 + 0.005;
  }
  update() {
    this.alpha += this.blinkSpeed;
    if (this.alpha > 0.8 || this.alpha < 0.1) this.blinkSpeed *= -1;
  }
  draw(ctx) {
    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initStars() {
  stars = [];
  for(let i=0; i<150; i++) stars.push(new Star());
}

function drawStars() {
  starCtx.clearRect(0, 0, width, height);
  stars.forEach(star => {
    star.update();
    star.draw(starCtx);
  });
}

// --- Game Logic ---

window.addEventListener('resize', resize);
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
    this.size *= 0.95;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text, color) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.life = 1.0;
    this.vy = -2;
  }
  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.font = 'bold 14px system-ui';
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor(isRare = false) {
    this.isRare = isRare;
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.baseSize = this.isRare ? 40 : (Math.random() * 10 + 15);
    this.speedX = (Math.random() - 0.5) * (this.isRare ? 0.5 : 1.5);
    this.speedY = (Math.random() - 0.5) * (this.isRare ? 0.5 : 1.5);
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.color = this.isRare ? '#f472b6' : this.getColor();
    this.type = this.getType(); // 'jelly', 'shard', 'bird'
    this.caught = false;
    this.caughtTimer = 0;
  }

  getColor() {
    // Aether Palette
    const colors = ['#38bdf8', '#818cf8', '#34d399', '#fbbf24'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  getType() {
    const types = ['jelly', 'shard', 'bird'];
    return types[Math.floor(Math.random() * types.length)];
  }

  update() {
    this.wobble += 0.05;

    if (!this.caught) {
      this.x += this.speedX;
      this.y += this.speedY + Math.sin(this.wobble) * 0.5;
      this.angle += 0.02;

      // Wrap
      if (this.x < -100) this.x = width + 100;
      if (this.x > width + 100) this.x = -100;
      if (this.y < -100) this.y = height + 100;
      if (this.y > height + 100) this.y = -100;

      // Catch Logic
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const catchRadius = this.isRare ? 80 : 50;

      if (dist < catchRadius) {
        this.catch();
      }
    } else {
      // Caught Animation
      this.caughtTimer += 0.15;
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      this.x += dx * 0.2;
      this.y += dy * 0.2;
      
      // Spiral
      const spiralR = 10 * (1 - this.caughtTimer/10);
      this.x += Math.cos(this.caughtTimer * 5) * spiralR;
      this.y += Math.sin(this.caughtTimer * 5) * spiralR;
      
      this.baseSize *= 0.9;

      if (this.baseSize < 1) {
        this.init();
      }
    }
  }

  catch() {
    this.caught = true;
    score++;
    totalCaught++;
    scoreEl.innerText = score.toString().padStart(2, '0');
    totalCaughtEl.innerText = totalCaught;

    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y - 20, this.isRare ? "RARE!" : "CAPTURED", this.color));
    
    const names = ["Mist Sprite", "Void Shard", "Aether Moth", "Nebula Jelly", "Star Drifter"];
    catchNameEl.innerText = this.isRare ? "Prism Entity" : names[Math.floor(Math.random() * names.length)];
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.sin(this.wobble * 0.5) * 0.2);
    
    // Glow
    ctx.shadowBlur = this.isRare ? 40 : 20;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;

    // Draw Shape based on Type
    ctx.beginPath();
    const s = this.baseSize;

    if (this.type === 'jelly') {
      // Jellyfish shape
      ctx.moveTo(-s, 0);
      ctx.quadraticCurveTo(-s, -s*1.5, 0, -s*1.5);
      ctx.quadraticCurveTo(s, -s*1.5, s, 0);
      // Tentacles
      ctx.moveTo(-s*0.5, 0);
      ctx.quadraticCurveTo(-s*0.5, s, -s*0.8, s*1.5);
      ctx.moveTo(s*0.5, 0);
      ctx.quadraticCurveTo(s*0.5, s, s*0.8, s*1.5);
      ctx.stroke();
      // Fill top
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } 
    else if (this.type === 'shard') {
      // Crystal Shard
      ctx.moveTo(0, -s);
      ctx.lineTo(s*0.6, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s*0.6, 0);
      ctx.closePath();
      ctx.fill();
      // Inner highlight
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.moveTo(0, -s*0.5);
      ctx.lineTo(s*0.2, 0);
      ctx.lineTo(0, s*0.5);
      ctx.lineTo(-s*0.2, 0);
      ctx.fill();
    } 
    else {
      // Spectral Bird / Winged shape
      ctx.moveTo(0, -s);
      ctx.quadraticCurveTo(s, -s, s*1.5, 0);
      ctx.quadraticCurveTo(s, s*0.5, 0, s);
      ctx.quadraticCurveTo(-s, s*0.5, -s*1.5, 0);
      ctx.quadraticCurveTo(-s, -s, 0, -s);
      ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// --- Custom Net Cursor ---
function drawNet() {
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // 1. Outer Dashed Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.arc(0, 0, 40, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Inner Solid Ring
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 38, 0, Math.PI * 2);
  ctx.stroke();

  // 3. Crosshair
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)'; // Cyan accent
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, 0); ctx.lineTo(-4, 0);
  ctx.moveTo(10, 0); ctx.lineTo(4, 0);
  ctx.moveTo(0, -10); ctx.lineTo(0, -4);
  ctx.moveTo(0, 10); ctx.lineTo(0, 4);
  ctx.stroke();

  // 4. Center Dot
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// --- Initialization ---
resize();

// Create Creatures (Include 1 Rare)
for (let i = 0; i < 5; i++) creatures.push(new Creature(false));
creatures.push(new Creature(true)); // The Rare One

// Animation Loop
function animate() {
  time += 0.01;
  
  // Draw Stars (Background Layer)
  drawStars();

  // Clear Game Canvas
  ctx.clearRect(0, 0, width, height);
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Custom Cursor (Net)
  drawNet();

  requestAnimationFrame(animate);
}

animate();

// Button Interaction
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    totalCaught = 12; // Reset to initial
    scoreEl.innerText = "00";
    totalCaughtEl.innerText = "12";
    
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
</body>
</html>
