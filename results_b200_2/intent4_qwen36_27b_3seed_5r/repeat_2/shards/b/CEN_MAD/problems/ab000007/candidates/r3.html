<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Collection</title>
<style>
  :root {
    /* Palette: Aether & Bioluminescence */
    --bg-deep: #05050a;
    --bg-panel: rgba(10, 15, 30, 0.4);
    --accent-primary: #22d3ee; /* Cyan */
    --accent-secondary: #818cf8; /* Indigo */
    --accent-rare: #f472b6; /* Pink */
    --accent-gold: #fbbf24; /* Gold */
    --text-main: #f0f9ff;
    --text-muted: #94a3b8;
    
    /* Typography */
    --font-ui: system-ui, -apple-system, sans-serif;
    
    /* UI Geometry */
    --radius-ui: 12px;
    --glass-border: 1px solid rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    cursor: none; /* Custom cursor used */
  }

  /* --- Background Layers (Atmosphere) --- */
  .scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
    background: radial-gradient(circle at 50% 120%, #1e1b4b 0%, #000000 70%);
  }

  /* Noise Overlay for texture */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.04;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Floating background orbs */
  .nebula-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: floatOrb 20s infinite alternate ease-in-out;
    z-index: 1;
  }

  @keyframes floatOrb {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-30px, -50px); }
  }

  /* --- Main Game Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5;
  }

  /* --- HUD & UI --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: var(--glass-border);
    border-radius: var(--radius-ui);
    padding: 0.8rem 1.2rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  /* Title Group */
  .title-group {
    display: flex;
    flex-direction: column;
  }

  .title-group h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text-main);
    margin-bottom: 0.25rem;
    text-transform: uppercase;
  }

  .session-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .data-label {
    font-size: 0.65rem;
    font-weight: 600;
    color: rgba(255,255,255,0.6); /* Higher contrast */
    letter-spacing: 0.1em;
  }

  .data-value {
    font-family: var(--font-ui);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent-primary);
  }

  /* Collection Counter */
  .total-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    min-width: 100px;
  }

  .count-display {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1;
  }

  .count-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.25rem;
  }

  /* Bottom Action Bar */
  .bottom-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    padding-bottom: 1rem;
  }

  /* Subordinate Action Button (Artifact Style) */
  .btn-collect {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.7);
    padding: 0.6rem 1.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: var(--radius-ui);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  .btn-collect svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    opacity: 0.8;
  }

  .btn-collect:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translate(-50%, -20px);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--accent-primary);
    backdrop-filter: blur(12px);
    padding: 0.8rem 1.5rem;
    border-radius: var(--radius-ui);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast h3 { 
    font-size: 0.9rem; 
    font-weight: 700; 
    color: var(--text-main); 
    margin-bottom: 0.1rem; 
  }
  .toast p { 
    font-size: 0.7rem; 
    color: var(--accent-primary); 
    text-transform: uppercase; 
    letter-spacing: 0.05em;
  }

</style>
</head>
<body>

<div class="scene-container">
  <!-- Atmospheric Background Elements -->
  <div class="nebula-orb" style="width: 40vw; height: 40vw; top: -10%; left: -10%; background: radial-gradient(circle, #312e81 0%, transparent 70%);"></div>
  <div class="nebula-orb" style="width: 50vw; height: 50vw; bottom: -20%; right: -10%; background: radial-gradient(circle, #164e63 0%, transparent 70%); animation-delay: -5s;"></div>
  <div class="noise-overlay"></div>
  
  <canvas id="gameCanvas"></canvas>
</div>

<div class="ui-layer">
  
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="hud-panel title-group">
      <h1>Aether Catcher</h1>
      <div class="session-row">
        <span class="data-label">SESSION</span>
        <span class="data-value" id="score">00</span>
      </div>
    </div>

    <div class="hud-panel total-panel">
      <div class="count-display"><span id="totalCaught">12</span>/<span id="totalCount">16</span></div>
      <div class="count-label">Collection</div>
    </div>
  </header>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3 id="catchName">Unknown Entity</h3>
    <p>Specimen Captured</p>
  </div>

  <!-- Bottom Action Bar -->
  <div class="bottom-bar">
    <button class="btn-collect" id="collectBtn">
      <!-- Crystal/Journal Icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
      </svg>
      Open Collection
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Revision
 * Focus: Player mechanics, distinct creatures, atmospheric polish.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const totalCaughtEl = document.getElementById('totalCaught');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let totalCaught = 12;
let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

// --- Resize Handling ---
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 2 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.025;
    this.size *= 0.95;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text, color) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.life = 1.0;
    this.vy = -1.5;
  }
  update() {
    this.y += this.vy;
    this.life -= 0.012;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.font = '600 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor(isRare = false) {
    this.isRare = isRare;
    this.init();
  }

  init() {
    // Distribute broadly
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    
    this.baseSize = this.isRare ? 35 : (Math.random() * 10 + 15);
    
    // Gentle drifting speeds
    this.speedX = (Math.random() - 0.5) * (this.isRare ? 0.3 : 0.8);
    this.speedY = (Math.random() - 0.5) * (this.isRare ? 0.3 : 0.8);
    
    this.wobble = Math.random() * Math.PI * 2;
    this.color = this.isRare ? '#f472b6' : this.getColor();
    this.type = this.getType(); // 'jelly', 'shard', 'orb'
    this.caught = false;
    this.caughtTimer = 0;
    
    // Z-index simulation
    this.z = Math.random(); 
  }

  getColor() {
    const colors = ['#22d3ee', '#818cf8', '#34d399', '#fbbf24'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  getType() {
    const types = ['jelly', 'shard', 'orb'];
    return types[Math.floor(Math.random() * types.length)];
  }

  update() {
    this.wobble += 0.03;

    if (!this.caught) {
      this.x += this.speedX;
      // Sine wave drift
      this.y += this.speedY + Math.sin(this.wobble) * 0.5;
      
      // Wrap around screen
      if (this.x < -50) this.x = width + 50;
      if (this.x > width + 50) this.x = -50;
      if (this.y < -50) this.y = height + 50;
      if (this.y > height + 50) this.y = -50;

      // Catch Logic (Net Radius)
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const catchRadius = 45; // Net size

      if (dist < catchRadius) {
        this.catch();
      }
    } else {
      // Caught Animation: spiral into net center
      this.caughtTimer += 0.1;
      const dx = mouse.x - this.x;
      const dy = mouse.y - mouse.y; // Simplified for demo
      
      // Move towards center
      this.x += (mouse.x - this.x) * 0.15;
      this.y += (mouse.y - this.y) * 0.15;
      
      // Spiral effect
      const spiralR = 15 * (1 - this.caughtTimer/10);
      this.x += Math.cos(this.caughtTimer * 8) * spiralR * 0.5;
      this.y += Math.sin(this.caughtTimer * 8) * spiralR * 0.5;
      
      this.baseSize *= 0.9;

      if (this.baseSize < 1) {
        this.init();
      }
    }
  }

  catch() {
    this.caught = true;
    score++;
    totalCaught++;
    scoreEl.innerText = score.toString().padStart(2, '0');
    totalCaughtEl.innerText = totalCaught;

    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y - 20, this.isRare ? "RARE!" : "CAPTURED", this.color));
    
    const names = ["Mist Sprite", "Void Shard", "Aether Moth", "Nebula Jelly", "Star Drifter"];
    catchNameEl.innerText = this.isRare ? "Prism Entity" : names[Math.floor(Math.random() * names.length)];
    
    // Show Toast
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    // Gentle tilt
    ctx.rotate(Math.sin(this.wobble * 0.5) * 0.1);
    
    // Glow Effect
    ctx.shadowBlur = this.isRare ? 25 : 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;

    const s = this.baseSize;

    ctx.beginPath();

    if (this.type === 'jelly') {
      // Jellyfish: Dome top, wavy lines bottom
      ctx.moveTo(-s, 0);
      ctx.quadraticCurveTo(-s, -s*1.2, 0, -s*1.2);
      ctx.quadraticCurveTo(s, -s*1.2, s, 0);
      ctx.stroke(); // Draw dome
      
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fill(); // Fill dome
      
      ctx.globalCompositeOperation = 'source-over';
      // Tentacles
      ctx.beginPath();
      ctx.moveTo(-s*0.5, 0);
      ctx.quadraticCurveTo(-s*0.5, s*0.5, -s*0.3, s);
      ctx.moveTo(s*0.5, 0);
      ctx.quadraticCurveTo(s*0.5, s*0.5, s*0.3, s);
      ctx.stroke();
    } 
    else if (this.type === 'shard') {
      // Diamond/Shard shape
      ctx.moveTo(0, -s);
      ctx.lineTo(s*0.7, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s*0.7, 0);
      ctx.closePath();
      ctx.fill();
      
      // Inner highlight
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.moveTo(0, -s*0.5);
      ctx.lineTo(s*0.2, 0);
      ctx.lineTo(0, s*0.5);
      ctx.lineTo(-s*0.2, 0);
      ctx.fill();
    } 
    else {
      // Orb / Blob
      ctx.arc(0, 0, s*0.7, 0, Math.PI * 2);
      ctx.fill();
      // Inner core
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, s*0.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// --- Player & Net Rendering ---
function drawPlayerAndNet() {
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // 1. The Net (Visual Cursor)
  // Outer dashed ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.arc(0, 0, 45, 0, Math.PI * 2);
  ctx.stroke();

  // Inner subtle ring
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 40, 0, Math.PI * 2);
  ctx.stroke();

  // Crosshair ticks
  ctx.strokeStyle = 'rgba(34, 211, 238, 0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-55, 0); ctx.lineTo(-40, 0);
  ctx.moveTo(55, 0); ctx.lineTo(40, 0);
  ctx.moveTo(0, -55); ctx.lineTo(0, -40);
  ctx.moveTo(0, 55); ctx.lineTo(0, 40);
  ctx.stroke();

  // 2. The Player Avatar (Trailing Silhouette)
  // Offset slightly to look like it's holding the net
  const avatarX = -35; 
  const avatarY = 15;
  
  ctx.translate(avatarX, avatarY);
  
  // Player Glow
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#22d3ee';
  
  // Silhouette (Abstract Explorer)
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  // Head
  ctx.arc(0, -15, 6, 0, Math.PI*2); 
  // Body
  ctx.moveTo(-8, -10);
  ctx.quadraticCurveTo(0, 5, 8, -10);
  ctx.lineTo(6, 15);
  ctx.lineTo(-6, 15);
  ctx.fill();
  
  // The "Net Handle" connecting player to net
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(5, -5); // Hand pos
  ctx.lineTo(30, -15); // Towards net
  ctx.stroke();

  ctx.restore();
}

// --- Initialization ---
resize();

// Populate Scene
for (let i = 0; i < 8; i++) creatures.push(new Creature(false));
creatures.push(new Creature(true)); // 1 Rare

// Animation Loop
function animate() {
  time += 0.01;
  
  ctx.clearRect(0, 0, width, height);
  
  // Draw Creatures (Sort by Z for depth)
  creatures.sort((a, b) => a.z - b.z);
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Player & Net on top
  drawPlayerAndNet();

  requestAnimationFrame(animate);
}

animate();

// Button Interaction
document.getElementById('collectBtn').addEventListener('click', () => {
    // Visual Feedback
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    totalCaught = 12; 
    scoreEl.innerText = "00";
    totalCaughtEl.innerText = "12";
    
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
</body>
</html>
