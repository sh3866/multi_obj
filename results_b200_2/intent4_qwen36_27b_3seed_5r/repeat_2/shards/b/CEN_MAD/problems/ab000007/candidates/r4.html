<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Collection</title>
<style>
  :root {
    /* Palette: Deep Void & Bioluminescence */
    --bg-deep: #020204;
    --bg-panel: rgba(10, 12, 20, 0.65);
    --accent-primary: #00f0ff; /* Neon Cyan */
    --accent-secondary: #7000ff; /* Deep Violet */
    --accent-rare: #ff007f; /* Hot Pink */
    --accent-gold: #ffcc00; /* Electric Gold */
    --text-main: #e0e6ed;
    --text-muted: #64748b;
    
    /* Typography */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
    
    /* UI Geometry: Technical/Chamfered */
    --radius-ui: 2px; 
    --glass-border: 1px solid rgba(255, 255, 255, 0.12);
    --glass-highlight: 1px solid rgba(255, 255, 255, 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    cursor: none; /* Custom cursor used */
  }

  /* --- Background Layers (Atmosphere) --- */
  .scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
    /* Deep atmospheric gradient */
    background: radial-gradient(circle at 50% 120%, #0f172a 0%, #020204 60%);
  }

  /* Noise Overlay for texture */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Drifting Particles (Spores/Dust) */
  .particle-field {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  
  .dust-mote {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20% { opacity: 0.4; }
    80% { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* --- Main Game Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5;
  }

  /* --- HUD & UI --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Top Bar (Context) */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
    opacity: 0.8; /* Reduced visual weight */
    transition: opacity 0.3s;
  }
  .top-bar:hover { opacity: 1; }

  /* Technical HUD Panel Style */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: var(--glass-border);
    border-top: var(--glass-highlight);
    /* Chamfered corners via clip-path */
    clip-path: polygon(
      0 0, 
      100% 0, 
      100% calc(100% - 12px), 
      calc(100% - 12px) 100%, 
      0 100%
    );
    padding: 0.6rem 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  /* Title Group */
  .title-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .title-group h1 {
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--text-main);
    text-transform: uppercase;
    line-height: 1;
  }

  .session-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .data-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .data-value {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent-primary);
  }

  /* Bottom Action Bar (Cluster) */
  .bottom-bar {
    display: flex;
    justify-content: flex-end; /* Right aligned cluster */
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 0;
    gap: 1rem;
  }

  /* The Cluster Container */
  .action-cluster {
    display: flex;
    align-items: center;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border: var(--glass-border);
    border-top: var(--glass-highlight);
    border-radius: 4px; /* Slight round, but technical */
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transform: skewX(-2deg); /* Dynamic tilt */
  }

  /* The Counter Display within Cluster */
  .cluster-count {
    padding: 1rem 1.5rem;
    border-right: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 80px;
    transform: skewX(2deg); /* Counter-skew text */
  }

  .cluster-count .big-num {
    font-family: var(--font-mono);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }
  .cluster-count .small-num {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .cluster-count .label {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* The Button within Cluster */
  .btn-collect {
    background: rgba(255, 255, 255, 0.03);
    border: none;
    color: var(--accent-primary);
    padding: 1rem 2rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    transform: skewX(2deg); /* Counter-skew text */
    white-space: nowrap;
  }

  .btn-collect:hover {
    background: rgba(0, 240, 255, 0.1);
    color: #fff;
    text-shadow: 0 0 8px var(--accent-primary);
  }
  
  .btn-collect:active {
    background: rgba(0, 240, 255, 0.2);
    transform: skewX(2deg) scale(0.98);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translate(-50%, -20px);
    background: rgba(10, 15, 30, 0.85);
    border: 1px solid var(--accent-primary);
    backdrop-filter: blur(16px);
    padding: 1rem 2rem;
    /* Tech shape */
    clip-path: polygon(
      10px 0, 100% 0, 
      100% calc(100% - 10px), calc(100% - 10px) 100%, 
      0 100%, 0 10px
    );
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast h3 { 
    font-size: 0.9rem; 
    font-weight: 700; 
    color: var(--text-main); 
    margin-bottom: 0.2rem; 
    letter-spacing: 0.05em;
  }
  .toast p { 
    font-family: var(--font-mono);
    font-size: 0.65rem; 
    color: var(--accent-primary); 
    text-transform: uppercase; 
    letter-spacing: 0.1em;
  }

</style>
</head>
<body>

<div class="scene-container">
  <!-- Atmospheric Background Elements -->
  <div class="noise-overlay"></div>
  <div class="particle-field" id="particleField">
    <!-- JS will populate dust motes here -->
  </div>
  
  <canvas id="gameCanvas"></canvas>
</div>

<div class="ui-layer">
  
  <!-- Top Bar: Context Only -->
  <header class="top-bar">
    <div class="hud-panel title-group">
      <h1>Aether Catcher</h1>
      <div class="session-row">
        <span class="data-label">SESSION</span>
        <span class="data-value" id="score">00</span>
      </div>
    </div>
  </header>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3 id="catchName">Unknown Entity</h3>
    <p>Specimen Captured</p>
  </div>

  <!-- Bottom Action Bar: The Cluster -->
  <div class="bottom-bar">
    <div class="action-cluster">
      <!-- Stat -->
      <div class="cluster-count">
        <div><span id="totalCaught">12</span><span class="small-num">/16</span></div>
        <div class="label">Collection</div>
      </div>
      
      <!-- Action -->
      <button class="btn-collect" id="collectBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        Open Collection
      </button>
    </div>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Revision
 * Focus: Player mechanics, distinct creatures, atmospheric polish.
 */

// --- Particle System (CSS) ---
const particleField = document.getElementById('particleField');
for(let i=0; i<30; i++) {
    const dust = document.createElement('div');
    dust.className = 'dust-mote';
    const size = Math.random() * 3 + 1;
    dust.style.width = `${size}px`;
    dust.style.height = `${size}px`;
    dust.style.left = `${Math.random() * 100}%`;
    dust.style.animationDuration = `${Math.random() * 15 + 10}s`;
    dust.style.animationDelay = `${Math.random() * 10}s`;
    particleField.appendChild(dust);
}

// --- Canvas Game Engine ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const totalCaughtEl = document.getElementById('totalCaught');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let totalCaught = 12;
let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

// --- Resize Handling ---
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
    this.size *= 0.96;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text, color) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.life = 1.0;
    this.vy = -2;
  }
  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor(isRare = false) {
    this.isRare = isRare;
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    
    this.baseSize = this.isRare ? 30 : (Math.random() * 8 + 12);
    
    // Drifting physics
    this.speedX = (Math.random() - 0.5) * (this.isRare ? 0.2 : 0.6);
    this.speedY = (Math.random() - 0.5) * (this.isRare ? 0.2 : 0.6);
    
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.05 + 0.02;
    
    this.color = this.isRare ? '#ff007f' : this.getColor();
    this.type = this.getType(); 
    this.caught = false;
    this.caughtTimer = 0;
    this.z = Math.random(); 
  }

  getColor() {
    const colors = ['#00f0ff', '#7000ff', '#34d399', '#ffcc00'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  getType() {
    const types = ['jelly', 'shard', 'manta', 'blob'];
    return types[Math.floor(Math.random() * types.length)];
  }

  update() {
    this.wobble += this.wobbleSpeed;

    if (!this.caught) {
      this.x += this.speedX;
      this.y += this.speedY + Math.sin(this.wobble) * 0.3;
      
      // Wrap around screen
      if (this.x < -100) this.x = width + 100;
      if (this.x > width + 100) this.x = -100;
      if (this.y < -100) this.y = height + 100;
      if (this.y > height + 100) this.y = -100;

      // Catch Logic (Net Radius)
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const catchRadius = 60; // Net size

      if (dist < catchRadius) {
        this.catch();
      }
    } else {
      // Caught Animation: spiral into net center
      this.caughtTimer += 0.1;
      
      // Move towards center
      this.x += (mouse.x - this.x) * 0.2;
      this.y += (mouse.y - this.y) * 0.2;
      
      // Spiral effect
      const spiralR = 20 * (1 - this.caughtTimer/15);
      this.x += Math.cos(this.caughtTimer * 10) * spiralR * 0.5;
      this.y += Math.sin(this.caughtTimer * 10) * spiralR * 0.5;
      
      this.baseSize *= 0.9;

      if (this.baseSize < 0.5) {
        this.init();
      }
    }
  }

  catch() {
    this.caught = true;
    score++;
    totalCaught++;
    scoreEl.innerText = score.toString().padStart(2, '0');
    totalCaughtEl.innerText = totalCaught;

    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y - 20, this.isRare ? "RARE!" : "CAPTURED", this.color));
    
    const names = ["Mist Sprite", "Void Shard", "Aether Moth", "Nebula Jelly", "Star Drifter", "Cyber Manta"];
    catchNameEl.innerText = this.isRare ? "Prism Entity" : names[Math.floor(Math.random() * names.length)];
    
    // Show Toast
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Gentle tilt based on movement
    const tilt = Math.sin(this.wobble) * 0.2;
    ctx.rotate(tilt);
    
    // Bioluminescent Glow
    ctx.shadowBlur = this.isRare ? 30 : 20;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.globalCompositeOperation = 'screen'; // Additive blending for glow

    const s = this.baseSize;

    ctx.beginPath();

    if (this.type === 'jelly') {
      // Jellyfish: Dome top, wavy lines bottom
      ctx.moveTo(-s, 0);
      ctx.quadraticCurveTo(-s, -s*1.2, 0, -s*1.2);
      ctx.quadraticCurveTo(s, -s*1.2, s, 0);
      ctx.stroke(); 
      
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fill(); 
      
      ctx.globalCompositeOperation = 'screen';
      // Tentacles
      ctx.beginPath();
      ctx.moveTo(-s*0.5, 0);
      ctx.quadraticCurveTo(-s*0.5, s*0.5, -s*0.3, s);
      ctx.moveTo(s*0.5, 0);
      ctx.quadraticCurveTo(s*0.5, s*0.5, s*0.3, s);
      ctx.stroke();
    } 
    else if (this.type === 'manta') {
      // Manta Ray / Angel Shape
      ctx.moveTo(0, -s);
      ctx.quadraticCurveTo(s, -s*0.5, s*1.2, s*0.5); // Right wing
      ctx.quadraticCurveTo(0, s*0.2, -s*1.2, s*0.5); // Left wing
      ctx.quadraticCurveTo(-s, -s*0.5, 0, -s); // Back to top
      ctx.fill();
      
      // Inner highlight
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.ellipse(0, -s*0.2, s*0.3, s*0.1, 0, 0, Math.PI*2);
      ctx.fill();
    }
    else if (this.type === 'shard') {
      // Diamond/Shard shape
      ctx.moveTo(0, -s*1.5);
      ctx.lineTo(s, 0);
      ctx.lineTo(0, s*1.5);
      ctx.lineTo(-s, 0);
      ctx.closePath();
      ctx.fill();
      
      // Inner highlight
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s*0.3, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s*0.3, 0);
      ctx.fill();
    } 
    else {
      // Orb / Blob
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.fill();
      // Inner core
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, s*0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// --- Player & Net Rendering ---
function drawPlayerAndNet() {
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // 1. The Net (Visual Cursor)
  // Outer dashed ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(0, 0, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Inner subtle ring
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 55, 0, Math.PI * 2);
  ctx.stroke();

  // Crosshair ticks
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-70, 0); ctx.lineTo(-60, 0);
  ctx.moveTo(70, 0); ctx.lineTo(60, 0);
  ctx.moveTo(0, -70); ctx.lineTo(0, -60);
  ctx.moveTo(0, 70); ctx.lineTo(0, 60);
  ctx.stroke();

  // 2. The Player Avatar (Trailing Silhouette)
  // Offset slightly to look like it's holding the net
  const avatarX = -45; 
  const avatarY = 25;
  
  ctx.translate(avatarX, avatarY);
  
  // Player Glow
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#00f0ff';
  
  // Silhouette (Abstract Explorer)
  ctx.fillStyle = '#050505';
  ctx.beginPath();
  // Head
  ctx.arc(0, -20, 7, 0, Math.PI*2); 
  // Body
  ctx.moveTo(-10, -14);
  ctx.quadraticCurveTo(-15, 10, -8, 25); // Left leg
  ctx.lineTo(8, 25); // Feet
  ctx.quadraticCurveTo(15, 10, 10, -14); // Right leg
  ctx.fill();
  
  // The "Net Handle" connecting player to net
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(8, -5); // Hand pos
  ctx.lineTo(35, -20); // Towards net center
  ctx.stroke();
  
  // Hand
  ctx.fillStyle = '#050505';
  ctx.beginPath();
  ctx.arc(35, -20, 4, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// --- Initialization ---
resize();

// Populate Scene
for (let i = 0; i < 10; i++) creatures.push(new Creature(false));
creatures.push(new Creature(true)); // 1 Rare

// Animation Loop
function animate() {
  time += 0.01;
  
  ctx.clearRect(0, 0, width, height);
  
  // Draw Creatures (Sort by Z for depth)
  creatures.sort((a, b) => a.z - b.z);
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Player & Net on top
  drawPlayerAndNet();

  requestAnimationFrame(animate);
}

animate();

// Button Interaction
document.getElementById('collectBtn').addEventListener('click', () => {
    // Visual Feedback
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'skewX(2deg) scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    totalCaught = 12; 
    scoreEl.innerText = "00";
    totalCaughtEl.innerText = "12";
    
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
</body>
</html>
