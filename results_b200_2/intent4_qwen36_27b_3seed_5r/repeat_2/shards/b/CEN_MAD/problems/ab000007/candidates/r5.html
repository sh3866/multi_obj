<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Collection</title>
<style>
  :root {
    /* Palette: Ethereal & Deep */
    --bg-deep: #050508;
    --bg-gradient: radial-gradient(circle at 50% 30%, #1a1c2e 0%, #050508 80%);
    --glass-panel: rgba(20, 22, 35, 0.6);
    --glass-border: 1px solid rgba(255, 255, 255, 0.1);
    --glass-highlight: 1px solid rgba(255, 255, 255, 0.2);
    
    --accent-cyan: #00f0ff;
    --accent-purple: #8b5cf6;
    --accent-gold: #fbbf24;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    
    /* Typography & Geometry */
    --font-ui: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius-token: 12px; /* Unified Radius */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background: var(--bg-deep);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    cursor: none; /* We draw our own cursor */
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
  }

  /* Volumetric Fog */
  .fog-layer {
    position: absolute;
    width: 200%; height: 200%;
    top: -50%; left: -50%;
    background: radial-gradient(circle at center, rgba(139, 92, 246, 0.05) 0%, transparent 60%);
    animation: driftFog 20s infinite alternate ease-in-out;
    pointer-events: none;
  }

  @keyframes driftFog {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-5%, 5%) scale(1.1); }
  }

  /* Starfield / Dust */
  .dust-field {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  .dust {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 4s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.6; transform: scale(1); }
  }

  /* --- Game Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* --- Top Bar (Centered) --- */
  .top-bar {
    align-self: center;
    background: var(--glass-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: var(--glass-border);
    border-radius: var(--radius-token);
    padding: 0.75rem 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border-top: var(--glass-highlight);
    margin-top: 1rem;
    pointer-events: auto;
    transition: transform 0.3s ease;
  }
  
  .top-bar:hover { transform: translateY(2px); }

  .game-title {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
  }

  .session-count {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .session-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--accent-cyan);
    opacity: 0.8;
  }

  .session-value {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }

  /* --- Bottom Bar (Right Aligned Cluster) --- */
  .bottom-bar {
    align-self: flex-end;
    display: flex;
    align-items: flex-end;
    pointer-events: auto;
  }

  .collection-cluster {
    display: flex;
    background: var(--glass-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: var(--glass-border);
    border-radius: var(--radius-token);
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    border-top: var(--glass-highlight);
    transition: transform 0.2s ease;
  }

  .collection-cluster:hover {
    transform: translateY(-2px);
  }

  /* Stats Side */
  .stats-panel {
    padding: 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  .stats-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .stats-count {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-main);
  }

  /* Button Side */
  .btn-open {
    background: rgba(255, 255, 255, 0.05);
    border: none;
    color: var(--accent-cyan);
    padding: 0 1.5rem;
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    height: 100%;
  }

  .btn-open:hover {
    background: rgba(0, 240, 255, 0.1);
    color: #fff;
  }

  .btn-open:active {
    transform: scale(0.96);
  }

  /* --- Toast Notification --- */
  .toast {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -20px);
    background: rgba(10, 12, 20, 0.8);
    border: 1px solid var(--accent-purple);
    backdrop-filter: blur(12px);
    padding: 0.8rem 1.5rem;
    border-radius: var(--radius-token);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast h3 { font-size: 0.9rem; color: var(--text-main); margin-bottom: 2px; }
  .toast p { font-size: 0.7rem; color: var(--accent-purple); text-transform: uppercase; letter-spacing: 0.05em; }

</style>
</head>
<body>

<div class="scene-container">
  <div class="fog-layer"></div>
  <div class="dust-field" id="dustField"></div>
  <canvas id="gameCanvas"></canvas>
</div>

<div class="ui-layer">
  
  <!-- Top Center: Title & Session -->
  <header class="top-bar">
    <div class="game-title">Aether Catcher</div>
    <div class="session-count">
      <span class="session-label">SESSION</span>
      <span class="session-value" id="score">00</span>
    </div>
  </header>

  <!-- Toast -->
  <div class="toast" id="toast">
    <h3 id="catchName">Entity</h3>
    <p>Captured</p>
  </div>

  <!-- Bottom Right: Collection -->
  <div class="bottom-bar">
    <div class="collection-cluster">
      <div class="stats-panel">
        <div class="stats-label">Collected</div>
        <div class="stats-count"><span id="totalCaught">12</span><span style="font-size:0.8em; color:var(--text-muted)">/16</span></div>
      </div>
      <button class="btn-open" id="collectBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        Collection
      </button>
    </div>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Overhaul
 * 1. Player: Stylized Geometric Avatar + Energy Net
 * 2. Creatures: Organic pulsing shapes (Jelly, Shard, Spore)
 * 3. Layout: Centered Top, Grouped Bottom
 */

// --- Background Setup ---
const dustField = document.getElementById('dustField');
for(let i=0; i<50; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    const size = Math.random() * 2 + 1;
    d.style.width = `${size}px`;
    d.style.height = `${size}px`;
    d.style.left = `${Math.random() * 100}%`;
    d.style.top = `${Math.random() * 100}%`;
    d.style.animationDuration = `${Math.random() * 3 + 2}s`;
    d.style.animationDelay = `${Math.random() * 2}s`;
    dustField.appendChild(d);
}

// --- Canvas Engine ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const totalCaughtEl = document.getElementById('totalCaught');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

let width, height;
let score = 0;
let totalCaught = 12;
let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const vel = Math.random() * 4 * speed;
    this.vx = Math.cos(angle) * vel;
    this.vy = Math.sin(angle) * vel;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.01;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95; // friction
    this.vy *= 0.95;
    this.life -= this.decay;
    this.size *= 0.95;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text, color) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.life = 1.0;
    this.vy = -1.5;
  }
  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.font = '600 14px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor(isRare = false) {
    this.isRare = isRare;
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.baseSize = this.isRare ? 35 : (Math.random() * 10 + 15);
    
    // Physics
    this.vx = (Math.random() - 0.5) * (this.isRare ? 0.3 : 0.8);
    this.vy = (Math.random() - 0.5) * (this.isRare ? 0.3 : 0.8);
    
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.05 + 0.03;
    
    this.color = this.isRare ? '#fbbf24' : this.getColor();
    this.type = this.getType(); 
    this.caught = false;
    this.caughtTimer = 0;
    this.z = Math.random(); // Depth
  }

  getColor() {
    // Palette: Cyan, Purple, Teal
    const colors = ['#00f0ff', '#8b5cf6', '#2dd4bf'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  getType() {
    // Organic shapes
    const types = ['jelly', 'shard', 'manta', 'spore'];
    return types[Math.floor(Math.random() * types.length)];
  }

  update() {
    this.wobble += this.wobbleSpeed;

    if (!this.caught) {
      this.x += this.vx;
      this.y += this.vy + Math.sin(this.wobble) * 0.5;
      
      // Wrap
      if (this.x < -100) this.x = width + 100;
      if (this.x > width + 100) this.x = -100;
      if (this.y < -100) this.y = height + 100;
      if (this.y > height + 100) this.y = -100;

      // Catch Check
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Net radius is 70
      if (dist < 70) {
        this.catch();
      }
    } else {
      // Caught animation
      this.caughtTimer += 0.1;
      this.x += (mouse.x - this.x) * 0.2;
      this.y += (mouse.y - this.y) * 0.2;
      
      // Spiral
      const r = 30 * (1 - this.caughtTimer/20);
      this.x += Math.cos(this.caughtTimer * 15) * r * 0.2;
      this.y += Math.sin(this.caughtTimer * 15) * r * 0.2;
      
      this.baseSize *= 0.9;
      if (this.baseSize < 1) this.init();
    }
  }

  catch() {
    this.caught = true;
    score++;
    totalCaught++;
    scoreEl.innerText = score.toString().padStart(2, '0');
    totalCaughtEl.innerText = totalCaught;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y - 20, this.isRare ? "RARE!" : "CAPTURED", this.color));
    
    const names = ["Aether Jelly", "Void Shard", "Mist Moth", "Star Manta", "Nebula Spore"];
    catchNameEl.innerText = this.isRare ? "Golden Prism" : names[Math.floor(Math.random() * names.length)];
    
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Tilt
    const tilt = Math.sin(this.wobble) * 0.3;
    ctx.rotate(tilt);
    
    // Glow
    ctx.shadowBlur = this.isRare ? 30 : 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.globalCompositeOperation = 'screen';

    const s = this.baseSize;

    ctx.beginPath();

    if (this.type === 'jelly') {
      // Pulsing Dome
      const pulse = 1 + Math.sin(this.wobble * 2) * 0.1;
      ctx.moveTo(-s*pulse, 0);
      ctx.quadraticCurveTo(-s*pulse, -s*1.5, 0, -s*1.5);
      ctx.quadraticCurveTo(s*pulse, -s*1.5, s*pulse, 0);
      ctx.stroke();
      
      ctx.globalAlpha = 0.3;
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // Tentacles
      ctx.beginPath();
      ctx.moveTo(-s*0.5, 0);
      ctx.quadraticCurveTo(-s*0.5, s*0.5, -s*0.3, s);
      ctx.moveTo(s*0.5, 0);
      ctx.quadraticCurveTo(s*0.5, s*0.5, s*0.3, s);
      ctx.stroke();
    }
    else if (this.type === 'shard') {
      // Floating Crystal
      ctx.moveTo(0, -s*1.5);
      ctx.lineTo(s*0.8, 0);
      ctx.lineTo(0, s*1.5);
      ctx.lineTo(-s*0.8, 0);
      ctx.closePath();
      ctx.fill();
      
      // Inner core
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s*0.3, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s*0.3, 0);
      ctx.fill();
    }
    else if (this.type === 'manta') {
      // Ray shape
      ctx.moveTo(0, -s*0.5);
      ctx.quadraticCurveTo(s, 0, s*1.5, s*0.8);
      ctx.quadraticCurveTo(0, s*0.2, -s*1.5, s*0.8);
      ctx.quadraticCurveTo(-s, 0, 0, -s*0.5);
      ctx.fill();
    }
    else {
      // Spore / Orb
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.fill();
      // Core
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, s*0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 25; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// --- Player Rendering (Avatar + Net) ---
function drawPlayerAndNet() {
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // 1. The Net (Energy Hoop)
  // Outer Ring
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, 70, 0, Math.PI * 2);
  ctx.stroke();
  
  // Inner Mesh Pattern (Subtle)
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0; i<8; i++) {
    ctx.moveTo(0,0);
    ctx.lineTo(70 * Math.cos(i * Math.PI/4), 70 * Math.sin(i * Math.PI/4));
  }
  ctx.stroke();

  // 2. The Avatar (Geometric Explorer)
  // Offset to bottom-left of net
  const avX = -50; 
  const avY = 40;
  
  ctx.translate(avX, avY);
  
  // Avatar Glow
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#8b5cf6'; // Purple glow for player
  
  // Body (Stylized Cloak)
  ctx.fillStyle = '#1e1b4b'; // Deep Indigo
  ctx.strokeStyle = '#8b5cf6';
  ctx.lineWidth = 2;
  
  ctx.beginPath();
  ctx.moveTo(0, -25); // Neck
  ctx.lineTo(-15, 20); // Left hip
  ctx.lineTo(0, 25); // Feet
  ctx.lineTo(15, 20); // Right hip
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Head (Visor)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(0, -30, 8, 0, Math.PI*2);
  ctx.fill();
  
  // Visor Eye
  ctx.fillStyle = '#00f0ff';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 5;
  ctx.beginPath();
  ctx.arc(2, -30, 2, 0, Math.PI*2);
  ctx.fill();

  // Arm connecting to Net
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#1e1b4b';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(10, -15); // Shoulder
  ctx.lineTo(40, -30); // Hand (reaching to net center)
  ctx.stroke();
  
  // Hand
  ctx.fillStyle = '#8b5cf6';
  ctx.beginPath();
  ctx.arc(40, -30, 4, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// --- Initialization ---
resize();

// Spawn Creatures
for (let i = 0; i < 12; i++) creatures.push(new Creature(false));
creatures.push(new Creature(true)); // 1 Rare

// Animation Loop
function animate() {
  time += 0.01;
  ctx.clearRect(0, 0, width, height);
  
  // Sort by Z
  creatures.sort((a, b) => a.z - b.z);
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Player (Always on top)
  drawPlayerAndNet();

  requestAnimationFrame(animate);
}

animate();

// Button Interaction
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.96)';
    setTimeout(() => btn.style.transform = '', 100);
    
    // Reset
    score = 0;
    totalCaught = 12; 
    scoreEl.innerText = "00";
    totalCaughtEl.innerText = "12";
    
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
</body>
</html>
