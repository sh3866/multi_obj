<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #030305;
            --bg-surface: #0a0a10;
            
            /* Golds */
            --gold-bright: #ffe6a3;
            --gold-primary: #d4af37;
            --gold-dark: #8a6e2f;
            
            /* Void/Mystic Colors */
            --void-core: #7b2cbf;
            --void-glow: #9d4edd;
            --void-ambient: #3c096c;
            
            /* Text */
            --text-main: #e0e0e0;
            --text-muted: #888899;
            
            /* UI Elements */
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(10, 10, 15, 0.65);
            --glass-highlight: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERIC BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #canvas-layer {
            opacity: 0.6;
        }

        .vignette {
            background: radial-gradient(circle at center, transparent 20%, var(--bg-deep) 95%);
        }

        .noise {
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        /* --- HEADER & CURRENCY --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            animation: fadeDown 1s ease-out;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-family: 'Times New Roman', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
            line-height: 1;
        }

        .game-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--void-glow);
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* Currency Gem */
        .currency-gem {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(138, 110, 47, 0.05));
            border: 1px solid var(--gold-dark);
            padding: 6px 12px 6px 8px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Shine effect on gem */
        .currency-gem::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }

        .gem-icon {
            width: 20px;
            height: 20px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 4px var(--gold-dark));
        }

        .gold-amount {
            font-family: 'Times New Roman', serif;
            font-size: 1.1rem;
            color: var(--gold-bright);
            font-weight: bold;
            letter-spacing: 0.05em;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* --- HERO AREA: THE VOID CORE --- */
        .hero-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
        }

        .void-core-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 6s ease-in-out infinite;
        }

        /* The Orb */
        .void-core {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #a855f7, #4c1d95, #000);
            box-shadow: 
                0 0 60px 10px rgba(157, 78, 221, 0.4),
                0 0 100px 40px rgba(60, 9, 108, 0.3),
                inset 0 0 20px rgba(255,255,255,0.5);
            position: relative;
            z-index: 2;
            animation: pulse-core 4s ease-in-out infinite alternate;
        }

        /* Inner swirl effect */
        .void-core::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.8), transparent, transparent);
            animation: spin 3s linear infinite;
            opacity: 0.6;
            mask-image: radial-gradient(circle, transparent 60%, black 100%);
            -webkit-mask-image: radial-gradient(circle, transparent 60%, black 100%);
        }

        /* Outer Rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(157, 78, 221, 0.3);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.1);
        }

        .ring-1 {
            width: 160px; height: 160px;
            border-top-color: rgba(255,255,255,0.5);
            border-bottom-color: rgba(255,255,255,0.5);
            animation: spin-reverse 8s linear infinite;
        }

        .ring-2 {
            width: 190px; height: 190px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            animation: spin 15s linear infinite;
        }

        /* --- MAIN MENU --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: auto;
            padding-bottom: 1rem;
            animation: fadeUp 1s ease-out 0.3s backwards;
        }

        /* Glassmorphism Card Style */
        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            height: 110px;
        }

        /* Card Hover Effects */
        .menu-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(20, 20, 30, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .menu-card:hover .card-icon {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
        }

        /* Primary Action: Summon */
        .menu-card.primary {
            grid-column: span 2;
            height: 90px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            border: 1px solid var(--gold-dark);
            background: linear-gradient(90deg, rgba(20, 15, 10, 0.8), rgba(40, 30, 10, 0.9));
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .menu-card.primary:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            background: linear-gradient(90deg, rgba(30, 20, 10, 0.9), rgba(50, 40, 10, 0.95));
        }

        /* Rune Icons */
        .card-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 12px;
            fill: var(--text-muted);
            transition: all 0.3s;
        }

        .menu-card.primary .card-icon {
            margin-bottom: 0;
            fill: var(--gold-primary);
            width: 32px;
            height: 32px;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .card-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .menu-card.primary .card-label {
            color: var(--gold-bright);
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse-core {
            0% { box-shadow: 0 0 60px 10px rgba(157, 78, 221, 0.4), inset 0 0 20px rgba(255,255,255,0.5); }
            100% { box-shadow: 0 0 80px 20px rgba(157, 78, 221, 0.6), inset 0 0 30px rgba(255,255,255,0.8); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 700px) {
            .game-title { font-size: 1.8rem; }
            .void-core-container { transform: scale(0.8); margin: -20px 0; }
            .menu-card { height: 90px; }
            .menu-card.primary { height: 70px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="canvas-layer" class="bg-layer"></canvas>
    <div class="vignette bg-layer"></div>
    <div class="noise bg-layer"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <div class="currency-gem">
                <!-- Coin Icon -->
                <svg class="gem-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA (THE VOID CORE) -->
        <div class="hero-area">
            <div class="void-core-container" id="void-container">
                <div class="ring ring-2"></div>
                <div class="ring ring-1"></div>
                <div class="void-core"></div>
            </div>
        </div>

        <!-- MAIN MENU -->
        <nav class="menu-grid">
            
            <!-- Primary Action: Summon -->
            <div class="menu-card primary">
                <div class="card-content">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
                <!-- Rune: Star/Summon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/>
                </svg>
            </div>

            <!-- Secondary Action: Roster -->
            <div class="menu-card">
                <!-- Rune: People/Group -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <!-- Secondary Action: Battle -->
            <div class="menu-card">
                <!-- Rune: Sword/Conflict -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <!-- Secondary Action: Grind -->
            <div class="menu-card">
                <!-- Rune: Hammer/Work -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 1.07V9h7c0-3.87-3.13-7-7-7zm-2 1v8h-1v1h1v1h1v-1h1v-1h-1v-1h1V2h-1v1h-1V2.07zM19 11h-6v2h6v-2zm0 4h-6v2h6v-2zm-8-6h-6v2h6v-2zm0 4H5v2h6v-2z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Floating dust/embers effect.
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        const particleCount = 50;
        const connectionDistance = 120;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
                // Randomize start positions to avoid clustering at 0,0 initially
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = -(Math.random() * 0.5 + 0.1); // Move upwards
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.life = 0;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;
                
                // Wrap around or reset
                if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `rgba(200, 200, 220, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Draw faint connections (Constellation effect)
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < connectionDistance) {
                        const opacity = (1 - dist / connectionDistance) * 0.15;
                        ctx.strokeStyle = `rgba(157, 78, 221, ${opacity})`; // Purple tint connections
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Mouse parallax on the Void Core
        const voidContainer = document.getElementById('void-container');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 80;
            const y = (window.innerHeight - e.pageY * 2) / 80;
            
            voidContainer.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
