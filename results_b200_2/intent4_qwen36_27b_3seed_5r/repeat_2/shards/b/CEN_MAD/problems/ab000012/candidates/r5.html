<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Deep Void & Gold */
            --bg-deep: #05020a;
            --bg-violet-dark: #1a0b2e;
            --bg-violet-light: #4c1d95;
            
            /* Gold Palette */
            --gold-primary: #d4af37;
            --gold-light: #fff2b2;
            --gold-dark: #aa8c2c;
            --gold-glow: rgba(212, 175, 55, 0.6);
            
            /* Typography */
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', system-ui, sans-serif;
            
            /* Glass Properties */
            --glass-bg: rgba(10, 10, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #e0e0e0;
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 30%, #2e1065 0%, #0f0518 60%, #05020a 100%);
        }

        /* --- ATMOSPHERE & TEXTURE --- */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        /* Noise Texture - Pure CSS */
        .noise {
            opacity: 0.08;
            background: 
                repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 2px, rgba(0,0,0,0.5) 3px),
                repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(255,255,255,0.02) 3px);
            background-size: 10px 10px, 4px 4px;
            mix-blend-mode: overlay;
        }

        .vignette {
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            opacity: 0.95;
            z-index: 1;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            animation: fadeIn 1.2s ease-out;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 20;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-family: var(--font-serif);
            font-size: 2.6rem;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.15em; /* Cinematic tracking */
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.8);
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .game-subtitle {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #a78bfa;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Currency UI - Polished Box */
        .currency-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold-dark);
            padding: 8px 12px;
            border-radius: 4px; /* Slightly squared */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .currency-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
            opacity: 0.5;
        }

        .currency-box:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .coin-icon {
            width: 22px;
            height: 22px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 3px var(--gold-glow));
        }

        .gold-amount {
            font-family: var(--font-sans);
            font-size: 1rem;
            color: var(--gold-light);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* --- HERO AREA: EXPANDED (40%) --- */
        .hero-area {
            flex: 0 0 40%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
            margin-bottom: 1.5rem;
        }

        .void-core-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Subtle tilt for 3D feel */
            transform-style: preserve-3d;
        }

        /* Background Glow for Hero */
        .hero-glow {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(76, 29, 149, 0.2) 0%, transparent 60%);
            z-index: -1;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        /* Portal Rings - Dashed & Rotating */
        .ring {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.1);
        }

        .ring-outer {
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(212, 175, 55, 0.3);
            animation: spin 25s linear infinite;
        }

        .ring-middle {
            width: 80%;
            height: 80%;
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-top-color: transparent;
            border-bottom-color: transparent;
            animation: spin-reverse 15s linear infinite;
        }

        .ring-inner {
            width: 50%;
            height: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            animation: spin 10s linear infinite;
        }

        /* The Core Vortex */
        .void-core {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #d8b4fe, #4c1d95, #000);
            box-shadow: 
                0 0 30px 10px rgba(139, 92, 246, 0.4),
                0 0 60px 30px rgba(76, 29, 149, 0.2),
                inset 0 0 20px rgba(255,255,255,0.8);
            z-index: 2;
            animation: breathe 4s ease-in-out infinite alternate;
        }

        /* --- MAIN MENU: 2x2 GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            flex: 1; /* Fill remaining space */
            max-height: 380px; /* Limit height so it doesn't stretch too much */
            margin-top: auto;
            padding-bottom: 1rem;
        }

        /* --- CARD BASE STYLES --- */
        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Noise Overlay on Cards */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            background: rgba(20, 15, 35, 0.85);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* --- ICON STYLING (Filled & Glowing) --- */
        .card-icon-wrapper {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .menu-card:hover .card-icon-wrapper {
            transform: scale(1.15);
        }

        .card-icon {
            width: 100%;
            height: 100%;
            fill: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
            transition: fill 0.3s ease;
        }

        .menu-card:hover .card-icon {
            fill: #fff;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
        }

        /* Typography: Menu Labels */
        .card-label {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 300;
            color: #e0e0e0;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            z-index: 2;
            margin-bottom: 4px;
        }

        .card-sublabel {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            color: #888899;
            letter-spacing: 0.05em;
            z-index: 2;
        }

        /* --- PRIMARY CARD: SUMMON (Focal Point) --- */
        /* Positioned Top-Left via Grid Order if needed, but visually distinct */
        .menu-card.primary {
            /* Distinct Border */
            border: 1px solid var(--gold-primary);
            /* Glowing Gradient Background */
            background: linear-gradient(160deg, rgba(30, 20, 50, 0.9), rgba(60, 40, 100, 0.8));
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .menu-card.primary:hover {
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            background: linear-gradient(160deg, rgba(40, 30, 60, 0.95), rgba(70, 50, 120, 0.9));
        }

        .menu-card.primary .card-icon {
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }

        .menu-card.primary:hover .card-icon {
            fill: var(--gold-light);
        }

        .menu-card.primary .card-label {
            color: var(--gold-light);
            font-weight: 500;
            letter-spacing: 0.15em;
        }

        .menu-card.primary .card-sublabel {
            color: var(--gold-primary);
            opacity: 0.8;
        }

        /* Grid Positioning (Explicit) */
        .card-summon { grid-column: 1; grid-row: 1; }
        .card-roster { grid-column: 2; grid-row: 1; }
        .card-battle { grid-column: 1; grid-row: 2; }
        .card-grind  { grid-column: 2; grid-row: 2; }


        /* --- ANIMATIONS --- */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes breathe {
            0% { transform: scale(0.95); box-shadow: 0 0 30px 10px rgba(139, 92, 246, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 50px 20px rgba(139, 92, 246, 0.6); }
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-height: 750px) {
            .hero-area { flex: 0 0 35%; }
            .void-core-container { transform: scale(0.8); }
            .game-title { font-size: 2.2rem; }
            .menu-grid { max-height: 320px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="canvas-layer" class="bg-layer"></canvas>
    <div class="vignette bg-layer"></div>
    <div class="noise bg-layer"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <!-- Currency UI: Polished Box -->
            <div class="currency-box">
                <!-- Custom CSS/SVG Coin Icon -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA: EXPANDED & ENRICHED -->
        <div class="hero-area">
            <div class="void-core-container" id="void-container">
                <!-- Background Glow -->
                <div class="hero-glow"></div>
                
                <!-- Rotating Rings -->
                <div class="ring ring-outer"></div>
                <div class="ring ring-middle"></div>
                <div class="ring ring-inner"></div>
                
                <!-- Central Core -->
                <div class="void-core"></div>
            </div>
        </div>

        <!-- MAIN MENU: 2x2 GRID -->
        <nav class="menu-grid">
            
            <!-- 1. Summon (Top-Left) - PRIMARY -->
            <div class="menu-card primary card-summon">
                <div class="card-icon-wrapper">
                    <!-- Icon: Intricate Portal/Sigil (Filled) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2L9 9H2l6 5-2 8 6-4 6 4-2-8 6-5h-7z" />
                    </svg>
                </div>
                <div class="card-content" style="text-align:center;">
                    <div class="card-label">Summon</div>
                    <div class="card-sublabel">Open the Void</div>
                </div>
            </div>

            <!-- 2. Roster (Top-Right) -->
            <div class="menu-card card-roster">
                <div class="card-icon-wrapper">
                    <!-- Icon: Spirit Profile (Filled) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="card-content" style="text-align:center;">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage Spirits</div>
                </div>
            </div>

            <!-- 3. Battle (Bottom-Left) -->
            <div class="menu-card card-battle">
                <div class="card-icon-wrapper">
                    <!-- Icon: Sword/Combat (Filled) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6 2l12 12-2 2-4-4-6 6V2z" />
                    </svg>
                </div>
                <div class="card-content" style="text-align:center;">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Enter Arena</div>
                </div>
            </div>

            <!-- 4. Grind (Bottom-Right) -->
            <div class="menu-card card-grind">
                <div class="card-icon-wrapper">
                    <!-- Icon: Flame/Resource (Filled) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/>
                    </svg>
                </div>
                <div class="card-content" style="text-align:center;">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Floating embers/dust.
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        const particleCount = 40;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = -(Math.random() * 0.5 + 0.2);
                this.size = Math.random() * 2 + 0.5;
                // Gold or Purple particles
                this.color = Math.random() > 0.6 ? 'rgba(212, 175, 55,' : 'rgba(139, 92, 246,';
                this.alpha = 0;
                this.maxAlpha = Math.random() * 0.6 + 0.2;
                this.life = Math.random() * 100;
                this.lifeSpeed = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Fade in and out
                this.life += this.lifeSpeed;
                this.alpha = Math.sin(this.life) * this.maxAlpha;
                
                if (this.y < -10 || this.x < -10 || this.x > width + 10 || this.life > Math.PI) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `${this.color} ${Math.abs(this.alpha)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Mouse parallax on the Void Core
        const voidContainer = document.getElementById('void-container');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            voidContainer.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
