<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Deep Void & Gold */
            --bg-deep: #05020a;
            --bg-violet: #2e1065;
            --bg-radial: radial-gradient(circle at 50% 30%, #2e1065 0%, #0f0518 60%, #05020a 100%);
            
            /* Golds */
            --gold-bright: #fff2b2;
            --gold-primary: #d4af37;
            --gold-dark: #8a6e2f;
            --gold-glow: rgba(212, 175, 55, 0.6);
            
            /* Void/Mystic */
            --void-glow: rgba(167, 139, 250, 0.4);
            --void-purple: #8b5cf6;
            
            /* Typography */
            --font-serif: 'Times New Roman', 'Playfair Display', serif;
            --font-sans: 'Segoe UI', system-ui, sans-serif;
            
            /* UI */
            --glass-bg: rgba(15, 10, 25, 0.65);
            --glass-border: rgba(212, 175, 55, 0.3);
            --card-highlight: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-deep);
            background: var(--bg-radial); 
            color: #e0e0e0;
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERIC BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Noise Texture - Reduced opacity per Critique #5 */
        .noise {
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            opacity: 0.8;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* --- HEADER & CURRENCY --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem; /* Tighter spacing for vertical balance */
            animation: fadeDown 1s ease-out;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
            line-height: 0.9;
        }

        .game-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            color: var(--void-purple);
            text-transform: uppercase;
            margin-top: 8px;
            opacity: 0.9;
            font-weight: 600;
        }

        /* Currency Pill - Glassmorphism Critique #5 */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 10, 25, 0.4); /* More transparent */
            backdrop-filter: blur(10px); /* Blur effect */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 6px 14px 6px 6px;
            border-radius: 99px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
        }

        .currency-pill::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 99px;
            background: linear-gradient(135deg, var(--gold-primary), transparent 40%, transparent 60%, var(--gold-primary));
            opacity: 0.3;
            z-index: -1;
            filter: blur(2px);
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            fill: var(--gold-bright);
            filter: drop-shadow(0 0 5px var(--gold-glow));
            animation: spin-slow 10s linear infinite;
        }

        .gold-amount {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: var(--gold-bright);
            font-weight: bold;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- HERO AREA: SWIRLING VORTEX (Critique #4) --- */
        .hero-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
            margin-bottom: 1.5rem;
        }

        .void-core-container {
            position: relative;
            width: 300px; /* Larger footprint */
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Removed float animation to make vortex feel more grounded/stable */
        }

        /* Dynamic Vortex Effect */
        .vortex-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg, 
                transparent 0%, 
                rgba(139, 92, 246, 0.2) 20%, 
                rgba(212, 175, 55, 0.1) 40%, 
                transparent 60%,
                rgba(139, 92, 246, 0.3) 80%,
                transparent 100%
            );
            filter: blur(30px);
            opacity: 0.8;
            animation: spin 8s linear infinite;
        }

        .vortex-bg-inner {
            position: absolute;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: conic-gradient(
                from 180deg, 
                transparent 0%, 
                rgba(212, 175, 55, 0.15) 20%, 
                transparent 50%
            );
            filter: blur(20px);
            animation: spin-reverse 12s linear infinite;
        }

        /* The Core Orb */
        .void-core {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #c084fc, #6b21a8, #000);
            box-shadow: 
                0 0 40px 10px rgba(139, 92, 246, 0.4),
                0 0 80px 30px rgba(109, 40, 217, 0.2),
                inset 0 0 15px rgba(255,255,255,0.6);
            position: relative;
            z-index: 2;
            animation: pulse-core 4s ease-in-out infinite alternate;
        }

        /* --- MAIN MENU: RESTRUCTURED GRID (Critique #1) --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: auto;
            padding-bottom: 1rem;
            animation: fadeUp 1s ease-out 0.3s backwards;
        }

        /* --- CARD STYLES: ANCIENT TABLETS (Critique #3) --- */
        .menu-card {
            /* Glassmorphism + Texture */
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Ancient Tablet Borders */
            border: 1px solid var(--gold-dark);
            border-radius: 6px; /* Slightly less rounded for stone feel */
            position: relative;
            overflow: hidden;
            
            /* Layout */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            height: 100px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            /* Inner shadow for depth */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Rune Corners (CSS Pseudo-elements) */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            pointer-events: none;
            z-index: 1;
        }

        /* Hover State */
        .menu-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold-primary);
            background: rgba(30, 20, 50, 0.75);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.6), 0 0 10px var(--gold-glow);
        }

        .menu-card:hover .card-icon {
            filter: drop-shadow(0 0 8px var(--gold-primary));
            transform: scale(1.1) translateY(-2px);
        }

        /* --- PRIMARY CARD: SUMMON (Critique #2) --- */
        .menu-card.primary {
            grid-column: span 2; /* Full Width */
            height: 140px; /* Increased Height */
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            
            /* Distinct Background Treatment */
            background: linear-gradient(135deg, rgba(20, 15, 30, 0.9), rgba(40, 30, 60, 0.95));
            border-width: 2px;
            border-color: var(--gold-primary);
            
            /* Glowing Edge */
            box-shadow: 
                inset 0 0 30px rgba(139, 92, 246, 0.1),
                0 0 15px rgba(212, 175, 55, 0.2);
        }

        .menu-card.primary:hover {
            background: linear-gradient(135deg, rgba(30, 20, 40, 0.95), rgba(50, 40, 80, 1));
            box-shadow: 
                inset 0 0 30px rgba(139, 92, 246, 0.2),
                0 0 25px var(--gold-glow);
        }

        /* --- ICONS & TYPOGRAPHY (Critique #5) --- */
        .card-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 12px;
            fill: var(--gold-primary);
            transition: all 0.3s;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }

        .menu-card.primary .card-icon {
            /* Portal/Sigil Icon styling */
            margin-bottom: 0;
            width: 50px;
            height: 50px;
            fill: var(--gold-bright);
            animation: spin-slow 15s linear infinite;
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }

        .card-content {
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .card-label {
            font-size: 1rem;
            font-weight: 700; /* Bold per Critique #5 */
            color: #fff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        .menu-card.primary .card-label {
            font-family: var(--font-serif); /* Serif for main title */
            color: var(--gold-bright);
            font-size: 1.4rem;
            letter-spacing: 0.15em;
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: #a0a0b0;
            margin-top: 4px;
            letter-spacing: 0.05em;
            font-weight: 400;
        }
        
        .menu-card.primary .card-sublabel {
            color: var(--gold-primary);
            opacity: 0.8;
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse-core {
            0% { box-shadow: 0 0 40px 10px rgba(139, 92, 246, 0.4), inset 0 0 15px rgba(255,255,255,0.6); transform: scale(1); }
            100% { box-shadow: 0 0 60px 20px rgba(139, 92, 246, 0.6), inset 0 0 25px rgba(255,255,255,0.9); transform: scale(1.05); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes spin-slow {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-height: 700px) {
            .game-title { font-size: 2rem; }
            .hero-area { flex: 0 0 35%; } /* Squeeze hero slightly */
            .void-core-container { transform: scale(0.85); }
            .menu-card { height: 80px; }
            .menu-card.primary { height: 100px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="canvas-layer" class="bg-layer"></canvas>
    <div class="vignette bg-layer"></div>
    <div class="noise bg-layer"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <!-- Currency Pill -->
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA: SWIRLING VORTEX -->
        <div class="hero-area">
            <div class="void-core-container" id="void-container">
                <!-- Background Swirls -->
                <div class="vortex-bg"></div>
                <div class="vortex-bg-inner"></div>
                <!-- Central Core -->
                <div class="void-core"></div>
            </div>
        </div>

        <!-- MAIN MENU: UNIFIED 2-COLUMN GRID -->
        <nav class="menu-grid">
            
            <!-- Primary Action: Summon (Full Width, Elevated) -->
            <div class="menu-card primary">
                <div class="card-content">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the void portal</div>
                </div>
                <!-- Icon: Glowing Sigil/Portal -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                    <circle cx="12" cy="12" r="3" fill="none" stroke="#d4af37" stroke-width="1"/>
                </svg>
            </div>

            <!-- Secondary Action: Roster -->
            <div class="menu-card">
                <!-- Icon: Scroll -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H14A2,2 0 0,0 16,20V4A2,2 0 0,0 14,2M14,20H6V4H14V20M18,6H20V18H18V6M22,6H22.01V18H22V6Z" />
                </svg>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <!-- Secondary Action: Battle -->
            <div class="menu-card">
                <!-- Icon: Sword -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25M18.66,4.34L19.66,5.34L16.19,8.81L15.19,7.81L18.66,4.34M2.29,20.71L3,21.42L4.42,20L3.71,19.29L2.29,20.71Z" />
                </svg>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Enter arena</div>
                </div>
            </div>

            <!-- Secondary Action: Grind (Centered) -->
            <div class="menu-card">
                <!-- Icon: Flame -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Floating embers/dust.
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        const particleCount = 60;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = -(Math.random() * 0.4 + 0.1);
                this.size = Math.random() * 2 + 0.5;
                // Randomly gold or purple particles
                this.color = Math.random() > 0.7 ? 'rgba(212, 175, 55,' : 'rgba(139, 92, 246,';
                this.alpha = Math.random() * 0.5 + 0.1;
                this.pulse = Math.random() * 0.02;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha += Math.sin(Date.now() * 0.005 + this.x) * 0.005;
                
                if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `${this.color} ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Mouse parallax on the Void Core
        const voidContainer = document.getElementById('void-container');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            voidContainer.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
