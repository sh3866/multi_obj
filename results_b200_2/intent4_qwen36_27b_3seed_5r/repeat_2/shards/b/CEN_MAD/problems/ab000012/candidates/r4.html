<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Deep Void & Gold */
            --bg-deep: #05020a;
            --bg-violet-dark: #1a0b2e;
            --bg-violet-light: #4c1d95;
            
            /* Gold Palette - Locked Gradient */
            --gold-primary: #d4af37;
            --gold-light: #fff2b2;
            --gold-dark: #aa8c2c;
            --gold-glow: rgba(212, 175, 55, 0.5);
            
            /* Typography */
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', system-ui, sans-serif;
            
            /* Card Glass Properties */
            --glass-bg: rgba(10, 10, 20, 0.65);
            --glass-border: rgba(212, 175, 55, 0.3);
            --glass-highlight: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #e0e0e0;
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Base background gradient */
            background: radial-gradient(circle at 50% 30%, #2e1065 0%, #0f0518 60%, #05020a 100%);
        }

        /* --- ATMOSPHERIC BACKGROUND LAYERS --- */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Noise Texture */
        .noise {
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette for depth */
        .vignette {
            background: radial-gradient(circle at center, transparent 30%, #000000 120%);
            opacity: 0.9;
            z-index: 1;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            animation: fadeIn 1s ease-out;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        /* Typography Polish: Serif subtitle */
        .game-subtitle {
            font-family: var(--font-serif); /* Changed to Serif */
            font-size: 0.85rem;
            font-weight: 300; /* Lighter weight */
            letter-spacing: 0.25em;
            color: #a78bfa; /* Softer purple */
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Currency Pill */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 6px 16px 6px 8px;
            border-radius: 99px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }

        .currency-pill:hover {
            transform: scale(1.05);
            border-color: var(--gold-primary);
        }

        .coin-icon {
            width: 20px;
            height: 20px;
            fill: var(--gold-light);
            filter: drop-shadow(0 0 4px var(--gold-glow));
        }

        .gold-amount {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--gold-light);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* --- HERO AREA: DYNAMIC SUMMONING CIRCLE --- */
        .hero-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 800px;
            margin-bottom: 2rem;
        }

        .void-core-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Summoning Circle Rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
        }

        .ring-outer {
            width: 100%;
            height: 100%;
            border-style: dashed;
            border-color: rgba(212, 175, 55, 0.2);
            animation: spin 20s linear infinite;
        }

        .ring-middle {
            width: 80%;
            height: 80%;
            border-width: 2px;
            border-top-color: var(--void-light);
            border-bottom-color: var(--void-light);
            border-left-color: transparent;
            border-right-color: transparent;
            animation: spin-reverse 12s linear infinite;
            filter: blur(1px);
        }

        .ring-inner {
            width: 60%;
            height: 60%;
            border: 1px solid var(--gold-primary);
            opacity: 0.6;
            animation: pulse-ring 3s ease-in-out infinite;
        }

        /* The Core Vortex */
        .void-core {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #c084fc, #4c1d95, #000);
            box-shadow: 
                0 0 30px 5px rgba(139, 92, 246, 0.4),
                0 0 60px 20px rgba(76, 29, 149, 0.2),
                inset 0 0 20px rgba(255,255,255,0.5);
            z-index: 2;
            animation: breathe 4s ease-in-out infinite alternate;
        }

        /* --- MAIN MENU: RESTRUCTURED GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: auto;
            padding-bottom: 1rem;
        }

        /* --- UNIFIED GLASS CARD COMPONENT --- */
        .menu-card {
            /* Base Glass Style */
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            
            /* Border & Shape */
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            /* Layout */
            display: flex;
            flex-direction: row; /* Horizontal layout for consistency */
            align-items: center;
            padding: 1rem;
            height: 90px;
            cursor: pointer;
            
            /* Depth */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Subtle Noise Overlay on Cards */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        /* Inner Gold Gradient Border Simulation */
        .menu-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 50%, rgba(212, 175, 55, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Hover State */
        .menu-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold-primary);
            background: rgba(20, 15, 35, 0.75);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 10px rgba(212, 175, 55, 0.1);
        }

        /* --- PRIMARY CARD: SUMMON --- */
        .menu-card.primary {
            grid-column: span 2;
            height: 110px;
            /* Distinct Gold Accent */
            border: 1px solid var(--gold-primary);
            background: linear-gradient(135deg, rgba(20, 15, 30, 0.8), rgba(40, 30, 60, 0.9));
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); /* Subtle Glow */
        }

        .menu-card.primary:hover {
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            background: linear-gradient(135deg, rgba(30, 20, 40, 0.9), rgba(50, 40, 80, 1));
        }

        /* --- ICONS & TYPOGRAPHY --- */
        .card-icon-wrapper {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .menu-card:hover .card-icon-wrapper {
            transform: scale(1.1);
        }

        .card-icon {
            width: 28px;
            height: 28px;
            /* Unified Icon Style: 2px stroke, Gold fill/stroke */
            fill: none;
            stroke: var(--gold-primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }

        .menu-card.primary .card-icon {
            width: 36px;
            height: 36px;
            fill: var(--gold-primary);
            stroke: none;
            filter: drop-shadow(0 0 8px var(--gold-glow));
        }

        .card-content {
            display: flex;
            flex-direction: column;
            z-index: 2;
            flex: 1;
        }

        .card-label {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .menu-card.primary .card-label {
            color: var(--gold-light);
            font-size: 1.3rem;
            letter-spacing: 0.1em;
        }

        .card-sublabel {
            font-size: 0.75rem;
            color: #a0a0b0;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .menu-card.primary .card-sublabel {
            color: var(--gold-primary);
            opacity: 0.9;
        }

        /* --- ANIMATIONS --- */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes breathe {
            0% { transform: scale(0.95); box-shadow: 0 0 30px 5px rgba(139, 92, 246, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 50px 15px rgba(139, 92, 246, 0.6); }
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.9); opacity: 0.3; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-height: 700px) {
            .game-title { font-size: 2.2rem; }
            .hero-area { flex: 0 0 35%; }
            .void-core-container { transform: scale(0.8); }
            .menu-card { height: 80px; }
            .menu-card.primary { height: 100px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="canvas-layer" class="bg-layer"></canvas>
    <div class="vignette bg-layer"></div>
    <div class="noise bg-layer"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <!-- Currency Pill -->
            <div class="currency-pill">
                <!-- Simple Coin SVG -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z" fill="currentColor"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA: DYNAMIC SUMMONING CIRCLE -->
        <div class="hero-area">
            <div class="void-core-container" id="void-container">
                <!-- Rotating Rings -->
                <div class="ring ring-outer"></div>
                <div class="ring ring-middle"></div>
                <div class="ring ring-inner"></div>
                <!-- Central Core -->
                <div class="void-core"></div>
            </div>
        </div>

        <!-- MAIN MENU: UNIFIED GRID -->
        <nav class="menu-grid">
            
            <!-- Primary Action: Summon (Full Width) -->
            <div class="menu-card primary">
                <div class="card-icon-wrapper">
                    <!-- Icon: Portal/Sigil -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the void portal</div>
                </div>
            </div>

            <!-- Secondary Action: Roster -->
            <div class="menu-card">
                <div class="card-icon-wrapper">
                    <!-- Icon: Scroll/List -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <!-- Secondary Action: Battle -->
            <div class="menu-card">
                <div class="card-icon-wrapper">
                    <!-- Icon: Sword -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
                        <path d="M13 19l6-6"></path>
                        <path d="M16 16l4 4"></path>
                        <path d="M19 21l2-2"></path>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Enter arena</div>
                </div>
            </div>

            <!-- Secondary Action: Grind -->
            <div class="menu-card">
                <div class="card-icon-wrapper">
                    <!-- Icon: Flame -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.6-3.3.3.7.8 1.5 1.9 2.8z"></path>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Floating embers/dust.
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        const particleCount = 50;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = -(Math.random() * 0.3 + 0.1);
                this.size = Math.random() * 2 + 0.5;
                // Gold or Purple particles
                this.color = Math.random() > 0.7 ? 'rgba(212, 175, 55,' : 'rgba(139, 92, 246,';
                this.alpha = Math.random() * 0.5 + 0.1;
                this.life = Math.random() * 100;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;
                
                // Pulse opacity
                this.alpha = (Math.sin(this.life * 0.05) + 1) / 4 + 0.1;
                
                if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `${this.color} ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Mouse parallax on the Void Core
        const voidContainer = document.getElementById('void-container');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 80;
            const y = (window.innerHeight - e.pageY * 2) / 80;
            voidContainer.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
