<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            --c-bg: #050014;
            --c-grid: #ff0055;
            --c-cyan: #00f0ff;
            --c-magenta: #ff0055;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-white: #ffffff;
            --c-dark: #120024;
            --c-dim: #555577;
            
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: var(--c-white);
            font-family: var(--font-pixel); 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- ATMOSPHERE: CRT Overlay (Subtle) --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 3px,
                    rgba(0,0,0,0.1) 4px,
                    rgba(0,0,0,0.1) 5px
                );
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Background Canvas */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- 1. TYPOGRAPHY & LOGO --- */
        .title-container {
            position: absolute;
            top: 8%;
            z-index: 100;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .subtitle {
            font-family: var(--font-pixel);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: var(--c-cyan);
            letter-spacing: 0.3em;
            text-shadow: 0 0 5px var(--c-cyan);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: clamp(3.5rem, 12vw, 9rem);
            line-height: 0.85;
            margin: 0;
            text-transform: uppercase;
            color: var(--c-white);
            letter-spacing: -4px;
            position: relative;
            display: inline-block;
            /* Pixelated font smoothing for retro feel */
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        /* Glitch/Chromatic Aberration Effect */
        h1::before, h1::after {
            content: "PIXEL\nDANCE";
            white-space: pre;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--c-bg); /* Masking background */
            background: transparent; /* Transparent to show sun through if needed, but usually we want solid */
            overflow: hidden;
        }

        h1::before {
            color: var(--c-cyan);
            left: 3px;
            text-shadow: -3px 0 var(--c-cyan);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
            z-index: -1;
        }

        h1::after {
            color: var(--c-magenta);
            left: -3px;
            text-shadow: -3px 0 var(--c-magenta);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
            z-index: -1;
        }

        @keyframes glitch-anim-1 {
            0% { transform: translateX(-2px); clip-path: inset(10% 0 80% 0); }
            20% { transform: translateX(2px); clip-path: inset(80% 0 0% 0); }
            40% { transform: translateX(-2px); clip-path: inset(40% 0 40% 0); }
            100% { transform: translateX(0); clip-path: inset(10% 0 80% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { transform: translateX(2px); clip-path: inset(80% 0 0% 0); }
            20% { transform: translateX(-2px); clip-path: inset(10% 0 80% 0); }
            40% { transform: translateX(2px); clip-path: inset(40% 0 40% 0); }
            100% { transform: translateX(0); clip-path: inset(80% 0 0% 0); }
        }

        /* --- 3. GAMEPLAY PREVIEW: HIGHWAY --- */
        /* 3. Fix Perspective: Straight-on, converging vanishing point */
        .highway-wrapper {
            position: absolute;
            top: 35%; /* Starts below title */
            left: 0;
            width: 100%;
            height: 65%;
            perspective: 600px; /* Strong perspective */
            perspective-origin: 50% 20%; /* Vanishing point near sun */
            z-index: 50;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .highway {
            position: relative;
            width: 800px; /* Base width */
            height: 100%;
            background: linear-gradient(to bottom, rgba(8,0,20,0.9) 0%, rgba(8,0,20,0.4) 100%);
            transform-origin: 50% 0%;
            transform: rotateX(60deg); /* Tilt floor back */
            display: flex;
            border-top: 4px solid var(--c-magenta);
            box-shadow: 0 0 40px var(--c-magenta);
        }

        /* 3. Lane Lines: Thicker, brighter */
        .lane {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-right: 2px solid rgba(0, 240, 255, 0.6);
            border-left: 2px solid rgba(0, 240, 255, 0.6);
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(139, 0, 255, 0.2) 100%);
        }
        .lane:first-child { border-left: 4px solid var(--c-cyan); }
        .lane:last-child { border-right: 4px solid var(--c-cyan); }

        /* Moving Grid Lines (Horizontal) */
        .lane::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* Perspective grid lines */
            background-image: linear-gradient(to bottom, transparent 98%, var(--c-cyan) 98%, var(--c-cyan) 100%);
            background-size: 100% 150px;
            animation: gridMove 1s linear infinite;
            opacity: 0.5;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 150px; }
        }

        /* 3. Notes: Pixel Art Blocks */
        .note {
            position: absolute;
            width: 60%;
            left: 20%;
            height: 40px;
            /* Pixelated borders */
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 
                inset 0 0 10px rgba(255,255,255,0.8),
                0 0 15px currentColor; 
            animation: noteFall 1.5s linear infinite;
            /* Ensure notes look like blocks */
            image-rendering: pixelated;
        }

        /* Specific Note Colors & Timing */
        .lane:nth-child(1) .note { background-color: var(--c-magenta); color: var(--c-magenta); animation-delay: 0.2s; }
        .lane:nth-child(2) .note { background-color: var(--c-cyan); color: var(--c-cyan); animation-delay: 0.8s; }
        .lane:nth-child(3) .note { background-color: var(--c-green); color: var(--c-green); animation-delay: 0.4s; }
        .lane:nth-child(4) .note { background-color: var(--c-yellow); color: var(--c-yellow); animation-delay: 1.1s; }

        /* Add secondary notes for density */
        .lane:nth-child(1) .note:nth-child(2) { animation-delay: 1.7s; }
        .lane:nth-child(2) .note:nth-child(2) { animation-delay: 0.3s; }
        .lane:nth-child(3) .note:nth-child(2) { animation-delay: 1.9s; }
        .lane:nth-child(4) .note:nth-child(2) { animation-delay: 0.6s; }

        @keyframes noteFall {
            0% { top: -100px; opacity: 0; transform: scale(0.5); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; transform: scale(1.2); }
        }

        /* --- 4. HIT LINE & KEYS --- */
        /* 2. Layout: Move up to overlap highway bottom */
        .hit-line-container {
            position: absolute;
            bottom: 120px; /* Above button */
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--c-white);
            border-top: 4px solid var(--c-white);
            z-index: 60;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 0 20px var(--c-white);
            /* Pixel art corners trick */
            clip-path: polygon(
                0px 5px, 5px 0px, 
                calc(100% - 5px) 0px, 100% 5px, 
                100% calc(100% - 5px), calc(100% - 5px) 100%, 
                5px 100%, 0px calc(100% - 5px)
            );
        }

        .key-marker {
            width: 25%;
            height: 100%;
            border-right: 2px solid var(--c-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-pixel);
            font-size: 24px;
            color: var(--c-white);
            font-weight: bold;
            text-shadow: 0 0 5px var(--c-white);
            background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, transparent 100%);
        }
        .key-marker:last-child { border-right: none; }

        /* --- 5. BUTTON DESIGN --- */
        /* 2. Layout: Overlap hit line / keys area */
        .start-btn {
            pointer-events: auto;
            position: absolute;
            bottom: 60px; /* Moves up */
            z-index: 100;
            
            /* Synthwave Button Styling */
            background: linear-gradient(135deg, var(--c-magenta) 0%, #aa0033 100%);
            color: var(--c-white);
            font-family: var(--font-pixel);
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            padding: 20px 60px;
            
            /* Pixel Art Border Effect using box-shadow */
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.4),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                0 0 0 4px var(--c-white),
                0 0 20px var(--c-magenta);
            
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            animation: btnPulse 2s infinite;
            clip-path: polygon(
                10px 0px, 100% 0px, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0px 100%, 0px 10px
            );
        }

        .start-btn:hover {
            background: linear-gradient(135deg, var(--c-cyan) 0%, #0088aa 100%);
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.4),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                0 0 0 4px var(--c-white),
                0 0 40px var(--c-cyan);
            transform: translateY(-4px) scale(1.05);
            animation: glitchBtn 0.3s infinite;
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.6),
                0 0 0 4px var(--c-white);
        }

        @keyframes btnPulse {
            0% { box-shadow: inset 4px 4px 0px rgba(255,255,255,0.4), inset -4px -4px 0px rgba(0,0,0,0.4), 0 0 0 4px var(--c-white), 0 0 20px var(--c-magenta); }
            50% { box-shadow: inset 4px 4px 0px rgba(255,255,255,0.4), inset -4px -4px 0px rgba(0,0,0,0.4), 0 0 0 4px var(--c-white), 0 0 40px var(--c-magenta); }
            100% { box-shadow: inset 4px 4px 0px rgba(255,255,255,0.4), inset -4px -4px 0px rgba(0,0,0,0.4), 0 0 0 4px var(--c-white), 0 0 20px var(--c-magenta); }
        }

        @keyframes glitchBtn {
            0% { transform: translateY(-4px) skewX(0deg); }
            20% { transform: translateY(-4px) skewX(-5deg); }
            40% { transform: translateY(-4px) skewX(5deg); }
            60% { transform: translateY(-4px) skewX(-2deg); }
            80% { transform: translateY(-4px) skewX(2deg); }
            100% { transform: translateY(-4px) skewX(0deg); }
        }

    </style>
</head>
<body>

    <!-- Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Title -->
    <div class="title-container">
        <span class="subtitle">RHYTHM PROTOCOL</span>
        <h1>PIXEL<br>DANCE</h1>
    </div>

    <!-- Highway -->
    <div class="highway-wrapper">
        <div class="highway">
            <div class="lane">
                <div class="note"></div>
                <div class="note"></div>
            </div>
            <div class="lane">
                <div class="note"></div>
                <div class="note"></div>
            </div>
            <div class="lane">
                <div class="note"></div>
                <div class="note"></div>
            </div>
            <div class="lane">
                <div class="note"></div>
                <div class="note"></div>
            </div>
        </div>
    </div>

    <!-- Hit Line -->
    <div class="hit-line-container">
        <div class="key-marker">D</div>
        <div class="key-marker">F</div>
        <div class="key-marker">J</div>
        <div class="key-marker">K</div>
    </div>

    <!-- Button -->
    <button class="start-btn">START GAME</button>

    <!-- CRT Overlay -->
    <div class="crt-overlay"></div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Keep background smooth (no pixelation on canvas)
            ctx.imageSmoothingEnabled = true; 
            createStars();
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() > 0.9 ? 2 : 1,
                    speed: Math.random() * 0.2 + 0.05
                });
            }
        }

        // Draw Synthwave Sun
        function drawSun() {
            const sunSize = Math.min(width, height) * 0.25;
            const centerX = width / 2;
            const centerY = height * 0.45; // Positioned below title, behind highway start

            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff0055';
            
            // Sun Body Gradient
            const gradient = ctx.createLinearGradient(0, centerY - sunSize, 0, centerY + sunSize);
            gradient.addColorStop(0, '#ffe600');
            gradient.addColorStop(0.4, '#ff0055');
            gradient.addColorStop(1, '#4d004d');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Sun Stripes (Blinds)
            ctx.fillStyle = '#050014'; // Match BG color exactly
            for (let i = 0; i < 12; i++) {
                const y = centerY + (i * (sunSize / 6));
                const h = 3 + i * 2; // Thicker lines at bottom
                
                // Clip to circle
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, sunSize, 0, Math.PI * 2);
                ctx.clip();
                ctx.fillRect(centerX - sunSize, y, sunSize * 2, h);
                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Sun
            drawSun();

            // Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                star.y += star.speed;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });
            ctx.globalAlpha = 1.0;
            
            requestAnimationFrame(animate);
        }

        // Button Interaction
        const btn = document.querySelector('.start-btn');
        const originalText = btn.innerText;
        
        btn.addEventListener('click', () => {
            const chars = "!@#$%^&*()<>?";
            let iterations = 0;
            
            // Flash
            btn.style.background = "#fff";
            btn.style.color = "#000";
            btn.style.boxShadow = "0 0 30px #fff";
            
            const interval = setInterval(() => {
                btn.innerText = btn.innerText.split("").map((char, i) => {
                    if (i < iterations) return originalText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");
                
                iterations += 1/2;
                if (iterations >= originalText.length) {
                    clearInterval(interval);
                    btn.innerText = "SYSTEM READY";
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = ""; 
                        btn.style.color = "";
                        btn.style.boxShadow = "";
                    }, 800);
                }
            }, 30);
        });

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
