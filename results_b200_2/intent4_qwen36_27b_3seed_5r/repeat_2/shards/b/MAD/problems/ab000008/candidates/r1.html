<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        /* 
           CORE DESIGN SYSTEM 
           Retro Synthwave / Pixel Art Identity
        */
        :root {
            --c-bg: #050011;
            --c-grid: #ff00ff;
            --c-grid-alt: #2b004f;
            --c-sun-top: #ffcc00;
            --c-sun-bot: #ff0055;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-hit: #ffffff;
            
            /* Pixel Scale */
            --px: 4px; /* 1 pixel unit */
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Fallback for pixel look */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            image-rendering: pixelated; /* Crucial for crisp pixel art */
        }

        /* --- CRT & SCANLINES (Aesthetic Refinement) --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.4) 50%,
                rgba(0,0,0,0.4)
            );
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0.7;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 60%, black 100%);
            z-index: 999;
            pointer-events: none;
        }

        /* --- BACKGROUND LAYERS --- */

        /* 1. Starfield */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }

        /* 2. The Retro Sun (Vanishing Point Anchor) */
        .sun-container {
            position: absolute;
            top: 20%; /* Positioned in top third */
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 300px;
            height: 300px;
            background: linear-gradient(to bottom, var(--c-sun-top), var(--c-sun-bot));
            border-radius: 50%;
            /* Hard pixelated mask using steps() instead of linear gradient */
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 55%, 
                transparent 55%, transparent 60%, 
                black 60%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 75%, 
                transparent 75%, transparent 80%, 
                black 80%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 95%, 
                transparent 95%, transparent 100%
            );
            mask-image: linear-gradient(to bottom, 
                black 0%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 55%, 
                transparent 55%, transparent 60%, 
                black 60%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 75%, 
                transparent 75%, transparent 80%, 
                black 80%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 95%, 
                transparent 95%, transparent 100%
            );
            /* Hard shadow, no blur */
            box-shadow: 0 0 0 2px rgba(0,0,0,0.5);
        }

        /* 3. The Grid Floor (Perspective) */
        /* Perspective matches highway vanishing point */
        .grid-container {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 45%; /* Extends up to horizon */
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 100%), /* Fade into void */
                linear-gradient(90deg, var(--c-grid-alt) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid-alt) 2px, transparent 2px);
            background-size: 60px 60px;
            /* Perspective transformation aligned with sun center */
            transform: perspective(400px) rotateX(60deg);
            transform-origin: center top; 
            z-index: 2;
            border-top: 2px solid var(--c-grid);
            animation: gridScroll 1s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- TYPOGRAPHY (Overhaul) --- */
        
        /* Hard-edged Pixel Font using SVG Data URI */
        @font-face {
            font-family: 'PixelFont';
            src: url('data:font/woff2;charset=utf-8;base64,d09GMgABAAAAAAKwAA4AAAAABWAAAAH...') format('woff2'); /* Fallback placeholder */
            /* We will use a CSS trick to render Courier as pixelated instead of relying on external fonts */
        }

        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Position in top third */
            margin-top: 5vh; 
            pointer-events: none;
        }

        h1 {
            /* Hard pixelated rendering */
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 5rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: -2px;
            
            /* Chromatic Aberration / RGB Split (No blur) */
            text-shadow: 
                3px 3px 0px var(--c-magenta),
                -3px -3px 0px var(--c-cyan);
            
            /* Hard Stepped Drop Shadow */
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.8));
        }

        h1 span {
            display: block;
            font-size: 2.5rem; /* Increased scale for legibility */
            letter-spacing: 8px;
            color: var(--c-yellow);
            text-shadow: 4px 4px 0px var(--c-magenta);
            margin-top: 10px;
            transform: skewX(-10deg); /* Stylized slant */
        }

        /* --- FUNCTIONAL ADDITION: START BUTTON --- */
        
        .start-btn {
            pointer-events: auto;
            margin-top: 40px; /* Space below title */
            
            /* Chunky Pixel Art Style */
            background: #000;
            color: var(--c-cyan);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: 2px;
            
            /* Pixelated Border Construction using box-shadow */
            border: 4px solid var(--c-cyan);
            padding: 15px 40px;
            position: relative;
            
            /* Hard shadow */
            box-shadow: 6px 6px 0px 0px var(--c-magenta);
            
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            border-color: #fff;
            /* Shift effect */
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px var(--c-magenta);
        }

        .start-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px var(--c-magenta);
        }

        /* Glitch Animation on Hover */
        .start-btn:hover::before {
            content: "START";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--c-cyan);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: glitch-flash 0.3s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        @keyframes glitch-flash {
            0% { opacity: 0; clip-path: inset(0 0 95% 0); transform: translate(-2px, 0); }
            20% { opacity: 1; clip-path: inset(20% 0 60% 0); transform: translate(2px, 0); }
            40% { opacity: 0; clip-path: inset(50% 0 10% 0); transform: translate(-2px, 0); }
            60% { opacity: 1; clip-path: inset(10% 0 80% 0); transform: translate(2px, 0); }
            80% { opacity: 0; clip-path: inset(80% 0 5% 0); transform: translate(-2px, 0); }
            100% { opacity: 0; clip-path: inset(0 0 0 0); transform: translate(0, 0); }
        }

        /* --- GAME HIGHWAY (Perspective & Rasterization) --- */
        
        .highway-wrapper {
            position: absolute;
            bottom: -5%; /* Anchored to bottom */
            z-index: 10;
            width: 100%;
            height: 60%;
            display: flex;
            justify-content: center;
            perspective: 600px; /* Deep perspective */
            pointer-events: none;
        }

        .highway {
            width: 200px;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            /* Borders match grid perspective */
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-cyan);
            box-shadow: 0 0 20px var(--c-cyan);
            position: relative;
            overflow: hidden;
            display: flex;
            
            /* THE PERSPECTIVE FIX: 
               Rotate X to match floor, translate Z to push it back to the horizon */
            transform-origin: center top;
            transform: rotateX(60deg) translateZ(-100px) translateY(-200px); 
        }

        .lane {
            flex: 1;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            /* Pixelate the lane internals */
            image-rendering: pixelated;
        }
        .lane:last-child { border-right: none; }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 10%; /* Position in perspective space */
            left: 0;
            width: 100%;
            height: 6px; /* Chunky */
            background: var(--c-hit);
            box-shadow: 0 0 10px var(--c-cyan);
            z-index: 12;
            /* Make it look like a physical block */
            transform: translateZ(1px);
        }

        /* The Falling Notes (Rasterized) */
        .note {
            position: absolute;
            width: 100%;
            height: 24px; /* Chunky height */
            /* NO Border Radius - strictly blocky */
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5); /* Inner bevel */
            opacity: 0.9;
        }

        /* Specific Note Styles */
        .n1 { background-color: var(--c-magenta); animation: fall 1.5s linear infinite; top: -30px; }
        .n2 { background-color: var(--c-cyan); animation: fall 1.5s linear infinite 0.4s; top: -30px; }
        .n3 { background-color: var(--c-green); animation: fall 1.5s linear infinite 0.8s; top: -30px; }
        .n4 { background-color: var(--c-yellow); animation: fall 1.5s linear infinite 1.2s; top: -30px; }

        @keyframes fall {
            0% { top: -30px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    
    <!-- Sun (Horizon Anchor) -->
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>

    <!-- Grid Floor -->
    <div class="grid-container"></div>
    
    <!-- Highway (Emerging from Horizon) -->
    <div class="highway-wrapper">
        <div class="highway">
            <!-- 4 Lanes -->
            <div class="lane">
                <div class="note n1"></div>
                <div class="note n1" style="animation-delay: 2.0s"></div>
                <div class="note n1" style="animation-delay: 3.5s"></div>
            </div>
            <div class="lane">
                <div class="note n2"></div>
                <div class="note n2" style="animation-delay: 1.8s"></div>
                <div class="note n2" style="animation-delay: 3.2s"></div>
            </div>
            <div class="lane">
                <div class="note n3"></div>
                <div class="note n3" style="animation-delay: 1.2s"></div>
                <div class="note n3" style="animation-delay: 2.9s"></div>
            </div>
            <div class="lane">
                <div class="note n4"></div>
                <div class="note n4" style="animation-delay: 2.5s"></div>
                <div class="note n4" style="animation-delay: 4.0s"></div>
            </div>
            <!-- Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- Content Layer (Top Third) -->
    <div class="content-layer">
        <h1>
            PIXEL<br>DANCE
            <span>RHYTHM PROTOCOL</span>
        </h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR (Pixelated) ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Disable smoothing for pixel look
            ctx.imageSmoothingEnabled = false;
            
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 200;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.6), // Keep stars above horizon
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() > 0.8 ? 3 : 1 // Occasional larger pixel
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                if(Math.random() > 0.95) ctx.globalAlpha = 0.2;
                else ctx.globalAlpha = 1.0;

                // Draw hard square pixels
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move stars (warp effect)
                star.y += star.z;
                if (star.y > height * 0.6) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Glitch text effect on click
            const originalText = btn.innerText;
            const glitchChars = "!@#$%^&*";
            
            let iterations = 0;
            const interval = setInterval(() => {
                btn.innerText = btn.innerText.split("")
                    .map((letter, index) => {
                        if(index < iterations) {
                            return originalText[index];
                        }
                        return glitchChars[Math.floor(Math.random() * glitchChars.length)]
                    })
                    .join("");
                
                if(iterations >= originalText.length){ 
                    clearInterval(interval);
                    btn.innerText = "INITIALIZING...";
                    
                    // Reset after "load"
                    setTimeout(() => {
                        btn.innerText = "START GAME";
                        alert("GAME STARTED");
                    }, 1000);
                }
                
                iterations += 1/3;
            }, 30);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
