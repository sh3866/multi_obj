<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette */
            --c-bg: #050011;
            --c-grid: #ff00ff;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-white: #ffffff;
            --c-dark: #110022;
            
            /* Scale */
            --pixel: 4px; /* Base pixel unit */
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            /* Use a system font stack that favors square, blocky geometric shapes */
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Changed to flex-start to allow vertical control */
            image-rendering: pixelated;
        }

        /* --- 5. VISUAL POLISH: CRT & SCANLINES --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            z-index: 999;
            pointer-events: none;
            /* Hard edge, no blur */
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            /* Hard-edged vignette using steps to mimic low-res rendering */
            background: radial-gradient(
                circle at center,
                transparent 40%,
                rgba(5, 0, 17, 0.4) 60%,
                rgba(5, 0, 17, 1) 90%
            );
            z-index: 998;
            pointer-events: none;
        }

        /* --- BACKGROUND: STARFIELD --- */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- BACKGROUND: RETRO SUN (Stepped Gradient) --- */
        .sun-container {
            position: absolute;
            top: 20%; /* Positioned behind title */
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 300px;
            height: 300px;
            /* Hard stepped bands */
            background: linear-gradient(to bottom, 
                var(--c-yellow) 0%, var(--c-yellow) 15%, 
                var(--c-magenta) 15%, var(--c-magenta) 30%,
                #990099 30%, #990099 45%,
                #4d004d 45%, #4d004d 60%,
                #1a001a 60%, #1a001a 100%
            );
            border-radius: 50%;
            box-shadow: 0 0 0 4px var(--c-bg), 0 0 0 8px var(--c-magenta);
            
            /* Masking for horizontal "blinds" */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 25%,
                transparent 25%, transparent 27%,
                black 27%, black 45%,
                transparent 45%, transparent 48%,
                black 48%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 25%,
                transparent 25%, transparent 27%,
                black 27%, black 45%,
                transparent 45%, transparent 48%,
                black 48%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        /* --- 1. TYPOGRAPHY & IDENTITY --- */
        .content-layer {
            position: absolute;
            top: 15%; /* 2. COMPOSITION: Upper-middle */
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Courier New', Courier, monospace; /* Fallback, styled to look pixelated */
            font-weight: 900;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 0.9;
            margin: 0;
            color: var(--c-white);
            text-transform: uppercase;
            
            /* Hard, Stepped Offset Shadow */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                8px 8px 0px var(--c-dark);
            
            /* Slight skew for synthwave attitude */
            transform: skewX(-6deg);
            letter-spacing: -2px;
            position: relative;
        }

        /* Glitch effect purely with pseudo elements */
        h1::before, h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--c-bg); /* Hide main text */
            overflow: hidden;
            opacity: 0.8;
        }

        h1::before {
            color: var(--c-cyan);
            left: 2px;
            text-shadow: -2px 0 var(--c-cyan);
            clip-path: inset(20% 0 40% 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--c-magenta);
            left: -2px;
            text-shadow: -2px 0 var(--c-magenta);
            clip-path: inset(60% 0 10% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(10% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(30% 0 20% 0); }
            100% { clip-path: inset(40% 0 30% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        .subtitle {
            display: block;
            margin-top: 10px;
            font-size: 1.2rem;
            color: var(--c-cyan);
            letter-spacing: 8px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            opacity: 0.9;
            transform: skewX(-6deg);
        }

        /* --- 3. GAMEPLAY STRUCTURE (THE HIGHWAY) --- */
        .tunnel-wrapper {
            position: absolute;
            top: 45%; /* Starts below title */
            left: 0;
            width: 100%;
            height: 55%;
            perspective: 600px;
            perspective-origin: 50% 0%;
            z-index: 5;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .highway {
            position: relative;
            width: 1000px; /* Wide base */
            height: 100%;
            background: linear-gradient(to top, var(--c-bg) 10%, transparent 100%);
            transform-origin: center top;
            transform: rotateX(65deg);
            display: flex;
            border-top: 4px solid var(--c-magenta); /* Horizon line */
            box-shadow: 0 0 20px var(--c-magenta);
        }

        /* 4 Distinct Lanes */
        .lane {
            flex: 1;
            /* High contrast dividers */
            border-right: 2px solid var(--c-cyan);
            border-left: 2px solid var(--c-cyan);
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0, 243, 255, 0.1) 100%);
            position: relative;
            overflow: hidden;
        }
        .lane:first-child { border-left: 4px solid var(--c-cyan); }
        .lane:last-child { border-right: 4px solid var(--c-cyan); }

        /* Moving Grid Lines (Floor) */
        .lane::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* Horizontal lines moving down */
            background-image: linear-gradient(to bottom, transparent 96%, var(--c-magenta) 96%, var(--c-magenta) 100%);
            background-size: 100% 80px;
            animation: gridMove 1s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 80px; }
        }

        /* Vertical Perspective Lines (optional for depth) */
        .lane::before {
            content: '';
            position: absolute;
            top: 0; left: 50%; width: 1px; height: 100%;
            background: rgba(255,255,255,0.1);
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 60%;
            left: 20%;
            height: 24px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5); /* Hard shadow */
            border: 2px solid white;
            animation: noteFall 2s linear infinite;
        }
        
        /* Staggered notes */
        .lane:nth-child(1) .note { background-color: var(--c-magenta); animation-delay: 0.2s; }
        .lane:nth-child(2) .note { background-color: var(--c-cyan); animation-delay: 0.9s; }
        .lane:nth-child(3) .note { background-color: var(--c-green); animation-delay: 0.4s; }
        .lane:nth-child(4) .note { background-color: var(--c-yellow); animation-delay: 1.1s; }

        @keyframes noteFall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- HIT LINE (Anchoring Gameplay) --- */
        .hit-line-container {
            position: absolute;
            bottom: 120px; /* Space for button */
            left: 50%;
            transform: translateX(-50%);
            width: 800px; /* Matches highway visual width roughly */
            height: 16px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 4px solid var(--c-white);
            border-bottom: 4px solid var(--c-white);
            z-index: 50;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Markers for keys */
        .key-marker {
            width: 25%;
            height: 100%;
            border-right: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            font-weight: bold;
        }
        .key-marker:last-child { border-right: none; }

        /* --- 4. CALL TO ACTION (START BUTTON) --- */
        .start-btn {
            pointer-events: auto;
            position: absolute;
            bottom: 40px; /* Bottom Center */
            background: var(--c-magenta); /* Solid high contrast fill */
            color: var(--c-white);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            
            /* Chunky Arcade Style */
            padding: 20px 60px;
            
            /* Hard Edged Border & Shadow (No Blur) */
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.4),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                0 8px 0px var(--c-dark); /* 3D depth */
            
            outline: 4px solid var(--c-white);
            transition: transform 0.1s, box-shadow 0.1s;
            z-index: 101;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: var(--c-bg);
            transform: translateY(-2px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.4),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                0 10px 0px var(--c-dark);
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.4),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                0 2px 0px var(--c-dark);
        }

        /* --- VISUAL POLISH: GLITCH ANIMATION --- */
        @keyframes flicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.85; }
            10% { opacity: 0.95; }
            100% { opacity: 0.95; }
        }
        body { animation: flicker 4s infinite; }

    </style>
</head>
<body>

    <!-- Layer 1: Starfield -->
    <canvas id="starfield"></canvas>

    <!-- Layer 2: Retro Sun -->
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>

    <!-- Layer 3: Typography (Upper Middle) -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
        <span class="subtitle">RHYTHM PROTOCOL</span>
    </div>

    <!-- Layer 4: The Highway -->
    <div class="tunnel-wrapper">
        <div class="highway">
            <!-- 4 Distinct Lanes -->
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.5s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.2s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 0.8s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.8s"></div></div>
        </div>
    </div>

    <!-- Layer 5: The Hit Line -->
    <div class="hit-line-container">
        <div class="key-marker">D</div>
        <div class="key-marker">F</div>
        <div class="key-marker">J</div>
        <div class="key-marker">K</div>
    </div>

    <!-- Layer 6: Start Button (Bottom Center) -->
    <button class="start-btn">START GAME</button>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false; // Pixelated look
            createStars();
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.6, // Keep stars mostly in sky area
                    size: Math.random() > 0.9 ? 3 : 1,
                    speed: Math.random() * 0.2 + 0.05
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                star.y += star.speed;
                if (star.y > height * 0.6) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });
            requestAnimationFrame(animate);
        }

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            const originalText = btn.innerText;
            const chars = "!@#$%^&*()<>?";
            let iterations = 0;
            
            // Flash effect
            btn.style.background = "#fff";
            btn.style.color = "#000";
            
            const interval = setInterval(() => {
                btn.innerText = btn.innerText.split("").map((char, i) => {
                    if (i < iterations) return originalText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");
                
                iterations += 1/2;
                if (iterations >= originalText.length) {
                    clearInterval(interval);
                    btn.innerText = "SYSTEM READY";
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = ""; // Reset to CSS default
                        btn.style.color = "";
                    }, 1000);
                }
            }, 30);
        });

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
