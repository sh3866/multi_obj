<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            --c-bg: #050011;
            --c-grid: #ff00ff;
            --c-grid-alt: #3d0066;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-white: #ffffff;
            
            /* Dimensions */
            --hit-line-height: 16px;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            font-family: 'Courier New', Courier, monospace; /* System font fallback */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            image-rendering: pixelated;
        }

        /* --- VISUAL POLISH: CRT & SCANLINES --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.25) 2px,
                rgba(0,0,0,0.25) 4px
            );
            z-index: 999;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* --- BACKGROUND: STARFIELD --- */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- BACKGROUND: RETRO SUN --- */
        .sun-container {
            position: absolute;
            top: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 250px;
            height: 250px;
            background: linear-gradient(to bottom, var(--c-yellow), var(--c-magenta));
            border-radius: 50%;
            /* Pixelated horizontal cutouts */
            mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 20%,
                transparent 20%, transparent 22%,
                black 22%, black 35%,
                transparent 35%, transparent 38%,
                black 38%, black 55%,
                transparent 55%, transparent 58%,
                black 58%, black 80%,
                transparent 80%, transparent 82%,
                black 82%, black 100%
            );
            -webkit-mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 20%,
                transparent 20%, transparent 22%,
                black 22%, black 35%,
                transparent 35%, transparent 38%,
                black 38%, black 55%,
                transparent 55%, transparent 58%,
                black 58%, black 80%,
                transparent 80%, transparent 82%,
                black 82%, black 100%
            );
            box-shadow: 0 0 40px var(--c-magenta);
        }

        /* --- PRIORITY 1: RECONSTRUCT HIGHWAY (TUNNEL) --- */
        /* This creates the 4-lane perspective structure */
        .tunnel-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%; /* Covers bottom 2/3 */
            perspective: 800px;
            perspective-origin: 50% 0%;
            z-index: 5;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .highway {
            position: relative;
            width: 800px; /* Wide base */
            height: 100%;
            background: linear-gradient(to top, rgba(5, 0, 17, 0.9), transparent);
            /* The 3D Rotation */
            transform-origin: center top;
            transform: rotateX(75deg);
            display: flex;
            border-top: 4px solid var(--c-magenta); /* Horizon line */
            box-shadow: 0 0 50px var(--c-magenta);
        }

        /* The 4 Distinct Lanes */
        .lane {
            flex: 1;
            border-right: 2px solid var(--c-cyan);
            border-left: 2px solid var(--c-cyan);
            background: rgba(0, 243, 255, 0.05); /* Very faint fill */
            position: relative;
            overflow: hidden;
        }
        .lane:first-child { border-left: none; }
        .lane:last-child { border-right: none; }

        /* Moving Grid Lines on the Highway Floor */
        .lane::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to bottom, transparent 95%, var(--c-magenta) 95%);
            background-size: 100% 100px;
            animation: gridMove 0.5s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 100px; }
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 20px;
            box-shadow: 0 0 10px currentColor;
            animation: noteFall 1.5s linear infinite;
        }
        
        /* Staggered notes for visual interest */
        .lane:nth-child(1) .note { background-color: var(--c-magenta); color: var(--c-magenta); animation-delay: 0.2s; }
        .lane:nth-child(2) .note { background-color: var(--c-cyan); color: var(--c-cyan); animation-delay: 0.7s; }
        .lane:nth-child(3) .note { background-color: var(--c-green); color: var(--c-green); animation-delay: 1.1s; }
        .lane:nth-child(4) .note { background-color: var(--c-yellow); color: var(--c-yellow); animation-delay: 0.4s; }

        @keyframes noteFall {
            0% { top: -20px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- PRIORITY 2: HIT LINE & BUTTON --- */
        /* The Receptor Bar */
        .hit-line-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--hit-line-height);
            background: rgba(0, 0, 0, 0.8);
            border-top: 2px solid var(--c-white);
            border-bottom: 2px solid var(--c-white);
            box-shadow: 0 0 20px var(--c-white);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Arcade Button */
        .start-btn {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.9);
            color: var(--c-cyan);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            
            /* Arcade Physical Look */
            padding: 0 40px;
            height: 80px;
            margin-top: -40px; /* Floats half-off the line */
            
            /* Pixelated Bevel using box-shadows */
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.3),
                inset -2px -2px 0px rgba(0,0,0,0.5),
                0 0 0 4px var(--c-cyan), /* Neon Outline */
                0 0 15px var(--c-cyan); /* Glow */
            
            position: relative;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.8),
                inset -2px -2px 0px rgba(0,0,0,0.2),
                0 0 0 4px #fff,
                0 0 30px var(--c-cyan);
            transform: translateY(-2px);
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 
                inset 2px 2px 0px rgba(0,0,0,0.5),
                0 0 0 4px var(--c-cyan);
        }

        /* --- PRIORITY 3 & 4: TYPOGRAPHY --- */
        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: -10vh; /* Pull up slightly to balance bottom heavy UI */
            pointer-events: none;
        }

        h1 {
            /* PRIORITY 3: Chunky, Geometric Pixel Font */
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 5rem;
            line-height: 1;
            margin: 0;
            color: var(--c-white);
            text-transform: uppercase;
            
            /* Hard Pixel Shadow (No Blur) */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                8px 8px 0px rgba(0,0,0,0.5);
            
            /* Slight skew for synthwave attitude */
            transform: skewX(-5deg);
        }

        .subtitle {
            /* PRIORITY 4: Legibility & Contrast */
            display: block;
            margin-top: 15px;
            font-size: 1.5rem;
            color: var(--c-cyan);
            letter-spacing: 6px;
            
            /* Solid shadow, no blur */
            text-shadow: 3px 3px 0px #000;
            opacity: 0.9;
        }

        /* --- VISUAL POLISH: GLITCH ANIMATION --- */
        .glitch-wrapper {
            position: relative;
        }
        
        /* Scanline flicker */
        @keyframes flicker {
            0% { opacity: 0.9; }
            5% { opacity: 0.8; }
            10% { opacity: 1; }
            100% { opacity: 1; }
        }
        body { animation: flicker 4s infinite; }

    </style>
</head>
<body>

    <!-- Layer 1: Starfield -->
    <canvas id="starfield"></canvas>

    <!-- Layer 2: Retro Sun -->
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>

    <!-- Layer 3: The Tunnel Highway -->
    <div class="tunnel-wrapper">
        <div class="highway">
            <!-- 4 Distinct Lanes -->
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.5s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.2s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 0.8s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.8s"></div></div>
        </div>
    </div>

    <!-- Layer 4: The Receptor Bar (Hit Line) -->
    <div class="hit-line-container">
        <!-- Button Anchored Here -->
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Layer 5: Typography -->
    <div class="content-layer">
        <div class="glitch-wrapper">
            <h1>PIXEL<br>DANCE</h1>
        </div>
        <span class="subtitle">RHYTHM PROTOCOL</span>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false;
            createStars();
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.5, // Keep in upper half
                    size: Math.random() > 0.9 ? 3 : 1,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                star.y += star.speed;
                if (star.y > height * 0.5) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });
            requestAnimationFrame(animate);
        }

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            const originalText = btn.innerText;
            const chars = "!@#$%^&*()<>?";
            let iterations = 0;
            
            btn.style.background = "#000";
            btn.style.color = "#0f0";
            
            const interval = setInterval(() => {
                btn.innerText = btn.innerText.split("").map((char, i) => {
                    if (i < iterations) return originalText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");
                
                iterations += 1/2;
                if (iterations >= originalText.length) {
                    clearInterval(interval);
                    btn.innerText = "SYSTEM READY";
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = ""; // Reset to CSS default
                        btn.style.color = "";
                    }, 1000);
                }
            }, 30);
        });

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
