<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --c-bg: #080014;
            --c-grid: #2b0040;
            --c-cyan: #00f0ff;
            --c-magenta: #ff0055;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-white: #ffffff;
            --c-dark: #000000;
            --c-dim: #444466;
            --pixel: 4px;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: var(--c-white);
            /* 1. TYPOGRAPHY: Using a monospace stack to simulate bitmap rendering */
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Ensure crisp edges on scaling */
            image-rendering: pixelated; 
        }

        /* 4. ATMOSPHERE: CRT Scanlines & Vignette */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 2px,
                    rgba(0,0,0,0.4) 4px,
                    rgba(0,0,0,0.4) 6px
                ),
                radial-gradient(
                    circle at center,
                    transparent 50%,
                    rgba(0,0,0,0.6) 100%
                );
            z-index: 999;
            pointer-events: none;
            mix-blend-mode: hard-light;
        }

        /* Background Canvas */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        /* --- 1. TYPOGRAPHY: TITLE --- */
        .title-container {
            position: absolute;
            top: 15%;
            z-index: 100;
            text-align: center;
            transform: translateZ(0); /* Hardware accel */
        }

        h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            line-height: 0.85;
            margin: 0;
            text-transform: uppercase;
            /* Hard, stepped offset shadow for 3D pixel feel */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                8px 8px 0px rgba(0,0,0,0.5);
            color: var(--c-white);
            /* Slight skew for synthwave attitude */
            transform: skewX(-5deg);
            letter-spacing: -2px;
            position: relative;
        }

        /* Glitch effect using pseudo-elements */
        h1::before, h1::after {
            content: "PIXEL\nDANCE";
            white-space: pre;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--c-bg);
            overflow: hidden;
        }

        h1::before {
            color: var(--c-cyan);
            left: 2px;
            text-shadow: -2px 0 var(--c-cyan);
            clip-path: inset(20% 0 60% 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--c-magenta);
            left: -2px;
            text-shadow: -2px 0 var(--c-magenta);
            clip-path: inset(60% 0 10% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .subtitle {
            display: block;
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--c-cyan);
            letter-spacing: 6px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            opacity: 0.9;
            transform: skewX(-5deg);
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translateX(-2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translateX(2px); }
            40% { clip-path: inset(10% 0 50% 0); transform: translateX(-2px); }
            100% { clip-path: inset(30% 0 20% 0); transform: translateX(0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translateX(2px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translateX(-2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translateX(2px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translateX(0); }
        }

        /* --- 3. GAMEPLAY PREVIEW: HIGHWAY --- */
        .highway-wrapper {
            position: absolute;
            top: 40%;
            left: 0;
            width: 100%;
            height: 60%;
            perspective: 800px;
            perspective-origin: 50% 0%;
            z-index: 50;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .highway {
            position: relative;
            width: 1200px;
            height: 100%;
            background: linear-gradient(to bottom, var(--c-bg) 0%, transparent 100%);
            transform-origin: center top;
            transform: rotateX(75deg);
            display: flex;
            border-top: 4px solid var(--c-magenta);
            box-shadow: 0 0 30px var(--c-magenta);
        }

        .lane {
            flex: 1;
            border-right: 2px solid rgba(0, 240, 255, 0.3);
            border-left: 2px solid rgba(0, 240, 255, 0.3);
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(139, 0, 255, 0.1) 100%);
            position: relative;
            overflow: hidden;
        }
        .lane:first-child { border-left: 4px solid var(--c-cyan); }
        .lane:last-child { border-right: 4px solid var(--c-cyan); }

        /* Moving Grid */
        .lane::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to bottom, transparent 95%, var(--c-magenta) 95%, var(--c-magenta) 100%);
            background-size: 100% 100px;
            animation: gridMove 1.5s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 100px; }
        }

        /* Notes */
        .note {
            position: absolute;
            width: 60%;
            left: 20%;
            height: 32px;
            /* 3. LEGIBILITY: Brightness, Saturation, Glow */
            box-shadow: 
                inset 0 0 10px rgba(255,255,255,0.5),
                0 0 15px currentColor; 
            border: 2px solid white;
            animation: noteFall 2s linear infinite;
        }

        /* Specific Note Colors */
        .lane:nth-child(1) .note { background-color: var(--c-magenta); color: var(--c-magenta); animation-delay: 0.2s; }
        .lane:nth-child(2) .note { background-color: var(--c-cyan); color: var(--c-cyan); animation-delay: 0.9s; }
        .lane:nth-child(3) .note { background-color: var(--c-green); color: var(--c-green); animation-delay: 0.4s; }
        .lane:nth-child(4) .note { background-color: var(--c-yellow); color: var(--c-yellow); animation-delay: 1.1s; }

        @keyframes noteFall {
            0% { top: -100px; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; transform: scale(1.2); }
        }

        /* Hit Line */
        .hit-line-container {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 4px solid var(--c-white);
            border-bottom: 4px solid var(--c-white);
            z-index: 60;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 0 20px var(--c-white);
        }

        .key-marker {
            width: 25%;
            height: 100%;
            border-right: 2px solid var(--c-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--c-white);
            font-weight: bold;
            text-shadow: 0 0 5px var(--c-white);
        }
        .key-marker:last-child { border-right: none; }

        /* --- 2. UI MATERIALITY: START BUTTON --- */
        .start-btn {
            pointer-events: auto;
            position: absolute;
            bottom: 60px;
            z-index: 100;
            
            /* Blocky, Pixel-art Rectangle */
            background: var(--c-dark);
            color: var(--c-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border: 4px solid var(--c-cyan);
            cursor: pointer;
            padding: 15px 40px;
            
            /* Hard Edged 3D Effect */
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.5),
                inset 4px 4px 0px rgba(255,255,255,0.2),
                6px 6px 0px var(--c-magenta); /* Offset shadow */
            
            transition: transform 0.1s, box-shadow 0.1s;
            animation: btnPulse 2s infinite;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: var(--c-dark);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.2),
                inset 4px 4px 0px rgba(255,255,255,0.5),
                6px 6px 0px var(--c-white);
            transform: translateY(-2px);
            animation: glitchBtn 0.3s infinite;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.5),
                inset 4px 4px 0px rgba(255,255,255,0.2),
                2px 2px 0px var(--c-magenta);
        }

        @keyframes btnPulse {
            0% { box-shadow: inset 0 0 0 rgba(0,240,255,0), 6px 6px 0px var(--c-magenta); }
            50% { box-shadow: inset 0 0 20px rgba(0,240,255,0.2), 6px 6px 0px var(--c-magenta); }
            100% { box-shadow: inset 0 0 0 rgba(0,240,255,0), 6px 6px 0px var(--c-magenta); }
        }

        @keyframes glitchBtn {
            0% { transform: translateY(-2px) skewX(0deg); }
            25% { transform: translateY(-2px) skewX(5deg); }
            50% { transform: translateY(-2px) skewX(-5deg); }
            75% { transform: translateY(-2px) skewX(2deg); }
            100% { transform: translateY(-2px) skewX(0deg); }
        }

    </style>
</head>
<body>

    <!-- Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Title -->
    <div class="title-container">
        <h1>PIXEL<br>DANCE</h1>
        <span class="subtitle">RHYTHM PROTOCOL</span>
    </div>

    <!-- Highway -->
    <div class="highway-wrapper">
        <div class="highway">
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.2s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 0.8s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 1.5s"></div></div>
            <div class="lane"><div class="note"></div><div class="note" style="animation-delay: 0.4s"></div></div>
        </div>
    </div>

    <!-- Hit Line -->
    <div class="hit-line-container">
        <div class="key-marker">D</div>
        <div class="key-marker">F</div>
        <div class="key-marker">J</div>
        <div class="key-marker">K</div>
    </div>

    <!-- Button -->
    <button class="start-btn">START GAME</button>

    <!-- CRT Overlay -->
    <div class="crt-overlay"></div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false;
            createStars();
            drawSun();
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() > 0.95 ? 3 : 1,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        // Draw Synthwave Sun
        function drawSun() {
            const sunSize = Math.min(width, height) * 0.25;
            const centerX = width / 2;
            const centerY = height * 0.4;

            // Sun Glow
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff0055';
            
            // Sun Body
            const gradient = ctx.createLinearGradient(0, centerY - sunSize, 0, centerY + sunSize);
            gradient.addColorStop(0, '#ffe600');
            gradient.addColorStop(0.5, '#ff0055');
            gradient.addColorStop(1, '#4d004d');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Sun Stripes (Blinds)
            ctx.fillStyle = '#080014'; // Match BG
            for (let i = 0; i < 10; i++) {
                const y = centerY + (i * (sunSize / 5)) - (sunSize * 0.2);
                const h = 2 + i * 1.5; // Getting thicker at bottom
                if (y > centerY) {
                    // Draw clip path for circle
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, sunSize, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.fillRect(centerX - sunSize, y, sunSize * 2, h);
                    ctx.restore();
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Redraw Sun every frame (or just once if static, but clearRect wipes it)
            // Optimizing: Draw sun once to an offscreen canvas? 
            // For simplicity in single file, just redrawing is fine for this complexity.
            drawSun();

            // Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                star.y += star.speed;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });
            ctx.globalAlpha = 1.0;
            
            requestAnimationFrame(animate);
        }

        // Button Interaction
        const btn = document.querySelector('.start-btn');
        const originalText = btn.innerText;
        
        btn.addEventListener('click', () => {
            const chars = "!@#$%^&*()<>?";
            let iterations = 0;
            
            // Flash
            btn.style.background = "#fff";
            btn.style.color = "#000";
            btn.style.boxShadow = "0 0 30px #fff";
            
            const interval = setInterval(() => {
                btn.innerText = btn.innerText.split("").map((char, i) => {
                    if (i < iterations) return originalText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");
                
                iterations += 1/2;
                if (iterations >= originalText.length) {
                    clearInterval(interval);
                    btn.innerText = "SYSTEM READY";
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = ""; 
                        btn.style.color = "";
                        btn.style.boxShadow = "";
                    }, 800);
                }
            }, 30);
        });

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
