<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Deep Void & Arcane Gold */
            --bg-deep: #050508;
            --bg-purple-deep: #120a1f;
            
            --gold-primary: #D4AF37;
            --gold-bright: #FFF4D0;
            --gold-dim: #5c4d1e;
            --gold-glow: rgba(212, 175, 55, 0.6);
            --gold-glow-intense: rgba(255, 215, 0, 0.8);
            
            --text-main: #e8e8e8;
            --text-muted: #9a9ab0;
            
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(10, 10, 15, 0.4);
            
            --card-radius: 16px;
            --card-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            /* Polished Typography: System Sans-Serif for UI, Serif for Titles */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- ATMOSPHERE & TEXTURES --- */
        
        /* Deep Purple/Blue Radial Gradient */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 40%, #1a1a3a 0%, #080810 80%);
            z-index: 0;
        }

        /* Noise Texture Overlay (SVG Data URI) */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.06;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Aligned strictly */
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            /* Serif Font for Title */
            font-family: 'Times New Roman', 'Times', serif; 
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.15em; /* Increased tracking */
            line-height: 1;
            color: transparent;
            background: linear-gradient(180deg, #fff 0%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.35em; /* Increased tracking */
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-left: 1px;
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--gold-dim);
            padding: 6px 16px;
            border-radius: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .currency-pill:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            transform: translateY(-1px);
        }

        .gold-icon {
            width: 16px; height: 16px;
            fill: var(--gold-primary);
        }

        .gold-amount {
            font-family: 'Times New Roman', serif;
            font-size: 1.1rem;
            color: var(--gold-primary);
            font-weight: bold;
            letter-spacing: 0.02em;
        }

        /* --- HERO AREA: THE SUMMONING ALTAR --- */
        .hero-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 2.5rem;
        }

        /* Ambient Glow Behind Altar */
        .altars-glow {
            position: absolute;
            width: 350px; height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            filter: blur(20px);
            animation: pulse-glow 4s ease-in-out infinite alternate;
            z-index: 0;
        }

        .summoning-circle {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .summoning-circle:hover {
            transform: scale(1.05);
        }

        /* Central Void (Deep Texture) */
        .portal-core {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, #2a2a3a, #000000),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.3'/%3E%3C/svg%3E");
            box-shadow: 
                0 0 40px rgba(0,0,0,1),
                inset 0 0 30px rgba(0,0,0,0.9),
                inset 0 0 80px rgba(20, 10, 40, 0.5);
            z-index: 2;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .summoning-circle:hover .portal-core {
             box-shadow: 
                0 0 50px rgba(212, 175, 55, 0.2),
                inset 0 0 30px rgba(0,0,0,0.9),
                inset 0 0 80px rgba(20, 10, 40, 0.5);
        }

        /* Text inside circle */
        .summon-text {
            position: absolute;
            z-index: 10;
            font-family: 'Times New Roman', serif;
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            opacity: 0.8;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .summoning-circle:hover .summon-text {
            color: var(--gold-bright);
            text-shadow: 0 0 20px var(--gold-glow-intense);
            opacity: 1;
            letter-spacing: 0.4em;
        }

        /* Rotating Arcane Rings */
        .ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-outer {
            width: 260px; height: 260px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top-color: transparent;
            border-bottom-color: transparent;
            animation: spin 20s linear infinite;
        }

        .ring-inner {
            width: 220px; height: 220px;
            border: 2px solid transparent;
            border-top: 2px solid var(--gold-primary);
            border-right: 2px solid var(--gold-primary);
            border-bottom: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 15px var(--gold-glow);
            animation: spin-reverse 12s linear infinite;
        }
        
        .summoning-circle:hover .ring-inner {
            box-shadow: 0 0 25px var(--gold-glow-intense);
            border-color: var(--gold-bright);
        }

        /* --- MAIN MENU: HORIZONTAL ROW --- */
        .menu-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            animation-delay: 0.5s;
        }

        /* --- GLASSMORPHIC CARDS --- */
        .menu-card {
            flex: 1;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border-radius: var(--card-radius);
            
            /* Glass Base */
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--card-shadow);
            
            /* Border */
            border: 1px solid var(--glass-border);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        /* Top Highlight Line */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            background: rgba(20, 20, 30, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .menu-card:hover .card-icon {
            stroke: var(--gold-bright);
            filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.4));
            transform: scale(1.1);
        }

        /* --- ICONOGRAPHY --- */
        .card-icon {
            width: 32px; height: 32px;
            stroke: var(--text-muted);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .card-label {
            font-size: 0.75rem;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .menu-card:hover .card-label {
            color: var(--gold-bright);
            opacity: 1;
        }

        /* --- CANVAS LAYER --- */
        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* --- ANIMATIONS --- */
        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to { transform: translate(-50%, -50%) rotate(0deg); }
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 750px) {
            .game-title { font-size: 1.8rem; }
            .hero-area { margin-bottom: 1.5rem; }
            .summoning-circle { transform: scale(0.85); }
            .summoning-circle:hover { transform: scale(0.9); }
            .menu-card { height: 90px; }
            .card-icon { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    <canvas id="canvas-layer"></canvas>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <div class="currency-pill">
                <!-- Coin Icon -->
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA: SUMMONING ALTAR -->
        <div class="hero-area">
            <!-- Ambient Glow -->
            <div class="altars-glow"></div>
            
            <!-- The Summoning Circle (Primary Action) -->
            <div class="summoning-circle">
                <!-- Core Void -->
                <div class="portal-core"></div>
                
                <!-- Text Overlay -->
                <div class="summon-text">SUMMON</div>
                
                <!-- Rings -->
                <div class="ring ring-outer"></div>
                <div class="ring ring-inner"></div>
            </div>
        </div>

        <!-- MAIN MENU: SECONDARY ACTIONS -->
        <nav class="menu-row">
            
            <!-- ROSTER -->
            <div class="menu-card">
                <!-- Crystal/Gem Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 9l3 10h14l3-10L12 2z"/>
                    <path d="M2 9h20"/>
                    <path d="M12 2l0 17"/>
                    <path d="M7 9l5 5 5-5"/>
                </svg>
                <div class="card-label">Roster</div>
            </div>

            <!-- BATTLE -->
            <div class="menu-card">
                <!-- Shield/Crest Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M12 8v4"/>
                    <path d="M10 10h4"/>
                </svg>
                <div class="card-label">Battle</div>
            </div>

            <!-- GRIND -->
            <div class="menu-card">
                <!-- Pickaxe Icon (Resource Gathering) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 2.5l5 5" />
                    <path d="M12 12L3 21" />
                    <path d="M17.5 7.5l-2 2" />
                    <path d="M9.5 14.5l-2 2" />
                    <!-- Handle -->
                    <path d="M12 12l-5.5 5.5" />
                    <path d="M3 21l2-2" />
                    <!-- Head -->
                    <path d="M14.5 2.5a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L17 10" />
                </svg>
                <div class="card-label">Grind</div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC PARTICLE SYSTEM
         * Renders floating embers/dust in the void
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.init();
            }
            
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15; // Very slow drift
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                
                // Gold or White color
                const isGold = Math.random() > 0.6;
                this.color = isGold ? 'rgba(212, 175, 55,' : 'rgba(200, 210, 255,';
                this.alpha = Math.random() * 0.4 + 0.1;
                this.life = Math.random() * 200 + 100;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                // Twinkle effect
                this.alpha += (Math.random() - 0.5) * 0.02;
                if(this.alpha < 0.1) this.alpha = 0.1;
                if(this.alpha > 0.6) this.alpha = 0.6;
                
                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.init();
                }
            }
            
            draw() {
                ctx.fillStyle = `${this.color}${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Subtle Parallax Effect for the Summoning Circle
        const circleContainer = document.querySelector('.summoning-circle');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            // Only apply transform if not hovering (handled by CSS)
            if(!circleContainer.matches(':hover')) {
                circleContainer.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

    </script>
</body>
</html>
