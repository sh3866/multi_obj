<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Void & Arcane Gold */
            --bg-deep: #050508;
            --bg-surface: #0e0e14;
            --gold-primary: #D4AF37;
            --gold-bright: #FFDF73;
            --gold-dim: #5c4d1e;
            --gold-glow: rgba(212, 175, 55, 0.4);
            
            --text-main: #e0e0e0;
            --text-muted: #8a8a9b;
            
            --glass-border: rgba(255, 255, 255, 0.05);
            
            --card-radius: 4px; /* Sharper, shard-like edges */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */
        
        /* Deep Indigo Radial Gradient */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #050508 70%);
            z-index: 0;
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.07;
            /* Inline SVG Noise Pattern */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            max-height: 900px; 
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-family: 'Times New Roman', 'Times', serif;
            font-size: 2.6rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1;
            color: transparent;
            background: linear-gradient(180deg, #fff 10%, var(--gold-primary) 80%);
            -webkit-background-clip: text;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.15);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold-dim);
            padding: 6px 12px;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .currency-pill:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .gold-icon {
            width: 18px; height: 18px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 2px var(--gold-primary));
        }

        .gold-amount {
            font-family: 'Times New Roman', serif;
            font-size: 1.1rem;
            color: var(--gold-primary);
            font-weight: bold;
            letter-spacing: 0.02em;
        }

        /* --- HERO AREA: THE SWIRLING VORTEX --- */
        .hero-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 2rem;
        }

        .vortex-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Floating animation */
            animation: float 6s ease-in-out infinite;
        }

        /* Core Void */
        .vortex-core {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #000 0%, #1a1a2e 40%, transparent 70%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 2;
            position: relative;
        }

        /* Swirling Rings */
        .ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Ring 1: Inner Dashed Gold */
        .ring-1 {
            width: 160px; height: 160px;
            border: 1px dashed var(--gold-primary);
            opacity: 0.8;
            box-shadow: 0 0 15px var(--gold-glow);
            animation: spin 8s linear infinite;
        }

        /* Ring 2: Outer Dashed White/Grey */
        .ring-2 {
            width: 210px; height: 210px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-top-color: transparent;
            border-bottom-color: transparent;
            animation: spin-reverse 15s linear infinite;
        }

        /* Ring 3: Pulse Effect */
        .ring-3 {
            width: 140px; height: 140px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            animation: pulse-ring 3s ease-out infinite;
        }

        /* Ambient Dust/Particles Canvas */
        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.6;
            pointer-events: none;
        }

        /* --- MAIN MENU GRID (Unified System) --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            animation-delay: 0.3s;
        }

        /* --- OBSIDIAN SHARD CARD STYLE --- */
        .menu-card {
            position: relative;
            height: 140px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            
            /* Materiality: Dark, semi-transparent, sharp */
            background: rgba(14, 14, 20, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            /* Border & Inner Glow */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15); /* Top highlight */
            box-shadow: 
                inset 0 0 20px rgba(0, 0, 0, 0.8),
                0 4px 10px rgba(0, 0, 0, 0.5);
            
            /* Shape: Slight chamfer feel */
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% calc(100% - 15px), 
                calc(100% - 15px) 100%, 
                0 100%
            );
            
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        /* Hover State: Alive Glow */
        .menu-card:hover {
            transform: translateY(-3px);
            background: rgba(20, 20, 30, 0.85);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 
                inset 0 0 15px rgba(255, 255, 255, 0.05),
                0 10px 25px rgba(0, 0, 0, 0.6);
        }

        /* Specific Hover Glows per card type */
        .menu-card.primary:hover {
            border-color: var(--gold-primary);
            box-shadow: 
                inset 0 0 20px rgba(212, 175, 55, 0.15),
                0 0 20px rgba(212, 175, 55, 0.2);
        }
        
        .menu-card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }

        /* --- PRIMARY ACTION (Summon) --- */
        .menu-card.primary {
            grid-column: span 2; /* Full Width */
            height: 100px;
            flex-direction: row;
            align-items: center;
            gap: 1.5rem;
            
            /* Subtle Gold Tint */
            background: linear-gradient(90deg, rgba(20,20,20,0.8) 0%, rgba(40,35,20,0.4) 100%);
            border: 1px solid var(--gold-dim);
        }

        .menu-card.primary .card-label {
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* --- ICONOGRAPHY --- */
        .card-icon {
            width: 32px; height: 32px;
            stroke: var(--text-main);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }

        .menu-card.primary .card-icon {
            stroke: var(--gold-primary);
            width: 36px; height: 36px;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
        }

        /* --- TYPOGRAPHY --- */
        .card-label {
            font-family: 'Times New Roman', serif;
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-main);
            letter-spacing: 0.05em;
            z-index: 2;
            text-transform: capitalize;
        }

        .card-sublabel {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.7rem;
            color: var(--text-muted);
            z-index: 2;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to { transform: translate(-50%, -50%) rotate(0deg); }
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 750px) {
            .game-title { font-size: 2rem; }
            .hero-area { flex-grow: 0.5; }
            .vortex-container { transform: scale(0.8); }
            .menu-card { height: 120px; padding: 1rem; }
            .menu-card.primary { height: 80px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    <canvas id="canvas-layer"></canvas>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <div class="currency-pill">
                <!-- Coin Icon -->
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA: SWIRLING VORTEX -->
        <div class="hero-area">
            <div class="vortex-container">
                <!-- Rings -->
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <!-- Core -->
                <div class="vortex-core"></div>
            </div>
        </div>

        <!-- MENU GRID -->
        <nav class="menu-grid">
            
            <!-- PRIMARY ACTION (Summon) - Full Width -->
            <div class="menu-card primary">
                <!-- Arcane Star Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div>
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- SECONDARY ACTION (Roster) - Crystal Icon -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Crystal/Gem Shape -->
                    <path d="M12 2L2 9l3 10h14l3-10L12 2z"/>
                    <path d="M2 9h20"/>
                    <path d="M12 2l0 17"/>
                    <path d="M7 9l5 5 5-5"/>
                </svg>
                <div>
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <!-- SECONDARY ACTION (Battle) - Crest/Shield Icon -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Heraldic Crest -->
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M12 8v4"/>
                    <path d="M10 10h4"/>
                </svg>
                <div>
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <!-- TERTIARY ACTION (Grind) - Wrench/Tools Icon -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Magical Wrench/Tools -->
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
                <div>
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

            <!-- Tertiary Action (Market) - Coin Stack Icon (Extra for balance) -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Scales/Market -->
                    <path d="M12 3v18"/>
                    <path d="M3 7h18"/>
                    <path d="M3 7l4.5 12h-9L3 7z"/>
                    <path d="M21 7l-4.5 12h9L21 7z"/>
                </svg>
                <div>
                    <div class="card-label">Market</div>
                    <div class="card-sublabel">Exchange</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC PARTICLE SYSTEM
         * Renders floating embers/dust in the void
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.init();
            }
            
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2; // Slower drift
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                
                // Randomly assign Gold or White color
                const isGold = Math.random() > 0.7;
                this.color = isGold ? 'rgba(212, 175, 55,' : 'rgba(200, 220, 255,';
                this.alpha = Math.random() * 0.4 + 0.1;
                this.life = Math.random() * 200 + 100;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                // Twinkle effect
                this.alpha += (Math.random() - 0.5) * 0.02;
                if(this.alpha < 0.1) this.alpha = 0.1;
                if(this.alpha > 0.6) this.alpha = 0.6;
                
                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.init();
                }
            }
            
            draw() {
                ctx.fillStyle = `${this.color}${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Subtle Parallax Effect for the Vortex
        const vortexContainer = document.querySelector('.vortex-container');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            vortexContainer.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
