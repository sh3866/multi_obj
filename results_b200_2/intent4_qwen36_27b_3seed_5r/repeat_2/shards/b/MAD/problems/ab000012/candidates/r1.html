<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Deep Space & Mystical Gold */
            --bg-deep: #030305;
            --bg-surface: #0a0a10;
            --gold-primary: #FFD700;
            --gold-dim: #8a6e2f;
            --gold-glow: rgba(255, 215, 0, 0.4);
            
            --orb-core: #00f2fe;
            --orb-mid: #4facfe;
            --orb-deep: #302b63;
            --orb-dark: #0f0c29;

            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(10, 10, 15, 0.65);
            
            --card-radius: 16px;
            --anim-speed: 0.4s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */
        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 85%);
            z-index: 1;
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            /* Ensure content fits vertically */
            max-height: 900px; 
        }

        /* --- HEADER & CURRENCY --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            animation: fadeIn 1s ease-out;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            line-height: 1;
            color: transparent;
            background: linear-gradient(180deg, #fff 20%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold-dim);
            padding: 6px 14px;
            border-radius: 100px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .currency-pill:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .gold-icon {
            width: 16px; height: 16px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 2px var(--gold-primary));
        }

        .gold-amount {
            font-family: 'Times New Roman', serif;
            font-size: 1rem;
            color: var(--gold-primary);
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        /* --- HERO AREA: THE SPIRIT CORE --- */
        .hero-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
        }

        .spirit-core-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 6s ease-in-out infinite;
        }

        /* The Volumetric Orb */
        .spirit-core {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            /* Deep volumetric gradient */
            background: radial-gradient(
                circle at 35% 35%, 
                rgba(255,255,255,0.9) 0%, 
                var(--orb-core) 15%, 
                var(--orb-mid) 40%, 
                var(--orb-deep) 75%, 
                var(--orb-dark) 100%
            );
            box-shadow: 
                0 0 40px rgba(79, 172, 254, 0.3),
                inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        /* The Mystical Rings */
        .ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(79, 172, 254, 0.3);
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.1);
            pointer-events: none;
        }

        .ring-1 {
            width: 200px; height: 200px;
            border-top-color: transparent;
            border-bottom-color: transparent;
            animation: spin 12s linear infinite;
        }

        .ring-2 {
            width: 240px; height: 240px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            animation: spin-reverse 20s linear infinite;
        }

        /* Ambient Glow behind orb */
        .glow-behind {
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.15) 0%, transparent 70%);
            z-index: 1;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        /* --- MAIN MENU GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            animation-delay: 0.2s;
        }

        /* Unified Card Style */
        .menu-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 130px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Inner highlight on hover */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .menu-card:hover::before { opacity: 1; }

        /* Icons */
        .card-icon {
            width: 36px; height: 36px;
            stroke: var(--text-main);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.5rem;
            transition: transform 0.3s;
        }

        .menu-card:hover .card-icon {
            transform: scale(1.1);
        }

        /* Typography in Cards */
        .card-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.02em;
            z-index: 2;
        }

        .card-sublabel {
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 2;
            margin-top: 4px;
        }

        /* --- PRIMARY ACTION (Summon) --- */
        .menu-card.primary {
            grid-column: span 2;
            height: 100px;
            flex-direction: row;
            align-items: center;
            gap: 1.2rem;
            /* Rich gradient for hero action */
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(10, 10, 15, 0.8) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }

        .menu-card.primary:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.25) 0%, rgba(10, 10, 15, 0.9) 100%);
        }

        .menu-card.primary .card-icon {
            stroke: var(--gold-primary);
            width: 40px; height: 40px;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }

        .menu-card.primary .card-label {
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* --- SECONDARY ACTIONS (Roster, Battle) --- */
        /* Standardized styling applied via base .menu-card class */

        /* --- TERTIARY ACTION (Grind) --- */
        .menu-card.tertiary {
            grid-column: span 2;
            height: 80px;
            flex-direction: row;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.02);
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to { transform: translate(-50%, -50%) rotate(0deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE TWEAKS --- */
        @media (max-height: 750px) {
            .game-title { font-size: 2rem; }
            .hero-area { flex-grow: 0.5; }
            .spirit-core-container { transform: scale(0.8); }
            .menu-card { height: 110px; padding: 1rem; }
            .menu-card.primary { height: 90px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="canvas-layer"></canvas>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA: SPIRIT CORE -->
        <div class="hero-area">
            <div class="glow-behind"></div>
            <div class="spirit-core-container">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="spirit-core"></div>
            </div>
        </div>

        <!-- MENU GRID -->
        <nav class="menu-grid">
            
            <!-- PRIMARY ACTION (Summon) - Full Width -->
            <div class="menu-card primary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div>
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- SECONDARY ACTIONS (Roster & Battle) - Side by Side -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <div>
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                <div>
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <!-- TERTIARY ACTION (Grind) - Full Width Bottom -->
            <div class="menu-card tertiary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                </svg>
                <div>
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Creates floating embers/particles
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.init();
            }
            
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.4 + 0.1;
                this.life = Math.random() * 100;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.init();
                }
            }
            
            draw() {
                ctx.fillStyle = `rgba(200, 220, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Parallax Effect for the Spirit Core
        const coreContainer = document.querySelector('.spirit-core-container');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 80;
            const y = (window.innerHeight - e.pageY * 2) / 80;
            
            coreContainer.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
