<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Deep Void & Arcane Gold */
            --bg-deep: #050508;
            --bg-purple-deep: #120a1f;
            
            --gold-primary: #D4AF37;
            --gold-bright: #FCEabb;
            --gold-dim: #5c4d1e;
            --gold-glow: rgba(212, 175, 55, 0.5);
            
            --text-main: #e8e8e8;
            --text-muted: #9a9ab0;
            
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(12, 12, 20, 0.6);
            
            --card-radius: 16px;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            /* Polished Typography: System Sans-Serif */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- ATMOSPHERE & TEXTURES --- */
        
        /* Deep Purple/Blue Radial Gradient */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 40%, #1a1a3a 0%, #080810 80%);
            z-index: 0;
        }

        /* Noise Texture Overlay (SVG Data URI) */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.05;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            animation: fadeInDown 1s ease-out;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            /* Serif Font for Title */
            font-family: 'Times New Roman', 'Times', serif; 
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1;
            color: transparent;
            background: linear-gradient(180deg, #fff 0%, var(--gold-primary) 80%);
            -webkit-background-clip: text;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold-dim);
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .currency-pill:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transform: translateY(-1px);
        }

        .gold-icon {
            width: 18px; height: 18px;
            fill: var(--gold-primary);
        }

        .gold-amount {
            font-family: 'Times New Roman', serif;
            font-size: 1.1rem;
            color: var(--gold-primary);
            font-weight: bold;
            letter-spacing: 0.02em;
        }

        /* --- HERO AREA: THE SUMMONING CIRCLE --- */
        .hero-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 180px; /* Reduced to allow more space for grid */
            margin-bottom: 1rem;
        }

        .summoning-circle {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Central Portal Core */
        .portal-core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 20%, #1a1a3a 60%, transparent 70%);
            box-shadow: 
                0 0 30px rgba(0,0,0,0.8),
                0 0 60px rgba(30, 20, 60, 0.6),
                inset 0 0 20px rgba(0,0,0,0.9);
            z-index: 2;
            position: relative;
            /* Breathing Animation */
            animation: breathe 4s ease-in-out infinite;
        }

        /* Ethereal Portal Glow */
        .portal-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 50, 200, 0.2) 0%, transparent 70%);
            z-index: 1;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        /* Rotating Arcane Rings */
        .ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-outer {
            width: 220px; height: 220px;
            border: 1px dashed var(--gold-dim);
            opacity: 0.6;
            /* Slow Rotation */
            animation: spin 25s linear infinite;
        }

        .ring-inner {
            width: 160px; height: 160px;
            border: 2px solid transparent;
            border-top: 2px solid var(--gold-primary);
            border-right: 2px solid var(--gold-primary);
            opacity: 0.8;
            box-shadow: 0 0 15px var(--gold-glow);
            /* Reverse Rotation */
            animation: spin-reverse 15s linear infinite;
        }

        .ring-accent {
            width: 120px; height: 120px;
            border: 1px solid rgba(100, 100, 255, 0.3);
            animation: pulse-ring 3s ease-out infinite;
        }

        /* --- MAIN MENU: 2x2 GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            animation-delay: 0.4s;
        }

        /* --- UNIFIED CARD AESTHETIC (Glassmorphism) --- */
        .menu-card {
            position: relative;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            border-radius: var(--card-radius);
            
            /* Glass Base */
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--card-shadow);
            
            /* Gold Gradient Border (Mask technique) */
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Subtle Gold Border Gradient */
        .menu-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(212, 175, 55, 0.05) 40%, rgba(212, 175, 55, 0.05) 60%, rgba(212, 175, 55, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Faint Inner Glow */
        .menu-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.05);
            pointer-events: none;
            transition: box-shadow 0.4s ease;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            background: rgba(20, 20, 30, 0.7);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .menu-card:hover .card-icon {
            stroke: var(--gold-bright);
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        /* --- HIERARCHY: SUMMON CARD --- */
        .menu-card.primary {
            /* Stronger, Pulsating Gold Glow */
            box-shadow: 
                var(--card-shadow),
                0 0 25px rgba(212, 175, 55, 0.15);
            animation: breathe-glow 4s ease-in-out infinite;
        }

        .menu-card.primary::before {
            /* Brighter Border Intensity */
            background: linear-gradient(135deg, var(--gold-primary), rgba(212, 175, 55, 0.5) 40%, rgba(212, 175, 55, 0.5) 60%, var(--gold-primary));
        }

        .menu-card.primary::after {
            box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.15);
        }

        .menu-card.primary:hover {
            box-shadow: 
                var(--card-shadow),
                0 0 40px rgba(212, 175, 55, 0.3);
        }

        /* --- ICONOGRAPHY --- */
        .card-icon {
            width: 36px; height: 36px;
            stroke: var(--text-main);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .menu-card.primary .card-icon {
            stroke: var(--gold-primary);
            stroke-width: 1.8; /* Slightly thicker for emphasis */
        }

        .card-label {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500; /* Medium Weight */
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .menu-card.primary .card-label {
            color: var(--gold-bright);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* --- CANVAS LAYER --- */
        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* --- ANIMATIONS --- */
        @keyframes breathe {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.02); }
        }

        @keyframes breathe-glow {
            0%, 100% { box-shadow: var(--card-shadow), 0 0 25px rgba(212, 175, 55, 0.15); }
            50% { box-shadow: var(--card-shadow), 0 0 35px rgba(212, 175, 55, 0.25); }
        }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to { transform: translate(-50%, -50%) rotate(0deg); }
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; border-width: 2px; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; border-width: 0px; }
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 750px) {
            .game-title { font-size: 2rem; }
            .hero-area { min-height: 140px; margin-bottom: 0.5rem; }
            .summoning-circle { transform: scale(0.8); }
            .menu-card { height: 100px; }
            .card-icon { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    <canvas id="canvas-layer"></canvas>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <div class="currency-pill">
                <!-- Coin Icon -->
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA: SUMMONING CIRCLE -->
        <div class="hero-area">
            <div class="summoning-circle">
                <!-- Portal Glow -->
                <div class="portal-glow"></div>
                <!-- Core -->
                <div class="portal-core"></div>
                <!-- Rings -->
                <div class="ring ring-outer"></div>
                <div class="ring ring-inner"></div>
                <div class="ring ring-accent"></div>
            </div>
        </div>

        <!-- MAIN MENU: 2x2 GRID -->
        <nav class="menu-grid">
            
            <!-- SUMMON (Primary Action) -->
            <div class="menu-card primary">
                <!-- Arcane Star Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="card-label">Summon</div>
            </div>

            <!-- ROSTER -->
            <div class="menu-card">
                <!-- Crystal/Gem Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 9l3 10h14l3-10L12 2z"/>
                    <path d="M2 9h20"/>
                    <path d="M12 2l0 17"/>
                    <path d="M7 9l5 5 5-5"/>
                </svg>
                <div class="card-label">Roster</div>
            </div>

            <!-- BATTLE -->
            <div class="menu-card">
                <!-- Shield/Crest Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M12 8v4"/>
                    <path d="M10 10h4"/>
                </svg>
                <div class="card-label">Battle</div>
            </div>

            <!-- GRIND -->
            <div class="menu-card">
                <!-- Hammer/Anvil Icon (Thematic replacement for Wrench) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M18 2l-1.44 1.45"/>
                    <path d="M14.09 6.31a2 2 0 0 0-2.83 0l-1.25 1.25a2 2 0 0 0 0 2.83l6 6a2 2 0 0 0 2.83 0l1.25-1.25a2 2 0 0 0 0-2.83l-6-6z"/>
                    <path d="M17 16l-1.45 1.45"/>
                    <path d="M20 19l-3-3"/>
                    <path d="M4 20h6"/>
                    <path d="M7 17v3"/>
                </svg>
                <div class="card-label">Grind</div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC PARTICLE SYSTEM
         * Renders floating embers/dust in the void
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.init();
            }
            
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15; // Very slow drift
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                
                // Gold or White color
                const isGold = Math.random() > 0.6;
                this.color = isGold ? 'rgba(212, 175, 55,' : 'rgba(200, 210, 255,';
                this.alpha = Math.random() * 0.4 + 0.1;
                this.life = Math.random() * 200 + 100;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                // Twinkle effect
                this.alpha += (Math.random() - 0.5) * 0.02;
                if(this.alpha < 0.1) this.alpha = 0.1;
                if(this.alpha > 0.6) this.alpha = 0.6;
                
                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.init();
                }
            }
            
            draw() {
                ctx.fillStyle = `${this.color}${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Subtle Parallax Effect for the Summoning Circle
        const circleContainer = document.querySelector('.summoning-circle');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 120;
            const y = (window.innerHeight - e.pageY * 2) / 120;
            
            circleContainer.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
