<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project: ORBIS // Cellular Mesh</title>
<style>
    :root {
        --bg-color: #050508;
        --panel-bg: rgba(10, 12, 18, 0.65);
        --panel-border: rgba(0, 240, 255, 0.3);
        --accent-cyan: #00f0ff;
        --accent-magenta: #ff00aa;
        --text-primary: #ffffff;
        --text-secondary: #8a93a5;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
        --gap: 8px;
    }

    * {
        box-sizing: border-box;
        outline: none;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Background subtle grid */
    body::after {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 60%),
            linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        pointer-events: none;
        z-index: 0;
    }

    /* --- LEFT PANEL (HUD) --- */
    #hud-panel {
        width: 280px;
        height: 100%;
        padding: 32px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* Ground the panel */
        z-index: 10;
        
        /* Glassmorphism */
        background: var(--panel-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid var(--panel-border);
        box-shadow: 5px 0 30px rgba(0,0,0,0.3);
    }

    /* Header */
    .hud-header {
        margin-bottom: auto; /* Pushes other content down, but we align bottom. 
                                Actually, let's keep header at top, stats below it. */
        margin-bottom: 24px;
    }

    .system-label {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: var(--gap);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .system-label::before {
        content: "";
        width: 8px;
        height: 8px;
        background-color: var(--accent-cyan);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-cyan);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { opacity: 1; box-shadow: 0 0 5px var(--accent-cyan); }
        50% { opacity: 0.5; box-shadow: 0 0 15px var(--accent-cyan); }
        100% { opacity: 1; box-shadow: 0 0 5px var(--accent-cyan); }
    }

    /* Stats - Big Data */
    .hud-stats {
        margin-bottom: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 24px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .stat-label {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .stat-value {
        font-family: var(--font-mono);
        font-size: 32px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    /* Controls */
    .hud-controls {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .control-header {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
    }

    .control-val {
        color: var(--accent-cyan);
        font-family: var(--font-mono);
    }

    /* Custom Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--accent-cyan);
        box-shadow: 0 0 10px var(--accent-cyan);
        margin-top: -6px; /* Center on track */
        transition: transform 0.1s;
    }

    input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1.2);
        background: var(--accent-cyan);
    }

    /* Buttons */
    .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
    }

    .action-row-ghost {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
    }

    button {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 12px 16px;
        border: 1px solid var(--text-secondary);
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 2px;
    }

    /* Primary Action Buttons */
    .btn-primary {
        background: rgba(0, 240, 255, 0.1);
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
    }

    .btn-primary:hover {
        background: var(--accent-cyan);
        color: #000;
        box-shadow: 0 0 15px var(--accent-cyan);
    }

    /* Secondary Ghost Button (Halt) */
    .btn-ghost {
        border-color: rgba(255,255,255,0.2);
        color: var(--text-secondary);
        width: 100%;
    }

    .btn-ghost:hover {
        border-color: var(--accent-magenta);
        color: var(--accent-magenta);
        background: rgba(255, 0, 170, 0.05);
    }

    /* --- MAIN CANVAS AREA --- */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        z-index: 1;
    }

    canvas {
        display: block;
        cursor: grab;
    }
    canvas:active {
        cursor: grabbing;
    }

    /* Scanlines overlay */
    .scanlines {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 50%,
            rgba(0,0,0,0.05) 50%,
            rgba(0,0,0,0.05)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 20;
        opacity: 0.6;
    }

    @media (max-width: 800px) {
        body { flex-direction: column-reverse; }
        #hud-panel {
            width: 100%;
            height: auto;
            padding: 24px;
            flex-direction: row;
            flex-wrap: wrap;
            border-right: none;
            border-top: 1px solid var(--panel-border);
            align-items: center;
        }
        .hud-header { display: none; } /* Hide header on mobile to save space */
        .hud-stats { margin-bottom: 0; padding-bottom: 0; border: none; flex-direction: row; gap: 24px;}
        .hud-controls { width: 100%; }
        .action-row { grid-template-columns: 1fr 1fr 1fr; }
        .action-row-ghost { margin-top: 0; }
    }
</style>
</head>
<body>

    <!-- Overlay Effects -->
    <div class="scanlines"></div>

    <!-- Left Control Panel -->
    <div id="hud-panel">
        <div class="hud-header">
            <div class="system-label">System: ORBIS</div>
        </div>

        <div class="hud-stats">
            <div class="stat-row">
                <span class="stat-label">Population</span>
                <span class="stat-value" id="stat-pop">0000</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Generation</span>
                <span class="stat-value" id="stat-gen">0000</span>
            </div>
        </div>

        <div class="hud-controls">
            <div class="control-group">
                <div class="control-header">
                    <span>Sim Speed</span>
                    <span class="control-val" id="val-speed">50%</span>
                </div>
                <input type="range" id="in-speed" min="1" max="100" value="50">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Entropy</span>
                    <span class="control-val" id="val-dens">50%</span>
                </div>
                <input type="range" id="in-dens" min="10" max="90" value="50">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Rotation</span>
                    <span class="control-val" id="val-rot">AUTO</span>
                </div>
                <input type="range" id="in-rot" min="0" max="100" value="20">
            </div>

            <div class="action-row">
                <button id="btn-reset" class="btn-primary">Re-Seed</button>
                <button id="btn-step" class="btn-primary">Step +1</button>
            </div>
            
            <div class="action-row-ghost">
                <button id="btn-pause" class="btn-ghost">HALT</button>
            </div>
        </div>
    </div>

    <!-- Main Visualization Area -->
    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // High Resolution Cellular Mesh
    // Increased density for the "Digital Organism" texture
    const RINGS = 50; 
    const SEGMENTS = 140; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // State
    let width, height, cx, cy, radius;
    let grid = new Int8Array(TOTAL_CELLS);
    let nextGrid = new Int8Array(TOTAL_CELLS);
    
    // Simulation Data
    let generation = 0;
    let population = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visuals
    let rotationSpeed = 0.002;
    let simSpeed = 50;
    let cellDensity = 0.5;
    let rotY = 0;
    let rotX = 0.3;
    
    // Interaction
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * INITIALIZATION
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        const container = document.getElementById('canvas-container');
        width = container.clientWidth;
        height = container.clientHeight;
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        cx = width / 2;
        cy = height / 2;
        // Responsive radius
        radius = Math.min(width, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * MATH & GEOMETRY
     */
    
    // Pre-calculate base positions to save CPU during render loop
    const basePositions = [];
    for (let r = 0; r < RINGS; r++) {
        for (let s = 0; s < SEGMENTS; s++) {
            const phi = (r / RINGS) * Math.PI;
            const theta = (s / SEGMENTS) * 2 * Math.PI;
            basePositions.push({
                x: Math.sin(phi) * Math.cos(theta),
                y: Math.cos(phi), 
                z: Math.sin(phi) * Math.sin(theta)
            });
        }
    }

    function rotatePoint(x, y, z, ry, rx) {
        // Rotate Y
        const cosY = Math.cos(ry);
        const sinY = Math.sin(ry);
        let x1 = x * cosY - z * sinY;
        let z1 = x * sinY + z * cosY;
        
        // Rotate X
        const cosX = Math.cos(rx);
        const sinX = Math.sin(rx);
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    /**
     * LOGIC
     */
    function getNeighbors(r, s) {
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        population = 0;
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
                if (nextGrid[idx]) population++;
            }
        }
        
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
        updateStats();
    }

    /**
     * RENDERING
     */
    function draw() {
        // Clear Background
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);
        
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        
        // Pre-calculate positions and sort
        // We only render front-facing cells to save performance and create depth
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const base = basePositions[i];
            const rotated = rotatePoint(base.x, base.y, base.z, rotY, rotX);
            
            // Simple projection
            // Only render if facing camera (z > 0)
            if (rotated.z > 0.05) {
                const fov = 2.5; 
                const scale = radius * (fov / (fov + rotated.z)); // Perspective projection
                // Actually, let's do a simple orthographic-ish scale for the sphere look, 
                // but use Z for color/brightness
                
                cells.push({
                    x: cx + rotated.x * radius,
                    y: cy - rotated.y * radius,
                    z: rotated.z,
                    alive: grid[i]
                });
            }
        }
        
        // Sort by depth (Painter's Algorithm)
        cells.sort((a, b) => a.z - b.z);
        
        // Render Cells
        // Optimization: Batch drawing by color to reduce state changes?
        // For this density, direct draw calls are okay in modern browsers.
        
        for (let cell of cells) {
            if (cell.alive) {
                // Color Palette Logic
                // Back (z~0.05): Deep Indigo/Purple
                // Mid (z~0.5): Hot Pink / Magenta
                // Front (z~1.0): Electric Cyan / White
                
                const normZ = (cell.z - 0.05) / 0.95;
                
                let hue, sat, light;
                
                if (normZ < 0.4) {
                    // Purple to Pink
                    hue = 280 + (normZ * 125); 
                    sat = 80;
                    light = 40 + (normZ * 30);
                } else {
                    // Pink to Cyan
                    hue = 330 - ((normZ - 0.4) * 300); 
                    sat = 100;
                    light = 50 + (normZ * 30);
                }

                // Size calculation
                // Cells further back are smaller due to perspective on a sphere?
                // Actually on a sphere, we just need a fixed pixel size for the "mesh" look,
                // but slightly scaling by Z helps the 3D illusion.
                const size = 2.5 * (0.6 + normZ * 0.4); 
                
                // Draw the Cell
                ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, 1)`;
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
                
                // "Hot Core" logic for very front cells to make them pop
                if (cell.z > 0.85) {
                    ctx.fillStyle = `hsla(${hue}, 100%, 95%, 0.8)`;
                    ctx.fillRect(cell.x - size/4, cell.y - size/4, size/2, size/2);
                }
            }
        }
        
        // Atmospheric Glow (Rim Light)
        const gradient = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.2);
        gradient.addColorStop(0, 'rgba(0, 240, 255, 0)');
        gradient.addColorStop(0.8, 'rgba(0, 240, 255, 0.08)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Technical Ring Overlay
        ctx.save();
        ctx.translate(cx, cy);
        
        // Outer faint ring
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.05, 0, Math.PI * 2);
        ctx.stroke();
        
        // Rotating dashed ring
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.1, rotY, rotY + Math.PI * 1.5);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.restore();
    }

    function loop() {
        if (!isPaused) {
            // Speed Logic
            const threshold = Math.max(1, 101 - simSpeed);
            let stepsToRun = 0;
            if (threshold <= 10) stepsToRun = 5;
            else if (threshold <= 30) stepsToRun = 2;
            else stepsToRun = 1;

            if (frameCount % Math.max(1, Math.floor(threshold / 10)) === 0) {
                for(let k=0; k<stepsToRun; k++) step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & CONTROLS
     */
    function setupControls() {
        const speedSlider = document.getElementById('in-speed');
        const speedVal = document.getElementById('val-speed');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densSlider = document.getElementById('in-dens');
        const densVal = document.getElementById('val-dens');
        densSlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('in-rot');
        const rotVal = document.getElementById('val-rot');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'MANUAL';
            } else {
                rotationSpeed = val * 0.0001;
                rotVal.innerText = 'AUTO';
            }
        });

        document.getElementById('btn-reset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btn-step').addEventListener('click', () => {
            isPaused = true;
            updatePauseBtn();
            step();
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseBtn();
        });
    }
    
    function updatePauseBtn() {
        const btn = document.getElementById('btn-pause');
        if (isPaused) {
            btn.innerText = 'RESUME';
            // Visual feedback handled by CSS hover/active mostly
        } else {
            btn.innerText = 'HALT';
        }
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        document.getElementById('stat-pop').innerText = population.toString().padStart(4, '0');
        document.getElementById('stat-gen').innerText = generation.toString().padStart(4, '0');
    }

    // Boot
    init();

</script>
</body>
</html>
