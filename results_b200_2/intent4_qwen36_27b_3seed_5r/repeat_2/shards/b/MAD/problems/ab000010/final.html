<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM: ORBIS // Nebula</title>
<style>
    :root {
        --bg-color: #050508;
        --panel-bg: rgba(12, 12, 18, 0.75);
        --panel-border: rgba(255, 255, 255, 0.08);
        --accent-cyan: #00f0ff;
        --accent-magenta: #ff00aa;
        --accent-gold: #ffcc00;
        --text-primary: #ffffff;
        --text-secondary: #5c6270;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
    }

    * {
        box-sizing: border-box;
        outline: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* --- LEFT PANEL (HUD) --- */
    #hud-panel {
        width: 340px;
        height: 100%;
        padding: 40px 36px;
        display: flex;
        flex-direction: column;
        z-index: 10;
        background: var(--panel-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-right: 1px solid var(--panel-border);
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Header - Strong Hierarchy */
    .hud-header {
        margin-bottom: 48px;
    }

    .system-label {
        font-family: var(--font-ui);
        font-size: 24px;
        font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 12px;
        text-transform: uppercase;
    }

    .system-sublabel {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--accent-cyan);
        letter-spacing: 0.1em;
        margin-top: 6px;
        opacity: 0.9;
    }

    .system-indicator {
        width: 8px;
        height: 8px;
        background-color: var(--accent-cyan);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-cyan);
        animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.4; box-shadow: 0 0 5px var(--accent-cyan); }
        50% { opacity: 1; box-shadow: 0 0 15px var(--accent-cyan); }
    }

    /* Stats - Secondary Data */
    .hud-stats {
        margin-bottom: 48px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--panel-border);
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .stat-label {
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .stat-value {
        font-family: var(--font-mono);
        font-size: 18px; /* Reduced from 28px */
        font-weight: 400;
        color: var(--text-primary);
        opacity: 0.7; /* Reduced opacity */
    }

    /* Controls - The 'Control Deck' */
    .control-deck {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 28px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .control-header {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-secondary);
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .control-val {
        color: var(--accent-cyan);
        font-family: var(--font-mono);
    }

    /* Custom Slider - Colored Thumbs */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--accent-magenta); /* Tied to palette */
        margin-top: -6px;
        box-shadow: 0 0 10px rgba(255, 0, 170, 0.4);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    input[type=range]:hover::-webkit-slider-thumb {
        transform: scale(1.15);
        box-shadow: 0 0 15px rgba(255, 0, 170, 0.6);
    }

    /* Buttons */
    .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
    }

    button {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 14px 0;
        width: 100%;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 4px;
    }

    button:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        background: rgba(0, 240, 255, 0.05);
    }

    .btn-primary:hover {
        background: rgba(0, 240, 255, 0.15);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .btn-ghost {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        width: 100%;
        margin-top: 16px;
    }

    .btn-ghost:hover {
        color: var(--accent-magenta);
        background: rgba(255, 0, 170, 0.05);
    }

    /* --- MAIN CANVAS AREA --- */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        z-index: 1;
        /* Deep space background */
        background: radial-gradient(circle at 50% 50%, #0a0b12 0%, #000000 100%);
    }

    canvas {
        display: block;
        cursor: grab;
    }
    canvas:active {
        cursor: grabbing;
    }

    /* Vignette */
    .vignette {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 20;
    }

    @media (max-width: 800px) {
        body { flex-direction: column-reverse; }
        #hud-panel {
            width: 100%;
            height: auto;
            max-height: 45vh;
            padding: 24px;
            border-right: none;
            border-top: 1px solid var(--panel-border);
            overflow-y: auto;
        }
        .hud-header { margin-bottom: 24px; }
        .hud-stats { margin-bottom: 24px; padding-bottom: 16px; }
    }
</style>
</head>
<body>

    <!-- Overlay Effects -->
    <div class="vignette"></div>

    <!-- Left Control Panel -->
    <div id="hud-panel">
        <div class="hud-header">
            <div class="system-label">
                <div class="system-indicator"></div>
                SYSTEM: ORBIS
            </div>
            <div class="system-sublabel">LIVING NEBULA ENGINE</div>
        </div>

        <div class="hud-stats">
            <div class="stat-row">
                <span class="stat-label">Population</span>
                <span class="stat-value" id="stat-pop">0000</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Generation</span>
                <span class="stat-value" id="stat-gen">0000</span>
            </div>
        </div>

        <div class="control-deck">
            <div class="control-group">
                <div class="control-header">
                    <span>Sim Speed</span>
                    <span class="control-val" id="val-speed">50%</span>
                </div>
                <input type="range" id="in-speed" min="1" max="100" value="50">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Entropy</span>
                    <span class="control-val" id="val-dens">50%</span>
                </div>
                <input type="range" id="in-dens" min="10" max="90" value="50">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span>Rotation</span>
                    <span class="control-val" id="val-rot">AUTO</span>
                </div>
                <input type="range" id="in-rot" min="0" max="100" value="20">
            </div>

            <div class="action-row">
                <button id="btn-reset" class="btn-primary">Re-Seed</button>
                <button id="btn-step" class="btn-primary">Step +1</button>
            </div>
            
            <button id="btn-pause" class="btn-ghost">HALT SYSTEM</button>
        </div>
    </div>

    <!-- Main Visualization Area -->
    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // HIGH DENSITY MESH
    const RINGS = 60; 
    const SEGMENTS = 160; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // State
    let width, height, cx, cy, radius;
    let grid = new Int8Array(TOTAL_CELLS);
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let cellAge = new Int8Array(TOTAL_CELLS); // 0 to 255
    
    // Simulation Data
    let generation = 0;
    let population = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visuals
    let rotationSpeed = 0.0015;
    let simSpeed = 50;
    let cellDensity = 0.5;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * INITIALIZATION
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        const container = document.getElementById('canvas-container');
        width = container.clientWidth;
        height = container.clientHeight;
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        cx = width / 2;
        cy = height / 2;
        radius = Math.min(width, height) * 0.32;
    }

    function randomizeGrid() {
        generation = 0;
        population = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const active = Math.random() < cellDensity;
            grid[i] = active ? 1 : 0;
            cellAge[i] = active ? Math.floor(Math.random() * 50) : 0; // Randomize initial ages for "lived-in" look
            if(active) population++;
        }
        updateStats();
    }

    /**
     * MATH & GEOMETRY
     */
    const basePositions = [];
    for (let r = 0; r < RINGS; r++) {
        for (let s = 0; s < SEGMENTS; s++) {
            const phi = (r / RINGS) * Math.PI;
            const theta = (s / SEGMENTS) * 2 * Math.PI;
            basePositions.push({
                x: Math.sin(phi) * Math.cos(theta),
                y: Math.cos(phi), 
                z: Math.sin(phi) * Math.sin(theta)
            });
        }
    }

    function rotatePoint(x, y, z, ry, rx) {
        const cosY = Math.cos(ry);
        const sinY = Math.sin(ry);
        let x1 = x * cosY - z * sinY;
        let z1 = x * sinY + z * cosY;
        
        const cosX = Math.cos(rx);
        const sinX = Math.sin(rx);
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    /**
     * LOGIC
     */
    function getNeighbors(r, s) {
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        population = 0;
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                let nextState = 0;
                
                if (state === 1) {
                    nextState = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextState = (neighbors === 3) ? 1 : 0;
                }
                
                nextGrid[idx] = nextState;
                if (nextState) population++;
                
                if (nextState === 1) {
                    // Age Logic: Newborns reset to 0, survivors age up
                    cellAge[idx] = (state === 1) ? Math.min(cellAge[idx] + 1, 255) : 0;
                }
            }
        }
        
        let tempGrid = grid;
        grid = nextGrid;
        nextGrid = tempGrid;
        
        generation++;
        updateStats();
    }

    /**
     * RENDERING
     */
    function draw() {
        // Clear
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);
        
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        
        // Project & Filter
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const base = basePositions[i];
            const rotated = rotatePoint(base.x, base.y, base.z, rotY, rotX);
            
            // Optimization: Only render front-facing cells (z > 0.1)
            if (rotated.z > 0.1) {
                cells.push({
                    x: cx + rotated.x * radius,
                    y: cy - rotated.y * radius,
                    z: rotated.z,
                    alive: grid[i],
                    age: cellAge[i]
                });
            }
        }
        
        // Sort by depth (Painter's Algorithm)
        cells.sort((a, b) => a.z - b.z);
        
        // Render
        ctx.globalCompositeOperation = 'lighter';
        
        for (let cell of cells) {
            if (cell.alive) {
                // HSL Color Mapping based on Age
                // 0 (Newborn) -> Cyan (180)
                // 20 (Adult) -> Magenta (300)
                // 50+ (Old) -> Gold/Deep Blue (45 or 260)
                
                let hue;
                const age = cell.age;
                
                if (age < 10) {
                    // Cyan to Blue
                    hue = 180 + (age * 5); 
                } else if (age < 40) {
                    // Blue to Magenta
                    hue = 180 + 50 + ((age - 10) * 3);
                } else {
                    // Magenta to Deep Purple/Goldish
                    hue = 300 + ((age - 40) * 1.5); 
                }
                
                // Lighting & Size Attenuation (3D Form)
                // Cells at center (z ~ 1) are big/bright. Cells at edge (z ~ 0.1) are small/dim.
                const depthFactor = cell.z; // 0.1 to 1.0
                
                const size = 1.5 + (depthFactor * 2.5); // Size attenuation
                const alpha = 0.1 + (depthFactor * 0.8); // Opacity attenuation
                const lightness = 30 + (depthFactor * 40); // Brightness attenuation
                
                ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
                ctx.fillRect(cell.x, cell.y, size, size);
            }
        }
        
        ctx.globalCompositeOperation = 'source-over';
        
        // Atmospheric Glow (Reacts to population)
        const popFactor = Math.min(population / 2000, 1);
        const pulse = Math.sin(Date.now() * 0.001) * 0.05;
        const glowRadius = radius * (1.2 + (popFactor * 0.2));
        
        const gradient = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, glowRadius);
        // Mix Cyan and Magenta for the glow
        gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
        gradient.addColorStop(0.6, `rgba(0, 240, 255, ${0.02 + (popFactor * 0.05) + pulse})`);
        gradient.addColorStop(1, 'rgba(255, 0, 170, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        if (!isPaused) {
            const threshold = Math.max(1, 101 - simSpeed);
            
            if (simSpeed > 80) {
                step(); step(); step();
            } else if (simSpeed > 50) {
                step(); step();
            } else {
                if (frameCount % Math.max(1, Math.floor(60 - (simSpeed * 0.5))) === 0) {
                    step();
                }
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & CONTROLS
     */
    function setupControls() {
        const speedSlider = document.getElementById('in-speed');
        const speedVal = document.getElementById('val-speed');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densSlider = document.getElementById('in-dens');
        const densVal = document.getElementById('val-dens');
        densSlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('in-rot');
        const rotVal = document.getElementById('val-rot');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'MANUAL';
            } else {
                rotationSpeed = val * 0.0001;
                rotVal.innerText = 'AUTO';
            }
        });

        document.getElementById('btn-reset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btn-step').addEventListener('click', () => {
            isPaused = true;
            updatePauseBtn();
            step();
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseBtn();
        });
    }
    
    function updatePauseBtn() {
        const btn = document.getElementById('btn-pause');
        if (isPaused) {
            btn.innerText = 'RESUME SYSTEM';
            btn.style.color = 'var(--accent-cyan)';
        } else {
            btn.innerText = 'HALT SYSTEM';
            btn.style.color = 'var(--text-secondary)';
        }
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        document.getElementById('stat-pop').innerText = population.toString().padStart(4, '0');
        document.getElementById('stat-gen').innerText = generation.toString().padStart(4, '0');
    }

    // Boot
    init();

</script>
</body>
</html>
