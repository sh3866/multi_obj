<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere of Life</title>
<style>
    :root {
        --bg-color: #050508;
        --panel-bg: #0e0e12;
        --text-primary: #e0e0e0;
        --text-secondary: #888899;
        --accent: #00ffcc;
        --accent-dim: rgba(0, 255, 204, 0.1);
        --border: #2a2a35;
        --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Layout */
    #app {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        cursor: grab;
    }

    canvas:active {
        cursor: grabbing;
    }

    /* Control Panel */
    #controls {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        width: 280px;
        background: rgba(14, 14, 18, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        z-index: 10;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        gap: 20px;
        transition: opacity 0.3s ease;
    }

    h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin: 0 0 5px 0;
        color: #fff;
        text-transform: uppercase;
    }

    .subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 10px;
        line-height: 1.4;
    }

    /* UI Components */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-secondary);
    }

    .value-display {
        color: var(--accent);
        font-family: 'Courier New', monospace;
    }

    /* Sliders */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 0 10px var(--accent);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: var(--border);
        border-radius: 2px;
    }

    /* Buttons */
    .btn-row {
        display: flex;
        gap: 10px;
    }

    button {
        flex: 1;
        padding: 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.03);
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    button:hover {
        background: rgba(255,255,255,0.08);
        border-color: var(--text-secondary);
    }

    button.primary {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--accent);
    }

    button.primary:hover {
        background: rgba(0, 255, 204, 0.2);
        box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
    }

    /* Stats */
    .stats {
        margin-top: 10px;
        padding-top: 15px;
        border-top: 1px solid var(--border);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
    }

    .stat-label {
        font-size: 10px;
        color: var(--text-secondary);
        text-transform: uppercase;
    }

    .stat-val {
        font-size: 14px;
        font-family: 'Courier New', monospace;
        color: #fff;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        #controls {
            right: 0;
            bottom: 0;
            top: auto;
            transform: none;
            width: 100%;
            border-radius: 16px 16px 0 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
        }
    }
</style>
</head>
<body>

<div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
        <div>
            <h1>Cellular Sphere</h1>
            <div class="subtitle">Conway's Game of Life on a 3D manifold.</div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Simulation Speed</span>
                <span class="value-display" id="speedVal">50%</span>
            </div>
            <input type="range" id="speed" min="1" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Cell Density</span>
                <span class="value-display" id="densityVal">50%</span>
            </div>
            <input type="range" id="density" min="10" max="90" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Rotation</span>
                <span class="value-display" id="rotVal">Auto</span>
            </div>
            <input type="range" id="rotation" min="0" max="100" value="20">
        </div>

        <div class="btn-row">
            <button id="btnReset">Randomize</button>
            <button id="btnStep">Step</button>
            <button id="btnPause" class="primary">Pause</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Population</span>
                <span class="stat-val" id="popCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Generation</span>
                <span class="stat-val" id="genCount">0</span>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * Configuration & State
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
    
    // Simulation State
    let width, height;
    let cx, cy;
    let radius;
    
    // Sphere Grid Parameters
    const RINGS = 30; // Latitude lines
    const SEGMENTS = 60; // Longitude lines
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Game State
    let grid = new Int8Array(TOTAL_CELLS); // 0 or 1
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visual Parameters
    let rotationSpeed = 0.002;
    let simSpeed = 50; // 1-100
    let cellDensity = 0.5;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction State
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        cx = width / 2;
        cy = height / 2;
        // Sphere size relative to screen, but constrained
        radius = Math.min(width, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    
    // Map grid index to 3D coordinates on sphere surface
    function getCellCoords(index) {
        const ring = index % RINGS;
        const segment = Math.floor(index / RINGS);
        
        // Phi goes from 0 to PI (top to bottom)
        const phi = (ring / RINGS) * Math.PI;
        // Theta goes from 0 to 2PI (around)
        const theta = (segment / SEGMENTS) * 2 * Math.PI;
        
        return {
            x: Math.sin(phi) * Math.cos(theta),
            y: Math.cos(phi), // Inverted for standard math, handled in render
            z: Math.sin(phi) * Math.sin(theta)
        };
    }

    function rotatePoint(x, y, z, rotY, rotX) {
        // Rotate Y
        let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
        let z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
        
        // Rotate X
        let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
        let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
        
        return { x: x1, y: y2, z: z2 };
    }

    function project(x, y, z) {
        // Simple perspective projection
        const fov = 4.0;
        const zOffset = fov + z; 
        const scale = radius * (fov / zOffset);
        
        return {
            x: cx + x * scale,
            y: cy - y * scale, // Flip Y for canvas
            scale: scale,
            depth: z
        };
    }

    /**
     * Game Logic (Conway's on Sphere)
     */
    function getNeighbors(r, s) {
        // r: ring index (0..RINGS-1)
        // s: segment index (0..SEGMENTS-1)
        
        let count = 0;
        
        // Check 8 neighbors (wrapping around sphere topology)
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                
                // Handle poles specifically to prevent topology glitches if desired,
                // but modulo works well for a "donut" logic on sphere grid.
                // For a true sphere, neighbors at poles are tricky, but for visual art,
                // toroidal wrapping is sufficient and robust.
                
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        // Optimization: Calculate neighbors for all cells
        // Note: grid index = r * SEGMENTS + s
        
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    // Under/Overpopulation
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    // Reproduction
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        
        // Swap buffers
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering
     */
    function draw() {
        // Clear with dark background
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);
        
        // Update Rotation if not dragging
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        // Calculate positions for all cells
        const cells = [];
        
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const r = i % RINGS;
            const s = Math.floor(i / RINGS);
            
            const pos3D = getCellCoords(i);
            const rotated = rotatePoint(pos3D.x, pos3D.y, pos3D.z, rotY, rotX);
            const projected = project(rotated.x, rotated.y, rotated.z);
            
            // Only draw if facing somewhat towards camera (z > -0.2)
            // This creates the "sphere" volume feel and hides back cells
            if (rotated.z > -0.3) {
                cells.push({
                    x: projected.x,
                    y: projected.y,
                    z: rotated.z, // Depth for sorting
                    scale: projected.scale,
                    alive: grid[i]
                });
            }
        }
        
        // Sort by depth (painters algorithm) - draw back cells first
        cells.sort((a, b) => a.z - b.z);
        
        // Draw cells
        for (let cell of cells) {
            if (cell.alive) {
                // Dynamic color based on depth and position
                // Map depth (-1 to 1) to hue
                // Front is bright cyan/blue, back is purple/dark
                
                // Color Palette: 
                // Front (z ~ 1): Cyan (180)
                // Middle (z ~ 0): Purple (280)
                // Back (z ~ -1): Deep Blue/Black (240)
                
                let hue = 200 + (cell.z * 40); 
                let lightness = 40 + (cell.z * 30); // Brighter in front
                let alpha = 0.3 + (cell.z * 0.7);
                
                // Add a bit of noise/movement to color based on coordinates
                hue += (cell.x * 30) + (cell.y * 20);
                
                ctx.fillStyle = `hsla(${hue}, 80%, ${lightness}%, ${alpha})`;
                
                // Draw circle
                const size = 1.5 * (cell.scale / 4.0); // Base size adjusted for projection
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, Math.max(0.5, size), 0, Math.PI * 2);
                ctx.fill();
                
                // Optional: Glow effect for front-most cells
                if (cell.z > 0.8) {
                    ctx.fillStyle = `hsla(${hue}, 90%, 80%, 0.5)`;
                    ctx.beginPath();
                    ctx.arc(cell.x, cell.y, size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Draw subtle outline for the sphere volume to ground it
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.95, 0, Math.PI * 2);
        ctx.stroke();
    }

    function loop() {
        // Simulation Step Logic
        if (!isPaused) {
            // Throttle simulation speed
            // Map 1-100 slider to frames per step
            // 1 = step every 10 frames, 100 = step every frame
            const threshold = Math.max(1, 101 - simSpeed);
            if (frameCount % Math.floor(threshold / 10) === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.0001;
                rotVal.innerText = 'Auto';
            }
        });

        document.getElementById('btnReset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            document.getElementById('btnPause').innerText = 'Play';
            document.getElementById('btnPause').classList.add('primary');
        });

        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? 'Play' : 'Pause';
            if(isPaused) pauseBtn.classList.remove('primary');
            else pauseBtn.classList.add('primary');
        });
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                // Clamp X rotation to prevent flipping upside down completely
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop;
        document.getElementById('genCount').innerText = generation;
    }

    // Start
    init();

</script>
</body>
</html>
