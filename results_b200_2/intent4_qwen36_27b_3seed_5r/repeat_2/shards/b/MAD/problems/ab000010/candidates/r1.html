<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere of Life</title>
<style>
    :root {
        --bg-color: #050508;
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.6);
        --accent: #ffffff;
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    #app {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        cursor: grab;
    }

    canvas:active {
        cursor: grabbing;
    }

    /* Control Panel - Glassmorphism */
    #controls {
        position: absolute;
        bottom: 40px;
        right: 40px;
        width: 240px;
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 24px;
        z-index: 10;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        gap: 20px;
        transition: transform 0.2s ease;
    }

    /* Typography */
    h1 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.15em;
        margin: 0;
        color: var(--text-primary);
        text-transform: uppercase;
    }

    .subtitle {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 4px;
        line-height: 1.4;
        font-weight: 400;
    }

    /* UI Components */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
    }

    .value-display {
        color: var(--text-primary);
        font-family: 'Courier New', monospace;
        font-weight: 400;
    }

    /* Sliders - Standardized */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin: 0;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        margin-top: -5px; /* Center on track */
        box-shadow: 0 0 10px rgba(255,255,255,0.3);
        transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: rgba(255,255,255,0.2);
        border-radius: 1px;
    }
    
    input[type=range]:focus {
        outline: none;
    }

    /* Buttons */
    .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 5px;
    }

    button {
        flex: 1;
        padding: 8px 0;
        border: 1px solid var(--glass-border);
        background: transparent;
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: var(--font-stack);
    }

    button:hover {
        background: rgba(255,255,255,0.1);
        color: var(--text-primary);
        border-color: rgba(255,255,255,0.3);
    }

    /* Ghost Style for Pause */
    button.ghost {
        border: none;
        background: transparent;
        color: var(--text-primary);
        opacity: 0.8;
    }
    
    button.ghost:hover {
        background: rgba(255,255,255,0.05);
        opacity: 1;
    }

    /* Stats */
    .stats {
        margin-top: 5px;
        padding-top: 15px;
        border-top: 1px solid var(--glass-border);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .stat-label {
        font-size: 9px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .stat-val {
        font-size: 13px;
        font-family: 'Courier New', monospace;
        color: var(--text-primary);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        #controls {
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 16px 16px 0 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
            padding-bottom: 30px;
        }
    }
</style>
</head>
<body>

<div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
        <div>
            <h1>Sphere of Life</h1>
            <div class="subtitle">Conway's Game of Life on a 3D manifold.</div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Simulation Speed</span>
                <span class="value-display" id="speedVal">50%</span>
            </div>
            <input type="range" id="speed" min="1" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Cell Density</span>
                <span class="value-display" id="densityVal">50%</span>
            </div>
            <input type="range" id="density" min="10" max="90" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Rotation</span>
                <span class="value-display" id="rotVal">Auto</span>
            </div>
            <input type="range" id="rotation" min="0" max="100" value="20">
        </div>

        <div class="btn-row">
            <button id="btnReset">Random</button>
            <button id="btnStep">Step</button>
            <button id="btnPause" class="ghost">Pause</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Population</span>
                <span class="stat-val" id="popCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Generation</span>
                <span class="stat-val" id="genCount">0</span>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * Configuration & State
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // Simulation State
    let width, height;
    let cx, cy;
    let radius;
    
    // Sphere Grid Parameters (High Density)
    const RINGS = 45; 
    const SEGMENTS = 90; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Game State
    let grid = new Int8Array(TOTAL_CELLS); 
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visual Parameters
    let rotationSpeed = 0.002;
    let simSpeed = 50; 
    let cellDensity = 0.5;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction State
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        cx = width / 2;
        cy = height / 2;
        // Sphere size constrained by screen, slightly larger for impact
        radius = Math.min(width, height) * 0.38;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    
    function getCellCoords(index) {
        const ring = index % RINGS;
        const segment = Math.floor(index / RINGS);
        
        // Phi: 0 to PI (top to bottom)
        const phi = (ring / RINGS) * Math.PI;
        // Theta: 0 to 2PI
        const theta = (segment / SEGMENTS) * 2 * Math.PI;
        
        return {
            x: Math.sin(phi) * Math.cos(theta),
            y: Math.cos(phi), 
            z: Math.sin(phi) * Math.sin(theta)
        };
    }

    function rotatePoint(x, y, z, ry, rx) {
        // Rotate Y
        const cosY = Math.cos(ry);
        const sinY = Math.sin(ry);
        let x1 = x * cosY - z * sinY;
        let z1 = x * sinY + z * cosY;
        
        // Rotate X
        const cosX = Math.cos(rx);
        const sinX = Math.sin(rx);
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    function project(x, y, z) {
        const fov = 3.5; // Slightly tighter FOV for a more spherical look
        const zOffset = fov + z; 
        const scale = radius * (fov / zOffset);
        
        return {
            x: cx + x * scale,
            y: cy - y * scale,
            scale: scale,
            depth: z
        };
    }

    /**
     * Game Logic (Conway's on Sphere)
     */
    function getNeighbors(r, s) {
        let count = 0;
        
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        
        // Swap buffers
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering
     */
    function draw() {
        // Clear background
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);
        
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        
        // Pre-calculate cell positions
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const r = i % RINGS;
            const s = Math.floor(i / RINGS);
            
            const pos3D = getCellCoords(i);
            const rotated = rotatePoint(pos3D.x, pos3D.y, pos3D.z, rotY, rotX);
            const projected = project(rotated.x, rotated.y, rotated.z);
            
            // Optimization: Only render front-facing cells
            if (rotated.z > 0.1) {
                cells.push({
                    x: projected.x,
                    y: projected.y,
                    z: rotated.z,
                    scale: projected.scale,
                    alive: grid[i]
                });
            }
        }
        
        // Sort by depth (Painter's algorithm)
        cells.sort((a, b) => a.z - b.z);
        
        // Render Cells
        for (let cell of cells) {
            if (cell.alive) {
                // Palette:
                // Back (z~0.1): Deep Purple/Magenta
                // Mid (z~0.5): Electric Blue
                // Front (z~1.0): Neon Cyan
                
                // Normalize z roughly 0 to 1 for this visible range
                const normZ = (cell.z - 0.1) / 0.9;
                
                // Hue shift: 280 (Purple) -> 190 (Cyan)
                const hue = 280 - (normZ * 90); 
                
                // Lightness: Darker in back, bright in front
                const lightness = 30 + (normZ * 40); 
                
                // Alpha: Fade slightly at edges
                const alpha = 0.6 + (normZ * 0.4);
                
                // Base Cell (Small Square/Dot)
                const size = 1.2 * (cell.scale / 3.5);
                
                ctx.fillStyle = `hsla(${hue}, 90%, ${lightness}%, ${alpha})`;
                
                // Draw small squares for "grid" feel, or circles for "tech" feel
                // Using fillRect for sharp geometric look
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
                
                // Add "Glow" to front-most cells
                if (cell.z > 0.85) {
                    ctx.fillStyle = `hsla(${hue}, 100%, 90%, 0.6)`;
                    ctx.fillRect(cell.x - size/4, cell.y - size/4, size/2, size/2);
                }
            }
        }
        
        // Subtle sphere outline
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.98, 0, Math.PI * 2);
        ctx.stroke();
        
        // Subtle inner rim light
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.96, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.03)';
        ctx.stroke();
    }

    function loop() {
        if (!isPaused) {
            const threshold = Math.max(1, 101 - simSpeed);
            if (frameCount % Math.floor(threshold / 10) === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.0001;
                rotVal.innerText = 'Auto';
            }
        });

        document.getElementById('btnReset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            updatePauseBtn();
        });

        document.getElementById('btnPause').addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseBtn();
        });
    }
    
    function updatePauseBtn() {
        const btn = document.getElementById('btnPause');
        btn.innerText = isPaused ? 'Play' : 'Pause';
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop;
        document.getElementById('genCount').innerText = generation;
    }

    // Start
    init();

</script>
</body>
</html>
