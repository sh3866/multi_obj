<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project: ORBIS // Life Simulation</title>
<style>
    :root {
        --bg-color: #020204;
        --hud-bg: rgba(10, 12, 16, 0.65);
        --hud-border: rgba(255, 255, 255, 0.15);
        --hud-accent: #00f0ff; /* Cyan */
        --hud-alert: #ff0055; /* Pink */
        --hud-text: #a0aab5;
        --hud-text-bright: #ffffff;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--hud-text);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        -webkit-font-smoothing: antialiased;
    }

    /* Background Grid Pattern */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
    }

    #canvas-container {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: grab;
    }

    canvas:active {
        cursor: grabbing;
    }

    /* HUD Interface */
    #hud-panel {
        position: absolute;
        top: 24px;
        left: 24px;
        width: 280px;
        background: var(--hud-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--hud-border);
        border-left: 3px solid var(--hud-accent); /* Accent Line */
        padding: 0;
        z-index: 10;
        font-family: var(--font-mono);
        font-size: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        opacity: 0;
        transform: translateY(-10px);
        animation: hudEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes hudEntry {
        to { opacity: 1; transform: translateY(0); }
    }

    /* HUD Header */
    .hud-header {
        padding: 16px;
        border-bottom: 1px solid var(--hud-border);
        background: rgba(255,255,255,0.02);
    }

    .hud-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--hud-accent);
        text-transform: uppercase;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .hud-title::before {
        content: "";
        display: block;
        width: 6px;
        height: 6px;
        background-color: var(--hud-accent);
        box-shadow: 0 0 8px var(--hud-accent);
    }

    .hud-subtitle {
        font-size: 10px;
        color: var(--hud-text);
        opacity: 0.7;
    }

    /* HUD Stats Grid */
    .hud-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--hud-border);
    }

    .stat-box {
        padding: 12px 16px;
        border-right: 1px solid var(--hud-border);
    }
    .stat-box:last-child { border-right: none; }

    .stat-label {
        font-size: 9px;
        text-transform: uppercase;
        color: var(--hud-text);
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 18px;
        font-weight: 400;
        color: var(--hud-text-bright);
        font-family: var(--font-mono);
    }

    /* Controls Section */
    .hud-controls {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .control-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .control-label {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        text-transform: uppercase;
        color: var(--hud-text);
    }

    .control-val {
        color: var(--hud-accent);
    }

    /* Custom Range Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.15);
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 4px; /* Thin technical look */
        background: var(--hud-accent);
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 8px var(--hud-accent);
        transition: height 0.1s;
    }
    
    input[type=range]:hover::-webkit-slider-thumb {
        height: 16px;
    }

    /* Action Buttons */
    .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
    }

    button {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--hud-border);
        color: var(--hud-text);
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        padding: 8px 0;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
    }

    button:hover {
        background: rgba(255,255,255,0.1);
        color: var(--hud-text-bright);
        border-color: var(--hud-text);
    }

    button:active {
        transform: translateY(1px);
    }

    /* Specific Button Styles */
    #btn-pause {
        border-color: var(--hud-accent);
        color: var(--hud-accent);
    }
    #btn-pause.paused {
        border-color: var(--hud-alert);
        color: var(--hud-alert);
        box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
    }

    /* Scanline overlay for CRT effect */
    .scanlines {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 50%,
            rgba(0,0,0,0.1) 50%,
            rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 20;
        opacity: 0.3;
    }

    @media (max-width: 600px) {
        #hud-panel {
            top: auto;
            bottom: 0;
            left: 0;
            width: 100%;
            border-left: 1px solid var(--hud-border);
            border-top: 3px solid var(--hud-accent);
            border-radius: 0;
        }
        .hud-stats {
            grid-template-columns: 1fr 1fr;
        }
    }
</style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
        
        <!-- HUD Control Panel -->
        <div id="hud-panel">
            <div class="hud-header">
                <div class="hud-title">System: ORBIS</div>
                <div class="hud-subtitle">Genetic Algorithm // Sphere Manifold</div>
            </div>

            <div class="hud-stats">
                <div class="stat-box">
                    <div class="stat-label">Population</div>
                    <div class="stat-value" id="stat-pop">0000</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Generation</div>
                    <div class="stat-value" id="stat-gen">0000</div>
                </div>
            </div>

            <div class="hud-controls">
                <div class="control-row">
                    <div class="control-label">
                        <span>Sim Speed</span>
                        <span class="control-val" id="val-speed">50%</span>
                    </div>
                    <input type="range" id="in-speed" min="1" max="100" value="50">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>Entropy (Density)</span>
                        <span class="control-val" id="val-dens">50%</span>
                    </div>
                    <input type="range" id="in-dens" min="10" max="90" value="50">
                </div>

                <div class="control-row">
                    <div class="control-label">
                        <span>Rotation Velocity</span>
                        <span class="control-val" id="val-rot">AUTO</span>
                    </div>
                    <input type="range" id="in-rot" min="0" max="100" value="20">
                </div>

                <div class="action-grid">
                    <button id="btn-reset">Re-Seeding</button>
                    <button id="btn-step">Step +1</button>
                    <button id="btn-pause">HALT</button>
                </div>
            </div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // High Resolution Grid (45 rings x 120 segments)
    // Increased density for "Digital Organism" texture
    const RINGS = 45; 
    const SEGMENTS = 120; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // State
    let width, height, cx, cy, radius;
    let grid = new Int8Array(TOTAL_CELLS);
    let nextGrid = new Int8Array(TOTAL_CELLS);
    
    // Simulation Data
    let generation = 0;
    let population = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visuals
    let rotationSpeed = 0.002;
    let simSpeed = 50;
    let cellDensity = 0.5;
    let rotY = 0;
    let rotX = 0.3;
    
    // Interaction
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * INITIALIZATION
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        // Handle High DPI for crisp text/UI, but keep canvas logic simple
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        // CSS size
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        cx = width / 2;
        cy = height / 2;
        radius = Math.min(width, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * MATH & GEOMETRY
     */
    
    function getCellCoords(index) {
        const ring = index % RINGS;
        const segment = Math.floor(index / RINGS);
        
        const phi = (ring / RINGS) * Math.PI;
        const theta = (segment / SEGMENTS) * 2 * Math.PI;
        
        return {
            x: Math.sin(phi) * Math.cos(theta),
            y: Math.cos(phi), 
            z: Math.sin(phi) * Math.sin(theta)
        };
    }

    function rotatePoint(x, y, z, ry, rx) {
        // Rotate Y
        const cosY = Math.cos(ry);
        const sinY = Math.sin(ry);
        let x1 = x * cosY - z * sinY;
        let z1 = x * sinY + z * cosY;
        
        // Rotate X
        const cosX = Math.cos(rx);
        const sinX = Math.sin(rx);
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    function project(x, y, z) {
        const fov = 3.0; 
        const zOffset = fov + z; 
        const scale = radius * (fov / zOffset);
        
        return {
            x: cx + x * scale,
            y: cy - y * scale,
            scale: scale,
            depth: z
        };
    }

    /**
     * LOGIC
     */
    function getNeighbors(r, s) {
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        population = 0;
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
                if (nextGrid[idx]) population++;
            }
        }
        
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
        updateStats();
    }

    /**
     * RENDERING
     */
    function draw() {
        // Clear
        ctx.fillStyle = '#020204';
        ctx.fillRect(0, 0, width, height);
        
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        
        // Pre-calculate positions
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const r = i % RINGS;
            const s = Math.floor(i / RINGS);
            
            const pos3D = getCellCoords(i);
            const rotated = rotatePoint(pos3D.x, pos3D.y, pos3D.z, rotY, rotX);
            const projected = project(rotated.x, rotated.y, rotated.z);
            
            // Only render front facing
            if (rotated.z > 0.05) {
                cells.push({
                    x: projected.x,
                    y: projected.y,
                    z: rotated.z,
                    scale: projected.scale,
                    alive: grid[i]
                });
            }
        }
        
        // Sort by depth
        cells.sort((a, b) => a.z - b.z);
        
        // Render Cells
        for (let cell of cells) {
            if (cell.alive) {
                // Palette: High Contrast Neon
                // Back (z~0.05): Deep Indigo/Purple
                // Mid (z~0.5): Hot Pink / Magenta
                // Front (z~1.0): Electric Cyan / White
                
                const normZ = (cell.z - 0.05) / 0.95;
                
                // Hue: 280 (Purple) -> 330 (Pink) -> 190 (Cyan)
                // We'll do a split logic for more distinct colors
                let hue, sat, light;
                
                if (normZ < 0.4) {
                    // Purple to Pink
                    hue = 280 + (normZ * 125); 
                    sat = 80;
                    light = 40 + (normZ * 30);
                } else {
                    // Pink to Cyan
                    hue = 330 - ((normZ - 0.4) * 300); 
                    sat = 100;
                    light = 50 + (normZ * 30);
                }

                // Intensity based on Z (closer = brighter)
                const alpha = 0.5 + (normZ * 0.5);
                
                const size = 1.5 * (cell.scale / 3.0);
                
                ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                
                // Draw sharp squares
                ctx.fillRect(cell.x - size/2, cell.y - size/2, size, size);
                
                // "Hot Core" logic for very front cells
                if (cell.z > 0.85) {
                    ctx.fillStyle = `hsla(${hue}, 100%, 95%, 0.8)`;
                    ctx.fillRect(cell.x - size/4, cell.y - size/4, size/2, size/2);
                }
            }
        }
        
        // Atmospheric Glow (Rim Light)
        // Draw a radial gradient behind the sphere to create a halo
        const gradient = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.2);
        gradient.addColorStop(0, 'rgba(0, 240, 255, 0)');
        gradient.addColorStop(0.8, 'rgba(0, 240, 255, 0.05)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Technical Ring Overlay
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, 1); // Keep it circular
        
        // Outer faint ring
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.05, 0, Math.PI * 2);
        ctx.stroke();
        
        // Rotating dashed ring
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
        ctx.setLineDash([4, 8]);
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.15, rotY, rotY + Math.PI * 1.5);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.restore();
    }

    function loop() {
        if (!isPaused) {
            // Speed Logic
            const threshold = Math.max(1, 101 - simSpeed);
            // Run multiple steps per frame if speed is high
            let stepsToRun = 0;
            if (threshold <= 10) stepsToRun = 5;
            else if (threshold <= 30) stepsToRun = 2;
            else stepsToRun = 1;

            if (frameCount % Math.max(1, Math.floor(threshold / 10)) === 0) {
                for(let k=0; k<stepsToRun; k++) step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & CONTROLS
     */
    function setupControls() {
        const speedSlider = document.getElementById('in-speed');
        const speedVal = document.getElementById('val-speed');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densSlider = document.getElementById('in-dens');
        const densVal = document.getElementById('val-dens');
        densSlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('in-rot');
        const rotVal = document.getElementById('val-rot');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'MANUAL';
            } else {
                rotationSpeed = val * 0.0001;
                rotVal.innerText = 'AUTO';
            }
        });

        document.getElementById('btn-reset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btn-step').addEventListener('click', () => {
            isPaused = true;
            updatePauseBtn();
            step();
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseBtn();
        });
    }
    
    function updatePauseBtn() {
        const btn = document.getElementById('btn-pause');
        if (isPaused) {
            btn.innerText = 'RESUME';
            btn.classList.add('paused');
        } else {
            btn.innerText = 'HALT';
            btn.classList.remove('paused');
        }
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        document.getElementById('stat-pop').innerText = population.toString().padStart(4, '0');
        document.getElementById('stat-gen').innerText = generation.toString().padStart(4, '0');
    }

    // Boot
    init();

</script>
</body>
</html>
