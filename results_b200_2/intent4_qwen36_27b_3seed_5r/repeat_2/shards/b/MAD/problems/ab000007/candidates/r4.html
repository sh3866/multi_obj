<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Drone Interface</title>
<style>
  :root {
    /* Palette: Deep Nebula & High-Contrast Tech */
    --bg-deep: #030308;
    --bg-nebula: #0f172a;
    --glass-surface: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.2);
    
    --neon-cyan: #06b6d4;
    --neon-gold: #f59e0b;
    --neon-purple: #a855f7;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    
    /* Typography: System sans-serif for speed and cleanliness */
    --font-stack: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    cursor: none; /* Custom cursor used */
  }

  /* --- Layout --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }

  /* --- Atmosphere --- */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 120%, rgba(6, 182, 212, 0.15) 0%, transparent 50%), /* Cyan Glow */
      radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 40%), /* Purple Glow */
      radial-gradient(circle at 50% 50%, rgba(20, 20, 35, 0.8) 0%, var(--bg-deep) 90%); /* Vignette */
  }

  /* --- HUD (Glassmorphism) --- */
  header {
    position: absolute;
    top: 2rem;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    z-index: 10;
    padding: 0 2rem;
    pointer-events: none;
  }

  .hud-container {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: 16px;
    padding: 0.75rem 1.5rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    pointer-events: auto;
  }

  .game-title {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-main);
    border-right: 1px solid var(--glass-border);
    padding-right: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.2;
  }
  
  .game-title span {
    font-size: 0.65rem;
    color: var(--neon-cyan);
    font-weight: 600;
    letter-spacing: 0.15em;
  }

  .stats-group {
    display: flex;
    gap: 2rem;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-main);
    font-variant-numeric: tabular-nums;
  }

  /* --- Canvas --- */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* --- Action Button --- */
  .action-container {
    position: absolute;
    bottom: 3rem;
    z-index: 10;
    pointer-events: none;
  }

  .btn-action {
    pointer-events: auto;
    background: rgba(6, 182, 212, 0.15); /* Tinted Glass */
    border: 1px solid rgba(6, 182, 212, 0.3);
    color: var(--neon-cyan);
    padding: 1rem 3rem;
    font-family: var(--font-stack);
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 999px; /* Pill shape */
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .btn-action:hover {
    background: var(--neon-cyan);
    color: var(--bg-deep);
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
    transform: translateY(-2px);
  }

  /* --- Toast --- */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid var(--neon-gold);
    padding: 1.5rem 3rem;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.2);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { color: var(--neon-gold); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.5rem; }
  .toast p { color: #fff; font-size: 1.5rem; font-weight: 700; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Background -->
  <div class="bg-layer"></div>

  <!-- HUD -->
  <header>
    <div class="hud-container">
      <div class="game-title">
        Aether Catcher
        <span>Region 04</span>
      </div>
      
      <div class="stats-group">
        <div class="stat-box">
          <span class="stat-label">Captures</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Collection</span>
          <span class="stat-value" id="completion">0%</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast -->
  <div class="toast" id="toast">
    <h3>Specimen Secured</h3>
    <p id="catchName">Unknown</p>
  </div>

  <!-- Action -->
  <div class="action-container">
    <button class="btn-action" id="collectBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      Collection Log
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Redesign
 * Focus: Organic Creatures, Drone Avatar, Glass UI, Deep Atmosphere
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const completionEl = document.getElementById('completion');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
const MAX_CAPTURES = 20; 
let mouse = { x: -1000, y: -1000 }; // Start off screen
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

// Resize
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Input
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'spark' or 'dust'
    this.vx = (Math.random() - 0.5) * (type === 'spark' ? 8 : 2);
    this.vy = (Math.random() - 0.5) * (type === 'spark' ? 8 : 2);
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.01;
    this.color = color;
    this.size = Math.random() * (type === 'spark' ? 3 : 6) + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.type === 'dust') this.size *= 0.98;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    
    if (this.type === 'spark') {
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text, color) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.02;
  }

  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.font = 'bold 16px system-ui';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

// --- Creatures ---
class Creature {
  constructor() {
    this.type = Math.floor(Math.random() * 3); // 0: Jelly, 1: Crystal, 2: Moth
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * (height - 200); // Keep away from bottom UI
    this.size = Math.random() * 15 + 20; // Base size
    // Slower, more organic movement
    this.vx = (Math.random() - 0.5) * 0.8; 
    this.vy = (Math.random() - 0.5) * 0.8;
    
    this.phase = Math.random() * Math.PI * 2; // Animation offset
    this.caught = false;
    this.color = this.getColor();
    
    // Movement parameters
    this.wobbleSpeed = 0.02 + Math.random() * 0.03;
    this.wobbleAmp = 0.5 + Math.random() * 0.5;
  }

  getColor() {
    if(this.type === 0) return '#22d3ee'; // Cyan
    if(this.type === 1) return '#c084fc'; // Light Purple
    return '#4ade80'; // Emerald Green
  }

  update() {
    this.phase += this.wobbleSpeed;

    if (!this.caught) {
      // Organic drift (Sine wave + linear)
      this.x += this.vx + Math.sin(this.phase) * this.wobbleAmp;
      this.y += this.vy + Math.cos(this.phase * 0.5) * (this.wobbleAmp * 0.5);

      // Wrap around screen
      if (this.x < -50) this.x = width + 50;
      if (this.x > width + 50) this.x = -50;
      if (this.y < -50) this.y = height + 50;
      if (this.y > height + 50) this.y = -50;

      // Catch Logic
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Net radius is 60
      if (dist < 60) {
        this.catch();
      }
    } else {
      // Teleport to net and spin
      this.x = mouse.x + (Math.random() - 0.5) * 10;
      this.y = mouse.y + (Math.random() - 0.5) * 10;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    const pct = Math.min(100, Math.floor((score / MAX_CAPTURES) * 100));
    completionEl.innerText = pct + '%';

    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1", this.color));
    
    // Reset creature after a delay
    setTimeout(() => {
        this.caught = false;
        this.init();
    }, 1000);

    // Toast
    if (Math.random() > 0.5) {
      const names = ["Lumina Jelly", "Geode Shard", "Void Moth"];
      catchNameEl.innerText = names[this.type];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Hierarchy: Catchable creatures (larger) have stronger glow
    if(this.type === 1) {
        // Crystal: Rotate
        ctx.rotate(this.phase);
    } else {
        // Jelly/Moth: Face direction of movement roughly
        const angle = Math.atan2(this.vy, this.vx);
        // Smooth rotation
        ctx.rotate(Math.sin(this.phase) * 0.2); 
    }

    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;

    const s = this.size;

    if (this.type === 0) {
      // --- Jellyfish (Organic) ---
      // Dome
      ctx.beginPath();
      ctx.arc(0, -s*0.2, s*0.8, Math.PI, 0);
      
      // Tentacles
      for(let i=0; i<3; i++) {
        const tx = (s*0.6) - (i * s*0.4);
        const wave = Math.sin(this.phase * 2 + i) * 10;
        ctx.quadraticCurveTo(tx - 5, s + wave, tx, s*1.5 + wave);
      }
      ctx.closePath();
      ctx.fill();
      
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-s*0.3, -s*0.3, s*0.15, 0, Math.PI*2);
      ctx.arc(s*0.3, -s*0.3, s*0.15, 0, Math.PI*2);
      ctx.fill();

    } else if (this.type === 1) {
      // --- Crystal (Geometric/Solid) ---
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s*0.6, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s*0.6, 0);
      ctx.closePath();
      ctx.fill();
      
      // Facet (Lighting)
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(0, -s*0.5);
      ctx.lineTo(s*0.3, 0);
      ctx.lineTo(0, s*0.5);
      ctx.lineTo(-s*0.3, 0);
      ctx.fill();

    } else {
      // --- Moth (Bioluminescent Wings) ---
      const wingFlap = Math.sin(this.phase * 10) * 0.3;
      
      // Wings
      ctx.beginPath();
      ctx.ellipse(-s*0.5, 0, s*0.8, s*0.4, wingFlap, 0, Math.PI*2); // Left
      ctx.fill();
      
      ctx.beginPath();
      ctx.ellipse(s*0.5, 0, s*0.8, s*0.4, -wingFlap, 0, Math.PI*2); // Right
      ctx.fill();

      // Body
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.ellipse(0, 0, s*0.2, s*0.6, 0, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 12; i++) particles.push(new Particle(x, y, color, 'spark'));
  for (let i = 0; i < 8; i++) particles.push(new Particle(x, y, '#fff', 'dust'));
}

// --- Environment ---
const stars = [];
for(let i=0; i<200; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.1
  });
}

function drawEnvironment() {
    // Subtle Parallax Stars
    stars.forEach(star => {
        const sx = (star.x - time * star.speed * 0.5) % width;
        const sy = star.y % height;
        
        // Twinkle
        const alpha = star.alpha * (0.5 + Math.sin(time * 0.05 + star.x) * 0.5);
        
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, star.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

// --- Player Drone & Net (Critique 1) ---
function drawPlayerAndTool() {
  const px = mouse.x;
  const py = mouse.y;

  // 1. The Net (Wireframe Energy Field)
  ctx.save();
  ctx.translate(px, py);
  
  // Outer Field
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 4]);
  ctx.beginPath();
  ctx.arc(0, 0, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Target Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(0, 0, 50, 0, Math.PI * 2);
  ctx.stroke();

  // Crosshair
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-65, 0); ctx.lineTo(-55, 0);
  ctx.moveTo(55, 0); ctx.lineTo(65, 0);
  ctx.moveTo(0, -65); ctx.lineTo(0, -55);
  ctx.moveTo(0, 55); ctx.lineTo(0, 65);
  ctx.stroke();
  
  ctx.restore();

  // 2. The Drone (Geometric Sci-Fi Avatar)
  // Positioned slightly below/behind the net logic visually to anchor the scene
  const droneX = px;
  const droneY = py + 70; // Fixed offset below cursor

  ctx.save();
  ctx.translate(droneX, droneY);
  
  // Drone Glow
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#fff';

  // Main Body (Diamond)
  ctx.fillStyle = '#000';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(10, 0);
  ctx.lineTo(0, 12);
  ctx.lineTo(-10, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Core (Pulsing)
  const pulse = Math.sin(time * 0.2) * 2 + 4;
  ctx.fillStyle = var_neon_cyan();
  ctx.shadowColor = var_neon_cyan();
  ctx.beginPath();
  ctx.arc(0, 0, pulse, 0, Math.PI*2);
  ctx.fill();

  // Thrusters (Particles)
  if (Math.random() > 0.5) {
      particles.push(new Particle(droneX, droneY + 12, '#fff', 'dust'));
  }

  ctx.restore();
}

function var_neon_cyan() { return '#06b6d4'; }

// --- Main Loop ---
function animate() {
  time++;
  
  // Clear
  ctx.clearRect(0, 0, width, height);
  
  // 1. Background
  drawEnvironment();

  // 2. Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // 3. Player (Drone + Net)
  drawPlayerAndTool();

  // 4. Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // 5. Floating Text
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].update();
    floatingTexts[i].draw(ctx);
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

// Init
for (let i = 0; i < 8; i++) {
  creatures.push(new Creature());
}

animate();

// Button Logic
document.getElementById('collectBtn').addEventListener('click', () => {
    // Visual feedback
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset
    score = 0;
    scoreEl.innerText = "0";
    completionEl.innerText = "0%";
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(width/2, height/2, '#06b6d4');
});

</script>
</body>
</html>
