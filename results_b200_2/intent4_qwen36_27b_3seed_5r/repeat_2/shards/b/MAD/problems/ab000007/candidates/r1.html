<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-violet: #2e1065;
    --glass-bg: rgba(15, 23, 42, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --primary: #fbbf24;
    --primary-glow: rgba(251, 191, 36, 0.5);
    --text-main: #f8fafc;
    --text-muted: #cbd5e1;
    --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Critique 1: Deep atmospheric gradient */
    background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Background "Floating Isles" / Nebula Shapes */
  .nebula-shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }
  .nebula-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #4c1d95; }
  .nebula-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #0f172a; opacity: 0.6; }
  .nebula-3 { top: 40%; left: 60%; width: 30vw; height: 30vw; background: #818cf8; opacity: 0.2; }

  /* HUD */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2.5rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
    pointer-events: none;
  }

  .title-group {
    /* Critique 5: Typography Polish */
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  .title-group h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 0.15em; /* Tighten/Style */
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    background: linear-gradient(to bottom, #fff, #cbd5e1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .title-group p {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .hud-stats {
    display: flex;
    gap: 1.5rem;
    pointer-events: auto;
  }

  /* Critique 4: Glassmorphism HUD */
  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.75rem 1.5rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }

  .stat-pill:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.2);
    background: rgba(30, 41, 59, 0.5);
  }

  .stat-icon {
    width: 20px;
    height: 20px;
    fill: var(--primary);
    filter: drop-shadow(0 0 5px var(--primary-glow));
  }

  .stat-value {
    font-size: 1.2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: none; /* Hide default cursor */
  }

  /* Bottom Action Bar */
  .action-bar {
    position: absolute;
    bottom: 3rem;
    right: 3rem; /* Critique 4: Move to bottom-right */
    left: auto;
    width: auto;
    display: flex;
    justify-content: flex-end;
    z-index: 10;
    pointer-events: none;
  }

  /* Critique 4: Refined Button */
  .btn-collect {
    pointer-events: auto;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 0.8rem 2rem;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .btn-collect svg {
    width: 16px;
    height: 16px;
    fill: var(--primary);
  }

  .btn-collect:hover {
    transform: translateY(-2px);
    background: rgba(30, 41, 59, 0.6);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
  }
  
  .btn-collect:active {
    transform: scale(0.96);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 1.5rem 3rem;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--primary); 
    margin-bottom: 0.25rem;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .toast p { 
    font-size: 0.95rem; 
    color: var(--text-muted); 
    font-weight: 300;
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Background Shapes (Critique 1) -->
  <div class="nebula-shape nebula-1"></div>
  <div class="nebula-shape nebula-2"></div>
  <div class="nebula-shape nebula-3"></div>

  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <p>Region 04: Floating Isles</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <div>
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:#38bdf8" viewBox="0 0 24 24">
          <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56c1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/>
        </svg>
        <div>
          <div class="stat-value">74%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Mist Sprite</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Open Collection
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Interaction Script
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: -100, y: -100 };
let particles = [];
let creatures = [];
let floatingTexts = [];

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 4 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.025;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.02;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px system-ui';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

// Critique 2: Aether Spirit Entity
class Creature {
  constructor() {
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 15 + 15;
    this.speedX = (Math.random() - 0.5) * 1.2;
    this.speedY = (Math.random() - 0.5) * 1.2;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.color = this.getColor();
    this.caught = false;
    // Critique 2: Bobbing animation offset
    this.bobOffset = Math.random() * 100;
  }

  getColor() {
    const colors = ['#38bdf8', '#a78bfa', '#34d399', '#f472b6', '#fb923c'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  update() {
    // Movement
    this.x += this.speedX;
    this.y += this.speedY;
    
    // Critique 2: Bobbing Animation
    this.wobble += 0.05;
    this.angle += 0.02;
    this.bobOffset += 0.03;

    // Bounce off walls
    if (this.x < -50 || this.x > width + 50) this.speedX *= -1;
    if (this.y < -50 || this.y > height + 50) this.speedY *= -1;

    // Catch Logic
    if (!this.caught) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Catch radius based on net size (approx 40px)
      if (dist < 50) {
        this.catch();
      }
    } else {
      // Move towards mouse (net center)
      this.x += (mouse.x - this.x) * 0.15;
      this.y += (mouse.y - this.y) * 0.15;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual feedback
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    // Show Toast occasionally
    if (Math.random() > 0.7) {
      const names = ["Mist Sprite", "Ember Wisp", "Crystal Shard", "Void Moth", "Nebula Ray"];
      catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Critique 2: Outer Glow (Bloom)
    ctx.shadowBlur = 25;
    ctx.shadowColor = this.color;
    
    // Critique 2: Semi-transparent gradient fill
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)'); // White center
    grad.addColorStop(0.4, this.color); // Color edge
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)'); // Fade out

    ctx.fillStyle = grad;
    ctx.beginPath();
    
    // Organic Blob Shape
    const points = 6;
    for (let i = 0; i < points; i++) {
        const a = (Math.PI * 2 / points) * i + this.angle;
        // Add wobble to radius
        const r = this.size + Math.sin(this.wobble + i) * 3; 
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // Eyes (Simpler, more ethereal)
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 0;
    const eyeOffset = this.size * 0.25;
    ctx.beginPath();
    ctx.arc(-eyeOffset, -eyeOffset/2, this.size * 0.15, 0, Math.PI*2);
    ctx.arc(eyeOffset, -eyeOffset/2, this.size * 0.15, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Critique 3: Draw The Net
function drawNet() {
  const size = 45;
  
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // Outer Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, size - 8, 0, Math.PI * 2);
  ctx.stroke();

  // Grid lines (Subtle)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  
  // Crosshairs
  ctx.beginPath();
  ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
  ctx.moveTo(0, -size); ctx.lineTo(0, size);
  ctx.stroke();

  // Center Dot
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 5;
  ctx.shadowColor = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// Critique 3: Draw Player Avatar (Silhouette)
function drawPlayer(ctx) {
    const playerX = width / 2;
    const playerY = height - 100; // Anchored lower center

    ctx.save();
    ctx.translate(playerX, playerY);

    // Subtle glow behind player
    const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 80);
    glow.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
    glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 80, 0, Math.PI*2);
    ctx.fill();

    // Stylized Silhouette (Simple geometric representation)
    ctx.fillStyle = '#0f172a'; // Dark silhouette
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; // Rim light
    ctx.lineWidth = 2;

    // Body shape
    ctx.beginPath();
    ctx.moveTo(0, -40); // Head top
    ctx.quadraticCurveTo(15, -20, 20, 0); // Shoulder R
    ctx.lineTo(10, 40); // Leg R
    ctx.lineTo(-10, 40); // Leg L
    ctx.lineTo(-20, 0); // Shoulder L
    ctx.quadraticCurveTo(-15, -20, 0, -40); // Head L
    ctx.closePath();
    
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

// Draw Background Stars
const stars = Array(80).fill().map(() => ({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random()
}));

function drawBackground() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Stars
    ctx.fillStyle = '#ffffff';
    stars.forEach(star => {
        // Twinkle effect
        const twinkle = Math.abs(Math.sin(Date.now() * 0.001 + star.x)) * star.alpha;
        ctx.globalAlpha = twinkle;
        ctx.beginPath();
        ctx.arc(star.x % width, star.y % height, star.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// Init
for (let i = 0; i < 10; i++) {
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  drawBackground();
  
  // Draw Player (Critique 3)
  drawPlayer(ctx);

  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    // Visual feedback on button click
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Logic: Reset game for demo purposes
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(width/2, height/2, '#fff');
});

</script>
</body>
</html>
