<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    /* Palette: Deep Space & Ethereal Bioluminescence */
    --bg-deep: #020205;
    --bg-vignette: #000000;
    --glass-bg: rgba(10, 15, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    
    --primary: #fbbf24; /* Amber/Gold */
    --accent: #22d3ee; /* Cyan */
    --danger: #f43f5e;
    
    --text-main: #f8fafc;
    --text-muted: #64748b;
    
    --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --radius-std: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    cursor: none; /* Hide default cursor */
  }

  /* --- Layout & Composition --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* --- Atmosphere & Depth (Critique 5) --- */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    /* Radial gradient vignette to focus center */
    background: radial-gradient(circle at 50% 50%, rgba(20, 20, 40, 0.4) 0%, var(--bg-deep) 80%),
                radial-gradient(circle at 50% 120%, #1e1b4b 0%, transparent 60%);
  }

  /* --- HUD & Typography (Critique 3 & 4) --- */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2rem 2.5rem;
    display: flex;
    align-items: flex-start; /* Align to top baseline */
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
  }

  .title-group {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .title-group h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.15);
    line-height: 1;
  }

  /* Region Label aligned with title baseline */
  .region-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .region-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background-color: var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--primary);
  }

  /* HUD Stats Container */
  .hud-stats {
    display: flex;
    gap: 0; /* Connected segments */
    pointer-events: auto;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-std); /* Unified 12px radius */
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.6rem 1.2rem;
    border-right: 1px solid var(--glass-border);
    position: relative;
  }
  
  .stat-item:last-child {
    border-right: none;
  }

  /* Progress Bar Background for Completion */
  .stat-item.completion-bar {
    background: rgba(255,255,255,0.03);
  }

  .stat-icon {
    width: 20px;
    height: 20px;
    opacity: 0.8;
  }

  .stat-data {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.6rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* --- Canvas Layer --- */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* --- Bottom Action Bar (Critique 4) --- */
  .action-bar {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    z-index: 10;
    pointer-events: none;
  }

  /* Refined Button: Lower visual weight */
  .btn-collect {
    pointer-events: auto;
    background: rgba(10, 15, 30, 0.3); /* Lower opacity */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15); /* Thinner stroke */
    color: var(--text-main);
    padding: 0.8rem 2rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: var(--radius-std); /* Unified 12px radius */
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  .btn-collect svg {
    width: 16px;
    height: 16px;
    stroke: var(--text-muted);
    transition: stroke 0.3s ease;
  }

  .btn-collect:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  
  .btn-collect:hover svg {
    stroke: #fff;
  }

  /* --- Notifications --- */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 16, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-highlight);
    padding: 1.5rem 3rem;
    border-radius: var(--radius-std);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--primary); 
    margin-bottom: 0.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .toast p { 
    font-size: 1.25rem; 
    color: #fff; 
    font-weight: 600;
    text-shadow: 0 0 15px rgba(255,255,255,0.4);
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Atmosphere Layer -->
  <div class="bg-layer"></div>

  <!-- HUD Header -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <span class="region-label">Region 04</span>
    </div>
    
    <div class="hud-stats">
      <div class="stat-item">
        <!-- Capture Icon -->
        <svg class="stat-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--primary);">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <div class="stat-data">
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-item completion-bar">
        <!-- Globe Icon -->
        <svg class="stat-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--accent);">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="stat-data">
          <div class="stat-value" id="completion">0%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>New Specimen</h3>
    <p id="catchName">Unknown Entity</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      Collection Log
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Revised
 * Focus: Visual Polish, Player Agency (Net), Creature Silhouettes, HUD Math
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const completionEl = document.getElementById('completion');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
const MAX_CAPTURES = 15; // For percentage calculation
let mouse = { x: -100, y: -100 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px system-ui';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

// Creature Types with Distinct Visuals
class Creature {
  constructor() {
    // Types: 0=Jellyfish, 1=Crystal, 2=Bird
    this.type = Math.floor(Math.random() * 3);
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * (height - 150);
    this.size = Math.random() * 15 + 15;
    this.speedX = (Math.random() - 0.5) * 0.6;
    this.speedY = (Math.random() - 0.5) * 0.6;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.caught = false;
    this.color = this.getColor();
    this.pulse = 0;
  }

  getColor() {
    if(this.type === 0) return '#38bdf8'; // Cyan (Jellyfish)
    if(this.type === 1) return '#a78bfa'; // Violet (Crystal)
    return '#34d399'; // Emerald (Bird)
  }

  update() {
    // Movement
    this.x += this.speedX;
    this.y += this.speedY;
    
    // Bobbing
    this.wobble += 0.05;
    this.pulse += 0.08;

    // Bounce
    if (this.x < 0 || this.x > width) this.speedX *= -1;
    if (this.y < 0 || this.y > height) this.speedY *= -1;

    // Catch Logic
    if (!this.caught) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Net radius is approx 50px
      if (dist < 50) {
        this.catch();
      }
    } else {
      // Follow player net smoothly
      this.x += (mouse.x - this.x) * 0.1;
      this.y += (mouse.y - this.y) * 0.1;
      this.angle += 0.05; // Spin
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    // Update Math Logic
    const pct = Math.min(100, Math.floor((score / MAX_CAPTURES) * 100));
    completionEl.innerText = pct + '%';

    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    // Show Toast occasionally
    if (Math.random() > 0.6) {
      const names = ["Lumina Jelly", "Geode Spirit", "Void Moth"];
      catchNameEl.innerText = names[this.type];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2500);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;

    if (this.type === 0) {
      // --- Jellyfish Silhouette ---
      // Head (Dome)
      ctx.beginPath();
      ctx.arc(0, 0, this.size * 0.8, Math.PI, 0);
      ctx.lineTo(this.size * 0.8, this.size * 0.2);
      
      // Tentacles (Wavy lines)
      for(let i=1; i<=3; i++) {
        const tx = (this.size * 0.8) - (i * (this.size * 0.4));
        const wave = Math.sin(this.wobble + i) * 5;
        ctx.quadraticCurveTo(tx - 5, this.size * 0.8 + wave, tx, this.size + wave);
      }
      
      ctx.closePath();
      ctx.fill();
      
      // Inner Eye/Core
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(0, -this.size * 0.2, this.size * 0.2, 0, Math.PI*2);
      ctx.fill();

    } else if (this.type === 1) {
      // --- Floating Crystal ---
      ctx.rotate(this.angle);
      ctx.beginPath();
      const s = this.size;
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.5, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s * 0.5, 0);
      ctx.closePath();
      ctx.fill();
      
      // Inner facet
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.5);
      ctx.lineTo(s * 0.25, 0);
      ctx.lineTo(0, s * 0.5);
      ctx.lineTo(-s * 0.25, 0);
      ctx.fill();

    } else {
      // --- Geometric Bird ---
      ctx.rotate(Math.sin(this.wobble * 0.5) * 0.2); // Slight banking
      ctx.beginPath();
      const s = this.size;
      // Beak
      ctx.moveTo(s, 0);
      // Wing Top
      ctx.quadraticCurveTo(0, -s, -s, -s * 0.5);
      // Tail
      ctx.lineTo(-s * 0.5, 0);
      // Wing Bottom
      ctx.quadraticCurveTo(0, s, s, 0);
      ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// --- Environment Drawing ---
const stars = [];
for(let i=0; i<150; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.05
  });
}

function drawEnvironment() {
    // Stars
    stars.forEach(star => {
        const sx = (star.x - time * star.speed) % width;
        const sy = star.y % height;
        
        // Twinkle
        const alpha = star.alpha * (0.5 + Math.sin(time * 0.05 + star.x) * 0.5);
        
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, star.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

// --- Player & Tool Drawing (Critique 1) ---
function drawPlayerAndTool() {
  const px = mouse.x;
  const py = mouse.y;

  // 1. The Net (Custom Cursor)
  ctx.save();
  ctx.translate(px, py);
  
  // Outer Glowing Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
  ctx.beginPath();
  ctx.arc(0, 0, 45, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Dashed Ring (Targeting aesthetic)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(0, 0, 35, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Crosshair
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.beginPath();
  ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
  ctx.moveTo(0, -10); ctx.lineTo(0, 10);
  ctx.stroke();
  
  ctx.restore();
}

// --- Main Loop ---

function animate() {
  time++;
  
  // Clear
  ctx.clearRect(0, 0, width, height);
  
  // 1. Draw Environment
  drawEnvironment();

  // 2. Draw Creatures (Behind Player)
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // 3. Draw Player & Tool (Net)
  drawPlayerAndTool();

  // 4. Draw Particles (Explosions)
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // 5. Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  requestAnimationFrame(animate);
}

// Init Creatures
for (let i = 0; i < 12; i++) {
  creatures.push(new Creature());
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset logic for demo
    score = 0;
    scoreEl.innerText = "0";
    completionEl.innerText = "0%";
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(width/2, height/2, '#fff');
});

</script>
</body>
</html>
