<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-violet: #1e1b4b;
    --glass-bg: rgba(10, 15, 30, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --primary: #fbbf24;
    --primary-dim: #b45309;
    --accent: #0ea5e9;
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Background Layering */
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 120%, #1e1b4b 0%, #020617 60%, #000000 100%);
    z-index: 0;
  }

  /* HUD - Unified Top Bar */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 1.5rem 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  /* Typography Polish */
  .title-group h1 {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 2px 10px rgba(255,255,255,0.2);
    line-height: 1;
  }

  .title-group p {
    font-size: 0.7rem;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: rgba(251, 191, 36, 0.1);
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    border: 1px solid rgba(251, 191, 36, 0.2);
  }

  /* HUD Stats - Grouped */
  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1.2rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    border-right: 1px solid rgba(255,255,255,0.1);
    padding-right: 1.2rem;
  }

  .stat-item:last-child {
    border-right: none;
    padding-right: 0;
  }

  /* Custom Icon Styling */
  .stat-icon {
    width: 24px;
    height: 24px;
    filter: drop-shadow(0 0 4px var(--primary));
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    line-height: 1.2;
  }

  .stat-label {
    font-size: 0.6rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: none;
  }

  /* Bottom Action Bar - Centered & Elevated */
  .action-bar {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    z-index: 10;
    pointer-events: none;
  }

  /* Elevated Button */
  .btn-collect {
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 0.9rem 2.5rem;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.1), inset 0 0 20px rgba(255,255,255,0.05);
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  .btn-collect svg {
    width: 18px;
    height: 18px;
    fill: var(--primary);
    filter: drop-shadow(0 0 5px var(--primary));
  }

  .btn-collect:hover {
    transform: translateY(-3px) scale(1.02);
    background: rgba(255, 255, 255, 0.1);
    border-color: #fff;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255,255,255,0.1);
  }
  
  .btn-collect:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 16, 0.8);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 1.2rem 2.5rem;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--primary); 
    margin-bottom: 0.25rem;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .toast p { 
    font-size: 1.1rem; 
    color: #fff; 
    font-weight: 500;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Base Gradient -->
  <div class="bg-gradient"></div>

  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <p>Region 04</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-item">
        <!-- Star Icon -->
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <div>
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-item">
        <!-- Globe Icon -->
        <svg class="stat-icon" style="fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent));" viewBox="0 0 24 24">
          <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56c1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/>
        </svg>
        <div>
          <div class="stat-value">74%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured</h3>
    <p id="catchName">Mist Sprite</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Open Collection
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Interaction Script
 * Revised for: Sharp Avatar, Living Environment, Creature Diversity
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: -100, y: -100 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.03;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.025;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

// Critique 3: Diverse Creatures
class Creature {
  constructor() {
    this.type = Math.random() > 0.6 ? 'crystal' : (Math.random() > 0.5 ? 'gas' : 'organic');
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * (height - 200); // Keep away from very bottom
    this.size = Math.random() * 15 + 12;
    this.speedX = (Math.random() - 0.5) * 0.8;
    this.speedY = (Math.random() - 0.5) * 0.8;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.color = this.getColor();
    this.caught = false;
    this.pulse = 0;
  }

  getColor() {
    // Distinct palettes per type
    if(this.type === 'crystal') return '#a78bfa'; // Violet
    if(this.type === 'gas') return '#38bdf8'; // Cyan
    return '#34d399'; // Emerald
  }

  update() {
    // Movement
    this.x += this.speedX;
    this.y += this.speedY;
    
    // Bobbing/Rotation
    this.wobble += 0.04;
    this.angle += 0.01;
    this.pulse += 0.05;

    // Bounce
    if (this.x < 0 || this.x > width) this.speedX *= -1;
    if (this.y < 0 || this.y > height) this.speedY *= -1;

    // Catch Logic
    if (!this.caught) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 55) { // Catch radius
        this.catch();
      }
    } else {
      // Move towards mouse
      this.x += (mouse.x - this.x) * 0.15;
      this.y += (mouse.y - this.y) * 0.15;
      this.angle += 0.1; // Spin when caught
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    if (Math.random() > 0.7) {
      const names = {
        crystal: "Geode Spirit",
        gas: "Mist Wisp",
        organic: "Vitalis Moth"
      };
      catchNameEl.innerText = names[this.type];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Standardized Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;

    if (this.type === 'crystal') {
      // Sharp, Angular Geometry
      ctx.fillStyle = this.color;
      ctx.beginPath();
      const r = this.size;
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.6, 0);
      ctx.lineTo(0, r);
      ctx.lineTo(-r * 0.6, 0);
      ctx.closePath();
      ctx.fill();
      
      // Inner highlight
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.5);
      ctx.lineTo(r * 0.3, 0);
      ctx.lineTo(0, r * 0.5);
      ctx.lineTo(-r * 0.3, 0);
      ctx.fill();

    } else if (this.type === 'gas') {
      // Gaseous, Soft, Pulsing
      const pulseSize = this.size + Math.sin(this.pulse) * 3;
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, pulseSize);
      grad.addColorStop(0, 'rgba(255,255,255,0.8)');
      grad.addColorStop(0.3, this.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, pulseSize, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // Organic, Blobby
      ctx.fillStyle = this.color;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 / 8) * i;
        const r = this.size + Math.sin(this.wobble + i) * 4;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      
      // Eye
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(0, 0, this.size * 0.3, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// --- Environment Drawing ---

// Generate Islands once
const islands = [];
for(let i=0; i<6; i++) {
  islands.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 150 + 50,
    speed: Math.random() * 0.02 + 0.005
  });
}

function drawEnvironment() {
    // Stars
    ctx.fillStyle = '#ffffff';
    // Simple pseudo-random stars based on time for twinkle
    for(let i=0; i<100; i++) {
        const x = (i * 137) % width;
        const y = (i * 241) % height;
        const alpha = 0.3 + Math.sin(time * 0.002 + i) * 0.3;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 1.5, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // Floating Islands (Silhouettes)
    ctx.fillStyle = '#020617'; // Very dark blue/black
    islands.forEach(island => {
        const ix = (island.x - time * island.speed) % (width + 400) - 200;
        const iy = island.y % height;
        
        ctx.beginPath();
        ctx.arc(ix, iy, island.size, 0, Math.PI * 2);
        ctx.fill();
        
        // Rim light on islands (very subtle)
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        ctx.stroke();
    });
}

// --- Player & Tool Drawing ---

function drawPlayerAndTool() {
  const px = mouse.x;
  const py = mouse.y;

  // 1. The Net (Tool) - Outer
  ctx.save();
  ctx.translate(px, py);
  
  // Net Glow
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
  
  // Net Circle
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 45, 0, Math.PI * 2);
  ctx.stroke();
  
  // Net Inner Ring
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 38, 0, Math.PI * 2);
  ctx.stroke();
  
  // Grid Lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.beginPath();
  ctx.moveTo(-45, 0); ctx.lineTo(45, 0);
  ctx.moveTo(0, -45); ctx.lineTo(0, 45);
  ctx.stroke();
  
  ctx.restore();

  // 2. The Player (Avatar) - Sharp, High Contrast
  // Positioned "behind" the net but following it
  const avatarX = px - 30; 
  const avatarY = py + 10;
  
  ctx.save();
  ctx.translate(avatarX, avatarY);
  
  // Strong Rim Light (Critique 1)
  ctx.shadowBlur = 20;
  ctx.shadowColor = 'var(--primary)'; // Gold accent
  
  // Silhouette Body (Sharp/Geometric)
  ctx.fillStyle = '#0f172a'; // Deep dark blue
  ctx.strokeStyle = '#fff'; // Sharp white outline
  ctx.lineWidth = 1.5;
  
  ctx.beginPath();
  // Head
  ctx.moveTo(0, -25);
  ctx.lineTo(6, -15);
  // Shoulders
  ctx.lineTo(12, -5);
  ctx.lineTo(10, 5);
  // Arm holding net
  ctx.lineTo(25, 0); 
  ctx.lineTo(10, -2);
  // Body
  ctx.lineTo(8, 15);
  ctx.lineTo(-8, 15);
  ctx.lineTo(-10, -5);
  ctx.lineTo(-5, -15);
  ctx.closePath();
  
  ctx.fill();
  ctx.stroke();

  // Visor/Glowing Eye
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 5;
  ctx.shadowColor = '#fff';
  ctx.beginPath();
  ctx.moveTo(2, -18);
  ctx.lineTo(8, -15);
  ctx.lineTo(2, -14);
  ctx.fill();

  ctx.restore();
}

// --- Main Loop ---

function animate() {
  time++;
  
  // Clear
  ctx.clearRect(0, 0, width, height);
  
  // 1. Draw Environment
  drawEnvironment();

  // 2. Draw Creatures (Behind Player)
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // 3. Draw Player & Tool
  drawPlayerAndTool();

  // 4. Draw Particles (Explosions)
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // 5. Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  requestAnimationFrame(animate);
}

// Init Creatures
for (let i = 0; i < 12; i++) {
  creatures.push(new Creature());
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset logic for demo
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    // Flash effect
    createExplosion(width/2, height/2, '#fff');
});

</script>
</body>
</html>
