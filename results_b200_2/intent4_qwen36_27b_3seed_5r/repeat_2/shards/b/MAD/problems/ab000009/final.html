<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Chess Interface</title>
    <style>
        :root {
            /* Palette: Premium Flat */
            --bg-body: #121418; /* Very dark slate, almost black */
            --bg-panel: #1E2127; /* Panel background */
            
            --board-light: #E8E4D9; /* Warm creamy off-white */
            --board-dark: #4B535E;  /* Deep rich slate */
            
            --text-primary: #F0F0F0;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            
            --accent: #3B82F6; /* Subtle blue for interactive states if needed */
            
            /* Dimensions */
            --board-size: clamp(320px, 80vmin, 640px);
            --square-size: calc(var(--board-size) / 8);
            --gap-panel: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Layout Container */
        .main-container {
            display: flex;
            align-items: flex-start;
            gap: var(--gap-panel);
            padding: 40px;
        }

        /* --- The Chessboard --- */
        .board-container {
            /* Removed borders/shadows per critique: rely on contrast */
            width: var(--board-size);
            height: var(--board-size);
            position: relative;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            /* No border on the board itself, just the squares */
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            z-index: 1;
        }

        /* Ranks (Numbers) - Top Left */
        .coord-rank {
            top: 4px;
            left: 5px;
        }

        /* Files (Letters) - Bottom Right */
        .coord-file {
            bottom: 3px;
            right: 5px;
        }

        /* Dynamic coloring for coordinates to ensure legibility */
        .square.light .coord { color: var(--board-dark); opacity: 0.7; }
        .square.dark .coord { color: var(--board-light); opacity: 0.7; }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 2;
            cursor: pointer;
            /* Subtle drop shadow for depth without outlines */
            filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.4));
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .piece:hover {
            transform: translateY(-2px) scale(1.05);
        }

        /* --- Side Panel --- */
        .side-panel {
            width: 320px;
            height: var(--board-size);
            display: flex;
            flex-direction: column;
            /* No borders, just spacing */
        }

        /* Turn Indicator */
        .turn-section {
            margin-bottom: 32px;
            padding-bottom: 24px;
        }

        .turn-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .turn-status {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-primary);
            box-shadow: 0 0 0 2px var(--bg-body); /* Creates a ring effect */
        }
        
        .turn-status.black-turn .turn-dot {
            background-color: #333;
            box-shadow: 0 0 0 2px var(--text-muted);
        }

        /* Move History */
        .history-section {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-family: system-ui, sans-serif; /* Unified font */
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .history-table th {
            text-align: left;
            padding: 0 12px 12px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .history-table td {
            padding: 10px 12px;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .history-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .history-table tr:last-child {
            border-bottom: none;
        }

        .move-num {
            color: var(--text-muted);
            width: 30px;
            text-align: right;
            padding-right: 20px;
        }

        /* Controls */
        .controls-section {
            margin-top: auto;
            padding-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
        }

        /* Primary Action: New Game */
        .btn-primary {
            background-color: var(--text-primary);
            color: var(--bg-body);
        }
        .btn-primary:hover {
            background-color: #fff;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }

        /* Secondary Action: Reset Board */
        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                padding: 20px;
                gap: 40px;
            }
            .side-panel {
                width: var(--board-size);
                height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Board Section -->
        <div class="board-container">
            <div class="chessboard" id="board">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="side-panel">
            
            <!-- Turn Indicator -->
            <div class="turn-section">
                <div class="turn-label">Current Turn</div>
                <div class="turn-status" id="turn-display">
                    <div class="turn-dot"></div>
                    White to Move
                </div>
            </div>

            <!-- Move History -->
            <div class="history-section">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Placeholder Data -->
                        <tr>
                            <td class="move-num">1.</td>
                            <td>e4</td>
                            <td>e5</td>
                        </tr>
                        <tr>
                            <td class="move-num">2.</td>
                            <td>Nf3</td>
                            <td>Nc6</td>
                        </tr>
                        <tr>
                            <td class="move-num">3.</td>
                            <td>Bb5</td>
                            <td>a6</td>
                        </tr>
                        <tr>
                            <td class="move-num">4.</td>
                            <td>Ba4</td>
                            <td>Nf6</td>
                        </tr>
                        <tr>
                            <td class="move-num">5.</td>
                            <td>O-O</td>
                            <td>Be7</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Controls -->
            <div class="controls-section">
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
                <button class="btn btn-secondary" onclick="resetBoard()">Reset Board</button>
            </div>

        </div>
    </div>

<script>
    // --- Vector Assets (Solid Fills) ---
    // White pieces are solid cream (#E8E4D9), Black pieces are solid slate (#4B535E)
    
    const svgPaths = {
        p: "M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z",
        r: "M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5M34 14l-3 3H14l-3-3M31 17v12.5c1.71.37 3 2.22 3 4.5v3H11v-3c0-2.28 1.29-4.13 3-4.5V17h17zM31 29.5l1.5 2.5h-20l1.5-2.5M11 14h23",
        n: "M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.32-2.58 2.9-3 3-3.45.84-7.2 4.14-8 6-1.27 3.09-1.67 6.45-2 10h22c-1.27-3.09-1.67-6.45-2-10-.84-1.86-4.55-5.16-8-6-.42-.1-3.38-.68-3-3zM9.5 25.5A4.5 4.5 0 1 1 5 21a4.5 4.5 0 0 1 4.5 4.5zM15 15.5c-1.66 0-3 1.34-3 3 .6 0 1 .4 1 1s-.4 1-1 1c-1.66 0-3 1.34-3 3 .6 0 1 .4 1 1s-.4 1-1 1c-1.66 0-3 1.34-3 3 0 1.66 1.34 3 3 3 1.66 0 3-1.34 3-3 .6 0 1-.4 1-1s-.4-1-1-1c-1.66 0-3-1.34-3-3 .6 0 1-.4 1-1s-.4-1-1-1z",
        b: "M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.38 0 10.11.48 13.5 1.45V30H9v6zM15 24c4 1 11 1 15 0v-8c0-6-4.5-11-7.5-11s-7.5 5-7.5 11v8zM22.5 9c-3 0-4.5 3-4.5 6 0 2 1 4 4.5 4s4.5-2 4.5-4c0-3-1.5-6-4.5-6zM15 30c0-3 3-6 7.5-6s7.5 3 7.5 6",
        q: "M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 3 1 5 1 2.5 0 2.5-2.5 6-2.5s3.5 2.5 6 2.5c2 0 4 1.5 5-1 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0zM11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0",
        k: "M22.5 11.63V6M20 8h5M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 0-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7zM11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"
    };

    const createPieceSVG = (type, color) => {
        const fill = color === 'w' ? '#E8E4D9' : '#4B535E';
        // Minimal stroke for definition, matching fill to look like a solid block or very subtle outline
        const stroke = color === 'w' ? '#4B535E' : '#E8E4D9'; 
        
        return `<svg viewBox="0 0 45 45" style="overflow: visible;">
            <path d="${svgPaths[type]}" 
                  fill="${fill}" 
                  stroke="${stroke}" 
                  stroke-width="1.5" 
                  stroke-linejoin="round" 
                  stroke-linecap="round" 
                  fill-rule="evenodd"/>
        </svg>`;
    };

    // --- Game Logic ---
    const initialBoard = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']
    ];

    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const boardEl = document.getElementById('board');
    const historyBody = document.getElementById('move-history');
    const turnDisplay = document.getElementById('turn-display');

    // Placeholder moves to demonstrate table structure
    const placeholderMoves = [
        { num: 1, w: 'e4', b: 'e5' },
        { num: 2, w: 'Nf3', b: 'Nc6' },
        { num: 3, w: 'Bb5', b: 'a6' },
        { num: 4, w: 'Ba4', b: 'Nf6' },
        { num: 5, w: 'O-O', b: 'Be7' }
    ];

    function renderHistory() {
        historyBody.innerHTML = '';
        placeholderMoves.forEach(move => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="move-num">${move.num}.</td>
                <td>${move.w}</td>
                <td>${move.b}</td>
            `;
            historyBody.appendChild(tr);
        });
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Coordinate Labels
                // Rank (1-8) on file 'a' (col 0)
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord coord-rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                
                // File (a-h) on rank 1 (row 7)
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord coord-file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Pieces
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const color = (row < 2) ? 'b' : 'w';
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = createPieceSVG(pieceCode, color);
                    square.appendChild(piece);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function resetBoard() {
        renderBoard();
        // Keep history, just reset pieces
    }

    function resetGame() {
        renderBoard();
        renderHistory();
        turnDisplay.innerHTML = '<div class="turn-dot"></div> White to Move';
        turnDisplay.classList.remove('black-turn');
    }

    // Initialize
    resetGame();

</script>
</body>
</html>
