<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess Interface</title>
    <style>
        :root {
            /* Palette: Deep Charcoal & Cream */
            --bg-body: #18181b; /* Zinc 950 - Almost black */
            --bg-panel: #27272a; /* Zinc 900 */
            --bg-panel-hover: #3f3f46;
            
            --text-main: #e4e4e7; /* Zinc 200 */
            --text-muted: #a1a1aa; /* Zinc 400 */
            
            /* Board Colors: High Contrast */
            --square-light: #e7e5e4; /* Stone 200 - Crisp Cream */
            --square-dark: #292524;  /* Stone 800 - Deep Charcoal */
            
            /* UI Accents */
            --accent-primary: #475569; /* Slate 600 - Muted Blue/Grey */
            --accent-hover: #64748b;
            
            /* Dimensions */
            --square-size: clamp(40px, 10vw, 80px);
            --board-size: calc(var(--square-size) * 8);
            --gutter-size: 24px;
            --radius-card: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Layout */
        .interface-container {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- The Chessboard Area --- */
        .board-container {
            position: relative;
            background: var(--bg-panel);
            padding: var(--gutter-size);
            border-radius: var(--radius-card);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            border: 2px solid var(--square-dark); /* Subtle border */
            border-radius: 2px;
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Board Palette */
        .square.light { background-color: var(--square-light); }
        .square.dark { background-color: var(--square-dark); }
        
        /* Coordinate Labels in Gutter */
        .coord-label {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }
        
        /* Ranks (1-8) on Left */
        .coord-rank {
            top: calc(var(--gutter-size) / 2 + var(--square-size) * 0.5 - 12px); 
            /* Calculation adjusted dynamically in JS or simplified via fixed positioning relative to container */
            /* Simplified approach: Place in gutter */
            left: 4px;
            top: 0;
            height: var(--square-size);
            width: 20px;
            justify-content: center;
        }

        /* Files (a-h) on Bottom */
        .coord-file {
            bottom: 4px;
            left: 0;
            width: var(--square-size);
            height: 20px;
        }

        /* Pieces */
        .piece {
            width: calc(var(--square-size) * 0.85);
            height: calc(var(--square-size) * 0.85);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
            /* High fidelity shadow for lift */
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3)) drop-shadow(0px 1px 1px rgba(0,0,0,0.2));
        }
        .piece:hover { transform: scale(1.1) translateY(-2px); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 320px;
            background: var(--bg-panel);
            border-radius: var(--radius-card);
            display: flex;
            flex-direction: column;
            height: calc(var(--board-size) + var(--gutter-size) * 2); 
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Header / Status */
        .panel-header {
            padding: 24px;
            background: var(--bg-panel);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        /* Turn Indicator: Dark Pill */
        .turn-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: var(--radius-card);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            width: 100%;
            background-color: #111113; /* Darker than panel */
            color: #f4f4f5;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 12px;
        }
        
        .turn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #22c55e; /* Green for active */
            margin-right: 8px;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .game-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: var(--bg-panel);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-family: "Courier New", Courier, monospace; /* Monospace per request */
            font-size: 0.95rem;
        }

        .history-table th {
            text-align: left;
            padding: 12px 24px;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            font-family: system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-table td {
            padding: 10px 24px;
            color: var(--text-main);
        }

        /* Zebra Striping */
        .history-table tbody tr:nth-child(odd) {
            background-color: rgba(255,255,255,0.02);
        }
        .history-table tbody tr:nth-child(even) {
            background-color: transparent;
        }

        /* Move number column */
        .history-table td:first-child { 
            color: var(--text-muted); 
            width: 40px; 
            text-align: right; 
            padding-right: 16px;
            font-size: 0.85rem;
        }

        /* Controls */
        .controls {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr; 
            gap: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: var(--bg-panel);
            flex-shrink: 0;
        }

        .btn {
            padding: 12px 16px;
            border-radius: var(--radius-card);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-family: system-ui, sans-serif;
            letter-spacing: 0.3px;
            border: none;
        }

        /* Primary: Slate Blue/Green */
        .btn-primary {
            background-color: var(--accent-primary);
            color: #f8fafc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn-primary:hover { 
            background-color: var(--accent-hover); 
            transform: translateY(-1px);
        }

        /* Secondary: Transparent/Outline */
        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
        }
        .btn-secondary:hover { 
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }

        @media (max-width: 850px) {
            .interface-container { flex-direction: column; gap: 24px; }
            .panel { width: var(--board-size); height: auto; max-height: 300px; }
            .controls { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        
        <!-- Board Section -->
        <div class="board-container">
            <!-- Coordinates Ranks (Left Gutter) -->
            <div id="ranks-container" style="position: absolute; left: 0; top: 24px; width: 24px; height: var(--board-size); display: flex; flex-direction: column;"></div>
            
            <!-- Coordinates Files (Bottom Gutter) -->
            <div id="files-container" style="position: absolute; bottom: 24px; left: 24px; width: var(--board-size); height: 24px; display: flex;"></div>

            <div class="chessboard" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <!-- Turn Indicator: Dark Background, Light Text -->
                <div class="turn-indicator" id="turn-text">
                    <div class="turn-dot"></div>
                    White to Move
                </div>
                <div class="game-meta">Standard • Round 1</div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="resetBoard()">New Game</button>
                <button class="btn btn-secondary" onclick="resetBoard()">Reset Board</button>
            </div>
        </div>

    </div>

    // --- Game State & Logic ---
    const initialBoardConfig = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black Back
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Black Pawns
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // White Pawns
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White Back
    ];

    const boardEl = document.getElementById('board');
    const historyBody = document.getElementById('move-history');
    const turnText = document.getElementById('turn-text');
    const ranksContainer = document.getElementById('ranks-container');
    const filesContainer = document.getElementById('files-container');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

    // Mock Data for the Scorecard
    const mockMoves = [
        { n: 1, w: 'e4', b: 'e5' },
        { n: 2, w: 'Nf3', b: 'Nc6' },
        { n: 3, w: 'Bb5', b: 'a6' },
        { n: 4, w: 'Ba4', b: 'Nf6' },
        { n: 5, w: 'O-O', b: 'Be7' },
        { n: 6, w: 'Re1', b: 'b5' },
        { n: 7, w: 'Bb3', b: 'd6' },
        { n: 8, w: 'c3', b: 'O-O' },
        { n: 9, w: 'h3', b: 'Nb8' },
        { n: 10, w: 'd4', b: 'Nbd7' },
        { n: 11, w: 'c4', b: 'c6' },
        { n: 12, w: 'cxb5', b: 'axb5' },
        { n: 13, w: 'Nc3', b: 'Bb7' },
        { n: 14, w: 'Bg5', b: 'b4' },
        { n: 15, w: 'Nb1', b: 'h6' }
    ];

    function renderCoordinates() {
        // Clear existing
        ranksContainer.innerHTML = '';
        filesContainer.innerHTML = '';

        // Render Ranks (1-8)
        for (let i = 0; i < 8; i++) {
            const label = document.createElement('div');
            label.className = 'coord-label coord-rank';
            label.innerText = 8 - i;
            label.style.height = 'var(--square-size)';
            ranksContainer.appendChild(label);
        }

        // Render Files (a-h)
        for (let i = 0; i < 8; i++) {
            const label = document.createElement('div');
            label.className = 'coord-label coord-file';
            label.innerText = files[i];
            label.style.width = 'var(--square-size)';
            filesContainer.appendChild(label);
        }
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Piece Placement
                const pieceCode = initialBoardConfig[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on standard setup rows
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function renderHistory() {
        historyBody.innerHTML = '';
        mockMoves.forEach(move => {
            const tr = document.createElement('tr');
            
            const tdNum = document.createElement('td');
            tdNum.innerText = move.n + '.';
            
            const tdWhite = document.createElement('td');
            tdWhite.innerText = move.w;
            
            const tdBlack = document.createElement('td');
            tdBlack.innerText = move.b;

            tr.appendChild(tdNum);
            tr.appendChild(tdWhite);
            tr.appendChild(tdBlack);
            historyBody.appendChild(tr);
        });
    }

    function resetBoard() {
        // Reset turn indicator
        turnText.innerHTML = '<div class="turn-dot"></div> White to Move';
        
        // Simple fade effect
        boardEl.style.opacity = '0.5';
        setTimeout(() => {
            renderBoard();
            renderHistory();
            boardEl.style.opacity = '1';
        }, 150);
    }

    // Initial Render
    renderCoordinates();
    renderBoard();
    renderHistory();

</script>
