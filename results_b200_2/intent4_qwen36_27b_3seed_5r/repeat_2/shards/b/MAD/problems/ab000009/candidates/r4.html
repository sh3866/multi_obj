<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Design System: Palette */
            --bg-body: #0f1115; /* Deepest Charcoal */
            --bg-panel: #161920; /* Slightly lighter for depth */
            --bg-panel-border: #2a2e39;
            
            /* Typography */
            --text-primary: #eef0f4;
            --text-secondary: #8b92a5;
            --text-muted: #4a5064;
            
            /* Board Palette: Warm & High Contrast */
            --board-light: #e8ebef; /* Cool Cream */
            --board-dark: #3b414d;  /* Deep Slate */
            --board-highlight: rgba(255, 255, 255, 0.1);
            
            /* UI Accents */
            --accent-active: #10b981; /* Muted Emerald */
            --btn-outline: #374151;
            
            /* Dimensions */
            --square-size: clamp(45px, 11vw, 85px);
            --board-size: calc(var(--square-size) * 8);
            --gutter: 28px;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Layout */
        .interface-container {
            display: flex;
            gap: 48px;
            align-items: center;
            justify-content: center;
            padding: 40px;
            max-width: 1400px;
        }

        /* --- The Chessboard Area --- */
        .board-wrapper {
            position: relative;
            padding: var(--gutter);
            background: var(--bg-panel);
            border-radius: var(--radius);
            box-shadow: 
                0 0 0 1px var(--bg-panel-border),
                0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            border: 4px solid var(--board-dark); /* Frame edge */
            border-radius: 2px;
            overflow: hidden;
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: default;
        }

        /* Board Palette */
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Coordinate Labels */
        .coord-label {
            position: absolute;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace; /* Monospace for grid alignment */
            pointer-events: none;
            z-index: 5;
        }

        /* Ranks (Left) */
        .coord-rank {
            left: 4px;
            top: 2px;
            color: var(--board-dark);
        }
        .square.dark .coord-rank { color: var(--board-light); opacity: 0.5; }

        /* Files (Bottom) */
        .coord-file {
            right: 4px;
            bottom: 2px;
            color: var(--board-light);
        }
        .square.dark .coord-file { color: var(--board-dark); opacity: 0.5; }

        /* Pieces */
        .piece {
            width: calc(var(--square-size) * 0.85);
            height: calc(var(--square-size) * 0.85);
            cursor: pointer;
            z-index: 2;
            /* Refined Shadow: Soft, diffuse lift */
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
            transition: transform 0.2s ease;
        }
        .piece:hover { transform: translateY(-2px) scale(1.05); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 340px;
            background: var(--bg-panel);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: calc(var(--board-size) + var(--gutter) * 2); 
            overflow: hidden;
            box-shadow: 
                0 0 0 1px var(--bg-panel-border),
                0 20px 40px -10px rgba(0,0,0,0.5);
        }

        /* Header / Status */
        .panel-header {
            padding: 28px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--bg-panel-border);
            flex-shrink: 0;
        }

        /* Turn Indicator: Minimalist */
        .turn-indicator {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }
        
        .turn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-active);
            margin-right: 12px;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); /* Soft glow ring */
        }

        .game-meta {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-panel);
            padding: 0;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.95rem;
        }

        .history-table th {
            text-align: left;
            padding: 16px 28px;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-transform: uppercase;
            font-family: -apple-system, sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--bg-panel-border);
        }

        .history-table td {
            padding: 12px 28px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .history-table tbody tr:hover td {
            background-color: rgba(255,255,255,0.03);
        }

        .history-table td:first-child { 
            color: var(--text-muted); 
            width: 45px; 
            text-align: right; 
            padding-right: 20px;
            font-size: 0.85rem;
        }

        /* Controls */
        .controls {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr; 
            gap: 12px;
            border-top: 1px solid var(--bg-panel-border);
            background: var(--bg-panel);
            flex-shrink: 0;
        }

        .btn {
            padding: 14px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-family: -apple-system, sans-serif;
            letter-spacing: 0.3px;
            border: none;
        }

        /* Secondary: Outline/Ghost Style */
        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--btn-outline);
        }
        .btn-secondary:hover { 
            color: var(--text-primary);
            border-color: var(--text-secondary);
            background: rgba(255,255,255,0.02);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }

        @media (max-width: 900px) {
            .interface-container { flex-direction: column; gap: 32px; padding: 20px; }
            .panel { width: calc(var(--square-size) * 8 + var(--gutter) * 2); height: auto; max-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        
        <!-- Board Section -->
        <div class="board-wrapper">
            <div class="chessboard" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="turn-indicator" id="turn-text">
                    <div class="turn-dot"></div>
                    White to Move
                </div>
                <div class="game-meta">Standard • New Game</div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Empty for new game -->
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="resetBoard()">Reset Board</button>
                <button class="btn btn-secondary" onclick="resetBoard()">New Game</button>
            </div>
        </div>

    </div>

    // --- Game State & Logic ---
    // Standard starting position
    const initialBoardConfig = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black Back
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Black Pawns
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // White Pawns
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White Back
    ];

    const boardEl = document.getElementById('board');
    const historyBody = document.getElementById('move-history');
    const turnText = document.getElementById('turn-text');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Coordinate Labels
                // Ranks (1-8) on the left edge (column 0)
                if (col === 0) {
                    const rankLabel = document.createElement('div');
                    rankLabel.className = 'coord-label coord-rank';
                    rankLabel.innerText = 8 - row;
                    square.appendChild(rankLabel);
                }
                
                // Files (a-h) on the bottom edge (row 7)
                if (row === 7) {
                    const fileLabel = document.createElement('div');
                    fileLabel.className = 'coord-label coord-file';
                    fileLabel.innerText = files[col];
                    square.appendChild(fileLabel);
                }

                // Piece Placement
                const pieceCode = initialBoardConfig[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on standard setup rows
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function resetBoard() {
        // Clear history
        historyBody.innerHTML = '';
        
        // Reset turn indicator
        turnText.innerHTML = '<div class="turn-dot"></div> White to Move';
        
        // Redraw board
        renderBoard();
    }

    // Initial Render
    resetBoard();

</script>
</body>
