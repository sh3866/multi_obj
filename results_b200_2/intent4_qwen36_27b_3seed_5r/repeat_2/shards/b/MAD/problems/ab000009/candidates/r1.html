<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Classic Chess</title>
    <style>
        :root {
            /* Palette: Modern Classic */
            --bg-body: #1a1a1a;
            --bg-panel: #242424;
            --text-primary: #E8E4D9;
            --text-secondary: #888888;
            --text-muted: #555555;
            
            /* Board Colors: High Contrast Charcoal/Cream */
            --board-dark: #2C2C2C;
            --board-light: #E8E4D9;
            
            /* Dimensions */
            --square-size: clamp(35px, 9vw, 70px);
            --board-size: calc(var(--square-size) * 8);
            --icon-size: calc(var(--square-size) * 0.85);
            
            /* Spacing & Radius */
            --radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Layout */
        .interface-container {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- The Chessboard --- */
        .board-wrapper {
            position: relative;
            /* Thin border for framing */
            border: 4px solid #333; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-size);
            height: var(--board-size);
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Flat, high-contrast palette */
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 700;
            pointer-events: none;
            line-height: 1;
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }

        /* Contrast handling for coordinates */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        /* Pieces */
        .piece {
            width: var(--icon-size);
            height: var(--icon-size);
            cursor: pointer;
            transition: transform 0.1s ease;
            /* Subtle drop shadow for depth without outline */
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));
            z-index: 2;
        }
        .piece:hover { transform: scale(1.1); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 320px;
            background: var(--bg-panel);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: var(--board-size); /* Match board height */
            overflow: hidden;
            border: 1px solid #333;
        }

        /* Header / Status */
        .panel-header {
            padding: 24px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .turn-indicator {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .game-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: var(--bg-panel);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .history-table th {
            text-align: left;
            padding: 12px 24px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            border-bottom: 1px solid #333;
        }

        .history-table td {
            padding: 10px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        
        .history-table tr:last-child td { border-bottom: none; }
        .history-table td:first-child { color: var(--text-secondary); width: 40px; text-align: right; margin-right: 10px; }

        /* Controls */
        .controls {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid #333;
            background: #2a2a2a;
            flex-shrink: 0;
        }

        .btn {
            padding: 12px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-family: inherit;
        }

        /* Primary: New Game (Warm Cream) */
        .btn-primary {
            background-color: var(--board-light);
            color: var(--board-dark);
            border: 1px solid var(--board-light);
        }
        .btn-primary:hover { 
            background-color: #fff; 
            border-color: #fff;
            transform: translateY(-1px);
        }

        /* Secondary: Reset (Ghost) */
        .btn-secondary {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-secondary);
        }
        .btn-secondary:hover { 
            border-color: var(--text-secondary); 
            color: var(--text-primary);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @media (max-width: 800px) {
            .interface-container { flex-direction: column; gap: 20px; }
            .panel { width: var(--board-size); height: auto; max-height: 300px; }
            .controls { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        
        <!-- Board Section -->
        <div class="board-wrapper">
            <div class="chessboard" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="turn-indicator" id="turn-text">White to Move</div>
                <div class="game-meta">Standard Chess • Round 1</div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Empty by default for new game -->
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="resetBoard()">Reset</button>
                <button class="btn btn-primary" onclick="resetBoard()">New Game</button>
            </div>
        </div>

    </div>

<script>

    // --- Game State & Logic ---
    // Standard starting position (FEN logic mapped to array)
    // 'r' = Rook, 'n' = Knight, 'b' = Bishop, 'q' = Queen, 'k' = King, 'p' = Pawn
    const initialBoardConfig = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black Back
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Black Pawns
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // White Pawns
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White Back
    ];

    const boardEl = document.getElementById('board');
    const historyBody = document.getElementById('move-history');
    const turnText = document.getElementById('turn-text');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Coordinates
                // Ranks (1-8) on the left side (col 0)
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                // Files (a-h) on the bottom row (row 7)
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Piece Placement
                const pieceCode = initialBoardConfig[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on standard setup rows
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function resetBoard() {
        // Clear history
        historyBody.innerHTML = '';
        // Reset turn indicator
        turnText.innerText = "White to Move";
        
        // Simple fade effect
        boardEl.style.opacity = '0.5';
        setTimeout(() => {
            renderBoard();
            boardEl.style.opacity = '1';
        }, 150);
    }

    // Initial Render
    renderBoard();

</script>
