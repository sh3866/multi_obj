<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-surface: #0f1016;
            --primary-gold: #cfaa68;
            --primary-gold-dim: #8a703e;
            --accent-glow: #e0c080;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(15, 16, 22, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND & ATMOSPHERE --- */
        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 90%);
            z-index: 1;
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* --- UI LAYOUT --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            justify-content: space-between;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
            animation: fadeInDown 1s ease-out;
        }

        .game-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: transparent;
            background: linear-gradient(to bottom, #fff 30%, var(--primary-gold) 100%);
            -webkit-background-clip: text;
            text-shadow: 0 0 20px rgba(207, 170, 104, 0.3);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(207, 170, 104, 0.1);
            border: 1px solid rgba(207, 170, 104, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .currency-pill:hover {
            transform: scale(1.05);
            border-color: var(--primary-gold);
        }

        .gold-icon {
            width: 18px;
            height: 18px;
            fill: var(--primary-gold);
            filter: drop-shadow(0 0 5px var(--primary-gold));
        }

        .gold-amount {
            font-family: 'Times New Roman', serif;
            font-size: 1.1rem;
            color: var(--primary-gold);
            font-weight: bold;
        }

        /* --- HERO AREA (THE SPHERE) --- */
        .hero-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .spirit-orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4a5568, #000);
            box-shadow: 
                0 0 30px rgba(100, 116, 139, 0.2),
                inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        .spirit-orb::after {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: pulse 4s ease-in-out infinite alternate;
        }

        /* --- MAIN MENU --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .menu-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            height: 140px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-gold-dim);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .menu-card:hover::before {
            opacity: 1;
        }

        .menu-card:hover .card-icon {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px var(--primary-gold));
        }

        .card-icon {
            width: 32px;
            height: 32px;
            fill: var(--text-main);
            transition: all 0.3s;
        }

        .card-label {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-main);
            z-index: 2;
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            z-index: 2;
            margin-top: 4px;
        }

        /* Special styling for the primary action (Summon) */
        .menu-card.primary {
            grid-column: span 2;
            height: 90px;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: linear-gradient(90deg, rgba(207, 170, 104, 0.1) 0%, rgba(15, 16, 22, 0.8) 100%);
            border-color: rgba(207, 170, 104, 0.2);
        }

        .menu-card.primary:hover {
            border-color: var(--primary-gold);
            background: linear-gradient(90deg, rgba(207, 170, 104, 0.2) 0%, rgba(15, 16, 22, 0.9) 100%);
        }

        /* --- DECORATIVE ELEMENTS --- */
        .corner-deco {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-color);
            z-index: 5;
            opacity: 0.5;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 700px) {
            .game-title { font-size: 2.5rem; margin-bottom: 0.2rem; }
            .game-subtitle { margin-bottom: 1rem; }
            .spirit-orb { width: 120px; height: 120px; }
            .menu-card { height: 100px; padding: 1rem; }
            .menu-card.primary { height: 70px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="canvas-layer"></canvas>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <!-- DECORATIVE CORNERS -->
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA -->
        <div class="hero-area">
            <div class="spirit-orb"></div>
        </div>

        <!-- MENU GRID -->
        <nav class="menu-grid">
            
            <!-- Primary Action -->
            <div class="menu-card primary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/>
                </svg>
                <div>
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div>
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
                </svg>
                <div>
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 1.07V9h7c0-3.87-3.13-7-7-7zm-2 1v8h-1v1h1v1h1v-1h1v-1h-1v-1h1V2h-1v1h-1V2.07zM19 11h-6v2h6v-2zm0 4h-6v2h6v-2zm-8-6h-6v2h6v-2zm0 4H5v2h6v-2z"/>
                </svg>
                <div>
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Uses a simple particle system to create a floating dust/ember effect.
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Configuration
        const particleCount = 60;
        const connectionDistance = 100;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                ctx.fillStyle = `rgba(200, 200, 200, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Draw faint connections
            ctx.strokeStyle = 'rgba(200, 200, 200, 0.03)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < connectionDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Simple Interaction: Mouse parallax on the Orb
        const orb = document.querySelector('.spirit-orb');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 50;
            const y = (window.innerHeight - e.pageY * 2) / 50;
            
            orb.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
