<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #030305;
            --bg-card: rgba(20, 20, 25, 0.6);
            --gold-primary: #eebb55;
            --gold-dark: #8a6a25;
            --gold-dim: #4a3b1a;
            --text-light: #f0f0f0;
            --text-muted: #8892b0;
            --accent-glow: rgba(238, 187, 85, 0.15);
            --border-light: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(238, 187, 85, 0.3);
            --font-display: 'Times New Roman', 'Didot', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- BACKGROUND FX --- */
        #noise-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.07;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, transparent 0%, #000 120%);
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(30, 40, 60, 0.3) 0%, transparent 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        /* --- LAYOUT --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 3rem 1.5rem;
            justify-content: space-between;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-out;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            background: linear-gradient(180deg, #fff 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
        }

        .game-subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold-dim);
            padding: 6px 14px;
            border-radius: 100px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .currency-pill:active {
            transform: scale(0.95);
        }

        .coin-icon {
            width: 18px;
            height: 18px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 4px var(--gold-primary));
        }

        .currency-val {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--gold-primary);
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        /* --- HERO (THE PORTAL) --- */
        .hero-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
        }

        /* The Summoning Circle */
        .circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .magic-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            animation: rotateRing 20s linear infinite;
        }

        .magic-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px dashed var(--gold-dim);
            opacity: 0.3;
            animation: rotateRing 10s linear infinite reverse;
        }

        .magic-ring::after {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            border-top: 1px solid var(--gold-primary);
            border-bottom: 1px solid transparent;
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
            opacity: 0.4;
            filter: blur(2px);
            animation: rotateRing 15s linear infinite;
        }

        /* The Orb */
        .spirit-orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a35, #000);
            box-shadow: 
                inset 10px 10px 20px rgba(255,255,255,0.05),
                inset -10px -10px 20px rgba(0,0,0,0.8),
                0 0 40px rgba(20, 20, 30, 0.5);
            position: relative;
            z-index: 2;
            animation: float 6s ease-in-out infinite;
        }

        .orb-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
        }

        /* --- MENU --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            height: 120px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            pointer-events: none;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.2);
            background: rgba(30, 30, 40, 0.7);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .menu-card:hover .card-icon {
            color: #fff;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        .card-icon {
            width: 28px;
            height: 28px;
            fill: var(--text-muted);
            transition: all 0.3s;
            margin-bottom: 0.5rem;
        }

        .card-content {
            z-index: 2;
            text-align: left;
        }

        .card-label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Primary Action Card */
        .menu-card.primary {
            grid-column: span 2;
            height: 90px;
            flex-direction: row;
            align-items: center;
            padding: 0 1.5rem;
            background: linear-gradient(90deg, rgba(238, 187, 85, 0.08) 0%, rgba(20, 20, 25, 0.8) 100%);
            border-color: var(--border-gold);
        }

        .menu-card.primary:hover {
            background: linear-gradient(90deg, rgba(238, 187, 85, 0.15) 0%, rgba(20, 20, 25, 0.9) 100%);
            border-color: var(--gold-primary);
        }

        .menu-card.primary .card-icon {
            fill: var(--gold-primary);
            margin-bottom: 0;
            margin-right: 1rem;
        }
        
        .menu-card.primary .card-label {
            color: #fff;
        }

        /* --- DECORATIVE CORNERS --- */
        .corner-deco {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 5;
            pointer-events: none;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* --- ANIMATIONS --- */
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 700px) {
            .game-title { font-size: 2.8rem; }
            .game-subtitle { margin-bottom: 0.8rem; }
            .circle-container { width: 180px; height: 180px; }
            .spirit-orb { width: 110px; height: 110px; }
            .menu-card { height: 100px; }
            .menu-card.primary { height: 80px; }
            .app-container { padding-top: 2rem; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="noise-canvas"></canvas>
    <div class="ambient-glow"></div>
    <div class="vignette"></div>

    <!-- DECORATIVE CORNERS -->
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </header>

        <!-- HERO AREA -->
        <div class="hero-area">
            <div class="circle-container">
                <div class="magic-ring"></div>
                <div class="spirit-orb" id="orb">
                    <div class="orb-glow"></div>
                </div>
            </div>
        </div>

        <!-- MENU GRID -->
        <nav class="menu-grid">
            
            <!-- Primary Action -->
            <div class="menu-card primary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 1.07V9h7c0-3.87-3.13-7-7-7zm-2 1v8h-1v1h1v1h1v-1h1v-1h-1v-1h1V2h-1v1h-1V2.07zM19 11h-6v2h6v-2zm0 4h-6v2h6v-2zm-8-6h-6v2h6v-2zm0 4H5v2h6v-2z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC NOISE & PARTICLE ANIMATION
         * Creates a grainy texture and floating embers.
         */
        const canvas = document.getElementById('noise-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const particleCount = 40;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.5;
                this.life = Math.random() * 100;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                // Fade in/out
                if (this.life < 20) this.alpha -= 0.02;
                else if (this.life > 80) this.alpha += 0.02;
                
                if (this.life <= 0 || this.alpha <= 0) this.reset();
            }
            
            draw() {
                ctx.fillStyle = `rgba(255, 220, 150, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            // Clear with slight transparency for trail effect (optional, but clean clear is better here)
            ctx.clearRect(0, 0, width, height);
            
            // Draw Noise (Static grain)
            // We only redraw noise occasionally or use a static image to save performance.
            // Here we just draw particles for the "living" atmosphere.
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Parallax Orb
        const orb = document.getElementById('orb');
        const circleContainer = document.querySelector('.circle-container');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 80;
            const y = (window.innerHeight - e.pageY * 2) / 80;
            
            // Move the orb slightly
            orb.style.transform = `translate(${x}px, ${y}px)`;
            
            // Tilt the container slightly
            circleContainer.style.transform = `rotateY(${x/2}deg) rotateX(${-y/2}deg)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            orb.style.transform = `translate(0px, 0px)`;
            circleContainer.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

    </script>
</body>
</html>
