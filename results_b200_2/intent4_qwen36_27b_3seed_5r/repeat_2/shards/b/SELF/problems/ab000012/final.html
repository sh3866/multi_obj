<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #020204;
            --bg-panel: rgba(10, 12, 16, 0.75);
            --bg-panel-hover: rgba(18, 20, 25, 0.9);
            
            --gold-100: #f4e4bc;
            --gold-500: #c5a059;
            --gold-900: #5e4b20;
            
            --text-main: #e0e0e0;
            --text-muted: #6b707c;
            
            --glow-soft: 0 0 20px rgba(197, 160, 89, 0.15);
            --glow-intense: 0 0 40px rgba(197, 160, 89, 0.3);
            
            --font-display: 'Cinzel', 'Times New Roman', serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERE --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 20%, #000000 100%);
            z-index: 1;
            pointer-events: none;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
        }

        /* --- UI CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            /* Fade edges */
            mask-image: linear-gradient(to bottom, transparent, black 8%, black 92%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 8%, black 92%, transparent);
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 0.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeDown 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--gold-100);
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.4);
            margin-bottom: 0.5rem;
            position: relative;
            margin-left: 0.4em; /* Counteract letter spacing */
        }

        .game-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.6em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            text-indent: 0.6em;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(10,10,12,0.8) 50%, rgba(0,0,0,0) 100%);
            padding: 8px 24px;
            position: relative;
        }

        /* Decorative brackets for currency */
        .currency-pill::before, .currency-pill::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            border: 1px solid var(--gold-500);
        }
        .currency-pill::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .currency-pill::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }

        .coin-icon {
            width: 18px;
            height: 18px;
            fill: var(--gold-500);
            filter: drop-shadow(0 0 3px var(--gold-500));
        }

        .currency-val {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--gold-100);
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* --- HERO (THE PORTAL) --- */
        .hero-area {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 800px;
            margin-bottom: 2rem;
            min-height: 300px;
        }

        .circle-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            animation: breathe 8s ease-in-out infinite;
        }

        /* The Portal Rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(197, 160, 89, 0.15);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .ring-outer {
            width: 100%; height: 100%;
            border-style: dashed;
            animation: rotateRing 40s linear infinite;
        }

        .ring-middle {
            width: 80%; height: 80%;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-top-color: transparent;
            border-bottom-color: transparent;
            animation: rotateRing 25s linear infinite reverse;
        }

        .ring-inner {
            width: 60%; height: 60%;
            border: 2px solid rgba(197, 160, 89, 0.5);
            border-left-color: transparent;
            border-right-color: transparent;
            animation: rotateRing 15s linear infinite;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.1);
        }

        /* The Orb */
        .spirit-orb {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            position: relative;
            z-index: 2;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,1),
                0 0 30px rgba(0,0,0,0.8);
            animation: float 6s ease-in-out infinite;
            overflow: hidden;
        }

        /* Inner Energy */
        .orb-core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, var(--gold-500) 0%, transparent 70%);
            filter: blur(8px);
            opacity: 0.8;
            animation: pulseCore 4s ease-in-out infinite;
        }
        
        /* Specular Highlight */
        .orb-core::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent 60%);
        }

        /* --- MENU GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            padding-bottom: 2rem;
            animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s backwards;
        }

        .menu-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 110px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(8px);
        }

        /* Hover Effect: Reveal Border & Lift */
        .menu-card:hover {
            transform: translateY(-4px);
            background: var(--bg-panel-hover);
            border-color: rgba(197, 160, 89, 0.3);
            box-shadow: var(--glow-soft);
        }

        .menu-card:hover .card-icon {
            fill: var(--gold-100);
            transform: scale(1.1);
        }

        .card-icon {
            width: 28px;
            height: 28px;
            fill: var(--text-muted);
            transition: all 0.4s;
            margin-bottom: 0.8rem;
        }

        .card-content {
            z-index: 2;
            text-align: left;
        }

        .card-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Primary Action Card (Summon) */
        .menu-card.primary {
            grid-column: span 2;
            height: 90px;
            flex-direction: row;
            align-items: center;
            padding: 0 2rem;
            background: linear-gradient(90deg, rgba(197, 160, 89, 0.08) 0%, rgba(10, 10, 12, 0.75) 100%);
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        .menu-card.primary:hover {
            background: linear-gradient(90deg, rgba(197, 160, 89, 0.15) 0%, rgba(18, 18, 25, 0.9) 100%);
            border-color: var(--gold-500);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.15);
        }

        .menu-card.primary .card-icon {
            fill: var(--gold-500);
            width: 32px;
            height: 32px;
            margin-bottom: 0;
            margin-right: 1.5rem;
        }

        /* Decorative Corner Accents */
        .deco-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 20;
            pointer-events: none;
        }
        .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
        .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
        .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
        .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

        /* --- ANIMATIONS --- */
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes pulseCore {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 700px) {
            .game-title { font-size: 2.2rem; }
            .circle-container { width: 240px; height: 240px; }
            .spirit-orb { width: 100px; height: 100px; }
            .menu-card { height: 90px; padding: 1rem; }
            .hero-area { margin-bottom: 1rem; min-height: 200px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <!-- DECORATIVE UI -->
    <div class="deco-corner tl"></div>
    <div class="deco-corner tr"></div>
    <div class="deco-corner bl"></div>
    <div class="deco-corner br"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </header>

        <!-- HERO AREA -->
        <div class="hero-area">
            <div class="circle-container">
                <div class="ring ring-outer"></div>
                <div class="ring ring-middle"></div>
                <div class="ring ring-inner"></div>
                <div class="spirit-orb" id="orb">
                    <div class="orb-core"></div>
                </div>
            </div>
        </div>

        <!-- MENU GRID -->
        <nav class="menu-grid">
            
            <!-- Primary Action -->
            <div class="menu-card primary">
                <!-- Triangle Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 22h20L12 2zm0 3.5L18.5 20H5.5L12 5.5z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="menu-card">
                <!-- User Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage Spirits</div>
                </div>
            </div>

            <div class="menu-card">
                <!-- Trophy/Clash Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.2 2H3.8C2.8 2 2 2.8 2 3.8V8c0 4.5 3.5 8.2 8 8.9V22h-2v2h12v-2h-2v-5.1c4.5-.7 8-4.4 8-8.9V3.8c0-1-.8-1.8-1.8-1.8zM4 8V4h16v4c0 3.5-3.1 6.4-6.6 6.7L12 14.9l-1.4-.2C7.1 14.4 4 11.5 4 8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <div class="menu-card">
                <!-- List/Grind Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC CANVAS
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const particleCount = 60; // Reduced count for elegance
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 20;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = -(Math.random() * 0.4 + 0.1);
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = 0;
                this.fadeSpeed = Math.random() * 0.002 + 0.001;
                this.maxAlpha = Math.random() * 0.4 + 0.1;
                // Gold color
                this.color = `rgba(197, 160, 89,`; 
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.alpha < this.maxAlpha) this.alpha += this.fadeSpeed;
                
                if (this.y < height * 0.4) {
                    this.alpha -= this.fadeSpeed * 1.5;
                }

                if (this.y < -20 || this.alpha < 0) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `${this.color}${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Parallax Orb
        const orb = document.getElementById('orb');
        const circleContainer = document.querySelector('.circle-container');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 150;
            const y = (window.innerHeight - e.pageY * 2) / 150;
            
            orb.style.transform = `translate(${x}px, ${y}px)`;
            circleContainer.style.transform = `rotateY(${x/3}deg) rotateX(${-y/3}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            orb.style.transform = `translate(0px, 0px)`;
            circleContainer.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

    </script>
</body>
</html>
