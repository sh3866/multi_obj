<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #020203;
            --bg-panel: rgba(20, 20, 25, 0.4);
            --gold-light: #fdf5b7;
            --gold-primary: #eebb55;
            --gold-dark: #8a6a25;
            --gold-dim: #3d2e10;
            --text-white: #ffffff;
            --text-grey: #8b9bb4;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(238, 187, 85, 0.4);
            --font-display: 'Times New Roman', 'Didot', 'Georgia', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-white);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */
        #atmosphere-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, transparent 0%, #000000 110%);
            z-index: 1;
            pointer-events: none;
        }

        /* --- MAIN CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            justify-content: space-between;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 1rem;
            animation: fadeDown 1s ease-out;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 3.2rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: transparent;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 60%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(238, 187, 85, 0.2);
            margin-bottom: 0.3rem;
            position: relative;
            display: inline-block;
        }
        
        /* Decorative line under title */
        .game-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            opacity: 0.5;
        }

        .game-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.5em;
            color: var(--text-grey);
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.8;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, rgba(0,0,0,0.6) 0%, rgba(20,15,5,0.8) 50%, rgba(0,0,0,0.6) 100%);
            border: 1px solid var(--gold-dim);
            padding: 6px 16px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            margin: 0.8rem auto 0;
            width: fit-content;
            position: relative;
            overflow: hidden;
        }

        /* Corner accents on currency */
        .currency-pill::before, .currency-pill::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            border: 1px solid var(--gold-primary);
            transition: all 0.3s;
        }
        .currency-pill::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .currency-pill::after { bottom: 0; right: 0; border-left: none; border-top: none; }

        .coin-icon {
            width: 16px;
            height: 16px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 3px var(--gold-primary));
        }

        .currency-val {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--gold-light);
            letter-spacing: 0.05em;
        }

        /* --- HERO (THE PORTAL) --- */
        .hero-area {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 800px;
        }

        /* The Summoning Circle Container */
        .circle-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Magic Ring */
        .magic-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            animation: rotateRing 30s linear infinite;
        }

        /* Inner Dashed Ring */
        .magic-ring::before {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px dashed var(--gold-dim);
            opacity: 0.4;
            animation: rotateRing 20s linear infinite reverse;
        }

        /* Glowing Arc */
        .magic-ring::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--gold-primary);
            border-right-color: var(--gold-primary);
            opacity: 0.6;
            filter: blur(1px);
            animation: rotateRing 10s linear infinite;
            box-shadow: 0 0 15px var(--gold-primary);
        }

        /* The Orb */
        .spirit-orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a3a45, #0a0a0f);
            box-shadow: 
                inset 10px 10px 20px rgba(255,255,255,0.05),
                inset -10px -10px 20px rgba(0,0,0,0.9),
                0 0 30px rgba(0,0,0,0.8),
                0 0 10px rgba(238, 187, 85, 0.1); /* Subtle gold glow */
            position: relative;
            z-index: 2;
            animation: float 6s ease-in-out infinite;
        }

        /* Inner Light of Orb */
        .orb-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 3;
        }

        /* --- MENU GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            margin-top: auto;
            padding-bottom: 1rem;
            animation: fadeUp 1s ease-out 0.2s backwards;
        }

        .menu-card {
            background: linear-gradient(145deg, rgba(30,30,35,0.6) 0%, rgba(10,10,12,0.8) 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            height: 110px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(5px);
        }

        /* Subtle sheen on cards */
        .menu-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        .menu-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.2);
            background: linear-gradient(145deg, rgba(40,40,45,0.8) 0%, rgba(15,15,18,0.9) 100%);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .menu-card:hover .card-icon {
            color: #fff;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
        }

        .card-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-grey);
            transition: all 0.3s;
            margin-bottom: 0.5rem;
        }

        .card-content {
            z-index: 2;
            text-align: left;
        }

        .card-label {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-white);
            margin-bottom: 2px;
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: var(--text-grey);
            opacity: 0.7;
        }

        /* Primary Action Card (Summon) */
        .menu-card.primary {
            grid-column: span 2;
            height: 80px;
            flex-direction: row;
            align-items: center;
            padding: 0 1.5rem;
            background: linear-gradient(90deg, rgba(60, 50, 20, 0.2) 0%, rgba(20, 20, 25, 0.6) 100%);
            border-color: var(--border-gold);
        }

        .menu-card.primary:hover {
            background: linear-gradient(90deg, rgba(60, 50, 20, 0.4) 0%, rgba(30, 30, 35, 0.8) 100%);
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(238, 187, 85, 0.1);
        }

        .menu-card.primary .card-icon {
            fill: var(--gold-primary);
            width: 28px;
            height: 28px;
            margin-bottom: 0;
            margin-right: 1rem;
        }

        /* --- DECORATIVE UI --- */
        .corner-deco {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 5;
            pointer-events: none;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* --- ANIMATIONS --- */
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 700px) {
            .game-title { font-size: 2.5rem; }
            .game-subtitle { font-size: 0.6rem; margin-bottom: 0.5rem; }
            .circle-container { width: 180px; height: 180px; }
            .spirit-orb { width: 100px; height: 100px; }
            .menu-card { height: 90px; }
            .app-container { padding-top: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND FX -->
    <canvas id="atmosphere-canvas"></canvas>
    <div class="vignette"></div>

    <!-- DECORATIVE CORNERS -->
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </header>

        <!-- HERO AREA -->
        <div class="hero-area">
            <div class="circle-container">
                <div class="magic-ring"></div>
                <div class="spirit-orb" id="orb">
                    <div class="orb-glow"></div>
                </div>
            </div>
        </div>

        <!-- MENU GRID -->
        <nav class="menu-grid">
            
            <!-- Primary Action -->
            <div class="menu-card primary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 1.07V9h7c0-3.87-3.13-7-7-7zm-2 1v8h-1v1h1v1h1v-1h1v-1h-1v-1h1V2h-1v1h-1V2.07zM19 11h-6v2h6v-2zm0 4h-6v2h6v-2zm-8-6h-6v2h6v-2zm0 4H5v2h6v-2z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC NOISE & PARTICLE ANIMATION
         */
        const canvas = document.getElementById('atmosphere-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const particleCount = 50;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
                // Randomize start position so they don't all spawn at once
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = -(Math.random() * 0.5 + 0.2); // Move upwards
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5;
                this.fadeSpeed = Math.random() * 0.005 + 0.002;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Fade in and out
                if (this.y < height * 0.8) this.alpha += this.fadeSpeed;
                if (this.y < height * 0.2) this.alpha -= this.fadeSpeed;

                // Reset if out of bounds or invisible
                if (this.y < -10 || this.alpha < 0) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `rgba(255, 220, 150, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Parallax Orb
        const orb = document.getElementById('orb');
        const circleContainer = document.querySelector('.circle-container');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            // Move the orb slightly
            orb.style.transform = `translate(${x}px, ${y}px)`;
            
            // Tilt the container slightly
            circleContainer.style.transform = `rotateY(${x/2}deg) rotateX(${-y/2}deg)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            orb.style.transform = `translate(0px, 0px)`;
            circleContainer.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

    </script>
</body>
</html>
