<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette: Deep Void & Ethereal Gold */
            --bg-deep: #030305;
            --bg-surface: #0e0e12;
            --bg-surface-hover: #16161d;
            
            --gold-primary: #d4af37;
            --gold-light: #fcf6ba;
            --gold-dark: #8a6e2f;
            --gold-dim: #4a3e1a;
            
            --text-primary: #e0e0e0;
            --text-secondary: #8899a6;
            --text-dim: #444c56;
            
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(212, 175, 55, 0.3);
            
            /* Typography */
            --font-display: 'Cinzel', 'Times New Roman', serif; /* Fallback to serif if Cinzel not found */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERE --- */
        #atmosphere-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, transparent 0%, #000000 120%);
            z-index: 1;
            pointer-events: none;
        }

        /* --- LAYOUT --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px; /* Mobile-first width constraint */
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 0.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeDown 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold-primary);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            margin-bottom: 0.2rem;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            color: var(--text-secondary);
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 1rem;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold-dim);
            padding: 6px 14px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Decorative corners */
        .currency-pill::before, .currency-pill::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold-primary);
            transition: all 0.3s;
        }
        .currency-pill::before { top: -1px; left: -1px; border-right: 1px solid var(--gold-primary); border-bottom: 1px solid var(--gold-primary); }
        .currency-pill::after { bottom: -1px; right: -1px; border-left: 1px solid var(--gold-primary); border-top: 1px solid var(--gold-primary); }

        .coin-icon {
            width: 18px;
            height: 18px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 2px var(--gold-primary));
        }

        .currency-val {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--gold-light);
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* --- HERO (THE PORTAL) --- */
        .hero-area {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
            margin-bottom: 1rem;
        }

        .circle-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breathe 8s ease-in-out infinite;
        }

        /* Outer Ring */
        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            animation: rotateRing 40s linear infinite;
        }
        
        /* Decorative Arcs */
        .ring-outer::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px dashed rgba(212, 175, 55, 0.15);
            animation: rotateRing 60s linear infinite reverse;
        }

        .ring-inner-glow {
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1), inset 0 0 20px rgba(212, 175, 55, 0.05);
            animation: rotateRing 20s linear infinite;
        }

        /* The Orb */
        .spirit-orb {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a35, #050508);
            box-shadow: 
                inset 10px 10px 20px rgba(255,255,255,0.03),
                inset -10px -10px 20px rgba(0,0,0,0.9),
                0 0 30px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
            animation: float 6s ease-in-out infinite;
        }

        /* Inner Core Light */
        .orb-core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            filter: blur(4px);
        }

        /* --- MENU GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            padding-bottom: 1rem;
            animation: fadeUp 1s ease-out 0.3s backwards;
        }

        .menu-card {
            background: linear-gradient(160deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Sheen effect */
        .menu-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(105deg, rgba(255,255,255,0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        .menu-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
            background: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .menu-card:hover .card-icon {
            color: #fff;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
        }

        .card-icon {
            width: 22px;
            height: 22px;
            fill: var(--text-secondary);
            transition: all 0.3s;
            margin-bottom: 0.5rem;
        }

        .card-content {
            z-index: 2;
            text-align: left;
        }

        .card-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 3px;
            letter-spacing: 0.02em;
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Primary Action Card */
        .menu-card.primary {
            grid-column: span 2;
            height: 75px;
            flex-direction: row;
            align-items: center;
            padding: 0 1.5rem;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.08) 0%, rgba(20, 20, 25, 0.4) 100%);
            border-color: var(--border-glow);
        }

        .menu-card.primary:hover {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.15) 0%, rgba(30, 30, 35, 0.6) 100%);
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .menu-card.primary .card-icon {
            fill: var(--gold-primary);
            width: 26px;
            height: 26px;
            margin-bottom: 0;
            margin-right: 1rem;
        }

        /* --- DECORATIVE UI --- */
        .corner-deco {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 5;
            pointer-events: none;
        }
        .tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* --- ANIMATIONS --- */
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 700px) {
            .game-title { font-size: 2.2rem; }
            .game-subtitle { display: none; }
            .circle-container { width: 200px; height: 200px; }
            .spirit-orb { width: 100px; height: 100px; }
            .menu-card { height: 85px; padding: 1rem; }
            .app-container { padding-top: 1rem; }
            .hero-area { margin-bottom: 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND FX -->
    <canvas id="atmosphere-canvas"></canvas>
    <div class="vignette"></div>

    <!-- DECORATIVE CORNERS -->
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 7v10M9 10c0-1.1.9-2 2-2h2c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2h-2c-1.1 0-2-.9-2-2V10z" fill="currentColor"/>
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </header>

        <!-- HERO AREA -->
        <div class="hero-area">
            <div class="circle-container">
                <div class="ring-outer"></div>
                <div class="ring-inner-glow"></div>
                <div class="spirit-orb" id="orb">
                    <div class="orb-core"></div>
                </div>
            </div>
        </div>

        <!-- MENU GRID -->
        <nav class="menu-grid">
            
            <!-- Primary Action -->
            <div class="menu-card primary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l-5.5 9h11z"/>
                    <path d="M12 22l5.5-9h-11z" opacity="0.5"/>
                    <path d="M2 12h20" stroke="currentColor" stroke-width="1" opacity="0.3"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage spirits</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Arena</div>
                </div>
            </div>

            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 1.07V9h7c0-3.87-3.13-7-7-7zm-2 1v8h-1v1h1v1h1v-1h1v-1h-1v-1h1V2h-1v1h-1V2.07zM19 11h-6v2h6v-2zm0 4h-6v2h6v-2zm-8-6h-6v2h6v-2zm0 4H5v2h6v-2z"/>
                </svg>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC NOISE & PARTICLE ANIMATION
         */
        const canvas = document.getElementById('atmosphere-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const particleCount = 60;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
                // Randomize start position so they don't all spawn at once
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = -(Math.random() * 0.4 + 0.1); // Move upwards slowly
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = 0;
                this.fadeSpeed = Math.random() * 0.003 + 0.001;
                this.maxAlpha = Math.random() * 0.4 + 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Fade in
                if (this.alpha < this.maxAlpha) this.alpha += this.fadeSpeed;
                
                // Fade out near top
                if (this.y < height * 0.3) {
                    this.alpha -= this.fadeSpeed * 2;
                }

                // Reset if out of bounds or invisible
                if (this.y < -10 || this.alpha < 0) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Parallax Orb
        const orb = document.getElementById('orb');
        const circleContainer = document.querySelector('.circle-container');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 120;
            const y = (window.innerHeight - e.pageY * 2) / 120;
            
            // Move the orb slightly
            orb.style.transform = `translate(${x}px, ${y}px)`;
            
            // Tilt the container slightly
            circleContainer.style.transform = `rotateY(${x/2}deg) rotateX(${-y/2}deg)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            orb.style.transform = `translate(0px, 0px)`;
            circleContainer.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

    </script>
</body>
</html>
