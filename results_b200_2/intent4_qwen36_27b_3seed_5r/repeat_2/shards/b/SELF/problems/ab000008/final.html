<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-bg: #050014;
            --c-grid: rgba(255, 0, 255, 0.3);
            --c-sun-top: #ffcc00;
            --c-sun-bot: #ff0055;
            --c-pink: #ff00ff;
            --c-cyan: #00ffff;
            --c-green: #00ff66;
            --c-yellow: #ffee00;
            --c-white: #ffffff;
            
            /* Font stack for that chunky retro feel */
            --font-main: 'Arial Black', 'Impact', sans-serif;
            --font-mono: 'Courier New', monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 800px; /* Deep perspective for 3D */
        }

        /* --- 1. THE ATMOSPHERE (Canvas) --- */
        #scene-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- 2. THE SUN --- */
        .retro-sun {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--c-sun-top) 0%, var(--c-sun-bot) 100%);
            z-index: 2;
            /* The classic "blinds" effect */
            -webkit-mask-image: linear-gradient(to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 48%,
                black 48%, black 55%,
                transparent 55%, transparent 58%,
                black 58%, black 65%,
                transparent 65%, transparent 68%,
                black 68%, black 75%,
                transparent 75%, transparent 78%,
                black 78%, black 100%
            );
            mask-image: linear-gradient(to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 48%,
                black 48%, black 55%,
                transparent 55%, transparent 58%,
                black 58%, black 65%,
                transparent 65%, transparent 68%,
                black 68%, black 75%,
                transparent 75%, transparent 78%,
                black 78%, black 100%
            );
            box-shadow: 0 0 100px rgba(255, 0, 85, 0.6);
            animation: sunPulse 4s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% { transform: translateX(-50%) scale(1); filter: brightness(1); }
            100% { transform: translateX(-50%) scale(1.05); filter: brightness(1.2); }
        }

        /* --- 3. THE HIGHWAY (Visual Focus) --- */
        .highway-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -20%) perspective(600px) rotateX(65deg);
            width: 500px;
            height: 1000px; /* Long runway */
            z-index: 3;
            pointer-events: none;
            /* Fade out the top of the highway into the horizon */
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 100%);
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 20, 0.6);
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-cyan);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.1);
            display: flex;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 1px dashed rgba(255, 255, 255, 0.2);
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 150px; /* Where notes are hit */
            left: 0;
            width: 100%;
            height: 6px;
            background: #fff;
            box-shadow: 0 0 15px #fff, 0 0 30px var(--c-cyan);
            z-index: 10;
        }

        /* Receptors (The keys) */
        .receptor {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            background: rgba(0,0,0,0.5);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Lane specific colors */
        .lane:nth-child(1) .receptor { border-color: var(--c-pink); box-shadow: 0 0 15px var(--c-pink); }
        .lane:nth-child(2) .receptor { border-color: var(--c-cyan); box-shadow: 0 0 15px var(--c-cyan); }
        .lane:nth-child(3) .receptor { border-color: var(--c-green); box-shadow: 0 0 15px var(--c-green); }
        .lane:nth-child(4) .receptor { border-color: var(--c-yellow); box-shadow: 0 0 15px var(--c-yellow); }

        /* Notes */
        .note {
            position: absolute;
            width: 70%;
            left: 15%;
            height: 25px;
            border-radius: 3px;
            z-index: 5;
        }

        @keyframes fall {
            0% { top: -100px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 120%; opacity: 0; }
        }

        /* Note Colors */
        .n-1 { background: var(--c-pink); box-shadow: 0 0 15px var(--c-pink); }
        .n-2 { background: var(--c-cyan); box-shadow: 0 0 15px var(--c-cyan); }
        .n-3 { background: var(--c-green); box-shadow: 0 0 15px var(--c-green); }
        .n-4 { background: var(--c-yellow); box-shadow: 0 0 15px var(--c-yellow); }

        /* --- 4. TYPOGRAPHY & UI --- */
        .ui-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: -100px; /* Pull up slightly over the sun */
            pointer-events: none;
            width: 100%;
        }

        h1 {
            font-size: clamp(4rem, 12vw, 10rem);
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            letter-spacing: -5px;
            
            /* 3D Chrome/Neon Stack */
            text-shadow: 
                0 0 10px rgba(255,255,255,0.8),
                4px 4px 0px var(--c-cyan),
                8px 8px 0px var(--c-pink);
            
            animation: floatTitle 3s ease-in-out infinite;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }

        .subtitle {
            display: block;
            font-family: var(--font-mono);
            font-size: clamp(1rem, 3vw, 2rem);
            letter-spacing: 15px;
            color: var(--c-white);
            margin-top: 10px;
            text-shadow: 2px 2px 0 var(--c-pink);
            opacity: 0.9;
            margin-bottom: 60px;
            background: rgba(0,0,0,0.5);
            padding: 5px 20px;
            border-radius: 4px;
        }

        /* The Button */
        .start-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: var(--font-mono);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 15px 60px;
            text-transform: uppercase;
            letter-spacing: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            
            /* Cyberpunk Angled Cut */
            clip-path: polygon(
                10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%
            );
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--c-cyan);
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- 5. CRT OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, transparent 40%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .retro-sun { width: 350px; height: 350px; top: 20%; }
            .highway-container { width: 300px; }
            .start-btn { padding: 12px 40px; font-size: 1.2rem; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <!-- The Grid & Stars Background -->
    <canvas id="scene-canvas"></canvas>
    
    <!-- The Iconic Sun -->
    <div class="retro-sun"></div>
    
    <!-- The Game Highway (Visual Preview) -->
    <div class="highway-container">
        <div class="highway">
            <div class="lane"><div class="receptor"></div></div>
            <div class="lane"><div class="receptor"></div></div>
            <div class="lane"><div class="receptor"></div></div>
            <div class="lane"><div class="receptor"></div></div>
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- Typography & UI -->
    <div class="ui-layer">
        <h1>PIXEL<br>DANCE</h1>
        <span class="subtitle">RHYTHM PROTOCOL</span>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Retro Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- 1. THE GRID & STARFIELD ENGINE ---
        const canvas = document.getElementById('scene-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        const starCount = 150;
        
        // Grid configuration
        const gridSpeed = 4;
        let gridOffset = 0;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        function drawScene() {
            // Clear with fade for trails (optional, but clean clear is better for grid)
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Stars (Static background layer)
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.8 + 0.2;
                ctx.fillRect(star.x, star.y, star.size, star.size);
                // Move stars slowly
                star.y += star.speed;
                if (star.y > height) star.y = 0;
            });
            ctx.globalAlpha = 1.0;

            // 2. Draw Perspective Grid (The Floor)
            const horizonY = height * 0.45; // Horizon line
            const centerX = width / 2;
            
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.4)'; // Neon Pink Grid
            ctx.lineWidth = 2;
            ctx.beginPath();

            // Vertical Lines (Radiating from center)
            for (let i = -20; i <= 20; i++) {
                const x = centerX + (i * 100); // Spread
                // Project to vanishing point
                ctx.moveTo(centerX + (i * 10), horizonY);
                ctx.lineTo(x * 4, height); // Fan out to bottom
            }

            // Horizontal Lines (Moving down)
            // We use logarithmic spacing to simulate perspective depth
            gridOffset = (gridOffset + gridSpeed) % 100;
            
            for (let i = 0; i < 20; i++) {
                // Calculate Y based on perspective math
                // Simple approximation: lines get closer together near horizon
                const z = i * 50 + gridOffset;
                const scale = 300 / (z + 300); // Perspective scale
                
                const y = horizonY + (height - horizonY) * (1 - scale);
                
                if (y > horizonY && y < height) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            
            // Horizon Glow
            const gradient = ctx.createLinearGradient(0, horizonY - 50, 0, horizonY + 50);
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(0.5, 'rgba(255, 0, 255, 0.2)');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, horizonY - 50, width, 100);

            requestAnimationFrame(drawScene);
        }

        // --- 2. NOTE SPAWNER ---
        const lanes = document.querySelectorAll('.lane');
        const noteClasses = ['n-1', 'n-2', 'n-3', 'n-4'];

        function spawnNote() {
            const laneIndex = Math.floor(Math.random() * lanes.length);
            const lane = lanes[laneIndex];
            
            const note = document.createElement('div');
            note.classList.add('note', noteClasses[laneIndex]); // Match lane color
            
            // Randomize fall speed to simulate different song tempos
            const duration = Math.random() * 1.5 + 1.5; 
            note.style.animation = `fall ${duration}s linear forwards`;
            
            lane.appendChild(note);
            
            // Cleanup
            setTimeout(() => {
                if(note.parentNode) note.parentNode.removeChild(note);
            }, duration * 1000);
        }

        // Rhythmic Spawning
        setInterval(spawnNote, 300);

        // --- 3. BUTTON INTERACTION ---
        const btn = document.querySelector('.start-btn');
        btn.addEventListener('click', () => {
            btn.innerHTML = "LOADING...";
            document.body.style.transition = "all 0.5s ease";
            document.body.style.transform = "scale(1.1)";
            document.body.style.filter = "brightness(2)";
            setTimeout(() => {
                alert("SYSTEM READY. ENTERING RHYTHM STREAM...");
                location.reload();
            }, 500);
        });

        // Start
        window.addEventListener('resize', init);
        init();
        drawScene();
    </script>
</body>
</html>
