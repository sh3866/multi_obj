<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-bg: #050011;
            --c-grid: #d300c5;
            --c-sun-top: #ffe600;
            --c-sun-bot: #ff0055;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            
            /* Lane Colors */
            --lane-1: #ff00ff; /* Magenta */
            --lane-2: #00f3ff; /* Cyan */
            --lane-3: #00ff66; /* Green */
            --lane-4: #ffe600; /* Yellow */
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Anchor content to bottom */
            perspective: 800px;
        }

        /* --- BACKGROUND LAYERS --- */
        
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* The Retro Sun */
        .sun-container {
            position: absolute;
            top: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 500px;
            height: 500px;
            background: linear-gradient(to bottom, var(--c-sun-top), var(--c-sun-bot));
            border-radius: 50%;
            box-shadow: 
                0 0 40px var(--c-sun-bot), 
                0 0 80px rgba(255, 0, 85, 0.4);
            position: relative;
            /* Sliced Sun Effect */
            mask-image: linear-gradient(to bottom, 
                black 0%, black 48%, 
                transparent 48%, transparent 52%, 
                black 52%, black 60%, 
                transparent 60%, transparent 64%, 
                black 64%, black 72%, 
                transparent 72%, transparent 76%, 
                black 76%, black 84%, 
                transparent 84%, transparent 88%, 
                black 88%, black 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, black 48%, 
                transparent 48%, transparent 52%, 
                black 52%, black 60%, 
                transparent 60%, transparent 64%, 
                black 64%, black 72%, 
                transparent 72%, transparent 76%, 
                black 76%, black 84%, 
                transparent 84%, transparent 88%, 
                black 88%, black 100%
            );
            animation: sunPulse 4s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.1); }
        }

        /* The Grid Floor */
        .grid-container {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 100%;
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 30%), /* Fade out at horizon */
                linear-gradient(90deg, rgba(211, 0, 197, 0.7) 1px, transparent 1px),
                linear-gradient(0deg, rgba(211, 0, 197, 0.7) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            box-shadow: 0 -50px 80px rgba(211, 0, 197, 0.3);
            animation: gridScroll 2s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* --- GAME HIGHWAY (UI) --- */
        
        .highway-wrapper {
            position: relative;
            z-index: 10;
            width: 400px;
            height: 700px;
            display: flex;
            justify-content: center;
            /* Dramatic 3D Tilt */
            transform: perspective(800px) rotateX(25deg) scale(0.9);
            transform-origin: bottom center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.2));
        }

        .highway {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.4));
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-cyan);
            box-shadow: 
                0 0 15px var(--c-cyan),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
        }
        
        /* Lane Dividers */
        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .lane:last-child { border-right: none; }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 80px;
            left: -10px;
            width: calc(100% + 20px);
            height: 8px;
            background: #fff;
            box-shadow: 
                0 0 10px var(--c-cyan), 
                0 0 25px var(--c-cyan);
            z-index: 12;
        }
        
        /* Receptors */
        .receptor {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.4);
            box-shadow: inset 0 0 8px rgba(255,255,255,0.2);
        }
        .lane:nth-child(1) .receptor { border-color: var(--lane-1); box-shadow: 0 0 10px var(--lane-1); }
        .lane:nth-child(2) .receptor { border-color: var(--lane-2); box-shadow: 0 0 10px var(--lane-2); }
        .lane:nth-child(3) .receptor { border-color: var(--lane-3); box-shadow: 0 0 10px var(--lane-3); }
        .lane:nth-child(4) .receptor { border-color: var(--lane-4); box-shadow: 0 0 10px var(--lane-4); }

        /* The Falling Notes */
        .note {
            position: absolute;
            width: 60%;
            left: 20%;
            height: 30px;
            border-radius: 2px;
            box-shadow: 0 0 10px currentColor;
            opacity: 0;
        }

        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: calc(100% + 50px); opacity: 0; }
        }

        /* Note Styles */
        .n1 { background-color: var(--lane-1); color: var(--lane-1); animation: fall 2s linear infinite; }
        .n1-d1 { animation-delay: 0.5s; }
        .n1-d2 { animation-delay: 1.2s; }

        .n2 { background-color: var(--lane-2); color: var(--lane-2); animation: fall 2s linear infinite 0.2s; }
        .n2-d1 { animation-delay: 0.9s; }

        .n3 { background-color: var(--lane-3); color: var(--lane-3); animation: fall 2s linear infinite 0.7s; }
        .n3-d1 { animation-delay: 1.4s; }

        .n4 { background-color: var(--lane-4); color: var(--lane-4); animation: fall 2s linear infinite 1.1s; }
        .n4-d1 { animation-delay: 0.4s; }

        /* --- TYPOGRAPHY & CONTROLS --- */

        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: -250px; /* Pull up to overlap grid and sun */
            pointer-events: none;
            width: 100%;
            padding-bottom: 50px;
        }

        h1 {
            font-size: 7rem;
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            letter-spacing: -8px;
            
            /* Complex Glitch Text */
            text-shadow: 
                5px 5px 0px var(--c-magenta),
                -5px -5px 0px var(--c-cyan);
            
            filter: drop-shadow(0 0 15px rgba(255, 0, 255, 0.6));
            animation: textFloat 3s ease-in-out infinite alternate;
        }

        h1 span {
            display: block;
            font-size: 1.8rem;
            letter-spacing: 20px;
            color: var(--c-cyan);
            text-shadow: 3px 3px 0 var(--c-magenta);
            margin-top: 20px;
            font-weight: bold;
            opacity: 0.95;
        }

        @keyframes textFloat {
            0% { transform: translateY(0) skewX(0deg); }
            100% { transform: translateY(-15px) skewX(2deg); }
        }

        .start-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 20px 60px;
            text-transform: uppercase;
            letter-spacing: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            box-shadow: 
                0 0 15px var(--c-cyan), 
                inset 0 0 15px var(--c-cyan);
            margin-top: 40px;
            /* Sci-fi shape */
            clip-path: polygon(15% 0, 100% 0, 100% 70%, 85% 100%, 0 100%, 0 30%);
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 
                0 0 60px var(--c-cyan), 
                inset 0 0 20px var(--c-cyan);
            transform: scale(1.05);
            text-shadow: 0 0 10px white;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* Overlays */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 50%, black 120%);
            z-index: 998;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 4.5rem; letter-spacing: -4px; }
            h1 span { font-size: 1.2rem; letter-spacing: 10px; }
            .retro-sun { width: 300px; height: 300px; }
            .highway-wrapper { width: 300px; height: 500px; }
            .content-layer { margin-top: -150px; }
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-container"></div>
    
    <!-- UI Layer -->
    <div class="highway-wrapper">
        <div class="highway">
            <!-- Lane 1 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n1"></div>
                <div class="note n1 n1-d1"></div>
                <div class="note n1 n1-d2"></div>
            </div>
            <!-- Lane 2 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n2"></div>
                <div class="note n2 n2-d1"></div>
            </div>
            <!-- Lane 3 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n3"></div>
                <div class="note n3 n3-d1"></div>
            </div>
            <!-- Lane 4 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n4"></div>
                <div class="note n4 n4-d1"></div>
            </div>
            <!-- Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- Content -->
    <div class="content-layer">
        <h1>
            PIXEL<br>DANCE
            <span>RHYTHM PROTOCOL</span>
        </h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 300;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() * 2.5
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle
                ctx.globalAlpha = Math.random() * 0.5 + 0.3; 
                ctx.beginPath();
                // Square stars for pixel feel
                ctx.rect(star.x, star.y, star.size, star.size); 
                ctx.fill();
                
                // Move stars (warp effect)
                star.y += star.z * 0.8;
                
                // Reset star if it goes below screen
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            btn.innerHTML = "INITIALIZING...";
            btn.style.background = "var(--c-magenta)";
            btn.style.borderColor = "var(--c-magenta)";
            btn.style.boxShadow = "0 0 30px var(--c-magenta)";
            btn.style.color = "#fff";
            
            setTimeout(() => {
                alert("SYSTEM READY. ENTERING RHYTHM STREAM...");
                btn.innerHTML = "START GAME";
                btn.style.background = "rgba(0, 0, 0, 0.6)";
                btn.style.borderColor = "var(--c-cyan)";
                btn.style.boxShadow = "0 0 15px var(--c-cyan), inset 0 0 15px var(--c-cyan)";
                btn.style.color = "var(--c-cyan)";
            }, 800);
        });

        init();
        draw();

    </script>
</body>
</html>
