<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --bg-deep: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff0055;
            --grid-color: rgba(255, 0, 255, 0.3);
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: white;
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* --- LAYER 1: BACKGROUND & ATMOSPHERE --- */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* The Synthwave Sun - CSS Only */
        .sun-container {
            position: absolute;
            top: 10%;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
            perspective: 500px;
        }

        .retro-sun {
            width: 400px;
            height: 400px;
            background: linear-gradient(to bottom, var(--neon-yellow) 0%, var(--neon-red) 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 60px rgba(255, 0, 85, 0.5);
            /* The Slices */
            -webkit-mask-image: linear-gradient(to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 48%,
                black 48%, black 55%,
                transparent 55%, transparent 59%,
                black 59%, black 68%,
                transparent 68%, transparent 73%,
                black 73%, black 85%,
                transparent 85%, transparent 90%,
                black 90%, black 100%
            );
            mask-image: linear-gradient(to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 48%,
                black 48%, black 55%,
                transparent 55%, transparent 59%,
                black 59%, black 68%,
                transparent 68%, transparent 73%,
                black 73%, black 85%,
                transparent 85%, transparent 90%,
                black 90%, black 100%
            );
            animation: sunPulse 4s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.05); filter: brightness(1.2); }
        }

        /* The Infinite Grid Floor */
        .grid-floor {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 100%;
            background: 
                linear-gradient(transparent 0%, var(--bg-deep) 40%),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
                linear-gradient(0deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            box-shadow: 0 -50px 100px rgba(255, 0, 255, 0.2);
            animation: gridScroll 1.5s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- LAYER 2: THE HIGHWAY (VISUAL PREVIEW) --- */
        .highway-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) perspective(800px) rotateX(35deg) scale(0.9);
            width: 320px;
            height: 600px;
            z-index: 5;
            pointer-events: none;
            opacity: 0.9;
            /* Mask to fade out top */
            mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 20, 0.6);
            border-left: 2px solid rgba(0, 243, 255, 0.5);
            border-right: 2px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            display: flex;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-zone {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            z-index: 10;
        }

        /* Receptors */
        .receptor {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 30px;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: inset 0 0 5px rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        .lane:nth-child(1) .receptor { border-color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .lane:nth-child(2) .receptor { border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .lane:nth-child(3) .receptor { border-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .lane:nth-child(4) .receptor { border-color: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow); }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 60%;
            left: 20%;
            height: 24px;
            border-radius: 2px;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Note Colors */
        .n-p { background-color: var(--neon-pink); color: var(--neon-pink); animation: fall 1.8s linear infinite; }
        .n-c { background-color: var(--neon-cyan); color: var(--neon-cyan); animation: fall 1.8s linear infinite 0.4s; }
        .n-g { background-color: var(--neon-green); color: var(--neon-green); animation: fall 1.8s linear infinite 0.8s; }
        .n-y { background-color: var(--neon-yellow); color: var(--neon-yellow); animation: fall 1.8s linear infinite 1.2s; }

        /* --- LAYER 3: TYPOGRAPHY & UI --- */
        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: -100px; /* Pull up slightly */
            pointer-events: none;
            width: 100%;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            line-height: 0.8;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            letter-spacing: -10px;
            position: relative;
            
            /* The Glitch Stack */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -4px -4px 0px var(--neon-cyan);
            
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.4));
            animation: titleFloat 4s ease-in-out infinite alternate;
        }

        /* Glitch Animation Keyframes */
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) skewX(0deg); }
            50% { transform: translateY(-5px) skewX(0deg); }
            52% { transform: translateY(5px) skewX(-5deg); }
            54% { transform: translateY(-5px) skewX(5deg); }
            56% { transform: translateY(0) skewX(0deg); }
        }

        .subtitle {
            display: block;
            font-size: 1.5rem;
            letter-spacing: 15px;
            color: var(--neon-cyan);
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 var(--neon-pink);
            opacity: 0.9;
        }

        /* The Button */
        .start-btn {
            pointer-events: auto;
            background: transparent;
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-pixel);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 15px 60px;
            text-transform: uppercase;
            letter-spacing: 8px;
            cursor: pointer;
            position: relative;
            margin-top: 50px;
            transition: all 0.1s ease;
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px var(--neon-cyan);
            /* Sci-fi shape */
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .start-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 50px var(--neon-cyan);
            transform: scale(1.05);
            text-shadow: 0 0 5px white;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.1) 2px,
                rgba(0,0,0,0.1) 4px
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, transparent 60%, black 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 5rem; letter-spacing: -5px; }
            .subtitle { font-size: 1rem; letter-spacing: 8px; }
            .retro-sun { width: 250px; height: 250px; }
            .highway-wrapper { width: 250px; height: 400px; }
        }
    </style>
</head>
<body>

    <!-- Visual Backgrounds -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-floor"></div>
    
    <!-- The Rhythm Highway Preview -->
    <div class="highway-wrapper">
        <div class="highway">
            <!-- Lane 1 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n-p" style="animation-delay: 0s;"></div>
                <div class="note n-p" style="animation-delay: 0.9s;"></div>
            </div>
            <!-- Lane 2 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n-c" style="animation-delay: 0.4s;"></div>
                <div class="note n-c" style="animation-delay: 1.3s;"></div>
            </div>
            <!-- Lane 3 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n-g" style="animation-delay: 0.8s;"></div>
                <div class="note n-g" style="animation-delay: 1.7s;"></div>
            </div>
            <!-- Lane 4 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n-y" style="animation-delay: 1.2s;"></div>
                <div class="note n-y" style="animation-delay: 2.1s;"></div>
            </div>
            <!-- Hit Line -->
            <div class="hit-zone"></div>
        </div>
    </div>

    <!-- Main UI Content -->
    <div class="content-layer">
        <h1>
            PIXEL<br>DANCE
            <span class="subtitle">RHYTHM PROTOCOL</span>
        </h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- CRT Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 200;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random()
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                const twinkle = Math.random() * 0.3;
                ctx.globalAlpha = star.opacity + twinkle > 1 ? 1 : star.opacity + twinkle;
                
                ctx.beginPath();
                // Pixelated stars
                ctx.rect(star.x, star.y, star.size, star.size); 
                ctx.fill();
                
                // Move stars (Warp effect)
                star.y += star.z * 1.5;
                
                // Reset star
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            btn.innerHTML = "INITIALIZING...";
            btn.style.background = "var(--neon-pink)";
            btn.style.borderColor = "var(--neon-pink)";
            btn.style.boxShadow = "0 0 50px var(--neon-pink)";
            btn.style.color = "#fff";
            
            setTimeout(() => {
                alert("SYSTEM READY. ENTERING RHYTHM STREAM...");
                btn.innerHTML = "START GAME";
                btn.style.background = "transparent";
                btn.style.borderColor = "var(--neon-cyan)";
                btn.style.boxShadow = "0 0 15px var(--neon-cyan), inset 0 0 15px var(--neon-cyan)";
                btn.style.color = "var(--neon-cyan)";
            }, 800);
        });

        init();
        draw();

    </script>
</body>
</html>
