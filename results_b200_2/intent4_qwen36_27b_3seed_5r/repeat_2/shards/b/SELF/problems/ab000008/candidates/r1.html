<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-bg: #050011;
            --c-grid: #b026ff;
            --c-sun-top: #ffcc00;
            --c-sun-bot: #ff0055;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-hit: #ffffff;
            
            /* Colors for the 4 lanes */
            --lane-1: #ff00ff; /* Magenta */
            --lane-2: #00f3ff; /* Cyan */
            --lane-3: #00ff66; /* Green */
            --lane-4: #ffe600; /* Yellow */
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Fallback */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* For 3D elements */
        }

        /* --- BACKGROUND LAYERS --- */
        
        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }

        /* 2. The Retro Sun */
        .sun-container {
            position: absolute;
            top: 25%; /* Center vertically relative to horizon */
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 400px;
            height: 400px;
            background: linear-gradient(to bottom, var(--c-sun-top), var(--c-sun-bot));
            border-radius: 50%;
            box-shadow: 
                0 0 60px var(--c-sun-bot), 
                0 0 100px rgba(255, 0, 85, 0.4);
            position: relative;
            /* The classic synthwave "sliced" look */
            mask-image: linear-gradient(to bottom, 
                black 0%, black 55%, 
                transparent 55%, transparent 60%, 
                black 60%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 75%, 
                transparent 75%, transparent 80%, 
                black 80%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 95%, 
                transparent 95%, transparent 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, black 55%, 
                transparent 55%, transparent 60%, 
                black 60%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 75%, 
                transparent 75%, transparent 80%, 
                black 80%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 95%, 
                transparent 95%, transparent 100%
            );
            /* Subtle pulse */
            animation: sunPulse 4s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.1); }
        }

        /* 3. The Grid Floor */
        .grid-container {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 60%;
            /* The Grid Pattern */
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 20%), /* Fade into distance */
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 
                60px 60px;
            /* 3D Transformation */
            transform: perspective(600px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            /* Glow at the horizon line */
            box-shadow: 0 -30px 60px rgba(176, 38, 255, 0.3);
            animation: gridScroll 1.5s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- GAME HIGHWAY (UI) --- */
        
        .highway-wrapper {
            position: relative;
            z-index: 10;
            width: 320px;
            height: 600px;
            display: flex;
            justify-content: center;
            /* Tilt to match the retro perspective slightly, but keep UI readable */
            transform: perspective(800px) rotateX(10deg); 
            transform-origin: bottom center;
            margin-bottom: 80px;
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-left: 2px solid var(--c-cyan);
            border-right: 2px solid var(--c-cyan);
            /* Neon Glow */
            box-shadow: 
                0 0 20px rgba(0, 243, 255, 0.2),
                inset 0 0 30px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            display: flex;
        }
        
        /* Lane Dividers */
        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .lane:last-child { border-right: none; }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--c-hit);
            box-shadow: 
                0 0 10px var(--c-cyan), 
                0 0 20px var(--c-cyan);
            z-index: 12;
        }
        
        /* Receptors (The boxes at the bottom) */
        .receptor {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: inset 0 0 5px rgba(255,255,255,0.2);
        }
        .lane:nth-child(1) .receptor { border-color: var(--lane-1); color: var(--lane-1); }
        .lane:nth-child(2) .receptor { border-color: var(--lane-2); color: var(--lane-2); }
        .lane:nth-child(3) .receptor { border-color: var(--lane-3); color: var(--lane-3); }
        .lane:nth-child(4) .receptor { border-color: var(--lane-4); color: var(--lane-4); }

        /* The Falling Notes */
        .note {
            position: absolute;
            width: 60%;
            left: 20%; /* Center in lane */
            height: 24px;
            border-radius: 2px;
            box-shadow: 0 0 15px currentColor;
            opacity: 0;
        }

        /* Keyframes for notes */
        @keyframes fall {
            0% { top: -30px; opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: calc(100% + 30px); opacity: 0; }
        }

        /* Specific Note Styles & Delays */
        /* Lane 1 - Magenta */
        .n1 { background-color: var(--lane-1); color: var(--lane-1); animation: fall 2.5s linear infinite; }
        .n1-d1 { animation-delay: 1.2s; }
        .n1-d2 { animation-delay: 2.1s; }

        /* Lane 2 - Cyan */
        .n2 { background-color: var(--lane-2); color: var(--lane-2); animation: fall 2.5s linear infinite 0.3s; }
        .n2-d1 { animation-delay: 1.8s; }

        /* Lane 3 - Green */
        .n3 { background-color: var(--lane-3); color: var(--lane-3); animation: fall 2.5s linear infinite 0.8s; }
        .n3-d1 { animation-delay: 1.5s; }

        /* Lane 4 - Yellow */
        .n4 { background-color: var(--lane-4); color: var(--lane-4); animation: fall 2.5s linear infinite 1.5s; }
        .n4-d1 { animation-delay: 0.5s; }

        /* --- TYPOGRAPHY & CONTROLS --- */

        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: -150px; /* Pull up to sit on the grid */
            pointer-events: none; 
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            letter-spacing: -5px;
            
            /* Chromatic Aberration / Glitch Effect */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                -4px -4px 0px var(--c-cyan);
            
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.5));
            animation: textFloat 3s ease-in-out infinite alternate;
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            letter-spacing: 15px;
            color: var(--c-cyan);
            text-shadow: 2px 2px 0 var(--c-magenta);
            margin-top: 15px;
            font-weight: normal;
            opacity: 0.9;
        }

        @keyframes textFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .start-btn {
            pointer-events: auto;
            background: transparent;
            border: 3px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 0 10px var(--c-cyan), 
                inset 0 0 10px var(--c-cyan);
            margin-top: 30px;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 
                0 0 40px var(--c-cyan), 
                inset 0 0 20px var(--c-cyan);
            transform: scale(1.05);
            text-shadow: 0 0 5px white;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 40%, black 120%);
            z-index: 998;
            pointer-events: none;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 4rem; }
            .retro-sun { width: 300px; height: 300px; }
            .highway-wrapper { width: 280px; height: 500px; }
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-container"></div>
    
    <!-- UI Layer -->
    <div class="highway-wrapper">
        <div class="highway">
            <!-- Lane 1 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n1"></div>
                <div class="note n1 n1-d1"></div>
                <div class="note n1 n1-d2"></div>
            </div>
            <!-- Lane 2 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n2"></div>
                <div class="note n2 n2-d1"></div>
            </div>
            <!-- Lane 3 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n3"></div>
                <div class="note n3 n3-d1"></div>
            </div>
            <!-- Lane 4 -->
            <div class="lane">
                <div class="receptor"></div>
                <div class="note n4"></div>
                <div class="note n4 n4-d1"></div>
            </div>
            <!-- Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- Content -->
    <div class="content-layer">
        <h1>
            PIXEL<br>DANCE
            <span>RHYTHM PROTOCOL</span>
        </h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 200;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() * 2
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3; // Twinkle
                ctx.beginPath();
                // Square stars for pixel feel
                ctx.rect(star.x, star.y, star.size, star.size); 
                ctx.fill();
                
                // Move stars (warp effect)
                star.y += star.z * 0.5;
                
                // Reset star if it goes below screen
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            btn.innerHTML = "LOADING...";
            btn.style.background = "var(--c-magenta)";
            btn.style.borderColor = "var(--c-magenta)";
            btn.style.boxShadow = "0 0 30px var(--c-magenta)";
            btn.style.color = "#fff";
            
            setTimeout(() => {
                alert("INITIALIZING RHYTHM ENGINE...");
                btn.innerHTML = "START GAME";
                btn.style.background = "transparent";
                btn.style.borderColor = "var(--c-cyan)";
                btn.style.boxShadow = "0 0 10px var(--c-cyan), inset 0 0 10px var(--c-cyan)";
                btn.style.color = "var(--c-cyan)";
            }, 500);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
