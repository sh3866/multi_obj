<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-pink: #ff00ff;
            --c-cyan: #00f3ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-purple: #bc13fe;
            --c-dark: #050011;
            --c-grid: rgba(188, 19, 254, 0.4);
            
            --font-stack: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-dark);
            color: white;
            font-family: var(--font-stack);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* --- BACKGROUND LAYERS --- */
        
        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* 2. The Sun */
        .sun-container {
            position: absolute;
            top: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 500px;
            height: 500px;
            background: linear-gradient(to bottom, var(--c-yellow) 0%, var(--c-pink) 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 80px rgba(255, 0, 255, 0.6);
            /* Slices */
            -webkit-mask-image: linear-gradient(to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 42%,
                black 42%, black 50%,
                transparent 50%, transparent 53%,
                black 53%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            mask-image: linear-gradient(to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 42%,
                black 42%, black 50%,
                transparent 50%, transparent 53%,
                black 53%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            animation: sunPulse 4s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.1); }
        }

        /* 3. The Grid Floor */
        .grid-floor {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 100%;
            background: 
                linear-gradient(to top, rgba(5,0,17,1) 0%, transparent 100%),
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 100px 100px;
            transform: perspective(600px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            animation: gridScroll 2s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* --- HIGHWAY (GAME PREVIEW) --- */
        .highway-wrapper {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) perspective(800px) rotateX(40deg);
            width: 400px;
            height: 800px;
            z-index: 3;
            pointer-events: none;
            opacity: 0.9;
            /* Mask for depth */
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 20, 0.4);
            border-left: 2px solid var(--c-cyan);
            border-right: 2px solid var(--c-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            display: flex;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .lane:last-child { border-right: none; }

        /* Hit Line & Receptors */
        .hit-zone {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 4px;
            background: white;
            box-shadow: 0 0 10px white, 0 0 20px var(--c-cyan);
            z-index: 10;
        }

        .receptor {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: rgba(0,0,0,0.3);
        }

        /* Lane Colors */
        .lane:nth-child(1) .receptor { border-color: var(--c-pink); box-shadow: 0 0 10px var(--c-pink); }
        .lane:nth-child(2) .receptor { border-color: var(--c-cyan); box-shadow: 0 0 10px var(--c-cyan); }
        .lane:nth-child(3) .receptor { border-color: var(--c-green); box-shadow: 0 0 10px var(--c-green); }
        .lane:nth-child(4) .receptor { border-color: var(--c-yellow); box-shadow: 0 0 10px var(--c-yellow); }

        /* Notes */
        .note {
            position: absolute;
            width: 60%;
            left: 20%;
            height: 20px;
            border-radius: 2px;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            5% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* Note Types */
        .n-p { background-color: var(--c-pink); color: var(--c-pink); }
        .n-c { background-color: var(--c-cyan); color: var(--c-cyan); }
        .n-g { background-color: var(--c-green); color: var(--c-green); }
        .n-y { background-color: var(--c-yellow); color: var(--c-yellow); }

        /* --- TYPOGRAPHY & UI --- */
        .content-layer {
            position: relative;
            z-index: 20;
            text-align: center;
            margin-top: -150px;
            pointer-events: none;
            width: 100%;
        }

        h1 {
            font-size: 9rem;
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            letter-spacing: -5px;
            position: relative;
            
            /* Advanced Glitch Text Effect */
            text-shadow: 
                0 0 20px rgba(255, 0, 255, 0.8),
                0 0 40px rgba(255, 0, 255, 0.4),
                4px 4px 0px var(--c-pink),
                -4px -4px 0px var(--c-cyan);
            
            animation: titleFloat 4s ease-in-out infinite alternate;
        }

        /* Glitch Animation */
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) skewX(0deg); }
            50% { transform: translateY(-10px) skewX(0deg); }
            51% { transform: translateY(10px) skewX(-10deg); }
            52% { transform: translateY(-5px) skewX(10deg); }
            53% { transform: translateY(0) skewX(0deg); }
        }

        .subtitle {
            display: block;
            font-size: 1.8rem;
            letter-spacing: 20px;
            color: var(--c-cyan);
            margin-top: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 0 var(--c-pink);
            opacity: 0.9;
            margin-bottom: 40px;
        }

        /* The Button */
        .start-btn {
            pointer-events: auto;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: var(--font-stack);
            font-size: 2rem;
            font-weight: bold;
            padding: 20px 80px;
            text-transform: uppercase;
            letter-spacing: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.4);
            
            /* Cyberpunk Shape */
            clip-path: polygon(
                10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%
            );
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 60px var(--c-cyan), inset 0 0 20px white;
            transform: scale(1.05);
            text-shadow: 0 0 5px white;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- CRT & FX OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, transparent 50%, black 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 5rem; letter-spacing: -2px; }
            .subtitle { font-size: 1rem; letter-spacing: 10px; }
            .retro-sun { width: 300px; height: 300px; }
            .highway-wrapper { width: 280px; height: 500px; }
            .start-btn { padding: 15px 50px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-floor"></div>
    
    <!-- The Rhythm Highway (Canvas driven for performance/visuals) -->
    <div class="highway-wrapper">
        <div class="highway">
            <div class="lane">
                <div class="receptor"></div>
            </div>
            <div class="lane">
                <div class="receptor"></div>
            </div>
            <div class="lane">
                <div class="receptor"></div>
            </div>
            <div class="lane">
                <div class="receptor"></div>
            </div>
            <div class="hit-zone"></div>
        </div>
    </div>

    <!-- Main UI Content -->
    <div class="content-layer">
        <h1>
            PIXEL<br>DANCE
            <span class="subtitle">RHYTHM PROTOCOL</span>
        </h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- CRT Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 250;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() * 2 + 0.5,
                    opacity: Math.random()
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                const twinkle = Math.random() * 0.3;
                ctx.globalAlpha = star.opacity + twinkle > 1 ? 1 : star.opacity + twinkle;
                
                ctx.beginPath();
                // Pixelated stars
                ctx.rect(star.x, star.y, star.size, star.size); 
                ctx.fill();
                
                // Move stars (Warp effect)
                star.y += star.z * 2;
                
                // Reset star
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // --- NOTE GENERATOR ---
        const highway = document.querySelector('.highway');
        const lanes = document.querySelectorAll('.lane');
        const noteColors = ['n-p', 'n-c', 'n-g', 'n-y'];

        function spawnNote() {
            // Pick random lane
            const laneIndex = Math.floor(Math.random() * lanes.length);
            const lane = lanes[laneIndex];
            
            const note = document.createElement('div');
            note.classList.add('note');
            
            // Pick random color class
            note.classList.add(noteColors[Math.floor(Math.random() * noteColors.length)]);
            
            // Randomize speed slightly
            const duration = Math.random() * 1 + 1.5; // 1.5s to 2.5s
            note.style.animation = `fall ${duration}s linear forwards`;
            
            lane.appendChild(note);
            
            // Cleanup after animation
            setTimeout(() => {
                if(note.parentNode) note.parentNode.removeChild(note);
            }, duration * 1000);
        }

        // Spawn notes rhythmically
        setInterval(spawnNote, 400);

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            btn.innerHTML = "INITIALIZING...";
            btn.style.background = "var(--c-pink)";
            btn.style.borderColor = "var(--c-pink)";
            btn.style.boxShadow = "0 0 50px var(--c-pink)";
            btn.style.color = "#fff";
            
            setTimeout(() => {
                // Simulate game start transition
                document.body.style.transition = "transform 0.5s ease-in";
                document.body.style.transform = "scale(1.5)";
                document.body.style.opacity = "0";
                
                setTimeout(() => {
                    alert("SYSTEM READY. ENTERING RHYTHM STREAM...");
                    location.reload();
                }, 500);
            }, 800);
        });

        window.addEventListener('resize', () => {
            init();
        });

        init();
        draw();

    </script>
</body>
</html>
