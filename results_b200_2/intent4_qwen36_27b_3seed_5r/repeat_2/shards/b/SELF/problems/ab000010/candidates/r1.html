<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Sphere Life</title>
<style>
    :root {
        --bg-color: #030305;
        --panel-bg: rgba(10, 10, 14, 0.65);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-secondary: #8a8a9b;
        --accent: #00f0ff;
        --accent-glow: rgba(0, 240, 255, 0.4);
        --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
    }

    /* Background grain for texture */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
    }

    #app {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        cursor: grab;
        /* Slight blur to canvas edges for bloom integration */
        filter: blur(0.5px) contrast(1.1); 
    }

    canvas:active {
        cursor: grabbing;
    }

    /* Glassmorphism Panel */
    #controls {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        width: 300px;
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 28px;
        z-index: 10;
        box-shadow: 
            0 20px 40px rgba(0,0,0,0.4),
            0 0 0 1px rgba(255,255,255,0.02) inset;
        display: flex;
        flex-direction: column;
        gap: 24px;
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Typography */
    h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        margin: 0 0 6px 0;
        color: #fff;
        text-transform: uppercase;
        background: linear-gradient(90deg, #fff, #b0b0b0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.5;
        font-weight: 400;
    }

    /* Control Groups */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-secondary);
    }

    .value-display {
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 11px;
        text-shadow: 0 0 8px var(--accent-glow);
    }

    /* Custom Range Sliders */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin: 0;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 12px var(--accent-glow);
        transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
    }

    /* Buttons */
    .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
    }

    button {
        flex: 1;
        padding: 12px 0;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.03);
        color: var(--text-primary);
        font-family: var(--font-main);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.3);
        transform: translateY(-1px);
    }

    button:active {
        transform: translateY(0);
    }

    button.primary {
        background: rgba(0, 240, 255, 0.1);
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }

    button.primary:hover {
        background: rgba(0, 240, 255, 0.2);
        box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    }

    /* Stats Footer */
    .stats {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.08);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
    }

    .stat-label {
        font-size: 10px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .stat-val {
        font-size: 16px;
        font-family: var(--font-mono);
        color: #fff;
        font-weight: 300;
    }

    /* Mobile */
    @media (max-width: 768px) {
        #controls {
            right: 0;
            bottom: 0;
            top: auto;
            transform: none;
            width: 100%;
            border-radius: 24px 24px 0 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
            padding: 30px;
            box-sizing: border-box;
        }
    }
</style>
</head>
<body>

<div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
        <div>
            <h1>Cellular Sphere</h1>
            <div class="subtitle">Conway's Game of Life on a 3D manifold.</div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Simulation Speed</span>
                <span class="value-display" id="speedVal">50%</span>
            </div>
            <input type="range" id="speed" min="1" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Cell Density</span>
                <span class="value-display" id="densityVal">50%</span>
            </div>
            <input type="range" id="density" min="10" max="90" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Rotation</span>
                <span class="value-display" id="rotVal">Auto</span>
            </div>
            <input type="range" id="rotation" min="0" max="100" value="20">
        </div>

        <div class="btn-row">
            <button id="btnReset">Randomize</button>
            <button id="btnStep">Step</button>
            <button id="btnPause" class="primary">Pause</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Population</span>
                <span class="stat-val" id="popCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Generation</span>
                <span class="stat-val" id="genCount">0</span>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * Configuration & State
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false }); 
    
    // Simulation State
    let width, height;
    let cx, cy;
    let radius;
    
    // Sphere Grid Parameters
    // Increased resolution for "lots of small cells"
    const RINGS = 40; 
    const SEGMENTS = 80; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Game State
    let grid = new Int8Array(TOTAL_CELLS); 
    let nextGrid = new Int8Array(TOTAL_CELLS);
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visual Parameters
    let rotationSpeed = 0.002;
    let simSpeed = 50; 
    let cellDensity = 0.5;
    let rotY = 0;
    let rotX = 0.2;
    
    // Interaction State
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        // Handle High DPI for sharper text/lines if needed, but for particles 1:1 is often faster/smoother
        canvas.width = width;
        canvas.height = height;
        cx = width / 2;
        cy = height / 2;
        // Responsive sphere size
        radius = Math.min(width, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    
    // Map grid index to 3D coordinates on sphere surface
    function getCellCoords(index) {
        const ring = index % RINGS;
        const segment = Math.floor(index / RINGS);
        
        // Phi: 0 to PI
        const phi = (ring / RINGS) * Math.PI;
        // Theta: 0 to 2PI
        const theta = (segment / SEGMENTS) * 2 * Math.PI;
        
        return {
            x: Math.sin(phi) * Math.cos(theta),
            y: Math.cos(phi), 
            z: Math.sin(phi) * Math.sin(theta)
        };
    }

    function rotatePoint(x, y, z, rotY, rotX) {
        // Rotate Y
        let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
        let z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
        
        // Rotate X
        let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
        let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
        
        return { x: x1, y: y2, z: z2 };
    }

    function project(x, y, z) {
        const fov = 4.5;
        const zOffset = fov + z; 
        const scale = radius * (fov / zOffset);
        
        return {
            x: cx + x * scale,
            y: cy - y * scale, 
            scale: scale,
            depth: z
        };
    }

    /**
     * Game Logic (Conway's on Sphere)
     */
    function getNeighbors(r, s) {
        let count = 0;
        
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering - Improved Visuals
     */
    function draw() {
        // Clear with very dark background, not pure black
        ctx.fillStyle = '#030305';
        ctx.fillRect(0, 0, width, height);
        
        // Update Rotation
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cells = [];
        
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const r = i % RINGS;
            const s = Math.floor(i / RINGS);
            
            const pos3D = getCellCoords(i);
            const rotated = rotatePoint(pos3D.x, pos3D.y, pos3D.z, rotY, rotX);
            const projected = project(rotated.x, rotated.y, rotated.z);
            
            // Culling: only draw front half mostly
            if (rotated.z > -0.1) {
                cells.push({
                    x: projected.x,
                    y: projected.y,
                    z: rotated.z,
                    scale: projected.scale,
                    alive: grid[i],
                    // Pre-calculate color base
                    baseHue: (s / SEGMENTS) * 360 
                });
            }
        }
        
        // Sort by depth (painters algorithm)
        cells.sort((a, b) => a.z - b.z);
        
        // Render Loop
        // Using 'lighter' composite operation for "bloom" effect
        ctx.globalCompositeOperation = 'lighter';
        
        for (let cell of cells) {
            if (cell.alive) {
                // Color Logic:
                // Map depth (z) to lightness and alpha
                // Map angle to Hue
                
                // Depth-based color shift
                // Front (1.0) -> Cyan/White
                // Back (0.0) -> Deep Purple/Blue
                
                const depthFactor = (cell.z + 1) / 2; // 0 to 1
                const hue = 200 + (cell.baseHue * 0.5) + (cell.z * 60); 
                const lightness = 40 + (cell.z * 40); // 40% to 80%
                const alpha = 0.1 + (cell.z * 0.8);
                
                ctx.fillStyle = `hsla(${hue}, 85%, ${lightness}%, ${alpha})`;
                
                // Size logic
                const size = 1.2 * (cell.scale / 5.0); 
                
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, Math.max(0.5, size), 0, Math.PI * 2);
                ctx.fill();
                
                // Add "Core" for bright cells
                if (cell.z > 0.6) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${cell.z * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(cell.x, cell.y, size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Reset composite for overlay elements (like outline)
        ctx.globalCompositeOperation = 'source-over';
        
        // Subtle Atmosphere Glow
        const gradient = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.2);
        gradient.addColorStop(0, 'rgba(0, 240, 255, 0.05)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.2, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        if (!isPaused) {
            // Throttle simulation
            const threshold = Math.max(1, 101 - simSpeed);
            if (frameCount % Math.floor(threshold / 10) === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.0001;
                rotVal.innerText = 'Auto';
            }
        });

        document.getElementById('btnReset').addEventListener('click', randomizeGrid);
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            document.getElementById('btnPause').innerText = 'Play';
            document.getElementById('btnPause').classList.add('primary');
        });

        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? 'Play' : 'Pause';
            if(isPaused) pauseBtn.classList.remove('primary');
            else pauseBtn.classList.add('primary');
        });
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop;
        document.getElementById('genCount').innerText = generation;
    }

    // Start
    init();

</script>
</body>
</html>
