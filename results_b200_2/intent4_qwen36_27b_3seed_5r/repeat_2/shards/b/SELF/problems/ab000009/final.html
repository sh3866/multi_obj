<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            /* Palette: "Slate & Gold" - A sophisticated, high-contrast dark theme */
            --bg-body: #0b0c10;
            --bg-surface: #15171c;
            --bg-panel: #1a1d23;
            --bg-panel-hover: #242830;
            
            --text-primary: #e6e6e6;
            --text-secondary: #9ca3af;
            --text-muted: #525a66;

            --accent-gold: #d4af37;
            --accent-gold-dim: rgba(212, 175, 55, 0.1);
            
            --board-light: #eeeed2;
            --board-dark: #769656;
            --highlight-move: rgba(255, 255, 0, 0.35);
            
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
            --shadow-elevated: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            
            --radius-lg: 16px;
            --radius-md: 8px;
            --radius-sm: 4px;
            
            --board-size: min(85vw, 85vh);
            --sq-size: calc(var(--board-size) / 8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Subtle vignette */
            background-image: radial-gradient(circle at 50% 50%, #1f232e 0%, var(--bg-body) 80%);
        }

        /* --- Main Layout --- */
        .app-container {
            display: flex;
            gap: 48px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* --- Board Component --- */
        .board-frame {
            position: relative;
            padding: 16px;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-elevated);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.2);
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Last Move Highlight */
        .square.last-move::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: var(--highlight-move);
            z-index: 1;
        }

        /* Coordinates */
        .coord {
            position: absolute;
            font-size: 0.6rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0.8;
            z-index: 2;
        }
        /* Adjust color based on square type */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 3px; right: 4px; }

        /* Pieces */
        .piece {
            width: 90%;
            height: 90%;
            cursor: grab;
            z-index: 3;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .piece:hover { transform: scale(1.08); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 400px;
            height: var(--board-size);
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: var(--shadow-elevated);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .panel-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .game-meta span {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 700;
        }
        .game-meta .id { color: var(--accent-gold); }

        /* Player Cards */
        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            transition: opacity 0.3s ease;
        }
        .player-row.inactive { opacity: 0.4; }
        .player-row.active { opacity: 1; }

        .player-info { display: flex; align-items: center; gap: 16px; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #2a2e36;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            color: #888;
        }
        .player-row.active .avatar { 
            border-color: var(--accent-gold); 
            color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 0 4px var(--accent-gold-dim);
        }
        
        .details h3 { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
        .details span { font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 0.5px; }

        .clock {
            font-family: "SF Mono", "Roboto Mono", monospace;
            font-size: 1.4rem;
            font-weight: 700;
            background: #0f1014;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            color: #555;
            min-width: 90px;
            text-align: center;
            border: 1px solid #222;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .player-row.active .clock {
            background: var(--text-primary);
            color: #000;
            border-color: var(--text-primary);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            background: var(--bg-panel);
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        
        .history-table th {
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            padding: 16px 24px;
            text-align: left;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
        }

        .history-table td {
            padding: 12px 24px;
            color: var(--text-primary);
            font-family: "SF Mono", "Roboto Mono", monospace;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: default;
            transition: background 0.2s;
        }
        
        .history-table tr:hover td { background: var(--bg-panel-hover); }
        .history-table td:first-child { color: var(--text-muted); width: 40px; text-align: right; padding-right: 12px; font-size: 0.8rem; }

        /* Controls */
        .controls {
            padding: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: var(--bg-panel);
        }

        .btn {
            background: var(--bg-panel-hover);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-secondary);
            padding: 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn:hover {
            background: #323741;
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }

        .btn-danger { 
            color: #ef4444; 
            grid-column: span 2;
            border-color: rgba(239, 68, 68, 0.1);
        }
        .btn-danger:hover { 
            background: rgba(239, 68, 68, 0.1); 
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-primary {
            background: var(--accent-gold);
            color: #111;
            border: none;
            grid-column: span 2;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
        }
        .btn-primary:hover {
            background: #e5c14b;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .app-container { flex-direction: column; padding: 20px; gap: 30px; }
            .panel { width: var(--board-size); height: auto; min-height: 350px; }
            .board-frame { padding: 8px; }
        }
    </style>
</head>

        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']
    ];

    const mockMoves = [
        { w: 'e4', b: 'e5' },
        { w: 'Nf3', b: 'Nc6' },
        { w: 'Bb5', b: 'a6' },
        { w: 'Ba4', b: 'Nf6' },
        { w: 'O-O', b: 'Be7' },
        { w: 'Re1', b: 'b5' },
        { w: 'Bb3', b: 'd6' },
        { w: 'c3', b: 'O-O' },
        { w: 'h3', b: 'Nb8' },
        { w: 'd4', b: 'Nbd7' }
    ];

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Highlight last move (visual simulation)
                if ((row === 4 && col === 4) || (row === 2 && col === 4)) {
                    square.classList.add('last-move');
                }

                // Coordinates
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Pieces
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function renderHistory() {
        moveListEl.innerHTML = '';
        mockMoves.forEach((move, index) => {
            const tr = document.createElement('tr');
            
            const numTd = document.createElement('td');
            numTd.innerText = index + 1 + '.';
            
            const wTd = document.createElement('td');
            wTd.innerText = move.w;
            
            const bTd = document.createElement('td');
            bTd.innerText = move.b;

            tr.appendChild(numTd);
            tr.appendChild(wTd);
            tr.appendChild(bTd);
            moveListEl.appendChild(tr);
        });
        
        // Scroll to bottom
        const historyContainer = document.querySelector('.history-container');
        historyContainer.scrollTop = historyContainer.scrollHeight;
    }

    function resetGame() {
        boardEl.style.opacity = '0';
        setTimeout(() => {
            renderBoard();
            boardEl.style.opacity = '1';
        }, 200);
    }

    // Init
    renderBoard();
    renderHistory();

</script>
</body>
</html>
