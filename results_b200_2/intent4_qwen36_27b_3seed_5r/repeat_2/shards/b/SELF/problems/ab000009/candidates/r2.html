<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            /* --- Palette: "Slate & Onyx" --- */
            --bg-app: #09090b;
            --bg-panel: #18181b;
            --bg-panel-hover: #27272a;
            --border-panel: #27272a;
            
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --text-dim: #52525b;
            
            --accent: #d4af37; /* Classic Gold */
            --accent-glow: rgba(212, 175, 55, 0.15);
            
            --board-light: #e8ebd8; /* Warm Cream */
            --board-dark: #779556;  /* Deep Moss */
            --highlight-move: rgba(255, 255, 0, 0.2);
            
            --shadow-soft: 0 8px 30px -10px rgba(0, 0, 0, 0.5);
            --shadow-piece: 0 4px 8px rgba(0, 0, 0, 0.4);
            
            --radius-lg: 16px;
            --radius-md: 8px;
            --radius-sm: 4px;
            
            --board-dim: min(85vw, 85vh);
            --sq-dim: calc(var(--board-dim) / 8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-app);
            /* Subtle grain texture via CSS */
            background-image: radial-gradient(circle at 50% 0%, #202023 0%, var(--bg-app) 60%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Layout --- */
        .app-container {
            display: flex;
            gap: 40px;
            padding: 40px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
            perspective: 1000px; /* For subtle 3D feel if needed */
        }

        /* --- Board Component --- */
        .board-wrapper {
            position: relative;
            padding: 12px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-panel);
            transition: transform 0.3s ease;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-dim);
            height: var(--board-dim);
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
            /* Inner shadow for depth */
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Board Colors */
        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }

        /* Coordinates */
        .coord {
            position: absolute;
            font-size: 0.6rem;
            font-weight: 700;
            line-height: 1;
            font-family: "SF Mono", "Roboto Mono", monospace;
            pointer-events: none;
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 3px; right: 4px; }

        /* Highlight effect */
        .square.highlight::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--highlight-move);
            pointer-events: none;
            z-index: 1;
        }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            z-index: 2;
        }
        .piece:active {
            cursor: grabbing;
            transform: scale(1.15);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
        }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 360px;
            height: var(--board-dim);
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-panel);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .panel-header {
            padding: 24px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-panel);
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .game-meta span {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Player Cards */
        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            transition: opacity 0.3s ease;
        }
        .player-card.inactive { opacity: 0.4; }
        .player-card.active { opacity: 1; }

        .player-info { display: flex; align-items: center; gap: 12px; }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 2px solid transparent;
        }
        .player-card.active .avatar { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        
        .avatar.black { background: #333; color: #fff; }
        .avatar.white { background: #eee; color: #000; }

        .details h3 { font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
        .details span { font-size: 0.75rem; color: var(--text-muted); }

        .clock {
            font-family: "SF Mono", "Roboto Mono", monospace;
            font-size: 1.1rem;
            font-weight: 700;
            background: #000;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            color: #fff;
            min-width: 70px;
            text-align: center;
            border: 1px solid #333;
            letter-spacing: 1px;
        }
        .player-card.active .clock {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        .history-table th {
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            padding: 12px 24px;
            text-align: left;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-panel);
            z-index: 10;
        }

        .history-table td {
            padding: 8px 24px;
            color: var(--text-main);
            font-family: "SF Mono", "Roboto Mono", monospace;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        
        .history-table tr:hover td { background: var(--bg-panel-hover); }
        .history-table td:first-child { color: var(--text-dim); width: 40px; text-align: right; padding-right: 10px; }

        /* Controls */
        .controls {
            padding: 20px;
            border-top: 1px solid var(--border-panel);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(0,0,0,0.1);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-panel);
            color: var(--text-muted);
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: var(--bg-panel-hover);
            color: var(--text-main);
            border-color: var(--text-dim);
        }

        .btn-danger { border-color: rgba(255, 80, 80, 0.2); color: #ff6b6b; }
        .btn-danger:hover { background: rgba(255, 80, 80, 0.1); border-color: #ff6b6b; }

        .btn-primary {
            background: var(--accent);
            color: #111;
            border: none;
            grid-column: span 2;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }
        .btn-primary:hover {
            background: #e5c14b;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; padding: 20px; gap: 20px; }
            .panel { width: var(--board-dim); height: auto; min-height: 300px; }
            .board-wrapper { padding: 8px; }
        }
    </style>
</head>

                    <thead>

                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-list">
                        <!-- Moves -->
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn">Undo</button>
                <button class="btn">Draw</button>
                <button class="btn btn-danger" style="grid-column: span 2;">Resign</button>
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
            </div>
        </div>

    </div>

                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Pieces
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function renderHistory() {
        moveListEl.innerHTML = '';
        mockMoves.forEach((move, index) => {
            const tr = document.createElement('tr');
            
            const numTd = document.createElement('td');
            numTd.innerText = index + 1 + '.';
            
            const wTd = document.createElement('td');
            wTd.innerText = move.w;
            
            const bTd = document.createElement('td');
            bTd.innerText = move.b;

            tr.appendChild(numTd);
            tr.appendChild(wTd);
            tr.appendChild(bTd);
            moveListEl.appendChild(tr);
        });
    }

    function resetGame() {
        boardEl.style.opacity = '0';
        setTimeout(() => {
            renderBoard();
            boardEl.style.opacity = '1';
        }, 200);
    }

    // Init
    renderBoard();
    renderHistory();

</script>
</body>
</html>
