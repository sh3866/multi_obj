<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Deep Slate & Premium Wood */
            --bg-body: #0f1115;
            --bg-surface: #181b21;
            --bg-surface-hover: #22262e;
            --border-subtle: rgba(255, 255, 255, 0.08);
            
            --text-primary: #eef0f2;
            --text-secondary: #8b92a1;
            --text-muted: #5c6370;
            
            /* Accent: Muted Gold */
            --accent: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.25);
            
            /* Board Palette: "Tournament Slate" */
            --board-light: #ebecd0;
            --board-dark: #739552;
            
            /* UI Elements */
            --radius-lg: 12px;
            --radius-md: 6px;
            --radius-sm: 4px;
            
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.6);
            --shadow-piece: 0 4px 6px rgba(0,0,0,0.3);
            
            --board-size: min(85vw, 80vh);
            --square-size: calc(var(--board-size) / 8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Subtle background texture */
            background-image: radial-gradient(circle at 50% 0%, #252a33 0%, var(--bg-body) 60%);
        }

        /* Layout Grid */
        .app-container {
            display: flex;
            gap: 32px;
            padding: 40px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
        }

        /* --- The Board Section --- */
        .board-frame {
            position: relative;
            background: var(--bg-surface);
            padding: 16px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Board Colors */
        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }

        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            opacity: 0.9;
            font-family: "Inter", sans-serif; /* System fallback */
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 3px; right: 4px; }

        /* Last Move Highlight */
        .square.highlight {
            position: relative;
        }
        .square.highlight::after {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 51, 0.25);
            pointer-events: none;
        }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            cursor: grab;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(1px 3px 3px rgba(0,0,0,0.35));
            z-index: 2;
        }
        .piece:active { cursor: grabbing; transform: scale(1.1); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 340px;
            height: var(--board-size);
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Area */
        .panel-header {
            padding: 24px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-subtle);
        }

        .game-meta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        /* Player Cards */
        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            transition: opacity 0.3s;
        }
        
        .player-card.active { opacity: 1; }
        .player-card.inactive { opacity: 0.5; }

        .player-info { display: flex; align-items: center; gap: 12px; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }

        .player-details h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        
        .player-details span {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .clock {
            font-family: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            background: #000;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            color: #fff;
            min-width: 70px;
            text-align: center;
            border: 1px solid #333;
        }

        .player-card.active .clock {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
            border-color: #fff;
        }

        /* Move History */
        .history-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            position: relative;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .history-table th {
            position: sticky;
            top: 0;
            background: var(--bg-surface);
            padding: 12px 24px;
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .history-table td {
            padding: 8px 24px;
            color: var(--text-primary);
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
            transition: background 0.1s;
        }
        
        .history-table tr:hover td { background: var(--bg-surface-hover); }
        .history-table td:first-child { color: var(--text-muted); width: 40px; text-align: right; padding-right: 20px;}

        /* Controls */
        .controls-area {
            padding: 20px;
            border-top: 1px solid var(--border-subtle);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.2);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #111;
            grid-column: span 2;
        }

        .btn-primary:hover {
            background: #e5c14b;
            color: #000;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; padding: 20px; }
            .panel { width: 100%; height: 300px; }
            .board-frame { padding: 10px; }
        }
    </style>
</head>

                            <th>Black</th>

                    </thead>
                    <tbody id="move-history">

                </table>
            </div>

            <div class="controls-area">
                <button class="btn">Undo</button>
                <button class="btn">Draw</button>
                <button class="btn" style="grid-column: span 2; border-color: rgba(255,80,80,0.3); color: #ff8888;">Resign</button>
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
            </div>
        </div>

    </div>

        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Coordinates (only on edges)
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Piece Placement
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on row
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function renderHistory() {
        historyBody.innerHTML = '';
        mockMoves.forEach((move, index) => {
            const tr = document.createElement('tr');
            
            const numTd = document.createElement('td');
            numTd.innerText = index + 1 + '.';
            
            const wTd = document.createElement('td');
            wTd.innerText = move.w;
            
            const bTd = document.createElement('td');
            bTd.innerText = move.b;

            tr.appendChild(numTd);
            tr.appendChild(wTd);
            tr.appendChild(bTd);
            historyBody.appendChild(tr);
        });
    }

    function resetGame() {
        // Simple visual reset
        boardEl.style.opacity = '0.5';
        setTimeout(() => {
            renderBoard();
            boardEl.style.opacity = '1';
        }, 200);
    }

    // Initialize
    renderBoard();
    renderHistory();

</script>
</body>
</html>
