<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Interface</title>
    <style>
        :root {
            /* Palette: Dark Slate & Wood */
            --bg-body: #1e2124;
            --bg-panel: #282b30;
            --text-primary: #ece8e1;
            --text-secondary: #a0a5ab;
            --accent-gold: #d4af37;
            --accent-gold-dim: #8a7324;
            
            /* Board Colors: Muted Olive and Slate */
            --board-light: #e8edf9;
            --board-dark: #779954;
            --board-highlight: rgba(255, 255, 0, 0.25);
            
            /* Dimensions */
            --board-size: 100%;
            --square-size: clamp(35px, 8vw, 70px);
            --icon-size: clamp(28px, 6vw, 56px);
            
            /* Spacing */
            --radius: 4px;
            --spacing: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Layout Container */
        .interface-container {
            display: flex;
            gap: 40px;
            align-items: center;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }

        /* --- The Chessboard --- */
        .board-wrapper {
            position: relative;
            padding: 20px;
            background: var(--bg-panel);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: calc(var(--square-size) * 8);
            height: calc(var(--square-size) * 8);
            border: 5px solid #151618;
            border-radius: 2px;
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 0; /* Hide text if SVG fails, though we use SVGs */
        }

        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Coordinates */
        .coord {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 700;
            opacity: 0.8;
            pointer-events: none;
        }
        .coord.rank { top: 2px; left: 2px; }
        .coord.file { bottom: 2px; right: 2px; }

        /* Pieces */
        .piece {
            width: var(--icon-size);
            height: var(--icon-size);
            cursor: pointer;
            transition: transform 0.1s ease;
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));
        }
        .piece:hover { transform: scale(1.05); }
        .piece svg { width: 100%; height: 100%; }

        /* --- Side Panel --- */
        .panel {
            width: 300px;
            background: var(--bg-panel);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(var(--square-size) * 8 + 40px);
        }

        /* Header / Status */
        .panel-header {
            padding: 25px;
            background: #202226;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .player-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #444;
            border: 2px solid #222;
        }
        .player-dot.active { background: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); }

        .timer {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            background: #111;
            padding: 5px 12px;
            border-radius: 4px;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .game-title {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .history-table th {
            text-align: left;
            padding: 10px 20px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            background: var(--bg-panel);
        }

        .history-table td {
            padding: 8px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
        }
        
        .history-table tr:nth-child(even) { background: rgba(0,0,0,0.1); }
        .history-table td:first-child { color: var(--text-secondary); width: 40px; }

        /* Controls */
        .controls {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            padding: 10px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        
        .btn-primary {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #1e2124;
        }
        .btn-primary:hover { background: #e5c14b; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        @media (max-width: 800px) {
            .interface-container { flex-direction: column; gap: 20px; }
            .panel { width: 100%; max-width: calc(var(--square-size) * 8); height: auto; max-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        
        <!-- Board Section -->
        <div class="board-wrapper">
            <div class="chessboard" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="game-title">Classical Chess • Game #8241</div>
                <div class="status-bar">
                    <div class="player-info">
                        <div class="player-dot active" id="dot-white"></div>
                        <span id="turn-text">White to Move</span>
                    </div>
                    <div class="timer" id="timer-white">10:00</div>
                </div>
                <div class="status-bar" style="margin-bottom:0">
                    <div class="player-info">
                        <div class="player-dot" id="dot-black"></div>
                        <span>Black</span>
                    </div>
                    <div class="timer" id="timer-black">10:00</div>
                </div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Moves injected here -->
                        <tr><td>1.</td><td>e4</td><td>e5</td></tr>
                        <tr><td>2.</td><td>Nf3</td><td>Nc6</td></tr>
                        <tr><td>3.</td><td>Bb5</td><td>a6</td></tr>
                        <tr><td>4.</td><td>Ba4</td><td>Nf6</td></tr>
                        <tr><td>5.</td><td>O-O</td><td>Be7</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn">Undo</button>
                <button class="btn">Draw</button>
                <button class="btn">Resign</button>
                <button class="btn btn-primary" onclick="resetBoard()">New Game</button>
            </div>
        </div>

    </div>

<script>

    // --- Game State ---

        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black (row 0)
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White (row 7)
    ];
    // Note: In this simplified visual representation, I'm treating 'p' as white if row > 4, and black if row < 2.
    // For a real engine, we'd have objects. Here, we just need visuals.

    const boardEl = document.getElementById('board');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Coordinates
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Piece Placement
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on position for the initial setup
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    // Map 'p' to 'p', etc.
                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function resetBoard() {
        // Simple visual reset animation
        boardEl.style.opacity = '0.5';
        setTimeout(() => {
            renderBoard();
            boardEl.style.opacity = '1';
        }, 200);
    }

    // Initial Render
    renderBoard();

</script>
