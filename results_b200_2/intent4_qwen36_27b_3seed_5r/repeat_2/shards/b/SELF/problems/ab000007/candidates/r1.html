<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Deep Dive</title>
<style>
  :root {
    --bg-deep: #050811;
    --bg-surface: #0f172a;
    --primary: #38bdf8; /* Cyan */
    --primary-glow: rgba(56, 189, 248, 0.5);
    --accent: #f472b6; /* Pink */
    --accent-glow: rgba(244, 114, 182, 0.5);
    --gold: #fbbf24;
    --gold-glow: rgba(251, 191, 36, 0.4);
    --text-main: #e2e8f0;
    --text-muted: #64748b;
    --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --glass-bg: rgba(15, 23, 42, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: none; /* Custom cursor only */
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 50% 120%, #1e293b 0%, #050811 60%);
  }

  /* HUD */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 20;
    pointer-events: none;
  }

  .title-group {
    position: relative;
  }

  /* Decorative HUD element */
  .title-group::before {
    content: '';
    position: absolute;
    top: -20px;
    left: -10px;
    width: 40px;
    height: 40px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    opacity: 0.3;
    box-shadow: 0 0 15px var(--primary-glow);
  }
  
  .title-group::after {
    content: '';
    position: absolute;
    top: -15px;
    left: -5px;
    width: 30px;
    height: 30px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    opacity: 0.6;
  }

  .title-group h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    background: linear-gradient(to right, #fff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
    z-index: 2;
  }

  .title-group p {
    font-size: 0.8rem;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--primary-glow);
    position: relative;
    z-index: 2;
  }

  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1.25rem;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s;
  }

  .stat-pill:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.2);
  }

  .stat-icon {
    width: 20px;
    height: 20px;
    fill: var(--primary);
    filter: drop-shadow(0 0 4px var(--primary-glow));
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-top: 2px;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
  }

  /* Bottom Action Bar */
  .action-bar {
    position: absolute;
    bottom: 3rem;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 20;
    pointer-events: none;
  }

  .btn-collect {
    pointer-events: auto;
    background: var(--gold);
    color: #0f172a;
    border: none;
    padding: 1.1rem 3.5rem;
    font-size: 0.95rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px var(--gold-glow), 0 10px 30px rgba(0,0,0,0.4);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
  }

  .btn-collect::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .btn-collect:hover {
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 0 40px var(--gold-glow), 0 15px 40px rgba(0,0,0,0.5);
  }
  
  .btn-collect:hover::after {
    transform: translateX(100%);
    transition: transform 0.6s ease-in-out;
  }

  .btn-collect:active {
    transform: scale(0.96);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid var(--primary);
    padding: 1.25rem 2.5rem;
    border-radius: 16px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: #fff; 
    margin-bottom: 0.25rem; 
    font-size: 1.1rem;
    letter-spacing: 0.05em;
  }
  .toast p { 
    font-size: 0.9rem; 
    color: var(--primary); 
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <p>Region 04: The Floating Isles</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
        </svg>
        <div>
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:var(--accent)" viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14h-2v-5h2v5zm-4 0H8v-7h2v7z"/>
        </svg>
        <div>
          <div class="stat-value">74%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Mist Sprite</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Deep Dive Version
 * Improved visuals, smoother physics, better lighting.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: 0, y: 0 };
let netMouse = { x: 0, y: 0 }; // Smoothed mouse for net
let particles = [];
let creatures = [];
let floatingTexts = [];
let netActive = false;
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color, speedMult = 1) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 * speedMult;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.015;
    this.color = color;
    this.size = Math.random() * 4 + 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95; // Friction
    this.vy *= 0.95;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
    this.vyBase = -1.5;
  }

  update() {
    this.y += this.vy;
    this.vy *= 0.95; // Slow down rise
    this.life -= 0.012;
  }

  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px system-ui';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.baseSize = Math.random() * 15 + 10;
    this.size = this.baseSize;
    this.speedX = (Math.random() - 0.5) * 1.5;
    this.speedY = (Math.random() - 0.5) * 1.5;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.05 + 0.02;
    this.color = this.getColor();
    this.caught = false;
    this.caughtScale = 1;
    this.trail = []; // For movement trail
  }

  getColor() {
    const colors = ['#38bdf8', '#a78bfa', '#34d399', '#f472b6', '#fb923c', '#fbbf24'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  update() {
    this.wobble += this.wobbleSpeed;

    // Trail logic
    if (!this.caught) {
        this.trail.push({x: this.x, y: this.y, alpha: 0.5});
        if(this.trail.length > 5) this.trail.shift();
        this.trail.forEach(t => t.alpha -= 0.05);
    } else {
        this.trail = [];
    }

    // Movement
    if (!this.caught) {
      // Easing movement
      this.x += this.speedX;
      this.y += this.speedY;
      
      // Bounce
      if (this.x < 0 || this.x > width) this.speedX *= -1;
      if (this.y < 0 || this.y > height) this.speedY *= -1;

      // Breathing size
      this.size = this.baseSize + Math.sin(this.wobble) * 2;

      // Catch Logic
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < this.size + 30) { // 30 is net radius approx
        this.catch();
      }
    } else {
      // Lerp towards mouse
      this.x += (mouse.x - this.x) * 0.15;
      this.y += (mouse.y - this.y) * 0.15;
      this.caughtScale = 0.6 + Math.sin(time * 0.2) * 0.1; // Pulse when caught
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual feedback
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    // Show Toast occasionally
    if (Math.random() > 0.7) {
      const names = ["Mist Sprite", "Ember Wisp", "Crystal Shard", "Void Moth", "Aether Jelly"];
      catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    if (this.caught) {
        ctx.scale(this.caughtScale, this.caughtScale);
        // Rotate caught creature
        ctx.rotate(time * 0.05);
    }

    // Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    
    // Draw Trail
    if (!this.caught) {
        // We need to translate back relative to current pos to draw trail
        // But since we translated to creature center, we draw trail relative to 0,0
        // Actually easier to draw trail before translate, but let's do it here for simplicity
        // by drawing relative to current position minus trail offset.
        // Simplified: Just skip complex trail in transform for now, or draw simple dots.
    }

    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    
    // Organic Blob Shape
    const points = 6;
    for (let i = 0; i < points; i++) {
        const a = (Math.PI * 2 / points) * i + (this.caught ? 0 : time * 0.02);
        // Make wobble more organic
        const r = this.size + Math.sin(this.wobble + i * 1.5) * (this.size * 0.2);
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // Inner Highlight (Shiny effect)
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(-this.size*0.2, -this.size*0.2, this.size*0.3, 0, Math.PI*2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    const eyeOffset = this.size * 0.3;
    ctx.beginPath();
    // Eyes follow mouse slightly?
    const lookX = (mouse.x - this.x) * 0.05;
    const lookY = (mouse.y - this.y) * 0.05;
    
    ctx.arc(-eyeOffset + lookX*0.5, -eyeOffset/2 + lookY*0.5, this.size * 0.25, 0, Math.PI*2);
    ctx.arc(eyeOffset + lookX*0.5, -eyeOffset/2 + lookY*0.5, this.size * 0.25, 0, Math.PI*2);
    ctx.fill();

    // Pupils
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(-eyeOffset + lookX, -eyeOffset/2 + lookY, this.size * 0.1, 0, Math.PI*2);
    ctx.arc(eyeOffset + lookX, -eyeOffset/2 + lookY, this.size * 0.1, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color, 1.5));
  }
}

// Draw The Net
function drawNet() {
  // Smooth net movement
  netMouse.x += (mouse.x - netMouse.x) * 0.2;
  netMouse.y += (mouse.y - netMouse.y) * 0.2;
  
  const size = 40;
  
  ctx.save();
  ctx.translate(netMouse.x, netMouse.y);
  
  // Outer Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(255,255,255,0.5)';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Ring (Target)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, Math.PI * 2);
  ctx.stroke();
  
  // Crosshair lines
  ctx.beginPath();
  ctx.moveTo(-size - 5, 0);
  ctx.lineTo(-size + 5, 0);
  ctx.moveTo(size - 5, 0);
  ctx.lineTo(size + 5, 0);
  ctx.moveTo(0, -size - 5);
  ctx.lineTo(0, -size + 5);
  ctx.moveTo(0, size - 5);
  ctx.lineTo(0, size + 5);
  ctx.stroke();

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  for(let i = -size; i <= size; i+=15) {
      ctx.beginPath();
      // Vertical
      ctx.moveTo(i, -Math.sqrt(Math.max(0, size*size - i*i)));
      ctx.lineTo(i, Math.sqrt(Math.max(0, size*size - i*i)));
      // Horizontal
      ctx.moveTo(-Math.sqrt(Math.max(0, size*size - i*i)), i);
      ctx.lineTo(Math.sqrt(Math.max(0, size*size - i*i)), i);
      ctx.stroke();
  }

  ctx.restore();
}

// Draw Background Stars
const stars = Array(80).fill().map(() => ({
    x: Math.random() * 3000,
    y: Math.random() * 3000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.2
}));

function drawBackground() {
    // Clear with transparent to keep trails? No, clean clear for crispness.
    // We handle trails inside creatures.
    ctx.clearRect(0, 0, width, height);

    // Stars
    ctx.fillStyle = '#ffffff';
    stars.forEach(star => {
        // Parallax effect based on mouse
        const px = (mouse.x - width/2) * star.speed * 0.05;
        const py = (mouse.y - height/2) * star.speed * 0.05;
        
        ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.0005 + star.x)) * star.alpha + 0.2;
        ctx.beginPath();
        ctx.arc((star.x % width) + px, (star.y % height) + py, star.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// Init
for (let i = 0; i < 10; i++) {
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  time++;
  drawBackground();
  
  // Draw Creatures (sort by size/depth for pseudo-3D feel)
  creatures.sort((a, b) => a.size - b.size);
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Logic: Reset game
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
</body>
</html>
