<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina: Aether Collection</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-surface: #0f172a;
    --primary: #38bdf8; /* Sky Blue */
    --primary-glow: rgba(56, 189, 248, 0.4);
    --accent: #e879f9; /* Fuchsia */
    --gold: #fbbf24;
    --gold-glow: rgba(251, 191, 36, 0.6);
    --text-main: #f1f5f9;
    --text-muted: #64748b;
    
    --font-display: 'Arial Black', 'Helvetica Neue', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    
    --glass-bg: rgba(15, 23, 42, 0.65);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: none;
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    /* Deep atmospheric gradient */
    background: radial-gradient(circle at 50% 130%, #1e293b 0%, #020617 50%, #000000 100%);
    overflow: hidden;
  }

  /* Grain overlay for texture */
  .app-container::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 50;
    opacity: 0.5;
  }

  /* HUD Header */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 3rem 4rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 20;
    pointer-events: none;
  }

  .title-group {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 2;
  }

  .title-group h1 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 40px rgba(255,255,255,0.2);
    line-height: 0.9;
    margin-left: -0.15em; /* Optic alignment */
  }

  .title-group p {
    font-size: 0.65rem;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.9;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-left: -0.15em;
  }
  
  .title-group p::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--primary);
    animation: pulse 2s infinite ease-in-out;
  }

  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    padding: 0.6rem 1.2rem;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    min-width: 140px;
  }

  .stat-pill:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.3);
  }

  .stat-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: var(--primary);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .stat-info {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.55rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-top: 3px;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
  }

  /* Bottom Action Bar */
  .action-bar {
    position: absolute;
    bottom: 4rem;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 20;
    pointer-events: none;
  }

  .btn-collect {
    pointer-events: auto;
    background: linear-gradient(160deg, #fde047 0%, #d97706 100%);
    color: #451a03;
    border: none;
    padding: 1.4rem 5rem;
    font-family: var(--font-display);
    font-size: 0.85rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 24px;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 25px 60px -12px var(--gold-glow);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
  }

  .btn-collect:hover {
    transform: scale(1.04) translateY(-2px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.3), 0 35px 70px -10px var(--gold-glow);
  }
  
  .btn-collect:active {
    transform: scale(0.96);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95) translateY(-20px);
    background: rgba(2, 6, 23, 0.8);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 1.5rem 3rem;
    border-radius: 16px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) translateY(0);
  }

  .toast h3 { 
    color: var(--primary); 
    margin-bottom: 0.4rem; 
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.8;
  }
  .toast p { 
    font-family: var(--font-display);
    font-size: 1.75rem; 
    color: #fff; 
    font-weight: 800;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }

  /* Decorative corner grid */
  .corner-grid {
    position: absolute;
    top: 0; left: 0;
    width: 250px; height: 250px;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
    pointer-events: none;
    mask-image: linear-gradient(to bottom, black 10%, transparent 70%);
    -webkit-mask-image: linear-gradient(to bottom, black 10%, transparent 70%);
    border-right: 1px solid rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  
  .corner-grid-br {
    position: absolute;
    bottom: 0; right: 0;
    width: 250px; height: 250px;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
    pointer-events: none;
    mask-image: linear-gradient(to top, black 10%, transparent 70%);
    -webkit-mask-image: linear-gradient(to top, black 10%, transparent 70%);
    border-left: 1px solid rgba(255,255,255,0.03);
    border-top: 1px solid rgba(255,255,255,0.03);
  }

  @keyframes pulse {
    0% { opacity: 0.4; transform: scale(0.9); box-shadow: 0 0 0 var(--primary); }
    50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 15px var(--primary); }
    100% { opacity: 0.4; transform: scale(0.9); box-shadow: 0 0 0 var(--primary); }
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Lumina</h1>
      <p>Region 04: The Floating Isles</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <div class="stat-icon">
          <!-- Target Icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <div class="stat-icon" style="color: var(--accent)">
          <!-- Chart Icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        </div>
        <div class="stat-info">
          <div class="stat-value">74%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Decorative Grids -->
  <div class="corner-grid"></div>
  <div class="corner-grid-br"></div>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Mist Sprite</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Lumina: Aether Collection
 * Visuals: Polished depth of field, organic jelly physics, glassmorphism UI.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: 0, y: 0 };
let netMouse = { x: 0, y: 0 }; 
let particles = [];
let creatures = [];
let floatingTexts = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// Touch Support
window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: false });

// --- Classes ---

class Particle {
  constructor(x, y, color, speedMult = 1) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 * speedMult;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.015;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.9;
    this.vy *= 0.9;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -2;
  }

  update() {
    this.y += this.vy;
    this.vy *= 0.9;
    this.life -= 0.015;
  }

  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = '#fff';
    ctx.font = '800 18px system-ui';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.baseSize = Math.random() * 20 + 18; // Slightly bigger
    this.size = this.baseSize;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = (Math.random() - 0.5) * 1.2;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.03 + 0.02;
    this.color = this.getColor();
    this.caught = false;
    this.caughtScale = 1;
    this.rotation = 0;
    this.trail = []; // For movement trail
  }

  getColor() {
    // Refined Palette
    const colors = ['#22d3ee', '#a78bfa', '#34d399', '#f472b6', '#fb923c', '#fbbf24'];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  update() {
    this.wobble += this.wobbleSpeed;

    // Movement
    if (!this.caught) {
      this.x += this.vx;
      this.y += this.vy;
      
      // Smooth Bounce
      if (this.x < -50 || this.x > width + 50) this.vx *= -1;
      if (this.y < -50 || this.y > height + 50) this.vy *= -1;

      // Breathing size
      this.size = this.baseSize + Math.sin(this.wobble) * 4;

      // Catch Logic
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < this.size + 25) { 
        this.catch();
      }
    } else {
      // Elastic follow
      this.x += (mouse.x - this.x) * 0.08;
      this.y += (mouse.y - this.y) * 0.08;
      this.rotation += 0.03;
      this.caughtScale = 0.6 + Math.sin(time * 0.1) * 0.05;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual feedback
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    // Show Toast
    if (Math.random() > 0.5) {
      const names = ["Mist Sprite", "Ember Wisp", "Crystal Shard", "Void Moth", "Aether Jelly", "Nebula Cub"];
      catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    if (this.caught) {
        ctx.scale(this.caughtScale, this.caughtScale);
        ctx.rotate(this.rotation);
    }

    // Glow
    ctx.shadowBlur = 30;
    ctx.shadowColor = this.color;
    
    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    
    // Organic Blob Shape (Jelly physics)
    const points = 8;
    for (let i = 0; i < points; i++) {
        const a = (Math.PI * 2 / points) * i + (this.caught ? 0 : time * 0.01);
        // More complex sine wave for organic shape
        const r = this.size + Math.sin(this.wobble + i * 2.5) * (this.size * 0.2);
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // Inner Highlight (Glassy effect)
    // Radial gradient for 3D feel
    const grad = ctx.createRadialGradient(-this.size*0.3, -this.size*0.3, this.size*0.1, 0, 0, this.size);
    grad.addColorStop(0, 'rgba(255,255,255,0.4)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    const eyeOffset = this.size * 0.3;
    
    // Eyes follow mouse slightly
    const lookX = (mouse.x - this.x) * 0.04;
    const lookY = (mouse.y - this.y) * 0.04;
    
    ctx.beginPath();
    // Left Eye
    ctx.ellipse(-eyeOffset + lookX*0.5, -eyeOffset/2 + lookY*0.5, this.size * 0.28, this.size * 0.32, 0, 0, Math.PI*2);
    // Right Eye
    ctx.ellipse(eyeOffset + lookX*0.5, -eyeOffset/2 + lookY*0.5, this.size * 0.28, this.size * 0.32, 0, 0, Math.PI*2);
    ctx.fill();

    // Pupils
    ctx.fillStyle = '#020617';
    ctx.beginPath();
    ctx.arc(-eyeOffset + lookX, -eyeOffset/2 + lookY, this.size * 0.13, 0, Math.PI*2);
    ctx.arc(eyeOffset + lookX, -eyeOffset/2 + lookY, this.size * 0.13, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(x, y, color, 1.8));
  }
}

// Draw The Net (Polished)
function drawNet() {
  // Smooth net movement
  netMouse.x += (mouse.x - netMouse.x) * 0.2;
  netMouse.y += (mouse.y - mouse.y) * 0.2; // Typo fix: mouse.y - netMouse.y
  netMouse.y += (mouse.y - netMouse.y) * 0.2;
  
  const size = 40;
  
  ctx.save();
  ctx.translate(netMouse.x, netMouse.y);
  
  // Outer Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(255,255,255,0.4)';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Ring (Target)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.stroke();
  
  // Crosshair lines
  ctx.beginPath();
  ctx.moveTo(-size - 12, 0); ctx.lineTo(-size + 8, 0);
  ctx.moveTo(size - 8, 0); ctx.lineTo(size + 12, 0);
  ctx.moveTo(0, -size - 12); ctx.lineTo(0, -size + 8);
  ctx.moveTo(0, size - 8); ctx.lineTo(0, size + 12);
  ctx.stroke();

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 0;
  for(let i = -size; i <= size; i+=15) {
      ctx.beginPath();
      ctx.moveTo(i, -Math.sqrt(Math.max(0, size*size - i*i)));
      ctx.lineTo(i, Math.sqrt(Math.max(0, size*size - i*i)));
      ctx.moveTo(-Math.sqrt(Math.max(0, size*size - i*i)), i);
      ctx.lineTo(Math.sqrt(Math.max(0, size*size - i*i)), i);
      ctx.stroke();
  }

  ctx.restore();
}

// Draw Background Stars
const stars = Array(150).fill().map(() => ({
    x: Math.random() * 3000,
    y: Math.random() * 3000,
    size: Math.random() * 2,
    alpha: Math.random(),
    speed: Math.random() * 0.3
}));

function drawBackground() {
    ctx.clearRect(0, 0, width, height);

    // Stars
    ctx.fillStyle = '#ffffff';
    stars.forEach(star => {
        // Parallax effect based on mouse
        const px = (mouse.x - width/2) * star.speed * 0.02;
        const py = (mouse.y - height/2) * star.speed * 0.02;
        
        // Twinkle
        ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.0003 + star.x)) * star.alpha + 0.1;
        ctx.beginPath();
        ctx.arc((star.x % width) + px, (star.y % height) + py, star.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// Init
for (let i = 0; i < 12; i++) {
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  time++;
  drawBackground();
  
  // Draw Creatures (sort by size/depth for pseudo-3D feel)
  creatures.sort((a, b) => a.size - b.size);
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Logic: Reset game
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
