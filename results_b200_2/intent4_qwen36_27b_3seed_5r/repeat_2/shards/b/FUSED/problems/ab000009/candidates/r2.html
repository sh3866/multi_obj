<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Slate & Cream */
            --bg-body: #0f1115;
            --bg-panel: #1a1d24;
            --bg-panel-header: #22262f;
            
            --text-primary: #f0f2f5;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;

            --accent-gold: #d4af37;
            --accent-gold-dim: #8a7324;
            
            /* Board Colors */
            --board-light: #E8EDF9;
            --board-dark: #5C6B73;
            --board-border: #1e2026;
            
            /* Highlights */
            --highlight-move: rgba(212, 175, 55, 0.45);
            --highlight-last: rgba(212, 175, 55, 0.25);
            
            /* Dimensions */
            --square-size: clamp(35px, 8vw, 75px);
            --icon-size: clamp(32px, 7vw, 65px);
            --board-total: calc(var(--square-size) * 8);
            
            /* Spacing & Radius */
            --radius-lg: 12px;
            --radius-md: 6px;
            --radius-sm: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Layout Container */
        .interface-container {
            display: flex;
            gap: 40px;
            align-items: center;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }

        /* --- The Chessboard --- */
        .board-wrapper {
            position: relative;
            padding: 12px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-total);
            height: var(--board-total);
            border: 4px solid var(--board-border);
            border-radius: 2px;
            position: relative;
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Last Move Highlight */
        .square.highlight {
            background-color: var(--highlight-last) !important;
        }
        .square.highlight.light { background-color: #f0e68c; } /* Yellow tint for light */
        .square.highlight.dark { background-color: #bbcd00; }  /* Yellow tint for dark */

        /* Coordinates */
        .coord {
            position: absolute;
            font-size: 0.75rem; /* Increased size */
            font-weight: 700;
            opacity: 0.8;
            pointer-events: none;
            font-family: "Courier New", Courier, monospace; /* Monospaced for alignment */
            line-height: 1;
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }

        /* High Contrast logic for coordinates */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        /* Pieces */
        .piece {
            width: var(--icon-size);
            height: var(--icon-size);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Subtle drop shadow for depth */
            filter: drop-shadow(1px 4px 4px rgba(0,0,0,0.25));
            z-index: 2;
        }
        .piece:hover { transform: scale(1.08) translateY(-2px); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 320px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(var(--board-total) + 48px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Header / Status */
        .panel-header {
            padding: 24px;
            background: var(--bg-panel-header);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .game-title {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-id { font-weight: 700; color: var(--text-secondary); }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px;
            border-radius: var(--radius-md);
            transition: background 0.3s;
        }
        .status-bar:last-child { margin-bottom: 0; }
        .status-bar.active { background: rgba(255,255,255,0.03); }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .player-info.active { color: var(--text-primary); }

        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #aaa;
        }
        .player-info.active .player-avatar {
            background: #444;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold-dim);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
        }

        .timer {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.25rem;
            background: #111;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .status-bar.active .timer {
            border-color: var(--accent-gold-dim);
            color: var(--accent-gold);
            background: #0d0d0d;
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            background: #181a1f;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .history-table th {
            text-align: left;
            padding: 12px 24px;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: #181a1f;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 1;
        }

        .history-table td {
            padding: 10px 24px;
            font-family: "Georgia", serif;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        /* Enhanced Zebra Striping */
        .history-table tbody tr:nth-child(odd) { background-color: rgba(255,255,255,0.02); }
        .history-table tbody tr:hover { background-color: rgba(255,255,255,0.04); }
        
        .history-table td:first-child { 
            color: var(--text-muted); 
            width: 40px; 
            font-family: -apple-system, sans-serif;
            font-size: 0.8rem;
        }

        /* Controls */
        .controls {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: var(--bg-panel);
        }

        .btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-secondary);
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
        
        .btn-primary {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #1e2124;
            font-weight: 700;
        }
        .btn-primary:hover { background: #e5c14b; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3); }

        /* Resign Button - Demoted */
        .btn-resign {
            background: transparent;
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #dc3545;
            grid-column: span 2;
            font-size: 0.8rem;
            padding: 8px;
        }
        .btn-resign:hover {
            background: rgba(220, 53, 69, 0.1);
            border-color: #dc3545;
            color: #ff6b6b;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        @media (max-width: 850px) {
            .interface-container { flex-direction: column; gap: 24px; }
            .panel { width: 100%; max-width: calc(var(--square-size) * 8); height: auto; max-height: 400px; }
        }
    </style>
</head>

        { w: 'd4', b: 'Nbd7' }
    ];

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Add Last Move Highlight (Critique #6: c3 and e8)
                // c3 is row 5, col 2. e8 is row 0, col 4.
                if ((row === 5 && col === 2) || (row === 0 && col === 4)) {
                    square.classList.add('highlight');
                }

                // Coordinates
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Piece Placement
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on position for the initial setup
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    // Map 'p' to 'p', etc.
                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function renderHistory() {
        historyEl.innerHTML = '';
        mockHistory.forEach((move, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}.</td>
                <td>${move.w}</td>
                <td>${move.b}</td>
            `;
            historyEl.appendChild(tr);
        });
    }

    function resetGame() {
        // Simple visual reset animation
        boardEl.style.opacity = '0.5';
        historyEl.style.opacity = '0.5';
        setTimeout(() => {
            renderBoard();
            renderHistory();
            boardEl.style.opacity = '1';
            historyEl.style.opacity = '1';
        }, 300);
    }

    // Initial Render
    renderBoard();
    renderHistory();

</script>
</body>
</html>
