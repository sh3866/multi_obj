<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Classic</title>
    <style>
        :root {
            /* Palette: Refined & High Contrast */
            --bg-body: #121212; /* Deep charcoal, softer than pure black */
            --bg-panel: #1e1e1e;
            --bg-panel-header: #252525;
            --border-color: #333333;

            --text-primary: #f0f0f0;
            --text-secondary: #9e9e9e;
            --text-muted: #666666;

            /* Board Palette (Critique Point 2: Richer, Deeper) */
            --board-light: #EAE9D2; /* Warm, bright cream */
            --board-dark: #5C8771;  /* Deep, rich sage green */
            --board-border: #2a2a2a;
            
            /* Accents */
            --accent-gold: #D4AF37; /* Muted Gold */
            --accent-gold-hover: #e5c14b;
            --accent-red: #c43b3b;
            --accent-red-bg: rgba(196, 59, 59, 0.1);
            
            /* Dimensions */
            --square-size: clamp(38px, 9vw, 85px);
            --icon-size: clamp(35px, 8.5vw, 80px);
            --board-total: calc(var(--square-size) * 8);
            
            /* Spacing & Radius */
            --radius-lg: 12px;
            --radius-md: 6px;
            --radius-sm: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Layout Container */
        .interface-container {
            display: flex;
            gap: 50px;
            align-items: center;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            justify-content: center;
        }

        /* --- The Chessboard --- */
        .board-wrapper {
            position: relative;
            padding: 12px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px var(--border-color);
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-total);
            height: var(--board-total);
            border: 5px solid var(--board-border);
            border-radius: 2px;
            position: relative;
        }

        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Subtle texture or gradient could go here, keeping flat for crispness */
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Coordinates (Critique Point 2: Distinct & High Contrast) */
        .coord {
            position: absolute;
            font-size: 0.7rem;
            font-weight: 700;
            pointer-events: none;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1;
            z-index: 1;
            font-variant-numeric: tabular-nums;
        }
        .coord.rank { top: 4px; left: 5px; }
        .coord.file { bottom: 4px; right: 5px; }

        /* High Contrast Logic */
        .square.light .coord { color: var(--board-dark); opacity: 0.8; }
        .square.dark .coord { color: var(--board-light); opacity: 0.9; }

        /* Pieces (Critique Point 1: Crisp, Flat, Solid) */
        .piece {
            width: var(--icon-size);
            height: var(--icon-size);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 2;
            /* Realistic shadow: soft but distinct */
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.4));
        }
        .piece:hover { transform: scale(1.05) translateY(-2px); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 360px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(var(--board-total) + 64px);
        }

        /* Header / Status (Critique Point 4: Serif Header) */
        .panel-header {
            padding: 32px 32px 24px 32px;
            background: var(--bg-panel-header);
            border-bottom: 1px solid var(--border-color);
        }

        .game-title {
            font-family: "Georgia", "Times New Roman", serif; /* Serif for Classic feel */
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .game-id { 
            font-family: sans-serif; 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Player Status Bars */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid transparent; /* Placeholder for active state */
            transition: all 0.3s ease;
        }
        .status-bar:last-child { margin-bottom: 0; }

        /* Active Player Indicator (Critique Point 3: Subtle but clear) */
        .status-bar.active { 
            background: rgba(255,255,255,0.03); 
            border-color: rgba(255,255,255,0.1);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 500;
            font-size: 1rem;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .player-info.active { color: var(--text-primary); }

        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #777;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .player-info.active .player-avatar {
            background: #2a2a2a;
            color: var(--text-primary);
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .timer {
            font-family: "Roboto Mono", "Courier New", Courier, monospace;
            font-size: 1.1rem;
            background: #141414;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            letter-spacing: 1px;
            border: 1px solid #222;
            min-width: 80px;
            text-align: right;
        }
        .status-bar.active .timer {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: #0f0f0f;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Move History (Critique Point 3: Proper Table) */
        .history-container {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-panel);
            position: relative;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            padding-top: 10px;
        }

        .history-table th {
            text-align: left;
            padding: 0 24px 16px 24px;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            border-bottom: 1px solid #2a2a2a;
        }

        .history-table td {
            padding: 12px 24px;
            font-family: "Roboto Mono", monospace; /* Monospace for alignment */
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            letter-spacing: 0.5px;
        }

        .history-table tbody tr:hover { background-color: rgba(255,255,255,0.03); }
        
        .history-table td:first-child { 
            color: var(--text-muted); 
            width: 45px; 
            font-family: sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            border-right: 1px solid rgba(255,255,255,0.03);
        }

        /* Controls (Critique Point 3: Restructured) */
        .controls {
            padding: 28px 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-panel);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: sans-serif;
        }

        .btn:hover { 
            background: rgba(255,255,255,0.05); 
            border-color: #555; 
            color: var(--text-primary);
        }
        .btn:active { transform: translateY(1px); }

        /* Resign (Distinct Red) */
        .btn-resign {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            grid-column: span 2;
            font-size: 0.85rem;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: -4px;
        }
        .btn-resign:hover {
            color: var(--accent-red);
            background: var(--accent-red-bg);
            border-radius: var(--radius-sm);
        }
        .btn-resign svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* New Game (Primary Muted Gold) */
        .btn-primary {
            background: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            color: #1a1a1a;
            font-weight: 700;
            grid-column: span 2;
            margin-top: 8px;
        }
        .btn-primary:hover { 
            background: var(--accent-gold-hover); 
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15); 
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        @media (max-width: 950px) {
            .interface-container { flex-direction: column; gap: 30px; }
            .panel { width: 100%; max-width: calc(var(--square-size) * 8); height: auto; max-height: 400px; }
        }
    </style>
</head>

            </div>
        </div>

        <!-- Side Panel -->

                <!-- White Status -->
                <div class="status-bar active" id="info-white">

                    </div>
                    <div class="timer" id="timer-white">10:00</div>
                </div>

                <!-- Black Status -->
                <div class="status-bar" id="info-black">
                    <div class="player-info">
                        <div class="player-avatar">♚</div>
                        <span>Black</span>
                    </div>
                    <div class="timer" id="timer-black">10:00</div>
                </div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Moves injected here -->
                    </tbody>
                </table>
            </div>

            <div class="controls">
                <button class="btn">Undo</button>
                <button class="btn">Draw</button>
                <button class="btn btn-resign">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    Resign

                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
            </div>
        </div>

    </div>

    // --- Game State ---
    const initialBoard = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black (row 0)
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White (row 7)
    ];

    const boardEl = document.getElementById('board');
    const historyEl = document.getElementById('move-history');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    
    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;

                // Coordinates
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Piece Placement
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on position for the initial setup
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    // Map 'p' to 'p', etc.
                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function renderHistory() {
        historyEl.innerHTML = '';
        // Critique Point 3: Proper table structure. 
        // Since it's a new game, we show a placeholder row or empty state.
        // Here we show a "Game Start" message inside the table structure for clarity.
        const row = document.createElement('tr');
        row.innerHTML = `
            <td style="color: var(--text-muted);">-</td>
            <td colspan="2" style="font-style: italic; color: var(--text-secondary); padding-left: 40px;">White to move</td>
        `;
        historyEl.appendChild(row);
    }

    function resetGame() {
        // Simple visual reset animation
        boardEl.style.opacity = '0.5';
        historyEl.style.opacity = '0.5';
        setTimeout(() => {
            renderBoard();
            renderHistory();
            boardEl.style.opacity = '1';
            historyEl.style.opacity = '1';
        }, 300);
    }

    // Initial Render
    renderBoard();
    renderHistory();

</script>
</body>
</html>
