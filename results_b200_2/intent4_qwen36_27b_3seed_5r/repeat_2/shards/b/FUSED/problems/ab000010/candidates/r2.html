<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere of Life — 3D Simulation</title>
<style>
    :root {
        --bg-color: #050508;
        --panel-bg: rgba(15, 15, 20, 0.4);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text-primary: #eef2ff;
        --text-secondary: #94a3b8;
        --accent-primary: #818cf8; /* Indigo */
        --accent-secondary: #c084fc; /* Violet */
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    /* Background Ambience */
    #bg-glow {
        position: absolute;
        width: 120vw;
        height: 120vh;
        background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 60%);
        z-index: 0;
        pointer-events: none;
    }

    #canvas-container {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        display: block;
        cursor: grab;
    }

    canvas:active {
        cursor: grabbing;
    }

    /* Floating Glassmorphism UI */
    #ui-panel {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        width: 280px;
        background: var(--panel-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 24px;
        z-index: 10;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 20px;
        transition: opacity 0.3s ease;
    }

    .header {
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 16px;
        margin-bottom: 4px;
    }

    h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0 0 4px 0;
        color: var(--text-primary);
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        background-color: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 8px #10b981;
        transition: background-color 0.3s;
    }
    .status-dot.paused { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }

    .subtitle {
        font-size: 11px;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    /* Data Grid */
    .data-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .data-item {
        display: flex;
        flex-direction: column;
    }

    .data-label {
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }

    .data-value {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: 400;
        color: var(--accent-primary);
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* Sliders */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        font-weight: 500;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin: 0;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: rgba(255,255,255,0.15);
        border-radius: 1px;
    }

    /* Buttons */
    .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
    }

    button {
        padding: 10px;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.03);
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: var(--font-ui);
    }

    button:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
        border-color: rgba(255,255,255,0.2);
    }

    button.primary {
        background: rgba(129, 140, 248, 0.15);
        border-color: rgba(129, 140, 248, 0.3);
        color: var(--accent-primary);
    }

    button.primary:hover {
        background: rgba(129, 140, 248, 0.25);
        color: #fff;
    }

    /* Mobile Adjustments */
    @media (max-width: 800px) {
        #ui-panel {
            right: 0;
            bottom: 0;
            top: auto;
            transform: none;
            width: 100%;
            border-radius: 20px 20px 0 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
            padding: 20px;
            padding-bottom: 30px;
            box-sizing: border-box;
            box-shadow: 0 -10px 40px -10px rgba(0, 0, 0, 0.5);
        }
    }
</style>
</head>
<body>

<div id="bg-glow"></div>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<div id="ui-panel">
    <div class="header">
        <h1>
            Simulation
            <div class="status-dot" id="statusDot"></div>
        </h1>
        <div class="subtitle">Conway's Game of Life on a Geodesic Manifold</div>
    </div>

    <div class="data-grid">
        <div class="data-item">
            <span class="data-label">Generation</span>
            <span class="data-value" id="genCount">0</span>
        </div>
        <div class="data-item">
            <span class="data-label">Population</span>
            <span class="data-value" id="popCount">0</span>
        </div>
    </div>

    <div class="control-group">
        <div class="label-row">
            <span>Sim Speed</span>
            <span id="speedVal" style="color: #fff; font-family: var(--font-mono);">50%</span>
        </div>
        <input type="range" id="speed" min="1" max="100" value="50">
    </div>

    <div class="control-group">
        <div class="label-row">
            <span>Auto Rotate</span>
            <span id="rotVal" style="color: #fff; font-family: var(--font-mono);">Slow</span>
        </div>
        <input type="range" id="rotation" min="0" max="100" value="20">
    </div>

    <div class="btn-group">
        <button id="btnReset">Randomize</button>
        <button id="btnPause" class="primary">Pause</button>
    </div>
</div>

<script>
    /**
     * Configuration
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // Dimensions
    let width, height, cx, cy, radius;
    
    // Grid Resolution (High Density)
    // 60 Latitudes x 120 Longitudes = 7200 Cells
    const RINGS = 60; 
    const SEGMENTS = 120; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Simulation State
    // grid: 0=dead, 1=alive
    let grid = new Uint8Array(TOTAL_CELLS); 
    let nextGrid = new Uint8Array(TOTAL_CELLS);
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visuals
    let rotationSpeed = 0.002;
    let simSpeed = 50;
    let cellDensity = 0.35; // Initial density
    let rotY = 0;
    let rotX = 0.3;
    let pulse = 0; // Pulse effect magnitude (decays over time)

    // Interaction
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        cx = width / 2;
        cy = height / 2;
        // Dynamic radius based on screen size
        radius = Math.min(width, height) * 0.35;
    }

    function randomizeGrid() {
        generation = 0;
        pulse = 1; // Trigger pulse
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    
    // Precompute Spherical Coordinates to save CPU per frame
    // We store raw x,y,z for a unit sphere
    const cellCoords = new Float32Array(TOTAL_CELLS * 3); // x, y, z per cell

    function precomputeGeometry() {
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const r = i % RINGS;
            const s = Math.floor(i / RINGS);
            
            // Phi (0 to PI)
            const phi = ((r + 0.5) / RINGS) * Math.PI;
            // Theta (0 to 2PI)
            const theta = ((s + 0.5) / SEGMENTS) * 2 * Math.PI;
            
            const idx = i * 3;
            cellCoords[idx] = Math.sin(phi) * Math.cos(theta);     // x
            cellCoords[idx + 1] = Math.cos(phi);                   // y
            cellCoords[idx + 2] = Math.sin(phi) * Math.sin(theta); // z
        }
    }

    // Call this once
    precomputeGeometry();

    function rotatePoint(x, y, z, ry, rx) {
        // Rotate Y
        const cosY = Math.cos(ry);
        const sinY = Math.sin(ry);
        const x1 = x * cosY - z * sinY;
        const z1 = x * sinY + z * cosY;
        
        // Rotate X
        const cosX = Math.cos(rx);
        const sinX = Math.sin(rx);
        const y2 = y * cosX - z1 * sinX;
        const z2 = y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    /**
     * Game Logic
     */
    function getNeighbors(r, s) {
        let count = 0;
        // Wrap logic for toroidal connectivity on the grid surface
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                
                // Handle wrapping
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        pulse = 1.0; // Trigger pulse effect
        
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                if (state === 1) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        
        // Swap buffers
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
    }

    /**
     * Rendering
     */
    function draw() {
        // Background Clear
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);
        
        // Auto Rotation
        if (!isDragging && rotationSpeed > 0) {
            rotY += rotationSpeed;
        }
        
        // Decay Pulse
        if (pulse > 0) pulse -= 0.05;
        if (pulse < 0) pulse = 0;

        // Calculate Projection Matrix / Constants
        const fov = 2.5; // Field of view distance
        const cameraZ = -fov;
        
        // We will collect visible cells to sort them
        const visibleCells = [];
        
        // Optimization: Pre-calculate rotation values
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);

        // Iterate and Project
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i] === 0) continue; // Skip dead cells entirely

            const baseX = cellCoords[i * 3];
            const baseY = cellCoords[i * 3 + 1];
            const baseZ = cellCoords[i * 3 + 2];

            // Manual Matrix Multiplication for speed
            // Rotate Y
            let rx = baseX * cosY - baseZ * sinY;
            let rz = baseX * sinY + baseZ * cosY;
            // Rotate X
            let ry = baseY * cosX - rz * sinX;
            let rzFinal = baseY * sinX + rz * cosX;

            // Depth check (facing camera)
            if (rzFinal > -0.2) {
                // Perspective Projection
                // z is now depth relative to camera
                const zOffset = fov - rzFinal; // Distance from camera
                const scale = 1 / zOffset;
                
                const screenX = cx + rx * scale * radius * 1.5; // 1.5 zoom factor
                const screenY = cy - ry * scale * radius * 1.5; // Flip Y

                visibleCells.push({
                    x: screenX,
                    y: screenY,
                    z: rzFinal, // Depth for sorting (-1 to 1)
                    scale: scale
                });
            }
        }
        
        // Sort by Z (Painter's Algorithm) - draw back to front
        visibleCells.sort((a, b) => a.z - b.z);
        
        // Render Cells
        // Use 'lighter' for additive blending (glow effect)
        ctx.globalCompositeOperation = 'lighter';
        
        for (let cell of visibleCells) {
            // --- Lighting Model ---
            
            // Fresnel-like effect: Edges (z near 0/-1) are darker, Center (z near 1) is bright
            // Normalize z from -1..1 to 0..1
            const depthNorm = (cell.z + 1) / 2; 
            
            // Ambient + Diffuse approximation
            const brightness = 0.1 + (depthNorm * 0.9);
            
            // Size calculation
            // Base size * perspective scale * pulse animation
            const baseSize = 3.5;
            const size = (baseSize * cell.scale * radius * 0.05) * (1 + pulse * 0.3);
            
            // Color Gradient: Deep Indigo (Back) -> Electric Violet/Cyan (Front)
            // Hue: 260 (Indigo) -> 290 (Violet) -> 180 (Cyan)
            // We map depthNorm to Hue.
            // Back (0) -> 260
            // Front (1) -> 190
            const hue = 260 - (depthNorm * 70);
            
            // Alpha based on depth (occlusion)
            const alpha = 0.2 + (depthNorm * 0.8);
            
            ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
            
            ctx.beginPath();
            ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Reset composite
        ctx.globalCompositeOperation = 'source-over';

        // Optional: Draw a very faint wireframe sphere outline to bound it
        // (Omitted for cleaner "floating particles" look)
    }

    function loop() {
        // Simulation Logic
        if (!isPaused) {
            // Speed Control: Higher value = faster updates
            // Map 1-100 to frames per step
            // 100 = update every 1 frame
            // 1 = update every 100 frames
            const framesPerStep = Math.max(1, Math.floor(101 - simSpeed));
            
            if (frameCount % framesPerStep === 0) {
                step();
                updateStats();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.0003;
                rotVal.innerText = val < 30 ? 'Slow' : (val > 70 ? 'Fast' : 'Med');
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            randomizeGrid();
        });
        
        const pauseBtn = document.getElementById('btnPause');
        const statusDot = document.getElementById('statusDot');
        
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? 'Resume' : 'Pause';
            pauseBtn.classList.toggle('primary', !isPaused);
            statusDot.classList.toggle('paused', isPaused);
        });
    }

    function setupInteraction() {
        const startDrag = (x, y) => {
            isDragging = true;
            lastMouseX = x;
            lastMouseY = y;
        };

        const moveDrag = (x, y) => {
            if (isDragging) {
                const deltaX = x - lastMouseX;
                const deltaY = y - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                // Clamp X rotation to avoid flipping
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = x;
                lastMouseY = y;
            }
        };

        const endDrag = () => {
            isDragging = false;
        };

        // Mouse
        canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        // Touch
        canvas.addEventListener('touchstart', (e) => {
            startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if(isDragging) e.preventDefault();
            moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        window.addEventListener('touchend', endDrag);
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop.toLocaleString();
        document.getElementById('genCount').innerText = generation.toLocaleString();
    }

    // Start
    init();

</script>
</body>
</html>
