<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere of Life</title>
<style>
    :root {
        --bg-color: #030305;
        --panel-bg: rgba(10, 10, 14, 0.65);
        --text-primary: #ffffff;
        --text-secondary: #6b7280;
        --accent-cyan: #00f3ff;
        --accent-magenta: #ff00ff;
        --border: rgba(255, 255, 255, 0.1);
        --font-stack: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --mono-stack: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
    }

    /* Layout */
    #app {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        cursor: grab;
    }

    canvas:active {
        cursor: grabbing;
    }

    /* Control Panel */
    #controls {
        position: absolute;
        right: 40px;
        top: 50%;
        transform: translateY(-50%);
        width: 300px;
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 30px;
        z-index: 10;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Header */
    .header {
        margin-bottom: 8px;
    }

    h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 6px 0;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    h1::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: var(--accent-cyan);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-cyan);
    }

    .subtitle {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
    }

    /* Stats Area - High Prominence */
    .stats-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 8px;
    }

    .stat-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .stat-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }

    .stat-val {
        font-size: 24px;
        font-family: var(--mono-stack);
        font-weight: 600;
        color: var(--text-primary);
        line-height: 1;
    }

    .stat-val.pop { color: var(--accent-cyan); }
    .stat-val.gen { color: var(--accent-magenta); }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
    }

    .value-display {
        font-family: var(--mono-stack);
        color: var(--text-primary);
        font-size: 11px;
    }

    /* Sliders */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin: 0;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }

    /* Buttons */
    .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
    }

    button {
        padding: 12px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: var(--font-stack);
    }

    button:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
        border-color: rgba(255,255,255,0.3);
    }

    button.primary {
        background: rgba(0, 243, 255, 0.1);
        border-color: rgba(0, 243, 255, 0.3);
        color: var(--accent-cyan);
    }

    button.primary:hover {
        background: rgba(0, 243, 255, 0.2);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }

    /* Mobile */
    @media (max-width: 800px) {
        #controls {
            right: 0;
            bottom: 0;
            top: auto;
            transform: none;
            width: 100%;
            border-radius: 24px 24px 0 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
            padding-bottom: 40px;
        }
    }
</style>
</head>
<body>

<div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
        <div class="header">
            <h1>Cellular Sphere</h1>
            <div class="subtitle">Conway's Game of Life on a 3D manifold. Drag to rotate.</div>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-label">Population</span>
                <span class="stat-val pop" id="popCount">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Generation</span>
                <span class="stat-val gen" id="genCount">0</span>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Simulation Speed</span>
                <span class="value-display" id="speedVal">50%</span>
            </div>
            <input type="range" id="speed" min="1" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Cell Density</span>
                <span class="value-display" id="densityVal">35%</span>
            </div>
            <input type="range" id="density" min="10" max="90" value="35">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Auto Rotation</span>
                <span class="value-display" id="rotVal">On</span>
            </div>
            <input type="range" id="rotation" min="0" max="100" value="20">
        </div>

        <div class="btn-row">
            <button id="btnReset">Reset</button>
            <button id="btnStep">Step</button>
            <button id="btnPause" class="primary">Pause</button>
        </div>
    </div>
</div>

<script>
    /**
     * Configuration & State
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let width, height;
    let cx, cy;
    let radius;
    
    // Grid Configuration - Higher Resolution
    // RINGS (Latitudes) x SEGMENTS (Longitudes)
    // 50 rings * 100 segments = 5000 cells.
    const RINGS = 50; 
    const SEGMENTS = 100; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Simulation State
    let grid = new Uint8Array(TOTAL_CELLS); // Using Uint8Array for slight perf boost
    let nextGrid = new Uint8Array(TOTAL_CELLS);
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    
    // Visual Parameters
    let rotationSpeed = 0.002;
    let simSpeed = 50;
    let cellDensity = 0.35;
    let rotY = 0;
    let rotX = 0.2; // Initial tilt
    
    // Interaction
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        cx = width / 2;
        cy = height / 2;
        // Constrain sphere size to fit screen comfortably
        radius = Math.min(width, height) * 0.32;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            grid[i] = Math.random() < cellDensity ? 1 : 0;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    
    // Pre-calculate sin/cos for grid generation if needed, but for this count direct math is fine.
    // We compute 3D coords based on spherical coordinates.
    function getCellCoords(index) {
        // Map linear index to (r, s)
        // r = latitude ring index (0 to RINGS-1)
        // s = longitude segment index (0 to SEGMENTS-1)
        const r = index % RINGS;
        const s = Math.floor(index / RINGS);
        
        // Phi (0 to PI) - Top to Bottom
        // Offset by 0.5 to center in cell
        const phi = ((r + 0.5) / RINGS) * Math.PI;
        
        // Theta (0 to 2PI) - Around
        const theta = ((s + 0.5) / SEGMENTS) * 2 * Math.PI;
        
        // Spherical to Cartesian
        // x = sin(phi) * cos(theta)
        // y = cos(phi)
        // z = sin(phi) * sin(theta)
        return {
            x: Math.sin(phi) * Math.cos(theta),
            y: Math.cos(phi),
            z: Math.sin(phi) * Math.sin(theta)
        };
    }

    function rotatePoint(x, y, z, rotY, rotX) {
        // Rotate around Y axis
        let cosY = Math.cos(rotY);
        let sinY = Math.sin(rotY);
        let x1 = x * cosY - z * sinY;
        let z1 = x * sinY + z * cosY;
        
        // Rotate around X axis
        let cosX = Math.cos(rotX);
        let sinX = Math.sin(rotX);
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;
        
        return { x: x1, y: y2, z: z2 };
    }

    /**
     * Game Logic
     */
    function getNeighbors(r, s) {
        let count = 0;
        
        // Check 8 neighbors with wrapping (toroidal logic on the sphere surface grid)
        // Note: True sphere topology at poles is complex, but wrapping is visually acceptable here.
        for (let dr = -1; dr <= 1; dr++) {
            for (let ds = -1; ds <= 1; ds++) {
                if (dr === 0 && ds === 0) continue;
                
                // Wrap around indices
                let nr = (r + dr + RINGS) % RINGS;
                let ns = (s + ds + SEGMENTS) % SEGMENTS;
                
                // Index calculation
                if (grid[nr * SEGMENTS + ns]) count++;
            }
        }
        return count;
    }

    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                const neighbors = getNeighbors(r, s);
                
                // Conway's Rules
                if (state === 1) {
                    // Survival: 2 or 3 neighbors
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    // Birth: exactly 3 neighbors
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        
        // Swap
        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;
        
        generation++;
    }

    /**
     * Rendering
     */
    function draw() {
        // Clear background
        ctx.fillStyle = '#030305';
        ctx.fillRect(0, 0, width, height);
        
        // Auto Rotation
        if (!isDragging && rotationSpeed > 0) {
            rotY += rotationSpeed;
        }

        const cellsToDraw = [];
        
        // 1. Calculate 3D positions and project
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const r = i % RINGS;
            const s = Math.floor(i / RINGS);
            
            // Get base coordinates
            const pos3D = getCellCoords(i);
            
            // Rotate
            const rotated = rotatePoint(pos3D.x, pos3D.y, pos3D.z, rotY, rotX);
            
            // Depth check: only draw if facing camera
            // z is depth (-1 at back, 1 at front)
            if (rotated.z > -0.1) {
                
                // Simple Perspective Projection
                // Camera is at z = -3 roughly
                const fov = 3.5;
                const zOffset = fov - rotated.z; 
                const scale = radius * (fov / zOffset);
                
                const screenX = cx + rotated.x * scale;
                const screenY = cy - rotated.y * scale; // Flip Y for canvas
                
                cellsToDraw.push({
                    x: screenX,
                    y: screenY,
                    z: rotated.z, // For sorting and lighting
                    scale: scale,
                    alive: grid[i]
                });
            }
        }
        
        // 2. Sort by depth (Painter's Algorithm)
        // Draw furthest cells first
        cellsToDraw.sort((a, b) => a.z - b.z);
        
        // 3. Draw Cells
        // Use 'lighter' composite operation for that neon glow effect on dark bg
        ctx.globalCompositeOperation = 'lighter';
        
        for (let cell of cellsToDraw) {
            if (!cell.alive) continue;
            
            // --- Lighting & Color Model ---
            
            // Base lighting based on Z (depth/normal dot product approximation)
            // Front (z=1) is bright, Back (z=0) is dim
            const brightness = 0.3 + (cell.z * 0.7); 
            
            // Color Palette: Cyan (Front) -> Magenta (Back)
            // Hue: 180 (Cyan) to 300 (Magenta)
            // Interpolate hue based on Z
            const hue = 180 + (cell.z * 120); // 180 to 300
            
            // Size calculation
            // Cells should appear smaller at edges due to perspective, but not too small to see
            const size = Math.max(0.5, (cell.scale * 0.035) * (0.5 + cell.z * 0.5));
            
            // Draw Cell
            // Using HSLA for vibrant colors
            ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${brightness})`;
            
            ctx.beginPath();
            ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Reset composite operation for standard drawing (like outlines if needed)
        ctx.globalCompositeOperation = 'source-over';
        
        // Optional: Draw a subtle rim or outline for the sphere itself to define volume
        // We draw this last, so it's on top? No, usually behind or very subtle.
        // Let's skip the outline to keep it clean "floating points" style.
    }

    function loop() {
        // Simulation Throttle
        if (!isPaused) {
            // Map slider 1-100 to frames per step
            // 100 = 1 frame per step (fast)
            // 1 = 100 frames per step (slow)
            const framesPerStep = Math.max(1, Math.floor(101 - simSpeed));
            if (frameCount % framesPerStep === 0) {
                step();
                updateStats();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });
        // Trigger reset on density change to apply immediately? 
        // Or just apply on next reset. Let's apply on next reset for safety, 
        // but the prompt implies controls affect sim. 
        // Actually, changing density mid-sim is jarring. Let's just update the variable.

        const rotSlider = document.getElementById('rotation');
        const rotVal = document.getElementById('rotVal');
        rotSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 0) {
                rotationSpeed = 0;
                rotVal.innerText = 'Off';
            } else {
                rotationSpeed = val * 0.0002;
                rotVal.innerText = 'On';
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            randomizeGrid();
        });
        
        document.getElementById('btnStep').addEventListener('click', () => {
            isPaused = true;
            step();
            updateStats();
            const btn = document.getElementById('btnPause');
            btn.innerText = 'Play';
            btn.classList.remove('primary');
        });

        const pauseBtn = document.getElementById('btnPause');
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.innerText = isPaused ? 'Play' : 'Pause';
            if(isPaused) pauseBtn.classList.remove('primary');
            else pauseBtn.classList.add('primary');
        });
    }

    function setupInteraction() {
        const startDrag = (x, y) => {
            isDragging = true;
            lastMouseX = x;
            lastMouseY = y;
        };

        const moveDrag = (x, y) => {
            if (isDragging) {
                const deltaX = x - lastMouseX;
                const deltaY = y - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                // Clamp X rotation to avoid gimbal lock / flipping upside down completely
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = x;
                lastMouseY = y;
            }
        };

        const endDrag = () => {
            isDragging = false;
        };

        // Mouse
        canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        // Touch
        canvas.addEventListener('touchstart', (e) => {
            startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if(isDragging) e.preventDefault(); // Prevent scroll
            moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        window.addEventListener('touchend', endDrag);
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop.toLocaleString();
        document.getElementById('genCount').innerText = generation.toLocaleString();
    }

    // Start
    init();

</script>
</body>
</html>
