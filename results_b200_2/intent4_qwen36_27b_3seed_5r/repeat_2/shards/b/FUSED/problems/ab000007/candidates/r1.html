<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    --bg-deep: #050b14;
    --bg-surface: #0f172a;
    --primary: #22d3ee; /* Cyan */
    --primary-dim: #0891b2;
    --accent: #c084fc; /* Purple */
    --accent-glow: rgba(192, 132, 252, 0.4);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --glass-bg: rgba(15, 23, 42, 0.65);
    --glass-border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* HUD */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
    pointer-events: none;
  }

  .title-group h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
    background: linear-gradient(to right, #fff, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
  }

  /* Fix HUD Legibility: Integrated region text into a badge */
  .region-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--primary-dim);
    color: var(--primary);
    padding: 0.25rem 0.75rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.1);
  }

  .hud-stats {
    display: flex;
    gap: 1.5rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.2s ease, border-color 0.2s;
  }

  .stat-pill:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.3);
  }

  .stat-icon {
    width: 20px;
    height: 20px;
    fill: var(--primary);
    filter: drop-shadow(0 0 5px var(--primary));
  }

  .stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: none;
  }

  /* Bottom Action Bar */
  .action-bar {
    position: absolute;
    bottom: 3rem;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
  }

  /* Refine Button: Holographic/Glowing UI */
  .btn-collect {
    pointer-events: auto;
    background: rgba(15, 23, 42, 0.8);
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 1rem 3.5rem;
    font-size: 0.9rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    border-radius: 4px; /* More geometric/tech feel */
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 15px rgba(34, 211, 238, 0.15), inset 0 0 20px rgba(34, 211, 238, 0.05);
    clip-path: polygon(
      10px 0, 100% 0, 
      100% calc(100% - 10px), calc(100% - 10px) 100%, 
      0 100%, 0 10px
    );
  }

  /* Button Glow Effect */
  .btn-collect::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .btn-collect:hover {
    background: rgba(34, 211, 238, 0.1);
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.4), inset 0 0 20px rgba(34, 211, 238, 0.1);
    text-shadow: 0 0 8px var(--primary);
    transform: scale(1.02);
  }
  
  .btn-collect:hover::after { transform: translateX(100%); }

  .btn-collect:active {
    transform: scale(0.98);
    box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 11, 20, 0.95);
    border: 1px solid var(--accent);
    padding: 1.5rem 3rem;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 0 40px rgba(192, 132, 252, 0.2);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { color: var(--accent); margin-bottom: 0.25rem; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .toast p { font-size: 1rem; color: var(--text-main); font-weight: 300; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <span class="region-badge">Region 04: The Floating Isles</span>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"/>
        </svg>
        <div>
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:var(--accent)" viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/>
        </svg>
        <div>
          <div class="stat-value">74%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Unknown Entity</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Interaction Script
 * Enhanced with:
 * 1. Player Avatar (Silhouette + Net)
 * 2. Deep Environment (Nebula + Dust)
 * 3. Diverse Creatures (Polygons, Wings, Orbs)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: 0, y: 0 };
let particles = [];
let creatures = [];
let floatingTexts = [];

// --- Configuration ---
const COLORS = {
  cyan: '#22d3ee',
  purple: '#c084fc',
  pink: '#f472b6',
  green: '#34d399',
  amber: '#fbbf24'
};

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 4 * speed;
    this.vy = (Math.random() - 0.5) * 4 * speed;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = COLORS.cyan;
    ctx.font = 'bold 18px system-ui';
    ctx.shadowColor = COLORS.cyan;
    ctx.shadowBlur = 10;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 15 + 15;
    this.speedX = (Math.random() - 0.5) * 2;
    this.speedY = (Math.random() - 0.5) * 2;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.color = Object.values(COLORS)[Math.floor(Math.random() * Object.keys(COLORS).length)];
    this.caught = false;
    
    // Diversify Creatures
    const types = ['orb', 'triangle', 'winged', 'diamond'];
    this.type = types[Math.floor(Math.random() * types.length)];
    this.rotation = 0;
    this.rotSpeed = (Math.random() - 0.5) * 0.05;
  }

  update() {
    this.wobble += 0.05;
    this.rotation += this.rotSpeed;

    if (!this.caught) {
      // Drifting movement
      this.x += this.speedX;
      this.y += this.speedY;

      // Bounce
      if (this.x < 0 || this.x > width) this.speedX *= -1;
      if (this.y < 0 || this.y > height) this.speedY *= -1;

      // Catch Logic
      // Calculate distance to mouse (net center)
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 50) { // Net radius approx
        this.catch();
      }
    } else {
      // Move towards mouse (follow net)
      this.x += (mouse.x - this.x) * 0.08;
      this.y += (mouse.y - this.y) * 0.08;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    if (Math.random() > 0.7) {
      const names = ["Aether Sprite", "Void Moth", "Crystal Shard", "Nebula Wisp"];
      catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;

    if (this.caught) {
        ctx.scale(0.8, 0.8);
        ctx.globalAlpha = 0.7;
    }

    // Draw Shapes based on type
    ctx.beginPath();
    if (this.type === 'orb') {
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
    } else if (this.type === 'triangle') {
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size, this.size);
        ctx.lineTo(-this.size, this.size);
        ctx.closePath();
    } else if (this.type === 'diamond') {
        ctx.moveTo(0, -this.size * 1.5);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(0, this.size * 1.5);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
    } else if (this.type === 'winged') {
        // Body
        ctx.moveTo(0, -this.size);
        ctx.quadraticCurveTo(this.size, 0, 0, this.size);
        ctx.quadraticCurveTo(-this.size, 0, 0, -this.size);
        // Wings
        ctx.moveTo(-this.size/2, 0);
        ctx.quadraticCurveTo(-this.size*2, -this.size, -this.size*1.5, this.size/2);
        ctx.moveTo(this.size/2, 0);
        ctx.quadraticCurveTo(this.size*2, -this.size, this.size*1.5, this.size/2);
    }
    
    ctx.fill();
    ctx.stroke();

    // Eyes (Simple)
    if (this.type !== 'diamond') {
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(-this.size/3, -this.size/4, this.size/5, 0, Math.PI*2);
        ctx.arc(this.size/3, -this.size/4, this.size/5, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
  }
}

// --- Player & Net (Critique Fix #1) ---
function drawPlayerAndNet() {
    const px = mouse.x;
    const py = mouse.y;
    const netRadius = 50;

    // 1. Draw the Net (Behind the avatar)
    ctx.save();
    ctx.translate(px, py);
    
    // Net Rim
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.8)';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 10;
    ctx.shadowColor = COLORS.cyan;
    ctx.beginPath();
    ctx.arc(0, 0, netRadius, 0, Math.PI * 2);
    ctx.stroke();

    // Net Mesh (Spiral)
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    for(let i=0; i<netRadius; i+=8) {
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, i, 0, Math.PI*2);
    }
    ctx.stroke();

    ctx.restore();

    // 2. Draw Player Avatar (Silhouette)
    // Positioned slightly below/left of the net to simulate holding it
    const avatarX = px - 30;
    const avatarY = py + 40;

    ctx.save();
    ctx.translate(avatarX, avatarY);
    ctx.rotate(Math.PI / 4); // Facing the net
    
    // Body Silhouette
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = COLORS.cyan;
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.arc(0, -20, 10, 0, Math.PI*2); // Head
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(15, 20); // Right leg
    ctx.lineTo(-15, 20); // Left leg
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Arm reaching to net
    ctx.beginPath();
    ctx.moveTo(5, -5);
    ctx.lineTo(35, -25); // Reaching towards center
    ctx.stroke();

    ctx.restore();
}

// --- Background (Critique Fix #2) ---
// Generate static stars once
const stars = Array(150).fill().map(() => ({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.2
}));

// Floating Dust
const dust = Array(20).fill().map(() => ({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 2 + 1,
    alpha: Math.random() * 0.3,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5
}));

function drawBackground() {
    // Clear with deep color
    ctx.fillStyle = '#050b14';
    ctx.fillRect(0, 0, width, height);

    // Subtle Nebula Gradient
    const time = Date.now() * 0.0002;
    const gradX = width/2 + Math.cos(time) * 200;
    const gradY = height/2 + Math.sin(time) * 200;
    
    const grad = ctx.createRadialGradient(gradX, gradY, 0, width/2, height/2, width);
    grad.addColorStop(0, 'rgba(192, 132, 252, 0.08)'); // Purple hint
    grad.addColorStop(0.5, 'rgba(34, 211, 238, 0.05)'); // Cyan hint
    grad.addColorStop(1, 'rgba(5, 11, 20, 0)');
    
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Stars
    stars.forEach(star => {
        // Slow drift
        star.x += star.speed;
        if (star.x > width) star.x = 0;

        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.001 + star.x)) * star.alpha;
        ctx.beginPath();
        ctx.arc(star.x % width, star.y % height, star.size, 0, Math.PI*2);
        ctx.fill();
    });

    // Dust
    dust.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.fillStyle = COLORS.cyan;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Init
for (let i = 0; i < 10; i++) {
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  drawBackground();
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Player & Net (Anchored to mouse)
  drawPlayerAndNet();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

</script>
</body>
</html>
