<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Floating Isles</title>
<style>
  :root {
    --bg-deep: #050b14;
    --bg-surface: #0f172a;
    --primary: #22d3ee; 
    --primary-dim: #0891b2;
    --accent: #c084fc; 
    --accent-glow: rgba(192, 132, 252, 0.6);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --glass-bg: rgba(15, 23, 42, 0.75);
    --glass-border: rgba(255, 255, 255, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: none; /* Hide default cursor */
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* HUD */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2.5rem 3.5rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
    pointer-events: none;
  }

  .title-group h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    background: linear-gradient(to right, #fff, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(34, 211, 238, 0.2);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  .region-badge {
    display: inline-block;
    background: rgba(5, 11, 20, 0.8);
    border: 1px solid var(--primary-dim);
    color: var(--primary);
    padding: 0.35rem 0.85rem;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.25rem;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(34, 211, 238, 0.15);
  }

  .hud-stats {
    display: flex;
    gap: 1.5rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.6rem 1.25rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, border-color 0.3s;
  }

  .stat-pill:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.4);
  }

  .stat-icon {
    width: 22px;
    height: 22px;
    fill: var(--primary);
    filter: drop-shadow(0 0 5px var(--primary));
  }

  .stat-value {
    font-size: 1.35rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.6rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 3px;
    font-weight: 600;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Bottom Action Bar */
  .action-bar {
    position: absolute;
    bottom: 3.5rem;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
  }

  /* Enhanced Button: Stronger Focal Point */
  .btn-collect {
    pointer-events: auto;
    background: linear-gradient(180deg, rgba(20, 30, 50, 0.9), rgba(10, 15, 25, 0.95));
    color: var(--primary);
    border: 1px solid rgba(34, 211, 238, 0.4);
    padding: 1.1rem 4rem;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.1), inset 0 0 20px rgba(34, 211, 238, 0.05);
    backdrop-filter: blur(10px);
  }

  /* Button Glow Animation */
  .btn-collect::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    box-shadow: inset 0 0 20px var(--primary);
    opacity: 0.3;
    animation: pulseBtn 3s infinite ease-in-out;
  }

  @keyframes pulseBtn {
    0% { box-shadow: inset 0 0 15px var(--primary); opacity: 0.2; }
    50% { box-shadow: inset 0 0 30px var(--primary); opacity: 0.5; }
    100% { box-shadow: inset 0 0 15px var(--primary); opacity: 0.2; }
  }

  .btn-collect:hover {
    background: rgba(34, 211, 238, 0.15);
    border-color: var(--primary);
    box-shadow: 0 0 40px rgba(34, 211, 238, 0.4), inset 0 0 20px rgba(34, 211, 238, 0.2);
    text-shadow: 0 0 10px var(--primary);
    transform: scale(1.05) translateY(-2px);
  }
  
  .btn-collect:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 11, 20, 0.9);
    border: 1px solid var(--accent);
    padding: 1.5rem 3rem;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 0 50px rgba(192, 132, 252, 0.3);
    backdrop-filter: blur(8px);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { color: var(--accent); margin-bottom: 0.25rem; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.15em; }
  .toast p { font-size: 1.1rem; color: var(--text-main); font-weight: 400; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <span class="region-badge">Region 04: Floating Isles</span>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
        </svg>
        <div>
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:var(--accent)" viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/>
        </svg>
        <div>
          <div class="stat-value">74%</div>
          <div class="stat-label">Atlas</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Unknown Entity</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Interaction Script
 * 
 * Updates applied:
 * 1. Environment: Added Parallax Floating Isles, Mist layers, and Nebula.
 * 2. Player: Added a 'Glider' avatar that follows the mouse with smooth easing.
 * 3. Creatures: Added organic trails, wing beats, and varied silhouettes.
 * 4. Composition: Creatures spawn evenly across the entire canvas.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let floatingIsles = [];
let mistParticles = [];

// --- Configuration ---
const COLORS = {
  cyan: '#22d3ee',
  purple: '#c084fc',
  pink: '#f472b6',
  green: '#34d399',
  amber: '#fbbf24',
  rock: '#1e293b'
};

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initEnvironment();
}
window.addEventListener('resize', resize);

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6 * speed;
    this.vy = (Math.random() - 0.5) * 6 * speed;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 4 + 1;
    this.decay = Math.random() * 0.02 + 0.01;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -2;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.02;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px system-ui';
    ctx.shadowColor = COLORS.cyan;
    ctx.shadowBlur = 15;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
  }

  init() {
    // Rebalance Composition: Distribute evenly across full canvas
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 12 + 12;
    this.speedX = (Math.random() - 0.5) * 1.5;
    this.speedY = (Math.random() - 0.5) * 1.5;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.color = Object.values(COLORS)[Math.floor(Math.random() * Object.keys(COLORS).length)];
    this.caught = false;
    
    // Enhanced Identity: Types
    const types = ['orb', 'triangle', 'winged', 'diamond', 'squid'];
    this.type = types[Math.floor(Math.random() * types.length)];
    this.rotation = 0;
    this.rotSpeed = (Math.random() - 0.5) * 0.04;
    
    // Trails
    this.history = [];
    this.maxHistory = 10;
  }

  update() {
    this.wobble += 0.05;
    this.rotation += this.rotSpeed;

    // Store history for trail
    if (this.history.length > this.maxHistory) this.history.shift();
    this.history.push({x: this.x, y: this.y});

    if (!this.caught) {
      // Drifting movement
      this.x += this.speedX;
      this.y += this.speedY;

      // Bounce
      if (this.x < -50) this.x = width + 50;
      if (this.x > width + 50) this.x = -50;
      if (this.y < -50) this.y = height + 50;
      if (this.y > height + 50) this.y = -50;

      // Catch Logic
      const dx = player.x - this.x; // Catch based on Player position, not just mouse
      const dy = player.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 60) { 
        this.catch();
      }
    } else {
      // Move towards player
      this.x += (player.x - this.x) * 0.1;
      this.y += (player.y - this.y) * 0.1;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    if (Math.random() > 0.7) {
      const names = ["Aether Sprite", "Void Moth", "Crystal Shard", "Nebula Wisp", "Star Jelly"];
      catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2500);
    }
  }

  draw(ctx) {
    ctx.save();
    
    // Draw Trail
    if (this.history.length > 1) {
        ctx.beginPath();
        ctx.moveTo(this.history[0].x, this.history[0].y);
        for(let i=1; i<this.history.length; i++) {
            ctx.lineTo(this.history[i].x, this.history[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.2;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }

    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;

    if (this.caught) {
        ctx.scale(0.6, 0.6);
        ctx.globalAlpha = 0.6;
    }

    // Draw Shapes based on type
    ctx.beginPath();
    if (this.type === 'orb') {
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
        // Inner detail
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-this.size/3, -this.size/3, this.size/4, 0, Math.PI*2);
        ctx.fill();
    } 
    else if (this.type === 'triangle') {
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size, this.size);
        ctx.lineTo(-this.size, this.size);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } 
    else if (this.type === 'diamond') {
        ctx.moveTo(0, -this.size * 1.5);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(0, this.size * 1.5);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
        ctx.fill();
    } 
    else if (this.type === 'winged') {
        // Body
        ctx.moveTo(0, -this.size);
        ctx.quadraticCurveTo(this.size, 0, 0, this.size);
        ctx.quadraticCurveTo(-this.size, 0, 0, -this.size);
        ctx.fill();
        
        // Wings animation
        const wingSpan = Math.sin(this.wobble * 5) * 10;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.ellipse(-this.size, 0, this.size + wingSpan, this.size/2, Math.PI/4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(this.size, 0, this.size + wingSpan, this.size/2, -Math.PI/4, 0, Math.PI*2);
        ctx.fill();
    }
    else if (this.type === 'squid') {
        ctx.arc(0, -this.size/2, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-this.size, 0);
        ctx.quadraticCurveTo(-this.size, this.size, -this.size/2, this.size*1.5);
        ctx.lineTo(this.size/2, this.size*1.5);
        ctx.quadraticCurveTo(this.size, this.size, this.size, 0);
        ctx.fill();
    }
    
    ctx.restore();
  }
}

// --- Player Object (Critique Fix #1) ---
const player = {
    x: window.innerWidth/2,
    y: window.innerHeight/2,
    angle: 0,
    draw: function() {
        // Smooth follow
        this.x += (mouse.x - this.x) * 0.08;
        this.y += (mouse.y - this.y) * 0.08;
        
        // Calculate angle towards mouse for the net arm
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        this.angle = Math.atan2(dy, dx);

        ctx.save();
        ctx.translate(this.x, this.y);

        // 1. Draw Net (Trailing behind cursor or at cursor?)
        // Let's make the cursor the Net, and the Player trails slightly behind
        // Or Player is at cursor, Net extends.
        // Let's go with: Player is a Glider near cursor, Net is the cursor.
        
        // Draw Net (At actual mouse pos relative to player)
        ctx.save();
        ctx.translate(dx, dy); // Move to mouse pos
        
        // Net Mesh
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.6)';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 15;
        ctx.shadowColor = COLORS.cyan;
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, Math.PI * 2);
        ctx.stroke();
        
        // Grid
        ctx.beginPath();
        for(let i=5; i<40; i+=10) {
            ctx.arc(0, 0, i, 0, Math.PI*2);
        }
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
        ctx.stroke();
        ctx.restore();

        // 2. Draw Glider Avatar (At this.x, this.y)
        // Rotate slightly based on movement
        const moveAngle = Math.atan2(dy, dx);
        ctx.rotate(moveAngle + Math.PI/2); // Face direction of movement

        // Body
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = COLORS.cyan;
        ctx.lineWidth = 2;
        
        // Silhouette
        ctx.beginPath();
        ctx.moveTo(0, -25); // Nose
        ctx.lineTo(15, 15); // Right Wing
        ctx.lineTo(0, 10);  // Tail
        ctx.lineTo(-15, 15); // Left Wing
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Engine glow
        ctx.fillStyle = COLORS.purple;
        ctx.shadowColor = COLORS.purple;
        ctx.beginPath();
        ctx.arc(0, 15, 3, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
};

// --- Background Environment (Critique Fix #2) ---
function initEnvironment() {
    floatingIsles = [];
    // Create some background rocks
    for(let i=0; i<6; i++) {
        floatingIsles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 80 + 40,
            speed: Math.random() * 0.2 + 0.1,
            depth: Math.random() * 0.5 + 0.1 // Parallax depth
        });
    }
    
    mistParticles = [];
    for(let i=0; i<30; i++) {
        mistParticles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 100 + 50,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            alpha: Math.random() * 0.1
        });
    }
}

function drawBackground() {
    // Clear
    ctx.fillStyle = '#050b14';
    ctx.fillRect(0, 0, width, height);

    // Nebula Gradient
    const time = Date.now() * 0.0001;
    const grad = ctx.createRadialGradient(
        width/2 + Math.cos(time)*200, 
        height/2 + Math.sin(time)*200, 
        0, 
        width/2, height/2, width
    );
    grad.addColorStop(0, 'rgba(192, 132, 252, 0.1)');
    grad.addColorStop(0.6, 'rgba(34, 211, 238, 0.05)');
    grad.addColorStop(1, 'rgba(5, 11, 20, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Floating Isles (Parallax)
    floatingIsles.forEach(isle => {
        // Parallax movement based on mouse
        const parallaxX = (mouse.x - width/2) * (isle.depth * 0.05);
        const parallaxY = (mouse.y - height/2) * (isle.depth * 0.05);
        
        const drawX = (isle.x + parallaxX) % (width + 200) - 100;
        const drawY = (isle.y + parallaxY) % (height + 200) - 100;

        ctx.save();
        ctx.translate(drawX, drawY);
        
        // Draw Rock Shape
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.1)';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        ctx.moveTo(-isle.size, 0);
        ctx.lineTo(-isle.size/2, isle.size/1.5);
        ctx.lineTo(isle.size/2, isle.size/1.5);
        ctx.lineTo(isle.size, 0);
        ctx.lineTo(isle.size/2, -isle.size/2);
        ctx.lineTo(-isle.size/2, -isle.size/2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Floating debris
        ctx.fillStyle = 'rgba(34, 211, 238, 0.2)';
        ctx.beginPath();
        ctx.arc(isle.size + 20, -20, 5, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    });

    // Mist
    mistParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -100) p.x = width + 100;
        if (p.x > width + 100) p.x = -100;
        if (p.y < -100) p.y = height + 100;
        if (p.y > height + 100) p.y = -100;

        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Init
initEnvironment();
for (let i = 0; i < 12; i++) { // More creatures
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  drawBackground();
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Player (Anchored to mouse logic)
  player.draw();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(player.x, player.y, '#fff');
});

</script>
