<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Floating Isles</title>
<style>
  :root {
    /* Palette: Deep Space, Bioluminescent Cyan, Ethereal Gold */
    --bg-deep: #020617;
    --bg-mid: #0f172a;
    --primary: #22d3ee;
    --primary-glow: rgba(34, 211, 238, 0.6);
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.6);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    
    /* Typography */
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-body: 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    color: #f8fafc;
    font-family: var(--font-body);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    cursor: none; /* Custom cursor logic in JS */
    user-select: none;
  }

  /* --- Canvas Layer --- */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* --- UI Layer (Glassmorphism) --- */
  .app-container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none; /* Let clicks pass through to canvas */
  }

  /* --- HUD --- */
  header {
    padding: 2rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .title-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    pointer-events: auto;
  }

  .title-group h1 {
    font-family: var(--font-display);
    font-size: 3.5rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
    line-height: 1;
  }

  .region-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-left: 4px solid var(--primary);
    color: var(--primary);
    padding: 0.6rem 1.2rem;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    width: fit-content;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    transform: skewX(-10deg);
  }
  
  .region-badge span {
    transform: skewX(10deg); /* Un-skew text */
  }

  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transform: skewX(-10deg);
    transition: all 0.3s ease;
  }

  .stat-pill:hover {
    transform: skewX(-10deg) translateY(-2px);
    border-color: var(--primary);
    background: rgba(34, 211, 238, 0.1);
  }

  .stat-content {
    display: flex;
    flex-direction: column;
    transform: skewX(10deg); /* Un-skew text */
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    line-height: 1;
    color: #fff;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    opacity: 0.8;
  }

  /* --- Action Bar --- */
  .action-bar {
    padding: 0 3rem 4rem 3rem;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .btn-collect {
    pointer-events: auto;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #fff;
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    padding: 1.2rem 5rem;
    font-family: var(--font-display);
    font-size: 1.2rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .btn-collect::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .btn-collect:hover {
    background: rgba(34, 211, 238, 0.15);
    border-color: var(--primary);
    color: var(--primary);
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.2);
    transform: translateY(-2px);
  }

  .btn-collect:hover::before {
    transform: translateX(100%);
  }

  /* --- Toast Notification --- */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(2, 6, 23, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid var(--accent);
    padding: 1.5rem 3rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 0 60px rgba(245, 158, 11, 0.15);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--accent); 
    margin-bottom: 0.25rem; 
    font-family: var(--font-display);
    font-size: 1.5rem; 
    letter-spacing: 0.15em; 
    text-shadow: 0 0 10px var(--accent-glow);
  }
  .toast p { 
    font-size: 0.9rem; 
    color: #cbd5e1; 
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* --- Custom Cursor (Net) --- */
  #cursor-net {
    position: absolute;
    top: 0; left: 0;
    width: 80px; height: 80px;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
  }
</style>
</head>
<body>

<!-- Custom SVG Cursor -->
<svg id="cursor-net" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="45" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="10 5" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="40" fill="rgba(34, 211, 238, 0.05)" stroke="#22d3ee" stroke-width="1" opacity="0.8"/>
  <path d="M50 10 L50 90 M10 50 L90 50" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="2" fill="#fff"/>
</svg>

<!-- Canvas Background Layer -->
<canvas id="gameCanvas"></canvas>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <div class="region-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
        <span>Region 04: Floating Isles</span>
      </div>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <div class="stat-content">
          <div class="stat-value" id="score">12</div>
          <div class="stat-label">Captured</div>
        </div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2">
           <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      
      <div class="stat-pill">
        <div class="stat-content">
          <div class="stat-value">74%</div>
          <div class="stat-label">Atlas</div>
        </div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
           <circle cx="12" cy="12" r="10"/>
           <path d="M12 6v6l4 2"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Acquired!</h3>
    <p id="catchName">Unknown Entity</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Interaction Script
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const cursorNet = document.getElementById('cursor-net');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 12;
let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
let targetMouse = { x: window.innerWidth/2, y: window.innerHeight/2 }; // For smooth player follow
let particles = [];
let creatures = [];
let floatingTexts = [];
let floatingIsles = [];
let mistParticles = [];
let time = 0;

// --- Configuration ---
const COLORS = {
  cyan: '#22d3ee',
  cyanDark: '#0891b2',
  purple: '#c084fc',
  pink: '#f472b6',
  amber: '#f59e0b',
  rock: '#0f172a',
  rockLight: '#1e293b'
};

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initEnvironment();
}
window.addEventListener('resize', resize);

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  // Move custom cursor immediately
  cursorNet.style.transform = `translate(${e.clientX - 40}px, ${e.clientY - 40}px)`;
});

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8 * speed;
    this.vy = (Math.random() - 0.5) * 8 * speed;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
    this.decay = Math.random() * 0.03 + 0.01;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui';
    ctx.shadowColor = COLORS.cyan;
    ctx.shadowBlur = 10;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
  }

  init() {
    // Spawn anywhere
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 10 + 15;
    // Slower, more organic movement
    this.speedX = (Math.random() - 0.5) * 0.5; 
    this.speedY = (Math.random() - 0.5) * 0.5;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.caught = false;
    
    // Define Type & Color
    const types = ['jelly', 'bird', 'orb', 'diamond'];
    this.type = types[Math.floor(Math.random() * types.length)];
    
    if (this.type === 'jelly') this.color = COLORS.pink;
    else if (this.type === 'bird') this.color = COLORS.amber;
    else if (this.type === 'diamond') this.color = COLORS.purple;
    else this.color = COLORS.cyan;

    this.rotation = 0;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.history = [];
    this.maxHistory = 12;
  }

  update() {
    this.wobble += 0.06;
    this.rotation += this.rotSpeed;

    // Trail History
    if (this.history.length > this.maxHistory) this.history.shift();
    this.history.push({x: this.x, y: this.y});

    if (!this.caught) {
      // Drifting physics
      this.x += this.speedX + Math.sin(this.wobble) * 0.3;
      this.y += this.speedY + Math.cos(this.wobble * 0.5) * 0.3;

      // Wrap around screen
      if (this.x < -50) this.x = width + 50;
      if (this.x > width + 50) this.x = -50;
      if (this.y < -50) this.y = height + 50;
      if (this.y > height + 50) this.y = -50;

      // Catch Logic
      // Calculate distance to player (smooth mouse position)
      const dx = targetMouse.x - this.x;
      const dy = targetMouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 50) { 
        this.catch();
      }
    } else {
      // Swirl around player when caught
      this.x += (targetMouse.x - this.x) * 0.05;
      this.y += (targetMouse.y - this.y) * 0.05;
      this.rotation += 0.1;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    if (Math.random() > 0.7) {
      const names = ["Aether Sprite", "Void Moth", "Crystal Shard", "Nebula Wisp", "Star Jelly"];
      catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    
    // Draw Trail
    if (this.history.length > 1) {
        ctx.beginPath();
        ctx.moveTo(this.history[0].x, this.history[0].y);
        for(let i=1; i<this.history.length; i++) {
            ctx.lineTo(this.history[i].x, this.history[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.15;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }

    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // Glow Effect
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;

    if (this.caught) {
        ctx.scale(0.5, 0.5);
        ctx.globalAlpha = 0.5;
    }

    // Draw Shapes
    ctx.beginPath();
    if (this.type === 'orb') {
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-this.size/3, -this.size/3, this.size/4, 0, Math.PI*2);
        ctx.fill();
    } 
    else if (this.type === 'bird') {
        // Geometric Bird
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(this.size/2, this.size);
        ctx.lineTo(-this.size/2, this.size);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } 
    else if (this.type === 'diamond') {
        ctx.moveTo(0, -this.size * 1.5);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(0, this.size * 1.5);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } 
    else if (this.type === 'jelly') {
        // Jellyfish
        ctx.arc(0, -this.size/3, this.size, Math.PI, 0); 
        ctx.lineTo(this.size, this.size); 
        ctx.quadraticCurveTo(this.size/2, this.size/2, 0, this.size);
        ctx.quadraticCurveTo(-this.size/2, this.size/2, -this.size, this.size); 
        ctx.lineTo(-this.size, -this.size/3);
        ctx.closePath();
        ctx.fill();
    }
    
    ctx.restore();
  }
}

// --- Background Environment ---
function initEnvironment() {
    floatingIsles = [];
    // Create background rocks (Isles)
    for(let i=0; i<8; i++) {
        floatingIsles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 150 + 80,
            speed: Math.random() * 0.2 + 0.05,
            depth: Math.random() * 0.4 + 0.1, // Parallax depth
            rotation: Math.random() * Math.PI,
            // Generate random polygon vertices for organic rock shape
            vertices: Array.from({length: 6}, () => ({
                x: (Math.random() - 0.5) * 2,
                y: (Math.random() - 0.5) * 2
            }))
        });
    }
    
    mistParticles = [];
    for(let i=0; i<25; i++) {
        mistParticles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 150 + 50,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            alpha: Math.random() * 0.05
        });
    }
}

function drawBackground() {
    // Clear with deep gradient
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#0f172a'); // Top
    grad.addColorStop(1, '#020617'); // Bottom
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Nebula / Ambient Light
    const time = Date.now() * 0.0001;
    const gradRad = ctx.createRadialGradient(
        width/2 + Math.cos(time)*300, 
        height/2 + Math.sin(time)*300, 
        0, 
        width/2, height/2, width
    );
    gradRad.addColorStop(0, 'rgba(192, 132, 252, 0.08)'); // Purple center
    gradRad.addColorStop(0.5, 'rgba(34, 211, 238, 0.03)'); // Cyan mid
    gradRad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = gradRad;
    ctx.fillRect(0, 0, width, height);

    // Floating Isles (Parallax)
    floatingIsles.forEach(isle => {
        // Parallax movement based on mouse offset from center
        const parallaxX = (mouse.x - width/2) * (isle.depth * 0.05);
        const parallaxY = (mouse.y - height/2) * (isle.depth * 0.05);
        
        // Wrap logic for infinite feel
        let drawX = (isle.x + parallaxX) % (width + 300) - 150;
        let drawY = (isle.y + parallaxY) % (height + 300) - 150;

        ctx.save();
        ctx.translate(drawX, drawY);
        ctx.rotate(isle.rotation);
        
        // Draw Rock Shape (Polygon)
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.15)';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        ctx.moveTo(isle.vertices[0].x * isle.size, isle.vertices[0].y * isle.size);
        for(let i=1; i<isle.vertices.length; i++) {
            ctx.lineTo(isle.vertices[i].x * isle.size, isle.vertices[i].y * isle.size);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Glowing Flora on Isle
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(isle.size/2, 0, 2, 0, Math.PI*2);
        ctx.fill();
        
        ctx.restore();
    });

    // Mist Layers
    mistParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        
        // Wrap
        if (p.x < -200) p.x = width + 200;
        if (p.x > width + 200) p.x = -200;
        if (p.y < -200) p.y = height + 200;
        if (p.y > height + 200) p.y = -200;

        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        grad.addColorStop(0, `rgba(255, 255, 255, ${p.alpha})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// --- Player Logic ---
function drawPlayer() {
    // Smooth follow logic for the player character
    const dx = mouse.x - targetMouse.x;
    const dy = mouse.y - targetMouse.y;
    targetMouse.x += dx * 0.08;
    targetMouse.y += dy * 0.08;
    
    // Calculate angle for rotation
    const angle = Math.atan2(dy, dx);

    ctx.save();
    ctx.translate(targetMouse.x, targetMouse.y);

    // 1. Draw Character (SVG Silhouette style)
    // Position character slightly offset to look like they are holding the net
    ctx.save();
    ctx.translate(-15, 15); // Offset relative to center
    // Only rotate if moving
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        ctx.rotate(angle + Math.PI/2); 
    }

    // Body Shape (Sleek Triangle/Glider)
    ctx.fillStyle = '#020617';
    ctx.strokeStyle = COLORS.cyan;
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.moveTo(0, -20); // Nose
    ctx.lineTo(12, 10); // Right Wing
    ctx.lineTo(0, 5);   // Tail notch
    ctx.lineTo(-12, 10); // Left Wing
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Engine Glow
    ctx.shadowColor = COLORS.purple;
    ctx.fillStyle = COLORS.purple;
    ctx.beginPath();
    ctx.arc(0, 8, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore(); // End Character Transform
    ctx.restore(); // End Player Transform
}

// Init
initEnvironment();
for (let i = 0; i < 15; i++) {
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  drawBackground();
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Player
  drawPlayer();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(targetMouse.x, targetMouse.y, '#fff');
});

</script>
</body>
