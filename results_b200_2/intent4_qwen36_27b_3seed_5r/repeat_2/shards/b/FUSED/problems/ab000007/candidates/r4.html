<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Floating Isles</title>
<style>
  :root {
    /* Palette: Deep Space, Bioluminescent Cyan, Ethereal Gold */
    --bg-deep: #050b14;
    --bg-mid: #0f172a;
    --primary: #22d3ee;
    --primary-dim: #0891b2;
    --accent: #f59e0b;
    
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    
    /* Glassmorphism Variables */
    --glass-surface: rgba(15, 23, 42, 0.45);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-body: 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    /* Mesh-like gradient background for atmosphere */
    background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 40%, #020617 100%);
    color: var(--text-main);
    font-family: var(--font-body);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    cursor: none; /* We draw a custom net cursor */
  }

  /* --- Layout Structure --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2; /* Above canvas */
  }

  /* --- Canvas Layer (Background) --- */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none; /* Let clicks pass through to UI if needed */
  }

  /* --- HUD (Glassmorphism) --- */
  header {
    position: relative;
    padding: 2rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none; /* Allow clicking through empty space */
  }

  .title-group {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .title-group h1 {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    /* Soft Glow for Aether theme */
    text-shadow: 0 0 25px rgba(34, 211, 238, 0.4), 0 2px 4px rgba(0,0,0,0.5);
    line-height: 1;
    margin-left: -0.05em; /* Optical alignment for Impact */
  }

  .region-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--glass-surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: var(--primary);
    padding: 0.5rem 1.2rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    width: fit-content;
    box-shadow: var(--glass-shadow);
  }
  
  .region-badge::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--primary);
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.8); } }

  .hud-stats {
    display: flex;
    gap: 1.2rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    padding: 0.8rem 1.5rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: var(--glass-shadow);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .stat-pill:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.4);
    background: rgba(255, 255, 255, 0.05);
  }

  .stat-icon {
    width: 24px;
    height: 24px;
    fill: var(--primary);
    filter: drop-shadow(0 0 6px var(--primary));
  }

  .stat-content {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.6rem;
    line-height: 1;
    letter-spacing: 0.02em;
    color: #fff;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 4px;
    font-weight: 600;
  }

  /* --- Action Bar --- */
  .action-bar {
    position: relative;
    padding: 0 3rem 4rem 3rem;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  /* Enhanced Button */
  .btn-collect {
    pointer-events: auto;
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #fff;
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    padding: 1.2rem 4rem;
    font-family: var(--font-display);
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
    box-shadow: var(--glass-shadow);
    /* Subtle angled cut */
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }

  .btn-collect:hover {
    background: rgba(34, 211, 238, 0.1);
    border-color: var(--primary);
    color: var(--primary);
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.15);
    transform: translateY(-2px);
  }
  
  .btn-collect:active {
    transform: scale(0.98) translateY(0);
  }

  /* --- Toast Notification --- */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 11, 20, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid var(--accent);
    padding: 1.5rem 3rem;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-align: center;
    box-shadow: 0 0 60px rgba(245, 158, 11, 0.1);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--accent); 
    margin-bottom: 0.5rem; 
    font-family: var(--font-display);
    font-size: 1.2rem; 
    letter-spacing: 0.15em; 
    text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
  }
  .toast p { 
    font-size: 1rem; 
    color: var(--text-main); 
    font-weight: 300;
    letter-spacing: 0.05em;
  }

</style>
</head>
<body>

<!-- Canvas Background Layer -->
<canvas id="gameCanvas"></canvas>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <span class="region-badge">Region 04: Floating Isles</span>
    </div>
    
    <div class="hud-stats">
      <!-- Logic Fix: Changed 0 to 12 to match Atlas % -->
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <div class="stat-content">
          <div class="stat-value" id="score">12</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:var(--accent)" viewBox="0 0 24 24">
          <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/>
        </svg>
        <div class="stat-content">
          <div class="stat-value">74%</div>
          <div class="stat-label">Atlas</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Unknown Entity</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Interaction Script
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 12; // Starting with 12 as per brief
let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let floatingIsles = [];
let mistParticles = [];

// --- Configuration ---
const COLORS = {
  cyan: '#22d3ee',
  cyanDark: '#0891b2',
  purple: '#c084fc',
  pink: '#f472b6',
  amber: '#f59e0b',
  rock: '#0f172a',
  rockLight: '#1e293b'
};

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initEnvironment();
}
window.addEventListener('resize', resize);

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8 * speed;
    this.vy = (Math.random() - 0.5) * 8 * speed;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
    this.decay = Math.random() * 0.03 + 0.01;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui';
    ctx.shadowColor = COLORS.cyan;
    ctx.shadowBlur = 10;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
  }

  init() {
    // Spawn anywhere
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 10 + 15;
    this.speedX = (Math.random() - 0.5) * 0.8; // Slower, more organic
    this.speedY = (Math.random() - 0.5) * 0.8;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.caught = false;
    
    // Define Type & Color
    const types = ['jelly', 'bird', 'orb', 'diamond'];
    this.type = types[Math.floor(Math.random() * types.length)];
    
    if (this.type === 'jelly') this.color = COLORS.pink;
    else if (this.type === 'bird') this.color = COLORS.amber;
    else if (this.type === 'diamond') this.color = COLORS.purple;
    else this.color = COLORS.cyan;

    this.rotation = 0;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.history = [];
    this.maxHistory = 12; // Longer trail
  }

  update() {
    this.wobble += 0.06;
    this.rotation += this.rotSpeed;

    // Trail History
    if (this.history.length > this.maxHistory) this.history.shift();
    this.history.push({x: this.x, y: this.y});

    if (!this.caught) {
      // Drifting physics
      this.x += this.speedX + Math.sin(this.wobble) * 0.3;
      this.y += this.speedY + Math.cos(this.wobble * 0.5) * 0.3;

      // Wrap around screen
      if (this.x < -50) this.x = width + 50;
      if (this.x > width + 50) this.x = -50;
      if (this.y < -50) this.y = height + 50;
      if (this.y > height + 50) this.y = -50;

      // Catch Logic
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 50) { 
        this.catch();
      }
    } else {
      // Swirl around player when caught
      this.x += (player.x - this.x) * 0.05;
      this.y += (player.y - this.y) * 0.05;
      this.rotation += 0.1;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    if (Math.random() > 0.7) {
      const names = ["Aether Sprite", "Void Moth", "Crystal Shard", "Nebula Wisp", "Star Jelly"];
      catchNameEl.innerText = names[Math.floor(Math.random() * names.length)];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    
    // Draw Trail
    if (this.history.length > 1) {
        ctx.beginPath();
        ctx.moveTo(this.history[0].x, this.history[0].y);
        for(let i=1; i<this.history.length; i++) {
            ctx.lineTo(this.history[i].x, this.history[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.15;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }

    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // Glow Effect
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;

    if (this.caught) {
        ctx.scale(0.5, 0.5);
        ctx.globalAlpha = 0.5;
    }

    // Draw Shapes
    ctx.beginPath();
    if (this.type === 'orb') {
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-this.size/3, -this.size/3, this.size/4, 0, Math.PI*2);
        ctx.fill();
    } 
    else if (this.type === 'bird') {
        // Geometric Bird
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(this.size/2, this.size);
        ctx.lineTo(-this.size/2, this.size);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } 
    else if (this.type === 'diamond') {
        ctx.moveTo(0, -this.size * 1.5);
        ctx.lineTo(this.size, 0);
        ctx.lineTo(0, this.size * 1.5);
        ctx.lineTo(-this.size, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } 
    else if (this.type === 'jelly') {
        // Jellyfish
        ctx.arc(0, -this.size/3, this.size, Math.PI, 0); 
        ctx.lineTo(this.size, this.size); 
        ctx.quadraticCurveTo(this.size/2, this.size/2, 0, this.size);
        ctx.quadraticCurveTo(-this.size/2, this.size/2, -this.size, this.size); 
        ctx.lineTo(-this.size, -this.size/3);
        ctx.closePath();
        ctx.fill();
    }
    
    ctx.restore();
  }
}

// --- Player Object (SVG Character) ---
const player = {
    x: window.innerWidth/2,
    y: window.innerHeight/2,
    draw: function() {
        // Smooth follow logic
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        this.x += dx * 0.08;
        this.y += dy * 0.08;
        
        // Calculate angle for rotation
        const angle = Math.atan2(dy, dx);

        ctx.save();
        ctx.translate(this.x, this.y);

        // 1. Draw Net (The Cursor) - Glowing ring
        ctx.save();
        ctx.translate(dx, dy);
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = COLORS.cyan;
        ctx.strokeStyle = COLORS.cyan;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, Math.PI * 2);
        ctx.stroke();
        
        // Net Grid (Subtle)
        ctx.beginPath();
        for(let i=10; i<40; i+=10) {
            ctx.arc(0, 0, i, 0, Math.PI*2);
        }
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
        ctx.stroke();
        ctx.restore();

        // 2. Draw Character (SVG Silhouette)
        // Position character slightly below/left of the net center to look like they are holding it
        ctx.save();
        ctx.translate(-15, 15); // Offset relative to net center
        ctx.rotate(angle + Math.PI/2); // Face movement direction

        // Body Shape (Sleek Triangle/Glider)
        ctx.fillStyle = '#020617';
        ctx.strokeStyle = COLORS.cyan;
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        ctx.moveTo(0, -20); // Nose
        ctx.lineTo(12, 10); // Right Wing
        ctx.lineTo(0, 5);   // Tail notch
        ctx.lineTo(-12, 10); // Left Wing
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Engine Glow
        ctx.shadowColor = COLORS.purple;
        ctx.fillStyle = COLORS.purple;
        ctx.beginPath();
        ctx.arc(0, 8, 4, 0, Math.PI*2);
        ctx.fill();

        ctx.restore(); // End Character Transform
        ctx.restore(); // End Player Transform
    }
};

// --- Background Environment ---
function initEnvironment() {
    floatingIsles = [];
    // Create background rocks
    for(let i=0; i<8; i++) {
        floatingIsles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 100 + 50,
            speed: Math.random() * 0.2 + 0.05,
            depth: Math.random() * 0.4 + 0.1, // Parallax depth
            rotation: Math.random() * Math.PI
        });
    }
    
    mistParticles = [];
    for(let i=0; i<25; i++) {
        mistParticles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 150 + 50,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            alpha: Math.random() * 0.05
        });
    }
}

function drawBackground() {
    // Clear with deep gradient
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#0f172a'); // Top
    grad.addColorStop(1, '#020617'); // Bottom
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Nebula / Ambient Light
    const time = Date.now() * 0.0001;
    const gradRad = ctx.createRadialGradient(
        width/2 + Math.cos(time)*300, 
        height/2 + Math.sin(time)*300, 
        0, 
        width/2, height/2, width
    );
    gradRad.addColorStop(0, 'rgba(192, 132, 252, 0.08)'); // Purple center
    gradRad.addColorStop(0.5, 'rgba(34, 211, 238, 0.03)'); // Cyan mid
    gradRad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = gradRad;
    ctx.fillRect(0, 0, width, height);

    // Floating Isles (Parallax)
    floatingIsles.forEach(isle => {
        // Parallax movement based on mouse offset from center
        const parallaxX = (mouse.x - width/2) * (isle.depth * 0.08);
        const parallaxY = (mouse.y - height/2) * (isle.depth * 0.08);
        
        // Wrap logic for infinite feel
        let drawX = (isle.x + parallaxX) % (width + 300) - 150;
        let drawY = (isle.y + parallaxY) % (height + 300) - 150;

        ctx.save();
        ctx.translate(drawX, drawY);
        ctx.rotate(isle.rotation);
        
        // Draw Rock Shape (Pentagon-ish)
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.15)';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        ctx.moveTo(-isle.size, 0);
        ctx.lineTo(-isle.size/2, isle.size/1.2);
        ctx.lineTo(isle.size/2, isle.size/1.2);
        ctx.lineTo(isle.size, 0);
        ctx.lineTo(isle.size/2, -isle.size/2);
        ctx.lineTo(-isle.size/2, -isle.size/2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Glowing Flora on Isle
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(isle.size/2, 0, 2, 0, Math.PI*2);
        ctx.fill();
        
        ctx.restore();
    });

    // Mist Layers
    mistParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        
        // Wrap
        if (p.x < -200) p.x = width + 200;
        if (p.x > width + 200) p.x = -200;
        if (p.y < -200) p.y = height + 200;
        if (p.y > height + 200) p.y = -200;

        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        grad.addColorStop(0, `rgba(255, 255, 255, ${p.alpha})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Init
initEnvironment();
for (let i = 0; i < 15; i++) {
  creatures.push(new Creature());
}

// Animation Loop
function animate() {
  drawBackground();
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  // Draw Player (Anchored to mouse logic)
  player.draw();

  requestAnimationFrame(animate);
}

animate();

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = 0;
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(player.x, player.y, '#fff');
});

</script>
