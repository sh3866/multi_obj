<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #030205;
            --bg-fog: #0f0c16;
            --gold-primary: #ffcc55;
            --gold-dim: #8a6e35;
            --gold-gradient: linear-gradient(135deg, #ffeebb 0%, #ffcc55 50%, #b38f1e 100%);
            --gold-text-gradient: linear-gradient(to bottom, #fff6d2 0%, #ffcc55 60%, #997a00 100%);
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --accent-glow: rgba(255, 204, 85, 0.15);
            --font-serif: 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */
        /* Deep Nebula Gradient */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 30%, rgba(60, 40, 90, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(30, 10, 60, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(10, 20, 60, 0.3) 0%, transparent 50%),
                linear-gradient(to bottom, #050508, #0a0812);
            z-index: 0;
        }

        /* Starfield using CSS Radial Gradients */
        .starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 10%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 40% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 50% 90%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1.5px 1.5px at 60% 20%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 90% 10%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 95% 50%, rgba(255,255,255,0.4), transparent);
            background-size: 550px 550px;
            opacity: 0.6;
            z-index: 1;
            animation: drift 120s linear infinite;
        }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 0 1100px; }
        }

        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* --- MAIN LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
            gap: 2rem;
        }

        /* --- HEADER & IDENTITY --- */
        header {
            text-align: center;
            position: relative;
            width: 100%;
            animation: fadeInDown 1.2s ease-out;
        }

        .game-title {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            line-height: 1;
            color: transparent;
            /* Gold Texture */
            background: var(--gold-text-gradient);
            -webkit-background-clip: text;
            /* Gold Glow */
            filter: drop-shadow(0 0 15px rgba(255, 204, 85, 0.3));
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            font-weight: 400;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            position: absolute;
            top: -0.8rem;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, rgba(20,15,5,0.9) 0%, rgba(40,30,10,0.9) 100%);
            border: 1px solid var(--gold-dim);
            padding: 8px 16px;
            border-radius: 4px 20px 20px 4px; /* Stylized shape */
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,204,85,0.1);
            animation: fadeInRight 1s ease-out 0.5s backwards;
        }

        .gold-icon {
            width: 20px;
            height: 20px;
            fill: url(#gold-grad); /* SVG Defs gradient */
            filter: drop-shadow(0 0 5px var(--gold-primary));
        }

        .gold-amount {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- HERO AREA: THE PORTAL --- */
        .hero-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 260px;
            width: 100%;
            position: relative;
            perspective: 1000px;
        }

        /* The Portal Ring */
        .portal-ring {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(100, 100, 255, 0.1);
            animation: spin 20s linear infinite;
        }
        
        .portal-ring::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 204, 85, 0.3);
            animation: spin-reverse 30s linear infinite;
        }

        /* The Orb */
        .spirit-orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            /* Complex layered gradient */
            background: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, transparent 15%),
                radial-gradient(circle at 50% 50%, rgba(100, 150, 255, 0.6) 0%, rgba(80, 20, 150, 0.4) 60%, transparent 80%),
                linear-gradient(135deg, #0f1016, #1a1b26);
            
            box-shadow: 
                0 0 40px rgba(100, 120, 255, 0.3),
                0 0 80px rgba(80, 20, 150, 0.2),
                inset 0 0 20px rgba(0,0,0,0.5);
            
            animation: float 6s ease-in-out infinite;
        }

        /* Inner Core */
        .spirit-orb::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px 5px rgba(200, 220, 255, 0.8);
            animation: corePulse 3s ease-in-out infinite;
        }

        /* --- MAIN MENU --- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.8s backwards;
        }

        /* --- CARD CRAFT (GLASSMORPHISM) --- */
        .menu-card {
            background: var(--glass-bg);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Shine effect on hover */
        .menu-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
        }

        .menu-card:hover::after {
            left: 150%;
            transition: 0.7s;
        }

        .menu-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* Primary Action (Summon) */
        .menu-card.primary {
            flex-direction: row;
            justify-content: flex-start; /* Align left for better balance with icon */
            padding: 1.5rem;
            height: 90px;
            background: linear-gradient(135deg, rgba(60, 40, 90, 0.3) 0%, rgba(20, 20, 30, 0.7) 100%);
            border: 1px solid rgba(255, 204, 85, 0.4);
            /* Hexagon-ish corners via clip-path or just rounded */
            border-radius: 16px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .menu-card.primary:hover {
            background: linear-gradient(135deg, rgba(80, 50, 120, 0.4) 0%, rgba(30, 30, 40, 0.8) 100%);
            border-color: var(--gold-primary);
            box-shadow: 0 0 30px rgba(255, 204, 85, 0.2);
        }

        /* Secondary Actions Row */
        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            width: 100%;
        }

        .menu-card.secondary {
            flex-direction: column;
            justify-content: center;
            text-align: center;
            height: 110px;
            padding: 0.8rem;
            border-radius: 12px;
        }

        /* --- CARD CONTENT --- */
        .card-icon {
            width: 32px;
            height: 32px;
            fill: #fff;
            transition: all 0.3s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .primary .card-icon {
            fill: var(--gold-primary);
            width: 38px;
            height: 38px;
            filter: drop-shadow(0 0 8px rgba(255, 204, 85, 0.5));
        }

        .menu-card:hover .card-icon {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px currentColor);
        }

        .card-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 1rem;
        }

        .secondary .card-text {
            align-items: center;
            margin-left: 0;
            margin-top: 0.6rem;
        }

        .card-label {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #fff;
            text-transform: uppercase;
        }

        .primary .card-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .card-sublabel {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes corePulse {
            0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 30px 10px rgba(200, 220, 255, 0.6); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-height: 750px) {
            .app-container { padding: 1.5rem; gap: 1rem; }
            .game-title { font-size: 2.5rem; }
            .hero-area { height: 180px; }
            .spirit-orb { width: 120px; height: 120px; }
            .portal-ring { width: 160px; height: 160px; }
            .menu-card.primary { height: 70px; padding: 1rem; }
            .menu-card.secondary { height: 90px; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions for Gradients -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ffeebb;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#ffcc55;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b38f1e;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <!-- BACKGROUND LAYERS -->
    <div class="bg-gradient"></div>
    <div class="starfield"></div>
    <canvas id="canvas-layer"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA (THE ORB) -->
        <div class="hero-area">
            <div class="portal-ring"></div>
            <div class="spirit-orb"></div>
        </div>

        <!-- MAIN MENU -->
        <nav class="menu-grid">
            
            <!-- Primary Action (Summon) -->
            <div class="menu-card primary">
                <!-- Star/Portal Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/>
                </svg>
                <div class="card-text">
                    <div class="card-label">Summon</div>
                    <div class="card-sublabel">Open the Void</div>
                </div>
            </div>

            <!-- Secondary Actions (3 Column Row) -->
            <div class="secondary-actions">
                
                <!-- Roster (Scroll/Book) -->
                <div class="menu-card secondary">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/>
                    </svg>
                    <div class="card-text">
                        <div class="card-label">Roster</div>
                        <div class="card-sublabel">Manage</div>
                    </div>
                </div>

                <!-- Battle (Sword) -->
                <div class="menu-card secondary">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6 2l12 12-2 2-12-12z"/>
                        <path d="M16 6l2-2 2 2-2 2z"/>
                        <path d="M4 20l2-2 2 2-2 2z"/>
                        <path d="M14.5 10.5l-7-7L6 5l7 7z"/>
                    </svg>
                    <div class="card-text">
                        <div class="card-label">Battle</div>
                        <div class="card-sublabel">Arena</div>
                    </div>
                </div>

                <!-- Grind (Pickaxe/Resource) -->
                <div class="menu-card secondary">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 2.5l1.5 1.5-4 4-1.5-1.5 4-4zm-7 7l-4 4-1.5-1.5 4-4 1.5 1.5zM20 20l-5-5 4 4-4 4 1 1z"/>
                        <path d="M2 22h20v-2H2v2z" opacity="0.3"/>
                    </svg>
                    <div class="card-text">
                        <div class="card-label">Grind</div>
                        <div class="card-sublabel">Resources</div>
                    </div>
                </div>

            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Floating "soul dust" particles.
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Configuration
        const particleCount = 60;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                // Varying opacity for depth
                this.alpha = Math.random() * 0.5 + 0.1;
                this.pulse = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.pulse += 0.02;
                
                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                // Pulse alpha slightly
                const currentAlpha = this.alpha + Math.sin(this.pulse) * 0.1;
                ctx.fillStyle = `rgba(200, 210, 255, ${currentAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Subtle Parallax on the Orb
        const orb = document.querySelector('.spirit-orb');
        const heroArea = document.querySelector('.hero-area');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100; // Reduced sensitivity
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            // Move the container slightly to create depth, orb floats inside
            heroArea.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
        });

    </script>
</body>
</html>
