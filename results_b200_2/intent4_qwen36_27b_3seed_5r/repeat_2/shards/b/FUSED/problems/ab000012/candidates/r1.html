<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-surface: #0f1016;
            --primary-gold: #dcb368;
            --primary-gold-bright: #ffdd99;
            --primary-gold-dim: #8a703e;
            --accent-purple: #6d28d9;
            --accent-blue: #3b82f6;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */
        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 95%);
            z-index: 1;
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* --- MAIN LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertically center content */
            padding: 2rem;
            gap: 2rem;
        }

        /* --- HEADER & IDENTITY --- */
        header {
            text-align: center;
            margin-bottom: 1rem;
            animation: fadeInDown 1s ease-out;
            position: relative;
        }

        .game-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: transparent;
            background: linear-gradient(to bottom, #fff 20%, var(--primary-gold) 100%);
            -webkit-background-clip: text;
            text-shadow: 0 0 30px rgba(207, 170, 104, 0.2);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            line-height: 1;
        }

        .game-subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            position: absolute;
            top: -1.5rem;
            right: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(207, 170, 104, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .currency-pill:hover {
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(207, 170, 104, 0.2);
        }

        .gold-icon {
            width: 16px;
            height: 16px;
            fill: var(--primary-gold);
            filter: drop-shadow(0 0 4px var(--primary-gold));
        }

        .gold-amount {
            font-family: 'Times New Roman', serif;
            font-size: 1rem;
            color: var(--primary-gold);
            font-weight: bold;
        }

        /* --- HERO AREA: THE SPIRIT ORB --- */
        .hero-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 220px; /* Fixed height for balance */
            position: relative;
            perspective: 1000px;
        }

        /* The Orb */
        .spirit-orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            /* Layered gradients for mystical depth */
            background: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(100, 120, 255, 0.4) 0%, rgba(100, 20, 150, 0.2) 40%, transparent 70%),
                linear-gradient(135deg, #0f1016, #1a1b26);
            
            /* Deep glow */
            box-shadow: 
                0 0 30px rgba(100, 120, 255, 0.2),
                inset 0 0 20px rgba(0,0,0,0.8);
            
            animation: float 6s ease-in-out infinite;
        }

        /* The Outer Glow Ring */
        .spirit-orb::before {
            content: '';
            position: absolute;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            z-index: -1;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        /* The Intense Center Core */
        .spirit-orb::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px 5px rgba(200, 220, 255, 0.8);
            filter: blur(2px);
            animation: corePulse 3s ease-in-out infinite;
        }

        /* --- MAIN MENU --- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        /* --- CARD CRAFT (GLASSMORPHISM) --- */
        .menu-card {
            background: rgba(15, 16, 22, 0.4);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--card-shadow);
        }

        /* Gradient Border Trick */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .menu-card:hover {
            transform: translateY(-2px) scale(1.01);
            background: rgba(20, 22, 30, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .menu-card:hover .card-icon {
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
        }

        /* Primary Action (Summon) */
        .menu-card.primary {
            flex-direction: row;
            justify-content: center;
            gap: 1.5rem;
            height: 80px;
            background: linear-gradient(135deg, rgba(109, 40, 217, 0.25) 0%, rgba(20, 22, 30, 0.6) 100%);
            border: 1px solid rgba(207, 170, 104, 0.3);
        }

        .menu-card.primary:hover {
            background: linear-gradient(135deg, rgba(109, 40, 217, 0.4) 0%, rgba(30, 30, 40, 0.8) 100%);
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(109, 40, 217, 0.3);
        }

        /* Secondary Actions Row */
        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            width: 100%;
        }

        .menu-card.secondary {
            flex-direction: column;
            justify-content: center;
            text-align: center;
            height: 100px;
            padding: 1rem;
        }

        /* --- CARD CONTENT --- */
        .card-icon {
            width: 36px;
            height: 36px;
            fill: var(--text-main);
            transition: all 0.3s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .primary .card-icon {
            fill: var(--primary-gold);
            width: 40px;
            height: 40px;
        }

        .card-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .secondary .card-text {
            align-items: center;
            margin-top: 0.5rem;
        }

        .card-label {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .primary .card-label {
            font-size: 1.1rem;
            background: linear-gradient(to right, #fff, var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-sublabel {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 500;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        @keyframes corePulse {
            0%, 100% { opacity: 0.8; box-shadow: 0 0 15px 3px rgba(200, 220, 255, 0.6); }
            50% { opacity: 1; box-shadow: 0 0 25px 8px rgba(200, 220, 255, 0.9); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-height: 750px) {
            .app-container { padding: 1.5rem; gap: 1.5rem; }
            .game-title { font-size: 2.8rem; }
            .hero-area { height: 160px; }
            .spirit-orb { width: 100px; height: 100px; }
            .menu-card.primary { height: 70px; }
            .menu-card.secondary { height: 80px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="canvas-layer"></canvas>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA (THE ORB) -->
        <div class="hero-area">
            <div class="spirit-orb"></div>
        </div>

        <!-- MAIN MENU -->
        <nav class="menu-grid">
            
            <!-- Primary Action (Full Width) -->
            <div class="menu-card primary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/>
                </svg>
                <div class="card-text">
                    <div class="card-label">Summon Spirits</div>
                    <div class="card-sublabel">Open the portal</div>
                </div>
            </div>

            <!-- Secondary Actions (3 Column Row) -->
            <div class="secondary-actions">
                <div class="menu-card secondary">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <div class="card-text">
                        <div class="card-label">Roster</div>
                        <div class="card-sublabel">Manage</div>
                    </div>
                </div>

                <div class="menu-card secondary">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
                    </svg>
                    <div class="card-text">
                        <div class="card-label">Battle</div>
                        <div class="card-sublabel">Arena</div>
                    </div>
                </div>

                <div class="menu-card secondary">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M13 1.07V9h7c0-3.87-3.13-7-7-7zm-2 1v8h-1v1h1v1h1v-1h1v-1h-1v-1h1V2h-1v1h-1V2.07zM19 11h-6v2h6v-2zm0 4h-6v2h6v-2zm-8-6h-6v2h6v-2zm0 4H5v2h6v-2z"/>
                    </svg>
                    <div class="card-text">
                        <div class="card-label">Grind</div>
                        <div class="card-sublabel">Resources</div>
                    </div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * Floating "soul dust" particles.
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Configuration
        const particleCount = 80;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                // Varying opacity for depth
                this.alpha = Math.random() * 0.4 + 0.1;
                this.pulse = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.pulse += 0.02;
                
                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                // Pulse alpha slightly
                const currentAlpha = this.alpha + Math.sin(this.pulse) * 0.05;
                ctx.fillStyle = `rgba(200, 210, 255, ${currentAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Subtle Parallax on the Orb
        const orb = document.querySelector('.spirit-orb');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100; // Reduced sensitivity
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            // Combine with the CSS float animation by using transform directly
            // Note: This overrides the CSS transform, so we add the float manually via JS if we want both,
            // but for simplicity in this snippet, we just shift it. 
            // To keep the float, we'd need to read the current float offset. 
            // Instead, let's just add a slight tilt to the container to keep the float animation intact.
            orb.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
