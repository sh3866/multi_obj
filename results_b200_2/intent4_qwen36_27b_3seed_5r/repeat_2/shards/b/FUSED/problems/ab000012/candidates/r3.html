<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #020104;
            --bg-fog: #0a0812;
            --gold-primary: #ffd700;
            --gold-secondary: #b8860b;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --text-main: #e0e0e0;
            --text-muted: #888899;
            
            /* Glassmorphism */
            --glass-surface: rgba(15, 12, 25, 0.65);
            --glass-border: rgba(255, 215, 0, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            
            /* Typography */
            --font-serif: 'Cinzel', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .bg-gradient {
            background: 
                radial-gradient(circle at 50% 30%, rgba(50, 30, 80, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(20, 10, 50, 0.4) 0%, transparent 50%),
                linear-gradient(to bottom, #05020a, #000000);
        }

        .vignette {
            background: radial-gradient(circle at center, transparent 30%, #000000 120%);
            mix-blend-mode: multiply;
        }

        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* --- MAIN LAYOUT --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            gap: 1.5rem;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            position: relative;
            width: 100%;
            animation: fadeInDown 1s ease-out;
        }

        .game-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: transparent;
            background: linear-gradient(to bottom, #fff 0%, #ffd700 40%, #8a6e35 100%);
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.2));
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        /* --- CURRENCY --- */
        .currency-pill {
            position: absolute;
            top: 0.5rem;
            right: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--gold-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            animation: fadeInRight 1s ease-out 0.5s backwards;
        }

        .gold-icon {
            width: 18px;
            height: 18px;
            fill: url(#gold-grad);
            filter: drop-shadow(0 0 2px var(--gold-primary));
        }

        .gold-amount {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* --- HERO AREA: THE VOID --- */
        .hero-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 280px;
            width: 100%;
            position: relative;
            perspective: 1000px;
        }

        /* The Orb */
        .spirit-orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, transparent 10%),
                radial-gradient(circle at 50% 50%, rgba(100, 150, 255, 0.4) 0%, rgba(80, 20, 150, 0.3) 60%, transparent 80%),
                linear-gradient(135deg, #0f1016, #1a1b26);
            
            box-shadow: 
                0 0 50px rgba(100, 120, 255, 0.2),
                inset 0 0 30px rgba(0,0,0,0.8);
            
            animation: float 6s ease-in-out infinite;
        }

        /* Inner Core */
        .spirit-orb::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px 5px rgba(200, 220, 255, 0.8);
            animation: corePulse 3s ease-in-out infinite;
        }

        /* --- SUMMON BUTTON (The Action) --- */
        /* Designed as a floating magical seal overlapping the orb */
        .summon-btn {
            position: absolute;
            bottom: 10px;
            z-index: 5;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1625 0%, #0a080f 100%);
            border: 2px solid var(--gold-secondary);
            box-shadow: 
                0 0 0 4px rgba(10, 8, 15, 0.8),
                0 0 20px rgba(255, 215, 0, 0.1),
                inset 0 0 15px rgba(255, 215, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }

        .summon-btn:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 
                0 0 0 6px rgba(10, 8, 15, 0.9),
                0 0 30px var(--gold-glow),
                inset 0 0 20px rgba(255, 215, 0, 0.2);
            border-color: var(--gold-primary);
        }

        .summon-btn:active {
            transform: scale(0.95);
        }

        .summon-icon {
            width: 36px;
            height: 36px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6));
        }

        /* --- UNIFIED CARD SYSTEM --- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        .menu-card {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Inner Gold Glow on Hover */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.05), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .menu-card:hover::before {
            transform: translateX(100%);
        }

        .menu-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Rune Icon Container */
        .card-icon-box {
            width: 60px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .rune-icon {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #888899;
            stroke-width: 1.5;
            transition: all 0.3s;
        }

        .menu-card:hover .rune-icon {
            stroke: var(--gold-primary);
            filter: drop-shadow(0 0 4px var(--gold-glow));
        }

        .card-content {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-label {
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .card-sublabel {
            font-family: var(--font-sans);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes corePulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 20px 8px rgba(200, 220, 255, 0.5); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 750px) {
            .app-container { padding: 1rem; gap: 1rem; }
            .game-title { font-size: 2.2rem; }
            .hero-area { height: 200px; }
            .spirit-orb { width: 100px; height: 100px; }
            .summon-btn { width: 80px; height: 80px; bottom: 0; }
            .summon-icon { width: 28px; height: 28px; }
            .card-icon-box { width: 50px; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#fffbe0;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <!-- BACKGROUND LAYERS -->
    <div class="bg-layer bg-gradient"></div>
    <canvas id="canvas-layer"></canvas>
    <div class="bg-layer vignette"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA (THE VOID) -->
        <div class="hero-area">
            <div class="spirit-orb"></div>
            
            <!-- The Summon Button (Action) -->
            <div class="summon-btn">
                <!-- Magical Eye Rune -->
                <svg class="summon-icon" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                </svg>
            </div>
        </div>

        <!-- MAIN MENU (Unified Cards) -->
        <nav class="menu-grid">
            
            <!-- Card 1: Summon (Standardized look, but prominent) -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <!-- Rune: Portal -->
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Summon</div>
                    <div class="card-sublabel">Open the Void</div>
                </div>
            </div>

            <!-- Card 2: Roster -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <!-- Rune: Scroll/Spirits -->
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage Spirits</div>
                </div>
            </div>

            <!-- Card 3: Battle -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <!-- Rune: Sword/Conflict -->
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M6.92 5L5 7l4 4-2 2 2 2 4-4 2 2-4 4-2-2 4-4 2 2 2-2-4-4 2-2-4 4 2-2-4-4z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Enter the Arena</div>
                </div>
            </div>

            <!-- Card 4: Grind -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <!-- Rune: Pickaxe/Resource -->
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12c.4-.4.4-1.03.01-1.42zM6.92 19L5 17.08l8.06-8.06 1.92 1.92L6.92 19z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Gather Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * "Spirit Dust" particles
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.4 + 0.1;
                this.pulse = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.pulse += 0.015;
                
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                const currentAlpha = this.alpha + Math.sin(this.pulse) * 0.1;
                ctx.fillStyle = `rgba(200, 210, 255, ${currentAlpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Subtle Parallax on the Orb
        const heroArea = document.querySelector('.hero-area');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 120;
            const y = (window.innerHeight - e.pageY * 2) / 120;
            heroArea.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
