<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #05020a;
            --bg-fog: #120824;
            --gold-primary: #ffd700;
            --gold-secondary: #b8860b;
            --gold-dim: #5e4b1f;
            --gold-glow: rgba(255, 215, 0, 0.5);
            --text-main: #e0e0e0;
            --text-muted: #9999aa;
            
            /* Card Styling */
            --card-bg: rgba(10, 8, 18, 0.7);
            --card-border: rgba(255, 215, 0, 0.15);
            
            /* Typography */
            --font-serif: 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
            --font-sans: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Deep rich nebula gradient */
        .bg-gradient {
            background: 
                radial-gradient(circle at 50% 20%, rgba(80, 40, 120, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(20, 10, 60, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(40, 20, 80, 0.3) 0%, transparent 40%),
                linear-gradient(to bottom, #08040f, #020105);
        }

        .vignette {
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            mix-blend-mode: multiply;
        }

        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* --- MAIN LAYOUT --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            gap: 1.2rem;
        }

        /* --- HEADER & CURRENCY --- */
        header {
            text-align: center;
            width: 100%;
            position: relative;
            padding-top: 1rem;
            animation: fadeInDown 1s ease-out;
        }

        .game-title {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: transparent;
            background: linear-gradient(to bottom, #fff 0%, #ffd700 50%, #8a6e35 100%);
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.2));
            margin-bottom: 0.1rem;
            text-transform: uppercase;
            line-height: 1;
        }

        .game-subtitle {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(150, 100, 255, 0.5);
        }

        /* Currency: Integrated below title, floating */
        .currency-pill {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to right, rgba(10, 10, 15, 0.9), rgba(30, 20, 10, 0.9), rgba(10, 10, 15, 0.9));
            border: 1px solid var(--gold-dim);
            padding: 6px 20px;
            border-radius: 4px; /* Sharper */
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        /* Decorative lines on currency */
        .currency-pill::before, .currency-pill::after {
            content: '';
            position: absolute;
            top: 50%;
            height: 1px;
            width: 10px;
            background: var(--gold-secondary);
            transform: translateY(-50%);
        }
        .currency-pill::before { left: -15px; }
        .currency-pill::after { right: -15px; }

        .gold-icon {
            width: 20px;
            height: 20px;
            fill: url(#gold-grad);
            filter: drop-shadow(0 0 3px var(--gold-primary));
        }

        .gold-amount {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* --- HERO AREA: THE ORB --- */
        .hero-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 320px;
            width: 100%;
            position: relative;
            perspective: 1000px;
            margin-top: 1rem;
        }

        /* The Orb - Larger, Luminous */
        .spirit-orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, transparent 10%),
                radial-gradient(circle at 50% 50%, rgba(100, 150, 255, 0.3) 0%, rgba(80, 20, 150, 0.4) 60%, transparent 80%),
                linear-gradient(135deg, #1a1b26, #05050a);
            
            box-shadow: 
                0 0 60px rgba(100, 120, 255, 0.3),
                0 0 100px rgba(80, 20, 150, 0.2),
                inset 0 0 40px rgba(0,0,0,0.9);
            
            animation: float 6s ease-in-out infinite;
        }

        /* Inner Core */
        .spirit-orb::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px 10px rgba(200, 220, 255, 0.8);
            animation: corePulse 3s ease-in-out infinite;
        }

        /* --- SUMMON BUTTON (Primary Action) --- */
        /* Distinctive, larger, ornate */
        .summon-btn {
            position: absolute;
            bottom: 0px;
            z-index: 5;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2435, #0a080f);
            border: 2px solid var(--gold-primary);
            box-shadow: 
                0 0 0 5px rgba(10, 8, 15, 0.8),
                0 0 30px rgba(255, 215, 0, 0.2),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 1s ease-out 0.5s backwards;
        }

        /* Ornate inner ring for Summon Button */
        .summon-btn::before {
            content: '';
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            border: 1px dashed var(--gold-secondary);
            animation: spin 20s linear infinite;
        }

        .summon-btn:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 
                0 0 0 7px rgba(10, 8, 15, 0.9),
                0 0 40px var(--gold-glow),
                inset 0 0 30px rgba(255, 215, 0, 0.3);
            border-color: #fff;
        }

        .summon-btn:active {
            transform: scale(0.95);
        }

        .summon-icon {
            width: 42px;
            height: 42px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
        }

        /* --- MENU CARDS (Runic Style) --- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.8s backwards;
            padding-bottom: 2rem;
        }

        .menu-card {
            background: var(--card-bg);
            /* Ornate Borders */
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            border-left: 1px solid rgba(255, 215, 0, 0.1);
            border-right: 1px solid rgba(255, 215, 0, 0.1);
            /* Sharp corners with slight chamfer effect via clip-path could be used, but borders are safer */
            padding: 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Hover Glow */
        .menu-card:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: var(--gold-secondary);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 0 10px rgba(255, 215, 0, 0.1);
        }

        .menu-card:hover .rune-icon {
            stroke: var(--gold-primary);
            filter: drop-shadow(0 0 6px var(--gold-glow));
            transform: scale(1.1);
        }

        /* Rune Icon Container - Metallic look */
        .card-icon-box {
            width: 70px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, rgba(20, 15, 30, 0.9), rgba(20, 15, 30, 0.4));
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Decorative corner accents for cards */
        .menu-card::after {
            content: '';
            position: absolute;
            top: 2px; right: 2px;
            width: 4px; height: 4px;
            background: var(--gold-secondary);
            box-shadow: 0 0 5px var(--gold-secondary);
        }

        .rune-icon {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #888899;
            stroke-width: 1.2;
            transition: all 0.3s;
        }

        .card-content {
            flex: 1;
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-label {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-sublabel {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes corePulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); box-shadow: 0 0 30px 10px rgba(200, 220, 255, 0.6); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-height: 750px) {
            .app-container { padding: 1rem; gap: 0.8rem; }
            .game-title { font-size: 2.2rem; }
            .hero-area { height: 240px; margin-top: 0; }
            .spirit-orb { width: 130px; height: 130px; }
            .summon-btn { width: 85px; height: 85px; bottom: -10px; }
            .summon-icon { width: 30px; height: 30px; }
            .card-icon-box { width: 50px; }
            .card-content { padding: 0.8rem 1rem; }
            .card-label { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#fffbe0;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <!-- BACKGROUND LAYERS -->
    <div class="bg-layer bg-gradient"></div>
    <canvas id="canvas-layer"></canvas>
    <div class="bg-layer vignette"></div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header>
            <h1 class="game-title">Aetheria</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="gold-amount">12,450</span>
            </div>
        </header>

        <!-- HERO AREA -->
        <div class="hero-area">
            <div class="spirit-orb"></div>
            
            <!-- The Summon Button -->
            <div class="summon-btn">
                <svg class="summon-icon" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                </svg>
            </div>
        </div>

        <!-- MAIN MENU -->
        <nav class="menu-grid">
            
            <!-- Card 1: Summon -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Summon</div>
                    <div class="card-sublabel">Open the Void</div>
                </div>
            </div>

            <!-- Card 2: Roster -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Roster</div>
                    <div class="card-sublabel">Manage Spirits</div>
                </div>
            </div>

            <!-- Card 3: Battle -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M6.92 5L5 7l4 4-2 2 2 2 4-4 2 2-4 4-2-2 4-4 2 2 2-2-4-4 2-2-4 4 2-2-4-4z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Battle</div>
                    <div class="card-sublabel">Enter the Arena</div>
                </div>
            </div>

            <!-- Card 4: Grind -->
            <div class="menu-card">
                <div class="card-icon-box">
                    <svg class="rune-icon" viewBox="0 0 24 24">
                        <path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12c.4-.4.4-1.03.01-1.42zM6.92 19L5 17.08l8.06-8.06 1.92 1.92L6.92 19z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-label">Grind</div>
                    <div class="card-sublabel">Gather Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * ATMOSPHERIC BACKGROUND ANIMATION
         * "Spirit Dust" particles with enhanced glow
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.pulse = Math.random() * Math.PI * 2;
                // Mix of blue and gold dust
                this.color = Math.random() > 0.8 ? '255, 215, 0' : '200, 220, 255';
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.pulse += 0.02;
                
                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                const currentAlpha = this.alpha + Math.sin(this.pulse) * 0.2;
                ctx.fillStyle = `rgba(${this.color}, ${Math.max(0, currentAlpha)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Add a tiny glow to some particles
                if (this.size > 1.5) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = `rgba(${this.color}, 0.5)`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }
        
        function initParticles() {
            particles = [];
            // Increased particle count for density
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Interaction: Subtle Parallax on the Orb
        const heroArea = document.querySelector('.hero-area');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            // Apply transform to the container
            heroArea.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
