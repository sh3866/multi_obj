<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & ORE</title>
<style>
    :root {
        /* Palette - Deep Industrial */
        --bg-deep: #030405;
        --bg-panel: #11141a;
        
        /* Floor - Concrete/Gravel */
        --floor-base: #20242b;
        --floor-dark: #16191e;
        --floor-grid: rgba(0,0,0,0.6);
        
        /* Walls - Heavy Steel & Rust */
        --wall-light: #4a5568;
        --wall-mid: #2d3748;
        --wall-dark: #1a202c;
        --wall-shadow: #000000;
        
        /* Semantics */
        --ore-glow: #10b981; /* Emerald */
        --ore-dim: #064e3b;
        --alert-red: #ef4444;
        --alert-dark: #7f1d1d;
        --door-metal: #718096;
        
        /* UI */
        --text-dim: #64748b;
        --text-bright: #f1f5f9;
        --accent-gold: #fbbf24;
        
        /* Fonts */
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        margin: 0;
        height: 100vh;
        background-color: var(--bg-deep);
        /* Subtle texture for the background */
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.4) 0%, transparent 80%),
            url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        color: var(--text-dim);
        font-family: var(--font-ui);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- Layout Container --- */
    .app-container {
        width: 100%;
        max-width: 560px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        position: relative;
    }

    /* --- HUD (Unified Bar) --- */
    header {
        width: 100%;
        background: rgba(17, 20, 26, 0.8);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 8px;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
    }

    .title-block h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: var(--text-bright);
        text-transform: uppercase;
    }
    
    .title-block .subtitle {
        font-size: 0.7rem;
        color: var(--accent-gold);
        font-weight: 700;
        letter-spacing: 0.2em;
        margin-top: 4px;
        display: block;
        opacity: 0.9;
    }

    .hud-stats {
        display: flex;
        gap: 20px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .stat-label {
        font-size: 0.6rem;
        font-weight: 700;
        color: var(--text-dim);
        letter-spacing: 0.1em;
        margin-bottom: 2px;
    }

    .stat-value {
        font-family: var(--font-mono);
        font-size: 1.25rem;
        color: var(--text-bright);
        font-weight: 700;
        text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* --- The Board Frame --- */
    .board-chassis {
        position: relative;
        padding: 16px;
        background: #0f1216;
        border-radius: 12px;
        border: 1px solid #1f2937;
        box-shadow: 
            inset 0 2px 4px rgba(0,0,0,0.8),
            0 20px 50px rgba(0,0,0,0.6);
    }
    
    /* Corner Bolts */
    .board-chassis::before, .board-chassis::after {
        content: '';
        position: absolute;
        width: 8px; height: 8px;
        background: #333;
        border-radius: 50%;
        box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
    }
    .board-chassis::before { top: 8px; left: 8px; }
    .board-chassis::after { bottom: 8px; right: 8px; }

    .grid {
        display: grid;
        grid-template-columns: repeat(7, 64px);
        grid-template-rows: repeat(7, 64px);
        background: #000;
        gap: 2px; /* Grout lines */
        border: 4px solid #1a202c;
        box-shadow: inset 0 0 20px #000;
    }

    .cell {
        width: 64px;
        height: 64px;
        position: relative;
        background-color: var(--floor-base);
        /* Floor Texture */
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 80%),
            linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%, rgba(0,0,0,0.1)),
            linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%, rgba(0,0,0,0.1));
        background-size: 100% 100%, 4px 4px, 4px 4px;
        background-position: 0 0, -2px -2px, -2px -2px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- Entities --- */

    /* 1. WALL: Raised, Textured Block */
    .wall {
        width: 100%; height: 100%;
        position: relative;
        z-index: 2;
        /* 3D Bevel */
        background: linear-gradient(135deg, var(--wall-light) 0%, var(--wall-mid) 100%);
        border-top: 2px solid rgba(255,255,255,0.1);
        border-left: 2px solid rgba(255,255,255,0.05);
        box-shadow: 
            inset 0 -4px 0 var(--wall-dark), /* Bottom thickness */
            inset 2px 0 0 rgba(0,0,0,0.2),   /* Right shadow */
            inset -2px 0 0 rgba(0,0,0,0.2),  /* Left shadow */
            0 6px 12px rgba(0,0,0,0.6);      /* Drop shadow */
    }
    /* Rust Overlay */
    .wall::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
        opacity: 0.4;
        pointer-events: none;
    }

    /* 2. TARGET: Indented Glowing Pad */
    .target-zone {
        width: 100%; height: 100%;
        position: absolute;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .target-pad {
        width: 48px; height: 48px;
        /* Indentation */
        background: rgba(0,0,0,0.3);
        border-radius: 8px;
        box-shadow: inset 2px 2px 6px rgba(0,0,0,0.6);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .target-core {
        width: 24px; height: 24px;
        border: 2px solid var(--ore-glow);
        border-radius: 4px;
        box-shadow: 0 0 10px var(--ore-glow), inset 0 0 8px var(--ore-glow);
        animation: pulse-pad 3s infinite ease-in-out;
        background: rgba(16, 185, 129, 0.1);
    }
    
    @keyframes pulse-pad {
        0%, 100% { opacity: 0.6; box-shadow: 0 0 5px var(--ore-glow); }
        50% { opacity: 1; box-shadow: 0 0 20px var(--ore-glow), inset 0 0 10px var(--ore-glow); }
    }

    /* 3. LEVER: Mechanical Switch */
    .lever-container {
        width: 100%; height: 100%;
        position: relative;
        z-index: 3;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 400px;
    }
    
    .lever-base {
        position: absolute;
        width: 36px; height: 36px;
        background: radial-gradient(circle at 30% 30%, #4a5568, #1a202c);
        border-radius: 50%;
        border: 2px solid #000;
        box-shadow: 0 6px 10px rgba(0,0,0,0.5);
        z-index: 1;
    }
    
    .lever-arm {
        position: absolute;
        width: 8px; height: 36px;
        background: linear-gradient(90deg, #94a3b8, #475569);
        top: 12px;
        transform-origin: bottom center;
        transform: rotate(-35deg);
        border-radius: 2px;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 2;
    }
    
    .lever-knob {
        position: absolute;
        top: -10px; left: -9px;
        width: 26px; height: 26px;
        background: radial-gradient(circle at 30% 30%, #ef4444, #7f1d1d);
        border-radius: 50%;
        border: 2px solid #000;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
    
    /* Active State */
    .lever-active .lever-arm { transform: rotate(35deg); }
    .lever-active .lever-knob { 
        background: radial-gradient(circle at 30% 30%, #34d399, #064e3b); 
        box-shadow: 0 0 15px var(--ore-glow);
    }

    /* 4. DOOR: Heavy Gate */
    .door-container {
        width: 100%; height: 100%;
        position: absolute;
        z-index: 4;
        overflow: hidden;
        border-radius: 4px;
    }
    
    .door-frame {
        position: absolute;
        inset: 2px;
        border: 4px solid #334155;
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    
    .door-panel {
        width: 100%; height: 100%;
        background: repeating-linear-gradient(135deg, #4b5563, #4b5563 6px, #374151 6px, #374151 12px);
        position: absolute;
        top: 0; left: 0;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .door-open .door-panel { transform: translateY(-100%); }
    
    /* Lock Icon */
    .door-lock {
        width: 16px; height: 12px;
        background: #000;
        border-radius: 2px;
        position: relative;
        z-index: 5;
        box-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    .door-lock::after {
        content: '';
        position: absolute;
        top: -8px; left: 2px;
        width: 12px; height: 8px;
        border: 2px solid #000;
        border-bottom: 0;
        border-radius: 10px 10px 0 0;
    }

    /* 5. CRATE: Heavy Cargo Box */
    .crate {
        width: 54px; height: 54px;
        position: relative;
        z-index: 5;
        box-shadow: 0 10px 15px rgba(0,0,0,0.5);
        border-radius: 2px;
    }
    
    .crate-face {
        width: 100%; height: 100%;
        background: linear-gradient(to bottom, #78350f, #451a03);
        border: 2px solid #2c1202;
        position: relative;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    
    /* Cross Strapping */
    .crate-face::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        width: 8px; height: 100%;
        background: rgba(0,0,0,0.3);
        transform: translateX(-50%) skewX(-10deg);
        border-left: 1px solid rgba(255,255,255,0.1);
        border-right: 1px solid rgba(0,0,0,0.3);
    }
    
    /* Corner Rivets */
    .crate-face::after {
        content: '';
        position: absolute;
        top: 4px; left: 4px;
        width: 4px; height: 4px;
        background: #9ca3af;
        border-radius: 50%;
        box-shadow: 
            46px 0 0 #9ca3af, 
            23px 23px 0 #9ca3af, 
            46px 46px 0 #9ca3af, 
            0 46px 0 #9ca3af;
    }

    /* 6. PLAYER: The Miner Bot */
    .player {
        width: 48px; height: 48px;
        position: relative;
        z-index: 10;
        transition: transform 0.15s ease-out;
        filter: drop-shadow(0 8px 6px rgba(0,0,0,0.5));
        animation: float-bot 2s infinite ease-in-out;
    }
    @keyframes float-bot {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
    }
    
    .bot-body {
        position: absolute;
        inset: 6px;
        background: linear-gradient(135deg, #e2e8f0, #94a3b8);
        border-radius: 10px;
        box-shadow: 
            inset 0 2px 4px rgba(255,255,255,0.9),
            inset 0 -2px 4px rgba(0,0,0,0.2);
        border: 1px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* Visor */
    .bot-visor {
        width: 24px; height: 8px;
        background: #0f172a;
        border-radius: 4px;
        box-shadow: inset 0 2px 2px rgba(0,0,0,0.8);
        position: relative;
        overflow: hidden;
    }
    
    /* Eye */
    .bot-eye {
        position: absolute;
        top: 1px; left: 1px;
        width: 10px; height: 6px;
        background: var(--accent-gold);
        border-radius: 2px;
        box-shadow: 0 0 6px var(--accent-gold);
        animation: blink 4s infinite;
    }
    @keyframes blink {
        0%, 96%, 100% { opacity: 1; height: 6px; top: 1px; }
        98% { opacity: 0.5; height: 1px; top: 3px; }
    }

    /* --- Controls Legend --- */
    .controls {
        display: flex;
        gap: 24px;
        padding: 12px 24px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .key-group { 
        display: flex; 
        align-items: center; 
        gap: 8px; 
    }
    
    .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px; height: 24px;
        background: linear-gradient(to bottom, #334155, #1e293b);
        color: #94a3b8;
        border-radius: 3px;
        font-family: var(--font-mono);
        font-weight: bold;
        font-size: 0.8rem;
        border-top: 1px solid rgba(255,255,255,0.2);
        border-bottom: 2px solid #0f172a;
        box-shadow: 0 2px 0 #0f172a;
    }
    
    .control-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* --- Status Message --- */
    .status-bar {
        height: 36px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--ore-glow);
        text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        opacity: 0;
        transition: opacity 0.3s;
        background: rgba(0,0,0,0.4);
        border-radius: 4px;
        border: 1px solid rgba(16, 185, 129, 0.1);
        pointer-events: none;
    }
    .status-bar.visible { opacity: 1; }
    .status-bar.error { 
        color: var(--alert-red); 
        text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); 
        border-color: rgba(239, 68, 68, 0.2); 
    }

</style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="title-block">
            <h1>IRON & ORE</h1>
            <span class="subtitle">SECTOR 7-G</span>
        </div>
        <div class="hud-stats">
            <div class="stat-item">
                <span class="stat-label">LEVEL</span>
                <span class="stat-value">04</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">MOVES</span>
                <span class="stat-value" id="move-counter">00</span>
            </div>
        </div>
    </header>

    <div class="board-chassis">
        <div class="grid" id="game-board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <div class="status-bar" id="status-message">SYSTEM READY</div>

    <div class="controls">
        <div class="key-group">
            <span class="key">W</span>
            <span class="key">A</span>
            <span class="key">S</span>
            <span class="key">D</span>
            <span class="control-label">Move</span>
        </div>
        <div class="key-group">
            <span class="key">R</span>
            <span class="control-label">Reset</span>
        </div>
    </div>
</div>

<script>
    // --- Game Configuration ---
    const BOARD_SIZE = 7;
    
    // Entities
    const TILE_FLOOR = 0;
    const TILE_WALL = 1;
    const TILE_TARGET = 2;
    const TILE_LEVER = 3;
    const TILE_DOOR = 4;
    const TILE_CRATE = 5;
    const TILE_PLAYER = 6;

    // Level Layout (7x7)
    const INITIAL_LEVEL = [
        [1, 1, 1, 1, 1, 1, 1],
        [1, 6, 0, 1, 0, 0, 1],
        [1, 1, 0, 1, 0, 5, 1],
        [1, 0, 0, 3, 0, 1, 1],
        [1, 0, 1, 1, 0, 0, 1],
        [1, 5, 0, 2, 4, 0, 1],
        [1, 1, 1, 1, 1, 1, 1]
    ];

    // State
    let grid = [];
    let playerPos = { x: 1, y: 1 };
    let moves = 0;
    let leverActivated = false;
    let doorOpen = false;
    let crates = []; 

    // --- Initialization ---
    const boardEl = document.getElementById('game-board');
    const moveEl = document.getElementById('move-counter');
    const statusEl = document.getElementById('status-message');

    function initGame() {
        grid = JSON.parse(JSON.stringify(INITIAL_LEVEL));
        moves = 0;
        leverActivated = false;
        doorOpen = false;
        updateMoveDisplay();
        statusEl.classList.remove('visible');
        statusEl.classList.remove('error');
        
        crates = [];
        for(let y=0; y<BOARD_SIZE; y++) {
            for(let x=0; x<BOARD_SIZE; x++) {
                if (grid[y][x] === TILE_PLAYER) {
                    playerPos = {x, y};
                    grid[y][x] = TILE_FLOOR; 
                } else if (grid[y][x] === TILE_CRATE) {
                    crates.push({x, y});
                    grid[y][x] = TILE_FLOOR; 
                }
            }
        }
        renderBoard();
    }

    // --- Rendering ---
    function renderBoard() {
        boardEl.innerHTML = '';
        
        for(let y=0; y<BOARD_SIZE; y++) {
            for(let x=0; x<BOARD_SIZE; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.x = x;
                cell.dataset.y = y;

                const tileType = grid[y][x];

                // 1. Background Layer (Static Map Elements)
                if (tileType === TILE_WALL) {
                    cell.innerHTML = '<div class="wall"></div>';
                } else if (tileType === TILE_TARGET) {
                    cell.innerHTML = `
                        <div class="target-zone">
                            <div class="target-pad">
                                <div class="target-core"></div>
                            </div>
                        </div>`;
                }

                // 2. Interactive Layer (Switches & Doors)
                if (tileType === TILE_LEVER) {
                    const activeClass = leverActivated ? 'lever-active' : '';
                    cell.innerHTML += `
                        <div class="lever-container ${activeClass}">
                            <div class="lever-base"></div>
                            <div class="lever-arm">
                                <div class="lever-knob"></div>
                            </div>
                        </div>`;
                } else if (tileType === TILE_DOOR) {
                    const openClass = doorOpen ? 'door-open' : '';
                    cell.innerHTML += `
                        <div class="door-container ${openClass}">
                            <div class="door-frame"></div>
                            <div class="door-panel">
                                <div class="door-lock"></div>
                            </div>
                        </div>`;
                }

                // 3. Dynamic Layer (Crates)
                const crateIndex = crates.findIndex(c => c.x === x && c.y === y);
                if (crateIndex !== -1) {
                    cell.innerHTML += '<div class="crate"><div class="crate-face"></div></div>';
                }

                // 4. Player Layer
                if (playerPos.x === x && playerPos.y === y) {
                    cell.innerHTML += `
                        <div class="player">
                            <div class="bot-body">
                                <div class="bot-visor">
                                    <div class="bot-eye"></div>
                                </div>
                            </div>
                        </div>`;
                }

                boardEl.appendChild(cell);
            }
        }
    }

    function updateMoveDisplay() {
        moveEl.textContent = moves.toString().padStart(2, '0');
    }

    function showStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.className = 'status-bar visible';
        if(isError) statusEl.classList.add('error');
        
        if(window.statusTimeout) clearTimeout(window.statusTimeout);
        
        if(!isError) {
            window.statusTimeout = setTimeout(() => {
                statusEl.classList.remove('visible');
            }, 3000);
        }
    }

    // --- Logic ---
    function movePlayer(dx, dy) {
        const newX = playerPos.x + dx;
        const newY = playerPos.y + dy;

        // 1. Check Walls
        if (grid[newY][newX] === TILE_WALL) return;

        // 2. Check Door (if closed)
        if (grid[newY][newX] === TILE_DOOR && !doorOpen) {
            showStatus("ACCESS DENIED - LOCKED", true);
            return;
        }

        // 3. Check Crates
        const crateIdx = crates.findIndex(c => c.x === newX && c.y === newY);
        
        if (crateIdx !== -1) {
            // Trying to push a crate
            const nextX = newX + dx;
            const nextY = newY + dy;

            // Bounds check
            if (nextX < 0 || nextX >= BOARD_SIZE || nextY < 0 || nextY >= BOARD_SIZE) return;

            // Check Wall
            if (grid[nextY][nextX] === TILE_WALL) return;

            // Check Door (closed)
            if (grid[nextY][nextX] === TILE_DOOR && !doorOpen) return;

            // Check another crate
            if (crates.some(c => c.x === nextX && c.y === nextY)) return;

            // Valid Push
            crates[crateIdx] = { x: nextX, y: nextY };
            
            // Move Player
            playerPos = { x: newX, y: newY };
            moves++;
            updateMoveDisplay();
            renderBoard();
            checkWinCondition();
        } else {
            // Normal Move
            playerPos = { x: newX, y: newY };
            moves++;
            updateMoveDisplay();
            
            // Interactions
            if (grid[newY][newX] === TILE_LEVER) {
                leverActivated = true;
                doorOpen = true;
                showStatus("HYDRAULICS ENGAGED");
            }

            renderBoard();
        }
    }

    function checkWinCondition() {
        const onTarget = crates.some(c => grid[c.y][c.x] === TILE_TARGET);
        if (onTarget) {
            statusEl.textContent = "SEQUENCE COMPLETE";
            statusEl.style.color = "var(--accent-gold)";
            statusEl.style.borderColor = "rgba(251, 191, 36, 0.2)";
            statusEl.style.textShadow = "0 0 10px rgba(251, 191, 36, 0.4)";
            statusEl.classList.add('visible');
        }
    }

    // --- Input Handling ---
    window.addEventListener('keydown', (e) => {
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }

        switch(e.key.toLowerCase()) {
            case 'w': case 'arrowup': movePlayer(0, -1); break;
            case 's': case 'arrowdown': movePlayer(0, 1); break;
            case 'a': case 'arrowleft': movePlayer(-1, 0); break;
            case 'd': case 'arrowright': movePlayer(1, 0); break;
            case 'r': initGame(); break;
        }
    });

    // Start
    initGame();

</script>
</body>
</html>
