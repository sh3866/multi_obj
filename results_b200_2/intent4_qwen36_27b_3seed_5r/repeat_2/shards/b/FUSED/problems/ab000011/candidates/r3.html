<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & ORE</title>
<style>
    :root {
        --bg-deep: #0d0f12;
        --bg-panel: #161920;
        
        /* The new lighter concrete floor */
        --floor-base: #2a2d34; 
        --floor-highlight: #32363f;
        --floor-shadow: #22252b;
        
        --wall-dark: #111317;
        --wall-top: #2c3038;
        --wall-bevel: #1a1d23;
        
        --rust-primary: #b45309;
        --rust-dark: #78350f;
        --rust-light: #f59e0b;
        
        --ore-primary: #10b981;
        --ore-glow: #34d399;
        --ore-dark: #047857;
        
        --player-body: #e2e8f0;
        --player-shadow: #94a3b8;
        --player-eye: #f59e0b;
        
        --hud-text: #9ca3af;
        --hud-accent: #fbbf24; /* Amber */
        
        --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        height: 100vh;
        background-color: var(--bg-deep);
        /* Vignette & Grid Background */
        background-image: 
            radial-gradient(circle at center, transparent 0%, #000000 120%),
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        color: var(--hud-text);
        font-family: var(--font-stack);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- Layout --- */
    .app-container {
        position: relative;
        width: 100%;
        max-width: 540px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
    }

    /* --- Header & HUD --- */
    header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 16px;
        position: relative;
    }

    h1 {
        font-family: var(--font-stack);
        font-weight: 900;
        font-size: 2.2rem;
        margin: 0;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #e2e8f0;
        /* Industrial Underline */
        position: relative;
        padding-bottom: 8px;
    }
    
    h1::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0;
        width: 100%; height: 4px;
        background: #333;
        border-radius: 2px;
    }
    h1::before {
        content: '';
        position: absolute;
        bottom: 0; left: 0;
        width: 40%; height: 4px;
        background: var(--hud-accent);
        border-radius: 2px;
        box-shadow: 0 0 10px var(--hud-accent);
    }

    /* Data Panel HUD */
    .hud-stats {
        display: flex;
        gap: 12px;
    }

    .stat-box {
        background: #0f1115;
        border: 1px solid #2d3748;
        padding: 4px 12px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        min-width: 70px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        position: relative;
    }
    
    /* Screws for panel */
    .stat-box::before {
        content: '+';
        position: absolute;
        top: 2px; left: 4px;
        font-size: 8px;
        color: #4a5568;
        font-family: monospace;
        line-height: 1;
    }

    .stat-label {
        font-size: 0.6rem;
        color: #64748b;
        letter-spacing: 1px;
        margin-bottom: 2px;
        font-weight: 600;
    }

    .stat-value {
        font-family: var(--font-mono);
        font-size: 1.1rem;
        color: var(--hud-accent);
        text-shadow: 0 0 4px rgba(251, 191, 36, 0.3);
        font-weight: bold;
    }

    /* --- Board Container --- */
    .board-frame {
        position: relative;
        padding: 16px;
        background: #11141a;
        border-radius: 8px;
        box-shadow: 
            0 20px 50px rgba(0,0,0,0.5),
            inset 0 0 0 1px #2d3748;
        border: 1px solid #1a202c;
    }

    /* --- The Grid --- */
    .grid {
        display: grid;
        grid-template-columns: repeat(7, 64px);
        grid-template-rows: repeat(7, 64px);
        background-color: #111;
        border: 4px solid #1a1d23;
        position: relative;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .cell {
        width: 64px;
        height: 64px;
        position: relative;
        /* Lighter Concrete Texture */
        background-color: var(--floor-base);
        background-image: 
            radial-gradient(circle at 30% 30%, rgba(255,255,255,0.04) 0%, transparent 50%),
            repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 6px);
        border: 1px solid rgba(0,0,0,0.3); /* Subtle Grid Lines */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- Entities --- */

    /* 1. WALL: Dark, Heavy Industrial Block */
    .wall {
        width: 100%; height: 100%;
        background: linear-gradient(160deg, var(--wall-top) 0%, var(--wall-dark) 100%);
        position: relative;
        z-index: 2;
        box-shadow: 
            inset 0 2px 0 rgba(255,255,255,0.05),
            inset 0 -2px 0 rgba(0,0,0,0.6),
            2px 2px 8px rgba(0,0,0,0.5);
    }
    /* Wall texture noise */
    .wall::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.1'/%3E%3C/svg%3E");
    }

    /* 2. TARGET: Glowing Light Source */
    .target-zone {
        width: 100%; height: 100%;
        position: absolute;
        z-index: 0;
        /* Intense Glow */
        background: radial-gradient(circle at 50% 50%, rgba(52, 211, 153, 0.25) 0%, transparent 70%);
        animation: pulse-target 3s infinite ease-in-out;
    }
    
    .target-icon {
        width: 32px; height: 32px;
        background: var(--ore-primary);
        transform: rotate(45deg);
        box-shadow: 
            0 0 15px var(--ore-glow),
            0 0 30px var(--ore-glow),
            inset 0 0 10px rgba(255,255,255,0.5);
        border: 2px solid #fff;
        position: relative;
        z-index: 1;
        border-radius: 4px;
    }
    
    @keyframes pulse-target {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
    }

    /* 3. LEVER: Mechanical Toggle */
    .lever-container {
        width: 56px; height: 56px;
        position: relative;
        z-index: 3;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-style: preserve-3d;
    }
    .lever-plate {
        position: absolute;
        width: 40px; height: 40px;
        background: radial-gradient(circle, #334155, #1e293b);
        border-radius: 50%;
        border: 2px solid #0f172a;
        box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    }
    .lever-handle {
        position: absolute;
        width: 8px; height: 28px;
        background: linear-gradient(90deg, #94a3b8, #475569);
        top: 12px;
        transform-origin: bottom center;
        transform: rotate(-30deg);
        border-radius: 4px;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 2px 4px 6px rgba(0,0,0,0.4);
    }
    .lever-knob {
        position: absolute;
        top: -10px; left: -7px;
        width: 22px; height: 22px;
        background: radial-gradient(circle at 30% 30%, #ef4444, #7f1d1d);
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }
    /* Active State */
    .lever-active .lever-handle {
        transform: rotate(30deg);
    }
    .lever-active .lever-knob {
        background: radial-gradient(circle at 30% 30%, #34d399, #064e3b);
        box-shadow: 0 0 10px #34d399, 0 4px 6px rgba(0,0,0,0.5);
    }

    /* 4. DOOR: Blast Door */
    .door-container {
        width: 100%; height: 100%;
        position: absolute;
        z-index: 4;
        overflow: hidden;
        border: 2px solid #334155;
        background: #020617;
    }
    .door-panel {
        width: 100%; height: 100%;
        background: repeating-linear-gradient(135deg, #374151, #374151 10px, #1f2937 10px, #1f2937 20px);
        position: absolute;
        top: 0; left: 0;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        border: 2px solid #000;
    }
    .door-open .door-panel {
        transform: translateY(-100%);
    }
    /* Door Indicator Light */
    .door-indicator {
        position: absolute;
        top: 8px; right: 8px;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 5px #ef4444;
        z-index: 5;
        transition: background 0.3s;
    }
    .door-open .door-indicator { background: #34d399; box-shadow: 0 0 5px #34d399; }

    /* 5. CRATE: Ore Texture */
    .crate {
        width: 52px; height: 52px;
        position: relative;
        z-index: 5;
        background: linear-gradient(135deg, #451a03, #271002);
        border: 2px solid #1c0f02;
        border-radius: 4px;
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.8),
            0 8px 12px rgba(0,0,0,0.5),
            0 2px 0 rgba(255,255,255,0.05) inset;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* Glowing Veins */
    .crate::before {
        content: '';
        position: absolute;
        inset: 4px;
        background-image: 
            linear-gradient(45deg, transparent 40%, rgba(251, 191, 36, 0.1) 50%, transparent 60%),
            url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.3'/%3E%3C/svg%3E");
        border: 1px solid rgba(255,255,255,0.05);
    }
    /* Metallic Rivets */
    .crate::after {
        content: '';
        position: absolute;
        top: 3px; left: 3px;
        width: 6px; height: 6px;
        background: radial-gradient(circle, #713f12, #451a03);
        border-radius: 50%;
        box-shadow: 
            38px 0 0 #713f12, 
            19px 19px 0 #713f12, 
            38px 38px 0 #713f12, 
            0 38px 0 #713f12;
        border: 1px solid #000;
    }

    /* 6. PLAYER: Geometric Unit */
    .player {
        width: 48px;
        height: 48px;
        position: relative;
        z-index: 10;
        transition: transform 0.15s ease-out;
        animation: hover-bot 2.5s infinite ease-in-out;
    }
    @keyframes hover-bot {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
    }
    /* Unit Body */
    .player-body {
        position: absolute;
        inset: 8px;
        background: linear-gradient(135deg, #fff, var(--player-body));
        border-radius: 12px;
        box-shadow: 
            0 0 15px rgba(255,255,255,0.4),
            0 6px 10px rgba(0,0,0,0.4);
        border: 2px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* Visor */
    .player-visor {
        width: 24px; height: 8px;
        background: #0f172a;
        border-radius: 4px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        position: relative;
        overflow: hidden;
    }
    /* Glowing Eye */
    .player-eye {
        position: absolute;
        top: 1px; left: 2px;
        width: 10px; height: 6px;
        background: var(--player-eye);
        border-radius: 2px;
        box-shadow: 0 0 8px var(--player-eye);
        animation: blink 4s infinite;
    }
    @keyframes blink {
        0%, 96%, 100% { opacity: 1; height: 6px; top: 1px; }
        98% { opacity: 0.3; height: 1px; top: 3px; }
    }

    /* --- Controls Legend --- */
    .controls {
        display: flex;
        gap: 20px;
        font-size: 0.8rem;
        color: #64748b;
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.05);
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(4px);
    }
    .key-group { display: flex; align-items: center; gap: 6px; }
    .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px; height: 22px;
        background: linear-gradient(to bottom, #475569, #334155);
        color: #e2e8f0;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-weight: bold;
        font-size: 0.75rem;
        border-top: 1px solid rgba(255,255,255,0.2);
        border-bottom: 2px solid #1e293b;
        box-shadow: 0 2px 0 #0f172a;
    }

    /* --- Status Message --- */
    .status-bar {
        height: 36px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--ore-glow);
        text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        opacity: 0;
        transition: opacity 0.3s;
        background: rgba(0,0,0,0.6);
        border-radius: 4px;
        border: 1px solid rgba(52, 211, 153, 0.1);
        pointer-events: none;
    }
    .status-bar.visible { opacity: 1; }
    .status-bar.error { color: #ef4444; text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.2); }

</style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>IRON & ORE</h1>
        <div class="hud-stats">
            <div class="stat-box">
                <span class="stat-label">LEVEL</span>
                <span class="stat-value">04</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">MOVES</span>
                <span class="stat-value" id="move-counter">00</span>
            </div>
        </div>
    </header>

    <div class="board-frame">
        <div class="grid" id="game-board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <div class="status-bar" id="status-message">SYSTEM INITIALIZED</div>

    <div class="controls">
        <div class="key-group">
            <span class="key">W</span>
            <span class="key">A</span>
            <span class="key">S</span>
            <span class="key">D</span>
            <span>MOVE</span>
        </div>
        <div class="key-group">
            <span class="key">R</span>
            <span>RESET</span>
        </div>
    </div>
</div>

<script>
    // --- Game Configuration ---
    const BOARD_SIZE = 7;
    
    // Entities
    const TILE_FLOOR = 0;
    const TILE_WALL = 1;
    const TILE_TARGET = 2; // Goal
    const TILE_LEVER = 3;
    const TILE_DOOR = 4;
    const TILE_CRATE = 5;
    const TILE_PLAYER = 6;

    // Level Layout (7x7)
    // 1: Wall, 6: Player, 5: Crate, 3: Lever, 4: Door, 2: Target
    const INITIAL_LEVEL = [
        [1, 1, 1, 1, 1, 1, 1],
        [1, 6, 0, 1, 0, 0, 1],
        [1, 1, 0, 1, 0, 5, 1],
        [1, 0, 0, 3, 0, 1, 1],
        [1, 0, 1, 1, 0, 0, 1],
        [1, 5, 0, 2, 4, 0, 1],
        [1, 1, 1, 1, 1, 1, 1]
    ];

    // State
    let grid = [];
    let playerPos = { x: 1, y: 1 };
    let moves = 0;
    let leverActivated = false;
    let doorOpen = false;
    let crates = []; 

    // --- Initialization ---
    const boardEl = document.getElementById('game-board');
    const moveEl = document.getElementById('move-counter');
    const statusEl = document.getElementById('status-message');

    function initGame() {
        grid = JSON.parse(JSON.stringify(INITIAL_LEVEL));
        moves = 0;
        leverActivated = false;
        doorOpen = false;
        updateMoveDisplay();
        statusEl.classList.remove('visible');
        statusEl.classList.remove('error');
        
        crates = [];
        for(let y=0; y<BOARD_SIZE; y++) {
            for(let x=0; x<BOARD_SIZE; x++) {
                if (grid[y][x] === TILE_PLAYER) {
                    playerPos = {x, y};
                    grid[y][x] = TILE_FLOOR; 
                } else if (grid[y][x] === TILE_CRATE) {
                    crates.push({x, y});
                    grid[y][x] = TILE_FLOOR; 
                }
            }
        }
        renderBoard();
    }

    // --- Rendering ---
    function renderBoard() {
        boardEl.innerHTML = '';
        
        for(let y=0; y<BOARD_SIZE; y++) {
            for(let x=0; x<BOARD_SIZE; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.x = x;
                cell.dataset.y = y;

                const tileType = grid[y][x];

                // 1. Background Layer (Static Map Elements)
                if (tileType === TILE_WALL) {
                    cell.innerHTML = '<div class="wall"></div>';
                } else if (tileType === TILE_TARGET) {
                    cell.innerHTML = `
                        <div class="target-zone"></div>
                        <div class="target-icon"></div>`;
                }

                // 2. Interactive Layer (Switches & Doors)
                if (tileType === TILE_LEVER) {
                    const activeClass = leverActivated ? 'lever-active' : '';
                    cell.innerHTML += `
                        <div class="lever-container ${activeClass}">
                            <div class="lever-plate"></div>
                            <div class="lever-handle">
                                <div class="lever-knob"></div>
                            </div>
                        </div>`;
                } else if (tileType === TILE_DOOR) {
                    const openClass = doorOpen ? 'door-open' : '';
                    cell.innerHTML += `
                        <div class="door-container ${openClass}">
                            <div class="door-panel"></div>
                            <div class="door-indicator"></div>
                        </div>`;
                }

                // 3. Dynamic Layer (Crates)
                const crateIndex = crates.findIndex(c => c.x === x && c.y === y);
                if (crateIndex !== -1) {
                    cell.innerHTML += '<div class="crate"></div>';
                }

                // 4. Player Layer
                if (playerPos.x === x && playerPos.y === y) {
                    cell.innerHTML += `
                        <div class="player">
                            <div class="player-body">
                                <div class="player-visor">
                                    <div class="player-eye"></div>
                                </div>
                            </div>
                        </div>`;
                }

                boardEl.appendChild(cell);
            }
        }
    }

    function updateMoveDisplay() {
        moveEl.textContent = moves.toString().padStart(2, '0');
    }

    function showStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.className = 'status-bar visible';
        if(isError) statusEl.classList.add('error');
        
        if(window.statusTimeout) clearTimeout(window.statusTimeout);
        
        if(!isError) {
            window.statusTimeout = setTimeout(() => {
                statusEl.classList.remove('visible');
            }, 3000);
        }
    }

    // --- Logic ---
    function movePlayer(dx, dy) {
        const newX = playerPos.x + dx;
        const newY = playerPos.y + dy;

        // 1. Check Walls
        if (grid[newY][newX] === TILE_WALL) return;

        // 2. Check Door (if closed)
        if (grid[newY][newX] === TILE_DOOR && !doorOpen) {
            showStatus("ACCESS DENIED - DOOR LOCKED", true);
            return;
        }

        // 3. Check Crates
        const crateIdx = crates.findIndex(c => c.x === newX && c.y === newY);
        
        if (crateIdx !== -1) {
            // Trying to push a crate
            const nextX = newX + dx;
            const nextY = newY + dy;

            // Bounds check
            if (nextX < 0 || nextX >= BOARD_SIZE || nextY < 0 || nextY >= BOARD_SIZE) return;

            // Check Wall
            if (grid[nextY][nextX] === TILE_WALL) return;

            // Check Door (closed)
            if (grid[nextY][nextX] === TILE_DOOR && !doorOpen) return;

            // Check another crate
            if (crates.some(c => c.x === nextX && c.y === nextY)) return;

            // Valid Push
            crates[crateIdx] = { x: nextX, y: nextY };
            
            // Move Player
            playerPos = { x: newX, y: newY };
            moves++;
            updateMoveDisplay();
            renderBoard();
            checkWinCondition();
        } else {
            // Normal Move
            playerPos = { x: newX, y: newY };
            moves++;
            updateMoveDisplay();
            
            // Interactions
            if (grid[newY][newX] === TILE_LEVER) {
                leverActivated = true;
                doorOpen = true;
                showStatus("HYDRAULICS ENGAGED - DOOR OPEN");
            }

            renderBoard();
        }
    }

    function checkWinCondition() {
        const onTarget = crates.some(c => grid[c.y][c.x] === TILE_TARGET);
        if (onTarget) {
            statusEl.textContent = "SECTOR SECURED - SEQUENCE COMPLETE";
            statusEl.style.color = "var(--hud-accent)";
            statusEl.classList.add('visible');
        }
    }

    // --- Input Handling ---
    window.addEventListener('keydown', (e) => {
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }

        switch(e.key.toLowerCase()) {
            case 'w': case 'arrowup': movePlayer(0, -1); break;
            case 's': case 'arrowdown': movePlayer(0, 1); break;
            case 'a': case 'arrowleft': movePlayer(-1, 0); break;
            case 'd': case 'arrowright': movePlayer(1, 0); break;
            case 'r': initGame(); break;
        }
    });

    // Start
    initGame();

</script>
</body>
</html>
