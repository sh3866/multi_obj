<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Game</title>
    <style>
        :root {
            --c-bg: #050011;
            --c-grid: #b026ff;
            --c-sun-top: #ffcc00;
            --c-sun-bot: #ff0055;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-hit: #ffffff;
            --font-main: 'Courier New', Courier, monospace; 
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            color: white;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* --- BACKGROUND LAYERS --- */

        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 2. The Pixelated Retro Sun (Critique: Pixelate Environment) */
        .sun-container {
            position: absolute;
            top: 12%;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 240px;
            height: 240px;
            /* Pixelated gradient effect using steps */
            background: linear-gradient(to bottom, var(--c-sun-top), var(--c-sun-bot));
            background-size: 100% 20px; /* Creates horizontal bands */
            background-repeat: no-repeat;
            /* No border radius for sharp pixel look */
            border-radius: 0; 
            box-shadow: 0 0 40px var(--c-sun-bot), 0 0 80px rgba(255, 0, 85, 0.4);
            position: relative;
            
            /* Mask to create the retro horizontal line cutouts */
            mask-image: linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 15%, 
                black 15%, black 25%, 
                transparent 25%, transparent 30%, 
                black 30%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 80%, 
                transparent 80%, transparent 85%, 
                black 85%, black 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 15%, 
                black 15%, black 25%, 
                transparent 25%, transparent 30%, 
                black 30%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 80%, 
                transparent 80%, transparent 85%, 
                black 85%, black 100%
            );
            /* Force pixelated rendering for the mask */
            mask-repeat: no-repeat;
        }

        /* 3. The Grid Floor */
        .grid-container {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 50%;
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 90%),
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(70deg);
            transform-origin: top center;
            z-index: 2;
            box-shadow: 0 -20px 60px rgba(176, 38, 255, 0.3);
            animation: gridScroll 2s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- GAME HIGHWAY (3D Structure) --- */
        
        .scene-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
            margin-top: 20px;
        }

        .highway {
            width: 320px;
            height: 100%;
            background: rgba(10, 5, 20, 0.85);
            transform: rotateX(35deg);
            transform-origin: bottom center;
            /* Solid borders */
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-cyan);
            box-shadow: 
                0 0 30px rgba(0, 243, 255, 0.2),
                inset 0 0 50px rgba(0, 0, 0, 1);
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* Lane dividers (Critique: Distinct lanes) */
        .lane {
            flex: 1;
            border-right: 2px dashed rgba(255, 255, 255, 0.2);
            position: relative;
            /* Subtle vertical glowing bars */
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(255,255,255,0.03) 50%, rgba(0,0,0,0) 100%);
        }
        .lane:last-child { border-right: none; }

        /* The Hit Line (Critique: Pulsing Glow) */
        .hit-line {
            position: absolute;
            bottom: 20px; /* Lifted slightly off bottom edge */
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--c-hit);
            box-shadow: 
                0 0 15px var(--c-cyan), 
                0 0 30px var(--c-cyan);
            z-index: 12;
            animation: pulseHitLine 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulseHitLine {
            0% { box-shadow: 0 0 10px var(--c-cyan); opacity: 0.8; }
            100% { box-shadow: 0 0 25px var(--c-cyan), 0 0 10px white; opacity: 1; }
        }

        /* --- NOTES (Pixelated & Animated) --- */
        
        .note {
            position: absolute;
            width: 90%;
            left: 5%;
            height: 20px;
            image-rendering: pixelated; 
            border-radius: 0; 
            /* Inner bevel for 3D pixel look */
            border-top: 2px solid rgba(255,255,255,0.8);
            border-left: 2px solid rgba(255,255,255,0.8);
            border-bottom: 2px solid rgba(0,0,0,0.5);
            border-right: 2px solid rgba(0,0,0,0.5);
            box-shadow: 0 0 10px currentColor;
            opacity: 0;
            z-index: 11;
        }

        /* Keyframes for falling */
        @keyframes fall {
            0% { top: -50px; opacity: 0; transform: scale(0.8); }
            5% { opacity: 1; transform: scale(1); }
            95% { opacity: 1; }
            100% { top: calc(100% - 20px); opacity: 0; transform: scale(1.1); }
        }

        /* Specific Note Styles & Timings */
        .n1 { background-color: var(--c-magenta); color: var(--c-magenta); animation: fall 2.5s cubic-bezier(0.1, 0.7, 0.1, 1) infinite; }
        .n2 { background-color: var(--c-cyan); color: var(--c-cyan); animation: fall 2.5s cubic-bezier(0.1, 0.7, 0.1, 1) infinite 0.6s; }
        .n3 { background-color: var(--c-green); color: var(--c-green); animation: fall 2.5s cubic-bezier(0.1, 0.7, 0.1, 1) infinite 1.3s; }
        .n4 { background-color: var(--c-yellow); color: var(--c-yellow); animation: fall 2.5s cubic-bezier(0.1, 0.7, 0.1, 1) infinite 0.2s; }

        /* --- TYPOGRAPHY & UI --- */

        .content-layer {
            position: absolute;
            top: 10%;
            z-index: 30;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Pixelated Title (Critique: Stronger shadow, breathing animation) */
        h1 {
            font-size: 5rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -4px;
            color: #fff;
            font-weight: 900;
            text-rendering: geometricPrecision; 
            
            /* Layered shadow for depth */
            text-shadow: 
                0 0 10px var(--c-cyan),
                4px 4px 0px var(--c-magenta),
                8px 8px 0px rgba(0,0,0,0.5);
            
            animation: breatheTitle 4s ease-in-out infinite;
        }

        @keyframes breatheTitle {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* Start Button (Critique: Solid block, dark interior, moved lower) */
        .start-btn {
            margin-top: 60px; /* Separation from title */
            background: var(--c-cyan); /* Solid high-contrast block */
            border: 4px solid #fff;
            color: #000;
            font-family: var(--font-main);
            font-size: 1.8rem;
            font-weight: 900;
            padding: 16px 60px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            box-shadow: 0 10px 0 #006688, 0 10px 20px rgba(0, 243, 255, 0.4); /* 3D block shadow */
            
            /* Glitch effect setup */
            text-shadow: 2px 0 var(--c-magenta);
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
        }

        .start-btn:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 0 #006688, 0 15px 30px rgba(0, 243, 255, 0.6);
            text-shadow: -2px 0 var(--c-magenta);
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #006688, 0 5px 10px rgba(0, 243, 255, 0.2);
        }

        /* --- OVERLAYS --- */

        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 50%, black 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    <div class="grid-container"></div>
    
    <!-- 3D Highway Scene -->
    <div class="scene-wrapper">
        <div class="highway">
            <!-- Lane 1 (Magenta) -->
            <div class="lane">
                <div class="note n1"></div>
                <div class="note n1" style="animation-delay: 1.2s"></div>
            </div>
            <!-- Lane 2 (Cyan) -->
            <div class="lane">
                <div class="note n2"></div>
                <div class="note n2" style="animation-delay: 1.8s"></div>
            </div>
            <!-- Lane 3 (Green) -->
            <div class="lane">
                <div class="note n3"></div>
                <div class="note n3" style="animation-delay: 0.8s"></div>
            </div>
            <!-- Lane 4 (Yellow) -->
            <div class="lane">
                <div class="note n4"></div>
                <div class="note n4" style="animation-delay: 2.1s"></div>
            </div>
            
            <!-- Physical Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- UI Layer (Top Center Hierarchy) -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR (Pixelated) ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 150;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth
                    size: Math.floor(Math.random() * 2) + 1 // Integer size for pixels
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                if (Math.random() > 0.98) {
                    ctx.globalAlpha = 0.3;
                } else {
                    ctx.globalAlpha = 0.9;
                }
                
                // Draw Square Pixels
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move stars (Warp effect)
                // Stars move faster the closer they are (higher Z)
                star.y += star.z * 1.2;
                
                // Reset if off screen
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            btn.innerHTML = "LOADING...";
            btn.style.background = "#fff";
            btn.style.boxShadow = "0 0 40px var(--c-cyan)";
            
            // Simulate game start
            setTimeout(() => {
                alert("SYSTEM ONLINE. RHYTHM ENGINE LOADED.");
                btn.innerHTML = "START GAME";
                btn.style.background = "var(--c-cyan)";
                btn.style.boxShadow = "0 10px 0 #006688, 0 10px 20px rgba(0, 243, 255, 0.4)";
            }, 600);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
