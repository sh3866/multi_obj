<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Game</title>
    <style>
        :root {
            /* Palette: Neon City */
            --c-bg-top: #050011;
            --c-bg-bot: #1a0029;
            --c-grid: rgba(255, 0, 255, 0.3);
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-white: #ffffff;
            
            /* Typography */
            --font-pixel: "Courier New", Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg-top);
            color: white;
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND LAYERS --- */

        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 2. The Pixelated Retro Sun */
        .sun-container {
            position: absolute;
            top: 10%;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 220px;
            height: 220px;
            background: linear-gradient(to bottom, #ffcc00, #ff0055);
            /* Hard horizontal bands for pixel look */
            background-size: 100% 10px;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 0 60px rgba(255, 0, 85, 0.6);
            
            /* Masking the sun into stripes */
            mask-image: linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 13%, 
                black 13%, black 25%, 
                transparent 25%, transparent 29%, 
                black 29%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 13%, 
                black 13%, black 25%, 
                transparent 25%, transparent 29%, 
                black 29%, black 45%, 
                transparent 45%, transparent 50%, 
                black 50%, black 65%, 
                transparent 65%, transparent 70%, 
                black 70%, black 85%, 
                transparent 85%, transparent 90%, 
                black 90%, black 100%
            );
        }

        /* 3. The Grid Floor (Horizon) */
        .grid-container {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 45%;
            background: 
                linear-gradient(to bottom, rgba(5,0,17,0.9) 0%, transparent 30%, transparent 100%),
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(60deg) translateY(80px);
            transform-origin: center bottom;
            z-index: 2;
            box-shadow: 0 -40px 100px rgba(255, 0, 255, 0.2);
            animation: gridScroll 2s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- GAME HIGHWAY (3D Perspective) --- */
        
        .scene-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
            perspective: 800px;
        }

        .highway {
            width: 340px; /* Slightly wider */
            height: 80vh;
            background: rgba(10, 5, 20, 0.85);
            /* Stronger 3D angle */
            transform: rotateX(30deg) translateY(10%);
            transform-origin: top center;
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-cyan);
            box-shadow: 
                0 0 50px rgba(0, 243, 255, 0.2),
                inset 0 0 80px rgba(0, 0, 0, 1);
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* Lane dividers - Distinct Dashed Lines */
        .lane {
            flex: 1;
            position: relative;
            /* Alternating subtle lane backgrounds */
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 100%);
            border-right: 2px dashed rgba(255, 255, 255, 0.2);
        }
        .lane:last-child { border-right: none; }
        
        /* Enhance Highway: Alternating Lane Tints */
        .lane:nth-child(odd) { background-color: rgba(255, 255, 255, 0.02); }
        .lane:nth-child(even) { background-color: rgba(0, 0, 0, 0.2); }

        /* --- THE HIT LINE (Review Point #1) --- */
        .hit-line {
            position: absolute;
            bottom: 0; /* Anchored to bottom */
            left: -5%;
            width: 110%;
            height: 12px;
            background: var(--c-white);
            z-index: 20;
            /* Sharp, distinct glow */
            box-shadow: 
                0 0 10px var(--c-white),
                0 0 30px var(--c-cyan),
                0 0 60px var(--c-cyan);
            animation: pulseHitLine 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulseHitLine {
            0% { opacity: 0.7; box-shadow: 0 0 10px var(--c-white), 0 0 20px var(--c-cyan); transform: scaleY(1); }
            100% { opacity: 1; box-shadow: 0 0 20px var(--c-white), 0 0 50px var(--c-cyan); transform: scaleY(1.2); }
        }

        /* --- NOTES (Dynamic Elements) --- */
        
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 28px;
            image-rendering: pixelated; 
            border-radius: 0; 
            
            /* Pixel Bevel for "Block" look */
            border-top: 4px solid rgba(255,255,255,0.8);
            border-left: 4px solid rgba(255,255,255,0.8);
            border-bottom: 4px solid rgba(0,0,0,0.5);
            border-right: 4px solid rgba(0,0,0,0.5);
            
            box-shadow: 0 0 20px currentColor;
            opacity: 0;
            z-index: 10;
        }

        /* Notes falling toward the hit line */
        @keyframes fall {
            0% { top: -10%; opacity: 0; transform: scale(0.8); }
            5% { opacity: 1; transform: scale(1); }
            95% { opacity: 1; }
            100% { top: 105%; opacity: 0; transform: scale(1.1); } /* Go past hit line */
        }

        /* Note Colors & Timings */
        .n1 { background-color: var(--c-magenta); color: var(--c-magenta); animation: fall 2s linear infinite; }
        .n2 { background-color: var(--c-cyan); color: var(--c-cyan); animation: fall 2s linear infinite 0.6s; }
        .n3 { background-color: var(--c-green); color: var(--c-green); animation: fall 2s linear infinite 1.2s; }
        .n4 { background-color: var(--c-yellow); color: var(--c-yellow); animation: fall 2s linear infinite 1.8s; }

        /* --- TYPOGRAPHY & UI --- */

        .content-layer {
            position: absolute;
            top: 10%;
            z-index: 30;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        h1 {
            font-size: 5.5rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -4px;
            color: #fff;
            font-weight: 900;
            text-rendering: geometricPrecision; 
            
            /* Refined Glow - Tighter */
            text-shadow: 
                0 0 2px #fff,
                0 0 15px var(--c-cyan),
                0 0 40px var(--c-cyan),
                4px 4px 0px var(--c-magenta); 
            
            animation: breatheTitle 4s ease-in-out infinite;
            pointer-events: auto;
        }

        @keyframes breatheTitle {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); filter: brightness(1.2); }
            100% { transform: scale(1); }
        }

        /* --- REDISGNED START BUTTON (Review Point #2) --- */
        .start-btn {
            margin-top: 30px;
            position: relative;
            z-index: 31;
            background: #000; /* Solid background */
            border: 4px solid var(--c-cyan); /* Pixelated border color */
            color: var(--c-cyan);
            font-family: var(--font-pixel);
            font-size: 1.8rem;
            font-weight: 900;
            padding: 12px 60px;
            text-transform: uppercase;
            letter-spacing: 6px;
            cursor: pointer;
            outline: none;
            
            /* Pixelated Corners via clip-path */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            
            /* Subtle Pulse Animation */
            animation: btnPulse 2s infinite;
            transition: transform 0.1s, background 0.2s;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--c-cyan);
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 0px rgba(0, 243, 255, 0); }
            50% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
            100% { box-shadow: 0 0 0px rgba(0, 243, 255, 0); }
        }

        /* --- OVERLAYS --- */

        /* Scanline Overlay (Review Point #4) */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 60%, black 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    <div class="grid-container"></div>
    
    <!-- 3D Highway Scene -->
    <div class="scene-wrapper">
        <div class="highway">
            <!-- Lane 1 (Magenta) -->
            <div class="lane">
                <div class="note n1"></div>
                <div class="note n1" style="animation-delay: 1.1s"></div>
                <div class="note n1" style="animation-delay: 2.3s"></div>
            </div>
            <!-- Lane 2 (Cyan) -->
            <div class="lane">
                <div class="note n2"></div>
                <div class="note n2" style="animation-delay: 1.6s"></div>
            </div>
            <!-- Lane 3 (Green) -->
            <div class="lane">
                <div class="note n3"></div>
                <div class="note n3" style="animation-delay: 0.9s"></div>
                <div class="note n3" style="animation-delay: 2.0s"></div>
            </div>
            <!-- Lane 4 (Yellow) -->
            <div class="lane">
                <div class="note n4"></div>
                <div class="note n4" style="animation-delay: 1.3s"></div>
            </div>
            
            <!-- Distinct Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- UI Layer (Top Center Hierarchy) -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR (Pixelated) ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 120;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() > 0.9 ? 3 : 2 // Larger pixels
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                // Draw Square Pixels
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move stars (Warp effect)
                star.y += star.z;
                
                // Reset if off screen
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            const originalText = btn.innerText;
            btn.innerHTML = "LOADING...";
            btn.style.background = "#fff";
            btn.style.color = "#000";
            btn.style.boxShadow = "0 0 40px #fff";
            btn.style.borderColor = "#fff";
            
            // Simulate game start
            setTimeout(() => {
                // Reset for demo purposes
                btn.innerHTML = "READY";
                btn.style.background = "var(--c-cyan)";
                btn.style.color = "#000";
                btn.style.borderColor = "var(--c-cyan)";
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = "#000";
                    btn.style.color = "var(--c-cyan)";
                    btn.style.boxShadow = "none";
                }, 1500);
            }, 800);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
