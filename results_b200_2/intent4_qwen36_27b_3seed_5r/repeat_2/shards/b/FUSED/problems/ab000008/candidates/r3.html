<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Game</title>
    <style>
        :root {
            /* Palette: Deep Synthwave */
            --c-bg-top: #050011;
            --c-bg-bot: #2b003b;
            --c-grid: #ff00ff;
            --c-grid-fade: rgba(18, 0, 36, 0.8);
            --c-sun-top: #ffcc00;
            --c-sun-bot: #ff0055;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-green: #00ff66;
            --c-hit: #ffffff;
            
            /* Typography */
            --font-pixel: "Courier New", Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg-top);
            color: white;
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* Global perspective for atmosphere */
        }

        /* --- BACKGROUND LAYERS --- */

        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 2. The Pixelated Retro Sun */
        .sun-container {
            position: absolute;
            top: 15%;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 200px;
            height: 200px;
            background: linear-gradient(to bottom, var(--c-sun-top), var(--c-sun-bot));
            /* Pixelated Gradient Bands */
            background-size: 100% 15px;
            background-repeat: no-repeat;
            border-radius: 0; /* Hard edges */
            box-shadow: 0 0 50px var(--c-sun-bot);
            position: relative;
            
            /* Retro Sun Cutouts (Mask) */
            mask-image: linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 12%, 
                black 12%, black 25%, 
                transparent 25%, transparent 28%, 
                black 28%, black 45%, 
                transparent 45%, transparent 48%, 
                black 48%, black 65%, 
                transparent 65%, transparent 68%, 
                black 68%, black 80%, 
                transparent 80%, transparent 82%, 
                black 82%, black 100%
            );
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 12%, 
                black 12%, black 25%, 
                transparent 25%, transparent 28%, 
                black 28%, black 45%, 
                transparent 45%, transparent 48%, 
                black 48%, black 65%, 
                transparent 65%, transparent 68%, 
                black 68%, black 80%, 
                transparent 80%, transparent 82%, 
                black 82%, black 100%
            );
        }

        /* 3. The Grid Floor (Horizon) */
        .grid-container {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 45%;
            background: 
                linear-gradient(to bottom, var(--c-grid-fade) 0%, transparent 10%, transparent 100%),
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: perspective(600px) rotateX(65deg) translateY(100px);
            transform-origin: center bottom;
            z-index: 2;
            box-shadow: 0 -30px 80px rgba(255, 0, 255, 0.3);
            animation: gridScroll 1.5s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        /* --- GAME HIGHWAY (3D Perspective) --- */
        
        .scene-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
            perspective: 800px; /* 3. Depth & Atmosphere */
        }

        .highway {
            width: 300px;
            height: 80vh;
            background: rgba(0, 0, 0, 0.8);
            /* 3. Depth & Atmosphere: Receding into background */
            transform: rotateX(35deg) translateY(10%);
            transform-origin: top center;
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-cyan);
            box-shadow: 
                0 0 40px rgba(0, 243, 255, 0.3),
                inset 0 0 100px rgba(0, 0, 0, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            backdrop-filter: blur(2px); /* Subtle glass effect */
        }

        /* Lane dividers */
        .lane {
            flex: 1;
            border-right: 2px dashed rgba(255, 255, 255, 0.15);
            position: relative;
        }
        .lane:last-child { border-right: none; }
        
        /* Lane Colors (Subtle tint) */
        .lane:nth-child(1) { background: linear-gradient(to right, rgba(255,0,255,0.1), transparent); }
        .lane:nth-child(2) { background: linear-gradient(to right, transparent, rgba(0,243,255,0.1)); }
        .lane:nth-child(3) { background: linear-gradient(to right, rgba(0,255,102,0.1), transparent); }
        .lane:nth-child(4) { background: linear-gradient(to right, transparent, rgba(255,230,0,0.1)); }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;
            height: 8px;
            background: var(--c-hit);
            box-shadow: 
                0 0 15px var(--c-cyan), 
                0 0 30px var(--c-cyan),
                0 10px 20px rgba(0,0,0,0.5);
            z-index: 12;
            animation: pulseHitLine 1s ease-in-out infinite alternate;
        }

        @keyframes pulseHitLine {
            0% { box-shadow: 0 0 10px var(--c-cyan); opacity: 0.8; transform: scaleY(1); }
            100% { box-shadow: 0 0 25px var(--c-cyan), 0 0 10px white; opacity: 1; transform: scaleY(1.5); }
        }

        /* --- NOTES (Dynamic Elements) --- */
        
        .note {
            position: absolute;
            width: 90%;
            left: 5%;
            height: 24px;
            image-rendering: pixelated; 
            border-radius: 0; 
            /* Pixel Bevel */
            border-top: 3px solid rgba(255,255,255,0.9);
            border-left: 3px solid rgba(255,255,255,0.9);
            border-bottom: 3px solid rgba(0,0,0,0.6);
            border-right: 3px solid rgba(0,0,0,0.6);
            box-shadow: 0 0 15px currentColor;
            opacity: 0;
            z-index: 11;
        }

        /* 4. Dynamic Elements: CSS Animation scrolling toward player */
        @keyframes fall {
            0% { top: -10%; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { top: 95%; opacity: 0; transform: scale(1.2); }
        }

        /* Specific Note Styles & Timings */
        .n1 { background-color: var(--c-magenta); color: var(--c-magenta); animation: fall 2s linear infinite; }
        .n2 { background-color: var(--c-cyan); color: var(--c-cyan); animation: fall 2s linear infinite 0.5s; }
        .n3 { background-color: var(--c-green); color: var(--c-green); animation: fall 2s linear infinite 1.0s; }
        .n4 { background-color: var(--c-yellow); color: var(--c-yellow); animation: fall 2s linear infinite 1.5s; }

        /* --- TYPOGRAPHY & UI --- */

        .content-layer {
            position: absolute;
            top: 12%;
            z-index: 30;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to background if needed */
        }

        /* 1. Typography Overhaul: Pixel Font + Neon Glow */
        h1 {
            font-size: 5rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -5px;
            color: #fff;
            font-weight: 900;
            text-rendering: geometricPrecision; 
            
            /* Chunky Neon Glow */
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--c-cyan),
                0 0 40px var(--c-cyan),
                0 0 80px var(--c-cyan),
                5px 5px 0px var(--c-magenta); /* Pixel shadow */
            
            animation: breatheTitle 4s ease-in-out infinite;
            pointer-events: auto;
        }

        @keyframes breatheTitle {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.3); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* 2. UI Refinement: Hollow, Outlined Pixel Button */
        .start-btn {
            margin-top: 40px;
            background: transparent;
            border: 4px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            pointer-events: auto;
            
            /* Pixelated Corners via clip-path */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
            
            /* Pulsing Glow Animation */
            animation: btnPulse 2s infinite;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--c-cyan);
            text-shadow: none;
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 0px var(--c-cyan); text-shadow: 0 0 5px var(--c-cyan); }
            50% { box-shadow: 0 0 20px var(--c-cyan); text-shadow: 0 0 10px var(--c-cyan); }
            100% { box-shadow: 0 0 0px var(--c-cyan); text-shadow: 0 0 5px var(--c-cyan); }
        }

        /* --- OVERLAYS --- */

        /* 4. Dynamic Elements: Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 50%, black 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    <div class="grid-container"></div>
    
    <!-- 3D Highway Scene -->
    <div class="scene-wrapper">
        <div class="highway">
            <!-- Lane 1 (Magenta) -->
            <div class="lane">
                <div class="note n1"></div>
                <div class="note n1" style="animation-delay: 1.0s"></div>
                <div class="note n1" style="animation-delay: 2.2s"></div>
            </div>
            <!-- Lane 2 (Cyan) -->
            <div class="lane">
                <div class="note n2"></div>
                <div class="note n2" style="animation-delay: 1.5s"></div>
            </div>
            <!-- Lane 3 (Green) -->
            <div class="lane">
                <div class="note n3"></div>
                <div class="note n3" style="animation-delay: 0.8s"></div>
                <div class="note n3" style="animation-delay: 1.9s"></div>
            </div>
            <!-- Lane 4 (Yellow) -->
            <div class="lane">
                <div class="note n4"></div>
                <div class="note n4" style="animation-delay: 1.2s"></div>
            </div>
            
            <!-- Physical Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- UI Layer (Top Center Hierarchy) -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
        <button class="start-btn">START</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR (Pixelated) ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 100;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() > 0.8 ? 3 : 2 // Larger pixels
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                // Draw Square Pixels
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move stars (Warp effect)
                star.y += star.z;
                
                // Reset if off screen
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            btn.innerHTML = "INIT...";
            btn.style.background = "#fff";
            btn.style.color = "#000";
            btn.style.boxShadow = "0 0 50px #fff";
            
            // Simulate game start
            setTimeout(() => {
                // Reset for demo purposes
                btn.innerHTML = "START";
                btn.style.background = "transparent";
                btn.style.color = "var(--c-cyan)";
                btn.style.boxShadow = "none";
            }, 800);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
