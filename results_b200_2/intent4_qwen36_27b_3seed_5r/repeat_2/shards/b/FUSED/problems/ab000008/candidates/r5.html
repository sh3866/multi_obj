<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Game</title>
    <style>
        :root {
            /* Palette: High Saturation Neon */
            --c-bg-top: #0a0014;
            --c-bg-bot: #240036;
            --c-grid: rgba(255, 0, 255, 0.4);
            --c-cyan: #00FFFF;
            --c-magenta: #FF00FF;
            --c-yellow: #FFFF00;
            --c-green: #00FF66;
            --c-white: #FFFFFF;
            --c-black: #000000;
            
            /* Dimensions */
            --highway-width: 400px;
            --lane-width: 100px;
        }

        * { box-sizing: border-box; user-select: none; cursor: default; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg-top);
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Fallback pixel font */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND LAYERS --- */

        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 2. The Pixelated Retro Sun */
        .sun-container {
            position: absolute;
            top: 15%;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 250px;
            height: 250px;
            background: linear-gradient(to bottom, #FFEB3B 0%, #FF0055 100%);
            position: relative;
            box-shadow: 0 0 80px rgba(255, 0, 85, 0.5);
            
            /* Hard horizontal bands for pixel look */
            -webkit-mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 22%,
                transparent 22%, transparent 25%,
                black 25%, black 40%,
                transparent 40%, transparent 44%,
                black 44%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 80%,
                transparent 80%, transparent 85%,
                black 85%, black 100%
            );
            mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 22%,
                transparent 22%, transparent 25%,
                black 25%, black 40%,
                transparent 40%, transparent 44%,
                black 44%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 80%,
                transparent 80%, transparent 85%,
                black 85%, black 100%
            );
        }

        /* 3. The Grid Floor (Horizon) */
        .grid-container {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 80%;
            background: 
                linear-gradient(to bottom, rgba(10,0,20,0.8) 0%, transparent 10%, transparent 100%),
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 80px 80px;
            transform: perspective(400px) rotateX(60deg) translateY(100px);
            transform-origin: center top;
            z-index: 2;
            box-shadow: 0 -50px 100px rgba(255, 0, 255, 0.3);
            animation: gridScroll 1.5s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }

        /* --- GAME HIGHWAY (Flatter Perspective) --- */
        
        .scene-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            perspective: 1000px; /* Flatter perspective */
        }

        .highway {
            width: var(--highway-width);
            height: 500px; /* Fixed height for consistency */
            background: rgba(0, 0, 0, 0.8);
            /* Slight Tilt for depth, but mostly readable */
            transform: rotateX(15deg);
            transform-origin: top center;
            
            /* Neon Borders */
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-cyan);
            box-shadow: 
                0 0 30px rgba(0, 243, 255, 0.3),
                inset 0 0 50px rgba(0, 0, 0, 1);
            
            position: relative;
            overflow: hidden;
            display: flex;
            backdrop-filter: blur(2px);
        }

        /* Lane Dividers */
        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .lane:last-child { border-right: none; }
        
        /* Alternating Lane Tints for readability */
        .lane:nth-child(odd) { background: rgba(0, 255, 255, 0.03); }
        .lane:nth-child(even) { background: rgba(255, 0, 255, 0.03); }

        /* --- THE HIT LINE --- */
        .hit-line {
            position: absolute;
            bottom: 20px; /* Distinct distance from edge */
            left: -10px;
            width: calc(100% + 20px);
            height: 6px;
            background: var(--c-white);
            z-index: 20;
            box-shadow: 
                0 0 10px var(--c-white),
                0 0 30px var(--c-cyan),
                0 0 60px var(--c-cyan);
            animation: pulseHitLine 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulseHitLine {
            0% { opacity: 0.8; box-shadow: 0 0 10px var(--c-white), 0 0 20px var(--c-cyan); }
            100% { opacity: 1; box-shadow: 0 0 20px var(--c-white), 0 0 50px var(--c-cyan); }
        }

        /* --- NOTES (Pixel Art Style) --- */
        
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            image-rendering: pixelated; 
            border-radius: 0; 
            
            /* Pixel Bevel */
            border-top: 4px solid rgba(255,255,255,0.9);
            border-left: 4px solid rgba(255,255,255,0.9);
            border-bottom: 4px solid rgba(0,0,0,0.6);
            border-right: 4px solid rgba(0,0,0,0.6);
            
            box-shadow: 0 0 15px currentColor;
            opacity: 0;
            z-index: 10;
        }

        /* Falling Animation */
        @keyframes fall {
            0% { top: -50px; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { top: 520px; opacity: 0; transform: scale(1.1); }
        }

        /* Note Colors & Timings */
        .n1 { background-color: var(--c-magenta); color: var(--c-magenta); animation: fall 2.2s linear infinite; }
        .n2 { background-color: var(--c-cyan); color: var(--c-cyan); animation: fall 2.2s linear infinite 0.5s; }
        .n3 { background-color: var(--c-green); color: var(--c-green); animation: fall 2.2s linear infinite 1.1s; }
        .n4 { background-color: var(--c-yellow); color: var(--c-yellow); animation: fall 2.2s linear infinite 1.6s; }

        /* --- TYPOGRAPHY & UI --- */

        .content-layer {
            position: absolute;
            top: 12%;
            z-index: 30;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 6rem;
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -5px;
            color: #fff;
            
            /* Pixelated rendering */
            image-rendering: pixelated;
            -webkit-font-smoothing: none;

            /* Retro Synthwave Glow */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                -2px -2px 0px var(--c-cyan),
                0 0 20px rgba(255, 0, 255, 0.8),
                0 0 40px rgba(0, 243, 255, 0.5); 
            
            animation: breatheTitle 4s ease-in-out infinite;
            pointer-events: auto;
        }

        @keyframes breatheTitle {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.15); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* --- START BUTTON (Moved to Bottom) --- */
        .ui-footer {
            position: absolute;
            bottom: 5%;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 40;
        }

        .start-btn {
            position: relative;
            background: rgba(0,0,0,0.8);
            border: 4px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 2rem;
            padding: 15px 80px;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            outline: none;
            
            /* Distinct Pixelated Shape */
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
            
            /* Active State & Glow */
            box-shadow: 0 0 15px var(--c-cyan);
            transition: all 0.1s ease;
            animation: btnPulse 2s infinite;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: var(--c-black);
            box-shadow: 0 0 40px var(--c-cyan);
            transform: scale(1.05);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .start-btn:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 0 10px var(--c-cyan);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 10px var(--c-cyan); }
            50% { box-shadow: 0 0 25px var(--c-cyan); }
            100% { box-shadow: 0 0 10px var(--c-cyan); }
        }

        /* --- OVERLAYS --- */

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 50%, black 120%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    <div class="grid-container"></div>
    
    <!-- 3D Highway Scene -->
    <div class="scene-wrapper">
        <div class="highway">
            <!-- Lane 1 (Magenta) -->
            <div class="lane">
                <div class="note n1"></div>
                <div class="note n1" style="animation-delay: 1.1s"></div>
                <div class="note n1" style="animation-delay: 2.3s"></div>
            </div>
            <!-- Lane 2 (Cyan) -->
            <div class="lane">
                <div class="note n2"></div>
                <div class="note n2" style="animation-delay: 1.6s"></div>
            </div>
            <!-- Lane 3 (Green) -->
            <div class="lane">
                <div class="note n3"></div>
                <div class="note n3" style="animation-delay: 0.9s"></div>
                <div class="note n3" style="animation-delay: 2.0s"></div>
            </div>
            <!-- Lane 4 (Yellow) -->
            <div class="lane">
                <div class="note n4"></div>
                <div class="note n4" style="animation-delay: 1.3s"></div>
            </div>
            
            <!-- Distinct Hit Line -->
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- UI Layer (Title Top) -->
    <div class="content-layer">
        <h1>PIXEL<br>DANCE</h1>
    </div>

    <!-- UI Layer (Button Bottom) -->
    <div class="ui-footer">
        <button class="start-btn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR (Pixelated) ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 150;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() > 0.95 ? 3 : 2 // Larger pixels
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                // Draw Square Pixels
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move stars (Warp effect)
                star.y += star.z;
                
                // Reset if off screen
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            const originalText = btn.innerText;
            btn.innerHTML = "LOADING...";
            btn.style.background = "#fff";
            btn.style.color = "#000";
            btn.style.boxShadow = "0 0 40px #fff";
            btn.style.borderColor = "#fff";
            
            // Simulate game start
            setTimeout(() => {
                // Reset for demo purposes
                btn.innerHTML = "READY";
                btn.style.background = "var(--c-cyan)";
                btn.style.color = "#000";
                btn.style.borderColor = "var(--c-cyan)";
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = "rgba(0,0,0,0.8)";
                    btn.style.color = "var(--c-cyan)";
                    btn.style.boxShadow = "0 0 15px var(--c-cyan)";
                    btn.style.borderColor = "var(--c-cyan)";
                }, 1500);
            }, 800);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
