<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Region 04</title>
<style>
  :root {
    /* Palette: Deep Space & Bioluminescence */
    --bg-deep: #02040a;
    --bg-accent: #0f172a;
    --primary: #38bdf8; /* Cyan */
    --primary-dim: #0ea5e9;
    --accent: #fbbf24; /* Amber */
    --rare: #a78bfa; /* Violet */
    --common: #f472b6; /* Pink */
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    
    /* UI Glassmorphism */
    --glass-bg: rgba(2, 4, 10, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    
    /* Typography */
    --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    cursor: none; /* Custom cursor used */
  }

  /* --- Layout --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* HUD Layer */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 100;
    pointer-events: none; /* Let clicks pass through to canvas */
  }

  /* Title Styling */
  .title-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .title-group h1 {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 0.05em; /* Premium spacing */
    line-height: 0.9;
    text-transform: uppercase;
    background: linear-gradient(to right, #fff, #cbd5e1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
  }

  .title-group p {
    font-size: 0.9rem;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.8;
    margin-left: 4px;
  }

  /* HUD Stats */
  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 0.8rem 1.5rem;
    border-radius: 24px; /* Softer, organic pill shape */
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  
  /* Subtle sheen on UI */
  .stat-pill::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
    pointer-events: none;
  }

  .stat-icon {
    width: 24px;
    height: 24px;
    fill: var(--accent);
    filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
  }

  .stat-data {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.2rem;
  }

  /* Canvas */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Player Anchor - Re-established as central figure */
  .player-anchor {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    width: 220px; /* Increased scale */
    height: 280px;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
  }

  .player-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Collection Button - Repositioned to Bottom Center */
  .action-bar {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: auto;
    display: flex;
    gap: 1rem;
  }

  .btn-collect {
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.95));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 1rem 3rem;
    font-size: 1rem;
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }

  .btn-collect::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: 0.5s;
  }

  .btn-collect:hover {
    border-color: var(--primary);
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    transform: translateY(-2px);
    color: var(--primary);
  }
  
  .btn-collect:hover::after {
    transform: translateX(100%);
  }

  .btn-collect svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(2, 4, 10, 0.8);
    border: 1px solid var(--primary);
    padding: 1rem 2.5rem;
    border-radius: 30px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 200;
    text-align: center;
    box-shadow: 0 10px 50px rgba(56, 189, 248, 0.2);
    backdrop-filter: blur(8px);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--primary); 
    font-family: var(--font-display);
    font-size: 0.8rem;
    margin-bottom: 0.2rem; 
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .toast p { font-size: 1.4rem; color: #fff; font-weight: 700; letter-spacing: -0.02em; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether<br>Catcher</h1>
      <p>Region 04</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
        </svg>
        <div class="stat-data">
          <div class="stat-value" id="score">00</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:var(--primary)" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <div class="stat-data">
          <div class="stat-value">74%</div>
          <div class="stat-label">Biome Map</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Player Avatar Anchor - Central & Large -->
  <div class="player-anchor">
    <!-- Redesigned SVG Player: High detail, glowing net, integrated suit -->
    <svg class="player-svg" viewBox="0 0 200 260" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <!-- Net Handle -->
      <path d="M130 130 L160 70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <circle cx="160" cy="70" r="4" fill="#fff"/>
      
      <!-- Net Loop (Glowing Mesh) -->
      <g filter="url(#glow)">
        <path d="M160 70 Q 190 50 180 20 Q 170 0 160 20 Q 150 0 140 20 Q 130 50 160 70" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
        <path d="M160 70 Q 190 50 180 20 Q 170 0 160 20 Q 150 0 140 20 Q 130 50 160 70" fill="none" stroke="#fff" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>
      </g>
      
      <!-- Backpack (High Tech) -->
      <rect x="60" y="90" width="40" height="55" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="80" cy="117" r="8" fill="#38bdf8" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
      </circle>
      
      <!-- Body (Stylized Silhouette) -->
      <path d="M100 75 C 60 75, 40 130, 40 180 L 160 180 C 160 130, 140 75, 100 75" fill="url(#suitGrad)" stroke="#94a3b8" stroke-width="1"/>
      
      <!-- Head/Helmet -->
      <circle cx="100" cy="60" r="22" fill="#f8fafc" />
      
      <!-- Visor (Reflective) -->
      <path d="M78 60 Q 100 75 122 60" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Chest Emblem -->
      <path d="M100 110 L 105 120 L 100 130 L 95 120 Z" fill="var(--accent)"/>
    </svg>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Mist Sprite</p>
  </div>

  <!-- Action Bar - Centered Bottom -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
      View Collection
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Redesign
 * Focus: Cohesive visual system, "Soft Sci-Fi" aesthetic, clear hierarchy.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: 0, y: 0 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let islands = [];
let clouds = [];
let stars = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initEnvironment();
}
window.addEventListener('resize', resize);

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Environment Classes ---

class Star {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5;
        this.blinkSpeed = Math.random() * 0.02 + 0.01;
        this.alpha = Math.random();
    }
    
    draw(ctx) {
        this.alpha += this.blinkSpeed;
        if(this.alpha > 1 || this.alpha < 0.2) this.blinkSpeed *= -1;
        
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha) * 0.5})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

class Island {
  constructor(layer) {
    this.layer = layer; // 0 = far, 1 = mid, 2 = near
    this.x = Math.random() * width;
    this.y = Math.random() * height * 0.9;
    this.size = (layer + 1) * 80 + Math.random() * 50;
    this.speed = (layer + 1) * 0.08;
    this.shape = [];
    
    // Generate smoother, flatter shapes
    const points = 6 + Math.floor(Math.random() * 3);
    for(let i=0; i<points; i++) {
      const angle = (Math.PI * 2 / points) * i;
      const r = this.size * (0.7 + Math.random() * 0.3); 
      this.shape.push({
        x: Math.cos(angle) * r,
        y: Math.sin(angle) * r * 0.6 // Flatter bottom
      });
    }
  }

  update() {
    this.x -= this.speed;
    if (this.x < -this.size * 2) {
      this.x = width + this.size * 2;
      this.y = Math.random() * height * 0.9;
    }
  }

  draw(ctx) {
    const isFar = this.layer === 0;
    const opacity = isFar ? 0.15 : (this.layer === 1 ? 0.3 : 0.85);
    
    // Gradient for depth
    const grad = ctx.createLinearGradient(this.x - this.size, this.y, this.x + this.size, this.y);
    if (isFar) {
        grad.addColorStop(0, `rgba(30, 41, 59, ${opacity})`);
        grad.addColorStop(1, `rgba(15, 23, 42, ${opacity})`);
    } else {
        // Near islands have distinct rim lighting
        grad.addColorStop(0, `rgba(15, 23, 42, 0.95)`);
        grad.addColorStop(1, `rgba(30, 41, 59, 0.95)`);
    }

    ctx.fillStyle = grad;
    ctx.strokeStyle = isFar ? 'transparent' : `rgba(56, 189, 246, ${opacity * 0.4})`;
    ctx.lineWidth = isFar ? 0 : 1;
    
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Rim glow for near islands
    if (!isFar) {
        ctx.shadowBlur = 40;
        ctx.shadowColor = 'rgba(59, 130, 246, 0.2)';
    }

    ctx.beginPath();
    ctx.moveTo(this.shape[0].x, this.shape[0].y);
    for(let i=0; i<this.shape.length; i++) {
        let p0 = this.shape[i];
        let p1 = this.shape[(i+1)%this.shape.length];
        let midX = (p0.x + p1.x) / 2;
        let midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Add crystalline structures on near islands
    if(this.layer === 2) {
        ctx.fillStyle = `rgba(255, 255, 255, 0.1)`;
        ctx.strokeStyle = `rgba(56, 189, 248, 0.6)`;
        ctx.lineWidth = 1;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `rgba(56, 189, 248, 0.8)`;
        
        // Draw crystals
        for(let k=0; k<4; k++) {
            ctx.beginPath();
            let cx = (Math.random() - 0.5) * this.size;
            let cy = -this.size * 0.2;
            ctx.moveTo(cx - 4, cy);
            ctx.lineTo(cx, cy - 15 - Math.random()*20);
            ctx.lineTo(cx + 4, cy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }
    
    ctx.restore();
  }
}

class Cloud {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 300 + 100;
    this.speed = Math.random() * 0.2 + 0.05;
    this.opacity = Math.random() * 0.04 + 0.02;
  }
  
  update() {
    this.x += this.speed;
    if(this.x > width + this.size * 2) this.x = -this.size * 2;
  }
  
  draw(ctx) {
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `rgba(56, 189, 248, ${this.opacity})`);
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initEnvironment() {
  islands = [];
  clouds = [];
  stars = [];
  // Background layers
  for(let i=0; i<6; i++) islands.push(new Island(0));
  for(let i=0; i<5; i++) islands.push(new Island(1));
  for(let i=0; i<3; i++) islands.push(new Island(2));
  for(let i=0; i<10; i++) clouds.push(new Cloud());
  for(let i=0; i<150; i++) stars.push(new Star());
}

// --- Game Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.02;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
    const types = ['shard', 'orb', 'moth', 'jelly'];
    this.type = types[Math.floor(Math.random() * types.length)];
    this.color = this.getColor(this.type);
    this.offset = Math.random() * 100;
  }

  init() {
    this.x = Math.random() * (width - 100) + 50;
    this.y = Math.random() * (height - 200) + 50; // Keep away from bottom player
    this.size = 20 + Math.random() * 20;
    this.speedX = (Math.random() - 0.5) * 1.5;
    this.speedY = (Math.random() - 0.5) * 1.5;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.caught = false;
  }

  getColor(type) {
    switch(type) {
      case 'shard': return '#38bdf8'; // Cyan
      case 'orb': return '#a78bfa'; // Purple
      case 'moth': return '#f472b6'; // Pink
      case 'jelly': return '#34d399'; // Emerald
      default: return '#fbbf24';
    }
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.wobble += 0.04;
    this.angle += 0.01;

    // Bounce logic
    if (this.x < 50 || this.x > width - 50) this.speedX *= -1;
    if (this.y < 50 || this.y > height - 250) this.speedY *= -1; // Avoid player zone

    // Catch Logic
    if (!this.caught) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < this.size + 30) { // Net radius
        this.catch();
      }
    } else {
      // Sucked into net logic
      this.x += (mouse.x - this.x) * 0.15;
      this.y += (mouse.y - this.y) * 0.15;
      this.size *= 0.92; 
      if(this.size < 1) this.caught = false; // Reset if too small
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score < 10 ? '0'+score : score;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "CAPTURED"));
    
    const names = {
      'shard': 'Cryo Shard',
      'orb': 'Void Orb',
      'moth': 'Aether Moth',
      'jelly': 'Luma Jelly'
    };
    catchNameEl.innerText = names[this.type];
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Dynamic glow based on type
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    
    if (this.caught) {
        ctx.rotate(time * 3);
    }

    // Draw distinct biological silhouettes
    if (this.type === 'shard') {
        // Crystalline structure
        ctx.beginPath();
        const s = this.size;
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.3, -s*0.2);
        ctx.lineTo(s * 0.6, s * 0.5);
        ctx.lineTo(0, s);
        ctx.lineTo(-s * 0.6, s * 0.5);
        ctx.lineTo(-s * 0.3, -s*0.2);
        ctx.closePath();
        ctx.fill();
        
        // Inner facets
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.3, -s*0.2);
        ctx.lineTo(0, 0);
        ctx.lineTo(-s * 0.3, -s*0.2);
        ctx.fill();
    } 
    else if (this.type === 'orb') {
        // Pulsating energy sphere with core
        const pulse = Math.sin(this.wobble * 2) * 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.size + pulse, 0, Math.PI * 2);
        ctx.fill();
        
        // Core eye
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        // Orbiting rings
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 1.5, this.size * 0.4, this.wobble, 0, Math.PI*2);
        ctx.stroke();
    }
    else if (this.type === 'moth') {
        // Organic winged shape
        ctx.rotate(Math.sin(this.wobble) * 0.4);
        ctx.beginPath();
        // Top wings
        ctx.ellipse(-this.size*0.6, -this.size*0.6, this.size*0.9, this.size*0.5, Math.PI/4, 0, Math.PI*2);
        ctx.ellipse(this.size*0.6, -this.size*0.6, this.size*0.9, this.size*0.5, -Math.PI/4, 0, Math.PI*2);
        // Bottom wings
        ctx.ellipse(-this.size*0.5, this.size*0.2, this.size*0.7, this.size*0.4, Math.PI/6, 0, Math.PI*2);
        ctx.ellipse(this.size*0.5, this.size*0.2, this.size*0.7, this.size*0.4, -Math.PI/6, 0, Math.PI*2);
        // Body
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size*0.2, this.size*0.7, 0, 0, Math.PI*2);
        ctx.fill();
    }
    else if (this.type === 'jelly') {
        // Jellyfish / Lantern
        const s = this.size;
        // Dome
        ctx.beginPath();
        ctx.arc(0, -s*0.2, s*0.7, Math.PI, 0);
        ctx.lineTo(s*0.7, s*0.3);
        
        // Tentacles
        for(let i=0; i<4; i++) {
            let tx = (i-1.5) * s * 0.35;
            ctx.quadraticCurveTo(tx + Math.sin(this.wobble)*8, s*0.6, tx, s);
        }
        ctx.stroke();
        ctx.fill();
        
        // Glow center
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, -s*0.2, s*0.25, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Draw The Net (Cursor) - Enhanced
function drawNet() {
  const size = 45;
  
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // Outer Ring (Aether field)
  ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)'; // Orange glow
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(251, 191, 36, 0.6)';
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, size - 10, 0, Math.PI * 2);
  ctx.stroke();

  // Web/Mesh lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1;
  
  // Concentric rings
  for(let i = 1; i <= 2; i++) {
      let r = (size - 10) * (i/3);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
  }
  
  // Cross hairs
  ctx.beginPath();
  ctx.moveTo(0, -(size-10)); ctx.lineTo(0, size-10);
  ctx.moveTo(-(size-10), 0); ctx.lineTo(size-10, 0);
  ctx.stroke();

  // Center Dot
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// Draw Background
function drawBackground() {
    // Clear
    ctx.fillStyle = '#050b14';
    ctx.fillRect(0, 0, width, height);

    // Deep atmospheric gradient (Volumetric feel)
    const grad = ctx.createRadialGradient(width/2, height, 0, width/2, height, height);
    grad.addColorStop(0, '#1e293b'); // Horizon glow
    grad.addColorStop(0.6, '#0f172a');
    grad.addColorStop(1, '#02040a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Draw Environment Layers
    stars.forEach(s => s.draw(ctx));
    clouds.forEach(c => { c.update(); c.draw(ctx); });
    islands.forEach(i => { i.update(); i.draw(ctx); });
}

// Init
function init() {
  resize();
  for (let i = 0; i < 10; i++) {
    creatures.push(new Creature());
  }
}

// Animation Loop
function animate() {
  time += 0.01;
  drawBackground();
  
  // Draw Creatures (Sort by Y for pseudo-depth)
  creatures.sort((a, b) => a.y - b.y);
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = 'translateX(-50%) scale(1)', 150);
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = "00";
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

init();
animate();

</script>
