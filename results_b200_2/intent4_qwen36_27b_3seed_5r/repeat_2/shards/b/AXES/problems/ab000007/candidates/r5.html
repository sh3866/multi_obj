<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher: Region 04</title>
<style>
  :root {
    /* Palette: Bioluminescent Flora & Fauna */
    --bg-deep: #020617;
    --bg-mid: #0f172a;
    
    --primary: #22d3ee; /* Cyan - Net/Player */
    --primary-glow: rgba(34, 211, 238, 0.4);
    
    --accent: #f472b6; /* Pink - Rare Creatures */
    --secondary: #a78bfa; /* Violet - Common Creatures */
    --tertiary: #34d399; /* Emerald - Flora */
    
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    
    /* UI System */
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.2);
    
    /* Typography */
    /* Using system fonts but styling them to feel "Rounded" and "Soft" */
    --font-ui: 'SF Pro Rounded', 'Nunito', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    cursor: none; /* Custom cursor */
  }

  /* --- Layout --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* HUD Layer */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 100;
    pointer-events: none;
  }

  /* Title Styling - Softer, More Whimsical */
  .title-group {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .title-group h1 {
    font-family: var(--font-ui);
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.02em; /* Tighter, friendlier */
    line-height: 1;
    color: #fff;
    border-radius: 12px; /* Soft container feel */
    padding: 0.2rem 0.8rem;
    background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .title-group p {
    font-size: 0.85rem;
    color: var(--primary);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.9;
    margin-left: 0.4rem;
    text-shadow: 0 0 10px var(--primary-glow);
  }

  /* HUD Stats */
  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    /* Inner shadow for depth */
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 20px rgba(0,0,0,0.3);
    padding: 0.6rem 1.2rem;
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    transition: transform 0.2s ease;
  }

  .stat-pill:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.2);
  }

  .stat-icon {
    width: 28px;
    height: 28px;
    fill: var(--text-main);
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
  }

  .stat-data {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: var(--font-ui);
    font-size: 1.25rem;
    font-weight: 800;
    line-height: 1;
    color: #fff;
    letter-spacing: -0.03em;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.2rem;
    font-weight: 600;
  }

  /* Canvas */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Player Anchor */
  .player-anchor {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    width: 200px;
    height: 200px;
    /* Anchor visually to bottom */
    filter: drop-shadow(0 0 25px rgba(34, 211, 238, 0.2));
  }

  /* Action Bar - Bottom Right to clear player */
  .action-bar {
    position: absolute;
    bottom: 2rem;
    right: 2rem;
    z-index: 20;
    pointer-events: auto;
    display: flex;
    gap: 1rem;
  }

  .btn-collect {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 0.8rem 2rem;
    font-size: 0.9rem;
    font-family: var(--font-ui);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.8rem;
    /* Stronger depth */
    box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }

  .btn-collect::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: 0.6s;
  }

  .btn-collect:hover {
    border-color: var(--primary);
    box-shadow: 0 0 25px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.3);
    transform: translateY(-2px);
    color: #fff;
  }
  
  .btn-collect:hover::before {
    transform: translateX(100%);
  }

  .btn-collect svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(2, 6, 23, 0.85);
    border: 1px solid var(--primary);
    padding: 1rem 2.5rem;
    border-radius: 24px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 200;
    text-align: center;
    box-shadow: 0 10px 50px rgba(34, 211, 238, 0.2);
    backdrop-filter: blur(12px);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--primary); 
    font-family: var(--font-ui);
    font-size: 0.75rem;
    margin-bottom: 0.2rem; 
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .toast p { font-size: 1.5rem; color: #fff; font-weight: 800; letter-spacing: -0.02em; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <p>Region 04: The Floating Isles</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <!-- Collection Icon -->
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L1 21h22L12 2zm0 3.5L19.5 19h-15L12 5.5z"/>
          <path d="M12 10a2 2 0 100 4 2 2 0 000-4z" fill="#fff"/>
        </svg>
        <div class="stat-data">
          <!-- Updated Count: Non-zero, fractional -->
          <div class="stat-value" id="score">12/45</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <!-- Map Icon -->
        <svg class="stat-icon" style="fill:var(--primary)" viewBox="0 0 24 24">
          <path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/>
        </svg>
        <div class="stat-data">
          <div class="stat-value">74%</div>
          <div class="stat-label">Biome Map</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Player Avatar Anchor - Centered, Visible -->
  <div class="player-anchor">
    <!-- Redesigned SVG Player: Friendly Explorer Silhouette -->
    <svg class="player-svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <!-- Body (Rounded, Friendly) -->
      <path d="M100 60 C 60 60, 40 100, 40 150 C 40 180, 160 180, 160 150 C 160 100, 140 60, 100 60" fill="url(#suitGrad)" stroke="#fff" stroke-width="2"/>
      
      <!-- Backpack (Tech) -->
      <rect x="65" y="80" width="30" height="40" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="80" cy="100" r="5" fill="#22d3ee" filter="url(#glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      
      <!-- Head/Helmet -->
      <circle cx="100" cy="50" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Visor (Reflective Cyan) -->
      <path d="M82 45 Q 100 60 118 45 Q 100 55 82 45" fill="#22d3ee" opacity="0.9"/>
      
      <!-- Net (Attached to hand, smoother lines) -->
      <g transform="translate(130, 100) rotate(15)">
        <!-- Handle -->
        <line x1="0" y1="0" x2="40" y2="-40" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
        <!-- Net Loop -->
        <path d="M40 -40 C 60 -40, 70 -20, 50 -10 C 30 0, 20 -20, 40 -40" fill="none" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
        <!-- Webbing -->
        <path d="M40 -40 Q 50 -25 50 -10 M40 -40 Q 30 -25 30 -10" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      </g>
    </svg>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Luma Jelly</p>
  </div>

  <!-- Action Bar - Bottom Right (Fixed Layout Issue) -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      Collection
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Redesign
 * Focus: Distinct Creatures, Cohesive Lighting, Clear Hierarchy.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 12; // Start with 12 to match HUD
let total = 45;
let mouse = { x: 0, y: 0 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let islands = [];
let clouds = [];
let stars = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initEnvironment();
}
window.addEventListener('resize', resize);

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Environment Classes ---

class Star {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5;
        this.blinkSpeed = Math.random() * 0.02 + 0.01;
        this.alpha = Math.random();
    }
    
    draw(ctx) {
        this.alpha += this.blinkSpeed;
        if(this.alpha > 1 || this.alpha < 0.2) this.blinkSpeed *= -1;
        
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha) * 0.6})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

class Island {
  constructor(layer) {
    this.layer = layer; // 0 = far, 1 = mid, 2 = near
    this.x = Math.random() * width;
    this.y = Math.random() * height * 0.9;
    this.size = (layer + 1) * 100 + Math.random() * 60;
    this.speed = (layer + 1) * 0.05;
    this.shape = [];
    
    // Generate smoother, flatter shapes
    const points = 5 + Math.floor(Math.random() * 3);
    for(let i=0; i<points; i++) {
      const angle = (Math.PI * 2 / points) * i;
      const r = this.size * (0.6 + Math.random() * 0.4); 
      this.shape.push({
        x: Math.cos(angle) * r,
        y: Math.sin(angle) * r * 0.5 // Flatter bottom
      });
    }
  }

  update() {
    this.x -= this.speed;
    if (this.x < -this.size * 2) {
      this.x = width + this.size * 2;
      this.y = Math.random() * height * 0.9;
    }
  }

  draw(ctx) {
    const isFar = this.layer === 0;
    const opacity = isFar ? 0.2 : (this.layer === 1 ? 0.4 : 0.85);
    
    // Gradient for depth
    const grad = ctx.createLinearGradient(this.x - this.size, this.y, this.x + this.size, this.y + 100);
    if (isFar) {
        grad.addColorStop(0, `rgba(30, 41, 59, ${opacity})`);
        grad.addColorStop(1, `rgba(15, 23, 42, ${opacity})`);
    } else {
        // Near islands have distinct rim lighting
        grad.addColorStop(0, `rgba(30, 41, 59, 0.95)`);
        grad.addColorStop(1, `rgba(15, 23, 42, 0.95)`);
    }

    ctx.fillStyle = grad;
    ctx.strokeStyle = isFar ? 'transparent' : `rgba(56, 189, 246, ${opacity * 0.5})`;
    ctx.lineWidth = isFar ? 0 : 1.5;
    
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Rim glow for near islands
    if (!isFar) {
        ctx.shadowBlur = 50;
        ctx.shadowColor = 'rgba(34, 211, 238, 0.15)';
    }

    ctx.beginPath();
    ctx.moveTo(this.shape[0].x, this.shape[0].y);
    for(let i=0; i<this.shape.length; i++) {
        let p0 = this.shape[i];
        let p1 = this.shape[(i+1)%this.shape.length];
        let midX = (p0.x + p1.x) / 2;
        let midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Add crystalline structures on near islands
    if(this.layer === 2) {
        ctx.fillStyle = `rgba(255, 255, 255, 0.15)`;
        ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`;
        ctx.lineWidth = 1;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `rgba(255, 255, 255, 0.5)`;
        
        // Draw crystals
        for(let k=0; k<3; k++) {
            ctx.beginPath();
            let cx = (Math.random() - 0.5) * this.size;
            let cy = -this.size * 0.2;
            ctx.moveTo(cx - 5, cy);
            ctx.lineTo(cx, cy - 20 - Math.random()*25);
            ctx.lineTo(cx + 5, cy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }
    
    ctx.restore();
  }
}

class Cloud {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 400 + 100;
    this.speed = Math.random() * 0.3 + 0.05;
    this.opacity = Math.random() * 0.03 + 0.01;
  }
  
  update() {
    this.x += this.speed;
    if(this.x > width + this.size * 2) this.x = -this.size * 2;
  }
  
  draw(ctx) {
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `rgba(148, 163, 184, ${this.opacity})`); // Slate cloud
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initEnvironment() {
  islands = [];
  clouds = [];
  stars = [];
  // Background layers
  for(let i=0; i<5; i++) islands.push(new Island(0));
  for(let i=0; i<4; i++) islands.push(new Island(1));
  for(let i=0; i<3; i++) islands.push(new Island(2));
  for(let i=0; i<8; i++) clouds.push(new Cloud());
  for(let i=0; i<150; i++) stars.push(new Star());
}

// --- Game Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 4 + 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= 0.025;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -2;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.025;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
    // Distinct creature types
    const types = ['shard', 'orb', 'moth', 'jelly'];
    this.type = types[Math.floor(Math.random() * types.length)];
    this.color = this.getColor(this.type);
    this.offset = Math.random() * 100;
  }

  init() {
    this.x = Math.random() * (width - 100) + 50;
    this.y = Math.random() * (height - 300) + 50; // Keep away from bottom player
    this.size = 25 + Math.random() * 20;
    this.speedX = (Math.random() - 0.5) * 1.2;
    this.speedY = (Math.random() - 0.5) * 0.8;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.caught = false;
  }

  getColor(type) {
    switch(type) {
      case 'shard': return '#22d3ee'; // Cyan
      case 'orb': return '#a78bfa'; // Violet
      case 'moth': return '#f472b6'; // Pink
      case 'jelly': return '#34d399'; // Emerald
      default: return '#fbbf24';
    }
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.wobble += 0.05;
    this.angle += 0.01;

    // Bounce logic
    if (this.x < 50 || this.x > width - 50) this.speedX *= -1;
    if (this.y < 50 || this.y > height - 250) this.speedY *= -1;

    // Catch Logic
    if (!this.caught) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < this.size + 35) { // Net radius
        this.catch();
      }
    } else {
      // Sucked into net logic (spiral)
      this.x += (mouse.x - this.x) * 0.15;
      this.y += (mouse.y - this.y) * 0.15;
      this.size *= 0.90; 
      if(this.size < 1) {
          this.caught = false; 
          this.init(); // Respawn elsewhere
      }
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = `${score}/${total}`;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "CAPTURED"));
    
    const names = {
      'shard': 'Cryo Shard',
      'orb': 'Void Orb',
      'moth': 'Aether Moth',
      'jelly': 'Luma Jelly'
    };
    catchNameEl.innerText = names[this.type];
    toast.classList.add('active');
    setTimeout(() => toast.classList.remove('active'), 2000);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Dynamic glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    
    if (this.caught) {
        ctx.rotate(time * 5);
    }

    // --- Distinct Creature Rendering ---

    if (this.type === 'shard') {
        // Crystalline structure with facets
        ctx.beginPath();
        const s = this.size;
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.3, -s*0.2);
        ctx.lineTo(s * 0.6, s * 0.5);
        ctx.lineTo(0, s);
        ctx.lineTo(-s * 0.6, s * 0.5);
        ctx.lineTo(-s * 0.3, -s*0.2);
        ctx.closePath();
        ctx.fill();
        
        // Inner facets (lighter)
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.3, -s*0.2);
        ctx.lineTo(0, 0);
        ctx.lineTo(-s * 0.3, -s*0.2);
        ctx.fill();
    } 
    else if (this.type === 'orb') {
        // Pulsating energy sphere
        const pulse = Math.sin(this.wobble * 2) * 4;
        ctx.beginPath();
        ctx.arc(0, 0, this.size + pulse, 0, Math.PI * 2);
        ctx.fill();
        
        // Core eye
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        // Orbiting rings
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 1.6, this.size * 0.5, this.wobble, 0, Math.PI*2);
        ctx.stroke();
    }
    else if (this.type === 'moth') {
        // Organic winged shape
        ctx.rotate(Math.sin(this.wobble) * 0.5);
        ctx.beginPath();
        // Top wings (wider)
        ctx.ellipse(-this.size*0.7, -this.size*0.7, this.size*0.9, this.size*0.6, Math.PI/4, 0, Math.PI*2);
        ctx.ellipse(this.size*0.7, -this.size*0.7, this.size*0.9, this.size*0.6, -Math.PI/4, 0, Math.PI*2);
        // Bottom wings
        ctx.ellipse(-this.size*0.5, this.size*0.3, this.size*0.7, this.size*0.5, Math.PI/6, 0, Math.PI*2);
        ctx.ellipse(this.size*0.5, this.size*0.3, this.size*0.7, this.size*0.5, -Math.PI/6, 0, Math.PI*2);
        ctx.fill();
        
        // Body
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size*0.2, this.size*0.8, 0, 0, Math.PI*2);
        ctx.fill();
    }
    else if (this.type === 'jelly') {
        // Jellyfish / Lantern
        const s = this.size;
        // Dome
        ctx.beginPath();
        ctx.arc(0, -s*0.2, s*0.8, Math.PI, 0);
        ctx.lineTo(s*0.8, s*0.4);
        
        // Tentacles (wavy)
        ctx.beginPath();
        for(let i=0; i<4; i++) {
            let tx = (i-1.5) * s * 0.4;
            ctx.moveTo(tx, s*0.4);
            ctx.quadraticCurveTo(tx + Math.sin(this.wobble)*10, s*0.8, tx, s*1.2);
        }
        ctx.stroke();
        ctx.fill();
        
        // Glow center
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, -s*0.2, s*0.3, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Draw The Net (Cursor) - Enhanced Anti-aliased Mesh
function drawNet() {
  const size = 50;
  
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // Outer Ring (Aether field)
  ctx.strokeStyle = 'rgba(34, 211, 238, 0.6)'; // Cyan glow
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(34, 211, 238, 0.8)';
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, size - 12, 0, Math.PI * 2);
  ctx.stroke();

  // Web/Mesh lines (Consistent stroke weight)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1;
  
  // Concentric rings
  for(let i = 1; i <= 2; i++) {
      let r = (size - 12) * (i/3);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
  }
  
  // Cross hairs
  ctx.beginPath();
  ctx.moveTo(0, -(size-12)); ctx.lineTo(0, size-12);
  ctx.moveTo(-(size-12), 0); ctx.lineTo(size-12, 0);
  ctx.stroke();

  // Center Dot
  ctx.fillStyle = '#22d3ee';
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// Draw Background
function drawBackground() {
    // Clear
    ctx.fillStyle = '#050b14';
    ctx.fillRect(0, 0, width, height);

    // Deep atmospheric gradient (Volumetric feel)
    const grad = ctx.createRadialGradient(width/2, height, 0, width/2, height, height);
    grad.addColorStop(0, '#1e293b'); // Horizon glow
    grad.addColorStop(0.6, '#0f172a');
    grad.addColorStop(1, '#02040a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Draw Environment Layers
    stars.forEach(s => s.draw(ctx));
    clouds.forEach(c => { c.update(); c.draw(ctx); });
    islands.forEach(i => { i.update(); i.draw(ctx); });
}

// Init
function init() {
  resize();
  for (let i = 0; i < 8; i++) {
    creatures.push(new Creature());
  }
}

// Animation Loop
function animate() {
  time += 0.01;
  drawBackground();
  
  // Draw Creatures (Sort by Y for pseudo-depth)
  creatures.sort((a, b) => a.y - b.y);
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    // Visual feedback only for this demo
    createExplosion(mouse.x, mouse.y, '#fff');
});

init();
animate();

</script>
