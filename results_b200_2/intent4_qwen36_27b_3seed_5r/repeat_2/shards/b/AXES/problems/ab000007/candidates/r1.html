<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    --bg-deep: #050814;
    --bg-surface: #1e293b;
    --primary: #f59e0b;
    --primary-glow: rgba(245, 158, 11, 0.5);
    --accent: #38bdf8;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-tech: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Hide default cursor as we draw a custom net */
    cursor: none; 
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HUD */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 1.5rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 20;
    pointer-events: none;
  }

  .title-group {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .title-group h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    background: linear-gradient(to right, #fff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
    line-height: 1;
  }

  .title-group p {
    font-family: var(--font-tech);
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.9;
  }

  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 0.6rem 1.2rem;
    border-radius: 8px; /* More geometric */
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }

  .stat-pill:hover {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
  }

  .stat-icon {
    width: 20px;
    height: 20px;
    fill: var(--primary);
  }

  .stat-data {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .stat-value {
    font-family: var(--font-tech);
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
    color: #fff;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Bottom Action Bar */
  .action-bar {
    position: absolute;
    bottom: 2rem;
    right: 2.5rem; /* Move to corner */
    z-index: 20;
    pointer-events: none;
  }

  .btn-collect {
    pointer-events: auto;
    background: rgba(15, 23, 42, 0.4);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: var(--primary);
    padding: 0.8rem 1.5rem;
    font-size: 0.85rem;
    font-family: var(--font-tech);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 6px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-collect:hover {
    background: rgba(245, 158, 11, 0.1);
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    color: #fff;
  }

  .btn-collect:active {
    transform: scale(0.98);
  }

  /* Player Avatar Container */
  .player-anchor {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .player-avatar {
    width: 60px;
    height: 60px;
    /* Simple geometric player representation */
    background: radial-gradient(circle at 50% 30%, #fff, #94a3b8);
    border-radius: 50% 50% 40% 40%;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    position: relative;
  }

  .player-avatar::after {
    content: '';
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    background: rgba(0,0,0,0.2);
    border-radius: 2px;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--accent);
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--accent); 
    font-family: var(--font-tech);
    font-size: 0.9rem;
    margin-bottom: 0.1rem; 
    letter-spacing: 0.1em;
  }
  .toast p { font-size: 1.1rem; color: #fff; font-weight: 600; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether Catcher</h1>
      <p>Region 04: Floating Isles</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
        </svg>
        <div class="stat-data">
          <div class="stat-value" id="score">00</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:var(--accent)" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <div class="stat-data">
          <div class="stat-value">74%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Player Avatar Anchor -->
  <div class="player-anchor">
    <div class="player-avatar"></div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Mist Sprite</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">Open Collection</button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Revised Visual Script
 * Implements distinct creature silhouettes, environmental depth, 
 * and the player/net mechanic.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: 0, y: 0 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let islands = [];
let clouds = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initEnvironment();
}
window.addEventListener('resize', resize);

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Environment Classes ---

class Island {
  constructor(layer) {
    this.layer = layer; // 0 = far, 1 = mid, 2 = near
    this.x = Math.random() * width;
    this.y = Math.random() * height * 0.8;
    this.size = (layer + 1) * 60 + Math.random() * 40;
    this.speed = (layer + 1) * 0.05;
    this.shape = [];
    
    // Generate jagged rock shape
    const points = 7 + Math.floor(Math.random() * 5);
    for(let i=0; i<points; i++) {
      const angle = (Math.PI * 2 / points) * i;
      const r = this.size * (0.8 + Math.random() * 0.4);
      this.shape.push({
        x: Math.cos(angle) * r,
        y: Math.sin(angle) * r
      });
    }
  }

  update() {
    this.x -= this.speed;
    // Parallax wrapping
    if (this.x < -this.size * 2) {
      this.x = width + this.size * 2;
      this.y = Math.random() * height * 0.8;
    }
  }

  draw(ctx) {
    const opacity = 0.1 + (this.layer * 0.15);
    ctx.fillStyle = `rgba(15, 23, 42, ${opacity})`;
    ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.5})`;
    ctx.lineWidth = 1;
    
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.beginPath();
    ctx.moveTo(this.shape[0].x, this.shape[0].y);
    for(let i=1; i<this.shape.length; i++) {
      ctx.lineTo(this.shape[i].x, this.shape[i].y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Add some "crystal" details on near islands
    if(this.layer === 2) {
        ctx.fillStyle = `rgba(245, 158, 11, ${opacity})`;
        ctx.beginPath();
        ctx.moveTo(-10, -this.size/2);
        ctx.lineTo(0, -this.size);
        ctx.lineTo(10, -this.size/2);
        ctx.fill();
    }
    
    ctx.restore();
  }
}

class Cloud {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 100 + 50;
    this.speed = Math.random() * 0.2 + 0.1;
    this.opacity = Math.random() * 0.05 + 0.02;
  }
  
  update() {
    this.x += this.speed;
    if(this.x > width + this.size) this.x = -this.size;
  }
  
  draw(ctx) {
    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.arc(this.x + this.size*0.5, this.y - this.size*0.2, this.size*0.8, 0, Math.PI * 2);
    ctx.arc(this.x - this.size*0.5, this.y - this.size*0.2, this.size*0.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initEnvironment() {
  islands = [];
  clouds = [];
  // Background layers
  for(let i=0; i<5; i++) islands.push(new Island(0));
  for(let i=0; i<3; i++) islands.push(new Island(1));
  // Foreground elements
  for(let i=0; i<2; i++) islands.push(new Island(2));
  for(let i=0; i<8; i++) clouds.push(new Cloud());
}

// --- Game Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 4 + 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.025;
    this.size *= 0.92;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1.5;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.02;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
    // Assign a specific "species" type
    const types = ['shard', 'orb', 'moth', 'crystal'];
    this.type = types[Math.floor(Math.random() * types.length)];
    this.color = this.getColor(this.type);
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = 15 + Math.random() * 15;
    this.speedX = (Math.random() - 0.5) * 1.5;
    this.speedY = (Math.random() - 0.5) * 1.5;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.caught = false;
  }

  getColor(type) {
    switch(type) {
      case 'shard': return '#38bdf8'; // Cyan
      case 'orb': return '#a78bfa'; // Purple
      case 'moth': return '#f472b6'; // Pink
      case 'crystal': return '#34d399'; // Green
      default: return '#f59e0b';
    }
  }

  update() {
    // Movement
    this.x += this.speedX;
    this.y += this.speedY;
    this.wobble += 0.05;
    this.angle += 0.02;

    // Bounce off walls
    if (this.x < 0 || this.x > width) this.speedX *= -1;
    if (this.y < 0 || this.y > height) this.speedY *= -1;

    // Catch Logic
    if (!this.caught) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < this.size + 30) { // 30 is approx net radius
        this.catch();
      }
    } else {
      // Move towards mouse (net)
      this.x += (mouse.x - this.x) * 0.15;
      this.y += (mouse.y - this.y) * 0.15;
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score < 10 ? '0'+score : score;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    if (Math.random() > 0.7) {
      const names = {
        'shard': 'Sky Shard',
        'orb': 'Void Orb',
        'moth': 'Neon Moth',
        'crystal': 'Geo Crystal'
      };
      catchNameEl.innerText = names[this.type];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2000);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Glow effect
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;

    if (this.caught) {
        ctx.scale(0.8, 0.8);
        ctx.rotate(time * 0.5); // Spin when caught
    }

    // Draw distinct silhouettes
    if (this.type === 'shard') {
        // Triangle / Crystal shard
        ctx.beginPath();
        const s = this.size;
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.7, s * 0.8);
        ctx.lineTo(-s * 0.7, s * 0.8);
        ctx.closePath();
        ctx.fill();
        // Inner facet
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(0, s*0.8);
        ctx.lineTo(s*0.7, s*0.8);
        ctx.fill();
    } 
    else if (this.type === 'orb') {
        // Pulsating Circle
        const pulse = Math.sin(this.wobble * 2) * 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.size + pulse, 0, Math.PI * 2);
        ctx.fill();
        // Core
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
    else if (this.type === 'moth') {
        // Winged shape
        ctx.rotate(Math.sin(this.wobble) * 0.2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(this.size, -this.size, 0, -this.size * 0.5);
        ctx.quadraticCurveTo(this.size, 0, 0, 0);
        // Right wing
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-this.size, -this.size, 0, -this.size * 0.5);
        ctx.quadraticCurveTo(-this.size, 0, 0, 0);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -this.size*0.5, 2, 0, Math.PI*2);
        ctx.fill();
    }
    else if (this.type === 'crystal') {
        // Hexagon
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i;
            const x = Math.cos(angle) * this.size;
            const y = Math.sin(angle) * this.size;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.globalAlpha = 0.5;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Draw The Net (Cursor)
function drawNet() {
  const size = 40;
  const isHovering = false; // Could add logic to detect hovering over creatures
  
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // Outer Ring (Aether field)
  ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)'; // Orange glow
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(245, 158, 11, 0.8)';
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Ring
  ctx.strokeStyle = '#fff';
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, size - 5, 0, Math.PI * 2);
  ctx.stroke();

  // Grid lines (The Net)
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1;
  
  // Draw a web pattern
  for(let i = 1; i <= 3; i++) {
      let r = (size - 5) * (i/4);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
  }
  // Cross lines
  for(let i=0; i<4; i++) {
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(0, size-5);
      ctx.stroke();
      ctx.rotate(Math.PI/4);
  }

  // Center Dot
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// Draw Background
function drawBackground() {
    // Clear
    ctx.fillStyle = '#050814';
    ctx.fillRect(0, 0, width, height);

    // Subtle Gradient (Aether atmosphere)
    const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
    grad.addColorStop(0, '#1e293b');
    grad.addColorStop(1, '#050814');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Draw Environment Layers
    clouds.forEach(c => { c.update(); c.draw(ctx); });
    islands.forEach(i => { i.update(); i.draw(ctx); });
}

// Init
function init() {
  resize();
  for (let i = 0; i < 10; i++) {
    creatures.push(new Creature());
  }
}

// Animation Loop
function animate() {
  time += 0.01;
  drawBackground();
  
  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = "00";
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

init();
animate();

</script>
</body>
</html>
