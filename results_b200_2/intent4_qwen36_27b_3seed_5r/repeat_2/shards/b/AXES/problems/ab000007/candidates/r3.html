<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catcher</title>
<style>
  :root {
    --bg-deep: #050b14;
    --bg-gradient: linear-gradient(to bottom, #02040a 0%, #0f172a 60%, #1e293b 100%);
    --primary: #38bdf8;
    --primary-glow: rgba(56, 189, 248, 0.5);
    --accent: #fbbf24;
    --accent-glow: rgba(251, 191, 36, 0.5);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.15);
    --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    cursor: none; /* Hidden for custom cursor */
  }

  /* --- Layout & UI --- */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HUD - Top Center/Right aligned per critique */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 20;
    pointer-events: none;
  }

  .title-group {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    /* Reduced scale to stop competing with gameplay */
    transform: scale(0.9);
    transform-origin: top left;
  }

  .title-group h1 {
    font-family: var(--font-display);
    font-size: 2.5rem; /* Reduced from 3.5rem */
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); /* Outer glow for pop */
  }

  .title-group p {
    font-family: var(--font-ui);
    font-size: 0.8rem;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.4em; /* Increased tracking for sci-fi feel */
    text-transform: uppercase;
    opacity: 0.9;
    margin-left: 2px;
  }

  .hud-stats {
    display: flex;
    gap: 1rem;
    pointer-events: auto;
  }

  .stat-pill {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.6rem 1.2rem;
    border-radius: 16px; /* Unified soft geometry */
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); /* Material depth */
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .stat-pill:hover {
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }

  .stat-icon {
    width: 20px;
    height: 20px;
    fill: var(--accent);
    filter: drop-shadow(0 0 6px var(--accent-glow));
  }

  .stat-data {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 2px;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Bottom Action Bar - Moved to Bottom Right */
  .action-bar {
    position: absolute;
    bottom: 2.5rem;
    right: 2.5rem; /* Moved from Left to Right */
    z-index: 20;
    pointer-events: none;
  }

  .btn-collect {
    pointer-events: auto;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.9));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: var(--accent);
    padding: 1rem 2rem;
    font-size: 0.9rem;
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 16px; /* Unified Soft Geometry */
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .btn-collect:hover {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(30, 41, 59, 0.9));
    border-color: var(--accent);
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
    color: #fff;
    transform: translateY(-2px);
  }

  .btn-collect svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* Player Avatar Container - Anchored Bottom Center */
  .player-anchor {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 140px;
    height: 120px;
  }

  /* SVG Player Character - Redesigned with Net */
  .player-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.3));
    overflow: visible;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid var(--primary);
    padding: 0.8rem 2rem;
    border-radius: 16px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    min-width: 200px;
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast h3 { 
    color: var(--primary); 
    font-family: var(--font-display);
    font-size: 0.7rem;
    margin-bottom: 0.2rem; 
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .toast p { font-size: 1.2rem; color: #fff; font-weight: 700; letter-spacing: -0.02em; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- HUD -->
  <header>
    <div class="title-group">
      <h1>Aether<br>Catcher</h1>
      <p>Region 04</p>
    </div>
    
    <div class="hud-stats">
      <div class="stat-pill">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
        </svg>
        <div class="stat-data">
          <div class="stat-value" id="score">00</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
      
      <div class="stat-pill">
        <svg class="stat-icon" style="fill:var(--primary)" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <div class="stat-data">
          <div class="stat-value">74%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Game Field -->
  <canvas id="gameCanvas"></canvas>

  <!-- Player Avatar Anchor -->
  <div class="player-anchor">
    <!-- Vector Player Character with Net -->
    <svg class="player-svg" viewBox="0 0 100 120" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
        </linearGradient>
      </defs>
      
      <!-- Net Handle -->
      <line x1="75" y1="60" x2="90" y2="30" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Net Loop -->
      <path d="M90 30 Q 110 20 100 -10 Q 90 0 85 30" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2,2"/>
      
      <!-- Backpack -->
      <rect x="30" y="45" width="30" height="35" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      
      <!-- Body -->
      <path d="M50 35 C 25 35, 15 65, 15 95 L 85 95 C 85 65, 75 35, 50 35" fill="url(#suitGrad)" stroke="#fff" stroke-width="2.5"/>
      
      <!-- Head -->
      <circle cx="50" cy="28" r="14" fill="#f8fafc" />
      
      <!-- Visor -->
      <path d="M36 28 Q 50 38 64 28" fill="#020617" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Glowing Backpack Core -->
      <circle cx="45" cy="62" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
    </svg>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <h3>Captured!</h3>
    <p id="catchName">Mist Sprite</p>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <button class="btn-collect" id="collectBtn">
      <svg viewBox="0 0 24 24">
        <!-- Stylized Net Icon -->
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
      Collection
    </button>
  </div>

</div>

<script>
/**
 * Aether Catcher - Visual Redesign
 * Implements:
 * 1. "Soft Sci-Fi" UI Geometry (16px border radius)
 * 2. Volumetric background (Nebula/Starfield)
 * 3. Distinct biological creature silhouettes with unified glow
 * 4. Player with visible Net tool
 * 5. Cohesive lighting model
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const toast = document.getElementById('toast');
const catchNameEl = document.getElementById('catchName');

// State
let width, height;
let score = 0;
let mouse = { x: 0, y: 0 };
let particles = [];
let creatures = [];
let floatingTexts = [];
let islands = [];
let clouds = [];
let stars = [];
let time = 0;

// Resize Handler
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initEnvironment();
}
window.addEventListener('resize', resize);

// Mouse Tracking
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// --- Environment Classes ---

class Star {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5;
        this.blinkSpeed = Math.random() * 0.05;
        this.alpha = Math.random();
    }
    
    draw(ctx) {
        this.alpha += this.blinkSpeed;
        if(this.alpha > 1 || this.alpha < 0) this.blinkSpeed *= -1;
        
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha) * 0.6})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

class Island {
  constructor(layer) {
    this.layer = layer; // 0 = far, 1 = mid, 2 = near
    this.x = Math.random() * width;
    this.y = Math.random() * height * 0.8;
    this.size = (layer + 1) * 60 + Math.random() * 40;
    this.speed = (layer + 1) * 0.05;
    this.shape = [];
    
    // Generate organic rock shape (Smooth curves for "Soft Sci-Fi")
    const points = 8 + Math.floor(Math.random() * 4);
    for(let i=0; i<points; i++) {
      const angle = (Math.PI * 2 / points) * i;
      const r = this.size * (0.8 + Math.random() * 0.4); // Less jagged
      this.shape.push({
        x: Math.cos(angle) * r,
        y: Math.sin(angle) * r
      });
    }
  }

  update() {
    this.x -= this.speed;
    // Parallax wrapping
    if (this.x < -this.size * 3) {
      this.x = width + this.size * 3;
      this.y = Math.random() * height * 0.8;
    }
  }

  draw(ctx) {
    const isFar = this.layer === 0;
    const opacity = isFar ? 0.2 : (this.layer === 1 ? 0.4 : 0.8);
    
    // Gradient for depth
    const grad = ctx.createLinearGradient(this.x - this.size, this.y, this.x + this.size, this.y);
    if (isFar) {
        grad.addColorStop(0, `rgba(15, 23, 42, ${opacity})`);
        grad.addColorStop(1, `rgba(30, 41, 59, ${opacity})`);
    } else {
        // Near islands have rim lighting
        grad.addColorStop(0, `rgba(15, 23, 42, 0.9)`);
        grad.addColorStop(1, `rgba(56, 189, 246, 0.1)`); // Blue tint on edge
    }

    ctx.fillStyle = grad;
    ctx.strokeStyle = isFar ? 'transparent' : `rgba(56, 189, 248, ${opacity * 0.5})`;
    ctx.lineWidth = isFar ? 0 : 2;
    
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Shadow/Glow for near islands
    if (!isFar) {
        ctx.shadowBlur = 30;
        ctx.shadowColor = 'rgba(59, 130, 246, 0.15)';
    }

    ctx.beginPath();
    // Use quadratic curves for smoother "Soft Sci-Fi" geometry
    ctx.moveTo(this.shape[0].x, this.shape[0].y);
    for(let i=0; i<this.shape.length; i++) {
        let p0 = this.shape[i];
        let p1 = this.shape[(i+1)%this.shape.length];
        let midX = (p0.x + p1.x) / 2;
        let midY = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Add vegetation/crystals on near islands
    if(this.layer === 2) {
        ctx.fillStyle = `rgba(245, 158, 11, 0.4)`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `rgba(245, 158, 11, 0.6)`;
        // Draw a few crystals
        for(let k=0; k<3; k++) {
            ctx.beginPath();
            let cx = (Math.random() - 0.5) * this.size;
            let cy = -this.size * 0.3;
            ctx.moveTo(cx - 5, cy);
            ctx.lineTo(cx, cy - 20 - Math.random()*15);
            ctx.lineTo(cx + 5, cy);
            ctx.fill();
        }
    }
    
    ctx.restore();
  }
}

class Cloud {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 200 + 100;
    this.speed = Math.random() * 0.15 + 0.05;
    this.opacity = Math.random() * 0.03 + 0.01;
  }
  
  update() {
    this.x += this.speed;
    if(this.x > width + this.size * 2) this.x = -this.size * 2;
  }
  
  draw(ctx) {
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `rgba(56, 189, 248, ${this.opacity})`); // Slight blue tint
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initEnvironment() {
  islands = [];
  clouds = [];
  stars = [];
  // Background layers
  for(let i=0; i<5; i++) islands.push(new Island(0));
  for(let i=0; i<4; i++) islands.push(new Island(1));
  // Foreground elements
  for(let i=0; i<3; i++) islands.push(new Island(2));
  for(let i=0; i<8; i++) clouds.push(new Cloud());
  for(let i=0; i<100; i++) stars.push(new Star());
}

// --- Game Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 4 + 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.03;
    this.size *= 0.90;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
  }
}

class FloatingText {
  constructor(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.life = 1.0;
    this.vy = -1;
  }

  update() {
    this.y += this.vy;
    this.life -= 0.015;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.shadowColor = 'rgba(251, 191, 36, 0.8)';
    ctx.shadowBlur = 10;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.init();
    const types = ['shard', 'orb', 'moth', 'jelly'];
    this.type = types[Math.floor(Math.random() * types.length)];
    this.color = this.getColor(this.type);
    this.offset = Math.random() * 100;
  }

  init() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = 25 + Math.random() * 15;
    this.speedX = (Math.random() - 0.5) * 1.2;
    this.speedY = (Math.random() - 0.5) * 1.2;
    this.angle = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * Math.PI * 2;
    this.caught = false;
  }

  getColor(type) {
    switch(type) {
      case 'shard': return '#38bdf8'; // Cyan
      case 'orb': return '#a78bfa'; // Purple
      case 'moth': return '#f472b6'; // Pink
      case 'jelly': return '#34d399'; // Emerald
      default: return '#fbbf24';
    }
  }

  update() {
    // Movement
    this.x += this.speedX;
    this.y += this.speedY;
    this.wobble += 0.05;
    this.angle += 0.01;

    // Bounce
    if (this.x < 0 || this.x > width) this.speedX *= -1;
    if (this.y < 0 || this.y > height) this.speedY *= -1;

    // Catch Logic
    if (!this.caught) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < this.size + 40) { // Net radius
        this.catch();
      }
    } else {
      // Sucked into net
      this.x += (mouse.x - this.x) * 0.2;
      this.y += (mouse.y - this.y) * 0.2;
      this.size *= 0.9; // Shrink
    }
  }

  catch() {
    this.caught = true;
    score++;
    scoreEl.innerText = score < 10 ? '0'+score : score;
    
    createExplosion(this.x, this.y, this.color);
    floatingTexts.push(new FloatingText(this.x, this.y, "+1"));
    
    if (Math.random() > 0.6) {
      const names = {
        'shard': 'Sky Shard',
        'orb': 'Void Orb',
        'moth': 'Neon Moth',
        'jelly': 'Aether Jelly'
      };
      catchNameEl.innerText = names[this.type];
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 2500);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Standardized Glow Effect
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    
    if (this.caught) {
        ctx.rotate(time * 2);
        ctx.scale(0.8, 0.8);
    }

    // Draw distinct silhouettes
    if (this.type === 'shard') {
        // Sharp crystal shape
        ctx.beginPath();
        const s = this.size;
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.4, 0);
        ctx.lineTo(0, s);
        ctx.lineTo(-s * 0.4, 0);
        ctx.closePath();
        ctx.fill();
        // Inner highlight
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(0, s);
        ctx.lineTo(s * 0.4, 0);
        ctx.fill();
    } 
    else if (this.type === 'orb') {
        // Pulsating energy sphere
        const pulse = Math.sin(this.wobble * 2) * 4;
        ctx.beginPath();
        ctx.arc(0, 0, this.size + pulse, 0, Math.PI * 2);
        ctx.fill();
        // Core eye
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }
    else if (this.type === 'moth') {
        // Organic winged shape
        ctx.rotate(Math.sin(this.wobble) * 0.3);
        ctx.beginPath();
        // Top wings
        ctx.ellipse(-this.size*0.5, -this.size*0.5, this.size*0.8, this.size*0.4, Math.PI/4, 0, Math.PI*2);
        ctx.ellipse(this.size*0.5, -this.size*0.5, this.size*0.8, this.size*0.4, -Math.PI/4, 0, Math.PI*2);
        // Body
        ctx.ellipse(0, 0, this.size*0.3, this.size*0.8, 0, 0, Math.PI*2);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(-3, -this.size*0.8, 2, 0, Math.PI*2);
        ctx.arc(3, -this.size*0.8, 2, 0, Math.PI*2);
        ctx.fill();
    }
    else if (this.type === 'jelly') {
        // Jellyfish / Lantern
        const s = this.size;
        // Dome
        ctx.beginPath();
        ctx.arc(0, -s*0.2, s*0.6, Math.PI, 0);
        ctx.lineTo(s*0.6, s*0.2);
        // Tentacles
        for(let i=0; i<3; i++) {
            let tx = (i-1) * s * 0.35;
            ctx.quadraticCurveTo(tx + Math.sin(this.wobble)*5, s*0.5, tx, s);
        }
        ctx.stroke();
        ctx.fill();
        // Glow center
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, -s*0.2, s*0.2, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Draw The Net (Cursor)
function drawNet() {
  const size = 45;
  
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  
  // Outer Ring (Aether field)
  ctx.strokeStyle = 'rgba(251, 191, 36, 0.6)'; // Orange glow
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(251, 191, 36, 0.8)';
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Ring
  ctx.strokeStyle = '#fff';
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, size - 8, 0, Math.PI * 2);
  ctx.stroke();

  // Web/Mesh lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 1;
  
  // Concentric rings
  for(let i = 1; i <= 2; i++) {
      let r = (size - 8) * (i/3);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
  }
  
  // Cross hairs
  ctx.beginPath();
  ctx.moveTo(0, -(size-8)); ctx.lineTo(0, size-8);
  ctx.moveTo(-(size-8), 0); ctx.lineTo(size-8, 0);
  ctx.stroke();

  // Center Dot
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// Draw Background
function drawBackground() {
    // Clear
    ctx.fillStyle = '#050b14';
    ctx.fillRect(0, 0, width, height);

    // Deep atmospheric gradient
    const grad = ctx.createRadialGradient(width/2, height/1.5, 0, width/2, height/1.5, width);
    grad.addColorStop(0, '#1e293b'); // Horizon glow
    grad.addColorStop(0.5, '#0f172a');
    grad.addColorStop(1, '#050b14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Draw Environment Layers
    stars.forEach(s => s.draw(ctx));
    clouds.forEach(c => { c.update(); c.draw(ctx); });
    islands.forEach(i => { i.update(); i.draw(ctx); });
}

// Init
function init() {
  resize();
  for (let i = 0; i < 12; i++) {
    creatures.push(new Creature());
  }
}

// Animation Loop
function animate() {
  time += 0.01;
  drawBackground();
  
  // Draw Creatures (Sort by Y for pseudo-depth)
  creatures.sort((a, b) => a.y - b.y);
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Draw Floating Text
  floatingTexts.forEach((t, index) => {
    t.update();
    t.draw(ctx);
    if (t.life <= 0) floatingTexts.splice(index, 1);
  });

  drawNet();

  requestAnimationFrame(animate);
}

// UI Interactions
document.getElementById('collectBtn').addEventListener('click', () => {
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 150);
    
    // Reset Logic
    score = 0;
    scoreEl.innerText = "00";
    creatures.forEach(c => {
        c.caught = false;
        c.init();
    });
    createExplosion(mouse.x, mouse.y, '#fff');
});

init();
animate();

</script>
