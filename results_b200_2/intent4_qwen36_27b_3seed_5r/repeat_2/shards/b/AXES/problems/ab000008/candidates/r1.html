<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            --bg-color: #080014;
            --grid-color: rgba(255, 0, 255, 0.3);
            --sun-top: #ffcc00;
            --sun-bot: #ff0055;
            --lane-1: #ff00ff; /* Magenta */
            --lane-2: #00f3ff; /* Cyan */
            --lane-3: #00ff66; /* Green */
            --lane-4: #ffe600; /* Yellow */
            --text-main: #ffffff;
            --glow-intensity: 0 0 10px, 0 0 20px, 0 0 40px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace; /* Fallback for pixel feel */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND & ATMOSPHERE --- */

        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }

        /* 2. The Retro Sun (Pixelated & Aggressive) */
        .sun-container {
            position: absolute;
            top: 15%; /* Moved up to leave room for title */
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 280px;
            height: 280px;
            background: linear-gradient(to bottom, var(--sun-top) 40%, var(--sun-bot) 100%);
            /* Pixelate the sun using SVG mask */
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="black"/><rect x="0" y="0" width="40" height="10" fill="white"/><rect x="0" y="15" width="40" height="5" fill="white"/><rect x="0" y="25" width="40" height="2" fill="white"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="black"/><rect x="0" y="0" width="40" height="10" fill="white"/><rect x="0" y="15" width="40" height="5" fill="white"/><rect x="0" y="25" width="40" height="2" fill="white"/></svg>');
            -webkit-mask-size: 40px 40px;
            mask-size: 40px 40px;
            -webkit-mask-repeat: repeat-y;
            mask-repeat: repeat-y;
            box-shadow: 0 0 50px var(--sun-bot);
            animation: sunPulse 4s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% { filter: brightness(1) contrast(1); }
            100% { filter: brightness(1.1) contrast(1.2); }
        }

        /* 3. The Grid Floor (Perspective) */
        .grid-container {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 45%;
            background: 
                linear-gradient(transparent 0%, var(--bg-color) 100%),
                repeating-linear-gradient(90deg, var(--grid-color) 0px, var(--grid-color) 2px, transparent 2px, transparent 60px),
                repeating-linear-gradient(0deg, var(--grid-color) 0px, var(--grid-color) 2px, transparent 2px, transparent 60px);
            transform: perspective(400px) rotateX(65deg);
            transform-origin: top center;
            z-index: 2;
            animation: gridMove 0.8s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- LAYOUT & HIERARCHY --- */
        
        /* Main Container to stack elements vertically */
        .ui-container {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: space-evenly;
            padding-top: 2vh;
        }

        /* --- TYPOGRAPHY (PIXEL & GLITCH) --- */

        .title-wrapper {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            line-height: 0.9;
            font-family: 'Courier New', monospace; /* System font forced to look pixelated */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #fff;
            /* Pixelated rendering */
            image-rendering: pixelated; 
            text-shadow: 
                4px 4px 0px var(--lane-1), 
                -2px -2px 0px var(--lane-2);
            animation: textGlitch 4s infinite;
        }

        /* Chromatic Aberration Layer */
        h1::before {
            content: "PIXEL DANCE";
            position: absolute;
            left: -2px;
            top: 0;
            color: var(--lane-2);
            z-index: -1;
            opacity: 0.7;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-3px, -2px);
            animation: glitchTop 2s infinite linear alternate-reverse;
        }

        h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            left: 2px;
            top: 0;
            color: var(--lane-1);
            z-index: -1;
            opacity: 0.7;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            transform: translate(3px, 2px);
            animation: glitchBot 3s infinite linear alternate-reverse;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--lane-2);
            letter-spacing: 8px;
            margin-top: 10px;
            text-shadow: 0 0 10px var(--lane-2);
            text-transform: uppercase;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border: 1px solid var(--lane-2);
        }

        @keyframes textGlitch {
            0% { transform: skew(0deg); }
            95% { transform: skew(0deg); }
            96% { transform: skew(-5deg) translateX(-5px); }
            97% { transform: skew(5deg) translateX(5px); }
            98% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes glitchTop {
            0% { clip-path: inset(0 0 80% 0); transform: translate(-2px, 0); }
            100% { clip-path: inset(0 0 20% 0); transform: translate(2px, 0); }
        }
        @keyframes glitchBot {
            0% { clip-path: inset(80% 0 0 0); transform: translate(2px, 0); }
            100% { clip-path: inset(20% 0 0 0); transform: translate(-2px, 0); }
        }

        /* --- THE HIGHWAY (3D TUNNEL) --- */

        .highway-wrapper {
            position: relative;
            width: 300px;
            height: 200px; /* Reduced height */
            perspective: 600px;
            margin: 20px 0;
        }

        .highway {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(45deg) scale(0.9);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--lane-2);
            box-shadow: 0 0 20px var(--lane-2), inset 0 0 20px rgba(0,0,0,0.9);
            display: flex;
        }

        /* 3D Tunnel Walls (Pseudo-elements for depth) */
        .highway::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 5;
            pointer-events: none;
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line - Distinct & Glowing */
        .hit-line {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #fff;
            box-shadow: 0 0 15px #fff, 0 0 30px var(--lane-2);
            z-index: 10;
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 100%;
            height: 24px; /* Blockier */
            box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
            animation: fall 1.5s linear infinite;
        }

        /* Specific Note Styles with Colors */
        .n1 { background-color: var(--lane-1); box-shadow: 0 0 10px var(--lane-1); animation-delay: 0.1s; }
        .n2 { background-color: var(--lane-2); box-shadow: 0 0 10px var(--lane-2); animation-delay: 0.8s; }
        .n3 { background-color: var(--lane-3); box-shadow: 0 0 10px var(--lane-3); animation-delay: 0.4s; }
        .n4 { background-color: var(--lane-4); box-shadow: 0 0 10px var(--lane-4); animation-delay: 1.1s; }
        
        /* Secondary notes for density */
        .n1-b { animation-delay: 1.8s; }
        .n2-b { animation-delay: 0.2s; }
        .n3-b { animation-delay: 1.2s; }
        .n4-b { animation-delay: 2.5s; }

        @keyframes fall {
            0% { top: -30px; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; transform: scale(1.2); }
        }

        /* --- START BUTTON (MANDATORY) --- */

        .start-btn {
            background: transparent;
            border: 4px solid var(--lane-1);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: 900;
            padding: 15px 60px;
            text-transform: uppercase;
            letter-spacing: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.1s;
            box-shadow: 0 0 15px var(--lane-1), inset 0 0 10px var(--lane-1);
            text-shadow: 0 0 5px var(--lane-1);
            margin-top: 10px;
            z-index: 30;
        }

        /* Button Hover State */
        .start-btn:hover {
            background: var(--lane-1);
            color: #000;
            box-shadow: 0 0 30px var(--lane-1), 0 0 60px var(--lane-1);
            transform: scale(1.05);
            text-shadow: none;
        }

        .start-btn:active {
            transform: scale(0.95);
            background: #fff;
            border-color: #fff;
        }

        /* --- OVERLAYS --- */

        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Vignette for focus */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 40%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Visual Layers -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-container"></div>

    <!-- Main UI Layer -->
    <div class="ui-container">
        
        <!-- 1. Title (Top) -->
        <div class="title-wrapper">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">Rhythm Protocol</div>
        </div>

        <!-- 2. Highway Preview (Center) -->
        <div class="highway-wrapper">
            <div class="highway">
                <div class="lane">
                    <div class="note n1"></div>
                    <div class="note n1 n1-b"></div>
                </div>
                <div class="lane">
                    <div class="note n2"></div>
                    <div class="note n2 n2-b"></div>
                </div>
                <div class="lane">
                    <div class="note n3"></div>
                    <div class="note n3 n3-b"></div>
                </div>
                <div class="lane">
                    <div class="note n4"></div>
                    <div class="note n4 n4-b"></div>
                </div>
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- 3. Start Button (Bottom) -->
        <button class="start-btn">START</button>

    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD GENERATOR ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 200;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth/Speed
                    size: Math.random() * 2 + 1 // Pixelated size
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle
                ctx.globalAlpha = Math.random() * 0.5 + 0.5; 
                ctx.fillRect(star.x, star.y, star.size, star.size); // Square pixels
                
                // Move stars (warp effect)
                star.y += star.z * 0.5;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            init();
        });

        // --- INTERACTIVITY ---
        const btn = document.querySelector('.start-btn');
        
        btn.addEventListener('click', () => {
            // Visual feedback
            btn.innerHTML = "LOADING...";
            btn.style.background = "var(--lane-1)";
            btn.style.color = "#000";
            
            // Simulate game start
            setTimeout(() => {
                alert("RHYTHM ENGINE INITIALIZED.\n\n(Transition to game loop would occur here)");
                btn.innerHTML = "START";
                btn.style.background = "transparent";
                btn.style.color = "#fff";
            }, 600);
        });

        // Initialize
        init();
        draw();

    </script>
</body>
</html>
