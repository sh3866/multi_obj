<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette: High Contrast Synthwave */
            --bg-deep: #05000a;
            --bg-grid: #1a0b2e;
            
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-purple: #bd00ff;
            
            --grid-line: rgba(189, 0, 255, 0.4);
            
            /* Lane Colors */
            --lane-1: #ff0055; /* Pink */
            --lane-2: #00f3ff; /* Cyan */
            --lane-3: #ffe600; /* Yellow */
            --lane-4: #bd00ff; /* Purple */

            /* Dimensions */
            --highway-width: 400px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Courier New', monospace; /* Fallback */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- LAYOUT CONTAINER --- */
        .main-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* --- BACKGROUND ELEMENTS --- */
        
        /* 1. Starfield */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 2. The Retro Sun */
        .sun-container {
            position: absolute;
            top: 10%;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 300px;
            height: 300px;
            background: linear-gradient(to bottom, var(--neon-yellow) 0%, var(--neon-pink) 100%);
            /* Hard pixelated stripes via SVG mask */
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="white"/><rect y="10" width="100" height="4" fill="black"/><rect y="20" width="100" height="6" fill="black"/><rect y="32" width="100" height="8" fill="black"/><rect y="46" width="100" height="10" fill="black"/><rect y="62" width="100" height="14" fill="black"/><rect y="82" width="100" height="18" fill="black"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="white"/><rect y="10" width="100" height="4" fill="black"/><rect y="20" width="100" height="6" fill="black"/><rect y="32" width="100" height="8" fill="black"/><rect y="46" width="100" height="10" fill="black"/><rect y="62" width="100" height="14" fill="black"/><rect y="82" width="100" height="18" fill="black"/></svg>');
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            box-shadow: 0 0 40px var(--neon-pink);
        }

        /* 3. The Grid Floor */
        .grid-floor {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 80%;
            background: 
                linear-gradient(transparent 0%, var(--bg-deep) 100%),
                repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 2px, transparent 2px, transparent 80px),
                repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 2px, transparent 2px, transparent 80px);
            transform: perspective(600px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            animation: gridScroll 1s linear infinite;
            pointer-events: none;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }

        /* --- TYPOGRAPHY --- */

        .title-group {
            position: relative;
            z-index: 20;
            margin-bottom: 2rem;
            text-align: center;
            transform: translateY(-10%);
        }

        .game-title {
            font-family: 'Courier New', Courier, monospace; /* Pixel approximation */
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.9;
            color: #fff;
            margin: 0;
            text-transform: uppercase;
            /* Hard shadow for pixel depth */
            text-shadow: 
                4px 4px 0px var(--neon-purple),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: -2px;
            position: relative;
        }

        /* Glitch Effect */
        .game-title::before, .game-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .game-title::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-3px, 0);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        .game-title::after {
            color: var(--neon-pink);
            z-index: -2;
            transform: translate(3px, 0);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-3px, -2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(3px, 2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-3px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(3px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
            100% { clip-path: inset(30% 0 20% 0); transform: translate(3px, -2px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(3px, 2px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-3px, -2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(3px, 2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-3px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(3px, 2px); }
            100% { clip-path: inset(0% 0 80% 0); transform: translate(-3px, -2px); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-cyan);
            letter-spacing: 0.5em;
            margin-top: 10px;
            opacity: 0.9;
            text-shadow: 0 0 8px var(--neon-cyan);
            text-transform: uppercase;
        }

        /* --- THE HIGHWAY (DOMINANT VISUAL) --- */
        
        .highway-container {
            position: relative;
            width: var(--highway-width);
            height: 260px;
            perspective: 400px;
            z-index: 15;
            margin-bottom: 1rem;
            /* Shadow to ground the floating stage */
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        .highway-surface {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            /* Strong borders */
            border: 4px solid var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
            position: relative;
            transform: rotateX(35deg);
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
        }

        /* Inner Grid Lines on Highway */
        .highway-surface::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent 0%,
                transparent 24%,
                rgba(255,255,255,0.1) 25%,
                transparent 25%
            );
            z-index: 1;
        }

        .lane {
            flex: 1;
            position: relative;
            height: 100%;
        }

        /* Lane Dividers */
        .lane:not(:last-child) {
            border-right: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* The HIT LINE (Critical UI) */
        .hit-zone {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #fff;
            box-shadow: 0 0 15px #fff, 0 0 30px var(--neon-cyan);
            z-index: 10;
        }
        
        /* Target markers */
        .target-marker {
            position: absolute;
            bottom: 15px;
            width: 20%;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            box-sizing: border-box;
            opacity: 0.5;
        }
        .tm-1 { left: 0; border-color: var(--lane-1); box-shadow: 0 0 5px var(--lane-1); }
        .tm-2 { left: 25%; border-color: var(--lane-2); box-shadow: 0 0 5px var(--lane-2); }
        .tm-3 { left: 50%; border-color: var(--lane-3); box-shadow: 0 0 5px var(--lane-3); }
        .tm-4 { left: 75%; border-color: var(--lane-4); box-shadow: 0 0 5px var(--lane-4); }


        /* Notes */
        .note {
            position: absolute;
            width: 100%;
            height: 20px;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.8);
            animation: noteFall 1.2s linear infinite;
            z-index: 5;
        }

        /* Note Colors & Delays */
        .note.c1 { background: var(--lane-1); box-shadow: 0 0 10px var(--lane-1); }
        .note.c2 { background: var(--lane-2); box-shadow: 0 0 10px var(--lane-2); }
        .note.c3 { background: var(--lane-3); box-shadow: 0 0 10px var(--lane-3); }
        .note.c4 { background: var(--lane-4); box-shadow: 0 0 10px var(--lane-4); }

        /* Animation Variations for "Music" feel */
        .n-1 { animation-delay: 0.1s; }
        .n-2 { animation-delay: 0.4s; }
        .n-3 { animation-delay: 0.8s; }
        .n-4 { animation-delay: 1.1s; }
        .n-5 { animation-delay: 0.2s; }
        .n-6 { animation-delay: 0.9s; }

        @keyframes noteFall {
            0% { top: -20px; opacity: 0; transform: scale(0.9); }
            10% { opacity: 1; transform: scale(1); }
            95% { opacity: 1; }
            100% { top: 240px; opacity: 0; transform: scale(1.1); }
        }

        /* --- START BUTTON --- */
        
        .start-btn {
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 50px;
            border: 3px solid var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            z-index: 20;
            box-shadow: 0 0 15px var(--neon-cyan);
            transition: all 0.1s;
            /* Pixelated corners via clip-path */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
        }

        .start-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--neon-cyan), 0 0 60px var(--neon-cyan);
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* --- OVERLAYS --- */
        
        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.4) 50%,
                rgba(0,0,0,0.4)
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 50%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .game-title { font-size: 3rem; }
            .highway-container { width: 90%; height: 200px; }
            .subtitle { font-size: 0.8rem; letter-spacing: 0.2em; }
            .start-btn { font-size: 1.2rem; padding: 12px 40px; }
        }

    </style>
</head>
<body>

    <!-- Backgrounds -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-floor"></div>

    <!-- Main UI -->
    <div class="main-stage">
        
        <!-- Title -->
        <div class="title-group">
            <h1 class="game-title" data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <div class="subtitle">Rhythm Protocol</div>
        </div>

        <!-- Highway Preview -->
        <div class="highway-container">
            <div class="highway-surface">
                <!-- Lanes -->
                <div class="lane">
                    <div class="note c1 n-1"></div>
                    <div class="note c1 n-5"></div>
                </div>
                <div class="lane">
                    <div class="note c2 n-2"></div>
                    <div class="note c2 n-6"></div>
                </div>
                <div class="lane">
                    <div class="note c3 n-3"></div>
                </div>
                <div class="lane">
                    <div class="note c4 n-4"></div>
                </div>
                
                <!-- Gameplay Elements -->
                <div class="hit-zone"></div>
                <div class="target-marker tm-1"></div>
                <div class="target-marker tm-2"></div>
                <div class="target-marker tm-3"></div>
                <div class="target-marker tm-4"></div>
            </div>
        </div>

        <!-- Action -->
        <button class="start-btn">START GAME</button>

    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD ENGINE ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 150; // Reduced count for cleaner look
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2 + 0.5, // Depth
                    size: Math.random() * 2 + 1 // 1px or 2px
                });
            }
        }

        function draw() {
            // Clear with slight transparency for trail effect? No, keep it clean for pixel style.
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Blink logic
                if (Math.random() > 0.98) {
                    ctx.globalAlpha = 0.2;
                } else {
                    ctx.globalAlpha = 1.0;
                }
                
                // Draw square pixel stars
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move
                star.y += star.z * 0.8;
                
                // Wrap around
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        
        // Start
        init();
        draw();

        // --- BUTTON INTERACTION ---
        const btn = document.querySelector('.start-btn');
        btn.addEventListener('click', () => {
            btn.innerHTML = "SYNCING...";
            // Quick flash effect
            document.body.style.backgroundColor = "#220033";
            setTimeout(() => {
                document.body.style.backgroundColor = "";
                alert("SYSTEM ONLINE.\nENTERING HIGHWAY...");
                btn.innerHTML = "START GAME";
            }, 200);
        });

    </script>
</body>
</html>
