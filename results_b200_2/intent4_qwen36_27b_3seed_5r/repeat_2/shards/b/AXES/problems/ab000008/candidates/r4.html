<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette: Synthwave 8-Bit */
            --bg-deep: #05000a;
            --bg-grid: #1a0b2e;
            
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-purple: #bd00ff;
            --neon-white: #ffffff;
            
            --grid-line: rgba(189, 0, 255, 0.3);
            
            /* Lane Colors */
            --lane-1: #ff0055; /* Pink */
            --lane-2: #00f3ff; /* Cyan */
            --lane-3: #ffe600; /* Yellow */
            --lane-4: #bd00ff; /* Purple */

            /* Dimensions */
            --pixel-size: 4px; 
            --highway-width: 500px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            /* System monospace as closest pixel font fallback */
            font-family: "Courier New", Courier, monospace; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* --- LAYOUT CONTAINER --- */
        /* Changed to Absolute positioning to layer Title -> Highway -> Button */
        .main-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* --- BACKGROUND ELEMENTS --- */
        
        /* 1. Starfield */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            image-rendering: pixelated; 
        }

        /* 2. The Retro Sun */
        .sun-container {
            position: absolute;
            top: 10%;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 300px;
            height: 300px;
            background: linear-gradient(to bottom, var(--neon-yellow) 0%, var(--neon-pink) 100%);
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="white"/><rect y="12" width="100" height="5" fill="black"/><rect y="24" width="100" height="7" fill="black"/><rect y="38" width="100" height="9" fill="black"/><rect y="54" width="100" height="12" fill="black"/><rect y="72" width="100" height="16" fill="black"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="white"/><rect y="12" width="100" height="5" fill="black"/><rect y="24" width="100" height="7" fill="black"/><rect y="38" width="100" height="9" fill="black"/><rect y="54" width="100" height="12" fill="black"/><rect y="72" width="100" height="16" fill="black"/></svg>');
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            box-shadow: 
                10px 10px 0px rgba(0,0,0,0.5),
                0 0 0 4px var(--bg-deep);
        }

        /* 3. The Grid Floor */
        .grid-floor {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 80%;
            background: 
                linear-gradient(transparent 0%, var(--bg-deep) 100%),
                repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 2px, transparent 2px, transparent 80px),
                repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 2px, transparent 2px, transparent 80px);
            transform: perspective(600px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            animation: gridScroll 1s linear infinite;
            pointer-events: none;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }

        /* --- TYPOGRAPHY --- */

        .title-group {
            position: absolute;
            top: 15%; /* Pushed up */
            z-index: 30; /* Above highway */
            text-align: center;
            pointer-events: none;
        }

        .game-title {
            font-family: "Courier New", monospace; 
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.9;
            color: var(--neon-white);
            margin: 0;
            text-transform: uppercase;
            /* Hard stepped shadow */
            text-shadow: 
                6px 6px 0px var(--neon-purple),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: -4px;
            position: relative;
            -webkit-font-smoothing: none;
            font-smooth: never;
            /* Transparent background fix */
            background: transparent;
        }

        /* Glitch Effect - Solid Colors */
        .game-title::before, .game-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep); 
            opacity: 0.8;
        }

        .game-title::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-4px, 2px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        .game-title::after {
            color: var(--neon-pink);
            z-index: -2;
            transform: translate(4px, -2px);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-4px, -2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(4px, 2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-4px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(4px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-4px, 2px); }
            100% { clip-path: inset(30% 0 20% 0); transform: translate(4px, -2px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(4px, 2px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-4px, -2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(4px, 2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-4px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(4px, 2px); }
            100% { clip-path: inset(0% 0 80% 0); transform: translate(4px, -2px); }
        }

        .subtitle {
            font-family: "Courier New", monospace;
            font-size: 1.2rem;
            color: var(--neon-cyan);
            letter-spacing: 0.4em;
            margin-top: 15px;
            opacity: 1;
            text-shadow: 2px 2px 0px #000; 
            text-transform: uppercase;
            font-weight: bold;
            /* Increased contrast with dark outline */
            -webkit-text-stroke: 1px black;
        }

        /* --- THE HIGHWAY (DOMINANT VISUAL) --- */
        
        .highway-container {
            position: relative;
            width: var(--highway-width);
            height: 400px; /* Taller */
            perspective: 600px;
            z-index: 15;
            /* Centered in screen */
            margin-top: 50px;
        }

        .highway-surface {
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.85); /* Darker purple base */
            border: 4px solid var(--neon-purple);
            box-shadow: 
                inset 0 0 0 2px #000, 
                0 0 0 4px var(--neon-purple),
                0 0 40px var(--neon-purple); /* Glow */
            position: relative;
            transform: rotateX(40deg);
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
        }

        /* Inner Grid Lines */
        .highway-surface::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent 0%,
                transparent 24.5%,
                rgba(255,255,255,0.15) 25%,
                transparent 25%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* Perspective Horizon Glow */
        .highway-surface::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 2;
            pointer-events: none;
        }

        .lane {
            flex: 1;
            position: relative;
            height: 100%;
            /* Lane background tint */
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
        }

        .lane:not(:last-child) {
            border-right: 4px solid rgba(255, 255, 255, 0.1);
        }

        /* The HIT LINE (Neon Tube) */
        .hit-zone {
            position: absolute;
            bottom: 40px;
            left: -2px;
            width: calc(100% + 4px);
            height: 8px;
            background: var(--neon-white);
            box-shadow: 
                0 0 0 4px #000,
                0 0 15px var(--neon-cyan),
                0 0 30px var(--neon-cyan);
            z-index: 20;
        }

        /* Target markers (Receptors) */
        .target-marker {
            position: absolute;
            bottom: 20px;
            width: 20%; 
            height: 60px;
            border: 4px solid;
            box-sizing: border-box;
            background: rgba(0,0,0,0.3);
            opacity: 0.9;
            left: 0; 
        }
        
        .tm-1 { left: 0; border-color: var(--lane-1); box-shadow: inset 0 0 10px var(--lane-1); }
        .tm-2 { left: 25%; border-color: var(--lane-2); box-shadow: inset 0 0 10px var(--lane-2); }
        .tm-3 { left: 50%; border-color: var(--lane-3); box-shadow: inset 0 0 10px var(--lane-3); }
        .tm-4 { left: 75%; border-color: var(--lane-4); box-shadow: inset 0 0 10px var(--lane-4); }

        /* Notes - Chunky Blocks with "Trails" */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 30px;
            /* Hard pixel look */
            box-shadow: 
                inset 4px 4px 0 rgba(255,255,255,0.8),
                inset -4px -4px 0 rgba(0,0,0,0.4);
            animation: noteFall 1.2s linear infinite;
            z-index: 5;
        }
        
        /* Trail effect using pseudo element */
        .note::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 0;
            width: 100%;
            height: 30px;
            background: inherit;
            opacity: 0.5;
            filter: blur(4px);
        }

        .note.c1 { background: var(--lane-1); }
        .note.c2 { background: var(--lane-2); }
        .note.c3 { background: var(--lane-3); }
        .note.c4 { background: var(--lane-4); }

        /* Animation Variations */
        .n-1 { animation-delay: 0.0s; }
        .n-2 { animation-delay: 0.4s; }
        .n-3 { animation-delay: 0.8s; }
        .n-4 { animation-delay: 0.2s; }
        .n-5 { animation-delay: 0.6s; }
        .n-6 { animation-delay: 1.0s; }
        .n-7 { animation-delay: 0.1s; }

        @keyframes noteFall {
            0% { top: -50px; opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 380px; opacity: 0; }
        }

        /* --- START BUTTON --- */
        /* Moved to center overlay */
        
        .start-btn {
            position: absolute;
            bottom: 15%; /* Positioned over the bottom of highway */
            z-index: 40;
            
            background: var(--neon-pink);
            color: #fff;
            font-family: "Courier New", monospace;
            font-size: 2rem;
            font-weight: 900;
            padding: 20px 60px;
            border: none;
            
            /* Pixelated Border via Box Shadow Hack */
            box-shadow: 
                inset -6px -6px 0px rgba(0,0,0,0.4),
                inset 6px 6px 0px rgba(255,255,255,0.4),
                /* Hard Drop Shadow */
                0 8px 0px #000, 
                0 16px 20px rgba(0,0,0,0.5);
                
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.1s;
            outline: 4px solid #fff;
            outline-offset: 4px;
            
            /* Pulse Animation */
            animation: btnPulse 2s infinite ease-in-out;
        }

        @keyframes btnPulse {
            0% { transform: scale(1); box-shadow: inset -6px -6px 0px rgba(0,0,0,0.4), inset 6px 6px 0px rgba(255,255,255,0.4), 0 8px 0px #000, 0 16px 20px rgba(0,0,0,0.5), 0 0 20px var(--neon-pink); }
            50% { transform: scale(1.05); box-shadow: inset -6px -6px 0px rgba(0,0,0,0.4), inset 6px 6px 0px rgba(255,255,255,0.4), 0 8px 0px #000, 0 16px 20px rgba(0,0,0,0.5), 0 0 40px var(--neon-pink); }
            100% { transform: scale(1); box-shadow: inset -6px -6px 0px rgba(0,0,0,0.4), inset 6px 6px 0px rgba(255,255,255,0.4), 0 8px 0px #000, 0 16px 20px rgba(0,0,0,0.5), 0 0 20px var(--neon-pink); }
        }

        .start-btn:hover {
            background: var(--neon-cyan);
            box-shadow: 
                inset -6px -6px 0px rgba(0,0,0,0.4),
                inset 6px 6px 0px rgba(255,255,255,0.4),
                0 8px 0px #000,
                0 0 50px var(--neon-cyan);
            transform: translateY(4px);
            outline-color: var(--neon-pink);
            animation: none;
        }

        .start-btn:active {
            transform: translateY(12px);
            box-shadow: 
                inset -6px -6px 0px rgba(0,0,0,0.4),
                inset 6px 6px 0px rgba(255,255,255,0.4),
                0 0px 0px #000;
        }

        /* --- OVERLAYS --- */
        
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 40%, #000 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .game-title { font-size: 3rem; letter-spacing: -2px; }
            .highway-container { width: 90%; height: 300px; }
            .subtitle { font-size: 0.9rem; letter-spacing: 0.2em; }
            .start-btn { font-size: 1.4rem; padding: 15px 40px; bottom: 5%; }
            .hit-zone { bottom: 20px; }
            .target-marker { bottom: 5px; height: 40px; }
            .note { height: 20px; }
            @keyframes noteFall {
                0% { top: -50px; opacity: 0; }
                100% { top: 280px; opacity: 0; }
            }
        }

    </style>
</head>
<body>

    <!-- Backgrounds -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-floor"></div>

    <!-- Main UI -->
    <div class="main-stage">
        
        <!-- Title -->
        <div class="title-group">
            <h1 class="game-title" data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <div class="subtitle">Rhythm Protocol</div>
        </div>

        <!-- Highway Preview -->
        <div class="highway-container">
            <div class="highway-surface">
                <!-- 4 Lanes (Fixed) -->
                <div class="lane">
                    <div class="note c1 n-1"></div>
                    <div class="note c1 n-5"></div>
                </div>
                <div class="lane">
                    <div class="note c2 n-2"></div>
                    <div class="note c2 n-6"></div>
                </div>
                <div class="lane">
                    <div class="note c3 n-3"></div>
                    <div class="note c3 n-7"></div>
                </div>
                <div class="lane">
                    <div class="note c4 n-4"></div>
                </div>
                
                <!-- Gameplay Elements -->
                <div class="hit-zone"></div>
                <!-- Receptors (4 visible) -->
                <div class="target-marker tm-1"></div>
                <div class="target-marker tm-2"></div>
                <div class="target-marker tm-3"></div>
                <div class="target-marker tm-4"></div>
            </div>
        </div>

        <!-- Action -->
        <button class="start-btn">START GAME</button>

    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD ENGINE ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 120; 
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 1.5 + 0.5, // Depth
                    size: Math.random() > 0.9 ? 3 : 1 // Varied pixel sizes
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Hard blink
                if (Math.random() > 0.99) {
                    ctx.globalAlpha = 0.2;
                } else {
                    ctx.globalAlpha = 1.0;
                }
                
                // Draw square pixel stars
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move
                star.y += star.z * 0.5;
                
                // Wrap around
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        
        // Start
        init();
        draw();

        // --- BUTTON INTERACTION ---
        const btn = document.querySelector('.start-btn');
        btn.addEventListener('click', () => {
            btn.innerHTML = "SYNCING...";
            // Quick flash effect
            document.body.style.backgroundColor = "#220033";
            setTimeout(() => {
                document.body.style.backgroundColor = "";
                alert("SYSTEM ONLINE.\nENTERING HIGHWAY...");
                btn.innerHTML = "START GAME";
            }, 200);
        });

    </script>
</body>
</html>
