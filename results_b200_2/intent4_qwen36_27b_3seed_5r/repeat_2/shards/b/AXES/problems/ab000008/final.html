<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Protocol</title>
    <style>
        :root {
            /* Palette: Synthwave / Cyberpunk */
            --bg-deep: #05000a;
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-purple: #bd00ff;
            --neon-white: #ffffff;
            
            /* Lane Colors */
            --lane-1: #ff0055; 
            --lane-2: #00f3ff; 
            --lane-3: #ffe600; 
            --lane-4: #bd00ff;

            /* Dimensions */
            --pixel-unit: 4px; 
        }

        * {
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: "Courier New", Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* --- BACKGROUND LAYERS --- */
        
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            image-rendering: pixelated; 
        }

        /* The Retro Sun (Horizon Anchor) */
        .sun-container {
            position: absolute;
            top: 18%; 
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
        }

        .retro-sun {
            width: 250px;
            height: 250px;
            background: linear-gradient(to bottom, var(--neon-yellow) 0%, var(--neon-pink) 100%);
            /* Pixelated Sun Cutouts using Mask */
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="white"/><rect y="15" width="100" height="4" fill="black"/><rect y="25" width="100" height="6" fill="black"/><rect y="37" width="100" height="8" fill="black"/><rect y="52" width="100" height="12" fill="black"/><rect y="70" width="100" height="16" fill="black"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="white"/><rect y="15" width="100" height="4" fill="black"/><rect y="25" width="100" height="6" fill="black"/><rect y="37" width="100" height="8" fill="black"/><rect y="52" width="100" height="12" fill="black"/><rect y="70" width="100" height="16" fill="black"/></svg>');
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            /* Hard Shadow for Pixel Depth */
            box-shadow: 12px 12px 0px rgba(0,0,0,0.4);
            border-radius: 0; 
        }

        /* The Grid Floor (Stronger Contrast) */
        .grid-floor {
            position: absolute;
            bottom: -30%;
            left: -50%;
            width: 200%;
            height: 70%;
            background: 
                linear-gradient(transparent 0%, var(--bg-deep) 100%),
                repeating-linear-gradient(90deg, rgba(189, 0, 255, 0.6) 0px, rgba(189, 0, 255, 0.6) 2px, transparent 2px, transparent 60px),
                repeating-linear-gradient(0deg, rgba(189, 0, 255, 0.6) 0px, rgba(189, 0, 255, 0.6) 2px, transparent 2px, transparent 60px);
            transform: perspective(400px) rotateX(65deg);
            transform-origin: top center;
            z-index: 2;
            animation: gridScroll 0.8s linear infinite;
            pointer-events: none;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            padding-top: 10vh;
        }

        /* --- TITLE (Vanishing Point Anchor) --- */
        .title-group {
            position: relative;
            z-index: 30;
            text-align: center;
            margin-bottom: 20px;
            /* Anchored above the highway perspective */
            filter: drop-shadow(0 0 10px rgba(255,0,85,0.6));
        }

        .game-title {
            font-family: "Courier New", monospace; 
            font-size: 5.5rem;
            font-weight: 900;
            line-height: 0.9;
            color: var(--neon-white);
            margin: 0;
            text-transform: uppercase;
            /* Pixelated Shadow */
            text-shadow: 
                6px 6px 0px var(--neon-purple),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: -4px;
            position: relative;
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        /* Glitch Effect Layers */
        .game-title::before, .game-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            opacity: 0.8;
        }

        .game-title::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-4px, 2px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        .game-title::after {
            color: var(--neon-pink);
            z-index: -2;
            transform: translate(4px, -2px);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-4px, -2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(4px, 2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-4px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(4px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-4px, 2px); }
            100% { clip-path: inset(30% 0 20% 0); transform: translate(4px, -2px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(4px, 2px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-4px, -2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(4px, 2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-4px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(4px, 2px); }
            100% { clip-path: inset(0% 0 80% 0); transform: translate(4px, -2px); }
        }

        .subtitle {
            font-family: "Courier New", monospace;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            letter-spacing: 0.3em;
            margin-top: 5px;
            text-shadow: 2px 2px 0px #000; 
            text-transform: uppercase;
            font-weight: bold;
            -webkit-text-stroke: 0.5px black;
        }

        /* --- THE HIGHWAY (Perspective) --- */
        
        .highway-container {
            position: relative;
            width: 600px;
            height: 350px;
            perspective: 800px; /* Deeper perspective */
            z-index: 15;
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .highway-surface {
            width: 100%;
            height: 100%;
            background: rgba(5, 0, 10, 0.6);
            border-left: 6px solid var(--neon-purple);
            border-right: 6px solid var(--neon-purple);
            /* Neon Glow on Edges */
            box-shadow: 
                inset 0 0 30px rgba(189, 0, 255, 0.4),
                0 0 15px var(--neon-purple);
            position: relative;
            transform: rotateX(45deg) scale(1.1); /* Angle it back */
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
        }

        /* Internal Lane Dividers (Glowing) */
        .highway-surface::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent 0%,
                transparent 24.5%,
                var(--neon-purple) 24.5%,
                var(--neon-purple) 25%,
                transparent 25%
            );
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
        }

        .lane {
            flex: 1;
            position: relative;
            height: 100%;
        }

        /* The HIT LINE (Physical Object) */
        .hit-zone {
            position: absolute;
            bottom: 50px;
            left: -10px;
            width: calc(100% + 20px);
            height: 12px;
            background: var(--neon-white);
            /* Chunky 3D look */
            box-shadow: 
                0 4px 0 #000,
                0 0 15px var(--neon-cyan),
                0 0 30px var(--neon-cyan);
            z-index: 20;
            animation: pulseLine 2s infinite ease-in-out;
        }

        @keyframes pulseLine {
            0%, 100% { box-shadow: 0 4px 0 #000, 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
            50% { box-shadow: 0 4px 0 #000, 0 0 25px var(--neon-cyan), 0 0 50px var(--neon-cyan); }
        }

        /* Target markers (Receptors) */
        .target-marker {
            position: absolute;
            bottom: 40px;
            width: 20%; 
            height: 60px;
            border: 4px solid;
            box-sizing: border-box;
            background: rgba(0,0,0,0.5);
            opacity: 0.8;
            left: 0; 
        }
        
        .tm-1 { left: 0; border-color: var(--lane-1); box-shadow: inset 0 0 15px var(--lane-1); }
        .tm-2 { left: 25%; border-color: var(--lane-2); box-shadow: inset 0 0 15px var(--lane-2); }
        .tm-3 { left: 50%; border-color: var(--lane-3); box-shadow: inset 0 0 15px var(--lane-3); }
        .tm-4 { left: 75%; border-color: var(--lane-4); box-shadow: inset 0 0 15px var(--lane-4); }

        /* Notes - Pixel Blocks with Motion Trails */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            /* Pixel Art Bevel */
            box-shadow: 
                inset 4px 4px 0 rgba(255,255,255,0.7),
                inset -4px -4px 0 rgba(0,0,0,0.5);
            animation: noteFall 1.5s linear infinite;
            z-index: 5;
        }
        
        /* The "Light Trail" Effect */
        .note::after {
            content: '';
            position: absolute;
            top: -60px; /* Trail length */
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to bottom, transparent, inherit);
            opacity: 0.6;
            filter: blur(2px); /* Slight blur for speed feel, but note stays sharp */
        }

        .note.c1 { background: var(--lane-1); }
        .note.c2 { background: var(--lane-2); }
        .note.c3 { background: var(--lane-3); }
        .note.c4 { background: var(--lane-4); }

        /* Animation Timing */
        .n-1 { animation-delay: 0.0s; }
        .n-2 { animation-delay: 0.5s; }
        .n-3 { animation-delay: 1.0s; }
        .n-4 { animation-delay: 0.3s; }
        .n-5 { animation-delay: 0.8s; }
        .n-6 { animation-delay: 1.2s; }
        .n-7 { animation-delay: 0.1s; }

        @keyframes noteFall {
            0% { top: -80px; opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 350px; opacity: 0; }
        }

        /* --- START BUTTON (Holographic/Wireframe) --- */
        /* Positioned at bottom, out of the way */
        
        .start-btn-container {
            position: absolute;
            bottom: 5%;
            z-index: 50;
        }

        .start-btn {
            background: transparent;
            color: var(--neon-cyan);
            font-family: "Courier New", monospace;
            font-size: 2.2rem;
            font-weight: 900;
            padding: 15px 50px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            /* Pixelated Border */
            outline: 4px solid var(--neon-cyan);
            outline-offset: 4px;
            /* Glow */
            text-shadow: 0 0 10px var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px rgba(0, 243, 255, 0.2);
            transition: all 0.15s;
            
            /* Holographic Scanline Texture */
            background-image: linear-gradient(
                to bottom,
                rgba(0, 243, 255, 0) 0%,
                rgba(0, 243, 255, 0) 50%,
                rgba(0, 243, 255, 0.1) 50%,
                rgba(0, 243, 255, 0.1) 100%
            );
            background-size: 100% 6px;
        }

        .start-btn:hover {
            color: #000;
            background: var(--neon-cyan);
            box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 20px #fff;
            outline-color: #fff;
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.95);
            background: #fff;
            color: #000;
        }

        /* --- OVERLAYS (Atmosphere) --- */
        
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.5;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 50%, #05000a 100%);
            z-index: 998;
            pointer-events: none;
        }

        /* --- PARTICLES --- */
        .particle {
            position: absolute;
            background: var(--neon-white);
            width: 4px;
            height: 4px;
            opacity: 0;
            z-index: 5;
            pointer-events: none;
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .game-title { font-size: 3.5rem; letter-spacing: -2px; }
            .highway-container { width: 95%; height: 300px; }
            .subtitle { font-size: 0.8rem; }
            .start-btn { font-size: 1.4rem; padding: 12px 30px; }
            .hit-zone { bottom: 30px; }
            .target-marker { bottom: 20px; height: 40px; }
            .note { height: 18px; }
            @keyframes noteFall {
                0% { top: -50px; opacity: 0; }
                100% { top: 290px; opacity: 0; }
            }
        }
    </style>
</head>
<body>

    <!-- Backgrounds -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="retro-sun"></div>
    </div>
    
    <div class="grid-floor"></div>

    <!-- Main UI -->
    <div class="main-stage">
        
        <!-- Title -->
        <div class="title-group">
            <h1 class="game-title" data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <div class="subtitle">Rhythm Protocol</div>
        </div>

        <!-- Highway Preview -->
        <div class="highway-container">
            <div class="highway-surface">
                <!-- 4 Lanes -->
                <div class="lane">
                    <div class="note c1 n-1"></div>
                    <div class="note c1 n-5"></div>
                </div>
                <div class="lane">
                    <div class="note c2 n-2"></div>
                    <div class="note c2 n-6"></div>
                </div>
                <div class="lane">
                    <div class="note c3 n-3"></div>
                    <div class="note c3 n-7"></div>
                </div>
                <div class="lane">
                    <div class="note c4 n-4"></div>
                </div>
                
                <!-- Gameplay Elements -->
                <div class="hit-zone"></div>
                <!-- Receptors (4 visible) -->
                <div class="target-marker tm-1"></div>
                <div class="target-marker tm-2"></div>
                <div class="target-marker tm-3"></div>
                <div class="target-marker tm-4"></div>
            </div>
        </div>

        <!-- Action Button (Moved to Bottom) -->
        <div class="start-btn-container">
            <button class="start-btn">START GAME</button>
        </div>

        <!-- Floating Particles -->
        <div id="particles"></div>

    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        // --- STARFIELD ENGINE ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
        }

        function createStars() {
            stars = [];
            const count = 150; 
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 1.5 + 0.5, // Depth
                    size: Math.random() > 0.9 ? 3 : 1 // Varied pixel sizes
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Hard blink
                if (Math.random() > 0.99) {
                    ctx.globalAlpha = 0.1;
                } else {
                    ctx.globalAlpha = 1.0;
                }
                
                // Draw square pixel stars
                ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                
                // Move
                star.y += star.z * 0.3; // Slower movement
                
                // Wrap around
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        
        // --- PARTICLE SYSTEM ---
        const particleContainer = document.getElementById('particles');
        function createParticle() {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.animationDuration = (Math.random() * 3 + 2) + 's';
            p.style.background = Math.random() > 0.5 ? 'var(--neon-cyan)' : 'var(--neon-pink)';
            particleContainer.appendChild(p);
            
            // Cleanup
            setTimeout(() => {
                p.remove();
            }, 5000);
        }
        setInterval(createParticle, 300);

        // Start
        init();
        draw();

        // --- BUTTON INTERACTION ---
        const btn = document.querySelector('.start-btn');
        btn.addEventListener('click', () => {
            btn.innerHTML = "SYNCING...";
            // Quick flash effect
            document.body.style.backgroundColor = "#220033";
            setTimeout(() => {
                document.body.style.backgroundColor = "";
                alert("SYSTEM ONLINE.\nENTERING HIGHWAY...");
                btn.innerHTML = "START GAME";
            }, 200);
        });

    </script>
</body>
</html>
