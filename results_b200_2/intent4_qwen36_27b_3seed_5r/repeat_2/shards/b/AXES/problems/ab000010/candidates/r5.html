<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automata Sphere: Cellular Automata</title>
<style>
    :root {
        /* Palette - Deep Void & Neon Bioluminescence */
        --bg-color: #050508;
        --panel-bg: rgba(12, 14, 20, 0.45);
        --panel-border: rgba(255, 255, 255, 0.12);
        --panel-highlight: rgba(255, 255, 255, 0.08);
        
        --text-primary: #ffffff;
        --text-secondary: #8b9bb4;
        
        /* Accents - Chromatic Range */
        --accent-cyan: #00f3ff;
        --accent-magenta: #ff00aa;
        --accent-purple: #bd00ff;
        --accent-glow: rgba(0, 243, 255, 0.5);
        
        /* Typography */
        --font-ui: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
        
        /* Layout Constants */
        --radius-ui: 16px;
        --panel-width: 320px;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        user-select: none;
        cursor: default;
        /* Subtle starfield texture */
        background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                          radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                          radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
        background-size: 550px 550px, 350px 350px, 250px 250px;
        background-position: 0 0, 40px 60px, 130px 270px;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    /* Control Panel - Floating Glass HUD */
    #controls {
        position: absolute;
        top: 50%;
        left: 40px;
        transform: translateY(-50%);
        width: var(--panel-width);
        background: var(--panel-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-ui);
        padding: 32px;
        z-index: 10;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 28px;
        opacity: 0;
        animation: fadeIn 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-45%); }
        to { opacity: 1; transform: translateY(-50%); }
    }

    /* Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 16px;
    }

    h1 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        margin: 0;
        color: var(--text-secondary);
        text-transform: uppercase;
    }

    .status-indicator {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--accent-cyan);
        box-shadow: 0 0 12px var(--accent-cyan);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { opacity: 0.4; box-shadow: 0 0 4px var(--accent-cyan); }
        50% { opacity: 1; box-shadow: 0 0 16px var(--accent-cyan); }
        100% { opacity: 0.4; box-shadow: 0 0 4px var(--accent-cyan); }
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .stat-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .stat-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-secondary);
        letter-spacing: 1px;
        opacity: 0.7;
    }

    .stat-value {
        font-family: var(--font-mono);
        font-size: 28px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -1px;
        line-height: 1;
        text-shadow: 0 0 20px rgba(255,255,255,0.15);
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .control-label {
        font-size: 11px;
        color: var(--text-secondary);
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .control-val {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--accent-cyan);
        font-weight: 600;
        text-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    /* Custom Sliders */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin: 0;
        cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -6px; 
        box-shadow: 0 0 15px rgba(255,255,255,0.6);
        transition: transform 0.1s;
        border: 2px solid rgba(0,0,0,0.2);
    }
    
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
    }

    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
    }
    
    /* Action Buttons */
    .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
    }

    button {
        padding: 12px 0;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.02);
        color: var(--text-secondary);
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    button:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
        border-color: rgba(255,255,255,0.3);
        box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }

    button:active {
        transform: scale(0.95);
    }

    button.primary {
        background: rgba(0, 243, 255, 0.1);
        border-color: rgba(0, 243, 255, 0.4);
        color: var(--accent-cyan);
    }
    
    button.primary:hover {
        background: rgba(0, 243, 255, 0.2);
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
        border-color: var(--accent-cyan);
    }
    
    /* Paused State */
    button.active-pause {
        background: rgba(255, 0, 170, 0.1);
        border-color: rgba(255, 0, 170, 0.4);
        color: var(--accent-magenta);
    }
    
    button.active-pause:hover {
        background: rgba(255, 0, 170, 0.2);
        box-shadow: 0 0 25px rgba(255, 0, 170, 0.2);
        border-color: var(--accent-magenta);
    }

    /* Responsive */
    @media (max-width: 900px) {
        #controls {
            top: auto;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    }
</style>
</head>
<body>

<div id="app">
    <canvas id="canvas"></canvas>

    <div id="controls">
        <div class="header">
            <h1>Automata Sphere</h1>
            <div class="status-indicator" id="statusLight"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">Population</span>
                <span class="stat-value" id="popCount">0000</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Generation</span>
                <span class="stat-value" id="genCount">0000</span>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span class="control-label">Simulation Speed</span>
                <span class="control-val" id="speedVal">50%</span>
            </div>
            <input type="range" id="speed" min="1" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span class="control-label">Spawn Density</span>
                <span class="control-val" id="densityVal">45%</span>
            </div>
            <input type="range" id="density" min="10" max="90" value="45">
        </div>

        <div class="btn-row">
            <button id="btnReset">Random</button>
            <button id="btnStep">Step</button>
            <button id="btnPause" class="primary">Pause</button>
        </div>
    </div>
</div>

<script>
    /**
     * Configuration & State
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // High Density Grid: 160x320 = 51,200 cells for dense texture
    const RINGS = 160; 
    const SEGMENTS = 320; 
    const TOTAL_CELLS = RINGS * SEGMENTS;
    
    // Game State
    let width, height;
    let cx, cy;
    let radius;
    
    // Grids (Int8Array for performance)
    let grid = new Int8Array(TOTAL_CELLS);
    let nextGrid = new Int8Array(TOTAL_CELLS);
    
    // Cell Age for Color Logic (0 = newborn, >0 = aging)
    let cellAge = new Int16Array(TOTAL_CELLS);
    let nextAge = new Int16Array(TOTAL_CELLS);
    
    let generation = 0;
    let isPaused = false;
    let frameCount = 0;
    let lastTime = 0;
    
    // Visual Parameters
    let rotationSpeed = 0.0008; // Slow majestic rotation
    let simSpeed = 50; 
    let cellDensity = 0.45;
    let rotY = 0;
    let rotX = 0.1; 
    
    // Interaction State
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    /**
     * Initialization
     */
    function init() {
        resize();
        window.addEventListener('resize', resize);
        randomizeGrid();
        setupControls();
        setupInteraction();
        requestAnimationFrame(loop);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        cx = width / 2;
        cy = height / 2;
        // Sphere takes up more space now, responsive to layout
        radius = Math.min(width, height) * 0.38;
    }

    function randomizeGrid() {
        generation = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            // Random state
            const isAlive = Math.random() < cellDensity ? 1 : 0;
            grid[i] = isAlive;
            // Reset age
            cellAge[i] = isAlive ? 0 : -1;
        }
        updateStats();
    }

    /**
     * Math & Geometry
     */
    
    // Pre-calculate static sphere coordinates
    const cellCoords = new Float32Array(TOTAL_CELLS * 3); // x, y, z per cell
    
    function precalculateCoords() {
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const ring = i % RINGS;
            const segment = Math.floor(i / RINGS);
            
            const phi = (ring / RINGS) * Math.PI;
            const theta = (segment / SEGMENTS) * 2 * Math.PI;
            
            const idx3 = i * 3;
            cellCoords[idx3] = Math.sin(phi) * Math.cos(theta);     // x
            cellCoords[idx3 + 1] = Math.cos(phi);                  // y
            cellCoords[idx3 + 2] = Math.sin(phi) * Math.sin(theta); // z
        }
    }
    precalculateCoords();

    function project(x, y, z) {
        // Perspective projection
        const fov = 2.2; // Camera distance
        const zOffset = fov + z; 
        const scale = radius * (fov / zOffset);
        
        return {
            x: cx + x * scale,
            y: cy - y * scale, 
            scale: scale,
            depth: z
        };
    }

    /**
     * Game Logic
     */
    function step() {
        for (let r = 0; r < RINGS; r++) {
            for (let s = 0; s < SEGMENTS; s++) {
                const idx = r * SEGMENTS + s;
                const state = grid[idx];
                
                let neighbors = 0;
                
                // Offsets
                const rPrev = (r - 1 + RINGS) % RINGS;
                const rNext = (r + 1) % RINGS;
                const sPrev = (s - 1 + SEGMENTS) % SEGMENTS;
                const sNext = (s + 1) % SEGMENTS;

                // Row Above
                neighbors += grid[rPrev * SEGMENTS + sPrev];
                neighbors += grid[rPrev * SEGMENTS + s];
                neighbors += grid[rPrev * SEGMENTS + sNext];
                
                // Same Row
                neighbors += grid[r * SEGMENTS + sPrev];
                neighbors += grid[r * SEGMENTS + sNext];
                
                // Row Below
                neighbors += grid[rNext * SEGMENTS + sPrev];
                neighbors += grid[rNext * SEGMENTS + s];
                neighbors += grid[rNext * SEGMENTS + sNext];

                // Rules
                let nextState = 0;
                if (state === 1) {
                    nextState = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextState = (neighbors === 3) ? 1 : 0;
                }
                
                nextGrid[idx] = nextState;

                // Age Logic
                if (nextState === 1) {
                    if (state === 0) {
                        // Reborn
                        nextAge[idx] = 0;
                    } else {
                        // Aging
                        nextAge[idx] = cellAge[idx] + 1;
                    }
                } else {
                    // Dead
                    nextAge[idx] = -1;
                }
            }
        }
        
        // Swap Grids
        let tempG = grid; grid = nextGrid; nextGrid = tempG;
        let tempA = cellAge; cellAge = nextAge; nextAge = tempA;
        
        generation++;
        updateStats();
    }

    /**
     * Rendering
     */
    function draw() {
        // Clear with deep dark background
        ctx.fillStyle = '#050508'; 
        ctx.fillRect(0, 0, width, height);
        
        // Update Rotation
        if (!isDragging) {
            rotY += rotationSpeed;
        }

        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);

        // 1. Volumetric Atmosphere (The "Glow")
        // A large soft gradient behind the sphere to sell the 3D volume
        const grad = ctx.createRadialGradient(cx, cy, radius * 0.4, cx, cy, radius * 2.0);
        grad.addColorStop(0, 'rgba(100, 0, 255, 0.12)'); // Purple core
        grad.addColorStop(0.4, 'rgba(0, 243, 255, 0.04)'); // Cyan mid
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 2.0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Draw Alive Cells
        // Use additive blending for "Bioluminescence" effect
        ctx.globalCompositeOperation = 'lighter';

        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (!grid[i]) continue;

            // Get base coords
            const idx3 = i * 3;
            let x = cellCoords[idx3];
            let y = cellCoords[idx3 + 1];
            let z = cellCoords[idx3 + 2];

            // Rotate Y
            let x1 = x * cosY - z * sinY;
            let z1 = x * sinY + z * cosY;
            
            // Rotate X
            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;

            // Cull back face
            if (z2 < 0.05) continue;

            const proj = project(x1, y2, z2);

            // Size logic: 
            // Smaller cells generally, but scale up significantly near front for "pop"
            // Base size is small to accommodate high density
            const baseSize = 1.5; 
            const size = Math.max(0.6, baseSize * (proj.scale / radius));

            // COLOR SYSTEM: Dynamic based on Age (Chromatic Life)
            const age = cellAge[i];
            let r, g, b;

            if (age === 0) {
                // Newborn: White/Hot
                r = 255; g = 255; b = 255;
            } else if (age < 15) {
                // Young: Cyan -> Blue
                const t = age / 15;
                r = 0; 
                g = 243 * (1 - t) + 0 * t; // Cyan to Blue
                b = 255; 
            } else if (age < 45) {
                // Adult: Blue -> Violet -> Magenta
                const t = (age - 15) / 30;
                r = 0 * (1 - t) + 255 * t;
                g = 0;
                b = 255 * (1 - t) + 170 * t;
            } else {
                // Elder: Magenta -> Deep Red/Brown (dying)
                const t = Math.min(1, (age - 45) / 30);
                r = 255;
                g = 0;
                b = 170 * (1 - t);
            }

            // Depth shading: darker in the back
            const intensity = z2; // 0 to 1
            const brightness = 0.3 + (intensity * 0.7); // 30% to 100% brightness

            // Alpha: Fade back slightly
            const alpha = 0.6 + (intensity * 0.4);

            ctx.fillStyle = `rgba(${Math.floor(r*brightness)}, ${Math.floor(g*brightness)}, ${Math.floor(b*brightness)}, ${alpha})`;
            
            ctx.beginPath();
            ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
            ctx.fill();
            
            // "Hotspot" / Bloom for very close cells
            if (intensity > 0.85) {
                // Smaller, white core for depth
                const coreAlpha = (intensity - 0.85) * 5;
                ctx.fillStyle = `rgba(255, 255, 255, ${coreAlpha})`;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Reset blend mode
        ctx.globalCompositeOperation = 'source-over';
        
        // 3. Rim Light / Atmosphere
        // Adds 3D volume by defining the edge
        const rimGrad = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.1);
        rimGrad.addColorStop(0, 'rgba(0, 243, 255, 0)');
        rimGrad.addColorStop(0.8, 'rgba(100, 0, 255, 0.15)');
        rimGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = rimGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.1, 0, Math.PI * 2);
        ctx.fill();
        
        // Thin crisp silhouette
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
    }

    function loop(timestamp) {
        if (timestamp) {
            lastTime = timestamp;
        }

        if (!isPaused) {
            // Throttle Logic
            const divisor = Math.max(1, Math.floor(20 - (simSpeed / 5.5)));
            
            if (frameCount % divisor === 0) {
                step();
            }
            frameCount++;
        }
        
        draw();
        requestAnimationFrame(loop);
    }

    /**
     * UI & Controls
     */
    function setupControls() {
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseInt(e.target.value);
            speedVal.innerText = simSpeed + '%';
        });

        const densitySlider = document.getElementById('density');
        const densityVal = document.getElementById('densityVal');
        densitySlider.addEventListener('input', (e) => {
            cellDensity = parseInt(e.target.value) / 100;
            densityVal.innerText = e.target.value + '%';
        });

        const btnReset = document.getElementById('btnReset');
        btnReset.addEventListener('click', () => {
            randomizeGrid();
        });
        
        const btnStep = document.getElementById('btnStep');
        btnStep.addEventListener('click', () => {
            isPaused = true;
            updatePauseBtn();
            step();
        });

        const btnPause = document.getElementById('btnPause');
        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseBtn();
        });
    }
    
    function updatePauseBtn() {
        const btn = document.getElementById('btnPause');
        const light = document.getElementById('statusLight');
        if (isPaused) {
            btn.innerText = "Play";
            btn.classList.remove('primary');
            btn.classList.add('active-pause');
            light.style.backgroundColor = "var(--accent-magenta)";
            light.style.boxShadow = "0 0 8px var(--accent-magenta)";
        } else {
            btn.innerText = "Pause";
            btn.classList.add('primary');
            btn.classList.remove('active-pause');
            light.style.backgroundColor = "var(--accent-cyan)";
            light.style.boxShadow = "0 0 8px var(--accent-cyan)";
        }
    }

    function setupInteraction() {
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }, {passive: false});

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                
                rotY += deltaX * 0.005;
                rotX += deltaY * 0.005;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        }, {passive: false});
    }

    function updateStats() {
        let pop = 0;
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (grid[i]) pop++;
        }
        document.getElementById('popCount').innerText = pop.toString().padStart(4, '0');
        document.getElementById('genCount').innerText = generation.toString().padStart(4, '0');
    }

    // Start
    init();

</script>
</body>
</html>
