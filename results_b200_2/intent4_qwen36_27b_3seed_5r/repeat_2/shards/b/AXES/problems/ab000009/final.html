<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: "Modern Tournament" - High Contrast, Deep Slate & Cream */
            --bg-app: #121214; 
            --bg-panel: #1e1e20;
            --bg-panel-border: #2a2a2e;
            
            /* Board Colors: Deep Slate & Warm Cream */
            --board-dark: #475767; 
            --board-light: #e8e3d9;
            --board-border: #151515;
            
            /* Highlights & Accents */
            --highlight-selection: rgba(212, 175, 55, 0.5);
            --highlight-move: rgba(212, 175, 55, 0.2);
            --accent-gold: #d4af37;
            --text-main: #e4e4e7;
            --text-muted: #71717a;
            
            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-score: "Georgia", "Times New Roman", serif;
            
            /* Dimensions */
            --board-size: clamp(320px, 75vmin, 680px);
            --radius-lg: 12px;
            --radius-md: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1e1e20 0%, #09090a 100%);
        }

        /* Main Layout Container */
        .interface-container {
            display: flex;
            gap: 40px;
            align-items: center;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            justify-content: center;
        }

        /* --- The Chessboard --- */
        .board-wrapper {
            position: relative;
            background: var(--board-border);
            padding: 8px;
            border-radius: 4px;
            box-shadow: 
                0 20px 50px -10px rgba(0,0,0,0.7),
                0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            position: relative;
            background-color: var(--board-border);
            border: 2px solid #000;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        /* Board Palette */
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Interaction States */
        .square.selected {
            background-color: var(--highlight-selection) !important;
        }
        
        /* Legal Move Indicators */
        .legal-move::after {
            content: '';
            position: absolute;
            width: 26%;
            height: 26%;
            background-color: rgba(0,0,0,0.15);
            border-radius: 50%;
            pointer-events: none;
        }
        .square.dark .legal-move::after { background-color: rgba(0,0,0,0.25); }

        /* Capture indicator ring */
        .legal-move.capture::after {
            background-color: transparent;
            border: 4px solid rgba(0,0,0,0.15);
            width: 80%;
            height: 80%;
        }
        .square.dark .legal-move.capture::after { border-color: rgba(0,0,0,0.25); }

        /* Coordinates - High Contrast & Legible */
        .coord {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 800;
            pointer-events: none;
            line-height: 1;
            z-index: 1;
            font-family: var(--font-ui);
        }
        .coord.rank { top: 4px; left: 5px; }
        .coord.file { bottom: 4px; right: 5px; }
        
        /* Dynamic coloring for coordinates based on square */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); opacity: 0.8; }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
            /* Unified, subtle drop shadow */
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4)); 
        }
        .piece:active { cursor: grabbing; transform: scale(1.1); }
        .piece svg { width: 100%; height: 100%; display: block; }

        /* --- Side Panel --- */
        .panel {
            width: 380px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: var(--board-size);
            border: 1px solid var(--bg-panel-border);
        }

        /* Header / Status */
        .panel-header {
            padding: 24px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--bg-panel-border);
        }

        .game-title {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-title::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: #22c55e; /* Green dot for "Live" */
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            transition: all 0.3s ease;
            background: transparent;
        }

        /* Active Player State - Subtle Background, High Contrast Text */
        .player-row.active {
            background: rgba(255,255,255,0.03);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .player-avatar {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
            position: relative;
        }

        /* The "Active" Indicator - Gold Border */
        .player-row.active .player-avatar {
            border-color: var(--accent-gold);
            background: #222;
        }

        .player-avatar svg { width: 24px; height: 24px; opacity: 0.9; }

        .player-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            letter-spacing: 0.2px;
        }
        
        .player-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-ui);
            margin-top: 2px;
        }
        
        .player-row.active .player-status {
            color: var(--accent-gold);
            font-weight: 500;
        }

        .timer {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 1.2rem;
            background: #111113;
            padding: 8px 16px;
            border-radius: 6px;
            color: #555;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.03);
            min-width: 80px;
            text-align: center;
            transition: all 0.3s;
        }
        
        /* Active Timer Highlight */
        .player-row.active .timer {
            color: #fff;
            background: #000;
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
        }

        /* Move History */
        .history-container {
            flex: 1;
            overflow-y: auto;
            background: #161618;
            position: relative;
            border-top: 1px solid var(--bg-panel-border);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .history-table th {
            text-align: left;
            padding: 12px 24px;
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: sticky;
            top: 0;
            background: #161618;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-weight: 700;
            z-index: 10;
            font-family: var(--font-ui);
        }

        .history-table td {
            padding: 10px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            font-family: var(--font-score); 
            color: var(--text-main);
            font-size: 1.1rem;
        }
        
        /* Alternating row colors */
        .history-table tr:nth-child(even) {
            background-color: rgba(255,255,255,0.01);
        }
        
        .history-table td:first-child { 
            color: var(--text-muted); 
            width: 50px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 600;
            border-right: 1px solid rgba(255,255,255,0.05);
            padding-right: 16px;
            text-align: center;
        }

        /* Empty State */
        .history-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            opacity: 0.5;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            font-family: var(--font-score);
            font-style: italic;
        }

        /* Controls */
        .controls {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--bg-panel-border);
            background: var(--bg-panel);
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-muted);
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-family: var(--font-ui);
        }

        .btn:hover { background: rgba(255,255,255,0.08); color: var(--text-main); border-color: rgba(255,255,255,0.2); }
        
        /* Primary Action - Solid Gold/White */
        .btn-primary {
            background: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            color: #111;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .btn-primary:hover { 
            background: #eac54e; 
            color: #000; 
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
        }

        .btn-danger { 
            color: #ef4444; 
            border-color: rgba(239, 68, 68, 0.2); 
            background: rgba(239, 68, 68, 0.05);
        }
        .btn-danger:hover { 
            background: rgba(239, 68, 68, 0.15); 
            color: #fff; 
            border-color: #ef4444; 
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        @media (max-width: 900px) {
            .interface-container { flex-direction: column; gap: 24px; }
            .panel { width: var(--board-size); height: auto; max-height: 400px; }
            .controls { padding: 16px; }
        }
    </style>
</head>

    <div class="interface-container">

        <div class="board-wrapper">
            <div class="chessboard" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="game-title">Grandmaster • Classical</div>
                
                <!-- Top Player (Black) -->
                <div class="player-row" id="player-black-row">
                    <div class="player-info">
                        <div class="player-avatar">
                            <!-- Simple Pawn Icon for Avatar -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-1v1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1h1v-1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/><path d="M8 21h8"/></svg>
                        </div>
                        <div>
                            <div class="player-name">Black</div>
                            <div class="player-status">Waiting</div>
                        </div>
                    </div>
                    <div class="timer" id="timer-black">10:00</div>
                </div>

                <!-- Bottom Player (White - Active) -->
                <div class="player-row active" id="player-white-row">
                    <div class="player-info">
                        <div class="player-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-1v1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1h1v-1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/><path d="M8 21h8"/></svg>
                        </div>
                        <div>
                            <div class="player-name">White</div>
                            <div class="player-status" id="turn-text">To Move</div>
                        </div>
                    </div>
                    <div class="timer" id="timer-white">10:00</div>
                </div>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>White</th>
                            <th>Black</th>
                        </tr>
                    </thead>
                    <tbody id="move-history">
                        <!-- Moves will appear here -->
                    </tbody>
                </table>
                <div id="history-placeholder" class="history-empty">
                    <span>Game started.<br>White to move.</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
                <div class="control-group">
                    <button class="btn">Flip Board</button>
                    <button class="btn btn-danger">Resign</button>
                </div>
            </div>
        </div>

    </div>

    // --- Game State ---
    // Standard Starting Position:
    // Row 0: Black Back Rank
    // Row 1: Black Pawns
    // Row 6: White Pawns
    // Row 7: White Back Rank
    const initialBoard = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Black (row 0)
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // White (row 7)
    ];

    const boardEl = document.getElementById('board');
    const moveHistoryEl = document.getElementById('move-history');
    const historyPlaceholder = document.getElementById('history-placeholder');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    let selectedSquare = null;

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = row;
                square.dataset.col = col;

                // Interaction Handler
                square.addEventListener('click', handleSquareClick);

                // Coordinates
                if (col === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - row;
                    square.appendChild(rank);
                }
                if (row === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = files[col];
                    square.appendChild(file);
                }

                // Piece Placement
                const pieceCode = initialBoard[row][col];
                if (pieceCode) {
                    const pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    
                    // Determine color based on position for the initial setup
                    let color = 'w';
                    if (row < 2) color = 'b';
                    else if (row > 5) color = 'w';

                    pieceDiv.innerHTML = pieces[color][pieceCode];
                    square.appendChild(pieceDiv);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function handleSquareClick(e) {
        const square = e.currentTarget;
        const row = parseInt(square.dataset.row);
        const col = parseInt(square.dataset.col);

        // If clicking the same square, deselect
        if (selectedSquare && selectedSquare.row === row && selectedSquare.col === col) {
            clearSelection();
            return;
        }

        // If clicking a different square, move piece (Simulated)
        if (selectedSquare) {
            movePiece(selectedSquare.row, selectedSquare.col, row, col);
            clearSelection();
        } 
        // If clicking a new square with a piece, select it
        else if (initialBoard[row][col] !== '') {
            selectSquare(row, col);
        }
    }

    function selectSquare(row, col) {
        selectedSquare = { row, col };
        const squares = document.querySelectorAll('.square');
        
        // Highlight selected square
        const index = row * 8 + col;
        squares[index].classList.add('selected');

        // Simulate Legal Move Indicators (Random dots for demo)
        // In a real game, this would be generated by a chess engine
        const legalMoves = [
            (row - 1) * 8 + col, // Forward
            (row - 2) * 8 + col, // Double Forward
            row * 8 + (col + 1), // Right
            row * 8 + (col - 1)  // Left
        ];

        legalMoves.forEach(idx => {
            if (idx >= 0 && idx < 64) {
                squares[idx].classList.add('legal-move');
                // Add capture ring if target has piece
                if (initialBoard[Math.floor(idx/8)][idx%8] !== '') {
                    squares[idx].classList.add('capture');
                }
            }
        });
    }

    function clearSelection() {
        selectedSquare = null;
        document.querySelectorAll('.square').forEach(sq => {
            sq.classList.remove('selected');
            sq.classList.remove('legal-move');
            sq.classList.remove('capture');
        });
    }

    function movePiece(fromRow, fromCol, toRow, toCol) {
        // Visual Move
        const pieceCode = initialBoard[fromRow][fromCol];
        initialBoard[toRow][toCol] = pieceCode;
        initialBoard[fromRow][fromCol] = '';
        
        renderBoard();

        // Add to History
        const moveNumber = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        const notation = `${files[fromCol]}${8-fromRow}→${files[toCol]}${8-toRow}`;
        
        historyPlaceholder.style.display = 'none';
        
        if (moveNumber % 2 !== 0) {
            // White move starts a new row
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${moveNumber}.</td><td>${notation}</td><td></td>`;
            moveHistoryEl.appendChild(tr);
            switchTurn('b');
        } else {
            // Black move fills the second column
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) lastRow.children[2].innerText = notation;
            switchTurn('w');
        }
        
        // Scroll to bottom
        const container = document.querySelector('.history-container');
        container.scrollTop = container.scrollHeight;
    }

    function switchTurn(player) {
        const whiteRow = document.getElementById('player-white-row');
        const blackRow = document.getElementById('player-black-row');
        const turnText = document.getElementById('turn-text');
        
        if (player === 'w') {
            whiteRow.classList.add('active');
            blackRow.classList.remove('active');
            turnText.innerText = "To Move";
        } else {
            blackRow.classList.add('active');
            whiteRow.classList.remove('active');
            turnText.innerText = "Waiting"; // In a real game, Black is "To Move"
        }
    }

    function resetGame() {
        // Reset Board State
        initialBoard.forEach(row => row.fill(''));
        initialBoard[0] = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
        initialBoard[1] = ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'];
        initialBoard[6] = ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'];
        initialBoard[7] = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];

        // Clear history
        moveHistoryEl.innerHTML = '';
        historyPlaceholder.style.display = 'flex';
        
        // Reset Turn Indicator
        switchTurn('w');
        
        // Animate reset
        boardEl.style.opacity = '0.8';
        setTimeout(() => {
            renderBoard();
            boardEl.style.opacity = '1';
        }, 150);
    }

    // Initial Render
    renderBoard();

</script>
