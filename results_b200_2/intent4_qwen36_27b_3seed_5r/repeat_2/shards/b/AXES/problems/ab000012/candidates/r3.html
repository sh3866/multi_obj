<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-accent: #1a0b2e;
            --gold-bright: #fff0a8;
            --gold-primary: #f2c94c;
            --gold-dark: #8a6d18;
            --gold-dim: #4a3b0a;
            
            --mystic-blue: #4deeea;
            --mystic-purple: #b967ff;
            
            --glass-bg: rgba(15, 15, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --text-main: #eef2f6;
            --text-muted: #9ba4b5;
            
            --font-display: 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
            --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 30%, #2a1645 0%, #0d0d14 60%, #000000 100%);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERE & LAYERS --- */
        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            z-index: 1;
            pointer-events: none;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        }

        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            z-index: 2;
            pointer-events: none;
        }

        /* --- MAIN LAYOUT --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            justify-content: space-between;
        }

        /* --- TOP BAR (Currency) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            animation: fadeSlideDown 0.8s var(--ease-smooth) backwards;
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(40, 30, 10, 0.8), rgba(10, 10, 10, 0.9));
            border: 1px solid var(--gold-dim);
            padding: 6px 16px 6px 8px;
            border-radius: 50px; /* Pill shape */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        /* Gold shimmer on currency */
        .currency-pill::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 4s infinite;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 5px var(--gold-primary));
            animation: pulse-coin 2s infinite alternate;
        }

        .currency-val {
            font-family: var(--font-ui);
            font-size: 1.1rem;
            color: var(--gold-bright);
            font-weight: 700;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- HERO AREA --- */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0.5rem 0;
        }

        .title-group {
            text-align: center;
            z-index: 2;
            margin-bottom: 1rem;
            animation: fadeSlideDown 1s var(--ease-smooth) 0.2s backwards;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ffffff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 10px 40px rgba(0,0,0,0.8);
            margin: 0;
            line-height: 1;
            position: relative;
        }

        /* Runes decoration on title */
        .game-title::after {
            content: '⟡';
            display: block;
            font-size: 1rem;
            color: var(--gold-primary);
            margin-top: 5px;
            -webkit-background-clip: initial;
            color: var(--gold-primary);
            text-shadow: 0 0 10px var(--gold-primary);
            opacity: 0.8;
        }

        .game-subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            color: var(--mystic-blue);
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 8px;
            text-shadow: 0 0 10px var(--mystic-blue);
            font-weight: 300;
        }

        /* The Ritual Artifact */
        .artifact-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            animation: float 6s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }

        /* Complex Core */
        .rune-core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, var(--mystic-blue), #2e385c);
            box-shadow: 
                0 0 30px rgba(77, 238, 234, 0.4),
                0 0 80px rgba(77, 238, 234, 0.2),
                inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            z-index: 5;
            animation: pulse-core 4s ease-in-out infinite;
        }

        /* Rotating Rings */
        .rune-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        /* Geometric Ring 1 */
        .ring-1 {
            width: 180px; height: 180px;
            border: 2px solid transparent;
            border-top-color: var(--gold-primary);
            border-right-color: var(--gold-dim);
            border-bottom-color: transparent;
            border-left-color: var(--gold-dim);
            border-radius: 40% 60% 50% 50%;
            animation: spin 12s linear infinite;
            filter: drop-shadow(0 0 5px var(--gold-primary));
        }

        /* Geometric Ring 2 */
        .ring-2 {
            width: 230px; height: 230px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            animation: spin-reverse 25s linear infinite;
        }
        
        /* Geometric Ring 3 (Pentagon-ish) */
        .ring-3 {
            width: 140px; height: 140px;
            border: 1px solid rgba(77, 238, 234, 0.3);
            border-radius: 30%;
            animation: spin 20s linear infinite reverse;
        }

        /* --- PRIMARY ACTION (Summon) --- */
        .cta-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            animation: fadeSlideUp 1s var(--ease-smooth) 0.4s backwards;
        }

        .btn-summon {
            width: 100%;
            max-width: 320px;
            padding: 20px 24px;
            background: linear-gradient(180deg, rgba(60, 50, 20, 0.9), rgba(20, 15, 5, 0.95));
            border: 1px solid var(--gold-primary);
            border-top: 1px solid var(--gold-bright);
            border-bottom: 1px solid var(--gold-dim);
            border-radius: 8px; /* Unified radius */
            color: var(--gold-bright);
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s var(--ease-elastic);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.6),
                0 0 15px rgba(197, 160, 41, 0.15),
                inset 0 1px 0 rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 20;
        }

        /* Inner glow for Summon button */
        .btn-summon::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.15), transparent 70%);
            pointer-events: none;
        }

        .btn-summon:hover {
            background: linear-gradient(180deg, rgba(80, 70, 30, 0.95), rgba(30, 25, 10, 0.95));
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.7),
                0 0 25px var(--gold-primary),
                inset 0 0 15px rgba(255, 215, 0, 0.3);
            transform: translateY(-3px) scale(1.02);
            text-shadow: 0 0 10px var(--gold-bright);
            border-color: #fff;
        }

        .btn-summon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px var(--gold-primary));
        }

        /* --- SECONDARY MENU GRID (Runic Dock) --- */
        /* Critique Fix: Unified Container */
        .dock-container {
            background: rgba(10, 10, 15, 0.4);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 1.5rem 0.5rem 2rem 0.5rem;
            backdrop-filter: blur(10px);
            border-radius: 20px 20px 0 0;
            animation: fadeSlideUp 1s var(--ease-smooth) 0.6s backwards;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .menu-card {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid var(--glass-border);
            border-bottom: 2px solid rgba(0,0,0,0.5);
            border-radius: 8px; /* Unified radius */
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s var(--ease-elastic);
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Card Hover Effects */
        .menu-card:hover {
            background: rgba(40, 40, 60, 0.9);
            border-color: var(--glass-highlight);
            border-bottom-color: var(--mystic-blue);
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5), 0 0 10px rgba(77, 238, 234, 0.1);
        }

        /* Distinct Colors for Icons */
        .card-icon {
            width: 26px;
            height: 26px;
            stroke-width: 1.5;
            fill: none;
            transition: all 0.2s;
        }

        /* Roster - Blue */
        .card-roster .card-icon { stroke: var(--mystic-blue); }
        .card-roster:hover .card-icon { filter: drop-shadow(0 0 6px var(--mystic-blue)); stroke: #fff; }
        
        /* Battle - Red/Orange */
        .card-battle .card-icon { stroke: #ff5e5e; }
        .card-battle:hover .card-icon { filter: drop-shadow(0 0 6px #ff5e5e); stroke: #fff; }
        
        /* Grind - Green/Teal */
        .card-grind .card-icon { stroke: #5effb0; }
        .card-grind:hover .card-icon { filter: drop-shadow(0 0 6px #5effb0); stroke: #fff; }

        .card-label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .menu-card:hover .card-label {
            color: var(--text-main);
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        /* --- ANIMATIONS --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse-core {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px rgba(77, 238, 234, 0.6); }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        
        @keyframes pulse-coin {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-height: 700px) {
            .game-title { font-size: 2.5rem; }
            .artifact-container { width: 200px; height: 200px; margin-bottom: 0.5rem; }
            .ring-1 { width: 130px; height: 130px; }
            .ring-2 { width: 170px; height: 170px; }
            .ring-3 { width: 100px; height: 100px; }
            .rune-core { width: 60px; height: 60px; }
            .btn-summon { padding: 14px; font-size: 1.2rem; }
            .menu-grid { gap: 8px; }
            .menu-card { padding: 10px 4px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND EFFECTS -->
    <canvas id="canvas-layer"></canvas>
    <div class="vignette"></div>
    <div class="noise"></div>

    <div class="app-container">
        
        <!-- TOP BAR -->
        <div class="top-bar">
            <!-- Decorative element to balance layout -->
            <div style="width: 24px; height: 24px; opacity: 0.3;">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>

            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </div>

        <!-- HERO AREA -->
        <div class="hero-section">
            
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>

            <!-- The Ritual Artifact -->
            <div class="artifact-container" id="artifact">
                <div class="rune-ring ring-3"></div>
                <div class="rune-ring ring-1"></div>
                <div class="rune-ring ring-2"></div>
                <div class="rune-core"></div>
            </div>

            <!-- Primary Action (Summon) -->
            <div class="cta-container">
                <button class="btn-summon">
                    <svg viewBox="0 0 24 24">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Summon
                </button>
            </div>

        </div>

        <!-- SECONDARY MENU GRID (Runic Dock) -->
        <div class="dock-container">
            <nav class="menu-grid">
                
                <div class="menu-card card-roster">
                    <!-- Roster Icon (Scroll/Book) -->
                    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        <line x1="8" y1="7" x2="16" y2="7"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>

                <div class="menu-card card-battle">
                    <!-- Battle Icon (Swords) -->
                    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
                        <line x1="13" y1="19" x2="19" y2="13"></line>
                        <line x1="16" y1="16" x2="20" y2="20"></line>
                        <line x1="19" y1="21" x2="21" y2="19"></line>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>

                <div class="menu-card card-grind">
                    <!-- Grind Icon (Anvil/Tool) -->
                    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>

            </nav>
        </div>

    </div>

    <script>
        /**
         * ATMOSPHERIC PARTICLES
         * Floating embers and arcane dust
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = -(Math.random() * 0.8 + 0.2);
                this.size = Math.random() * 2 + 0.5;
                this.life = 0;
                this.maxLife = Math.random() * 250 + 150;
                
                // Mix of Gold and Mystic Blue
                const isGold = Math.random() > 0.4;
                this.colorBase = isGold ? '242, 201, 76' : '77, 238, 234';
                this.color = `rgba(${this.colorBase}, `; 
            }
            
            update() {
                this.x += this.vx + Math.sin(this.life * 0.02) * 0.2;
                this.y += this.vy;
                this.life++;
                
                if (this.life > this.maxLife || this.y < -20) {
                    this.reset();
                }
            }
            
            draw() {
                const alpha = (1 - (this.life / this.maxLife)) * 0.6;
                ctx.fillStyle = this.color + alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            // High density for atmosphere
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Subtle Mouse Interaction on Artifact
        const artifact = document.getElementById('artifact');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            artifact.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
