<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette - Eldritch & Gold */
            --bg-deep: #050508;
            --bg-panel: rgba(12, 15, 24, 0.75);
            
            /* Gold Hierarchy */
            --gold-bright: #fff2cc;
            --gold-primary: #f2c94c;
            --gold-dark: #8a6d18;
            --gold-dim: #3d3008;
            
            /* Mystic Accents */
            --mystic-blue: #4deeea;
            --mystic-purple: #b967ff;
            
            /* UI Materials */
            --glass-border: rgba(242, 201, 76, 0.25);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            
            --text-main: #eef2f6;
            --text-muted: #8b9bb4;
            
            /* Typography - System Fonts only */
            --font-display: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif;
            --font-ui: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            /* Deep velvet texture via gradient */
            background-image: 
                radial-gradient(circle at 50% 30%, #1a1025 0%, #0d0d14 60%, #000000 100%);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERE LAYERS --- */
        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            z-index: 1;
            pointer-events: none;
        }

        /* Grain for texture */
        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.07; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            justify-content: space-between; /* Push header top, menu bottom */
        }

        /* --- TOP HEADER (Grouped Context) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0 2rem 0;
            animation: fadeSlideDown 0.8s var(--ease-smooth) backwards;
        }

        .logo-mark {
            font-family: var(--font-display);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-transform: uppercase;
            border-left: 2px solid var(--gold-dim);
            padding-left: 10px;
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            /* Anchored UI Style */
            background: linear-gradient(90deg, rgba(10, 12, 20, 0.8), rgba(20, 20, 25, 0.4));
            border: 1px solid var(--gold-dim);
            border-right: 1px solid var(--gold-primary);
            padding: 6px 18px 6px 10px;
            border-radius: 4px 20px 20px 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .currency-pill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 1px; height: 100%;
            background: var(--gold-bright);
            box-shadow: 0 0 8px var(--gold-bright);
        }

        .coin-icon {
            width: 18px;
            height: 18px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 2px var(--gold-primary));
        }

        .currency-val {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--gold-bright);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- HERO AREA (Atmosphere) --- */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 1rem 0;
        }

        .title-group {
            text-align: center;
            z-index: 2;
            margin-bottom: 2rem;
            animation: fadeSlideDown 1s var(--ease-smooth) 0.2s backwards;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.02em; /* Tightened */
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ffffff 0%, #dcdcdc 40%, #999999 100%);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 10px 40px rgba(0,0,0,0.8);
            margin: 0;
            line-height: 0.9;
            filter: drop-shadow(0 2px 0px rgba(255,255,255,0.1));
        }

        .game-subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            color: var(--mystic-blue);
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 12px;
            text-shadow: 0 0 15px rgba(77, 238, 234, 0.5);
            font-weight: 500;
        }

        /* --- RITUAL ARTIFACT (Complex Hero Graphic) --- */
        .artifact-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            animation: float 6s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }

        /* The Core: Pulsing Eye */
        .rune-core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, var(--mystic-blue) 20%, #2e385c 60%, #000 100%);
            box-shadow: 
                0 0 50px rgba(77, 238, 234, 0.5),
                0 0 120px rgba(77, 238, 234, 0.2),
                inset 0 0 30px rgba(0,0,0,0.9);
            position: relative;
            z-index: 5;
            animation: pulse-core 4s ease-in-out infinite;
        }

        /* Rings - Constructed with SVG for precision */
        .rune-ring-svg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .ring-outer {
            width: 240px; height: 240px;
            animation: spin 40s linear infinite;
        }
        
        .ring-inner {
            width: 160px; height: 160px;
            animation: spin-reverse 20s linear infinite;
        }

        /* --- MAIN MENU (Cards System) --- */
        .menu-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-bottom: 2rem;
            animation: fadeSlideUp 1s var(--ease-smooth) 0.4s backwards;
        }

        /* CARD BASE STYLES (Unified Grammar) */
        .card-base {
            position: relative;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            transition: all 0.3s var(--ease-elastic);
            cursor: pointer;
            overflow: hidden;
            /* Subtle inner border for depth */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-base::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        /* PRIMARY CARD: SUMMON */
        .card-summon {
            width: 100%;
            padding: 20px 24px;
            background: linear-gradient(180deg, rgba(40, 35, 20, 0.9), rgba(20, 15, 5, 0.95));
            border: 1px solid var(--gold-primary);
            color: var(--gold-bright);
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 20;
        }

        .card-summon:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.6),
                0 0 25px rgba(242, 201, 76, 0.3),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
            border-color: var(--gold-bright);
            text-shadow: 0 0 10px var(--gold-bright);
        }

        .card-summon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--gold-bright);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px var(--gold-primary));
        }

        /* SECONDARY GRID */
        .secondary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        .menu-card {
            /* Inherits card-base, adds specific styling */
            background: var(--bg-panel);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-card:hover {
            background: rgba(30, 35, 50, 0.85);
            border-color: var(--mystic-blue);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card-icon {
            width: 28px;
            height: 28px;
            stroke: var(--text-muted);
            stroke-width: 1.5;
            fill: none;
            transition: all 0.3s;
        }

        .menu-card:hover .card-icon {
            stroke: var(--mystic-blue);
            filter: drop-shadow(0 0 6px var(--mystic-blue));
        }

        .card-label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .menu-card:hover .card-label {
            color: var(--text-main);
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        /* --- ANIMATIONS --- */
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse-core {
            0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 50px rgba(77, 238, 234, 0.5); }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 80px rgba(77, 238, 234, 0.8); }
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-height: 750px) {
            .game-title { font-size: 2.8rem; }
            .artifact-container { width: 220px; height: 220px; margin-bottom: 0.5rem; }
            .ring-outer { width: 190px; height: 190px; }
            .ring-inner { width: 130px; height: 130px; }
            .rune-core { width: 60px; height: 60px; }
            .menu-container { gap: 12px; }
            .card-summon { padding: 14px; font-size: 1.2rem; }
            .secondary-grid { gap: 8px; }
            .menu-card { padding: 12px 4px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <canvas id="canvas-layer"></canvas>
    <div class="vignette"></div>
    <div class="noise"></div>

    <div class="app-container">
        
        <!-- TOP HEADER -->
        <div class="top-bar">
            <div class="logo-mark">Aetheria</div>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </div>

        <!-- HERO AREA -->
        <div class="hero-section">
            
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>

            <!-- The Ritual Artifact (SVG Rings + CSS Core) -->
            <div class="artifact-container" id="artifact">
                
                <!-- Outer Rune Ring -->
                <svg class="rune-ring-svg ring-outer" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--gold-bright);stop-opacity:1" />
                            <stop offset="50%" style="stop-color:var(--gold-dim);stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:var(--gold-bright);stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                    <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 8" />
                    <!-- Geometric Accents -->
                    <path d="M100 10 L105 20 L95 20 Z" fill="var(--gold-primary)" />
                    <path d="M100 190 L105 180 L95 180 Z" fill="var(--gold-primary)" />
                    <path d="M10 100 L20 95 L20 105 Z" fill="var(--gold-primary)" />
                    <path d="M190 100 L180 95 L180 105 Z" fill="var(--gold-primary)" />
                </svg>

                <!-- Inner Rune Ring -->
                <svg class="rune-ring-svg ring-inner" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(77, 238, 234, 0.2)" stroke-width="1" />
                    <circle cx="100" cy="100" r="75" fill="none" stroke="var(--mystic-blue)" stroke-width="1" stroke-dasharray="20 10 5 10" opacity="0.7"/>
                    <!-- Hexagram overlay -->
                    <polygon points="100,25 165,137.5 35,137.5" fill="none" stroke="rgba(77, 238, 234, 0.3)" stroke-width="1" />
                    <polygon points="100,175 165,62.5 35,62.5" fill="none" stroke="rgba(77, 238, 234, 0.3)" stroke-width="1" />
                </svg>

                <div class="rune-core"></div>
            </div>

            <!-- MAIN MENU CARDS -->
            <div class="menu-container">
                
                <!-- Primary Card: Summon -->
                <button class="card-base card-summon">
                    <svg viewBox="0 0 24 24">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Summon
                </button>

                <!-- Secondary Cards: Roster, Battle, Grind -->
                <div class="secondary-grid">
                    
                    <div class="card-base menu-card card-roster">
                        <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span class="card-label">Roster</span>
                    </div>

                    <div class="card-base menu-card card-battle">
                        <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 17.5 3 6 3 3 6 3 17.5 14.5"></path>
                            <path d="M13 19 19 13"></path>
                            <path d="M16 16 20 20"></path>
                            <path d="M19 21 21 19"></path>
                            <path d="m2 2 12 12"></path>
                            <path d="m12 2 3 3"></path>
                            <path d="m16 6 3 3"></path>
                        </svg>
                        <span class="card-label">Battle</span>
                    </div>

                    <div class="card-base menu-card card-grind">
                        <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                        </svg>
                        <span class="card-label">Grind</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        /**
         * ATMOSPHERIC PARTICLES
         * Floating embers and arcane dust
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.vx = (Math.random() - 0.5) * 0.2; // Slower horizontal drift
                this.vy = -(Math.random() * 0.4 + 0.1); // Slower rise
                this.size = Math.random() * 1.5 + 0.5;
                this.life = 0;
                this.maxLife = Math.random() * 400 + 200;
                
                // Mix of Gold and Mystic Blue
                const isGold = Math.random() > 0.7;
                this.colorBase = isGold ? '242, 201, 76' : '77, 238, 234';
                this.color = `rgba(${this.colorBase}, `; 
            }
            
            update() {
                this.x += this.vx + Math.sin(this.life * 0.01) * 0.05;
                this.y += this.vy;
                this.life++;
                
                if (this.life > this.maxLife || this.y < -20) {
                    this.reset();
                }
            }
            
            draw() {
                const alpha = (1 - (this.life / this.maxLife)) * 0.6;
                ctx.fillStyle = this.color + alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Subtle Mouse Interaction on Artifact (Parallax)
        const artifact = document.getElementById('artifact');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            artifact.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
