<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette - Unified Mystic */
            --bg-deep: #050508;
            --bg-accent: #1a0b2e;
            
            /* Gold Tones */
            --gold-bright: #fff0a8;
            --gold-primary: #f2c94c;
            --gold-dark: #8a6d18;
            --gold-dim: #4a3b0a;
            
            /* Mystic Accents (Unified) */
            --mystic-blue: #4deeea;
            --mystic-purple: #b967ff;
            
            /* UI Materials */
            --glass-bg: rgba(10, 12, 20, 0.65);
            --glass-border: rgba(242, 201, 76, 0.15); /* Subtle gold tint */
            --glass-highlight: rgba(255, 255, 255, 0.1);
            
            --text-main: #eef2f6;
            --text-muted: #8b9bb4;
            
            /* Typography */
            --font-display: 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
            --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            /* Subtle radial glow instead of heavy gradient */
            background-image: radial-gradient(circle at 50% 40%, #2a1645 0%, #0d0d14 60%, #000000 100%);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERE --- */
        #canvas-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 120%);
            z-index: 1;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* Reduced noise opacity */
        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            z-index: 2;
            pointer-events: none;
        }

        /* --- LAYOUT --- */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            /* Adjusted vertical spacing */
            justify-content: flex-start; 
        }

        /* --- TOP BAR --- */
        .top-bar {
            display: flex;
            /* Critique: Align left/center for balance, moved currency left */
            justify-content: flex-start; 
            align-items: center;
            padding: 0.5rem 0 1.5rem 0;
            animation: fadeSlideDown 0.8s var(--ease-smooth) backwards;
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            /* Darker, more refined glass */
            background: linear-gradient(135deg, rgba(20, 20, 25, 0.8), rgba(0, 0, 0, 0.6));
            border: 1px solid var(--gold-dim);
            padding: 6px 16px 6px 8px;
            border-radius: 4px 20px 20px 4px; /* Asymmetric shape */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .currency-pill::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 6s infinite;
        }

        .coin-icon {
            width: 20px;
            height: 20px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 3px var(--gold-primary));
        }

        .currency-val {
            font-family: var(--font-display); /* Unified font */
            font-size: 1rem;
            color: var(--gold-bright);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- HERO SECTION --- */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Push content up slightly */
            position: relative;
            margin-bottom: 1rem;
        }

        .title-group {
            text-align: center;
            z-index: 2;
            margin-bottom: 1.5rem;
            animation: fadeSlideDown 1s var(--ease-smooth) 0.2s backwards;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            /* More metallic gradient */
            background: linear-gradient(to bottom, #ffffff 0%, #dcdcdc 40%, #999999 100%);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 0;
            line-height: 1;
        }

        .game-subtitle {
            font-family: var(--font-ui); /* Keep subtitle clean */
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--mystic-blue);
            text-transform: uppercase;
            opacity: 0.9;
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(77, 238, 234, 0.4);
            font-weight: 400;
        }

        /* --- RITUAL ARTIFACT (HERO GRAPHIC) --- */
        .artifact-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            animation: float 6s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }

        /* The Core: Ethereal Spirit Eye */
        .rune-core {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            /* Deep void with bright center */
            background: radial-gradient(circle at center, #fff 0%, var(--mystic-blue) 30%, #2e385c 70%, #000 100%);
            box-shadow: 
                0 0 40px rgba(77, 238, 234, 0.4),
                0 0 100px rgba(77, 238, 234, 0.1),
                inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            z-index: 5;
            animation: pulse-core 4s ease-in-out infinite;
        }

        /* Rune Rings */
        .rune-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Ring 1: Gold Pentagram-ish */
        .ring-1 {
            width: 160px; height: 160px;
            border: 1px solid transparent;
            border-top-color: var(--gold-primary);
            border-right-color: var(--gold-dim);
            border-bottom-color: var(--gold-dim);
            border-left-color: var(--gold-primary);
            border-radius: 45%; /* Slightly organic shape */
            animation: spin 15s linear infinite;
            filter: drop-shadow(0 0 3px var(--gold-primary));
        }

        /* Ring 2: Dashed Mystic */
        .ring-2 {
            width: 220px; height: 220px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            animation: spin-reverse 30s linear infinite;
        }
        
        /* Ring 3: Inner containment */
        .ring-3 {
            width: 120px; height: 120px;
            border: 1px solid rgba(77, 238, 234, 0.2);
            border-left: 1px solid rgba(77, 238, 234, 0.6);
            animation: spin 8s linear infinite reverse;
        }

        /* --- MAIN MENU (CARDS) --- */
        /* Critique Fix: Vertical Axis, Cards, Unified System */
        .menu-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: auto; /* Push to bottom of hero section */
            padding-bottom: 2rem;
            animation: fadeSlideUp 1s var(--ease-smooth) 0.4s backwards;
        }

        /* PRIMARY CARD (Summon) */
        .card-summon {
            width: 100%;
            max-width: 340px;
            padding: 18px 24px;
            /* Refined Glass/Gold */
            background: linear-gradient(180deg, rgba(40, 35, 20, 0.85), rgba(15, 10, 5, 0.9));
            border: 1px solid var(--gold-primary);
            border-top: 1px solid var(--gold-bright);
            border-bottom: 1px solid var(--gold-dim);
            border-radius: 6px;
            color: var(--gold-bright);
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s var(--ease-elastic);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 20;
        }

        /* Decorative corners for Summon Card */
        .card-summon::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }

        .card-summon:hover {
            background: linear-gradient(180deg, rgba(60, 50, 20, 0.95), rgba(30, 25, 10, 0.95));
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.7),
                0 0 20px rgba(242, 201, 76, 0.2),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
            transform: translateY(-2px) scale(1.01);
            text-shadow: 0 0 8px var(--gold-bright);
            border-color: var(--gold-bright);
        }

        .card-summon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* SECONDARY CARDS GRID */
        .secondary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }

        .menu-card {
            /* Critique Fix: Unified Card Style */
            background: rgba(20, 22, 30, 0.7);
            border: 1px solid var(--glass-border);
            border-bottom: 1px solid rgba(0,0,0,0.5);
            border-radius: 6px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s var(--ease-elastic);
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        /* Hover State for Secondary Cards */
        .menu-card:hover {
            background: rgba(40, 45, 60, 0.8);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        /* Critique Fix: Unified Icon Color (Pale Gold/White) */
        .card-icon {
            width: 24px;
            height: 24px;
            stroke-width: 1.5;
            fill: none;
            stroke: var(--text-muted); /* Unified color */
            transition: all 0.2s;
        }

        /* On hover, icons glow white/gold */
        .menu-card:hover .card-icon {
            stroke: var(--gold-bright);
            filter: drop-shadow(0 0 4px rgba(242, 201, 76, 0.4));
        }

        .card-label {
            font-family: var(--font-display); /* Unified Typography */
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .menu-card:hover .card-label {
            color: var(--text-main);
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        /* --- ANIMATIONS --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse-core {
            0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 40px rgba(77, 238, 234, 0.4); }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 60px rgba(77, 238, 234, 0.7); }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-height: 700px) {
            .game-title { font-size: 2.5rem; }
            .artifact-container { width: 200px; height: 200px; margin-bottom: 1rem; }
            .ring-1 { width: 120px; height: 120px; }
            .ring-2 { width: 160px; height: 160px; }
            .ring-3 { width: 90px; height: 90px; }
            .rune-core { width: 50px; height: 50px; }
            .card-summon { padding: 14px; font-size: 1.1rem; }
            .secondary-grid { gap: 8px; }
            .menu-card { padding: 12px 4px; }
            .top-bar { padding-bottom: 1rem; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <canvas id="canvas-layer"></canvas>
    <div class="vignette"></div>
    <div class="noise"></div>

    <div class="app-container">
        
        <!-- TOP BAR (Currency Left) -->
        <div class="top-bar">
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.41 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.11 1.71 1.24 2.66 2.86 2.98V19h2.21v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.53-3.42z"/>
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </div>

        <!-- HERO AREA -->
        <div class="hero-section">
            
            <div class="title-group">
                <h1 class="game-title">Aetheria</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>

            <!-- The Ritual Artifact -->
            <div class="artifact-container" id="artifact">
                <div class="rune-ring ring-3"></div>
                <div class="rune-ring ring-1"></div>
                <div class="rune-ring ring-2"></div>
                <div class="rune-core"></div>
            </div>

            <!-- MAIN MENU CARDS (Vertical Axis) -->
            <div class="menu-container">
                
                <!-- Primary Card: Summon -->
                <button class="card-summon">
                    <svg viewBox="0 0 24 24">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Summon
                </button>

                <!-- Secondary Cards: Roster, Battle, Grind -->
                <div class="secondary-grid">
                    
                    <div class="menu-card card-roster">
                        <!-- Scroll Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            <line x1="8" y1="7" x2="16" y2="7"></line>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                        </svg>
                        <span class="card-label">Roster</span>
                    </div>

                    <div class="menu-card card-battle">
                        <!-- Swords Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
                            <line x1="13" y1="19" x2="19" y2="13"></line>
                            <line x1="16" y1="16" x2="20" y2="20"></line>
                            <line x1="19" y1="21" x2="21" y2="19"></line>
                        </svg>
                        <span class="card-label">Battle</span>
                    </div>

                    <div class="menu-card card-grind">
                        <!-- Anvil/Tool Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                        </svg>
                        <span class="card-label">Grind</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        /**
         * ATMOSPHERIC PARTICLES
         * Floating embers and arcane dust
         */
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.vx = (Math.random() - 0.5) * 0.3; // Slower horizontal drift
                this.vy = -(Math.random() * 0.5 + 0.1); // Slower rise
                this.size = Math.random() * 1.5 + 0.5;
                this.life = 0;
                this.maxLife = Math.random() * 300 + 200;
                
                // Mix of Gold and Mystic Blue
                const isGold = Math.random() > 0.6;
                this.colorBase = isGold ? '242, 201, 76' : '77, 238, 234';
                this.color = `rgba(${this.colorBase}, `; 
            }
            
            update() {
                this.x += this.vx + Math.sin(this.life * 0.01) * 0.1;
                this.y += this.vy;
                this.life++;
                
                if (this.life > this.maxLife || this.y < -20) {
                    this.reset();
                }
            }
            
            draw() {
                const alpha = (1 - (this.life / this.maxLife)) * 0.5;
                ctx.fillStyle = this.color + alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // Subtle Mouse Interaction on Artifact
        const artifact = document.getElementById('artifact');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            artifact.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
