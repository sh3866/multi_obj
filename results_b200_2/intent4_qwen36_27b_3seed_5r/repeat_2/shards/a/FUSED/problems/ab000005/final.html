<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afternoon Clean</title>
    <style>
        :root {
            --bg-wall: #e8e4d9;
            --bg-floor: #d1bfae;
            --sun-color: rgba(255, 248, 220, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a1510;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--bg-wall);
            overflow: hidden;
        }

        /* SVG Layer */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Minimalist Typography */
        .scene-caption {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-size: 0.75rem;
            color: #8a7f72;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.8;
            pointer-events: none;
        }

        .scene-caption span {
            display: block;
            margin-top: 4px;
            font-size: 0.65rem;
            font-weight: 400;
            color: #a69d91;
        }

    </style>
</head>
<body>

    <div class="stage">
        <!-- The Visual Scene -->
        <svg class="scene" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Realistic Wood Floor Texture -->
                <filter id="wood-texture">
                    <!-- Horizontal grain -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="3" result="noise" />
                    <feColorMatrix type="matrix" values="
                        0.2 0 0 0 0.3
                        0.1 0 0 0 0.2
                        0.1 0 0 0 0.15
                        0.4 0 0 0 0" in="noise" result="coloredNoise"/>
                    <feDisplacementMap in="SourceGraphic" in2="coloredNoise" scale="4" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- 2. Lighting & Shadows -->
                <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="15" dy="25" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <filter id="wet-blur">
                    <feGaussianBlur stdDeviation="1.5" />
                </filter>

                <!-- 3. Gradients -->
                <!-- Wall Gradient -->
                <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#f4f1ea" />
                    <stop offset="100%" stop-color="#e0dcd3" />
                </linearGradient>

                <!-- Floor Gradient (Perspective Depth) -->
                <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#cbb69e" />
                    <stop offset="100%" stop-color="#8c7560" />
                </linearGradient>

                <!-- Sunlight Beam -->
                <linearGradient id="sun-beam" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255, 255, 240, 0)" />
                    <stop offset="20%" stop-color="rgba(255, 255, 240, 0.15)" />
                    <stop offset="80%" stop-color="rgba(255, 255, 240, 0.15)" />
                    <stop offset="100%" stop-color="rgba(255, 255, 240, 0)" />
                </linearGradient>

                <!-- Spill Gradient (Coffee/Wine) -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#3e2723" />
                    <stop offset="60%" stop-color="#4e342e" />
                    <stop offset="90%" stop-color="#3e2723" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#2a1a12" stop-opacity="0" />
                </radialGradient>

                <!-- Mop Head Gradient (Wet Cotton) -->
                <linearGradient id="mop-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#d7ccc8" />
                    <stop offset="50%" stop-color="#a1887f" />
                    <stop offset="100%" stop-color="#5d4037" />
                </linearGradient>

                <!-- Floor Planks Pattern -->
                <pattern id="floor-planks" width="120" height="1000" patternUnits="userSpaceOnUse">
                    <!-- Base Plank -->
                    <rect width="120" height="1000" fill="url(#floor-grad)" />
                    <!-- Plank Gap (Shadow) -->
                    <line x1="120" y1="0" x2="120" y2="1000" stroke="#5c4a3d" stroke-width="3" opacity="0.5" />
                    <!-- Wood Grain Texture -->
                    <rect width="120" height="1000" filter="url(#wood-texture)" opacity="0.4" style="mix-blend-mode: multiply;" />
                    <!-- Knots -->
                    <ellipse cx="60" cy="200" rx="15" ry="45" fill="#6d4c41" opacity="0.3" filter="blur(2px)" />
                    <ellipse cx="30" cy="600" rx="8" ry="25" fill="#6d4c41" opacity="0.3" filter="blur(1px)" />
                </pattern>
            </defs>

            <!-- 1. THE ROOM (Wall & Floor) -->
            <g id="room">
                <!-- Wall -->
                <rect x="0" y="0" width="1000" height="350" fill="url(#wall-grad)" />
                
                <!-- Baseboard -->
                <rect x="0" y="340" width="1000" height="20" fill="#d7d0c5" />
                <rect x="0" y="360" width="1000" height="2" fill="rgba(0,0,0,0.1)" />

                <!-- Floor -->
                <g transform="rotate(-5, 500, 800)">
                    <rect x="-200" y="350" width="1400" height="700" fill="url(#floor-planks)" />
                </g>
            </g>

            <!-- 2. LIGHTING (Sunbeam) -->
            <!-- A warm, directional light source -->
            <path d="M-100,-100 L600,800 L900,800 L200,-100 Z" fill="url(#sun-beam)" style="mix-blend-mode: screen; pointer-events: none;" />

            <!-- 3. THE SPILL (Narrative Center) -->
            <g id="spill-group" transform="translate(450, 600)">
                
                <!-- Wet Sheen Base (Distorts floor slightly) -->
                <path d="M0,0 C-50,-40 -140,10 -120,80 C-100,140 50,160 140,70 C180,-10 70,-50 0,0 Z" 
                      fill="rgba(255,255,255,0.05)" filter="url(#wet-blur)" pointer-events="none"/>

                <!-- The Liquid Mass -->
                <path id="liquid-mass" 
                      d="M0,0 C-50,-40 -140,10 -120,80 C-100,140 50,160 140,70 C180,-10 70,-50 0,0 Z" 
                      fill="url(#spill-grad)" />
                
                <!-- Viscous Edges (Darker rim) -->
                <path d="M0,0 C-50,-40 -140,10 -120,80 C-100,140 50,160 140,70 C180,-10 70,-50 0,0 Z" 
                      fill="none" stroke="#1a0f0a" stroke-width="3" opacity="0.6" transform="scale(0.95)" pointer-events="none"/>

                <!-- Specular Highlights (Reflections) -->
                <g fill="#ffffff" opacity="0.2" filter="url(#wet-blur)" pointer-events="none">
                    <ellipse cx="-30" cy="50" rx="30" ry="8" transform="rotate(-20 -30 50)" />
                    <ellipse cx="70" cy="60" rx="20" ry="6" transform="rotate(10 70 60)" />
                </g>

                <!-- Splatters -->
                <g fill="#2a1a12" pointer-events="none">
                    <circle cx="-160" cy="30" r="6" />
                    <circle cx="-180" cy="50" r="3" />
                    <circle cx="150" cy="80" r="9" />
                    <circle cx="180" cy="60" r="4" />
                    <circle cx="120" cy="-10" r="5" />
                    <circle cx="-100" cy="-20" r="3" />
                    <circle cx="170" cy="100" r="2" />
                </g>
            </g>

            <!-- 4. THE MOP (Interactive Cursor) -->
            <g id="mop-cursor" filter="url(#soft-shadow)">
                
                <!-- Handle -->
                <rect x="-8" y="-400" width="16" height="350" rx="4" fill="#5d4037" />
                <!-- Wood grain on handle -->
                <rect x="-4" y="-400" width="3" height="350" rx="2" fill="rgba(255,255,255,0.1)" />
                
                <!-- Rubber Grip -->
                <rect x="-10" y="-180" width="20" height="120" rx="6" fill="#212121" />
                <!-- Grip Ridges -->
                <path d="M-10,-160 L10,-160 M-10,-140 L10,-140 M-10,-120 L10,-120 M-10,-100 L10,-100" stroke="#424242" stroke-width="2" />

                <!-- Metal Connector -->
                <path d="M-8,-30 L8,-30 L12,0 L-12,0 Z" fill="#9e9e9e" />
                <circle cx="0" cy="-15" r="3" fill="#424242" />

                <!-- Mop Head (Volumetric & Wet) -->
                <g transform="translate(0, 0)">
                    <!-- Base Shape -->
                    <path d="M-12,0 L12,0 L40,120 Q0,140 -40,120 Z" fill="url(#mop-head-grad)" />
                    
                    <!-- Texture Lines (Strings) -->
                    <g stroke="#4e342e" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5">
                        <path d="M-12,0 Q-25,50 -35,115" />
                        <path d="M-6,0 Q-10,60 -15,125" />
                        <path d="M0,0 Q5,60 0,130" />
                        <path d="M6,0 Q10,60 15,125" />
                        <path d="M12,0 Q25,50 35,115" />
                    </g>

                    <!-- Wetness Indicator (Darkening at bottom) -->
                    <path d="M-30,90 Q0,120 30,90 L40,120 Q0,140 -40,120 Z" fill="#3e2723" opacity="0.6" />
                </g>
            </g>

            <!-- 5. CLEAN STATE (Hidden initially) -->
            <g id="clean-sheen" opacity="0" transform="translate(450, 600)">
                <!-- A faint, glossy residue indicating cleanliness -->
                <path d="M0,0 C-50,-40 -140,10 -120,80 C-100,140 50,160 140,70 C180,-10 70,-50 0,0 Z" 
                      fill="rgba(255,255,255,0.08)" filter="url(#wet-blur)" />
                <!-- Highlight streak -->
                <path d="M-40,40 Q50,90 100,40" stroke="#fff" stroke-width="3" fill="none" opacity="0.4" filter="blur(1px)" />
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="scene-caption">
            Morning Routine
            <span>Interactive Scene</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.querySelector('svg.scene');
            const mopCursor = document.getElementById('mop-cursor');
            const spillGroup = document.getElementById('spill-group');
            const cleanSheen = document.getElementById('clean-sheen');

            let isCleaned = false;
            let progress = 0; // 0 to 100

            // Initial position (off-screen or near wall)
            // Let's start it leaning near the wall on the left
            const initialX = 200;
            const initialY = 400;
            mopCursor.setAttribute('transform', `translate(${initialX}, ${initialY})`);

            // Coordinate mapping helper
            const getSVGPoint = (clientX, clientY) => {
                const pt = scene.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                return pt.matrixTransform(scene.getScreenCTM().inverse());
            };

            const handleMove = (e) => {
                // Always move mop with mouse
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                
                if (!x || !y) return;

                const svgP = getSVGPoint(x, y);
                
                // Offset mop so the tip is at the mouse
                // Mop tip is roughly at y=100 in local coords
                const offsetX = 0;
                const offsetY = -110; 

                mopCursor.setAttribute('transform', `translate(${svgP.x + offsetX}, ${svgP.y + offsetY})`);

                if (isCleaned) return;

                checkCollision(svgP.x, svgP.y);
            };

            const checkCollision = (mx, my) => {
                // Spill center is at 450, 600
                const spillCenterX = 450;
                const spillCenterY = 600;
                const radius = 100; // Approx radius of the mess

                const dx = mx - spillCenterX;
                const dy = my - spillCenterY;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < radius) {
                    // Inside the spill
                    progress += 1.5; // Increment clean speed
                    
                    // Visual feedback: Shrink spill slightly based on progress
                    // We use a non-linear scale for better feel
                    const scale = 1 - Math.pow(progress / 100, 2); 
                    const opacity = 1 - (progress / 100);
                    
                    spillGroup.style.transform = `translate(450px, 600px) scale(${Math.max(0, scale)})`;
                    spillGroup.style.opacity = Math.max(0, opacity);

                    if (progress >= 100) {
                        completeCleaning();
                    }
                }
            };

            const completeCleaning = () => {
                isCleaned = true;
                
                // Hide spill completely
                spillGroup.style.display = 'none';
                
                // Show clean sheen
                cleanSheen.style.opacity = '1';
                cleanSheen.classList.add('fade-in');
                
                // Subtle animation for the clean sheen
                cleanSheen.style.transition = 'opacity 1s ease';
            };

            window.addEventListener('mousemove', handleMove);
            window.addEventListener('touchmove', handleMove, {passive: false});
        });
    </script>
</body>
</html>
