<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Clean Technology</title>
    <style>
        :root {
            --bg-color: #12100e;
            --text-primary: #F5F1E6;
            --text-secondary: #A89F91;
            --accent: #D48C52;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text-primary);
        }

        /* Stage Container */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: #2a2520;
            overflow: hidden;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* SVG Scene */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
            /* Subtle zoom for focus */
            transform: scale(1.05); 
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            bottom: 4rem;
            left: 4rem;
            z-index: 20;
            pointer-events: none;
            max-width: 400px;
        }

        .ui-layer h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .ui-layer p {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
        }

        .badge.active .dot {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        /* Cursor Logic */
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }

        /* Animations */
        .fade-transition {
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .drip {
            animation: dripping 3s infinite ease-in;
        }

        @keyframes dripping {
            0% { transform: translateY(0); opacity: 0.8; }
            70% { transform: translateY(40px); opacity: 0.8; }
            80% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="stage">
        <svg class="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Advanced Wood Texture -->
                <filter id="wood-grain" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.08" numOctaves="4" result="noise" />
                    <feColorMatrix type="matrix" values="0 0 0 0 0.25   0 0 0 0 0.15   0 0 0 0 0.05   0 0 0 0.15 0" in="noise" result="coloredNoise"/>
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture"/>
                </filter>

                <pattern id="floor-pattern" width="300" height="1200" patternUnits="userSpaceOnUse" patternTransform="scale(1.2) rotate(10)">
                    <!-- Base Plank Color -->
                    <rect width="300" height="1200" fill="#3A2E26" />
                    <!-- Plank Edge/Gap -->
                    <rect x="295" y="0" width="5" height="1200" fill="#1A1510" />
                    <!-- Wood Grain Application -->
                    <rect width="300" height="1200" filter="url(#wood-grain)" opacity="0.8" style="mix-blend-mode: overlay;" />
                    <!-- Knot -->
                    <ellipse cx="150" cy="600" rx="20" ry="60" fill="#261C15" opacity="0.6" filter="blur(2px)" />
                </pattern>

                <!-- 2. Liquid Physics & Sheen -->
                <filter id="liquid-refraction">
                    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
                    <feGaussianBlur in="displaced" stdDeviation="1" />
                </filter>

                <filter id="wet-gloss">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- 3. Mop Texture (Microfiber) -->
                <filter id="mop-fuzz">
                    <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
                    <feGaussianBlur stdDeviation="0.5" />
                </filter>

                <!-- 4. Lighting -->
                <radialGradient id="ambient-light" cx="50%" cy="20%" r="80%">
                    <stop offset="0%" stop-color="#FFF9E6" stop-opacity="0.15" />
                    <stop offset="60%" stop-color="#000000" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
                </radialGradient>

                <linearGradient id="mop-handle-metal" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#444" />
                    <stop offset="20%" stop-color="#888" />
                    <stop offset="50%" stop-color="#ccc" />
                    <stop offset="80%" stop-color="#666" />
                    <stop offset="100%" stop-color="#333" />
                </linearGradient>

                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#5D4037" />
                    <stop offset="60%" stop-color="#3E2723" />
                    <stop offset="90%" stop-color="#2A1A12" />
                    <stop offset="100%" stop-color="#1A100A" />
                </radialGradient>
            </defs>

            <!-- Background Floor -->
            <g id="floor-base">
                <rect x="-100" y="-100" width="1400" height="1000" fill="url(#floor-pattern)" />
                <!-- Vignette/Lighting Overlay -->
                <rect x="-100" y="-100" width="1400" height="1000" fill="url(#ambient-light)" style="mix-blend-mode: overlay;" />
            </g>

            <!-- THE MESS (Coffee Spill) -->
            <!-- Positioned centrally but slightly lower for dynamic angle -->
            <g id="mess-layer" class="fade-transition" transform="translate(550, 550)">
                
                <!-- 1. The Wet Sheen (Distorts wood grain underneath) -->
                <path d="M0,0 C-80,-30 -180,40 -160,120 C-140,200 60,220 180,120 C220,30 80,-30 0,0 Z" 
                      fill="rgba(255,255,255,0.05)" filter="url(#liquid-refraction)" pointer-events="none"/>

                <!-- 2. The Liquid Mass -->
                <path d="M0,0 C-80,-30 -180,40 -160,120 C-140,200 60,220 180,120 C220,30 80,-30 0,0 Z" 
                      fill="url(#spill-grad)" filter="url(#wet-gloss)" opacity="0.95" />
                
                <!-- 3. Viscous Edge (Darker rim) -->
                <path d="M0,0 C-80,-30 -180,40 -160,120 C-140,200 60,220 180,120 C220,30 80,-30 0,0 Z" 
                      fill="none" stroke="#110a05" stroke-width="6" opacity="0.8" transform="scale(0.98)" />

                <!-- 4. Specular Highlights (Wetness reflection) -->
                <ellipse cx="-40" cy="80" rx="50" ry="15" fill="#FFFFFF" opacity="0.1" transform="rotate(-20 -40 80)" filter="blur(3px)"/>
                <ellipse cx="80" cy="100" rx="30" ry="10" fill="#FFFFFF" opacity="0.08" transform="rotate(10 80 100)" filter="blur(2px)"/>

                <!-- 5. Organic Splatters -->
                <g fill="#3E2723" filter="url(#wet-gloss)">
                    <circle cx="-190" cy="60" r="12" />
                    <circle cx="-210" cy="90" r="6" />
                    <circle cx="190" cy="140" r="18" />
                    <circle cx="220" cy="110" r="8" />
                    <circle cx="150" cy="-10" r="10" />
                    <circle cx="-100" cy="-40" r="7" />
                    <!-- Micro droplets -->
                    <circle cx="-230" cy="50" r="2" />
                    <circle cx="-240" cy="70" r="1.5" />
                    <circle cx="240" cy="130" r="2" />
                </g>
            </g>

            <!-- CLEANED SHEEN (Appears after cleaning) -->
            <g id="clean-layer" style="opacity: 0" transform="translate(550, 550)">
                <!-- A glossy trail -->
                <path d="M0,0 C-80,-30 -180,40 -160,120 C-140,200 60,220 180,120 C220,30 80,-30 0,0 Z" 
                      fill="url(#spill-grad)" opacity="0.1" filter="blur(4px)"/>
                <path d="M-50,50 Q50,100 100,50" stroke="white" stroke-width="3" fill="none" opacity="0.3" filter="blur(1px)"/>
            </g>

            <!-- THE MOP -->
            <!-- Positioned actively engaging the spill -->
            <g id="mop-tool" class="cursor-grab" transform="translate(700, 150)" filter="drop-shadow(10px 15px 10px rgba(0,0,0,0.5))">
                
                <!-- Handle (Wood) -->
                <rect x="-12" y="0" width="24" height="400" rx="4" fill="#4E342E" />
                <!-- Wood Highlight -->
                <rect x="-6" y="0" width="4" height="400" rx="2" fill="rgba(255,255,255,0.1)" />
                
                <!-- Grip (Rubber) -->
                <rect x="-16" y="120" width="32" height="140" rx="6" fill="#1a1a1a" />
                <!-- Grip Texture -->
                <g stroke="#333" stroke-width="2">
                    <line x1="-16" y1="140" x2="16" y2="140" />
                    <line x1="-16" y1="160" x2="16" y2="160" />
                    <line x1="-16" y1="180" x2="16" y2="180" />
                    <line x1="-16" y1="200" x2="16" y2="200" />
                    <line x1="-16" y1="220" x2="16" y2="220" />
                    <line x1="-16" y1="240" x2="16" y2="240" />
                </g>

                <!-- Metal Connector -->
                <path d="M-12,400 L12,400 L20,430 L-20,430 Z" fill="url(#mop-handle-metal)" />
                <circle cx="0" cy="415" r="6" fill="#222" />

                <!-- Mop Head (Microfiber - Saturated) -->
                <g id="mop-head" transform="translate(0, 430)">
                    
                    <!-- The Cloth Base -->
                    <path d="M-10,0 L10,0 L30,100 Q0,120 -30,100 Z" fill="#B0BEC5" />
                    
                    <!-- Individual Strands (Dirty/Saturated look) -->
                    <g stroke="#8D6E63" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#mop-fuzz)">
                        <!-- Left Side -->
                        <path d="M-10,0 Q-40,50 -50,110" />
                        <path d="M-10,0 Q-30,60 -35,120" />
                        <path d="M-10,0 Q-20,70 -15,130" />
                        
                        <!-- Center (Heaviest) -->
                        <path d="M0,0 Q5,60 0,130" />
                        <path d="M0,0 Q-5,60 -5,125" />
                        <path d="M0,0 Q15,60 10,125" />
                        
                        <!-- Right Side -->
                        <path d="M10,0 Q20,70 15,130" />
                        <path d="M10,0 Q30,60 35,120" />
                        <path d="M10,0 Q40,50 50,110" />
                    </g>

                    <!-- Drips (Physics) -->
                    <g fill="#3E2723">
                        <circle cx="-50" cy="115" r="3" class="drip" style="animation-delay: 0s;" />
                        <circle cx="10" cy="135" r="2" class="drip" style="animation-delay: 1.5s;" />
                    </g>
                </g>
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-layer">
            <div class="badge" id="status-badge">
                <span class="dot"></span>
                <span id="status-text">System Active</span>
            </div>
            <h1 style="margin-top: 1rem;">Deep Clean<br>Technology</h1>
            <p>Drag the mop head into the spill to demonstrate fluid dynamics and absorption capabilities.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopTool = document.getElementById('mop-tool');
            const messLayer = document.getElementById('mess-layer');
            const cleanLayer = document.getElementById('clean-layer');
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            
            let isDragging = false;
            let startX, startY;
            
            // Current SVG transform coordinates
            // Initial position from HTML: translate(700, 150)
            let posX = 700;
            let posY = 150;
            
            let isCleaned = false;

            // Helper to get mouse/touch position
            const getPos = (e) => {
                if(e.touches) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            };

            const startDrag = (e) => {
                if (isCleaned) return;
                isDragging = true;
                const pos = getPos(e);
                startX = pos.x;
                startY = pos.y;
                
                mopTool.classList.remove('cursor-grab');
                mopTool.classList.add('cursor-grabbing');
                
                // Disable transition for instant drag response
                mopTool.style.transition = 'none';
            };

            const drag = (e) => {
                if (!isDragging || isCleaned) return;
                e.preventDefault(); // Prevent scrolling on touch

                const pos = getPos(e);
                
                // Calculate delta based on SVG scaling
                const svgRect = document.querySelector('svg.scene').getBoundingClientRect();
                const scaleX = 1200 / svgRect.width;
                const scaleY = 800 / svgRect.height;

                const deltaX = (pos.x - startX) * scaleX;
                const deltaY = (pos.y - startY) * scaleY;

                posX += deltaX;
                posY += deltaY;

                // Constrain movement to keep it somewhat on screen/floor
                posX = Math.max(100, Math.min(1000, posX));
                posY = Math.max(100, Math.min(600, posY));

                mopTool.setAttribute('transform', `translate(${posX}, ${posY})`);

                // Check Collision
                // Mess center approx: 550, 550
                // Mop head is at posY + 430 (connector) + ~60 (center of head) = posY + 490
                const mopHeadY = posY + 490;
                const messCenterX = 550;
                const messCenterY = 550;

                // Distance check
                const dist = Math.sqrt(Math.pow(posX - messCenterX, 2) + Math.pow(mopHeadY - messCenterY, 2));

                if (dist < 150) {
                    performClean();
                }

                startX = pos.x;
                startY = pos.y;
            };

            const endDrag = () => {
                isDragging = false;
                mopTool.classList.remove('cursor-grabbing');
                mopTool.classList.add('cursor-grab');
            };

            const performClean = () => {
                if(isCleaned) return;
                isCleaned = true;

                // 1. Fade out mess
                messLayer.style.opacity = '0';
                messLayer.style.transform = 'translate(550px, 550px) scale(0.9)';

                // 2. Fade in clean sheen after delay
                setTimeout(() => {
                    cleanLayer.style.opacity = '1';
                }, 300);

                // 3. Update UI
                statusBadge.classList.add('active');
                statusText.textContent = "Surface Restored";
                
                // 4. Reset cursor
                mopTool.classList.remove('cursor-grab');
                mopTool.style.cursor = 'default';
            };

            // Event Listeners
            mopTool.addEventListener('mousedown', startDrag);
            mopTool.addEventListener('touchstart', startDrag, {passive: false});
            
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);
        });
    </script>
</body>
</html>
