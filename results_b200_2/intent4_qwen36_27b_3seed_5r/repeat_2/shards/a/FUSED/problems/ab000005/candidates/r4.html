<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restorative Clean</title>
    <style>
        :root {
            --bg-dark: #1a1510;
            --accent-gold: #e6b87d;
            --text-main: #f0e6d2;
            --text-muted: #8c8273;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #3e3226 0%, #14100c 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* SVG Layer */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* UI Overlay - Minimalist & Integrated */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
            z-index: 10;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-mark {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--accent-gold);
            text-transform: uppercase;
            border: 1px solid rgba(230, 184, 125, 0.3);
            padding: 6px 12px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .bottom-info {
            max-width: 320px;
            opacity: 0.9;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            transition: all 0.5s ease;
        }

        .status-indicator.clean {
            background-color: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .instruction-pill {
            position: absolute;
            bottom: 3rem;
            right: 3rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.5s;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .fade-out {
            transition: opacity 0.8s ease, transform 0.8s ease;
            opacity: 0;
            transform: scale(0.95);
            filter: blur(10px);
        }

        .fade-in {
            transition: opacity 1.5s ease;
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="stage">
        <!-- The Visual Scene -->
        <svg class="scene" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Advanced Wood Texture Filter -->
                <filter id="wood-grain" x="0%" y="0%" width="100%" height="100%">
                    <!-- Noise generation -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="4" result="noise" />
                    <!-- Color mapping for wood -->
                    <feColorMatrix type="matrix" values="
                        0 0 0 0 0.35
                        0 0 0 0 0.22
                        0 0 0 0 0.12
                        0 0 0 0.6 0" in="noise" result="coloredNoise"/>
                    <!-- Displacement to make grain flow -->
                    <feDisplacementMap in="SourceGraphic" in2="coloredNoise" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
                </filter>

                <!-- 2. Lighting & Shading -->
                <filter id="drop-shadow">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="-20" dy="-10" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.6"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <filter id="wet-blur">
                    <feGaussianBlur stdDeviation="2" />
                </filter>

                <!-- 3. Gradients -->
                <!-- Floor Perspective Gradient (Warmth) -->
                <linearGradient id="floor-lighting" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
                    <stop offset="40%" stop-color="#000000" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
                </linearGradient>

                <!-- Spill Gradient (Viscous Coffee) -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#4a332a" />
                    <stop offset="50%" stop-color="#362218" />
                    <stop offset="80%" stop-color="#24150e" />
                    <stop offset="100%" stop-color="#1a0f0a" stop-opacity="0.8" />
                </radialGradient>

                <!-- Mop Handle Gradient (Metallic) -->
                <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#333" />
                    <stop offset="20%" stop-color="#777" />
                    <stop offset="50%" stop-color="#ddd" />
                    <stop offset="80%" stop-color="#777" />
                    <stop offset="100%" stop-color="#333" />
                </linearGradient>

                <!-- Mop Head Gradient (Wet Cotton) -->
                <linearGradient id="mop-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#cfc4b5" />
                    <stop offset="40%" stop-color="#a89f91" />
                    <stop offset="100%" stop-color="#5c4f42" /> <!-- Darker at bottom where wet -->
                </linearGradient>

                <!-- Floor Pattern -->
                <pattern id="floor-planks" width="100" height="1000" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <rect width="100" height="1000" fill="#3e2f22" />
                    <!-- Plank gaps -->
                    <rect x="98" y="0" width="2" height="1000" fill="#1a120c" />
                    <!-- Wood grain overlay -->
                    <rect width="100" height="1000" filter="url(#wood-grain)" opacity="0.5" style="mix-blend-mode: overlay;" />
                    <!-- Random Knots -->
                    <ellipse cx="50" cy="400" rx="8" ry="30" fill="#241a12" opacity="0.6" filter="blur(1px)" />
                    <ellipse cx="50" cy="850" rx="12" ry="40" fill="#241a12" opacity="0.6" filter="blur(1px)" />
                </pattern>
            </defs>

            <!-- 1. THE FLOOR -->
            <g id="floor">
                <rect width="100%" height="100%" fill="url(#floor-planks)" />
                <!-- Lighting Overlay -->
                <rect width="100%" height="100%" fill="url(#floor-lighting)" style="mix-blend-mode: overlay;" pointer-events="none"/>
            </g>

            <!-- 2. THE SPILL (Interactive Target) -->
            <!-- Positioned centrally, organic shape -->
            <g id="spill-group" transform="translate(500, 550)">
                
                <!-- Wet Sheen Base (Distorts floor slightly) -->
                <path d="M0,0 C-60,-50 -160,10 -140,90 C-120,160 60,180 160,80 C200,-10 80,-60 0,0 Z" 
                      fill="rgba(255,255,255,0.03)" filter="url(#wet-blur)" pointer-events="none"/>

                <!-- The Liquid -->
                <path id="liquid-mass" 
                      d="M0,0 C-60,-50 -160,10 -140,90 C-120,160 60,180 160,80 C200,-10 80,-60 0,0 Z" 
                      fill="url(#spill-grad)" />
                
                <!-- Viscous Edges (Darker rim) -->
                <path d="M0,0 C-60,-50 -160,10 -140,90 C-120,160 60,180 160,80 C200,-10 80,-60 0,0 Z" 
                      fill="none" stroke="#110a05" stroke-width="4" opacity="0.8" transform="scale(0.96)" pointer-events="none"/>

                <!-- Specular Highlights (Reflections) -->
                <g fill="#ffffff" opacity="0.15" filter="url(#wet-blur)" pointer-events="none">
                    <ellipse cx="-40" cy="60" rx="40" ry="12" transform="rotate(-25 -40 60)" />
                    <ellipse cx="80" cy="80" rx="25" ry="8" transform="rotate(15 80 80)" />
                </g>

                <!-- Splatters -->
                <g fill="#2a1a12" pointer-events="none">
                    <circle cx="-170" cy="40" r="8" />
                    <circle cx="-190" cy="60" r="4" />
                    <circle cx="180" cy="100" r="12" />
                    <circle cx="210" cy="80" r="5" />
                    <circle cx="140" cy="-20" r="6" />
                    <circle cx="-120" cy="-30" r="4" />
                    <circle cx="190" cy="130" r="3" />
                </g>
            </g>

            <!-- 3. THE MOP (Cursor) -->
            <!-- Centered initially, follows mouse via JS -->
            <g id="mop-cursor" filter="url(#drop-shadow)">
                
                <!-- Handle -->
                <!-- Long wooden pole -->
                <rect x="-10" y="-350" width="20" height="300" rx="4" fill="#4e342e" />
                <!-- Wood grain on handle -->
                <rect x="-6" y="-350" width="4" height="300" rx="2" fill="rgba(255,255,255,0.08)" />
                
                <!-- Rubber Grip -->
                <rect x="-12" y="-150" width="24" height="100" rx="6" fill="#222" />
                <!-- Grip Ridges -->
                <path d="M-12,-130 L12,-130 M-12,-110 L12,-110 M-12,-90 L12,-90" stroke="#444" stroke-width="2" />

                <!-- Metal Connector -->
                <path d="M-10,-50 L10,-50 L15,-20 L-15,-20 Z" fill="url(#metal-grad)" />
                <circle cx="0" cy="-35" r="4" fill="#111" />

                <!-- Mop Head (Volumetric) -->
                <g transform="translate(0, -10)">
                    <!-- Base Shape -->
                    <path d="M-15,0 L15,0 L45,110 Q0,130 -45,110 Z" fill="url(#mop-head-grad)" />
                    
                    <!-- Texture Lines (Strings) -->
                    <g stroke="#5c4f42" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
                        <path d="M-15,0 Q-30,50 -40,105" />
                        <path d="M-8,0 Q-15,60 -20,115" />
                        <path d="M0,0 Q5,60 0,120" />
                        <path d="M8,0 Q15,60 20,115" />
                        <path d="M15,0 Q30,50 40,105" />
                    </g>

                    <!-- Wetness Indicator (Darkening at bottom) -->
                    <path d="M-35,80 Q0,110 35,80 L45,110 Q0,130 -45,110 Z" fill="#2a1a12" opacity="0.5" />
                </g>
            </g>

            <!-- 4. CLEAN STATE (Hidden initially) -->
            <g id="clean-sheen" opacity="0" transform="translate(500, 550)">
                <!-- A faint, glossy residue indicating cleanliness -->
                <path d="M0,0 C-60,-50 -160,10 -140,90 C-120,160 60,180 160,80 C200,-10 80,-60 0,0 Z" 
                      fill="rgba(255,255,255,0.04)" filter="url(#wet-blur)" />
                <!-- Highlight streak -->
                <path d="M-50,50 Q50,100 100,50" stroke="#fff" stroke-width="2" fill="none" opacity="0.3" filter="blur(2px)" />
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-overlay">
            <div class="top-header">
                <div class="brand-mark">Restorative Clean</div>
            </div>
            
            <div class="bottom-info">
                <div style="display:flex; align-items:center; margin-bottom:12px;">
                    <span class="status-indicator" id="status-dot"></span>
                    <span style="font-size:0.8rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;" id="status-text">Contamination Detected</span>
                </div>
                <h1>Surface Restoration</h1>
                <p>Interactive demonstration of fluid dynamics and absorption technology. Drag the mop over the spill to clean.</p>
            </div>

            <div class="instruction-pill" id="instruction">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                Drag to Clean
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.querySelector('svg.scene');
            const mopCursor = document.getElementById('mop-cursor');
            const spillGroup = document.getElementById('spill-group');
            const cleanSheen = document.getElementById('clean-sheen');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const instruction = document.getElementById('instruction');

            let isCleaned = false;
            let progress = 0; // 0 to 100

            // Initial position off-screen or center
            const initialX = 200;
            const initialY = 200;
            mopCursor.setAttribute('transform', `translate(${initialX}, ${initialY})`);

            // Coordinate mapping helper
            const getSVGPoint = (clientX, clientY) => {
                const pt = scene.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                return pt.matrixTransform(scene.getScreenCTM().inverse());
            };

            const handleMove = (e) => {
                // Always move mop with mouse
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                
                if (!x || !y) return;

                const svgP = getSVGPoint(x, y);
                
                // Offset mop so the tip is at the mouse
                // Mop tip is roughly at y=100 in local coords
                const offsetX = 0;
                const offsetY = -110; 

                mopCursor.setAttribute('transform', `translate(${svgP.x + offsetX}, ${svgP.y + offsetY})`);

                if (isCleaned) return;

                checkCollision(svgP.x, svgP.y);
            };

            const checkCollision = (mx, my) => {
                // Spill center is at 500, 550
                // Simple distance check for the "mess" area
                const spillCenterX = 500;
                const spillCenterY = 550;
                const radius = 120; // Approx radius of the mess

                const dx = mx - spillCenterX;
                const dy = my - spillCenterY;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < radius) {
                    // Inside the spill
                    progress += 2; // Increment clean speed
                    
                    // Visual feedback: Shrink spill slightly based on progress
                    const scale = 1 - (progress / 150); // Scale down to 0
                    const opacity = 1 - (progress / 100);
                    
                    spillGroup.style.transform = `translate(500px, 550px) scale(${Math.max(0, scale)})`;
                    spillGroup.style.opacity = Math.max(0, opacity);

                    if (progress >= 100) {
                        completeCleaning();
                    }
                }
            };

            const completeCleaning = () => {
                isCleaned = true;
                
                // Hide spill completely
                spillGroup.style.display = 'none';
                
                // Show clean sheen
                cleanSheen.style.opacity = '1';
                cleanSheen.classList.add('fade-in');

                // Update UI
                statusDot.classList.add('clean');
                statusText.textContent = "Surface Restored";
                statusText.style.color = "#4ade80";
                instruction.style.opacity = '0';
                
                // Hide custom cursor after a moment or keep it? 
                // Let's keep it but maybe make it look "clean" (optional polish)
                // For now, just standard behavior.
            };

            window.addEventListener('mousemove', handleMove);
            window.addEventListener('touchmove', handleMove, {passive: false});
        });
    </script>
</body>
</html>
