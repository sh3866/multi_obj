<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Storybook & Warmth --- */
            --bg-cream: #F4F1EA;
            --ink-brown: #3E2723;
            --ink-faded: #5D4037;
            
            /* Path Colors */
            --path-track: #E0D6CC; /* Faint groove */
            --path-active: #D84315; /* Deep Terracotta */
            
            /* Board Frame */
            --board-frame: #5D4037; /* Dark Wood */
            --board-bg: #EFEBE9;    /* Paper/Canvas */
            
            /* UI Buttons */
            --btn-wood: #8D6E63;
            --btn-wood-dark: #5D4037;
            --btn-run: #E64A19;
            --btn-run-dark: #BF360C;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-cream);
            /* CSS-only Paper Texture */
            background-image: 
                linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5)), 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-brown);
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.2rem;
            margin: 0;
            color: var(--ink-brown);
            /* Storybook feel: Rounded serif, slight rotation */
            font-family: 'Garamond', 'Georgia', serif;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.6);
            transform: rotate(-2deg);
            padding: 0 10px;
        }

        .subtitle {
            display: inline-block;
            margin-top: 6px;
            font-size: 1.1rem;
            color: var(--ink-faded);
            background: #fff;
            padding: 4px 18px;
            border-radius: 20px;
            /* Storybook sticker look */
            box-shadow: 1px 2px 4px rgba(0,0,0,0.1);
            border: 1px solid #E0D6CC;
            transform: rotate(1deg);
            font-style: italic;
        }

        /* --- Game Board Container --- */
        .game-board {
            position: relative;
            /* Wood Frame Effect */
            background: var(--board-frame);
            padding: 14px;
            border-radius: 12px;
            /* Soft, grounded shadow */
            box-shadow: 
                0 10px 25px rgba(62, 39, 35, 0.2),
                inset 0 2px 4px rgba(255,255,255,0.15);
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            /* Gap 0 for seamless paths */
            gap: 0; 
            background-color: var(--board-bg); 
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            /* Size responsive to screen */
            width: min(85vw, 420px);
            height: min(85vw, 420px);
        }

        /* --- Tiles --- */
        .tile {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            /* Subtle dashed grid lines */
            border-right: 1px dashed rgba(93, 64, 55, 0.15);
            border-bottom: 1px dashed rgba(93, 64, 55, 0.15);
        }

        /* --- Paths (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--path-track);
            stroke-width: 14; 
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease;
        }

        /* Active State */
        .tile.active .path-line {
            stroke: var(--path-active);
            /* Subtle glow to pop against grid */
            filter: drop-shadow(0px 2px 0px rgba(216, 67, 21, 0.2));
        }

        /* --- The Cub --- */
        .cub-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 16.66%; /* 100% / 6 */
            height: 16.66%;
            pointer-events: none;
            z-index: 50;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            /* Slight shadow to lift off board */
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.25));
        }

        .cub-svg {
            width: 90%; 
            height: 90%;
        }

        /* --- The Star --- */
        .marker-goal {
            position: absolute;
            top: 0;
            left: 0;
            width: 16.66%;
            height: 16.66%;
            z-index: 40;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float-star 3s infinite ease-in-out;
        }

        .star-svg {
            width: 70%;
            height: 70%;
            filter: drop-shadow(0 0 6px rgba(241, 196, 15, 0.6));
        }

        @keyframes float-star {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* --- Footer & Buttons --- */
        footer {
            margin-top: 20px;
            display: flex;
            gap: 16px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 32px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            position: relative;
            transition: transform 0.1s ease;
            
            /* Flat Storybook Button */
            box-shadow: 
                0 4px 0 rgba(0,0,0,0.15), /* Flat depth */
                0 6px 10px rgba(0,0,0,0.1); /* Drop shadow */
        }

        .btn-reset {
            background-color: var(--btn-wood);
            box-shadow: 0 4px 0 var(--btn-wood-dark), 0 6px 10px rgba(0,0,0,0.1);
        }

        .btn-run {
            background-color: var(--btn-run);
            box-shadow: 0 4px 0 var(--btn-run-dark), 0 6px 10px rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Guide Cub to the Star</div>
    </header>

    <div class="game-board">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 4 };

        // --- SVG Assets ---
        
        // The Bear/Cub Illustration
        const cubSVGContent = `
            <svg viewBox="0 0 100 100" class="cub-svg" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <circle cx="25" cy="25" r="14" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                <circle cx="75" cy="25" r="14" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                <circle cx="25" cy="25" r="6" fill="#FDFBF7"/>
                <circle cx="75" cy="25" r="6" fill="#FDFBF7"/>
                
                <!-- Head Body -->
                <rect x="20" y="20" width="60" height="65" rx="20" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="65" rx="16" ry="12" fill="#FDFBF7"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="60" rx="6" ry="4" fill="#3E2723"/>
                
                <!-- Eyes -->
                <circle cx="38" cy="45" r="4" fill="#3E2723"/>
                <circle cx="62" cy="45" r="4" fill="#3E2723"/>
                
                <!-- Cheeks -->
                <circle cx="30" cy="55" r="4" fill="#E64A19" opacity="0.5"/>
                <circle cx="70" cy="55" r="4" fill="#E64A19" opacity="0.5"/>
            </svg>
        `;

        // The Golden Star
        const starSVGContent = `
            <svg viewBox="0 0 24 24" class="star-svg" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#F1C40F" stroke="#F39C12" stroke-width="1" stroke-linejoin="round"/>
            </svg>
        `;

        // --- Path Generator ---
        function createPathSVG(conn) {
            // conn is [top, right, bottom, left]
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            // Draw lines from center to edge
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token Wrapper
            const cubWrapper = document.createElement('div');
            cubWrapper.className = 'cub-wrapper';
            cubWrapper.id = 'cub';
            cubWrapper.innerHTML = cubSVGContent;
            gridEl.appendChild(cubWrapper);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.id = 'goal';
            goal.innerHTML = starSVGContent;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Visual Logic for Demo
                    let conn = [false, false, false, false];
                    
                    // Start
                    if (x === startPos.x && y === startPos.y) {
                        conn = [true, false, true, false]; 
                    } 
                    // End
                    else if (x === endPos.x && y === endPos.y) {
                        conn = [true, false, false, false]; 
                    } 
                    // Filler
                    else {
                        const types = [
                            [true, false, true, false], // |
                            [false, true, false, true], // -
                            [true, true, false, false], // |->
                            [false, true, true, false], // <-|
                            [true, false, false, true], // |<-
                            [false, false, true, true], // ->|
                            [true, true, true, true]    // +
                        ];
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            // Position Cub and Star using percentages
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            if (!cub) return;
            
            // Calculate percentages based on grid index (0-5)
            // Each cell is 100/6 = 16.666%
            const pct = 100 / GRID_SIZE;
            
            cub.style.top = `${y * pct}%`;
            cub.style.left = `${x * pct}%`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.getElementById('goal');
            if (!goal) return;

            const pct = 100 / GRID_SIZE;

            goal.style.top = `${y * pct}%`;
            goal.style.left = `${x * pct}%`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            const gridContainer = document.querySelector('.game-board');
            gridContainer.style.transform = 'scale(0.98)';
            setTimeout(() => gridContainer.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            let delay = 0;
            
            // A hardcoded path for the demo effect matching the grid
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}
            ];

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 300; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
