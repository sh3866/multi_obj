<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Refined Storybook --- */
            --bg-paper: #F4F1EA;
            --bg-paper-texture: #E8E4D9;
            --ink-dark: #3E2723;
            --ink-light: #5D4037;
            
            /* Path Colors - High Contrast */
            --path-track: #D7CCC8;       /* The "groove" */
            --path-fill: #E64A19;        /* The active path - Terracotta */
            --path-fill-glow: #FF7043;
            
            /* Board Colors */
            --board-bg: #A1887F;         /* The "table" or frame */
            --board-inner: #8D6E63;
            
            /* UI Elements */
            --btn-green: #66BB6A;
            --btn-green-dark: #388E3C;
            --btn-red: #EF5350;
            --btn-red-dark: #D32F2F;
            
            /* Dimensions */
            --grid-size: 6;
            --tile-size: 70px;
        }

        @media (max-width: 600px) {
            :root {
                --tile-size: 52px;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Subtle paper texture via CSS noise */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-dark);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: var(--ink-dark);
            /* Playful Serif styling */
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
            transform: rotate(-2deg);
        }

        .subtitle {
            display: inline-block;
            margin-top: 8px;
            font-size: 1.1rem;
            color: var(--ink-light);
            background: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            transform: rotate(1deg);
        }

        /* --- Game Board Container --- */
        .game-board {
            position: relative;
            /* Soft, integrated border instead of heavy frame */
            background: var(--board-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.25),
                0 5px 10px rgba(0,0,0,0.1),
                inset 0 2px 0 rgba(255,255,255,0.2);
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--tile-size));
            grid-template-rows: repeat(var(--grid-size), var(--tile-size));
            /* CRITICAL FIX: Gap 0 for seamless paths */
            gap: 0; 
            background-color: var(--board-inner); 
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        /* --- Tiles --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: #FDFBF7; /* Paper white */
            position: relative;
            cursor: pointer;
            /* Subtle border to define grid without breaking paths */
            border-right: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        /* --- Paths (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--path-track);
            /* CRITICAL FIX: Thicker lines */
            stroke-width: 16; 
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease;
        }

        /* Active State: The Path */
        .tile.active .path-line {
            stroke: var(--path-fill);
            /* Slight glow for legibility */
            filter: drop-shadow(0px 2px 0px rgba(230, 74, 25, 0.3));
        }

        /* --- The Cub (Priority 2: Prominent) --- */
        .cub-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--tile-size);
            height: var(--tile-size);
            pointer-events: none;
            z-index: 50;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cub-svg {
            /* CRITICAL FIX: Scaled up significantly */
            width: 90%; 
            height: 90%;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.2));
        }

        /* --- The Star (Priority 2: Prominent) --- */
        .marker-goal {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--tile-size);
            height: var(--tile-size);
            z-index: 40;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float-star 3s infinite ease-in-out;
        }

        .star-svg {
            width: 70%;
            height: 70%;
            filter: drop-shadow(0 0 8px rgba(241, 196, 15, 0.6));
        }

        @keyframes float-star {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* --- Footer & Buttons (Priority 4: Tactile) --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 24px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 14px 40px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            position: relative;
            transition: all 0.1s ease;
            
            /* Wood/Fabric Texture Implication */
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(0,0,0,0.1));
            box-shadow: 
                0 6px 0 rgba(0,0,0,0.2), /* 3D side */
                0 12px 10px rgba(0,0,0,0.15), /* Drop shadow */
                inset 0 1px 0 rgba(255,255,255,0.4); /* Top highlight */
        }

        .btn-run {
            background-color: var(--btn-green);
            border-bottom: 6px solid var(--btn-green-dark);
        }

        .btn-reset {
            background-color: var(--btn-red);
            border-bottom: 6px solid var(--btn-red-dark);
        }

        button:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            box-shadow: 
                0 2px 0 rgba(0,0,0,0.2),
                0 4px 4px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Guide Cub to the Star</div>
    </header>

    <div class="game-board">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 4 };

        // --- SVG Assets ---
        
        // The Bear/Cub Illustration - Simplified, Friendly Shape
        const cubSVGContent = `
            <svg viewBox="0 0 100 100" class="cub-svg" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="cub-shadow" x="-20%" y="-20%" width="140%" height="140%">
                      <feGaussianBlur stdDeviation="2" result="blur" />
                      <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <!-- Ears -->
                <circle cx="25" cy="25" r="14" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                <circle cx="75" cy="25" r="14" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                <circle cx="25" cy="25" r="6" fill="#FDFBF7"/>
                <circle cx="75" cy="25" r="6" fill="#FDFBF7"/>
                
                <!-- Head Body -->
                <rect x="20" y="20" width="60" height="65" rx="20" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="65" rx="16" ry="12" fill="#FDFBF7"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="60" rx="6" ry="4" fill="#3E2723"/>
                
                <!-- Eyes -->
                <circle cx="38" cy="45" r="4" fill="#3E2723"/>
                <circle cx="62" cy="45" r="4" fill="#3E2723"/>
                
                <!-- Cheeks -->
                <circle cx="30" cy="55" r="4" fill="#E64A19" opacity="0.5"/>
                <circle cx="70" cy="55" r="4" fill="#E64A19" opacity="0.5"/>
            </svg>
        `;

        // The Golden Star
        const starSVGContent = `
            <svg viewBox="0 0 24 24" class="star-svg" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#F1C40F" stroke="#F39C12" stroke-width="1" stroke-linejoin="round"/>
            </svg>
        `;

        // --- Path Generator ---
        function createPathSVG(conn) {
            // conn is [top, right, bottom, left]
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            // Draw lines from center to edge
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token Wrapper
            const cubWrapper = document.createElement('div');
            cubWrapper.className = 'cub-wrapper';
            cubWrapper.id = 'cub';
            cubWrapper.innerHTML = cubSVGContent;
            gridEl.appendChild(cubWrapper);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.id = 'goal';
            goal.innerHTML = starSVGContent;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Visual Logic for Demo
                    // Simple logic to make paths look somewhat connected
                    let conn = [false, false, false, false];
                    
                    // Start
                    if (x === startPos.x && y === startPos.y) {
                        conn = [true, false, true, false]; 
                    } 
                    // End
                    else if (x === endPos.x && y === endPos.y) {
                        conn = [true, false, false, false]; 
                    } 
                    // Filler
                    else {
                        const types = [
                            [true, false, true, false], // |
                            [false, true, false, true], // -
                            [true, true, false, false], // |->
                            [false, true, true, false], // <-|
                            [true, false, false, true], // |<-
                            [false, false, true, true], // ->|
                            [true, true, true, true]    // +
                        ];
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            // Position Cub and Star
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            if (!cub) return;
            
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            
            // Since gap is 0, calculation is simpler
            const top = y * tileSize;
            const left = x * tileSize;

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
            cub.style.width = `${tileSize}px`;
            cub.style.height = `${tileSize}px`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.getElementById('goal');
            if (!goal) return;

            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));

            const top = y * tileSize;
            const left = x * tileSize;

            goal.style.top = `${top}px`;
            goal.style.left = `${left}px`;
            goal.style.width = `${tileSize}px`;
            goal.style.height = `${tileSize}px`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            const gridContainer = document.querySelector('.game-board');
            gridContainer.style.transform = 'scale(0.98)';
            setTimeout(() => gridContainer.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            let delay = 0;
            
            // A hardcoded path for the demo effect matching the grid
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}
            ];

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 300; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
