<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-paper: #FDF6E3;
            --bg-paper-dark: #F0E6D2;
            --wood-light: #E6D5B8;
            --wood-dark: #8D775E;
            --ink-dark: #2C241B;
            --ink-light: #5D4D40;
            --accent-cub: #D96C48; /* Rusty Red */
            --accent-star: #F4A261; /* Sandy Gold */
            --accent-path: #2A9D8F; /* Teal Rope */
            --shadow-soft: rgba(44, 36, 27, 0.15);
            --shadow-hard: rgba(44, 36, 27, 0.3);
            
            --tile-size: 72px;
            --gap: 10px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Organic Paper Texture */
            background-image: 
                radial-gradient(var(--wood-light) 1px, transparent 1px),
                radial-gradient(var(--wood-light) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            font-family: 'Georgia', 'Times New Roman', serif; /* Storybook Serif */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-dark);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -2px;
            color: var(--ink-dark);
            font-weight: 900;
            /* Chunky playful feel */
            font-family: 'Arial Black', 'Impact', sans-serif; 
            text-transform: uppercase;
            text-shadow: 
                3px 3px 0px var(--bg-paper-dark), 
                6px 6px 0px rgba(0,0,0,0.1);
            transform: rotate(-2deg);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--ink-light);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 5px;
            opacity: 0.9;
            background: rgba(253, 246, 227, 0.8);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            border: 1px dashed var(--ink-light);
        }

        /* --- The Board Container --- */
        .game-container {
            position: relative;
            padding: 16px;
            background: #fff;
            border-radius: 20px;
            /* Thick book binding look */
            box-shadow: 
                0 15px 35px var(--shadow-soft),
                inset 0 0 0 4px var(--wood-light),
                inset 0 0 0 8px #fff;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
            background-color: var(--wood-dark);
            padding: var(--gap);
            border-radius: 14px;
            position: relative;
            /* Wood grain effect */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 8px);
        }

        /* --- Tiles (Cards/Blocks) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: #FAFAF5; /* Off-white paper */
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            /* 3D Card look */
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.03),
                0 4px 0 #E0E0D5,
                0 6px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            background-color: #fff;
            transform: translateY(-2px);
        }

        /* SVG Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .path-line {
            fill: none;
            stroke: #D1C7B7; /* Inactive path color (indent) */
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease;
        }

        /* Active State: Rope Style */
        .tile.active .path-line {
            stroke: var(--accent-path);
            stroke-width: 16;
            /* Rope texture via shadow */
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));
        }

        /* --- Character Design: The Cub --- */
        .cub-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cub-svg {
            width: 70%;
            height: 70%;
            position: absolute;
            top: 15%;
            left: 15%;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.2));
        }

        /* --- Character Design: The Star --- */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            z-index: 5;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0px 0px 8px rgba(244, 162, 97, 0.6));
        }
        
        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -60%) scale(1.1); }
        }

        /* --- Footer & Buttons (Wooden/Fabric) --- */
        footer {
            margin-top: 35px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 14px 36px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            top: 0;
            transition: all 0.15s ease;
            color: #fff;
            /* Wood texture base */
            background: var(--accent-cub);
            box-shadow: 
                inset 0 4px 10px rgba(255,255,255,0.2),
                inset 0 -4px 10px rgba(0,0,0,0.2),
                0 6px 0 #9E4A31, /* 3D edge */
                0 10px 10px rgba(0,0,0,0.2);
            border: 2px solid rgba(0,0,0,0.1);
        }

        button:active {
            top: 6px;
            box-shadow: 
                inset 0 4px 10px rgba(0,0,0,0.3),
                0 0 0 #9E4A31;
        }

        .btn-reset {
            background: var(--wood-dark);
            box-shadow: 
                inset 0 4px 10px rgba(255,255,255,0.1),
                inset 0 -4px 10px rgba(0,0,0,0.2),
                0 6px 0 #5D4D40,
                0 10px 10px rgba(0,0,0,0.2);
        }
        
        .btn-reset:active {
             box-shadow: inset 0 4px 10px rgba(0,0,0,0.3), 0 0 0 #5D4D40;
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 550px) {
            :root {
                --tile-size: 52px;
                --gap: 6px;
            }
            h1 { font-size: 2.5rem; }
            .game-container { padding: 10px; }
            .cub-svg { width: 60%; height: 60%; top: 20%; left: 20%; }
        }

    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Guide Cub to the Star</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Assets ---
        
        // The Bear/Cub Illustration (Inline SVG)
        const cubSVGContent = `
            <svg viewBox="0 0 100 100" class="cub-svg" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <circle cx="30" cy="30" r="12" fill="#D96C48" stroke="#2C241B" stroke-width="3"/>
                <circle cx="70" cy="30" r="12" fill="#D96C48" stroke="#2C241B" stroke-width="3"/>
                <circle cx="30" cy="30" r="5" fill="#F4A261"/>
                <circle cx="70" cy="30" r="5" fill="#F4A261"/>
                
                <!-- Head -->
                <circle cx="50" cy="55" r="32" fill="#D96C48" stroke="#2C241B" stroke-width="3"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="65" rx="14" ry="10" fill="#FDF6E3"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="60" rx="5" ry="3" fill="#2C241B"/>
                
                <!-- Eyes -->
                <circle cx="40" cy="50" r="3" fill="#2C241B"/>
                <circle cx="60" cy="50" r="3" fill="#2C241B"/>
                
                <!-- Cheeks -->
                <circle cx="35" cy="60" r="3" fill="#E76F51" opacity="0.5"/>
                <circle cx="65" cy="60" r="3" fill="#E76F51" opacity="0.5"/>
            </svg>
        `;

        // The Golden Star (Inline SVG)
        const starSVGContent = `
            <svg viewBox="0 0 24 24" class="marker-goal" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#F4A261" stroke="#FDF6E3" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                stroke="#E76F51" stroke-width="0.5" stroke-linejoin="round" opacity="0.3"/>
            </svg>
        `;

        // --- Path Generator ---
        function createPathSVG(conn) {
            // conn is [top, right, bottom, left]
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token Wrapper
            const cubWrapper = document.createElement('div');
            cubWrapper.className = 'cub-wrapper';
            cubWrapper.id = 'cub';
            cubWrapper.innerHTML = cubSVGContent;
            gridEl.appendChild(cubWrapper);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVGContent;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Visual Logic for Demo
                    if (x === startPos.x && y === startPos.y) {
                        // Start tile (Vertical)
                        tile.innerHTML = createPathSVG([true, false, true, false]); 
                    } else if (x === endPos.x && y === endPos.y) {
                        // End tile (Vertical)
                        tile.innerHTML = createPathSVG([true, false, true, false]);
                    } else {
                        // Random filler for visual appeal
                        const types = [
                            [true, false, true, false], // |
                            [false, true, false, true], // -
                            [true, true, false, false], // |->
                            [false, true, true, false], // <-|
                            [true, false, false, true], // |<-
                            [false, false, true, true], // ->|
                            [true, true, true, true]    // +
                        ];
                        const type = types[Math.floor(Math.random() * types.length)];
                        tile.innerHTML = createPathSVG(type);
                    }

                    gridEl.appendChild(tile);
                }
            }

            updateCubPosition(startPos.x, startPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
            
            // Calculate absolute position within the grid container
            // Grid has padding = gap
            const top = gap + y * (tileSize + gap);
            const left = gap + x * (tileSize + gap);

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            // Reset Cub to start
            updateCubPosition(startPos.x, startPos.y);
            
            // Clear active states
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Slight visual feedback on container
            const gridContainer = document.querySelector('.game-container');
            gridContainer.style.transform = 'scale(0.98)';
            setTimeout(() => gridContainer.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // Simulate a "Run" by lighting up a path and moving the cub
            let delay = 0;
            
            // A hardcoded path for the demo effect
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            const cub = document.getElementById('cub');

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    // Light up tile
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');

                    // Move Cub
                    updateCubPosition(pos.x, pos.y);

                }, delay);
                delay += 300; // Speed of movement
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
