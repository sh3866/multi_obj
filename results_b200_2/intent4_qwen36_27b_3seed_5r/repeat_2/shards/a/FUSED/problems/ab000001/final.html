<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Storybook Warmth & Wood --- */
            --bg-paper: #F5E6D3;
            --ink-brown: #3E2723;
            --ink-light: #5D4037;
            
            /* Board Colors */
            --board-wood: #4E342E;
            --board-inner: #D7CCC8; /* Darker paper tone for contrast */
            --path-wood: #5D4037;   /* Distinct wood path */
            --path-highlight: #8D6E63;
            --path-active: #D84315; /* Terracotta for the solution */
            
            /* UI */
            --btn-run: #D84315;
            --btn-run-shadow: #BF360C;
            --btn-reset: #8D6E63;
            --btn-reset-shadow: #5D4037;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Texture Overlay */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-brown);
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: var(--ink-brown);
            font-family: 'Georgia', serif;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.4);
            transform: rotate(-2deg);
            padding: 0 10px;
        }

        /* Replaced pill with elegant instruction line */
        .instruction {
            margin-top: 8px;
            font-size: 1.2rem;
            color: var(--ink-light);
            font-style: italic;
            font-weight: 400;
            opacity: 0.9;
        }

        /* --- Game Board Container (Wooden Frame) --- */
        .game-board {
            position: relative;
            background: var(--board-wood);
            padding: 18px; /* Thick frame */
            border-radius: 12px;
            /* Wood Texture Gradient on Frame */
            background-image: linear-gradient(135deg, #4E342E 0%, #3E2723 100%);
            
            /* Physical Presence */
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.4),
                inset 0 0 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 0; 
            background-color: var(--board-inner);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            /* Inner shadow for depth */
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.15);
            
            /* Responsive Size */
            width: min(85vw, 460px);
            height: min(85vw, 460px);
        }

        /* --- Tiles --- */
        .tile {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            /* Critique: Removed dotted grid lines */
            border: none;
        }

        /* --- Paths (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--path-wood); /* Dark wood tone */
            stroke-width: 16; /* Thicker for better visibility */
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease, filter 0.4s ease;
        }

        /* Active State (The Solution Path) */
        .tile.active .path-line {
            stroke: var(--path-active);
            filter: drop-shadow(0px 2px 0px rgba(0,0,0,0.15));
        }

        /* --- The Cub --- */
        .cub-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 16.66%; /* 100% / 6 */
            height: 16.66%;
            pointer-events: none;
            z-index: 50;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 5px 4px rgba(0,0,0,0.3));
        }

        .cub-svg {
            width: 95%; 
            height: 95%;
        }

        /* --- The Star --- */
        .marker-goal {
            position: absolute;
            top: 0;
            left: 0;
            width: 16.66%;
            height: 16.66%;
            z-index: 40;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float-star 3s infinite ease-in-out;
        }

        .star-svg {
            width: 70%;
            height: 70%;
            filter: drop-shadow(0 0 8px rgba(241, 196, 15, 0.8));
        }

        @keyframes float-star {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* --- Footer & Buttons (Wooden Blocks) --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 24px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Garamond', 'Georgia', serif; /* Storybook font */
            font-weight: 700;
            font-size: 1.4rem;
            padding: 12px 36px;
            border-radius: 12px; /* Blocky but rounded */
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #fff;
            position: relative;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            
            /* Wood Block Texture via Gradients */
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.1));
            
            /* Embossed Text */
            text-shadow: 0px -1px 0px rgba(0,0,0,0.4);
            
            /* 3D Block Shadow */
            box-shadow: 
                0 6px 0 rgba(0,0,0,0.2),
                0 10px 15px rgba(0,0,0,0.15);
        }

        .btn-reset {
            background-color: var(--btn-reset);
            box-shadow: 0 6px 0 var(--btn-reset-shadow), 0 10px 15px rgba(0,0,0,0.15);
        }

        .btn-run {
            background-color: var(--btn-run);
            box-shadow: 0 6px 0 var(--btn-run-shadow), 0 10px 15px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2); /* Flatten shadow on click */
        }

    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="instruction">Guide Cub to the Star</div>
    </header>

    <div class="game-board">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 4 };

        // --- SVG Assets ---
        
        // The Bear/Cub Illustration (Slightly refined colors)
        const cubSVGContent = `
            <svg viewBox="0 0 100 100" class="cub-svg" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <circle cx="25" cy="25" r="14" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                <circle cx="75" cy="25" r="14" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                <circle cx="25" cy="25" r="6" fill="#FDFBF7"/>
                <circle cx="75" cy="25" r="6" fill="#FDFBF7"/>
                
                <!-- Head Body -->
                <rect x="20" y="20" width="60" height="65" rx="20" fill="#D35400" stroke="#3E2723" stroke-width="3"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="65" rx="16" ry="12" fill="#FDFBF7"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="60" rx="6" ry="4" fill="#3E2723"/>
                
                <!-- Eyes -->
                <circle cx="38" cy="45" r="4" fill="#3E2723"/>
                <circle cx="62" cy="45" r="4" fill="#3E2723"/>
                
                <!-- Cheeks -->
                <circle cx="30" cy="55" r="4" fill="#E64A19" opacity="0.5"/>
                <circle cx="70" cy="55" r="4" fill="#E64A19" opacity="0.5"/>
            </svg>
        `;

        // The Golden Star
        const starSVGContent = `
            <svg viewBox="0 0 24 24" class="star-svg" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#F1C40F" stroke="#F39C12" stroke-width="1" stroke-linejoin="round"/>
            </svg>
        `;

        // --- Path Generator ---
        function createPathSVG(conn) {
            // conn is [top, right, bottom, left]
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            // Draw lines from center to edge
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token Wrapper
            const cubWrapper = document.createElement('div');
            cubWrapper.className = 'cub-wrapper';
            cubWrapper.id = 'cub';
            cubWrapper.innerHTML = cubSVGContent;
            gridEl.appendChild(cubWrapper);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.id = 'goal';
            goal.innerHTML = starSVGContent;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Visual Logic for Demo
                    let conn = [false, false, false, false];
                    
                    // Start
                    if (x === startPos.x && y === startPos.y) {
                        conn = [true, false, true, false]; 
                    } 
                    // End
                    else if (x === endPos.x && y === endPos.y) {
                        conn = [true, false, false, false]; 
                    } 
                    // Filler - Random paths
                    else {
                        const types = [
                            [true, false, true, false], // |
                            [false, true, false, true], // -
                            [true, true, false, false], // |->
                            [false, true, true, false], // <-|
                            [true, false, false, true], // |<-
                            [false, false, true, true], // ->|
                            [true, true, true, true]    // +
                        ];
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            // Position Cub and Star using percentages
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            if (!cub) return;
            
            // Calculate percentages based on grid index (0-5)
            // Each cell is 100/6 = 16.666%
            const pct = 100 / GRID_SIZE;
            
            cub.style.top = `${y * pct}%`;
            cub.style.left = `${x * pct}%`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.getElementById('goal');
            if (!goal) return;

            const pct = 100 / GRID_SIZE;

            goal.style.top = `${y * pct}%`;
            goal.style.left = `${x * pct}%`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            const gridContainer = document.querySelector('.game-board');
            gridContainer.style.transform = 'scale(0.98)';
            setTimeout(() => gridContainer.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            let delay = 0;
            
            // A hardcoded path for the demo effect matching the grid
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}
            ];

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 300; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
