<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-paper: #FDF6E3;
            --bg-paper-dark: #EBE0CC;
            --wood-frame: #5D4037;
            --wood-frame-light: #795548;
            --wood-frame-shadow: #3E2723;
            --tile-cream: #FDFBF7;
            --tile-shadow: #E0D6C8;
            --path-inactive: #E6DCCF; /* Subtle indent */
            --path-active: #D35400;   /* Burnt Orange/Rust */
            --accent-star: #F1C40F;   /* Bright Gold */
            --accent-star-glow: rgba(241, 196, 15, 0.4);
            --ink-dark: #2C241B;
            
            --grid-size: 6;
            --tile-size: 70px;
            --gap: 12px;
        }

        @media (max-width: 600px) {
            :root {
                --tile-size: 50px;
                --gap: 8px;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Subtle paper texture */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-dark);
        }

        /* --- Header & Typography --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 3rem;
            margin: 0;
            color: var(--ink-dark);
            text-transform: uppercase;
            letter-spacing: -1px;
            /* Playful 3D Text */
            text-shadow: 
                0px 4px 0px var(--wood-frame),
                0px 8px 10px rgba(0,0,0,0.2);
            transform: rotate(-1deg);
        }

        .subtitle {
            display: inline-block;
            background: #fff;
            border: 2px solid var(--ink-dark);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }

        /* --- Game Board Container --- */
        .game-board {
            position: relative;
            background: var(--wood-frame);
            padding: 16px;
            border-radius: 16px;
            /* Frame 3D Effect */
            box-shadow: 
                inset 0 4px 10px rgba(255,255,255,0.1),
                inset 0 -4px 10px rgba(0,0,0,0.4),
                0 20px 40px rgba(44, 36, 27, 0.4);
            border-bottom: 8px solid var(--wood-frame-shadow);
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--tile-size));
            grid-template-rows: repeat(var(--grid-size), var(--tile-size));
            gap: var(--gap);
            background-color: var(--wood-frame-light); /* Gaps look like wood */
            border-radius: 8px;
            position: relative;
            border: 4px solid var(--wood-frame-shadow);
        }

        /* --- Tiles --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-cream);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            /* Critique: Inner shadow + depth */
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.8),
                inset -2px -2px 5px rgba(0,0,0,0.05),
                0 4px 0 var(--tile-shadow);
            transition: transform 0.2s, background-color 0.3s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-2px);
            background-color: #fff;
        }

        /* --- Paths (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--path-inactive);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease, stroke-width 0.3s ease;
        }

        /* Active State: The Path */
        .tile.active .path-line {
            stroke: var(--path-active);
            stroke-width: 14;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));
        }

        /* --- The Cub (Critique: Rescaled to 15-20%) --- */
        .cub-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cub-svg {
            /* Approx 18% of tile size visually */
            width: 18%; 
            height: 18%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.3));
        }

        /* --- The Star (Critique: High Contrast Gold) --- */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40%; /* Slightly larger than cub for visibility */
            height: 40%;
            z-index: 5;
            pointer-events: none;
            animation: pulse-star 2s infinite ease-in-out;
        }

        @keyframes pulse-star {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 5px var(--accent-star-glow)); }
            50% { transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 0 12px var(--accent-star-glow)); }
        }

        /* --- Footer & Buttons (Critique: Tactile 3D) --- */
        footer {
            margin-top: 30px;
            display: flex;
            gap: 24px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 12px 32px;
            border-radius: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            position: relative;
            transition: all 0.1s ease;
            transform: translateY(0);
        }

        /* Run Button - Green/Teal Toy */
        .btn-run {
            background-color: #27AE60;
            /* 3D Layers */
            border-bottom: 6px solid #1E8449;
            box-shadow: 
                inset 0 4px 0 rgba(255,255,255,0.3), /* Top Highlight */
                0 10px 15px rgba(0,0,0,0.2);
        }

        /* Reset Button - Red/Rust Toy */
        .btn-reset {
            background-color: #E74C3C;
            border-bottom: 6px solid #C0392B;
            box-shadow: 
                inset 0 4px 0 rgba(255,255,255,0.3), /* Top Highlight */
                0 10px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            box-shadow: 
                inset 0 4px 0 rgba(255,255,255,0.1),
                0 2px 5px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Guide Cub to the Star</div>
    </header>

    <div class="game-board">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 4 };

        // --- SVG Assets ---
        
        // The Bear/Cub Illustration (Inline SVG) - Simplified for small scale
        const cubSVGContent = `
            <svg viewBox="0 0 100 100" class="cub-svg" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <circle cx="30" cy="30" r="15" fill="#D35400" stroke="#2C241B" stroke-width="4"/>
                <circle cx="70" cy="30" r="15" fill="#D35400" stroke="#2C241B" stroke-width="4"/>
                <circle cx="30" cy="30" r="6" fill="#FDFBF7"/>
                <circle cx="70" cy="30" r="6" fill="#FDFBF7"/>
                
                <!-- Head -->
                <circle cx="50" cy="55" r="35" fill="#D35400" stroke="#2C241B" stroke-width="4"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="68" rx="16" ry="12" fill="#FDFBF7"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="63" rx="6" ry="4" fill="#2C241B"/>
                
                <!-- Eyes -->
                <circle cx="40" cy="50" r="4" fill="#2C241B"/>
                <circle cx="60" cy="50" r="4" fill="#2C241B"/>
            </svg>
        `;

        // The Golden Star (Inline SVG) - High Contrast
        const starSVGContent = `
            <svg viewBox="0 0 24 24" class="marker-goal" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                      <feGaussianBlur stdDeviation="1.5" result="blur" />
                      <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#F1C40F" stroke="#D4AC0D" stroke-width="1" stroke-linejoin="round" filter="url(#glow)"/>
            </svg>
        `;

        // --- Path Generator ---
        function createPathSVG(conn) {
            // conn is [top, right, bottom, left]
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token Wrapper
            const cubWrapper = document.createElement('div');
            cubWrapper.className = 'cub-wrapper';
            cubWrapper.id = 'cub';
            cubWrapper.innerHTML = cubSVGContent;
            gridEl.appendChild(cubWrapper);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.id = 'goal';
            goal.innerHTML = starSVGContent;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Visual Logic for Demo
                    // Simple logic to make paths look somewhat connected
                    let conn = [false, false, false, false];
                    
                    // Start
                    if (x === startPos.x && y === startPos.y) {
                        conn = [true, false, true, false]; 
                    } 
                    // End
                    else if (x === endPos.x && y === endPos.y) {
                        conn = [true, false, false, false]; 
                    } 
                    // Filler
                    else {
                        const types = [
                            [true, false, true, false], // |
                            [false, true, false, true], // -
                            [true, true, false, false], // |->
                            [false, true, true, false], // <-|
                            [true, false, false, true], // |<-
                            [false, false, true, true], // ->|
                            [true, true, true, true]    // +
                        ];
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            // Position Cub and Star
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            if (!cub) return;
            
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
            
            const top = gap + y * (tileSize + gap);
            const left = gap + x * (tileSize + gap);

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
            cub.style.width = `${tileSize}px`;
            cub.style.height = `${tileSize}px`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.getElementById('goal');
            if (!goal) return;

            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));

            const top = gap + y * (tileSize + gap);
            const left = gap + x * (tileSize + gap);

            goal.style.top = `${top}px`;
            goal.style.left = `${left}px`;
            goal.style.width = `${tileSize}px`;
            goal.style.height = `${tileSize}px`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            const gridContainer = document.querySelector('.game-board');
            gridContainer.style.transform = 'scale(0.98)';
            setTimeout(() => gridContainer.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            let delay = 0;
            
            // A hardcoded path for the demo effect matching the grid
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}
            ];

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 300; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
