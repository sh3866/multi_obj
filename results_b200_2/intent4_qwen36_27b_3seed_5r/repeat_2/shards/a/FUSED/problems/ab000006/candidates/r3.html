<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    DESIGN STRATEGY:
    1. Typography: Monospace (Courier New) with heavy black outlines for a chunky pixel feel.
    2. Composition: 3-Plane Depth (Sky -> Midground Forest -> Foreground Frame).
    3. Aesthetic: Stepped gradients, hard shadows, retro red/yellow UI.
  */

  :root {
    --ui-border: #000000;
    --ui-text: #ffffff;
    --ui-accent: #ff3333; /* Retro Red */
    --ui-accent-dark: #aa0000;
    --ui-shadow: #000000;
    --font-stack: 'Courier New', Courier, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: var(--font-stack);
    overflow: hidden;
    color: var(--ui-text);
    user-select: none;
  }

  /* The Arcade Cabinet Container */
  #game-container {
    position: relative;
    width: 640px;
    height: 480px;
    background: #000;
    box-shadow: 0 0 0 12px #222, 0 0 0 14px #000, 0 0 100px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* Critical for crisp pixel art scaling */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  /* --- UI LAYER --- */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* TOP SECTION: Title & HUD */
  .top-section {
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* High contrast against sky */
    text-shadow: 4px 4px 0px #000000; 
  }

  h1.title {
    font-family: var(--font-stack);
    font-weight: 900;
    font-size: 64px;
    line-height: 1;
    color: #fff;
    letter-spacing: -2px;
    margin-bottom: 8px;
    text-transform: uppercase;
    /* The "Chunky" Pixel Font Effect */
    text-shadow: 
      4px 4px 0 #000,
      -2px -2px 0 #000,
      2px -2px 0 #000,
      -2px 2px 0 #000,
      0 4px 0 #000;
  }

  /* HUD Instructions - Integrated into the sky */
  .hud-instructions {
    margin-top: 10px;
    display: flex;
    gap: 24px;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px 16px;
    border: 2px solid #fff;
    /* Monospaced font per critique */
    font-family: var(--font-stack);
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  }

  .hud-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Pixel Art Icons for Keys */
  .key-icon {
    width: 20px;
    height: 20px;
    background: #ddd;
    border: 2px solid #000;
    border-bottom: 4px solid #000;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #000;
    font-size: 10px;
    position: relative;
  }
  .key-icon::after { content: ''; display: block; }
  .key-icon.left::after { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-right: 6px solid #000; }
  .key-icon.right::after { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid #000; }
  .key-icon.up::after { border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid #000; }

  /* BOTTOM SECTION: Start Button */
  .bottom-section {
    padding: 30px;
    display: flex;
    justify-content: center;
    pointer-events: auto;
  }

  .start-btn {
    position: relative;
    /* Retro Red Button */
    background-color: var(--ui-accent);
    color: #fff;
    font-family: var(--font-stack);
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 12px 40px;
    /* Thick Black Border */
    border: 4px solid #000;
    cursor: pointer;
    outline: none;
    /* Hard Shadow */
    box-shadow: 6px 6px 0px #000;
    transition: transform 0.1s, box-shadow 0.1s;
    animation: pulse 1.5s infinite;
  }

  .start-btn:hover {
    background-color: #ff6666;
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0px #000;
  }

  .start-btn:active {
    /* Pressed State: Shift border/shadow */
    transform: translate(2px, 2px);
    box-shadow: 0px 0px 0px #000;
    background-color: var(--ui-accent-dark);
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.85; }
    100% { opacity: 1; }
  }

  /* CRT OVERLAYS */
  .scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.2) 50%,
      rgba(0,0,0,0.2)
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 20;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 15;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene" width="320" height="240"></canvas>
  
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div id="ui-layer">
    <!-- Top: Title & HUD -->
    <div class="top-section">
      <h1 class="title">SkiFree</h1>
      
      <div class="hud-instructions">
        <div class="hud-item">
          <div class="key-icon left"></div>
          <div class="key-icon right"></div>
          <span>STEER</span>
        </div>
        <div class="hud-item">
          <div class="key-icon up"></div>
          <span>GO</span>
        </div>
        <div class="hud-item" style="color: #ffcccc;">
          <span>AVOID TREES</span>
        </div>
      </div>
    </div>

    <!-- Bottom: Action -->
    <div class="bottom-section">
      <button class="start-btn" id="start-btn">START GAME</button>
    </div>
  </div>
</div>

<script>
/**
 * RENDER ENGINE & ASSETS
 * Procedural pixel art generation.
 */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320;
const H = 240;

// Palette
const P = {
  skyTop: '#0046ad',
  skyBot: '#6a89cc',
  // Stepped Snow Colors
  snow1: '#f0f4f8',
  snow2: '#e3e8ef',
  snow3: '#d6dde6',
  snow4: '#c9d2dd',
  treeDark: '#1a3c28',
  treeLight: '#265c3b',
  trunk: '#3d2b1f',
  skierRed: '#e03c31',
  skierSkin: '#ffccaa',
  skierDark: '#801e16'
};

// State
let frame = 0;
let isStarted = false;

// Assets: Snow Particles
const snowParticles = [];
for(let i=0; i<60; i++) {
  snowParticles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() < 0.3 ? 2 : 1,
    speed: 0.5 + Math.random() * 1.5,
    wind: -0.2 + Math.random() * 0.4
  });
}

// Background Trees (Midground) - Increased Density
const bgTrees = [];
for(let i=0; i<30; i++) {
  bgTrees.push({
    x: Math.random() * W,
    y: 80 + Math.random() * 100, // Midground depth
    scale: 0.4 + Math.random() * 0.4,
    type: Math.random() > 0.5 ? 1 : 2
  });
}
bgTrees.sort((a,b) => a.y - b.y);

// Foreground Trees (Framing) - Critique Item 2
const fgTrees = [
  { x: -10, y: 260, scale: 1.8, type: 1 }, // Bottom Left
  { x: 330, y: 250, scale: 2.0, type: 2 }, // Bottom Right
  { x: 310, y: 180, scale: 1.4, type: 1 }  // Mid Right
];

// Skier State - Critique Item 3: Scaled Up
const skier = {
  x: W/2,
  y: 150,
  bob: 0,
  dir: 1, 
  speed: 0,
  animFrame: 0
};

// --- DRAWING FUNCTIONS ---

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawSky() {
  // Sky remains smooth gradient as it represents atmosphere
  const grad = ctx.createLinearGradient(0, 0, 0, 80);
  grad.addColorStop(0, P.skyTop);
  grad.addColorStop(1, P.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 80);
  
  // Subtle Sun
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  ctx.arc(260, 30, 16, 0, Math.PI*2);
  ctx.fill();
}

function drawSnowGround() {
  // Critique Item 2: Stepped Gradient (Bands)
  const bandHeight = 20;
  const startY = 80;
  
  for(let i=0; i<10; i++) {
    ctx.fillStyle = i % 2 === 0 ? P.snow1 : P.snow2;
    if (i > 4) ctx.fillStyle = i % 2 === 0 ? P.snow3 : P.snow4;
    
    ctx.fillRect(0, startY + (i * bandHeight), W, bandHeight);
  }
}

function drawTree(x, y, scale, type) {
  const s = scale;
  const tx = Math.floor(x);
  const ty = Math.floor(y);
  
  // Shadow
  ctx.fillStyle = 'rgba(0, 40, 100, 0.2)';
  ctx.beginPath();
  ctx.ellipse(tx + 2*s, ty + 2, 8*s, 3*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Trunk
  drawPixelRect(tx - 1, ty - 2*s, 2, 6*s, P.trunk);

  // Leaves - Layered Triangles
  const c1 = type===1 ? P.treeDark : P.treeLight;
  const c2 = type===1 ? P.treeLight : P.treeDark;

  // Bottom
  drawPixelRect(tx - 7*s, ty - 2*s, 14*s, 4*s, c1);
  // Middle
  drawPixelRect(tx - 5*s, ty - 6*s, 10*s, 4*s, c2);
  // Top
  drawPixelRect(tx - 3*s, ty - 10*s, 6*s, 4*s, c1);
  
  // Snow Cap
  ctx.fillStyle = P.snow1;
  drawPixelRect(tx - 2*s, ty - 10*s, 4*s, 1*s, P.snow1);
}

function drawSkier(x, y, dir, bobOffset) {
  // Critique Item 3: Scale Up (1.5x)
  const s = 1.5; 
  const sx = Math.floor(x);
  const sy = Math.floor(y + bobOffset);
  
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(dir * s, s); // Flip for direction & Scale

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(-7, 12, 14, 4);

  // Skis
  ctx.fillStyle = '#ddd';
  ctx.fillRect(-8, 11, 7, 2); // Left ski
  ctx.fillRect(1, 11, 7, 2);  // Right ski
  ctx.fillStyle = '#999';
  ctx.fillRect(-8, 12, 7, 1); // Binding shadow
  ctx.fillRect(1, 12, 7, 1);

  // Legs
  ctx.fillStyle = '#333'; // Boots
  ctx.fillRect(-5, 8, 2, 4);
  ctx.fillRect(3, 8, 2, 4);
  
  ctx.fillStyle = P.skierRed; // Pants
  ctx.fillRect(-5, 5, 2, 4);
  ctx.fillRect(3, 5, 2, 4);

  // Body
  ctx.fillStyle = P.skierRed;
  ctx.fillRect(-4, -3, 8, 8);
  // White stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(-4, 0, 8, 2);

  // Head
  ctx.fillStyle = P.skierSkin;
  ctx.fillRect(-2, -7, 5, 4); // Face
  ctx.fillStyle = P.skierDark;
  ctx.fillRect(-2, -8, 5, 2); // Hair/Hat
  
  // Goggles
  ctx.fillStyle = '#111';
  ctx.fillRect(0, -6, 3, 2);

  // Scarf (Animated)
  ctx.fillStyle = '#3a86ff';
  ctx.fillRect(-3, -3, 6, 2); // Neck
  // Tail blows in wind
  ctx.fillRect(-6, -2, 2, 4 + Math.sin(frame*0.5)*2);

  // Poles
  ctx.fillStyle = '#888';
  ctx.fillRect(-6, -2, 1, 13); // Left pole
  ctx.fillRect(5, -2, 1, 13);  // Right pole

  ctx.restore();
}

function drawSnowParticles() {
  ctx.fillStyle = '#fff';
  snowParticles.forEach(p => {
    p.y += p.speed;
    p.x += p.wind;
    
    if (p.y > H) { p.y = -2; p.x = Math.random() * W; }
    if (p.x > W) p.x = 0;
    if (p.x < 0) p.x = W;
    
    ctx.globalAlpha = 0.6;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  });
  ctx.globalAlpha = 1.0;
}

// --- MAIN LOOP ---

function loop() {
  frame++;
  
  // Clear
  ctx.clearRect(0, 0, W, H);
  
  // 1. Sky
  drawSky();
  
  // 2. Snow Ground (Stepped)
  drawSnowGround();
  
  // 3. Background Trees (Midground)
  bgTrees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // 4. Skier Animation Logic
  if (!isStarted) {
    // Idle animation: gentle bobbing and swaying
    skier.bob = Math.sin(frame * 0.08) * 1.5;
    skier.x = (W/2) + Math.sin(frame * 0.015) * 15;
    skier.dir = Math.cos(frame * 0.015) > 0 ? 1 : -1;
  } else {
    // Game Started: Skier moves down (screen Y decreases)
    skier.y -= 2.5; 
    skier.bob = Math.sin(frame * 0.4) * 1;
    skier.x += Math.sin(frame * 0.05) * 1.5;
    
    // Wrap around for demo loop
    if(skier.y < 60) {
      skier.y = H - 40;
      skier.x = Math.random() * (W-60) + 30;
    }
  }
  
  // 5. Draw Skier
  drawSkier(skier.x, skier.y, skier.dir, skier.bob);

  // 6. Foreground Trees (Framing)
  fgTrees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // 7. Foreground Snow Particles
  drawSnowParticles();

  requestAnimationFrame(loop);
}

// --- INTERACTION ---

const startBtn = document.getElementById('start-btn');

startBtn.addEventListener('click', () => {
  isStarted = true;
  startBtn.style.display = 'none'; // Hide button
  // Fade HUD slightly
  document.querySelector('.hud-instructions').style.opacity = '0.5';
});

// Start Loop
requestAnimationFrame(loop);

</script>
</body>
</html>
