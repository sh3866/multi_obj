<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    DESIGN STRATEGY (REVISED):
    1. Typography: 'Press Start 2P' equivalent using system monospace + heavy pixel manipulation.
    2. Composition: Layered HUD. Title high, Instructions mid, Button low.
    3. Aesthetic: High saturation 16-bit palette, CRT scanlines, CRT curvature.
  */

  :root {
    --ui-bg: rgba(0, 0, 0, 0.75); /* Semi-transparent dark for HUD */
    --ui-border: #ffffff;
    --ui-accent: #e60012; /* Nintendo Red */
    --ui-accent-dark: #8a0000;
    --ui-accent-light: #ff6b6b;
    --ui-text: #ffffff;
    --ui-highlight: #ffcc00;
    --font-pixel: 'Courier New', Courier, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #101010;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: var(--font-pixel);
    overflow: hidden;
    color: var(--ui-text);
    user-select: none;
  }

  /* The Arcade Cabinet Container */
  #game-container {
    position: relative;
    width: 640px;
    height: 480px;
    background: #000;
    /* CRT Bezel */
    box-shadow: 
      inset 0 0 80px rgba(0,0,0,0.8),
      0 0 0 12px #222, 
      0 0 0 16px #111,
      0 20px 40px rgba(0,0,0,0.8);
    overflow: hidden;
    border-radius: 8px;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* Essential for the pixel look */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  /* --- UI LAYER --- */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 20px;
  }

  /* TOP SECTION: Title */
  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin-top: -10px; /* Visual adjustment */
  }

  /* REVISED TITLE: Pixelated, Outlined */
  h1.title {
    font-family: var(--font-pixel);
    font-weight: 900;
    font-size: 56px;
    line-height: 1;
    color: #fff;
    letter-spacing: -2px;
    margin-bottom: 10px;
    text-transform: uppercase;
    /* Hard pixel shadow */
    text-shadow: 
      4px 4px 0 #000,
      -2px -2px 0 #000,
      2px -2px 0 #000,
      -2px 2px 0 #000,
      0 4px 0 #000,
      4px 0 0 #000,
      -4px 0 0 #000,
      0 4px 0 #000,
      0 -4px 0 #000;
    /* Slight scaling to fill gaps in monospace */
    transform: scaleX(1.1); 
  }

  /* REVISED HUD: Floating Box */
  .hud-instructions {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--ui-bg);
    padding: 12px 24px;
    border-radius: 4px;
    /* Retro double border */
    border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    
    font-family: var(--font-pixel);
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    backdrop-filter: blur(2px);
    animation: float 4s ease-in-out infinite;
  }

  .hud-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hud-divider {
    width: 2px;
    height: 16px;
    background: rgba(255,255,255,0.2);
  }

  /* REVISED KEYS: 16-bit Style */
  .key-icon {
    width: 18px;
    height: 18px;
    background: #eee;
    border: 2px solid #555;
    border-bottom: 4px solid #333;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 2px 0 rgba(0,0,0,0.5);
  }
  
  .key-icon::after { 
    content: ''; 
    display: block;
    border: 4px solid transparent;
  }
  
  .key-icon.left::after { border-right-color: #333; margin-left: 1px; }
  .key-icon.right::after { border-left-color: #333; margin-right: 1px; }
  .key-icon.up::after { border-bottom-color: #333; margin-top: 1px; }

  .warning-text {
    color: var(--ui-highlight);
    text-shadow: 1px 1px 0 #000;
    animation: blink 1s steps(2, start) infinite;
  }

  /* BOTTOM SECTION: Start Button */
  .bottom-section {
    padding-bottom: 20px;
    display: flex;
    justify-content: center;
    pointer-events: auto;
  }

  /* REVISED BUTTON: 16-bit 3D Block */
  .start-btn {
    position: relative;
    background-color: var(--ui-accent);
    color: #fff;
    font-family: var(--font-pixel);
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 14px 32px;
    cursor: pointer;
    outline: none;
    
    /* Pixel Border Construction */
    border: 4px solid #000;
    box-shadow: 
      inset 4px 4px 0px 0px var(--ui-accent-light), 
      inset -4px -4px 0px 0px var(--ui-accent-dark),
      6px 6px 0px 0px #000; /* Hard Shadow */
      
    transition: transform 0.05s, box-shadow 0.05s;
    animation: pulse 2s infinite ease-in-out;
  }

  .start-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 
      inset 4px 4px 0px 0px var(--ui-accent-light),
      inset -4px -4px 0px 0px var(--ui-accent-dark),
      8px 8px 0px 0px #000;
  }

  .start-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 
      inset 4px 4px 0px 0px var(--ui-accent-dark),
      inset -4px -4px 0px 0px var(--ui-accent-light),
      0px 0px 0px 0px #000;
  }

  /* CRT OVERLAYS */
  /* Scanlines - Lower opacity per critique */
  .scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.15) 50%,
      rgba(0,0,0,0.15)
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 20;
  }

  /* Vignette & Noise */
  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 21;
  }

  /* Subtle CRT Flicker */
  .crt-flicker {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.02);
    pointer-events: none;
    z-index: 22;
    animation: flicker 0.15s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.95; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes flicker {
    0% { opacity: 0.9; }
    100% { opacity: 1.0; }
  }

</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene" width="320" height="240"></canvas>
  
  <!-- CRT Effects -->
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="crt-flicker"></div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    <!-- Top: Title -->
    <div class="top-section">
      <h1 class="title">SKIFREE</h1>
      
      <!-- Middle: Floating HUD Instructions -->
      <div class="hud-instructions">
        <div class="hud-item">
          <div class="key-icon left"></div>
          <div class="key-icon right"></div>
          <span>STEER</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item warning-text">
          <span>AVOID TREES!</span>
        </div>
      </div>
    </div>

    <!-- Bottom: Action -->
    <div class="bottom-section">
      <button class="start-btn" id="start-btn">START GAME</button>
    </div>
  </div>
</div>

<script>
/**
 * RENDER ENGINE & ASSETS
 * Procedural pixel art generation using Canvas API.
 * Focusing on crisp "pixel" rendering (fillRect only).
 */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320;
const H = 240;

// Palette (Refined for contrast and retro feel)
const P = {
  skyTop: '#0046ad',
  skyBot: '#8bb4e8',
  // Snow Palette
  snow1: '#f0f4f8',
  snow2: '#e3e8ef',
  snow3: '#d6dde6',
  // Tree Palette
  treeDark: '#1a3c28',
  treeLight: '#265c3b',
  treeTrunk: '#3d2b1f',
  // Skier Palette
  skierRed: '#e03c31',
  skierSkin: '#ffccaa',
  skierDark: '#801e16',
  skierPants: '#1a237e',
  snowSpray: '#ffffff'
};

// State
let frame = 0;
let isStarted = false;

// Assets: Snow Particles (Wind effect)
const snowParticles = [];
for(let i=0; i<60; i++) {
  snowParticles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() < 0.2 ? 2 : 1, 
    speed: 0.5 + Math.random() * 1.5,
    wind: -0.2 + Math.random() * 0.5 
  });
}

// Background Trees (Midground)
const bgTrees = [];
for(let i=0; i<40; i++) {
  bgTrees.push({
    x: Math.random() * W,
    y: 90 + Math.random() * 130, 
    scale: 0.2 + Math.random() * 0.5,
    type: Math.floor(Math.random() * 3)
  });
}
bgTrees.sort((a,b) => a.y - b.y);

// Foreground Trees (Framing)
const fgTrees = [
  { x: -10, y: 260, scale: 2.0, type: 0 }, 
  { x: 330, y: 250, scale: 2.2, type: 1 }, 
  { x: 290, y: 180, scale: 1.2, type: 2 }, 
  { x: -20, y: 160, scale: 1.0, type: 0 }
];

// Skier State
const skier = {
  x: W/2,
  y: 160,
  bob: 0,
  dir: 1, 
  spray: [] 
};

// --- DRAWING FUNCTIONS ---

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, 100);
  grad.addColorStop(0, P.skyTop);
  grad.addColorStop(1, P.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 100);
  
  // Retro Sun
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  ctx.arc(260, 30, 14, 0, Math.PI*2);
  ctx.fill();
}

function drawSnowGround() {
  // Stepped Gradient for depth
  const bandHeight = 16;
  const startY = 90;
  
  for(let i=0; i<10; i++) {
    ctx.fillStyle = [P.snow1, P.snow2, P.snow3][i % 3];
    ctx.fillRect(0, startY + (i * bandHeight), W, bandHeight);
    
    // Add random "noise" pixels for texture (CRT grain feel)
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for(let j=0; j<15; j++) {
      const nx = Math.random() * W;
      const ny = startY + (i * bandHeight) + Math.random() * bandHeight;
      ctx.fillRect(Math.floor(nx), Math.floor(ny), 1, 1);
    }
  }
}

function drawTree(x, y, scale, type) {
  const s = scale;
  const tx = Math.floor(x);
  const ty = Math.floor(y);
  
  // Shadow
  ctx.fillStyle = 'rgba(0, 40, 100, 0.2)';
  ctx.beginPath();
  ctx.ellipse(tx + 2*s, ty + 2, 8*s, 3*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Trunk
  drawPixelRect(tx - 1, ty - 2*s, 2, 6*s, P.treeTrunk);

  // Leaves
  const c1 = type===1 ? P.treeDark : P.treeLight;
  const c2 = type===1 ? P.treeLight : P.treeDark;

  // Bottom Layer
  drawPixelRect(tx - 7*s, ty - 2*s, 14*s, 4*s, c1);
  // Middle Layer
  drawPixelRect(tx - 5*s, ty - 6*s, 10*s, 4*s, c2);
  // Top Layer
  drawPixelRect(tx - 3*s, ty - 10*s, 6*s, 4*s, c1);
  
  // Snow Cap
  ctx.fillStyle = P.snow1;
  drawPixelRect(tx - 2*s, ty - 10*s, 4*s, 1*s, P.snow1);
}

function drawSkier(x, y, dir, bobOffset) {
  const s = 1.5; 
  const sx = Math.floor(x);
  const sy = Math.floor(y + bobOffset);
  
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(dir * s, s); 

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-7, 12, 14, 4);

  // Skis
  ctx.fillStyle = '#ddd';
  ctx.fillRect(-9, 11, 7, 2); 
  ctx.fillRect(2, 11, 7, 2);  
  ctx.fillStyle = '#999';
  ctx.fillRect(-9, 12, 7, 1); 
  ctx.fillRect(2, 12, 7, 1);

  // Legs
  ctx.fillStyle = '#333'; 
  ctx.fillRect(-5, 8, 2, 4);
  ctx.fillRect(3, 8, 2, 4);
  
  ctx.fillStyle = P.skierPants; 
  ctx.fillRect(-5, 5, 2, 4);
  ctx.fillRect(3, 5, 2, 4);

  // Body
  ctx.fillStyle = P.skierRed;
  ctx.fillRect(-4, -3, 8, 8);
  // White stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(-4, 0, 8, 2);

  // Head
  ctx.fillStyle = P.skierSkin;
  ctx.fillRect(-2, -7, 5, 4); 
  ctx.fillStyle = P.skierDark;
  ctx.fillRect(-2, -8, 5, 2); 
  
  // Goggles
  ctx.fillStyle = '#111';
  ctx.fillRect(0, -6, 3, 2);

  // Scarf
  ctx.fillStyle = '#3a86ff';
  ctx.fillRect(-3, -3, 6, 2); 
  // Tail blows in wind
  ctx.fillRect(-6, -2, 2, 4 + Math.sin(frame*0.5)*2);

  // Poles
  ctx.fillStyle = '#888';
  ctx.fillRect(-6, -2, 1, 13); 
  ctx.fillRect(5, -2, 1, 13);  

  ctx.restore();
}

function drawSnowSpray() {
  if (isStarted) {
    for(let i=0; i<3; i++) {
      skier.spray.push({
        x: skier.x + (Math.random()*10 - 5),
        y: skier.y + 10,
        vx: -skier.dir * (Math.random() * 2), 
        vy: Math.random() * 2,
        life: 1.0
      });
    }
  }

  ctx.fillStyle = P.snowSpray;
  for (let i = skier.spray.length - 1; i >= 0; i--) {
    let p = skier.spray[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.05;
    
    if(p.life <= 0) {
      skier.spray.splice(i, 1);
      continue;
    }
    
    ctx.globalAlpha = p.life;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 2, 2);
  }
  ctx.globalAlpha = 1.0;
}

function drawSnowParticles() {
  ctx.fillStyle = '#fff';
  snowParticles.forEach(p => {
    p.y += p.speed;
    p.x += p.wind;
    
    if (p.y > H) { p.y = -2; p.x = Math.random() * W; }
    if (p.x > W) p.x = 0;
    if (p.x < 0) p.x = W;
    
    ctx.globalAlpha = 0.6;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  });
  ctx.globalAlpha = 1.0;
}

// --- MAIN LOOP ---

function loop() {
  frame++;
  
  ctx.clearRect(0, 0, W, H);
  
  // 1. Sky
  drawSky();
  
  // 2. Snow Ground
  drawSnowGround();
  
  // 3. Background Trees
  bgTrees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // 4. Skier Animation Logic
  if (!isStarted) {
    // Idle: gentle bobbing and swaying
    skier.bob = Math.sin(frame * 0.08) * 1.5;
    skier.x = (W/2) + Math.sin(frame * 0.015) * 15;
    skier.dir = Math.cos(frame * 0.015) > 0 ? 1 : -1;
  } else {
    // Game Started
    skier.y -= 2.5; 
    skier.bob = Math.sin(frame * 0.4) * 1;
    skier.x += Math.sin(frame * 0.05) * 1.5;
    
    if(skier.y < 60) {
      skier.y = H - 40;
      skier.x = Math.random() * (W-60) + 30;
    }
  }
  
  // 5. Draw Skier
  drawSkier(skier.x, skier.y, skier.dir, skier.bob);
  
  // 6. Draw Spray
  drawSnowSpray();

  // 7. Foreground Trees
  fgTrees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // 8. Foreground Snow Particles
  drawSnowParticles();

  requestAnimationFrame(loop);
}

// --- INTERACTION ---

const startBtn = document.getElementById('start-btn');

startBtn.addEventListener('click', () => {
  isStarted = true;
  startBtn.style.transition = 'opacity 0.5s';
  startBtn.style.opacity = '0';
  setTimeout(() => { startBtn.style.display = 'none'; }, 500);
  
  document.querySelector('.hud-instructions').style.transition = 'opacity 0.5s';
  document.querySelector('.hud-instructions').style.opacity = '0.3';
});

requestAnimationFrame(loop);

</script>
</body>
</html>
