<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - A Winter Descent</title>
<style>
  /* 
    VISUAL DESIGN STRATEGY:
    1. Pixel-Perfect Aesthetics: Using `image-rendering: pixelated` and CSS steps().
    2. Retro Palette: Deep blues, crisp whites, and a high-contrast UI.
    3. 8-bit UI: Hard shadows, no gradients, blocky borders.
    4. Layout: HUD-style instruction panel to separate info from the art.
  */

  @font-face {
    font-family: 'RetroPixel';
    src: local('Courier New'), local('Courier'), local('monospace');
  }

  :root {
    --bg-sky-top: #1e3c72;
    --bg-sky-bot: #6a89cc;
    --ui-dark: #11151c;
    --ui-border: #3a4a5a;
    --accent-orange: #ff6b6b;
    --accent-orange-dark: #c92a2a;
    --text-main: #ffffff;
    --text-dim: #8a9aaf;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0b0d12;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'RetroPixel', monospace;
    overflow: hidden;
    color: var(--text-main);
  }

  /* Main Game Container */
  #game-container {
    position: relative;
    width: 640px;
    height: 480px;
    background: #000;
    box-shadow: 0 0 0 4px #222, 0 0 60px rgba(0,0,0,0.8);
    image-rendering: pixelated;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* Critical for pixel art look */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  /* --- UI OVERLAY --- */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 40px;
    pointer-events: none; /* Let clicks pass through to canvas where needed */
    z-index: 10;
  }

  /* Title Typography */
  h1.title {
    font-size: 64px;
    line-height: 1;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 4px;
    /* Hard pixel shadow */
    text-shadow: 
      4px 4px 0 #1e3c72, 
      -2px -2px 0 #5a7abf;
    margin-bottom: 8px;
    user-select: none;
  }

  h2.subtitle {
    font-size: 16px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 6px;
    margin-bottom: 40px;
    /* Fix visibility per critique */
    opacity: 0.9;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    user-select: none;
  }

  /* HUD Panel for Instructions */
  .hud-panel {
    pointer-events: auto;
    background: rgba(17, 21, 28, 0.85);
    border: 2px solid var(--ui-border);
    padding: 12px 24px;
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.5);
    max-width: 400px;
  }

  .hud-row {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .key-group {
    display: flex;
    gap: 4px;
  }

  .key {
    background: #2a3a4a;
    color: #fff;
    padding: 2px 6px;
    border-bottom: 2px solid #111;
    font-weight: bold;
    font-size: 11px;
  }

  /* 8-Bit Start Button */
  .start-btn {
    pointer-events: auto;
    position: relative;
    background-color: var(--accent-orange);
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 12px 32px;
    border: none;
    cursor: pointer;
    /* Hard offset shadow */
    box-shadow: 
      inset -2px -2px 0px rgba(0,0,0,0.2),
      inset 2px 2px 0px rgba(255,255,255,0.3),
      4px 4px 0px #000; 
    transition: transform 0.1s;
    outline: none;
  }

  .start-btn:hover {
    background-color: #ff8787;
    transform: translateY(-2px);
    box-shadow: 
      inset -2px -2px 0px rgba(0,0,0,0.2),
      inset 2px 2px 0px rgba(255,255,255,0.3),
      6px 6px 0px #000;
  }

  .start-btn:active {
    transform: translateY(2px);
    box-shadow: 
      inset -2px -2px 0px rgba(0,0,0,0.2),
      inset 2px 2px 0px rgba(255,255,255,0.3),
      0px 0px 0px #000;
  }

  /* CRT Effects */
  .scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.1) 50%,
      rgba(0,0,0,0.1)
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 20;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 15;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene" width="320" height="240"></canvas>
  
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div id="ui-layer">
    <h1 class="title">SkiFree</h1>
    <h2 class="subtitle">A Winter Descent</h2>
    
    <div class="hud-panel">
      <div class="hud-row">
        <div class="key-group"><span class="key">←</span><span class="key">→</span></div>
        <span>STEER</span>
      </div>
      <div class="hud-row">
        <div class="key-group"><span class="key">↑</span></div>
        <span>ACCELERATE</span>
      </div>
      <div class="hud-row" style="color: #ff6b6b; margin-top: 4px;">
        <span>AVOID THE TREES</span>
      </div>
    </div>

    <button class="start-btn" id="start-btn">START GAME</button>
  </div>
</div>

<script>
/**
 * RENDER ENGINE & ASSETS
 * Pure procedural generation to keep file self-contained.
 */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320;
const H = 240;

// Palette
const P = {
  skyTop: '#1e3c72',
  skyBot: '#6a89cc',
  snowLight: '#f0f4f8',
  snowDark: '#d9e2ec',
  snowShadow: '#bcccdc',
  treeDark: '#1a3c28',
  treeLight: '#265c3b',
  trunk: '#3d2b1f',
  skierRed: '#e03c31',
  skierSkin: '#ffccaa',
  skierDark: '#801e16'
};

// State
let frame = 0;
let isStarted = false;

// Assets
const snowParticles = [];
for(let i=0; i<80; i++) {
  snowParticles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() < 0.2 ? 2 : 1, // size
    speed: 0.5 + Math.random() * 1.5,
    wind: -0.2 + Math.random() * 0.4
  });
}

// Background Trees (Static)
const bgTrees = [];
for(let i=0; i<20; i++) {
  bgTrees.push({
    x: Math.random() * W,
    y: 60 + Math.random() * 140,
    scale: 0.5 + Math.random() * 0.6,
    type: Math.random() > 0.5 ? 1 : 2
  });
}
bgTrees.sort((a,b) => a.y - b.y); // Sort by depth

// Skier State
const skier = {
  x: W/2,
  y: 180,
  bob: 0,
  dir: 1, // 1 right, -1 left
  speed: 0,
  animFrame: 0
};

// --- DRAWING FUNCTIONS ---

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, 80);
  grad.addColorStop(0, P.skyTop);
  grad.addColorStop(1, P.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 80);
  
  // Sun/Moon
  ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.beginPath();
  ctx.arc(260, 40, 20, 0, Math.PI*2);
  ctx.fill();
}

function drawSnowGround() {
  // Base
  ctx.fillStyle = P.snowLight;
  ctx.fillRect(0, 70, W, H-70);
  
  // Texture/Noise
  for(let i=0; i<300; i++) {
    const tx = Math.random() * W;
    const ty = 70 + Math.random() * (H-70);
    ctx.fillStyle = Math.random() > 0.5 ? P.snowDark : P.snowShadow;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(Math.floor(tx), Math.floor(ty), 2, 2);
  }
  ctx.globalAlpha = 1.0;
}

function drawTree(x, y, scale, type) {
  const s = scale;
  const tx = Math.floor(x);
  const ty = Math.floor(y);
  
  // Shadow
  ctx.fillStyle = 'rgba(100, 120, 150, 0.3)';
  ctx.beginPath();
  ctx.ellipse(tx + 2*s, ty + 2, 6*s, 2*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Trunk
  drawPixelRect(tx - 1, ty - 2*s, 2, 5*s, P.trunk);

  // Leaves (Procedural pixel tree)
  // Bottom layer
  drawPixelRect(tx - 6*s, ty - 2*s, 12*s, 3*s, type===1 ? P.treeDark : P.treeLight);
  // Middle layer
  drawPixelRect(tx - 5*s, ty - 5*s, 10*s, 3*s, type===1 ? P.treeLight : P.treeDark);
  // Top layer
  drawPixelRect(tx - 4*s, ty - 8*s, 8*s, 3*s, type===1 ? P.treeDark : P.treeLight);
  // Peak
  drawPixelRect(tx - 2*s, ty - 11*s, 4*s, 3*s, P.treeLight);
  
  // Snow Cap on tree
  ctx.fillStyle = P.snowLight;
  drawPixelRect(tx - 2*s, ty - 10*s, 4*s, 1*s, P.snowLight);
}

function drawSkier(x, y, dir, bobOffset) {
  const s = 1;
  const sx = Math.floor(x);
  const sy = Math.floor(y + bobOffset);
  
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(dir, 1); // Flip for direction

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-6, 10, 12, 3);

  // Skis
  ctx.fillStyle = '#ddd';
  ctx.fillRect(-7, 9, 6, 2); // Left ski
  ctx.fillRect(1, 9, 6, 2);  // Right ski
  ctx.fillStyle = '#999';
  ctx.fillRect(-7, 10, 6, 1); // Binding shadow
  ctx.fillRect(1, 10, 6, 1);

  // Legs
  ctx.fillStyle = '#333'; // Boots
  ctx.fillRect(-5, 7, 2, 3);
  ctx.fillRect(3, 7, 2, 3);
  
  ctx.fillStyle = P.skierRed; // Pants
  ctx.fillRect(-5, 4, 2, 4);
  ctx.fillRect(3, 4, 2, 4);

  // Body
  ctx.fillStyle = P.skierRed;
  ctx.fillRect(-4, -3, 8, 8);
  // White stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(-4, 0, 8, 2);

  // Head
  ctx.fillStyle = P.skierSkin;
  ctx.fillRect(-2, -7, 5, 4); // Face
  ctx.fillStyle = P.skierDark;
  ctx.fillRect(-2, -8, 5, 2); // Hair/Hat
  
  // Goggles
  ctx.fillStyle = '#111';
  ctx.fillRect(0, -6, 3, 2);

  // Scarf (Animated slightly)
  ctx.fillStyle = '#3a86ff';
  ctx.fillRect(-3, -3, 6, 2); // Neck
  // Tail blows in wind (opposite to dir)
  ctx.fillRect(-6, -2, 2, 4 + Math.sin(frame*0.5)*2);

  // Poles
  ctx.fillStyle = '#888';
  ctx.fillRect(-6, -2, 1, 11); // Left pole
  ctx.fillRect(5, -2, 1, 11);  // Right pole

  ctx.restore();
}

function drawSnowParticles() {
  ctx.fillStyle = '#fff';
  snowParticles.forEach(p => {
    p.y += p.speed;
    p.x += p.wind;
    
    if (p.y > H) { p.y = -2; p.x = Math.random() * W; }
    if (p.x > W) p.x = 0;
    if (p.x < 0) p.x = W;
    
    ctx.globalAlpha = 0.6;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  });
  ctx.globalAlpha = 1.0;
}

// --- MAIN LOOP ---

function loop() {
  frame++;
  
  // Clear
  ctx.clearRect(0, 0, W, H);
  
  // 1. Sky
  drawSky();
  
  // 2. Snow Ground
  drawSnowGround();
  
  // 3. Background Trees (Parallax effect if skier moves, but static for now)
  bgTrees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // 4. Skier Animation Logic
  if (!isStarted) {
    // Idle animation: bobbing and swaying
    skier.bob = Math.sin(frame * 0.1) * 2;
    skier.x = (W/2) + Math.sin(frame * 0.02) * 10;
    skier.dir = Math.cos(frame * 0.02) > 0 ? 1 : -1;
  } else {
    // Simple movement logic (just for visual feedback on start)
    skier.y -= 2; // Move "up" screen (downhill)
    skier.bob = Math.sin(frame * 0.5) * 1;
    skier.x += Math.sin(frame * 0.05) * 2;
    
    // Wrap around for demo loop
    if(skier.y < 50) {
      skier.y = H - 40;
      skier.x = Math.random() * (W-40) + 20;
    }
  }
  
  // 5. Draw Skier
  drawSkier(skier.x, skier.y, skier.dir, skier.bob);

  // 6. Foreground Snow
  drawSnowParticles();

  requestAnimationFrame(loop);
}

// --- INTERACTION ---

const startBtn = document.getElementById('start-btn');

startBtn.addEventListener('click', () => {
  isStarted = true;
  startBtn.style.display = 'none'; // Hide button
  document.querySelector('.hud-panel').style.display = 'none'; // Hide instructions
  
  // Play a sound or flash effect here if desired
  // For now, just the skier starts moving rapidly
});

// Start Loop
requestAnimationFrame(loop);

</script>
</body>
</html>
