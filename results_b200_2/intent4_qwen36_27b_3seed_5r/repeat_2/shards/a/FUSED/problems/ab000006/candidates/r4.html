<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    DESIGN STRATEGY (REVISED):
    1. Typography: System 'Courier New' heavily modified with text-stroke and shadows to mimic chunky pixel fonts.
    2. Composition: Clear hierarchy. Title -> Instructions (Opaque Box) -> Action Button -> Environment.
    3. Aesthetic: High contrast, "pressed" pixel UI, crisp vector-based pixel art on Canvas.
  */

  :root {
    --ui-bg: #111;
    --ui-panel: #000000; /* Fully opaque per critique */
    --ui-panel-border: #ffffff;
    --ui-accent: #d32f2f; /* Retro Red */
    --ui-accent-light: #ff5252;
    --ui-accent-dark: #8e0000;
    --ui-text: #ffffff;
    --ui-highlight: #ffeb3b; /* Bright Yellow for warnings */
    --font-stack: 'Courier New', Courier, monospace; /* System fallback */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: var(--font-stack);
    overflow: hidden;
    color: var(--ui-text);
    user-select: none;
  }

  /* The Arcade Cabinet Container */
  #game-container {
    position: relative;
    width: 640px;
    height: 480px;
    background: #000;
    /* Retro Bezel */
    box-shadow: 0 0 0 8px #333, 0 0 0 10px #111, 0 20px 50px rgba(0,0,0,0.9);
    overflow: hidden;
    border-radius: 4px;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* Essential for the pixel look */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  /* --- UI LAYER --- */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
  }

  /* TOP SECTION: Title & Instructions */
  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* REVISED TITLE: Chunky, Outlined, No smooth gradient shadow */
  h1.title {
    font-family: var(--font-stack);
    font-weight: 900;
    font-size: 72px;
    line-height: 1;
    color: #fff;
    letter-spacing: -4px;
    margin-bottom: 12px;
    text-transform: uppercase;
    /* Pixel-perfect hard shadow */
    text-shadow: 
      4px 4px 0 #000,
      -2px -2px 0 #000,
      2px -2px 0 #000,
      -2px 2px 0 #000,
      0 4px 0 #000;
    /* Subtle "Glow" effect using stacked shadows */
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
  }

  /* REVISED INSTRUCTIONS: Opaque Box, High Contrast */
  .hud-instructions {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--ui-panel); /* Fully opaque */
    padding: 10px 20px;
    /* Pixel Border Effect */
    border-top: 4px solid #fff;
    border-bottom: 4px solid #555;
    border-left: 4px solid #fff;
    border-right: 4px solid #555;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    
    font-family: var(--font-stack);
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .hud-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hud-divider {
    width: 2px;
    height: 20px;
    background: #444;
  }

  /* REVISED ARROWS: Larger, clearer */
  .key-icon {
    width: 24px;
    height: 24px;
    background: #ccc;
    border: 2px solid #000;
    border-bottom: 4px solid #000;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  
  /* Arrow Shapes using borders */
  .key-icon::after { 
    content: ''; 
    display: block;
    border: 4px solid transparent;
  }
  
  .key-icon.left::after { border-right-color: #000; margin-left: 2px; }
  .key-icon.right::after { border-left-color: #000; margin-right: 2px; }
  .key-icon.up::after { border-bottom-color: #000; margin-top: 2px; }

  /* Warning Text */
  .warning-text {
    color: var(--ui-highlight);
    text-shadow: 1px 1px 0 #000;
  }

  /* BOTTOM SECTION: Start Button */
  .bottom-section {
    padding-bottom: 10px;
    display: flex;
    justify-content: center;
    pointer-events: auto;
  }

  /* REVISED BUTTON: 3D Pixel Art Style */
  .start-btn {
    position: relative;
    background-color: var(--ui-accent);
    color: #fff;
    font-family: var(--font-stack);
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 12px 48px;
    cursor: pointer;
    outline: none;
    
    /* The "Pixel 3D" Border Construction */
    border: 4px solid #000;
    box-shadow: 
      inset 4px 4px 0px 0px var(--ui-accent-light), /* Inner Highlight */
      inset -4px -4px 0px 0px var(--ui-accent-dark), /* Inner Shadow */
      6px 6px 0px 0px #000; /* Drop Shadow */
      
    transition: transform 0.05s, box-shadow 0.05s;
    animation: pulse 2s infinite ease-in-out;
  }

  .start-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 
      inset 4px 4px 0px 0px var(--ui-accent-light),
      inset -4px -4px 0px 0px var(--ui-accent-dark),
      8px 8px 0px 0px #000;
  }

  .start-btn:active {
    /* Pressed State */
    transform: translate(4px, 4px);
    box-shadow: 
      inset 4px 4px 0px 0px var(--ui-accent-dark),
      inset -4px -4px 0px 0px var(--ui-accent-light),
      0px 0px 0px 0px #000; /* No drop shadow when pressed */
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.9; }
  }

  /* CRT OVERLAYS */
  /* Critique: Removed scanlines from UI layer by placing this at z-index 5 (below UI) */
  .scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.15) 50%,
      rgba(0,0,0,0.15)
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 5; /* Below UI (z-index 10) */
  }

  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 6;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene" width="320" height="240"></canvas>
  
  <!-- CRT Effects -->
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    <!-- Top: Title & HUD -->
    <div class="top-section">
      <h1 class="title">SKIFREE</h1>
      
      <div class="hud-instructions">
        <div class="hud-item">
          <div class="key-icon left"></div>
          <div class="key-icon right"></div>
          <span>STEER</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
          <div class="key-icon up"></div>
          <span>GO</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item warning-text">
          <span>AVOID TREES!</span>
        </div>
      </div>
    </div>

    <!-- Bottom: Action -->
    <div class="bottom-section">
      <button class="start-btn" id="start-btn">START GAME</button>
    </div>
  </div>
</div>

<script>
/**
 * RENDER ENGINE & ASSETS
 * Procedural pixel art generation using Canvas API.
 * Focusing on crisp "pixel" rendering (fillRect only).
 */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320;
const H = 240;

// Palette (Refined for contrast)
const P = {
  skyTop: '#0046ad',
  skyBot: '#6a89cc',
  // Snow Palette - varied for texture
  snow1: '#f0f4f8',
  snow2: '#e3e8ef',
  snow3: '#d6dde6',
  snow4: '#c9d2dd',
  // Tree Palette
  treeDark: '#1a3c28',
  treeLight: '#265c3b',
  treeTrunk: '#3d2b1f',
  // Skier Palette
  skierRed: '#e03c31',
  skierSkin: '#ffccaa',
  skierDark: '#801e16',
  skierPants: '#1a237e',
  snowSpray: '#ffffff'
};

// State
let frame = 0;
let isStarted = false;

// Assets: Snow Particles (Wind effect)
const snowParticles = [];
for(let i=0; i<80; i++) {
  snowParticles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() < 0.2 ? 2 : 1, // Occasional large flake
    speed: 1.0 + Math.random() * 2.0,
    wind: -0.5 + Math.random() * 1.0 // Mostly blowing left
  });
}

// Background Trees (Midground) - Randomized
const bgTrees = [];
for(let i=0; i<35; i++) {
  bgTrees.push({
    x: Math.random() * W,
    y: 80 + Math.random() * 140, // Spread across slope
    scale: 0.3 + Math.random() * 0.5,
    type: Math.floor(Math.random() * 3) // 0, 1, or 2
  });
}
bgTrees.sort((a,b) => a.y - b.y);

// Foreground Trees (Framing) - Variety added
const fgTrees = [
  { x: -10, y: 260, scale: 2.0, type: 0 }, // Bottom Left (Big)
  { x: 330, y: 250, scale: 2.2, type: 1 }, // Bottom Right (Big)
  { x: 290, y: 180, scale: 1.2, type: 2 }, // Mid Right
  { x: -20, y: 160, scale: 1.0, type: 0 }  // Mid Left
];

// Fallen Tree (Critique Item 4)
const fallenTree = { x: 50, y: 190, rotation: 0.2 };

// Skier State
const skier = {
  x: W/2,
  y: 150,
  bob: 0,
  dir: 1, 
  speed: 0,
  animFrame: 0,
  spray: [] // Snow spray particles
};

// --- DRAWING FUNCTIONS ---

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawSky() {
  // Sky Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 90);
  grad.addColorStop(0, P.skyTop);
  grad.addColorStop(1, P.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 90);
  
  // Retro Sun
  ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.beginPath();
  ctx.arc(260, 30, 14, 0, Math.PI*2);
  ctx.fill();
}

function drawSnowGround() {
  // Stepped Gradient for depth (Critique Item 4: Texture)
  const bandHeight = 16;
  const startY = 80;
  
  for(let i=0; i<12; i++) {
    // Cycle through snow colors
    ctx.fillStyle = [P.snow1, P.snow2, P.snow3, P.snow4][i % 4];
    ctx.fillRect(0, startY + (i * bandHeight), W, bandHeight);
    
    // Add random "noise" pixels for texture
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for(let j=0; j<10; j++) {
      const nx = Math.random() * W;
      const ny = startY + (i * bandHeight) + Math.random() * bandHeight;
      ctx.fillRect(Math.floor(nx), Math.floor(ny), 1, 1);
    }
  }
}

function drawTree(x, y, scale, type) {
  const s = scale;
  const tx = Math.floor(x);
  const ty = Math.floor(y);
  
  // Shadow
  ctx.fillStyle = 'rgba(0, 40, 100, 0.25)';
  ctx.beginPath();
  ctx.ellipse(tx + 2*s, ty + 2, 8*s, 3*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Trunk
  drawPixelRect(tx - 1, ty - 2*s, 2, 6*s, P.treeTrunk);

  // Leaves - Layered Rectangles (Type variation)
  const c1 = type===1 ? P.treeDark : P.treeLight;
  const c2 = type===1 ? P.treeLight : P.treeDark;

  // Bottom Layer
  drawPixelRect(tx - 7*s, ty - 2*s, 14*s, 4*s, c1);
  // Middle Layer
  drawPixelRect(tx - 5*s, ty - 6*s, 10*s, 4*s, c2);
  // Top Layer
  drawPixelRect(tx - 3*s, ty - 10*s, 6*s, 4*s, c1);
  
  // Snow Cap
  ctx.fillStyle = P.snow1;
  drawPixelRect(tx - 2*s, ty - 10*s, 4*s, 1*s, P.snow1);
}

function drawFallenTree(x, y) {
  // Simple rotated log representation
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(0.5);
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0, 4, 40, 6);
  
  // Log
  ctx.fillStyle = P.treeTrunk;
  ctx.fillRect(0, 0, 40, 6);
  
  // Snow on log
  ctx.fillStyle = P.snow1;
  ctx.fillRect(0, 0, 40, 2);
  
  ctx.restore();
}

function drawSkier(x, y, dir, bobOffset) {
  const s = 1.5; 
  const sx = Math.floor(x);
  const sy = Math.floor(y + bobOffset);
  
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(dir * s, s); // Flip for direction

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-7, 12, 14, 4);

  // Skis
  ctx.fillStyle = '#ddd';
  ctx.fillRect(-9, 11, 7, 2); // Left ski
  ctx.fillRect(2, 11, 7, 2);  // Right ski
  ctx.fillStyle = '#999';
  ctx.fillRect(-9, 12, 7, 1); // Binding shadow
  ctx.fillRect(2, 12, 7, 1);

  // Legs
  ctx.fillStyle = '#333'; // Boots
  ctx.fillRect(-5, 8, 2, 4);
  ctx.fillRect(3, 8, 2, 4);
  
  ctx.fillStyle = P.skierPants; // Pants
  ctx.fillRect(-5, 5, 2, 4);
  ctx.fillRect(3, 5, 2, 4);

  // Body
  ctx.fillStyle = P.skierRed;
  ctx.fillRect(-4, -3, 8, 8);
  // White stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(-4, 0, 8, 2);

  // Head
  ctx.fillStyle = P.skierSkin;
  ctx.fillRect(-2, -7, 5, 4); // Face
  ctx.fillStyle = P.skierDark;
  ctx.fillRect(-2, -8, 5, 2); // Hair/Hat
  
  // Goggles
  ctx.fillStyle = '#111';
  ctx.fillRect(0, -6, 3, 2);

  // Scarf (Animated)
  ctx.fillStyle = '#3a86ff';
  ctx.fillRect(-3, -3, 6, 2); // Neck
  // Tail blows in wind (opposite to skier dir)
  ctx.fillRect(-6, -2, 2, 4 + Math.sin(frame*0.5)*2);

  // Poles
  ctx.fillStyle = '#888';
  ctx.fillRect(-6, -2, 1, 13); // Left pole
  ctx.fillRect(5, -2, 1, 13);  // Right pole

  ctx.restore();
}

function drawSnowSpray() {
  // Add new spray particles if moving
  if (isStarted) {
    for(let i=0; i<3; i++) {
      skier.spray.push({
        x: skier.x + (Math.random()*10 - 5),
        y: skier.y + 10,
        vx: -skier.dir * (Math.random() * 2), // Blow opposite to dir
        vy: Math.random() * 2,
        life: 1.0
      });
    }
  }

  // Update and draw
  ctx.fillStyle = P.snowSpray;
  for (let i = skier.spray.length - 1; i >= 0; i--) {
    let p = skier.spray[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.05;
    
    if(p.life <= 0) {
      skier.spray.splice(i, 1);
      continue;
    }
    
    ctx.globalAlpha = p.life;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 2, 2);
  }
  ctx.globalAlpha = 1.0;
}

function drawSnowParticles() {
  ctx.fillStyle = '#fff';
  snowParticles.forEach(p => {
    p.y += p.speed;
    p.x += p.wind;
    
    if (p.y > H) { p.y = -2; p.x = Math.random() * W; }
    if (p.x > W) p.x = 0;
    if (p.x < 0) p.x = W;
    
    ctx.globalAlpha = 0.6;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  });
  ctx.globalAlpha = 1.0;
}

// --- MAIN LOOP ---

function loop() {
  frame++;
  
  // Clear
  ctx.clearRect(0, 0, W, H);
  
  // 1. Sky
  drawSky();
  
  // 2. Snow Ground (Stepped)
  drawSnowGround();
  
  // 3. Background Trees (Midground)
  bgTrees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // 4. Fallen Tree Detail
  drawFallenTree(fallenTree.x, fallenTree.y);

  // 5. Skier Animation Logic
  if (!isStarted) {
    // Idle animation: gentle bobbing and swaying
    skier.bob = Math.sin(frame * 0.08) * 1.5;
    skier.x = (W/2) + Math.sin(frame * 0.015) * 15;
    skier.dir = Math.cos(frame * 0.015) > 0 ? 1 : -1;
  } else {
    // Game Started: Skier moves down (screen Y decreases)
    skier.y -= 2.5; 
    skier.bob = Math.sin(frame * 0.4) * 1;
    skier.x += Math.sin(frame * 0.05) * 1.5;
    
    // Wrap around for demo loop
    if(skier.y < 60) {
      skier.y = H - 40;
      skier.x = Math.random() * (W-60) + 30;
    }
  }
  
  // 6. Draw Skier
  drawSkier(skier.x, skier.y, skier.dir, skier.bob);
  
  // 7. Draw Spray (Behind foreground trees if overlapping, but simple z-order here)
  drawSnowSpray();

  // 8. Foreground Trees (Framing)
  fgTrees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // 9. Foreground Snow Particles
  drawSnowParticles();

  requestAnimationFrame(loop);
}

// --- INTERACTION ---

const startBtn = document.getElementById('start-btn');

startBtn.addEventListener('click', () => {
  isStarted = true;
  // Fade out button smoothly
  startBtn.style.transition = 'opacity 0.5s';
  startBtn.style.opacity = '0';
  setTimeout(() => { startBtn.style.display = 'none'; }, 500);
  
  // Fade HUD slightly
  document.querySelector('.hud-instructions').style.transition = 'opacity 0.5s';
  document.querySelector('.hud-instructions').style.opacity = '0.3';
});

// Start Loop
requestAnimationFrame(loop);

</script>
</body>
</html>
