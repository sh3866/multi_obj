<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix</title>
    <style>
        :root {
            --bg-deep: #020204;
            --bg-panel: rgba(15, 18, 26, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --accent-gold: #fbbf24;
            --accent-gold-dim: #78350f;
            --accent-cyan: #22d3ee;
            --accent-red: #ef4444;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Typography Pairing */
            --font-header: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Background Atmosphere & Noise --- */
        .atmosphere {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 40%, #1e1b4b 0%, transparent 60%), /* Indigo glow */
                radial-gradient(circle at 20% 90%, #312e81 0%, transparent 50%),
                radial-gradient(circle at 80% 10%, #0f172a 0%, transparent 50%),
                var(--bg-deep);
            z-index: 0;
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.07;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- Sidebar (Glassmorphism) --- */
        .sidebar {
            width: 380px;
            background: var(--bg-panel);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 10px 0 40px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            padding: 4px;
            margin: 0 auto 1.2rem;
            position: relative;
            background: linear-gradient(135deg, #334155, #0f172a);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--text-muted);
            /* Geometric Placeholder Pattern */
            background-image: 
                linear-gradient(45deg, #0f172a 25%, transparent 25%, transparent 75%, #0f172a 75%, #0f172a), 
                linear-gradient(45deg, #0f172a 25%, transparent 25%, transparent 75%, #0f172a 75%, #0f172a);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.8;
        }

        h1 {
            font-family: var(--font-header);
            font-size: 2rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .level-badge {
            position: absolute;
            bottom: 10px;
            right: calc(50% - 60px);
            background: var(--bg-deep);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: var(--font-body);
            letter-spacing: 0.1em;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }

        .class-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 0.5rem;
            font-weight: 500;
            opacity: 0.7;
        }

        /* --- Reordered Sections --- */
        .panel-section {
            margin-bottom: 2rem;
        }

        .panel-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: block;
            font-weight: 600;
        }

        /* Prominent Points Card */
        .points-card {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.05), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
            margin-bottom: 2.5rem; /* Extra spacing */
            position: relative;
            overflow: hidden;
        }

        .points-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
        }

        .points-info {
            display: flex;
            flex-direction: column;
        }

        .points-label {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            opacity: 0.8;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .points-value {
            font-family: var(--font-header);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
            line-height: 1;
        }

        .points-icon {
            font-size: 2rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* XP Bar */
        .xp-container {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .xp-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .progress-track {
            height: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #b45309, var(--accent-gold));
            width: 65%;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
            position: relative;
        }
        
        /* Shimmer effect on XP */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .stat-card span {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .stat-card strong {
            font-size: 1.25rem;
            color: var(--text-main);
            font-family: var(--font-header);
            font-weight: 600;
        }

        /* Controls */
        .controls-area {
            margin-top: auto;
            display: flex;
            gap: 12px;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }

        .btn {
            flex: 1;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }
        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--accent-red);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        /* High Contrast CTA */
        .btn-save {
            background: var(--accent-cyan);
            color: #0f172a;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
        }
        .btn-save:hover {
            background: #67e8f9;
            transform: translateY(-1px);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.6);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: grab;
        }
        
        .main-stage:active {
            cursor: grabbing;
        }

        .screen-title {
            position: absolute;
            top: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-header);
            font-size: 2.5rem;
            color: var(--text-main);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.9;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
            font-weight: 700;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 1.5rem;
            border-radius: 6px;
            width: 300px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translate(20px, 20px);
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
        }

        .tooltip.visible {
            opacity: 1;
            transform: translate(25px, 25px);
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.8rem;
        }

        .tooltip-title {
            font-family: var(--font-header);
            font-size: 1.4rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tooltip-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .tooltip-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.2rem;
        }

        .tooltip-stats {
            font-size: 1rem;
            color: var(--accent-cyan);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 211, 238, 0.1);
            padding: 8px;
            border-radius: 4px;
        }
        
        .tooltip-stats::before {
            content: '✦';
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

    </style>
</head>
<body>

    <div class="atmosphere"></div>
    <div class="noise-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <h1>Kaelen</h1>
            <span class="level-badge">LVL 42</span>
            <div class="class-title">Arcane Weaver</div>
        </div>

        <!-- Moved Points to Top for Hierarchy -->
        <div class="panel-section">
            <div class="points-card">
                <div class="points-info">
                    <span class="points-label">Available Points</span>
                    <span class="points-value" id="points-display">12</span>
                </div>
                <div class="points-icon">◆</div>
            </div>
        </div>

        <div class="panel-section">
            <span class="panel-label">Experience</span>
            <div class="xp-container">
                <div class="xp-header">
                    <span>Level 42</span>
                    <span>65,400 / 100,000</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <span class="panel-label">Attributes</span>
            <div class="stat-grid">
                <div class="stat-card">
                    <span>Intelligence</span>
                    <strong>18</strong>
                </div>
                <div class="stat-card">
                    <span>Willpower</span>
                    <strong>14</strong>
                </div>
                <div class="stat-card">
                    <span>Mana</span>
                    <strong>450</strong>
                </div>
                <div class="stat-card">
                    <span>Crit Chance</span>
                    <strong>12%</strong>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <button class="btn btn-reset" onclick="resetTree()">Reset</button>
            <button class="btn btn-save" onclick="alert('Build Saved!')">Save Build</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage" id="main-stage">
        <div class="screen-title">Talent Matrix</div>
        <canvas id="skill-tree"></canvas>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const mainStage = document.getElementById('main-stage');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1.3; // Slightly zoomed in
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        let dragThreshold = 5;
        let startDragX, startDragY;
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        // Adjusted coordinates for better layout
        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "The source of your magical power. Unlocks all paths.", stat: "+5% Mana Regen", icon: "✧", unlocked: true, color: "#fbbf24" },
            
            // Left Branch: Destruction
            { id: 1, x: -280, y: -200, name: "Fire Affinity", type: "Passive", desc: "Your fire spells burn hotter.", stat: "+15% Fire Dmg", icon: "🔥", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: -280, y: -420, name: "Combustion", type: "Active", desc: "Spells have a chance to ignite targets.", stat: "Ignite DoT +20%", icon: "☀", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 3, x: -560, y: -310, name: "Inferno", type: "Ultimate", desc: "Unleash a devastating firestorm.", stat: "Massive AoE Dmg", icon: "☠", unlocked: false, color: "#ef4444", parents: [2] },
            { id: 4, x: -120, y: -420, name: "Haste", type: "Passive", desc: "Spells cast faster.", stat: "+20% Cast Speed", icon: "⚡", unlocked: false, color: "#ef4444", parents: [1] },

            // Right Branch: Ice
            { id: 5, x: 280, y: -200, name: "Frost Touch", type: "Passive", desc: "Attacks apply a chilling aura.", stat: "Slow Enemies 10%", icon: "❄", unlocked: false, color: "#3b82f6", parents: [0] },
            { id: 6, x: 280, y: -420, name: "Deep Freeze", type: "Passive", desc: "Cold effects stack.", stat: "Max Slow 50%", icon: "🧊", unlocked: false, color: "#3b82f6", parents: [5] },
            { id: 7, x: 560, y: -310, name: "Glacial Storm", type: "Ultimate", desc: "Summon a blizzard.", stat: "Heavy Dmg + Stun", icon: "❄", unlocked: false, color: "#3b82f6", parents: [6] },
            { id: 8, x: 120, y: -420, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+15% Shield", icon: "🛡", unlocked: false, color: "#3b82f6", parents: [5] },

            // Center Branch: Utility
            { id: 9, x: 0, y: -240, name: "Arcane Intellect", type: "Passive", desc: "Boosts raw intelligence.", stat: "+10 Int", icon: "👁", unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: -480, name: "Mana Siphon", type: "Active", desc: "Restore mana on kill.", stat: "10% Lifesteal Mana", icon: "💧", unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: -720, name: "Archmage", type: "Trait", desc: "The pinnacle of magic.", stat: "+10% All Stats", icon: "♛", unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom Branch: Defense
            { id: 12, x: 0, y: 240, name: "Mental Fortitude", type: "Defense", desc: "Resist magical damage.", stat: "-15% Dmg Taken", icon: "🧠", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -220, y: 480, name: "Shield Wall", type: "Defense", desc: "Massive mana increase.", stat: "+500 Mana", icon: "🛡", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 220, y: 480, name: "Evasion", type: "Defense", desc: "Dodge magical attacks.", stat: "+8% Dodge", icon: "💨", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = mainStage.clientWidth;
            height = mainStage.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            offsetX = width / 2;
            offsetY = height / 2;
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isPathAvailable = parent.unlocked && !child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Smoother Bezier
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            // Thicker paths
            ctx.lineWidth = isPathUnlocked ? 8 : 4;
            ctx.lineCap = 'round';
            
            if (isPathUnlocked) {
                // Glowing active path
                ctx.shadowBlur = 20;
                ctx.shadowColor = child.color;
                ctx.strokeStyle = child.color;
                ctx.globalAlpha = 1;
            } else if (isPathAvailable) {
                // Path to available node (dimmer)
                ctx.shadowBlur = 0;
                const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, 'rgba(255,255,255,0.05)');
                ctx.strokeStyle = grad;
                ctx.globalAlpha = 0.4;
            } else {
                // Locked path
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.globalAlpha = 1;
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0; 
            ctx.globalAlpha = 1;
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            // TRIPLE SIZE: Base radius ~45-60
            const radius = (node.type === 'Ultimate' ? 60 : 45) * scale;
            
            // Outer Glow (High Blur)
            if (node.unlocked) {
                ctx.shadowBlur = 40;
                ctx.shadowColor = node.color;
            } else {
                ctx.shadowBlur = 0;
            }

            // Main Circle Background
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            
            // Gradient Fill
            const grad = ctx.createRadialGradient(pos.x, pos.y, radius * 0.2, pos.x, pos.y, radius);
            if (node.unlocked) {
                grad.addColorStop(0, node.color);
                grad.addColorStop(1, adjustColor(node.color, -50)); // Darker edge
            } else {
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            
            // Rim Light / Border
            ctx.lineWidth = node.unlocked ? 4 : 2;
            ctx.strokeStyle = node.unlocked ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.1)';
            ctx.stroke();
            
            // Icon (Larger)
            ctx.shadowBlur = 0;
            ctx.fillStyle = node.unlocked ? '#fff' : '#475569';
            ctx.font = `${node.type === 'Ultimate' ? 40 : 32}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.icon, pos.x, pos.y + 2);

            // Hover Effect (Rim Highlight)
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 8, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Label (Typography)
            ctx.fillStyle = node.unlocked ? '#f8fafc' : '#64748b';
            ctx.font = `bold ${14 * scale}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + 15);
            ctx.shadowBlur = 0;
        }
        
        // Helper to darken hex colors for gradients
        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Colorize type
            ttType.style.color = node.color;
            ttType.style.backgroundColor = node.color + '22'; // Add transparency

            // Position tooltip
            let left = mouseX + 25;
            let top = mouseY + 25;
            
            // Keep within bounds
            if (left + 320 > width) left = mouseX - 340;
            if (top + 200 > height) top = mouseY - 200;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' ? 60 : 45);
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        mainStage.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            // Hover detection
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = ((node.type === 'Ultimate' ? 60 : 45) + 10) * scale;
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                mainStage.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                } else {
                    // Just update position if already hovering same node
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                mainStage.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        mainStage.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startDragX = e.clientX - rect.left;
            startDragY = e.clientY - rect.top;
            lastMouseX = startDragX;
            lastMouseY = startDragY;
            isDragging = false; // Start false, set true on move
            mainStage.style.cursor = 'grabbing';
        });

        mainStage.addEventListener('mousemove', (e) => {
             // Detect drag start
             if(e.buttons === 1) {
                const rect = canvas.getBoundingClientRect();
                const dx = Math.abs(e.clientX - rect.left - startDragX);
                const dy = Math.abs(e.clientY - rect.top - startDragY);
                if (dx > dragThreshold || dy > dragThreshold) {
                    isDragging = true;
                    hideTooltip();
                }
             }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                mainStage.style.cursor = 'grab';
            }
        });
        
        mainStage.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        // Reset Logic
        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
</html>
