<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: rgba(12, 14, 20, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --accent-gold: #ffd700;
            --accent-gold-dim: #78350f;
            --accent-cyan: #22d3ee;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            
            /* Typography Pairing */
            --font-header: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Background Atmosphere --- */
        .atmosphere {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 40%, #1e1b4b 0%, transparent 60%), 
                radial-gradient(circle at 20% 90%, #312e81 0%, transparent 50%),
                radial-gradient(circle at 80% 10%, #0f172a 0%, transparent 50%),
                var(--bg-deep);
            z-index: 0;
            pointer-events: none;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 360px;
            background: var(--bg-panel);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            z-index: 10;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 10px 0 50px rgba(0,0,0,0.6);
            position: relative;
        }

        /* 1. Identity Section */
        .section-identity {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .avatar-ring {
            width: 100px;
            height: 100px;
            margin: 0 auto 1rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rotating Rune Ring */
        .rune-ring {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: spin 20s linear infinite;
        }
        .rune-ring::before, .rune-ring::after {
            content: '';
            position: absolute;
            background: var(--accent-cyan);
            border-radius: 50%;
        }
        .rune-ring::before { top: -3px; left: 50%; width: 6px; height: 6px; transform: translateX(-50%); box-shadow: 0 0 8px var(--accent-cyan); }
        .rune-ring::after { bottom: -3px; left: 50%; width: 6px; height: 6px; transform: translateX(-50%); box-shadow: 0 0 8px var(--accent-cyan); }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .avatar-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }
        
        /* Custom Avatar SVG */
        .avatar-icon {
            width: 50px; height: 50px;
            fill: var(--text-muted);
            opacity: 0.8;
        }

        h1 {
            font-family: var(--font-header);
            font-size: 2rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .level-badge {
            display: inline-block;
            margin-top: 0.5rem;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .class-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.5rem;
            font-weight: 600;
            opacity: 0.6;
        }

        /* 2. Resources Section */
        .section-resources {
            margin-bottom: 2rem;
        }

        .panel-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            display: block;
            font-weight: 700;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 4px;
        }

        .points-card {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.05), rgba(15, 23, 42, 0.6));
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
            margin-bottom: 1rem;
        }

        .points-info { display: flex; flex-direction: column; }
        .points-label { font-size: 0.8rem; color: var(--accent-cyan); opacity: 0.9; font-weight: 600; }
        .points-value { font-family: var(--font-header); font-size: 2.2rem; font-weight: 700; color: var(--text-main); line-height: 1; text-shadow: 0 0 10px rgba(34, 211, 238, 0.3); }
        
        /* Custom SVG Icon for Points */
        .points-icon-svg {
            width: 32px; height: 32px;
            fill: var(--accent-cyan);
            filter: drop-shadow(0 0 5px var(--accent-cyan));
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }

        .xp-container {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 0.8rem;
        }
        .xp-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #b45309, var(--accent-gold)); width: 65%; box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }

        /* 3. Attributes Section */
        .section-attributes { margin-top: auto; }
        
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s ease;
        }
        .stat-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        
        /* Custom Attribute Icons */
        .stat-icon { width: 18px; height: 18px; fill: var(--text-muted); margin-bottom: 4px; opacity: 0.7; }
        .stat-card span { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
        .stat-card strong { font-size: 1.1rem; color: var(--text-main); font-family: var(--font-header); }

        /* Controls */
        .controls-area {
            margin-top: 1.5rem;
            display: flex;
            gap: 10px;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }
        .btn {
            flex: 1; border: none; padding: 0.8rem; border-radius: 4px; cursor: pointer;
            font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s;
        }
        .btn-reset { background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: var(--accent-red); }
        .btn-reset:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--accent-red); }
        .btn-save { background: var(--accent-cyan); color: #0f172a; box-shadow: 0 0 15px rgba(34, 211, 238, 0.3); }
        .btn-save:hover { background: #67e8f9; box-shadow: 0 0 25px rgba(34, 211, 238, 0.5); }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: grab;
        }
        
        .screen-title {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-header);
            font-size: 2.5rem;
            color: var(--text-main);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
            font-weight: 700;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Tooltip */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 1.2rem;
            border-radius: 4px;
            width: 280px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translate(20px, 20px);
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
        }
        .tooltip.visible { opacity: 1; transform: translate(25px, 25px); }
        .tooltip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .tooltip-title { font-family: var(--font-header); font-size: 1.3rem; color: var(--text-main); font-weight: 700; }
        .tooltip-type { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 2px; letter-spacing: 0.05em; }
        .tooltip-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 1rem; }
        .tooltip-stats { font-size: 0.9rem; color: var(--accent-cyan); font-weight: 600; display: flex; align-items: center; gap: 8px; background: rgba(34, 211, 238, 0.1); padding: 6px; border-radius: 2px; }
        .tooltip-stats::before { content: '✦'; color: var(--accent-gold); }

    </style>
</head>
<body>

    <div class="atmosphere"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        
        <!-- 1. Identity -->
        <div class="section-identity">
            <div class="avatar-ring">
                <div class="rune-ring"></div>
                <div class="avatar-inner">
                    <!-- Custom SVG Avatar -->
                    <svg class="avatar-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>

        <!-- 2. Resources -->

            <div class="points-card">
                <div class="points-info">
                    <span class="points-label">Skill Points</span>
                    <span class="points-value" id="points-display">12</span>
                </div>
                <!-- Custom SVG for Points -->
                <svg class="points-icon-svg" viewBox="0 0 24 24">
                    <path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5l6.5 6.5-6.5 6.5-6.5-6.5L12 5.5z"/>

        <!-- 3. Attributes -->
        <div class="section-attributes">
            <span class="panel-label">Attributes</span>
            <div class="stat-grid">

                    <!-- Fire/Int Icon -->
                    <svg class="stat-icon" viewBox="0 0 24 24"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/></svg>
                    <span>Intelligence</span>
                    <strong>18</strong>
                </div>
                <div class="stat-card">
                    <!-- Will/Book Icon -->
                    <svg class="stat-icon" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
                    <span>Willpower</span>
                    <strong>14</strong>
                </div>
                <div class="stat-card">
                    <!-- Mana/Drop Icon -->
                    <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zm0 18c-3.35 0-6-2.57-6-6.2 0-2.34 1.95-5.44 6-9.14 4.05 3.7 6 6.79 6 9.14 0 3.63-2.65 6.2-6 6.2z"/></svg>

                <div class="stat-card">
                    <!-- Crit/Star Icon -->
                    <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    <span>Crit %</span>

        <div class="controls-area">
            <button class="btn btn-reset" onclick="resetTree()">Reset</button>
            <button class="btn btn-save" onclick="alert('Build Saved!')">Save Build</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage" id="main-stage">
        <div class="screen-title">Talent Matrix</div>
        <canvas id="skill-tree"></canvas>

        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">Description goes here.</div>
            <div class="tooltip-stats" id="tt-stats">+10% Damage</div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const mainStage = document.getElementById('main-stage');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1.2; 
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        let dragThreshold = 5;
        let startDragX, startDragY;
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        // Custom SVG Paths for Icons (inline)
        const icons = {

            shield: "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z", // Shield

            wind: "M14.5 17c0 1.65-1.35 3-3 3s-3-1.35-3-3h2c0 .55.45 1 1 1s1-.45 1-1-.45-1-1-1H2v-2h9.5c1.65 0 3 1.35 3 3zM19 6.5C19 4.57 17.43 3 15.5 3S12 4.57 12 6.5h2c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S16.33 8 15.5 8H2v2h13.5c1.93 0 3.5-1.57 3.5-3.5zm-4.5 6c-1.65 0-3 1.35-3 3h2c0-.55.45-1 1-1s1 .45 1 1-.45 1-1 1h-2v2h2c1.65 0 3-1.35 3-3s-1.35-3-3-3z", // Wind
            crown: "M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-1h14v1z" // Crown
        };

        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "The source of your magical power. Unlocks all paths.", stat: "+5% Mana Regen", icon: icons.root, unlocked: true, color: "#fbbf24" },
            
            // Left Branch: Destruction
            { id: 1, x: -280, y: -200, name: "Fire Affinity", type: "Passive", desc: "Your fire spells burn hotter.", stat: "+15% Fire Dmg", icon: icons.fire, unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: -280, y: -420, name: "Combustion", type: "Active", desc: "Spells have a chance to ignite targets.", stat: "Ignite DoT +20%", icon: icons.fire, unlocked: false, color: "#ef4444", parents: [1] },

            { id: 4, x: -120, y: -420, name: "Haste", type: "Passive", desc: "Spells cast faster.", stat: "+20% Cast Speed", icon: icons.bolt, unlocked: false, color: "#ef4444", parents: [1] },

            // Right Branch: Ice
            { id: 5, x: 280, y: -200, name: "Frost Touch", type: "Passive", desc: "Attacks apply a chilling aura.", stat: "Slow Enemies 10%", icon: icons.ice, unlocked: false, color: "#3b82f6", parents: [0] },
            { id: 6, x: 280, y: -420, name: "Deep Freeze", type: "Passive", desc: "Cold effects stack.", stat: "Max Slow 50%", icon: icons.ice, unlocked: false, color: "#3b82f6", parents: [5] },
            { id: 7, x: 560, y: -310, name: "Glacial Storm", type: "Ultimate", desc: "Summon a blizzard.", stat: "Heavy Dmg + Stun", icon: icons.ice, unlocked: false, color: "#3b82f6", parents: [6] },
            { id: 8, x: 120, y: -420, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+15% Shield", icon: icons.shield, unlocked: false, color: "#3b82f6", parents: [5] },

            // Center Branch: Utility
            { id: 9, x: 0, y: -240, name: "Arcane Intellect", type: "Passive", desc: "Boosts raw intelligence.", stat: "+10 Int", icon: icons.eye, unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: -480, name: "Mana Siphon", type: "Active", desc: "Restore mana on kill.", stat: "10% Lifesteal Mana", icon: icons.drop, unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: -720, name: "Archmage", type: "Trait", desc: "The pinnacle of magic.", stat: "+10% All Stats", icon: icons.crown, unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom Branch: Defense
            { id: 12, x: 0, y: 240, name: "Mental Fortitude", type: "Defense", desc: "Resist magical damage.", stat: "-15% Dmg Taken", icon: icons.brain, unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -220, y: 480, name: "Shield Wall", type: "Defense", desc: "Massive mana increase.", stat: "+500 Mana", icon: icons.shield, unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 220, y: 480, name: "Evasion", type: "Defense", desc: "Dodge magical attacks.", stat: "+8% Dodge", icon: icons.wind, unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = mainStage.clientWidth;
            height = mainStage.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            offsetX = width / 2;
            offsetY = height / 2;
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isPathAvailable = parent.unlocked && !child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Smoother Bezier
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            if (isPathUnlocked) {
                // Glowing active path
                ctx.lineWidth = 6 * scale;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 15;
                ctx.shadowColor = child.color;
                ctx.strokeStyle = child.color;
                ctx.globalAlpha = 1;
                
                // Dashed effect for active
                ctx.setLineDash([10, 5]);
            } else if (isPathAvailable) {
                // Path to available node
                ctx.lineWidth = 3 * scale;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 0;
                const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, 'rgba(255,255,255,0.1)');
                ctx.strokeStyle = grad;
                ctx.globalAlpha = 0.5;
                ctx.setLineDash([]);
            } else {
                // Locked path
                ctx.lineWidth = 2 * scale;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.globalAlpha = 1;
                ctx.setLineDash([5, 10]);
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0; 
            ctx.globalAlpha = 1;
            ctx.setLineDash([]);
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            const radius = (node.type === 'Ultimate' ? 60 : 45) * scale;
            
            // Outer Glow
            ctx.shadowBlur = node.unlocked ? 30 : 0;
            ctx.shadowColor = node.color;

            // Main Circle Background
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            
            // Gradient Fill
            const grad = ctx.createRadialGradient(pos.x, pos.y, radius * 0.2, pos.x, pos.y, radius);
            if (node.unlocked) {
                grad.addColorStop(0, node.color);
                grad.addColorStop(0.8, adjustColor(node.color, -60));
                grad.addColorStop(1, adjustColor(node.color, -90));
            } else {
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            
            // Rim Light
            ctx.lineWidth = node.unlocked ? 3 : 1;
            ctx.strokeStyle = node.unlocked ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.15)';
            ctx.stroke();
            
            // Custom SVG Icon Draw
            ctx.shadowBlur = 0;
            drawIcon(node.icon, pos.x, pos.y, radius * 0.6, node.unlocked ? '#fff' : '#475569');

            // Hover Effect
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Label
            ctx.fillStyle = node.unlocked ? '#f8fafc' : '#64748b';
            ctx.font = `bold ${14 * scale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + 15);
            ctx.shadowBlur = 0;
        }

        // Helper to draw SVG path string
        function drawIcon(pathData, x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size / 24, size / 24); // Normalize to 24x24 viewBox
            ctx.translate(-12, -12);
            ctx.fillStyle = color;
            ctx.beginPath();
            const path = new Path2D(pathData);
            ctx.fill(path);
            ctx.restore();
        }
        
        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            ttType.style.color = node.color;
            ttType.style.backgroundColor = node.color + '22';

            let left = mouseX + 25;
            let top = mouseY + 25;
            
            if (left + 320 > width) left = mouseX - 340;
            if (top + 200 > height) top = mouseY - 200;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' ? 60 : 45);
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        mainStage.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = ((node.type === 'Ultimate' ? 60 : 45) + 10) * scale;
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                mainStage.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                } else {
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                mainStage.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        mainStage.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startDragX = e.clientX - rect.left;
            startDragY = e.clientY - rect.top;
            lastMouseX = startDragX;
            lastMouseY = startDragY;
            isDragging = false;
            mainStage.style.cursor = 'grabbing';
        });

        mainStage.addEventListener('mousemove', (e) => {
             if(e.buttons === 1) {
                const rect = canvas.getBoundingClientRect();
                const dx = Math.abs(e.clientX - rect.left - startDragX);
                const dy = Math.abs(e.clientY - rect.top - startDragY);
                if (dx > dragThreshold || dy > dragThreshold) {
                    isDragging = true;
                    hideTooltip();
                }
             }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                mainStage.style.cursor = 'grab';
            }
        });
        
        mainStage.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        resize();

    </script>
</body>
