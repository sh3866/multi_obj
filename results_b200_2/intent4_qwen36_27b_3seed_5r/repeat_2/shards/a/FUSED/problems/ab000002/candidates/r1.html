<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix</title>
    <style>
        :root {
            --bg-dark: #050608;
            --bg-panel: #12141b;
            --bg-card: #1c1f29;
            --bg-card-hover: #252936;
            
            --accent-gold: #fbbf24;
            --accent-gold-dim: #78350f;
            --accent-blue: #3b82f6;
            --accent-cyan: #22d3ee;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --font-serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Background Atmosphere --- */
        .atmosphere {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 340px;
            background: rgba(18, 20, 27, 0.9);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: 5px 0 30px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .avatar-ring {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            padding: 3px;
            margin: 0 auto 1rem;
            position: relative;
            background: var(--bg-dark);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.15);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--text-muted);
            /* CSS Shape for Avatar Placeholder */
            background-image: linear-gradient(135deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(225deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(315deg, #1e293b 25%, transparent 25%);
            background-position:  10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat;
        }

        .name-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        .level-badge {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: var(--font-sans);
            letter-spacing: 0.05em;
        }

        .class-title {
            color: var(--accent-gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.5rem;
            font-weight: 600;
            opacity: 0.9;
        }

        /* Stats & XP */
        .panel-section {
            margin-bottom: 2rem;
        }

        .panel-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            display: block;
        }

        .xp-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .xp-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .progress-track {
            height: 8px;
            background: #0f1115;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
            width: 65%;
            box-shadow: 0 0 10px var(--accent-gold);
            position: relative;
        }

        .points-card {
            background: linear-gradient(145deg, var(--bg-card), var(--bg-dark));
            border: 1px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2), 0 0 10px rgba(34, 211, 238, 0.1);
        }

        .points-info {
            display: flex;
            flex-direction: column;
        }

        .points-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .points-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
            line-height: 1;
        }

        .points-icon {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            opacity: 0.8;
        }

        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        .stat-card span {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .stat-card strong {
            font-size: 1.1rem;
            color: var(--text-main);
            font-family: var(--font-serif);
        }

        /* Controls */
        .controls-area {
            margin-top: auto;
            display: flex;
            gap: 10px;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }

        .btn-reset {
            color: var(--accent-red);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--accent-red);
        }

        .btn-save {
            background: rgba(251, 191, 36, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .btn-save:hover {
            background: rgba(251, 191, 36, 0.2);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen-title {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-serif);
            font-size: 2rem;
            color: var(--text-main);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 5;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(18, 20, 27, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 1.2rem;
            border-radius: 4px;
            width: 280px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translate(15px, 15px);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
        }

        .tooltip.visible {
            opacity: 1;
            transform: translate(20px, 20px);
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.6rem;
        }

        .tooltip-title {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tooltip-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 2px;
            letter-spacing: 0.05em;
        }

        .tooltip-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .tooltip-stats {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .tooltip-stats::before {
            content: '✦';
            color: var(--accent-gold);
        }

    </style>
</head>
<body>

    <div class="atmosphere"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <div class="name-container">
                <h1>Kaelen</h1>
                <span class="level-badge">LVL 42</span>
            </div>
            <div class="class-title">Arcane Weaver</div>
        </div>

        <div class="panel-section">
            <span class="panel-label">Experience</span>
            <div class="xp-container">
                <div class="xp-header">
                    <span>Level 42</span>
                    <span>65,400 / 100,000</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <span class="panel-label">Attributes</span>
            <div class="stat-grid">
                <div class="stat-card">
                    <span>Intelligence</span>
                    <strong>18</strong>
                </div>
                <div class="stat-card">
                    <span>Willpower</span>
                    <strong>14</strong>
                </div>
                <div class="stat-card">
                    <span>Mana</span>
                    <strong>450</strong>
                </div>
                <div class="stat-card">
                    <span>Crit Chance</span>
                    <strong>12%</strong>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <div class="points-card">
                <div class="points-info">
                    <span class="points-label">Available Points</span>
                    <span class="points-value" id="points-display">12</span>
                </div>
                <div class="points-icon">◆</div>
            </div>
        </div>

        <div class="controls-area">
            <button class="btn btn-reset" onclick="resetTree()">Reset</button>
            <button class="btn btn-save" onclick="alert('Build Saved!')">Save Build</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage">
        <div class="screen-title">Talent Matrix</div>
        
        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1.2; // Start slightly zoomed in
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        let dragThreshold = 5;
        let startDragX, startDragY;
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        // Added icons (unicode) and refined layout
        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "The source of your magical power. Unlocks all paths.", stat: "+5% Mana Regen", icon: "✧", unlocked: true, color: "#fbbf24" },
            
            // Left Branch: Destruction
            { id: 1, x: -250, y: -180, name: "Fire Affinity", type: "Passive", desc: "Your fire spells burn hotter.", stat: "+15% Fire Dmg", icon: "🔥", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: -250, y: -380, name: "Combustion", type: "Active", desc: "Spells have a chance to ignite targets.", stat: "Ignite DoT +20%", icon: "☀", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 3, x: -500, y: -280, name: "Inferno", type: "Ultimate", desc: "Unleash a devastating firestorm.", stat: "Massive AoE Dmg", icon: "☠", unlocked: false, color: "#ef4444", parents: [2] },
            { id: 4, x: -100, y: -380, name: "Haste", type: "Passive", desc: "Spells cast faster.", stat: "+20% Cast Speed", icon: "⚡", unlocked: false, color: "#ef4444", parents: [1] },

            // Right Branch: Ice
            { id: 5, x: 250, y: -180, name: "Frost Touch", type: "Passive", desc: "Attacks apply a chilling aura.", stat: "Slow Enemies 10%", icon: "❄", unlocked: false, color: "#3b82f6", parents: [0] },
            { id: 6, x: 250, y: -380, name: "Deep Freeze", type: "Passive", desc: "Cold effects stack.", stat: "Max Slow 50%", icon: "🧊", unlocked: false, color: "#3b82f6", parents: [5] },
            { id: 7, x: 500, y: -280, name: "Glacial Storm", type: "Ultimate", desc: "Summon a blizzard.", stat: "Heavy Dmg + Stun", icon: "❄", unlocked: false, color: "#3b82f6", parents: [6] },
            { id: 8, x: 100, y: -380, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+15% Shield", icon: "🛡", unlocked: false, color: "#3b82f6", parents: [5] },

            // Center Branch: Utility
            { id: 9, x: 0, y: -220, name: "Arcane Intellect", type: "Passive", desc: "Boosts raw intelligence.", stat: "+10 Int", icon: "👁", unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: -420, name: "Mana Siphon", type: "Active", desc: "Restore mana on kill.", stat: "10% Lifesteal Mana", icon: "💧", unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: -620, name: "Archmage", type: "Trait", desc: "The pinnacle of magic.", stat: "+10% All Stats", icon: "♛", unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom Branch: Defense
            { id: 12, x: 0, y: 220, name: "Mental Fortitude", type: "Defense", desc: "Resist magical damage.", stat: "-15% Dmg Taken", icon: "🧠", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -200, y: 420, name: "Shield Wall", type: "Defense", desc: "Massive mana increase.", stat: "+500 Mana", icon: "🛡", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 200, y: 420, name: "Evasion", type: "Defense", desc: "Dodge magical attacks.", stat: "+8% Dodge", icon: "💨", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            offsetX = width / 2;
            offsetY = height / 2;
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Background Grid
            drawGrid();

            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const gridSize = 60 * scale;
            
            const startX = offsetX % gridSize;
            const startY = offsetY % gridSize;

            ctx.beginPath();
            for (let x = startX; x < width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = startY; y < height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isPathAvailable = parent.unlocked && !child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Smoother Bezier
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineWidth = isPathUnlocked ? 6 : 3;
            ctx.lineCap = 'round';
            
            if (isPathUnlocked) {
                // Glowing active path
                ctx.shadowBlur = 15;
                ctx.shadowColor = child.color;
                ctx.strokeStyle = child.color;
                ctx.globalAlpha = 1;
            } else if (isPathAvailable) {
                // Path to available node (dimmer)
                ctx.shadowBlur = 0;
                const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, 'rgba(255,255,255,0.1)');
                ctx.strokeStyle = grad;
                ctx.globalAlpha = 0.5;
            } else {
                // Locked path
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.globalAlpha = 1;
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0; 
            ctx.globalAlpha = 1;
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            const radius = (node.type === 'Ultimate' ? 35 : 28) * scale;
            
            // Outer Glow
            if (node.unlocked) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = node.color;
            } else {
                ctx.shadowBlur = 0;
            }

            // Main Circle Background
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            
            // Gradient Fill
            const grad = ctx.createRadialGradient(pos.x, pos.y, radius * 0.2, pos.x, pos.y, radius);
            if (node.unlocked) {
                grad.addColorStop(0, node.color);
                grad.addColorStop(1, adjustColor(node.color, -40)); // Darker edge
            } else {
                grad.addColorStop(0, '#2d3748');
                grad.addColorStop(1, '#0f1115');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            
            // Border
            ctx.lineWidth = node.unlocked ? 3 : 1;
            ctx.strokeStyle = node.unlocked ? '#fff' : '#475569';
            ctx.stroke();
            
            // Icon
            ctx.shadowBlur = 0;
            ctx.fillStyle = node.unlocked ? '#fff' : '#64748b';
            ctx.font = `${node.type === 'Ultimate' ? 24 : 18}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.icon, pos.x, pos.y + 2);

            // Hover Effect
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Label
            ctx.fillStyle = node.unlocked ? '#e2e8f0' : '#64748b';
            ctx.font = `bold ${12 * scale}px sans-serif`;
            ctx.textBaseline = 'top';
            ctx.fillText(node.name, pos.x, pos.y + radius + 10);
        }
        
        // Helper to darken hex colors for gradients
        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Colorize type
            ttType.style.color = node.color;
            ttType.style.backgroundColor = node.color + '22'; // Add transparency

            // Position tooltip
            let left = mouseX + 20;
            let top = mouseY + 20;
            
            // Keep within bounds
            if (left + 280 > width) left = mouseX - 300;
            if (top + 180 > height) top = mouseY - 180;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' ? 35 : 28);
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            // Hover detection
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = ((node.type === 'Ultimate' ? 35 : 28) + 10) * scale;
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                } else {
                    // Just update position if already hovering same node
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startDragX = e.clientX - rect.left;
            startDragY = e.clientY - rect.top;
            lastMouseX = startDragX;
            lastMouseY = startDragY;
            isDragging = false; // Start false, set true on move
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', (e) => {
             // Detect drag start
             if(e.buttons === 1) {
                const rect = canvas.getBoundingClientRect();
                const dx = Math.abs(e.clientX - rect.left - startDragX);
                const dy = Math.abs(e.clientY - rect.top - startDragY);
                if (dx > dragThreshold || dy > dragThreshold) {
                    isDragging = true;
                    hideTooltip();
                }
             }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'grab';
            }
        });
        
        canvas.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        // Reset Logic
        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
</html>
