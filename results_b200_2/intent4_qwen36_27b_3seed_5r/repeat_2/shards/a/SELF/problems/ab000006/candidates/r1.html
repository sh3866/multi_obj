<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree</title>
<style>
  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New'), local('Courier'), local('monospace');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a14;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #game-container {
    position: relative;
    width: 640px;
    height: 480px;
    border: 3px solid #2a2a3a;
    box-shadow: 
      0 0 0 1px #0a0a14,
      0 0 0 5px #1a1a2a,
      0 0 0 6px #2a2a3a,
      0 0 60px rgba(50, 100, 200, 0.12),
      inset 0 0 80px rgba(0,0,0,0.5);
    border-radius: 3px;
    overflow: hidden;
    background: #1a2a4a;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(0,0,0,0.06) 1px,
      rgba(0,0,0,0.06) 2px
    );
    z-index: 10;
  }

  #vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
  }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #title {
    margin-top: 32px;
    font-size: 48px;
    font-weight: bold;
    color: #e8f0ff;
    text-shadow: 
      4px 4px 0 #1a3060,
      -2px -2px 0 #3a6ab0,
      0 0 30px rgba(80,150,255,0.25),
      0 0 60px rgba(80,150,255,0.1);
    letter-spacing: 12px;
    text-transform: uppercase;
    position: relative;
    user-select: none;
    font-family: 'Courier New', Courier, monospace;
  }

  #title::before {
    content: '❄';
    position: absolute;
    left: -28px;
    top: 2px;
    font-size: 20px;
    color: #6aaaff;
    opacity: 0.7;
  }

  #title::after {
    content: '❄';
    position: absolute;
    right: -28px;
    top: 2px;
    font-size: 20px;
    color: #6aaaff;
    opacity: 0.7;
  }

  #subtitle {
    margin-top: 8px;
    font-size: 10px;
    color: #5a8ab8;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #0a1525;
    opacity: 0.8;
  }

  #start-btn {
    margin-top: 28px;
    padding: 14px 56px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #d0e4ff;
    background: linear-gradient(180deg, #2a4a8a 0%, #1a3060 40%, #0e2040 100%);
    border: 2px solid #4a7abf;
    border-radius: 1px;
    cursor: pointer;
    pointer-events: all;
    position: relative;
    text-shadow: 1px 2px 0 #0a1020;
    box-shadow: 
      0 4px 0 #0a1530,
      0 6px 16px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(120,170,255,0.2),
      inset 0 -1px 0 rgba(0,0,0,0.3);
    transition: all 0.08s ease;
    user-select: none;
  }

  #start-btn:hover {
    background: linear-gradient(180deg, #3a5a9a 0%, #2a4070 40%, #1a3050 100%);
    border-color: #6aaaff;
    box-shadow: 
      0 4px 0 #0a1530,
      0 6px 20px rgba(80,140,255,0.25),
      inset 0 1px 0 rgba(120,170,255,0.3),
      inset 0 -1px 0 rgba(0,0,0,0.3);
    color: #ffffff;
    text-shadow: 0 0 10px rgba(120,180,255,0.5);
  }

  #start-btn:active {
    transform: translateY(2px);
    box-shadow: 
      0 2px 0 #0a1530,
      0 3px 8px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(120,170,255,0.15);
  }

  #instructions {
    margin-top: 22px;
    font-size: 10px;
    color: #4a6a8a;
    letter-spacing: 2px;
    text-align: center;
    line-height: 2;
    text-shadow: 1px 1px 0 #0a1525;
  }

  #instructions kbd {
    display: inline-block;
    padding: 2px 8px;
    background: linear-gradient(180deg, #2a3a5a, #1a2a4a);
    border: 1px solid #3a5a7a;
    border-radius: 2px;
    color: #7ab4e8;
    font-family: inherit;
    font-size: 10px;
    box-shadow: 
      0 2px 0 #0e1a2a,
      inset 0 1px 0 rgba(100,160,220,0.15);
    min-width: 18px;
    text-align: center;
  }

  #score-hud {
    position: absolute;
    top: 14px;
    right: 18px;
    font-size: 10px;
    color: #4a6a8a;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #0a1525;
    z-index: 6;
    display: flex;
    gap: 20px;
  }

  #score-hud span {
    color: #8ab8e0;
    font-weight: bold;
  }

  #footer-art {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: #2a3a4a;
    letter-spacing: 2px;
    z-index: 6;
    user-select: none;
  }

  /* Subtle screen flicker */
  #game-container::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 12;
    background: rgba(200,220,255,0.01);
    animation: subtleFlicker 4s infinite;
    opacity: 0;
  }

  @keyframes subtleFlicker {
    0%, 95%, 100% { opacity: 0; }
    96% { opacity: 1; }
    97% { opacity: 0; }
    98% { opacity: 0.5; }
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene" width="320" height="240"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="ui-overlay">
    <div id="title">SkiFree</div>
    <div id="subtitle">A Winter Descent</div>
    <button id="start-btn">Start</button>
    <div id="instructions">
      <kbd>←</kbd> <kbd>→</kbd> Steer &nbsp;&nbsp; <kbd>↑</kbd> Accelerate &nbsp;&nbsp; <kbd>↓</kbd> Brake<br>
      Avoid trees. Don't stop. Don't look back.
    </div>
  </div>
  <div id="score-hud">SCORE: <span>0</span> &nbsp; SPEED: <span>0</span></div>
  <div id="footer-art">■ SKIFREE v1.0 ■</div>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320, H = 240;

// Refined pixel art palette - more cohesive, wintry
const PAL = {
  // Sky
  skyTop: '#0e1a3a',
  skyMid: '#1a2a5a',
  skyBot: '#2a4a7a',
  // Mountains
  mtnFar: '#2a3a5a',
  mtnMid: '#3a4a6a',
  mtnNear: '#4a5a7a',
  mtnSnow: '#7a8aaa',
  mtnSnowHi: '#9aa8c4',
  // Snow
  snowBase: '#c8d8ec',
  snowLight: '#dce8f4',
  snowHi: '#e8f0f8',
  snowDark: '#a8b8d0',
  snowShadow: '#90a0c0',
  // Trees
  treeDark: '#1a3a1a',
  treeMid: '#2a5a2a',
  treeLight: '#3a7a3a',
  treeSnow: '#d0e0f0',
  trunk: '#3a2218',
  trunkDark: '#2a1810',
  // Skier
  skierJacket: '#d04040',
  skierJacketDark: '#a03030',
  skierPants: '#2a3a6a',
  skierSkin: '#e8b898',
  skierHair: '#4a2a10',
  skierGoggles: '#222233',
  skierGoggleHi: '#445566',
  skierScarf: '#2a7a3a',
  skierScarfDark: '#1a5a2a',
  skierSkis: '#d8d8e0',
  skierSkisDark: '#b0b0b8',
  skierPoles: '#7a7a88',
  // Effects
  shadow: 'rgba(80,110,160,0.25)',
  cloud: 'rgba(200,215,240,0.5)',
  cloudDark: 'rgba(180,195,220,0.3)',
  snowflake: '#ffffff',
};

// Snow particles - more atmospheric
const snowflakes = [];
for (let i = 0; i < 80; i++) {
  snowflakes.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() < 0.2 ? 2 : 1,
    speed: 0.15 + Math.random() * 0.4,
    drift: -0.2 + Math.random() * 0.4,
    opacity: 0.2 + Math.random() * 0.6,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.03,
  });
}

// Trees - better distributed
const trees = [];
for (let i = 0; i < 22; i++) {
  trees.push({
    x: 10 + Math.random() * (W - 20),
    y: 90 + Math.random() * 140,
    size: 0.5 + Math.random() * 0.7,
    type: Math.floor(Math.random() * 3),
  });
}
trees.sort((a, b) => a.y - b.y);

// Clouds
const clouds = [];
for (let i = 0; i < 6; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 8 + Math.random() * 35,
    w: 25 + Math.random() * 60,
    h: 6 + Math.random() * 10,
    speed: 0.05 + Math.random() * 0.15,
    opacity: 0.2 + Math.random() * 0.35,
  });
}

// Mountains - layered for depth
const mountainsFar = [
  { x: -20, y: 58, w: 140, h: 40 },
  { x: 100, y: 48, w: 180, h: 55 },
  { x: 220, y: 55, w: 130, h: 42 },
];

const mountainsNear = [
  { x: 30, y: 62, w: 100, h: 35 },
  { x: 140, y: 55, w: 120, h: 42 },
  { x: 240, y: 60, w: 100, h: 36 },
];

// Skier
let skierX = W / 2;
let skierY = 200;
let skierDir = 1;
let skierFrame = 0;

// Helper: draw a pixel rectangle
function pr(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

// Draw sky gradient
function drawSky() {
  for (let y = 0; y < 75; y++) {
    const t = y / 75;
    const r = Math.round(PAL.skyTop.charCodeAt(0) + (PAL.skyBot.charCodeAt(0) - PAL.skyTop.charCodeAt(0)) * t);
    // Simple gradient by color interpolation
    const r1 = 0x0e, g1 = 0x1a, b1 = 0x3a;
    const r2 = 0x2a, g2 = 0x4a, b2 = 0x7a;
    const r3 = Math.round(r1 + (r2 - r1) * t);
    const g3 = Math.round(g1 + (g2 - g1) * t);
    const b3 = Math.round(b1 + (b2 - b1) * t);
    ctx.fillStyle = `rgb(${r3},${g3},${b3})`;
    ctx.fillRect(0, y, W, 1);
  }
}

// Draw stars
function drawStars(time) {
  ctx.fillStyle = '#ffffff';
  const starPositions = [
    [20, 12], [80, 8], [150, 15], [210, 10], [270, 18],
    [50, 25], [120, 22], [190, 28], [250, 20], [300, 14],
    [10, 30], [100, 35], [180, 32], [260, 38], [310, 26],
  ];
  starPositions.forEach(([sx, sy]) => {
    const twinkle = Math.sin(time * 0.03 + sx * 0.1) * 0.5 + 0.5;
    ctx.globalAlpha = 0.3 + twinkle * 0.5;
    ctx.fillRect(sx, sy, 1, 1);
  });
  ctx.globalAlpha = 1;
}

// Draw clouds
function drawClouds(time) {
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + c.w) c.x = -c.w;
    ctx.globalAlpha = c.opacity;
    const cx = Math.round(c.x);
    const cy = Math.round(c.y);
    
    // Main body
    pr(cx, cy, Math.round(c.w), Math.round(c.h), PAL.cloud);
    // Top bumps
    pr(cx + Math.round(c.w * 0.15), cy - 3, Math.round(c.w * 0.35), 3, PAL.cloud);
    pr(cx + Math.round(c.w * 0.5), cy - 2, Math.round(c.w * 0.25), 2, PAL.cloudDark);
    pr(cx + Math.round(c.w * 0.7), cy - 1, Math.round(c.w * 0.15), 1, PAL.cloud);
    ctx.globalAlpha = 1;
  });
}

// Draw mountain
function drawMountain(m, color, snowColor) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(m.x, m.y + m.h);
  ctx.lineTo(m.x + m.w / 2, m.y);
  ctx.lineTo(m.x + m.w, m.y + m.h);
  ctx.closePath();
  ctx.fill();
  
  // Snow cap - pixel style
  const peakX = m.x + m.w / 2;
  const peakY = m.y;
  ctx.fillStyle = snowColor;
  // Small triangle of snow
  const snowW = 10;
  const snowH = 8;
  ctx.beginPath();
  ctx.moveTo(peakX, peakY);
  ctx.lineTo(peakX - snowW, peakY + snowH);
  ctx.lineTo(peakX + snowW, peakY + snowH);
  ctx.closePath();
  ctx.fill();
  
  // Snow highlight
  ctx.fillStyle = PAL.mtnSnowHi;
  ctx.fillRect(peakX - 1, peakY + 1, 3, 2);
}

function drawMountains() {
  mountainsFar.forEach(m => drawMountain(m, PAL.mtnFar, PAL.mtnSnow));
  mountainsNear.forEach(m => drawMountain(m, PAL.mtnNear, PAL.mtnSnow));
}

// Draw snow ground
function drawSnow() {
  // Base snow
  for (let y = 74; y < H; y++) {
    const t = (y - 74) / (H - 74);
    const r = Math.round(0xc8 + (0xd8 - 0xc8) * t);
    const g = Math.round(0xd8 + (0xe4 - 0xd8) * t);
    const b = Math.round(0xec + (0xf0 - 0xec) * t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, W, 1);
  }
  
  // Subtle snow texture
  for (let i = 0; i < 300; i++) {
    const sx = Math.random() * W;
    const sy = 76 + Math.random() * (H - 80);
    ctx.globalAlpha = 0.15 + Math.random() * 0.15;
    ctx.fillStyle = Math.random() < 0.5 ? PAL.snowHi : PAL.snowDark;
    ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
  }
  ctx.globalAlpha = 1;
}

// Draw horizon tree line
function drawHorizon() {
  // Dark tree line
  ctx.fillStyle = PAL.treeDark;
  for (let x = 0; x < W; x += 2) {
    const h = 2 + Math.sin(x * 0.15) * 2 + Math.sin(x * 0.4) * 1;
    ctx.fillRect(x, 74 - h, 2, h);
  }
  // Snow on tree line
  ctx.fillStyle = PAL.snowHi;
  for (let x = 0; x < W; x += 2) {
    const h = 2 + Math.sin(x * 0.15) * 2 + Math.sin(x * 0.4) * 1;
    ctx.fillRect(x, 74 - h, 2, 1);
  }
}

// Draw a single tree
function drawTree(x, y, size, type) {
  const s = size;
  const tx = Math.round(x);
  const ty = Math.round(y);
  
  // Shadow
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(tx + 3 * s, ty + 1, 7 * s, 2.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Trunk
  pr(tx - 1, ty - 1, 2, Math.round(5 * s), PAL.trunk);
  pr(tx, ty - 1, 1, Math.round(5 * s), PAL.trunkDark);
  
  // Foliage layers
  const treeColors = [PAL.treeDark, PAL.treeMid, PAL.treeLight];
  const tc = treeColors[type % 3];
  
  if (type === 0) {
    // Classic triangle
    pr(tx - 1, ty - 14 * s, 3, 3 * s, tc);
    pr(tx - 2, ty - 12 * s, 5, 3 * s, tc);
    pr(tx - 3, ty - 10 * s, 7, 3 * s, tc);
    pr(tx - 4, ty - 8 * s, 9, 3 * s, tc);
    pr(tx - 5, ty - 6 * s, 11, 3 * s, tc);
    pr(tx - 6, ty - 4 * s, 13, 3 * s, tc);
  } else if (type === 1) {
    // Rounder tree
    pr(tx - 2, ty - 12 * s, 5, 3 * s, tc);
    pr(tx - 3, ty - 10 * s, 7, 3 * s, tc);
    pr(tx - 4, ty - 8 * s, 9, 3 * s, tc);
    pr(tx - 5, ty - 6 * s, 11, 3 * s, tc);
    pr(tx - 4, ty - 4 * s, 9, 3 * s, tc);
    pr(tx - 3, ty - 2 * s, 7, 3 * s, tc);
  } else {
    // Bushy
    pr(tx - 1, ty - 13 * s, 3, 3 * s, tc);
    pr(tx - 3, ty - 11 * s, 7, 3 * s, tc);
    pr(tx - 4, ty - 9 * s, 9, 3 * s, tc);
    pr(tx - 5, ty - 7 * s, 11, 3 * s, tc);
    pr(tx - 5, ty - 5 * s, 11, 3 * s, tc);
    pr(tx - 4, ty - 3 * s, 9, 3 * s, tc);
  }
  
  // Snow on top
  ctx.fillStyle = PAL.treeSnow;
  pr(tx - 2, ty - 14 * s, 5, 2 * s, PAL.treeSnow);
  pr(tx - 3, ty - 11 * s, 3, 1 * s, PAL.treeSnow);
  
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  pr(tx - 1, ty - 13 * s, 1, 4 * s, 'rgba(255,255,255,0.12)');
}

// Draw the skier - detailed pixel art
function drawSkier(x, y, dir, frame) {
  const sx = Math.round(x);
  const sy = Math.round(y);
  const bob = Math.sin(frame * 0.12) * 1;
  
  ctx.save();
  ctx.translate(sx, sy + bob);
  ctx.scale(dir, 1);
  
  // Shadow
  ctx.fillStyle = PAL.shadow;
  ctx.fillRect(-7, 12, 14, 3);
  
  // Skis
  pr(-9, 10, 7, 2, PAL.skierSkis);
  pr(2, 10, 7, 2, PAL.skierSkis);
  pr(-9, 10, 7, 1, PAL.skierSkisDark);
  pr(2, 10, 7, 1, PAL.skierSkisDark);
  // Ski tips
  pr(-10, 10, 1, 2, PAL.skierSkisDark);
  pr(9, 10, 1, 2, PAL.skierSkisDark);
  
  // Boots
  pr(-5, 8, 3, 3, PAL.skierJacketDark);
  pr(2, 8, 3, 3, PAL.skierJacketDark);
  
  // Legs
  pr(-4, 5, 2, 4, PAL.skierPants);
  pr(2, 5, 2, 4, PAL.skierPants);
  
  // Body/jacket
  pr(-4, -3, 8, 9, PAL.skierJacket);
  // Jacket detail
  pr(-4, 0, 8, 2, PAL.skierJacketDark);
  pr(-3, -3, 1, 9, 'rgba(255,255,255,0.1)');
  
  // Arms
  pr(-8, -1, 4, 2, PAL.skierJacket);
  pr(4, -1, 4, 2, PAL.skierJacket);
  
  // Poles
  pr(-8, -1, 1, 13, PAL.skierPoles);
  pr(7, -1, 1, 13, PAL.skierPoles);
  // Pole baskets
  pr(-9, 9, 2, 1, PAL.skierPoles);
  pr(7, 9, 2, 1, PAL.skierPoles);
  // Pole tips
  pr(-8, 12, 1, 1, '#aaa');
  pr(7, 12, 1, 1, '#aaa');
  
  // Head
  pr(-3, -8, 6, 5, PAL.skierSkin);
  
  // Hair/hat
  pr(-3, -9, 6, 2, PAL.skierHair);
  pr(-4, -8, 1, 4, PAL.skierHair);
  pr(-3, -9, 6, 1, '#3a1a08');
  
  // Goggles
  pr(0, -7, 3, 2, PAL.skierGoggles);
  pr(1, -7, 2, 1, PAL.skierGoggleHi);
  
  // Scarf
  pr(-3, -3, 6, 2, PAL.skierScarf);
  pr(-5, -2, 2, 5, PAL.skierScarf);
  pr(-5, 3, 2, 2, PAL.skierScarfDark);
  
  ctx.restore();
}

// Draw snowflakes
function drawSnowflakes(time) {
  snowflakes.forEach(f => {
    f.y += f.speed;
    f.wobble += f.wobbleSpeed;
    f.x += f.drift + Math.sin(f.wobble) * 0.3;
    if (f.y > H) { f.y = -2; f.x = Math.random() * W; }
    if (f.x > W) f.x = 0;
    if (f.x < 0) f.x = W;
    
    ctx.globalAlpha = f.opacity;
    ctx.fillStyle = PAL.snowflake;
    ctx.fillRect(Math.round(f.x), Math.round(f.y), f.size, f.size);
  });
  ctx.globalAlpha = 1;
}

// Draw ski tracks
function drawSkiTracks() {
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = PAL.snowShadow;
  ctx.lineWidth = 1;
  
  for (let t = 0; t < 4; t++) {
    ctx.beginPath();
    const startX = 40 + t * 80 + Math.sin(t * 2) * 30;
    for (let y = 80; y < H; y += 2) {
      const x = startX + Math.sin(y * 0.025 + t * 1.5) * 18 + Math.sin(y * 0.06) * 6;
      if (y === 80) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// Bottom snow drift
function drawBottomDrift(time) {
  ctx.fillStyle = PAL.snowHi;
  ctx.globalAlpha = 0.3;
  for (let x = 0; x < W; x += 3) {
    const dh = 1 + Math.sin(x * 0.04 + time * 0.008) * 1.5;
    ctx.fillRect(x, H - dh, 2, dh);
  }
  ctx.globalAlpha = 1;
}

// Animation loop
let time = 0;
const keys = {};

document.addEventListener('keydown', (e) => { keys[e.key] = true; });
document.addEventListener('keyup', (e) => { keys[e.key] = false; });

function render() {
  time++;
  skierFrame = time;
  
  // Keyboard steering
  if (keys['ArrowLeft']) { skierX -= 2.5; skierDir = -1; }
  if (keys['ArrowRight']) { skierX += 2.5; skierDir = 1; }
  if (keys['ArrowUp']) skierY -= 0.5;
  if (keys['ArrowDown']) skierY += 0.3;
  
  // Clamp
  skierX = Math.max(20, Math.min(W - 20, skierX));
  skierY = Math.max(85, Math.min(H - 25, skierY));
  
  // Auto gentle sway when not controlled
  if (!keys['ArrowLeft'] && !keys['ArrowRight']) {
    skierX = W / 2 + Math.sin(time * 0.015) * 12;
    skierDir = Math.cos(time * 0.015) > 0 ? 1 : -1;
  }
  
  ctx.clearRect(0, 0, W, H);
  
  // Draw layers back to front
  drawSky();
  drawStars(time);
  drawClouds(time);
  drawMountains();
  drawHorizon();
  drawSnow();
  drawSkiTracks();
  
  // Trees
  trees.forEach(t => drawTree(t.x, t.y, t.size, t.type));
  
  // Skier
  drawSkier(skierX, skierY, skierDir, skierFrame);
  
  // Snow overlay
  drawSnowflakes(time);
  drawBottomDrift(time);
  
  requestAnimationFrame(render);
}

// Start button
const startBtn = document.getElementById('start-btn');
startBtn.addEventListener('click', () => {
  // Flash
  canvas.style.filter = 'brightness(1.8)';
  setTimeout(() => { canvas.style.filter = 'none'; }, 120);
  
  // Quick descent animation
  let speed = 0;
  const accel = setInterval(() => {
    speed += 0.15;
    skierY -= speed;
    skierX += Math.sin(time * 0.04) * 3;
    if (skierY < 60) {
      clearInterval(accel);
      skierY = 200;
      skierX = W / 2;
    }
  }, 16);
});

render();
</script>
</body>
</html>
