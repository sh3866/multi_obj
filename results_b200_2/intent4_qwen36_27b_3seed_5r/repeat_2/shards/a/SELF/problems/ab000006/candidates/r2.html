<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree</title>
<style>
  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New'), local('Courier'), local('monospace');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050508;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #game-container {
    position: relative;
    width: 640px;
    height: 480px;
    border: 4px solid #1a1a24;
    box-shadow: 
      0 0 0 2px #0a0a0e,
      0 0 0 6px #252535,
      0 0 0 8px #1a1a24,
      0 0 80px rgba(40, 70, 140, 0.15),
      inset 0 0 60px rgba(0,0,0,0.6);
    border-radius: 4px;
    overflow: hidden;
    background: #0e1525;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    z-index: 10;
  }

  #vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
  }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #title {
    margin-top: 18px;
    font-size: 52px;
    font-weight: bold;
    color: #f0f4ff;
    text-shadow: 
      3px 3px 0 #1a2a50,
      -1px -1px 0 #4a7ab0,
      0 0 40px rgba(80,140,255,0.2),
      0 0 80px rgba(80,140,255,0.08);
    letter-spacing: 16px;
    text-transform: uppercase;
    position: relative;
    user-select: none;
    font-family: 'Courier New', Courier, monospace;
    line-height: 1;
  }

  #title::before {
    content: '❄';
    position: absolute;
    left: -30px;
    top: 4px;
    font-size: 18px;
    color: #5a9aef;
    opacity: 0.6;
    text-shadow: 0 0 8px rgba(80,140,255,0.3);
  }

  #title::after {
    content: '❄';
    position: absolute;
    right: -30px;
    top: 4px;
    font-size: 18px;
    color: #5a9aef;
    opacity: 0.6;
    text-shadow: 0 0 8px rgba(80,140,255,0.3);
  }

  #subtitle {
    margin-top: 6px;
    font-size: 9px;
    color: #4a7aaa;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #0a1020;
    opacity: 0.7;
  }

  #start-btn {
    margin-top: 20px;
    padding: 12px 60px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #d8e8ff;
    background: linear-gradient(180deg, #2a4a8a 0%, #1a3060 40%, #0e2040 100%);
    border: 2px solid #3a6ab0;
    border-radius: 2px;
    cursor: pointer;
    pointer-events: all;
    position: relative;
    text-shadow: 1px 2px 0 #0a1020;
    box-shadow: 
      0 4px 0 #0a1530,
      0 6px 20px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(120,170,255,0.2),
      inset 0 -1px 0 rgba(0,0,0,0.3);
    transition: all 0.08s ease;
    user-select: none;
  }

  #start-btn:hover {
    background: linear-gradient(180deg, #3a5a9a 0%, #2a4070 40%, #1a3050 100%);
    border-color: #6aaaff;
    box-shadow: 
      0 4px 0 #0a1530,
      0 6px 24px rgba(80,140,255,0.3),
      inset 0 1px 0 rgba(120,170,255,0.35),
      inset 0 -1px 0 rgba(0,0,0,0.3);
    color: #ffffff;
    text-shadow: 0 0 12px rgba(120,180,255,0.6);
  }

  #start-btn:active {
    transform: translateY(2px);
    box-shadow: 
      0 2px 0 #0a1530,
      0 3px 10px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(120,170,255,0.15);
  }

  #instructions {
    margin-top: 18px;
    font-size: 9px;
    color: #4a6a8a;
    letter-spacing: 2px;
    text-align: center;
    line-height: 2.2;
    text-shadow: 1px 1px 0 #0a1525;
  }

  #instructions kbd {
    display: inline-block;
    padding: 2px 9px;
    background: linear-gradient(180deg, #2a3a5a, #1a2a4a);
    border: 1px solid #3a5a7a;
    border-radius: 2px;
    color: #7ab4e8;
    font-family: inherit;
    font-size: 9px;
    box-shadow: 
      0 2px 0 #0e1a2a,
      inset 0 1px 0 rgba(100,160,220,0.15);
    min-width: 18px;
    text-align: center;
  }

  #score-hud {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 9px;
    color: #3a5a7a;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #0a1525;
    z-index: 6;
    display: flex;
    gap: 18px;
    opacity: 0.6;
  }

  #score-hud span {
    color: #7aa8d0;
    font-weight: bold;
  }

  #footer-art {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 7px;
    color: #2a3a4a;
    letter-spacing: 3px;
    z-index: 6;
    user-select: none;
    opacity: 0.5;
  }

  @keyframes subtleFlicker {
    0%, 95%, 100% { opacity: 0; }
    96% { opacity: 1; }
    97% { opacity: 0; }
    98% { opacity: 0.4; }
  }

  #game-container::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 12;
    background: rgba(200,220,255,0.008);
    animation: subtleFlicker 5s infinite;
    opacity: 0;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene" width="320" height="240"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="ui-overlay">
    <div id="title">SkiFree</div>
    <div id="subtitle">A Winter Descent</div>
    <button id="start-btn">Start</button>
    <div id="instructions">
      <kbd>←</kbd> <kbd>→</kbd> Steer &nbsp;&nbsp; <kbd>↑</kbd> Accelerate &nbsp;&nbsp; <kbd>↓</kbd> Brake<br>
      Avoid trees. Don't stop. Don't look back.
    </div>
  </div>
  <div id="score-hud">SCORE: <span>0</span> &nbsp; SPEED: <span>0</span></div>
  <div id="footer-art">■ SKIFREE v1.0 ■</div>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320, H = 240;

// Refined palette - deeper, more atmospheric
const PAL = {
  skyTop: '#0a0e28',
  skyMid: '#141e42',
  skyBot: '#1e3060',
  mtnFar: '#1a2440',
  mtnMid: '#242e50',
  mtnNear: '#2e3860',
  mtnSnow: '#6a7a98',
  mtnSnowHi: '#8a9ab0',
  snowBase: '#b8c8e0',
  snowLight: '#d0dce8',
  snowHi: '#e0ecf4',
  snowDark: '#9aa8c0',
  snowShadow: '#8090a8',
  treeDark: '#142a14',
  treeMid: '#1e3e1e',
  treeLight: '#2a5a2a',
  treeSnow: '#c0d0e0',
  trunk: '#3a2218',
  trunkDark: '#2a1810',
  skierJacket: '#d04040',
  skierJacketDark: '#a03030',
  skierPants: '#2a3a6a',
  skierSkin: '#e8b898',
  skierHair: '#4a2a10',
  skierGoggles: '#222233',
  skierGoggleHi: '#445566',
  skierScarf: '#2a7a3a',
  skierScarfDark: '#1a5a2a',
  skierSkis: '#d8d8e0',
  skierSkisDark: '#b0b0b8',
  skierPoles: '#7a7a88',
  shadow: 'rgba(60,90,140,0.22)',
  cloud: 'rgba(180,200,230,0.4)',
  cloudDark: 'rgba(160,180,210,0.25)',
  snowflake: '#ffffff',
};

// Snow particles
const snowflakes = [];
for (let i = 0; i < 90; i++) {
  snowflakes.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() < 0.15 ? 2 : 1,
    speed: 0.12 + Math.random() * 0.35,
    drift: -0.15 + Math.random() * 0.3,
    opacity: 0.15 + Math.random() * 0.55,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.008 + Math.random() * 0.025,
  });
}

// Trees
const trees = [];
for (let i = 0; i < 24; i++) {
  trees.push({
    x: 8 + Math.random() * (W - 16),
    y: 85 + Math.random() * 145,
    size: 0.45 + Math.random() * 0.65,
    type: Math.floor(Math.random() * 3),
  });
}
trees.sort((a, b) => a.y - b.y);

// Clouds
const clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 6 + Math.random() * 30,
    w: 30 + Math.random() * 55,
    h: 5 + Math.random() * 8,
    speed: 0.04 + Math.random() * 0.12,
    opacity: 0.15 + Math.random() * 0.3,
  });
}

// Mountains
const mountainsFar = [
  { x: -30, y: 56, w: 150, h: 42 },
  { x: 110, y: 44, w: 190, h: 58 },
  { x: 230, y: 52, w: 140, h: 45 },
];

const mountainsNear = [
  { x: 20, y: 60, w: 110, h: 38 },
  { x: 150, y: 52, w: 130, h: 46 },
  { x: 250, y: 58, w: 110, h: 38 },
];

// Skier
let skierX = W / 2;
let skierY = 200;
let skierDir = 1;
let skierFrame = 0;

function pr(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawSky() {
  for (let y = 0; y < 72; y++) {
    const t = y / 72;
    const r1 = 10, g1 = 14, b1 = 40;
    const r2 = 30, g2 = 48, b2 = 96;
    const r3 = Math.round(r1 + (r2 - r1) * t);
    const g3 = Math.round(g1 + (g2 - g1) * t);
    const b3 = Math.round(b1 + (b2 - b1) * t);
    ctx.fillStyle = `rgb(${r3},${g3},${b3})`;
    ctx.fillRect(0, y, W, 1);
  }
}

function drawStars(time) {
  ctx.fillStyle = '#ffffff';
  const starPositions = [
    [15, 10], [75, 6], [140, 12], [200, 8], [265, 14],
    [45, 22], [115, 18], [185, 24], [245, 16], [295, 12],
    [8, 28], [95, 32], [175, 28], [255, 34], [305, 22],
    [30, 38], [130, 40], [220, 36], [280, 42], [160, 44],
  ];
  starPositions.forEach(([sx, sy]) => {
    const twinkle = Math.sin(time * 0.025 + sx * 0.08) * 0.5 + 0.5;
    ctx.globalAlpha = 0.2 + twinkle * 0.45;
    ctx.fillRect(sx, sy, 1, 1);
  });
  ctx.globalAlpha = 1;
}

function drawClouds(time) {
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + c.w) c.x = -c.w;
    ctx.globalAlpha = c.opacity;
    const cx = Math.round(c.x);
    const cy = Math.round(c.y);
    
    pr(cx, cy, Math.round(c.w), Math.round(c.h), PAL.cloud);
    pr(cx + Math.round(c.w * 0.12), cy - 3, Math.round(c.w * 0.3), 3, PAL.cloud);
    pr(cx + Math.round(c.w * 0.45), cy - 2, Math.round(c.w * 0.2), 2, PAL.cloudDark);
    pr(cx + Math.round(c.w * 0.65), cy - 1, Math.round(c.w * 0.12), 1, PAL.cloud);
    ctx.globalAlpha = 1;
  });
}

function drawMountain(m, color, snowColor) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(m.x, m.y + m.h);
  ctx.lineTo(m.x + m.w / 2, m.y);
  ctx.lineTo(m.x + m.w, m.y + m.h);
  ctx.closePath();
  ctx.fill();
  
  const peakX = m.x + m.w / 2;
  const peakY = m.y;
  ctx.fillStyle = snowColor;
  const snowW = 10;
  const snowH = 8;
  ctx.beginPath();
  ctx.moveTo(peakX, peakY);
  ctx.lineTo(peakX - snowW, peakY + snowH);
  ctx.lineTo(peakX + snowW, peakY + snowH);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = PAL.mtnSnowHi;
  ctx.fillRect(peakX - 1, peakY + 1, 3, 2);
}

function drawMountains() {
  mountainsFar.forEach(m => drawMountain(m, PAL.mtnFar, PAL.mtnSnow));
  mountainsNear.forEach(m => drawMountain(m, PAL.mtnNear, PAL.mtnSnow));
}

function drawSnow() {
  for (let y = 71; y < H; y++) {
    const t = (y - 71) / (H - 71);
    const r = Math.round(0xb8 + (0xc8 - 0xb8) * t);
    const g = Math.round(0xc8 + (0xd8 - 0xc8) * t);
    const b = Math.round(0xe0 + (0xe8 - 0xe0) * t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, W, 1);
  }
  
  // Snow texture dots
  for (let i = 0; i < 250; i++) {
    const sx = Math.random() * W;
    const sy = 73 + Math.random() * (H - 76);
    ctx.globalAlpha = 0.1 + Math.random() * 0.12;
    ctx.fillStyle = Math.random() < 0.5 ? PAL.snowHi : PAL.snowDark;
    ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
  }
  ctx.globalAlpha = 1;
}

function drawHorizon() {
  ctx.fillStyle = PAL.treeDark;
  for (let x = 0; x < W; x += 2) {
    const h = 2 + Math.sin(x * 0.12) * 2 + Math.sin(x * 0.35) * 1;
    ctx.fillRect(x, 71 - h, 2, h);
  }
  ctx.fillStyle = PAL.snowHi;
  for (let x = 0; x < W; x += 2) {
    const h = 2 + Math.sin(x * 0.12) * 2 + Math.sin(x * 0.35) * 1;
    ctx.fillRect(x, 71 - h, 2, 1);
  }
}

function drawTree(x, y, size, type) {
  const s = size;
  const tx = Math.round(x);
  const ty = Math.round(y);
  
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(tx + 3 * s, ty + 1, 7 * s, 2.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  
  pr(tx - 1, ty - 1, 2, Math.round(5 * s), PAL.trunk);
  pr(tx, ty - 1, 1, Math.round(5 * s), PAL.trunkDark);
  
  const treeColors = [PAL.treeDark, PAL.treeMid, PAL.treeLight];
  const tc = treeColors[type % 3];
  
  if (type === 0) {
    pr(tx - 1, ty - 14 * s, 3, 3 * s, tc);
    pr(tx - 2, ty - 12 * s, 5, 3 * s, tc);
    pr(tx - 3, ty - 10 * s, 7, 3 * s, tc);
    pr(tx - 4, ty - 8 * s, 9, 3 * s, tc);
    pr(tx - 5, ty - 6 * s, 11, 3 * s, tc);
    pr(tx - 6, ty - 4 * s, 13, 3 * s, tc);
  } else if (type === 1) {
    pr(tx - 2, ty - 12 * s, 5, 3 * s, tc);
    pr(tx - 3, ty - 10 * s, 7, 3 * s, tc);
    pr(tx - 4, ty - 8 * s, 9, 3 * s, tc);
    pr(tx - 5, ty - 6 * s, 11, 3 * s, tc);
    pr(tx - 4, ty - 4 * s, 9, 3 * s, tc);
    pr(tx - 3, ty - 2 * s, 7, 3 * s, tc);
  } else {
    pr(tx - 1, ty - 13 * s, 3, 3 * s, tc);
    pr(tx - 3, ty - 11 * s, 7, 3 * s, tc);
    pr(tx - 4, ty - 9 * s, 9, 3 * s, tc);
    pr(tx - 5, ty - 7 * s, 11, 3 * s, tc);
    pr(tx - 5, ty - 5 * s, 11, 3 * s, tc);
    pr(tx - 4, ty - 3 * s, 9, 3 * s, tc);
  }
  
  ctx.fillStyle = PAL.treeSnow;
  pr(tx - 2, ty - 14 * s, 5, 2 * s, PAL.treeSnow);
  pr(tx - 3, ty - 11 * s, 3, 1 * s, PAL.treeSnow);
  
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  pr(tx - 1, ty - 13 * s, 1, 4 * s, 'rgba(255,255,255,0.1)');
}

function drawSkier(x, y, dir, frame) {
  const sx = Math.round(x);
  const sy = Math.round(y);
  const bob = Math.sin(frame * 0.1) * 1;
  
  ctx.save();
  ctx.translate(sx, sy + bob);
  ctx.scale(dir, 1);
  
  ctx.fillStyle = PAL.shadow;
  ctx.fillRect(-7, 12, 14, 3);
  
  pr(-9, 10, 7, 2, PAL.skierSkis);
  pr(2, 10, 7, 2, PAL.skierSkis);
  pr(-9, 10, 7, 1, PAL.skierSkisDark);
  pr(2, 10, 7, 1, PAL.skierSkisDark);
  pr(-10, 10, 1, 2, PAL.skierSkisDark);
  pr(9, 10, 1, 2, PAL.skierSkisDark);
  
  pr(-5, 8, 3, 3, PAL.skierJacketDark);
  pr(2, 8, 3, 3, PAL.skierJacketDark);
  
  pr(-4, 5, 2, 4, PAL.skierPants);
  pr(2, 5, 2, 4, PAL.skierPants);
  
  pr(-4, -3, 8, 9, PAL.skierJacket);
  pr(-4, 0, 8, 2, PAL.skierJacketDark);
  pr(-3, -3, 1, 9, 'rgba(255,255,255,0.08)');
  
  pr(-8, -1, 4, 2, PAL.skierJacket);
  pr(4, -1, 4, 2, PAL.skierJacket);
  
  pr(-8, -1, 1, 13, PAL.skierPoles);
  pr(7, -1, 1, 13, PAL.skierPoles);
  pr(-9, 9, 2, 1, PAL.skierPoles);
  pr(7, 9, 2, 1, PAL.skierPoles);
  pr(-8, 12, 1, 1, '#aaa');
  pr(7, 12, 1, 1, '#aaa');
  
  pr(-3, -8, 6, 5, PAL.skierSkin);
  
  pr(-3, -9, 6, 2, PAL.skierHair);
  pr(-4, -8, 1, 4, PAL.skierHair);
  pr(-3, -9, 6, 1, '#3a1a08');
  
  pr(0, -7, 3, 2, PAL.skierGoggles);
  pr(1, -7, 2, 1, PAL.skierGoggleHi);
  
  pr(-3, -3, 6, 2, PAL.skierScarf);
  pr(-5, -2, 2, 5, PAL.skierScarf);
  pr(-5, 3, 2, 2, PAL.skierScarfDark);
  
  ctx.restore();
}

function drawSnowflakes(time) {
  snowflakes.forEach(f => {
    f.y += f.speed;
    f.wobble += f.wobbleSpeed;
    f.x += f.drift + Math.sin(f.wobble) * 0.25;
    if (f.y > H) { f.y = -2; f.x = Math.random() * W; }
    if (f.x > W) f.x = 0;
    if (f.x < 0) f.x = W;
    
    ctx.globalAlpha = f.opacity;
    ctx.fillStyle = PAL.snowflake;
    ctx.fillRect(Math.round(f.x), Math.round(f.y), f.size, f.size);
  });
  ctx.globalAlpha = 1;
}

function drawSkiTracks() {
  ctx.globalAlpha = 0.1;
  ctx.strokeStyle = PAL.snowShadow;
  ctx.lineWidth = 1;
  
  for (let t = 0; t < 4; t++) {
    ctx.beginPath();
    const startX = 35 + t * 80 + Math.sin(t * 2) * 25;
    for (let y = 78; y < H; y += 2) {
      const x = startX + Math.sin(y * 0.022 + t * 1.5) * 16 + Math.sin(y * 0.055) * 5;
      if (y === 78) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBottomDrift(time) {
  ctx.fillStyle = PAL.snowHi;
  ctx.globalAlpha = 0.25;
  for (let x = 0; x < W; x += 3) {
    const dh = 1 + Math.sin(x * 0.035 + time * 0.007) * 1.2;
    ctx.fillRect(x, H - dh, 2, dh);
  }
  ctx.globalAlpha = 1;
}

let time = 0;
const keys = {};

document.addEventListener('keydown', (e) => { keys[e.key] = true; });
document.addEventListener('keyup', (e) => { keys[e.key] = false; });

function render() {
  time++;
  skierFrame = time;
  
  if (keys['ArrowLeft']) { skierX -= 2.2; skierDir = -1; }
  if (keys['ArrowRight']) { skierX += 2.2; skierDir = 1; }
  if (keys['ArrowUp']) skierY -= 0.4;
  if (keys['ArrowDown']) skierY += 0.25;
  
  skierX = Math.max(20, Math.min(W - 20, skierX));
  skierY = Math.max(82, Math.min(H - 25, skierY));
  
  if (!keys['ArrowLeft'] && !keys['ArrowRight']) {
    skierX = W / 2 + Math.sin(time * 0.012) * 10;
    skierDir = Math.cos(time * 0.012) > 0 ? 1 : -1;
  }
  
  ctx.clearRect(0, 0, W, H);
  
  drawSky();
  drawStars(time);
  drawClouds(time);
  drawMountains();
  drawHorizon();
  drawSnow();
  drawSkiTracks();
  
  trees.forEach(t => drawTree(t.x, t.y, t.size, t.type));
  
  drawSkier(skierX, skierY, skierDir, skierFrame);
  
  drawSnowflakes(time);
  drawBottomDrift(time);
  
  requestAnimationFrame(render);
}

const startBtn = document.getElementById('start-btn');
startBtn.addEventListener('click', () => {
  canvas.style.filter = 'brightness(1.6)';
  setTimeout(() => { canvas.style.filter = 'none'; }, 100);
  
  let speed = 0;
  const accel = setInterval(() => {
    speed += 0.12;
    skierY -= speed;
    skierX += Math.sin(time * 0.035) * 2.5;
    if (skierY < 55) {
      clearInterval(accel);
      skierY = 200;
      skierX = W / 2;
    }
  }, 16);
});

render();
</script>
</body>
</html>
