<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria: Ascension</title>
    <style>
        :root {
            --bg-app: #050608;
            --bg-panel: #0e1015;
            --bg-panel-border: #2a2f3d;
            --bg-panel-highlight: #3a4155;
            
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #475569;

            --accent-gold: #fbbf24;
            --accent-gold-dim: #78350f;
            --accent-glow: rgba(251, 191, 36, 0.5);
            
            --accent-cyan: #22d3ee;
            --accent-cyan-glow: rgba(34, 211, 238, 0.5);

            --font-display: "Cinzel", "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Ambient Background --- */
        .ambient-light {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.03) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 380px;
            background: linear-gradient(180deg, #0f1218 0%, #050608 100%);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            padding: 3rem 2rem;
            z-index: 10;
            box-shadow: 10px 0 40px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .avatar-container {
            width: 140px;
            height: 140px;
            position: relative;
            margin-bottom: 1.5rem;
        }

        .avatar-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 30px var(--accent-glow);
            opacity: 0.8;
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #fff;
            border-bottom-color: #fff;
            animation: spin 10s linear infinite;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1e293b;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-icon {
            width: 60%;
            height: 60%;
            fill: var(--text-secondary);
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .char-name {
            font-family: var(--font-display);
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 0.05em;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .char-class {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
            position: relative;
            display: inline-block;
        }

        .level-badge {
            position: absolute;
            bottom: -10px;
            background: #000;
            border: 1px solid var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 2;
        }

        /* Panels */
        .panel {
            background: rgba(14, 16, 21, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 1px solid var(--accent-gold-dim);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .panel:hover {
            border-color: rgba(255,255,255,0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }

        .panel-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* XP Bar */
        .xp-container {
            height: 6px;
            background: #000;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .xp-fill {
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
            position: relative;
        }

        .xp-fill::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0; width: 20px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
            filter: blur(4px);
        }

        /* Skill Points */
        .sp-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sp-val {
            font-family: var(--font-display);
            font-size: 3.5rem;
            line-height: 1;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px var(--accent-cyan-glow);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 1rem;
            transition: background 0.2s;
        }

        .stat-card:hover {
            background: rgba(255,255,255,0.03);
        }

        .stat-name {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-primary);
            font-family: var(--font-display);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            background-color: #080a0f;
            overflow: hidden;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        .canvas-container:active { cursor: grabbing; }

        canvas { display: block; }

        /* --- Floating Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(10, 12, 16, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 1.5rem;
            width: 300px;
            opacity: 0;
            transform: translate(20px, -50%);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 100;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
        }

        .tooltip.visible {
            opacity: 1;
            transform: translate(20px, -50%) scale(1);
        }

        .tooltip::before {
            content: '';
            position: absolute;
            left: -6px; top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 10px; height: 10px;
            background: var(--accent-gold);
            box-shadow: -2px 2px 5px rgba(0,0,0,0.5);
        }

        .tt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.75rem;
        }

        .tt-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: #fff;
            font-weight: 700;
        }

        .tt-type {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            background: rgba(251, 191, 36, 0.15);
            padding: 4px 8px;
            border-radius: 2px;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .tt-desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .tt-stats {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 211, 238, 0.1);
            padding: 8px;
            border-radius: 4px;
        }

        /* --- Controls --- */
        .controls {
            position: absolute;
            bottom: 3rem;
            right: 3rem;
            display: flex;
            gap: 1.5rem;
            z-index: 20;
        }

        .btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--bg-panel-border);
            color: var(--text-primary);
            padding: 1rem 2.5rem;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
            transform: translateY(-2px);
        }

        .btn-reset { 
            color: #f87171; 
            border-color: rgba(248, 113, 113, 0.2); 
        }
        .btn-reset:hover { 
            background: rgba(248, 113, 113, 0.1); 
            border-color: #f87171; 
            color: #fca5a5;
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.15);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-container">
                <div class="avatar-ring"></div>
                <div class="avatar-inner">
                    <!-- Inline SVG Avatar: High Detail -->
                    <svg class="avatar-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
            <h1 class="char-name">Kaelen</h1>
            <div class="char-class">Arcane Weaver</div>
            <div class="level-badge">LVL 42</div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Experience</span>
                <span class="panel-title" style="color: var(--text-primary); font-family: var(--font-ui);">65,400 / 100,000</span>
            </div>
            <div class="xp-container">
                <div class="xp-fill"></div>
            </div>
        </div>

        <div class="panel">
            <div class="sp-container">
                <div>
                    <div class="panel-title" style="margin-bottom: 5px; font-size: 0.9rem;">Skill Points</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Available to spend</div>
                </div>
                <span class="sp-val" id="points-display">12</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-name">Intelligence</div>
                <div class="stat-val">18</div>
            </div>
            <div class="stat-card">
                <div class="stat-name">Willpower</div>
                <div class="stat-val">14</div>
            </div>
            <div class="stat-card">
                <div class="stat-name">Mana Pool</div>
                <div class="stat-val">450</div>
            </div>
            <div class="stat-card">
                <div class="stat-name">Crit Chance</div>
                <div class="stat-val">12%</div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage">
        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tt-header">
                <span class="tt-title" id="tt-title">Node Name</span>
                <span class="tt-type" id="tt-type">Passive</span>
            </div>
            <div class="tt-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tt-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetTree()">Reset Tree</button>
            <button class="btn" onclick="alert('Build Saved!')">Save Build</button>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        // Expanded tree structure for better visuals
        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "The foundation of your magical prowess. Unlocks all paths.", stat: "+5% Mana Regen", unlocked: true, color: "#fbbf24" },
            
            // Left Branch: Destruction (Fire)
            { id: 1, x: -250, y: -150, name: "Fire Affinity", type: "Passive", desc: "Your magic burns hotter.", stat: "+10% Fire Dmg", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: -250, y: -350, name: "Combustion", type: "Active", desc: "Spells have a chance to ignite.", stat: "Ignite Chance +5%", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 3, x: -500, y: -350, name: "Inferno", type: "Ultimate", desc: "Summons a vortex of flame.", stat: "Massive Area Dmg", unlocked: false, color: "#ef4444", parents: [2] },
            { id: 4, x: -100, y: -350, name: "Fireball Mastery", type: "Passive", desc: "Fireballs travel faster and explode.", stat: "+25% Speed", unlocked: false, color: "#ef4444", parents: [1] },

            // Right Branch: Ice
            { id: 5, x: 250, y: -150, name: "Frost Touch", type: "Passive", desc: "Cold permeates your attacks.", stat: "Slow 15%", unlocked: false, color: "#22d3ee", parents: [0] },
            { id: 6, x: 250, y: -350, name: "Deep Freeze", type: "Passive", desc: "Slows stack up to 60%.", stat: "Max Slow 60%", unlocked: false, color: "#22d3ee", parents: [5] },
            { id: 7, x: 500, y: -350, name: "Glacial Storm", type: "Ultimate", desc: "Freezes the battlefield.", stat: "Stun + Dmg", unlocked: false, color: "#22d3ee", parents: [6] },
            { id: 8, x: 100, y: -350, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+20% Shield", unlocked: false, color: "#22d3ee", parents: [5] },

            // Center Branch: Utility
            { id: 9, x: 0, y: -200, name: "Arcane Intellect", type: "Passive", desc: "Expand your mind.", stat: "+10 Int", unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: -450, name: "Mana Siphon", type: "Active", desc: "Restore mana on spell cast.", stat: "Lifesteal Mana", unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: -650, name: "Archmage", type: "Trait", desc: "The pinnacle of magic.", stat: "+15% All Stats", unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom Branch: Defense
            { id: 12, x: 0, y: 200, name: "Mental Fortitude", type: "Defense", desc: "Resist mental intrusion.", stat: "-15% Magic Taken", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -150, y: 350, name: "Shield Wall", type: "Defense", desc: "Mana acts as a buffer.", stat: "+300 Max Mana", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 150, y: 350, name: "Evasion", type: "Defense", desc: "Phase out of reality.", stat: "+8% Dodge", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // Center the tree initially
            if (offsetX === 0 && offsetY === 0) {
                offsetX = width / 2;
                offsetY = height / 2 + 100; // Shift up slightly
            }
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            drawGrid();
            drawConnections();
            drawNodes();
        }

        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 80 * scale;
            
            const startX = offsetX % gridSize;
            const startY = offsetY % gridSize;

            ctx.beginPath();
            for (let x = startX; x < width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = startY; y < height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawConnections() {
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        const pPos = getWorldPos(parent);
                        const cPos = getWorldPos(node);
                        
                        const isPathUnlocked = parent.unlocked && node.unlocked;
                        const isPathAvailable = parent.unlocked; // Can we go there next?

                        ctx.beginPath();
                        ctx.moveTo(pPos.x, pPos.y);
                        
                        // Smooth Bezier
                        const midY = (pPos.y + cPos.y) / 2;
                        ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
                        
                        ctx.lineCap = 'round';
                        
                        if (isPathUnlocked) {
                            const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                            grad.addColorStop(0, parent.color);
                            grad.addColorStop(1, node.color);
                            
                            ctx.lineWidth = 4 * scale;
                            ctx.strokeStyle = grad;
                            
                            // Glow
                            ctx.shadowBlur = 15;
                            ctx.shadowColor = node.color;
                        } else if (isPathAvailable) {
                            ctx.lineWidth = 2 * scale;
                            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                            ctx.shadowBlur = 0;
                        } else {
                            ctx.lineWidth = 1 * scale;
                            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                            ctx.shadowBlur = 0;
                        }
                        
                        ctx.stroke();
                        ctx.shadowBlur = 0; 
                    });
                }
            });
        }

        function drawNodes() {
            nodes.forEach(node => {
                const pos = getWorldPos(node);
                const radius = (node.type === 'Ultimate' || node.type === 'Root' ? 24 : 16) * scale;
                
                // 1. Outer Glow (if unlocked or hovered)
                if (node.unlocked || hoveredNode === node) {
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = node.color;
                } else {
                    ctx.shadowBlur = 0;
                }

                // 2. Main Circle Background
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                
                // Gradient Fill
                const grad = ctx.createRadialGradient(pos.x, pos.y, radius * 0.2, pos.x, pos.y, radius);
                if (node.unlocked) {
                    grad.addColorStop(0, node.color);
                    grad.addColorStop(1, adjustColor(node.color, -40)); // Darker edge
                } else {
                    grad.addColorStop(0, '#1e293b');
                    grad.addColorStop(1, '#0f172a');
                }
                ctx.fillStyle = grad;
                ctx.fill();
                
                // 3. Border Ring
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = node.unlocked ? '#fff' : (hoveredNode === node ? node.color : '#334155');
                ctx.stroke();

                // 4. Inner Icon/Dot
                ctx.shadowBlur = 0; // Reset for inner details
                ctx.fillStyle = node.unlocked ? '#fff' : '#475569';
                ctx.beginPath();
                
                // Draw different shapes based on type
                if (node.type === 'Ultimate') {
                    // Star shape
                    drawStar(ctx, pos.x, pos.y, 5, radius * 0.5, radius * 0.25);
                } else if (node.type === 'Root') {
                    // Diamond
                    ctx.moveTo(pos.x, pos.y - radius * 0.4);
                    ctx.lineTo(pos.x + radius * 0.4, pos.y);
                    ctx.lineTo(pos.x, pos.y + radius * 0.4);
                    ctx.lineTo(pos.x - radius * 0.4, pos.y);
                } else {
                    // Circle
                    ctx.arc(pos.x, pos.y, radius * 0.35, 0, Math.PI * 2);
                }
                ctx.fill();

                // 5. Hover Ring
                if (hoveredNode === node) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // 6. Label
                ctx.fillStyle = node.unlocked ? '#fff' : '#64748b';
                ctx.font = `${node.unlocked ? '600' : '400'} ${11 * scale}px -apple-system, sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(node.name, pos.x, pos.y + radius + (16 * scale));
                ctx.shadowBlur = 0;
            });
        }

        // Helper to draw star
        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        // Helper to darken color
        function adjustColor(color, amount) {
            return color; // Simplified for this demo, ideally parse hex and adjust
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Dynamic coloring
            ttType.style.color = node.color;
            ttType.style.background = node.color + '15'; // 15 is hex opacity

            let left = mouseX + 25;
            let top = mouseY - 50;
            
            // Bounds check
            if (left + 300 > width) left = mouseX - 320;
            if (top < 0) top = 20;
            if (top + 150 > height) top = height - 160;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = node.type === 'Ultimate' ? 24 : 16;
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            // Hover logic
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' ? 24 : 16) + 10; 
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                } else {
                    // Update tooltip position even if node is same
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            isDragging = true;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', (e) => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });
        
        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
</html>
