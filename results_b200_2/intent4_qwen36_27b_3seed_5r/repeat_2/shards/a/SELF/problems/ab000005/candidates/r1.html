<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark & Scrub - Premium Clean</title>
    <style>
        :root {
            --wall-color: #EBE6E1;
            --floor-color: #D8CFC4;
            --text-main: #2A2A2A;
            --accent: #D96C4A;
            --ui-bg: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 20px 40px rgba(0,0,0,0.08);
            --shadow-sharp: 0 10px 30px rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevent text selection during drag */
        }

        body {
            background-color: var(--wall-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(217, 108, 74, 0.4);
        }

        .nav-links span {
            margin-left: 2.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: color 0.3s;
        }
        .nav-links span:hover { color: var(--text-main); }

        /* --- Scene Layout --- */
        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Subtle transition for floor entry */
            animation: floor-rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floor-rise {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* --- The Floor --- */
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background-color: var(--floor-color);
            /* Realistic Tile Grid */
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            box-shadow: inset 0 20px 60px rgba(0,0,0,0.1);
            z-index: 1;
        }

        /* The Wall/Floor intersection shadow */
        .wall-shadow {
            position: absolute;
            bottom: 60%;
            width: 100%;
            height: 40px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.05));
            z-index: 2;
            pointer-events: none;
        }

        /* --- SVG Scene --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }

        /* --- Interactive Mop --- */
        .interactive-zone {
            pointer-events: auto;
            cursor: grab;
            transition: filter 0.2s;
        }
        .interactive-zone:active {
            cursor: grabbing;
        }
        .interactive-zone:hover {
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.25));
        }

        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            z-index: 20;
            background: var(--ui-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            max-width: 340px;
            border: 1px solid rgba(255,255,255,0.6);
            transform: translateY(0);
            transition: transform 0.3s;
        }

        .ui-panel h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.2;
            color: var(--text-main);
        }

        .ui-panel p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 1.5rem;
        }

        .btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 108, 74, 0.3);
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* --- Animations --- */
        .spill-container {
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .spill-container.cleaned {
            opacity: 0;
            transform: scale(0.8);
        }

        .water-mark {
            fill: rgba(200, 220, 255, 0.4);
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        /* Subtle idle animation for the mop */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .mop-idle {
            animation: float 4s ease-in-out infinite;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <!-- Wall shadow to ground the scene -->
        <div class="wall-shadow"></div>
        
        <!-- The Floor -->
        <div class="floor"></div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Shadows -->
                <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="15" dy="20" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.25" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="liquid-blur">
                    <feGaussianBlur stdDeviation="3" />
                </filter>

                <!-- Mop Materials -->
                <linearGradient id="handle-metal" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#888;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#ddd;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#777;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
                </linearGradient>

                <linearGradient id="handle-grip" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#222;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#333;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
                </linearGradient>

                <!-- Spill Gradients -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#8B5A2B;stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#5D2E0E;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#3E1F06;stop-opacity:0.8" />
                </radialGradient>
            </defs>

            <!-- 1. The Spill (Mess) -->
            <!-- Positioned roughly in the center-left -->
            <g id="spill-group" class="spill-container" transform="translate(350, 480)">
                <!-- Main organic puddle shape -->
                <path d="M0,0 C-80,-30 -160,20 -140,90 C-120,150 20,180 120,130 C180,100 160,30 80,0 C40,-30 20,-10 0,0 Z" 
                      fill="url(#spill-grad)" filter="url(#liquid-blur)" />
                
                <!-- Splatter details -->
                <circle cx="-160" cy="40" r="12" fill="#5D2E0E" opacity="0.8" filter="url(#liquid-blur)" />
                <circle cx="140" cy="80" r="18" fill="#8B5A2B" opacity="0.7" filter="url(#liquid-blur)" />
                <circle cx="100" cy="-20" r="6" fill="#5D2E0E" opacity="0.6" />
                
                <!-- Dark center for depth -->
                <ellipse cx="0" cy="80" rx="60" ry="30" fill="#2A1405" opacity="0.5" filter="url(#liquid-blur)" />
                
                <!-- Highlight/Reflection on liquid -->
                <ellipse cx="-20" cy="60" rx="20" ry="10" fill="#FFF" opacity="0.1" transform="rotate(-20 -20 60)" />
            </g>

            <!-- 2. The Mop -->
            <!-- Positioned to the right initially -->
            <g id="mop-group" class="interactive-zone mop-idle" transform="translate(600, 150)" filter="url(#drop-shadow)">
                
                <!-- Handle Pole -->
                <rect x="-10" y="0" width="20" height="500" rx="10" fill="url(#handle-metal)" />
                
                <!-- Rubber Grip -->
                <rect x="-14" y="80" width="28" height="140" rx="6" fill="url(#handle-grip)" />
                
                <!-- Grip Texture Lines -->
                <path d="M-14,100 L14,100 M-14,120 L14,120 M-14,140 L14,140 M-14,160 L14,160 M-14,180 L14,180 M-14,200 L14,200" 
                      stroke="#111" stroke-width="2" opacity="0.5" />

                <!-- Connector Joint -->
                <path d="M-10,500 L10,500 L20,540 L-20,540 Z" fill="#333" />
                <rect x="-15" y="530" width="30" height="10" fill="#222" />

                <!-- Mop Head (The Pad) -->
                <g id="mop-head" transform="translate(0, 540)">
                    <!-- Pad Base -->
                    <rect x="-60" y="0" width="120" height="80" rx="15" fill="#EAE5D9" />
                    
                    <!-- Microfiber Texture (Wavy lines) -->
                    <path d="M-55,15 Q0,25 55,15" fill="none" stroke="#D0C8B8" stroke-width="3" />
                    <path d="M-55,30 Q0,40 55,30" fill="none" stroke="#D0C8B8" stroke-width="3" />
                    <path d="M-55,45 Q0,55 55,45" fill="none" stroke="#D0C8B8" stroke-width="3" />
                    <path d="M-55,60 Q0,70 55,60" fill="none" stroke="#D0C8B8" stroke-width="3" />
                    
                    <!-- Wet spots on the mop -->
                    <ellipse cx="0" cy="40" rx="40" ry="15" fill="#8B5A2B" opacity="0.2" filter="url(#liquid-blur)" />
                </g>
            </g>

            <!-- 3. Water Marks (Appear after cleaning) -->
            <g id="water-marks" transform="translate(350, 480)">
                <path d="M0,0 C-80,-30 -160,20 -140,90 C-120,150 20,180 120,130 C180,100 160,30 80,0 C40,-30 20,-10 0,0 Z" 
                      class="water-mark" />
                <!-- Shine streaks -->
                <path d="M-50,40 L-20,40" stroke="white" stroke-width="4" stroke-linecap="round" class="water-mark" opacity="0.6"/>
                <path d="M20,60 L60,60" stroke="white" stroke-width="4" stroke-linecap="round" class="water-mark" opacity="0.6"/>
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Experience the power of our microfiber synthesis. Simply drag the mop over the mess to see the transformation.</p>
            <button class="btn" id="reset-btn">Reset Scene</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelectorAll('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            let initialMopX = 600;
            let initialMopY = 150;
            let currentMopX = 600;
            let currentMopY = 150;
            
            // State
            let isCleaned = false;

            // Event Listeners
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if (isCleaned) return;
                isDragging = true;
                
                // Stop idle animation while dragging
                mopGroup.classList.remove('mop-idle');

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Update internal coordinates
                currentMopX += deltaX;
                currentMopY += deltaY;

                // Apply transform
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);

                // Check Collision
                checkCollision();

                // Reset start for next frame
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
                if(!isCleaned) {
                    // Re-enable idle animation if not cleaned yet
                    mopGroup.classList.add('mop-idle');
                }
            }

            function checkCollision() {
                // Spill center approx (350, 480)
                // Mop Head center approx (currentMopX, currentMopY + 580)
                
                const mopHeadX = currentMopX;
                const mopHeadY = currentMopY + 580; // 540 (connector) + 40 (half pad height)

                const spillX = 350;
                const spillY = 480;

                // Euclidean distance
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                // Hit threshold
                if (dist < 100) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // Stop animation
                mopGroup.classList.remove('mop-idle');
                
                // 1. Hide Spill
                spillGroup.classList.add('cleaned');
                
                // 2. Show Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '1');
                
                // 3. Update Button
                resetBtn.innerText = "Cleaned! Reset to demo";
                resetBtn.style.backgroundColor = "#27ae60";
                
                // 4. Move mop slightly to reveal
                setTimeout(() => {
                    mopGroup.setAttribute('transform', `translate(${currentMopX + 60}, ${currentMopY + 40})`);
                }, 300);
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                currentMopX = initialMopX;
                currentMopY = initialMopY;
                
                // Reset Mop Position
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY})`);
                mopGroup.classList.add('mop-idle');
                
                // Reset Spill
                spillGroup.classList.remove('cleaned');
                
                // Reset Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '0');

                // Reset Button
                resetBtn.innerText = "Reset Scene";
                resetBtn.style.backgroundColor = "var(--text-main)";
            });
        });
    </script>
</body>
</html>
