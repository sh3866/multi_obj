<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark & Scrub - Premium Clean</title>
    <style>
        :root {
            --bg-wall: #EAE6E1;
            --bg-floor: #D6CFC6;
            --text-dark: #1A1A1A;
            --text-light: #666666;
            --accent: #D96C4A;
            --accent-hover: #C25A3A;
            --ui-glass: rgba(255, 255, 255, 0.75);
            --ui-border: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 24px 40px -10px rgba(0,0,0,0.08);
            --shadow-sharp: 0 10px 20px rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(217, 108, 74, 0.5);
        }

        .nav-links span {
            margin-left: 3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .nav-links span:hover { color: var(--accent); }

        /* --- Scene Layout --- */
        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* --- The Floor --- */
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%; /* Taller floor for better composition */
            background-color: var(--bg-floor);
            /* More subtle, expensive looking tile grid */
            background-image: 
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 120px 120px;
            /* Soft vignette at edges */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.05);
            z-index: 1;
        }

        /* The Wall/Floor intersection - cleaner shadow */
        .wall-shadow {
            position: absolute;
            bottom: 65%;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.03));
            z-index: 2;
            pointer-events: none;
        }

        /* --- SVG Scene --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
            overflow: visible;
        }

        /* --- Interactive Mop --- */
        .interactive-zone {
            pointer-events: auto;
            cursor: grab;
            transition: transform 0.1s;
        }
        .interactive-zone:active {
            cursor: grabbing;
        }
        
        /* Hover effect for the mop group to lift it slightly */
        .interactive-zone:hover .mop-shadow {
            transform: translateY(5px) scale(1.05);
            opacity: 0.15;
        }

        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            bottom: 4rem;
            left: 4rem;
            z-index: 20;
            background: var(--ui-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            max-width: 360px;
            border: 1px solid var(--ui-border);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s;
            animation: slide-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slide-up {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .ui-panel h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.1;
            color: var(--text-dark);
            letter-spacing: -0.03em;
        }

        .ui-panel p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .btn {
            background-color: var(--text-dark);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(217, 108, 74, 0.3);
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* --- Animations --- */
        .spill-container {
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }
        
        .spill-container.cleaned {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .water-mark {
            fill: rgba(200, 220, 255, 0.3);
            opacity: 0;
            transition: opacity 1.2s ease-in;
        }

        /* Subtle idle animation for the mop */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .mop-idle {
            animation: float 4.5s ease-in-out infinite;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header { padding: 1.5rem; }
            .nav-links { display: none; }
            .ui-panel { left: 1.5rem; right: 1.5rem; bottom: 2rem; max-width: none; padding: 1.5rem; }
            .ui-panel h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <!-- Wall shadow -->
        <div class="wall-shadow"></div>
        
        <!-- The Floor -->
        <div class="floor"></div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Complex Drop Shadow for Mop -->
                <filter id="mop-shadow-filter" x="-20%" y="-20%" width="150%" height="150%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="20" dy="30" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Liquid Blur for Spill -->
                <filter id="liquid-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                
                <!-- Wet Floor Blur -->
                <filter id="wet-blur">
                    <feGaussianBlur stdDeviation="8" />
                </filter>

                <!-- Spill Gradients (Rich Coffee/Cola) -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#5C3317;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#3E1F06;stop-opacity:0.95" />
                    <stop offset="100%" style="stop-color:#2B1303;stop-opacity:0.8" />
                </radialGradient>
                
                <!-- Spill Edge Highlight -->
                <radialGradient id="spill-edge" cx="50%" cy="50%" r="50%">
                    <stop offset="80%" style="stop-color:#3E1F06;stop-opacity:0" />
                    <stop offset="100%" style="stop-color:#3E1F06;stop-opacity:0.5" />
                </radialGradient>

                <!-- Mop Materials -->
                <!-- Metallic Handle -->
                <linearGradient id="handle-metal" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#999;stop-opacity:1" />
                    <stop offset="25%" style="stop-color:#EEE;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#888;stop-opacity:1" />
                    <stop offset="75%" style="stop-color:#444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
                </linearGradient>

                <!-- Rubber Grip -->
                <linearGradient id="handle-grip" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#222;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#3A3A3A;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
                </linearGradient>

                <!-- Microfiber Pad Gradient -->
                <linearGradient id="pad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#F2EFE9;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#D1CCC0;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Mess) -->
            <!-- Positioned slightly off-center left -->
            <g id="spill-group" class="spill-container" transform="translate(450, 580)">
                <!-- Main organic puddle shape -->
                <path d="M0,0 C-90,-40 -180,20 -160,110 C-140,180 30,210 130,160 C200,130 180,30 90,0 C40,-40 20,-10 0,0 Z" 
                      fill="url(#spill-grad)" filter="url(#liquid-blur)" />
                
                <!-- Edge highlight for volume -->
                <path d="M0,0 C-90,-40 -180,20 -160,110 C-140,180 30,210 130,160 C200,130 180,30 90,0 C40,-40 20,-10 0,0 Z" 
                      fill="url(#spill-edge)" filter="url(#liquid-blur)" transform="scale(1.05)" opacity="0.6"/>
                
                <!-- Splatter details -->
                <circle cx="-180" cy="50" r="15" fill="#3E1F06" opacity="0.8" filter="url(#liquid-blur)" />
                <circle cx="160" cy="100" r="22" fill="#5C3317" opacity="0.7" filter="url(#liquid-blur)" />
                <circle cx="120" cy="-20" r="8" fill="#3E1F06" opacity="0.6" />
                <circle cx="-100" cy="-30" r="5" fill="#3E1F06" opacity="0.5" />
                
                <!-- Dark center for depth -->
                <ellipse cx="-20" cy="90" rx="70" ry="40" fill="#1A0B02" opacity="0.6" filter="url(#liquid-blur)" />
                
                <!-- Highlight/Reflection on liquid -->
                <ellipse cx="-40" cy="70" rx="25" ry="12" fill="#FFF" opacity="0.15" transform="rotate(-20 -40 70)" filter="url(#liquid-blur)" />
            </g>

            <!-- 2. The Mop -->
            <!-- Positioned to the right initially -->
            <g id="mop-group" class="interactive-zone mop-idle" transform="translate(750, 100)">
                
                <!-- Shadow (Separate element to allow scaling without scaling blur) -->
                <g class="mop-shadow" transform="translate(0, 0)" opacity="0.15" style="transition: transform 0.2s;">
                    <path d="M-10,540 L10,540 L20,620 L-20,620 Z" fill="black" filter="url(#wet-blur)"/>
                </g>

                <!-- Main Mop Structure with Drop Shadow Filter -->
                <g filter="url(#mop-shadow-filter)">
                    
                    <!-- Handle Pole -->
                    <rect x="-12" y="0" width="24" height="550" rx="12" fill="url(#handle-metal)" />
                    
                    <!-- Rubber Grip -->
                    <rect x="-16" y="100" width="32" height="160" rx="8" fill="url(#handle-grip)" />
                    
                    <!-- Grip Texture Lines -->
                    <path d="M-16,120 L16,120 M-16,140 L16,140 M-16,160 L16,160 M-16,180 L16,180 M-16,200 L16,200 M-16,220 L16,220 M-16,240 L16,240" 
                          stroke="#111" stroke-width="3" opacity="0.4" stroke-linecap="round" />

                    <!-- Connector Joint -->
                    <path d="M-12,550 L12,550 L22,600 L-22,600 Z" fill="#333" />
                    <rect x="-18" y="590" width="36" height="12" rx="2" fill="#222" />

                    <!-- Mop Head (The Pad) -->
                    <g id="mop-head" transform="translate(0, 600)">
                        <!-- Pad Base -->
                        <rect x="-70" y="0" width="140" height="90" rx="12" fill="url(#pad-grad)" />
                        
                        <!-- Microfiber Texture (Wavy lines) -->
                        <path d="M-65,20 Q0,35 65,20" fill="none" stroke="#C5BFB0" stroke-width="4" stroke-linecap="round" />
                        <path d="M-65,40 Q0,55 65,40" fill="none" stroke="#C5BFB0" stroke-width="4" stroke-linecap="round" />
                        <path d="M-65,60 Q0,75 65,60" fill="none" stroke="#C5BFB0" stroke-width="4" stroke-linecap="round" />
                        <path d="M-65,80 Q0,95 65,80" fill="none" stroke="#C5BFB0" stroke-width="4" stroke-linecap="round" />
                        
                        <!-- Wet spots on the mop (Initial state) -->
                        <ellipse cx="0" cy="45" rx="50" ry="20" fill="#3E1F06" opacity="0.15" filter="url(#liquid-blur)" />
                    </g>
                </g>
            </g>

            <!-- 3. Water Marks (Appear after cleaning) -->
            <g id="water-marks" transform="translate(450, 580)">
                <!-- Wet sheen shape -->
                <path d="M0,0 C-90,-40 -180,20 -160,110 C-140,180 30,210 130,160 C200,130 180,30 90,0 C40,-40 20,-10 0,0 Z" 
                      class="water-mark" filter="url(#wet-blur)" />
                
                <!-- Shine streaks -->
                <path d="M-60,50 L-30,50" stroke="white" stroke-width="6" stroke-linecap="round" class="water-mark" opacity="0.4" filter="url(#wet-blur)"/>
                <path d="M30,70 L80,70" stroke="white" stroke-width="6" stroke-linecap="round" class="water-mark" opacity="0.4" filter="url(#wet-blur)"/>
                <path d="M-20,120 L10,120" stroke="white" stroke-width="4" stroke-linecap="round" class="water-mark" opacity="0.3" filter="url(#wet-blur)"/>
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Experience the power of our microfiber synthesis. Simply drag the mop over the mess to see the transformation.</p>
            <button class="btn" id="reset-btn">Reset Scene</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelectorAll('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            
            // Initial Position (Matches SVG transform)
            let currentMopX = 750;
            let currentMopY = 100;
            
            // State
            let isCleaned = false;

            // Event Listeners
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if (isCleaned) return;
                isDragging = true;
                
                // Stop idle animation while dragging
                mopGroup.classList.remove('mop-idle');

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                // Remove transition during drag for instant response
                mopGroup.style.transition = 'none';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Update internal coordinates
                currentMopX += deltaX;
                currentMopY += deltaY;

                // Apply transform
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);

                // Check Collision
                checkCollision();

                // Reset start for next frame
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                if(!isCleaned) {
                    // Re-enable idle animation if not cleaned yet
                    mopGroup.classList.add('mop-idle');
                    mopGroup.style.transition = ''; // Restore transitions
                }
            }

            function checkCollision() {
                // Spill center approx (450, 580)
                // Mop Head center approx (currentMopX, currentMopY + 645)
                // 600 (connector) + 45 (half pad height)
                
                const mopHeadX = currentMopX;
                const mopHeadY = currentMopY + 645;

                const spillX = 450;
                const spillY = 580;

                // Euclidean distance
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                // Hit threshold (generous radius)
                if (dist < 120) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // Stop animation
                mopGroup.classList.remove('mop-idle');
                
                // 1. Hide Spill
                spillGroup.classList.add('cleaned');
                
                // 2. Show Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '1');
                
                // 3. Update Button
                resetBtn.innerText = "Cleaned! Reset to demo";
                resetBtn.style.backgroundColor = "#27ae60";
                
                // 4. Move mop slightly to reveal
                mopGroup.style.transition = 'transform 0.3s ease-out';
                setTimeout(() => {
                    mopGroup.setAttribute('transform', `translate(${currentMopX + 80}, ${currentMopY + 60})`);
                }, 300);
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                currentMopX = 750;
                currentMopY = 100;
                
                // Reset Mop Position
                mopGroup.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);
                mopGroup.classList.add('mop-idle');
                
                // Reset Spill
                spillGroup.classList.remove('cleaned');
                
                // Reset Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '0');

                // Reset Button
                resetBtn.innerText = "Reset Scene";
                resetBtn.style.backgroundColor = "var(--text-dark)";
                
                // Remove transition after animation completes so drag is instant
                setTimeout(() => {
                    mopGroup.style.transition = '';
                }, 500);
            });
        });
    </script>
</body>
</html>
