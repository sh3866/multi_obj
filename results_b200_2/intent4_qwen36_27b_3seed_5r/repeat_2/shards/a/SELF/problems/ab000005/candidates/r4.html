<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark & Scrub - Premium Clean</title>
    <style>
        :root {
            /* Palette: Warm, Premium, Clean */
            --bg-wall: #F7F5F0;
            --bg-floor: #EBE7E1;
            --text-primary: #1A1A1A;
            --text-secondary: #5A5A5A;
            --accent: #D96C4A; /* Burnt Orange */
            --ui-glass: rgba(255, 255, 255, 0.75);
            --ui-border: rgba(255, 255, 255, 0.9);
            --shadow-float: 0 20px 50px -10px rgba(0,0,0,0.08);
            --shadow-inset: inset 0 0 120px rgba(0,0,0,0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand-dot {
            width: 14px;
            height: 14px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(217, 108, 74, 0.2);
        }

        .nav-links span {
            margin-left: 3.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
        }
        
        .nav-links span:hover { color: var(--text-primary); }
        .nav-links span::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0; width: 0%; height: 1px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        .nav-links span:hover::after { width: 100%; }

        /* --- Scene Container --- */
        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- The Floor (CSS + SVG Hybrid) --- */
        .floor-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55%; 
            background-color: var(--bg-floor);
            /* Subtle, expensive tile texture */
            background-image: 
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 120px 120px;
            box-shadow: var(--shadow-inset);
            z-index: 1;
        }

        /* Wall/Floor Intersection - Soft Gradient */
        .wall-crease {
            position: absolute;
            bottom: 55%;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.03));
            z-index: 2;
            pointer-events: none;
        }

        /* --- SVG Scene --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
            overflow: visible;
        }

        /* --- Interactive Mop --- */
        .interactive-zone {
            pointer-events: auto;
            cursor: grab;
            /* Softer, realistic shadow */
            filter: drop-shadow(10px 40px 20px rgba(0,0,0,0.15));
            transition: filter 0.3s ease;
        }
        .interactive-zone:active {
            cursor: grabbing;
            filter: drop-shadow(5px 20px 15px rgba(0,0,0,0.2));
        }
        
        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            bottom: 4rem;
            left: 4rem;
            z-index: 50;
            background: var(--ui-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 3.5rem;
            border-radius: 36px;
            box-shadow: var(--shadow-float);
            max-width: 360px;
            border: 1px solid var(--ui-border);
            transform: translateY(0);
            animation: slide-up 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slide-up {
            from { transform: translateY(60px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .ui-panel h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.1;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        .ui-panel p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .btn {
            background-color: var(--text-primary);
            color: white;
            border: none;
            padding: 1.1rem 2.5rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(217, 108, 74, 0.3);
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* --- Animations --- */
        .spill-container {
            transition: opacity 1.2s ease-out, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }
        
        .spill-container.cleaned {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        .water-mark {
            fill: rgba(200, 220, 255, 0.35);
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        /* Subtle idle animation for the mop */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(0.2deg); }
        }

        .mop-idle {
            animation: float 5s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 1.5rem; }
            .nav-links { display: none; }
            .ui-panel { left: 1.5rem; right: 1.5rem; bottom: 2rem; max-width: none; padding: 2rem; }
            .ui-panel h1 { font-size: 1.5rem; }
            .floor-layer { height: 45%; bottom: 0; }
            .wall-crease { bottom: 45%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <div class="wall-crease"></div>
        <div class="floor-layer"></div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Complex Liquid Blur -->
                <filter id="liquid-blur" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="5" />
                </filter>
                
                <!-- Wet Floor Blur -->
                <filter id="wet-blur">
                    <feGaussianBlur stdDeviation="12" />
                </filter>

                <!-- Coffee/Cola Spill Gradient -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#4A2912;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#361D0A;stop-opacity:0.95" />
                    <stop offset="100%" style="stop-color:#211004;stop-opacity:0.8" />
                </radialGradient>
                
                <!-- Spill Edge Highlight -->
                <radialGradient id="spill-edge" cx="50%" cy="50%" r="50%">
                    <stop offset="80%" style="stop-color:#361D0A;stop-opacity:0" />
                    <stop offset="100%" style="stop-color:#361D0A;stop-opacity:0.6" />
                </radialGradient>

                <!-- Mop Materials -->
                <!-- Metallic Handle -->
                <linearGradient id="handle-metal" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#F0F0F0;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#909090;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#505050;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#303030;stop-opacity:1" />
                </linearGradient>

                <!-- Rubber Grip -->
                <linearGradient id="handle-grip" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#222;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
                </linearGradient>

                <!-- Microfiber Pad Gradient -->
                <linearGradient id="pad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#F9F7F2;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#E0DCD3;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Mess) -->
            <g id="spill-group" class="spill-container" transform="translate(450, 580)">
                <!-- Main organic puddle shape -->
                <path d="M0,0 C-100,-50 -200,10 -180,120 C-150,200 40,230 140,170 C220,130 190,20 90,0 C40,-50 20,-10 0,0 Z" 
                      fill="url(#spill-grad)" filter="url(#liquid-blur)" />
                
                <!-- Edge highlight for volume -->
                <path d="M0,0 C-100,-50 -200,10 -180,120 C-150,200 40,230 140,170 C220,130 190,20 90,0 C40,-50 20,-10 0,0 Z" 
                      fill="url(#spill-edge)" filter="url(#liquid-blur)" transform="scale(1.08)" opacity="0.7"/>
                
                <!-- Splatter details -->
                <circle cx="-200" cy="60" r="18" fill="#361D0A" opacity="0.8" filter="url(#liquid-blur)" />
                <circle cx="180" cy="110" r="25" fill="#4A2912" opacity="0.7" filter="url(#liquid-blur)" />
                <circle cx="130" cy="-20" r="9" fill="#361D0A" opacity="0.6" />
                <circle cx="-110" cy="-35" r="6" fill="#361D0A" opacity="0.5" />
                
                <!-- Dark center for depth -->
                <ellipse cx="-20" cy="100" rx="80" ry="45" fill="#1A0B02" opacity="0.7" filter="url(#liquid-blur)" />
                
                <!-- Highlight/Reflection on liquid -->
                <ellipse cx="-50" cy="80" rx="30" ry="14" fill="#FFF" opacity="0.12" transform="rotate(-20 -50 80)" filter="url(#liquid-blur)" />
                <ellipse cx="50" cy="130" rx="15" ry="8" fill="#FFF" opacity="0.08" transform="rotate(10 50 130)" filter="url(#liquid-blur)" />
            </g>

            <!-- 2. The Mop -->
            <g id="mop-group" class="interactive-zone mop-idle" transform="translate(750, 100)">
                
                <!-- Handle Pole -->
                <rect x="-14" y="0" width="28" height="600" rx="14" fill="url(#handle-metal)" />
                
                <!-- Rubber Grip -->
                <rect x="-18" y="120" width="36" height="180" rx="10" fill="url(#handle-grip)" />
                
                <!-- Grip Texture Lines -->
                <path d="M-18,140 L18,140 M-18,160 L18,160 M-18,180 L18,180 M-18,200 L18,200 M-18,220 L18,220 M-18,240 L18,240 M-18,260 L18,260 M-18,280 L18,280" 
                      stroke="#111" stroke-width="4" opacity="0.5" stroke-linecap="round" />

                <!-- Connector Joint -->
                <path d="M-14,600 L14,600 L24,660 L-24,660 Z" fill="#333" />
                <rect x="-20" y="650" width="40" height="15" rx="4" fill="#222" />

                <!-- Mop Head (The Pad) -->
                <g id="mop-head" transform="translate(0, 660)">
                    <!-- Pad Base -->
                    <rect x="-80" y="0" width="160" height="100" rx="15" fill="url(#pad-grad)" />
                    
                    <!-- Microfiber Texture (Wavy lines) -->
                    <path d="M-75,25 Q0,40 75,25" fill="none" stroke="#D1CCC0" stroke-width="5" stroke-linecap="round" />
                    <path d="M-75,45 Q0,60 75,45" fill="none" stroke="#D1CCC0" stroke-width="5" stroke-linecap="round" />
                    <path d="M-75,65 Q0,80 75,65" fill="none" stroke="#D1CCC0" stroke-width="5" stroke-linecap="round" />
                    <path d="M-75,85 Q0,100 75,85" fill="none" stroke="#D1CCC0" stroke-width="5" stroke-linecap="round" />
                    
                    <!-- Wet spots on the mop (Initial state) -->
                    <ellipse cx="0" cy="50" rx="60" ry="25" fill="#361D0A" opacity="0.15" filter="url(#liquid-blur)" />
                </g>
            </g>

            <!-- 3. Water Marks (Appear after cleaning) -->
            <g id="water-marks" transform="translate(450, 580)">
                <!-- Wet sheen shape -->
                <path d="M0,0 C-100,-50 -200,10 -180,120 C-150,200 40,230 140,170 C220,130 190,20 90,0 C40,-50 20,-10 0,0 Z" 
                      class="water-mark" filter="url(#wet-blur)" />
                
                <!-- Shine streaks -->
                <path d="M-70,60 L-30,60" stroke="white" stroke-width="8" stroke-linecap="round" class="water-mark" opacity="0.5" filter="url(#wet-blur)"/>
                <path d="M40,80 L90,80" stroke="white" stroke-width="8" stroke-linecap="round" class="water-mark" opacity="0.5" filter="url(#wet-blur)"/>
                <path d="M-20,130 L10,130" stroke="white" stroke-width="6" stroke-linecap="round" class="water-mark" opacity="0.4" filter="url(#wet-blur)"/>
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Experience the power of our microfiber synthesis. Simply drag the mop over the mess to see the transformation.</p>
            <button class="btn" id="reset-btn">Reset Scene</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelectorAll('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            
            // Initial Position
            let currentMopX = 750;
            let currentMopY = 100;
            
            // State
            let isCleaned = false;

            // Event Listeners
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if (isCleaned) return;
                isDragging = true;
                
                // Stop idle animation while dragging
                mopGroup.classList.remove('mop-idle');

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                // Remove transition during drag for instant response
                mopGroup.style.transition = 'none';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Update internal coordinates
                currentMopX += deltaX;
                currentMopY += deltaY;

                // Apply transform
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);

                // Check Collision
                checkCollision();

                // Reset start for next frame
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                if(!isCleaned) {
                    // Re-enable idle animation if not cleaned yet
                    mopGroup.classList.add('mop-idle');
                    mopGroup.style.transition = ''; // Restore transitions
                }
            }

            function checkCollision() {
                // Spill center approx (450, 580)
                // Mop Head center approx (currentMopX, currentMopY + 710)
                // 660 (connector) + 50 (half pad height)
                
                const mopHeadX = currentMopX;
                const mopHeadY = currentMopY + 710;

                const spillX = 450;
                const spillY = 580;

                // Euclidean distance
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                // Hit threshold (generous radius)
                if (dist < 140) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // Stop animation
                mopGroup.classList.remove('mop-idle');
                
                // 1. Hide Spill
                spillGroup.classList.add('cleaned');
                
                // 2. Show Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '1');
                
                // 3. Update Button
                resetBtn.innerText = "Cleaned! Reset to demo";
                resetBtn.style.backgroundColor = "#27ae60";
                
                // 4. Move mop slightly to reveal
                mopGroup.style.transition = 'transform 0.3s ease-out';
                setTimeout(() => {
                    mopGroup.setAttribute('transform', `translate(${currentMopX + 80}, ${currentMopY + 60})`);
                }, 300);
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                currentMopX = 750;
                currentMopY = 100;
                
                // Reset Mop Position
                mopGroup.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);
                mopGroup.classList.add('mop-idle');
                
                // Reset Spill
                spillGroup.classList.remove('cleaned');
                
                // Reset Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '0');

                // Reset Button
                resetBtn.innerText = "Reset Scene";
                resetBtn.style.backgroundColor = "var(--text-primary)";
                
                // Remove transition after animation completes so drag is instant
                setTimeout(() => {
                    mopGroup.style.transition = '';
                }, 500);
            });
        });
    </script>
</body>
</html>
