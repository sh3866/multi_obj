<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark & Scrub - Premium Clean</title>
    <style>
        :root {
            /* Palette: Warm, Premium, Clean */
            --bg-wall: #F4F1EB;
            --bg-floor: #EAE5DC;
            --text-primary: #1C1C1C;
            --text-secondary: #666059;
            --accent: #D46236; /* Burnt Sienna */
            --ui-glass: rgba(255, 255, 255, 0.65);
            --ui-border: rgba(255, 255, 255, 0.8);
            --shadow-soft: 0 20px 40px -10px rgba(100, 80, 60, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-primary);
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Environment --- */
        .wall-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 60%;
            background: radial-gradient(circle at 50% 20%, #fff 0%, var(--bg-wall) 70%);
            z-index: 1;
        }

        .floor-layer {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 45%;
            background-color: var(--bg-floor);
            /* Realistic Tile Pattern */
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 150px 150px;
            z-index: 2;
            /* Perspective distortion */
            transform: perspective(1000px) rotateX(20deg) scale(1.2);
            transform-origin: center bottom;
        }

        /* Baseboard / Crease */
        .wall-crease {
            position: absolute;
            top: 60%;
            width: 100%;
            height: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.08), transparent);
            z-index: 3;
            pointer-events: none;
        }

        /* --- Header --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(212, 98, 54, 0.2);
        }

        .nav-links span {
            margin-left: 3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
        }
        
        .nav-links span:hover { color: var(--text-primary); }

        /* --- Scene Container --- */
        .scene-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- SVG Scene --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            overflow: visible;
        }

        /* --- Interactive Mop --- */
        .interactive-zone {
            cursor: grab;
            /* Realistic Shadow */
            filter: drop-shadow(15px 40px 25px rgba(0,0,0,0.2));
            transition: filter 0.3s ease;
        }
        .interactive-zone:active {
            cursor: grabbing;
            filter: drop-shadow(5px 20px 15px rgba(0,0,0,0.25));
        }
        
        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            bottom: 6rem;
            left: 4rem;
            z-index: 50;
            background: var(--ui-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 40px;
            box-shadow: var(--shadow-soft);
            max-width: 340px;
            border: 1px solid var(--ui-border);
            transform: translateY(0);
            animation: slide-up 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slide-up {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .ui-panel h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.1;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        .ui-panel p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .btn {
            background-color: var(--text-primary);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            letter-spacing: 0.01em;
        }

        .btn:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 98, 54, 0.3);
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* --- Animations --- */
        .spill-container {
            transition: opacity 1.2s ease-out, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }
        
        .spill-container.cleaned {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        .water-mark {
            fill: rgba(200, 220, 255, 0.4);
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        /* Subtle idle animation for the mop */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.5deg); }
        }

        .mop-idle {
            animation: float 6s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 1.5rem; }
            .nav-links { display: none; }
            .ui-panel { left: 1.5rem; right: 1.5rem; bottom: 2rem; max-width: none; padding: 2rem; }
            .ui-panel h1 { font-size: 1.6rem; }
            .floor-layer { height: 50%; }
            .wall-crease { top: 50%; }
        }
    </style>
</head>
<body>

    <div class="wall-layer"></div>
    <div class="wall-crease"></div>
    <div class="floor-layer"></div>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Complex Liquid Blur -->
                <filter id="liquid-blur" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="6" />
                </filter>
                
                <!-- Wet Floor Blur -->
                <filter id="wet-blur">
                    <feGaussianBlur stdDeviation="15" />
                </filter>

                <!-- Coffee Spill Gradient - Richer, Darker -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#2E1608;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#3E2212;stop-opacity:0.95" />
                    <stop offset="85%" style="stop-color:#4A2C18;stop-opacity:0.8" />
                    <stop offset="100%" style="stop-color:#361D0A;stop-opacity:0" />
                </radialGradient>
                
                <!-- Spill Edge Highlight -->
                <radialGradient id="spill-edge" cx="50%" cy="50%" r="50%">
                    <stop offset="80%" style="stop-color:#361D0A;stop-opacity:0" />
                    <stop offset="100%" style="stop-color:#361D0A;stop-opacity:0.8" />
                </radialGradient>

                <!-- Mop Materials -->
                <!-- Metallic Handle -->
                <linearGradient id="handle-metal" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#A0A0A0;stop-opacity:1" />
                    <stop offset="15%" style="stop-color:#F0F0F0;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#808080;stop-opacity:1" />
                    <stop offset="85%" style="stop-color:#404040;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#202020;stop-opacity:1" />
                </linearGradient>

                <!-- Rubber Grip -->
                <linearGradient id="handle-grip" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#3a3a3a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
                </linearGradient>

                <!-- Microfiber Pad Gradient - Cleaner White -->
                <linearGradient id="pad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#F2F0EB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#DCD8D0;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Mess) -->
            <g id="spill-group" class="spill-container" transform="translate(550, 650)">
                <!-- Main organic puddle shape -->
                <path d="M0,0 C-120,-60 -240,20 -210,140 C-180,240 50,260 160,190 C250,140 210,20 100,0 C50,-60 20,-10 0,0 Z" 
                      fill="url(#spill-grad)" filter="url(#liquid-blur)" />
                
                <!-- Edge highlight for volume -->
                <path d="M0,0 C-120,-60 -240,20 -210,140 C-180,240 50,260 160,190 C250,140 210,20 100,0 C50,-60 20,-10 0,0 Z" 
                      fill="url(#spill-edge)" filter="url(#liquid-blur)" transform="scale(1.05)" opacity="0.7"/>
                
                <!-- Splatter details -->
                <circle cx="-220" cy="80" r="22" fill="#361D0A" opacity="0.8" filter="url(#liquid-blur)" />
                <circle cx="200" cy="130" r="30" fill="#4A2912" opacity="0.7" filter="url(#liquid-blur)" />
                <circle cx="150" cy="-20" r="12" fill="#361D0A" opacity="0.6" />
                <circle cx="-130" cy="-45" r="8" fill="#361D0A" opacity="0.5" />
                
                <!-- Dark center for depth -->
                <ellipse cx="-20" cy="110" rx="100" ry="55" fill="#1A0B02" opacity="0.8" filter="url(#liquid-blur)" />
                
                <!-- Highlight/Reflection on liquid -->
                <ellipse cx="-60" cy="90" rx="40" ry="18" fill="#FFF" opacity="0.15" transform="rotate(-20 -60 90)" filter="url(#liquid-blur)" />
                <ellipse cx="60" cy="150" rx="20" ry="10" fill="#FFF" opacity="0.1" transform="rotate(10 60 150)" filter="url(#liquid-blur)" />
            </g>

            <!-- 2. The Mop -->
            <g id="mop-group" class="interactive-zone mop-idle" transform="translate(850, 120)">
                
                <!-- Handle Pole -->
                <rect x="-12" y="0" width="24" height="650" rx="12" fill="url(#handle-metal)" />
                
                <!-- Rubber Grip -->
                <rect x="-16" y="140" width="32" height="200" rx="8" fill="url(#handle-grip)" />
                
                <!-- Grip Texture Lines -->
                <path d="M-16,160 L16,160 M-16,180 L16,180 M-16,200 L16,200 M-16,220 L16,220 M-16,240 L16,240 M-16,260 L16,260 M-16,280 L16,280 M-16,300 L16,300 M-16,320 L16,320" 
                      stroke="#111" stroke-width="3" opacity="0.6" stroke-linecap="round" />

                <!-- Connector Joint -->
                <path d="M-12,650 L12,650 L20,710 L-20,710 Z" fill="#2a2a2a" />
                <rect x="-18" y="700" width="36" height="12" rx="3" fill="#1a1a1a" />

                <!-- Mop Head (The Pad) -->
                <g id="mop-head" transform="translate(0, 710)">
                    <!-- Pad Base -->
                    <rect x="-90" y="0" width="180" height="110" rx="20" fill="url(#pad-grad)" />
                    
                    <!-- Microfiber Texture (Wavy lines) -->
                    <path d="M-85,30 Q0,45 85,30" fill="none" stroke="#E5E0D6" stroke-width="6" stroke-linecap="round" />
                    <path d="M-85,50 Q0,65 85,50" fill="none" stroke="#E5E0D6" stroke-width="6" stroke-linecap="round" />
                    <path d="M-85,70 Q0,85 85,70" fill="none" stroke="#E5E0D6" stroke-width="6" stroke-linecap="round" />
                    <path d="M-85,90 Q0,105 85,90" fill="none" stroke="#E5E0D6" stroke-width="6" stroke-linecap="round" />
                    
                    <!-- Wet spots on the mop (Initial state) -->
                    <ellipse cx="0" cy="55" rx="70" ry="30" fill="#361D0A" opacity="0.1" filter="url(#liquid-blur)" />
                </g>
            </g>

            <!-- 3. Water Marks (Appear after cleaning) -->
            <g id="water-marks" transform="translate(550, 650)">
                <!-- Wet sheen shape -->
                <path d="M0,0 C-120,-60 -240,20 -210,140 C-180,240 50,260 160,190 C250,140 210,20 100,0 C50,-60 20,-10 0,0 Z" 
                      class="water-mark" filter="url(#wet-blur)" />
                
                <!-- Shine streaks -->
                <path d="M-80,70 L-40,70" stroke="white" stroke-width="10" stroke-linecap="round" class="water-mark" opacity="0.6" filter="url(#wet-blur)"/>
                <path d="M50,90 L100,90" stroke="white" stroke-width="10" stroke-linecap="round" class="water-mark" opacity="0.6" filter="url(#wet-blur)"/>
                <path d="M-30,140 L10,140" stroke="white" stroke-width="8" stroke-linecap="round" class="water-mark" opacity="0.5" filter="url(#wet-blur)"/>
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Experience the power of our microfiber synthesis. Simply drag the mop over the mess to see the transformation.</p>
            <button class="btn" id="reset-btn">Reset Scene</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelectorAll('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            
            // Initial Position
            let currentMopX = 850;
            let currentMopY = 120;
            
            // State
            let isCleaned = false;

            // Event Listeners
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if (isCleaned) return;
                isDragging = true;
                
                // Stop idle animation while dragging
                mopGroup.classList.remove('mop-idle');

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                // Remove transition during drag for instant response
                mopGroup.style.transition = 'none';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Update internal coordinates
                currentMopX += deltaX;
                currentMopY += deltaY;

                // Apply transform
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);

                // Check Collision
                checkCollision();

                // Reset start for next frame
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                if(!isCleaned) {
                    // Re-enable idle animation if not cleaned yet
                    mopGroup.classList.add('mop-idle');
                    mopGroup.style.transition = ''; // Restore transitions
                }
            }

            function checkCollision() {
                // Spill center approx (550, 650)
                // Mop Head center approx (currentMopX, currentMopY + 760)
                // 710 (connector) + 55 (half pad height)
                
                const mopHeadX = currentMopX;
                const mopHeadY = currentMopY + 760;

                const spillX = 550;
                const spillY = 650;

                // Euclidean distance
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                // Hit threshold (generous radius)
                if (dist < 150) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // Stop animation
                mopGroup.classList.remove('mop-idle');
                
                // 1. Hide Spill
                spillGroup.classList.add('cleaned');
                
                // 2. Show Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '1');
                
                // 3. Update Button
                resetBtn.innerText = "Cleaned! Reset to demo";
                resetBtn.style.backgroundColor = "#2E8B57"; // Sea Green
                
                // 4. Move mop slightly to reveal
                mopGroup.style.transition = 'transform 0.3s ease-out';
                setTimeout(() => {
                    mopGroup.setAttribute('transform', `translate(${currentMopX + 100}, ${currentMopY + 80})`);
                }, 300);
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                currentMopX = 850;
                currentMopY = 120;
                
                // Reset Mop Position
                mopGroup.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);
                mopGroup.classList.add('mop-idle');
                
                // Reset Spill
                spillGroup.classList.remove('cleaned');
                
                // Reset Water Marks
                waterMarks.forEach(mark => mark.style.opacity = '0');

                // Reset Button
                resetBtn.innerText = "Reset Scene";
                resetBtn.style.backgroundColor = "var(--text-primary)";
                
                // Remove transition after animation completes so drag is instant
                setTimeout(() => {
                    mopGroup.style.transition = '';
                }, 500);
            });
        });
    </script>
</body>
</html>
