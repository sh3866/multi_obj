<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm, Hand-Drawn Storybook */
            --bg-color: #FDF6E3; /* Cream */
            --board-bg: #E3D5C8; /* Warm Taupe */
            --tile-bg: #F4F1EA; /* Off-white paper */
            
            --ink-color: #4A3B32; /* Dark Brown */
            --ink-light: #8C7B70;
            
            --accent-cub: #E07A5F; /* Burnt Sienna */
            --accent-cub-dark: #C05A40;
            
            --accent-star: #F2CC8F; /* Muted Gold */
            --accent-star-glow: #F7D794;
            
            --accent-path: #81B29A; /* Sage Green */
            --accent-path-active: #5F9E85;
            
            /* Dimensions */
            --board-padding: 24px;
            --tile-size: 60px;
            --gap: 12px;
            --radius-large: 24px;
            --radius-tile: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            /* Subtle paper texture using noise gradient */
            background-image: radial-gradient(#E8DFD0 1px, transparent 0);
            background-size: 20px 20px;
            
            font-family: 'Courier New', Courier, monospace; /* Typewriter vibe */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-color);
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
        }

        h1 {
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
            font-size: 3rem;
            margin: 0;
            letter-spacing: -1px;
            color: var(--ink-color);
            position: relative;
            display: inline-block;
            /* Wobbly text effect via transform */
            transform: rotate(-1deg);
        }

        /* Scribble underline */
        h1::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: -10px;
            width: calc(100% + 20px);
            height: 14px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 5 Q 50 10 100 5" stroke="%23F2CC8F" stroke-width="6" fill="none" stroke-linecap="round"/></svg>');
            background-size: 100% 100%;
            opacity: 0.8;
            z-index: -1;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--ink-light);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 8px;
            background: rgba(255,255,255,0.6);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            transform: rotate(1deg);
        }

        /* --- The Board Container --- */
        .game-wrapper {
            position: relative;
            padding: 12px;
            background: #fff;
            border-radius: var(--radius-large);
            box-shadow: 
                0 20px 40px rgba(74, 59, 50, 0.1),
                0 4px 0 rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .board-frame {
            background-color: var(--board-bg);
            padding: var(--board-padding);
            border-radius: 16px;
            border: 4px solid var(--ink-color);
            /* Hand-drawn border feel */
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1);
            position: relative;
        }

        /* Decorative corner marks */
        .corner-mark {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 3px solid var(--ink-color);
            opacity: 0.2;
        }
        .cm-tl { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-radius: 4px 0 0 0; }
        .cm-tr { top: 8px; right: 8px; border-left: 0; border-bottom: 0; border-radius: 0 4px 0 0; }
        .cm-bl { bottom: 8px; left: 8px; border-right: 0; border-top: 0; border-radius: 0 0 0 4px; }
        .cm-br { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-radius: 0 0 4px 0; }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
        }

        /* --- Tiles --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-bg);
            border-radius: var(--radius-tile);
            position: relative;
            cursor: pointer;
            /* Soft 3D look */
            box-shadow: 
                0 4px 0 #DCD7CC, 
                inset 0 2px 4px rgba(255,255,255,0.8);
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 #DCD7CC, 
                inset 0 2px 4px rgba(255,255,255,0.8);
        }

        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* The Path Lines */
        .path-line {
            fill: none;
            stroke: #D1C7B8; /* Inactive path color */
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease, stroke-width 0.4s ease, filter 0.4s ease;
        }

        /* Active State */
        .tile.active .path-line {
            stroke: var(--accent-path-active);
            stroke-width: 12;
            filter: drop-shadow(0 0 2px var(--accent-path));
        }

        /* --- Characters --- */
        
        /* The Goal Star */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 5;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-4px); }
        }

        /* The Cub Token */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background-color: var(--accent-cub);
            border-radius: 10px; /* Squircle */
            z-index: 20;
            /* Chunky 3D shadow */
            box-shadow: 
                0 6px 0 var(--accent-cub-dark),
                0 10px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(255,255,255,0.4);
        }

        /* Cub Face Details */
        .cub-face {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .cub-eye {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            box-shadow: inset -1px 0 0 rgba(0,0,0,0.1);
        }
        .cub-eye::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--ink-color);
            border-radius: 50%;
            top: 2px;
            right: 2px;
        }
        .cub-eye.left { left: 8px; }
        .cub-eye.right { right: 8px; }
        
        .cub-snout {
            width: 18px;
            height: 12px;
            background: #fff;
            border-radius: 8px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: inset 0 2px 2px rgba(0,0,0,0.1);
        }
        
        .cub-nose {
            width: 6px;
            height: 5px;
            background: var(--ink-color);
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- Footer & Controls --- */
        footer {
            margin-top: 40px;
            display: flex;
            gap: 24px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 12px 32px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.15s ease;
            position: relative;
            top: 0;
        }

        .btn-reset {
            background-color: #fff;
            color: var(--ink-color);
            border: 3px solid var(--ink-color);
            box-shadow: 0 4px 0 var(--ink-color);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--ink-color);
            background-color: #FDFDFD;
        }
        
        .btn-reset:active {
            top: 4px;
            box-shadow: 0 0 0 var(--ink-color);
        }

        .btn-run {
            background-color: var(--accent-path);
            color: #fff;
            border: 3px solid var(--ink-color);
            box-shadow: 0 4px 0 var(--ink-color);
        }

        .btn-run:hover {
            background-color: var(--accent-path-active);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--ink-color);
        }

        .btn-run:active {
            top: 4px;
            box-shadow: 0 0 0 var(--ink-color);
        }

        /* --- Responsive --- */
        @media (max-width: 520px) {
            :root {
                --tile-size: 46px;
                --gap: 8px;
                --board-padding: 16px;
            }
            h1 { font-size: 2.2rem; }
            .game-wrapper { padding: 8px; }
            footer { gap: 12px; }
            button { padding: 10px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Connect the path</div>
    </header>

    <div class="game-wrapper">
        <div class="board-frame">
            <!-- Decorative corners -->
            <div class="corner-mark cm-tl"></div>
            <div class="corner-mark cm-tr"></div>
            <div class="corner-mark cm-bl"></div>
            <div class="corner-mark cm-br"></div>

            <div class="grid" id="grid">
                <!-- Grid generated by JS -->
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        function createPathSVG(conn) {
            // conn is [top, right, bottom, left]
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            // Draw lines from center to edges
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; 
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; 
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; 
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; 

            // Add a center dot if it's a straight line or corner to hide the join slightly
            if (conn.filter(Boolean).length <= 2) {
                d += `M${cx},${cy} L${cx},${cy} `;
            }

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Star SVG ---
        const starSVG = `
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z" 
                fill="var(--accent-star)" stroke="var(--ink-color)" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z" 
                fill="var(--accent-star-glow)" fill-opacity="0.4"/>
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token (Absolute positioned over grid)
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = `
                <div class="cub-face">
                    <div class="cub-eye left"></div>
                    <div class="cub-eye right"></div>
                    <div class="cub-snout">
                        <div class="cub-nose"></div>
                    </div>
                </div>
            `;
            gridEl.appendChild(cub);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Determine tile content
                    if (x === startPos.x && y === startPos.y) {
                        // Start tile: Down, Right, Left (T-shape)
                        tile.innerHTML = createPathSVG([false, true, true, true]); 
                    } else if (x === endPos.x && y === endPos.y) {
                        // End tile: Up, Left, Right (T-shape)
                        tile.innerHTML = createPathSVG([true, true, false, true]);
                    } else {
                        // Random filler for visual appeal
                        const types = [
                            [true, false, true, false], // |
                            [false, true, false, true], // -
                            [true, true, false, false], // |->
                            [false, true, true, false], // <-|
                            [true, false, false, true], // |<-
                            [false, false, true, true], // ->|
                            [true, true, true, true]    // +
                        ];
                        const type = types[Math.floor(Math.random() * types.length)];
                        tile.innerHTML = createPathSVG(type);
                    }

                    gridEl.appendChild(tile);
                }
            }

            updateCubPosition(startPos.x, startPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
            const padding = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--board-padding'));
            
            // Calculate position
            const top = padding + y * (tileSize + gap) + (tileSize / 2);
            const left = padding + x * (tileSize + gap) + (tileSize / 2);

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Little shake effect
            const wrapper = document.querySelector('.game-wrapper');
            wrapper.style.transform = 'scale(0.98) rotate(1deg)';
            setTimeout(() => wrapper.style.transform = 'scale(1) rotate(0deg)', 200);
        }

        function solvePuzzle() {
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Hardcoded path for the demo effect
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 300; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
