<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix - Redesign</title>
    <style>
        :root {
            /* Palette */
            --bg-dark: #020617;
            --bg-navy: #0f172a;
            --bg-panel: rgba(15, 23, 42, 0.6);
            --bg-card: rgba(30, 41, 59, 0.4);
            
            --accent-gold: #fbbf24;
            --accent-gold-dim: #b45309;
            --accent-gold-glow: rgba(251, 191, 36, 0.4);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            
            --border-color: rgba(148, 163, 184, 0.1);
            
            /* Standardized Geometry per Critique #3 */
            --radius-card: 8px;
            --radius-pill: 999px;
            
            /* Typography per Critique #2 */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-ui);
            color: var(--text-main);
            /* Critique #4: Subtle radial gradient background */
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 70%, #000000 100%);
            display: flex;
        }

        /* --- Sidebar (280px) --- */
        .sidebar {
            width: 280px;
            height: 100%;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 20;
            flex-shrink: 0;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .avatar-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            padding: 3px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-gold), #78350f);
            box-shadow: 0 0 20px var(--accent-gold-glow);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-inner svg {
            width: 40px;
            height: 40px;
            fill: var(--text-main);
            opacity: 0.9;
        }

        /* --- Stat Blocks --- */
        .stat-block {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        /* Critique #3 & #4: XP Bar */
        .progress-track {
            height: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 4px; /* Half of card radius */
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 65%;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        /* Critique #2: Skill Points Focal Point */
        .points-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .points-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-gold);
            line-height: 1;
            text-shadow: 0 0 15px var(--accent-gold-glow);
        }

        /* --- Main Stage --- */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Critique #1: Header Bar */
        .header-bar {
            height: 70px;
            background: rgba(2, 6, 23, 0.8);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        .char-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .char-class {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        /* Critique #3: Pill Badge */
        .level-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .level-badge span {
            color: var(--text-main);
        }

        /* Canvas Area */
        .canvas-container {
            flex: 1;
            position: relative;
            cursor: grab;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.2) 0%, transparent 70%);
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 1rem;
            border-radius: var(--radius-card);
            width: 260px;
            opacity: 0;
            transition: opacity 0.2s;
            transform: translate(15px, -50%);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .tooltip.visible { opacity: 1; }

        .tt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .tt-title { font-size: 1.1rem; font-weight: 700; }
        .tt-type { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); }
        
        .tt-desc { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; margin-bottom: 0.75rem; }
        .tt-stat { font-size: 0.85rem; color: var(--accent-gold); font-weight: 600; }

        /* Critique #3: Footer Buttons */
        .footer-bar {
            height: 80px;
            background: rgba(2, 6, 23, 0.9);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        .btn {
            height: 44px; /* Identical Height */
            padding: 0 2rem;
            border-radius: var(--radius-card); /* 8px */
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
        }

        .btn-reset:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
        }

        .btn-save {
            background: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            color: #0f172a; /* Dark text for contrast */
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        .btn-save:hover {
            background: #fcd34d;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(251, 191, 36, 0.4);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="avatar-section">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <!-- Simple Shield/Archer Icon -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="stat-block">
            <div class="label-row">
                <span>Experience</span>
                <span>65,400 / 100,000</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="stat-block">
            <div class="points-container">
                <span class="label-row" style="margin:0">Available Points</span>
                <span class="points-value" id="points-display">12</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage">
        <!-- Critique #1: Header Bar -->
        <header class="header-bar">
            <div class="header-left">
                <h1 class="char-name">Kaelen</h1>
                <span class="char-class">Archer</span>
            </div>
            <div class="level-badge">
                LVL <span>42</span>
            </div>
        </header>

        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
            
            <!-- Tooltip -->
            <div class="tooltip" id="tooltip">
                <div class="tt-header">
                    <span class="tt-title" id="tt-title">Node Name</span>
                    <span class="tt-type" id="tt-type">Passive</span>
                </div>
                <div class="tt-desc" id="tt-desc">Description goes here.</div>
                <div class="tt-stat" id="tt-stat">+10% Damage</div>
            </div>
        </div>

        <!-- Critique #3: Footer -->
        <footer class="footer-bar">
            <button class="btn btn-reset" onclick="resetTree()">Reset Build</button>
            <button class="btn btn-save" onclick="alert('Build Saved!')">Save Build</button>
        </footer>
    </main>

    <script>
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        let dragStartX, dragStartY;
        let availablePoints = 12;
        let hoveredNode = null;
        let time = 0;

        // --- Data ---
        // Adjusted for better vertical spacing to prevent cropping
        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "Unlocks all magic paths.", stat: "+5% Mana Regen", unlocked: true, color: "#fbbf24" },
            
            // Left: Fire
            { id: 1, x: -240, y: -160, name: "Fire Affinity", type: "Passive", desc: "Increases fire damage.", stat: "+10% Fire Dmg", unlocked: false, color: "#f97316", parents: [0] },
            { id: 2, x: -240, y: -340, name: "Combustion", type: "Active", desc: "Spells ignite targets.", stat: "Ignite Chance +2%", unlocked: false, color: "#f97316", parents: [1] },
            { id: 3, x: -420, y: -480, name: "Inferno", type: "Ultimate", desc: "Creates a zone of fire.", stat: "Area Damage", unlocked: false, color: "#f97316", parents: [2] },
            { id: 4, x: -60, y: -340, name: "Fireball Mstr", type: "Passive", desc: "Fireballs travel faster.", stat: "+20% Speed", unlocked: false, color: "#f97316", parents: [1] },

            // Right: Ice
            { id: 5, x: 240, y: -160, name: "Frost Touch", type: "Passive", desc: "Attacks slow enemies.", stat: "Slow 10%", unlocked: false, color: "#38bdf8", parents: [0] },
            { id: 6, x: 240, y: -340, name: "Deep Freeze", type: "Passive", desc: "Slows stack up to 50%.", stat: "Max Slow 50%", unlocked: false, color: "#38bdf8", parents: [5] },
            { id: 7, x: 420, y: -480, name: "Glacial Storm", type: "Ultimate", desc: "Blizzard effect.", stat: "Heavy Damage", unlocked: false, color: "#38bdf8", parents: [6] },
            { id: 8, x: 60, y: -340, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+15% Shield", unlocked: false, color: "#38bdf8", parents: [5] },

            // Center: Arcane
            { id: 9, x: 0, y: -200, name: "Arcane Intellect", type: "Passive", desc: "Boosts intelligence.", stat: "+5 Int", unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: -400, name: "Mana Siphon", type: "Active", desc: "Heal mana on kill.", stat: "Lifesteal Mana", unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: -600, name: "Archmage", type: "Trait", desc: "Ultimate power.", stat: "+10% All Stats", unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom: Defense
            { id: 12, x: 0, y: 200, name: "Mental Fortitude", type: "Defense", desc: "Reduces magic damage.", stat: "-10% Dmg Taken", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -180, y: 380, name: "Shield Wall", type: "Defense", desc: "Increases max mana.", stat: "+200 Mana", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 180, y: 380, name: "Evasion", type: "Defense", desc: "Chance to dodge magic.", stat: "+5% Dodge", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(dpr, dpr);
            
            // Center the tree
            if (offsetX === 0) {
                offsetX = width / 2;
                offsetY = height / 2 + 100; // Shift up slightly to show bottom
            }
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });

            requestAnimationFrame(draw);
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isPathAvailable = parent.unlocked && !child.unlocked; // Can be unlocked next
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            // Critique #4: Line styles
            if (isPathUnlocked) {
                // Solid, substantial line
                ctx.lineWidth = 3 * scale;
                const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, child.color);
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 10;
                ctx.shadowColor = child.color;
                ctx.setLineDash([]); // Solid
            } else if (isPathAvailable) {
                // Dashed line for next steps
                ctx.lineWidth = 1.5 * scale;
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([5 * scale, 5 * scale]);
            } else {
                // Faint dashed line for locked
                ctx.lineWidth = 1 * scale;
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([2 * scale, 8 * scale]);
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.setLineDash([]);
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            // Critique #4: Unify node size (all 24px radius)
            const radius = 24 * scale; 
            
            // Glow
            if (node.unlocked) {
                const pulse = Math.sin(time * 0.005 + node.id) * 5 + 15;
                ctx.shadowBlur = pulse;
                ctx.shadowColor = node.color;
            } else {
                ctx.shadowBlur = 0;
            }

            // Main Circle
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            
            if (node.unlocked) {
                ctx.fillStyle = '#0f172a'; 
                ctx.fill();
                ctx.lineWidth = 3 * scale;
                ctx.strokeStyle = node.color;
                ctx.stroke();
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.lineWidth = 1 * scale;
                ctx.strokeStyle = '#334155';
                ctx.stroke();
            }

            // Inner Icon
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            const sigilColor = node.unlocked ? node.color : '#475569';
            ctx.fillStyle = sigilColor;
            ctx.shadowBlur = node.unlocked ? 5 : 0;
            ctx.shadowColor = sigilColor;

            ctx.beginPath();
            // Simple geometric icons
            if (node.color.includes('f97316')) { 
                // Fire: Triangle
                ctx.moveTo(0, -radius*0.6);
                ctx.lineTo(radius*0.5, radius*0.4);
                ctx.lineTo(-radius*0.5, radius*0.4);
            } else if (node.color.includes('38bdf8')) {
                // Ice: Diamond
                ctx.moveTo(0, -radius*0.6);
                ctx.lineTo(radius*0.4, 0);
                ctx.lineTo(0, radius*0.6);
                ctx.lineTo(-radius*0.4, 0);
            } else if (node.color.includes('a855f7')) {
                // Arcane: Hexagon
                for (let i = 0; i < 6; i++) {
                    ctx.lineTo(radius*0.5 * Math.cos(i * Math.PI / 3), radius*0.5 * Math.sin(i * Math.PI / 3));
                }
            } else if (node.color.includes('fbbf24')) {
                // Root: Circle
                ctx.arc(0, 0, radius*0.4, 0, Math.PI*2);
            } else {
                // Defense: Square
                ctx.rect(-radius*0.4, -radius*0.4, radius*0.8, radius*0.8);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Hover Ring
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Text
            ctx.fillStyle = node.unlocked ? '#ffffff' : '#64748b';
            ctx.font = `600 ${12 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + (8 * scale));
            ctx.shadowBlur = 0;
        }

        // --- Interaction ---
        function updateTooltip(node, mouseX, mouseY) {
            document.getElementById('tt-title').textContent = node.name;
            document.getElementById('tt-type').textContent = node.type;
            document.getElementById('tt-desc').textContent = node.desc;
            document.getElementById('tt-stat').textContent = node.stat;
            
            const ttType = document.getElementById('tt-type');
            ttType.style.color = node.color;
            ttType.style.background = `${node.color}22`;
            
            let left = mouseX + 20;
            let top = mouseY - 60;
            
            if (left + 260 > width) left = mouseX - 280;
            if (top < 10) top = 10;
            if (top + 150 > height) top = height - 160;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                if (Math.sqrt(dx*dx + dy*dy) < 28 * scale) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                        }
                    }
                    return;
                }
            }
        }

        // --- Listeners ---
        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                offsetX += (mouseX - lastMouseX);
                offsetY += (mouseY - lastMouseY);
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                return;
            }

            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                if (Math.sqrt(dx*dx + dy*dy) < 32 * scale) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'grab';
                if (hoveredNode) {
                    hoveredNode = null;
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            dragStartX = lastMouseX;
            dragStartY = lastMouseY;
            isDragging = true;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });
        
        canvas.addEventListener('click', (e) => {
             const rect = canvas.getBoundingClientRect();
             const mouseX = e.clientX - rect.left;
             const mouseY = e.clientY - rect.top;
             const dist = Math.sqrt(Math.pow(mouseX - dragStartX, 2) + Math.pow(mouseY - dragStartY, 2));
             if (dist < 5) checkClick(mouseX, mouseY);
        });

        window.resetTree = function() {
            nodes.forEach(n => { if (n.id !== 0) n.unlocked = false; });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
        };

        function animate() {
            time++;
            requestAnimationFrame(animate);
        }

        resize();
        animate();

    </script>
</body>
</html>
