<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcanist Skill Matrix</title>
    <style>
        :root {
            /* Palette - Muted, Premium RPG tones */
            --bg-dark: #050505;
            --bg-panel: rgba(12, 12, 14, 0.85);
            --bg-card: rgba(20, 20, 25, 0.6);
            
            /* Accents - Desaturated Gold */
            --accent-gold: #d4af37;
            --accent-gold-dim: #8a701e;
            --accent-gold-glow: rgba(212, 175, 55, 0.3);
            
            /* Magic Colors */
            --accent-fire: #e65c19;
            --accent-ice: #4db5e8;
            --accent-arcane: #b57edc;
            --accent-defense: #7a8b99;

            /* Text */
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            
            /* Borders */
            --border-light: rgba(255, 255, 255, 0.06);
            --border-gold: rgba(212, 175, 55, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            color: var(--text-main);
            background-color: var(--bg-dark);
            /* Critique #4: Texture & Gradient */
            background-image: 
                radial-gradient(circle at 50% 40%, #1a1c24 0%, #050505 100%);
            display: flex;
        }

        /* Noise Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.6;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px;
            height: 100%;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-light);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 20;
            flex-shrink: 0;
            box-shadow: 5px 0 20px rgba(0,0,0,0.3);
        }

        /* Critique #3: Identity Block */
        .identity-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 1.5rem;
        }

        .avatar-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold-dim);
            padding: 3px;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, #1e2026, #0f1115);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Stylized Mage Icon */
        .avatar-inner svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-arcane);
            filter: drop-shadow(0 0 5px var(--accent-arcane));
        }

        .char-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            font-family: "Georgia", serif; /* Serif for fantasy feel */
        }

        .char-class {
            font-size: 0.85rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .level-badge-inline {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            border: 1px solid var(--border-light);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* --- Stat Blocks --- */
        .stat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stat-block {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 1rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .progress-track {
            height: 8px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
            box-shadow: 0 0 10px var(--accent-gold-glow);
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 20px 100%;
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            from { background-position: -20px 0; }
            to { background-position: 40px 0; }
        }

        /* Critique #3: Points Indicator */
        .points-indicator {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--accent-gold-dim);
            padding: 0.75rem 1rem;
            border-radius: 4px;
        }

        .points-label {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .points-value {
            font-size: 1.2rem; /* Reduced size */
            font-weight: 700;
            color: var(--accent-gold);
            font-family: "Georgia", serif;
        }

        /* --- Main Stage --- */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .header-bar {
            height: 60px;
            background: rgba(5, 5, 5, 0.4);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .page-title {
            font-family: "Georgia", serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* Canvas Area */
        .canvas-container {
            flex: 1;
            position: relative;
            cursor: grab;
            background: radial-gradient(circle at center, rgba(30,30,35,0.5) 0%, rgba(0,0,0,0.8) 100%);
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(10, 10, 12, 0.95);
            border: 1px solid var(--accent-gold-dim);
            padding: 1rem;
            border-radius: 4px;
            width: 260px;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            transform: translate(15px, -50%);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
        }

        .tooltip.visible { opacity: 1; }

        .tt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .tt-title { 
            font-size: 1rem; 
            font-weight: 700; 
            color: var(--text-main);
            font-family: "Georgia", serif;
        }
        
        .tt-type { 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            font-weight: 700; 
            padding: 2px 6px; 
            border-radius: 2px; 
            background: rgba(255,255,255,0.05); 
            color: var(--text-muted); 
            letter-spacing: 0.05em;
        }
        
        .tt-desc { 
            font-size: 0.8rem; 
            color: #cbd5e1; 
            line-height: 1.4; 
            margin-bottom: 0.75rem; 
        }
        
        .tt-stat { 
            font-size: 0.75rem; 
            color: var(--accent-gold); 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Footer */
        .footer-bar {
            height: 70px;
            background: rgba(5, 5, 5, 0.6);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 2rem;
            gap: 1rem;
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        .btn {
            height: 40px;
            padding: 0 1.5rem;
            border-radius: 2px;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .btn-reset:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text-main);
            background: rgba(255,255,255,0.03);
        }

        .btn-save {
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            position: relative;
            overflow: hidden;
        }

        .btn-save:hover {
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.1));
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="identity-block">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <!-- Mage Icon -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"/>
                    </svg>
                </div>
            </div>
            <div class="char-name">Kaelen</div>
            <div class="char-class">Arcanist</div> <!-- Changed from Ranger -->
            <div class="level-badge-inline">LVL 42</div>
        </div>

        <div class="stat-section">
            <div class="stat-block">
                <div class="label-row">
                    <span>Experience</span>

    <!-- Main Content -->
    <main class="main-stage">
        <header class="header-bar">
            <div class="page-title">Arcane Discipline</div>
        </header>

        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
            
            <!-- Tooltip -->
            <div class="tooltip" id="tooltip">
                <div class="tt-header">
                    <span class="tt-title" id="tt-title">Node Name</span>
                    <span class="tt-type" id="tt-type">Passive</span>
                </div>
                <div class="tt-desc" id="tt-desc">Description goes here.</div>
                <div class="tt-stat" id="tt-stat">+10% Damage</div>
            </div>
        </div>

        <footer class="footer-bar">
            <button class="btn btn-reset" onclick="resetTree()">Reset Build</button>
            <button class="btn btn-save" onclick="alert('Build Saved!')">Save Build</button>
        </footer>
    </main>

    <script>
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        let dragStartX, dragStartY;
        let availablePoints = 12;
        let hoveredNode = null;
        let time = 0;

        // --- Data: 30 Nodes, Dense, 3-Path Structure ---
        // Root is at y=0. Up is negative y.
        const nodes = [
            // ROOT
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "The source of all magical power.", stat: "Unlocks Paths", unlocked: true, color: "#d4af37" },

            // TIER 1 (Branches)
            { id: 1, x: -250, y: -200, name: "Fire Affinity", type: "Branch", desc: "Channel the heat of the sun.", stat: "+10% Fire Dmg", unlocked: false, color: "#e65c19", parents: [0] },
            { id: 2, x: 250, y: -200, name: "Frost Touch", type: "Branch", desc: "Command the frozen void.", stat: "Slow 10%", unlocked: false, color: "#4db5e8", parents: [0] },
            { id: 3, x: 0, y: -250, name: "Arcane Intellect", type: "Branch", desc: "Expand your mental capacity.", stat: "+5 Int", unlocked: false, color: "#b57edc", parents: [0] },
            { id: 19, x: 0, y: 200, name: "Mental Fortitude", type: "Branch", desc: "Harden your mind against pain.", stat: "-10% Dmg Taken", unlocked: false, color: "#7a8b99", parents: [0] },

            // TIER 2
            // Fire
            { id: 4, x: -380, y: -400, name: "Combustion", type: "Passive", desc: "Spells ignite targets on hit.", stat: "Ignite Chance +2%", unlocked: false, color: "#e65c19", parents: [1] },
            { id: 5, x: -120, y: -400, name: "Fireball Mastery", type: "Passive", desc: "Projectiles move faster.", stat: "+20% Speed", unlocked: false, color: "#e65c19", parents: [1] },
            // Ice
            { id: 6, x: 120, y: -400, name: "Ice Armor", type: "Defense", desc: "Freeze mana on impact.", stat: "+15% Shield", unlocked: false, color: "#4db5e8", parents: [2] },
            { id: 7, x: 380, y: -400, name: "Deep Freeze", type: "Passive", desc: "Cold lingers on enemies.", stat: "Max Slow 50%", unlocked: false, color: "#4db5e8", parents: [2] },
            // Arcane
            { id: 8, x: -150, y: -450, name: "Mana Siphon", type: "Active", desc: "Drain mana from enemies.", stat: "Lifesteal Mana", unlocked: false, color: "#b57edc", parents: [3] },
            { id: 9, x: 150, y: -450, name: "Void Sight", type: "Passive", desc: "See through shadows.", stat: "True Sight", unlocked: false, color: "#b57edc", parents: [3] },
            // Defense
            { id: 20, x: -200, y: 400, name: "Iron Skin", type: "Passive", desc: "Reinforce physical form.", stat: "+20 Armor", unlocked: false, color: "#7a8b99", parents: [19] },
            { id: 21, x: 200, y: 400, name: "Evasion", type: "Passive", desc: "Dodge incoming attacks.", stat: "+5% Dodge", unlocked: false, color: "#7a8b99", parents: [19] },

            // TIER 3
            // Fire
            { id: 10, x: -500, y: -600, name: "Inferno", type: "Ult", desc: "Create a zone of fire.", stat: "Area Damage", unlocked: false, color: "#e65c19", parents: [4] },
            { id: 11, x: -260, y: -600, name: "Scorch", type: "Passive", desc: "Burns last longer.", stat: "+2s Duration", unlocked: false, color: "#e65c19", parents: [4] },
            { id: 12, x: -120, y: -600, name: "Pyro Blast", type: "Active", desc: "High damage nuke.", stat: "High Burst", unlocked: false, color: "#e65c19", parents: [5] },
            // Ice
            { id: 13, x: 120, y: -600, name: "Shatter", type: "Passive", desc: "Bonus damage to frozen.", stat: "+25% Dmg", unlocked: false, color: "#4db5e8", parents: [6] },
            { id: 14, x: 260, y: -600, name: "Glacial Storm", type: "Ult", desc: "Summon a blizzard.", stat: "Heavy Damage", unlocked: false, color: "#4db5e8", parents: [7] },
            { id: 15, x: 500, y: -600, name: "Winter's Grasp", type: "CC", desc: "Freeze targets solid.", stat: "Stun 2s", unlocked: false, color: "#4db5e8", parents: [7] },
            // Arcane
            { id: 16, x: 0, y: -700, name: "Archmage", type: "Trait", desc: "Ultimate arcane power.", stat: "+10% All Stats", unlocked: false, color: "#b57edc", parents: [8, 9] },
            { id: 17, x: -150, y: -700, name: "Teleport", type: "Active", desc: "Blink short distance.", stat: "Cooldown 10s", unlocked: false, color: "#b57edc", parents: [8] },
            { id: 18, x: 150, y: -700, name: "Polymorph", type: "CC", desc: "Turn enemy into sheep.", stat: "Root 5s", unlocked: false, color: "#b57edc", parents: [9] },
            // Defense
            { id: 22, x: 0, y: 400, name: "Regeneration", type: "Passive", desc: "Heal over time.", stat: "+5 HP/s", unlocked: false, color: "#7a8b99", parents: [19] },

            // TIER 4 (Leaves)
            { id: 23, x: -350, y: 600, name: "Shield Wall", type: "Ult", desc: "Absorb massive damage.", stat: "Block 50%", unlocked: false, color: "#7a8b99", parents: [20] },
            { id: 24, x: -100, y: 600, name: "Taunt", type: "Active", desc: "Force enemy attack.", stat: "Aggro Gen", unlocked: false, color: "#7a8b99", parents: [20] },
            { id: 25, x: 100, y: 600, name: "Ghosting", type: "Passive", desc: "Immune to CC.", stat: "1s per 10s", unlocked: false, color: "#7a8b99", parents: [21] },
            { id: 26, x: 350, y: 600, name: "Phase Shift", type: "Active", desc: "Dodge next attack.", stat: "Perfect Dodge", unlocked: false, color: "#7a8b99", parents: [21] },
            { id: 27, x: 0, y: 600, name: "Vitality", type: "Passive", desc: "Max HP boost.", stat: "+500 HP", unlocked: false, color: "#7a8b99", parents: [22] },

            // TIER 5 (Final)
            { id: 28, x: 0, y: 800, name: "Immortality", type: "Ult", desc: "Second chance at life.", stat: "1 HP Shield", unlocked: false, color: "#ef4444", parents: [23, 25, 27] },
        ];

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(dpr, dpr);
            
            // Center the tree initially
            if (offsetX === 0) {
                offsetX = width / 2;
                offsetY = height / 2 + 100; 
            }
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });

            requestAnimationFrame(draw);
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isPathAvailable = parent.unlocked && !child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            // Smooth bezier curve
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            if (isPathUnlocked) {
                // Dark Track
                ctx.lineWidth = 4 * scale;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();
                
                // Glowing Overlay
                ctx.lineWidth = 2 * scale; // Critique #3: Stroke weight 2px
                const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, child.color);
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 10;
                ctx.shadowColor = child.color;
                ctx.stroke();
            } else if (isPathAvailable) {
                // Potential Path
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else {
                // Locked Path
                ctx.lineWidth = 1 * scale;
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([4 * scale, 8 * scale]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.shadowBlur = 0;
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            const radius = 24 * scale; // Critique #3: Increased size
            
            ctx.save();
            ctx.translate(pos.x, pos.y);

            // Glow
            if (node.unlocked) {
                const pulse = Math.sin(time * 0.005 + node.id) * 4 + 12;
                ctx.shadowBlur = pulse;
                ctx.shadowColor = node.color;
            }

            // Hexagon Shape
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            // Fill & Stroke
            ctx.fillStyle = node.unlocked ? '#0f172a' : '#050505';
            ctx.fill();
            
            ctx.lineWidth = node.unlocked ? 3 * scale : 1 * scale;
            ctx.strokeStyle = node.unlocked ? node.color : '#334155';
            ctx.stroke();

            // Inner Icon
            ctx.beginPath();
            ctx.fillStyle = node.unlocked ? node.color : '#475569';
            
            const s = radius * 0.45; 
            // Simple shapes based on color
            if (node.color.includes('e65c19')) { // Fire: Triangle
                ctx.moveTo(0, -s);
                ctx.lineTo(s, s);
                ctx.lineTo(-s, s);
            } else if (node.color.includes('4db5e8')) { // Ice: Diamond
                ctx.moveTo(0, -s);
                ctx.lineTo(s, 0);
                ctx.lineTo(0, s);
                ctx.lineTo(-s, 0);
            } else if (node.color.includes('b57edc')) { // Arcane: Hex
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    ctx.lineTo(s * Math.cos(angle), s * Math.sin(angle));
                }
            } else if (node.color.includes('d4af37')) { // Root: Circle
                ctx.arc(0, 0, s * 0.8, 0, Math.PI*2);
            } else { // Defense: Square
                ctx.rect(-s*0.7, -s*0.7, s*1.4, s*1.4);
            }
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Hover Ring
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 10, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Text Label
            // Critique #4: Display Typeface
            ctx.fillStyle = node.unlocked ? '#ffffff' : '#888888'; // Critique #5: Lighter grey
            ctx.font = `700 ${12 * scale}px "Georgia", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            // Shadow for readability
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 6;
            ctx.fillText(node.name, pos.x, pos.y + radius + (12 * scale));
            ctx.shadowBlur = 0;
        }

        // --- Interaction ---
        function updateTooltip(node, mouseX, mouseY) {
            document.getElementById('tt-title').textContent = node.name;
            document.getElementById('tt-type').textContent = node.type;
            document.getElementById('tt-desc').textContent = node.desc;
            document.getElementById('tt-stat').textContent = node.stat;
            
            const ttType = document.getElementById('tt-type');
            ttType.style.color = node.color;
            ttType.style.background = `${node.color}22`;
            
            let left = mouseX + 20;
            let top = mouseY - 60;
            
            if (left + 280 > width) left = mouseX - 280;
            if (top < 10) top = 10;
            if (top + 150 > height) top = height - 160;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                if (Math.sqrt(dx*dx + dy*dy) < 30 * scale) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                        }
                    }
                    return;
                }
            }
        }

        // --- Listeners ---
        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                offsetX += (mouseX - lastMouseX);
                offsetY += (mouseY - lastMouseY);
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                return;
            }

            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                if (Math.sqrt(dx*dx + dy*dy) < 32 * scale) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'grab';
                if (hoveredNode) {
                    hoveredNode = null;
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            dragStartX = lastMouseX;
            dragStartY = lastMouseY;
            isDragging = true;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });
        
        canvas.addEventListener('click', (e) => {
             const rect = canvas.getBoundingClientRect();
             const mouseX = e.clientX - rect.left;
             const mouseY = e.clientY - rect.top;
             const dist = Math.sqrt(Math.pow(mouseX - dragStartX, 2) + Math.pow(mouseY - dragStartY, 2));
             if (dist < 5) checkClick(mouseX, mouseY);
        });

        window.resetTree = function() {
            nodes.forEach(n => { if (n.id !== 0) n.unlocked = false; });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
        };

        function animate() {
            time++;
            requestAnimationFrame(animate);
        }

        resize();
        animate();

    </script>
</body>
</html>
