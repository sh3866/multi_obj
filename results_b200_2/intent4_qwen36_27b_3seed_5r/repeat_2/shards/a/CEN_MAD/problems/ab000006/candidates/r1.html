<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    DESIGN CRITIQUE FIX #1 & #4: 
    Using a robust system pixel font stack since CDNs are offline.
    This ensures the "Press Start 2P" look without external requests.
  */
  :root {
    --bg-dark: #050505;
    --bezel-outer: #2a2a2a;
    --bezel-inner: #111111;
    --screen-curve: rgba(0, 0, 0, 0.4);
    --color-title: #ffffff;
    --color-btn-face: #d04040;
    --color-btn-light: #ff8080;
    --color-btn-dark: #800000;
    --color-btn-shadow: #300000;
    --color-text-dim: #8899aa;
    --pixel-size: 4px; /* Base unit for crisp rendering */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    /* Fix #4: Pixel Font Stack */
    font-family: "Courier New", Courier, "Lucida Sans Typewriter", "Lucida Console", monospace;
    font-weight: bold;
    user-select: none;
    -webkit-font-smoothing: none;
  }

  /* 
    DESIGN CRITIQUE FIX #5: 
    Heavy dark bezel to simulate a physical monitor.
  */
  #monitor {
    position: relative;
    width: 680px;
    height: 520px;
    background: var(--bezel-outer);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 
      inset 0 0 20px #000,
      0 0 0 2px #444,
      0 20px 50px rgba(0,0,0,0.8);
  }

  #screen-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 60px / 20px; /* Slight CRT curvature */
    overflow: hidden;
    box-shadow: inset 0 0 80px var(--screen-curve);
    border: 2px solid #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* CRT Scanlines & Vignette */
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: 
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.1) 0px,
        rgba(0,0,0,0.1) 1px,
        transparent 2px,
        transparent 4px
      ),
      radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    z-index: 10;
  }

  /* UI Layer */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    padding-top: 40px; /* Push down slightly */
  }

  /* 
    DESIGN CRITIQUE FIX #1: 
    Typography Overhaul. Blocky, stepped text shadow.
  */
  #title {
    font-size: 48px;
    color: var(--color-title);
    text-transform: uppercase;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 8px;
    position: relative;
    /* Hard stepped pixel shadow */
    text-shadow: 
      4px 4px 0px #2a4a8a,
      -2px -2px 0px #5a8adf;
  }

  #subtitle {
    font-size: 14px;
    color: #aaccff;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-shadow: 2px 2px 0 #000;
  }

  /* 
    DESIGN CRITIQUE FIX #2: 
    Button Redesign. No gradients, solid colors, pixel borders.
  */
  #start-btn {
    position: relative;
    width: 200px;
    height: 60px;
    background-color: var(--color-btn-face);
    border: none;
    cursor: pointer;
    outline: none;
    font-family: inherit;
    font-size: 24px;
    font-weight: 900;
    color: white;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    
    /* Pixel Art Border Construction */
    box-shadow:
      inset 4px 4px 0px var(--color-btn-light), /* Top/Left Highlight */
      inset -4px -4px 0px var(--color-btn-dark), /* Bottom/Right Shadow */
      4px 4px 0px #000; /* Drop Shadow */
    margin-bottom: 30px;
    transition: transform 0.05s;
  }

  #start-btn:hover {
    background-color: #e05050;
    transform: translateY(-2px);
  }

  #start-btn:active {
    transform: translateY(2px);
    box-shadow:
      inset 4px 4px 0px var(--color-btn-dark),
      inset -4px -4px 0px var(--color-btn-light),
      1px 1px 0px #000;
  }

  /* 
    DESIGN CRITIQUE FIX #4: 
    Instructions & HUD overhaul.
  */
  #instructions {
    font-size: 12px;
    color: #fff;
    text-align: center;
    line-height: 1.6;
    text-shadow: 2px 2px 0 #000;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border: 2px solid #fff;
  }

  .key {
    color: #ffff00;
    padding: 0 2px;
  }

  #hud {
    position: absolute;
    top: 20px;
    right: 30px;
    text-align: right;
    /* Fix #4: Demote secondary info */
    opacity: 0.4; 
    font-size: 14px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
  }

  #hud span {
    display: block;
    margin-bottom: 4px;
  }

</style>
</head>
<body>

<div id="monitor">
  <div id="screen-container">
    <canvas id="scene" width="320" height="240"></canvas>
    <div id="overlay"></div>
    
    <div id="ui-layer">
      <div id="title">SKIFREE</div>
      <div id="subtitle">THE LONG RUN</div>
      
      <button id="start-btn">START</button>
      
      <div id="instructions">
        <span class="key">←</span> <span class="key">→</span> TO STEER<br>
        AVOID TREES. SURVIVE.
      </div>
    </div>

    <div id="hud">
      <span>SCORE: 00000</span>
      <span>SPEED: 0 MPH</span>
    </div>
  </div>
</div>

<script>
/**
 * Retro SkiFree Engine
 * Optimized for offline, no-asset rendering.
 */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

// Disable smoothing for crisp pixels
ctx.imageSmoothingEnabled = false;

const W = 320;
const H = 240;

// Palette
const C = {
  skyTop: '#3050a0',
  skyBot: '#a0c0ff',
  snow: '#e0e8f0',
  snowShadow: '#b0c0d8',
  treeDark: '#005000',
  treeLight: '#007000',
  trunk: '#402010',
  skierJacket: '#d03030',
  skierPants: '#204080',
  skierSkin: '#f0c0a0',
  skierHair: '#402000',
  skierGoggle: '#202020',
  skierGoggleGlass: '#6080c0',
  uiHighlight: '#ffffff',
  uiShadow: '#000000'
};

// State
let frame = 0;
let snowParticles = [];
let trees = [];
let skier = { x: 160, y: 190, dir: 1, bob: 0 };

// Init Objects
function init() {
  // Generate Snow Particles
  for(let i=0; i<50; i++) {
    snowParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() > 0.8 ? 2 : 1,
      speed: 0.5 + Math.random()
    });
  }

  // Generate Trees (Fixed positions for consistency, but varied size)
  // We'll regenerate them procedurally to fill screen
  for(let i=0; i<25; i++) {
    trees.push({
      x: Math.random() * (W - 20) + 10,
      y: Math.random() * (H - 100) + 80, // Keep below sky line
      h: 15 + Math.random() * 10,
      w: 10 + Math.random() * 6,
      shade: Math.random() > 0.5 ? C.treeLight : C.treeDark
    });
  }
  // Sort trees by Y for depth
  trees.sort((a,b) => a.y - b.y);
}

// --- Drawing Helpers ---

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawPixelText(text, x, y, size, color, align='left') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillText(text, Math.floor(x), Math.floor(y));
}

// --- Scene Renderers ---

function drawSky() {
  // Linear gradient for sky
  const grad = ctx.createLinearGradient(0, 0, 0, 100);
  grad.addColorStop(0, C.skyTop);
  grad.addColorStop(1, C.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 100);
}

function drawSnowfield() {
  // Base snow
  ctx.fillStyle = C.snow;
  ctx.fillRect(0, 80, W, H - 80);
  
  // Fix #5: Visual Chaos / Wind Streaks
  // Draw some random horizontal streaks to simulate wind/speed
  ctx.fillStyle = C.snowShadow;
  for(let i=0; i<20; i++) {
    const sx = (frame * 2 + i * 40) % (W + 40) - 20;
    const sy = 90 + i * 5 + Math.sin(i)*10;
    const sw = 10 + Math.sin(i*0.5)*5;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(sx, sy, sw, 1);
  }
  ctx.globalAlpha = 1.0;
}

function drawTree(t) {
  const x = Math.floor(t.x);
  const y = Math.floor(t.y);
  const w = Math.floor(t.w);
  const h = Math.floor(t.h);
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(x - w/2 + 4, y + 2, w, 4);

  // Trunk
  drawPixelRect(x - 1, y, 2, 4, C.trunk);

  // Leaves (Triangle approximation)
  // Row 1 (Top)
  drawPixelRect(x - 2, y - 6, 4, 3, t.shade);
  // Row 2
  drawPixelRect(x - 4, y - 3, 8, 3, t.shade);
  // Row 3 (Bottom)
  drawPixelRect(x - 6, y, 12, 3, t.shade);
  
  // Snow on top
  drawPixelRect(x - 2, y - 7, 4, 2, C.snow);
}

function drawSkier(sx, sy, dir) {
  const x = Math.floor(sx);
  const y = Math.floor(sy);
  
  // Bobbing animation
  const bobY = Math.floor(Math.sin(frame * 0.2) * 1.5);
  const finalY = y + bobY;

  ctx.save();
  ctx.translate(x, finalY);
  ctx.scale(dir, 1); // Flip for direction

  // Skis
  drawPixelRect(-8, 8, 8, 2, '#303030'); // Left ski
  drawPixelRect(1, 8, 8, 2, '#303030');  // Right ski
  drawPixelRect(-8, 8, 8, 1, '#a0a0a0'); // Left highlight
  drawPixelRect(1, 8, 8, 1, '#a0a0a0');  // Right highlight

  // Legs
  drawPixelRect(-4, 5, 2, 4, C.skierPants);
  drawPixelRect(2, 5, 2, 4, C.skierPants);

  // Body
  drawPixelRect(-4, -2, 8, 8, C.skierJacket);
  drawPixelRect(-4, -2, 2, 8, '#b02020'); // Shadow side
  drawPixelRect(2, -2, 2, 8, '#f04040');  // Highlight side

  // Head
  drawPixelRect(-3, -7, 6, 5, C.skierSkin);
  
  // Hair/Hat
  drawPixelRect(-3, -8, 6, 2, C.skierHair);
  drawPixelRect(-4, -7, 1, 3, C.skierHair); // Back hair

  // Goggles
  drawPixelRect(0, -6, 4, 2, C.skierGoggle);
  drawPixelRect(1, -6, 2, 1, C.skierGoggleGlass); // Glass reflection

  // Poles (Simple lines)
  ctx.strokeStyle = '#808080';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-5, 0); ctx.lineTo(-8, 10); // Left pole
  ctx.moveTo(5, 0); ctx.lineTo(8, 10);   // Right pole
  ctx.stroke();

  ctx.restore();
}

function drawSnowParticles() {
  ctx.fillStyle = '#ffffff';
  snowParticles.forEach(p => {
    p.y += p.speed;
    p.x -= 0.5; // Wind blowing left
    
    if (p.y > H) p.y = 0;
    if (p.x < 0) p.x = W;
    
    ctx.globalAlpha = 0.6;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s);
  });
  ctx.globalAlpha = 1.0;
}

// --- Main Loop ---

function loop() {
  frame++;
  
  // Clear
  ctx.clearRect(0, 0, W, H);

  // Draw Layers
  drawSky();
  drawSnowfield();
  
  // Draw Trees
  trees.forEach(t => drawTree(t));

  // Draw Skier (Fix #3: Increased scale is handled by canvas scaling via CSS, 
  // but we draw him prominent here. The sprite is roughly 12x16 pixels)
  drawSkier(skier.x, skier.y, skier.dir);

  // Overlay Effects
  drawSnowParticles();

  requestAnimationFrame(loop);
}

// --- Interaction ---

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft') {
    skier.x = Math.max(20, skier.x - 2);
    skier.dir = -1;
  }
  if(e.key === 'ArrowRight') {
    skier.x = Math.min(W-20, skier.x + 2);
    skier.dir = 1;
  }
});

document.getElementById('start-btn').addEventListener('click', () => {
  // Simple animation to simulate starting
  const btn = document.getElementById('start-btn');
  const ui = document.getElementById('ui-layer');
  
  // Flash effect
  ctx.fillStyle = 'white';
  ctx.fillRect(0,0,W,H);
  
  setTimeout(() => {
    // Fade out UI text slightly to focus on game
    ui.style.opacity = '0.3';
    ui.style.pointerEvents = 'none';
    
    // Accelerate skier down
    let speed = 0;
    const interval = setInterval(() => {
      speed += 0.2;
      skier.y += speed;
      
      // Wrap around for infinite loop effect
      if(skier.y > H) {
        skier.y = 80;
        // Reshuffle trees for variety
        trees.sort(() => Math.random() - 0.5);
      }
    }, 16);
  }, 100);
});

// Start
init();
loop();

</script>
</body>
</html>
