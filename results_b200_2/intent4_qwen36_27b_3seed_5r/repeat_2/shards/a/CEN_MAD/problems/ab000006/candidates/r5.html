<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - The Long Run</title>
<style>
  :root {
    --bg-color: #1a1a1a;
    --bezel-color: #2b2b2b;
    --bezel-highlight: #3d3d3d;
    --bezel-shadow: #111111;
    --screen-glow: rgba(100, 200, 255, 0.1);
    
    /* 8-bit UI Palette */
    --ui-black: #000000;
    --ui-white: #ffffff;
    --ui-grey: #555555;
    --ui-dark-grey: #222222;
    --ui-blue: #0000aa;
    --ui-cyan: #00aaaa;
    --ui-red: #cc0000;
    --ui-red-light: #ff4444;
    --ui-red-dark: #880000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    user-select: none;
  }

  /* --- The Monitor Chassis --- */
  #monitor {
    position: relative;
    width: 720px;
    height: 540px;
    background: var(--bezel-color);
    border-radius: 12px;
    padding: 24px;
    /* Bevel effect */
    box-shadow: 
      inset 2px 2px 0 var(--bezel-highlight),
      inset -2px -2px 0 var(--bezel-shadow),
      0 30px 60px rgba(0,0,0,0.8);
    /* Critique 7: Pixel grid on bezel */
    background-image: 
      linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222),
      linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222);
    background-size: 4px 4px;
    background-position: 0 0, 2px 2px;
    border: 4px solid #000;
  }

  #screen-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    /* CRT Curvature */
    border-radius: 60px / 30px; 
    overflow: hidden;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.7);
    border: 6px solid #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* --- CRT Scanlines --- */
  #crt-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    background: 
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.2) 2px,
        rgba(0, 0, 0, 0.2) 4px
      );
    box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
  }

  /* --- UI Layer --- */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* Push content to bottom */
    align-items: center;
    padding-bottom: 40px;
    z-index: 20;
    pointer-events: none;
  }

  /* Critique 1: Typography Overhaul */
  h1.title {
    /* Fallback stack for pixel look, using Courier as base */
    font-family: 'Courier New', monospace; 
    font-weight: 900;
    font-size: 64px;
    line-height: 1;
    color: var(--ui-white);
    text-transform: uppercase;
    margin: 0 0 10px 0;
    letter-spacing: -2px;
    
    /* Critique 1: Hard, aliased drop shadow */
    text-shadow: 
      4px 4px 0px var(--ui-black),
      -2px -2px 0 var(--ui-black),
      2px -2px 0 var(--ui-black),
      -2px 2px 0 var(--ui-black);
      
    position: absolute;
    top: 20px; /* Move title to top */
    width: 100%;
    text-align: center;
    z-index: 2;
  }
  
  /* Critique 2: UI Panel Redesign - Hollow HUD */
  .hud-panel {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 280px;
    
    /* Pixel Border Effect */
    border: 4px solid var(--ui-white);
    background: rgba(0, 0, 0, 0.6); /* Semi-transparent dark overlay */
    padding: 16px;
    position: relative;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    
    animation: hudPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  @keyframes hudPop {
    to { opacity: 1; transform: translateY(0); }
  }

  /* HUD Corner Accents */
  .hud-panel::after {
    content: '';
    position: absolute;
    top: -4px; left: -4px; right: -4px; bottom: -4px;
    border: 2px solid var(--ui-grey);
    pointer-events: none;
  }

  #instructions-text {
    color: var(--ui-white);
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 16px;
    text-shadow: 1px 1px 0 #000;
    line-height: 1.5;
  }

  .key {
    display: inline-block;
    background: var(--ui-white);
    color: #000;
    padding: 2px 4px;
    margin: 0 2px;
    font-size: 12px;
    border: 2px solid #000;
    box-shadow: 2px 2px 0 #000;
  }

  /* Critique 3: Button Styling */
  .btn-pixel {
    background-color: var(--ui-red);
    color: var(--ui-white);
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 12px 24px;
    cursor: pointer;
    outline: none;
    border: 4px solid var(--ui-white);
    width: 100%;
    letter-spacing: 1px;
    
    /* Hard Shadow */
    box-shadow: 4px 4px 0px #000;
    
    transition: transform 0.05s, box-shadow 0.05s;
    position: relative;
    top: 0; left: 0;
  }

  .btn-pixel:active {
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0px #000;
    background-color: var(--ui-red-light);
  }

  .btn-pixel:hover {
    background-color: #e60000;
  }

</style>
</head>
<body>

<div id="monitor">
  <div id="screen-container">
    <canvas id="scene" width="320" height="240"></canvas>
    <div id="crt-overlay"></div>
    
    <div id="ui-layer">
      <h1 class="title">SKIFREE</h1>
      
      <!-- Critique 2: Hollow HUD Panel -->
      <div class="hud-panel">
        <div id="instructions-text">
          <span class="key">←</span> <span class="key">→</span> TO STEER<br>
          AVOID TREES. SURVIVE.
        </div>
        <button id="start-btn" class="btn-pixel">START GAME</button>
      </div>
    </div>
  </div>
</div>

<script>
/**
 * SkiFree Visual Engine - Revised
 */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

// Disable smoothing for pixel art look
ctx.imageSmoothingEnabled = false;

const W = 320;
const H = 240;

// --- Color Palette (Refined for Retro Vibe) ---
const C = {
  skyTop: '#0000aa',     // Deep Blue
  skyBot: '#6699ff',     // Light Blue
  snow: '#ffffff',       
  snowShade: '#d0e0f0',  
  treeDark: '#005500',   // Dark Green
  treeLight: '#008800',  // Light Green
  trunk: '#402000',      // Brown
  skierJacket: '#ff0000',// Bright Red
  skierPants: '#0000cc', // Blue
  skierSkin: '#ffccaa',
  skierGoggle: '#000000',
  skierGoggleGlass: '#ffffff',
  skierSki: '#333333'
};

// --- State ---
let frame = 0;
let speed = 0;
let trees = [];
let snowParticles = [];
// Critique 4: Skier Placement - Foreground, slightly off-center
let skier = { x: 180, y: 170, dir: 1, bob: 0 }; 

// --- Initialization ---
function init() {
  // Generate Trees
  for(let i=0; i<40; i++) {
    trees.push(createTree(true));
  }
  
  // Generate Snow Dust
  for(let i=0; i<60; i++) {
    snowParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() > 0.8 ? 2 : 1,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: Math.random() * 2 + 1
    });
  }
}

function createTree(randomY = false) {
  return {
    x: Math.random() * (W - 20) + 10,
    y: randomY ? Math.random() * H : -50, 
    h: 25 + Math.random() * 15, // Taller trees
    w: 14 + Math.random() * 8,
    shade: Math.random() > 0.5 ? C.treeLight : C.treeDark
  };
}

// --- Drawing Helpers ---
function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// --- Scene Components ---

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, 110);
  grad.addColorStop(0, C.skyTop);
  grad.addColorStop(1, C.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 110);
}

function drawSnowfield() {
  // Horizon line
  ctx.fillStyle = C.snow;
  ctx.fillRect(0, 100, W, H - 100);
  
  // Texture
  ctx.fillStyle = C.snowShade;
  for(let i=0; i<150; i++) {
    const nx = (i * 137) % W;
    const ny = 100 + (i * 53) % (H - 100);
    ctx.fillRect(nx, ny, 1, 1);
  }
}

function drawTree(t) {
  const x = Math.floor(t.x);
  const y = Math.floor(t.y);
  const w = Math.floor(t.w);
  
  // Shadow (Perspective)
  ctx.fillStyle = 'rgba(0,0,50,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 6, y + 4, w/1.2, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Trunk
  drawRect(x - 2, y, 4, 8, C.trunk);

  // Leaves (Layered)
  // Bottom
  drawRect(x - 9, y - 4, 18, 8, t.shade);
  // Middle
  drawRect(x - 7, y - 10, 14, 8, t.shade);
  // Top
  drawRect(x - 4, y - 16, 8, 8, t.shade);

  // Snow Cap
  drawRect(x - 2, y - 17, 4, 2, C.snow);
}

function drawSkier(x, y, dir) {
  // Bobbing animation
  const bob = Math.sin(frame * 0.2) * 2;
  const sy = y + bob;
  
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(sy));
  ctx.scale(dir, 1); 

  // Skis (Longer for speed look)
  drawRect(-10, 12, 12, 3, C.skierSki); 
  drawRect(0, 12, 12, 3, C.skierSki);  
  drawRect(-10, 12, 12, 1, '#999');     
  drawRect(0, 12, 12, 1, '#999');      

  // Legs (Blue)
  drawRect(-6, 8, 4, 6, C.skierPants);
  drawRect(2, 8, 4, 6, C.skierPants);

  // Body (Red Jacket)
  drawRect(-6, -2, 12, 11, C.skierJacket);
  // Jacket Details
  drawRect(-6, -2, 2, 11, '#aa0000'); 
  drawRect(4, -2, 2, 11, '#ff6666');  

  // Head
  drawRect(-4, -10, 8, 8, C.skierSkin);
  
  // Goggles
  drawRect(0, -8, 6, 4, C.skierGoggle);
  drawRect(1, -8, 2, 1, C.skierGoggleGlass); 

  // Poles (Dynamic)
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 2;
  ctx.beginPath();
  // Left pole
  ctx.moveTo(-4, 4); 
  ctx.lineTo(-14, 14); 
  // Right pole
  ctx.moveTo(4, 4); 
  ctx.lineTo(14, 14);   
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  ctx.fillStyle = '#ffffff';
  snowParticles.forEach(p => {
    p.y += p.speedY + (speed * 0.8); 
    p.x += p.speedX;
    
    if (p.y > H) p.y = 0;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;

    ctx.globalAlpha = 0.7;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  });
  ctx.globalAlpha = 1.0;
}

// --- Main Loop ---

function loop() {
  frame++;
  
  ctx.clearRect(0, 0, W, H);

  // 1. Environment
  drawSky();
  drawSnowfield();

  // 2. Trees (Background Layer)
  trees.sort((a,b) => a.y - b.y);
  
  trees.forEach(t => {
    t.y += speed * 1.0;
    
    if (t.y > H + 20) {
      Object.assign(t, createTree(false));
    }
    
    drawTree(t);
  });

  // 3. Skier (Foreground)
  drawSkier(skier.x, skier.y, skier.dir);

  // 4. Foreground Effects (Snow Spray)
  drawParticles();

  requestAnimationFrame(loop);
}

// --- Input & Interaction ---

document.addEventListener('keydown', (e) => {
  if(speed === 0) return;
  
  if(e.key === 'ArrowLeft') {
    skier.x = Math.max(20, skier.x - 5);
    skier.dir = -1;
  }
  if(e.key === 'ArrowRight') {
    skier.x = Math.min(W-20, skier.x + 5);
    skier.dir = 1;
  }
});

// Start Button Logic
const startBtn = document.getElementById('start-btn');
const uiLayer = document.getElementById('ui-layer');

startBtn.addEventListener('click', () => {
  // 1. Visual Flash
  ctx.fillStyle = 'white';
  ctx.fillRect(0,0,W,H);
  
  // 2. UI Transition
  uiLayer.style.transition = "opacity 0.3s, transform 0.3s";
  uiLayer.style.opacity = "0";
  uiLayer.style.transform = "scale(0.95)";
  uiLayer.style.pointerEvents = "none";

  // 3. Start Game Loop Acceleration
  let accel = 0;
  const maxSpeed = 5;
  
  const startInterval = setInterval(() => {
    accel += 0.15;
    speed = Math.min(accel, maxSpeed);
    if(speed >= maxSpeed) clearInterval(startInterval);
  }, 30);
});

// Initial Start
init();
loop();

</script>
</body>
</html>
