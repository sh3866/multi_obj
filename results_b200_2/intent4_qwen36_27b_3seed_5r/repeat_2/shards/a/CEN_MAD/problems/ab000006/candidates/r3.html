<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - The Long Run</title>
<style>
  :root {
    /* Environment Colors */
    --wall-color: #111111;
    --monitor-bezel: #2a2a2a;
    --monitor-shadow: #000000;
    
    /* Retro UI Colors (Windows 3.1/95 style) */
    --ui-bg: #c0c0c0;
    --ui-border-light: #ffffff;
    --ui-border-dark: #808080;
    --ui-border-darker: #000000;
    --ui-btn-text: #000000;
    
    /* Typography */
    --title-main: #ffffff;
    --title-shadow: #0000aa; /* Deep Blue */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--wall-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    user-select: none;
  }

  /* --- The Monitor Chassis --- */
  #monitor {
    position: relative;
    width: 720px;
    height: 540px;
    background: var(--monitor-bezel);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 
      inset 1px 1px 0 rgba(255,255,255,0.2),
      inset -1px -1px 0 rgba(0,0,0,0.5),
      0 20px 50px rgba(0,0,0,0.7);
    border: 2px solid #1a1a1a;
  }

  #screen-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 40px / 20px; /* CRT Curvature */
    overflow: hidden;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
    border: 4px solid #111;
  }

  /* The Game World Canvas */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated; /* Critical for retro look */
    image-rendering: crisp-edges;
  }

  /* --- CRT Scanlines & Vignette --- */
  #crt-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    /* Reduced opacity by 50% per critique */
    background: 
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
    z-index: 10;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
    mix-blend-mode: multiply;
  }

  /* --- UI Layer (The "Desktop") --- */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* Centered vertically */
    z-index: 20;
    pointer-events: none;
    padding-top: 40px; /* Offset to make room for title at top */
  }

  /* Typography: Chunky & Pixelated */
  h1.title {
    font-size: 80px; /* Increased Scale */
    color: var(--title-main);
    text-transform: uppercase;
    margin: 0 0 30px 0;
    line-height: 1;
    /* Hard pixelated shadow - 1px offset */
    text-shadow: 
      4px 4px 0px var(--title-shadow),
      -2px -2px 0 #000;
    letter-spacing: -2px;
    font-weight: 900;
    /* Use Courier but make it chunky */
    font-family: 'Courier New', monospace;
    position: relative;
    top: -40px; /* Pull title up */
  }
  
  /* UI Construct: The Window Box */
  .retro-window {
    background-color: var(--ui-bg);
    border: none;
    padding: 4px;
    /* The 90s Bevel: Light Top/Left, Dark Bottom/Right */
    box-shadow: 
      inset 2px 2px 0px var(--ui-border-light),
      inset -2px -2px 0px var(--ui-border-dark),
      inset 4px 4px 0px var(--ui-border-light),
      inset -4px -4px 0px var(--ui-border-dark),
      6px 6px 0px rgba(0,0,0,0.5); /* Drop shadow */
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 280px;
  }

  /* Instructions Box */
  #instructions-box {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: #000;
    text-align: center;
    line-height: 1.5;
    font-weight: bold;
    border: 2px solid #808080; /* Inner border for inset look */
    border-right-color: #fff;
    border-bottom-color: #fff;
  }

  .key {
    background: #000;
    color: #fff;
    padding: 0 4px;
    border-radius: 2px;
    font-weight: bold;
  }

  /* Button: Dark Grey/Blue as requested */
  .btn-retro {
    background-color: #000080; /* Classic Windows Blue or Dark Grey */
    color: #ffffff;
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 8px 24px;
    cursor: pointer;
    outline: none;
    border: none;
    width: 100%;
    /* Bevel for button */
    box-shadow: 
      inset 2px 2px 0px #5555ff,
      inset -2px -2px 0px #000044;
    transition: all 0.1s;
  }

  .btn-retro:active {
    background-color: #000055;
    box-shadow: 
      inset 2px 2px 0px #000044,
      inset -2px -2px 0px #5555ff;
    transform: translate(2px, 2px);
  }

  .btn-retro:hover {
    background-color: #0000aa;
  }

</style>
</head>
<body>

<div id="monitor">
  <div id="screen-container">
    <!-- Resolution 320x240 scaled up by CSS -->
    <canvas id="scene" width="320" height="240"></canvas>
    <div id="crt-overlay"></div>
    
    <!-- UI Layer -->
    <div id="ui-layer">
      <h1 class="title">SKIFREE</h1>
      
      <!-- Combined UI Box -->
      <div class="retro-window">
        <div id="instructions-box">
          <span class="key">←</span> <span class="key">→</span> TO STEER<br>
          AVOID TREES. SURVIVE.
        </div>
        <button id="start-btn" class="btn-retro">START GAME</button>
      </div>

    </div>
  </div>
</div>

<script>
/**
 * SkiFree Visual Engine
 * Pure Canvas rendering, no external assets.
 */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

// Disable smoothing for pixel art look
ctx.imageSmoothingEnabled = false;

const W = 320;
const H = 240;

// --- Color Palette (Punchy & Retro) ---
const C = {
  skyTop: '#0000cc',     // Deep Azure
  skyBot: '#80c0ff',     // Lighter Azure
  snow: '#ffffff',       // Crisp White
  snowShade: '#d0e0f0',  // Shadow
  treeDark: '#006600',   // Dark Green
  treeLight: '#009900',  // Light Green
  trunk: '#503010',      // Brown
  skierJacket: '#ff0000',// Bright Red
  skierPants: '#0000cc', // Blue
  skierSkin: '#ffccaa',
  skierGoggle: '#000000',
  skierGoggleGlass: '#aaccff',
  skierSki: '#404040'
};

// --- State ---
let frame = 0;
let speed = 0;
let trees = [];
let snowParticles = [];
let skier = { x: 160, y: 180, dir: 1, bob: 0 };

// --- Initialization ---
function init() {
  // Generate Trees
  for(let i=0; i<30; i++) {
    trees.push(createTree(true));
  }
  
  // Generate Snow Dust
  for(let i=0; i<40; i++) {
    snowParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() > 0.7 ? 2 : 1,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: Math.random() * 2 + 1
    });
  }
}

function createTree(randomY = false) {
  return {
    x: Math.random() * (W - 20) + 10,
    y: randomY ? Math.random() * H : -40, // Start above screen
    h: 20 + Math.random() * 15,
    w: 12 + Math.random() * 8,
    shade: Math.random() > 0.5 ? C.treeLight : C.treeDark
  };
}

// --- Drawing Helpers ---

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// --- Scene Components ---

function drawSky() {
  // Gradient Sky
  const grad = ctx.createLinearGradient(0, 0, 0, 100);
  grad.addColorStop(0, C.skyTop);
  grad.addColorStop(1, C.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 100);
}

function drawSnowfield() {
  // Base Snow
  ctx.fillStyle = C.snow;
  ctx.fillRect(0, 80, W, H - 80);
  
  // Texture: Random noise dots
  ctx.fillStyle = C.snowShade;
  for(let i=0; i<100; i++) {
    // Use pseudo-random based on frame for static texture, or just static
    // Let's do static noise for performance
    const nx = (i * 137) % W;
    const ny = 80 + (i * 53) % (H - 80);
    ctx.fillRect(nx, ny, 1, 1);
  }
}

function drawTree(t) {
  const x = Math.floor(t.x);
  const y = Math.floor(t.y);
  const w = Math.floor(t.w);
  const h = Math.floor(t.h);
  
  // Shadow (offset based on position to give depth)
  ctx.fillStyle = 'rgba(0,0,50,0.2)';
  ctx.beginPath();
  ctx.ellipse(x + 4, y + 2, w/1.5, 4, 0, 0, Math.PI*2);
  ctx.fill();

  // Trunk
  drawRect(x - 2, y, 4, 6, C.trunk);

  // Leaves (Layered Triangles)
  // Top
  drawRect(x - 3, y - 8, 6, 6, t.shade);
  // Middle
  drawRect(x - 6, y - 4, 12, 6, t.shade);
  // Bottom
  drawRect(x - 8, y, 16, 6, t.shade);

  // Snow Cap (White pixels on top)
  drawRect(x - 2, y - 9, 4, 2, C.snow);
}

function drawSkier(x, y, dir) {
  // Bobbing animation
  const bob = Math.sin(frame * 0.2) * 2;
  const sy = y + bob;
  
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(sy));
  ctx.scale(dir, 1); // Flip X based on direction

  // Skis (Black with white stripe)
  drawRect(-9, 10, 10, 2, C.skierSki); // Left
  drawRect(0, 10, 10, 2, C.skierSki);  // Right
  drawRect(-9, 10, 10, 1, '#ccc');     // Left Stripe
  drawRect(0, 10, 10, 1, '#ccc');      // Right Stripe

  // Legs (Blue)
  drawRect(-5, 6, 3, 5, C.skierPants);
  drawRect(2, 6, 3, 5, C.skierPants);

  // Body (Red Jacket)
  drawRect(-5, -2, 10, 9, C.skierJacket);
  // Jacket Highlights/Shadows
  drawRect(-5, -2, 2, 9, '#cc0000'); // Left shadow
  drawRect(3, -2, 2, 9, '#ff6666');  // Right highlight

  // Head
  drawRect(-3, -8, 6, 6, C.skierSkin);
  
  // Goggles
  drawRect(0, -7, 5, 3, C.skierGoggle);
  drawRect(1, -7, 2, 1, C.skierGoggleGlass); // Glint

  // Poles (Grey lines)
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-4, 2); ctx.lineTo(-12, 12); // Left
  ctx.moveTo(4, 2); ctx.lineTo(12, 12);   // Right
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  ctx.fillStyle = '#ffffff';
  snowParticles.forEach(p => {
    // Move
    p.y += p.speedY + (speed * 0.5); // Move faster when skiing
    p.x += p.speedX;
    
    // Wrap
    if (p.y > H) p.y = 0;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;

    ctx.globalAlpha = 0.6;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  });
  ctx.globalAlpha = 1.0;
}

// --- Main Loop ---

function loop() {
  frame++;
  
  // Clear
  ctx.clearRect(0, 0, W, H);

  // 1. Environment
  drawSky();
  drawSnowfield();

  // 2. Trees (Background Layer)
  // Sort by Y for depth (Painter's Algorithm)
  trees.sort((a,b) => a.y - b.y);
  
  trees.forEach(t => {
    // Move trees down to simulate forward movement
    t.y += speed * 0.8;
    
    // Recycle trees
    if (t.y > H + 20) {
      Object.assign(t, createTree(false)); // Reset to top
    }
    
    drawTree(t);
  });

  // 3. Skier
  // If game started (speed > 0), skier stays at fixed Y, world moves.
  // If menu (speed == 0), skier stays static.
  drawSkier(skier.x, skier.y, skier.dir);

  // 4. Foreground Effects
  drawParticles();

  requestAnimationFrame(loop);
}

// --- Input & Interaction ---

document.addEventListener('keydown', (e) => {
  if(speed === 0) return; // Only steer if started
  
  if(e.key === 'ArrowLeft') {
    skier.x = Math.max(20, skier.x - 4);
    skier.dir = -1;
  }
  if(e.key === 'ArrowRight') {
    skier.x = Math.min(W-20, skier.x + 4);
    skier.dir = 1;
  }
});

// Start Button Logic
const startBtn = document.getElementById('start-btn');
const uiLayer = document.getElementById('ui-layer');

startBtn.addEventListener('click', () => {
  // 1. Visual Flash
  ctx.fillStyle = 'white';
  ctx.fillRect(0,0,W,H);
  
  // 2. UI Transition
  // We don't remove UI, we just push it to background state visually
  // Or we can fade it out as per request "Remove semi-transparent box" -> The box is gone, 
  // but the title stays? The prompt says "Replace... instructions box".
  // Let's fade the UI out to focus on the game.
  
  uiLayer.style.transition = "opacity 0.5s, transform 0.5s";
  uiLayer.style.opacity = "0";
  uiLayer.style.transform = "scale(0.9)";
  uiLayer.style.pointerEvents = "none";

  // 3. Start Game Loop Acceleration
  let accel = 0;
  const maxSpeed = 4;
  
  const startInterval = setInterval(() => {
    accel += 0.1;
    speed = Math.min(accel, maxSpeed);
    if(speed >= maxSpeed) clearInterval(startInterval);
  }, 50);
});

// Initial Start
init();
loop();

</script>
</body>
</html>
