<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Premium Clean</title>
    <style>
        :root {
            --bg-wall: #EAE6DF;
            --bg-floor: #C4B59D;
            --text-main: #2C2824;
            --accent: #D96C4A;
            --accent-soft: #F2D5C6;
            --white: #FFFFFF;
            --shadow: rgba(44, 40, 36, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Typography & Layout --- */
        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .nav-links span:hover { opacity: 1; }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* --- The Floor --- */
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(180deg, #D5C5A8 0%, #BFA98C 100%);
            transform-origin: bottom;
            /* Simple wood plank effect using gradients */
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(0,0,0,0.03) 100px, rgba(0,0,0,0.03) 102px),
                repeating-linear-gradient(180deg, rgba(0,0,0,0.02) 0%, transparent 2%, transparent 10%);
            z-index: 1;
        }

        .floor-highlight {
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
            pointer-events: none;
        }

        /* --- SVG Scene Layer --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through unless on interactive elements */
        }

        /* Interactive Elements */
        .interactive-zone {
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s;
            transform-origin: center bottom;
        }
        .interactive-zone:hover {
            transform: scale(1.02);
        }

        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            z-index: 20;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            max-width: 320px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .ui-panel h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .ui-panel p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 1.5rem;
        }

        .btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--accent);
        }
        
        .btn:active {
            transform: scale(0.96);
        }

        /* --- Animation Classes --- */
        .mop-head {
            transition: transform 0.1s;
        }

        .cleaned-spill {
            transition: opacity 1.5s ease-out;
            opacity: 1;
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
        }

        /* Water marks animation */
        .water-mark {
            fill: rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 0.5s;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <div class="floor">
            <div class="floor-highlight"></div>
        </div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Filters for realism -->
                <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
                    <feOffset dx="10" dy="15" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.2" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                
                <filter id="liquid-blur">
                    <feGaussianBlur stdDeviation="2" />
                </filter>

                <linearGradient id="mop-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" />
                </linearGradient>

                <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#888;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Mess) -->
            <g id="spill-group" class="cleaned-spill" transform="translate(400, 350)">
                <!-- Main puddle -->
                <path d="M0,0 C-60,-20 -120,40 -100,80 C-80,120 50,140 100,90 C150,40 80,-20 0,0 Z" 
                      fill="#8B4513" opacity="0.8" filter="url(#liquid-blur)" />
                <!-- Splatter bits -->
                <circle cx="-120" cy="30" r="8" fill="#8B4513" opacity="0.7" />
                <circle cx="130" cy="60" r="12" fill="#8B4513" opacity="0.7" />
                <circle cx="80" cy="-20" r="5" fill="#8B4513" opacity="0.7" />
                <!-- Inner depth -->
                <ellipse cx="0" cy="60" rx="40" ry="20" fill="#5D2E0E" opacity="0.6" />
            </g>

            <!-- 2. The Mop -->
            <g id="mop-group" class="interactive-zone" transform="translate(500, 100)" filter="url(#drop-shadow)">
                <!-- Handle -->
                <rect x="-15" y="0" width="30" height="450" rx="15" fill="url(#handle-grad)" />
                <!-- Grip -->
                <rect x="-18" y="50" width="36" height="120" rx="10" fill="#333" />
                <line x1="-18" y1="70" x2="18" y2="70" stroke="#555" stroke-width="2" />
                <line x1="-18" y1="90" x2="18" y2="90" stroke="#555" stroke-width="2" />
                <line x1="-18" y1="110" x2="18" y2="110" stroke="#555" stroke-width="2" />
                <line x1="-18" y1="130" x2="18" y2="130" stroke="#555" stroke-width="2" />
                <line x1="-18" y1="150" x2="18" y2="150" stroke="#555" stroke-width="2" />
                
                <!-- Connector -->
                <path d="M-15,450 L15,450 L25,480 L-25,480 Z" fill="#222" />

                <!-- Mop Head (The Cloth) -->
                <g id="mop-head" transform="translate(0, 480)">
                    <!-- Base Shape -->
                    <ellipse cx="0" cy="40" rx="70" ry="30" fill="url(#mop-head-grad)" />
                    
                    <!-- Strands/Texture -->
                    <path d="M-40,20 Q-20,60 0,50 T40,20" fill="none" stroke="#999" stroke-width="3" />
                    <path d="M-50,30 Q-30,70 -10,60 T10,30" fill="none" stroke="#888" stroke-width="3" />
                    <path d="M-60,40 Q-40,80 -20,70 T0,40" fill="none" stroke="#777" stroke-width="3" />
                    <path d="M-30,50 Q-10,90 10,80 T30,50" fill="none" stroke="#666" stroke-width="3" />
                    <path d="M0,60 Q20,100 40,90 T60,60" fill="none" stroke="#555" stroke-width="3" />
                    
                    <!-- Wetness indicator on mop -->
                    <ellipse cx="0" cy="50" rx="50" ry="15" fill="#8B4513" opacity="0.3" />
                </g>
            </g>

            <!-- 3. Water Marks (Appear after cleaning) -->
            <g id="water-marks" transform="translate(400, 350)">
                <path d="M0,0 C-60,-20 -120,40 -100,80 C-80,120 50,140 100,90 C150,40 80,-20 0,0 Z" 
                      class="water-mark" />
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Experience the power of our microfiber synthesis. Simply drag the mop over the mess to see the transformation.</p>
            <button class="btn" id="reset-btn">Reset Scene</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            let initialMopX = 500;
            let initialMopY = 100;
            
            // Initial State
            let isCleaned = false;

            // Mouse/Touch Events for Mop
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                isDragging = true;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                // Calculate offset relative to the SVG container
                const svgRect = document.getElementById('scene-svg').getBoundingClientRect();
                
                // Simple logic: Just track movement delta
                startX = clientX;
                startY = clientY;
                
                // Change cursor style
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Update Mop Position
                // We need to parse the current transform to add to it
                const currentTransform = mopGroup.getAttribute('transform');
                const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                if (match) {
                    let curX = parseFloat(match[1]);
                    let curY = parseFloat(match[2]);
                    
                    // Apply movement
                    mopGroup.setAttribute('transform', `translate(${curX + deltaX}, ${curY + deltaY})`);
                }

                // Check Collision with Spill
                checkCollision();

                // Reset start for next frame delta
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
            }

            function checkCollision() {
                // Get bounding boxes (approximate logic for this visual demo)
                // Spill is roughly centered at 400, 350 in SVG coordinates
                // Mop head is at the bottom of the mop group
                
                const mopTransform = mopGroup.getAttribute('transform');
                const match = mopTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (!match) return;
                
                const mopX = parseFloat(match[1]);
                const mopY = parseFloat(match[2]);
                
                // Mop head Y relative to group is ~480+40=520
                const mopHeadY = mopY + 520;
                const mopHeadX = mopX;

                // Spill center approx
                const spillX = 400;
                const spillY = 400;

                // Distance check
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                if (dist < 80) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Fade out spill
                spillGroup.classList.add('hidden');
                
                // 2. Fade in water marks
                waterMarks.style.opacity = '1';
                
                // 3. Visual feedback on button
                const btn = document.getElementById('reset-btn');
                btn.innerText = "Cleaned! Reset to demo";
                btn.style.backgroundColor = "#27ae60";
                
                // Optional: Move mop slightly away to show result
                setTimeout(() => {
                    const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                    if(match) {
                        mopGroup.setAttribute('transform', `translate(${parseFloat(match[1]) + 50}, ${parseFloat(match[2]) + 20})`);
                    }
                }, 500);
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                
                // Reset Mop Position
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY})`);
                
                // Reset Spill
                spillGroup.classList.remove('hidden');
                
                // Reset Water Marks
                waterMarks.style.opacity = '0';

                // Reset Button
                resetBtn.innerText = "Reset Scene";
                resetBtn.style.backgroundColor = "var(--text-main)";
            });

            // Add a subtle idle animation to the mop
            let angle = 0;
            function animateIdle() {
                if (!isDragging && !isCleaned) {
                    angle += 0.02;
                    const yOff = Math.sin(angle) * 5;
                    const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                    if(match) {
                        mopGroup.setAttribute('transform', `translate(${parseFloat(match[1])}, ${parseFloat(match[2]) + yOff})`);
                    }
                }
                requestAnimationFrame(animateIdle);
            }
            animateIdle();
        });
    </script>
</body>
</html>
