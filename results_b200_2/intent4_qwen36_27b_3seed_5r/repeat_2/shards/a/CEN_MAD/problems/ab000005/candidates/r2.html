<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Premium Clean</title>
    <style>
        :root {
            --bg-wall: #EAE6DF;
            --text-main: #2C2824;
            --accent: #C05A38; /* Deep Terracotta */
            --accent-hover: #A84A2A;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --shadow: rgba(44, 40, 36, 0.2);
            --shadow-heavy: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Typography & Layout --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(192, 90, 56, 0.4);
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .nav-links span:hover { opacity: 1; }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- SVG Scene Layer --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            /* Subtle breathing animation */
            animation: gentleBreath 12s ease-in-out infinite alternate;
        }

        @keyframes gentleBreath {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        /* Interactive Elements */
        .interactive-zone {
            cursor: grab;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .interactive-zone:active {
            cursor: grabbing;
        }

        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            top: 15%; /* Moved slightly down to balance composition */
            left: 5%;
            z-index: 20;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 
                0 20px 40px var(--shadow),
                0 1px 0 rgba(255,255,255,0.6) inset;
            max-width: 360px;
            border: 1px solid rgba(255,255,255,0.5);
            transform: translateY(0);
            opacity: 1;
            transition: all 0.5s ease;
        }

        .ui-panel h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.1;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }

        .ui-panel p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4a4540;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 10px 20px rgba(192, 90, 56, 0.3);
            display: inline-block;
            letter-spacing: 0.02em;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(192, 90, 56, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(192, 90, 56, 0.3);
        }

        /* --- Animation Classes --- */
        .cleaned-spill {
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            pointer-events: auto;
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Water marks animation */
        .water-mark {
            fill: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 1s ease-in;
            pointer-events: none;
        }
        
        /* Mop Head Texture Animation */
        .mop-strand {
            animation: sway 4s infinite ease-in-out alternate;
            transform-origin: top center;
        }
        .mop-strand:nth-child(odd) { animation-delay: -2s; }

        @keyframes sway {
            0% { transform: rotate(-1deg) scaleY(0.99); }
            100% { transform: rotate(1deg) scaleY(1.01); }
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        
        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Experience the power of microfiber synthesis. Drag the mop over the mess to witness the transformation.</p>
            <button class="btn" id="reset-btn">Reset Scene</button>
        </div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Floor Texture: High-Fidelity Wood Grain -->
                <!-- Base noise -->
                <filter id="noise" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.1" numOctaves="3" result="noise" />
                </filter>
                
                <!-- Combine noise with color for wood look -->
                <filter id="wood-grain" x="0%" y="0%" width="100%" height="100%">
                    <!-- Use the noise filter -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.05" numOctaves="4" result="noise" />
                    <feColorMatrix type="matrix" values="
                        0.6 0 0 0 0.2
                        0.4 0 0 0 0.15
                        0.2 0 0 0 0.05
                        0 0 0 0.3 0" in="noise" result="coloredNoise" />
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="composite" />
                    <feBlend mode="multiply" in="composite" in2="SourceGraphic" />
                </filter>

                <!-- Drop Shadow for Grounding -->
                <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
                    <feOffset dx="10" dy="30" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.2" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- 2. Mop Head Gradient (Wet Microfiber) -->
                <linearGradient id="mop-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#6b7c8c;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#4a5a6a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
                </linearGradient>

                <!-- 3. Spill Gradient (Viscous Liquid) -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#3E1F06;stop-opacity:1" /> <!-- Dark Coffee -->
                    <stop offset="50%" style="stop-color:#6F4F32;stop-opacity:0.9" /> <!-- Amber -->
                    <stop offset="100%" style="stop-color:#A0522D;stop-opacity:0.2" /> <!-- Edge fade -->
                </radialGradient>

                <!-- Specular Highlight -->
                <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
                    <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
                </linearGradient>

                <!-- Wood Floor Base Gradient -->
                <linearGradient id="floor-base" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#D2B48C;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#C4A67D;stop-opacity:1" />
                </linearGradient>

                <!-- Handle Cylinder Gradient -->
                <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- --- Background Layer --- -->
            <rect width="100%" height="100%" fill="#EAE6DF" /> <!-- Wall color -->
            
            <!-- Floor Surface -->
            <!-- Centered in view (approx 50% width, 60% height of total SVG) -->
            <g id="floor-layer" transform="translate(0, 250)">
                <!-- Base Color -->
                <rect x="-100" y="-100" width="1400" height="1200" fill="url(#floor-base)" />
                
                <!-- Wood Planks (Visual lines) -->
                <g stroke="rgba(92, 64, 51, 0.15)" stroke-width="6">
                    <line x1="-100" y1="100" x2="1400" y2="100" />
                    <line x1="-100" y1="250" x2="1400" y2="250" />
                    <line x1="-100" y1="400" x2="1400" y2="400" />
                    <line x1="-100" y1="550" x2="1400" y2="550" />
                    <line x1="-100" y1="700" x2="1400" y2="700" />
                </g>

                <!-- Texture Overlay -->
                <rect x="-100" y="-100" width="1400" height="1200" fill="white" filter="url(#wood-grain)" opacity="0.9" />
                
                <!-- Vignette for depth -->
                <radialGradient id="floor-vignette" cx="50%" cy="50%" r="70%">
                    <stop offset="60%" stop-color="transparent" />
                    <stop offset="100%" stop-color="rgba(0,0,0,0.15)" />
                </radialGradient>
                <rect x="-100" y="-100" width="1400" height="1200" fill="url(#floor-vignette)" />
            </g>

            <!-- --- The Mess (Spill) --- -->
            <!-- REPOSITIONED: Center (600, 550) -->
            <g id="spill-group" class="cleaned-spill" transform="translate(600, 550)">
                
                <!-- Shadow/Depth -->
                <path d="M0,0 C-90,-20 -180,40 -150,120 C-120,190 50,200 130,130 C200,60 100,-40 0,0 Z" 
                      fill="rgba(0,0,0,0.25)" transform="translate(15, 20)" filter="blur(4px)" />

                <!-- Main Puddle Body -->
                <path d="M0,0 C-90,-20 -180,40 -150,120 C-120,190 50,200 130,130 C200,60 100,-40 0,0 Z" 
                      fill="url(#spill-grad)" />
                
                <!-- Specular Highlight (Gloss) -->
                <path d="M-60,-10 C-80,-10 -110,20 -90,60 C-70,90 -30,80 -20,40 C0,0 -20,-10 -60,-10 Z" 
                      fill="url(#specular)" opacity="0.7" transform="rotate(20)" />

                <!-- Splatter Droplets (Organic) -->
                <circle cx="-180" cy="50" r="14" fill="#3E1F06" opacity="0.8" />
                <circle cx="-210" cy="80" r="8" fill="#3E1F06" opacity="0.7" />
                <circle cx="-220" cy="60" r="4" fill="#3E1F06" opacity="0.6" />
                <circle cx="160" cy="140" r="18" fill="#3E1F06" opacity="0.8" />
                <circle cx="190" cy="170" r="10" fill="#3E1F06" opacity="0.7" />
                <circle cx="100" cy="-30" r="6" fill="#3E1F06" opacity="0.7" />
            </g>

            <!-- --- The Mop --- -->
            <!-- REPOSITIONED: Adjacent to spill, handle shortened -->
            <g id="mop-group" class="interactive-zone" transform="translate(450, 250) rotate(-15)" filter="url(#soft-shadow)">
                
                <!-- Handle (Cylindrical Gradient) -->
                <rect x="-10" y="0" width="20" height="400" rx="10" fill="url(#handle-grad)" /> 
                
                <!-- Handle Grip (Textured) -->
                <g transform="translate(0, 80)">
                    <rect x="-12" y="0" width="24" height="100" rx="8" fill="#2C2824" />
                    <!-- Grip ridges -->
                    <path d="M-12,10 h24 M-12,20 h24 M-12,30 h24 M-12,40 h24 M-12,50 h24 M-12,60 h24 M-12,70 h24 M-12,80 h24 M-12,90 h24" stroke="#444" stroke-width="1.5" />
                </g>
                
                <!-- Metal Connector -->
                <path d="M-10,400 L10,400 L18,420 L-18,420 Z" fill="#888" />
                <path d="M-15,420 L15,420 L15,430 L-15,430 Z" fill="#555" />

                <!-- Mop Head (Textured Microfiber) -->
                <g id="mop-head" transform="translate(0, 430)">
                    
                    <!-- Base Shape (Slightly irregular) -->
                    <path d="M-50,0 C-50,70 -40,120 0,120 C40,120 50,70 50,0 Z" fill="url(#mop-head-grad)" />

                    <!-- Strands/Texture (Simulating wetness and fibers) -->
                    <g class="mop-strands" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" opacity="0.5">
                        <path class="mop-strand" d="M-35,10 Q-25,50 -40,110" fill="none" />
                        <path class="mop-strand" d="M-15,10 Q-5,60 -10,115" fill="none" />
                        <path class="mop-strand" d="M5,10 Q15,50 5,120" fill="none" />
                        <path class="mop-strand" d="M25,10 Q35,60 30,115" fill="none" />
                        <path class="mop-strand" d="M40,10 Q45,50 42,110" fill="none" />
                        
                        <!-- Cross strands -->
                        <path class="mop-strand" d="M-40,30 Q-10,40 20,30" fill="none" />
                        <path class="mop-strand" d="M-30,60 Q0,70 30,60" fill="none" />
                        <path class="mop-strand" d="M-20,90 Q10,100 40,90" fill="none" />
                    </g>
                    
                    <!-- Wetness Sheen -->
                    <ellipse cx="0" cy="60" rx="30" ry="40" fill="rgba(255,255,255,0.15)" filter="blur(2px)" />
                </g>
            </g>

            <!-- Water Marks (Appear after cleaning) -->
            <g id="water-marks" transform="translate(600, 550)">
                <path d="M0,0 C-90,-20 -180,40 -150,120 C-120,190 50,200 130,130 C200,60 100,-40 0,0 Z" 
                      class="water-mark" />
            </g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            // Initial Position: Left of spill
            let initialMopX = 450;
            let initialMopY = 250;
            let initialRotation = -15;
            
            let isCleaned = false;

            // Mouse/Touch Events for Mop
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                isDragging = true;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                // Change cursor style
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Update Mop Position
                const currentTransform = mopGroup.getAttribute('transform');
                const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                if (match) {
                    let curX = parseFloat(match[1]);
                    let curY = parseFloat(match[2]);
                    
                    // Apply movement
                    // Note: We keep the rotation fixed for simplicity in this interaction model
                    mopGroup.setAttribute('transform', `translate(${curX + deltaX}, ${curY + deltaY}) rotate(${initialRotation})`);
                }

                // Check Collision with Spill
                checkCollision();

                // Reset start for next frame delta
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
            }

            function checkCollision() {
                // Get bounding boxes (approximate logic)
                // Spill is roughly centered at 600, 550 in SVG coordinates
                // Mop head is at the bottom of the mop group
                
                const mopTransform = mopGroup.getAttribute('transform');
                const match = mopTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (!match) return;
                
                const mopX = parseFloat(match[1]);
                const mopY = parseFloat(match[2]);
                
                // Mop head Y relative to group is ~430+60=490
                const mopHeadY = mopY + 490;
                const mopHeadX = mopX;

                // Spill center approx
                const spillX = 600;
                const spillY = 600;

                // Distance check
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                if (dist < 120) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Fade out spill
                spillGroup.classList.add('hidden');
                
                // 2. Fade in water marks
                waterMarks.style.opacity = '1';
                
                // 3. Visual feedback on button
                resetBtn.innerText = "Reset Scene";
                resetBtn.style.backgroundColor = "#2C2824"; // Back to dark
                
                // Optional: Move mop slightly away to show result
                setTimeout(() => {
                    const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                    if(match) {
                        mopGroup.setAttribute('transform', `translate(${parseFloat(match[1]) + 80}, ${parseFloat(match[2]) + 80}) rotate(${initialRotation})`);
                    }
                }, 300);
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                
                // Reset Mop Position
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY}) rotate(${initialRotation})`);
                
                // Reset Spill
                spillGroup.classList.remove('hidden');
                
                // Reset Water Marks
                waterMarks.style.opacity = '0';
            });

            // Add a subtle idle animation to the mop
            let angle = 0;
            function animateIdle() {
                if (!isDragging && !isCleaned) {
                    angle += 0.02;
                    const yOff = Math.sin(angle) * 3;
                    const xOff = Math.cos(angle) * 1.5;
                    
                    // We need to be careful not to break the transform string
                    // Ideally, we'd use separate attributes, but for this single-file constraint, we parse.
                    const currentTransform = mopGroup.getAttribute('transform');
                    const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                    
                    if(match) {
                        // Only apply idle if we are at start position (approx)
                        const curX = parseFloat(match[1]);
                        if(Math.abs(curX - initialMopX) < 10) {
                            mopGroup.setAttribute('transform', `translate(${initialMopX + xOff}, ${initialMopY + yOff}) rotate(${initialRotation})`);
                        }
                    }
                }
                requestAnimationFrame(animateIdle);
            }
            animateIdle();
        });
    </script>
</body>
</html>
