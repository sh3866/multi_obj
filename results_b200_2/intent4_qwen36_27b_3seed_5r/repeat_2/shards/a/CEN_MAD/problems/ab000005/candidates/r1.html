<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Premium Clean</title>
    <style>
        :root {
            --bg-wall: #EAE6DF;
            --text-main: #2C2824;
            --accent: #C05A38; /* Terracotta */
            --accent-hover: #A84A2A;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --shadow: rgba(44, 40, 36, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Typography & Layout --- */
        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .nav-links span:hover { opacity: 1; }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- SVG Scene Layer --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            /* Subtle zoom on load for polish */
            animation: gentleZoom 10s ease-out forwards;
        }

        @keyframes gentleZoom {
            0% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Interactive Elements */
        .interactive-zone {
            cursor: grab;
            transition: transform 0.1s;
        }
        .interactive-zone:active {
            cursor: grabbing;
        }

        /* --- UI Overlay --- */
        /* Repositioned to Top Left per critique */
        .ui-panel {
            position: absolute;
            top: 5rem;
            left: 3rem;
            z-index: 20;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px var(--shadow);
            max-width: 340px;
            border: 1px solid rgba(255,255,255,0.6);
            transform: translateY(0);
            opacity: 1;
            transition: all 0.5s ease;
        }

        .ui-panel h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.1;
            color: var(--text-main);
        }

        .ui-panel p {
            font-size: 1rem;
            line-height: 1.6;
            color: #4a4540;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 50px; /* Pill shape */
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(192, 90, 56, 0.3);
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(192, 90, 56, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        /* --- Animation Classes --- */
        .cleaned-spill {
            transition: opacity 1.5s ease-out;
            opacity: 1;
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
        }

        /* Water marks animation */
        .water-mark {
            fill: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 1s ease-in;
            pointer-events: none;
        }
        
        /* Mop Head Texture Animation */
        .mop-strand {
            animation: sway 3s infinite ease-in-out alternate;
            transform-origin: top center;
        }
        .mop-strand:nth-child(odd) { animation-delay: -1.5s; }

        @keyframes sway {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        
        <!-- UI Overlay (Top Left) -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Experience the power of microfiber synthesis. Drag the mop over the mess to witness the transformation.</p>
            <button class="btn" id="reset-btn">Reset Scene</button>
        </div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Floor Texture: Wood Grain Filter -->
                <filter id="wood-grain" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="3" result="noise" />
                    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0.8 0 0 0  0 0 0 0.4 0" in="noise" result="coloredNoise" />
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="composite" />
                    <feBlend mode="multiply" in="composite" in2="SourceGraphic" />
                </filter>

                <!-- Drop Shadow -->
                <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="15" dy="25" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- 2. Mop Head Gradient (Wet Microfiber) -->
                <linearGradient id="mop-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8899a6;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#6b7c8c;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4a5a6a;stop-opacity:1" />
                </linearGradient>

                <!-- 3. Spill Gradient (Believable Liquid) -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#5D2E0E;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#8B4513;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#A0522D;stop-opacity:0.6" />
                </radialGradient>

                <!-- Specular Highlight -->
                <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
                    <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
                </linearGradient>

                <!-- Wood Floor Base Gradient -->
                <linearGradient id="floor-base" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#D2B48C;stop-opacity:1" /> <!-- Light Oak -->
                    <stop offset="100%" style="stop-color:#C4A67D;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- --- Background Layer --- -->
            <rect width="100%" height="100%" fill="#EAE6DF" /> <!-- Wall color -->
            
            <!-- Floor Surface -->
            <g id="floor-layer" transform="translate(0, 200)">
                <!-- Base Color -->
                <rect x="-50" y="-50" width="1300" height="1100" fill="url(#floor-base)" />
                
                <!-- Wood Planks (Visual lines) -->
                <g stroke="rgba(0,0,0,0.05)" stroke-width="4">
                    <line x1="-50" y1="100" x2="1300" y2="100" />
                    <line x1="-50" y1="250" x2="1300" y2="250" />
                    <line x1="-50" y1="400" x2="1300" y2="400" />
                    <line x1="-50" y1="550" x2="1300" y2="550" />
                    <line x1="-50" y1="700" x2="1300" y2="700" />
                </g>

                <!-- Texture Overlay -->
                <rect x="-50" y="-50" width="1300" height="1100" fill="white" filter="url(#wood-grain)" opacity="0.8" />
            </g>

            <!-- --- The Mess (Spill) --- -->
            <!-- Positioned Lower-Left as requested -->
            <g id="spill-group" class="cleaned-spill" transform="translate(350, 550)">
                
                <!-- Shadow/Depth -->
                <path d="M0,0 C-80,-30 -160,50 -130,100 C-100,160 60,180 120,120 C180,60 90,-30 0,0 Z" 
                      fill="rgba(0,0,0,0.15)" transform="translate(10, 15)" />

                <!-- Main Puddle Body -->
                <path d="M0,0 C-80,-30 -160,50 -130,100 C-100,160 60,180 120,120 C180,60 90,-30 0,0 Z" 
                      fill="url(#spill-grad)" />
                
                <!-- Specular Highlight (Gloss) -->
                <path d="M-40,-10 C-60,-10 -90,20 -70,50 C-50,80 -20,70 -10,40 C0,10 -20,-10 -40,-10 Z" 
                      fill="url(#specular)" opacity="0.6" transform="rotate(15)" />

                <!-- Splatter Droplets -->
                <circle cx="-150" cy="40" r="12" fill="#8B4513" opacity="0.8" />
                <circle cx="-170" cy="60" r="6" fill="#8B4513" opacity="0.7" />
                <circle cx="140" cy="130" r="15" fill="#8B4513" opacity="0.8" />
                <circle cx="160" cy="150" r="8" fill="#8B4513" opacity="0.7" />
                <circle cx="80" cy="-20" r="5" fill="#8B4513" opacity="0.7" />
            </g>

            <!-- --- The Mop --- -->
            <!-- Positioned Right Side (approx 70% width) -->
            <g id="mop-group" class="interactive-zone" transform="translate(850, 150) rotate(12)" filter="url(#soft-shadow)">
                
                <!-- Handle -->
                <rect x="-12" y="0" width="24" height="500" rx="12" fill="#F5F5F5" /> <!-- White handle -->
                <!-- Handle Grip -->
                <rect x="-14" y="60" width="28" height="140" rx="8" fill="#2C2824" />
                <!-- Grip Texture -->
                <line x1="-14" y1="80" x2="14" y2="80" stroke="#444" stroke-width="2" />
                <line x1="-14" y1="100" x2="14" y2="100" stroke="#444" stroke-width="2" />
                <line x1="-14" y1="120" x2="14" y2="120" stroke="#444" stroke-width="2" />
                <line x1="-14" y1="140" x2="14" y2="140" stroke="#444" stroke-width="2" />
                <line x1="-14" y1="160" x2="14" y2="160" stroke="#444" stroke-width="2" />
                
                <!-- Metal Connector -->
                <path d="M-12,500 L12,500 L20,530 L-20,530 Z" fill="#888" />

                <!-- Mop Head (Textured Microfiber) -->
                <g id="mop-head" transform="translate(0, 530)">
                    
                    <!-- Base Shape (Slightly irregular) -->
                    <path d="M-60,0 C-60,60 -50,100 0,100 C50,100 60,60 60,0 Z" fill="url(#mop-head-grad)" />

                    <!-- Strands/Texture (Simulating wetness and fibers) -->
                    <g class="mop-strands" stroke="#4a5a6a" stroke-width="3" stroke-linecap="round" opacity="0.6">
                        <path class="mop-strand" d="M-40,10 Q-30,50 -45,90" fill="none" />
                        <path class="mop-strand" d="M-20,10 Q-10,60 -15,95" fill="none" />
                        <path class="mop-strand" d="M0,10 Q10,50 0,100" fill="none" />
                        <path class="mop-strand" d="M20,10 Q30,60 25,95" fill="none" />
                        <path class="mop-strand" d="M40,10 Q50,50 45,90" fill="none" />
                        
                        <!-- Cross strands -->
                        <path class="mop-strand" d="M-50,30 Q-20,40 10,30" fill="none" />
                        <path class="mop-strand" d="M-40,60 Q-10,70 20,60" fill="none" />
                    </g>
                    
                    <!-- Wetness Sheen -->
                    <ellipse cx="0" cy="60" rx="40" ry="30" fill="rgba(255,255,255,0.1)" />
                </g>
            </g>

            <!-- Water Marks (Appear after cleaning) -->
            <g id="water-marks" transform="translate(350, 550)">
                <path d="M0,0 C-80,-30 -160,50 -130,100 C-100,160 60,180 120,120 C180,60 90,-30 0,0 Z" 
                      class="water-mark" />
            </g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            let initialMopX = 850;
            let initialMopY = 150;
            let initialRotation = 12;
            
            let isCleaned = false;

            // Mouse/Touch Events for Mop
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                isDragging = true;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                // Change cursor style
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Update Mop Position
                const currentTransform = mopGroup.getAttribute('transform');
                const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                if (match) {
                    let curX = parseFloat(match[1]);
                    let curY = parseFloat(match[2]);
                    
                    // Apply movement
                    // Note: We keep the rotation fixed for simplicity in this interaction model
                    mopGroup.setAttribute('transform', `translate(${curX + deltaX}, ${curY + deltaY}) rotate(${initialRotation})`);
                }

                // Check Collision with Spill
                checkCollision();

                // Reset start for next frame delta
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
            }

            function checkCollision() {
                // Get bounding boxes (approximate logic)
                // Spill is roughly centered at 350, 550 in SVG coordinates
                // Mop head is at the bottom of the mop group
                
                const mopTransform = mopGroup.getAttribute('transform');
                const match = mopTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (!match) return;
                
                const mopX = parseFloat(match[1]);
                const mopY = parseFloat(match[2]);
                
                // Mop head Y relative to group is ~530+60=590
                const mopHeadY = mopY + 590;
                const mopHeadX = mopX;

                // Spill center approx
                const spillX = 350;
                const spillY = 600;

                // Distance check
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                if (dist < 100) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Fade out spill
                spillGroup.classList.add('hidden');
                
                // 2. Fade in water marks
                waterMarks.style.opacity = '1';
                
                // 3. Visual feedback on button
                resetBtn.innerText = "Reset Scene";
                resetBtn.style.backgroundColor = "#2C2824"; // Back to dark
                
                // Optional: Move mop slightly away to show result
                setTimeout(() => {
                    const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                    if(match) {
                        mopGroup.setAttribute('transform', `translate(${parseFloat(match[1]) + 100}, ${parseFloat(match[2]) + 50}) rotate(${initialRotation})`);
                    }
                }, 300);
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                
                // Reset Mop Position
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY}) rotate(${initialRotation})`);
                
                // Reset Spill
                spillGroup.classList.remove('hidden');
                
                // Reset Water Marks
                waterMarks.style.opacity = '0';
            });

            // Add a subtle idle animation to the mop
            let angle = 0;
            function animateIdle() {
                if (!isDragging && !isCleaned) {
                    angle += 0.02;
                    const yOff = Math.sin(angle) * 3;
                    const xOff = Math.cos(angle) * 1.5;
                    
                    // We need to be careful not to break the transform string
                    // Ideally, we'd use separate attributes, but for this single-file constraint, we parse.
                    const currentTransform = mopGroup.getAttribute('transform');
                    const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                    
                    if(match) {
                        // Only apply idle if we are at start position (approx)
                        const curX = parseFloat(match[1]);
                        if(Math.abs(curX - initialMopX) < 10) {
                            mopGroup.setAttribute('transform', `translate(${initialMopX + xOff}, ${initialMopY + yOff}) rotate(${initialRotation})`);
                        }
                    }
                }
                requestAnimationFrame(animateIdle);
            }
            animateIdle();
        });
    </script>
</body>
</html>
