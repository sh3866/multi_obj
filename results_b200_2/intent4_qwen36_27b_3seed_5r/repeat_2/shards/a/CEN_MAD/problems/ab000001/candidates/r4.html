<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Refined Warm Storybook */
            --bg-canvas: #EBE3D5;
            --wood-primary: #8D6E63;
            --wood-dark: #5D4037;
            --wood-shadow: #3E2723;
            
            --tray-bg: #D7CCC8;
            --tray-shadow-inner: #A1887F;
            
            --tile-wood: #EFEBE9;
            --tile-wood-dark: #D7CCC8;
            
            --path-green: #43A047; /* More saturated green */
            --path-shadow: #1B5E20;
            
            --ink-dark: #3E2723;
            
            /* Button Colors */
            --btn-run: #66BB6A;
            --btn-run-dark: #2E7D32;
            --btn-reset: #D7CCC8;
            --btn-reset-dark: #A1887F;

            /* Dimensions */
            --tile-size: 70px;
            --grid-gap: 10px; /* Explicit gap per request */
            --board-padding: 20px;
            --frame-radius: 24px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-canvas);
            /* Canvas Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.12'/%3E%3C/svg%3E");
            
            /* Typography: Storybook Slab */
            font-family: 'Rockwell', 'Georgia', 'Times New Roman', serif;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem; /* Reduced slightly */
            margin: 0;
            letter-spacing: 0.5px;
            color: var(--ink-dark);
            /* Playful rounded serif look */
            border-radius: 12px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .subtitle {
            font-family: 'Helvetica', 'Arial', sans-serif; /* Contrast Sans */
            font-size: 0.85rem;
            color: var(--wood-primary);
            letter-spacing: 3px;
            font-weight: 700;
            margin-top: 8px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* --- The Unified Board Container --- */
        .game-container {
            position: relative;
            background-color: var(--wood-primary);
            /* Wood Grain Texture */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 8px);
            
            border-radius: var(--frame-radius);
            /* Deep 3D Shadow */
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.3),
                0 5px 0 var(--wood-shadow),
                inset 0 2px 0 rgba(255,255,255,0.2);
            
            display: flex;
            flex-direction: column;
            padding-bottom: 20px; /* Space for the integrated footer */
            padding-top: 30px;
            padding-left: 30px;
            padding-right: 30px;
            
            /* Lighting: Top-Left Highlight */
            position: relative;
        }
        
        /* Top-Left Light Source Reflection on the Frame */
        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--frame-radius);
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: 100;
        }

        /* --- The Grid Area (Recessed Tray) --- */
        .grid-wrapper {
            background-color: var(--tray-bg);
            /* Inner Shadow for Recessed feel (Light from Top-Left) */
            box-shadow: 
                inset 4px 4px 10px var(--tray-shadow-inner),
                inset -2px -2px 5px rgba(255,255,255,0.4);
            
            border-radius: 16px;
            padding: 15px;
            position: relative;
            margin-bottom: 20px; /* Spacing between grid and integrated buttons */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--grid-gap);
            position: relative; /* Context for absolute tokens */
        }

        /* --- Tiles (Physical Blocks) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            /* Lighter top, darker bottom for block volume */
            background: linear-gradient(135deg, var(--tile-wood) 0%, var(--tile-wood-dark) 100%);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            
            /* Drop Shadow for physical depth */
            box-shadow: 
                0 4px 6px rgba(0,0,0,0.15),
                0 1px 0 rgba(255,255,255,0.5) inset;
            
            transition: transform 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-2px);
        }

        /* --- Path Lines (Connectors) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--path-shadow);
            stroke-width: 14; /* Wider base */
            stroke-linecap: square; /* Extends to edge */
            stroke-linejoin: miter;
            opacity: 0.2;
            transform: translate(1px, 2px); /* Shadow offset */
        }

        .path-fill {
            fill: none;
            stroke: var(--path-green);
            stroke-width: 10;
            stroke-linecap: square; /* Extends to edge */
            stroke-linejoin: miter;
            opacity: 0.3; /* Dim when inactive */
            transition: opacity 0.4s ease, stroke-width 0.3s ease;
        }

        /* Active State */
        .tile.active .path-fill {
            opacity: 1;
            stroke-width: 12;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));
        }
        
        .tile.active .path-line {
            opacity: 0.5;
        }

        /* --- Characters & Markers --- */
        
        /* Goal Glow */
        .marker-goal-container {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }

        .marker-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .marker-icon {
            width: 40px;
            height: 40px;
            z-index: 6;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Cub Token */
        .cub-token-container {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .cub-glow {
            position: absolute;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, transparent 70%);
            border-radius: 50%;
        }

        .cub-icon {
            width: 50px;
            height: 50px;
            z-index: 21;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.3));
        }

        /* --- Integrated Footer Controls --- */
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: 'Rockwell', serif;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
            
            /* Shared Lighting Logic */
            position: relative;
        }

        /* Reset Button */
        .btn-reset {
            background-color: var(--btn-reset);
            color: var(--wood-dark);
            box-shadow: 
                0 6px 0 var(--btn-reset-dark),
                0 8px 10px rgba(0,0,0,0.1);
        }

        .btn-reset:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 var(--btn-reset-dark),
                inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Run Button */
        .btn-run {
            background-color: var(--btn-run);
            color: #fff;
            box-shadow: 
                0 6px 0 var(--btn-run-dark),
                0 8px 10px rgba(0,0,0,0.2);
        }

        .btn-run:hover {
            background-color: #74C978;
        }

        .btn-run:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 var(--btn-run-dark),
                inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            :root {
                --tile-size: 46px;
                --grid-gap: 8px;
                --frame-radius: 18px;
            }
            h1 { font-size: 2rem; }
            .game-container { padding: 15px; padding-bottom: 15px; }
            .grid-wrapper { padding: 10px; }
            .cub-icon { width: 36px; height: 36px; }
            .marker-icon { width: 30px; height: 30px; }
            button { padding: 10px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <!-- Unified Container: Wood Frame + Grid + Buttons -->
    <div class="game-container">
        
        <!-- The Recessed Tray -->
        <div class="grid-wrapper">
            <div class="grid" id="grid">
                <!-- JS Generated Content -->
            </div>
        </div>

        <!-- Integrated Footer Controls -->
        <div class="controls-row">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="solvePuzzle()">Run</button>
        </div>

    </div>

    <script>
        // --- Config ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVGs ---
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            let d = "";
            // Connections: Top, Right, Bottom, Left
            if (conn[0]) d += `M${mid},${mid} L${mid},0 `;
            if (conn[1]) d += `M${mid},${mid} L${size},${mid} `;
            if (conn[2]) d += `M${mid},${mid} L${mid},${size} `;
            if (conn[3]) d += `M${mid},${mid} L0,${mid} `;

            return `
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="${d}" class="path-line" />
                <path d="${d}" class="path-fill" />
            </svg>`;
        }

        const starSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#FFC107" stroke="#FF8F00" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
        `;

        const cubSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M25,25 L20,10 L38,18 Z" fill="#C55339" />
                <path d="M75,25 L80,10 L62,18 Z" fill="#C55339" />
                <rect x="20" y="20" width="60" height="60" rx="16" fill="#E76F51" />
                <path d="M30,35 Q50,25 70,35 L80,55 Q50,70 20,55 Z" fill="#F4A261" />
                <circle cx="38" cy="45" r="5" fill="#264653" />
                <circle cx="62" cy="45" r="5" fill="#264653" />
                <circle cx="39" cy="43" r="2" fill="#FFF" />
                <circle cx="63" cy="43" r="2" fill="#FFF" />
                <ellipse cx="50" cy="62" rx="12" ry="9" fill="#FFF" opacity="0.9" />
                <circle cx="50" cy="59" r="4" fill="#264653" />
                <path d="M46,65 Q50,68 54,65" stroke="#264653" stroke-width="2" fill="none" stroke-linecap="round" />
            </svg>
        `;

        // --- Init ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create Cub
            const cubContainer = document.createElement('div');
            cubContainer.className = 'cub-token-container';
            cubContainer.id = 'cub';
            cubContainer.innerHTML = `<div class="cub-glow"></div><div class="cub-icon">${cubSVG}</div>`;
            gridEl.appendChild(cubContainer);

            // Create Goal
            const goalContainer = document.createElement('div');
            goalContainer.className = 'marker-goal-container';
            goalContainer.id = 'goal';
            goalContainer.innerHTML = `<div class="marker-glow"></div><div class="marker-icon">${starSVG}</div>`;
            gridEl.appendChild(goalContainer);

            // Generate Tiles
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Logic for visual paths
                    let conn = [false, false, false, false];
                    if (x===1 && y===1) conn = [false, false, true, false];
                    else if (x===1 && y===2) conn = [true, false, true, false];
                    else if (x===1 && y===3) conn = [true, true, false, false];
                    else if (x===2 && y===3) conn = [false, true, false, true];
                    else if (x===3 && y===3) conn = [false, true, false, true];
                    else if (x===4 && y===3) conn = [false, false, true, true];
                    else if (x===4 && y===4) conn = [true, false, true, false];
                    else if (x===4 && y===5) conn = [true, false, false, false];
                    else {
                        const r = Math.random();
                        if (r < 0.3) conn = [true, false, true, false];
                        else if (r < 0.5) conn = [false, true, false, true];
                        else if (r < 0.7) conn = [true, true, false, false];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            updatePosition('cub', startPos.x, startPos.y);
            updatePosition('goal', endPos.x, endPos.y);
        }

        function updatePosition(id, x, y) {
            const el = document.getElementById(id);
            if (!el) return;
            
            // Get CSS variables for accurate positioning
            const rootStyles = getComputedStyle(document.documentElement);
            const tileSize = parseInt(rootStyles.getPropertyValue('--tile-size'));
            const gap = parseInt(rootStyles.getPropertyValue('--grid-gap'));
            
            // Calculate center of the tile
            const pos = gap + (x * (tileSize + gap)) + (tileSize / 2);
            
            el.style.top = `${pos}px`;
            el.style.left = `${pos}px`;
        }

        // --- Logic ---
        function resetGame() {
            updatePosition('cub', startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback on container
            const container = document.querySelector('.game-container');
            container.style.transform = 'scale(0.98)';
            setTimeout(() => container.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            resetGame();
            
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            let delay = 200; 
            
            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updatePosition('cub', pos.x, pos.y);
                }, delay);
                delay += 400; 
            });
        }

        window.addEventListener('resize', () => {
            // Re-calculate positions on resize
            const cub = document.getElementById('cub');
            // We need to track current cub position, simplified here to just reset for demo
            // In a real app, track state.
            updatePosition('goal', endPos.x, endPos.y);
        });

        initGrid();
    </script>
</body>
</html>
