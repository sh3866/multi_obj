<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Revised Palette --- */
            --bg-parchment: #F5E6D3;
            --bg-noise: #E8DCC8;
            
            --wood-frame: #4A3B32;
            --wood-frame-highlight: #635043;
            --wood-frame-shadow: #2E241E;
            
            --tray-bg: #5C4A3E; /* Darker recess */
            
            --tile-wood: #F5E6D3;
            --tile-wood-shadow: #DBCBA6;
            
            --path-color: #E07A5F; /* Vibrant Terracotta */
            --path-shadow: #B05843;
            
            --star-gold: #FFC107;
            --star-glow: rgba(255, 193, 7, 0.6);

            --ink-dark: #3E2723;
            
            /* Button Plaques */
            --btn-run-bg: #E07A5F;
            --btn-run-border: #C05A40;
            --btn-reset-bg: #D7CCC8;
            --btn-reset-border: #BCAAA4;

            /* Dimensions */
            --tile-size: 70px;
            --grid-gap: 12px;
            --board-padding: 24px;
            --frame-radius: 28px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-parchment);
            /* Parchment Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            
            /* Typography: Playful Sans */
            font-family: 'Quicksand', 'Nunito', 'Segoe UI', 'Arial Rounded MT Bold', sans-serif;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 1px;
            color: var(--wood-frame);
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.6);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8D6E63;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 4px;
            opacity: 0.9;
        }

        /* --- Main Layout Wrapper --- */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px; /* Space between board and footer */
        }

        /* --- The Board (Focal Point) --- */
        .game-container {
            position: relative;
            background-color: var(--wood-frame);
            /* Wood Grain Texture */
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px);
            
            border-radius: var(--frame-radius);
            
            /* Deep Physical Shadow */
            box-shadow: 
                0 20px 40px rgba(46, 36, 30, 0.4),
                0 8px 0 var(--wood-frame-shadow),
                inset 0 2px 0 rgba(255,255,255,0.1);
            
            padding: var(--board-padding);
        }

        /* --- The Grid Area (Recessed Tray) --- */
        .grid-wrapper {
            background-color: var(--tray-bg);
            /* Inner Shadow for Recessed feel */
            box-shadow: 
                inset 6px 6px 12px rgba(0,0,0,0.4),
                inset -2px -2px 5px rgba(255,255,255,0.05);
            
            border-radius: 16px;
            padding: 15px;
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--grid-gap);
            position: relative;
        }

        /* --- Tiles (Carved Wooden Blocks) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background: var(--tile-wood);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            
            /* Carved/Pressed Look (Inset Shadows) */
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.15),
                inset -2px -2px 5px rgba(255,255,255,0.8),
                0 4px 0 rgba(0,0,0,0.1); /* Subtle depth from tray */
            
            transition: transform 0.2s, background 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-2px);
            background: #FFF8F0;
        }

        /* --- Path Lines (Connectors) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--path-shadow);
            stroke-width: 14;
            stroke-linecap: square;
            stroke-linejoin: miter;
            opacity: 0.2;
            transform: translate(1px, 2px);
        }

        .path-fill {
            fill: none;
            stroke: var(--path-color);
            stroke-width: 10;
            stroke-linecap: square;
            stroke-linejoin: miter;
            opacity: 0.15; /* Dim when inactive */
            transition: opacity 0.4s ease, stroke-width 0.3s ease;
        }

        /* Active State */
        .tile.active .path-fill {
            opacity: 1;
            stroke-width: 12;
            filter: drop-shadow(0px 2px 0px rgba(0,0,0,0.2));
        }
        
        .tile.active .path-line {
            opacity: 0.4;
        }

        /* --- Characters & Markers --- */
        
        /* Goal Marker */
        .marker-goal-container {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }

        .marker-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--star-glow) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        .marker-icon {
            width: 55px;
            height: 55px;
            z-index: 6;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(0.85); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        /* Cub Token */
        .cub-token-container {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 20;
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Hand-drawn style cub is larger */
        .cub-icon {
            width: 65px; /* Approx 80-90% of tile */
            height: 65px;
            z-index: 21;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25));
        }

        /* --- Footer Controls (Distinct Area) --- */
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            width: 100%;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 40px;
            border-radius: 18px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.15s ease;
            position: relative;
        }

        /* Reset Button - Stitched Fabric Look */
        .btn-reset {
            background-color: var(--btn-reset-bg);
            color: #5D4037;
            box-shadow: 
                0 6px 0 var(--btn-reset-border),
                0 10px 10px rgba(0,0,0,0.1);
            /* Stitching effect */
            border: 2px dashed rgba(93, 64, 55, 0.3);
        }

        .btn-reset:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 var(--btn-reset-border),
                inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Run Button - Wooden Plaque Look */
        .btn-run {
            background-color: var(--btn-run-bg);
            color: #fff;
            box-shadow: 
                0 6px 0 var(--btn-run-border),
                0 10px 10px rgba(0,0,0,0.2);
        }

        .btn-run:hover {
            background-color: #EB8B73;
        }

        .btn-run:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 var(--btn-run-border),
                inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            :root {
                --tile-size: 48px;
                --grid-gap: 8px;
                --board-padding: 16px;
                --frame-radius: 20px;
            }
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 0.9rem; }
            .cub-icon { width: 42px; height: 42px; }
            .marker-icon { width: 36px; height: 36px; }
            button { padding: 12px 28px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="layout-wrapper">
        <!-- The Board -->
        <div class="game-container">
            <div class="grid-wrapper">
                <div class="grid" id="grid">
                    <!-- JS Generated Content -->
                </div>
            </div>
        </div>

        <!-- The Footer -->
        <div class="controls-row">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="solvePuzzle()">Run</button>
        </div>
    </div>

    <script>
        // --- Config ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVGs ---
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            let d = "";
            // Connections: Top, Right, Bottom, Left
            if (conn[0]) d += `M${mid},${mid} L${mid},0 `;
            if (conn[1]) d += `M${mid},${mid} L${size},${mid} `;
            if (conn[2]) d += `M${mid},${mid} L${mid},${size} `;
            if (conn[3]) d += `M${mid},${mid} L0,${mid} `;

            return `
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="${d}" class="path-line" />
                <path d="${d}" class="path-fill" />
            </svg>`;
        }

        const starSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#FFC107" stroke="#FF8F00" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
        `;

        // More detailed, hand-drawn style Cub SVG
        const cubSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <path d="M25,25 Q20,10 38,18 Z" fill="#C55339" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
                <path d="M75,25 Q80,10 62,18 Z" fill="#C55339" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
                <!-- Head -->
                <rect x="20" y="20" width="60" height="60" rx="16" fill="#E76F51" stroke="#3E2723" stroke-width="2" />
                <!-- Face Mask -->
                <path d="M30,35 Q50,25 70,35 L80,55 Q50,70 20,55 Z" fill="#F4A261" stroke="none" />
                <!-- Eyes -->
                <circle cx="38" cy="45" r="5" fill="#3E2723" />
                <circle cx="62" cy="45" r="5" fill="#3E2723" />
                <circle cx="39" cy="43" r="2" fill="#FFF" />
                <circle cx="63" cy="43" r="2" fill="#FFF" />
                <!-- Snout -->
                <ellipse cx="50" cy="62" rx="12" ry="9" fill="#FFF" opacity="0.9" />
                <circle cx="50" cy="59" r="4" fill="#3E2723" />
                <!-- Smile -->
                <path d="M46,65 Q50,68 54,65" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round" />
            </svg>
        `;

        // --- Init ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create Cub
            const cubContainer = document.createElement('div');
            cubContainer.className = 'cub-token-container';
            cubContainer.id = 'cub';
            cubContainer.innerHTML = `<div class="cub-icon">${cubSVG}</div>`;
            gridEl.appendChild(cubContainer);

            // Create Goal
            const goalContainer = document.createElement('div');
            goalContainer.className = 'marker-goal-container';
            goalContainer.id = 'goal';
            goalContainer.innerHTML = `<div class="marker-glow"></div><div class="marker-icon">${starSVG}</div>`;
            gridEl.appendChild(goalContainer);

            // Generate Tiles
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Logic for visual paths
                    let conn = [false, false, false, false];
                    if (x===1 && y===1) conn = [false, false, true, false];
                    else if (x===1 && y===2) conn = [true, false, true, false];
                    else if (x===1 && y===3) conn = [true, true, false, false];
                    else if (x===2 && y===3) conn = [false, true, false, true];
                    else if (x===3 && y===3) conn = [false, true, false, true];
                    else if (x===4 && y===3) conn = [false, false, true, true];
                    else if (x===4 && y===4) conn = [true, false, true, false];
                    else if (x===4 && y===5) conn = [true, false, false, false];
                    else {
                        const r = Math.random();
                        if (r < 0.3) conn = [true, false, true, false];
                        else if (r < 0.5) conn = [false, true, false, true];
                        else if (r < 0.7) conn = [true, true, false, false];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            updatePosition('cub', startPos.x, startPos.y);
            updatePosition('goal', endPos.x, endPos.y);
        }

        function updatePosition(id, x, y) {
            const el = document.getElementById(id);
            if (!el) return;
            
            // Get CSS variables for accurate positioning
            const rootStyles = getComputedStyle(document.documentElement);
            const tileSize = parseInt(rootStyles.getPropertyValue('--tile-size'));
            const gap = parseInt(rootStyles.getPropertyValue('--grid-gap'));
            
            // Calculate center of the tile
            const pos = gap + (x * (tileSize + gap)) + (tileSize / 2);
            
            el.style.top = `${pos}px`;
            el.style.left = `${pos}px`;
        }

        // --- Logic ---
        function resetGame() {
            updatePosition('cub', startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback on container
            const container = document.querySelector('.game-container');
            container.style.transform = 'scale(0.98)';
            setTimeout(() => container.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            resetGame();
            
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            let delay = 200; 
            
            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updatePosition('cub', pos.x, pos.y);
                }, delay);
                delay += 400; 
            });
        }

        window.addEventListener('resize', () => {
            const cub = document.getElementById('cub');
            updatePosition('goal', endPos.x, endPos.y);
        });

        initGrid();
    </script>
</body>
</html>
