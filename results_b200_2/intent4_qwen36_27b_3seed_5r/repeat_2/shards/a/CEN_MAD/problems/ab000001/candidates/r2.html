<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Wooden Toy / Storybook */
            --bg-wall: #F5F0E6; /* Warm Cream */
            --board-wood: #D4A373; /* Rich Wood Tone */
            --board-shadow: #8C6A45;
            
            --tile-wood: #FAEDCD; /* Light Wood/Cardstock */
            --tile-inset: #E6D0B3;
            
            --path-color: #2A9D8F; /* Deep Teal */
            --path-shadow: #1D7065;
            
            --cub-fur: #E76F51; /* Burnt Orange */
            --cub-dark: #C55339;
            --cub-nose: #264653;
            
            --star-gold: #FFD166;
            --star-glow: rgba(255, 209, 102, 0.8);
            
            --btn-run: #606C38; /* Olive Green */
            --btn-run-shadow: #38401D;
            
            --ink-main: #2C241B;
            --ink-light: #6B5D4D;

            /* Dimensions */
            --tile-size: 70px;
            --grid-gap: 8px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-wall);
            /* Tactile Texture Overlay */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            
            /* Fallback to system fonts if webfonts blocked, but prioritize rounded feel */
            font-family: 'Nunito', 'Fredoka One', 'Quicksand', 'Segoe UI', 'Comic Sans MS', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-main);
        }

        /* --- Header & Typography --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: 'Fredoka One', 'Nunito', sans-serif;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 1px;
            color: var(--ink-main);
            /* Playful Shadow */
            text-shadow: 2px 3px 0px rgba(0,0,0,0.1);
            line-height: 1;
        }

        .subtitle {
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            color: var(--ink-light);
            letter-spacing: 1px;
            font-weight: 700;
            margin-top: 8px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* --- The Board (Wooden Tray) --- */
        .game-container {
            position: relative;
            padding: 20px;
            background-color: var(--board-wood);
            /* Wood Grain Simulation */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 8px);
            
            border-radius: 20px;
            /* Deep physical drop shadow */
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.3),
                0 5px 0 var(--board-shadow),
                inset 0 0 0 2px rgba(255,255,255,0.1);
            
            transition: transform 0.3s ease;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--grid-gap);
            background-color: rgba(0,0,0,0.1); /* Inner tray depth */
            padding: var(--grid-gap);
            border-radius: 12px;
            position: relative;
        }

        /* --- Tiles (Inset Wood) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-wood);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            
            /* Inset shadow to look carved into board */
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.1),
                inset -2px -2px 5px rgba(255,255,255,0.4),
                0 2px 0 rgba(0,0,0,0.1);
            
            transition: transform 0.2s, background-color 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-1px);
            background-color: #fffaf0;
        }

        /* --- Path Aesthetics (Grooves) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--path-shadow); /* Shadow layer */
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.2;
            transform: translateY(2px); /* Push shadow down */
        }

        .path-fill {
            fill: none;
            stroke: var(--path-color); /* Main groove color */
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.25; /* Faded default */
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Active Path State (Lit up) */
        .tile.active .path-fill {
            opacity: 1;
            stroke-width: 14;
            /* Glowing effect */
            filter: drop-shadow(0px 0px 3px var(--path-color));
        }
        
        .tile.active .path-line {
            opacity: 0.4;
        }

        /* --- Characters & Markers --- */
        
        /* The Goal Star (Magical/Glowing) */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 4;
            pointer-events: none;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px var(--star-glow)); transform: translate(-50%, -50%) scale(1); }
            50% { filter: drop-shadow(0 0 15px var(--star-glow)); transform: translate(-50%, -50%) scale(1.1); }
        }

        /* The Cub Token (3D Wooden Toy) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            z-index: 10;
            pointer-events: none;
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.3));
        }

        /* --- Footer & Controls --- */
        footer {
            /* Tighter alignment to board */
            margin-top: 24px; 
            display: flex;
            gap: 16px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 520px; /* Match board width approx */
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 12px 32px;
            border-radius: 16px; /* Chunky rounded */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
            position: relative;
        }

        /* Reset: Secondary/Ghost with border */
        .btn-reset {
            background-color: rgba(255,255,255,0.4);
            color: var(--ink-main);
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }

        .btn-reset:hover {
            background-color: #fff;
            border-color: rgba(0,0,0,0.2);
            transform: translateY(-1px);
        }
        
        .btn-reset:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* Run: Primary/Inviting Green */
        .btn-run {
            background-color: var(--btn-run);
            color: #fff;
            box-shadow: 0 6px 0 var(--btn-run-shadow), 0 10px 10px rgba(0,0,0,0.15);
            transform: translateY(0);
            min-width: 120px;
        }

        .btn-run:hover {
            background-color: #6e7a40;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--btn-run-shadow), 0 14px 15px rgba(0,0,0,0.2);
        }

        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-run-shadow), 0 4px 5px rgba(0,0,0,0.2);
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 600px) {
            :root {
                --tile-size: 52px;
                --grid-gap: 6px;
            }
            h1 { font-size: 2.5rem; }
            .game-container { padding: 14px; }
            .cub-token { width: 44px; height: 44px; }
            .marker-goal { width: 32px; height: 32px; }
            footer { flex-direction: row; padding: 0 20px; }
            button { padding: 10px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Helper to create SVG path string based on connections [Top, Right, Bottom, Left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            let d = "";
            
            // Draw lines from center to edge
            // We draw slightly longer than half to ensure corners meet nicely
            if (conn[0]) d += `M${mid},${mid} L${mid},0 `; // Top
            if (conn[1]) d += `M${mid},${mid} L${size},${mid} `; // Right
            if (conn[2]) d += `M${mid},${mid} L${mid},${size} `; // Bottom
            if (conn[3]) d += `M${mid},${mid} L0,${mid} `; // Left

            // We use two paths: one for the shadow (depth), one for the color
            return `
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="${d}" class="path-line" />
                <path d="${d}" class="path-fill" />
            </svg>`;
        }

        // Vector Star Icon (Shiny/Magical)
        const starSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFF0A8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#FFD166;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="url(#goldGrad)" stroke="#E6B800" stroke-width="1" stroke-linejoin="round"/>
            </svg>
        `;

        // Vector Cub Icon (3D Wooden Toy Style)
        const cubSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Drop shadow handled by CSS on parent, but we add a rim highlight -->
                
                <!-- Ears (Back layer) -->
                <path d="M25,25 L20,10 L38,18 Z" fill="var(--cub-dark)" />
                <path d="M75,25 L80,10 L62,18 Z" fill="var(--cub-dark)" />
                
                <!-- Main Head Shape -->
                <rect x="20" y="20" width="60" height="60" rx="16" fill="var(--cub-fur)" />
                
                <!-- Face Mask (Lighter) -->
                <path d="M30,35 Q50,25 70,35 L80,55 Q50,70 20,55 Z" fill="#F4A261" />
                
                <!-- Eyes -->
                <circle cx="38" cy="45" r="5" fill="#264653" />
                <circle cx="62" cy="45" r="5" fill="#264653" />
                <circle cx="39" cy="43" r="2" fill="#FFF" /> <!-- Glint -->
                <circle cx="63" cy="43" r="2" fill="#FFF" /> <!-- Glint -->
                
                <!-- Snout -->
                <ellipse cx="50" cy="62" rx="12" ry="9" fill="#FFF" opacity="0.9" />
                <circle cx="50" cy="59" r="4" fill="#264653" />
                
                <!-- Mouth -->
                <path d="M46,65 Q50,68 54,65" stroke="#264653" stroke-width="2" fill="none" stroke-linecap="round" />
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubSVG;
            gridEl.appendChild(cub);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    let conn = [false, false, false, false]; // Top, Right, Bottom, Left
                    
                    // Hardcoded "Solution" path connections for visual demo
                    if (x===1 && y===1) conn = [false, false, true, false]; // Start (Down)
                    else if (x===1 && y===2) conn = [true, false, true, false]; // Straight
                    else if (x===1 && y===3) conn = [true, true, false, false]; // Corner (Right)
                    else if (x===2 && y===3) conn = [false, true, false, true]; // Straight
                    else if (x===3 && y===3) conn = [false, true, false, true]; // Straight
                    else if (x===4 && y===3) conn = [false, false, true, true]; // Corner (Down)
                    else if (x===4 && y===4) conn = [true, false, true, false]; // Straight
                    else if (x===4 && y===5) conn = [true, false, false, false]; // End (Up)
                    else {
                        // Random filler noise to make board look populated
                        const r = Math.random();
                        if (r < 0.3) conn = [true, false, true, false];
                        else if (r < 0.5) conn = [false, true, false, true];
                        else if (r < 0.7) conn = [true, true, false, false];
                        else conn = [false, false, false, false]; // Empty
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            if (!cub) return;
            
            // Use CSS variables to calculate position dynamically
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap'));
            
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.querySelector('.marker-goal');
            if (!goal) return;

            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap'));
            
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            goal.style.top = `${top}px`;
            goal.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Subtle shake effect
            const container = document.querySelector('.game-container');
            container.style.transform = 'scale(0.96)';
            setTimeout(() => container.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // Reset first
            resetGame();
            
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            let delay = 200; // Initial delay
            
            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 400; // Speed of movement
            });
        }

        // Handle resize to keep character aligned
        window.addEventListener('resize', () => {
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        });

        // Start
        initGrid();

    </script>
</body>
</html>
