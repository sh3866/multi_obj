<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-wall: #EAE0D5; /* Warm plaster */
            --bg-paper: #FDFBF7; /* Off-white paper */
            --ink-main: #2C241B; /* Deep brown/black */
            --ink-light: #8B7D6B;
            
            --cub-color: #D96C48; /* Terracotta */
            --cub-shadow: #A84A2E;
            
            --star-color: #FFD166; /* Bright Gold */
            --star-glow: rgba(255, 209, 102, 0.6);
            
            --path-color: #81B29A; /* Moss Green */
            --path-active: #4A8C73;
            
            --btn-primary: #588157; /* Deep Moss */
            --btn-primary-shadow: #3A5A40;
            
            --tile-size: 72px;
            --tile-radius: 16px; /* Rounded, friendly corners */
            --grid-gap: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-wall);
            /* Texture: Subtle paper grain */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            
            font-family: 'Fredoka One', 'Nunito', 'Varela Round', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-main);
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 1px;
            color: var(--ink-main);
            font-weight: 700; /* Chunky but not heavy 900 */
            text-shadow: 0 2px 0 rgba(255,255,255,0.5);
        }

        .subtitle {
            font-family: 'Segoe UI', sans-serif; /* Clean sans for subtitle */
            font-size: 0.95rem;
            color: var(--ink-light);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* --- The Board Container --- */
        .game-container {
            position: relative;
            padding: 18px;
            background: #fff;
            /* Soft, warm drop shadow to lift off page */
            border-radius: 28px;
            box-shadow: 
                0 20px 40px rgba(44, 36, 27, 0.12),
                0 1px 3px rgba(44, 36, 27, 0.05);
            transition: transform 0.3s ease;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--grid-gap);
            /* Warm wood/earth background for the grid frame */
            background-color: #E6D5B8;
            padding: var(--grid-gap);
            border-radius: 24px;
            /* No heavy borders */
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
        }

        /* --- Tiles --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            /* Warm cream fill */
            background-color: var(--bg-paper);
            border-radius: var(--tile-radius);
            position: relative;
            cursor: pointer;
            /* Inner shadow for tactile depth */
            box-shadow: 
                inset 0 -4px 0 rgba(0,0,0,0.04),
                0 2px 0 rgba(255,255,255,0.8);
            transition: transform 0.2s, background-color 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-1px);
            background-color: #fff;
        }

        /* --- Path Aesthetics --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--ink-light);
            stroke-width: 12; /* Thick */
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.3; /* Faded by default */
            transition: all 0.4s ease;
        }

        /* Active Path State */
        .tile.active .path-line {
            stroke: var(--path-color);
            stroke-width: 14; /* Slightly thicker when active */
            opacity: 1;
            /* Crayon/Texture effect via drop-shadow */
            filter: drop-shadow(0px 2px 0px rgba(0,0,0,0.1)); 
        }

        /* --- Characters & Markers --- */
        
        /* The Goal Star */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 2;
            pointer-events: none;
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 4px var(--star-glow)); transform: translate(-50%, -50%) scale(1); }
            50% { filter: drop-shadow(0 0 12px var(--star-glow)); transform: translate(-50%, -50%) scale(1.15); }
        }

        /* The Cub Token */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            z-index: 5;
            pointer-events: none;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Cub SVG Styling */
        .cub-body {
            fill: var(--cub-color);
            filter: drop-shadow(0 4px 0 var(--cub-shadow));
        }
        .cub-face { fill: #FDFBF7; }
        .cub-eye { fill: var(--ink-main); }

        /* --- Footer & Controls --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            z-index: 10;
            align-items: center;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            padding: 14px 36px;
            border-radius: 50px; /* Pill shape */
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        /* Reset: Secondary/Ghost */
        .btn-reset {
            background-color: transparent;
            color: var(--ink-light);
            font-weight: 600;
        }

        .btn-reset:hover {
            color: var(--ink-main);
            background-color: rgba(0,0,0,0.05);
        }

        /* Run: Primary/Dominant */
        .btn-run {
            background-color: var(--btn-primary);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 6px 0 var(--btn-primary-shadow), 0 10px 15px rgba(0,0,0,0.1);
            transform: translateY(0);
        }

        .btn-run:hover {
            background-color: #6a9668;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--btn-primary-shadow), 0 12px 20px rgba(0,0,0,0.15);
        }

        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-primary-shadow), 0 4px 5px rgba(0,0,0,0.1);
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 550px) {
            :root {
                --tile-size: 54px;
                --tile-radius: 12px;
                --grid-gap: 8px;
            }
            h1 { font-size: 2.2rem; }
            .game-container { padding: 12px; }
            .cub-token { width: 36px; height: 36px; }
            .marker-goal { width: 28px; height: 28px; }
            button { padding: 12px 28px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Helper to create SVG path string based on connections [Top, Right, Bottom, Left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            let d = "";
            
            // Draw lines from center to edge
            if (conn[0]) d += `M${mid},${mid} L${mid},0 `; // Top
            if (conn[1]) d += `M${mid},${mid} L${size},${mid} `; // Right
            if (conn[2]) d += `M${mid},${mid} L${mid},${size} `; // Bottom
            if (conn[3]) d += `M${mid},${mid} L0,${mid} `; // Left

            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" class="path-line" /></svg>`;
        }

        // Vector Star Icon
        const starSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#FFD166" stroke="#E9C46A" stroke-width="1" stroke-linejoin="round"/>
            </svg>
        `;

        // Vector Cub Icon (Cute, chunky)
        const cubSVG = `
            <svg viewBox="0 0 100 100" class="cub-body" xmlns="http://www.w3.org/2000/svg">
                <!-- Body Shape (Rounded Rect with ears) -->
                <path d="M30,25 L25,15 L40,20 L50,15 L60,20 L75,15 L70,25 L90,35 L90,75 L10,75 L10,35 Z" />
                <!-- Ears -->
                <circle cx="25" cy="15" r="6" />
                <circle cx="75" cy="15" r="6" />
                <!-- Face -->
                <circle cx="35" cy="45" r="12" class="cub-face" />
                <circle cx="65" cy="45" r="12" class="cub-face" />
                <!-- Eyes -->
                <circle cx="35" cy="43" r="4" class="cub-eye" />
                <circle cx="65" cy="43" r="4" class="cub-eye" />
                <!-- Nose -->
                <ellipse cx="50" cy="60" rx="8" ry="6" class="cub-face" />
                <circle cx="50" cy="58" r="3" class="cub-eye" />
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubSVG;
            gridEl.appendChild(cub);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Visual Logic: Determine tile content
                    // We create a "fake" path for the demo that looks like a valid puzzle
                    // Start -> Down -> Right -> Down -> Right -> Down (Goal)
                    // (1,1) -> (1,2) -> (1,3) -> (2,3) -> (3,3) -> (4,3) -> (4,4) -> (4,5)
                    
                    let conn = [false, false, false, false]; // Top, Right, Bottom, Left
                    
                    // Hardcoded "Solution" path connections for visual demo
                    if (x===1 && y===1) conn = [false, false, true, false]; // Start (Down)
                    else if (x===1 && y===2) conn = [true, false, true, false]; // Straight
                    else if (x===1 && y===3) conn = [true, true, false, false]; // Corner (Right)
                    else if (x===2 && y===3) conn = [false, true, false, true]; // Straight
                    else if (x===3 && y===3) conn = [false, true, false, true]; // Straight
                    else if (x===4 && y===3) conn = [false, false, true, true]; // Corner (Down)
                    else if (x===4 && y===4) conn = [true, false, true, false]; // Straight
                    else if (x===4 && y===5) conn = [true, false, false, false]; // End (Up)
                    else {
                        // Random filler noise to make board look populated
                        const r = Math.random();
                        if (r < 0.3) conn = [true, false, true, false];
                        else if (r < 0.5) conn = [false, true, false, true];
                        else if (r < 0.7) conn = [true, true, false, false];
                        else conn = [false, false, false, false]; // Empty
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap'));
            
            // Calculate position
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.querySelector('.marker-goal');
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap'));
            
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            goal.style.top = `${top}px`;
            goal.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Subtle shake effect
            const grid = document.querySelector('.game-container');
            grid.style.transform = 'scale(0.96)';
            setTimeout(() => grid.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            let delay = 0;
            
            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 400;
            });
        }

        // Handle resize to keep character aligned
        window.addEventListener('resize', () => {
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        });

        // Start
        initGrid();

    </script>
</body>
</html>
