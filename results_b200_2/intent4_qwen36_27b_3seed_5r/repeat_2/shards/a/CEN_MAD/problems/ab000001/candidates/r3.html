<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-color: #F2E8D9; /* Soft Paper */
            --wood-frame: #A67B5B;
            --wood-frame-shadow: #7A563D;
            --wood-inner: #E3D0B8;
            
            --tile-base: #FFF4E0; /* Light Cream */
            --tile-edge: #E6CFA8; /* Darker Cream */
            
            --path-color: #81C784; /* Sage Green */
            --path-shadow: #558B57;
            
            --ink-dark: #5D4037; /* Deep Brown */
            --ink-text: #3E2723;
            
            --btn-primary: #66BB6A;
            --btn-primary-dark: #388E3C;
            --btn-secondary: #D7CCC8;
            --btn-secondary-text: #5D4037;

            /* Dimensions */
            --tile-size: 64px;
            --grid-gap: 12px;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            /* Subtle Paper Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            
            /* System Font Stack for Chunky Playful Look */
            font-family: 'Chalkboard SE', 'Comic Sans MS', 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-text);
        }

        /* --- Header & Typography --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 2.8rem; /* Slightly reduced for hierarchy */
            margin: 0;
            letter-spacing: 1px;
            color: var(--ink-text);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            line-height: 1;
        }

        .subtitle {
            font-family: 'Arial', sans-serif; /* Cleaner contrast font */
            font-size: 0.9rem;
            color: var(--ink-dark); /* Darkened as requested */
            letter-spacing: 2px;
            font-weight: 700;
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* --- The Board (Tactile Wooden Tray) --- */
        .game-container {
            position: relative;
            padding: 24px;
            background-color: var(--wood-frame);
            /* Wood Grain Gradient */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 3px, transparent 3px, transparent 10px);
            
            border-radius: 24px;
            /* Crisp, physical lift */
            box-shadow: 
                0 12px 24px rgba(0,0,0,0.25),
                0 4px 0 var(--wood-frame-shadow),
                inset 0 1px 0 rgba(255,255,255,0.3);
            
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--grid-gap);
            background-color: rgba(0,0,0,0.15); /* Deep tray effect */
            padding: var(--grid-gap);
            border-radius: var(--radius); /* Unified Radius */
            position: relative;
            /* Inner shadow for depth */
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.3);
        }

        /* --- Tiles (Tactile Blocks) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            /* Radial Gradient for rounded block feel */
            background: radial-gradient(circle at 50% 50%, var(--tile-base) 30%, var(--tile-edge) 100%);
            border-radius: var(--radius); /* Unified Radius */
            position: relative;
            cursor: pointer;
            
            /* Inner Shadow for depth */
            box-shadow: 
                inset 1px 1px 4px rgba(0,0,0,0.15),
                0 4px 0 rgba(0,0,0,0.1); /* Bottom lip */
            
            transition: transform 0.2s, background-color 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-2px);
            filter: brightness(1.02);
        }

        /* --- Path Aesthetics (Raised Rope/Groove) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--path-shadow); /* Drop shadow for rope effect */
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.3;
            transform: translate(1px, 2px);
        }

        .path-fill {
            fill: none;
            stroke: var(--path-color); /* Sage Green */
            stroke-width: 8; /* Thicker stroke */
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.3; /* Subtle when inactive */
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Active Path State */
        .tile.active .path-fill {
            opacity: 1;
            stroke-width: 10;
            /* Raised/Glowing effect */
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));
        }
        
        .tile.active .path-line {
            opacity: 0.5;
        }

        /* --- Characters & Markers --- */
        
        /* The Goal Star (Solid Gold) */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            z-index: 4;
            pointer-events: none;
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 4px #FFC107); transform: translate(-50%, -50%) scale(1); }
            50% { filter: drop-shadow(0 0 12px #FFC107); transform: translate(-50%, -50%) scale(1.15); }
        }

        /* The Cub Token (3D Toy) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            z-index: 10;
            pointer-events: none;
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Strong drop shadow to sit ON the tile */
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.35));
        }

        /* --- Footer & Controls (Integrated Plaque) --- */
        .controls-plaque {
            margin-top: -12px; /* Overlap the board slightly */
            padding: 16px 24px;
            background-color: var(--wood-frame);
            border-radius: 20px 20px 24px 24px;
            display: flex;
            gap: 20px;
            z-index: 20;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-width: 320px;
            
            /* Plaque Shadow */
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.2),
                0 4px 0 var(--wood-frame-shadow);
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            padding: 10px 28px;
            border-radius: 12px; /* Match tile/board geometry */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }

        /* Reset: Secondary */
        .btn-reset {
            background-color: var(--btn-secondary);
            color: var(--btn-secondary-text);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .btn-reset:hover {
            background-color: #EFEBE9;
            transform: translateY(-1px);
        }
        
        .btn-reset:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* Run: Primary */
        .btn-run {
            background-color: var(--btn-primary);
            color: #fff;
            /* Inner highlight */
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 50%);
            
            box-shadow: 0 6px 0 var(--btn-primary-dark), 0 10px 10px rgba(0,0,0,0.15);
            transform: translateY(0);
        }

        .btn-run:hover {
            background-color: #74C978;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--btn-primary-dark), 0 14px 15px rgba(0,0,0,0.2);
        }

        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--btn-primary-dark), 0 4px 5px rgba(0,0,0,0.2);
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 600px) {
            :root {
                --tile-size: 48px;
                --grid-gap: 8px;
            }
            h1 { font-size: 2.2rem; }
            .game-container { padding: 16px; }
            .cub-token { width: 50px; height: 50px; }
            .marker-goal { width: 36px; height: 36px; }
            .controls-plaque { padding: 12px 16px; width: 100%; max-width: 350px; }
            button { padding: 10px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
        
        <!-- Integrated Controls Plaque -->
        <div class="controls-plaque">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="solvePuzzle()">Run</button>
        </div>
    </div>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Helper to create SVG path string based on connections [Top, Right, Bottom, Left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            let d = "";
            
            // Draw lines from center to edge
            if (conn[0]) d += `M${mid},${mid} L${mid},0 `; // Top
            if (conn[1]) d += `M${mid},${mid} L${size},${mid} `; // Right
            if (conn[2]) d += `M${mid},${mid} L${mid},${size} `; // Bottom
            if (conn[3]) d += `M${mid},${mid} L0,${mid} `; // Left

            return `
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="${d}" class="path-line" />
                <path d="${d}" class="path-fill" />
            </svg>`;
        }

        // Vector Star Icon (Solid Gold)
        const starSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" 
                fill="#FFC107" stroke="#FF8F00" stroke-width="1" stroke-linejoin="round"/>
            </svg>
        `;

        // Vector Cub Icon (3D Toy)
        const cubSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <path d="M25,25 L20,10 L38,18 Z" fill="#C55339" />
                <path d="M75,25 L80,10 L62,18 Z" fill="#C55339" />
                
                <!-- Main Head Shape -->
                <rect x="20" y="20" width="60" height="60" rx="16" fill="#E76F51" />
                
                <!-- Face Mask -->
                <path d="M30,35 Q50,25 70,35 L80,55 Q50,70 20,55 Z" fill="#F4A261" />
                
                <!-- Eyes -->
                <circle cx="38" cy="45" r="5" fill="#264653" />
                <circle cx="62" cy="45" r="5" fill="#264653" />
                <circle cx="39" cy="43" r="2" fill="#FFF" />
                <circle cx="63" cy="43" r="2" fill="#FFF" />
                
                <!-- Snout -->
                <ellipse cx="50" cy="62" rx="12" ry="9" fill="#FFF" opacity="0.9" />
                <circle cx="50" cy="59" r="4" fill="#264653" />
                
                <!-- Mouth -->
                <path d="M46,65 Q50,68 54,65" stroke="#264653" stroke-width="2" fill="none" stroke-linecap="round" />
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubSVG;
            gridEl.appendChild(cub);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    let conn = [false, false, false, false]; // Top, Right, Bottom, Left
                    
                    // Hardcoded "Solution" path connections
                    if (x===1 && y===1) conn = [false, false, true, false]; // Start (Down)
                    else if (x===1 && y===2) conn = [true, false, true, false]; // Straight
                    else if (x===1 && y===3) conn = [true, true, false, false]; // Corner (Right)
                    else if (x===2 && y===3) conn = [false, true, false, true]; // Straight
                    else if (x===3 && y===3) conn = [false, true, false, true]; // Straight
                    else if (x===4 && y===3) conn = [false, false, true, true]; // Corner (Down)
                    else if (x===4 && y===4) conn = [true, false, true, false]; // Straight
                    else if (x===4 && y===5) conn = [true, false, false, false]; // End (Up)
                    else {
                        // Random filler noise
                        const r = Math.random();
                        if (r < 0.3) conn = [true, false, true, false];
                        else if (r < 0.5) conn = [false, true, false, true];
                        else if (r < 0.7) conn = [true, true, false, false];
                        else conn = [false, false, false, false];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            if (!cub) return;
            
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap'));
            
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.querySelector('.marker-goal');
            if (!goal) return;

            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-gap'));
            
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            goal.style.top = `${top}px`;
            goal.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Subtle shake effect
            const container = document.querySelector('.game-container');
            container.style.transform = 'scale(0.96)';
            setTimeout(() => container.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            resetGame();
            
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            let delay = 200; 
            
            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += 400; 
            });
        }

        window.addEventListener('resize', () => {
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        });

        // Start
        initGrid();

    </script>
</body>
</html>
