<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Planet Defense - Mission Control</title>
    <style>
        :root {
            /* Color Palette: Deep Space & Holographic Cyan */
            --c-bg-deep: #02050a;
            --c-bg-panel: rgba(2, 10, 25, 0.7);
            
            --c-primary: #00f0ff; /* Cyan */
            --c-primary-dim: rgba(0, 240, 255, 0.15);
            --c-primary-glow: rgba(0, 240, 255, 0.5);
            --c-primary-solid: #00f0ff;
            
            --c-accent: #ffcc00; /* Gold for Credits */
            --c-alert: #ff3333;
            
            --c-text: #e2e8f0;
            --c-text-muted: #7a8bb5;

            /* Typography - Unified Geometric System Font Stack */
            --font-main: 'Rajdhani', 'Orbitron', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            /* Dimensions */
            --hud-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--c-bg-deep);
            background-image: radial-gradient(circle at 50% 40%, #0a1526 0%, #000510 80%);
            color: var(--c-text);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* --- BACKGROUND FX --- */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.5;
        }

        .grid-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--c-primary-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--c-primary-dim) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.05;
            pointer-events: none;
            z-index: 1;
        }

        /* --- LAYOUT --- */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. HUD HEADER (Refined) --- */
        .hud-bar {
            height: var(--hud-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background: linear-gradient(to bottom, rgba(0, 15, 30, 0.9), rgba(0, 5, 15, 0.4));
            border-bottom: 1px solid var(--c-primary-dim);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .hud-group {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hud-label {
            font-size: 0.7rem;
            color: var(--c-primary);
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 1.4rem;
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--c-primary-glow);
        }

        .hud-value.credits { color: var(--c-accent); text-shadow: 0 0 8px rgba(255, 204, 0, 0.4); }

        /* --- 2. MAIN STAGE (Vertical Axis) --- */
        .main-stage {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px; /* Vertical spacing */
        }

        /* Title */
        .title-block {
            text-align: center;
            margin-top: -20px; /* Pull up slightly */
            margin-bottom: 10px;
            position: relative;
            z-index: 20;
        }

        .title-js {
            font-size: 1rem;
            color: var(--c-primary);
            letter-spacing: 10px;
            font-weight: 600;
            opacity: 0.9;
        }

        .title-planet {
            font-size: 4.5rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 0 2px var(--c-primary);
            margin: 5px 0;
        }

        /* --- PLANET GRAPHIC (Visual Polish) --- */
        .planet-container {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        /* The Glowing Core */
        .planet-core {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #0a2a3a, #000);
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.2),
                inset 0 0 20px rgba(0, 240, 255, 0.4);
            position: relative;
            z-index: 5;
            animation: float 6s ease-in-out infinite;
        }
        
        /* Grid overlay on planet */
        .planet-core::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: 
                linear-gradient(90deg, transparent 50%, rgba(0, 240, 255, 0.1) 50%),
                linear-gradient(0deg, transparent 50%, rgba(0, 240, 255, 0.1) 50%);
            background-size: 20px 20px;
            opacity: 0.5;
        }

        /* Energy Shield Rings */
        .shield-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .ring-1 {
            width: 260px; height: 260px;
            border-top: 2px solid var(--c-primary);
            border-bottom: 2px solid var(--c-primary);
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
            animation: spin 12s linear infinite;
        }

        .ring-2 {
            width: 320px; height: 320px;
            border: 1px dashed rgba(0, 240, 255, 0.2);
            animation: spin-reverse 20s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* --- UPGRADE MENU (Fix UI) --- */
        .upgrade-menu {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            z-index: 20;
        }

        .upgrade-card {
            background: var(--c-bg-panel);
            border: 1px solid var(--c-primary-dim);
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
            position: relative;
            backdrop-filter: blur(5px);
            /* Sci-fi cut corners */
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .upgrade-card:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--c-primary);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.2);
        }

        .upgrade-label {
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .upgrade-cost {
            color: var(--c-accent);
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.9;
        }

        /* --- START BUTTON (Glassmorphism & Renamed) --- */
        .start-btn {
            background: rgba(0, 240, 255, 0.05);
            color: var(--c-primary);
            border: 1px solid var(--c-primary);
            padding: 18px 60px;
            font-family: var(--font-main);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            /* Glass effect */
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px var(--c-primary-dim);
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .start-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 30px var(--c-primary-glow);
            color: #fff;
            text-shadow: 0 0 10px var(--c-primary);
            transform: scale(1.02);
        }

        .start-btn:hover::before {
            left: 100%;
        }

        /* --- BRIEFING PANEL (Refined) --- */
        .briefing-panel {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            padding: 20px;
            background: rgba(5, 15, 30, 0.4);
            border-right: 2px solid var(--c-primary-dim);
            backdrop-filter: blur(3px);
            text-align: right;
            opacity: 0.8;
        }

        .briefing-title {
            color: var(--c-primary);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--c-primary-dim);
            padding-bottom: 5px;
            display: inline-block;
        }

        .briefing-text {
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--c-text-muted);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .briefing-panel { display: none; }
            .title-planet { font-size: 3rem; }
            .planet-container { transform: scale(0.8); }
        }

        @media (max-width: 600px) {
            .hud-bar { padding: 0 20px; gap: 10px; }
            .hud-group { gap: 15px; }
            .hud-label { font-size: 0.6rem; }
            .hud-value { font-size: 1rem; }
            
            .main-stage { padding-top: 0; }
            .title-planet { font-size: 2.2rem; letter-spacing: 2px; }
            .title-js { font-size: 0.8rem; letter-spacing: 4px; }
            
            .planet-container { width: 280px; height: 280px; margin-bottom: 10px; }
            .planet-core { width: 140px; height: 140px; }
            .ring-1 { width: 190px; height: 190px; }
            .ring-2 { width: 240px; height: 240px; }

            .upgrade-menu {
                flex-direction: row;
                gap: 10px;
                width: 100%;
                justify-content: center;
            }
            .upgrade-card {
                min-width: auto;
                flex: 1;
                padding: 10px 5px;
            }
            .upgrade-label { font-size: 0.8rem; letter-spacing: 1px; }
            .upgrade-cost { font-size: 0.7rem; }

            .start-btn {
                width: 90%;
                padding: 15px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND LAYERS -->
    <canvas id="starfield"></canvas>
    <div class="grid-overlay"></div>

    <!-- UI CONTAINER -->
    <div class="ui-container">

        <!-- 1. HUD HEADER -->
        <header class="hud-bar">
            <div class="hud-group">
                <div class="hud-item">
                    <span class="hud-label">WAVE</span>
                    <span class="hud-value">001</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">SECTOR</span>
                    <span class="hud-value" style="font-size: 1rem; opacity: 0.7;">ALPHA-9</span>
                </div>
            </div>
            <div class="hud-group">
                <div class="hud-item">
                    <span class="hud-label">SHIELD HP</span>
                    <span class="hud-value" style="color: var(--c-primary);">100%</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">CREDITS</span>
                    <span class="hud-value credits">500</span>
                </div>
            </div>
        </header>

        <!-- 2. MAIN STAGE -->
        <section class="main-stage">
            
            <!-- Title -->
            <div class="title-block">
                <div class="title-js">JS</div>
                <h1 class="title-planet">PLANET<br>DEFENSE</h1>
            </div>

            <!-- Planet Graphic -->
            <div class="planet-container">
                <div class="ring-2 shield-ring"></div>
                <div class="ring-1 shield-ring"></div>
                <div class="planet-core"></div>
            </div>

            <!-- Upgrade Options (Moved to center axis) -->
            <div class="upgrade-menu">
                <div class="upgrade-card">
                    <span class="upgrade-label">DAMAGE</span>
                    <span class="upgrade-cost">100 CR</span>
                </div>
                <div class="upgrade-card">
                    <span class="upgrade-label">FIRE RATE</span>
                    <span class="upgrade-cost">150 CR</span>
                </div>
                <div class="upgrade-card">
                    <span class="upgrade-label">SPEED</span>
                    <span class="upgrade-cost">120 CR</span>
                </div>
            </div>

            <!-- Start Button (Renamed & Restyled) -->
            <button class="start-btn" id="startBtn">
                START
            </button>

            <!-- Briefing Panel (Right side, cleaner) -->
            <aside class="briefing-panel">
                <div class="briefing-title">MISSION BRIEF</div>
                <div class="briefing-text">
                    Xenon swarm detected in sector. Orbital shields holding at 100%.<br><br>
                    > Configure turret network<br>
                    > Repel vanguard<br>
                    > Protect core integrity
                </div>
            </aside>

        </section>

    </div>

    <script>
        /**
         * STARFIELD ANIMATION
         * Simple canvas implementation for performance and no external assets
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }

        function initStars() {
            stars = [];
            // Density based on screen size
            const count = Math.floor((width * height) / 5000); 
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    speed: Math.random() * 0.2 + 0.05,
                    opacity: Math.random() * 0.8 + 0.2
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#fff';
            
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Move star
                star.y += star.speed;
                
                // Reset if off screen
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

        /**
         * INTERACTIVITY
         */
        const startBtn = document.getElementById('startBtn');
        
        startBtn.addEventListener('click', () => {
            // Visual feedback on click
            startBtn.innerHTML = "INITIALIZING...";
            startBtn.style.letterSpacing = "4px";
            startBtn.style.transform = "scale(0.98)";
            
            // Simulate loading state
            setTimeout(() => {
                startBtn.innerHTML = "SYSTEM ACTIVE";
                startBtn.style.background = "rgba(0, 240, 255, 0.3)";
                startBtn.style.color = "#fff";
                
                setTimeout(() => {
                    alert("MISSION STARTED: WAVE 1 INCOMING");
                    // Reset button (in a real app, this would navigate)
                    startBtn.innerHTML = "START";
                    startBtn.style.background = "";
                    startBtn.style.color = "";
                    startBtn.style.letterSpacing = "6px";
                    startBtn.style.transform = "scale(1)";
                }, 500);
            }, 1000);
        });
    </script>
</body>
</html>
