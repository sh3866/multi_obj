<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix - Revised</title>
    <style>
        :root {
            --bg-deep: #050608;
            --bg-panel: #0f1115;
            --bg-panel-gradient: linear-gradient(180deg, #161922 0%, #0f1115 100%);
            
            --accent-gold: #ffd700;
            --accent-gold-dim: #8a6d1c;
            --accent-gold-glow: rgba(255, 215, 0, 0.4);
            
            --accent-blue: #4facfe;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --accent-silver: #94a3b8;
            
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --text-dim: #334155;
            
            --border-dark: #1e293b;
            --border-gold: #b4941f;
            
            --font-serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 320px;
            background: var(--bg-panel-gradient);
            border-right: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-shadow: 5px 0 25px rgba(0,0,0,0.6);
            z-index: 10;
            position: relative;
        }

        /* Decorative top border for sidebar */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 1px solid var(--border-dark);
            padding: 4px;
            margin: 0 auto 1.5rem;
            position: relative;
            background: #000;
            box-shadow: 0 0 0 2px #000, 0 0 0 3px var(--accent-gold-dim);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Pure CSS Avatar Placeholder */
        .avatar-inner::after {
            content: '⚔';
            font-size: 3rem;
            color: var(--text-dim);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        .class-title {
            font-family: var(--font-serif);
            color: var(--accent-gold);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 0.4rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .level-badge {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-deep);
            border: 1px solid var(--accent-gold);
            padding: 2px 14px;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* --- Panels --- */
        .panel {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .panel-label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.5rem;
        }

        /* XP Bar */
        .xp-container {
            margin-bottom: 0.5rem;
        }

        .xp-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }

        .progress-track {
            height: 8px;
            background: #000;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid var(--border-dark);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
            width: 65%;
            box-shadow: 0 0 10px var(--accent-gold-glow);
            position: relative;
        }

        /* Points Counter */
        .points-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1rem;
        }

        .points-info {
            display: flex;
            flex-direction: column;
        }

        .points-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main); /* Demoted from Cyan to White */
            line-height: 1;
            font-family: var(--font-serif);
        }

        .points-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Buttons */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-reset {
            color: var(--text-muted);
        }
        
        .btn-reset:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.05);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f1115 0%, #050608 100%);
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(10, 12, 16, 0.95);
            border: 1px solid var(--accent-gold-dim);
            padding: 1rem;
            border-radius: 2px;
            width: 280px;
            opacity: 0;
            transition: opacity 0.2s ease;
            transform: translate(15px, -50%);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-top: 2px solid var(--accent-gold);
            backdrop-filter: blur(4px);
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.6rem;
        }

        .tooltip-title {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .tooltip-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 2px;
            letter-spacing: 0.05em;
        }

        .tooltip-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 1rem;
            font-style: italic;
        }

        .tooltip-stats {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tooltip-stats::before {
            content: '✦';
            font-size: 0.7rem;
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <h1>Kaelen</h1>
            <div class="class-title">Arcane Weaver</div>
            <div class="level-badge">LVL 42</div>
        </div>

        <!-- XP Section -->
        <div class="panel">
            <span class="panel-label">Experience</span>
            <div class="xp-container">
                <div class="xp-label">
                    <span>Progress</span>
                    <span>65,400 / 100,000</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Resources & Actions -->
        <div class="panel">
            <span class="panel-label">Resources</span>
            <div class="points-container">
                <div class="points-info">
                    <span class="points-value" id="points-display">12</span>
                    <span class="points-sub">Skill Points</span>
                </div>
            </div>

            <div class="action-group">
                <button class="btn" onclick="alert('Build Saved!')">Save Build</button>
                <button class="btn btn-reset" onclick="resetTree()">Reset Tree</button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage">
        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1.3; // Increased scale for larger nodes
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        // Expanded layout to fill screen
        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "Unlocks all magic paths. Increases mana regen.", stat: "+5% Mana Regen", unlocked: true, color: "#ffd700" },
            
            // Left Branch: Destruction
            { id: 1, x: -220, y: -180, name: "Fire Affinity", type: "Passive", desc: "Increases fire damage.", stat: "+10% Fire Dmg", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: -220, y: -380, name: "Combustion", type: "Active", desc: "Your spells ignite targets.", stat: "Ignite Chance +2%", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 3, x: -450, y: -280, name: "Inferno", type: "Ultimate", desc: "Creates a zone of fire.", stat: "Area Damage", unlocked: false, color: "#ef4444", parents: [2] },
            { id: 4, x: -40, y: -280, name: "Fireball Mastery", type: "Passive", desc: "Fireballs travel faster.", stat: "+20% Speed", unlocked: false, color: "#ef4444", parents: [1] },

            // Right Branch: Ice
            { id: 5, x: 220, y: -180, name: "Frost Touch", type: "Passive", desc: "Attacks slow enemies.", stat: "Slow 10%", unlocked: false, color: "#4facfe", parents: [0] },
            { id: 6, x: 220, y: -380, name: "Deep Freeze", type: "Passive", desc: "Slows stack up to 50%.", stat: "Max Slow 50%", unlocked: false, color: "#4facfe", parents: [5] },
            { id: 7, x: 450, y: -280, name: "Glacial Storm", type: "Ultimate", desc: "Blizzard effect.", stat: "Heavy Damage", unlocked: false, color: "#4facfe", parents: [6] },
            { id: 8, x: 40, y: -280, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+15% Shield", unlocked: false, color: "#4facfe", parents: [5] },

            // Center Branch: Utility/Summoning
            { id: 9, x: 0, y: -220, name: "Arcane Intellect", type: "Passive", desc: "Boosts intelligence.", stat: "+5 Int", unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: -420, name: "Mana Siphon", type: "Active", desc: "Heal mana on kill.", stat: "Lifesteal Mana", unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: -620, name: "Archmage", type: "Trait", desc: "Ultimate power.", stat: "+10% All Stats", unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom Branch: Defense
            { id: 12, x: 0, y: 180, name: "Mental Fortitude", type: "Defense", desc: "Reduces magic damage taken.", stat: "-10% Dmg Taken", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -180, y: 320, name: "Shield Wall", type: "Defense", desc: "Increases max mana.", stat: "+200 Mana", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 180, y: 320, name: "Evasion", type: "Defense", desc: "Chance to dodge magic.", stat: "+5% Dodge", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // Center the tree initially
            offsetX = width / 2;
            offsetY = height / 2 + 100; // Shift slightly down to center the main mass
            
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Background Grid (Subtle Arcane Grid)
            drawGrid();

            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const gridSize = 60 * scale;
            
            const startX = offsetX % gridSize;
            const startY = offsetY % gridSize;

            ctx.beginPath();
            for (let x = startX; x < width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = startY; y < height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Bezier curve
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineCap = 'round';
            
            if (isPathUnlocked) {
                ctx.lineWidth = 6 * scale;
                // Gold gradient for active path
                const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                grad.addColorStop(0, 'rgba(212, 175, 55, 0.8)');
                grad.addColorStop(1, 'rgba(255, 215, 0, 0.8)');
                ctx.strokeStyle = grad;
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Inner bright line
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                
            } else if (parent.unlocked && !child.unlocked) {
                // Available path
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            } else {
                // Locked path
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.stroke();
            }
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            const radius = (node.type === 'Ultimate' ? 32 : 24) * scale;
            
            // 1. Outer Glow (if unlocked)
            if (node.unlocked) {
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = node.color;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = node.color;
                ctx.fill();
                ctx.restore();
            }

            // 2. Base Shape (Dark background with border)
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = node.unlocked ? 'rgba(20, 20, 25, 0.9)' : '#0f1115';
            ctx.fill();
            
            // Border
            ctx.lineWidth = 3 * scale;
            ctx.strokeStyle = node.unlocked ? '#ffd700' : '#334155';
            if (hoveredNode === node && !node.unlocked) {
                ctx.strokeStyle = '#fff'; // Highlight on hover
            }
            ctx.stroke();
            
            // 3. Runic/Icon Details
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            if (node.unlocked) {
                // Draw a stylized rune shape
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * scale;
                ctx.beginPath();
                // Simple geometric rune
                ctx.moveTo(0, -radius * 0.6);
                ctx.lineTo(0, radius * 0.6);
                ctx.moveTo(-radius * 0.5, 0);
                ctx.lineTo(radius * 0.5, 0);
                // Diamond
                ctx.moveTo(0, -radius * 0.8);
                ctx.lineTo(radius * 0.3, 0);
                ctx.lineTo(0, radius * 0.8);
                ctx.lineTo(-radius * 0.3, 0);
                ctx.closePath();
                ctx.stroke();
            } else {
                // Locked state: simple lock or dim circle
                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.2, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();

            // 4. Hover Ring
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 8, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 5. Label
            ctx.fillStyle = node.unlocked ? '#fff' : '#64748b';
            ctx.font = `${node.unlocked ? 'bold ' : ''}${11 * scale}px var(--font-sans)`;
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + (18 * scale));
            ctx.shadowBlur = 0;
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Colorize type
            ttType.style.color = node.color;
            ttType.style.backgroundColor = node.unlocked ? node.color : 'rgba(255,255,255,0.1)';
            ttType.style.color = node.unlocked ? '#000' : '#fff';

            // Position tooltip
            let left = mouseX + 30;
            let top = mouseY - 50;
            
            // Keep within bounds
            if (left + 280 > width) left = mouseX - 300;
            if (top < 0) top = 10;
            if (top + 180 > height) top = height - 190;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            // Reverse transform to get world coordinates
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            // Check collision
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = node.type === 'Ultimate' ? 32 : 24;
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        // Check parents
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        } else if (!parentsUnlocked) {
                            // Visual feedback for locked dependency could go here
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            // Hover detection
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' ? 32 : 24) + 5; // Add padding
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            isDragging = true;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });
        
        canvas.addEventListener('click', (e) => {
             // Only click if we didn't drag significantly
             // (Simplified: assume if isDragging is false immediately, it was a click)
             // In a robust app, compare start/end mouse pos.
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        // Reset Logic
        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
</html>
