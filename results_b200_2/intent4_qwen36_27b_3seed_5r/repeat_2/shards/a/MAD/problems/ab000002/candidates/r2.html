<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix</title>
    <style>
        :root {
            --bg-deep: #0f0c29;
            --bg-panel: rgba(15, 17, 21, 0.85);
            
            --accent-gold: #f6e05e;
            --accent-gold-dim: #bfa34b;
            --accent-gold-glow: rgba(246, 224, 94, 0.6);
            
            --accent-blue: #4facfe;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --accent-silver: #94a3b8;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --border-dark: rgba(255, 255, 255, 0.1);
            
            /* System fonts to ensure offline compatibility with fallbacks */
            --font-serif: "Times New Roman", Times, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 20% 20%, #1a1a2e 0%, #0f0c29 40%, #000000 100%);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 320px;
            background: rgba(10, 10, 15, 0.95);
            border-right: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            padding: 2.5rem 1.5rem;
            z-index: 20;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        /* Decorative top border */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .avatar-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            padding: 4px;
            margin: 0 auto 1.5rem;
            position: relative;
            background: #000;
            box-shadow: 0 0 0 4px #000, 0 0 20px rgba(246, 224, 94, 0.2);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .avatar-inner::after {
            content: '⚔';
            font-size: 3.5rem;
            color: var(--accent-gold-dim);
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .class-title {
            font-family: var(--font-sans);
            color: var(--accent-gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-top: 0.5rem;
            font-weight: 600;
            opacity: 0.9;
        }

        /* Revised Level Badge: Pill shaped, dark bg, gold border */
        .level-badge {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f1115;
            border: 1px solid var(--accent-gold);
            padding: 4px 16px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* --- Panels --- */
        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .panel-label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* XP Bar */
        .xp-container {
            margin-bottom: 0.5rem;
        }

        .xp-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .progress-track {
            height: 10px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        }

        .progress-fill {
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, #d97706, #f6e05e);
            position: relative;
            box-shadow: 0 0 12px rgba(246, 224, 94, 0.4);
        }
        
        /* Subtle leading edge glow for XP */
        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 20px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6));
        }

        /* --- HUD Overlay (Floating) --- */
        .hud-overlay {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 30;
            pointer-events: none; /* Let clicks pass through around elements */
        }

        .hud-card {
            background: rgba(15, 17, 21, 0.9);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            pointer-events: auto;
            transition: transform 0.2s;
        }
        
        .hud-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 15px rgba(246, 224, 94, 0.1);
        }

        .hud-points {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .hud-points-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
            font-family: var(--font-serif);
        }

        .hud-points-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
            margin-top: 2px;
        }

        .hud-btn {
            background: linear-gradient(180deg, #2a2d35 0%, #151619 100%);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(246, 224, 94, 0.2);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            /* CRITIQUE 1: Scrollable container */
            overflow-y: auto;
            overflow-x: hidden;
            height: 100vh;
            background-color: #050608;
            background-image: radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.4) 0%, transparent 70%);
        }

        /* Custom Scrollbar Styling */
        .main-stage::-webkit-scrollbar {
            width: 8px;
        }
        .main-stage::-webkit-scrollbar-track {
            background: #0f0c29;
        }
        .main-stage::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .main-stage::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .canvas-container {
            /* CRITIQUE 1: Tall internal structure */
            width: 100%;
            height: 1200px; 
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 100px; /* Space from top */
        }

        canvas {
            display: block;
            /* Center the canvas content */
            max-width: 1000px; 
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 17, 21, 0.95);
            border: 1px solid var(--accent-gold-dim);
            padding: 1.2rem;
            border-radius: 4px;
            width: 280px;
            opacity: 0;
            transition: opacity 0.2s ease;
            transform: translate(20px, -50%);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-left: 3px solid var(--accent-gold);
            backdrop-filter: blur(8px);
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.6rem;
        }

        .tooltip-title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tooltip-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 2px;
            letter-spacing: 0.05em;
        }

        .tooltip-desc {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 1rem;
            font-style: italic;
        }

        .tooltip-stats {
            font-size: 0.9rem;
            color: var(--accent-gold);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(246, 224, 94, 0.1);
            padding: 6px 10px;
            border-radius: 4px;
        }

        .tooltip-stats::before {
            content: '✦';
            font-size: 0.8rem;
        }

        /* Animations */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(246, 224, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(246, 224, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(246, 224, 94, 0); }
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <h1>Kaelen</h1>
            <div class="class-title">Arcane Weaver</div>
            <div class="level-badge">LVL 42</div>
        </div>

        <!-- XP Section -->
        <div class="panel">
            <span class="panel-label">Experience</span>
            <div class="xp-container">
                <div class="xp-label">
                    <span>Progress</span>
                    <span>65,400 / 100,000</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>
        
        <!-- Placeholder to fill sidebar space -->
        <div class="panel" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0.5; border: 1px dashed rgba(255,255,255,0.1);">
            <div style="font-size: 2rem; margin-bottom: 1rem;">🛡</div>
            <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Defensive Stance Active</div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage" id="main-stage">
        
        <!-- CRITIQUE 5: Relocated HUD Overlay -->
        <div class="hud-overlay">
            <div class="hud-card">
                <div class="hud-points">
                    <span class="hud-points-val" id="hud-points-display">12</span>
                    <span class="hud-points-label">Skill Points</span>
                </div>
                <div style="width: 1px; height: 30px; background: rgba(255,255,255,0.1);"></div>
                <button class="hud-btn" onclick="alert('Build Saved!')">Save Build</button>
            </div>
        </div>

        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1.2; // Scale factor
        // No offset needed for scrolling container, centering is handled by layout
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        // Coordinates are relative to the canvas center
        const nodes = [
            // Root
            { id: 0, x: 0, y: 800, name: "Arcane Focus", type: "Root", desc: "Unlocks all magic paths. Increases mana regen.", stat: "+5% Mana Regen", unlocked: true, color: "#ffd700" },
            
            // Left Branch: Destruction
            { id: 1, x: -220, y: 620, name: "Fire Affinity", type: "Passive", desc: "Increases fire damage.", stat: "+10% Fire Dmg", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: -220, y: 420, name: "Combustion", type: "Active", desc: "Your spells ignite targets.", stat: "Ignite Chance +2%", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 3, x: -450, y: 320, name: "Inferno", type: "Ultimate", desc: "Creates a zone of fire.", stat: "Area Damage", unlocked: false, color: "#ef4444", parents: [2] },
            { id: 4, x: -40, y: 320, name: "Fireball Mastery", type: "Passive", desc: "Fireballs travel faster.", stat: "+20% Speed", unlocked: false, color: "#ef4444", parents: [1] },

            // Right Branch: Ice
            { id: 5, x: 220, y: 620, name: "Frost Touch", type: "Passive", desc: "Attacks slow enemies.", stat: "Slow 10%", unlocked: false, color: "#4facfe", parents: [0] },
            { id: 6, x: 220, y: 420, name: "Deep Freeze", type: "Passive", desc: "Slows stack up to 50%.", stat: "Max Slow 50%", unlocked: false, color: "#4facfe", parents: [5] },
            { id: 7, x: 450, y: 320, name: "Glacial Storm", type: "Ultimate", desc: "Blizzard effect.", stat: "Heavy Damage", unlocked: false, color: "#4facfe", parents: [6] },
            { id: 8, x: 40, y: 320, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+15% Shield", unlocked: false, color: "#4facfe", parents: [5] },

            // Center Branch: Utility/Summoning
            { id: 9, x: 0, y: 560, name: "Arcane Intellect", type: "Passive", desc: "Boosts intelligence.", stat: "+5 Int", unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: 360, name: "Mana Siphon", type: "Active", desc: "Heal mana on kill.", stat: "Lifesteal Mana", unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: 160, name: "Archmage", type: "Trait", desc: "Ultimate power.", stat: "+10% All Stats", unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom Branch: Defense
            { id: 12, x: 0, y: 980, name: "Mental Fortitude", type: "Defense", desc: "Reduces magic damage taken.", stat: "-10% Dmg Taken", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -180, y: 1120, name: "Shield Wall", type: "Defense", desc: "Increases max mana.", stat: "+200 Mana", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 180, y: 1120, name: "Evasion", type: "Defense", desc: "Chance to dodge magic.", stat: "+5% Dodge", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            draw();
        }

        function getWorldPos(node) {
            // Centering the tree in the canvas
            return {
                x: node.x * scale + (width / 2),
                y: node.y * scale
            };
        }

        function draw() {
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        // CRITIQUE 2: Ley Lines (Glowing energy conduits)
        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Bezier curve for organic feel
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineCap = 'round';
            
            if (isPathUnlocked) {
                // Active Path: Gold Glow
                ctx.lineWidth = 6 * scale;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#f6e05e';
                
                const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
                grad.addColorStop(0, 'rgba(246, 224, 94, 0.8)');
                grad.addColorStop(1, 'rgba(246, 224, 94, 0.8)');
                ctx.strokeStyle = grad;
                ctx.stroke();
                
                // Reset shadow for inner line
                ctx.shadowBlur = 0;
                
                // Inner bright core
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                
            } else if (parent.unlocked && !child.unlocked) {
                // Available path: Dashed Grey
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)'; // #94a3b8 with opacity
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
            } else {
                // Locked path: Faint Ley Line
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(74, 85, 104, 0.3)'; // #4a5568 with opacity
                ctx.stroke();
            }
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            // CRITIQUE 3: Increased size (~60px diameter)
            const radius = (node.type === 'Ultimate' ? 36 : 30) * scale;
            
            // 1. Outer Glow (Active Node)
            if (node.unlocked) {
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = node.color;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = node.color;
                ctx.fill();
                ctx.restore();
            }

            // 2. Base Shape
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            
            // CRITIQUE 3: Locked Nodes are 'hollow' rings with dark fill
            if (!node.unlocked) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.fill();
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            } else {
                // Unlocked Nodes
                ctx.fillStyle = 'rgba(20, 20, 25, 0.95)';
                ctx.fill();
                ctx.lineWidth = 3 * scale;
                ctx.strokeStyle = node.color;
            }
            
            // Hover Highlight
            if (hoveredNode === node && !node.unlocked) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * scale;
            }
            ctx.stroke();
            
            // 3. Runic/Icon Details
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            if (node.unlocked) {
                // Draw a stylized rune shape
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * scale;
                ctx.beginPath();
                // Simple geometric rune
                ctx.moveTo(0, -radius * 0.6);
                ctx.lineTo(0, radius * 0.6);
                ctx.moveTo(-radius * 0.5, 0);
                ctx.lineTo(radius * 0.5, 0);
                // Diamond
                ctx.moveTo(0, -radius * 0.8);
                ctx.lineTo(radius * 0.3, 0);
                ctx.lineTo(0, radius * 0.8);
                ctx.lineTo(-radius * 0.3, 0);
                ctx.closePath();
                ctx.stroke();
            } else {
                // CRITIQUE 3: Locked icon
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.25, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();

            // 4. Label
            ctx.fillStyle = node.unlocked ? '#fff' : '#94a3b8';
            ctx.font = `${node.unlocked ? 'bold ' : ''}${12 * scale}px var(--font-sans)`;
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,1)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + (20 * scale));
            ctx.shadowBlur = 0;
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Colorize type
            ttType.style.color = node.color;
            ttType.style.backgroundColor = node.unlocked ? node.color : 'rgba(255,255,255,0.1)';
            ttType.style.color = node.unlocked ? '#000' : '#fff';

            // Position tooltip
            let left = mouseX + 30;
            let top = mouseY - 50;
            
            // Keep within bounds of the MAIN STAGE, not just canvas
            const stageRect = document.getElementById('main-stage').getBoundingClientRect();
            
            if (left + 280 > stageRect.width) left = mouseX - 300;
            if (top < 0) top = 10;
            if (top + 180 > stageRect.height) top = stageRect.height - 190;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            // Reverse transform to get world coordinates
            const wx = (mouseX - (width/2)) / scale;
            const wy = (mouseY) / scale;
            
            // Check collision
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = node.type === 'Ultimate' ? 36 : 30;
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        // Check parents
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('hud-points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Hover detection
            const wx = (mouseX - (width/2)) / scale;
            const wy = (mouseY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' ? 36 : 30) + 5; // Add padding
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });
        
        canvas.addEventListener('click', (e) => {
             const rect = canvas.getBoundingClientRect();
             checkClick(e.clientX - rect.left, e.clientY - rect.top);
        });

        // Reset Logic
        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('hud-points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
</html>
