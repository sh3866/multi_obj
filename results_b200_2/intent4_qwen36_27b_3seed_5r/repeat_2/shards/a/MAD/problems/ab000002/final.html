<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Weaver: Skill Matrix</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #020406;
            --bg-panel: rgba(10, 15, 20, 0.85);
            
            --gold-primary: #fbbf24;
            --gold-dim: #a16207;
            --gold-glow: rgba(251, 191, 36, 0.4);
            
            --stone-active: #475569;
            --stone-dim: #1e293b;
            --stone-border: #334155;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Typography */
            --font-display: "Cinzel", "Playfair Display", "Times New Roman", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            /* Critique 5: Atmospheric Void/Parchment Background */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(251, 191, 36, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.6) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar (Critique 3) --- */
        .sidebar {
            width: 280px;
            /* Glassmorphism effect */
            background: var(--bg-panel);
            border-right: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            z-index: 20;
            position: relative;
            box-shadow: 10px 0 40px rgba(0,0,0,0.6);
        }

        /* Decorative Top Line */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--gold-dim);
            padding: 4px;
            margin: 0 auto 1.2rem;
            position: relative;
            background: #000;
            box-shadow: 0 0 0 2px #020406, 0 0 25px rgba(251, 191, 36, 0.15);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #1e293b, #000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* SVG Avatar Icon */
        .avatar-inner svg {
            width: 60%;
            height: 60%;
            fill: var(--gold-dim);
            opacity: 0.9;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.02em;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .class-title {
            font-family: var(--font-ui);
            color: var(--gold-primary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-top: 0.5rem;
            font-weight: 700;
        }

        /* --- Panels --- */
        .panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            position: relative;
        }

        .panel-label {
            display: block;
            font-family: var(--font-display);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        /* Level & XP Section */
        .level-badge {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 0.8rem;
        }
        
        .level-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--text-main);
        }
        
        .level-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .progress-track {
            height: 4px;
            background: #0f172a;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }

        .progress-fill {
            height: 100%;
            width: 68%;
            background: linear-gradient(90deg, var(--gold-dim), var(--gold-primary));
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* Skill Points (Critique 3) */
        .points-display {
            text-align: center;
            padding: 0.5rem 0;
        }
        .points-val {
            font-family: var(--font-ui); /* Numerals clean */
            font-size: 2.2rem;
            color: var(--text-main);
            line-height: 1;
            display: block;
            letter-spacing: -1px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
        }
        .points-label {
            font-size: 0.65rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.3rem;
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px 16px;
            font-size: 0.9rem;
        }
        
        .stat-name {
            color: var(--text-muted);
            font-weight: 500;
            text-align: left;
        }
        
        .stat-val {
            color: var(--text-main);
            font-family: var(--font-ui);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* --- HUD Overlay --- */
        .hud-overlay {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 30;
            pointer-events: none;
        }

        /* Critique 4: Ghost Button */
        .hud-btn-ghost {
            pointer-events: auto;
            background: transparent;
            color: var(--gold-primary);
            border: 1px solid var(--gold-dim);
            padding: 0.6rem 1.8rem;
            border-radius: 2px;
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .hud-btn-ghost:hover {
            background: rgba(251, 191, 36, 0.1);
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
            transform: translateY(-1px);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            height: 100vh;
            /* Noise Texture Overlay */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* Critique 2: Screen Title */
        .screen-title {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .screen-title h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.3em;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8);
        }

        .screen-title p {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            color: var(--gold-dim);
            letter-spacing: 0.15em;
            margin-top: 0.4rem;
            text-transform: uppercase;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            cursor: grab;
        }
        
        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(10, 15, 20, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.2rem;
            border-radius: 4px;
            width: 260px;
            opacity: 0;
            transition: opacity 0.15s ease;
            transform: translate(20px, -50%);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border-left: 2px solid var(--gold-primary);
            backdrop-filter: blur(10px);
        }

        .tooltip.visible { opacity: 1; }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.6rem;
        }

        .tooltip-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .tooltip-type {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #000;
            background: var(--gold-primary);
            padding: 3px 8px;
            border-radius: 2px;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .tooltip-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 0.8rem;
            font-family: var(--font-ui);
        }

        .tooltip-stats {
            font-size: 0.8rem;
            color: var(--gold-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(251, 191, 36, 0.1);
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <!-- Simple SVG Mage Icon -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 22h20L12 2zm0 3.5L18.5 20H5.5L12 5.5zM12 10a2 2 0 100 4 2 2 0 000-4z"/></svg>
                </div>
            </div>
            <h1>Kaelen</h1>
            <div class="class-title">Arcane Weaver</div>
        </div>

        <!-- XP Section -->
        <div class="panel">
            <div class="level-badge">
                <span class="level-text">Level 12</span>
                <span class="level-sub">65,400 / 100,000 XP</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- Points -->
        <div class="panel" style="border-color: rgba(251, 191, 36, 0.2); background: rgba(251, 191, 36, 0.02);">
            <div class="points-display">
                <span class="points-val" id="hud-points-display">12</span>
                <span class="points-label">Available Points</span>
            </div>
        </div>

        <!-- Attributes -->
        <div class="panel">
            <span class="panel-label">Attributes</span>
            <div class="stats-grid">
                <span class="stat-name">Strength</span>
                <span class="stat-val">142</span>
                
                <span class="stat-name">Agility</span>
                <span class="stat-val">89</span>
                
                <span class="stat-name">Intelligence</span>
                <span class="stat-val" style="color: var(--gold-primary);">215</span>
                
                <span class="stat-name">Vitality</span>
                <span class="stat-val">110</span>
                
                <span class="stat-name">Luck</span>
                <span class="stat-val">45</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage" id="main-stage">
        
        <!-- Critique 2: Title -->
        <div class="screen-title">
            <h2>Skill Matrix</h2>
            <p>Arcane Progression</p>
        </div>

        <!-- HUD Overlay -->
        <div class="hud-overlay">
            <button class="hud-btn-ghost" onclick="alert('Build Saved!')">Save Build</button>
        </div>

        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        
        // Camera/Pan State
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        let scale = 1.1; 
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Dense Skill Matrix (Critique 1) ---
        // A dense, radiating network. 
        const nodes = [
            // TIER 0: Root
            { id: 0, x: 0, y: 0, name: "Arcane Core", type: "Root", desc: "The source of all magic. Unlocks the skill tree.", stat: "Unlocks Tree", unlocked: true, color: "#fbbf24" },
            
            // TIER 1: Primary Branches (The 5 Pillars)
            { id: 1, x: -220, y: -220, name: "Pyromancy", type: "Branch", desc: "Mastery of flame and destruction.", stat: "+10% Fire Dmg", unlocked: true, color: "#fbbf24", parents: [0] },
            { id: 2, x: 220, y: -220, name: "Cryomancy", type: "Branch", desc: "Control over frost and entropy.", stat: "+10% Ice Dmg", unlocked: true, color: "#fbbf24", parents: [0] },
            { id: 3, x: 0, y: -350, name: "Void Arts", type: "Branch", desc: "Bending reality and space.", stat: "+5% Cast Speed", unlocked: false, color: "#475569", parents: [0] },
            { id: 4, x: -220, y: 220, name: "Fortification", type: "Branch", desc: "Unyielding magical defense.", stat: "+10% Armor", unlocked: true, color: "#fbbf24", parents: [0] },
            { id: 5, x: 220, y: 220, name: "Siphoning", type: "Branch", desc: "Draining life and mana from foes.", stat: "+10% Lifesteal", unlocked: false, color: "#475569", parents: [0] },

            // TIER 2: Secondary (Pyro)
            { id: 6, x: -400, y: -350, name: "Ignite", type: "Passive", desc: "Spells have a chance to burn.", stat: "DoT Over Time", unlocked: true, color: "#fbbf24", parents: [1] },
            { id: 7, x: -150, y: -350, name: "Heat Wave", type: "Passive", desc: "Area damage boost around you.", stat: "+15% AoE", unlocked: false, color: "#475569", parents: [1] },

            // TIER 2: Secondary (Cryo)
            { id: 8, x: 150, y: -350, name: "Chill", type: "Passive", desc: "Attacks slow enemies.", stat: "Slow 15%", unlocked: true, color: "#fbbf24", parents: [2] },
            { id: 9, x: 400, y: -350, name: "Shatter", type: "Passive", desc: "Critical hits on frozen foes.", stat: "Crit Dmg +20%", unlocked: false, color: "#475569", parents: [2] },

            // TIER 2: Secondary (Void)
            { id: 10, x: -150, y: -500, name: "Blink", type: "Active", desc: "Short range teleport.", stat: "Cooldown 5s", unlocked: false, color: "#475569", parents: [3] },
            { id: 11, x: 150, y: -500, name: "Mana Void", type: "Passive", desc: "Drain enemy mana pool.", stat: "Mana Lifesteal", unlocked: false, color: "#475569", parents: [3] },

            // TIER 2: Secondary (Defense)
            { id: 12, x: -400, y: 350, name: "Iron Skin", type: "Passive", desc: "Reduce physical damage taken.", stat: "-20% Phys Dmg", unlocked: false, color: "#475569", parents: [4] },
            { id: 13, x: -150, y: 350, name: "Shield", type: "Active", desc: "Create a magic barrier.", stat: "+150 Shield", unlocked: false, color: "#475569", parents: [4] },
            
            // TIER 2: Secondary (Life)
            { id: 14, x: 150, y: 350, name: "Vampirism", type: "Passive", desc: "Heal when striking enemies.", stat: "Heal 5%", unlocked: false, color: "#475569", parents: [5] },
            { id: 15, x: 400, y: 350, name: "Regen", type: "Passive", desc: "Slow health regeneration.", stat: "+1% HP/s", unlocked: false, color: "#475569", parents: [5] },

            // TIER 3: Advanced (Pyro)
            { id: 16, x: -500, y: -450, name: "Inferno", type: "Ultimate", desc: "Call down a massive fireball.", stat: "Huge Dmg", unlocked: false, color: "#475569", parents: [6] },
            { id: 17, x: -280, y: -550, name: "Phoenix", type: "Ultimate", desc: "Resurrect once per combat.", stat: "1% HP Revive", unlocked: false, color: "#475569", parents: [7, 6] },

            // TIER 3: Advanced (Cryo)
            { id: 18, x: 280, y: -550, name: "Absolute Zero", type: "Ultimate", desc: "Freeze all enemies in range.", stat: "Stun 3s", unlocked: false, color: "#475569", parents: [9, 8] },

            // TIER 3: Advanced (Void)
            { id: 19, x: 0, y: -650, name: "Archmage", type: "Trait", desc: "Master of the arcane arts.", stat: "+All Stats", unlocked: false, color: "#475569", parents: [10, 11] },
            
            // TIER 3: Advanced (Defense)
            { id: 20, x: -280, y: 550, name: "Fortress", type: "Ultimate", desc: "Become unbreakable.", stat: "Invuln 1s", unlocked: false, color: "#475569", parents: [12, 13] },
            
            // TIER 3: Advanced (Life)
            { id: 21, x: 280, y: 550, name: "Necrosis", type: "Ultimate", desc: "Rot enemies over time.", stat: "HP Decay", unlocked: false, color: "#475569", parents: [14, 15] },

            // TIER 4: Apex
            { id: 22, x: 0, y: -800, name: "Cosmic Weaver", type: "Apex", desc: "Ultimate cosmic power.", stat: "Godlike", unlocked: false, color: "#475569", parents: [19] },
            { id: 23, x: 0, y: 700, name: "Immortal", type: "Apex", desc: "Death cannot hold you.", stat: "Deathproof", unlocked: false, color: "#475569", parents: [20, 21] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // Center Camera
            if (panX === 0 && panY === 0) {
                panX = width / 2;
                panY = height / 2 - 50;
            }
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + panX,
                y: node.y * scale + panY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // 1. Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // 2. Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        // Critique 1: Solid lines, distinct states
        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathActive = parent.unlocked && child.unlocked;
            const isPathAvailable = parent.unlocked && !child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Bezier curve
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineCap = 'round';
            
            if (isPathActive) {
                // Active Path: Solid Gold
                ctx.lineWidth = 2 * scale; // Critique 1: stroke-width 2px equivalent
                ctx.shadowBlur = 0; // No heavy glow on lines to keep it clean
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.6)'; 
                ctx.stroke();
                
            } else if (isPathAvailable) {
                // Available path: Solid dim gold
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.15)';
                ctx.stroke();
            } else {
                // Locked path: Solid Dark Grey/Blue
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(71, 85, 105, 0.2)';
                ctx.stroke();
            }
        }

        // Hexagon Drawing Helper
        function drawHexagon(ctx, x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6; 
                const hx = x + radius * Math.cos(angle);
                const hy = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            // Size variation
            const radius = (node.type === 'Ultimate' || node.type === 'Apex' ? 32 : 20) * scale;
            
            // 1. Base Shape (Hexagon)
            drawHexagon(ctx, pos.x, pos.y, radius);
            
            // Critique 1: States
            if (node.unlocked) {
                // Active: Filled Gold
                ctx.fillStyle = '#0f172a'; // Dark center
                ctx.fill();
                ctx.lineWidth = 3 * scale;
                ctx.strokeStyle = '#fbbf24'; // Gold Border
                
                // Glow for Active
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset
            } else {
                // Locked: Dark Grey/Blue
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = '#334155'; // Stone Grey Border
                ctx.stroke();
            }
            
            // Hover Highlight (White border)
            if (hoveredNode === node) {
                drawHexagon(ctx, pos.x, pos.y, radius);
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            }
            
            // 2. Icon Details (Rune)
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            if (node.unlocked) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * scale;
                ctx.beginPath();
                // Rune
                ctx.moveTo(0, -radius * 0.6);
                ctx.lineTo(0, radius * 0.6);
                ctx.moveTo(-radius * 0.4, 0);
                ctx.lineTo(radius * 0.4, 0);
                ctx.stroke();
            } else {
                // Locked Icon (Padlock simplified)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(0, 2*scale, radius * 0.25, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();

            // 3. Label
            // Critique 4: Typography hierarchy
            ctx.font = `${node.unlocked ? '600' : '400'} ${11 * scale}px var(--font-ui)`;
            ctx.fillStyle = node.unlocked ? '#fff' : '#64748b';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,1)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + (16 * scale));
            ctx.shadowBlur = 0;
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            let left = mouseX + 30;
            let top = mouseY - 50;
            
            const stageRect = document.getElementById('main-stage').getBoundingClientRect();
            
            // Boundary checks
            if (left + 280 > stageRect.width) left = mouseX - 280;
            if (top < 0) top = 10;
            if (top + 180 > stageRect.height) top = stageRect.height - 190;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - panX) / scale;
            const wy = (mouseY - panY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' || node.type === 'Apex' ? 32 : 20);
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('hud-points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                panX += dx;
                panY += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                draw();
                hideTooltip();
                hoveredNode = null;
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const wx = (mouseX - panX) / scale;
            const wy = (mouseY - panY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' || node.type === 'Apex' ? 32 : 20) + 5; 
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                container.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                } else {
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                container.style.cursor = 'grab';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        resize();

    </script>
</body>
