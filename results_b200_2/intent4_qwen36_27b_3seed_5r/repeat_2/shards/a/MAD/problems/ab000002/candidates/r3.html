<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascension: Skill Matrix</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: rgba(13, 13, 16, 0.9);
            
            /* Palette */
            --accent-gold: #fbbf24;
            --accent-gold-dim: #78350f;
            --accent-gold-glow: rgba(251, 191, 36, 0.5);
            
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --accent-red: #f87171;
            --accent-silver: #94a3b8;
            
            --text-main: #f8fafc;
            --text-muted: #64748b;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(251, 191, 36, 0.3);
            
            /* Fonts */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-display: "Georgia", "Times New Roman", serif;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            /* Critique 4: Atmospheric Depth via CSS Radial Gradients */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 20, 35, 0.8) 0%, transparent 80%),
                radial-gradient(circle at 20% 30%, rgba(76, 29, 149, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(14, 116, 144, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 300px;
            background: rgba(5, 5, 8, 0.95);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            z-index: 20;
            position: relative;
            backdrop-filter: blur(12px);
            box-shadow: 15px 0 40px rgba(0,0,0,0.6);
        }

        /* Top decorative line */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold-dim);
            padding: 3px;
            margin: 0 auto 1.2rem;
            position: relative;
            background: #000;
            box-shadow: 0 0 0 3px #050508, 0 0 25px rgba(251, 191, 36, 0.15);
            transition: box-shadow 0.3s ease;
        }
        
        .avatar-ring:hover {
            box-shadow: 0 0 0 3px #050508, 0 0 35px rgba(251, 191, 36, 0.3);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #1e293b, #020617);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .avatar-inner::after {
            content: '⚔';
            font-size: 3rem;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.02em;
            font-weight: 400;
        }

        .class-title {
            font-family: var(--font-ui);
            color: var(--accent-gold);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-top: 0.4rem;
            font-weight: 700;
        }

        .level-badge {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f1115;
            border: 1px solid var(--accent-gold-dim);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* --- Panels --- */
        .panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            position: relative;
            overflow: hidden;
        }

        .panel-label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        /* XP Bar */
        .progress-track {
            height: 6px;
            background: #000;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            width: 68%;
            background: linear-gradient(90deg, #b45309, var(--accent-gold));
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        /* Critique 1: Character Stats Panel */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px 15px;
        }
        
        .stat-row {
            display: contents;
        }
        
        .stat-name {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .stat-val {
            color: var(--text-main);
            font-family: var(--font-display);
            font-size: 0.95rem;
            text-align: right;
            text-shadow: 0 0 8px rgba(255,255,255,0.1);
        }

        /* --- HUD Overlay --- */
        .hud-overlay {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 30;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 0.6rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        .hud-points {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .hud-points-val {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
            font-family: var(--font-display);
        }

        .hud-points-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
            margin-top: 2px;
        }

        /* Critique 3: Ghost Button for Save */
        .hud-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(251, 191, 36, 0.05);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden; /* Hide scrollbars for cleaner look, we'll scroll via JS or CSS transform */
            height: 100vh;
        }

        /* Subtle Grid Pattern Overlay */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            cursor: grab;
        }
        
        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 17, 21, 0.95);
            border: 1px solid var(--accent-gold-dim);
            padding: 1.2rem;
            border-radius: 4px;
            width: 260px;
            opacity: 0;
            transition: opacity 0.2s ease;
            transform: translate(20px, -50%);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-left: 3px solid var(--accent-gold);
            backdrop-filter: blur(10px);
        }

        .tooltip.visible { opacity: 1; }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.6rem;
        }

        .tooltip-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tooltip-type {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
            padding: 3px 6px;
            border-radius: 2px;
            letter-spacing: 0.05em;
        }

        .tooltip-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 0.8rem;
        }

        .tooltip-stats {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.1);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <h1>Kaelen</h1>
            <div class="class-title">Arcane Weaver</div>
            <div class="level-badge">LVL 42</div>
        </div>

        <!-- XP Section -->
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <span class="panel-label" style="margin:0;">Experience</span>
                <span style="font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-display);">65,400 / 100,000</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- Critique 1: Character Stats Panel -->
        <div class="panel">
            <span class="panel-label">Attributes</span>
            <div class="stats-grid">
                <div class="stat-row">
                    <span class="stat-name">Strength</span>
                    <span class="stat-val">142</span>
                </div>
                <div class="stat-row">
                    <span class="stat-name">Agility</span>
                    <span class="stat-val">89</span>
                </div>
                <div class="stat-row">
                    <span class="stat-name">Intelligence</span>
                    <span class="stat-val" style="color: var(--accent-blue);">215</span>
                </div>
                <div class="stat-row">
                    <span class="stat-name">Vitality</span>
                    <span class="stat-val">110</span>
                </div>
                <div class="stat-row">
                    <span class="stat-name">Luck</span>
                    <span class="stat-val">45</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage" id="main-stage">
        <div class="grid-overlay"></div>
        
        <!-- HUD Overlay -->
        <div class="hud-overlay">
            <div class="hud-card">
                <div class="hud-points">
                    <span class="hud-points-val" id="hud-points-display">12</span>
                    <span class="hud-points-label">Skill Points</span>
                </div>
                <div style="width: 1px; height: 24px; background: rgba(255,255,255,0.1);"></div>
                <button class="hud-btn" onclick="alert('Build Saved!')">Save Build</button>
            </div>
        </div>

        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        
        // Camera/Pan State
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        let scale = 1.3; // Slightly larger scale
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree (Dense, Multi-Tiered) ---
        // Center is roughly (0,0) in world space
        const nodes = [
            // TIER 0: Root
            { id: 0, x: 0, y: 0, name: "Arcane Core", type: "Root", desc: "The source of all power.", stat: "Unlocks Tree", unlocked: true, color: "#fbbf24" },
            
            // TIER 1: Primary Branches
            { id: 1, x: -200, y: -150, name: "Fire Adept", type: "Passive", desc: "Affinity for flames.", stat: "+10% Fire Dmg", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: 200, y: -150, name: "Frost Adept", type: "Passive", desc: "Affinity for ice.", stat: "+10% Ice Dmg", unlocked: false, color: "#38bdf8", parents: [0] },
            { id: 3, x: 0, y: -250, name: "Void Walker", type: "Passive", desc: "Manipulate space.", stat: "+5% Speed", unlocked: false, color: "#c084fc", parents: [0] },
            { id: 4, x: 0, y: 150, name: "Iron Will", type: "Defense", desc: "Mental resistance.", stat: "+10% Resists", unlocked: false, color: "#94a3b8", parents: [0] },

            // TIER 2: Fire Branch
            { id: 5, x: -350, y: -280, name: "Ignite", type: "Active", desc: "Spells burn enemies.", stat: "DoT Over Time", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 6, x: -100, y: -280, name: "Heat Wave", type: "Passive", desc: "Area damage boost.", stat: "+15% AoE", unlocked: false, color: "#ef4444", parents: [1] },

            // TIER 2: Ice Branch
            { id: 7, x: 100, y: -280, name: "Chill", type: "Passive", desc: "Slows enemies.", stat: "Slow 15%", unlocked: false, color: "#38bdf8", parents: [2] },
            { id: 8, x: 350, y: -280, name: "Shatter", type: "Active", desc: "Crit frozen foes.", stat: "Crit Dmg +20%", unlocked: false, color: "#38bdf8", parents: [2] },

            // TIER 2: Void Branch
            { id: 9, x: -150, y: -400, name: "Teleport", type: "Active", desc: "Short range blink.", stat: "Cooldown 5s", unlocked: false, color: "#c084fc", parents: [3] },
            { id: 10, x: 150, y: -400, name: "Mana Void", type: "Passive", desc: "Drain enemy mana.", stat: "Mana Lifesteal", unlocked: false, color: "#c084fc", parents: [3] },

            // TIER 2: Defense Branch
            { id: 11, x: -150, y: 300, name: "Shield", type: "Defense", desc: "Magic barrier.", stat: "+150 Shield", unlocked: false, color: "#94a3b8", parents: [4] },
            { id: 12, x: 150, y: 300, name: "Regen", type: "Defense", desc: "Slow health regen.", stat: "+1% HP/s", unlocked: false, color: "#94a3b8", parents: [4] },

            // TIER 3: Advanced
            { id: 13, x: -450, y: -450, name: "Inferno", type: "Ultimate", desc: "Massive fireball.", stat: "Huge Damage", unlocked: false, color: "#ef4444", parents: [5] },
            { id: 14, x: 450, y: -450, name: "Blizzard", type: "Ultimate", desc: "Ice storm.", stat: "Stun 2s", unlocked: false, color: "#38bdf8", parents: [8] },
            { id: 15, x: 0, y: -550, name: "Archmage", type: "Trait", desc: "Master of magic.", stat: "+All Stats", unlocked: false, color: "#c084fc", parents: [9, 10] }, // Multi-parent
            
            // TIER 3: Defense
            { id: 16, x: -250, y: 450, name: "Fortress", type: "Ultimate", desc: "Unbreakable.", stat: "Invuln 1s", unlocked: false, color: "#94a3b8", parents: [11] },
            { id: 17, x: 250, y: 450, name: "Vampire", type: "Ultimate", desc: "Life drain.", stat: "Heal 50%", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // Initial Centering
            if (panX === 0 && panY === 0) {
                panX = width / 2;
                panY = height / 4; // Shift up slightly to see more tree
            }
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + panX,
                y: node.y * scale + panY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        // Critique 5: Glowing Energy Streams
        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isAvailable = parent.unlocked && !child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Bezier curve for organic feel
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineCap = 'round';
            
            if (isPathUnlocked) {
                // Active Path: Gold Glow
                ctx.lineWidth = 4 * scale;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fbbf24';
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)';
                ctx.stroke();
                
                // Inner core
                ctx.shadowBlur = 0;
                ctx.lineWidth = 1.5 * scale;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                
            } else if (isAvailable) {
                // Available path: Dashed dim gold
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.2)';
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            } else {
                // Locked path: Faint dark grey
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(74, 85, 104, 0.15)';
                ctx.stroke();
            }
        }

        // Critique 2: Geometric Hexagons
        function drawHexagon(ctx, x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6; // Pointy top
                const hx = x + radius * Math.cos(angle);
                const hy = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            // Critique 3: Increased Scale
            const radius = (node.type === 'Ultimate' ? 32 : 26) * scale;
            
            // 1. Outer Glow (Active Node)
            if (node.unlocked) {
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = node.color;
                drawHexagon(ctx, pos.x, pos.y, radius + 2);
                ctx.fillStyle = node.color;
                ctx.fill();
                ctx.restore();
            }

            // 2. Base Shape (Hexagon)
            drawHexagon(ctx, pos.x, pos.y, radius);
            
            // Critique 3: Locked vs Unlocked Styling
            if (!node.unlocked) {
                ctx.fillStyle = 'rgba(20, 20, 25, 0.9)';
                ctx.fill();
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            } else {
                ctx.fillStyle = '#0f1115';
                ctx.fill();
                ctx.lineWidth = 3 * scale;
                ctx.strokeStyle = node.color;
            }
            
            // Hover Highlight
            if (hoveredNode === node) {
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = node.unlocked ? '#fff' : 'rgba(255,255,255,0.5)';
                ctx.stroke();
            } else {
                ctx.stroke();
            }
            
            // 3. Icon Details
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            if (node.unlocked) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * scale;
                ctx.beginPath();
                // Simple geometric rune
                ctx.moveTo(0, -radius * 0.5);
                ctx.lineTo(0, radius * 0.5);
                ctx.moveTo(-radius * 0.4, 0);
                ctx.lineTo(radius * 0.4, 0);
                ctx.stroke();
            } else {
                // Locked Icon (Padlock simplified)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(0, 2*scale, radius * 0.2, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();

            // 4. Label
            ctx.fillStyle = node.unlocked ? '#fff' : '#64748b';
            ctx.font = `${node.unlocked ? '600' : '400'} ${11 * scale}px var(--font-ui)`;
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,1)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + (16 * scale));
            ctx.shadowBlur = 0;
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            ttType.style.color = node.unlocked ? '#000' : '#fff';
            ttType.style.backgroundColor = node.unlocked ? node.color : 'rgba(255,255,255,0.1)';

            let left = mouseX + 30;
            let top = mouseY - 50;
            
            const stageRect = document.getElementById('main-stage').getBoundingClientRect();
            
            if (left + 280 > stageRect.width) left = mouseX - 300;
            if (top < 0) top = 10;
            if (top + 180 > stageRect.height) top = stageRect.height - 190;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            // Convert screen to world
            const wx = (mouseX - panX) / scale;
            const wy = (mouseY - panY) / scale;
            
            // Hexagon Hit Detection (Approximate with circle for simplicity in this demo)
            // Or strictly check distance
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' ? 32 : 26);
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('hud-points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        // Panning Logic
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                panX += dx;
                panY += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                draw();
                hideTooltip();
                hoveredNode = null;
                return;
            }

            // Hover Logic
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const wx = (mouseX - panX) / scale;
            const wy = (mouseY - panY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' ? 32 : 26) + 5; 
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                container.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                } else {
                    // Update position if dragging tooltip
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                container.style.cursor = 'grab';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        // --- Init ---
        resize();

    </script>
</body>
</html>
