<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Weaver: Skill Matrix</title>
    <style>
        :root {
            /* Colors */
            --bg-deep: #050507;
            --bg-panel: rgba(18, 18, 24, 0.85);
            
            --accent-gold: #fbbf24;
            --accent-gold-dark: #b45309;
            --accent-gold-glow: rgba(251, 191, 36, 0.4);
            
            --accent-cyan: #22d3ee;
            --accent-cyan-dim: #0891b2;
            --accent-cyan-glow: rgba(34, 211, 238, 0.4);
            
            --accent-stone: #475569;
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            
            --border-ui: #334155;
            
            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-display: "Georgia", "Times New Roman", serif;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            /* Critique 4: Atmospheric Depth & Noise */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, transparent 100%),
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(251, 191, 36, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 250px;
            background: rgba(5, 5, 8, 0.95);
            border-right: 1px solid var(--border-ui);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 20;
            position: relative;
            backdrop-filter: blur(8px);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        /* Top decorative accent */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold-dark);
            padding: 3px;
            margin: 0 auto 1rem;
            position: relative;
            background: #000;
            box-shadow: 0 0 0 4px #050508, 0 0 20px rgba(251, 191, 36, 0.1);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #1e293b, #020617);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .avatar-inner::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='%23fbbf24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z'/%3E%3C/svg%3E") center/contain no-repeat;
            opacity: 0.8;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.6rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.03em;
            font-weight: 400;
        }

        .class-title {
            font-family: var(--font-ui);
            color: var(--accent-gold);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 0.3rem;
            font-weight: 700;
        }

        /* --- Panels --- */
        .panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-ui);
            border-radius: 4px; /* Critique 3: Consistent Geometry */
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .panel-label {
            display: block;
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.6rem;
            font-weight: 700;
        }

        /* XP Bar */
        .progress-track {
            height: 6px;
            background: #0f172a;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 8px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            width: 68%;
            background: linear-gradient(90deg, var(--accent-gold-dark), var(--accent-gold));
            box-shadow: 0 0 8px var(--accent-gold-glow);
        }

        /* Critique 1: Skill Points Counter (Moved to Sidebar) */
        .points-display {
            text-align: center;
            margin-top: 0.5rem;
        }
        .points-val {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--text-main);
            line-height: 1;
            display: block;
        }
        .points-label {
            font-size: 0.65rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Critique 3: Strict Two-Column Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 12px;
            font-size: 0.85rem;
        }
        
        .stat-name {
            color: var(--text-muted);
            font-weight: 500;
            text-align: left;
        }
        
        .stat-val {
            color: var(--text-main);
            font-family: var(--font-display);
            text-align: right;
            text-shadow: 0 0 5px rgba(255,255,255,0.05);
        }

        /* --- HUD Overlay --- */
        .hud-overlay {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 30;
            pointer-events: none;
        }

        /* Critique 5: Primary Action Button */
        .hud-btn-primary {
            pointer-events: auto;
            background: var(--accent-gold);
            color: #0f172a;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
            transition: all 0.2s ease;
        }

        .hud-btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }
        
        .hud-btn-primary:active {
            transform: translateY(1px);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            height: 100vh;
            /* Critique 4: Void/Parchment Texture via CSS Noise */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            cursor: grab;
        }
        
        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 17, 21, 0.95);
            border: 1px solid var(--border-ui);
            padding: 1rem;
            border-radius: 4px;
            width: 240px;
            opacity: 0;
            transition: opacity 0.15s ease;
            transform: translate(15px, -50%);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-left: 3px solid var(--accent-cyan);
            backdrop-filter: blur(8px);
        }

        .tooltip.visible { opacity: 1; }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .tooltip-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tooltip-type {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #fff;
            background: var(--accent-cyan-dim);
            padding: 2px 6px;
            border-radius: 2px;
            letter-spacing: 0.05em;
        }

        .tooltip-desc {
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 0.6rem;
        }

        .tooltip-stats {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 211, 238, 0.1);
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid rgba(34, 211, 238, 0.1);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <h1>Kaelen</h1>
            <div class="class-title">Arcane Weaver</div>
        </div>

        <!-- XP Section -->
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <span class="panel-label" style="margin:0;">Experience</span>
                <span style="font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-display);">65,400 / 100,000</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- Critique 2: Skill Points Moved Here -->
        <div class="panel">
            <div class="points-display">
                <span class="points-val" id="hud-points-display">12</span>
                <span class="points-label">Available Points</span>
            </div>
        </div>

        <!-- Critique 3: Grid Layout for Attributes -->
        <div class="panel">
            <span class="panel-label">Attributes</span>
            <div class="stats-grid">
                <span class="stat-name">Strength</span>
                <span class="stat-val">142</span>
                
                <span class="stat-name">Agility</span>
                <span class="stat-val">89</span>
                
                <span class="stat-name">Intelligence</span>
                <span class="stat-val" style="color: var(--accent-cyan);">215</span>
                
                <span class="stat-name">Vitality</span>
                <span class="stat-val">110</span>
                
                <span class="stat-name">Luck</span>
                <span class="stat-val">45</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage" id="main-stage">
        <!-- HUD Overlay -->
        <div class="hud-overlay">
            <button class="hud-btn-primary" onclick="alert('Build Saved!')">Save Build</button>
        </div>

        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        
        // Camera/Pan State
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        let scale = 1.4; // Zoomed out slightly to fit the dense matrix
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Dense Skill Matrix ---
        // Expanded to 5 tiers, branching out significantly.
        // Coords are relative to a center point (0,0)
        const nodes = [
            // TIER 0: Root
            { id: 0, x: 0, y: 0, name: "Arcane Core", type: "Root", desc: "The source of all magic.", stat: "Unlocks Tree", unlocked: true, color: "#fbbf24" },
            
            // TIER 1: Primary Branches
            { id: 1, x: -200, y: -180, name: "Pyromancy", type: "Branch", desc: "Mastery of flame.", stat: "+10% Fire Dmg", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: 200, y: -180, name: "Cryomancy", type: "Branch", desc: "Mastery of frost.", stat: "+10% Ice Dmg", unlocked: false, color: "#22d3ee", parents: [0] },
            { id: 3, x: 0, y: -300, name: "Void Arts", type: "Branch", desc: "Bending reality.", stat: "+5% Speed", unlocked: false, color: "#c084fc", parents: [0] },
            { id: 4, x: -200, y: 180, name: "Fortification", type: "Branch", desc: "Unyielding defense.", stat: "+10% Armor", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 5, x: 200, y: 180, name: "Siphoning", type: "Branch", desc: "Life and Mana drain.", stat: "+10% Lifesteal", unlocked: false, color: "#10b981", parents: [0] },

            // TIER 2: Secondary Branches (Fire)
            { id: 6, x: -380, y: -320, name: "Ignite", type: "Passive", desc: "Spells burn enemies.", stat: "DoT Over Time", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 7, x: -100, y: -320, name: "Heat Wave", type: "Passive", desc: "Area damage boost.", stat: "+15% AoE", unlocked: false, color: "#ef4444", parents: [1] },

            // TIER 2: Secondary Branches (Ice)
            { id: 8, x: 100, y: -320, name: "Chill", type: "Passive", desc: "Slows enemies.", stat: "Slow 15%", unlocked: false, color: "#22d3ee", parents: [2] },
            { id: 9, x: 380, y: -320, name: "Shatter", type: "Passive", desc: "Crit frozen foes.", stat: "Crit Dmg +20%", unlocked: false, color: "#22d3ee", parents: [2] },

            // TIER 2: Secondary Branches (Void)
            { id: 10, x: -150, y: -450, name: "Blink", type: "Active", desc: "Short range teleport.", stat: "Cooldown 5s", unlocked: false, color: "#c084fc", parents: [3] },
            { id: 11, x: 150, y: -450, name: "Mana Void", type: "Passive", desc: "Drain enemy mana.", stat: "Mana Lifesteal", unlocked: false, color: "#c084fc", parents: [3] },

            // TIER 2: Secondary Branches (Defense)
            { id: 12, x: -380, y: 320, name: "Iron Skin", type: "Passive", desc: "Reduce physical dmg.", stat: "-20% Phys Dmg", unlocked: false, color: "#94a3b8", parents: [4] },
            { id: 13, x: -100, y: 320, name: "Shield", type: "Active", desc: "Magic barrier.", stat: "+150 Shield", unlocked: false, color: "#94a3b8", parents: [4] },
            
            // TIER 2: Secondary Branches (Life)
            { id: 14, x: 100, y: 320, name: "Vampirism", type: "Passive", desc: "Heal on hit.", stat: "Heal 5%", unlocked: false, color: "#10b981", parents: [5] },
            { id: 15, x: 380, y: 320, name: "Regen", type: "Passive", desc: "Slow health regen.", stat: "+1% HP/s", unlocked: false, color: "#10b981", parents: [5] },

            // TIER 3: Advanced (Fire)
            { id: 16, x: -500, y: -480, name: "Inferno", type: "Ultimate", desc: "Massive fireball.", stat: "Huge Dmg", unlocked: false, color: "#ef4444", parents: [6] },
            { id: 17, x: -250, y: -500, name: "Phoenix", type: "Ultimate", desc: "Resurrect once.", stat: "1% HP Revive", unlocked: false, color: "#ef4444", parents: [7] },

            // TIER 3: Advanced (Ice)
            { id: 18, x: 250, y: -500, name: "Absolute Zero", type: "Ultimate", desc: "Freeze all enemies.", stat: "Stun 3s", unlocked: false, color: "#22d3ee", parents: [9] },

            // TIER 3: Advanced (Void)
            { id: 19, x: 0, y: -600, name: "Archmage", type: "Trait", desc: "Master of magic.", stat: "+All Stats", unlocked: false, color: "#c084fc", parents: [10, 11] },
            
            // TIER 3: Advanced (Defense)
            { id: 20, x: -250, y: 480, name: "Fortress", type: "Ultimate", desc: "Unbreakable.", stat: "Invuln 1s", unlocked: false, color: "#94a3b8", parents: [12, 13] },
            
            // TIER 3: Advanced (Life)
            { id: 21, x: 250, y: 480, name: "Necrosis", type: "Ultimate", desc: "Rot over time.", stat: "HP Decay", unlocked: false, color: "#10b981", parents: [14, 15] },

            // TIER 4: Apex (Connecting branches)
            { id: 22, x: 0, y: -750, name: "Cosmic Weaver", type: "Apex", desc: "Ultimate power.", stat: "Godlike", unlocked: false, color: "#fbbf24", parents: [19] },
            { id: 23, x: 0, y: 650, name: "Immortal", type: "Apex", desc: "Cannot die.", stat: "Deathproof", unlocked: false, color: "#fbbf24", parents: [20, 21] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // Center Camera
            if (panX === 0 && panY === 0) {
                panX = width / 2;
                panY = height / 2 - 100; // Shift up slightly to see the top-heavy tree
            }
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + panX,
                y: node.y * scale + panY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw Connections first (behind nodes)
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        // Critique 5: Cyan for active connections
        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isAvailable = parent.unlocked && !child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Bezier curve for organic feel
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineCap = 'round';
            
            if (isPathUnlocked) {
                // Active Path: Cyan Glow
                ctx.lineWidth = 3 * scale;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#22d3ee'; // Cyan
                ctx.strokeStyle = 'rgba(34, 211, 238, 0.6)'; // Cyan transparent
                ctx.stroke();
                
                // Inner core (White/Bright Cyan)
                ctx.shadowBlur = 0;
                ctx.lineWidth = 1 * scale;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                
            } else if (isAvailable) {
                // Available path: Dashed dim gold (indicates potential)
                ctx.lineWidth = 1.5 * scale;
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.2)';
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            } else {
                // Locked path: Faint dark grey/stone
                ctx.lineWidth = 1 * scale;
                ctx.strokeStyle = 'rgba(71, 85, 105, 0.15)'; // Stone color
                ctx.stroke();
            }
        }

        // Hexagon Drawing Helper
        function drawHexagon(ctx, x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                // Pointy top hexagon
                const angle = (Math.PI / 3) * i - Math.PI / 6; 
                const hx = x + radius * Math.cos(angle);
                const hy = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            // Size variation based on type
            const radius = (node.type === 'Ultimate' || node.type === 'Apex' ? 35 : 24) * scale;
            
            // 1. Outer Glow (Active Node)
            if (node.unlocked) {
                ctx.save();
                // Use node color for glow, but force Cyan for Intelligence nodes if needed (handled by data)
                // For this demo, Apex/Root is Gold, others are their class color.
                // Critique 5: Use Cyan for active connections, Gold for XP/Primary.
                // We will use the node's specific color for the node glow.
                ctx.shadowBlur = 20;
                ctx.shadowColor = node.color;
                drawHexagon(ctx, pos.x, pos.y, radius + 2);
                ctx.fillStyle = node.color;
                ctx.fill();
                ctx.restore();
            }

            // 2. Base Shape (Hexagon)
            drawHexagon(ctx, pos.x, pos.y, radius);
            
            // Critique 5: Differentiate Locked vs Active (Filled vs Hollow)
            if (!node.unlocked) {
                // Locked: Hollow Stone
                ctx.fillStyle = 'rgba(15, 23, 42, 0.8)'; // Dark fill
                ctx.fill();
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = 'rgba(71, 85, 105, 0.5)'; // Stone grey border
            } else {
                // Unlocked: Filled Crystal
                ctx.fillStyle = '#0f172a'; // Dark inner
                ctx.fill();
                ctx.lineWidth = 3 * scale;
                ctx.strokeStyle = node.color; // Bright border
            }
            
            // Hover Highlight
            if (hoveredNode === node) {
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = node.unlocked ? '#fff' : 'rgba(255,255,255,0.5)';
                ctx.stroke();
            } else {
                ctx.stroke();
            }
            
            // 3. Icon Details (Rune)
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            if (node.unlocked) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * scale;
                ctx.beginPath();
                // Simple geometric rune
                ctx.moveTo(0, -radius * 0.5);
                ctx.lineTo(0, radius * 0.5);
                ctx.moveTo(-radius * 0.4, 0);
                ctx.lineTo(radius * 0.4, 0);
                ctx.stroke();
            } else {
                // Locked Icon (Padlock simplified)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(0, 2*scale, radius * 0.2, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();

            // 4. Label
            ctx.fillStyle = node.unlocked ? '#fff' : '#64748b';
            ctx.font = `${node.unlocked ? '700' : '400'} ${11 * scale}px var(--font-ui)`;
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,1)';
            ctx.shadowBlur = 4;
            ctx.fillText(node.name, pos.x, pos.y + radius + (16 * scale));
            ctx.shadowBlur = 0;
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Dynamic Tooltip Styling
            ttType.style.color = '#000';
            ttType.style.backgroundColor = node.color;

            let left = mouseX + 30;
            let top = mouseY - 50;
            
            const stageRect = document.getElementById('main-stage').getBoundingClientRect();
            
            if (left + 260 > stageRect.width) left = mouseX - 280;
            if (top < 0) top = 10;
            if (top + 180 > stageRect.height) top = stageRect.height - 190;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            // Convert screen to world
            const wx = (mouseX - panX) / scale;
            const wy = (mouseY - panY) / scale;
            
            // Hit Detection
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' || node.type === 'Apex' ? 35 : 24);
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('hud-points-display').textContent = availablePoints;
                            draw();
                        } else if (!parentsUnlocked) {
                            // Visual feedback for locked dependency?
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        // Panning Logic
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                panX += dx;
                panY += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                draw();
                hideTooltip();
                hoveredNode = null;
                return;
            }

            // Hover Logic
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const wx = (mouseX - panX) / scale;
            const wy = (mouseY - panY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' || node.type === 'Apex' ? 35 : 24) + 5; 
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                container.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                } else {
                    // Update position if dragging tooltip
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                container.style.cursor = 'grab';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        // --- Init ---
        resize();

    </script>
</body>
</html>
