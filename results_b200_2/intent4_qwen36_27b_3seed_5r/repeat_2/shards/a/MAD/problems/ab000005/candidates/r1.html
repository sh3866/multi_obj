<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Deep Clean Technology</title>
    <style>
        :root {
            --bg-wall: #EAE6DF;
            --text-main: #2C2824;
            --text-sub: #5C554E;
            --accent: #D96C4A;
            --accent-soft: #F2D5C6;
            --white: #FFFFFF;
            --card-shadow: 0 20px 40px rgba(44, 40, 36, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Layout --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 2px 4px rgba(217, 108, 74, 0.3);
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.3s;
            letter-spacing: 0.02em;
        }
        .nav-links span:hover { opacity: 1; }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Warm vignette overlay for mood */
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.05) 100%);
        }

        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            top: 2rem;
            left: 3rem;
            z-index: 20;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            max-width: 340px;
            border: 1px solid rgba(255,255,255,0.6);
            animation: slideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ui-panel h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .ui-panel p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-sub);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        /* Ghost button style */
        .btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1.5px solid rgba(44, 40, 36, 0.2);
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--text-main);
            color: var(--white);
            border-color: var(--text-main);
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        /* --- SVG Scene --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            overflow: visible;
        }

        /* Interactive Elements */
        .interactive-zone {
            cursor: grab;
            /* Smooth transition for the idle state */
            transition: transform 0.1s linear; 
        }
        .interactive-zone:active {
            cursor: grabbing;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cleaned-spill {
            transition: opacity 1.2s ease-out, transform 1.2s ease-out;
            opacity: 1;
            transform: scale(1);
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
            transform: scale(0.95);
        }

        /* Water marks animation */
        .water-mark {
            fill: rgba(255, 255, 255, 0.15);
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        /* Dynamic class for mop dragging to remove transition lag */
        .is-dragging {
            transition: none !important;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>Support</span>
        </div>
    </header>

    <div class="scene-container">
        
        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- 1. FLOOR TEXTURE: Wood Grain Filter -->
                <filter id="wood-grain" x="0" y="0" width="100%" height="100%">
                    <!-- Generate noise -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="3" result="noise" />
                    <!-- Colorize noise to wood tones -->
                    <feColorMatrix type="matrix" values="
                        0.6 0 0 0 0.2
                        0.4 0 0 0 0.15
                        0.2 0 0 0 0.1
                        0 0 0 0.4 0" in="noise" result="coloredNoise" />
                    <!-- Merge with base color -->
                    <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
                </filter>

                <!-- 2. LIQUID PHYSICS: Viscous Filter -->
                <filter id="liquid-displacement" x="-20%" y="-20%" width="140%" height="140%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- 3. SHADOW: Realistic Drop Shadow -->
                <filter id="realistic-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur" />
                    <feOffset dx="15" dy="25" result="offsetBlur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.25" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- 4. MATERIALS -->
                <!-- Brushed Metal Handle -->
                <linearGradient id="metal-handle" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#999;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#ccc;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#777;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#aaa;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
                </linearGradient>

                <!-- Matte Plastic Grip -->
                <linearGradient id="plastic-grip" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
                </linearGradient>

                <!-- Mop Fiber Texture -->
                <filter id="fiber-texture">
                    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise" />
                    <feColorMatrix type="matrix" values="
                        0 0 0 0 0.8
                        0 0 0 0 0.8
                        0 0 0 0 0.8
                        0 0 0 0.5 0" in="noise" result="coloredNoise" />
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture" />
                    <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
                </filter>
            </defs>

            <!-- BACKGROUND: Floor -->
            <g id="floor-layer">
                <!-- Base Gradient for perspective -->
                <rect x="0" y="0" width="100%" height="100%" fill="url(#floor-base)" />
                <linearGradient id="floor-base" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#D5C5A8" />
                    <stop offset="100%" stop-color="#BFA98C" />
                </linearGradient>
                
                <!-- Wood Grain Overlay (Full screen) -->
                <rect x="0" y="0" width="100%" height="100%" fill="#D2B48C" filter="url(#wood-grain)" opacity="0.8" />
                
                <!-- Planks (Subtle Lines) -->
                <g stroke="rgba(0,0,0,0.08)" stroke-width="3">
                    <line x1="0" y1="100" x2="1200" y2="100" />
                    <line x1="0" y1="200" x2="1200" y2="200" />
                    <line x1="0" y1="300" x2="1200" y2="300" />
                    <line x1="0" y1="400" x2="1200" y2="400" />
                    <line x1="0" y1="500" x2="1200" y2="500" />
                    <line x1="0" y1="600" x2="1200" y2="600" />
                    <line x1="0" y1="700" x2="1200" y2="700" />
                </g>
            </g>

            <!-- 1. THE SPILL (Mess) -->
            <g id="spill-group" class="cleaned-spill" transform="translate(600, 550)">
                <!-- Wet Sheen (Darkened area on floor) -->
                <ellipse cx="0" cy="0" rx="180" ry="100" fill="rgba(0,0,0,0.1)" filter="url(#liquid-displacement)" />

                <!-- Main Puddle Body -->
                <path d="M-100,-20 C-150,-50 -180,20 -120,60 C-60,100 80,100 140,40 C200,0 120,-80 60,-40 C0,-80 -60,-10 -100,-20 Z" 
                      fill="#6B3E1B" opacity="0.9" />
                
                <!-- Liquid Highlights (Specular) -->
                <path d="M-80,-10 C-120,-30 -140,10 -100,40 C-60,70 40,60 100,30 C140,0 80,-40 40,-20 C0,-40 -40,-30 -80,-10 Z" 
                      fill="#8B5A2B" opacity="0.8" />
                
                <!-- Deep Center -->
                <ellipse cx="0" cy="10" rx="60" ry="30" fill="#3E1E0B" opacity="0.6" filter="blur(2px)" />
                
                <!-- Splatter Bits -->
                <circle cx="-160" cy="20" r="6" fill="#6B3E1B" />
                <circle cx="-180" cy="50" r="4" fill="#6B3E1B" />
                <circle cx="150" cy="10" r="8" fill="#6B3E1B" />
                <circle cx="170" cy="-10" r="3" fill="#6B3E1B" />
                <circle cx="120" cy="70" r="5" fill="#6B3E1B" />
            </g>

            <!-- 2. WATER MARKS (Clean state) -->
            <g id="water-marks" transform="translate(600, 550)">
                <path d="M-100,-20 C-150,-50 -180,20 -120,60 C-60,100 80,100 140,40 C200,0 120,-80 60,-40 C0,-80 -60,-10 -100,-20 Z" 
                      class="water-mark" />
            </g>

            <!-- 3. THE MOP (Reconstructed) -->
            <!-- Positioned to cover the spill initially -->
            <g id="mop-group" class="interactive-zone" transform="translate(600, 250)" filter="url(#realistic-shadow)">
                
                <!-- Handle (Brushed Metal) -->
                <rect x="-10" y="0" width="20" height="350" fill="url(#metal-handle)" rx="2" />
                
                <!-- Grip (Matte Plastic) -->
                <rect x="-14" y="80" width="28" height="140" fill="url(#plastic-grip)" rx="4" />
                <!-- Grip Texture lines -->
                <path d="M-14,90 L14,90 M-14,100 L14,100 M-14,110 L14,110 M-14,120 L14,120 M-14,130 L14,130 M-14,140 L14,140 M-14,150 L14,150 M-14,160 L14,160 M-14,170 L14,170 M-14,180 L14,180 M-14,190 L14,190 M-14,200 L14,200 M-14,210 L14,210" stroke="#222" stroke-width="2" opacity="0.5"/>

                <!-- Metal Collar/Connector -->
                <path d="M-10,350 L10,350 L15,370 L-15,370 Z" fill="#555" />
                <path d="M-15,370 L15,370 L20,390 L-20,390 Z" fill="#333" />

                <!-- MOP HEAD (The Cluster) -->
                <g id="mop-head" transform="translate(0, 390)">
                    <!-- Base Shape of the mop head -->
                    <path d="M-70,0 C-80,60 -50,100 0,110 C50,100 80,60 70,0 C60,-40 -60,-40 -70,0 Z" fill="#E8E8E8" />
                    
                    <!-- Individual Fiber Clusters (Paths simulating strands) -->
                    <g stroke="#CCC" stroke-width="4" stroke-linecap="round" opacity="0.8">
                        <path d="M-50,-10 Q-60,50 -30,90" />
                        <path d="M-30,-10 Q-40,60 -10,100" />
                        <path d="M-10,-10 Q-20,70 10,105" />
                        <path d="M10,-10 Q0,80 30,100" />
                        <path d="M30,-10 Q20,60 50,90" />
                        <path d="M50,-10 Q40,50 60,80" />
                    </g>

                    <!-- Wet Stain on Mop (Shows it's working) -->
                    <path d="M-40,20 C-50,60 -20,90 0,95 C20,90 50,60 40,20 C30,-10 -30,-10 -40,20 Z" 
                          fill="#6B3E1B" opacity="0.4" filter="url(#fiber-texture)" />
                          
                    <!-- Specular Highlight on Mop (Clean fibers) -->
                    <ellipse cx="0" cy="40" rx="30" ry="15" fill="rgba(255,255,255,0.4)" filter="blur(4px)" />
                </g>
            </g>

        </svg>

        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Drag the mop to clean the floor. Our advanced fiber technology absorbs mess instantly.</p>
            <button class="btn" id="reset-btn">
                <span>Reset Scene</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            
            // Initial State Coordinates
            const initialMopX = 600;
            const initialMopY = 250;
            let currentMopX = initialMopX;
            let currentMopY = initialMopY;

            let isCleaned = false;
            let idleAngle = 0;

            // --- Drag Logic ---
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if (isCleaned) return; // Lock after cleaning
                
                isDragging = true;
                mopGroup.classList.add('is-dragging'); // Remove CSS transition lag
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                // Calculate movement in screen pixels
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Convert screen pixels to SVG coordinates
                // We need to account for the SVG scale (viewport vs viewBox)
                const svgRect = document.getElementById('scene-svg').getBoundingClientRect();
                const scaleX = 1200 / svgRect.width; // viewBox width / element width
                const scaleY = 800 / svgRect.height;

                // Update current position
                currentMopX += deltaX * scaleX;
                currentMopY += deltaY * scaleY;

                // Apply transform
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY})`);

                // Check Collision
                checkCollision();

                // Reset start for next frame delta
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                mopGroup.classList.remove('is-dragging');
                document.body.style.cursor = 'default';
            }

            function checkCollision() {
                // Spill center is approx 600, 550
                // Mop head bottom is roughly currentMopY + 390 (head offset) + 60 (height) = currentMopY + 450
                
                const mopHeadCenterX = currentMopX;
                const mopHeadCenterY = currentMopY + 450; // Approximate bottom of mop head

                const spillCenterX = 600;
                const spillCenterY = 550;

                // Distance formula
                const dist = Math.sqrt(Math.pow(mopHeadCenterX - spillCenterX, 2) + Math.pow(mopHeadCenterY - spillCenterY, 2));

                // Collision threshold
                if (dist < 100) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Fade out spill
                spillGroup.classList.add('hidden');
                
                // 2. Fade in water marks
                waterMarks.style.opacity = '1';
                
                // 3. Update Button
                resetBtn.innerHTML = `<span>Reset Demo</span>`;
                resetBtn.style.borderColor = "#27ae60";
                resetBtn.style.color = "#27ae60";
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                
                // Reset Mop Position
                currentMopX = initialMopX;
                currentMopY = initialMopY;
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY})`);
                
                // Reset Spill
                spillGroup.classList.remove('hidden');
                
                // Reset Water Marks
                waterMarks.style.opacity = '0';

                // Reset Button Style
                resetBtn.innerHTML = `<span>Reset Scene</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>`;
                resetBtn.style.borderColor = "";
                resetBtn.style.color = "";
            });

            // Idle Animation (Bobbing)
            function animateIdle() {
                if (!isDragging && !isCleaned) {
                    idleAngle += 0.03;
                    const yOff = Math.sin(idleAngle) * 3;
                    // Only apply if not dragging
                    mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY + yOff})`);
                }
                requestAnimationFrame(animateIdle);
            }
            animateIdle();
        });
    </script>
</body>
</html>
