<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Deep Clean Technology</title>
    <style>
        :root {
            --bg-wall: #EAE6DF;
            --text-main: #1A1918;
            --text-sub: #4A4846;
            --accent: #D96C4A;
            --accent-hover: #C25A3A;
            --white-glass: rgba(255, 255, 255, 0.85);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Layout --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-dot {
            width: 14px;
            height: 14px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(217, 108, 74, 0.4);
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.3s;
            letter-spacing: 0.02em;
        }
        .nav-links span:hover { opacity: 1; }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- UI Overlay (Frosted Glass) --- */
        .ui-panel {
            position: absolute;
            top: 2rem;
            left: 3rem;
            z-index: 20;
            background: var(--white-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            max-width: 360px;
            border: 1px solid rgba(255,255,255,0.5);
            animation: slideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ui-panel h1 {
            font-size: 2rem;
            font-weight: 800; /* Critique: Bold */
            margin-bottom: 1rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .ui-panel p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* Critique: Solid High-Contrast Button */
        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(217, 108, 74, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(217, 108, 74, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        /* --- SVG Scene --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            overflow: visible;
        }

        /* Interactive Elements */
        .interactive-zone {
            cursor: grab;
            transition: transform 0.1s linear; 
        }
        .interactive-zone:active {
            cursor: grabbing;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cleaned-spill {
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            opacity: 1;
            transform: scale(1);
            transform-origin: center;
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
            transform: scale(0.9);
        }

        /* Water marks animation */
        .water-mark {
            fill: url(#water-mark-grad);
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        /* Dynamic class for mop dragging to remove transition lag */
        .is-dragging {
            transition: none !important;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>Support</span>
        </div>
    </header>

    <div class="scene-container">
        
        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- 1. FLOOR TEXTURE: Wood Grain Filter -->
                <filter id="wood-grain" x="0" y="0" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.15" numOctaves="4" result="noise" />
                    <feColorMatrix type="matrix" values="
                        0.6 0 0 0 0.2
                        0.4 0 0 0 0.15
                        0.2 0 0 0 0.1
                        0 0 0 0.5 0" in="noise" result="coloredNoise" />
                    <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
                </filter>

                <!-- 2. LIQUID PHYSICS: Viscous Filter -->
                <filter id="liquid-displacement" x="-30%" y="-30%" width="160%" height="160%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- 3. SHADOW: Realistic Drop Shadow -->
                <filter id="realistic-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur" />
                    <feOffset dx="10" dy="20" result="offsetBlur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- 4. MATERIALS -->
                <!-- Brushed Metal Handle -->
                <linearGradient id="metal-handle" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#999;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#ccc;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#777;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#aaa;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
                </linearGradient>

                <!-- Matte Plastic Grip -->
                <linearGradient id="plastic-grip" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
                </linearGradient>

                <!-- Mop Fiber Texture -->
                <filter id="fiber-texture">
                    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise" />
                    <feColorMatrix type="matrix" values="
                        0 0 0 0 0.8
                        0 0 0 0 0.8
                        0 0 0 0 0.8
                        0 0 0 0.5 0" in="noise" result="coloredNoise" />
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture" />
                    <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
                </filter>

                <!-- Vignette Gradient -->
                <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
                    <stop offset="40%" stop-color="rgba(0,0,0,0)" />
                    <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
                </radialGradient>

                <!-- Water Mark Gradient (Wet look) -->
                <linearGradient id="water-mark-grad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.3)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
                </linearGradient>
            </defs>

            <!-- BACKGROUND: Floor -->
            <g id="floor-layer">
                <!-- Base Gradient for perspective -->
                <rect x="0" y="0" width="100%" height="100%" fill="url(#floor-base)" />
                <linearGradient id="floor-base" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#D5C5A8" />
                    <stop offset="100%" stop-color="#BFA98C" />
                </linearGradient>
                
                <!-- Wood Grain Overlay (Full screen) -->
                <rect x="0" y="0" width="100%" height="100%" fill="#D2B48C" filter="url(#wood-grain)" opacity="0.8" />
                
                <!-- Planks (Subtle Lines) -->
                <g stroke="rgba(0,0,0,0.08)" stroke-width="3">
                    <line x1="0" y1="100" x2="1200" y2="100" />
                    <line x1="0" y1="200" x2="1200" y2="200" />
                    <line x1="0" y1="300" x2="1200" y2="300" />
                    <line x1="0" y1="400" x2="1200" y2="400" />
                    <line x1="0" y1="500" x2="1200" y2="500" />
                    <line x1="0" y1="600" x2="1200" y2="600" />
                    <line x1="0" y1="700" x2="1200" y2="700" />
                </g>
            </g>

            <!-- 1. THE SPILL (Mess) - INSTANTIATED & SCALED -->
            <!-- Positioned center-right (750, 550) -->
            <g id="spill-group" class="cleaned-spill" transform="translate(750, 550)">
                
                <!-- Wet Sheen (Darkened area on floor) -->
                <ellipse cx="0" cy="0" rx="280" ry="160" fill="rgba(0,0,0,0.15)" filter="url(#liquid-displacement)" />

                <!-- Main Puddle Body (Organic Shape) -->
                <path d="M-150,-40 C-220,-80 -280,40 -180,100 C-80,160 120,160 220,70 C320,0 200,-120 100,-70 C0,-120 -80,-20 -150,-40 Z" 
                      fill="#4A2E1B" opacity="0.95" />
                
                <!-- Liquid Highlights (Specular - Glossy) -->
                <path d="M-120,-20 C-180,-40 -200,10 -150,50 C-100,90 60,80 150,40 C220,0 140,-60 80,-40 C0,-60 -60,-40 -120,-20 Z" 
                      fill="#6B4226" opacity="0.7" />
                
                <!-- Deep Center (Darker core) -->
                <ellipse cx="20" cy="10" rx="100" ry="50" fill="#2E1A0B" opacity="0.8" filter="blur(4px)" />
                
                <!-- Splatter Bits -->
                <circle cx="-240" cy="30" r="12" fill="#4A2E1B" />
                <circle cx="-270" cy="60" r="8" fill="#4A2E1B" />
                <circle cx="250" cy="15" r="16" fill="#4A2E1B" />
                <circle cx="280" cy="-20" r="6" fill="#4A2E1B" />
                <circle cx="180" cy="90" r="10" fill="#4A2E1B" />
                
                <!-- Glossy Reflections -->
                <ellipse cx="40" cy="-10" rx="60" ry="15" fill="rgba(255,255,255,0.15)" transform="rotate(-10)" />
                <ellipse cx="-100" cy="40" rx="30" ry="8" fill="rgba(255,255,255,0.1)" transform="rotate(10)" />
            </g>

            <!-- 2. WATER MARKS (Clean state) -->
            <g id="water-marks" transform="translate(750, 550)">
                <path d="M-150,-40 C-220,-80 -280,40 -180,100 C-80,160 120,160 220,70 C320,0 200,-120 100,-70 C0,-120 -80,-20 -150,-40 Z" 
                      class="water-mark" />
            </g>

            <!-- 3. THE MOP (Reconstructed & Scaled 1.5x) -->
            <!-- Positioned to cover the spill initially (650, 150) -->
            <!-- Note: SVG Scale applied to group -->
            <g id="mop-group" class="interactive-zone" transform="translate(650, 150) scale(1.5)" filter="url(#realistic-shadow)">
                
                <!-- Handle (Brushed Metal) -->
                <rect x="-10" y="0" width="20" height="350" fill="url(#metal-handle)" rx="2" />
                
                <!-- Grip (Matte Plastic) -->
                <rect x="-14" y="80" width="28" height="140" fill="url(#plastic-grip)" rx="4" />
                <!-- Grip Texture lines -->
                <path d="M-14,90 L14,90 M-14,100 L14,100 M-14,110 L14,110 M-14,120 L14,120 M-14,130 L14,130 M-14,140 L14,140 M-14,150 L14,150 M-14,160 L14,160 M-14,170 L14,170 M-14,180 L14,180 M-14,190 L14,190 M-14,200 L14,200 M-14,210 L14,210" stroke="#222" stroke-width="2" opacity="0.5"/>

                <!-- Metal Collar/Connector -->
                <path d="M-10,350 L10,350 L15,370 L-15,370 Z" fill="#555" />
                <path d="M-15,370 L15,370 L20,390 L-20,390 Z" fill="#333" />

                <!-- MOP HEAD (The Cluster) -->
                <g id="mop-head" transform="translate(0, 390)">
                    <!-- Base Shape of the mop head -->
                    <path d="M-70,0 C-80,60 -50,100 0,110 C50,100 80,60 70,0 C60,-40 -60,-40 -70,0 Z" fill="#E8E8E8" />
                    
                    <!-- Individual Fiber Clusters (Paths simulating strands) -->
                    <g stroke="#CCC" stroke-width="4" stroke-linecap="round" opacity="0.8">
                        <path d="M-50,-10 Q-60,50 -30,90" />
                        <path d="M-30,-10 Q-40,60 -10,100" />
                        <path d="M-10,-10 Q-20,70 10,105" />
                        <path d="M10,-10 Q0,80 30,100" />
                        <path d="M30,-10 Q20,60 50,90" />
                        <path d="M50,-10 Q40,50 60,80" />
                    </g>

                    <!-- Wet Stain on Mop (Shows it's working) -->
                    <path d="M-40,20 C-50,60 -20,90 0,95 C20,90 50,60 40,20 C30,-10 -30,-10 -40,20 Z" 
                          fill="#4A2E1B" opacity="0.5" filter="url(#fiber-texture)" />
                          
                    <!-- Specular Highlight on Mop (Clean fibers) -->
                    <ellipse cx="0" cy="40" rx="30" ry="15" fill="rgba(255,255,255,0.5)" filter="blur(4px)" />
                </g>
            </g>

            <!-- 5. LIGHTING: Vignette Overlay -->
            <rect x="0" y="0" width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />

        </svg>

        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>Deep Clean Technology</h1>
            <p>Drag the mop to clean the floor. Our advanced fiber technology absorbs mess instantly.</p>
            <button class="btn" id="reset-btn">
                <span>Reset Scene</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            
            // Initial State Coordinates (Scaled positions)
            const initialMopX = 650;
            const initialMopY = 150;
            let currentMopX = initialMopX;
            let currentMopY = initialMopY;

            let isCleaned = false;
            let idleAngle = 0;

            // --- Drag Logic ---
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if (isCleaned) return; // Lock after cleaning
                
                isDragging = true;
                mopGroup.classList.add('is-dragging'); // Remove CSS transition lag
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                // Calculate movement in screen pixels
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                // Convert screen pixels to SVG coordinates
                const svgRect = document.getElementById('scene-svg').getBoundingClientRect();
                const scaleX = 1200 / svgRect.width; // viewBox width / element width
                const scaleY = 800 / svgRect.height;

                // Update current position
                currentMopX += deltaX * scaleX;
                currentMopY += deltaY * scaleY;

                // Apply transform (Preserving the 1.5x scale)
                mopGroup.setAttribute('transform', `translate(${currentMopX}, ${currentMopY}) scale(1.5)`);

                // Check Collision
                checkCollision();

                // Reset start for next frame delta
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                mopGroup.classList.remove('is-dragging');
                document.body.style.cursor = 'default';
            }

            function checkCollision() {
                // Spill center is approx 750, 550
                // Mop head bottom is roughly currentMopY + 390 (head offset) + 60 (height) * 1.5 (scale)
                
                const mopHeadCenterX = currentMopX;
                const mopHeadCenterY = (currentMopY + 450) * 1.5; // Approximate bottom of mop head scaled

                const spillCenterX = 750;
                const spillCenterY = 550;

                // Distance formula
                const dist = Math.sqrt(Math.pow(mopHeadCenterX - spillCenterX, 2) + Math.pow(mopHeadCenterY - spillCenterY, 2));

                // Collision threshold
                if (dist < 150) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Fade out spill
                spillGroup.classList.add('hidden');
                
                // 2. Fade in water marks
                waterMarks.style.opacity = '1';
                
                // 3. Update Button
                resetBtn.innerHTML = `<span>Reset Demo</span>`;
            }

            // Reset Logic
            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                
                // Reset Mop Position
                currentMopX = initialMopX;
                currentMopY = initialMopY;
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY}) scale(1.5)`);
                
                // Reset Spill
                spillGroup.classList.remove('hidden');
                
                // Reset Water Marks
                waterMarks.style.opacity = '0';

                // Reset Button Style
                resetBtn.innerHTML = `<span>Reset Scene</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>`;
            });

            // Idle Animation (Bobbing)
            function animateIdle() {
                if (!isDragging && !isCleaned) {
                    idleAngle += 0.03;
                    const yOff = Math.sin(idleAngle) * 3;
                    // Only apply if not dragging
                    mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY + yOff}) scale(1.5)`);
                }
                requestAnimationFrame(animateIdle);
            }
            animateIdle();
        });
    </script>
</body>
</html>
