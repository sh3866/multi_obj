<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Typography --- */
            /* System fonts stack for a rounded, playful look */
            --font-heading: 'Chewy', 'Cooper Black', 'Arial Rounded MT Bold', 'Fredoka One', 'Segoe UI Black', sans-serif;
            --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;

            /* --- Palette: Storybook & Ink --- */
            --bg-page: #FDFBF7;
            --bg-frame: #4A3B32; /* Dark warm charcoal/brown */
            --bg-frame-inner: #3E322A;
            
            /* Board Surface */
            --board-bg: #E8DCC8; /* Gutter color */
            --tile-bg: #FDFBF7;  /* Cream paper */
            --tile-shadow: #D7CCC8;
            
            /* Ink Paths */
            --ink-color: #4A3B32;
            --ink-width: 8px; /* Thicker, tactile strokes */
            
            /* UI Colors */
            --btn-run: #E67E22; /* Warm Playful Orange */
            --btn-run-dark: #D35400;
            --btn-reset: #D7CCC8; /* Soft Neutral Grey/Wood */
            --btn-reset-dark: #BCAAA4;
            
            --tile-size: 70px;
            --gap: 6px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-page);
            /* Subtle Noise Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--bg-frame);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.8rem; /* Reduced size */
            margin: 0;
            letter-spacing: 1px;
            color: var(--bg-frame);
            line-height: 1;
            transform: rotate(-1.5deg);
        }

        .subtitle {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.9rem;
            color: #8D7B74; /* Darkened for contrast */
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* --- The Unified Game Box --- */
        .game-box {
            position: relative;
            padding: 24px;
            padding-bottom: 40px; /* Space for buttons */
            background-color: var(--bg-frame);
            border-radius: 16px;
            
            /* Tactile Frame Shadow */
            box-shadow: 
                0 30px 60px rgba(74, 59, 50, 0.3), 
                0 10px 0 var(--bg-frame-inner), 
                inset 0 1px 0 rgba(255,255,255,0.1);
            
            border: 1px solid rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Wood grain texture overlay for the frame */
        .game-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(0,0,0,0.03) 20px, rgba(0,0,0,0.03) 22px);
            pointer-events: none;
            z-index: 1;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
            background-color: var(--board-bg); 
            padding: var(--gap);
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* --- Tiles (Paper Cards) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-bg);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            
            /* Unified Lighting: Shadow from Top-Left */
            box-shadow: 
                2px 2px 0 rgba(0,0,0,0.1), 
                0 1px 0 #fff;
            
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tile:active {
            transform: translate(1px, 1px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1);
        }

        /* SVG Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--ink-color);
            stroke-width: var(--ink-width);
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Active/Lit Path */
        .tile.active .path-line {
            stroke: #E67E22; /* Orange glow for active path */
            filter: drop-shadow(0px 2px 2px rgba(230, 126, 34, 0.4));
        }

        /* --- Game Tokens --- */

        /* The Cub Token */
        .cub-token {
            position: absolute;
            width: 42px; /* Scaled down to ~60% of cell width */
            height: 42px;
            z-index: 100;
            pointer-events: none;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Unified Lighting: Top-Left Shadow */
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3));
            transform: translate(-50%, -50%);
        }

        /* CSS Bear Face */
        .cub-face {
            width: 100%;
            height: 100%;
            background: #D84315;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.15);
        }

        .cub-ear {
            position: absolute;
            top: -4px;
            width: 14px;
            height: 14px;
            background: #D84315;
            border-radius: 50%;
            z-index: -1;
            box-shadow: inset -1px -1px 0 rgba(0,0,0,0.1);
        }
        .cub-ear.left { left: 2px; }
        .cub-ear.right { right: 2px; }
        .cub-ear-inner {
            position: absolute;
            top: 3px; left: 3px;
            width: 8px; height: 8px;
            background: #FFCCBC;
            border-radius: 50%;
        }

        .cub-eyes {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            display: flex;
            justify-content: space-between;
        }
        .eye {
            width: 4px; height: 5px;
            background: #3E2723;
            border-radius: 50%;
        }
        
        .cub-snout {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 12px;
            background: #FFE0B2;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 2px;
        }
        .nose {
            width: 7px; height: 4px;
            background: #3E2723;
            border-radius: 4px;
        }

        /* The Goal Star */
        .marker-goal {
            position: absolute;
            width: 44px;
            height: 44px;
            z-index: 50;
            transform: translate(-50%, -50%);
            animation: pulse-glow 2.5s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3)); /* Unified shadow */
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; filter: drop-shadow(0 0 12px #FFD54F) drop-shadow(2px 3px 2px rgba(0,0,0,0.3)); }
        }

        /* --- Footer UI (Integrated) --- */
        footer {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            z-index: 10;
            width: 100%;
            justify-content: center;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 1.2rem;
            padding: 10px 32px;
            border-radius: 50px; /* Pill shape */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            color: white;
            /* Unified Button Shadow */
            box-shadow: 
                0 4px 0 rgba(0,0,0,0.2), 
                0 6px 6px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 rgba(0,0,0,0.2), 
                0 1px 2px rgba(0,0,0,0.1);
        }

        /* Run Button */
        .btn-run {
            background-color: var(--btn-run);
            color: white;
        }
        .btn-run:hover {
            background-color: #f39c12;
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 var(--btn-run-dark), 
                0 10px 10px rgba(0,0,0,0.15);
        }

        /* Reset Button */
        .btn-reset {
            background-color: var(--btn-reset);
            color: #5D4037; /* Dark brown text for contrast */
        }
        .btn-reset:hover {
            background-color: #EFEBE9;
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 var(--btn-reset-dark), 
                0 10px 10px rgba(0,0,0,0.15);
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 500px) {
            :root {
                --tile-size: 48px;
                --gap: 4px;
            }
            h1 { font-size: 2.2rem; }
            .game-box { padding: 16px 16px 30px 16px; }
            .cub-token { width: 32px; height: 32px; }
            .cub-ear { width: 10px; height: 10px; }
            .cub-ear-inner { width: 6px; height: 6px; }
            .cub-eyes { top: 10px; width: 14px; }
            .eye { width: 3px; height: 4px; }
            .cub-snout { bottom: 6px; width: 14px; height: 9px; }
            .nose { width: 5px; height: 3px; }
            button { padding: 8px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <!-- Unified Game Box containing Grid and Footer -->
    <div class="game-box">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
        
        <!-- Cub & Star are injected here by JS -->
        
        <!-- Integrated Footer -->
        <footer>
            <button class="btn-run" onclick="solvePuzzle()">Run</button>
            <button class="btn-reset" onclick="resetGame()">Reset</button>
        </footer>
    </div>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');
        const containerEl = document.querySelector('.game-box');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Generates an SVG string for a tile based on connections [top, right, bottom, left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            // Center point
            const cx = mid;
            const cy = mid;

            let d = "";
            
            // Draw lines from center to edges
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" class="path-line" /></svg>`;
        }

        // Star SVG (SVG Filter Glow)
        const starSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1" />
                        <stop offset="50%" stop-color="#FBC02D" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#F57F17" stop-opacity="0" />
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="url(#starGlow)" />
                <path d="M50 10 L60 35 L85 35 L65 50 L75 75 L50 60 L25 75 L35 50 L15 35 L40 35 Z" 
                      fill="#FFF" stroke="#FBC02D" stroke-width="3" stroke-linejoin="round"/>
            </svg>
        `;

        // Cub HTML Structure
        const cubHTML = `
            <div class="cub-face">
                <div class="cub-ear left"><div class="cub-ear-inner"></div></div>
                <div class="cub-ear right"><div class="cub-ear-inner"></div></div>
                <div class="cub-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="cub-snout">
                    <div class="nose"></div>
                </div>
            </div>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // 1. Create Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Randomize paths for visual fullness (decorative)
                    const types = [
                        [true, false, true, false], // |
                        [false, true, false, true], // -
                        [true, true, false, false], // |->
                        [false, true, true, false], // <-|
                        [true, false, false, true], // |<-
                        [false, false, true, true], // ->|
                        [true, true, true, true]    // +
                    ];
                    
                    let type = types[Math.floor(Math.random() * types.length)];
                    // Ensure start/end look connected vertically for the demo
                    if (x === startPos.x && y === startPos.y) type = [true, false, true, false]; 
                    if (x === endPos.x && y === endPos.y) type = [true, false, true, false]; 

                    tile.innerHTML = createPathSVG(type);
                    gridEl.appendChild(tile);
                }
            }

            // 2. Create Goal Marker (Star)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            positionMarker(goal, endPos.x, endPos.y);
            containerEl.appendChild(goal);

            // 3. Create Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubHTML;
            positionMarker(cub, startPos.x, startPos.y);
            containerEl.appendChild(cub);
        }

        function positionMarker(el, x, y) {
            // Dynamic calculation based on CSS variables
            const style = getComputedStyle(document.documentElement);
            const tileSize = parseInt(style.getPropertyValue('--tile-size'));
            const gap = parseInt(style.getPropertyValue('--gap'));
            
            // Container padding (from CSS .game-box)
            const containerPadding = window.innerWidth <= 500 ? 16 : 24; 
            const gridPadding = gap; 
            
            // Center of the tile
            const top = containerPadding + gridPadding + (y * (tileSize + gap)) + (tileSize / 2);
            const left = containerPadding + gridPadding + (x * (tileSize + gap)) + (tileSize / 2);

            el.style.top = `${top}px`;
            el.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            const cub = document.getElementById('cub');
            positionMarker(cub, startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback on board
            containerEl.style.transform = 'scale(0.98)';
            setTimeout(() => containerEl.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // A hardcoded path for the demo effect
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            const cub = document.getElementById('cub');
            let delay = 0;
            const speed = 250; 

            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    positionMarker(cub, pos.x, pos.y);

                    // Fun wiggle effect on Cub
                    cub.style.transform = 'translate(-50%, -50%) rotate(12deg)';
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(-12deg)', 100);
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(0deg)', 200);

                }, delay);
                delay += speed; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
