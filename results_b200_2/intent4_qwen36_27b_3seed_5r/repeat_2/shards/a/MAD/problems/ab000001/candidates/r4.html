<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Typography --- */
            /* Using system fonts that match the "Playful/Rounded" vibe without external requests */
            --font-heading: 'Chewy', 'Cooper Black', 'Arial Rounded MT Bold', 'Fredoka One', 'Segoe UI Black', sans-serif;
            --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;

            /* --- Palette: Storybook & Ink --- */
            --bg-parchment: #FDFBF7;
            --bg-parchment-dark: #EBE0CC;
            
            /* Wood Frame Colors (Walnut) */
            --wood-dark: #3E2723;
            --wood-mid: #5D4037;
            --wood-highlight: rgba(255, 255, 255, 0.1);
            
            /* Board & Tiles */
            --board-bg: #E6DCC8; /* Gutter color */
            --tile-bg: #FFFDF5;  /* Paper color */
            --tile-shadow: #D7CCC8;
            
            /* Paths (Ink) */
            --ink-color: #5D4037;
            --ink-width: 10px;
            
            /* UI Colors */
            --accent-green: #43A047; /* Vibrant Green for Run */
            --accent-green-dark: #2E7D32;
            --accent-terra: #E07A5F; /* Terracotta for Reset */
            --accent-terra-dark: #C25E45;

            --tile-size: 64px;
            --gap: 6px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-parchment);
            /* Subtle Noise Texture via SVG Data URI */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--wood-dark);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 16px;
            z-index: 10;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 1px;
            color: var(--wood-dark);
            text-shadow: 2px 2px 0px var(--bg-parchment-dark);
            line-height: 1;
            transform: rotate(-1deg); /* Hand-drawn imperfection */
        }

        .subtitle {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--wood-mid);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* --- The Board Container (Storybook Frame) --- */
        .game-container {
            position: relative;
            padding: 20px;
            background-color: var(--wood-mid);
            border-radius: 12px;
            
            /* Deep Walnut Frame Look */
            box-shadow: 
                0 25px 50px rgba(62, 39, 35, 0.4), /* Soft diffuse shadow */
                0 10px 0 var(--wood-dark), /* Physical depth */
                inset 0 0 20px rgba(0,0,0,0.5), /* Inner depth */
                inset 2px 2px 0 var(--wood-highlight); /* Bevel */
            
            border: 1px solid var(--wood-dark);
            transition: transform 0.3s ease;
        }

        /* Wood grain pattern overlay */
        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.05) 10px, rgba(0,0,0,0.05) 12px);
            pointer-events: none;
            z-index: 1;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
            background-color: var(--board-bg); 
            padding: var(--gap);
            border-radius: 6px;
            position: relative;
            /* Inset shadow to look like a recessed board */
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
        }

        /* --- Tiles (Paper Cards) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-bg);
            border-radius: 3px; /* Slight paper rounding */
            position: relative;
            cursor: pointer;
            
            /* Paper Texture & Shadow */
            box-shadow: 
                0 1px 0 #fff, 
                0 3px 0 var(--tile-shadow), 
                0 5px 10px rgba(0,0,0,0.05);
            
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                0 1px 0 #fff, 
                0 1px 0 var(--tile-shadow);
        }

        /* SVG Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--ink-color);
            stroke-width: var(--ink-width);
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Slight opacity to look like ink on paper */
            opacity: 0.8; 
        }

        /* Active/Lit Path */
        .tile.active .path-line {
            stroke: var(--accent-green-dark);
            opacity: 1;
            stroke-width: calc(var(--ink-width) + 2px);
            /* Subtle glow */
            filter: drop-shadow(0px 2px 2px rgba(67, 160, 71, 0.3));
        }

        /* --- Character & Goal --- */

        /* The Cub Token */
        .cub-token {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 100;
            pointer-events: none;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0px 6px 4px rgba(0,0,0,0.3));
            /* Center the token in the cell */
            transform: translate(-50%, -50%);
        }

        /* CSS Bear Face */
        .cub-face {
            width: 100%;
            height: 100%;
            background: #D84315; /* Warm Bear Orange/Brown */
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.15);
        }

        .cub-ear {
            position: absolute;
            top: -4px;
            width: 16px;
            height: 16px;
            background: #D84315;
            border-radius: 50%;
            z-index: -1;
            box-shadow: inset -1px -1px 0 rgba(0,0,0,0.1);
        }
        .cub-ear.left { left: 2px; }
        .cub-ear.right { right: 2px; }
        .cub-ear-inner {
            position: absolute;
            top: 3px; left: 3px;
            width: 10px; height: 10px;
            background: #FFCCBC;
            border-radius: 50%;
        }

        .cub-eyes {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            display: flex;
            justify-content: space-between;
        }
        .eye {
            width: 5px; height: 6px;
            background: #3E2723;
            border-radius: 50%;
        }
        
        .cub-snout {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 14px;
            background: #FFE0B2;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 2px;
        }
        .nose {
            width: 8px; height: 5px;
            background: #3E2723;
            border-radius: 4px;
        }
        .mouth {
            width: 10px; height: 2px;
            background: #3E2723;
            margin-top: 2px;
            border-radius: 2px;
            opacity: 0.6;
        }

        /* The Goal Star (Magical Glow) */
        .marker-goal {
            position: absolute;
            width: 44px;
            height: 44px;
            z-index: 50;
            transform: translate(-50%, -50%);
            animation: pulse-glow 2s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0 0 10px var(--accent-green));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px #FFF9C4); }
        }

        /* --- Footer UI --- */
        footer {
            margin-top: 24px;
            display: flex;
            gap: 24px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 1.4rem;
            padding: 12px 40px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            color: white;
        }

        /* Run Button: Primary Tactile Block */
        .btn-run {
            background-color: var(--accent-green);
            box-shadow: 
                0 6px 0 var(--accent-green-dark), /* 3D Side */
                0 10px 10px rgba(0,0,0,0.15); /* Shadow */
        }

        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--accent-green-dark),
                0 12px 12px rgba(0,0,0,0.2);
        }

        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0 var(--accent-green-dark),
                0 4px 4px rgba(0,0,0,0.1);
        }

        /* Reset Button: Secondary Stitched Patch */
        .btn-reset {
            background-color: transparent;
            color: var(--accent-terra);
            border: 2px dashed var(--accent-terra);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-reset:hover {
            background-color: rgba(224, 122, 95, 0.1);
            transform: translateY(-2px);
        }

        .btn-reset:active {
            transform: translateY(2px);
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 500px) {
            :root {
                --tile-size: 48px;
                --gap: 4px;
            }
            h1 { font-size: 2.8rem; }
            .game-container { padding: 16px; }
            .cub-token { width: 40px; height: 40px; }
            .cub-ear { width: 12px; height: 12px; }
            .cub-ear-inner { width: 8px; height: 8px; }
            .cub-eyes { top: 12px; width: 18px; }
            .eye { width: 4px; height: 5px; }
            .cub-snout { bottom: 8px; width: 18px; height: 12px; }
            .nose { width: 6px; height: 4px; }
            button { padding: 10px 24px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
        
        <!-- Cub & Star are injected here by JS -->
    </div>

    <footer>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');
        const containerEl = document.querySelector('.game-container');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Generates an SVG string for a tile based on connections [top, right, bottom, left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            // Center point
            const cx = mid;
            const cy = mid;

            let d = "";
            
            // Draw lines from center to edges
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" class="path-line" /></svg>`;
        }

        // Star SVG (SVG Filter Glow)
        const starSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1" />
                        <stop offset="50%" stop-color="#FBC02D" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#F57F17" stop-opacity="0" />
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="40" fill="url(#starGlow)" />
                <path d="M50 15 L61 35 L85 35 L65 50 L72 75 L50 60 L28 75 L35 50 L15 35 L39 35 Z" 
                      fill="#FFF" stroke="#FBC02D" stroke-width="3" stroke-linejoin="round"/>
            </svg>
        `;

        // Cub HTML Structure
        const cubHTML = `
            <div class="cub-face">
                <div class="cub-ear left"><div class="cub-ear-inner"></div></div>
                <div class="cub-ear right"><div class="cub-ear-inner"></div></div>
                <div class="cub-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="cub-snout">
                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>
            </div>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // 1. Create Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Randomize paths for visual fullness (decorative)
                    const types = [
                        [true, false, true, false], // |
                        [false, true, false, true], // -
                        [true, true, false, false], // |->
                        [false, true, true, false], // <-|
                        [true, false, false, true], // |<-
                        [false, false, true, true], // ->|
                        [true, true, true, true]    // +
                    ];
                    
                    let type = types[Math.floor(Math.random() * types.length)];
                    // Ensure start/end look connected vertically for the demo
                    if (x === startPos.x && y === startPos.y) type = [true, false, true, false]; 
                    if (x === endPos.x && y === endPos.y) type = [true, false, true, false]; 

                    tile.innerHTML = createPathSVG(type);
                    gridEl.appendChild(tile);
                }
            }

            // 2. Create Goal Marker (Star)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            positionMarker(goal, endPos.x, endPos.y);
            containerEl.appendChild(goal);

            // 3. Create Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubHTML;
            positionMarker(cub, startPos.x, startPos.y);
            containerEl.appendChild(cub);
        }

        function positionMarker(el, x, y) {
            // Dynamic calculation based on CSS variables
            const style = getComputedStyle(document.documentElement);
            const tileSize = parseInt(style.getPropertyValue('--tile-size'));
            const gap = parseInt(style.getPropertyValue('--gap'));
            
            // Container padding (from CSS .game-container)
            const containerPadding = 20; 
            const gridPadding = gap; 
            
            // Center of the tile
            const top = containerPadding + gridPadding + (y * (tileSize + gap)) + (tileSize / 2);
            const left = containerPadding + gridPadding + (x * (tileSize + gap)) + (tileSize / 2);

            el.style.top = `${top}px`;
            el.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            const cub = document.getElementById('cub');
            positionMarker(cub, startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback on board
            const grid = document.querySelector('.game-container');
            grid.style.transform = 'scale(0.98)';
            setTimeout(() => grid.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // A hardcoded path for the demo effect
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            const cub = document.getElementById('cub');
            let delay = 0;
            const speed = 250; 

            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    positionMarker(cub, pos.x, pos.y);

                    // Fun wiggle effect on Cub
                    cub.style.transform = 'translate(-50%, -50%) rotate(12deg)';
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(-12deg)', 100);
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(0deg)', 200);

                }, delay);
                delay += speed; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
