<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook & Tactile */
            --bg-paper: #F2E8D5;
            --bg-paper-texture: #EBE0CC;
            
            /* Wood Frame Colors */
            --wood-dark: #5D4037;
            --wood-base: #8D6E63;
            --wood-light: #A1887F;
            --wood-inner-shadow: rgba(0,0,0,0.3);
            
            /* Tile & Board */
            --board-bg: #EFEBE9;
            --tile-bg: #FFF8E1; /* Creamy cardboard */
            --tile-shadow: #D7CCC8;
            --tile-bevel: #FFFFFF;
            
            /* Paths */
            --path-color: #37474F; /* Slate/Terracotta dark */
            --path-width: 12px;
            
            /* UI & Accents */
            --ink-dark: #3E2723;
            --ink-muted: #6D4C41;
            
            --accent-cub: #D84315; 
            --accent-star: #FBC02D; 
            --accent-star-glow: #FFF9C4;
            
            --btn-run: #43A047;
            --btn-run-shadow: #2E7D32;
            --btn-reset-bg: #D7CCC8;
            --btn-reset-shadow: #A1887F;
            
            --tile-size: 70px;
            --gap: 10px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Subtle paper texture */
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.03) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-dark);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 16px; /* Reduced margin to group with board */
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.2rem; /* Slightly reduced, cohesive weight */
            margin: 0;
            letter-spacing: 1px;
            color: var(--ink-dark);
            font-weight: 700; /* Balanced weight */
            text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            line-height: 1;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--ink-muted);
            letter-spacing: 1px; /* Tightened */
            text-transform: uppercase;
            font-weight: 800; /* Increased weight/contrast */
            margin-top: 4px;
            opacity: 0.9;
        }

        /* --- The Board Container (Wooden Tray) --- */
        .game-container {
            position: relative;
            padding: 18px; /* Thicker frame */
            background-color: var(--wood-base);
            border-radius: 14px;
            
            /* Tactile 3D Wood Frame */
            box-shadow: 
                /* Outer depth */
                0 15px 35px rgba(44, 36, 27, 0.3),
                0 5px 0 var(--wood-dark), 
                /* Inner bevel highlight */
                inset 0 2px 0 rgba(255,255,255,0.2),
                /* Inner shadow for depth */
                inset 0 0 20px var(--wood-inner-shadow);
            
            border: 1px solid var(--wood-dark);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Wood grain overlay for the frame */
        .game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 14px;
            background: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(0,0,0,0.03) 10px, rgba(0,0,0,0.03) 12px);
            pointer-events: none;
            z-index: 1;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
            background-color: var(--board-bg); /* Gutter color */
            padding: var(--gap);
            border-radius: 8px;
            position: relative;
            /* Deep inset to make the board sit inside the tray */
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
        }

        /* --- Tiles (Cardboard/Physical) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-bg);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            
            /* Cardboard Bevel Effect */
            box-shadow: 
                0 1px 0 var(--tile-bevel), /* Top highlight */
                0 4px 0 var(--tile-shadow), /* Side depth */
                0 6px 6px rgba(0,0,0,0.1); /* Drop shadow */
            
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                0 1px 0 var(--tile-bevel), 
                0 2px 0 var(--tile-shadow), 
                0 2px 3px rgba(0,0,0,0.1);
        }

        /* SVG Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--path-color); /* Slate/Terracotta Dark */
            stroke-width: var(--path-width);
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        /* Active/Lit up state */
        .tile.active .path-line {
            stroke: var(--btn-run); /* Green path when solved */
            opacity: 1;
            stroke-width: calc(var(--path-width) + 2px);
            filter: drop-shadow(0px 2px 0px rgba(46, 125, 50, 0.3));
        }

        /* --- Tokens (Cub & Star) --- */

        /* The Cub Token */
        .cub-token {
            position: absolute;
            width: 56px;
            height: 56px;
            z-index: 100;
            pointer-events: none;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Stronger 3D Lift */
            filter: drop-shadow(0px 6px 4px rgba(0,0,0,0.35));
        }

        /* Stylized Bear Shape */
        .cub-body {
            width: 100%;
            height: 100%;
            background: var(--accent-cub);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            border: 2px solid #BF360C;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.1);
        }

        .cub-ear {
            position: absolute;
            top: -6px;
            width: 18px;
            height: 18px;
            background: var(--accent-cub);
            border: 2px solid #BF360C;
            border-radius: 50%;
            z-index: -1;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.1);
        }
        .cub-ear.left { left: 4px; }
        .cub-ear.right { right: 4px; }

        .cub-face {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -40%);
            width: 36px;
            height: 24px;
        }

        .cub-eye {
            width: 6px;
            height: 8px;
            background: #3E2723;
            border-radius: 50%;
            position: absolute;
            top: 2px;
        }
        .cub-eye.left { left: 7px; }
        .cub-eye.right { right: 7px; }
        
        .cub-snout {
            width: 16px;
            height: 12px;
            background: #FFE0B2;
            border-radius: 8px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }
        .cub-nose {
            width: 7px;
            height: 5px;
            background: #3E2723;
            border-radius: 4px;
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* The Goal Star */
        .marker-goal {
            position: absolute;
            width: 44px;
            height: 44px;
            z-index: 50;
            transform: translate(-50%, -50%);
            /* Pulse Animation */
            animation: pulse-glow 2s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.2));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); filter: drop-shadow(0 0 4px var(--accent-star-glow)); }
            50% { transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 0 10px var(--accent-star)); }
        }

        /* --- Controls & Layout --- */
        footer {
            margin-top: 12px; /* Moved closer */
            display: flex;
            gap: 24px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 12px 40px;
            border-radius: 12px; /* Softer corners, more tactile */
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        /* Primary Run Button - Tactile */
        .btn-run {
            background-color: var(--btn-run);
            color: #fff;
            /* Stacked shadows for physical button feel */
            box-shadow: 
                0 6px 0 var(--btn-run-shadow), 
                0 8px 10px rgba(0,0,0,0.2);
            transform: translateY(0);
        }

        .btn-run:hover {
            background-color: #4CAF50;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-run-shadow), 
                0 12px 14px rgba(0,0,0,0.25);
        }

        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 var(--btn-run-shadow), 
                inset 0 3px 5px rgba(0,0,0,0.2);
        }

        /* Secondary Reset Button - Solid, Balanced */
        .btn-reset {
            background-color: var(--btn-reset-bg);
            color: var(--ink-dark);
            /* Stacked shadows */
            box-shadow: 
                0 6px 0 var(--btn-reset-shadow), 
                0 8px 10px rgba(0,0,0,0.1);
            transform: translateY(0);
        }

        .btn-reset:hover {
            background-color: #EFEBE9;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-reset-shadow), 
                0 12px 14px rgba(0,0,0,0.15);
        }

        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 var(--btn-reset-shadow), 
                inset 0 3px 5px rgba(0,0,0,0.1);
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 550px) {
            :root {
                --tile-size: 50px;
                --gap: 8px;
            }
            h1 { font-size: 2.4rem; }
            .game-container { padding: 12px; }
            .cub-token { width: 42px; height: 42px; }
            footer { flex-direction: row; gap: 16px; }
            button { padding: 10px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
        
        <!-- Cub & Star are injected here by JS -->
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');
        const containerEl = document.querySelector('.game-container');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Generates an SVG string for a tile based on connections [top, right, bottom, left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            // Center point
            const cx = mid;
            const cy = mid;

            let d = "";
            
            // Draw lines from center to edges
            // We extend lines slightly to ensure joints look connected
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" class="path-line" /></svg>`;
        }

        // Star SVG
        const starSVG = `
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L14.5 9.5L22 9.5L16 14.5L18 22L12 17.5L8 22L10 14.5L4 9.5L11.5 9.5L12 2Z" 
                fill="var(--accent-star)" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
        `;

        // Cub SVG (Inlined for the token)
        const cubSVG = `
            <div class="cub-body">
                <div class="cub-ear left"></div>
                <div class="cub-ear right"></div>
                <div class="cub-face">
                    <div class="cub-eye left"></div>
                    <div class="cub-eye right"></div>
                    <div class="cub-snout">
                        <div class="cub-nose"></div>
                    </div>
                </div>
            </div>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // 1. Create Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Randomize paths for visual fullness (decorative)
                    const types = [
                        [true, false, true, false], // |
                        [false, true, false, true], // -
                        [true, true, false, false], // |->
                        [false, true, true, false], // <-|
                        [true, false, false, true], // |<-
                        [false, false, true, true], // ->|
                        [true, true, true, true]    // +
                    ];
                    
                    let type = types[Math.floor(Math.random() * types.length)];
                    // Simple logic to make start/end look connected vertically
                    if (x === startPos.x && y === startPos.y) type = [true, false, true, false]; 
                    if (x === endPos.x && y === endPos.y) type = [true, false, true, false]; 

                    tile.innerHTML = createPathSVG(type);
                    gridEl.appendChild(tile);
                }
            }

            // 2. Create Goal Marker (Star)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            positionMarker(goal, endPos.x, endPos.y);
            containerEl.appendChild(goal);

            // 3. Create Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubSVG;
            positionMarker(cub, startPos.x, startPos.y);
            containerEl.appendChild(cub);
        }

        function positionMarker(el, x, y) {
            // Dynamic calculation based on CSS variables
            const style = getComputedStyle(document.documentElement);
            const tileSize = parseInt(style.getPropertyValue('--tile-size'));
            const gap = parseInt(style.getPropertyValue('--gap'));
            
            // Container padding is 18px (from CSS .game-container)
            const containerPadding = 18; 
            const gridPadding = gap; 
            
            // Center of the tile
            const top = containerPadding + gridPadding + (y * (tileSize + gap)) + (tileSize / 2);
            const left = containerPadding + gridPadding + (x * (tileSize + gap)) + (tileSize / 2);

            el.style.top = `${top}px`;
            el.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            const cub = document.getElementById('cub');
            positionMarker(cub, startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback on board
            const grid = document.querySelector('.game-container');
            grid.style.transform = 'scale(0.96)';
            setTimeout(() => grid.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // A hardcoded path for the demo effect
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            const cub = document.getElementById('cub');
            let delay = 0;
            const speed = 250; 

            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    positionMarker(cub, pos.x, pos.y);

                    // Fun wiggle effect on Cub
                    cub.style.transform = 'translate(-50%, -50%) rotate(10deg)';
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(-10deg)', 100);
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(0deg)', 200);

                }, delay);
                delay += speed; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
