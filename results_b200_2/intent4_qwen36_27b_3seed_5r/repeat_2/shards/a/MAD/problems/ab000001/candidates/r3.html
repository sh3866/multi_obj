<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Typography --- */
            /* Fallback to system slab/rounded fonts to avoid network requests */
            --font-display: 'Fredoka One', 'Cooper Black', 'Arial Rounded MT Bold', 'Impact', system-ui, sans-serif;
            --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;

            /* --- Palette: Warm Storybook & Tactile --- */
            --bg-parchment: #F7F1E3;
            --bg-parchment-dark: #EBE0CC;
            
            /* Wood Frame Colors */
            --wood-dark: #5D4037;
            --wood-base: #8D6E63;
            --wood-light: #A1887F;
            --wood-inner-shadow: rgba(0,0,0,0.4);
            
            /* Tile & Board */
            --board-bg: #E8DFC8; /* Warmer gutter */
            --tile-bg: #FFFDF5;  /* Creamy paper */
            --tile-shadow: #D7CCC8;
            --tile-bevel: #FFFFFF;
            
            /* Paths */
            --path-color: #5D4037; /* Dark brown ink */
            --path-width: 14px;
            
            /* UI & Accents */
            --ink-dark: #3E2723;
            --ink-muted: #6D4C41;
            
            --accent-cub: #D84315; 
            --accent-star: #FBC02D; 
            --accent-star-glow: #FFF9C4;
            
            /* Buttons */
            --btn-run: #4CAF50;
            --btn-run-dark: #388E3C;
            --btn-reset: #E07A5F; /* Terracotta */
            --btn-reset-dark: #C25E45;
            
            --tile-size: 70px;
            --gap: 8px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-parchment);
            
            /* Subtle Paper Texture (Inline SVG Noise) */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-dark);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
            color: var(--ink-dark);
            font-weight: 900;
            text-transform: uppercase;
            /* Storybook drop shadow */
            text-shadow: 3px 3px 0px var(--bg-parchment-dark);
            line-height: 1;
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--ink-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 6px;
            opacity: 0.8;
        }

        /* --- The Board Container (Wooden Tray) --- */
        .game-container {
            position: relative;
            padding: 24px;
            background-color: var(--wood-base);
            border-radius: 18px; /* Softer frame */
            
            /* Tactile 3D Wood Frame */
            box-shadow: 
                0 20px 40px rgba(44, 36, 27, 0.25),
                0 8px 0 var(--wood-dark), 
                inset 0 2px 0 rgba(255,255,255,0.2),
                inset 0 -5px 10px var(--wood-inner-shadow);
            
            border: 1px solid var(--wood-dark);
            transition: transform 0.3s ease;
        }

        /* Wood grain overlay for the frame */
        .game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 18px;
            /* Soft, organic wood grain pattern */
            background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(0,0,0,0.03) 20px, rgba(0,0,0,0.03) 22px);
            pointer-events: none;
            z-index: 1;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
            background-color: var(--board-bg); 
            padding: var(--gap);
            border-radius: 10px; /* Slight rounding on the board interior */
            position: relative;
            /* Deep inset */
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.15);
        }

        /* --- Tiles (Paper/Physical) --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-bg);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            
            /* Paper Bevel Effect */
            box-shadow: 
                0 1px 0 var(--tile-bevel), 
                0 3px 0 var(--tile-shadow), 
                0 5px 5px rgba(0,0,0,0.08);
            
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                0 1px 0 var(--tile-bevel), 
                0 1px 0 var(--tile-shadow), 
                0 1px 2px rgba(0,0,0,0.08);
        }

        /* SVG Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
        }

        .path-line {
            fill: none;
            stroke: var(--path-color);
            stroke-width: var(--path-width);
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        /* Active/Lit up state */
        .tile.active .path-line {
            stroke: var(--btn-run); /* Green path */
            opacity: 1;
            stroke-width: calc(var(--path-width) + 2px);
            filter: drop-shadow(0px 2px 0px rgba(56, 142, 60, 0.4));
        }

        /* --- Tokens (Cub & Star) --- */

        /* The Cub Token (3D style) */
        .cub-token {
            position: absolute;
            width: 56px;
            height: 56px;
            z-index: 100;
            pointer-events: none;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Stronger 3D Lift */
            filter: drop-shadow(0px 8px 5px rgba(0,0,0,0.3));
        }

        /* Stylized Bear Shape */
        .cub-body {
            width: 100%;
            height: 100%;
            background: var(--accent-cub);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            border: 2px solid #BF360C;
            /* Inner shadow for volume */
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.15), inset 4px 4px 0 rgba(255,255,255,0.1);
        }

        .cub-ear {
            position: absolute;
            top: -6px;
            width: 18px;
            height: 18px;
            background: var(--accent-cub);
            border: 2px solid #BF360C;
            border-radius: 50%;
            z-index: -1;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.1);
        }
        .cub-ear.left { left: 4px; }
        .cub-ear.right { right: 4px; }

        .cub-face {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -40%);
            width: 36px;
            height: 24px;
        }

        .cub-eye {
            width: 6px;
            height: 8px;
            background: #3E2723;
            border-radius: 50%;
            position: absolute;
            top: 2px;
        }
        .cub-eye.left { left: 7px; }
        .cub-eye.right { right: 7px; }
        
        .cub-snout {
            width: 18px;
            height: 14px;
            background: #FFE0B2;
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }
        .cub-nose {
            width: 7px;
            height: 5px;
            background: #3E2723;
            border-radius: 4px;
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* The Goal Star (3D style to match Cub) */
        .marker-goal {
            position: absolute;
            width: 48px;
            height: 48px;
            z-index: 50;
            transform: translate(-50%, -50%);
            /* Pulse Animation */
            animation: pulse-glow 2.5s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0px 6px 4px rgba(0,0,0,0.25));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); filter: drop-shadow(0 0 4px var(--accent-star-glow)); }
            50% { transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 0 12px var(--accent-star)); }
        }

        /* --- Controls & Layout --- */
        footer {
            margin-top: 24px;
            display: flex;
            gap: 32px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 1.3rem;
            padding: 12px 48px;
            border-radius: 14px; /* Softer corners */
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.1s ease;
            position: relative;
            
            /* --- INSET PLAQUE STYLE --- */
            /* This creates the "physical patch" look */
            box-shadow: 
                inset 0 3px 6px rgba(255,255,255,0.3), /* Top inner highlight */
                inset 0 -4px 0 rgba(0,0,0,0.2), /* Bottom inner depth */
                0 2px 4px rgba(0,0,0,0.15); /* Subtle drop shadow */
        }

        /* Primary Run Button */
        .btn-run {
            background-color: var(--btn-run);
            color: #fff;
            /* Stitched border effect */
            border: 2px dashed rgba(255,255,255,0.3); 
        }

        .btn-run:hover {
            background-color: #56C960;
            transform: translateY(-1px);
            box-shadow: 
                inset 0 4px 8px rgba(255,255,255,0.4),
                inset 0 -4px 0 rgba(0,0,0,0.2),
                0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-run:active {
            transform: translateY(1px);
            background-color: #43A047;
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.2), /* Invert shadows on press */
                inset 0 -1px 0 rgba(0,0,0,0.1);
        }

        /* Secondary Reset Button (Terracotta) */
        .btn-reset {
            background-color: var(--btn-reset);
            color: #fff;
            /* Stitched border effect */
            border: 2px dashed rgba(255,255,255,0.3);
        }

        .btn-reset:hover {
            background-color: #EB8B73;
            transform: translateY(-1px);
            box-shadow: 
                inset 0 4px 8px rgba(255,255,255,0.4),
                inset 0 -4px 0 rgba(0,0,0,0.2),
                0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-reset:active {
            transform: translateY(1px);
            background-color: #CD6E55;
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.2),
                inset 0 -1px 0 rgba(0,0,0,0.1);
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 550px) {
            :root {
                --tile-size: 52px;
                --gap: 6px;
            }
            h1 { font-size: 2.6rem; }
            .game-container { padding: 14px; }
            .cub-token { width: 42px; height: 42px; }
            footer { flex-direction: row; gap: 16px; }
            button { padding: 10px 20px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
        
        <!-- Cub & Star are injected here by JS -->
    </div>

    <!-- Footer: Run on Left, Reset on Right -->
    <footer>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');
        const containerEl = document.querySelector('.game-container');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Generates an SVG string for a tile based on connections [top, right, bottom, left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            // Center point
            const cx = mid;
            const cy = mid;

            let d = "";
            
            // Draw lines from center to edges
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" class="path-line" /></svg>`;
        }

        // Star SVG (3D style with highlights)
        const starSVG = `
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="starShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="2" stdDeviation="1" flood-opacity="0.3"/>
                    </filter>
                </defs>
                <path d="M12 2L14.5 9.5L22 9.5L16 14.5L18 22L12 17.5L8 22L10 14.5L4 9.5L11.5 9.5L12 2Z" 
                fill="var(--accent-star)" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round" filter="url(#starShadow)"/>
                <path d="M12 2L14.5 9.5L22 9.5L16 14.5L18 22L12 17.5L8 22L10 14.5L4 9.5L11.5 9.5L12 2Z" 
                fill="rgba(255,255,255,0.2)" stroke="none" transform="translate(-1, -1)"/>
            </svg>
        `;

        // Cub SVG (Inlined for the token)
        const cubSVG = `
            <div class="cub-body">
                <div class="cub-ear left"></div>
                <div class="cub-ear right"></div>
                <div class="cub-face">
                    <div class="cub-eye left"></div>
                    <div class="cub-eye right"></div>
                    <div class="cub-snout">
                        <div class="cub-nose"></div>
                    </div>
                </div>
            </div>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // 1. Create Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Randomize paths for visual fullness (decorative)
                    const types = [
                        [true, false, true, false], // |
                        [false, true, false, true], // -
                        [true, true, false, false], // |->
                        [false, true, true, false], // <-|
                        [true, false, false, true], // |<-
                        [false, false, true, true], // ->|
                        [true, true, true, true]    // +
                    ];
                    
                    let type = types[Math.floor(Math.random() * types.length)];
                    // Simple logic to make start/end look connected vertically
                    if (x === startPos.x && y === startPos.y) type = [true, false, true, false]; 
                    if (x === endPos.x && y === endPos.y) type = [true, false, true, false]; 

                    tile.innerHTML = createPathSVG(type);
                    gridEl.appendChild(tile);
                }
            }

            // 2. Create Goal Marker (Star)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            positionMarker(goal, endPos.x, endPos.y);
            containerEl.appendChild(goal);

            // 3. Create Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubSVG;
            positionMarker(cub, startPos.x, startPos.y);
            containerEl.appendChild(cub);
        }

        function positionMarker(el, x, y) {
            // Dynamic calculation based on CSS variables
            const style = getComputedStyle(document.documentElement);
            const tileSize = parseInt(style.getPropertyValue('--tile-size'));
            const gap = parseInt(style.getPropertyValue('--gap'));
            
            // Container padding is 24px (from CSS .game-container)
            const containerPadding = 24; 
            const gridPadding = gap; 
            
            // Center of the tile
            const top = containerPadding + gridPadding + (y * (tileSize + gap)) + (tileSize / 2);
            const left = containerPadding + gridPadding + (x * (tileSize + gap)) + (tileSize / 2);

            el.style.top = `${top}px`;
            el.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            const cub = document.getElementById('cub');
            positionMarker(cub, startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback on board
            const grid = document.querySelector('.game-container');
            grid.style.transform = 'scale(0.98)';
            setTimeout(() => grid.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // A hardcoded path for the demo effect
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            const cub = document.getElementById('cub');
            let delay = 0;
            const speed = 250; 

            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    positionMarker(cub, pos.x, pos.y);

                    // Fun wiggle effect on Cub
                    cub.style.transform = 'translate(-50%, -50%) rotate(12deg)';
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(-12deg)', 100);
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(0deg)', 200);

                }, delay);
                delay += speed; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
