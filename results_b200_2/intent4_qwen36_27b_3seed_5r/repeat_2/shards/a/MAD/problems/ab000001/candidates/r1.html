<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-paper: #F7F1E3;
            --wood-frame: #5D4037;
            --wood-frame-light: #795548;
            --tile-bg: #FFFDF7;
            --tile-shadow: #E6DCC3;
            --ink-dark: #3E2723;
            --ink-muted: #8D6E63;
            --accent-cub: #D84315; /* Terracotta Red-Orange */
            --accent-star: #FBC02D; /* Mustard Gold */
            --accent-path: #2E7D32; /* Deep Green */
            --btn-primary: #43A047; /* Storybook Green */
            --btn-primary-shadow: #2E7D32;
            --tile-size: 70px;
            --gap: 8px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Parchment Texture via CSS */
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.05) 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 8px);
            font-family: 'Nunito', 'Fredoka One', 'Arial Rounded MT Bold', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-dark);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
            color: var(--ink-dark);
            font-weight: 800; /* Heavy/Chunky */
            text-transform: uppercase;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.08);
            line-height: 1;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--ink-muted);
            letter-spacing: 4px; /* Increased letter-spacing */
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* --- The Board Container --- */
        .game-container {
            position: relative;
            padding: 16px;
            background: var(--wood-frame);
            border-radius: 16px;
            /* Tactile, warm drop shadow */
            box-shadow: 
                0 20px 40px rgba(44, 36, 27, 0.25),
                0 5px 0 rgba(0,0,0,0.2); 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Inner bevel for frame depth */
        .game-container::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            pointer-events: none;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
            /* Beige gap/gutter background */
            background-color: #EFEBE9; 
            padding: var(--gap);
            border-radius: 8px;
            position: relative;
        }

        /* --- Tiles --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-bg);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            /* Card depth */
            box-shadow: 
                0 2px 0 var(--tile-shadow), 
                0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 var(--tile-shadow);
        }

        /* SVG Paths inside tiles */
        .tile svg {
            width: 85%;
            height: 85%;
            display: block;
        }

        .path-line {
            fill: none;
            stroke: var(--ink-muted);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.4;
            transition: all 0.3s ease;
        }

        /* Active/Lit up state */
        .tile.active .path-line {
            stroke: var(--accent-path);
            opacity: 1;
            stroke-width: 12;
            filter: drop-shadow(0px 2px 0px rgba(46, 125, 50, 0.2));
        }

        /* --- Assets: Cub & Star --- */

        /* The Cub Token */
        .cub-token {
            position: absolute;
            width: 56px;
            height: 56px;
            z-index: 100;
            pointer-events: none;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.2));
        }

        /* Stylized Bear Shape */
        .cub-body {
            width: 100%;
            height: 100%;
            background: var(--accent-cub);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            border: 2px solid #BF360C;
        }

        .cub-ear {
            position: absolute;
            top: -6px;
            width: 16px;
            height: 16px;
            background: var(--accent-cub);
            border: 2px solid #BF360C;
            border-radius: 50%;
            z-index: -1;
        }
        .cub-ear.left { left: 2px; }
        .cub-ear.right { right: 2px; }

        .cub-face {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -40%);
            width: 36px;
            height: 24px;
        }

        .cub-eye {
            width: 5px;
            height: 7px;
            background: #3E2723;
            border-radius: 50%;
            position: absolute;
            top: 2px;
        }
        .cub-eye.left { left: 6px; }
        .cub-eye.right { right: 6px; }
        
        .cub-snout {
            width: 14px;
            height: 10px;
            background: #FFE0B2;
            border-radius: 6px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .cub-nose {
            width: 6px;
            height: 4px;
            background: #3E2723;
            border-radius: 3px;
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* The Goal Star */
        .marker-goal {
            position: absolute;
            width: 40px;
            height: 40px;
            z-index: 50;
            transform: translate(-50%, -50%);
            /* Pulse Animation */
            animation: pulse-glow 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.9); filter: drop-shadow(0 0 2px var(--accent-star)); }
            50% { transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 0 8px var(--accent-star)); }
        }

        /* --- Footer & Buttons --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 12px 36px;
            border-radius: 50px; /* Pill shape */
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        /* Primary Run Button */
        .btn-run {
            background-color: var(--btn-primary);
            color: #fff;
            box-shadow: 0 6px 0 var(--btn-primary-shadow), 0 10px 10px rgba(0,0,0,0.1);
            transform: translateY(0);
        }

        .btn-run:hover {
            background-color: #4CAF50;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--btn-primary-shadow), 0 12px 14px rgba(0,0,0,0.15);
        }

        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--btn-primary-shadow), inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Secondary Reset Button (Ghost) */
        .btn-reset {
            background-color: transparent;
            color: var(--ink-muted);
            border: 2px solid var(--ink-muted);
        }

        .btn-reset:hover {
            background-color: rgba(141, 110, 99, 0.1);
            color: var(--ink-dark);
            border-color: var(--ink-dark);
        }

        .btn-reset:active {
            transform: translateY(2px);
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 550px) {
            :root {
                --tile-size: 52px;
                --gap: 6px;
            }
            h1 { font-size: 2.5rem; }
            .game-container { padding: 10px; }
            .cub-token { width: 44px; height: 44px; }
            footer { flex-direction: column; gap: 12px; }
            button { width: 100%; max-width: 240px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
        
        <!-- Cub & Star are injected here by JS -->
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');
        const containerEl = document.querySelector('.game-container');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 1, y: 1 }; 
        const endPos = { x: 4, y: 5 };

        // --- SVG Generators ---
        
        // Generates an SVG string for a tile based on connections [top, right, bottom, left]
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            // Center point
            const cx = mid;
            const cy = mid;

            let d = "";
            
            // Draw lines from center to edges
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" class="path-line" /></svg>`;
        }

        // Star SVG
        const starSVG = `
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L14.5 9.5L22 9.5L16 14.5L18 22L12 17.5L8 22L10 14.5L4 9.5L11.5 9.5L12 2Z" 
                fill="var(--accent-star)" stroke="#FFF" stroke-width="1" stroke-linejoin="round"/>
            </svg>
        `;

        // Cub SVG (Inlined for the token)
        const cubSVG = `
            <div class="cub-body">
                <div class="cub-ear left"></div>
                <div class="cub-ear right"></div>
                <div class="cub-face">
                    <div class="cub-eye left"></div>
                    <div class="cub-eye right"></div>
                    <div class="cub-snout">
                        <div class="cub-nose"></div>
                    </div>
                </div>
            </div>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // 1. Create Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Randomize paths for visual fullness (decorative)
                    // In a real game, this would be level data
                    const types = [
                        [true, false, true, false], // |
                        [false, true, false, true], // -
                        [true, true, false, false], // |->
                        [false, true, true, false], // <-|
                        [true, false, false, true], // |<-
                        [false, false, true, true], // ->|
                        [true, true, true, true]    // +
                    ];
                    
                    // Simple logic to make start/end look connected vertically
                    let type = types[Math.floor(Math.random() * types.length)];
                    if (x === startPos.x && y === startPos.y) type = [true, false, true, false]; // Start vertical
                    if (x === endPos.x && y === endPos.y) type = [true, false, true, false]; // End vertical

                    tile.innerHTML = createPathSVG(type);
                    gridEl.appendChild(tile);
                }
            }

            // 2. Create Goal Marker (Star)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            // Position Star
            positionMarker(goal, endPos.x, endPos.y);
            containerEl.appendChild(goal);

            // 3. Create Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = cubSVG;
            // Position Cub
            positionMarker(cub, startPos.x, startPos.y);
            containerEl.appendChild(cub);
        }

        function positionMarker(el, x, y) {
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
            
            // Calculate position relative to the container (including padding)
            // Container padding is 16px (from CSS .game-container)
            const containerPadding = 16;
            const gridPadding = gap; // The gap inside the grid wrapper
            
            // Center of the tile
            const top = containerPadding + gridPadding + (y * (tileSize + gap)) + (tileSize / 2);
            const left = containerPadding + gridPadding + (x * (tileSize + gap)) + (tileSize / 2);

            el.style.top = `${top}px`;
            el.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            // Reset Cub to start
            const cub = document.getElementById('cub');
            positionMarker(cub, startPos.x, startPos.y);
            
            // Clear active states
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback on board
            const grid = document.querySelector('.game-container');
            grid.style.transform = 'scale(0.96)';
            setTimeout(() => grid.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // Simulate a "Run" by lighting up a path and moving the cub
            // A hardcoded path for the demo effect
            const pathCoords = [
                {x:1, y:1}, {x:1, y:2}, {x:1, y:3}, 
                {x:2, y:3}, {x:3, y:3}, {x:4, y:3}, 
                {x:4, y:4}, {x:4, y:5}
            ];

            const cub = document.getElementById('cub');
            let delay = 0;
            const speed = 250; // ms per step

            // Clear previous
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    // Light up tile
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');

                    // Move Cub
                    positionMarker(cub, pos.x, pos.y);

                    // Fun wiggle effect on Cub
                    cub.style.transform = 'translate(-50%, -50%) rotate(5deg)';
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(-5deg)', 100);
                    setTimeout(() => cub.style.transform = 'translate(-50%, -50%) rotate(0deg)', 200);

                }, delay);
                delay += speed; 
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
