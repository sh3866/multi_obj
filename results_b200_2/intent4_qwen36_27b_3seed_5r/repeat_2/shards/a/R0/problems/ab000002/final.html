<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix</title>
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-panel: #11131a;
            --bg-card: #1a1d27;
            --accent-gold: #d4af37;
            --accent-gold-dim: #8a701e;
            --accent-blue: #4facfe;
            --accent-cyan: #00f2fe;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #2d3748;
            --node-size: 48px;
            --font-serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, #1a202c 0%, var(--bg-dark) 60%),
                linear-gradient(0deg, rgba(0,0,0,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.2) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 320px;
            background: rgba(17, 19, 26, 0.95);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .avatar-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            padding: 4px;
            margin: 0 auto 1rem;
            position: relative;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #2d3748;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--text-muted);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .class-title {
            color: var(--accent-gold);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.25rem;
            font-weight: 600;
        }

        .level-badge {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-dark);
            border: 1px solid var(--accent-gold);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* --- Stats Panel --- */
        .stat-block {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .stat-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-gold);
            opacity: 0.5;
        }

        .xp-container {
            margin-bottom: 0.5rem;
        }

        .xp-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-track {
            height: 6px;
            background: #000;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
            width: 65%;
            box-shadow: 0 0 10px var(--accent-gold);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            width: 30%;
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        .points-available {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .points-label {
            color: var(--text-main);
            font-weight: 500;
        }

        .points-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            font-family: var(--font-serif);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mini-stat {
            background: rgba(0,0,0,0.2);
            padding: 0.5rem;
            border-radius: 4px;
            text-align: center;
        }

        .mini-stat span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .mini-stat strong {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 20, 30, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 1rem;
            border-radius: 4px;
            width: 260px;
            opacity: 0;
            transition: opacity 0.2s ease;
            transform: translate(15px, -50%);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .tooltip-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: var(--accent-gold);
        }

        .tooltip-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 2px;
        }

        .tooltip-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 0.8rem;
        }

        .tooltip-stats {
            font-size: 0.8rem;
            color: var(--accent-cyan);
        }

        /* --- Footer Controls --- */
        .controls {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 20;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background: #252936;
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-reset {
            color: #ef4444;
        }
        .btn-reset:hover {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <h1>Kaelen</h1>
            <div class="class-title">Arcane Weaver</div>
            <div class="level-badge">LVL 42</div>
        </div>

        <div class="stat-block">
            <div class="xp-container">
                <div class="xp-label">
                    <span>Experience</span>
                    <span>65,400 / 100,000</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="stat-block">
            <div class="points-available">
                <span class="points-label">Skill Points</span>
                <span class="points-value" id="points-display">12</span>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: -0.5rem;">
                Available to spend
            </div>
        </div>

        <div class="stat-grid">
            <div class="mini-stat">
                <span>Intelligence</span>
                <strong>18</strong>
            </div>
            <div class="mini-stat">
                <span>Willpower</span>
                <strong>14</strong>
            </div>
            <div class="mini-stat">
                <span>Mana</span>
                <strong>450</strong>
            </div>
            <div class="mini-stat">
                <span>Crit Chance</span>
                <strong>12%</strong>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage">
        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetTree()">Reset Tree</button>
            <button class="btn" onclick="alert('Build Saved!')">Save Build</button>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "Unlocks all magic paths. Increases mana regen.", stat: "+5% Mana Regen", unlocked: true, color: "#d4af37" },
            
            // Left Branch: Destruction
            { id: 1, x: -200, y: -150, name: "Fire Affinity", type: "Passive", desc: "Increases fire damage.", stat: "+10% Fire Dmg", unlocked: false, color: "#ef4444", parents: [0] },
            { id: 2, x: -200, y: -300, name: "Combustion", type: "Active", desc: "Your spells ignite targets.", stat: "Ignite Chance +2%", unlocked: false, color: "#ef4444", parents: [1] },
            { id: 3, x: -400, y: -225, name: "Inferno", type: "Ultimate", desc: "Creates a zone of fire.", stat: "Area Damage", unlocked: false, color: "#ef4444", parents: [2] },
            { id: 4, x: -100, y: -225, name: "Fireball Mastery", type: "Passive", desc: "Fireballs travel faster.", stat: "+20% Speed", unlocked: false, color: "#ef4444", parents: [1] },

            // Right Branch: Ice
            { id: 5, x: 200, y: -150, name: "Frost Touch", type: "Passive", desc: "Attacks slow enemies.", stat: "Slow 10%", unlocked: false, color: "#4facfe", parents: [0] },
            { id: 6, x: 200, y: -300, name: "Deep Freeze", type: "Passive", desc: "Slows stack up to 50%.", stat: "Max Slow 50%", unlocked: false, color: "#4facfe", parents: [5] },
            { id: 7, x: 400, y: -225, name: "Glacial Storm", type: "Ultimate", desc: "Blizzard effect.", stat: "Heavy Damage", unlocked: false, color: "#4facfe", parents: [6] },
            { id: 8, x: 100, y: -225, name: "Ice Armor", type: "Defensive", desc: "Mana shield on hit.", stat: "+15% Shield", unlocked: false, color: "#4facfe", parents: [5] },

            // Center Branch: Utility/Summoning
            { id: 9, x: 0, y: -200, name: "Arcane Intellect", type: "Passive", desc: "Boosts intelligence.", stat: "+5 Int", unlocked: false, color: "#a855f7", parents: [0] },
            { id: 10, x: 0, y: -350, name: "Mana Siphon", type: "Active", desc: "Heal mana on kill.", stat: "Lifesteal Mana", unlocked: false, color: "#a855f7", parents: [9] },
            { id: 11, x: 0, y: -500, name: "Archmage", type: "Trait", desc: "Ultimate power.", stat: "+10% All Stats", unlocked: false, color: "#a855f7", parents: [10] },

            // Bottom Branch: Defense
            { id: 12, x: 0, y: 150, name: "Mental Fortitude", type: "Defense", desc: "Reduces magic damage taken.", stat: "-10% Dmg Taken", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -150, y: 250, name: "Shield Wall", type: "Defense", desc: "Increases max mana.", stat: "+200 Mana", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 150, y: 250, name: "Evasion", type: "Defense", desc: "Chance to dodge magic.", stat: "+5% Dodge", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            offsetX = width / 2;
            offsetY = height / 2;
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function getScreenPos(x, y) {
            return {
                x: x * scale + offsetX,
                y: y * scale + offsetY
            };
        }

        function draw() {
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Background Grid Pattern (Subtle)
            drawGrid();

            // Draw Connections
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            nodes.forEach(node => {
                drawNode(node);
            });
        }

        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50 * scale;
            
            // Offset grid based on pan
            const startX = offsetX % gridSize;
            const startY = offsetY % gridSize;

            ctx.beginPath();
            for (let x = startX; x < width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = startY; y < height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Bezier curve for smoother look
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineWidth = 4 * scale;
            ctx.lineCap = 'round';
            
            // Gradient line
            const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
            
            if (isPathUnlocked) {
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, child.color);
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 10;
                ctx.shadowColor = child.color;
            } else if (parent.unlocked && !child.unlocked) {
                // Partially unlocked (path exists but node is locked)
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, 'rgba(255,255,255,0.05)');
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 0;
            } else {
                // Locked path
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.shadowBlur = 0;
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            const radius = (node.type === 'Ultimate' ? 28 : 20) * scale;
            
            // Glow
            if (node.unlocked) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = node.color;
            } else {
                ctx.shadowBlur = 0;
            }

            // Main Circle
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = node.unlocked ? node.color : '#1a1d27';
            ctx.fill();
            
            // Border
            ctx.lineWidth = 2 * scale;
            ctx.strokeStyle = node.unlocked ? '#fff' : '#334155';
            ctx.stroke();
            
            // Inner Detail (Icon representation)
            ctx.fillStyle = node.unlocked ? '#fff' : '#475569';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius * 0.4, 0, Math.PI * 2);
            ctx.fill();

            // Hover Effect
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 5, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Label
            ctx.fillStyle = '#94a3b8';
            ctx.font = `${10 * scale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(node.name, pos.x, pos.y + radius + (15 * scale));
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Colorize type
            ttType.style.color = node.color;

            // Position tooltip
            let left = mouseX + 20;
            let top = mouseY - 50;
            
            // Keep within bounds
            if (left + 260 > width) left = mouseX - 280;
            if (top < 0) top = 10;
            if (top + 150 > height) top = height - 160;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            // Reverse transform to get world coordinates
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            // Check collision
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = node.type === 'Ultimate' ? 28 : 20;
                
                if (dist < hitRadius) {
                    if (!node.unlocked) {
                        // Check parents
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            // Hover detection
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' ? 28 : 20) + 5; // Add padding
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            isDragging = true;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'grab';
                // If barely moved, treat as click
                // (Simplified logic: we rely on mouseup for drag end, 
                // but strictly separating drag vs click requires distance check)
            }
        });
        
        // Separate click handler to avoid drag interference
        canvas.addEventListener('click', (e) => {
             if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                checkClick(e.clientX - rect.left, e.clientY - rect.top);
             }
        });

        // Reset Logic
        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
