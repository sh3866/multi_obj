<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree</title>
<style>
  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New'), local('Courier'), local('monospace');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #game-container {
    position: relative;
    width: 640px;
    height: 480px;
    border: 4px solid #4a4a6a;
    box-shadow: 
      0 0 0 2px #1a1a2e,
      0 0 0 6px #3a3a5a,
      0 0 40px rgba(100, 150, 255, 0.15),
      inset 0 0 60px rgba(0,0,0,0.3);
    border-radius: 2px;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    z-index: 10;
  }

  #crt-flicker {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 11;
    opacity: 0;
    background: rgba(255,255,255,0.02);
    animation: flicker 0.15s infinite;
  }

  @keyframes flicker {
    0% { opacity: 0; }
    5% { opacity: 0.02; }
    10% { opacity: 0; }
    15% { opacity: 0.03; }
    20% { opacity: 0; }
    100% { opacity: 0; }
  }

  #vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  }

  #ui-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #title {
    margin-top: 28px;
    font-size: 52px;
    font-weight: bold;
    color: #e8f0ff;
    text-shadow: 
      3px 3px 0 #2a4a8a,
      -1px -1px 0 #5a8adf,
      0 0 20px rgba(100,180,255,0.3);
    letter-spacing: 8px;
    text-transform: uppercase;
    position: relative;
    user-select: none;
  }

  #title::after {
    content: '';
    display: block;
    width: 200px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #5a8adf, #8ab4ff, #5a8adf, transparent);
    margin: 6px auto 0;
    border-radius: 1px;
  }

  #subtitle {
    margin-top: 12px;
    font-size: 11px;
    color: #7a9ac0;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 #1a2a4a;
  }

  #start-btn {
    margin-top: 30px;
    padding: 12px 48px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e0ecff;
    background: linear-gradient(180deg, #3a5a9a 0%, #2a4070 50%, #1e3050 100%);
    border: 2px solid #5a8adf;
    border-radius: 2px;
    cursor: pointer;
    pointer-events: all;
    position: relative;
    text-shadow: 1px 1px 0 #0a1a3a;
    box-shadow: 
      0 4px 0 #0e1e3a,
      0 6px 12px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.15);
    transition: all 0.1s ease;
    user-select: none;
  }

  #start-btn:hover {
    background: linear-gradient(180deg, #4a6aaa 0%, #3a5080 50%, #2a4060 100%);
    border-color: #7aaaff;
    box-shadow: 
      0 4px 0 #0e1e3a,
      0 6px 16px rgba(80,140,255,0.3),
      inset 0 1px 0 rgba(255,255,255,0.2);
    color: #ffffff;
  }

  #start-btn:active {
    transform: translateY(2px);
    box-shadow: 
      0 2px 0 #0e1e3a,
      0 3px 8px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  #start-btn .btn-pixel-l, #start-btn .btn-pixel-r {
    position: absolute;
    top: -2px;
    width: 4px;
    height: 4px;
    background: #5a8adf;
  }
  #start-btn .btn-pixel-l { left: -2px; }
  #start-btn .btn-pixel-r { right: -2px; }

  #instructions {
    margin-top: 20px;
    font-size: 10px;
    color: #5a7a9a;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.8;
    text-shadow: 1px 1px 0 #0a1525;
  }

  #instructions kbd {
    display: inline-block;
    padding: 1px 6px;
    background: #2a3a5a;
    border: 1px solid #4a5a7a;
    border-radius: 2px;
    color: #8ab4ff;
    font-family: inherit;
    font-size: 10px;
    box-shadow: 0 2px 0 #1a2a3a;
  }

  #score-hud {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 11px;
    color: #6a8aaa;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #0a1525;
    z-index: 6;
  }

  #score-hud span {
    color: #a0c4e8;
  }

  #footer-art {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: #3a4a5a;
    letter-spacing: 1px;
    z-index: 6;
    user-select: none;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="scene" width="320" height="240"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="crt-flicker"></div>
  <div id="ui-overlay">
    <div id="title">SkiFree</div>
    <div id="subtitle">A Winter Descent</div>
    <button id="start-btn">
      <span class="btn-pixel-l"></span>
      <span class="btn-pixel-r"></span>
      Start
    </button>
    <div id="instructions">
      <kbd>←</kbd> <kbd>→</kbd> Steer &nbsp;&nbsp; <kbd>↑</kbd> Accelerate &nbsp;&nbsp; <kbd>↓</kbd> Brake<br>
      Avoid trees. Don't stop. Don't look back.
    </div>
  </div>
  <div id="score-hud">SCORE: <span>0</span> &nbsp; SPEED: <span>0</span></div>
  <div id="footer-art">■ SKIFREE v1.0 ■</div>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320, H = 240;

// Pixel art palette
const PAL = {
  sky1: '#1a2a4a',
  sky2: '#2a3a6a',
  sky3: '#3a5a9a',
  snow1: '#d8e4f0',
  snow2: '#c0d0e4',
  snow3: '#e0ecf8',
  snow4: '#b0c0d8',
  tree1: '#1a4a1a',
  tree2: '#2a6a2a',
  tree3: '#1a3a2a',
  tree4: '#0a2a0a',
  trunk: '#4a2a1a',
  skier_body: '#e84040',
  skier_skin: '#f0c8a0',
  skier_hair: '#5a2a10',
  skier_pants: '#2a4a8a',
  skier_skis: '#e0e0e0',
  skier_poles: '#888888',
  skier_goggles: '#333333',
  shadow: 'rgba(100,130,180,0.2)',
  cloud: 'rgba(220,230,245,0.6)',
  cloud2: 'rgba(200,215,235,0.4)',
  mountain: '#3a4a6a',
  mountainSnow: '#8a9ab8',
  path: '#c8d8ec',
  footprint: 'rgba(160,180,210,0.5)',
};

// Snow particles
const snowflakes = [];
for (let i = 0; i < 60; i++) {
  snowflakes.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() < 0.3 ? 2 : 1,
    speed: 0.2 + Math.random() * 0.6,
    drift: -0.3 + Math.random() * 0.6,
    opacity: 0.3 + Math.random() * 0.7
  });
}

// Trees
const trees = [];
for (let i = 0; i < 18; i++) {
  trees.push({
    x: Math.random() * W,
    y: 80 + Math.random() * 150,
    size: 0.6 + Math.random() * 0.8,
    shade: Math.floor(Math.random() * 3)
  });
}
trees.sort((a, b) => a.y - b.y);

// Clouds
const clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 10 + Math.random() * 40,
    w: 30 + Math.random() * 50,
    h: 8 + Math.random() * 12,
    speed: 0.1 + Math.random() * 0.2,
    opacity: 0.3 + Math.random() * 0.4
  });
}

// Mountains
const mountains = [
  { x: 0, y: 60, w: 120, h: 50 },
  { x: 80, y: 45, w: 160, h: 65 },
  { x: 180, y: 55, w: 140, h: 55 },
  { x: 250, y: 50, w: 100, h: 45 },
];

// Skier position
let skierX = W / 2;
let skierY = 195;
let skierDir = 1; // 1 = right, -1 = left
let skierBob = 0;
let skierFrame = 0;

// Ski tracks
const tracks = [];

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, 80);
  grad.addColorStop(0, PAL.sky1);
  grad.addColorStop(0.5, PAL.sky2);
  grad.addColorStop(1, PAL.sky3);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 85);
}

function drawClouds(time) {
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + c.w) c.x = -c.w;
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = PAL.cloud;
    // Draw cloud as pixel blocks
    const cx = Math.round(c.x);
    const cy = Math.round(c.y);
    drawPixelRect(cx, cy, Math.round(c.w), Math.round(c.h), PAL.cloud);
    drawPixelRect(cx + Math.round(c.w * 0.2), cy - 3, Math.round(c.w * 0.5), 3, PAL.cloud);
    drawPixelRect(cx + Math.round(c.w * 0.5), cy - 2, Math.round(c.w * 0.3), 2, PAL.cloud2);
    ctx.globalAlpha = 1;
  });
}

function drawMountains() {
  mountains.forEach(m => {
    ctx.fillStyle = PAL.mountain;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y + m.h);
    ctx.lineTo(m.x + m.w / 2, m.y);
    ctx.lineTo(m.x + m.w, m.y + m.h);
    ctx.closePath();
    ctx.fill();
    
    // Snow cap
    ctx.fillStyle = PAL.mountainSnow;
    ctx.beginPath();
    ctx.moveTo(m.x + m.w / 2 - 8, m.y + 10);
    ctx.lineTo(m.x + m.w / 2, m.y);
    ctx.lineTo(m.x + m.w / 2 + 8, m.y + 10);
    ctx.closePath();
    ctx.fill();
  });
}

function drawSnow() {
  // Main snow area
  const grad = ctx.createLinearGradient(0, 70, 0, H);
  grad.addColorStop(0, PAL.snow3);
  grad.addColorStop(0.3, PAL.snow1);
  grad.addColorStop(1, PAL.snow2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 72, W, H - 72);
  
  // Snow texture - subtle pixel noise
  for (let i = 0; i < 200; i++) {
    const sx = Math.random() * W;
    const sy = 75 + Math.random() * (H - 80);
    ctx.fillStyle = Math.random() < 0.5 ? PAL.snow3 : PAL.snow4;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
  }
  ctx.globalAlpha = 1;
  
  // Snowy path/track
  ctx.fillStyle = PAL.path;
  ctx.globalAlpha = 0.3;
  for (let y = 80; y < H; y += 3) {
    const pathW = 40 + Math.sin(y * 0.02) * 15;
    const pathX = W / 2 - pathW / 2 + Math.sin(y * 0.01) * 20;
    ctx.fillRect(Math.round(pathX), y, Math.round(pathW), 2);
  }
  ctx.globalAlpha = 1;
}

function drawTree(x, y, size, shade) {
  const s = size;
  const tx = Math.round(x);
  const ty = Math.round(y);
  
  // Shadow
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(tx + 4 * s, ty + 2, 8 * s, 3 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Trunk
  const trunkColors = [PAL.trunk, '#3a2010', '#5a3a20'];
  ctx.fillStyle = trunkColors[shade % 3];
  ctx.fillRect(tx - 1, ty - 2 * s, 2, Math.round(6 * s));
  
  // Tree layers (pixel art style)
  const treeColors = [PAL.tree1, PAL.tree2, PAL.tree3, PAL.tree4];
  const tc = treeColors[shade];
  const tc2 = shade === 0 ? PAL.tree2 : shade === 1 ? PAL.tree3 : PAL.tree1;
  
  // Layer 1 (top)
  ctx.fillStyle = tc;
  ctx.fillRect(tx - 1, ty - 16 * s, 3, 4 * s);
  ctx.fillRect(tx - 2, ty - 14 * s, 5, 4 * s);
  
  // Layer 2
  ctx.fillStyle = tc;
  ctx.fillRect(tx - 3, ty - 12 * s, 7, 4 * s);
  ctx.fillRect(tx - 4, ty - 10 * s, 9, 4 * s);
  
  // Layer 3 (bottom)
  ctx.fillStyle = tc2;
  ctx.fillRect(tx - 5, ty - 8 * s, 11, 4 * s);
  ctx.fillRect(tx - 6, ty - 6 * s, 13, 4 * s);
  
  // Snow on tree
  ctx.fillStyle = PAL.snow3;
  ctx.fillRect(tx - 2, ty - 15 * s, 5, 2 * s);
  ctx.fillRect(tx - 4, ty - 11 * s, 3, 2 * s);
  
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(tx - 1, ty - 15 * s, 1, 3 * s);
  ctx.fillRect(tx - 2, ty - 13 * s, 1, 3 * s);
}

function drawSkier(x, y, dir, frame) {
  const s = 1; // pixel scale
  const sx = Math.round(x);
  const sy = Math.round(y);
  const bob = Math.sin(frame * 0.15) * 1;
  const lean = Math.sin(frame * 0.1) * 0.5;
  
  ctx.save();
  ctx.translate(sx, sy + bob);
  ctx.scale(dir, 1);
  
  // Shadow
  ctx.fillStyle = PAL.shadow;
  ctx.fillRect(-6, 12, 12, 3);
  
  // Skis
  ctx.fillStyle = PAL.skier_skis;
  ctx.fillRect(-8, 10, 6, 2);
  ctx.fillRect(2, 10, 6, 2);
  ctx.fillStyle = '#c0c0c0';
  ctx.fillRect(-8, 10, 6, 1);
  ctx.fillRect(2, 10, 6, 1);
  
  // Legs
  ctx.fillStyle = PAL.skier_pants;
  ctx.fillRect(-4, 6, 2, 5);
  ctx.fillRect(2, 6, 2, 5);
  
  // Body
  ctx.fillStyle = PAL.skier_body;
  ctx.fillRect(-4, -2, 8, 9);
  
  // Body stripe
  ctx.fillStyle = '#c03030';
  ctx.fillRect(-4, 1, 8, 2);
  
  // Arms with poles
  ctx.fillStyle = PAL.skier_body;
  ctx.fillRect(-7, 0, 3, 2);
  ctx.fillRect(4, 0, 3, 2);
  
  // Poles
  ctx.fillStyle = PAL.skier_poles;
  ctx.fillRect(-7, 0, 1, 12);
  ctx.fillRect(6, 0, 1, 12);
  
  // Pole baskets
  ctx.fillStyle = '#aaa';
  ctx.fillRect(-8, 10, 2, 1);
  ctx.fillRect(6, 10, 2, 1);
  
  // Head
  ctx.fillStyle = PAL.skier_skin;
  ctx.fillRect(-3, -7, 6, 5);
  
  // Hair/hat
  ctx.fillStyle = PAL.skier_hair;
  ctx.fillRect(-3, -8, 6, 2);
  ctx.fillRect(-4, -7, 1, 3);
  
  // Goggles
  ctx.fillStyle = PAL.skier_goggles;
  ctx.fillRect(0, -6, 3, 2);
  ctx.fillStyle = '#556';
  ctx.fillRect(1, -6, 2, 1);
  
  // Scarf
  ctx.fillStyle = '#2a6a3a';
  ctx.fillRect(-3, -2, 6, 2);
  // Scarf tail
  ctx.fillRect(-5, -1, 2, 4);
  ctx.fillRect(-5, 3, 2, 2);
  
  ctx.restore();
}

function drawSnowflakes(time) {
  snowflakes.forEach(f => {
    f.y += f.speed;
    f.x += f.drift + Math.sin(time * 0.001 + f.y * 0.1) * 0.2;
    if (f.y > H) { f.y = -2; f.x = Math.random() * W; }
    if (f.x > W) f.x = 0;
    if (f.x < 0) f.x = W;
    
    ctx.globalAlpha = f.opacity;
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(f.x), Math.round(f.y), f.size, f.size);
  });
  ctx.globalAlpha = 1;
}

function drawSkiTracks() {
  // Draw some decorative ski tracks on the ground
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = PAL.snow4;
  ctx.lineWidth = 1;
  
  for (let t = 0; t < 3; t++) {
    ctx.beginPath();
    const startX = 60 + t * 100 + Math.sin(t) * 30;
    for (let y = 80; y < H; y += 2) {
      const x = startX + Math.sin(y * 0.03 + t) * 15 + Math.sin(y * 0.07) * 5;
      if (y === 80) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawFootprints() {
  // Small dots suggesting previous paths
  ctx.globalAlpha = 0.1;
  for (let i = 0; i < 30; i++) {
    const fx = 30 + Math.sin(i * 0.5) * 120 + Math.random() * 40;
    const fy = 90 + i * 5 + Math.random() * 10;
    ctx.fillStyle = PAL.snow4;
    ctx.fillRect(Math.round(fx), Math.round(fy), 1, 1);
    ctx.fillRect(Math.round(fx + 3), Math.round(fy), 1, 1);
  }
  ctx.globalAlpha = 1;
}

function drawHorizonLine() {
  // Subtle tree line at horizon
  ctx.fillStyle = PAL.tree4;
  for (let x = 0; x < W; x += 3) {
    const h = 3 + Math.sin(x * 0.1) * 2 + Math.sin(x * 0.3) * 1;
    ctx.fillRect(x, 72 - h, 2, h);
  }
  
  // Snow on tree line
  ctx.fillStyle = PAL.snow3;
  for (let x = 0; x < W; x += 3) {
    const h = 3 + Math.sin(x * 0.1) * 2 + Math.sin(x * 0.3) * 1;
    ctx.fillRect(x, 72 - h, 2, 1);
  }
}

// Animation
let time = 0;

function render() {
  time++;
  skierFrame = time;
  
  // Gentle skier sway
  skierX = W / 2 + Math.sin(time * 0.02) * 15;
  
  ctx.clearRect(0, 0, W, H);
  
  // Draw layers
  drawSky();
  drawClouds(time);
  drawMountains();
  drawHorizonLine();
  drawSnow();
  drawSkiTracks();
  drawFootprints();
  
  // Draw trees (sorted by Y for depth)
  trees.forEach(t => {
    drawTree(t.x, t.y, t.size, t.shade);
  });
  
  // Draw skier
  skierDir = Math.cos(time * 0.02) > 0 ? 1 : -1;
  drawSkier(skierX, skierY, skierDir, skierFrame);
  
  // Snow overlay
  drawSnowflakes(time);
  
  // Bottom snow drift effect
  ctx.fillStyle = PAL.snow3;
  ctx.globalAlpha = 0.4;
  for (let x = 0; x < W; x += 4) {
    const dh = 2 + Math.sin(x * 0.05 + time * 0.01) * 2;
    ctx.fillRect(x, H - dh, 3, dh);
  }
  ctx.globalAlpha = 1;
  
  requestAnimationFrame(render);
}

// Start button interaction
const startBtn = document.getElementById('start-btn');
startBtn.addEventListener('click', () => {
  // Flash effect
  canvas.style.filter = 'brightness(2)';
  setTimeout(() => { canvas.style.filter = 'none'; }, 150);
  
  // Animate skier downhill
  let speed = 0;
  const accel = setInterval(() => {
    speed += 0.1;
    skierY -= speed;
    skierX += Math.sin(time * 0.05) * 2;
    if (skierY < 50) {
      clearInterval(accel);
      skierY = 195;
      skierX = W / 2;
    }
  }, 16);
});

// Keyboard interaction for fun
const keys = {};
document.addEventListener('keydown', (e) => {
  keys[e.key] = true;
});
document.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// Override render to include keyboard control
function renderInteractive() {
  time++;
  skierFrame = time;
  
  // Keyboard steering
  if (keys['ArrowLeft']) skierX -= 2;
  if (keys['ArrowRight']) skierX += 2;
  if (keys['ArrowUp']) skierY -= 0.5;
  if (keys['ArrowDown']) skierY += 0.3;
  
  // Clamp
  skierX = Math.max(20, Math.min(W - 20, skierX));
  skierY = Math.max(80, Math.min(H - 20, skierY));
  
  // Direction
  if (keys['ArrowLeft']) skierDir = -1;
  if (keys['ArrowRight']) skierDir = 1;
  
  ctx.clearRect(0, 0, W, H);
  
  drawSky();
  drawClouds(time);
  drawMountains();
  drawHorizonLine();
  drawSnow();
  drawSkiTracks();
  drawFootprints();
  
  trees.forEach(t => {
    drawTree(t.x, t.y, t.size, t.shade);
  });
  
  drawSkier(skierX, skierY, skierDir, skierFrame);
  drawSnowflakes(time);
  
  // Bottom snow drift
  ctx.fillStyle = PAL.snow3;
  ctx.globalAlpha = 0.4;
  for (let x = 0; x < W; x += 4) {
    const dh = 2 + Math.sin(x * 0.05 + time * 0.01) * 2;
    ctx.fillRect(x, H - dh, 3, dh);
  }
  ctx.globalAlpha = 1;
  
  requestAnimationFrame(renderInteractive);
}

renderInteractive();
</script>
</body>
</html>
