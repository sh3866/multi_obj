<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - The Infinite Descent</title>
<style>
  :root {
    --bg-color: #111;
    --crt-off: #050505;
    --ui-white: #f0f0f0;
    --ui-black: #000000;
    --ui-blue: #0055aa;
    --ui-red: #cc0000;
    --ui-green: #00aa00;
    --ui-shadow: 4px 4px 0px rgba(0,0,0,0.8);
    --font-main: 'Courier New', Courier, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: var(--font-main);
    overflow: hidden;
    /* Prevent selection to feel more like an app */
    user-select: none; 
    -webkit-user-select: none;
  }

  /* The Monitor Container */
  #monitor {
    position: relative;
    width: 800px;
    height: 600px;
    background: #2a2a2a;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 
      inset 0 0 40px #000,
      0 0 0 10px #444,
      0 20px 50px rgba(0,0,0,0.8);
    border-bottom: 12px solid #1a1a1a;
  }

  /* The Screen Area */
  #screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--crt-off);
    border-radius: 60px / 20px; /* Subtle curvature */
    overflow: hidden;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* CRT Effects Layer */
  #crt-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 20;
    background: 
      /* Scanlines */
      linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
      /* Vignette */
      radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.4) 100%);
    background-size: 100% 4px, 100% 100%;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
  }

  /* UI Layer - The HUD */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; /* Top aligned hierarchy */
    padding-top: 60px; /* Space from top */
  }

  /* Typography System */
  .pixel-font {
    font-family: var(--font-main);
    text-transform: uppercase;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
    /* Hard pixel edges for text */
    -webkit-font-smoothing: none;
    text-rendering: geometricPrecision;
  }

  /* Title Design */
  .title-wrapper {
    position: relative;
    margin-bottom: 20px;
    z-index: 12;
  }

  h1.title {
    font-size: 80px;
    color: #fff;
    /* The classic 3D pixel extrusion */
    text-shadow: 
      4px 4px 0 #000,
      -2px -2px 0 #0055aa, 
      2px -2px 0 #0055aa, 
      -2px 2px 0 #0055aa;
    animation: title-bob 3s ease-in-out infinite;
  }

  @keyframes title-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* Instructions / Footer */
  .hud-footer {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 12;
    width: 80%;
  }

  .controls-box {
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #fff;
    padding: 8px 16px;
    color: #fff;
    font-size: 16px;
    display: flex;
    gap: 20px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    backdrop-filter: blur(2px);
  }

  .key-cap {
    background: #ddd;
    color: #000;
    padding: 2px 6px;
    font-size: 14px;
    border-bottom: 2px solid #888;
    display: inline-block;
  }

  /* The Start Button - Pixel Art Style */
  .start-btn-container {
    margin-top: 20px; /* Below the title, above the skier visually */
    animation: blink-prompt 1.5s steps(2, start) infinite;
    cursor: pointer;
  }

  .start-btn {
    background: var(--ui-red);
    color: #fff;
    font-size: 24px;
    padding: 12px 24px;
    border: none;
    outline: none;
    position: relative;
    cursor: pointer;
    /* Beveled Pixel Border */
    box-shadow: 
      inset 4px 4px 0 rgba(255,255,255,0.4),
      inset -4px -4px 0 rgba(0,0,0,0.4),
      4px 4px 0 #000;
    transition: transform 0.1s;
  }

  .start-btn:active {
    transform: translate(4px, 4px);
    box-shadow: inset 4px 4px 0 rgba(0,0,0,0.4);
  }

  .start-btn:hover {
    background: #e60000;
  }

  @keyframes blink-prompt {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Responsive scaling for small screens */
  @media (max-width: 850px) {
    #monitor {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      padding: 0;
      border: none;
    }
    #screen { border-radius: 0; }
    h1.title { font-size: 48px; }
  }

</style>
</head>
<body>

<div id="monitor">
  <div id="screen">
    <canvas id="scene" width="320" height="240"></canvas>
    <div id="crt-overlay"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
      
      <!-- Top: Title -->
      <div class="title-wrapper">
        <h1 class="title pixel-font">SKIFREE</h1>
      </div>

      <!-- Middle: Start Button (Visual Bridge) -->
      <div class="start-btn-container">
        <button id="start-btn" class="start-btn pixel-font">PRESS START</button>
      </div>

      <!-- Bottom: Instructions -->
      <div class="hud-footer">
        <div class="controls-box pixel-font">
          <span><span class="key-cap">←</span> <span class="key-cap">→</span> TO STEER</span>
          <span><span class="key-cap">↑</span> TO SPEED</span>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/**
 * SkiFree Visual Engine
 * Optimized for the specific "Title Screen" aesthetic.
 * High contrast, distinct layers, retro palette.
 */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320, H = 240;

// Strict Retro Palette
const C = {
  sky: '#000022',
  snow: '#eeeeff',
  snowShadow: '#ccddff',
  treeDark: '#002200',
  treeLight: '#004400',
  trunk: '#221100',
  red: '#cc0000',
  blue: '#0000aa',
  skin: '#ffccaa',
  white: '#ffffff',
  yeti: '#ffffff'
};

let frame = 0;

// --- ENTITIES ---

// Clouds (Parallax Layer 1)
const clouds = [];
for(let i=0; i<6; i++) {
  clouds.push({
    x: Math.random() * W,
    y: Math.random() * 60,
    w: 40 + Math.random() * 40,
    speed: 0.2 + Math.random() * 0.3
  });
}

// Trees (Parallax Layer 2 - Background)
const treesBg = [];
for(let i=0; i<15; i++) {
  treesBg.push({
    x: Math.random() * W,
    y: Math.random() * H,
    scale: 0.4 + Math.random() * 0.4,
    speed: 1.0 // Slow
  });
}

// Trees (Parallax Layer 3 - Foreground)
const treesFg = [];
for(let i=0; i<12; i++) {
  treesFg.push({
    x: Math.random() * W,
    y: Math.random() * H,
    scale: 0.8 + Math.random() * 0.6,
    speed: 3.5 // Fast to simulate speed
  });
}

// The Skier
const skier = {
  x: W / 2,
  y: 110, // Positioned perfectly between Title and Button
  bob: 0,
  sway: 0
};

// The Yeti (Hidden threat)
const yeti = {
  x: -50,
  y: 60,
  state: 'hidden', // hidden, appear, chase
  timer: 0
};

// --- DRAWING HELPERS ---

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

// --- SCENE RENDERING ---

function drawSky() {
  // Gradient sky
  for (let y = 0; y < 80; y++) {
    const r = Math.floor(y / 80 * 0);
    const g = Math.floor(y / 80 * 0);
    const b = Math.floor(y / 80 * 34); // 0x22
    ctx.fillStyle = `rgb(0,0,${b})`;
    ctx.fillRect(0, y, W, 1);
  }
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + 50) c.x = -c.w;
    
    // Blocky cloud
    ctx.fillRect(c.x, c.y, c.w, 6);
    ctx.fillRect(c.x + 10, c.y - 4, c.w - 20, 4);
  });
}

function drawSnowfield() {
  // Base Snow
  rect(0, 70, W, H - 70, C.snow);
  
  // Speed lines / Texture
  ctx.fillStyle = C.snowShadow;
  for(let i=0; i<40; i++) {
    const y = (frame * 4 + i * 17) % (H - 70) + 70;
    const x = (i * 37 + 10) % W;
    ctx.fillRect(x, y, 1, 4); // Vertical streaks
  }
}

function drawTree(t) {
  const x = t.x;
  const y = t.y;
  const s = t.scale;
  
  // Shadow
  ctx.fillStyle = C.snowShadow;
  ctx.fillRect(x + 2*s, y, 10*s, 3*s);

  // Trunk
  ctx.fillStyle = C.trunk;
  ctx.fillRect(x, y - 10*s, 4*s, 12*s);

  // Foliage (Triangle approximation via rects)
  ctx.fillStyle = C.treeDark;
  ctx.fillRect(x - 6*s, y - 10*s, 16*s, 6*s);
  ctx.fillRect(x - 4*s, y - 16*s, 12*s, 6*s);
  ctx.fillRect(x - 2*s, y - 22*s, 8*s, 6*s);
  
  // Highlights (Snow on branches)
  ctx.fillStyle = C.snow;
  ctx.fillRect(x - 4*s, y - 16*s, 4*s, 2*s);
  ctx.fillRect(x - 1*s, y - 22*s, 3*s, 2*s);
}

function drawSkier() {
  const s = 1.5; // Size multiplier
  const sx = skier.x;
  const sy = skier.y + Math.sin(frame * 0.15) * 2; // Vertical bob
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,50,0.4)';
  ctx.fillRect(sx - 8*s, sy + 14*s, 16*s, 4*s);

  // Skis
  ctx.fillStyle = C.white;
  ctx.fillRect(sx - 10*s, sy + 14*s, 8*s, 2*s);
  ctx.fillRect(sx + 2*s, sy + 14*s, 8*s, 2*s);

  // Legs (Blue pants)
  ctx.fillStyle = C.blue;
  ctx.fillRect(sx - 5*s, sy + 8*s, 4*s, 7*s);
  ctx.fillRect(sx + 1*s, sy + 8*s, 4*s, 7*s);

  // Body (Red Jacket)
  ctx.fillStyle = C.red;
  ctx.fillRect(sx - 6*s, sy - 4*s, 12*s, 13*s);
  
  // Jacket Zipper/Detail
  ctx.fillStyle = C.white;
  ctx.fillRect(sx - 1*s, sy - 4*s, 2*s, 13*s);

  // Head
  ctx.fillStyle = C.skin;
  ctx.fillRect(sx - 3*s, sy - 10*s, 6*s, 6*s);

  // Goggles
  ctx.fillStyle = '#000';
  ctx.fillRect(sx - 1*s, sy - 8*s, 6*s, 2*s);
  
  // Scarf (Green)
  ctx.fillStyle = C.treeLight;
  ctx.fillRect(sx - 4*s, sy - 4*s, 8*s, 2*s);
  // Scarf tail blowing
  ctx.fillRect(sx - 6*s - Math.sin(frame*0.2)*2, sy - 2*s, 4*s, 2*s);
}

function drawYeti() {
  // Logic: Appear randomly in background
  yeti.timer++;
  if (yeti.state === 'hidden' && Math.random() < 0.002) {
    yeti.state = 'appear';
    yeti.y = 60 + Math.random() * 40;
    yeti.x = Math.random() > 0.5 ? -30 : W + 30;
  }

  if (yeti.state === 'appear') {
    // Move towards center or just loiter
    if (yeti.x < W/2) yeti.x += 0.5;
    else yeti.x -= 0.5;
    
    // Disappear after a bit
    if (yeti.timer % 200 === 0) yeti.state = 'hidden';
  }

  if (yeti.state === 'hidden') return;

  const yx = yeti.x;
  const yy = yeti.y;

  // Ghostly opacity
  ctx.globalAlpha = 0.8;

  // Body
  ctx.fillStyle = C.yeti;
  ctx.fillRect(yx, yy, 16, 24);
  // Head
  ctx.fillRect(yx + 2, yy - 10, 12, 12);
  
  // Eyes (Menacing)
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(yx + 4, yy - 7, 3, 3);
  ctx.fillRect(yx + 9, yy - 7, 3, 3);

  // Arms
  ctx.fillStyle = C.yeti;
  ctx.fillRect(yx - 6, yy + 4, 6, 4);
  ctx.fillRect(yx + 16, yy + 4, 6, 4);

  ctx.globalAlpha = 1.0;
}

// --- MAIN LOOP ---

function update() {
  frame++;

  // Move Background Trees
  treesBg.forEach(t => {
    t.y += t.speed;
    if (t.y > H + 20) {
      t.y = -20;
      t.x = Math.random() * W;
    }
  });

  // Move Foreground Trees (Faster)
  treesFg.forEach(t => {
    t.y += t.speed;
    if (t.y > H + 20) {
      t.y = -20;
      t.x = Math.random() * W;
    }
  });
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawClouds();
  drawSnowfield();

  // Draw Background Trees
  treesBg.forEach(drawTree);

  // Draw Yeti (Behind foreground trees, behind skier)
  drawYeti();

  // Draw Skier
  drawSkier();

  // Draw Foreground Trees (Creates depth)
  treesFg.forEach(drawTree);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// Start
loop();

// Interactivity
document.getElementById('start-btn').addEventListener('click', () => {
  const btn = document.getElementById('start-btn');
  btn.innerText = "LOADING...";
  btn.style.background = "#00aa00"; // Turn green
  
  // Simulate loading
  setTimeout(() => {
    alert("GAME START! (Demo Ends Here)");
    btn.innerText = "PRESS START";
    btn.style.background = ""; // Reset
  }, 800);
});

</script>
</body>
</html>
