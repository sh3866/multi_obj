<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Start Screen</title>
<style>
  :root {
    --bg-color: #111;
    --ui-border: 4px solid #fff;
    --ui-shadow: 4px 4px 0px #000;
    --accent-red: #e63946;
    --accent-blue: #0077b6;
    --accent-snow: #f1faee;
    --crt-scanline: rgba(18, 16, 16, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    user-select: none;
    -webkit-font-smoothing: none;
  }

  /* The Monitor Container - Bezel */
  #monitor {
    position: relative;
    width: 800px;
    height: 600px;
    background: #333;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 
      inset 0 0 20px #000,
      0 0 0 4px #555,
      0 30px 60px rgba(0,0,0,0.9);
    border-bottom: 8px solid #222;
  }

  /* The Screen Area */
  #screen-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    border-radius: 2px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated; /* Critical for retro look */
    image-rendering: crisp-edges;
  }

  /* CRT Overlay Effects */
  #scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 2px,
      rgba(0,0,0,0.2) 2px,
      rgba(0,0,0,0.2) 4px
    );
    background-size: 100% 4px;
    z-index: 5;
    mix-blend-mode: hard-light;
  }

  #vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 6;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
  }

  /* UI Layer */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none; 
  }

  /* Typography: Hard Pixel Style */
  .pixel-text {
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    font-weight: 900;
    letter-spacing: 1px;
    image-rendering: pixelated;
  }

  /* Title Composition */
  #title-container {
    text-align: center;
    margin-bottom: 10px;
    position: relative;
    z-index: 11;
  }

  h1.title {
    font-size: 96px;
    line-height: 0.9;
    color: #fff;
    /* Multi-layer shadow for depth and contrast against trees */
    text-shadow: 
      4px 4px 0 #0044aa, 
      8px 8px 0 #000;
    margin: 0;
    transform: skewX(-5deg); /* Dynamic tilt */
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: skewX(-5deg) translateY(0); }
    50% { transform: skewX(-5deg) translateY(-10px); }
  }

  .subtitle {
    font-size: 18px;
    color: #fff;
    margin-top: 12px;
    text-shadow: 2px 2px 0 #000;
    background: rgba(0,0,0,0.6);
    padding: 4px 12px;
    display: inline-block;
    border-radius: 0;
  }

  /* Start Button: Retro Pixel Art Style */
  #start-btn-container {
    pointer-events: auto;
    margin-top: 40px; /* Increased whitespace */
    position: relative;
    z-index: 12;
  }

  #start-btn {
    background: #00b4d8; /* Cyan/Blue instead of aggressive red */
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 28px;
    font-weight: 900;
    padding: 16px 32px;
    border: none;
    cursor: pointer;
    position: relative;
    outline: none;
    /* Pixelated Border Effect */
    box-shadow: 
      -4px 0 0 0 #fff,
      4px 0 0 0 #fff,
      0 -4px 0 0 #fff,
      0 4px 0 0 #fff,
      4px 4px 0 0 #000;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
    transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
    transform: skewX(-5deg);
  }

  #start-btn:hover {
    background: #48cae4;
    transform: skewX(-5deg) translate(-2px, -2px);
    box-shadow: 
      -4px 0 0 0 #fff,
      4px 0 0 0 #fff,
      0 -4px 0 0 #fff,
      0 4px 0 0 #fff,
      6px 6px 0 0 #000;
  }

  #start-btn:active {
    transform: skewX(-5deg) translate(2px, 2px);
    box-shadow: 
      -4px 0 0 0 #fff,
      4px 0 0 0 #fff,
      0 -4px 0 0 #fff,
      0 4px 0 0 #fff,
      0px 0px 0 0 #000;
  }

  /* Instructions: High Contrast HUD Container */
  .instructions {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    color: #fff;
    font-size: 16px;
    text-shadow: 2px 2px 0 #000;
    background: #000;
    padding: 10px 20px;
    border: 2px solid #fff;
    box-shadow: 4px 4px 0 #333;
    position: relative;
    z-index: 12;
  }

  kbd {
    background: #ddd;
    color: #000;
    padding: 2px 6px;
    font-weight: bold;
    border-radius: 0;
    box-shadow: 2px 2px 0 #000;
    font-family: 'Courier New', monospace;
  }

  .blink-text {
    animation: blink 1s steps(2, start) infinite;
  }

  @keyframes blink {
    to { visibility: hidden; }
  }

</style>
</head>
<body>

<div id="monitor">
  <div id="screen-container">
    <canvas id="scene" width="320" height="240"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
      
      <div id="title-container">
        <h1 class="title pixel-text">SKIFREE</h1>
        <div class="subtitle pixel-text">The Infinite Descent</div>
      </div>

      <div id="start-btn-container">
        <button id="start-btn" class="pixel-text">START</button>
      </div>

      <div class="instructions pixel-text">
        <span><span class="blink-text">PRESS START</span></span>
        <span style="color:#aaa">|</span>
        <span>ARROWS TO SKI</span>
      </div>

    </div>
  </div>
</div>

<script>
/**
 * SkiFree Start Screen Visuals
 * Pure Canvas pixel art rendering.
 * Focus: Vertical motion, Skier presence, Snow depth.
 */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320, H = 240;

// Palette
const PAL = {
  skyTop: '#000022',
  skyBot: '#0055bb',
  snowBase: '#eeeeff',
  snowDark: '#ccddee',
  snowShade: '#aabbcc',
  treeDark: '#002200',
  treeLight: '#004400',
  trunk: '#221100',
  skierRed: '#ff2222',
  skierDark: '#aa0000',
  skierSkin: '#ffccaa',
  skierPants: '#0000aa',
  skierSkis: '#ffffff',
  cloud: 'rgba(255,255,255,0.3)',
  yeti: '#eeeeff'
};

let frame = 0;

// Entities
const clouds = [];
for(let i=0; i<8; i++) {
  clouds.push({
    x: Math.random() * W,
    y: Math.random() * 50,
    w: 30 + Math.random() * 40,
    h: 4 + Math.random() * 4,
    speed: 0.5 + Math.random() * 1.5 // Faster clouds for speed effect
  });
}

const trees = [];
for(let i=0; i<40; i++) {
  trees.push({
    x: Math.random() * W,
    y: Math.random() * H,
    scale: 0.4 + Math.random() * 0.8,
    type: Math.random() > 0.5 ? 'pine' : 'spruce'
  });
}

// The Skier (Prominent, idle animation)
const skier = {
  x: W / 2,
  y: 160, // Slightly lower for better composition
  bob: 0,
  dir: 1
};

// The Yeti (Lurking in background)
const yeti = {
  x: 20,
  y: 100,
  visible: false,
  timer: 0
};

// Input (for fun interactivity on title screen)
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// --- DRAWING HELPERS ---

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

// --- DRAWING FUNCTIONS ---

function drawSky() {
  // Banded gradient for retro feel
  for (let y = 0; y < 80; y++) {
    const ratio = y / 80;
    let c = ratio < 0.5 ? PAL.skyTop : PAL.skyBot;
    // Simple interpolation logic for bands
    if (ratio >= 0.3 && ratio < 0.5) c = '#001144';
    if (ratio >= 0.5 && ratio < 0.8) c = '#003388';
    drawRect(0, y, W, 1, c);
  }
}

function drawClouds() {
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + 50) c.x = -c.w;
    
    ctx.fillStyle = PAL.cloud;
    // Blocky cloud shape
    drawRect(c.x, c.y, c.w, c.h, PAL.cloud);
    drawRect(c.x + 5, c.y - 3, c.w * 0.6, 3, PAL.cloud);
  });
}

function drawSnowfield() {
  // Base
  drawRect(0, 80, W, H - 80, PAL.snowBase);
  
  // Texture noise
  ctx.fillStyle = PAL.snowDark;
  for(let i=0; i<80; i++) {
    // Static noise pattern
    const rx = (Math.sin(i * 132.1) * W + W) % W; 
    const ry = 80 + ((Math.cos(i * 54.3) * (H-80) + (H-80)) % (H-80));
    drawRect(rx, ry, 2, 2, PAL.snowDark);
  }
}

function drawTree(x, y, scale, type) {
  const s = scale;
  const tx = Math.floor(x);
  const ty = Math.floor(y);

  // Shadow
  ctx.fillStyle = PAL.snowShade;
  ctx.fillRect(tx + 2*s, ty, 6*s, 2*s);

  // Trunk
  ctx.fillStyle = PAL.trunk;
  ctx.fillRect(tx, ty - 4*s, 2*s, 6*s);

  // Foliage
  ctx.fillStyle = PAL.treeDark;
  
  // Bottom layer
  ctx.fillRect(tx - 5*s, ty - 2*s, 12*s, 4*s);
  // Middle layer
  ctx.fillRect(tx - 4*s, ty - 6*s, 10*s, 4*s);
  // Top layer
  ctx.fillRect(tx - 3*s, ty - 10*s, 8*s, 4*s);

  // Snow caps on tree
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.8;
  ctx.fillRect(tx - 2*s, ty - 10*s, 4*s, 2*s);
  ctx.fillRect(tx - 1*s, ty - 6*s, 2*s, 1*s);
  ctx.globalAlpha = 1.0;
}

function drawSkier(x, y) {
  const s = 1.2; // Slightly larger for prominence
  const sx = Math.floor(x);
  const sy = Math.floor(y);
  
  // Idle Bobbing
  const bobY = Math.sin(frame * 0.1) * 2;
  const bobRot = Math.sin(frame * 0.05) * 0.1; // Slight sway

  ctx.save();
  ctx.translate(sx, sy + bobY);
  ctx.rotate(bobRot);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,50,0.3)';
  ctx.fillRect(-8, 16, 16, 4);

  // Skis (Parallel)
  ctx.fillStyle = PAL.skierSkis;
  ctx.fillRect(-9, 14, 7, 3); // Left ski
  ctx.fillRect(2, 14, 7, 3);  // Right ski

  // Legs (Pants)
  ctx.fillStyle = PAL.skierPants;
  ctx.fillRect(-5, 8, 3, 7);
  ctx.fillRect(2, 8, 3, 7);

  // Body (Jacket)
  ctx.fillStyle = PAL.skierRed;
  ctx.fillRect(-6, -4, 12, 13);
  
  // Jacket Details
  ctx.fillStyle = PAL.skierDark;
  ctx.fillRect(-6, 3, 12, 2); // Stripe

  // Head
  ctx.fillStyle = PAL.skierSkin;
  ctx.fillRect(-3, -9, 6, 6);

  // Goggles
  ctx.fillStyle = '#111';
  ctx.fillRect(0, -7, 4, 2);

  // Scarf
  ctx.fillStyle = '#00aa00';
  ctx.fillRect(-4, -3, 8, 2);
  // Scarf tail blowing
  ctx.fillRect(-6, -1, 2, 4);

  ctx.restore();
}

function drawYeti() {
  // Lurking logic
  yeti.timer++;
  if (yeti.timer % 300 === 0) {
    yeti.visible = !yeti.visible;
    yeti.x = Math.random() > 0.5 ? 20 : W - 40;
    yeti.y = 90 + Math.random() * 40;
  }

  if (!yeti.visible) return;

  const yx = yeti.x;
  const yy = yeti.y;

  // Semi-transparent ghostly look
  ctx.globalAlpha = 0.6;
  
  // Body
  ctx.fillStyle = PAL.yeti;
  ctx.fillRect(yx, yy, 14, 24);
  // Head
  ctx.fillRect(yx + 2, yy - 10, 10, 10);
  
  // Eyes (Menacing Red)
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(yx + 4, yy - 7, 2, 2);
  ctx.fillRect(yx + 8, yy - 7, 2, 2);
  
  // Arms reaching
  ctx.fillStyle = PAL.yeti;
  ctx.fillRect(yx - 6, yy + 4, 6, 4);
  ctx.fillRect(yx + 14, yy + 4, 6, 4);

  ctx.globalAlpha = 1.0;
}

// --- MAIN LOOP ---

function update() {
  frame++;
  
  // Move trees to simulate skiing down
  trees.forEach(t => {
    t.y += 1.5; // Slow drift
    if (t.y > H) {
      t.y = -20;
      t.x = Math.random() * W;
    }
  });
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawClouds();
  drawSnowfield();

  // Sort trees by Y for depth
  trees.sort((a,b) => a.y - b.y);
  
  // Draw trees behind skier (y < skier.y)
  trees.forEach(t => {
    if (t.y < skier.y - 10) drawTree(t.x, t.y, t.scale, t.type);
  });

  // Draw Yeti (Background)
  drawYeti();

  // Draw Skier (Foreground)
  drawSkier(skier.x, skier.y);

  // Draw trees in front of skier
  trees.forEach(t => {
    if (t.y >= skier.y - 10) drawTree(t.x, t.y, t.scale, t.type);
  });

  // Falling Snow (Foreground)
  ctx.fillStyle = '#fff';
  for(let i=0; i<30; i++) {
    const px = (frame * 1.5 + i * 37) % W;
    const py = (frame * 3 + i * 23) % H;
    if (py > 80) ctx.fillRect(px, py, 2, 2);
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// Start Loop
loop();

// Button Logic
document.getElementById('start-btn').addEventListener('click', () => {
  const btn = document.getElementById('start-btn');
  btn.innerText = "LOADING...";
  setTimeout(() => {
    alert("Game Loaded! (Demo End)");
    btn.innerText = "START";
  }, 500);
});

</script>
</body>
</html>
