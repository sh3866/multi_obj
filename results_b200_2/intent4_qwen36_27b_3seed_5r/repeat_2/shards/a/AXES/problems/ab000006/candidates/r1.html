<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Retro Edition</title>
<style>
  :root {
    --bg-color: #0f0f1a;
    --crt-border: #2a2a35;
    --crt-inner: #111;
    --ui-bg: rgba(10, 15, 30, 0.85);
    --accent: #ffcc00;
    --accent-dark: #cc9900;
    --text-main: #ffffff;
    --text-dim: #8899aa;
    --danger: #ff4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    color: var(--text-main);
  }

  /* CRT Monitor Container */
  #monitor {
    position: relative;
    width: 800px;
    height: 600px;
    background: var(--crt-border);
    padding: 20px;
    border-radius: 20px;
    box-shadow: 
      inset 0 0 20px #000,
      0 0 0 2px #1a1a20,
      0 20px 50px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The Screen */
  #screen-bezel {
    position: relative;
    width: 640px;
    height: 480px;
    background: #000;
    border-radius: 60px / 20px; /* Slight curvature illusion */
    overflow: hidden;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.7);
    border: 4px solid #1a1a1a;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }

  /* CRT Effects */
  #scanlines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.1) 50%,
      rgba(0,0,0,0.1)
    );
    background-size: 100% 4px;
    z-index: 20;
  }

  #vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 19;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  }

  #flicker {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 21;
    opacity: 0;
    background: rgba(255,255,255,0.02);
    animation: flicker 0.1s infinite;
  }

  @keyframes flicker {
    0% { opacity: 0; }
    5% { opacity: 0.02; }
    10% { opacity: 0; }
    15% { opacity: 0.04; }
    20% { opacity: 0; }
    100% { opacity: 0; }
  }

  /* UI Layer */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 20px 20px;
    pointer-events: none; /* Let clicks pass through empty areas */
  }

  /* Typography: Pixelated via text-shadow trick for crispness without external fonts */
  .pixel-text {
    text-transform: uppercase;
    font-weight: bold;
    /* This creates a jagged, pixelated look on standard fonts */
    text-shadow: 
      1px -1px 0 rgba(0,0,0,0.5), 
      -1px 1px 0 rgba(0,0,0,0.5);
    letter-spacing: 2px;
  }

  /* Header Area */
  #header {
    text-align: center;
    margin-top: 20px;
    pointer-events: none;
  }

  #title {
    font-size: 64px;
    color: #fff;
    line-height: 0.9;
    /* Retro 3D text effect */
    text-shadow: 
      4px 4px 0 #0055aa,
      8px 8px 0 #002244;
    position: relative;
    display: inline-block;
  }

  #subtitle {
    font-size: 14px;
    color: #aaddff;
    margin-top: 8px;
    letter-spacing: 4px;
    text-shadow: 2px 2px 0 #000;
  }

  /* HUD (Top Right) */
  #hud {
    position: absolute;
    top: 20px;
    right: 30px;
    text-align: right;
    font-size: 16px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 11;
  }
  #hud div { margin-bottom: 4px; }
  #hud span { color: var(--accent); }

  /* Central UI Container */
  #center-ui {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    background: var(--ui-bg);
    border: 4px solid #fff;
    padding: 30px;
    text-align: center;
    pointer-events: auto;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Pixel Button */
  #start-btn {
    background: #cc3333;
    color: #fff;
    font-family: inherit;
    font-size: 24px;
    font-weight: bold;
    padding: 12px 32px;
    border: none;
    cursor: pointer;
    position: relative;
    outline: none;
    /* Pixel Art Bevel */
    box-shadow: 
      inset 4px 4px 0 rgba(255,255,255,0.4),
      inset -4px -4px 0 rgba(0,0,0,0.4),
      4px 4px 0 #000;
    transition: transform 0.1s;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
    animation: pulse 1.5s infinite;
  }

  #start-btn:hover {
    background: #ff4444;
    transform: scale(1.05);
  }

  #start-btn:active {
    transform: scale(0.95) translateY(4px);
    box-shadow: 
      inset 4px 4px 0 rgba(0,0,0,0.4),
      inset -4px -4px 0 rgba(255,255,255,0.1),
      0px 0px 0 #000;
  }

  @keyframes pulse {
    0% { box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.4), 4px 4px 0 #000; }
    50% { box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.4), 4px 4px 0 #000, 0 0 15px #ff0000; }
    100% { box-shadow: inset 4px 4px 0 rgba(255,255,255,0.4), inset -4px -4px 0 rgba(0,0,0,0.4), 4px 4px 0 #000; }
  }

  /* Instructions */
  .instructions {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: #ccc;
    text-transform: uppercase;
    margin-top: 10px;
  }

  .key-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .keys {
    display: flex;
    gap: 4px;
  }

  kbd {
    background: #222;
    border: 2px solid #555;
    border-bottom: 4px solid #555;
    color: #fff;
    padding: 2px 6px;
    font-family: inherit;
    font-size: 14px;
    border-radius: 0;
    box-shadow: 2px 2px 0 #000;
  }

  .key-label {
    color: var(--accent);
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* Warning Sign (Narrative element) */
  #warning-sign {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: #000;
    border: 2px solid #fff;
    padding: 5px 10px;
    font-size: 10px;
    color: #fff;
    transform: rotate(-2deg);
    z-index: 11;
    box-shadow: 4px 4px 0 #000;
  }
  #warning-sign::before {
    content: "⚠";
    color: var(--danger);
    margin-right: 5px;
  }

</style>
</head>
<body>

<div id="monitor">
  <div id="screen-bezel">
    <canvas id="scene" width="320" height="240"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="flicker"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <div id="header">
        <h1 id="title" class="pixel-text">SKIFREE</h1>
        <div id="subtitle" class="pixel-text">The Infinite Descent</div>
      </div>

      <div id="hud" class="pixel-text">
        <div>SCORE: <span>0</span></div>
        <div>SPEED: <span>0</span></div>
      </div>

      <div id="center-ui">
        <button id="start-btn" class="pixel-text">START GAME</button>
        
        <div class="instructions">
          <div class="key-group">
            <div class="keys"><kbd>←</kbd><kbd>→</kbd></div>
            <span class="key-label">Steer</span>
          </div>
          <div class="key-group">
            <div class="keys"><kbd>↑</kbd></div>
            <span class="key-label">Speed</span>
          </div>
          <div class="key-group">
            <div class="keys"><kbd>↓</kbd></div>
            <span class="key-label">Brake</span>
          </div>
        </div>
      </div>

      <div id="warning-sign" class="pixel-text">YETI WARNING</div>
    </div>
  </div>
</div>

<script>
/**
 * Retro SkiFree Visuals
 * Pure Canvas pixel art rendering.
 */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 320, H = 240;

// Palette (Punchy 8-bit colors)
const PAL = {
  skyTop: '#000022',
  skyBot: '#0044aa',
  snowBase: '#eeeeff',
  snowDark: '#ccddee',
  snowShadow: '#99aacc',
  treeDark: '#003300',
  treeLight: '#005500',
  trunk: '#331100',
  skierRed: '#ff3333',
  skierDark: '#cc0000',
  skierSkin: '#ffccaa',
  skierPants: '#0000aa',
  skierSkis: '#ffffff',
  cloud: 'rgba(255,255,255,0.4)',
  yeti: '#eeeeff',
  yetiShadow: '#aabbcc'
};

// Game State
let frame = 0;
let speed = 0;
let isPlaying = false;

// Entities
const clouds = [];
for(let i=0; i<6; i++) {
  clouds.push({
    x: Math.random() * W,
    y: Math.random() * 60,
    w: 20 + Math.random() * 40,
    h: 6 + Math.random() * 8,
    speed: 0.1 + Math.random() * 0.2
  });
}

// Generate Trees (Procedural generation for infinite slope feel)
const trees = [];
for(let i=0; i<25; i++) {
  trees.push({
    x: Math.random() * W,
    y: 80 + Math.random() * 160,
    scale: 0.5 + Math.random() * 0.8,
    type: Math.random() > 0.5 ? 'pine' : 'spruce'
  });
}
trees.sort((a,b) => a.y - b.y); // Sort for depth

// The Yeti (Hidden mostly)
const yeti = {
  x: -50,
  y: 100,
  frame: 0
};

// Skier
const skier = {
  x: W / 2,
  y: 100, // Starts higher up
  dir: 1, // 1 right, -1 left
  bob: 0
};

// Input handling
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// Drawing Helpers
function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawPixelText(text, x, y, size, color) {
  // Custom pixel font renderer would be heavy, using fillRect to draw "START" style graphics if needed
  // For now, we rely on CSS for UI text.
}

// --- DRAWING FUNCTIONS ---

function drawSky() {
  // Gradient Sky
  for (let y = 0; y < 80; y++) {
    const ratio = y / 80;
    // Simple linear interpolation of hex is complex, doing manual banding for retro feel
    let c;
    if (ratio < 0.33) c = PAL.skyTop;
    else if (ratio < 0.66) c = '#002266';
    else c = PAL.skyBot;
    drawRect(0, y, W, 1, c);
  }
}

function drawClouds() {
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + 50) c.x = -c.w;
    
    // Draw blocky cloud
    ctx.fillStyle = PAL.cloud;
    drawRect(c.x, c.y, c.w, c.h, PAL.cloud);
    // Bumps
    drawRect(c.x + c.w*0.2, c.y - 4, c.w*0.4, 4, PAL.cloud);
    drawRect(c.x + c.w*0.5, c.y - 2, c.w*0.3, 2, PAL.cloud);
  });
}

function drawSnowfield() {
  // Base Snow
  drawRect(0, 80, W, H - 80, PAL.snowBase);
  
  // Texture (Noise)
  ctx.fillStyle = PAL.snowDark;
  for(let i=0; i<100; i++) {
    // Pseudo-random based on frame to keep it static-ish or animate? 
    // Let's do static noise for background, animated for falling snow.
    const rx = (Math.sin(i) * 10000) % W; 
    const ry = 80 + ((Math.cos(i) * 10000) % (H-80));
    if(rx > 0 && ry > 0) drawRect(rx, ry, 1, 1, PAL.snowDark);
  }

  // The "Path" or Track
  // Simulating depth by making the track wider at the bottom
  const trackTop = 40;
  const trackBot = 120;
  const centerX = W/2;
  
  ctx.fillStyle = PAL.snowShadow; // Shadow of the depression
  ctx.beginPath();
  ctx.moveTo(centerX - trackTop/2, 80);
  ctx.lineTo(centerX - trackBot/2, H);
  ctx.lineTo(centerX + trackBot/2, H);
  ctx.lineTo(centerX + trackTop/2, 80);
  ctx.fill();

  ctx.fillStyle = PAL.snowBase; // Fill
  ctx.beginPath();
  ctx.moveTo(centerX - trackTop/2 + 2, 80);
  ctx.lineTo(centerX - trackBot/2 + 4, H);
  ctx.lineTo(centerX + trackBot/2 - 4, H);
  ctx.lineTo(centerX + trackTop/2 - 2, 80);
  ctx.fill();
}

function drawTree(x, y, scale, type) {
  const s = scale;
  const tx = Math.floor(x);
  const ty = Math.floor(y);

  // Shadow
  ctx.fillStyle = PAL.snowShadow;
  ctx.fillRect(tx + 2*s, ty, 8*s, 3*s);

  // Trunk
  ctx.fillStyle = PAL.trunk;
  ctx.fillRect(tx - 1*s, ty - 4*s, 2*s, 6*s);

  // Leaves (Triangles made of rects)
  ctx.fillStyle = PAL.treeDark;
  
  // Layer 1
  ctx.fillRect(tx - 2*s, ty - 12*s, 5*s, 4*s);
  // Layer 2
  ctx.fillRect(tx - 4*s, ty - 8*s, 9*s, 4*s);
  // Layer 3
  ctx.fillRect(tx - 6*s, ty - 4*s, 13*s, 4*s);

  // Highlights (Snow on branches)
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.6;
  ctx.fillRect(tx - 1*s, ty - 12*s, 2*s, 1*s);
  ctx.fillRect(tx - 3*s, ty - 8*s, 2*s, 1*s);
  ctx.globalAlpha = 1.0;
}

function drawSkier(x, y, dir) {
  const s = 1;
  const sx = Math.floor(x);
  const sy = Math.floor(y);
  
  // Bobbing animation
  const bobY = Math.sin(frame * 0.5) * 1;
  
  ctx.save();
  ctx.translate(sx, sy + bobY);
  ctx.scale(dir, 1);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,50,0.3)';
  ctx.fillRect(-6, 14, 12, 3);

  // Skis
  ctx.fillStyle = PAL.skierSkis;
  ctx.fillRect(-8, 12, 6, 2);
  ctx.fillRect(2, 12, 6, 2);

  // Legs
  ctx.fillStyle = PAL.skierPants;
  ctx.fillRect(-4, 8, 2, 5);
  ctx.fillRect(2, 8, 2, 5);

  // Body (Red Jacket)
  ctx.fillStyle = PAL.skierRed;
  ctx.fillRect(-5, -2, 10, 11);
  
  // Jacket Stripe
  ctx.fillStyle = PAL.skierDark;
  ctx.fillRect(-5, 3, 10, 2);

  // Head
  ctx.fillStyle = PAL.skierSkin;
  ctx.fillRect(-3, -7, 6, 5);

  // Goggles
  ctx.fillStyle = '#111';
  ctx.fillRect(0, -6, 3, 2);

  // Scarf
  ctx.fillStyle = '#00aa00';
  ctx.fillRect(-4, -2, 8, 2);
  // Scarf tail blowing
  ctx.fillRect(-6, 0, 2, 4);

  ctx.restore();
}

function drawYeti() {
  // Simple menacing silhouette in the background
  const yx = yeti.x;
  const yy = yeti.y;
  
  // Only draw if visible
  if (yx < -20 || yx > W + 20) return;

  ctx.fillStyle = PAL.yeti;
  // Body
  ctx.fillRect(yx, yy, 14, 20);
  // Head
  ctx.fillRect(yx + 2, yy - 8, 10, 8);
  // Eyes (Red)
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(yx + 4, yy - 5, 2, 2);
  ctx.fillRect(yx + 8, yy - 5, 2, 2);
  
  // Arms
  ctx.fillStyle = PAL.yeti;
  ctx.fillRect(yx - 4, yy + 2, 4, 12);
  ctx.fillRect(yx + 14, yy + 2, 4, 12);
}

// --- MAIN LOOP ---

function update() {
  frame++;
  
  // Skier Movement Logic
  if (keys['ArrowLeft']) {
    skier.x -= 2;
    skier.dir = -1;
  }
  if (keys['ArrowRight']) {
    skier.x += 2;
    skier.dir = 1;
  }
  
  // Bounds
  if (skier.x < 20) skier.x = 20;
  if (skier.x > W - 20) skier.x = W - 20;

  // Infinite Slope Logic (Trees move down)
  trees.forEach(t => {
    t.y += 2; // Constant speed
    if (t.y > H) {
      t.y = -20;
      t.x = Math.random() * W;
    }
  });

  // Yeti Logic (Peek out occasionally)
  if (frame % 600 === 0) {
    yeti.x = Math.random() > 0.5 ? -20 : W + 20;
    yeti.y = 90 + Math.random() * 50;
  }
  // Move yeti towards center slowly
  if (yeti.x > -20 && yeti.x < W + 20) {
    if (yeti.x < W/2) yeti.x += 0.5;
    else yeti.x -= 0.5;
  }
}

function render() {
  // Clear
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawClouds();
  drawSnowfield();

  // Draw Trees
  trees.forEach(t => drawTree(t.x, t.y, t.scale, t.type));

  // Draw Yeti (Behind skier sometimes?)
  drawYeti();

  // Draw Skier
  drawSkier(skier.x, skier.y, skier.dir);

  // Snow Particles (Foreground)
  ctx.fillStyle = '#fff';
  for(let i=0; i<20; i++) {
    const px = (frame * 2 + i * 30) % W;
    const py = (frame * 4 + i * 20) % H;
    if (py > 80) ctx.fillRect(px, py, 2, 2);
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// Start
loop();

// UI Interaction
const startBtn = document.getElementById('start-btn');
startBtn.addEventListener('click', () => {
  // Visual feedback
  document.getElementById('center-ui').style.transform = "translate(-50%, -50%) scale(0.95)";
  document.getElementById('center-ui').style.opacity = "0.8";
  setTimeout(() => {
    document.getElementById('center-ui').style.display = "none";
  }, 200);
});

</script>
</body>
</html>
