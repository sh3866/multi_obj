<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Title Screen</title>
<style>
  /* 
    RESET & CORE SETUP 
    Using system fonts to ensure offline capability and pixel aesthetic.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #101010;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace; /* Fallback for pixel look */
  }

  /* 
    THE MONITOR 
    Minimalist frame. No heavy CRT curves. Just a clean retro shell.
  */
  #monitor {
    position: relative;
    width: 800px;
    height: 600px;
    background: #222;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 0 2px #000, 0 20px 50px rgba(0,0,0,0.6);
    border-bottom: 8px solid #111;
  }

  /* 
    THE SCREEN 
    4:3 Aspect Ratio Canvas Container
  */
  #screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }

  /* 
    CANVAS 
    Scaled up using CSS pixelation techniques
  */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* 
    SCANLINES & VIGNETTE 
    Reviewers requested: Remove heavy scanlines. 
    Solution: Very subtle scanlines (opacity 0.1) + Vignette for focus.
  */
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    background: 
      /* Very subtle scanlines */
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      ),
      /* Vignette for depth */
      radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6) 100%);
  }

  /* 
    UI LAYER 
    Strict Vertical Hierarchy: Title -> Skier (Canvas) -> Button -> Instructions
  */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none; /* Let clicks pass through empty areas */
  }

  /* 
    TYPOGRAPHY 
    Using a CSS trick on Courier New to make it look chunkier/more pixelated.
  */
  .pixel-text {
    font-family: 'Courier New', Courier, monospace;
    text-transform: uppercase;
    font-weight: 900;
    line-height: 1;
    -webkit-font-smoothing: none;
    text-rendering: geometricPrecision;
  }

  /* 
    TITLE 
    High contrast, hard pixel shadow, centered.
  */
  .title-container {
    margin-top: 40px;
    z-index: 12;
    text-align: center;
  }

  h1.title {
    font-size: 72px;
    color: #fff;
    /* Hard pixel offset shadow */
    text-shadow: 
      6px 6px 0px #000, 
      -2px -2px 0px #0055aa; /* Blue accent */
    letter-spacing: -2px;
    position: relative;
    animation: title-bob 3s ease-in-out infinite;
  }

  @keyframes title-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* 
    BUTTON 
    "In-World" feel but clearly clickable. 
    Solid color, distinct borders, no semi-transparency.
    Positioned in the "valley" below the skier (visually).
  */
  .action-area {
    margin-top: auto; /* Push down */
    margin-bottom: 60px; /* Space above footer */
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 12;
  }

  .start-btn {
    background: #cc0000;
    color: #fff;
    font-size: 24px;
    padding: 12px 32px;
    border: 4px solid #fff;
    outline: none;
    cursor: pointer;
    /* Retro Bevel Effect */
    box-shadow: 
      inset 4px 4px 0px #ff6666, 
      inset -4px -4px 0px #880000,
      6px 6px 0px #000;
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative;
    animation: pulse-btn 2s infinite;
  }

  .start-btn:hover {
    background: #e60000;
    transform: translateY(-2px);
    box-shadow: 
      inset 4px 4px 0px #ff6666, 
      inset -4px -4px 0px #880000,
      8px 8px 0px #000;
  }

  .start-btn:active {
    transform: translateY(4px);
    box-shadow: 
      inset 4px 4px 0px #880000, 
      inset -4px -4px 0px #ff6666,
      2px 2px 0px #000;
  }

  @keyframes pulse-btn {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.9; }
  }

  /* 
    INSTRUCTIONS 
    Dedicated HUD bar at the bottom. 
    Solid background, clear text, separated from the button.
  */
  .hud-footer {
    position: absolute;
    bottom: 20px;
    width: 80%;
    background: #000;
    border: 2px solid #fff;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: 14px;
    z-index: 12;
    box-shadow: 0 0 0 2px #000; /* Double border effect */
  }

  .key-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .key {
    background: #eee;
    color: #000;
    padding: 2px 6px;
    border-bottom: 3px solid #999;
    font-size: 12px;
    line-height: 1;
    font-weight: bold;
  }

  /* Responsive */
  @media (max-width: 820px) {
    #monitor { width: 100vw; height: 100vh; border-radius: 0; border: none; padding: 0; }
    #screen { border-radius: 0; }
    h1.title { font-size: 48px; }
    .hud-footer { width: 95%; font-size: 12px; flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>

<div id="monitor">
  <div id="screen">
    <!-- 320x240 Native Resolution -->
    <canvas id="scene" width="320" height="240"></canvas>
    <div id="overlay"></div>

    <div id="ui-layer">
      
      <!-- 1. Title -->
      <div class="title-container">
        <h1 class="title pixel-text">SKIFREE</h1>
      </div>

      <!-- 2. Action (Button) -->
      <div class="action-area">
        <button id="start-btn" class="start-btn pixel-text">PRESS START</button>
      </div>

      <!-- 3. Instructions (HUD) -->
      <div class="hud-footer pixel-text">
        <div class="key-group">
          <span class="key">←</span><span class="key">→</span> STEER
        </div>
        <div class="key-group">
          <span class="key">↑</span> SPEED
        </div>
        <div class="key-group">
          <span class="key">ESC</span> MENU
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/**
 * VISUAL ENGINE
 * Optimized for crisp 1-bit style rendering.
 * No anti-aliasing, integer coordinates.
 */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
// Disable smoothing for crisp pixels
ctx.imageSmoothingEnabled = false;

const W = 320, H = 240;

// PALETTE
const C = {
  skyTop: '#000022',
  skyBot: '#000066',
  snow: '#f0f0ff',
  snowShade: '#d0d0e0',
  treeDark: '#002200',
  treeLight: '#004400',
  trunk: '#221100',
  skierRed: '#cc0000',
  skierBlue: '#0000aa',
  skierSkin: '#ffccaa',
  skierWhite: '#ffffff',
  dust: '#ffffff'
};

let frame = 0;

// --- ENTITIES ---

// Clouds
const clouds = [];
for(let i=0; i<5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 10 + Math.random() * 40,
    w: 20 + Math.random() * 30,
    speed: 0.1 + Math.random() * 0.2
  });
}

// Trees (Background)
const trees = [];
for(let i=0; i<12; i++) {
  trees.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 0.5 + Math.random() * 0.5, // Scale
    speed: 1.5 + Math.random() // Parallax speed
  });
}

// Skier State
const skier = {
  x: W / 2,
  y: 100, // Fixed vertical position for title screen
  tilt: 0,
  dustTimer: 0
};

// Dust Particles
const dust = [];

// --- DRAWING FUNCTIONS ---

function drawSky() {
  // Simple gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 80);
  grad.addColorStop(0, C.skyTop);
  grad.addColorStop(1, C.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 80);
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  clouds.forEach(c => {
    c.x += c.speed;
    if(c.x > W + 20) c.x = -c.w;
    
    // Pixelated Cloud
    ctx.fillRect(Math.floor(c.x), Math.floor(c.y), Math.floor(c.w), 4);
    ctx.fillRect(Math.floor(c.x+4), Math.floor(c.y-3), Math.floor(c.w-8), 3);
  });
}

function drawSnowfield() {
  // Solid Snow
  ctx.fillStyle = C.snow;
  ctx.fillRect(0, 70, W, H - 70);
  
  // Texture lines (speed effect)
  ctx.fillStyle = C.snowShade;
  for(let i=0; i<30; i++) {
    // Create vertical streaks that move down
    const y = (frame * 3 + i * 23) % (H - 70) + 70;
    const x = (i * 37) % W;
    ctx.fillRect(x, y, 2, 8);
  }
}

function drawTree(t) {
  const x = Math.floor(t.x);
  const y = Math.floor(t.y);
  const s = t.size;

  // Shadow
  ctx.fillStyle = C.snowShade;
  ctx.fillRect(x + 2, y, 10 * s, 4);

  // Trunk
  ctx.fillStyle = C.trunk;
  ctx.fillRect(x, y - 10 * s, 3 * s, 12 * s);

  // Leaves (Blocky Triangle)
  ctx.fillStyle = C.treeDark;
  ctx.fillRect(x - 6 * s, y - 10 * s, 15 * s, 6 * s);
  ctx.fillRect(x - 4 * s, y - 16 * s, 11 * s, 6 * s);
  ctx.fillRect(x - 2 * s, y - 22 * s, 7 * s, 6 * s);
  
  // Snow Caps (Highlights)
  ctx.fillStyle = C.snow;
  ctx.fillRect(x - 2 * s, y - 18 * s, 4 * s, 2 * s);
  ctx.fillRect(x + 2 * s, y - 12 * s, 3 * s, 2 * s);
}

function drawSkier() {
  const sx = Math.floor(skier.x);
  const sy = Math.floor(skier.y + Math.sin(frame * 0.1) * 2); // Bobbing
  const s = 1.5; // Scale

  // Shadow
  ctx.fillStyle = 'rgba(0,0,50,0.3)';
  ctx.fillRect(sx - 8, sy + 14, 16, 4);

  // Skis
  ctx.fillStyle = C.skierWhite;
  ctx.fillRect(sx - 10, sy + 14, 8, 2); // Left
  ctx.fillRect(sx + 2, sy + 14, 8, 2);  // Right

  // Legs
  ctx.fillStyle = C.skierBlue;
  ctx.fillRect(sx - 4, sy + 8, 3, 6);
  ctx.fillRect(sx + 1, sy + 8, 3, 6);

  // Body (Red Jacket)
  ctx.fillStyle = C.skierRed;
  ctx.fillRect(sx - 5, sy - 4, 10, 12);
  
  // Zipper
  ctx.fillStyle = C.skierWhite;
  ctx.fillRect(sx, sy - 4, 1, 12);

  // Head
  ctx.fillStyle = C.skierSkin;
  ctx.fillRect(sx - 3, sy - 10, 6, 6);

  // Goggles
  ctx.fillStyle = '#000';
  ctx.fillRect(sx - 2, sy - 8, 5, 2);

  // Scarf (Blowing in wind)
  ctx.fillStyle = C.treeLight;
  ctx.fillRect(sx - 5, sy - 4, 10, 2);
  // Scarf tail
  const tailX = sx - 6 - Math.floor(Math.sin(frame * 0.2) * 4);
  ctx.fillRect(tailX, sy - 2, 4, 2);

  // Generate Dust
  if (frame % 3 === 0) {
    dust.push({
      x: sx + (Math.random() * 10 - 5),
      y: sy + 14,
      vx: (Math.random() - 0.5) * 2,
      vy: -1 - Math.random(),
      life: 20
    });
  }
}

function drawDust() {
  ctx.fillStyle = C.dust;
  for (let i = dust.length - 1; i >= 0; i--) {
    let p = dust[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 2, 2);
    
    if (p.life <= 0) dust.splice(i, 1);
  }
}

// --- MAIN LOOP ---

function update() {
  frame++;

  // Move trees down (Simulate skiing down)
  trees.forEach(t => {
    t.y += t.speed;
    if (t.y > H + 20) {
      t.y = -30;
      t.x = Math.random() * W;
    }
  });
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawClouds();
  drawSnowfield();

  // Draw Trees (Sorted by Y for depth)
  trees.sort((a, b) => a.y - b.y);
  trees.forEach(drawTree);

  drawDust();
  drawSkier();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// Start
loop();

// Button Interaction
document.getElementById('start-btn').addEventListener('click', () => {
  const btn = document.getElementById('start-btn');
  btn.innerText = "LOADING...";
  btn.style.backgroundColor = "#00aa00"; // Green
  btn.style.boxShadow = "inset 4px 4px 0px #006600, inset -4px -4px 0px #00ff00, 6px 6px 0px #000";
  
  setTimeout(() => {
    alert("GAME START! (This is a visual demo)");
    btn.innerText = "PRESS START";
    btn.style.backgroundColor = "";
    btn.style.boxShadow = "";
  }, 1000);
});

</script>
</body>
</html>
