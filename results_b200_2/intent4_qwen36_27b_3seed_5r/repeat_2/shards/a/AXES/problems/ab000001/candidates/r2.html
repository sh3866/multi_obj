<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Color Palette: Elevated Storybook --- */
            --bg-paper: #F2EBE5;
            --bg-paper-dark: #E3D9CD;
            
            --board-frame: #7A5C43; /* Rich Walnut */
            --board-inner: #5C4033; /* Dark Wood Shadow */
            --tile-cream: #FDFBF7; /* High Contrast Paper */
            --tile-shadow: #E6DCC8;
            
            --ink-primary: #4A3B2A;
            --path-ink: #8B5A2B; /* Deep Saddle Brown */
            --path-active: #E76F51; /* Burnt Sienna - High Saturation */
            
            --star-gold: #F4A261;
            --star-stroke: #E76F51;
            
            --btn-run: #2A9D8F; /* Teal - Complementary & Playful */
            --btn-run-shadow: #1F7A6F;
            --btn-reset: #E9C46A; /* Muted Gold */
            --btn-reset-shadow: #C49A36;

            /* --- Typography --- */
            --font-display: "Nunito", "Fredoka One", "Varela Round", "Comic Sans MS", sans-serif;
            --font-body: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;

            /* --- Spacing & Geometry --- */
            --radius-frame: 24px;
            --radius-tile: 12px;
            --radius-btn: 16px;
            
            /* Dynamic sizing */
            --grid-size: 6;
            --gap: 6px;
            --board-padding: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Canvas Texture */
            background-image: 
                linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: var(--font-display);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-primary);
        }

        /* --- Header: Secondary Hierarchy --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 2;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0;
            color: var(--ink-primary);
            font-weight: 800;
            letter-spacing: 0.5px;
            /* Soft text shadow for depth */
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8), 0 0 10px rgba(0,0,0,0.05);
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--path-ink);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 6px;
            opacity: 0.9;
            background: rgba(255,255,255,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* --- The Board: Primary Focal Point --- */
        .board-wrapper {
            position: relative;
            /* Tactile Wooden Frame */
            background: var(--board-frame);
            padding: var(--board-padding);
            border-radius: var(--radius-frame);
            box-shadow: 
                0 20px 40px rgba(74, 59, 42, 0.3), /* Deep Drop Shadow */
                inset 0 4px 8px rgba(255,255,255,0.2), /* Top Highlight */
                inset 0 -4px 8px rgba(0,0,0,0.3); /* Bottom Shadow */
            border: 2px solid rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        /* The Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            grid-template-rows: repeat(var(--grid-size), 1fr);
            gap: var(--gap);
            width: min(85vw, 420px);
            height: min(85vw, 420px);
            background-color: var(--board-inner); /* Visible between tiles */
            border-radius: calc(var(--radius-frame) - 6px);
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-cream);
            border-radius: var(--radius-tile);
            position: relative;
            cursor: pointer;
            /* Inner Shadow for "pressed paper" feel */
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            transition: transform 0.15s ease, background-color 0.2s;
            overflow: hidden; /* Clips paths at radius */
        }

        .tile:active {
            transform: scale(0.95);
        }

        /* SVG Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            shape-rendering: geometricPrecision;
        }

        .path-line {
            fill: none;
            stroke: var(--path-ink);
            stroke-width: 8; /* Thicker, Crisp */
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease, stroke-width 0.2s ease;
            opacity: 0.6;
        }

        /* Active State (Solved Path) */
        .tile.active .path-line {
            stroke: var(--path-active);
            opacity: 1;
            stroke-width: 10;
            /* Glowing effect */
            filter: drop-shadow(0 0 4px rgba(231, 111, 81, 0.5));
        }

        /* --- Game Entities (Cub & Star) --- */
        
        /* The Goal: Star Marker */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            z-index: 5;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-4px); }
        }

        /* The Cub: Character Token */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.3));
        }

        /* --- Footer Controls: Grouped & Tactile --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 14px 36px;
            border-radius: var(--radius-btn);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            position: relative;
            top: 0;
            transition: transform 0.1s;
        }

        /* Primary Action: Run */
        .btn-run {
            background-color: var(--btn-run);
            box-shadow: 
                0 6px 0 var(--btn-run-shadow), 
                0 12px 12px rgba(0,0,0,0.15);
        }

        .btn-run:hover {
            background-color: #32B2A3;
        }

        /* Secondary Action: Reset */
        .btn-reset {
            background-color: var(--btn-reset);
            color: #5C4033; /* Dark text for contrast on yellow */
            box-shadow: 
                0 6px 0 var(--btn-reset-shadow), 
                0 12px 12px rgba(0,0,0,0.1);
        }
        
        .btn-reset:hover {
            background-color: #F0D38B;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--btn-run-shadow);
        }

        /* --- Responsive Tweaks --- */
        @media (max-width: 400px) {
            :root {
                --board-padding: 8px;
                --gap: 4px;
            }
            h1 { font-size: 1.8rem; }
            button { padding: 12px 24px; font-size: 1rem; }
        }

    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the Star!</div>
    </header>

    <div class="board-wrapper">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 0, y: 2 }; 
        const endPos = { x: 5, y: 3 };

        // Connection definitions for drawing: [Top, Right, Bottom, Left]
        const connTypes = {
            straightV: [true, false, true, false],
            straightH: [false, true, false, true],
            cornerTR: [true, true, false, false],
            cornerBR: [false, true, true, false],
            cornerBL: [false, false, true, true],
            cornerTL: [true, false, false, true],
            tDown: [true, true, false, true],
            tUp: [false, true, true, true],
            cross: [true, true, true, true]
        };

        // --- SVG Generators ---
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            // Draw lines from center to edge
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Star SVG (Goal Marker - Per Critique) ---
        const starSVG = `
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 L61 35 L88 35 L66 55 L75 80 L50 65 L25 80 L34 55 L12 35 L39 35 Z" 
                fill="var(--star-gold)" stroke="var(--star-stroke)" stroke-width="4" stroke-linejoin="round"/>
            </svg>
        `;

        // --- Bear SVG (Cub Token - Polished) ---
        const bearSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears (Behind) -->
                <circle cx="25" cy="30" r="14" fill="#8D6E63" stroke="#4A3B2A" stroke-width="3"/>
                <circle cx="75" cy="30" r="14" fill="#8D6E63" stroke="#4A3B2A" stroke-width="3"/>
                <circle cx="25" cy="30" r="6" fill="#D7CCC8"/>
                <circle cx="75" cy="30" r="6" fill="#D7CCC8"/>
                
                <!-- Head -->
                <circle cx="50" cy="50" r="36" fill="#A1887F" stroke="#4A3B2A" stroke-width="3"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="62" rx="16" ry="12" fill="#D7CCC8"/>
                
                <!-- Eyes -->
                <circle cx="38" cy="45" r="3.5" fill="#2C241B"/>
                <circle cx="62" cy="45" r="3.5" fill="#2C241B"/>
                <circle cx="39" cy="44" r="1" fill="#fff"/>
                <circle cx="63" cy="44" r="1" fill="#fff"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="58" rx="5" ry="3" fill="#2C241B"/>
                
                <!-- Mouth -->
                <path d="M50 61 L50 65 Q45 70 40 65 M50 65 Q55 70 60 65" stroke="#4A3B2A" stroke-width="2" fill="none"/>
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = bearSVG;
            gridEl.appendChild(cub);

            // Create the Goal Marker (Star)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Determine tile content
                    let conn = [false, false, false, false]; // Empty

                    // Logic to define the specific path connections
                    if (x === 0 && y === 2) conn = connTypes.cornerTR; // Start
                    else if (x === 1 && y === 2) conn = connTypes.cornerTL; 
                    else if (x === 1 && y === 1) conn = connTypes.cornerBR;
                    else if (x === 2 && y === 1) conn = connTypes.straightH;
                    else if (x === 3 && y === 1) conn = connTypes.cornerBL;
                    else if (x === 3 && y === 2) conn = connTypes.straightV;
                    else if (x === 3 && y === 3) conn = connTypes.cornerTR;
                    else if (x === 4 && y === 3) conn = connTypes.straightH;
                    else if (x === 5 && y === 3) conn = connTypes.cornerTL; // End
                    
                    // Fill rest with random patterns for visual texture
                    else {
                        const types = Object.values(connTypes);
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
            
            // Calculate center of the tile using percentages for responsiveness
            // Formula: (index * 100%) + (50%)
            const top = `${y * 100 + 50}%`;
            const left = `${x * 100 + 50}%`;

            cub.style.top = top;
            cub.style.left = left;
        }

        function updateGoalPosition(x, y) {
            const goal = document.querySelector('.marker-goal');
            
            const top = `${y * 100 + 50}%`;
            const left = `${x * 100 + 50}%`;

            goal.style.top = top;
            goal.style.left = left;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback
            const board = document.querySelector('.board-wrapper');
            board.style.transform = 'scale(0.98)';
            setTimeout(() => board.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            const pathCoords = [
                {x:0, y:2}, {x:1, y:2}, {x:1, y:1}, 
                {x:2, y:1}, {x:3, y:1}, {x:3, y:2}, 
                {x:3, y:3}, {x:4, y:3}, {x:5, y:3}
            ];

            let delay = 0;
            const stepTime = 300; 

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += stepTime;
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
