<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Refined Storybook --- */
            --bg-paper: #F4F1EA;
            --bg-texture: #EBE6D9;
            
            --wood-frame: #5D4037;
            --wood-frame-light: #795548;
            --wood-frame-dark: #3E2723;
            
            --tile-surface: #FFF8E1;
            --tile-shadow: #D7CCC8;
            --tile-bevel: #FFFFFF;
            
            --ink-dark: #3E2723;
            
            /* Path Colors */
            --path-inactive: #D7CCC8; /* Soft grey-beige */
            --path-active: #E64A19;   /* Terracotta/Amber */
            --path-glow: #FFCC80;
            
            /* UI Colors */
            --btn-primary: #FF8F00; /* Amber Gold */
            --btn-primary-shadow: #E65100;
            --btn-secondary: #A1887F; /* Muted Taupe */
            --btn-secondary-shadow: #8D6E63;

            /* --- Typography --- */
            /* Fallback-friendly rounded serif stack */
            --font-title: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif; 
            --font-body: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* --- Dimensions --- */
            --board-gap: 8px;
            --board-pad: 18px;
            --tile-radius: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-paper);
            /* Storybook Paper Texture */
            background-image: 
                radial-gradient(var(--bg-texture) 20%, transparent 21%),
                radial-gradient(var(--bg-texture) 20%, transparent 21%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-dark);
        }

        /* --- Vignette Overlay for "Book" feel --- */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 60%, rgba(62, 39, 35, 0.15) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: var(--font-title);
            font-size: 3rem;
            margin: 0;
            color: var(--wood-frame);
            font-weight: 800;
            letter-spacing: -0.5px;
            /* Storybook Ink Effect */
            text-shadow: 2px 2px 0px rgba(255,255,255,0.6), 
                         0px 0px 1px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--wood-frame-light);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* --- Board Container --- */
        .board-wrapper {
            position: relative;
            background: var(--wood-frame);
            padding: var(--board-pad);
            border-radius: 20px;
            /* Complex Wood Texture & Depth */
            box-shadow: 
                inset 0 2px 0 var(--wood-frame-light), /* Top Highlight */
                inset 0 -4px 8px var(--wood-frame-dark), /* Inner Shadow */
                0 20px 40px rgba(62, 39, 35, 0.4), /* Drop Shadow */
                0 4px 0 rgba(255,255,255,0.1); /* Bottom Bevel */
            border: 1px solid var(--wood-frame-dark);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: var(--board-gap);
            width: min(85vw, 420px);
            height: min(85vw, 420px);
            background-color: var(--wood-frame-dark); /* Grout color */
            border-radius: 12px;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-surface);
            border-radius: var(--tile-radius);
            position: relative;
            cursor: pointer;
            /* Tactile Tile Look: Bevels and Inner Shadows */
            box-shadow: 
                inset 0 2px 4px var(--tile-bevel), /* Top Bevel */
                inset 0 -3px 6px rgba(0,0,0,0.08), /* Bottom Inner Shadow */
                0 2px 0 var(--tile-shadow); /* Bottom Edge Thickness */
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                inset 0 2px 4px var(--tile-bevel),
                inset 0 -1px 2px rgba(0,0,0,0.08),
                0 0 0 var(--tile-shadow);
        }

        /* --- SVG Paths --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .path-line {
            fill: none;
            stroke: var(--path-inactive);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Inlaid look: subtle inner shadow */
            filter: drop-shadow(0px 1px 1px rgba(255,255,255,0.5));
            transition: stroke 0.4s ease, filter 0.3s;
        }

        /* Active State */
        .tile.active .path-line {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 4px var(--path-glow));
        }

        /* --- Game Entities --- */
        
        /* The Goal: Star Marker */
        .marker-goal {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            animation: floatStar 4s ease-in-out infinite;
            filter: drop-shadow(0 6px 8px rgba(230, 74, 25, 0.3));
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .marker-goal svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        @keyframes floatStar {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }

        /* The Cub: Character Token */
        .cub-token {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.3));
        }
        
        .cub-token svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 32px;
            border-radius: 50px; /* Pill shape */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            position: relative;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
        }

        /* Primary Action: Run */
        .btn-run {
            background-color: var(--btn-primary);
            box-shadow: 
                0 4px 0 var(--btn-primary-shadow), 
                0 6px 12px rgba(230, 81, 0, 0.25);
            font-size: 1.1rem;
            min-width: 120px;
        }

        .btn-run:hover {
            background-color: #FFA000;
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 var(--btn-primary-shadow), 
                0 8px 16px rgba(230, 81, 0, 0.3);
        }

        /* Secondary Action: Reset */
        .btn-reset {
            background-color: transparent;
            color: var(--btn-secondary);
            box-shadow: none;
            border: 2px solid var(--btn-secondary);
            padding: 10px 28px; /* Slightly smaller */
        }
        
        .btn-reset:hover {
            background-color: rgba(161, 136, 127, 0.1);
            color: var(--btn-secondary-shadow);
            border-color: var(--btn-secondary-shadow);
        }

        button:active {
            transform: translateY(2px) !important;
            box-shadow: 0 0 0 transparent !important;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            h1 { font-size: 2.4rem; }
            :root { --board-pad: 12px; --board-gap: 4px; }
            .btn-run { padding: 10px 24px; font-size: 1rem; }
            .btn-reset { padding: 8px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Guide Cub home</div>
    </header>

    <div class="board-wrapper">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        // Changed to Top-Left start as requested by critique
        const startPos = { x: 0, y: 0 }; 
        const endPos = { x: 5, y: 5 };

        // Connection definitions for drawing: [Top, Right, Bottom, Left]
        const connTypes = {
            straightV: [1, 0, 1, 0],
            straightH: [0, 1, 0, 1],
            cornerTR: [1, 1, 0, 0],
            cornerBR: [0, 1, 1, 0],
            cornerBL: [0, 0, 1, 1],
            cornerTL: [1, 0, 0, 1],
            tDown: [1, 1, 0, 1],
            tUp: [0, 1, 1, 1],
            tRight: [1, 1, 1, 0],
            tLeft: [1, 0, 1, 1],
            cross: [1, 1, 1, 1]
        };

        // --- SVG Generators ---
        
        // Helper to generate path string based on connections
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            // Draw lines from center to edge
            if (conn[0]) d += `M${mid},${mid} L${mid},0 `; // Top
            if (conn[1]) d += `M${mid},${mid} L${size},${mid} `; // Right
            if (conn[2]) d += `M${mid},${mid} L${mid},${size} `; // Bottom
            if (conn[3]) d += `M${mid},${mid} L0,${mid} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Star SVG (Goal Marker) ---
        // More "magical" and cohesive style
        const starSVG = `
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Magical Glow -->
                <circle cx="50" cy="50" r="32" fill="#FFECB3" opacity="0.6" filter="blur(2px)"/>
                <circle cx="50" cy="50" r="22" fill="#FFF8E1" opacity="0.8"/>
                
                <!-- Star Shape -->
                <path d="M50 12 L58 38 L86 38 L63 55 L72 82 L50 66 L28 82 L37 55 L14 38 L42 38 Z" 
                fill="#FFCA28" stroke="#FF6F00" stroke-width="2" stroke-linejoin="round"/>
                
                <!-- Inner Detail -->
                <circle cx="42" cy="42" r="3" fill="#FFF" opacity="0.9"/>
            </svg>
        `;

        // --- Bear SVG (Cub Token) ---
        // Hand-drawn style, soft edges
        const bearSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <circle cx="25" cy="32" r="13" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/>
                <circle cx="75" cy="32" r="13" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/>
                <circle cx="25" cy="32" r="6" fill="#D7CCC8"/>
                <circle cx="75" cy="32" r="6" fill="#D7CCC8"/>
                
                <!-- Head -->
                <circle cx="50" cy="52" r="35" fill="#A1887F" stroke="#5D4037" stroke-width="1.5"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="64" rx="15" ry="11" fill="#EFEBE9" stroke="#D7CCC8" stroke-width="1"/>
                
                <!-- Eyes -->
                <circle cx="38" cy="48" r="4.5" fill="#3E2723"/>
                <circle cx="62" cy="48" r="4.5" fill="#3E2723"/>
                <circle cx="39" cy="46" r="1.5" fill="#fff"/>
                <circle cx="63" cy="46" r="1.5" fill="#fff"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="60" rx="5" ry="3.5" fill="#3E2723"/>
                
                <!-- Mouth -->
                <path d="M46 66 Q50 70 54 66" stroke="#3E2723" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // 1. Create the Grid Tiles
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Logic to define the specific path connections
                    let conn = [0, 0, 0, 0]; // Empty

                    // Solution Path Definition: Snake pattern for demo
                    // (0,0)->(1,0)->(1,1)->(2,1)->(2,2)->(3,2)->(3,3)->(4,3)->(4,4)->(5,4)->(5,5)
                    if (x === 0 && y === 0) conn = connTypes.cornerBR; 
                    else if (x === 1 && y === 0) conn = connTypes.cornerBL; 
                    else if (x === 1 && y === 1) conn = connTypes.cornerTR;
                    else if (x === 2 && y === 1) conn = connTypes.cornerTL;
                    else if (x === 2 && y === 2) conn = connTypes.cornerBR;
                    else if (x === 3 && y === 2) conn = connTypes.cornerBL;
                    else if (x === 3 && y === 3) conn = connTypes.cornerTR;
                    else if (x === 4 && y === 3) conn = connTypes.cornerTL;
                    else if (x === 4 && y === 4) conn = connTypes.cornerBR;
                    else if (x === 5 && y === 4) conn = connTypes.cornerBL;
                    else if (x === 5 && y === 5) conn = connTypes.cornerTR; // End goal
                    else {
                        // Random noise for other tiles
                        const types = Object.values(connTypes);
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            // 2. Create the Cub Token (Overlay)
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = bearSVG;
            gridEl.appendChild(cub);

            // 3. Create the Goal Marker (Overlay)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            gridEl.appendChild(goal);

            // Initial Positions
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        // --- Positioning Logic ---
        function getPosPercentage(index, total) {
            const cellSize = 100 / total;
            return (index * cellSize) + (cellSize / 2);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            const top = getPosPercentage(y, GRID_SIZE);
            const left = getPosPercentage(x, GRID_SIZE);
            
            cub.style.top = `calc(${top}% - 50%)`;
            cub.style.left = `calc(${left}% - 50%)`;
            
            const cellPct = 100 / GRID_SIZE;
            cub.style.width = `${cellPct}%`;
            cub.style.height = `${cellPct}%`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.querySelector('.marker-goal');
            const top = getPosPercentage(y, GRID_SIZE);
            const left = getPosPercentage(x, GRID_SIZE);
            
            goal.style.top = `calc(${top}% - 50%)`;
            goal.style.left = `calc(${left}% - 50%)`;
            
            const cellPct = 100 / GRID_SIZE;
            goal.style.width = `${cellPct}%`;
            goal.style.height = `${cellPct}%`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback
            const board = document.querySelector('.board-wrapper');
            board.style.transform = 'scale(0.98)';
            setTimeout(() => board.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            // Updated path for the snake pattern
            const pathCoords = [
                {x:0, y:0}, {x:1, y:0}, {x:1, y:1}, 
                {x:2, y:1}, {x:2, y:2}, {x:3, y:2}, 
                {x:3, y:3}, {x:4, y:3}, {x:4, y:4},
                {x:5, y:4}, {x:5, y:5}
            ];

            // Reset first
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            updateCubPosition(startPos.x, startPos.y);

            let delay = 0;
            const stepTime = 250; 

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += stepTime;
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
