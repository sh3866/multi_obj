<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook / Wood & Fabric */
            --bg-color: #F4E7D3; /* Parchment */
            --board-bg: #E0C9A6; /* Light Wood */
            --tile-bg: #FFF8E7; /* Cream Cardstock */
            --tile-shadow: #DCC29E;
            --ink-color: #4A3B2A; /* Dark Brown Ink */
            --path-color: #A0522D; /* Sienna / Crayon */
            --path-active: #D95D39; /* Burnt Orange */
            --accent-green: #6B8C42; /* Moss */
            --accent-gold: #E9C46A; /* Gold */
            
            --font-display: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Arial Rounded MT Bold", sans-serif;
            --font-body: "Verdana", "Segoe UI", sans-serif;
            
            --tile-size: 70px;
            --gap: 8px;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            /* Storybook Texture */
            background-image: 
                radial-gradient(#DCC29E 1px, transparent 1px),
                radial-gradient(#DCC29E 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            font-family: var(--font-display);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-color);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 10px;
            z-index: 10;
            /* Reduced scale per critique */
            transform: scale(0.9); 
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: -1px;
            color: var(--ink-color);
            font-weight: 900;
            text-transform: uppercase;
            /* Playful ink effect */
            text-shadow: 2px 2px 0px rgba(255,255,255,0.6);
            -webkit-text-stroke: 1px var(--ink-color);
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: #7A6348;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* --- The Board Container --- */
        .game-container {
            position: relative;
            padding: 16px;
            background: var(--board-bg);
            /* Unified Geometry: Large radius */
            border-radius: var(--radius-lg);
            box-shadow: 
                0 15px 35px rgba(74, 59, 42, 0.2),
                inset 0 2px 0 rgba(255,255,255,0.4),
                0 0 0 6px #C2A683; /* Outer Frame */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-size));
            grid-template-rows: repeat(6, var(--tile-size));
            gap: var(--gap);
            position: relative;
        }

        /* --- Tiles --- */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background-color: var(--tile-bg);
            /* Unified Geometry: Proportional radius */
            border-radius: var(--radius-sm);
            position: relative;
            cursor: pointer;
            /* Tactile Depth */
            box-shadow: 
                0 4px 0 var(--tile-shadow),
                0 5px 10px rgba(74, 59, 42, 0.1);
            transition: transform 0.1s, background-color 0.2s;
        }

        .tile:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--tile-shadow);
        }

        /* SVG Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            shape-rendering: geometricPrecision;
            overflow: visible;
        }

        .path-line {
            fill: none;
            stroke: var(--path-color);
            stroke-width: 10; /* Thicker, crayon-like */
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.4; /* Dim by default */
            transition: stroke 0.3s ease, opacity 0.3s ease;
        }

        .tile.active .path-line {
            stroke: var(--path-active);
            opacity: 1;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
        }

        /* --- Characters & Markers --- */
        
        /* The Goal Marker (Bone) */
        .marker-goal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 2;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.2));
            animation: wiggle 4s ease-in-out infinite;
        }
        
        @keyframes wiggle {
            0%, 100% { transform: translate(-50%, -50%) rotate(-5deg); }
            50% { transform: translate(-50%, -50%) rotate(5deg); }
        }

        /* The Cub Token (Illustrated Bear) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25));
            pointer-events: none;
        }

        /* --- Footer & Controls --- */
        footer {
            margin-top: 16px; /* Tightened gap */
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 12px 32px;
            border-radius: var(--radius-md); /* Matched radius */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.1s ease;
            position: relative;
            top: 0;
            color: #fff;
            /* Physical Button Look */
            box-shadow: 
                0 5px 0 rgba(0,0,0,0.2), 
                inset 0 2px 0 rgba(255,255,255,0.3);
        }

        .btn-reset {
            background-color: #7A6348; /* Muted Brown */
        }

        .btn-reset:hover {
            background-color: #8B7355;
        }

        .btn-run {
            background-color: var(--accent-green); /* Moss Green */
            min-width: 120px;
        }

        .btn-run:hover {
            background-color: #7DA14D;
        }

        button:active {
            top: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 500px) {
            :root {
                --tile-size: 48px;
                --gap: 6px;
            }
            h1 { font-size: 2rem; }
            .game-container { padding: 12px; }
            .cub-token { width: 36px; height: 36px; }
            .marker-goal { width: 28px; height: 28px; }
        }

    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Find the Bone!</div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Bone)
        const startPos = { x: 0, y: 2 }; 
        const endPos = { x: 5, y: 3 };

        // Connection definitions for drawing: [Top, Right, Bottom, Left]
        const connTypes = {
            straightV: [true, false, true, false],
            straightH: [false, true, false, true],
            cornerTR: [true, true, false, false],
            cornerBR: [false, true, true, false],
            cornerBL: [false, false, true, true],
            cornerTL: [true, false, false, true],
            tDown: [true, true, false, true],
            tUp: [false, true, true, true],
            cross: [true, true, true, true]
        };

        // --- SVG Generators ---
        function createPathSVG(conn) {
            // conn is [top, right, bottom, left]
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            const cx = mid;
            const cy = mid;

            // Draw lines from center to edge
            if (conn[0]) d += `M${cx},${cy} L${cx},0 `; // Top
            if (conn[1]) d += `M${cx},${cy} L${size},${cy} `; // Right
            if (conn[2]) d += `M${cx},${cy} L${cx},${size} `; // Bottom
            if (conn[3]) d += `M${cx},${cy} L0,${cy} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Bone SVG (Goal) ---
        const boneSVG = `
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Bone Shape -->
                <path d="M30,25 C30,15 40,10 45,15 C50,20 50,30 55,30 C60,30 70,25 75,20 C80,15 90,20 90,30 C90,40 80,45 75,45 L30,55 C25,55 20,50 20,45 C15,40 15,30 20,25 C25,20 30,25 30,25 Z" 
                fill="#FFF8E7" stroke="#4A3B2A" stroke-width="6" stroke-linejoin="round"/>
                <!-- Highlight -->
                <path d="M45,15 L45,30" stroke="#E9C46A" stroke-width="4" stroke-linecap="round"/>
            </svg>
        `;

        // --- Bear SVG (Cub) ---
        const bearSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Body -->
                <circle cx="50" cy="55" r="35" fill="#C07F56" stroke="#4A3B2A" stroke-width="4"/>
                <!-- Ears -->
                <circle cx="25" cy="25" r="12" fill="#C07F56" stroke="#4A3B2A" stroke-width="4"/>
                <circle cx="75" cy="25" r="12" fill="#C07F56" stroke="#4A3B2A" stroke-width="4"/>
                <circle cx="25" cy="25" r="5" fill="#E8B48D"/>
                <circle cx="75" cy="25" r="5" fill="#E8B48D"/>
                <!-- Face -->
                <ellipse cx="50" cy="60" rx="18" ry="12" fill="#E8B48D"/>
                <!-- Eyes -->
                <circle cx="40" cy="45" r="3" fill="#2C241B"/>
                <circle cx="60" cy="45" r="3" fill="#2C241B"/>
                <!-- Nose -->
                <ellipse cx="50" cy="58" rx="5" ry="3" fill="#2C241B"/>
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // Create the Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = bearSVG;
            gridEl.appendChild(cub);

            // Create the Goal Marker
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = boneSVG;
            gridEl.appendChild(goal);

            // Generate Cells
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Determine tile content
                    // For the demo, we create a winding path manually
                    // Start (0,2) -> (1,2) -> (1,1) -> (2,1) -> (3,1) -> (3,2) -> (3,3) -> (4,3) -> (5,3) End
                    
                    let conn = [false, false, false, false]; // Empty

                    // Logic to define the specific path connections
                    if (x === 0 && y === 2) conn = connTypes.cornerTR; // Start
                    else if (x === 1 && y === 2) conn = connTypes.cornerTL; 
                    else if (x === 1 && y === 1) conn = connTypes.cornerBR;
                    else if (x === 2 && y === 1) conn = connTypes.straightH;
                    else if (x === 3 && y === 1) conn = connTypes.cornerBL;
                    else if (x === 3 && y === 2) conn = connTypes.straightV;
                    else if (x === 3 && y === 3) conn = connTypes.cornerTR;
                    else if (x === 4 && y === 3) conn = connTypes.straightH;
                    else if (x === 5 && y === 3) conn = connTypes.cornerTL; // End
                    
                    // Fill rest with random patterns for visual texture
                    else {
                        const types = Object.values(connTypes);
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
            
            // Calculate center of the tile
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            cub.style.top = `${top}px`;
            cub.style.left = `${left}px`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.querySelector('.marker-goal');
            const tileSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size'));
            const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
            
            const top = gap + y * (tileSize + gap) + (tileSize / 2);
            const left = gap + x * (tileSize + gap) + (tileSize / 2);

            goal.style.top = `${top}px`;
            goal.style.left = `${left}px`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback
            const grid = document.querySelector('.game-container');
            grid.style.transform = 'scale(0.95)';
            setTimeout(() => grid.style.transform = 'scale(1)', 150);
        }

        function solvePuzzle() {
            const pathCoords = [
                {x:0, y:2}, {x:1, y:2}, {x:1, y:1}, 
                {x:2, y:1}, {x:3, y:1}, {x:3, y:2}, 
                {x:3, y:3}, {x:4, y:3}, {x:5, y:3}
            ];

            let delay = 0;
            const stepTime = 350; // Slower, more deliberate pace

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += stepTime;
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
