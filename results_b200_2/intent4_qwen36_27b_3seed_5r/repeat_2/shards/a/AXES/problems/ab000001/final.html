<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Refined Storybook --- */
            /* Warmer, earthier tones. Less beige, more rich paper and wood. */
            --bg-wall: #F2E8D5;
            --bg-accent: #E0D0B4;
            
            /* Wood Frame: Deep Walnut */
            --wood-primary: #4E342E;
            --wood-shadow: #2D1E1B;
            --wood-highlight: #6D4C41;
            
            /* Tile Surface: Soft Linen */
            --tile-base: #FFF3E0;
            --tile-shadow: #D7CCC8;
            --tile-inset: #FFFFFF;
            
            /* Ink & Text */
            --ink-primary: #3E2723;
            --ink-secondary: #8D6E63;
            
            /* Path Colors */
            --path-inactive: #BCAAA4; /* Soft Taupe */
            --path-active: #D84315;   /* Burnt Terracotta */
            --path-glow: #FFAB91;
            
            /* UI Colors */
            --btn-primary: #E64A19; /* Burnt Orange */
            --btn-primary-dark: #BF360C;
            
            --btn-secondary: #D7CCC8; /* Soft Stone */
            --btn-secondary-text: #5D4037;

            /* --- Typography --- */
            /* Using system fonts to simulate a chunky serif/hand-drawn feel */
            --font-display: "Rockwell", "Rockwell Condensed", "Courier New", serif;
            --font-body: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;

            /* --- Dimensions --- */
            /* UNIFIED GEOMETRY: Using a consistent squircle-ish radius */
            --radius-board: 24px;
            --radius-tile: 14px;
            --radius-btn: 16px;
            
            --board-gap: 6px;
            --board-pad: 16px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-wall);
            /* Subtle Wall Texture */
            background-image: 
                radial-gradient(var(--bg-accent) 15%, transparent 16%),
                radial-gradient(var(--bg-accent) 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink-primary);
        }

        /* --- Ambient Lighting --- */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.4), transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            position: relative;
            /* Reduce visual weight compared to board */
            transform: scale(0.9); 
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            margin: 0;
            color: var(--wood-primary);
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
            /* Ink bleed effect */
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            line-height: 1;
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: var(--ink-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* --- Board Container --- */
        .board-wrapper {
            position: relative;
            background: var(--wood-primary);
            padding: var(--board-pad);
            border-radius: var(--radius-board);
            
            /* 3D Wood Frame Effect */
            box-shadow: 
                inset 0 0 0 2px var(--wood-highlight), /* Top Bevel */
                inset 0 0 0 4px var(--wood-shadow),     /* Inner Dark Frame */
                0 25px 50px -10px rgba(0,0,0,0.4),      /* Deep Drop Shadow */
                0 10px 20px rgba(0,0,0,0.3);            /* Contact Shadow */
            
            border: 1px solid var(--wood-shadow);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10;
        }

        /* --- The Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: var(--board-gap);
            /* Responsive sizing */
            width: min(88vw, 440px);
            height: min(88vw, 440px);
            
            background-color: var(--wood-shadow); /* Grout/Gap color */
            border-radius: 16px;
            position: relative;
            /* Inner depth for the board surface */
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-base);
            border-radius: var(--radius-tile);
            position: relative;
            cursor: pointer;
            
            /* Tactile "Block" Look */
            box-shadow: 
                inset 0 2px 5px rgba(255,255,255,0.8), /* Top Highlight */
                inset 0 -4px 6px rgba(0,0,0,0.08),     /* Bottom Inner Shadow */
                0 3px 0 var(--tile-shadow);             /* Bottom Edge Thickness */
            
            transition: transform 0.1s ease, filter 0.2s;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                inset 0 2px 5px rgba(255,255,255,0.8),
                inset 0 -2px 4px rgba(0,0,0,0.08),
                0 1px 0 var(--tile-shadow);
        }

        /* --- SVG Paths --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .path-line {
            fill: none;
            stroke: var(--path-inactive);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Inlaid look */
            filter: drop-shadow(0px 1px 0px rgba(255,255,255,0.5));
            transition: stroke 0.4s ease, filter 0.3s, stroke-width 0.3s;
        }

        /* Active State (The Solution) */
        .tile.active .path-line {
            stroke: var(--path-active);
            /* Glowing wire effect */
            filter: drop-shadow(0 0 6px var(--path-glow)) drop-shadow(0px 1px 0px rgba(255,255,255,0.5));
            stroke-width: 16;
        }

        /* --- Game Entities --- */
        
        /* The Goal: Star Marker */
        .marker-goal {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            animation: floatStar 4s ease-in-out infinite;
            /* Warm magical glow */
            filter: drop-shadow(0 6px 10px rgba(255, 160, 0, 0.4));
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .marker-goal svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        @keyframes floatStar {
            0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
            50% { transform: translateY(-6px) scale(1.05) rotate(5deg); }
        }

        /* The Cub: Character Token */
        .cub-token {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* 3D Token Shadow */
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.35));
        }
        
        .cub-token svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1rem;
            padding: 14px 36px;
            border-radius: var(--radius-btn); /* Unified geometry */
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
        }

        /* Primary Action: Run */
        .btn-run {
            background-color: var(--btn-primary);
            color: #fff;
            /* Tactile Button Shadow */
            box-shadow: 
                0 6px 0 var(--btn-primary-dark), 
                0 10px 15px rgba(0,0,0,0.2);
            min-width: 140px;
        }

        .btn-run:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-primary-dark), 
                0 12px 20px rgba(0,0,0,0.25);
        }

        /* Secondary Action: Reset */
        .btn-reset {
            background-color: var(--btn-secondary);
            color: var(--btn-secondary-text);
            box-shadow: 
                0 4px 0 #BCAAA4, 
                0 6px 10px rgba(0,0,0,0.1);
        }
        
        .btn-reset:hover {
            background-color: #EFEBE9;
            color: #4E342E;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(4px) !important;
            box-shadow: 0 0 0 transparent !important;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(0.9); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            h1 { font-size: 2rem; }
            :root { --board-pad: 12px; --board-gap: 4px; }
            .btn-run { padding: 12px 24px; font-size: 0.9rem; min-width: 120px; }
            .btn-reset { padding: 10px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Guide Cub home</div>
    </header>

    <div class="board-wrapper">
        <div class="grid" id="grid">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="solvePuzzle()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 6;
        const gridEl = document.getElementById('grid');

        // Coordinates for Start (Cub) and End (Star)
        const startPos = { x: 0, y: 0 }; 
        const endPos = { x: 5, y: 5 };

        // Connection definitions for drawing: [Top, Right, Bottom, Left]
        const connTypes = {
            straightV: [1, 0, 1, 0],
            straightH: [0, 1, 0, 1],
            cornerTR: [1, 1, 0, 0],
            cornerBR: [0, 1, 1, 0],
            cornerBL: [0, 0, 1, 1],
            cornerTL: [1, 0, 0, 1],
            tDown: [1, 1, 0, 1],
            tUp: [0, 1, 1, 1],
            tRight: [1, 1, 1, 0],
            tLeft: [1, 0, 1, 1],
            cross: [1, 1, 1, 1]
        };

        // --- SVG Generators ---
        
        // Helper to generate path string based on connections
        function createPathSVG(conn) {
            const size = 100;
            const mid = size / 2;
            
            let d = "";
            // Draw lines from center to edge
            if (conn[0]) d += `M${mid},${mid} L${mid},0 `; // Top
            if (conn[1]) d += `M${mid},${mid} L${size},${mid} `; // Right
            if (conn[2]) d += `M${mid},${mid} L${mid},${size} `; // Bottom
            if (conn[3]) d += `M${mid},${mid} L0,${mid} `; // Left

            return `<svg viewBox="0 0 100 100"><path d="${d}" class="path-line" /></svg>`;
        }

        // --- Star SVG (Goal Marker) ---
        // Designed to look like a "Night Light" or magical destination
        const starSVG = `
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Glow Rings -->
                <circle cx="50" cy="50" r="35" fill="#FFCC80" opacity="0.3" filter="blur(3px)"/>
                <circle cx="50" cy="50" r="25" fill="#FFE0B2" opacity="0.6"/>
                
                <!-- Star Shape -->
                <path d="M50 15 L58 40 L85 40 L63 58 L72 85 L50 68 L28 85 L37 58 L15 40 L42 40 Z" 
                fill="#FFD54F" stroke="#FF6F00" stroke-width="2" stroke-linejoin="round"/>
                
                <!-- Face/Detail -->
                <circle cx="42" cy="48" r="2.5" fill="#5D4037"/>
                <circle cx="58" cy="48" r="2.5" fill="#5D4037"/>
                <path d="M45 58 Q50 62 55 58" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        `;

        // --- Bear SVG (Cub Token) ---
        // "Sticker" style with thick border to pop off the tile
        const bearSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Sticker Border -->
                <circle cx="50" cy="50" r="48" fill="#fff" stroke="#fff" stroke-width="0"/>
                
                <!-- Ears -->
                <circle cx="22" cy="30" r="14" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
                <circle cx="78" cy="30" r="14" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
                
                <!-- Head -->
                <circle cx="50" cy="54" r="36" fill="#A1887F" stroke="#4E342E" stroke-width="2"/>
                
                <!-- Snout -->
                <ellipse cx="50" cy="66" rx="16" ry="12" fill="#EFEBE9" stroke="#D7CCC8" stroke-width="1"/>
                
                <!-- Eyes -->
                <circle cx="36" cy="46" r="5" fill="#3E2723"/>
                <circle cx="64" cy="46" r="5" fill="#3E2723"/>
                <!-- Sparkles -->
                <circle cx="38" cy="44" r="2" fill="#fff"/>
                <circle cx="66" cy="44" r="2" fill="#fff"/>
                
                <!-- Nose -->
                <ellipse cx="50" cy="62" rx="6" ry="4" fill="#3E2723"/>
                
                <!-- Mouth -->
                <path d="M44 68 Q50 72 56 68" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        `;

        // --- Initialization ---
        function initGrid() {
            gridEl.innerHTML = '';
            
            // 1. Create the Grid Tiles
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    // Logic to define the specific path connections
                    let conn = [0, 0, 0, 0]; // Empty

                    // Solution Path Definition: Snake pattern for demo
                    if (x === 0 && y === 0) conn = connTypes.cornerBR; 
                    else if (x === 1 && y === 0) conn = connTypes.cornerBL; 
                    else if (x === 1 && y === 1) conn = connTypes.cornerTR;
                    else if (x === 2 && y === 1) conn = connTypes.cornerTL;
                    else if (x === 2 && y === 2) conn = connTypes.cornerBR;
                    else if (x === 3 && y === 2) conn = connTypes.cornerBL;
                    else if (x === 3 && y === 3) conn = connTypes.cornerTR;
                    else if (x === 4 && y === 3) conn = connTypes.cornerTL;
                    else if (x === 4 && y === 4) conn = connTypes.cornerBR;
                    else if (x === 5 && y === 4) conn = connTypes.cornerBL;
                    else if (x === 5 && y === 5) conn = connTypes.cornerTR; // End goal
                    else {
                        // Random noise for other tiles
                        const types = Object.values(connTypes);
                        conn = types[Math.floor(Math.random() * types.length)];
                    }

                    tile.innerHTML = createPathSVG(conn);
                    gridEl.appendChild(tile);
                }
            }

            // 2. Create the Cub Token (Overlay)
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = bearSVG;
            gridEl.appendChild(cub);

            // 3. Create the Goal Marker (Overlay)
            const goal = document.createElement('div');
            goal.className = 'marker-goal';
            goal.innerHTML = starSVG;
            gridEl.appendChild(goal);

            // Initial Positions
            updateCubPosition(startPos.x, startPos.y);
            updateGoalPosition(endPos.x, endPos.y);
        }

        // --- Positioning Logic ---
        function getPosPercentage(index, total) {
            const cellSize = 100 / total;
            return (index * cellSize) + (cellSize / 2);
        }

        function updateCubPosition(x, y) {
            const cub = document.getElementById('cub');
            const top = getPosPercentage(y, GRID_SIZE);
            const left = getPosPercentage(x, GRID_SIZE);
            
            cub.style.top = `calc(${top}% - 50%)`;
            cub.style.left = `calc(${left}% - 50%)`;
            
            const cellPct = 100 / GRID_SIZE;
            // Make cub slightly larger than cell to pop
            cub.style.width = `${cellPct * 1.1}%`;
            cub.style.height = `${cellPct * 1.1}%`;
        }

        function updateGoalPosition(x, y) {
            const goal = document.querySelector('.marker-goal');
            const top = getPosPercentage(y, GRID_SIZE);
            const left = getPosPercentage(x, GRID_SIZE);
            
            goal.style.top = `calc(${top}% - 50%)`;
            goal.style.left = `calc(${left}% - 50%)`;
            
            const cellPct = 100 / GRID_SIZE;
            goal.style.width = `${cellPct}%`;
            goal.style.height = `${cellPct}%`;
        }

        // --- Interactions ---
        function resetGame() {
            updateCubPosition(startPos.x, startPos.y);
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            
            // Visual feedback: Shake board slightly
            const board = document.querySelector('.board-wrapper');
            board.style.transform = 'scale(0.98) rotate(-1deg)';
            setTimeout(() => board.style.transform = 'scale(1) rotate(0deg)', 150);
        }

        function solvePuzzle() {
            const pathCoords = [
                {x:0, y:0}, {x:1, y:0}, {x:1, y:1}, 
                {x:2, y:1}, {x:2, y:2}, {x:3, y:2}, 
                {x:3, y:3}, {x:4, y:3}, {x:4, y:4},
                {x:5, y:4}, {x:5, y:5}
            ];

            // Reset first
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
            updateCubPosition(startPos.x, startPos.y);

            let delay = 0;
            const stepTime = 250; 

            pathCoords.forEach((pos, index) => {
                setTimeout(() => {
                    const tile = document.querySelector(`.tile[data-x="${pos.x}"][data-y="${pos.y}"]`);
                    if(tile) tile.classList.add('active');
                    updateCubPosition(pos.x, pos.y);
                }, delay);
                delay += stepTime;
            });
        }

        // Start
        initGrid();

    </script>
</body>
</html>
