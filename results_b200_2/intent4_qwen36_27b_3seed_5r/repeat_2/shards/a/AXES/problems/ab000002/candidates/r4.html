<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix</title>
    <style>
        :root {
            /* Palette: Ancient Grimoire */
            --bg-deep: #050608;
            --bg-panel: #11141a;
            --bg-card: #1a1f2b;
            
            --gold-bright: #fcd34d;
            --gold-dim: #785a18;
            --gold-glow: rgba(252, 211, 77, 0.4);
            
            --purple-bright: #e9d5ff;
            --purple-dim: #581c87;
            
            --blue-bright: #93c5fd;
            --red-bright: #fca5a5;
            --grey-bright: #cbd5e1;

            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dark: #475569;

            --border-gold: rgba(252, 211, 77, 0.2);

            /* Typography */
            --font-serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-sans: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Consolas", "Monaco", monospace;

            /* Spacing & Radius - Unified System */
            --radius-md: 6px;
            --radius-lg: 12px;
            --sidebar-width: 340px;
        }

        * { box-sizing: border-box; user-select: none; outline: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar: The Stone Tablet --- */
        .sidebar {
            width: var(--sidebar-width);
            /* Textured stone look */
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            z-index: 50;
            position: relative;
            box-shadow: 10px 0 40px rgba(0,0,0,0.6);
        }

        /* Top Gold Trim */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
            opacity: 0.6;
        }

        .screen-header {
            padding: 2rem 1.5rem 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .screen-title {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            color: var(--gold-bright);
            letter-spacing: 0.05em; /* Tightened tracking */
            text-transform: uppercase;
            margin: 0;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .screen-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-sans); /* Unified font */
            letter-spacing: 0.15em;
            margin-top: 5px;
            display: block;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.7;
        }

        /* Profile Area */
        .profile-section {
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar-container {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            position: relative;
        }

        .avatar-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, var(--gold-dim), var(--gold-bright), var(--gold-dim));
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0f1115;
            border: 2px solid #1a1d27;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .avatar-img {
            width: 70%;
            height: 70%;
            fill: var(--text-muted);
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.2));
        }

        .char-info {
            flex-grow: 1;
        }

        .char-name {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--text-main);
            margin: 0;
            font-weight: 600;
        }

        .char-class {
            color: var(--gold-bright);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            margin-top: 2px;
            opacity: 0.9;
        }

        /* Stats Panel */
        .stats-panel {
            padding: 0 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Primary Status Block */
        .stat-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-md);
            padding: 1rem;
            position: relative;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .level-display {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .level-val {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--text-main);
            line-height: 1;
        }

        .xp-wrapper {
            margin-top: 0.5rem;
        }

        .xp-track {
            height: 8px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #b45309, var(--gold-bright));
            width: 65%;
            box-shadow: 0 0 8px var(--gold-glow);
            position: relative;
        }
        
        .xp-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-family: var(--font-sans); /* Unified */
            font-weight: 500;
        }

        /* Available Points (Primary Position) */
        .points-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(252, 211, 77, 0.1), rgba(0,0,0,0.2));
            border: 1px solid var(--border-gold);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .points-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .points-icon {
            width: 20px; height: 20px;
            background: var(--gold-bright);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            filter: drop-shadow(0 0 4px var(--gold-glow));
        }

        .points-label {
            font-size: 0.75rem;
            color: var(--text-main);
            text-transform: uppercase;
            font-weight: 600;
        }

        .points-val {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold-bright);
            font-family: var(--font-serif);
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #080a0f;
            /* Subtle radial vignette */
            background: radial-gradient(circle at center, #1a1f2b 0%, #050608 100%);
        }

        /* Texture Overlay - Vellum/Noise */
        .texture-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
            z-index: 10;
        }
        .canvas-container:active { cursor: grabbing; }

        canvas { display: block; }

        /* --- Controls --- */
        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 30;
            padding: 6px;
            background: rgba(0,0,0,0.4);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn {
            border: none;
            color: var(--text-muted);
            padding: 0.8rem 2rem;
            border-radius: var(--radius-md); /* Unified Radius */
            cursor: pointer;
            font-family: var(--font-sans); /* Unified Font */
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
            min-width: 140px;
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
        }

        .btn-reset:hover {
            color: var(--red-bright);
            background: rgba(248, 113, 113, 0.1);
        }

        .btn-save {
            background: linear-gradient(180deg, var(--gold-bright) 0%, #d97706 100%);
            color: #0f172a;
            box-shadow: 0 2px 10px rgba(252, 211, 77, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(252, 211, 77, 0.5);
            filter: brightness(1.1);
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-top: 1px solid var(--gold-dim);
            padding: 1rem;
            width: 260px;
            opacity: 0;
            transform: translate(15px, -50%) scale(0.95);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border-radius: var(--radius-md);
            transition: opacity 0.15s, transform 0.15s;
        }
        
        .tooltip.visible {
            opacity: 1;
            transform: translate(15px, -50%) scale(1);
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .tooltip-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .tooltip-type {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tooltip-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 0.8rem;
            font-style: italic;
        }

        .tooltip-stats {
            font-size: 0.75rem;
            color: var(--blue-bright);
            font-family: var(--font-sans); /* Unified */
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 4px;
            border-left: 2px solid var(--blue-bright);
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            z-index: 20;
            display: flex;
            gap: 1.2rem;
            background: rgba(10, 12, 18, 0.6);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(4px);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .legend-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 4px currentColor;
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="screen-header">
            <h1 class="screen-title">Skill Matrix</h1>
            <span class="screen-subtitle">Arcane Arts</span>
        </div>

        <div class="profile-section">
            <div class="avatar-container">
                <div class="avatar-ring">
                    <div class="avatar-inner">
                        <!-- Clean SVG Mage Icon -->
                        <svg class="avatar-img" viewBox="0 0 24 24">
                            <path d="M12 3L2 22h20L12 3zm0 4l6 12H6l6-12z" fill="currentColor"/>
                        </svg>
                    </div>
                </div>
                <div class="char-info">
                    <h2 class="char-name">Kaelen</h2>
                    <div class="char-class">Arcane Weaver</div>
                </div>
            </div>
        </div>

        <div class="stats-panel">
            <!-- Skill Points Elevated -->
            <div class="points-badge">
                <div class="points-info">
                    <div class="points-icon"></div>
                    <span class="points-label">Skill Points</span>
                </div>
                <span class="points-val" id="points-display">12</span>
            </div>

            <!-- Level & XP -->
            <div class="stat-card">
                <div class="stat-row">
                    <span class="stat-label">Character Level</span>
                    <div class="level-display">
                        <span class="level-val">42</span>
                    </div>
                </div>
                
                <div class="xp-wrapper">
                    <div class="xp-track">
                        <div class="xp-fill"></div>
                    </div>
                    <div class="xp-text">
                        <span>Experience</span>
                        <span>65,400 / 100,000</span>
                    </div>
                </div>
            </div>
        </div>

        <div style="font-size: 0.7rem; color: var(--text-dark); text-align: center; margin-top: auto; padding-bottom: 1.5rem;">
            Drag to pan • Scroll to zoom
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage">
        <div class="texture-overlay"></div>
        
        <!-- Legend -->
        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--gold-bright); color:var(--gold-bright)"></div> Root</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--red-bright); color:var(--red-bright)"></div> Fire</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--blue-bright); color:var(--blue-bright)"></div> Frost</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--purple-bright); color:var(--purple-bright)"></div> Arcane</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--grey-bright); color:var(--grey-bright)"></div> Defense</div>
        </div>

        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetTree()">Reset Build</button>
            <button class="btn btn-save" onclick="alert('Build Saved!')">Inscribe</button>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 0.9; // Slightly zoomed out to show scope
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        let dragStartX, dragStartY;
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Dense Skill Matrix ---
        const nodes = [
            // ROOT
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "The source of your power.", stat: "Unlocks All Paths", unlocked: true, color: "#fcd34d" },
            
            // TIER 1 (Main Branches)
            { id: 1, x: -250, y: -180, name: "Fire Affinity", type: "Passive", desc: "Inner heat.", stat: "+12% Fire Dmg", unlocked: true, color: "#fca5a5", parents: [0] },
            { id: 2, x: 0, y: -220, name: "Arcane Intellect", type: "Passive", desc: "Sharpen mind.", stat: "+10 Int", unlocked: true, color: "#e9d5ff", parents: [0] },
            { id: 3, x: 250, y: -180, name: "Frost Touch", type: "Passive", desc: "Chill the air.", stat: "Slow 15%", unlocked: true, color: "#93c5fd", parents: [0] },
            { id: 4, x: 0, y: 220, name: "Mental Fortitude", type: "Defense", desc: "Harden mind.", stat: "-15% Dmg Taken", unlocked: true, color: "#cbd5e1", parents: [0] },

            // TIER 2 (Fire)
            { id: 5, x: -420, y: -320, name: "Combustion", type: "Active", desc: "Burning trails.", stat: "Ignite +5%", unlocked: false, color: "#fca5a5", parents: [1] },
            { id: 6, x: -200, y: -320, name: "Fireball Mstr", type: "Passive", desc: "Perfect form.", stat: "+25% Cast Spd", unlocked: false, color: "#fca5a5", parents: [1] },
            { id: 20, x: -300, y: -100, name: "Heat Wave", type: "Active", desc: "Push enemies.", stat: "+15% Knockback", unlocked: false, color: "#fca5a5", parents: [1] },

            // TIER 2 (Arcane)
            { id: 7, x: -80, y: -380, name: "Mana Siphon", type: "Active", desc: "Feed on mana.", stat: "Heal Mana", unlocked: false, color: "#e9d5ff", parents: [2] },
            { id: 8, x: 80, y: -380, name: "Telekinesis", type: "Active", desc: "Move objects.", stat: "+10% Knockback", unlocked: false, color: "#e9d5ff", parents: [2] },
            { id: 21, x: 0, y: -300, name: "Spell Echo", type: "Passive", desc: "Double cast.", stat: "10% Chance", unlocked: false, color: "#e9d5ff", parents: [2] },

            // TIER 2 (Frost)
            { id: 9, x: 200, y: -320, name: "Deep Freeze", type: "Passive", desc: "Paralyzing cold.", stat: "Max Slow 50%", unlocked: false, color: "#93c5fd", parents: [3] },
            { id: 10, x: 420, y: -320, name: "Ice Armor", type: "Defense", desc: "Frost shield.", stat: "+20% Shield", unlocked: false, color: "#93c5fd", parents: [3] },
            { id: 22, x: 300, y: -100, name: "Cryokinesis", type: "Active", desc: "Ice shards.", stat: "Piercing Dmg", unlocked: false, color: "#93c5fd", parents: [3] },

            // TIER 2 (Defense)
            { id: 11, x: -180, y: 380, name: "Shield Wall", type: "Defense", desc: "Force barrier.", stat: "+300 Mana", unlocked: false, color: "#cbd5e1", parents: [4] },
            { id: 12, x: 180, y: 380, name: "Evasion", type: "Defense", desc: "Step aside.", stat: "+8% Dodge", unlocked: false, color: "#cbd5e1", parents: [4] },
            { id: 23, x: 0, y: 300, name: "Recovery", type: "Passive", desc: "Regenerate.", stat: "+5% HP/Sec", unlocked: false, color: "#cbd5e1", parents: [4] },

            // TIER 3 (Ultimates)
            { id: 13, x: -420, y: -500, name: "INFERNO", type: "Ultimate", desc: "Eternal flame.", stat: "Massive Area Dmg", unlocked: false, color: "#fca5a5", parents: [5] },
            { id: 14, x: 0, y: -550, name: "ARCHMAGE", type: "Ultimate", desc: "Transcend limits.", stat: "+15% All Stats", unlocked: false, color: "#e9d5ff", parents: [7, 8] },
            { id: 15, x: 420, y: -500, name: "GLACIAL STORM", type: "Ultimate", desc: "Endless blizzard.", stat: "Heavy Slow", unlocked: false, color: "#93c5fd", parents: [9] },
            { id: 16, x: 0, y: 550, name: "IMMORTALITY", type: "Ultimate", desc: "Cheat death.", stat: "1 Charge: 0 Dmg", unlocked: false, color: "#cbd5e1", parents: [11, 12] },
            
            // Filler nodes for density
            { id: 17, x: -350, y: 150, name: "Resilience", type: "Passive", desc: "Tougher skin.", stat: "+5% Armor", unlocked: false, color: "#cbd5e1", parents: [0] },
            { id: 18, x: 350, y: 150, name: "Haste", type: "Passive", desc: "Quick movements.", stat: "+5% Move Spd", unlocked: false, color: "#cbd5e1", parents: [0] },
            { id: 19, x: 0, y: 100, name: "Clarity", type: "Passive", desc: "Focus mind.", stat: "-5% Mana Cost", unlocked: false, color: "#e9d5ff", parents: [0] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            offsetX = width / 2;
            offsetY = height / 2; 
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // 1. Draw Connections (Ley Lines)
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // 2. Draw Nodes
            // Draw locked first (bottom layer), then unlocked (top layer)
            nodes.filter(n => !n.unlocked).forEach(drawNode);
            nodes.filter(n => n.unlocked).forEach(drawNode);
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isParentUnlocked = parent.unlocked;
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Organic Bezier Curve
            const midY = (pPos.y + cPos.y) / 2;
            const randomX = (Math.sin(pPos.x + cPos.x) * 20) * scale;
            
            ctx.bezierCurveTo(pPos.x + randomX, midY, cPos.x + randomX, midY, cPos.x, cPos.y);
            
            ctx.lineCap = 'round';
            
            // Gradient Line
            const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
            
            if (isPathUnlocked) {
                // Active: Solid, glowing, thicker
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, child.color);
                ctx.lineWidth = 3 * scale;
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 10;
                ctx.shadowColor = child.color;
                ctx.setLineDash([]);
            } else if (isParentUnlocked) {
                // Available: Dashed, fading
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, 'rgba(30, 41, 59, 0.5)');
                ctx.lineWidth = 1.5 * scale;
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 0;
                ctx.setLineDash([5 * scale, 5 * scale]);
            } else {
                // Locked: Dark, thin, dashed
                ctx.lineWidth = 1 * scale;
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.2)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([3 * scale, 6 * scale]);
            }
            
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            const isUlt = node.type === 'Ultimate';
            const isRoot = node.type === 'Root';
            const baseSize = (isUlt ? 42 : (isRoot ? 38 : 28)) * scale;
            const radius = baseSize;
            
            // 1. Outer Glow (if unlocked) - Controlled intensity
            if (node.unlocked) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = node.color;
            } else {
                ctx.shadowBlur = 0;
            }

            // 2. Artifact Ring (Stone feel)
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius + (6 * scale), 0, Math.PI * 2);
            ctx.fillStyle = '#0a0c10';
            ctx.fill();
            
            // 3. Inner Core Gradient
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            
            const grad = ctx.createRadialGradient(pos.x, pos.y, radius * 0.2, pos.x, pos.y, radius);
            if (node.unlocked) {
                grad.addColorStop(0, lightenColor(node.color, 40));
                grad.addColorStop(0.8, node.color);
                grad.addColorStop(1, darkenColor(node.color, 20));
            } else {
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 4. Border
            ctx.lineWidth = 2 * scale;
            ctx.strokeStyle = node.unlocked ? 'rgba(255,255,255,0.8)' : '#334155';
            ctx.stroke();
            
            // 5. Rune Icon
            ctx.fillStyle = node.unlocked ? '#fff' : '#475569';
            ctx.shadowBlur = node.unlocked ? 5 : 0;
            ctx.shadowColor = '#fff';
            
            drawRuneIcon(ctx, pos.x, pos.y, radius * 0.5, node.id);

            // 6. Hover State
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 12, 0, Math.PI * 2);
                ctx.strokeStyle = node.unlocked ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 7. Labels
            if (isRoot || isUlt || hoveredNode === node) {
                const fontSize = 13 * scale;
                ctx.font = `bold ${fontSize}px "Segoe UI", sans-serif`;
                ctx.textAlign = 'center';
                const text = node.name;
                const metrics = ctx.measureText(text);
                const textWidth = metrics.width;
                
                const labelY = pos.y + radius + (25 * scale);
                
                // Text Background Pill
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                const pillHeight = fontSize + 10;
                const pillWidth = textWidth + 20;
                const pillX = pos.x - pillWidth/2;
                const pillY = labelY - fontSize + 4;
                
                ctx.beginPath();
                ctx.roundRect(pillX, pillY, pillWidth, pillHeight, 4);
                ctx.fill();
                
                // Text
                ctx.fillStyle = node.unlocked ? '#f1f5f9' : '#64748b';
                ctx.shadowBlur = 4;
                ctx.shadowColor = 'black';
                ctx.fillText(text, pos.x, labelY);
            }
            ctx.shadowBlur = 0;
        }

        // Helper: Draw distinct rune shapes (Unified stroke width)
        function drawRuneIcon(context, x, y, size, id) {
            context.beginPath();
            context.lineWidth = 2; // Unified stroke weight
            const type = id % 5;
            
            if (type === 0) { // Diamond
                context.moveTo(x, y - size);
                context.lineTo(x + size, y);
                context.lineTo(x, y + size);
                context.lineTo(x - size, y);
            } else if (type === 1) { // Circle
                context.arc(x, y, size * 0.7, 0, Math.PI * 2);
            } else if (type === 2) { // Triangle
                context.moveTo(x, y - size);
                context.lineTo(x + size, y + size);
                context.lineTo(x - size, y + size);
            } else if (type === 3) { // Cross
                context.moveTo(x - size, y);
                context.lineTo(x + size, y);
                context.moveTo(x, y - size);
                context.lineTo(x, y + size);
                context.stroke();
                context.lineWidth = 1; 
                return; 
            } else { // Hexagon-ish
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    const px = x + size * Math.cos(angle);
                    const py = y + size * Math.sin(angle);
                    if (i===0) context.moveTo(px, py);
                    else context.lineTo(px, py);
                }
            }
            context.closePath();
            context.fill();
        }

        // Helper: Lighten hex color
        function lightenColor(col, amt) {
            let usePound = false;
            if (col[0] == "#") {
                col = col.slice(1);
                usePound = true;
            }
            let num = parseInt(col,16);
            let r = (num >> 16) + amt;
            if (r > 255) r = 255; else if  (r < 0) r = 0;
            let b = ((num >> 8) & 0x00FF) + amt;
            if (b > 255) b = 255; else if  (b < 0) b = 0;
            let g = (num & 0x0000FF) + amt;
            if (g > 255) g = 255; else if (g < 0) g = 0;
            return (usePound?"#":"") + (g | (b << 8) | (r << 16)).toString(16);
        }

        function darkenColor(col, amt) {
            return lightenColor(col, -amt);
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            ttType.style.color = node.unlocked ? node.color : '#64748b';

            // Smart positioning
            let left = mouseX + 25;
            let top = mouseY - 40;
            
            if (left + 300 > width) left = mouseX - 320;
            if (top < 0) top = 10;
            if (top + 150 > height) top = height - 160;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' ? 42 : 30);
                
                if (dist < hitRadius) {
                    if (node.unlocked) {
                        // Logic to remove skill could go here
                    } else {
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' ? 42 : 30) + 5;
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'grab';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            dragStartX = lastMouseX;
            dragStartY = lastMouseY;
            isDragging = true;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                const rect = canvas.getBoundingClientRect();
                const dist = Math.sqrt(Math.pow(e.clientX - rect.left - dragStartX, 2) + Math.pow(e.clientY - rect.top - dragStartY, 2));
                if (dist < 5) {
                     checkClick(lastMouseX, lastMouseY);
                }
                isDragging = false;
                canvas.style.cursor = 'grab';
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;

            if (e.deltaY < 0) scale *= (1 + zoomIntensity);
            else scale *= (1 - zoomIntensity);

            scale = Math.min(Math.max(0.4, scale), 2.5);

            offsetX = mouseX - wx * scale;
            offsetY = mouseY - wy * scale;

            draw();
        });
        
        window.resetTree = function() {
            nodes.forEach(n => { if (n.id !== 0) n.unlocked = false; });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
