<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Skill Matrix</title>
    <style>
        :root {
            --bg-dark: #050608;
            --bg-panel: #12141a;
            --bg-card: #1c1f2b;
            --accent-gold: #ffd700;
            --accent-gold-dim: #b8860b;
            --accent-blue: #60a5fa;
            --accent-red: #f87171;
            --accent-purple: #c084fc;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-gold: rgba(212, 175, 55, 0.3);
            --border-dark: #2d3748;
            
            --font-serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 340px;
            background: radial-gradient(circle at top right, #1a1d27, #0f1115);
            border-right: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            padding: 2.5rem 2rem;
            box-shadow: 10px 0 40px rgba(0,0,0,0.8);
            z-index: 20;
            position: relative;
        }

        /* Decorative border top */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-gold-dim), transparent 20%, transparent 80%, var(--accent-gold-dim));
            padding: 3px;
            margin: 0 auto 1.2rem;
            position: relative;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
            border-radius: 50%;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #0f1115;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--text-muted);
            /* SVG Icon inline */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>');
            background-size: 50%;
            background-repeat: no-repeat;
            background-position: center;
            border: 1px solid var(--border-dark);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.02em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .class-title {
            color: var(--accent-gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 0.3rem;
            font-weight: 700;
            opacity: 0.9;
        }

        /* --- Unified Stats Panel --- */
        .stats-container {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            padding: 1.5rem;
            position: relative;
            margin-bottom: 2rem;
        }
        
        /* Corner accents */
        .stats-container::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--accent-gold-dim);
            border-right: 2px solid var(--accent-gold-dim);
            border-radius: 0 0 8px 0;
        }
        .stats-container::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 20px; height: 20px;
            border-top: 2px solid var(--accent-gold-dim);
            border-left: 2px solid var(--accent-gold-dim);
            border-radius: 8px 0 0 0;
        }

        .level-display {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .level-label {
            font-family: var(--font-serif);
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .level-number {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .xp-container {
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .xp-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-track {
            height: 8px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a701e, var(--accent-gold));
            width: 65%;
            box-shadow: 0 0 15px var(--accent-gold-dim);
            position: relative;
        }

        .points-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .points-label {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .points-icon {
            width: 12px; height: 12px;
            background: var(--accent-purple);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-purple);
        }

        .points-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            font-family: var(--font-serif);
            /* Reduced contrast from original cyan */
        }

        /* --- Main Canvas Area --- */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #0a0c12;
            /* Subtle radial vignette */
            background-image: radial-gradient(circle at center, #151922 0%, #050608 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Tooltip --- */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(15, 20, 30, 0.98), rgba(10, 12, 18, 0.98));
            border: 1px solid var(--accent-gold);
            padding: 1.2rem;
            border-radius: 2px;
            width: 280px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translate(15px, -50%) scale(0.95);
            z-index: 100;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }
        
        .tooltip::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            pointer-events: none;
        }

        .tooltip.visible {
            opacity: 1;
            transform: translate(15px, -50%) scale(1);
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 0.5rem;
        }

        .tooltip-title {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .tooltip-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(0,0,0,0.3);
            padding: 3px 8px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 0.1em;
        }

        .tooltip-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 0.8rem;
            font-style: italic;
        }

        .tooltip-stats {
            font-size: 0.8rem;
            color: var(--accent-blue);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- Footer Controls --- */
        .controls {
            position: absolute;
            bottom: 2.5rem;
            right: 2.5rem;
            display: flex;
            gap: 1rem;
            z-index: 30;
        }

        .btn {
            background: rgba(20, 24, 35, 0.8);
            border: 1px solid var(--border-dark);
            color: var(--text-muted);
            padding: 0.9rem 1.8rem;
            border-radius: 2px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-1px);
            color: var(--text-main);
        }

        /* Reset Button */
        .btn-reset:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.05);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
        }

        /* Save Button - Elevated */
        .btn-save {
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.1) 0%, rgba(0,0,0,0) 100%);
        }

        .btn-save:hover {
            border-color: var(--accent-gold);
            color: #fff;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            text-shadow: 0 0 5px var(--accent-gold);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="profile-header">
            <div class="avatar-ring">
                <div class="avatar-inner"></div>
            </div>
            <h1>Kaelen</h1>
            <div class="class-title">Arcane Weaver</div>
        </div>

        <!-- Unified Stats Panel -->
        <div class="stats-container">
            <div class="level-display">
                <span class="level-label">Character Level</span>
                <span class="level-number">42</span>
            </div>
            
            <div class="xp-container">
                <div class="xp-label">
                    <span>Experience</span>
                    <span>65,400 / 100,000</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div class="points-section">
                <span class="points-label">
                    <span class="points-icon"></span>
                    Skill Points
                </span>
                <span class="points-value" id="points-display">12</span>
            </div>
        </div>

        <div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: auto; opacity: 0.6;">
            Drag to pan • Scroll to zoom
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-stage">
        <div class="canvas-container" id="canvas-container">
            <canvas id="skill-tree"></canvas>
        </div>

        <!-- Floating Tooltip -->
        <div class="tooltip" id="tooltip">
            <div class="tooltip-header">
                <span class="tooltip-title" id="tt-title">Node Name</span>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <div class="tooltip-desc" id="tt-desc">
                Description goes here.
            </div>
            <div class="tooltip-stats" id="tt-stats">
                +10% Damage
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetTree()">Reset Tree</button>
            <button class="btn btn-save" onclick="alert('Build Saved!')">Save Build</button>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('skill-tree');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        let width, height;
        let scale = 1.1; // Start slightly zoomed in
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        let dragStartX, dragStartY; // To distinguish click from drag
        
        let availablePoints = 12;
        let hoveredNode = null;
        
        // --- Data: The Skill Tree ---
        // Adjusted layout for better flow
        const nodes = [
            // Root
            { id: 0, x: 0, y: 0, name: "Arcane Focus", type: "Root", desc: "The source of your power. Unlocks all magic paths.", stat: "Unlocks Tree", unlocked: true, color: "#ffd700" },
            
            // Left Branch: Destruction (Red)
            { id: 1, x: -220, y: -180, name: "Fire Affinity", type: "Passive", desc: "Your soul burns with inner heat.", stat: "+12% Fire Dmg", unlocked: false, color: "#f87171", parents: [0] },
            { id: 2, x: -220, y: -360, name: "Combustion", type: "Active", desc: "Spells leave burning trails.", stat: "Ignite Chance +5%", unlocked: false, color: "#f87171", parents: [1] },
            { id: 3, x: -440, y: -270, name: "Inferno", type: "Ultimate", desc: "Summon a pillar of eternal flame.", stat: "Massive Area Dmg", unlocked: false, color: "#f87171", parents: [2] },
            { id: 4, x: -100, y: -270, name: "Fireball Mastery", type: "Passive", desc: "Perfect your casting form.", stat: "+25% Cast Speed", unlocked: false, color: "#f87171", parents: [1] },

            // Right Branch: Ice (Blue)
            { id: 5, x: 220, y: -180, name: "Frost Touch", type: "Passive", desc: "Your presence chills the air.", stat: "Slow Enemies 15%", unlocked: false, color: "#60a5fa", parents: [0] },
            { id: 6, x: 220, y: -360, name: "Deep Freeze", type: "Passive", desc: "Cold becomes paralyzing.", stat: "Max Slow 50%", unlocked: false, color: "#60a5fa", parents: [5] },
            { id: 7, x: 440, y: -270, name: "Glacial Storm", type: "Ultimate", desc: "An endless blizzard follows you.", stat: "Heavy Slow & Dmg", unlocked: false, color: "#60a5fa", parents: [6] },
            { id: 8, x: 100, y: -270, name: "Ice Armor", type: "Defensive", desc: "Manifest a shield of frost.", stat: "+20% Shield", unlocked: false, color: "#60a5fa", parents: [5] },

            // Center Branch: Utility/Summoning (Purple)
            { id: 9, x: 0, y: -220, name: "Arcane Intellect", type: "Passive", desc: "Sharpen your mind.", stat: "+10 Intelligence", unlocked: false, color: "#c084fc", parents: [0] },
            { id: 10, x: 0, y: -400, name: "Mana Siphon", type: "Active", desc: "Feed on the mana of foes.", stat: "Heal Mana on Hit", unlocked: false, color: "#c084fc", parents: [9] },
            { id: 11, x: 0, y: -580, name: "Archmage", type: "Trait", desc: "Transcend mortal limits.", stat: "+15% All Stats", unlocked: false, color: "#c084fc", parents: [10] },

            // Bottom Branch: Defense (Grey/Blue)
            { id: 12, x: 0, y: 200, name: "Mental Fortitude", type: "Defense", desc: "Harden your mind against intrusion.", stat: "-15% Dmg Taken", unlocked: false, color: "#94a3b8", parents: [0] },
            { id: 13, x: -180, y: 350, name: "Shield Wall", type: "Defense", desc: "Create a barrier of force.", stat: "+300 Max Mana", unlocked: false, color: "#94a3b8", parents: [12] },
            { id: 14, x: 180, y: 350, name: "Evasion", type: "Defense", desc: "Step between the cracks of reality.", stat: "+8% Dodge", unlocked: false, color: "#94a3b8", parents: [12] },
        ];

        // --- Core Functions ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            offsetX = width / 2;
            offsetY = height / 2 - 100; // Shift up slightly to show root
            draw();
        }

        function getWorldPos(node) {
            return {
                x: node.x * scale + offsetX,
                y: node.y * scale + offsetY
            };
        }

        function draw() {
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Background Connections (Ley Lines)
            nodes.forEach(node => {
                if (node.parents) {
                    node.parents.forEach(pId => {
                        const parent = nodes.find(n => n.id === pId);
                        drawConnection(parent, node);
                    });
                }
            });

            // Draw Nodes
            // Draw locked nodes first so unlocked ones can overlap slightly if needed
            nodes.filter(n => !n.unlocked).forEach(drawNode);
            nodes.filter(n => n.unlocked).forEach(drawNode);
        }

        function drawConnection(parent, child) {
            const pPos = getWorldPos(parent);
            const cPos = getWorldPos(child);
            
            const isPathUnlocked = parent.unlocked && child.unlocked;
            const isParentUnlocked = parent.unlocked; // Path is "active" if parent is active
            
            ctx.beginPath();
            ctx.moveTo(pPos.x, pPos.y);
            
            // Bezier curve for organic flow
            const midY = (pPos.y + cPos.y) / 2;
            ctx.bezierCurveTo(pPos.x, midY, cPos.x, midY, cPos.x, cPos.y);
            
            ctx.lineCap = 'round';
            
            // Gradient line
            const grad = ctx.createLinearGradient(pPos.x, pPos.y, cPos.x, cPos.y);
            
            if (isPathUnlocked) {
                // Glowing active path
                grad.addColorStop(0, parent.color);
                grad.addColorStop(1, child.color);
                ctx.lineWidth = 4 * scale;
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 15;
                ctx.shadowColor = child.color;
            } else if (isParentUnlocked) {
                // Available path (Parent is active, child is locked)
                // Fades out towards the locked node
                grad.addColorStop(0, parent.color);
                grad.addColorStop(0.7, child.color);
                grad.addColorStop(1, 'rgba(30, 41, 59, 0.5)');
                ctx.lineWidth = 2 * scale;
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 0;
                // Dashed line for available
                ctx.setLineDash([5 * scale, 5 * scale]);
            } else {
                // Locked path
                ctx.lineWidth = 1 * scale;
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.3)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
            }
            
            ctx.stroke();
            ctx.setLineDash([]); // Reset
            ctx.shadowBlur = 0; // Reset
        }

        function drawNode(node) {
            const pos = getWorldPos(node);
            // Size based on type
            const baseSize = (node.type === 'Ultimate' ? 32 : (node.type === 'Root' ? 36 : 24)) * scale;
            const radius = baseSize;
            
            // 1. Glow Layer
            if (node.unlocked) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = node.color;
            } else {
                ctx.shadowBlur = 0;
            }

            // 2. Outer Ring (Stone/Metal)
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius + (4 * scale), 0, Math.PI * 2);
            ctx.fillStyle = '#0f1115';
            ctx.fill();
            
            // 3. Inner Core
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            
            // Fill gradient
            const grad = ctx.createRadialGradient(pos.x, pos.y, radius * 0.2, pos.x, pos.y, radius);
            if (node.unlocked) {
                grad.addColorStop(0, node.color);
                grad.addColorStop(1, adjustColor(node.color, -40)); // Darker version
            } else {
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 4. Stroke
            ctx.lineWidth = 2 * scale;
            ctx.strokeStyle = node.unlocked ? '#fff' : '#334155';
            ctx.stroke();
            
            // 5. Iconography (Simplified rune shapes)
            ctx.fillStyle = node.unlocked ? '#fff' : '#475569';
            ctx.shadowBlur = node.unlocked ? 5 : 0;
            ctx.shadowColor = '#fff';
            
            // Draw a generic "rune" shape based on ID
            drawRuneIcon(ctx, pos.x, pos.y, radius * 0.5, node.id);

            // 6. Hover Effect
            if (hoveredNode === node) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 8, 0, Math.PI * 2);
                ctx.strokeStyle = node.unlocked ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 7. Label (Only for Root, Ultimate, or Hovered)
            if (node.type === 'Root' || node.type === 'Ultimate' || hoveredNode === node) {
                ctx.fillStyle = node.unlocked ? '#e2e8f0' : '#64748b';
                ctx.font = `bold ${11 * scale}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.shadowBlur = 4;
                ctx.shadowColor = 'black';
                ctx.fillText(node.name, pos.x, pos.y + radius + (18 * scale));
            }
            ctx.shadowBlur = 0;
        }

        // Helper to draw simple rune shapes
        function drawRuneIcon(context, x, y, size, id) {
            context.beginPath();
            if (id % 3 === 0) {
                // Diamond
                context.moveTo(x, y - size);
                context.lineTo(x + size, y);
                context.lineTo(x, y + size);
                context.lineTo(x - size, y);
            } else if (id % 3 === 1) {
                // Circle
                context.arc(x, y, size * 0.7, 0, Math.PI * 2);
            } else {
                // Triangle
                context.moveTo(x, y - size);
                context.lineTo(x + size, y + size);
                context.lineTo(x - size, y + size);
            }
            context.closePath();
            context.fill();
        }

        // Helper to darken color for gradients
        function adjustColor(color, amount) {
            return color; // Simplified for this demo, usually involves hex math
        }

        // --- Interaction ---

        function updateTooltip(node, mouseX, mouseY) {
            const ttTitle = document.getElementById('tt-title');
            const ttType = document.getElementById('tt-type');
            const ttDesc = document.getElementById('tt-desc');
            const ttStats = document.getElementById('tt-stats');

            ttTitle.textContent = node.name;
            ttType.textContent = node.type;
            ttDesc.textContent = node.desc;
            ttStats.textContent = node.stat;
            
            // Colorize type
            ttType.style.color = node.unlocked ? node.color : '#64748b';
            ttType.style.borderColor = node.unlocked ? node.color : 'transparent';

            // Position tooltip
            let left = mouseX + 20;
            let top = mouseY - 50;
            
            // Keep within bounds
            if (left + 280 > width) left = mouseX - 300;
            if (top < 0) top = 10;
            if (top + 150 > height) top = height - 160;

            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${top}px`;
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function checkClick(mouseX, mouseY) {
            // Reverse transform to get world coordinates
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            
            // Check collision
            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const hitRadius = (node.type === 'Ultimate' ? 32 : 24) * scale + 5; // Slightly larger hit area
                
                if (dist < hitRadius / scale) { // Normalize dist to scale 1
                    if (node.unlocked) {
                        // Could add logic to remove skill
                    } else {
                        // Check parents
                        const parentsUnlocked = node.parents.every(pId => nodes.find(n => n.id === pId).unlocked);
                        if (parentsUnlocked && availablePoints > 0) {
                            node.unlocked = true;
                            availablePoints--;
                            document.getElementById('points-display').textContent = availablePoints;
                            draw();
                        } else if (availablePoints === 0) {
                            // Visual feedback for no points?
                            console.log("No points");
                        }
                    }
                    return;
                }
            }
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const dx = mouseX - lastMouseX;
                const dy = mouseY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
                draw();
                return;
            }

            // Hover detection
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;
            let found = null;

            for (let node of nodes) {
                const dx = wx - node.x;
                const dy = wy - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const hitRadius = (node.type === 'Ultimate' ? 32 : 24) + 5; // Padding
                
                if (dist < hitRadius) {
                    found = node;
                    break;
                }
            }

            if (found) {
                canvas.style.cursor = 'pointer';
                if (hoveredNode !== found) {
                    hoveredNode = found;
                    draw();
                    updateTooltip(found, mouseX, mouseY);
                }
            } else {
                canvas.style.cursor = 'default';
                if (hoveredNode) {
                    hoveredNode = null;
                    draw();
                    hideTooltip();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMouseX = e.clientX - rect.left;
            lastMouseY = e.clientY - rect.top;
            dragStartX = lastMouseX;
            dragStartY = lastMouseY;
            isDragging = true;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                // Check if it was a click (minimal movement)
                const dist = Math.sqrt(Math.pow(e.clientX - rect.left - dragStartX, 2) + Math.pow(e.clientY - rect.top - dragStartY, 2));
                if (dist < 5) {
                     checkClick(lastMouseX, lastMouseY);
                }
                
                isDragging = false;
                canvas.style.cursor = 'grab';
            }
        });

        // Zoom logic
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Calculate world pos before zoom
            const wx = (mouseX - offsetX) / scale;
            const wy = (mouseY - offsetY) / scale;

            if (e.deltaY < 0) {
                scale *= (1 + zoomIntensity);
            } else {
                scale *= (1 - zoomIntensity);
            }

            // Clamp zoom
            scale = Math.min(Math.max(0.5, scale), 2);

            // Adjust offset to keep mouse over same world point
            offsetX = mouseX - wx * scale;
            offsetY = mouseY - wy * scale;

            draw();
        });
        
        // Reset Logic
        window.resetTree = function() {
            nodes.forEach(n => {
                if (n.id !== 0) n.unlocked = false;
            });
            availablePoints = 12;
            document.getElementById('points-display').textContent = availablePoints;
            draw();
        };

        // --- Init ---
        resize();

    </script>
</body>
</html>
