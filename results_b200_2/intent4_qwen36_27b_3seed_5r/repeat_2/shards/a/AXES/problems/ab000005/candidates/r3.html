<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Premium Clean</title>
    <style>
        :root {
            /* Palette: Warm, Earthy, Textured */
            --bg-wall: #EAE0D5;
            --bg-wall-dark: #D6C5B4;
            --text-main: #2D241E;
            --text-muted: #5C4D42;
            --accent: #B85C38; /* Deep Terracotta */
            --accent-hover: #9E4B2B;
            --card-bg: rgba(245, 240, 235, 0.92);
            --shadow-soft: 0 20px 50px rgba(45, 36, 30, 0.15);
            --shadow-sharp: 0 8px 20px rgba(45, 36, 30, 0.1);
            --wood-light: #D8C3A5;
            --wood-dark: #C2A686;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Layout --- */
        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-main);
        }

        .brand-dot {
            width: 14px;
            height: 14px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(184, 92, 56, 0.15);
        }

        .nav-links span {
            margin-left: 2.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .nav-links span:hover { opacity: 1; }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            perspective: 1000px;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-wall) 0%, var(--bg-wall-dark) 100%);
        }

        /* --- The Floor (Perspective & Texture) --- */
        .floor {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 120%;
            height: 60%;
            background-color: var(--wood-light);
            /* Planks */
            background-image: 
                repeating-linear-gradient(90deg, 
                    transparent 0px, 
                    transparent 140px, 
                    rgba(0,0,0,0.08) 140px, 
                    rgba(0,0,0,0.08) 144px
                );
            /* Wood Grain Texture Overlay */
            background-size: 100% 100%, 100% 100%;
            transform: rotateX(35deg) translateY(50px);
            transform-origin: center bottom;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.2);
            z-index: 1;
        }

        /* Floor Vignette for depth */
        .floor::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 20%, transparent 40%, rgba(45, 36, 30, 0.15) 100%);
            pointer-events: none;
        }

        /* --- SVG Scene Layer --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }

        /* --- UI Overlay (Top Left - Hierarchy Fix) --- */
        .ui-panel {
            position: absolute;
            top: 2rem;
            left: 3rem;
            z-index: 20;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            max-width: 320px;
            border: 1px solid rgba(255,255,255,0.6);
            animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes floatUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .ui-panel h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.1;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }

        .ui-panel p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        /* Reset Button - Solid Style for Contrast */
        .btn {
            background-color: var(--text-main);
            color: #fff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(45, 36, 30, 0.2);
        }

        .btn:hover {
            background-color: #000;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(45, 36, 30, 0.25);
        }
        
        .btn:active {
            transform: translateY(1px);
        }

        /* --- Interaction & Animation Classes --- */
        .interactive-zone {
            pointer-events: auto;
            cursor: grab;
            /* Subtle rotation for natural feel */
            transform-origin: 0 260px; 
        }
        .interactive-zone:active {
            cursor: grabbing;
        }

        .cleaned-spill {
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            opacity: 1;
            transform: scale(1);
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .water-mark {
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .spill-glow {
            animation: pulse 4s infinite ease-in-out;
            transform-origin: center;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }

        /* Floating Animation for Mop when idle */
        @keyframes floatMop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <div class="floor"></div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Filter: Realistic Drop Shadow -->
                <filter id="realistic-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="15" dy="30" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Filter: Wet Blur -->
                <filter id="wet-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="1.5" />
                </filter>

                <!-- Gradient: Coffee/Mud Spill -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#3E2723;stop-opacity:0.95" />
                    <stop offset="100%" style="stop-color:#281812;stop-opacity:0.8" />
                </radialGradient>

                <!-- Gradient: Mop Head (Fibrous) -->
                <radialGradient id="mop-fiber" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#E8E8E8;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
                </radialGradient>
                
                <!-- Gradient: Handle (Brushed Metal) -->
                <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#999;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#FFF;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#DDD;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#888;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Primary Focal Point) -->
            <!-- Center-Left Position -->
            <g id="spill-group" class="cleaned-spill" transform="translate(400, 460)">
                
                <!-- Ambient Glow -->
                <ellipse cx="0" cy="20" rx="140" ry="70" fill="rgba(62, 39, 35, 0.15)" class="spill-glow" filter="blur(15px)" />

                <!-- The Main Puddle (Organic Shape) -->
                <path d="M0,0 C-50,-40 -140,10 -150,60 C-160,110 -60,140 20,130 C100,120 160,70 140,20 C120,-30 50,-20 0,0 Z" 
                      fill="url(#spill-grad)" />
                
                <!-- Inner Darker Core -->
                <path d="M0,0 C-40,-20 -100,20 -110,50 C-120,80 -50,100 10,90 C70,80 120,50 100,20 C80,-10 40,-10 0,0 Z" 
                      fill="rgba(40, 25, 20, 0.6)" filter="url(#wet-blur)" />
                
                <!-- Splatters (Drips) -->
                <circle cx="-160" cy="40" r="8" fill="#3E2723" opacity="0.9" />
                <circle cx="-175" cy="55" r="4" fill="#3E2723" opacity="0.8" />
                <circle cx="130" cy="30" r="10" fill="#3E2723" opacity="0.9" />
                <circle cx="145" cy="50" r="5" fill="#3E2723" opacity="0.8" />
                <ellipse cx="100" cy="-10" rx="15" ry="8" fill="#3E2723" opacity="0.8" transform="rotate(-20 100 -10)" />
                <ellipse cx="-80" cy="-20" rx="8" ry="4" fill="#3E2723" opacity="0.8" transform="rotate(40 -80 -20)" />
                
                <!-- Specular Highlights (Wetness) -->
                <ellipse cx="-40" cy="30" rx="40" ry="18" fill="rgba(255,255,255,0.2)" transform="rotate(-15 -40 30)" filter="blur(2px)" />
                <ellipse cx="30" cy="60" rx="15" ry="6" fill="rgba(255,255,255,0.15)" transform="rotate(10 30 60)" />
                <!-- Sharp Highlight -->
                <path d="M-20,40 Q0,30 15,45" stroke="rgba(255,255,255,0.6)" stroke-width="3" fill="none" stroke-linecap="round" filter="blur(0.5px)"/>
            </g>

            <!-- 2. The Mop (Dynamic, Textured, Wet) -->
            <!-- Positioned Right, Angled for Action -->
            <g id="mop-group" class="interactive-zone" transform="translate(650, 80)" filter="url(#realistic-shadow)">
                
                <!-- Handle -->
                <rect x="-10" y="0" width="20" height="500" rx="10" fill="url(#metal-grad)" />
                
                <!-- Rubber Grip -->
                <rect x="-12" y="80" width="24" height="150" rx="8" fill="#2D241E" />
                <!-- Grip Texture Lines -->
                <g stroke="#4A3B31" stroke-width="3" opacity="0.5">
                    <line x1="-12" y1="100" x2="12" y2="100" />
                    <line x1="-12" y1="120" x2="12" y2="120" />
                    <line x1="-12" y1="140" x2="12" y2="140" />
                    <line x1="-12" y1="160" x2="12" y2="160" />
                    <line x1="-12" y1="180" x2="12" y2="180" />
                    <line x1="-12" y1="200" x2="12" y2="200" />
                    <line x1="-12" y1="220" x2="12" y2="220" />
                </g>

                <!-- Metal Connector -->
                <path d="M-10,230 L10,230 L18,265 L-18,265 Z" fill="#E0E0E0" />
                <rect x="-18" y="265" width="36" height="12" fill="#333" rx="3" />

                <!-- Mop Head (The Fibers) -->
                <g id="mop-head" transform="translate(0, 270)">
                    <!-- Base Shadow -->
                    <ellipse cx="0" cy="50" rx="80" ry="40" fill="#8B7355" opacity="0.4" filter="blur(5px)" />
                    
                    <!-- Main Cloth Shape -->
                    <path d="M-75,10 C-75,60 -50,90 0,90 C50,90 75,60 75,10 C75,-10 0,-10 0,-10 C0,-10 -75,-10 -75,10 Z" 
                          fill="url(#mop-fiber)" />
                    
                    <!-- Fiber Texture (Wavy Lines) -->
                    <g stroke="#AAA" stroke-width="1.5" fill="none" opacity="0.5">
                        <path d="M-60,0 Q-40,50 -20,75" />
                        <path d="M-40,0 Q-20,60 0,85" />
                        <path d="M-20,0 Q0,60 20,85" />
                        <path d="M0,0 Q20,60 40,85" />
                        <path d="M20,0 Q40,60 60,75" />
                        <path d="M40,0 Q60,50 70,30" />
                        <path d="M-70,20 Q-50,60 -30,80" />
                        <path d="M70,20 Q50,60 30,80" />
                    </g>
                    
                    <!-- CRITICAL FIX: Wetness on Mop -->
                    <!-- Darkened patch indicating saturation -->
                    <ellipse cx="0" cy="60" rx="55" ry="25" fill="#3E2723" opacity="0.15" filter="blur(4px)" />
                    <!-- Slightly darker strands -->
                    <path d="M-30,50 Q0,70 30,50" stroke="#888" stroke-width="2" fill="none" opacity="0.4" />
                </g>
            </g>

            <!-- 3. Water Marks (After cleaning) -->
            <g id="water-marks" transform="translate(400, 460)">
                <!-- A lighter sheen where the spill was -->
                <path d="M0,0 C-50,-40 -140,10 -150,60 C-160,110 -60,140 20,130 C100,120 160,70 140,20 C120,-30 50,-20 0,0 Z" 
                      class="water-mark" fill="rgba(255,255,255,0.15)" filter="blur(3px)" />
                <!-- Specular shine on clean spot -->
                <ellipse cx="-30" cy="30" rx="40" ry="20" fill="rgba(255,255,255,0.4)" transform="rotate(-15 -30 30)" class="water-mark" filter="blur(1px)"/>
            </g>

        </svg>

        <!-- UI Panel (Top Left - Anchored) -->
        <div class="ui-panel">
            <h1>Deep Clean Tech</h1>
            <p>Drag the mop over the spill to clean the floor. Our microfiber technology traps dirt instantly.</p>
            <button class="btn" id="reset-btn">
                <span>&#8635;</span> Reset Scene
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            // Initial coordinates matching SVG transform
            let initialMopX = 650;
            let initialMopY = 80;
            
            let isCleaned = false;

            // Mouse/Touch Events
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if(isCleaned) return;
                isDragging = true;
                // Stop idle animation when grabbed
                mopGroup.style.animation = 'none';
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                const currentTransform = mopGroup.getAttribute('transform');
                const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (match) {
                    let curX = parseFloat(match[1]);
                    let curY = parseFloat(match[2]);
                    mopGroup.setAttribute('transform', `translate(${curX + deltaX}, ${curY + deltaY})`);
                }

                checkCollision();
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
                if(!isCleaned) {
                    // Resume idle animation
                    mopGroup.style.animation = 'floatMop 3s infinite ease-in-out';
                }
            }

            function checkCollision() {
                const mopTransform = mopGroup.getAttribute('transform');
                const match = mopTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (!match) return;
                
                // Mop head is approx 270px down from group origin
                const mopHeadX = parseFloat(match[1]);
                const mopHeadY = parseFloat(match[2]) + 270 + 45; 

                // Spill center is approx 400, 460
                const spillX = 400;
                const spillY = 490;

                // Distance check (radius approx 130px for satisfying overlap)
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                if (dist < 130) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Clean Action
                spillGroup.classList.add('hidden');
                
                // 2. Show Water Marks
                setTimeout(() => {
                    waterMarks.style.opacity = '1';
                }, 300);

                // 3. Button Feedback
                resetBtn.innerHTML = "<span>&#10003;</span> Spotless! Reset";
                resetBtn.style.backgroundColor = "#2D241E";
                
                // 4. Move mop slightly away to reveal
                const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                if(match) {
                    mopGroup.setAttribute('transform', `translate(${parseFloat(match[1]) + 40}, ${parseFloat(match[2]) + 20})`);
                }
            }

            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY})`);
                spillGroup.classList.remove('hidden');
                waterMarks.style.opacity = '0';
                resetBtn.innerHTML = "<span>&#8635;</span> Reset Scene";
                resetBtn.style.backgroundColor = "var(--text-main)";
                mopGroup.style.animation = 'floatMop 3s infinite ease-in-out';
            });

            // Start idle animation
            mopGroup.style.animation = 'floatMop 3s infinite ease-in-out';
        });
    </script>
</body>
</html>
