<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Premium Clean</title>
    <style>
        :root {
            /* Warm, Coherent Palette */
            --bg-wall: #F2EBE5;
            --wall-accent: #E3D8CA;
            --text-main: #3D3229;
            --text-muted: #6D5E52;
            --accent: #C05636; /* Terracotta */
            --accent-hover: #A04025;
            --card-bg: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 12px 40px rgba(61, 50, 41, 0.08);
            --shadow-sharp: 0 4px 12px rgba(61, 50, 41, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Subtle noise texture for wall */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* --- Layout & Hierarchy --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-main);
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(192, 86, 54, 0.2);
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .nav-links span:hover { opacity: 1; }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end; /* Align floor to bottom */
            justify-content: center;
            perspective: 1200px;
            overflow: hidden;
        }

        /* --- The Floor (Textured Wood) --- */
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55%;
            /* Warm Wood Gradient Base */
            background-color: #C6B29C;
            background-image: 
                /* Wood Planks - Vertical separation */
                repeating-linear-gradient(90deg, transparent, transparent 148px, rgba(0,0,0,0.06) 148px, rgba(0,0,0,0.06) 150px),
                /* Wood Grain - Horizontal flow */
                linear-gradient(180deg, rgba(0,0,0,0.03) 0%, transparent 2px, rgba(255,255,255,0.03) 4px, transparent 6px);
            background-size: 100% 100%, 100% 8px;
            box-shadow: inset 0 20px 60px rgba(0,0,0,0.15); /* Depth at horizon */
            transform-origin: bottom;
            z-index: 1;
        }

        /* Ambient Light on Floor */
        .floor::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Light source from top-left */
            background: radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.4) 0%, transparent 50%),
                        linear-gradient(180deg, rgba(0,0,0,0.1) 0%, transparent 30%);
            pointer-events: none;
        }

        /* --- SVG Scene Layer --- */
        #scene-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 5;
            pointer-events: none; 
        }

        /* --- UI Overlay (Bottom Left - Anchored) --- */
        .ui-panel {
            position: absolute;
            bottom: 2rem;
            left: 3rem;
            z-index: 20;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            max-width: 340px;
            border: 1px solid rgba(255,255,255,0.8);
            transition: transform 0.3s ease, opacity 0.3s ease;
            animation: floatUp 0.8s ease-out;
        }

        @keyframes floatUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .ui-panel h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .ui-panel p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            font-weight: 400;
        }

        /* Reset Button - Ghost Style */
        .btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(61, 50, 41, 0.15);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: rgba(61, 50, 41, 0.05);
            border-color: rgba(61, 50, 41, 0.3);
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* --- Interaction & Animation --- */
        .interactive-zone {
            pointer-events: auto;
            cursor: grab;
            transition: transform 0.1s linear; /* Smooth drag */
        }
        .interactive-zone:active {
            cursor: grabbing;
        }

        .cleaned-spill {
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: scale(1);
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .water-mark {
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
        
        /* Spill Glow Pulse */
        .spill-glow {
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <div class="floor"></div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Soft Drop Shadow for Mop (Light source Top-Left) -->
                <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
                    <feOffset dx="15" dy="25" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.12" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Liquid Gradient (Coffee/Mud) -->
                <radialGradient id="liquid-grad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#4A2C18;stop-opacity:0.95" />
                    <stop offset="60%" style="stop-color:#3D2314;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#2E1A0F;stop-opacity:0.85" />
                </radialGradient>

                <!-- Mop Head Gradient (Fibrous look) -->
                <radialGradient id="mop-head-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#F0F0F0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#C8C8C8;stop-opacity:1" />
                </radialGradient>
                
                <!-- Handle Gradient (Brushed Metal) -->
                <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#D1D1D1;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#F5F5F5;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#C0C0C0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#A8A8A8;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Complex Liquid) -->
            <!-- Positioned Center-Left -->
            <g id="spill-group" class="cleaned-spill" transform="translate(350, 450)">
                
                <!-- Outer Glow/Guidance (Visual Cue) -->
                <ellipse cx="0" cy="20" rx="120" ry="60" fill="rgba(74, 44, 24, 0.1)" class="spill-glow" filter="blur(10px)" />

                <!-- Outer Stain (Lighter, wider) -->
                <path d="M0,0 C-80,-30 -160,50 -130,100 C-100,150 60,160 120,110 C180,60 90,-30 0,0 Z" 
                      fill="rgba(60,30,10,0.15)" filter="blur(3px)" />
                
                <!-- Main Puddle Body -->
                <path d="M0,0 C-60,-20 -120,40 -100,80 C-80,120 50,140 100,90 C150,40 80,-20 0,0 Z" 
                      fill="url(#liquid-grad)" />
                
                <!-- Drips / Splatters -->
                <circle cx="-130" cy="20" r="6" fill="#4A2C18" opacity="0.8" />
                <circle cx="-140" cy="30" r="3" fill="#4A2C18" opacity="0.8" />
                <circle cx="120" cy="50" r="8" fill="#4A2C18" opacity="0.8" />
                <circle cx="135" cy="60" r="4" fill="#4A2C18" opacity="0.8" />
                <ellipse cx="90" cy="-10" rx="12" ry="6" fill="#4A2C18" opacity="0.8" transform="rotate(-20 90 -10)" />
                
                <!-- Specular Highlights (The "Wet" look - Light from Top Left) -->
                <ellipse cx="-40" cy="20" rx="35" ry="15" fill="rgba(255,255,255,0.15)" transform="rotate(-15 -40 20)" filter="blur(1px)" />
                <ellipse cx="20" cy="50" rx="15" ry="6" fill="rgba(255,255,255,0.1)" transform="rotate(10 20 50)" />
                <path d="M-20,30 Q0,20 10,30" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round" filter="blur(0.5px)"/>
            </g>

            <!-- 2. The Mop (Dynamic & Textured) -->
            <!-- Positioned Right Side -->
            <g id="mop-group" class="interactive-zone" transform="translate(750, 100)" filter="url(#soft-shadow)">
                
                <!-- Handle -->
                <rect x="-8" y="0" width="16" height="500" rx="8" fill="url(#handle-grad)" />
                
                <!-- Rubber Grip (Dark Grey, Textured) -->
                <rect x="-10" y="80" width="20" height="140" rx="6" fill="#2C2824" />
                <!-- Grip Lines -->
                <line x1="-10" y1="100" x2="10" y2="100" stroke="#3D3229" stroke-width="2" />
                <line x1="-10" y1="120" x2="10" y2="120" stroke="#3D3229" stroke-width="2" />
                <line x1="-10" y1="140" x2="10" y2="140" stroke="#3D3229" stroke-width="2" />
                <line x1="-10" y1="160" x2="10" y2="160" stroke="#3D3229" stroke-width="2" />
                <line x1="-10" y1="180" x2="10" y2="180" stroke="#3D3229" stroke-width="2" />
                <line x1="-10" y1="200" x2="10" y2="200" stroke="#3D3229" stroke-width="2" />

                <!-- Metal Connector -->
                <path d="M-8,220 L8,220 L15,250 L-15,250 Z" fill="#E0E0E0" />
                <rect x="-15" y="250" width="30" height="10" fill="#333" rx="2" />

                <!-- Mop Head (The Fibers) -->
                <g id="mop-head" transform="translate(0, 260)">
                    <!-- Base Shadow/Volume -->
                    <ellipse cx="0" cy="50" rx="90" ry="45" fill="#B0B0B0" opacity="0.5" filter="blur(4px)" />
                    
                    <!-- Main Cloth Shape -->
                    <path d="M-80,10 C-80,60 -60,90 0,90 C60,90 80,60 80,10 C80,-10 0,-10 0,-10 C0,-10 -80,-10 -80,10 Z" 
                          fill="url(#mop-head-grad)" />
                    
                    <!-- Fiber Texture (Wavy Lines) -->
                    <g stroke="#999" stroke-width="2" fill="none" opacity="0.6">
                        <path d="M-60,0 Q-40,50 -20,70" />
                        <path d="M-40,0 Q-20,60 0,80" />
                        <path d="M-20,0 Q0,60 20,80" />
                        <path d="M0,0 Q20,60 40,80" />
                        <path d="M20,0 Q40,60 60,70" />
                        <path d="M40,0 Q60,50 70,30" />
                        <path d="M-70,20 Q-50,60 -30,80" />
                        <path d="M70,20 Q50,60 30,80" />
                    </g>
                    
                    <!-- Wetness on Mop (Visual Cue) -->
                    <ellipse cx="0" cy="60" rx="50" ry="20" fill="#4A2C18" opacity="0.2" filter="blur(2px)" />
                </g>
            </g>

            <!-- 3. Water Marks (After cleaning) -->
            <g id="water-marks" transform="translate(350, 450)">
                <!-- A lighter sheen where the spill was -->
                <path d="M0,0 C-80,-30 -160,50 -130,100 C-100,150 60,160 120,110 C180,60 90,-30 0,0 Z" 
                      class="water-mark" fill="rgba(255,255,255,0.1)" filter="blur(2px)" />
                <!-- Specular shine on clean spot -->
                <ellipse cx="-40" cy="20" rx="35" ry="15" fill="rgba(255,255,255,0.3)" transform="rotate(-15 -40 20)" class="water-mark" filter="blur(1px)"/>
            </g>

        </svg>

        <!-- UI Panel (Bottom Left - Anchored) -->
        <div class="ui-panel">
            <h1>Deep Clean Tech</h1>
            <p>Drag the mop over the spill to clean the floor. Our microfiber technology traps dirt instantly.</p>
            <button class="btn" id="reset-btn">
                <span>&#8635;</span> Reset Scene
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            let initialMopX = 750;
            let initialMopY = 100;
            
            let isCleaned = false;

            // Mouse/Touch Events
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if(isCleaned) return; // Lock movement after cleaning
                isDragging = true;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                const currentTransform = mopGroup.getAttribute('transform');
                const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (match) {
                    let curX = parseFloat(match[1]);
                    let curY = parseFloat(match[2]);
                    mopGroup.setAttribute('transform', `translate(${curX + deltaX}, ${curY + deltaY})`);
                }

                checkCollision();
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
            }

            function checkCollision() {
                const mopTransform = mopGroup.getAttribute('transform');
                const match = mopTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (!match) return;
                
                // Mop head is approx 260px down from the group origin
                const mopHeadX = parseFloat(match[1]);
                const mopHeadY = parseFloat(match[2]) + 260 + 50; // +50 for head height

                // Spill center is approx 350, 450
                const spillX = 350;
                const spillY = 480;

                // Distance check (radius approx 100px)
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                if (dist < 120) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Clean Action
                spillGroup.classList.add('hidden');
                
                // 2. Show Water Marks
                setTimeout(() => {
                    waterMarks.style.opacity = '1';
                }, 300);

                // 3. Button Feedback
                resetBtn.innerHTML = "<span>&#10003;</span> Spotless! Reset";
                resetBtn.style.borderColor = "#4A7C59";
                resetBtn.style.color = "#4A7C59";
                
                // 4. Move mop away slightly to reveal
                const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                if(match) {
                    mopGroup.setAttribute('transform', `translate(${parseFloat(match[1]) + 60}, ${parseFloat(match[2]) + 30})`);
                }
            }

            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY})`);
                spillGroup.classList.remove('hidden');
                waterMarks.style.opacity = '0';
                resetBtn.innerHTML = "<span>&#8635;</span> Reset Scene";
                resetBtn.style.borderColor = "rgba(61, 50, 41, 0.15)";
                resetBtn.style.color = "var(--text-main)";
            });

            // Idle Animation
            let angle = 0;
            function animateIdle() {
                if (!isDragging && !isCleaned) {
                    angle += 0.015;
                    const yOff = Math.sin(angle) * 3;
                    const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                    if(match) {
                        // Only animate Y to simulate hovering, keep X static
                        // We need to be careful not to overwrite user drag if logic changes, 
                        // but here we check !isDragging
                        mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY + yOff})`);
                    }
                }
                requestAnimationFrame(animateIdle);
            }
            animateIdle();
        });
    </script>
</body>
</html>
