<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Clean - Interactive Scene</title>
    <style>
        :root {
            /* Palette: Warm, Rich, Organic */
            --bg-wall: #E6DCCF;
            --bg-wall-top: #D8C9B8;
            --floor-base: #CBA57D;
            --floor-dark: #A8855F;
            --text-main: #3D3026;
            --text-muted: #6D5D50;
            --accent: #C05936; /* Burnt Orange/Terracotta */
            --spill-color: #3E2723; /* Deep Coffee */
            --glass-bg: rgba(255, 250, 245, 0.75);
            --shadow-soft: 0 15px 35px rgba(61, 48, 38, 0.15);
            --shadow-sharp: 0 5px 15px rgba(61, 48, 38, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Subtle noise texture for the whole page */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }

        /* --- Layout Structure --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-main);
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .nav-links span:hover { color: var(--text-main); }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center; /* Center vertically */
            justify-content: center; /* Center horizontally */
            perspective: 1200px;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall) 40%, transparent 100%);
        }

        /* --- The Floor (3D Perspective) --- */
        .floor-plane {
            position: absolute;
            top: 40%;
            left: -50%;
            width: 200%;
            height: 80%;
            background-color: var(--floor-base);
            /* Wood Planks */
            background-image: 
                repeating-linear-gradient(90deg, 
                    transparent 0px, 
                    transparent 180px, 
                    rgba(0,0,0,0.06) 180px, 
                    rgba(0,0,0,0.06) 184px
                );
            transform: rotateX(45deg);
            transform-origin: center top;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.3);
            z-index: 1;
        }

        /* Floor Vignette & Lighting */
        .floor-plane::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 60%),
                        radial-gradient(circle at 50% 100%, transparent 20%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
        }

        /* --- SVG Scene Layer --- */
        #scene-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            /* Ensure SVG is centered */
            transform: translateY(10%); 
        }

        /* --- UI Overlay (Glassmorphism, Bottom Center) --- */
        .ui-panel {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            z-index: 20;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 1.5rem 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            gap: 2rem;
            max-width: 90%;
            width: auto;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .ui-content {
            display: flex;
            flex-direction: column;
        }

        .ui-panel h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            line-height: 1.2;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .ui-panel p {
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Button - Softer, Warm */
        .btn {
            background-color: var(--text-main);
            color: #fff;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(61, 48, 38, 0.2);
        }

        .btn:hover {
            background-color: #000;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(61, 48, 38, 0.25);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        /* --- Interaction & Animation Classes --- */
        .interactive-zone {
            pointer-events: auto;
            cursor: grab;
            /* Center the grab handle visually */
            transform-origin: 500px 300px; 
        }
        .interactive-zone:active {
            cursor: grabbing;
        }

        .cleaned-spill {
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            opacity: 1;
            transform: scale(1);
        }
        
        .cleaned-spill.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .water-mark {
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .spill-glow {
            animation: pulse 5s infinite ease-in-out;
            transform-origin: center;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.03); }
        }

        /* Floating Animation for Mop when idle */
        @keyframes floatMop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .ui-panel {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
                bottom: 2rem;
                width: 90%;
                padding: 1.5rem;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            header { padding: 1rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Spark & Scrub
        </div>
        <div class="nav-links">
            <span>Products</span>
            <span>Technology</span>
            <span>About</span>
        </div>
    </header>

    <div class="scene-container">
        <!-- The 3D Floor Plane -->
        <div class="floor-plane"></div>

        <!-- The Main Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filter: Soft Drop Shadow for Objects -->
                <filter id="realistic-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="0" dy="25" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.25" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Filter: Wet Blur -->
                <filter id="wet-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" />
                </filter>

                <!-- Gradient: Deep Coffee Spill -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#4E342E;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#3E2723;stop-opacity:0.95" />
                    <stop offset="100%" style="stop-color:#281812;stop-opacity:0.8" />
                </radialGradient>

                <!-- Gradient: Mop Head (Clean White/Grey) -->
                <radialGradient id="mop-fiber" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#EAEAEA;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
                </radialGradient>
                
                <!-- Gradient: Handle (Brushed Metal) -->
                <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#777;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#FFF;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#CCC;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#666;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Center Focal Point) -->
            <!-- Positioned exactly in the visual center of the floor area -->
            <g id="spill-group" class="cleaned-spill" transform="translate(500, 450)">
                
                <!-- Ambient Glow (Wetness reflection on floor) -->
                <ellipse cx="0" cy="20" rx="160" ry="80" fill="rgba(62, 39, 35, 0.15)" class="spill-glow" filter="blur(20px)" />

                <!-- The Main Puddle (Organic, complex shape) -->
                <path d="M0,0 C-60,-50 -160,10 -170,70 C-180,130 -70,160 20,150 C120,140 180,80 150,30 C120,-40 50,-30 0,0 Z" 
                      fill="url(#spill-grad)" />
                
                <!-- Inner Darker Core (Depth) -->
                <path d="M0,0 C-50,-30 -120,30 -130,60 C-140,90 -60,110 10,100 C90,90 140,60 120,30 C90,0 50,-20 0,0 Z" 
                      fill="rgba(20, 10, 5, 0.6)" filter="url(#wet-blur)" />
                
                <!-- Splatters (Dynamic drips) -->
                <circle cx="-180" cy="50" r="10" fill="#3E2723" opacity="0.9" />
                <circle cx="-200" cy="70" r="5" fill="#3E2723" opacity="0.8" />
                <circle cx="140" cy="40" r="12" fill="#3E2723" opacity="0.9" />
                <circle cx="160" cy="60" r="6" fill="#3E2723" opacity="0.8" />
                <ellipse cx="110" cy="-20" rx="18" ry="10" fill="#3E2723" opacity="0.8" transform="rotate(-20 110 -20)" />
                <ellipse cx="-90" cy="-30" rx="10" ry="5" fill="#3E2723" opacity="0.8" transform="rotate(40 -90 -30)" />
                
                <!-- Specular Highlights (Wet Shine) -->
                <ellipse cx="-50" cy="40" rx="50" ry="20" fill="rgba(255,255,255,0.25)" transform="rotate(-15 -50 40)" filter="blur(3px)" />
                <ellipse cx="40" cy="70" rx="20" ry="8" fill="rgba(255,255,255,0.2)" transform="rotate(10 40 70)" />
                <!-- Sharp Specular Line -->
                <path d="M-30,50 Q10,40 30,60" stroke="rgba(255,255,255,0.7)" stroke-width="4" fill="none" stroke-linecap="round" filter="blur(1px)"/>
            </g>

            <!-- 2. The Mop (High Fidelity, Centered) -->
            <!-- Starts slightly offset to invite interaction, but fully visible -->
            <g id="mop-group" class="interactive-zone" transform="translate(500, 100)" filter="url(#realistic-shadow)">
                
                <!-- Handle -->
                <rect x="-12" y="0" width="24" height="500" rx="12" fill="url(#metal-grad)" />
                
                <!-- Rubber Grip -->
                <rect x="-14" y="100" width="28" height="160" rx="10" fill="#2D241E" />
                <!-- Grip Texture -->
                <g stroke="#4A3B31" stroke-width="4" opacity="0.6">
                    <line x1="-14" y1="120" x2="14" y2="120" />
                    <line x1="-14" y1="140" x2="14" y2="140" />
                    <line x1="-14" y1="160" x2="14" y2="160" />
                    <line x1="-14" y1="180" x2="14" y2="180" />
                    <line x1="-14" y1="200" x2="14" y2="200" />
                    <line x1="-14" y1="220" x2="14" y2="220" />
                </g>

                <!-- Metal Connector -->
                <path d="M-12,260 L12,260 L22,300 L-22,300 Z" fill="#E0E0E0" />
                <rect x="-22" y="300" width="44" height="15" fill="#333" rx="4" />

                <!-- Mop Head (The Fibers) -->
                <g id="mop-head" transform="translate(0, 310)">
                    <!-- Base Shadow -->
                    <ellipse cx="0" cy="50" rx="90" ry="45" fill="#8B7355" opacity="0.5" filter="blur(8px)" />
                    
                    <!-- Main Cloth Shape -->
                    <path d="M-85,10 C-85,70 -60,100 0,100 C60,100 85,70 85,10 C85,-15 0,-15 0,-15 C0,-15 -85,-15 -85,10 Z" 
                          fill="url(#mop-fiber)" />
                    
                    <!-- Fiber Texture (Wavy Lines) -->
                    <g stroke="#CCC" stroke-width="2" fill="none" opacity="0.6">
                        <path d="M-70,0 Q-40,50 -20,80" />
                        <path d="M-40,0 Q-10,60 10,90" />
                        <path d="M-10,0 Q10,60 30,90" />
                        <path d="M20,0 Q40,60 60,80" />
                        <path d="M50,0 Q70,50 75,30" />
                        <path d="M-80,20 Q-50,60 -30,80" />
                        <path d="M80,20 Q50,60 30,80" />
                    </g>
                    
                    <!-- Wetness on Mop (Visual Cue) -->
                    <ellipse cx="0" cy="60" rx="60" ry="30" fill="#3E2723" opacity="0.1" filter="blur(5px)" />
                </g>
            </g>

            <!-- 3. Water Marks (After cleaning) -->
            <g id="water-marks" transform="translate(500, 450)">
                <!-- A lighter sheen where the spill was -->
                <path d="M0,0 C-60,-50 -160,10 -170,70 C-180,130 -70,160 20,150 C120,140 180,80 150,30 C120,-40 50,-30 0,0 Z" 
                      class="water-mark" fill="rgba(255,255,255,0.15)" filter="blur(4px)" />
                <!-- Specular shine on clean spot -->
                <ellipse cx="-40" cy="40" rx="50" ry="25" fill="rgba(255,255,255,0.5)" transform="rotate(-15 -40 40)" class="water-mark" filter="blur(2px)"/>
            </g>

        </svg>

        <!-- UI Panel (Bottom Center - Glassmorphism) -->
        <div class="ui-panel">
            <div class="ui-content">
                <h1>Deep Clean Tech</h1>
                <p>Drag the mop over the spill to clean the floor.</p>
            </div>
            <button class="btn" id="reset-btn">
                <span>&#8635;</span> Reset Scene
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            
            // Initial coordinates (Centered)
            let initialMopX = 500;
            let initialMopY = 100;
            
            let isCleaned = false;

            // Mouse/Touch Events
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if(isCleaned) return;
                isDragging = true;
                // Stop idle animation when grabbed
                mopGroup.style.animation = 'none';
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                const currentTransform = mopGroup.getAttribute('transform');
                const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (match) {
                    let curX = parseFloat(match[1]);
                    let curY = parseFloat(match[2]);
                    mopGroup.setAttribute('transform', `translate(${curX + deltaX}, ${curY + deltaY})`);
                }

                checkCollision();
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
                if(!isCleaned) {
                    // Resume idle animation
                    mopGroup.style.animation = 'floatMop 3s infinite ease-in-out';
                }
            }

            function checkCollision() {
                const mopTransform = mopGroup.getAttribute('transform');
                const match = mopTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (!match) return;
                
                // Mop head is approx 310px down from group origin + offset
                const mopHeadX = parseFloat(match[1]);
                const mopHeadY = parseFloat(match[2]) + 310 + 50; 

                // Spill center is 500, 450
                const spillX = 500;
                const spillY = 480;

                // Distance check
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                if (dist < 140) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Clean Action
                spillGroup.classList.add('hidden');
                
                // 2. Show Water Marks
                setTimeout(() => {
                    waterMarks.style.opacity = '1';
                }, 300);

                // 3. Button Feedback
                resetBtn.innerHTML = "<span>&#10003;</span> Spotless! Reset";
                resetBtn.style.backgroundColor = "#2D241E";
                
                // 4. Move mop slightly away to reveal
                const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                if(match) {
                    mopGroup.setAttribute('transform', `translate(${parseFloat(match[1]) + 60}, ${parseFloat(match[2]) + 30})`);
                }
            }

            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY})`);
                spillGroup.classList.remove('hidden');
                waterMarks.style.opacity = '0';
                resetBtn.innerHTML = "<span>&#8635;</span> Reset Scene";
                resetBtn.style.backgroundColor = "var(--text-main)";
                mopGroup.style.animation = 'floatMop 3s infinite ease-in-out';
            });

            // Start idle animation
            mopGroup.style.animation = 'floatMop 3s infinite ease-in-out';
        });
    </script>
</body>
</html>
