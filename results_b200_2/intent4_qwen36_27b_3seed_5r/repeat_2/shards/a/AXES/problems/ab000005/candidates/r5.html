<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Clean - Interactive Scene</title>
    <style>
        :root {
            /* Palette: Refined Warmth & Contrast */
            --bg-wall: #E3DCCF;
            --bg-wall-top: #D1C7B7;
            --floor-light: #C49A6C;
            --floor-dark: #9C7648;
            --floor-shadow: #5E4224;
            --text-main: #2C221A;
            --text-muted: #6B5C50;
            --accent: #B04A2A; /* Deep Terracotta */
            --spill-base: #261612; /* Dark Coffee/Wine */
            --spill-edge: #4A3026;
            --glass-bg: rgba(255, 252, 248, 0.85);
            --shadow-ui: 0 20px 40px rgba(44, 34, 26, 0.15);
            --shadow-warm: 0 10px 30px rgba(44, 34, 26, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Global Grain */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
        }

        /* --- Layout Structure --- */
        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to scene if needed */
        }
        header > div { pointer-events: auto; }

        .brand {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-main);
            background: rgba(255,255,255,0.6);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            backdrop-filter: blur(4px);
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-links span {
            margin-left: 1.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .nav-links span:hover { color: var(--accent); }

        .scene-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall) 50%, transparent 100%);
        }

        /* --- The Floor (High Fidelity Wood) --- */
        .floor-plane {
            position: absolute;
            top: 30%;
            left: -20%;
            width: 140%;
            height: 90%;
            /* Base Gradient */
            background: radial-gradient(ellipse at 50% 20%, var(--floor-light), var(--floor-dark) 60%, var(--floor-shadow) 100%);
            /* Wood Planks & Grain */
            background-image: 
                repeating-linear-gradient(90deg, 
                    rgba(0,0,0,0.02) 0px, 
                    rgba(0,0,0,0.05) 2px, 
                    rgba(255,255,255,0.03) 4px, 
                    transparent 5px, 
                    transparent 160px, 
                    rgba(0,0,0,0.4) 160px, 
                    rgba(0,0,0,0.4) 164px
                ),
                repeating-linear-gradient(180deg,
                    transparent 0px,
                    rgba(0,0,0,0.02) 100px,
                    transparent 200px
                );
            transform: rotateX(55deg);
            transform-origin: center top;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.6);
            z-index: 1;
        }

        /* Lighting Overlay on Floor */
        .floor-plane::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 30% 20%, rgba(255,255,255,0.15) 0%, transparent 40%), /* Window light */
                linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.2) 100%); /* Depth */
            pointer-events: none;
        }

        /* --- SVG Scene Layer --- */
        #scene-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            overflow: visible;
        }

        /* --- UI Overlay --- */
        .ui-panel {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 1.25rem 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-ui);
            border: 1px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            min-width: 320px;
            justify-content: space-between;
            animation: floatUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        @keyframes floatUp {
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .ui-content {
            display: flex;
            flex-direction: column;
        }

        .ui-panel h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            line-height: 1.1;
            color: var(--text-main);
        }

        .ui-panel p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn {
            background-color: #4A3B31; /* Rich Chocolate */
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(74, 59, 49, 0.3);
        }

        .btn:hover {
            background-color: #3D3026;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(74, 59, 49, 0.4);
        }
        
        /* --- Animations --- */
        .spill-glow {
            animation: breathe 4s infinite ease-in-out;
            transform-origin: center;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }

        .cleaned-spill {
            transition: opacity 1s ease-out, transform 1s ease-out;
            opacity: 1;
            transform: scale(1);
        }
        .cleaned-spill.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .water-mark {
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        /* Mop Idle Animation */
        @keyframes floatMop {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(0.5deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-panel {
                flex-direction: column;
                gap: 1rem;
                width: 90%;
                bottom: 2rem;
                text-align: center;
                align-items: center;
            }
            .btn { width: 100%; justify-content: center; }
            header { padding: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Clean & Co.
        </div>
        <div class="nav-links">
            <span>Collection</span>
            <span>Studio</span>
        </div>
    </header>

    <div class="scene-container">
        <!-- The Floor -->
        <div class="floor-plane"></div>

        <!-- The Visual Scene -->
        <svg id="scene-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Realistic Drop Shadow -->
                <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="0" dy="30" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.2" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Spill Gradients -->
                <radialGradient id="spill-grad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#3E2723;stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#281812;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#1A0F0C;stop-opacity:0.6" />
                </radialGradient>

                <!-- Mop Head Gradient (Wet Look) -->
                <radialGradient id="mop-fiber-wet" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#9E9E9E;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#757575;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#424242;stop-opacity:1" />
                </radialGradient>
                
                <!-- Handle Gradient -->
                <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#888;stop-opacity:1" />
                    <stop offset="30%" style="stop-color:#FFF;stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#DDD;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#666;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. The Spill (Central Narrative Anchor) -->
            <!-- Positioned centrally on the floor plane -->
            <g id="spill-group" class="cleaned-spill" transform="translate(500, 480)">
                
                <!-- Floor Shadow/Refraction (The mess sinks into the wood) -->
                <ellipse cx="0" cy="10" rx="180" ry="90" fill="rgba(20, 10, 5, 0.2)" filter="blur(15px)" />

                <!-- The Main Puddle (Organic Blob) -->
                <path d="M0,0 C-40,-60 -140,-20 -160,50 C-180,120 -80,160 10,140 C110,120 160,60 140,10 C120,-40 40,-40 0,0 Z" 
                      fill="url(#spill-grad)" />
                
                <!-- Inner Depth (Thick Liquid) -->
                <path d="M0,0 C-30,-40 -100,-10 -120,40 C-130,80 -60,110 0,90 C70,70 120,30 100,10 C80,-20 30,-20 0,0 Z" 
                      fill="rgba(10, 5, 2, 0.7)" />
                
                <!-- Dynamic Splatters -->
                <circle cx="-170" cy="60" r="12" fill="#3E2723" opacity="0.8" />
                <circle cx="-190" cy="80" r="6" fill="#3E2723" opacity="0.7" />
                <circle cx="130" cy="50" r="15" fill="#3E2723" opacity="0.8" />
                <circle cx="150" cy="70" r="8" fill="#3E2723" opacity="0.7" />
                <ellipse cx="100" cy="-20" rx="20" ry="8" fill="#3E2723" opacity="0.8" transform="rotate(-20 100 -20)" />
                
                <!-- Specular Highlights (Wetness) -->
                <ellipse cx="-40" cy="30" rx="60" ry="25" fill="rgba(255,255,255,0.2)" transform="rotate(-15 -40 30)" filter="blur(2px)" />
                <ellipse cx="30" cy="60" rx="25" ry="10" fill="rgba(255,255,255,0.15)" transform="rotate(10 30 60)" />
                <!-- Sharp Reflection Line -->
                <path d="M-20,40 Q20,30 40,50" stroke="rgba(255,255,255,0.6)" stroke-width="3" fill="none" stroke-linecap="round" filter="blur(0.5px)"/>
            </g>

            <!-- 2. The Mop (High Fidelity, Visible) -->
            <!-- Positioned to the side, inviting the user to move it -->
            <g id="mop-group" transform="translate(350, 150)" filter="url(#soft-shadow)">
                
                <!-- Handle -->
                <rect x="-10" y="0" width="20" height="500" rx="10" fill="url(#metal-grad)" />
                
                <!-- Rubber Grip -->
                <rect x="-12" y="120" width="24" height="180" rx="8" fill="#2D241E" />
                <!-- Grip Texture -->
                <g stroke="#4A3B31" stroke-width="3" opacity="0.5">
                    <line x1="-12" y1="140" x2="12" y2="140" />
                    <line x1="-12" y1="160" x2="12" y2="160" />
                    <line x1="-12" y1="180" x2="12" y2="180" />
                    <line x1="-12" y1="200" x2="12" y2="200" />
                    <line x1="-12" y1="220" x2="12" y2="220" />
                    <line x1="-12" y1="240" x2="12" y2="240" />
                    <line x1="-12" y1="260" x2="12" y2="260" />
                    <line x1="-12" y1="280" x2="12" y2="280" />
                </g>

                <!-- Metal Connector -->
                <path d="M-10,300 L10,300 L20,340 L-20,340 Z" fill="#E0E0E0" />
                <rect x="-20" y="340" width="40" height="12" fill="#333" rx="3" />

                <!-- Mop Head (Wet, Heavy) -->
                <g id="mop-head" transform="translate(0, 350)">
                    <!-- Base Shadow -->
                    <ellipse cx="0" cy="60" rx="100" ry="50" fill="#3E2723" opacity="0.4" filter="blur(10px)" />
                    
                    <!-- Main Cloth Shape -->
                    <path d="M-90,20 C-90,80 -60,120 0,120 C60,120 90,80 90,20 C90,-10 0,-10 0,-10 C0,-10 -90,-10 -90,20 Z" 
                          fill="url(#mop-fiber-wet)" />
                    
                    <!-- Fiber Texture (Wavy Lines) -->
                    <g stroke="#555" stroke-width="2" fill="none" opacity="0.4">
                        <path d="M-70,0 Q-40,70 -20,100" />
                        <path d="M-40,0 Q-10,80 10,110" />
                        <path d="M-10,0 Q10,80 30,110" />
                        <path d="M20,0 Q40,80 60,100" />
                        <path d="M50,0 Q70,70 75,40" />
                    </g>
                    
                    <!-- Wetness Sheen on Mop -->
                    <ellipse cx="0" cy="70" rx="70" ry="35" fill="#3E2723" opacity="0.3" filter="blur(6px)" />
                    <!-- Highlight on Wet Mop -->
                    <ellipse cx="-20" cy="60" rx="30" ry="15" fill="rgba(255,255,255,0.15)" transform="rotate(-10 -20 60)" />
                </g>
            </g>

            <!-- 3. Water Marks (After cleaning) -->
            <g id="water-marks" transform="translate(500, 480)">
                <!-- Residue Sheen -->
                <path d="M0,0 C-40,-60 -140,-20 -160,50 C-180,120 -80,160 10,140 C110,120 160,60 140,10 C120,-40 40,-40 0,0 Z" 
                      class="water-mark" fill="rgba(255,255,255,0.1)" filter="blur(2px)" />
                <!-- Specular shine on clean spot -->
                <ellipse cx="-30" cy="30" rx="40" ry="20" fill="rgba(255,255,255,0.6)" transform="rotate(-15 -30 30)" class="water-mark" filter="blur(1px)"/>
            </g>

        </svg>

        <!-- UI Panel -->
        <div class="ui-panel">
            <div class="ui-content">
                <h1>Interactive Clean</h1>
                <p>Drag the mop to remove the spill.</p>
            </div>
            <button class="btn" id="reset-btn">
                <span>&#8635;</span> Reset
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const spillGroup = document.getElementById('spill-group');
            const waterMarks = document.querySelector('.water-mark');
            const resetBtn = document.getElementById('reset-btn');
            
            let isDragging = false;
            let startX, startY;
            
            // Initial coordinates (Offset to left, inviting interaction)
            let initialMopX = 350;
            let initialMopY = 150;
            
            let isCleaned = false;

            // Mouse/Touch Events
            mopGroup.addEventListener('mousedown', startDrag);
            mopGroup.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            function startDrag(e) {
                if(isCleaned) return;
                isDragging = true;
                mopGroup.style.animation = 'none'; // Stop idle
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                document.body.style.cursor = 'grabbing';
            }

            function drag(e) {
                if (!isDragging || isCleaned) return;
                e.preventDefault();

                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                const currentTransform = mopGroup.getAttribute('transform');
                const match = currentTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (match) {
                    let curX = parseFloat(match[1]);
                    let curY = parseFloat(match[2]);
                    mopGroup.setAttribute('transform', `translate(${curX + deltaX}, ${curY + deltaY})`);
                }

                checkCollision();
                startX = clientX;
                startY = clientY;
            }

            function endDrag() {
                isDragging = false;
                document.body.style.cursor = 'default';
                if(!isCleaned) {
                    mopGroup.style.animation = 'floatMop 4s infinite ease-in-out';
                }
            }

            function checkCollision() {
                const mopTransform = mopGroup.getAttribute('transform');
                const match = mopTransform.match(/translate\(([^,]+),\s*([^)]+)\)/);
                
                if (!match) return;
                
                // Mop head is approx 350px down from group origin + offset
                const mopHeadX = parseFloat(match[1]);
                const mopHeadY = parseFloat(match[2]) + 350 + 60; 

                // Spill center is 500, 480
                const spillX = 500;
                const spillY = 510;

                // Distance check
                const dist = Math.sqrt(Math.pow(mopHeadX - spillX, 2) + Math.pow(mopHeadY - spillY, 2));

                if (dist < 150) {
                    cleanUp();
                }
            }

            function cleanUp() {
                if(isCleaned) return;
                isCleaned = true;
                
                // 1. Clean Action
                spillGroup.classList.add('hidden');
                
                // 2. Show Water Marks
                setTimeout(() => {
                    waterMarks.style.opacity = '1';
                }, 400);

                // 3. Button Feedback
                resetBtn.innerHTML = "<span>&#10003;</span> Done";
                resetBtn.style.backgroundColor = "#2C221A";
                
                // 4. Move mop slightly away to reveal
                const match = mopGroup.getAttribute('transform').match(/translate\(([^,]+),\s*([^)]+)\)/);
                if(match) {
                    mopGroup.setAttribute('transform', `translate(${parseFloat(match[1]) + 80}, ${parseFloat(match[2]) + 40})`);
                }
            }

            resetBtn.addEventListener('click', () => {
                isCleaned = false;
                mopGroup.setAttribute('transform', `translate(${initialMopX}, ${initialMopY})`);
                spillGroup.classList.remove('hidden');
                waterMarks.style.opacity = '0';
                resetBtn.innerHTML = "<span>&#8635;</span> Reset";
                resetBtn.style.backgroundColor = "#4A3B31";
                mopGroup.style.animation = 'floatMop 4s infinite ease-in-out';
            });

            // Start idle animation
            mopGroup.style.animation = 'floatMop 4s infinite ease-in-out';
        });
    </script>
</body>
</html>
