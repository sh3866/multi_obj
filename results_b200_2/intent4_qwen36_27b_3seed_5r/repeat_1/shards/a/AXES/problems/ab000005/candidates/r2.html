<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | The Art of Clean</title>
    <style>
        :root {
            --wood-dark: #3e2723;
            --wood-light: #5d4037;
            --accent-gold: #ffb74d;
            --accent-gold-hover: #ffcc80;
            --text-primary: #fff8e1;
            --text-secondary: #d7ccc8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #1a100c;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none; /* Hide default cursor for immersion */
        }

        /* Layout Container */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #2c1e16;
            overflow: hidden;
        }

        /* Canvas Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Remove the heavy dark vignette, rely on canvas lighting */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            background: var(--accent-gold);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-gold);
        }

        .hero-text {
            max-width: 500px;
            pointer-events: none; /* Let clicks pass through to canvas */
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 5rem;
            line-height: 0.95;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            text-shadow: 0 4px 30px rgba(0,0,0,0.8);
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--accent-gold);
            font-style: normal; /* Per critique: remove aggressive italic */
            display: block;
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            max-width: 400px;
        }

        /* Reset Button: Ghost style to reduce visual weight */
        .btn {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-1px);
        }

        .footer-info {
            display: flex;
            gap: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
                justify-content: flex-end;
            }
            h1 {
                font-size: 3.5rem;
            }
            .hero-text {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-icon"></div>
                    Spotless
                </div>
                <div class="brand" style="opacity: 0.8; font-size: 0.85rem; font-weight: 500;">
                    Interactive Experience
                </div>
            </header>

            <div class="hero-text">
                <h1>Restore the<br><span>Natural Glow.</span></h1>
                <p class="description">
                    Grab the mop and drag it across the surface. 
                    Watch the light reflect off the polished grain as you clear the mess.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset Scene</a>
            </div>

            <div class="footer-info">
                <span>Procedural Grain</span>
                <span>Fluid Dynamics</span>
                <span>Real-time Lighting</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE: HIGH-FIDELITY WOOD & LIQUID
         * Focus: Warm lighting, realistic textures, and satisfying interaction.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0, active: false };
        let lastMouse = { x: 0, y: 0 };
        let mopAngle = 0;
        
        // Configuration
        const config = {
            woodBase: '#5d4037',
            woodDark: '#3e2723',
            woodLight: '#795548',
            spillColor: '#2a1b16', // Very dark brown
            spillHighlight: '#6d4c41', // Lighter brown
            cleanSheen: 0.25, 
            lightSource: { x: 0.2, y: 0.2 } // Top-left light source
        };

        // State
        let messParticles = [];
        let floorPattern = null;
        let cleanMaskCanvas = document.createElement('canvas');
        let cleanCtx = cleanMaskCanvas.getContext('2d');
        let woodGrainCanvas = document.createElement('canvas'); // Pre-rendered heavy grain
        let woodGrainCtx = woodGrainCanvas.getContext('2d');

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Reset clean mask
            cleanMaskCanvas.width = width;
            cleanMaskCanvas.height = height;
            cleanCtx.globalCompositeOperation = 'source-over';
            cleanCtx.clearRect(0,0,width,height);

            createWoodTexture();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- PROCEDURAL TEXTURES ---

        function createWoodTexture() {
            // Create a high-res texture map
            woodGrainCanvas.width = 1024;
            woodGrainCanvas.height = 1024;
            
            // 1. Base
            woodGrainCtx.fillStyle = config.woodBase;
            woodGrainCtx.fillRect(0, 0, 1024, 1024);

            // 2. Planks
            const plankWidth = 256;
            for(let i=0; i<4; i++) {
                // Plank color variation
                const brightness = Math.random() * 20 - 10;
                woodGrainCtx.fillStyle = `rgba(${brightness > 0 ? 255 : 0}, ${brightness > 0 ? 255 : 0}, ${brightness > 0 ? 255 : 0}, ${Math.abs(brightness)/100})`;
                woodGrainCtx.fillRect(i * plankWidth, 0, plankWidth, 1024);

                // Vertical Grain
                for (let j = 0; j < 20; j++) {
                    woodGrainCtx.beginPath();
                    woodGrainCtx.strokeStyle = Math.random() > 0.5 ? config.woodDark : config.woodLight;
                    woodGrainCtx.lineWidth = Math.random() * 3 + 1;
                    woodGrainCtx.globalAlpha = 0.1 + Math.random() * 0.2;
                    
                    let x = (i * plankWidth) + Math.random() * plankWidth;
                    woodGrainCtx.moveTo(x, 0);
                    for(let y=0; y<1024; y+=50) {
                        x += (Math.random() - 0.5) * 20;
                        woodGrainCtx.lineTo(x, y);
                    }
                    woodGrainCtx.stroke();
                }

                // Plank Gap (Shadow)
                woodGrainCtx.globalAlpha = 0.8;
                woodGrainCtx.fillStyle = '#1a0f0a';
                woodGrainCtx.fillRect(i * plankWidth, 0, 4, 1024);
                
                // Plank Highlight (Bevel)
                woodGrainCtx.fillStyle = 'rgba(255,255,255,0.1)';
                woodGrainCtx.fillRect((i * plankWidth) + 4, 0, 2, 1024);
            }
            woodGrainCtx.globalAlpha = 1.0;

            // 3. Noise/Grain Overlay
            const imgData = woodGrainCtx.getImageData(0,0, 1024, 1024);
            for(let i=0; i<imgData.data.length; i+=4) {
                const noise = (Math.random() - 0.5) * 15;
                imgData.data[i] += noise;
                imgData.data[i+1] += noise;
                imgData.data[i+2] += noise;
            }
            woodGrainCtx.putImageData(imgData, 0, 0);

            floorPattern = ctx.createPattern(woodGrainCanvas, 'repeat');
        }

        function spawnMess() {
            messParticles = [];
            // Place mess slightly off-center to the right to balance the UI text on left
            const centerX = width * 0.7;
            const centerY = height * 0.5;

            // Create an organic blob shape using overlapping circles
            const blobPoints = [];
            const blobCount = 15;
            
            for (let i = 0; i < blobCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                // Elongated shape
                const dist = Math.random() * (Math.min(width, height) * 0.12);
                blobPoints.push({
                    x: centerX + Math.cos(angle) * dist * 1.2,
                    y: centerY + Math.sin(angle) * dist * 0.8,
                    r: Math.random() * 60 + 50
                });
            }

            // 1. Main Puddle (Viscous Dark Liquid)
            blobPoints.forEach(p => {
                messParticles.push({
                    x: p.x, y: p.y, r: p.r, 
                    type: 'body', 
                    alpha: 1, 
                    color: config.spillColor
                });
            });

            // 2. Viscous Rim (Lighter edge)
            blobPoints.forEach(p => {
                messParticles.push({
                    x: p.x + (Math.random()*10-5), y: p.y + (Math.random()*10-5), r: p.r * 0.6, 
                    type: 'rim', 
                    alpha: 0.8, 
                    color: config.spillHighlight
                });
            });

            // 3. Splatters
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.2) + 120;
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    r: Math.random() * 6 + 2,
                    type: 'drop',
                    alpha: 1,
                    color: config.spillColor
                });
            }
            
            // Reset Clean Mask
            cleanCtx.clearRect(0, 0, width, height);
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            // 1. Draw Wood Texture
            if (floorPattern) {
                ctx.fillStyle = floorPattern;
                ctx.fillRect(0, 0, width, height);
            }

            // 2. Lighting / Vignette (Warmer, "Golden Hour" feel)
            // Center light
            const grad = ctx.createRadialGradient(width/2, height/2, height * 0.2, width/2, height/2, width * 0.8);
            grad.addColorStop(0, 'rgba(255, 220, 180, 0.1)'); // Warm center
            grad.addColorStop(0.6, 'rgba(0, 0, 0, 0.2)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0.7)'); // Dark edges
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 3. Draw "Clean" Sheen (The result of wiping)
            // The clean mask canvas stores white where we wiped.
            // We draw a glossy gradient, then use the mask to composite it.
            if (width > 0 && height > 0) {
                ctx.save();
                
                // Create a glossy reflection effect on the canvas
                const glossGrad = ctx.createLinearGradient(0, 0, width, height);
                glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                glossGrad.addColorStop(0.4, `rgba(255, 255, 255, ${config.cleanSheen})`);
                glossGrad.addColorStop(0.6, `rgba(255, 255, 255, ${config.cleanSheen})`);
                glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.fillStyle = glossGrad;
                ctx.fillRect(0, 0, width, height);
                
                // Masking: Only show the gloss where we have wiped
                // We use 'destination-in' to keep the gloss ONLY where the cleanMask has pixels
                // But wait, cleanMask is empty (transparent) initially. 
                // Actually, let's flip logic: cleanMask has white pixels where cleaned.
                // We want to show the gloss ONLY on top of the white pixels.
                
                // Strategy: Draw gloss to a temp canvas, then composite with mask?
                // Simpler: The cleanMaskCanvas contains the "wiped" areas.
                // We want to tint the floor in those areas.
                
                ctx.globalCompositeOperation = 'source-in'; // Keep source (gloss) where dest (mask) is opaque
                // But the mask is empty initially.
                // Let's draw the gloss, then composite with the mask.
                
                // Actually, simpler approach:
                // Draw the gloss rect.
                // Then use destination-in with the cleanMask.
                
                // Wait, if cleanMask is transparent initially, nothing shows. Correct.
                // As we draw white on cleanMask, gloss shows.
                
                ctx.drawImage(cleanMaskCanvas, 0, 0); // This applies the mask to the gloss rect drawn above
                
                ctx.restore();
            }
        }

        function drawMess() {
            // Sort particles? Not strictly necessary for circles, but helps layering if we had rects.
            
            messParticles.forEach(p => {
                if (p.alpha <= 0.01) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                
                // 1. Shadow for depth (liquid sitting on floor)
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 5;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                
                ctx.beginPath();
                ctx.arc(0, 0, p.r, 0, Math.PI * 2);
                ctx.fill();

                // 2. Specular Highlight (Wetness) - Offset towards top-left light
                ctx.shadowColor = 'transparent'; // Remove shadow for highlight
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                // Ellipse for directional reflection
                // Position top-left
                const offX = -p.r * 0.25;
                const offY = -p.r * 0.25;
                ctx.ellipse(offX, offY, p.r * 0.4, p.r * 0.25, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Calculate velocity for dynamic tilt
            const speed = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
            // Tilt based on direction
            const targetAngle = Math.atan2(mouse.vy, mouse.vx);
            
            // Smooth rotation
            mopAngle += (targetAngle - mopAngle) * 0.15;
            
            // Scale effect (Squash/Stretch)
            const targetScale = 1 + Math.min(speed * 0.005, 0.15);
            // Simple lerp for scale
            // We'll apply scale in rotation matrix context later if needed, but simple scale works
            
            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle + Math.PI/2); // +90deg to align handle with movement vector

            // --- MOP CONSTRUCTION ---

            // 1. Handle (Wood + Metal)
            // Shadow for the whole mop to lift it off the floor
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 15;
            ctx.shadowOffsetY = 15;

            // Handle Body (Wood)
            const handleGrad = ctx.createLinearGradient(-10, 0, 10, 0);
            handleGrad.addColorStop(0, '#4e342e');
            handleGrad.addColorStop(0.5, '#8d6e63');
            handleGrad.addColorStop(1, '#3e2723');
            ctx.fillStyle = handleGrad;
            
            ctx.beginPath();
            ctx.roundRect(-12, -350, 24, 350, 12); 
            ctx.fill();

            // Handle Highlight
            ctx.shadowColor = 'transparent'; // Reset shadow for details
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(-8, -350, 4, 350);

            // Metal Connector
            ctx.fillStyle = '#cfd8dc';
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#546e7a'; // Inner connector
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI*2);
            ctx.fill();

            // 2. Mop Head (The Pads)
            // Using a rectangular block with "wet" texture
            const headW = 140;
            const headH = 160;
            
            // Base shadow for head
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 10;

            // Draw Mop Head Background (White/Grey wet fabric)
            ctx.fillStyle = '#eceff1';
            ctx.beginPath();
            ctx.roundRect(-headW/2, 10, headW, headH, 15);
            ctx.fill();

            // Draw "Wet" Strips
            ctx.shadowColor = 'transparent';
            const stripCount = 12;
            const stripW = headW / stripCount;
            
            for(let i=0; i<stripCount; i++) {
                const sx = -headW/2 + (i * stripW);
                
                // Alternating colors for fabric texture
                ctx.fillStyle = i % 2 === 0 ? '#b0bec5' : '#cfd8dc';
                
                // Wavy strips
                ctx.beginPath();
                ctx.moveTo(sx, 10);
                ctx.lineTo(sx + stripW, 10);
                ctx.lineTo(sx + stripW, headH);
                ctx.lineTo(sx, headH);
                ctx.fill();
            }

            // Wet Sheen on Mop Head (Simulating it's soaking up liquid)
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.ellipse(-20, 40, 40, 15, -0.5, 0, Math.PI*2);
            ctx.fill();

            ctx.restore(); // End Mop
        }

        // --- INTERACTION LOGIC ---

        function updatePhysics() {
            if (!mouse.active) return;

            const cleanRadius = 110; // Size of the mop head effective area

            // 1. Update Clean Mask (Visual "Clean" State)
            cleanCtx.save();
            cleanCtx.globalCompositeOperation = 'source-over';
            
            // Create a soft circular brush
            const grad = cleanCtx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, cleanRadius);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            cleanCtx.fillStyle = grad;
            cleanCtx.beginPath();
            cleanCtx.arc(mouse.x, mouse.y, cleanRadius, 0, Math.PI*2);
            cleanCtx.fill();
            cleanCtx.restore();

            // 2. Remove Mess Particles
            messParticles.forEach(p => {
                if (p.alpha <= 0) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // If particle is under the mop
                if (dist < cleanRadius + p.r) {
                    // Calculate reduction based on overlap
                    const overlap = (cleanRadius + p.r) - dist;
                    // Faster cleaning in center
                    const reduction = 0.02 + (overlap * 0.002);
                    
                    p.alpha -= reduction;
                    if (p.alpha < 0) p.alpha = 0;
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Floor (Base + Clean Sheen)
            drawFloor();

            // 2. Mess (On top of floor)
            drawMess();

            // 3. Physics/Logic
            if (mouse.active) {
                updatePhysics();
            }

            // 4. Mop Tool (On top of everything)
            // Always draw mop if mouse is on screen, even if not "active" (dragging), 
            // but maybe only draw if hovering? Let's draw it always for the "cursor" feel.
            if (mouse.x > -100 && mouse.y > -100) {
                drawMop();
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            // Calculate velocity
            mouse.vx = mouse.x - lastMouse.x;
            mouse.vy = mouse.y - lastMouse.y;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
             mouse.active = false;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.vx = mouse.x - lastMouse.x;
            mouse.vy = mouse.y - lastMouse.y;
            mouse.active = true;
        }, { passive: false });
        
        window.addEventListener('touchstart', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
