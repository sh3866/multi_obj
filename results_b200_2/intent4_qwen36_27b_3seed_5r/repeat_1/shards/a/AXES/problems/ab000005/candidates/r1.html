<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | The Art of Clean</title>
    <style>
        :root {
            --bg-dark: #2c1e16;
            --text-light: #f4eadd;
            --accent-gold: #e6b450;
            --accent-hover: #ffcf70;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layout Container */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #1a100c; /* Fallback */
        }

        /* Canvas Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: none; /* Hide default cursor */
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: var(--accent-gold);
            border-radius: 4px;
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .hero-text {
            max-width: 500px;
            pointer-events: auto; /* Allow interaction with button */
        }

        h1 {
            font-size: 4.5rem;
            line-height: 1;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: var(--text-light);
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--accent-gold);
            font-style: italic;
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(244, 234, 221, 0.8);
            margin-bottom: 2.5rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            max-width: 400px;
        }

        .btn {
            pointer-events: auto;
            display: inline-block;
            padding: 16px 36px;
            background-color: var(--accent-gold);
            color: #2c1e16;
            font-weight: 700;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 180, 80, 0.4);
        }

        .footer-info {
            display: flex;
            gap: 2rem;
            font-size: 0.75rem;
            color: rgba(244, 234, 221, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
                justify-content: flex-end;
                background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 60%);
            }
            h1 {
                font-size: 3rem;
            }
            .hero-text {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-icon"></div>
                    Spotless
                </div>
                <div class="brand" style="opacity: 0.7; font-size: 0.8rem; font-weight: 400; letter-spacing: 0.05em;">
                    Interactive Experience
                </div>
            </header>

            <div class="hero-text">
                <h1>Restore the <br><span>Natural Glow.</span></h1>
                <p class="description">
                    Drag the mop across the surface to wipe away the spill. 
                    Experience the satisfying contrast between the mess and the polished grain.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset Scene</a>
            </div>

            <div class="footer-info">
                <span>Procedural Wood</span>
                <span>Fluid Simulation</span>
                <span>Real-time Rendering</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * DESIGN ENGINE: WOOD, LIQUID & CLEANING
         * Focus: Material fidelity, lighting, and interaction feedback.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
        let lastMouse = { x: 0, y: 0 };
        let mopAngle = 0;
        let mopScale = 1;
        
        // Configuration for Visuals
        const config = {
            woodBase: '#6d4c41',
            woodDark: '#3e2723',
            woodLight: '#8d6e63',
            spillColor: '#2e1c15', // Dark Coffee
            spillHighlight: '#5d4037',
            cleanSheen: 0.15, // Amount of gloss added when cleaned
        };

        // State
        let messParticles = [];
        let floorPattern = null;
        let cleanMaskCanvas = document.createElement('canvas'); // Offscreen canvas for "clean" state
        let cleanCtx = cleanMaskCanvas.getContext('2d');

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Reset clean mask
            cleanMaskCanvas.width = width;
            cleanMaskCanvas.height = height;
            cleanCtx.globalCompositeOperation = 'source-over';
            cleanCtx.fillStyle = 'rgba(0,0,0,0)'; // Start transparent
            cleanCtx.fillRect(0,0,width,height);

            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- PROCEDURAL TEXTURES ---

        function createFloorPattern() {
            const pCanvas = document.createElement('canvas');
            // Make pattern wide enough to look realistic
            pCanvas.width = 200; 
            pCanvas.height = 400;
            const pCtx = pCanvas.getContext('2d');

            // 1. Base Wood Color
            pCtx.fillStyle = config.woodBase;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // 2. Wood Grain (Perlin-ish noise simulation using curves)
            for (let i = 0; i < 30; i++) {
                pCtx.beginPath();
                pCtx.strokeStyle = Math.random() > 0.5 ? config.woodDark : config.woodLight;
                pCtx.lineWidth = Math.random() * 2 + 1;
                pCtx.globalAlpha = 0.1 + Math.random() * 0.15;
                
                // Vertical wavy lines
                let y = 0;
                pCtx.moveTo(Math.random() * pCanvas.width, 0);
                while(y < pCanvas.height) {
                    y += 10;
                    const x = (Math.random() * pCanvas.width) + (Math.sin(y * 0.05) * 20);
                    pCtx.lineTo(x, y);
                }
                pCtx.stroke();
            }

            // 3. Knots
            for(let i=0; i<3; i++) {
                const kx = Math.random() * pCanvas.width;
                const ky = Math.random() * pCanvas.height;
                const grad = pCtx.createRadialGradient(kx, ky, 0, kx, ky, 20);
                grad.addColorStop(0, config.woodDark);
                grad.addColorStop(1, 'transparent');
                pCtx.fillStyle = grad;
                pCtx.globalAlpha = 0.3;
                pCtx.beginPath();
                pCtx.arc(kx, ky, 20, 0, Math.PI*2);
                pCtx.fill();
            }

            pCtx.globalAlpha = 1.0;

            // 4. Plank Separations
            // Top and Bottom gaps
            pCtx.fillStyle = '#1a100c';
            pCtx.fillRect(0, 0, pCanvas.width, 6);
            pCtx.fillRect(0, pCanvas.height - 6, pCanvas.width, 6);

            // Highlight edge (bevel)
            pCtx.fillStyle = 'rgba(255,255,255,0.1)';
            pCtx.fillRect(0, 6, pCanvas.width, 2);
            pCtx.fillStyle = 'rgba(0,0,0,0.4)';
            pCtx.fillRect(0, pCanvas.height - 4, pCanvas.width, 2);

            floorPattern = ctx.createPattern(pCanvas, 'repeat-y');
        }

        function spawnMess() {
            messParticles = [];
            const centerX = width * 0.7;
            const centerY = height * 0.55;

            // 1. The Main Puddle (Organic Blob)
            // We use a composite of large overlapping circles for the main body
            const puddlePoints = [];
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.15);
                puddlePoints.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    r: Math.random() * 80 + 60
                });
            }

            // Add main body particles
            puddlePoints.forEach(p => {
                messParticles.push({
                    x: p.x, y: p.y, r: p.r, 
                    type: 'body', 
                    alpha: 1, 
                    color: config.spillColor
                });
            });

            // 2. The Rim (Lighter, viscous edge)
            puddlePoints.forEach(p => {
                messParticles.push({
                    x: p.x + (Math.random()*10-5), y: p.y + (Math.random()*10-5), r: p.r * 0.8, 
                    type: 'rim', 
                    alpha: 0.6, 
                    color: config.spillHighlight
                });
            });

            // 3. Splatters (Small droplets)
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.25) + 100;
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    r: Math.random() * 8 + 2,
                    type: 'drop',
                    alpha: 1,
                    color: config.spillColor
                });
            }
            
            // Reset Clean Mask
            cleanCtx.clearRect(0, 0, width, height);
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            // 1. Draw Base Wood Pattern
            if (floorPattern) {
                ctx.fillStyle = floorPattern;
                ctx.fillRect(0, 0, width, height);
            }

            // 2. Draw "Clean" Sheen (The result of wiping)
            // We draw the clean mask (which contains the wiped areas) with a glossy overlay
            if (width > 0 && height > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'source-over';
                
                // Draw the mask
                ctx.drawImage(cleanMaskCanvas, 0, 0);
                
                // Apply gloss color to the mask area
                ctx.globalCompositeOperation = 'source-atop';
                
                // Gloss Gradient
                const grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, 'rgba(255, 220, 180, 0.0)');
                grad.addColorStop(0.5, `rgba(255, 255, 255, ${config.cleanSheen})`);
                grad.addColorStop(1, 'rgba(255, 220, 180, 0.0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
                
                ctx.restore();
            }

            // 3. Vignette for mood
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            messParticles.forEach(p => {
                if (p.alpha <= 0.01) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Shadow for depth
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 4;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                
                ctx.beginPath();
                ctx.arc(0, 0, p.r, 0, Math.PI * 2);
                ctx.fill();

                // Specular Highlight (Wetness) - Offset slightly
                ctx.shadowColor = 'transparent'; // Remove shadow for highlight
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                // Ellipse for directional light reflection
                ctx.ellipse(-p.r * 0.3, -p.r * 0.3, p.r * 0.4, p.r * 0.2, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Calculate velocity for dynamic tilt
            const speed = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
            // Tilt based on direction of movement
            const targetAngle = Math.atan2(mouse.vy, mouse.vx) + Math.PI/2;
            
            // Smooth rotation
            mopAngle += (targetAngle - mopAngle) * 0.2;
            
            // Scale effect based on speed (squash and stretch)
            const targetScale = 1 + Math.min(speed * 0.005, 0.1);
            mopScale += (targetScale - mopScale) * 0.2;

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);
            ctx.scale(mopScale, 1); // Stretch along movement axis

            // --- MOP CONSTRUCTION ---

            // 1. Handle (Wood)
            ctx.save();
            ctx.translate(0, -250); // Pivot point adjustment
            
            // Shadow of handle
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 10;
            ctx.shadowOffsetY = 10;

            // Handle Body
            const handleGrad = ctx.createLinearGradient(-10, 0, 10, 0);
            handleGrad.addColorStop(0, '#5d4037');
            handleGrad.addColorStop(0.5, '#8d6e63');
            handleGrad.addColorStop(1, '#3e2723');
            ctx.fillStyle = handleGrad;
            
            ctx.beginPath();
            ctx.roundRect(-12, -300, 24, 300, 12); // Long handle
            ctx.fill();

            // Rubber Grip
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.roundRect(-14, -300, 28, 80, 6);
            ctx.fill();

            ctx.restore(); // End Handle

            // 2. Connector
            ctx.fillStyle = '#424242';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI*2);
            ctx.fill();

            // 3. Mop Head (The Pads)
            // This needs to look "wet" and messy
            const headWidth = 160;
            const headHeight = 180;
            
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 10;

            // Base Head Shape
            ctx.fillStyle = '#81d4fa'; // Wet blueish white
            ctx.beginPath();
            ctx.roundRect(-headWidth/2, 10, headWidth, headHeight, 20);
            ctx.fill();

            // Strips (Texture)
            const stripCount = 10;
            const stripW = headWidth / stripCount;
            
            for(let i=0; i<stripCount; i++) {
                const sx = -headWidth/2 + (i * stripW) + 2;
                
                ctx.fillStyle = i % 2 === 0 ? '#b3e5fc' : '#e1f5fe'; // Alternating fabric
                
                // Draw irregular strip
                ctx.beginPath();
                ctx.moveTo(sx, 10);
                // Wavy bottom
                ctx.bezierCurveTo(
                    sx + Math.random()*10, 60, 
                    sx - Math.random()*10, 120, 
                    sx + (Math.random()*6-3), headHeight
                );
                ctx.lineTo(sx + stripW - 4, headHeight);
                ctx.bezierCurveTo(
                    sx + stripW - 4 + Math.random()*10, 120, 
                    sx + stripW - 4 - Math.random()*10, 60, 
                    sx + stripW - 4, 10
                );
                ctx.fill();
            }

            // Wet sheen on mop head
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(-20, 40, 30, 10, -0.5, 0, Math.PI*2);
            ctx.fill();

            ctx.restore(); // End Mop
        }

        // --- INTERACTION LOGIC ---

        function updatePhysics() {
            const cleanRadius = 100; // Size of the mop head effective area

            // 1. Update Clean Mask (Visual "Clean" State)
            // We draw a radial gradient on the clean mask canvas to simulate a soft wipe
            cleanCtx.save();
            cleanCtx.globalCompositeOperation = 'source-over';
            
            // Create a soft circular brush
            const grad = cleanCtx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, cleanRadius);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.8, 'rgba(255, 255, 255, 0.5)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            cleanCtx.fillStyle = grad;
            cleanCtx.beginPath();
            cleanCtx.arc(mouse.x, mouse.y, cleanRadius, 0, Math.PI*2);
            cleanCtx.fill();
            cleanCtx.restore();

            // 2. Remove Mess Particles
            messParticles.forEach(p => {
                if (p.alpha <= 0) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // If particle is under the mop
                if (dist < cleanRadius + p.r) {
                    // Calculate reduction based on overlap
                    const overlap = (cleanRadius + p.r) - dist;
                    const reduction = 0.05 + (overlap * 0.001);
                    
                    p.alpha -= reduction;
                    if (p.alpha < 0) p.alpha = 0;
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Floor (Base + Clean Sheen)
            drawFloor();

            // 2. Mess (On top of floor, gets "erased" by alpha)
            drawMess();

            // 3. Physics/Logic
            if (mouse.x > 0 && mouse.y > 0) {
                updatePhysics();
            }

            // 4. Mop Tool (On top of everything)
            if (mouse.x > -100 && mouse.y > -100) {
                drawMop();
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            // Calculate velocity for dynamic tilt
            mouse.vx = mouse.x - lastMouse.x;
            mouse.vy = mouse.y - lastMouse.y;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.vx = mouse.x - lastMouse.x;
            mouse.vy = mouse.y - lastMouse.y;
        }, { passive: false });
        
        window.addEventListener('touchstart', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });


        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
