<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    /* Palette - Void/Sci-Fi Theme */
    --bg-deep: #050608;
    --bg-panel: rgba(16, 18, 24, 0.85);
    --bg-panel-glass: rgba(16, 18, 24, 0.4);
    
    --accent-gold: #d4af37;
    --accent-gold-bright: #f9e076;
    --accent-gold-dim: #5e4f1a;
    
    --accent-cyan: #00f0ff;
    --accent-cyan-dim: #004d55;
    --accent-cyan-glow: rgba(0, 240, 255, 0.4);
    
    --text-main: #e6e8ef;
    --text-muted: #7a8296;
    --text-dark: #2a2e38;
    
    --border-color: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(255, 255, 255, 0.2);

    --font-heading: 'Georgia', 'Times New Roman', serif;
    --font-ui: 'Segoe UI', 'Helvetica Neue', sans-serif;
    --font-mono: 'Courier New', monospace;

    /* Dimensions */
    --node-size: 56px;
    --sidebar-width: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Void Background */
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(20, 20, 40, 1) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(10, 10, 20, 1) 0%, transparent 40%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    width: 98vw;
    height: 96vh;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 1px var(--border-highlight);
    border-radius: 8px;
    position: relative;
    backdrop-filter: blur(10px);
    overflow: hidden;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
    border-right: 1px solid var(--border-color);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    z-index: 10;
    position: relative;
  }

  /* Decorative line for sidebar */
  .sidebar::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, var(--accent-gold-dim), transparent 50%, var(--accent-gold-dim));
  }

  .profile-header {
    text-align: center;
    margin-bottom: 1rem;
  }

  .avatar-frame {
    width: 100px;
    height: 100px;
    border: 1px solid var(--accent-gold);
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, #2a2a35, #000);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    position: relative;
  }

  /* Outer rotating ring for avatar */
  .avatar-frame::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px dashed var(--accent-gold-dim);
    animation: spin 20s linear infinite;
  }

  .avatar-frame svg {
    width: 48px;
    height: 48px;
    fill: var(--accent-gold);
    filter: drop-shadow(0 0 4px var(--accent-gold));
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    color: var(--text-main);
    letter-spacing: 1px;
    margin-bottom: 0.2rem;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .char-class {
    font-size: 0.9rem;
    color: var(--accent-gold);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }

  /* --- STATS & RESOURCES (Hierarchy Fix) --- */
  .resource-panel {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    padding: 1rem;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-color);
    border-radius: 4px;
  }

  .level-block {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }

  .lvl-label {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .level-val {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: var(--text-main);
    line-height: 1;
  }

  .xp-container {
    position: relative;
    height: 6px;
    background: #000;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
    box-shadow: 0 0 8px var(--accent-gold);
    position: relative;
  }
  
  /* Shine effect on XP bar */
  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: translateX(-100%);
    animation: shimmer 3s infinite;
  }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  /* Skill Points - Elevated & Prominent */
  .points-display {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.05), transparent);
    border: 1px solid var(--accent-cyan-dim);
    padding: 1.2rem;
    border-radius: 4px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .points-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: var(--accent-cyan);
    box-shadow: 0 0 10px var(--accent-cyan);
  }

  .points-label {
    font-size: 0.75rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 0.5rem;
    font-weight: 700;
  }

  .points-val {
    font-size: 3.5rem;
    font-family: var(--font-heading);
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 0 15px var(--accent-cyan-glow);
  }

  .points-action {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-style: italic;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, rgba(20,25,35,1) 0%, #0b0c10 100%);
  }

  /* Header Fix: Unified Bar */
  .header-bar {
    height: 70px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 2.5rem;
    justify-content: space-between;
    background: rgba(10, 10, 12, 0.6);
    backdrop-filter: blur(5px);
    z-index: 5;
  }

  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.4rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
    border-left: 3px solid var(--accent-gold);
    padding-left: 12px;
  }

  .tabs {
    display: flex;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 8px 20px;
    border-radius: 2px;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .tab:hover {
    color: var(--text-main);
  }

  .tab.active {
    background: var(--accent-gold-dim);
    color: var(--text-main);
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    border: 1px solid var(--accent-gold);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
  }
  
  .tree-viewport:active { cursor: grabbing; }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 900px;
    height: 700px;
    /* Ensure container is larger than viewport to allow panning */
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* Connection Lines - Visual Fix */
  path.connection-line {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    transition: all 0.5s ease;
  }

  /* Locked Path */
  path.connection-line.locked {
    stroke: rgba(255, 255, 255, 0.05);
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
  }

  /* Active/Unlocked Path */
  path.connection-line.active {
    stroke: var(--accent-gold);
    stroke-width: 3;
    filter: drop-shadow(0 0 5px var(--accent-gold));
  }
  
  /* Path to available node */
  path.connection-line.available-path {
    stroke: var(--accent-cyan-dim);
    stroke-dasharray: 10, 5;
    stroke-width: 2;
  }

  /* --- NODES (Standardized Geometry) --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.2);
    z-index: 10;
  }

  .node-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.4s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  /* Standardized Icon Container */
  .node-inner svg {
    width: 26px;
    height: 26px;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    transition: all 0.3s;
  }

  /* --- NODE STATES --- */

  /* 1. LOCKED: High contrast but dead */
  .node.locked .node-inner {
    border: 2px solid #3a3f4f;
    background: #0f1115;
  }
  .node.locked .node-inner svg {
    stroke: #3a3f4f;
  }

  /* 2. UNLOCKED: Glowing Gold */
  .node.unlocked .node-inner {
    border: 2px solid var(--accent-gold);
    background: radial-gradient(circle at 30% 30%, #3a2e08, #000);
    box-shadow: 0 0 20px var(--accent-gold-dim), inset 0 0 10px var(--accent-gold-dim);
  }
  .node.unlocked .node-inner svg {
    stroke: var(--accent-gold-bright);
    fill: rgba(212, 175, 55, 0.2);
    filter: drop-shadow(0 0 2px var(--accent-gold));
  }
  /* Rune texture overlay for unlocked */
  .node.unlocked .node-inner::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* 3. AVAILABLE: Pulsing Cyan */
  .node.available .node-inner {
    border: 2px solid var(--accent-cyan);
    background: radial-gradient(circle, #002a2e 0%, #000 100%);
    box-shadow: 0 0 15px var(--accent-cyan-dim);
    animation: pulse 2s infinite;
  }
  .node.available .node-inner svg {
    stroke: var(--accent-cyan);
    fill: rgba(0, 240, 255, 0.1);
  }

  /* Tooltip - Refined */
  .tooltip {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 240px;
    background: rgba(10, 12, 16, 0.95);
    border: 1px solid var(--accent-gold);
    padding: 1.2rem;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    text-align: left;
    z-index: 100;
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip::before {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(10, 12, 16, 0.95);
    border-right: 1px solid var(--accent-gold);
    border-bottom: 1px solid var(--accent-gold);
  }

  .tooltip h4 {
    color: var(--accent-gold);
    font-family: var(--font-heading);
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.5rem;
    letter-spacing: 0.5px;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: #c0c5d0;
    line-height: 1.4;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    font-size: 0.8rem;
    font-weight: 700;
    font-family: var(--font-mono);
    text-align: right;
    padding-top: 0.5rem;
    border-top: 1px dashed rgba(255,255,255,0.1);
  }
  
  .cost.locked { color: #555; }
  .cost.available { color: var(--accent-cyan); }
  .cost.unlocked { color: var(--accent-gold); }

  /* Animations */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.3); }
    50% { box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  /* Corner Accents */
  .corner {
    position: absolute;
    width: 15px;
    height: 15px;
    border: 2px solid var(--accent-gold-dim);
    z-index: 5;
    pointer-events: none;
  }
  .tl { top: 15px; left: 15px; border-right: 0; border-bottom: 0; }
  .tr { top: 15px; right: 15px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 15px; left: 15px; border-right: 0; border-top: 0; }
  .br { bottom: 15px; right: 15px; border-left: 0; border-top: 0; }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <!-- Simple SVG Knight Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <!-- Unified Resource Panel -->
    <div class="resource-panel">
      <div class="level-block">
        <span class="lvl-label">LEVEL</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>

    <!-- Prominent Skill Points -->
    <div class="points-display">
      <div class="points-label">Available Skill Points</div>
      <div class="points-val" id="sp-display">3</div>
      <div class="points-action">Invest in the Matrix</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <!-- Decorative Corners -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 90, name: "Void Core", desc: "The center of your power. Unlocks all abilities.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 20, y: 70, name: "Shadow Step", desc: "Teleport short distances instantly.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 80, y: 70, name: "Arcane Blast", desc: "Fire a concentrated bolt of energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 50, name: "Entropy", desc: "Drain life force from enemies to heal self.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 10, y: 50, name: "Phase Shift", desc: "Become intangible to physical attacks.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 90, y: 50, name: "Nova", desc: "Explosive radius damage centered on self.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 30, name: "Void Walk", desc: "Permanent stealth in dark areas.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 30, name: "Meteor", desc: "Call down celestial destruction.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 10, name: "Singularity", desc: "Collapse space-time. Ultimate power.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (Cleaner Stroke Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve for smoother look
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine Line State
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         // Path to available node
         path.classList.add('available-path');
      } else {
         // Locked path
         path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    // Clear existing nodes (keep SVG)
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Inner circle
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      
      let costHtml = '';
      if(node.state === 'locked') costHtml = `<div class="cost locked">Prerequisite Required</div>`;
      else if(node.state === 'unlocked') costHtml = `<div class="cost unlocked">Acquired</div>`;
      else costHtml = `<div class="cost available">Cost: ${node.cost} SP</div>`;

      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        ${costHtml}
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      // Unlock logic
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      // Visual update
      element.className = 'node unlocked';
      
      // Check if we unlocked something that makes further nodes available
      // Simple logic: if a node is locked but its parent (source of connection) is now unlocked, make it available
      // (Simplified for demo: usually requires complex graph traversal)
      
      // Update UI
      updateSPDisplay();
      drawConnections(); // Redraw lines to show active state
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        // Shake animation
        element.style.transform = "translate(-50%, -50%) translateX(5px)";
        setTimeout(() => element.style.transform = "translate(-50%, -50%) translateX(-5px)", 50);
        setTimeout(() => element.style.transform = "translate(-50%, -50%)", 100);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.3)";
    spDisplay.style.color = "var(--accent-cyan)";
    setTimeout(() => {
      spDisplay.style.transform = "scale(1)";
      spDisplay.style.color = "var(--text-main)";
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING FOR VIEWPORT ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.classList.add('active');
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
