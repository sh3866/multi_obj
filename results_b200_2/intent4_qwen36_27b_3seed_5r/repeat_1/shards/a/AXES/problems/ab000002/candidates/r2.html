<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    /* Palette - Void/Ascension Theme */
    --bg-deep: #050508;
    --bg-panel: rgba(12, 12, 18, 0.85);
    --bg-glass: rgba(20, 20, 30, 0.4);
    
    /* Unified Gold Palette (No Cyan) */
    --gold-primary: #d4af37;
    --gold-bright: #f9e076;
    --gold-dim: #5e4f1a;
    --gold-glow: rgba(212, 175, 55, 0.3);
    
    /* Neutral States */
    --node-locked-bg: #15151e;
    --node-locked-border: #3a3a4a;
    --text-main: #e0e0e8;
    --text-muted: #888899;
    --text-dim: #444455;
    
    --border-color: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(212, 175, 55, 0.3);

    /* Typography */
    /* Using a unified Serif stack for that "Ancient/RPG" feel */
    --font-stack: 'Georgia', 'Times New Roman', 'Times', serif;

    /* Dimensions */
    --node-size: 64px;
    --sidebar-width: 300px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- ATMOSPHERE & BACKGROUND --- */
  /* Simulating a shifting void/nebula with CSS gradients and animation */
  body::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: 
      radial-gradient(circle at 50% 50%, rgba(40, 20, 60, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(20, 40, 60, 0.1) 0%, transparent 30%),
      radial-gradient(circle at 80% 20%, rgba(60, 20, 20, 0.1) 0%, transparent 30%);
    animation: voidShift 20s ease-in-out infinite alternate;
    z-index: -1;
    pointer-events: none;
  }
  
  @keyframes voidShift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-2%, -2%) scale(1.05); }
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    width: 98vw;
    height: 96vh;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    box-shadow: 0 0 80px rgba(0,0,0,0.8);
    border-radius: 12px;
    position: relative;
    backdrop-filter: blur(12px);
    overflow: hidden;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(10,10,15,0.9) 100%);
    border-right: 1px solid var(--border-color);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    z-index: 10;
    position: relative;
  }

  /* Decorative divider */
  .sidebar::after {
    content: '';
    position: absolute;
    top: 10%; right: 0; bottom: 10%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--gold-dim), transparent);
  }

  .profile-header {
    text-align: center;
    margin-bottom: 1rem;
  }

  .avatar-frame {
    width: 110px;
    height: 110px;
    border: 2px solid var(--gold-dim);
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, #1a1a24, #050508);
    box-shadow: 0 0 25px rgba(0,0,0,0.5), 0 0 10px var(--gold-glow);
    position: relative;
  }

  /* Rotating Arcane Ring */
  .avatar-frame::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px dashed var(--gold-dim);
    border-top-color: var(--gold-primary);
    animation: spin 15s linear infinite;
  }

  .avatar-frame svg {
    width: 50px;
    height: 50px;
    fill: none;
    stroke: var(--gold-primary);
    stroke-width: 1.5;
    filter: drop-shadow(0 0 4px var(--gold-glow));
  }

  .char-name {
    font-family: var(--font-stack);
    font-size: 2rem;
    color: var(--text-main);
    letter-spacing: 1px;
    margin-bottom: 0.3rem;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    font-weight: normal;
  }

  .char-class {
    font-size: 0.85rem;
    color: var(--gold-primary);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
    opacity: 0.9;
  }

  /* --- STATS & RESOURCES (Hierarchy Fix) --- */
  .resource-panel {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .level-block {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 0.5rem;
    padding: 0 4px;
  }

  .lvl-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .level-val {
    font-size: 2.5rem;
    color: var(--text-main);
    line-height: 1;
    font-weight: normal;
  }

  .xp-container {
    position: relative;
    height: 4px;
    background: #000;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-primary));
    box-shadow: 0 0 10px var(--gold-glow);
    position: relative;
  }
  
  /* Shine effect */
  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%);
    animation: shimmer 4s infinite;
  }

  .xp-text {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* Skill Points - Dimmed as per critique */
  .points-display {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    padding: 1.5rem;
    border-radius: 8px; /* Unified radius */
    text-align: center;
    position: relative;
    margin-top: auto; /* Push to bottom of sidebar if needed, or keep in flow */
  }

  .points-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.8rem;
    font-weight: 700;
  }

  .points-val {
    font-size: 2.5rem;
    font-family: var(--font-stack);
    color: var(--gold-primary); /* Unified Color */
    line-height: 1;
    text-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
  }

  .points-action {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-style: italic;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Subtle radial vignette */
    background: radial-gradient(circle at 50% 50%, rgba(20,25,35,0.2) 0%, rgba(0,0,0,0.6) 100%);
  }

  /* Header - Unified */
  .header-bar {
    height: 80px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 3rem;
    justify-content: space-between;
    background: rgba(5, 5, 8, 0.6);
    backdrop-filter: blur(5px);
    z-index: 5;
  }

  .tree-title {
    font-family: var(--font-stack);
    font-size: 1.5rem;
    color: var(--text-main);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: normal;
    position: relative;
    padding-left: 20px;
  }
  
  .tree-title::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; height: 60%; width: 1px;
    background: var(--gold-primary);
    box-shadow: 0 0 8px var(--gold-primary);
  }

  .tabs {
    display: flex;
    background: rgba(0,0,0,0.4);
    padding: 4px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 8px 24px;
    border-radius: 2px;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    font-family: var(--font-stack);
  }

  .tab:hover {
    color: var(--text-main);
    background: rgba(255,255,255,0.05);
  }

  .tab.active {
    background: rgba(212, 175, 55, 0.1);
    color: var(--gold-primary);
    border: 1px solid rgba(212, 175, 55, 0.3);
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: hidden; /* Hide scrollbars */
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
  }
  
  .tree-viewport:active { cursor: grabbing; }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 1000px;
    height: 800px;
    /* Centering the content */
    transform-origin: center center;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* Connection Lines - Distinct States */
  path.connection-line {
    fill: none;
    stroke-linecap: round;
    transition: all 0.5s ease;
  }

  /* Locked Path: Faint, barely visible */
  path.connection-line.locked {
    stroke: rgba(255, 255, 255, 0.04);
    stroke-width: 2;
  }

  /* Active/Unlocked Path: Glowing Gold */
  path.connection-line.active {
    stroke: var(--gold-primary);
    stroke-width: 2;
    filter: drop-shadow(0 0 4px var(--gold-glow));
    stroke-opacity: 0.8;
  }
  
  /* Path to available node: Dashed Gold (No Cyan) */
  path.connection-line.available-path {
    stroke: var(--gold-dim);
    stroke-width: 2;
    stroke-dasharray: 6, 6;
    stroke-opacity: 0.6;
  }

  /* --- NODES (Standardized Geometry) --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 10;
  }

  .node-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--node-locked-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.4s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Inner Rune/Detail for depth */
  .node-inner::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.03);
    pointer-events: none;
  }

  /* Standardized Icon Container */
  .node-inner svg {
    width: 30px;
    height: 30px;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    transition: all 0.3s;
  }

  /* --- NODE STATES --- */

  /* 1. LOCKED: High contrast but dead/dim */
  .node.locked .node-inner {
    border-color: var(--node-locked-border);
    background: radial-gradient(circle at 50% 50%, #1a1a24, #0a0a0f);
  }
  .node.locked .node-inner svg {
    stroke: #444455;
    opacity: 0.7;
  }

  /* 2. UNLOCKED: Glowing Gold (Standardized Color Logic) */
  .node.unlocked .node-inner {
    border: 2px solid var(--gold-primary);
    background: radial-gradient(circle at 30% 30%, #3a2e08, #000);
    box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.2);
  }
  .node.unlocked .node-inner svg {
    stroke: var(--gold-bright);
    fill: rgba(212, 175, 55, 0.1);
    filter: drop-shadow(0 0 3px var(--gold-primary));
  }
  .node.unlocked .node-inner::after {
    border-color: rgba(212, 175, 55, 0.3);
  }

  /* 3. AVAILABLE: Pulsing Gold (Standardized Color Logic) */
  .node.available .node-inner {
    border: 2px solid var(--gold-primary);
    background: radial-gradient(circle, #2a2200 0%, #000 100%);
    box-shadow: 0 0 20px var(--gold-glow);
    animation: pulse 2.5s infinite;
  }
  .node.available .node-inner svg {
    stroke: var(--gold-bright);
    fill: rgba(212, 175, 55, 0.15);
  }

  /* Tooltip - Elegant */
  .tooltip {
    position: absolute;
    bottom: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 260px;
    background: rgba(8, 8, 12, 0.95);
    border: 1px solid var(--gold-dim);
    padding: 1.5rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.95);
    text-align: left;
    z-index: 100;
  }

  /* Tooltip Arrow */
  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(8, 8, 12, 0.95);
    border-right: 1px solid var(--gold-dim);
    border-bottom: 1px solid var(--gold-dim);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--gold-primary);
    font-family: var(--font-stack);
    margin-bottom: 0.6rem;
    font-size: 1.15rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.6rem;
    letter-spacing: 0.5px;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: #c0c5d0;
    line-height: 1.5;
    margin-bottom: 1rem;
    font-family: sans-serif; /* Readability for body text */
  }

  .tooltip .cost {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: right;
    padding-top: 0.8rem;
    border-top: 1px dashed rgba(255,255,255,0.1);
    font-family: sans-serif;
  }
  
  .cost.locked { color: var(--text-dim); }
  .cost.available { color: var(--gold-bright); }
  .cost.unlocked { color: var(--gold-primary); }

  /* Animations */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
    70% { box-shadow: 0 0 0 12px rgba(212, 175, 55, 0); }
    100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  /* Corner Accents - Refined Arcane Style */
  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 1px solid var(--gold-dim);
    z-index: 5;
    pointer-events: none;
    opacity: 0.6;
  }
  .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
  .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
  .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <!-- Unified SVG Style -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <!-- Unified Resource Panel -->
    <div class="resource-panel">
      <div class="level-block">
        <span class="lvl-label">Level</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>

    <!-- Skill Points - Dimmed & Unified -->
    <div class="points-display">
      <div class="points-label">Skill Points</div>
      <div class="points-val" id="sp-display">3</div>
      <div class="points-action">Invest in the Matrix</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <!-- Decorative Corners -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 85, name: "Void Core", desc: "The center of your power. Unlocks all abilities.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 25, y: 65, name: "Shadow Step", desc: "Teleport short distances instantly.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 75, y: 65, name: "Arcane Blast", desc: "Fire a concentrated bolt of energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 45, name: "Entropy", desc: "Drain life force from enemies to heal self.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 15, y: 45, name: "Phase Shift", desc: "Become intangible to physical attacks.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 85, y: 45, name: "Nova", desc: "Explosive radius damage centered on self.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 25, name: "Void Walk", desc: "Permanent stealth in dark areas.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 25, name: "Meteor", desc: "Call down celestial destruction.", state: "locked", icon: "meteor", cost: 3 },

  const connections = [

    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (Standardized Stroke Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve for smoother look
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine Line State
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         // Path to available node
         path.classList.add('available-path');
      } else {
         // Locked path
         path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    // Clear existing nodes (keep SVG)
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Inner circle
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      svgIcon.setAttribute("fill", "none");
      svgIcon.setAttribute("stroke", "currentColor");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      
      let costHtml = '';
      if(node.state === 'locked') costHtml = `<div class="cost locked">Prerequisite Required</div>`;
      else if(node.state === 'unlocked') costHtml = `<div class="cost unlocked">Acquired</div>`;
      else costHtml = `<div class="cost available">Cost: ${node.cost} SP</div>`;

      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        ${costHtml}
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      // Unlock logic
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      // Visual update
      element.className = 'node unlocked';
      
      // Check if we unlocked something that makes further nodes available
      // (Simplified for demo)
      
      // Update UI
      updateSPDisplay();
      drawConnections(); // Redraw lines to show active state
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        // Shake animation
        element.style.transform = "translate(-50%, -50%) translateX(5px)";
        setTimeout(() => element.style.transform = "translate(-50%, -50%) translateX(-5px)", 50);
        setTimeout(() => element.style.transform = "translate(-50%, -50%)", 100);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.2)";
    spDisplay.style.color = "var(--gold-bright)";
    setTimeout(() => {
      spDisplay.style.transform = "scale(1)";
      spDisplay.style.color = "var(--gold-primary)";
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING FOR VIEWPORT ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.classList.add('active');
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
