<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Matrix | Void Walker</title>
<style>
  :root {
    /* VOID PALETTE */
    --void-bg: #050507;
    --void-panel: #0c0c12;
    --void-surface: #15151e;
    --void-border: #2a2a35;
    
    /* ARCANE ACCENTS */
    --arcane-primary: #d4af37;
    --arcane-bright: #fff4cc;
    --arcane-dim: #5e4f1a;
    --arcane-glow: rgba(212, 175, 55, 0.4);
    
    /* STATE COLORS */
    --state-active: #00ffcc; 
    --state-active-glow: rgba(0, 255, 204, 0.6);
    --state-locked: #2a2a35;
    
    /* TYPOGRAPHY */
    --font-header: 'Cinzel', 'Times New Roman', serif;
    --font-body: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
    --font-mono: 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--void-bg);
    color: #e0e0e8;
    font-family: var(--font-body);
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- ATMOSPHERE --- */
  /* Deep Void Texture & Vignette */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 50% 50%, rgba(20, 20, 30, 0.4) 0%, transparent 70%),
      radial-gradient(circle at 50% 50%, #000 100%, transparent 50%);
    z-index: -2;
    pointer-events: none;
  }
  
  /* Starfield / Dust */
  body::after {
    content: '';
    position: absolute;
    inset: -50px;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px),
      radial-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px);
    background-size: 200px 200px, 100px 100px;
    background-position: 0 0, 50px 50px;
    opacity: 0.1;
    animation: drift 120s linear infinite;
    z-index: -1;
    pointer-events: none;
  }

  @keyframes drift {
    from { background-position: 0 0, 50px 50px; }
    to { background-position: 200px 200px, 250px 250px; }
  }

  /* --- DASHBOARD LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 340px 1fr;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 15, 0.6);
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow: 0 0 150px rgba(0,0,0,0.9);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 1;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(10,10,15,0.98) 100%);
    border-right: 1px solid rgba(255,255,255,0.05);
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    position: relative;
    z-index: 10;
  }

  /* Decorative Arcane Line */
  .sidebar::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; width: 1px;
    background: linear-gradient(to bottom, transparent, var(--arcane-dim), transparent);
    opacity: 0.3;
  }

  .profile-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0.9;
  }

  .avatar-container {
    width: 140px;
    height: 140px;
    margin-bottom: 1.5rem;
    position: relative;
  }

  /* Animated Rune Ring */
  .avatar-ring {
    position: absolute;
    inset: -15px;
    border: 1px dashed var(--arcane-dim);
    border-radius: 50%;
    animation: spin 40s linear infinite;
    opacity: 0.4;
  }
  
  .avatar-ring::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 2px solid transparent;
    border-top-color: var(--arcane-primary);
    border-radius: 50%;
    opacity: 0.6;
    filter: drop-shadow(0 0 5px var(--arcane-glow));
  }

  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #2a2a35, #000);
    border: 2px solid var(--void-surface);
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .avatar-img svg {
    width: 60%;
    height: 60%;
    stroke: var(--arcane-dim);
    fill: none;
    stroke-width: 1.5;
    filter: drop-shadow(0 0 2px var(--arcane-glow));
  }

  .char-name {
    font-family: var(--font-header);
    font-size: 2.2rem;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .char-class {
    font-size: 0.85rem;
    color: var(--arcane-primary);
    text-transform: uppercase;
    letter-spacing: 5px;
    font-weight: 600;
    text-shadow: 0 0 10px var(--arcane-glow);
  }

  /* --- RESOURCES (Unified Block) --- */
  .resources-group {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    width: 100%;
    position: relative;
  }

  .level-block {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 5px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 10px;
  }

  .lvl-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--arcane-dim);
    font-weight: 700;
  }

  .level-val {
    font-family: var(--font-header);
    font-size: 2.5rem;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.2);
    line-height: 1;
  }

  .xp-track {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 1rem;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--arcane-dim), var(--arcane-primary));
    box-shadow: 0 0 10px var(--arcane-glow);
    position: relative;
  }
  
  .xp-text {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    color: var(--arcane-dim);
    text-align: right;
    margin-top: 0.6rem;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* Skill Points - Glassmorphism integration */
  .sp-container {
    margin-top: 1rem;
    padding: 1.2rem;
    background: rgba(212, 175, 55, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(5px);
    transition: all 0.3s ease;
  }

  .sp-container:hover {
    background: rgba(212, 175, 55, 0.07);
    border-color: rgba(212, 175, 55, 0.3);
  }

  .sp-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--arcane-primary);
    font-weight: 700;
  }

  .sp-val {
    font-family: var(--font-header);
    font-size: 2rem;
    color: var(--arcane-bright);
    text-shadow: 0 0 10px var(--arcane-glow);
    line-height: 1;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at center, rgba(20,25,35,0.2) 0%, rgba(0,0,0,0.6) 100%);
    overflow: hidden;
  }

  .header {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 3rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    z-index: 5;
  }

  .tree-title {
    font-family: var(--font-header);
    font-size: 1.8rem;
    letter-spacing: 6px;
    color: #fff;
    text-transform: uppercase;
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .tree-title::before {
    content: '';
    display: block;
    width: 20px;
    height: 2px;
    background: var(--arcane-primary);
    box-shadow: 0 0 10px var(--arcane-primary);
  }

  /* --- TREE VIEWPORT --- */
  .tree-viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
    /* Subtle Grid Background */
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .tree-viewport:active { cursor: grabbing; }

  .tree-container {
    position: relative;
    width: 1400px;
    height: 1000px;
    transform-origin: center center;
    /* Centering logic handled by flex parent, but we start offset for panning */
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  /* --- CONNECTIONS (SVG) --- */
  svg.connections {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: visible;
  }

  path.connection-line {
    fill: none;
    stroke-linecap: round;
    transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Locked Path: Faint, jagged */
  path.connection-line.locked {
    stroke: rgba(255, 255, 255, 0.05);
    stroke-width: 2;
    stroke-dasharray: 10, 10;
  }

  /* Active Path: Glowing Energy Beam */
  path.connection-line.active {
    stroke: var(--state-active);
    stroke-width: 4;
    filter: drop-shadow(0 0 8px var(--state-active-glow));
    stroke-opacity: 0.9;
  }

  /* Available Path: Dashed Gold */
  path.connection-line.available-path {
    stroke: var(--arcane-primary);
    stroke-width: 3;
    stroke-dasharray: 12, 12;
    stroke-opacity: 0.5;
    animation: dashFlow 20s linear infinite;
  }

  @keyframes dashFlow {
    to { stroke-dashoffset: -1000; }
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: 90px;
    height: 90px;
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.2);
    z-index: 10;
  }

  .node-visual {
    width: 100%;
    height: 100%;
    /* Hexagonal Shape for RPG feel */
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.4s ease;
    background: #000;
  }

  /* Inner Hexagon Layer */
  .node-visual::before {
    content: '';
    position: absolute;
    inset: 4px;
    background: inherit;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 1;
    transition: all 0.4s ease;
  }
  
  /* Outer Border Layer (Simulated) */
  .node-visual::after {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: -1;
    filter: brightness(0.5);
  }

  .node svg {
    width: 40px;
    height: 40px;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    transition: all 0.4s ease;
    z-index: 2;
    position: relative;
  }

  /* --- NODE STATES --- */

  /* 1. LOCKED: Cold, dead stone */
  .node.locked .node-visual {
    background: radial-gradient(circle at 50% 50%, #2a2a35, #15151e);
    box-shadow: inset 0 0 20px #000;
  }
  .node.locked .node-visual::before { border: 1px solid #333; }
  .node.locked svg {
    stroke: #444;
    opacity: 0.4;
  }

  /* 2. UNLOCKED: Radiant, Active */
  .node.unlocked .node-visual {
    background: radial-gradient(circle at 50% 50%, #004d40, #001510);
    box-shadow: 0 0 30px var(--state-active-glow), inset 0 0 15px var(--state-active-glow);
  }
  .node.unlocked .node-visual::before { 
    border: 2px solid var(--state-active); 
    box-shadow: inset 0 0 10px var(--state-active-glow);
  }
  .node.unlocked svg {
    stroke: var(--state-active);
    filter: drop-shadow(0 0 6px var(--state-active));
  }

  /* 3. AVAILABLE: Pulsing Gold */
  .node.available .node-visual {
    background: radial-gradient(circle at 50% 50%, #5e4f1a, #1a1500);
    box-shadow: 0 0 20px var(--arcane-glow);
    animation: pulse 3s infinite;
  }
  .node.available .node-visual::before { 
    border: 2px solid var(--arcane-primary); 
  }
  .node.available svg {
    stroke: var(--arcane-bright);
    filter: drop-shadow(0 0 5px var(--arcane-primary));
  }

  /* --- TOOLTIP --- */
  .tooltip {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 300px;
    background: rgba(5, 5, 8, 0.95);
    border: 1px solid var(--arcane-dim);
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    text-align: left;
    z-index: 100;
    clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
    backdrop-filter: blur(5px);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--arcane-bright);
    font-family: var(--font-header);
    margin-bottom: 0.5rem;
    font-size: 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: #ccc;
    line-height: 1.5;
    margin-bottom: 1rem;
  }

  .tooltip .cost {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: right;
    padding-top: 0.5rem;
    border-top: 1px dashed rgba(255,255,255,0.1);
  }
  
  .cost.locked { color: #666; }
  .cost.available { color: var(--arcane-primary); }
  .cost.unlocked { color: var(--state-active); }

  /* Animations */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
    50% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
    100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
  }
  
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-section">
      <div class="avatar-container">
        <div class="avatar-ring"></div>
        <div class="avatar-img">
          <!-- Unified SVG Style: Geometric Eye -->
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-opacity="0.5"/>
            <circle cx="12" cy="12" r="3" stroke-width="2"/>
            <path d="M12 2v4m0 12v4M2 12h4m12 0h4" stroke-width="1"/>
          </svg>
        </div>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <div class="resources-group">
      <div>
        <div class="level-block">
          <span class="lvl-label">Current Level</span>
          <span class="level-val">42</span>
        </div>
        <div class="xp-track">
          <div class="xp-fill"></div>
        </div>
        <div class="xp-text">12,450 / 15,000 XP</div>
      </div>

      <!-- Skill Points: Integrated Glass Panel -->
      <div class="sp-container">
        <div class="sp-label">Available Points</div>
        <div class="sp-val" id="sp-display">3</div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header">
      <div class="tree-title">Ascension Matrix</div>
      <!-- Visual Tab Indicators -->
      <div style="display: flex; gap: 15px; opacity: 0.6;">
        <div style="width: 40px; height: 2px; background: var(--arcane-primary);"></div>
        <div style="width: 20px; height: 2px; background: #444;"></div>
        <div style="width: 20px; height: 2px; background: #444;"></div>
      </div>
    </div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 85, name: "Void Core", desc: "The center of your power. Unlocks all abilities.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 25, y: 65, name: "Shadow Step", desc: "Teleport short distances instantly.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 75, y: 65, name: "Arcane Blast", desc: "Fire a concentrated bolt of energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 45, name: "Entropy", desc: "Drain life force from enemies to heal self.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 15, y: 45, name: "Phase Shift", desc: "Become intangible to physical attacks.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 85, y: 45, name: "Nova", desc: "Explosive radius damage centered on self.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 25, name: "Void Walk", desc: "Permanent stealth in dark areas.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 25, name: "Meteor", desc: "Call down celestial destruction.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 10, name: "Singularity", desc: "Collapse space-time. Ultimate power.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve for smoother look
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine Line State
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         path.classList.add('available-path');
      } else {
         path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      const visual = document.createElement('div');
      visual.className = 'node-visual';
      
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      svgIcon.setAttribute("fill", "none");
      svgIcon.setAttribute("stroke", "currentColor");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      visual.appendChild(svgIcon);
      el.appendChild(visual);

      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      
      let costHtml = '';
      if(node.state === 'locked') costHtml = `<div class="cost locked">Prerequisite Required</div>`;
      else if(node.state === 'unlocked') costHtml = `<div class="cost unlocked">Acquired</div>`;
      else costHtml = `<div class="cost available">Cost: ${node.cost} SP</div>`;

      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        ${costHtml}
      `;
      el.appendChild(tooltip);

      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      element.className = 'node unlocked';
      updateSPDisplay();
      drawConnections();
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        element.style.transform = "translate(-50%, -50%) translateX(5px)";
        setTimeout(() => element.style.transform = "translate(-50%, -50%) translateX(-5px)", 50);
        setTimeout(() => element.style.transform = "translate(-50%, -50%)", 100);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.2)";
    spDisplay.style.color = "var(--arcane-bright)";
    setTimeout(() => {
      spDisplay.style.transform = "scale(1)";
      spDisplay.style.color = "var(--arcane-primary)";
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.classList.add('active');
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => { isDown = false; viewport.classList.remove('active'); });
  viewport.addEventListener('mouseup', () => { isDown = false; viewport.classList.remove('active'); });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1.5; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1.5;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
