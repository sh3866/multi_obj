<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Tactical Interface</title>
<style>
  :root {
    /* IDENTITY: "Tactical Ops" - High Contrast, Aggressive Sci-Fi */
    --bg-deep: #05070a;
    
    /* Primary: Electric Cyan (System UI) */
    --primary: #00f0ff;
    --primary-dim: rgba(0, 240, 255, 0.1);
    --primary-glow: rgba(0, 240, 255, 0.6);
    
    /* Semantic Colors (Aggressive) */
    --accent-dmg: #ff2a4d;   /* Red/Pink */
    --accent-rate: #ffcc00;  /* Amber */
    --accent-speed: #00ff9d; /* Neon Green */
    
    /* Resources */
    --res-credits: #ffd700;
    
    /* Typography */
    --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    cursor: default;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-deep);
    font-family: var(--font-ui);
    color: #e0f7fa;
  }

  /* --- GEOMETRY SYSTEM --- */
  /* Aggressive chamfered corners for "Military" feel */
  .clip-military {
    clip-path: polygon(
      20px 0, 100% 0, 
      100% calc(100% - 20px), calc(100% - 20px) 100%, 
      0 100%, 0 20px
    );
  }

  /* --- LAYOUT: VERTICAL STACK --- */
  .main-interface {
    position: relative;
    z-index: 20;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 2rem 1rem 2rem;
    background: radial-gradient(circle at center, rgba(0, 240, 255, 0.03) 0%, rgba(5, 7, 10, 0) 70%);
  }

  /* --- 1. HUD HEADER (Status) --- */
  /* Framing the top, strict grid alignment */
  .hud-header {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
  }

  .hud-node {
    display: flex;
    flex-direction: row;
    align-items: center;
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
    padding: 0.8rem 1.5rem;
    border-left: 3px solid var(--primary);
    position: relative;
  }

  .hud-node.center {
    justify-content: center;
    border-left: none;
    border-top: 3px solid var(--primary);
    padding-top: 1.2rem;
    background: linear-gradient(180deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
  }

  .hud-node.right {
    justify-content: flex-end;
    background: linear-gradient(-90deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
    border-left: none;
    border-right: 3px solid var(--primary);
  }

  .hud-label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--primary);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-right: 10px;
    opacity: 0.8;
  }

  .hud-value {
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 8px var(--primary-glow);
  }

  .val-credits { color: var(--res-credits); text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
  .val-hp { color: var(--primary); }

  /* --- 2. CENTER STAGE (Context & Action) --- */
  .center-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 10;
    /* Ensure text doesn't overlap planet too much */
    margin-top: -20px; 
  }

  .game-title {
    font-family: var(--font-ui);
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: -1px;
    margin: 0;
    text-transform: uppercase;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    line-height: 1;
    position: relative;
    z-index: 5;
  }

  .game-title span {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.8em;
    color: var(--primary);
    margin-bottom: 0.5rem;
    text-shadow: 0 0 10px var(--primary);
  }

  /* Mission Card: Glassmorphism Panel */
  .mission-panel {
    width: 100%;
    max-width: 700px;
    margin-top: 2rem;
    margin-bottom: 3rem;
    background: rgba(5, 10, 20, 0.6);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--primary);
    border-bottom: 1px solid var(--primary);
    padding: 1rem 2rem;
    text-align: center;
    position: relative;
  }

  /* Decorative corners for mission panel */
  .mission-panel::before, .mission-panel::after {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border: 2px solid var(--primary);
    transition: all 0.3s ease;
  }
  .mission-panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .mission-panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .mission-text {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    line-height: 1.6;
    color: #e0f7fa;
    letter-spacing: 0.5px;
  }
  .mission-text strong { color: var(--primary); }

  /* Start Button: High Stakes "Trigger" */
  .start-btn {
    position: relative;
    background: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
    padding: 1.5rem 6rem;
    font-family: var(--font-ui);
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 15px var(--primary-dim), inset 0 0 15px var(--primary-dim);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    z-index: 20;
  }

  .start-btn:hover {
    background: var(--primary);
    color: #000;
    box-shadow: 0 0 40px var(--primary-glow), inset 0 0 10px #fff;
    transform: scale(1.02);
  }

  .start-btn:active {
    transform: scale(0.98);
    filter: brightness(0.8);
  }

  /* --- 3. UPGRADE DOCK (Configuration) --- */
  /* Moved to be integral part of the setup flow */
  .upgrade-dock {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-bottom: 1rem;
    z-index: 15;
  }

  .upgrade-card {
    background: rgba(10, 15, 25, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 1rem;
    position: relative;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 160px;
    /* Military clip */
    clip-path: polygon(
      15px 0, 100% 0, 
      100% calc(100% - 15px), calc(100% - 15px) 100%, 
      0 100%, 0 15px
    );
  }

  .upgrade-card:hover {
    transform: translateY(-5px);
    background: rgba(20, 25, 40, 0.85);
  }

  /* Semantic Styling per Card */
  .card-dmg:hover { border-color: var(--accent-dmg); box-shadow: 0 0 20px rgba(255, 42, 77, 0.15); }
  .card-rate:hover { border-color: var(--accent-rate); box-shadow: 0 0 20px rgba(255, 204, 0, 0.15); }
  .card-speed:hover { border-color: var(--accent-speed); box-shadow: 0 0 20px rgba(0, 255, 157, 0.15); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.5rem;
  }

  .card-title-group {
    display: flex;
    flex-direction: column;
  }

  .card-icon {
    width: 24px;
    height: 24px;
    margin-bottom: 6px;
  }
  
  .card-dmg .card-icon { fill: var(--accent-dmg); filter: drop-shadow(0 0 5px var(--accent-dmg)); }
  .card-rate .card-icon { fill: var(--accent-rate); filter: drop-shadow(0 0 5px var(--accent-rate)); }
  .card-speed .card-icon { fill: var(--accent-speed); filter: drop-shadow(0 0 5px var(--accent-speed)); }

  .card-title {
    font-family: var(--font-ui);
    font-size: 0.9rem;
    font-weight: 800;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .card-cost {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--res-credits);
    background: rgba(255, 215, 0, 0.1);
    padding: 2px 8px;
    border-radius: 2px;
  }

  .card-stats {
    margin-top: auto;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    margin-bottom: 4px;
  }

  .progress-track {
    height: 6px;
    width: 100%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    position: relative;
  }
  
  .card-dmg .progress-fill { background: var(--accent-dmg); box-shadow: 0 0 8px var(--accent-dmg); }
  .card-rate .progress-fill { background: var(--accent-rate); box-shadow: 0 0 8px var(--accent-rate); }
  .card-speed .progress-fill { background: var(--accent-speed); box-shadow: 0 0 8px var(--accent-speed); }

  .upgrade-card.disabled {
    opacity: 0.4;
    filter: grayscale(1);
    cursor: not-allowed;
    transform: none !important;
    border-color: #333 !important;
    box-shadow: none !important;
  }

  /* --- VISUAL FX --- */
  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 50;
    opacity: 0.5;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(5,7,10,0) 40%, rgba(5,7,10,0.95) 100%);
    pointer-events: none;
    z-index: 40;
  }

  #scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
  }

</style>
</head>
<body>

<!-- Background Engine -->
<div id="scene-container">
  <canvas id="bgCanvas"></canvas>
</div>

<!-- Overlays -->
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- Main Interface -->
<div class="main-interface">

  <!-- 1. HEADER -->
  <header class="hud-header">
    <div class="hud-node">
      <span class="hud-label">Wave</span>
      <div class="hud-value">01</div>
    </div>
    
    <div class="hud-node center">
      <span class="hud-label">Planet Integrity</span>
      <div class="hud-value val-hp">100%</div>
    </div>

    <div class="hud-node right">
      <span class="hud-label">Credits</span>
      <div class="hud-value val-credits" id="hud-credits">500</div>
    </div>
  </header>

  <!-- 2. CENTER STAGE -->
  <main class="center-stage">
    <h1 class="game-title">
      <span>Tactical Ops</span>
      Planet Defense
    </h1>
    
    <div class="mission-panel">
      <p class="mission-text">
        <strong>COMMANDER:</strong> Orbital shields failing. Hostile swarms in Sector 7.
        <br>Allocate credits to turret systems below before engaging.
      </p>
    </div>

    <button class="start-btn" onclick="alert('System Engaged: Starting Simulation...')">
      Engage Defense
    </button>
  </main>

  <!-- 3. UPGRADE DOCK -->
  <div class="upgrade-dock">
    
    <!-- Damage -->
    <div class="upgrade-card card-dmg" onclick="buyUpgrade('damage')">
      <div class="card-header">
        <div class="card-title-group">
          <!-- Lightning Icon -->
          <svg class="card-icon" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          <div class="card-title">Damage Output</div>
        </div>
        <div class="card-cost" id="cost-damage">150</div>
      </div>
      <div class="card-stats">
        <div class="stat-row">
          <span>CURRENT LVL</span>
          <span id="lvl-damage">0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="bar-damage" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Fire Rate -->
    <div class="upgrade-card card-rate" onclick="buyUpgrade('rate')">
      <div class="card-header">
        <div class="card-title-group">
          <!-- Rate Icon -->
          <svg class="card-icon" viewBox="0 0 24 24"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 3.73-2.56 6.86-6.02 7.75l-.98 1.97c-.43.86-1.56 1.2-2.42.77-.86-.43-1.2-1.56-.77-2.42l1.02-2.04c-3.25-.9-5.82-3.9-5.82-7.48 0-4.42 3.58-8.05 8.05-8.05h.05zm-1 6.95h-2v3.5h-2l3 4.5 3-4.5h-2z"/></svg>
          <div class="card-title">Fire Rate</div>
        </div>
        <div class="card-cost" id="cost-rate">120</div>
      </div>
      <div class="card-stats">
        <div class="stat-row">
          <span>CURRENT LVL</span>
          <span id="lvl-rate">0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="bar-rate" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Reload Speed -->
    <div class="upgrade-card card-speed" onclick="buyUpgrade('speed')">
      <div class="card-header">
        <div class="card-title-group">
          <!-- Reload Icon -->
          <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          <div class="card-title">Reload Speed</div>
        </div>
        <div class="card-cost" id="cost-speed">200</div>
      </div>
      <div class="card-stats">
        <div class="stat-row">
          <span>CURRENT LVL</span>
          <span id="lvl-speed">0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="bar-speed" style="width: 0%;"></div>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
/**
 * PLANET DEFENSE VISUAL ENGINE
 * Renders a stylized, "threatened" planetary surface.
 */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let stars = [];
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  cy = height / 2 + 50; // Center slightly lower
  initStars();
}

function initStars() {
  stars = [];
  const numStars = 250;
  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      speed: Math.random() * 0.05 + 0.01,
      alpha: Math.random()
    });
  }
}

function drawNebula() {
  // Deep atmospheric background
  const gradient = ctx.createRadialGradient(cx, cy, Math.min(width, height) * 0.1, cx, cy, Math.max(width, height) * 0.8);
  gradient.addColorStop(0, 'rgba(0, 50, 80, 0.15)');
  gradient.addColorStop(0.6, 'rgba(0, 10, 20, 0.05)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
}

function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.01 + star.x));
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Parallax drift
    star.y += star.speed;
    if (star.y > height) star.y = 0;
  });
  ctx.globalAlpha = 1.0;
}

function drawPlanet() {
  const radius = Math.min(width, height) * 0.35;
  
  // 1. Atmosphere Glow
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.95, cx, cy, radius * 1.4);
  glow.addColorStop(0, 'rgba(0, 240, 255, 0.2)');
  glow.addColorStop(0.4, 'rgba(0, 240, 255, 0.05)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  
  // 2. Planet Body (Dark, High Contrast)
  const planetGrad = ctx.createRadialGradient(-radius*0.3, -radius*0.3, radius*0.1, 0, 0, radius);
  planetGrad.addColorStop(0, '#1a222c');
  planetGrad.addColorStop(1, '#05070a');
  
  ctx.fillStyle = planetGrad;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();

  // 3. Wireframe Grid (Tactical)
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 1;
  
  // Longitudes
  for(let i=1; i<=3; i++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * (i/4), radius, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Latitudes
  for(let i=-2; i<=2; i++) {
    ctx.beginPath();
    let y = i * (radius * 0.4);
    let r = Math.sqrt(Math.pow(radius, 2) - Math.pow(y, 2));
    if (r > 0) {
        ctx.ellipse(0, y, r, Math.abs(y) * 0.1 + 2, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
  }

  // 4. Threat Zones (Red)
  ctx.fillStyle = 'rgba(255, 56, 96, 0.2)';
  for(let i=0; i<3; i++) {
    ctx.beginPath();
    let angle = (i * 2.1); 
    let dist = radius * 0.5;
    ctx.arc(Math.cos(angle)*dist, Math.sin(angle)*dist * 0.8, radius*0.15, 0, Math.PI*2);
    ctx.fill();
  }

  // 5. Orbital Ring
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(0, 240, 255, 0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 1.6, radius * 0.15, Math.PI / 12, Math.PI, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function animate() {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  
  time++;
  
  drawNebula();
  drawStars();
  drawPlanet();
  
  requestAnimationFrame(animate);
}

// --- GAME LOGIC (Start Screen Simulation) ---
const gameState = {
  credits: 500,
  upgrades: {
    damage: { level: 0, cost: 150, max: 10 },
    rate: { level: 0, cost: 120, max: 10 },
    speed: { level: 0, cost: 200, max: 10 }
  }
};

function updateUI() {
  // Update Credits
  document.getElementById('hud-credits').innerText = gameState.credits;

  // Update Upgrade Cards
  ['damage', 'rate', 'speed'].forEach(type => {
    const data = gameState.upgrades[type];
    
    // Update Text
    document.getElementById(`lvl-${type}`).innerText = data.level;
    document.getElementById(`cost-${type}`).innerText = data.cost;
    
    // Update Bar Width
    const widthPct = (data.level / data.max) * 100;
    document.getElementById(`bar-${type}`).style.width = `${widthPct}%`;
    
    // Update Disabled State Visuals
    const btn = document.querySelector(`.card-${type}`);
    if (gameState.credits < data.cost || data.level >= data.max) {
      btn.classList.add('disabled');
    } else {
      btn.classList.remove('disabled');
    }
  });
}

function buyUpgrade(type) {
  const data = gameState.upgrades[type];
  if (gameState.credits >= data.cost && data.level < data.max) {
    gameState.credits -= data.cost;
    data.level++;
    data.cost = Math.floor(data.cost * 1.3); // Cost scaling
    updateUI();
  }
}

// Init
window.addEventListener('resize', resize);
resize();
animate();
updateUI(); // Initial UI State

</script>
</body>
</html>
