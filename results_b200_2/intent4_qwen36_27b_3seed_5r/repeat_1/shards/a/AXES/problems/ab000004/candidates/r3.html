<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Tactical Interface</title>
<style>
  :root {
    /* 
      IDENTITY: "Tactical Hologram" 
      High contrast, crisp geometry, deep space depth.
    */
    --bg-deep: #03050a;
    --bg-panel: rgba(10, 18, 30, 0.75);
    --bg-panel-hover: rgba(15, 25, 45, 0.85);
    
    /* Primary: Electric Cyan - The "Energy" */
    --primary: #00f0ff;
    --primary-dim: rgba(0, 240, 255, 0.15);
    --primary-glow: rgba(0, 240, 255, 0.6);
    
    /* Secondary: Alert/Action */
    --accent: #ff0055;
    
    /* Data Viz Semantics */
    --stat-dmg: #ff3860;
    --stat-rate: #ffcc00;
    --stat-speed: #00ff9d;
    
    /* Resources */
    --res-credits: #ffd700;

    /* Typography */
    --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    cursor: default;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-deep);
    font-family: var(--font-ui);
    color: #e0f7fa;
  }

  /* --- GEOMETRY SYSTEM --- */
  /* 
    Standardized "Chamfered" cut-corner geometry.
    Creates a cohesive, sharp sci-fi identity.
  */
  .shape-chamfer {
    clip-path: polygon(
      20px 0, 100% 0, 
      100% calc(100% - 20px), calc(100% - 20px) 100%, 
      0 100%, 0 20px
    );
  }
  
  .shape-chamfer-sm {
    clip-path: polygon(
      10px 0, 100% 0, 
      100% calc(100% - 10px), calc(100% - 10px) 100%, 
      0 100%, 0 10px
    );
  }

  /* --- LAYOUT: PERSPECTIVE GRID --- */
  /* 
    Breaking the flat plane. The entire UI sits on a subtle 3D plane.
  */
  .ui-grid {
    position: relative;
    z-index: 20;
    display: grid;
    grid-template-columns: 250px 1fr 250px;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    width: 100vw;
    padding: 3rem;
    gap: 1.5rem;
    /* Subtle tilt to match orbital rings */
    transform: perspective(1200px) rotateX(2deg);
    transform-origin: center center;
  }

  /* --- HUD HEADER --- */
  /* 
    Re-organized: High contrast, Monospaced data, Positive colors for good states.
  */
  .hud-header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 1rem;
    margin-bottom: 2rem;
    z-index: 30;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    background: rgba(0,0,0,0.4);
    padding: 0.5rem 1rem;
    border-left: 3px solid var(--primary);
    backdrop-filter: blur(4px);
  }

  .hud-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--primary);
    letter-spacing: 2px;
    margin-bottom: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 5px var(--primary-dim);
  }

  .hud-value {
    font-family: var(--font-mono);
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px var(--primary-glow);
    line-height: 1;
  }

  /* Specific HUD Adjustments */
  .hud-left { align-items: flex-start; }
  .hud-right { align-items: flex-end; border-left: none; border-right: 3px solid var(--res-credits); }
  
  .hud-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    border-left: none;
    border-top: 3px solid var(--primary);
    padding: 0.5rem 2rem;
    background: rgba(0,0,0,0.6);
  }
  
  /* Planet Integrity: Changed from Red to Cyan (Positive/100%) */
  .hp-value {
    color: var(--primary); 
  }
  .credits-value { 
    color: var(--res-credits); 
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
  }

  /* --- CENTER STAGE --- */
  .center-stage {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    position: relative;
  }

  /* Title: Distinct Identity */
  .game-title {
    font-family: var(--font-ui);
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: -3px;
    margin: 0 0 1.5rem 0;
    text-transform: uppercase;
    text-align: center;
    color: #fff;
    /* Double shadow for depth */
    text-shadow: 0 0 0 rgba(255,255,255,0.1), 0 0 40px rgba(0, 240, 255, 0.3);
    line-height: 0.9;
    z-index: 5;
  }
  
  .game-title span {
    display: block;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.8em;
    color: var(--primary);
    margin-bottom: 0.5rem;
    text-shadow: 0 0 15px var(--primary);
    opacity: 0.9;
  }

  /* Mission Brief: Holographic, Semi-transparent */
  .mission-panel {
    width: 100%;
    max-width: 600px;
    background: linear-gradient(90deg, transparent 0%, rgba(0, 240, 255, 0.03) 15%, rgba(0, 240, 255, 0.03) 85%, transparent 100%);
    border-top: 1px solid var(--primary-dim);
    border-bottom: 1px solid var(--primary-dim);
    padding: 1.5rem 2rem;
    margin-bottom: 4rem;
    text-align: center;
    position: relative;
    backdrop-filter: blur(2px);
  }

  /* Scanline overlay for "Hologram" feel */
  .mission-panel::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 240, 255, 0.05) 2px,
      rgba(0, 240, 255, 0.05) 4px
    );
    pointer-events: none;
  }

  .mission-text {
    font-family: var(--font-mono);
    font-size: 1rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 0 5px var(--primary-glow);
    letter-spacing: 0.5px;
  }

  .mission-text strong {
    color: var(--primary);
    font-weight: 700;
  }

  /* Start Button: Flat, High Contrast, Glowing */
  .start-btn {
    background: var(--primary);
    color: #000;
    border: none;
    padding: 1.8rem 6rem;
    font-family: var(--font-ui);
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    /* High contrast glow */
    box-shadow: 0 0 30px var(--primary-glow), inset 0 0 20px rgba(255,255,255,0.3);
    z-index: 10;
  }

  .start-btn:hover {
    background: #fff;
    box-shadow: 0 0 60px var(--primary), inset 0 0 15px var(--primary);
    transform: scale(1.03);
    cursor: pointer;
  }

  .start-btn:active {
    transform: scale(0.98);
    filter: brightness(0.9);
  }

  /* --- FOOTER / UPGRADES --- */
  /* 
    Secondary menu. Less visual weight than the Start button.
    Interactive cards with clear "Buy" affordance.
  */
  .upgrade-dock {
    grid-column: 1 / -1;
    grid-row: 3;
    display: flex;
    justify-content: center;
    gap: 2rem;
    width: 100%;
    align-self: end;
    padding-bottom: 1rem;
  }

  /* Upgrade Buttons: Distinct Icons, Unified Shape */
  .upgrade-btn {
    flex: 1;
    max-width: 300px;
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 160px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
  }

  .upgrade-btn:hover {
    background: var(--bg-panel-hover);
    border-color: var(--primary);
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  
  /* Visual feedback for "Affordable" vs "Too Expensive" (Logic handled in JS, styled here) */
  .upgrade-btn.disabled {
    opacity: 0.5;
    filter: grayscale(0.8);
    cursor: not-allowed;
    border-color: #333;
  }

  .u-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .u-icon-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .u-icon {
    width: 24px;
    height: 24px;
    fill: var(--primary);
    opacity: 0.8;
  }

  .u-title {
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
  }

  .u-cost {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--res-credits);
    text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
  }
  
  .u-level {
    font-size: 0.8rem;
    font-family: var(--font-mono);
    color: var(--primary);
    text-transform: uppercase;
    margin-bottom: 5px;
    opacity: 0.7;
  }

  /* Progress Bars: Segmented, Tech-style */
  .u-bar-track {
    height: 10px;
    width: 100%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    display: flex;
    gap: 2px;
  }

  /* Segmented look using repeating gradient */
  .u-bar-track::before {
    content: '';
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background: linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.8) 50%);
    background-size: 10% 100%;
    pointer-events: none;
    z-index: 2;
  }

  .u-bar-fill {
    height: 100%;
    width: 0%; /* Set inline */
    position: relative;
    z-index: 1;
    box-shadow: 0 0 8px currentColor;
  }
  
  /* Semantic Colors */
  .damage .u-bar-fill { background: var(--stat-dmg); color: var(--stat-dmg); }
  .rate .u-bar-fill { background: var(--stat-rate); color: var(--stat-rate); }
  .speed .u-bar-fill { background: var(--stat-speed); color: var(--stat-speed); }

  /* --- VISUAL EFFECTS --- */
  /* Scanlines for CRT/Hologram feel */
  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 50;
    opacity: 0.5;
  }

  /* Vignette for depth */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(2,4,8,0) 40%, rgba(2,4,8,0.95) 100%);
    pointer-events: none;
    z-index: 40;
  }

  /* Background Canvas */
  #scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
  }

  /* Corner Decorations - Framing the screen */
  .corner-decor {
    position: absolute;
    width: 80px; height: 80px;
    border: 2px solid var(--primary);
    opacity: 0.4;
    z-index: 30;
    pointer-events: none;
  }
  .tl { top: 30px; left: 30px; border-right: 0; border-bottom: 0; }
  .tr { top: 30px; right: 30px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 30px; left: 30px; border-right: 0; border-top: 0; }
  .br { bottom: 30px; right: 30px; border-left: 0; border-top: 0; }

</style>
</head>
<body>

<!-- Background -->
<div id="scene-container">
  <canvas id="bgCanvas"></canvas>
</div>

<!-- Overlays -->
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="corner-decor tl"></div>
<div class="corner-decor tr"></div>
<div class="corner-decor bl"></div>
<div class="corner-decor br"></div>

<!-- Main UI Grid -->
<div class="ui-grid">

  <!-- Header -->
  <header class="hud-header">
    <!-- Left: Wave (Reset to Start State) -->
    <div class="hud-item hud-left">
      <span class="hud-label">System Status</span>
      <div class="hud-value">STANDBY</div>
    </div>
    
    <!-- Center: HP (Cyan = Good) -->
    <div class="hud-item hud-center">
      <span class="hud-label">Planet Integrity</span>
      <div class="hud-value hp-value">100%</div>
    </div>

    <!-- Right: Credits (Start Bonus) -->
    <div class="hud-item hud-right">
      <span class="hud-label">Credits</span>
      <div class="hud-value credits-value" id="hud-credits">500</div>
    </div>
  </header>

  <!-- Center Stage -->
  <main class="center-stage">
    <h1 class="game-title">
      <span>Tactical Ops</span>
      Planet Defense
    </h1>
    
    <div class="mission-panel">
      <p class="mission-text">
        <strong>COMMANDER:</strong> Orbital shields are failing. Hostile swarms detected in Sector 7. 
        <br>Allocate credits to turret systems below.
      </p>
    </div>

    <button class="start-btn shape-chamfer">Initialize Defense</button>
  </main>

  <!-- Upgrade Dock -->
  <div class="upgrade-dock">
    
    <!-- Damage (Red Bar) -->
    <div class="upgrade-btn damage shape-chamfer" onclick="buyUpgrade('damage')">
      <div class="u-header">
        <div class="u-icon-title">
          <!-- Lightning Icon -->
          <svg class="u-icon" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          <div class="u-title">DMG Output</div>
        </div>
        <div class="u-cost" id="cost-damage">150</div>
      </div>
      <div class="u-level" id="lvl-damage">Level: 0</div>
      <div class="u-bar-track">
        <div class="u-bar-fill" id="bar-damage" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Fire Rate (Yellow Bar) -->
    <div class="upgrade-btn rate shape-chamfer" onclick="buyUpgrade('rate')">
      <div class="u-header">
        <div class="u-icon-title">
          <!-- Speed/Rate Icon -->
          <svg class="u-icon" viewBox="0 0 24 24"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 3.73-2.56 6.86-6.02 7.75l-.98 1.97c-.43.86-1.56 1.2-2.42.77-.86-.43-1.2-1.56-.77-2.42l1.02-2.04c-3.25-.9-5.82-3.9-5.82-7.48 0-4.42 3.58-8.05 8.05-8.05h.05zm-1 6.95h-2v3.5h-2l3 4.5 3-4.5h-2z"/></svg>
          <div class="u-title">Fire Rate</div>
        </div>
        <div class="u-cost" id="cost-rate">120</div>
      </div>
      <div class="u-level" id="lvl-rate">Level: 0</div>
      <div class="u-bar-track">
        <div class="u-bar-fill" id="bar-rate" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Speed (Green Bar) -->
    <div class="upgrade-btn speed shape-chamfer" onclick="buyUpgrade('speed')">
      <div class="u-header">
        <div class="u-icon-title">
          <!-- Reload/Refresh Icon -->
          <svg class="u-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          <div class="u-title">Reload SPD</div>
        </div>
        <div class="u-cost" id="cost-speed">200</div>
      </div>
      <div class="u-level" id="lvl-speed">Level: 0</div>
      <div class="u-bar-track">
        <div class="u-bar-fill" id="bar-speed" style="width: 0%;"></div>
      </div>
    </div>

  </div>

</div>

<script>
/**
 * PLANET DEFENSE VISUAL ENGINE
 * Renders a stylized, "threatened" planetary surface.
 */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let stars = [];
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  cy = height / 2 + 50; // Center slightly lower
  initStars();
}

function initStars() {
  stars = [];
  const numStars = 300;
  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      speed: Math.random() * 0.1 + 0.02,
      alpha: Math.random()
    });
  }
}

function drawNebula() {
  // Deep atmospheric background gradient
  const gradient = ctx.createRadialGradient(cx, cy, Math.min(width, height) * 0.2, cx, cy, Math.max(width, height) * 0.8);
  gradient.addColorStop(0, 'rgba(0, 40, 60, 0.2)');
  gradient.addColorStop(0.6, 'rgba(0, 10, 20, 0.1)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
}

function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.01 + star.x));
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Parallax drift
    star.y += star.speed;
    if (star.y > height) star.y = 0;
  });
  ctx.globalAlpha = 1.0;
}

function drawPlanet() {
  const radius = Math.min(width, height) * 0.45;
  
  // 1. Atmosphere Glow (Holographic feel)
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius * 1.5);
  glow.addColorStop(0, 'rgba(0, 240, 255, 0.15)');
  glow.addColorStop(0.5, 'rgba(0, 240, 255, 0.05)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.5, 0, Math.PI * 2);
  ctx.fill();

  // 2. Planet Body (Darkened for text contrast)
  ctx.save();
  ctx.translate(cx, cy);
  
  // Planet Sphere (Dark body)
  const planetGrad = ctx.createRadialGradient(-radius*0.3, -radius*0.3, radius*0.1, 0, 0, radius);
  planetGrad.addColorStop(0, '#111a22'); // Slightly lighter top
  planetGrad.addColorStop(1, '#05070a'); // Deep shadow bottom
  
  ctx.fillStyle = planetGrad;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();

  // Wireframe Grid (Latitude/Longitude) - Stronger Cyan
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 1;
  
  // Longitudes
  for(let i=1; i<=3; i++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * (i/4), radius, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Latitudes
  for(let i=-2; i<=2; i++) {
    ctx.beginPath();
    let y = i * (radius * 0.4);
    let r = Math.sqrt(Math.pow(radius, 2) - Math.pow(y, 2));
    if (r > 0) {
        ctx.ellipse(0, y, r, Math.abs(y) * 0.1 + 2, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
  }

  // "Threatened" Visual: Impact Zones / Cracks (Red glow)
  ctx.fillStyle = 'rgba(255, 56, 96, 0.15)';
  for(let i=0; i<3; i++) {
    ctx.beginPath();
    // Static impact zones
    let angle = (i * 2.1); 
    let dist = radius * 0.5;
    ctx.arc(Math.cos(angle)*dist, Math.sin(angle)*dist * 0.8, radius*0.15, 0, Math.PI*2);
    ctx.fill();
  }

  // Orbital Ring (Front)
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(0, 240, 255, 0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 1.8, radius * 0.2, Math.PI / 12, Math.PI, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function animate() {
  // Clear with deep background color
  ctx.fillStyle = '#03050a';
  ctx.fillRect(0, 0, width, height);
  
  time++;
  
  drawNebula();
  drawStars();
  drawPlanet();
  
  requestAnimationFrame(animate);
}

// --- GAME LOGIC (Start Screen Simulation) ---
const gameState = {
  credits: 500,
  upgrades: {
    damage: { level: 0, cost: 150, max: 10 },
    rate: { level: 0, cost: 120, max: 10 },
    speed: { level: 0, cost: 200, max: 10 }
  }
};

function updateUI() {
  // Update Credits
  document.getElementById('hud-credits').innerText = gameState.credits;

  // Update Upgrade Cards
  ['damage', 'rate', 'speed'].forEach(type => {
    const data = gameState.upgrades[type];
    
    // Update Text
    document.getElementById(`lvl-${type}`).innerText = `Level: ${data.level}`;
    document.getElementById(`cost-${type}`).innerText = data.cost;
    
    // Update Bar Width
    const widthPct = (data.level / data.max) * 100;
    document.getElementById(`bar-${type}`).style.width = `${widthPct}%`;
    
    // Update Disabled State Visuals
    const btn = document.querySelector(`.upgrade-btn.${type}`);
    if (gameState.credits < data.cost || data.level >= data.max) {
      btn.classList.add('disabled');
    } else {
      btn.classList.remove('disabled');
    }
  });
}

function buyUpgrade(type) {
  const data = gameState.upgrades[type];
  if (gameState.credits >= data.cost && data.level < data.max) {
    gameState.credits -= data.cost;
    data.level++;
    data.cost = Math.floor(data.cost * 1.3); // Cost scaling
    updateUI();
  }
}

// Init
window.addEventListener('resize', resize);
resize();
animate();
updateUI(); // Initial UI State

</script>
</body>
