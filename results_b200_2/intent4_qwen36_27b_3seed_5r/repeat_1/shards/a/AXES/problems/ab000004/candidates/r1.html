<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense</title>
<style>
  :root {
    /* Refined Color System */
    --bg-deep: #05070a;
    --bg-panel: rgba(10, 15, 25, 0.85);
    
    /* Primary Tactical Cyan */
    --primary: #00f0ff;
    --primary-dim: rgba(0, 240, 255, 0.15);
    --primary-glow: rgba(0, 240, 255, 0.6);
    
    /* Semantic Upgrade Colors */
    --stat-dmg: #ff3860; /* Red/Pink for Damage */
    --stat-rate: #ffcc00; /* Yellow for Fire Rate */
    --stat-speed: #00ff9d; /* Green for Speed */
    
    /* Text */
    --text-main: #e0f7fa;
    --text-muted: #8b9bb4;
    
    /* Typography */
    --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    --font-mono: 'Consolas', 'Monaco', monospace;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-deep);
    font-family: var(--font-ui);
    color: var(--text-main);
  }

  /* --- LAYOUT GRID --- */
  /* Establishing a strict geometric grid */
  .ui-grid {
    position: relative;
    z-index: 20;
    display: grid;
    grid-template-columns: 250px 1fr 250px;
    grid-template-rows: auto 1fr auto auto;
    height: 100vh;
    width: 100vw;
    padding: 2rem;
    gap: 1rem;
  }

  /* --- HUD HEADER --- */
  .hud-header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 1rem;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    text-transform: uppercase;
  }

  .hud-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--primary);
    letter-spacing: 2px;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  .hud-value {
    font-family: var(--font-mono);
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px var(--primary-glow);
    line-height: 1;
  }
  
  .hud-sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-left: 5px;
  }

  /* --- CENTER STAGE (Vertical Flow) --- */
  .center-stage {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    /* Ensure it sits above the planet visual but below HUD */
  }

  /* Title: Reduced scale, better hierarchy */
  .game-title {
    font-family: var(--font-ui);
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: -1px;
    margin: 0 0 2rem 0;
    text-transform: uppercase;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    position: relative;
  }
  
  .game-title span {
    display: block;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.5em;
    color: var(--primary);
    margin-bottom: 0.5rem;
    opacity: 0.8;
  }

  /* Mission Brief: Unified container */
  .mission-panel {
    background: linear-gradient(90deg, transparent 0%, var(--bg-panel) 10%, var(--bg-panel) 90%, transparent 100%);
    border-top: 1px solid var(--primary);
    border-bottom: 1px solid var(--primary);
    padding: 1.5rem 3rem;
    max-width: 600px;
    margin-bottom: 3rem;
    text-align: center;
    position: relative;
    backdrop-filter: blur(4px);
  }

  .mission-panel::before, .mission-panel::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    background: var(--primary);
    transform: translateY(-50%);
    box-shadow: 0 0 5px var(--primary);
  }
  .mission-panel::before { left: 0; }
  .mission-panel::after { right: 0; }

  .mission-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text-main);
    letter-spacing: 0.5px;
  }

  .mission-text strong {
    color: var(--primary);
    font-family: var(--font-mono);
  }

  /* Start Button: Solid, geometric, high contrast */
  .start-btn {
    background: var(--primary);
    color: #000;
    border: none;
    padding: 1.2rem 4rem;
    font-family: var(--font-ui);
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 20px var(--primary-dim);
  }

  .start-btn:hover {
    background: #fff;
    box-shadow: 0 0 40px var(--primary-glow);
    transform: translateY(-2px);
  }

  .start-btn:active {
    transform: translateY(1px);
    filter: brightness(0.9);
  }

  /* --- FOOTER / UPGRADES --- */
  /* Anchored to the center column to look like pre-game settings */
  .upgrade-dock {
    grid-column: 2;
    grid-row: 3;
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: auto; /* Push to bottom of available space in col */
    padding-bottom: 2rem;
    width: 100%;
    max-width: 800px;
    align-self: end;
  }

  /* Upgrade Cards: Actionable buttons, distinct colors */
  .upgrade-btn {
    flex: 1;
    background: rgba(10, 15, 25, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-top: 2px solid transparent;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 120px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    /* Chamfered corners */
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .upgrade-btn:hover {
    background: rgba(255,255,255,0.05);
    transform: translateY(-5px);
  }

  /* Specific Card Styles */
  .upgrade-btn.damage { border-top-color: var(--stat-dmg); }
  .upgrade-btn.damage:hover { box-shadow: 0 5px 15px rgba(255, 56, 96, 0.2); border-color: var(--stat-dmg); }
  
  .upgrade-btn.rate { border-top-color: var(--stat-rate); }
  .upgrade-btn.rate:hover { box-shadow: 0 5px 15px rgba(255, 204, 0, 0.2); border-color: var(--stat-rate); }
  
  .upgrade-btn.speed { border-top-color: var(--stat-speed); }
  .upgrade-btn.speed:hover { box-shadow: 0 5px 15px rgba(0, 255, 157, 0.2); border-color: var(--stat-speed); }

  .u-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .u-title {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
  }

  .u-cost {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 2px;
  }

  .u-level {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Progress Bars */
  .u-bar-track {
    height: 6px;
    width: 100%;
    background: rgba(255,255,255,0.1);
    margin-top: auto;
    border-radius: 2px;
    overflow: hidden;
  }

  .u-bar-fill {
    height: 100%;
    width: 0%; /* Set inline */
    background: #fff;
    box-shadow: 0 0 5px currentColor;
  }
  
  .damage .u-bar-fill { background: var(--stat-dmg); color: var(--stat-dmg); }
  .rate .u-bar-fill { background: var(--stat-rate); color: var(--stat-rate); }
  .speed .u-bar-fill { background: var(--stat-speed); color: var(--stat-speed); }

  /* --- VISUAL EFFECTS --- */
  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 50;
    opacity: 0.5;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 40;
  }

  /* Background Canvas */
  #scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
  }

  /* Corner Decorations */
  .corner-decor {
    position: absolute;
    width: 40px; height: 40px;
    border: 2px solid var(--primary);
    opacity: 0.4;
    z-index: 30;
    pointer-events: none;
  }
  .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
  .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
  .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

</style>
</head>
<body>

<!-- Background -->
<div id="scene-container">
  <canvas id="bgCanvas"></canvas>
</div>

<!-- Overlays -->
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="corner-decor tl"></div>
<div class="corner-decor tr"></div>
<div class="corner-decor bl"></div>
<div class="corner-decor br"></div>

<!-- Main UI Grid -->
<div class="ui-grid">

  <!-- Header -->
  <header class="hud-header">
    <div class="hud-item">
      <span class="hud-label">Wave</span>
      <div class="hud-value">00<span class="hud-sub">/ 12</span></div>
    </div>
    
    <div class="hud-item" style="align-items: center;">
      <span class="hud-label" style="color:#ff3860; animation: pulse 2s infinite;">PLANET INTEGRITY</span>
      <div class="hud-value" style="color: #ff3860;">100<span class="hud-sub">%</span></div>
    </div>

    <div class="hud-item" style="align-items: flex-end;">
      <span class="hud-label">Credits</span>
      <div class="hud-value" style="color: #ffd700;">1,450</div>
    </div>
  </header>

  <!-- Center Stage -->
  <main class="center-stage">
    <h1 class="game-title">
      <span>TACTICAL OPS</span>
      Planet Defense
    </h1>
    
    <div class="mission-panel">
      <p class="mission-text">
        <strong>COMMANDER:</strong> Orbital shields are failing. Hostile swarms detected in Sector 7. 
        <br>Allocate credits to turret systems immediately.
      </p>
    </div>

    <button class="start-btn">Initialize Defense</button>
  </main>

  <!-- Upgrade Dock -->
  <div class="upgrade-dock">
    
    <!-- Damage (Red) -->
    <div class="upgrade-btn damage">
      <div class="u-header">
        <div>
          <div class="u-title">DMG OUTPUT</div>
          <div class="u-level">Lvl 3</div>
        </div>
        <div class="u-cost">500 C</div>
      </div>
      <div class="u-bar-track">
        <div class="u-bar-fill" style="width: 60%;"></div>
      </div>
    </div>

    <!-- Fire Rate (Yellow) -->
    <div class="upgrade-btn rate">
      <div class="u-header">
        <div>
          <div class="u-title">FIRE RATE</div>
          <div class="u-level">Lvl 1</div>
        </div>
        <div class="u-cost">350 C</div>
      </div>
      <div class="u-bar-track">
        <div class="u-bar-fill" style="width: 25%;"></div>
      </div>
    </div>

    <!-- Speed (Green) -->
    <div class="upgrade-btn speed">
      <div class="u-header">
        <div>
          <div class="u-title">RELOAD SPD</div>
          <div class="u-level">Lvl 5</div>
        </div>
        <div class="u-cost">800 C</div>
      </div>
      <div class="u-bar-track">
        <div class="u-bar-fill" style="width: 85%;"></div>
      </div>
    </div>

  </div>

</div>

<script>
/**
 * PLANET DEFENSE VISUAL ENGINE
 * Renders a holographic, wireframe planet in the background.
 * The orbital ring is drawn strictly behind the UI (z-index 0).
 */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let stars = [];
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  cy = height / 2 + 50; // Center slightly lower to balance UI
  initStars();
}

function initStars() {
  stars = [];
  const numStars = 300;
  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      speed: Math.random() * 0.2 + 0.05,
      alpha: Math.random()
    });
  }
}

function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.02 + star.x));
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Parallax drift
    star.y += star.speed;
    if (star.y > height) star.y = 0;
  });
  ctx.globalAlpha = 1.0;
}

function drawPlanet() {
  const radius = Math.min(width, height) * 0.35;
  
  // 1. Atmosphere Glow (Holographic feel)
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius * 1.5);
  glow.addColorStop(0, 'rgba(0, 240, 255, 0.05)');
  glow.addColorStop(0.5, 'rgba(0, 240, 255, 0.02)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.5, 0, Math.PI * 2);
  ctx.fill();

  // 2. Wireframe Planet Base
  ctx.save();
  ctx.translate(cx, cy);
  
  // Back of Orbital Ring (Drawn first)
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 1.8, radius * 0.2, Math.PI / 12, 0, Math.PI); 
  ctx.stroke();

  // Planet Sphere (Dark body)
  const planetGrad = ctx.createRadialGradient(-radius*0.3, -radius*0.3, radius*0.1, 0, 0, radius);
  planetGrad.addColorStop(0, '#1a2530');
  planetGrad.addColorStop(1, '#05070a');
  
  ctx.fillStyle = planetGrad;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();

  // Wireframe Grid (Latitude/Longitude)
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 1;
  
  // Longitudes
  for(let i=1; i<=3; i++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * (i/4), radius, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Latitudes
  for(let i=-2; i<=2; i++) {
    ctx.beginPath();
    let y = i * (radius * 0.4);
    let r = Math.sqrt(Math.pow(radius, 2) - Math.pow(y, 2));
    if (r > 0) {
        ctx.ellipse(0, y, r, Math.abs(y) * 0.1 + 2, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
  }

  // "Continents" - Abstract Tech Shapes
  ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
  for(let i=0; i<4; i++) {
    ctx.beginPath();
    let angle = (time * 0.001) + (i * 1.5);
    let dist = radius * 0.6;
    ctx.arc(Math.cos(angle)*dist, Math.sin(angle)*dist * 0.8, radius*0.3, 0, Math.PI*2);
    ctx.fill();
  }

  // Front of Orbital Ring (Drawn last)
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
  ctx.lineWidth = 3;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(0, 240, 255, 0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 1.8, radius * 0.2, Math.PI / 12, Math.PI, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Satellite
  const satAngle = time * 0.015;
  const satX = Math.cos(satAngle) * (radius * 1.8);
  const satY = Math.sin(satAngle) * (radius * 0.2);
  
  // Only draw if on front side (sin > 0)
  if (Math.sin(satAngle) > 0) {
     ctx.fillStyle = '#fff';
     ctx.beginPath();
     ctx.arc(satX, satY, 4, 0, Math.PI*2);
     ctx.fill();
  }

  ctx.restore();
}

function animate() {
  // Clear with deep background color
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, width, height);
  
  time++;
  
  drawStars();
  drawPlanet();
  
  requestAnimationFrame(animate);
}

// Init
window.addEventListener('resize', resize);
resize();
animate();

</script>
</body>
</html>
