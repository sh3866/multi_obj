<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Storybook / Nature Palette --- */
            /* Backgrounds */
            --bg-paper: #F7F3E8;
            --bg-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            
            /* Board Wood Frame */
            --wood-frame-top: #8D6E63;
            --wood-frame-side: #5D4037;
            --wood-frame-bottom: #3E2723;
            --wood-frame-border: #3E2723;
            
            /* Tiles (Garden Stone) */
            --tile-base: #EFEBE9;
            --tile-highlight: #FFFFFF;
            --tile-shadow: #D7CCC8;
            
            /* Paths (Dirt/Roots) */
            --path-color: #795548;
            --path-shadow: #3E2723;
            --path-highlight: #A1887F;
            
            /* Characters (Warm Brown Cub) */
            --cub-fur: #6D4C41;
            --cub-fur-light: #8D6E63;
            --cub-snout: #D7CCC8;
            
            /* Star (Golden) */
            --star-gold: #FFD54F;
            --star-stroke: #FF8F00;
            
            /* UI */
            --text-primary: #4E342E;
            --text-secondary: #8D6E63;
            --btn-primary: #FF7043; /* Terracotta */
            --btn-shadow: #D84315;
            --btn-ghost: transparent;
            --btn-ghost-text: #8D6E63;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            background-image: var(--bg-grain);
            font-family: "Georgia", "Times New Roman", serif; /* Storybook Serif */
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* --- Header (Refined Hierarchy) --- */
        header {
            text-align: center;
            margin-bottom: 10px; /* Tightened */
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem; /* Reduced scale */
            margin: 0;
            line-height: 1;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.9);
            transform: rotate(-1deg); /* Playful tilt */
        }

        .level-badge {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-top: 4px;
            background: rgba(255,255,255,0.6);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(78, 52, 46, 0.1);
        }

        /* --- Game Board (Unified Container) --- */
        .game-wrapper {
            position: relative;
            padding: 14px;
            background: linear-gradient(160deg, var(--wood-frame-top), var(--wood-frame-bottom));
            border-radius: 20px;
            border: 2px solid var(--wood-frame-border);
            box-shadow: 
                0 20px 40px -10px rgba(62, 39, 35, 0.4), /* Deep shadow */
                inset 0 2px 4px rgba(255,255,255,0.3), /* Top bevel */
                inset 0 -2px 4px rgba(0,0,0,0.5);      /* Bottom bevel */
            transform: translateY(0);
        }

        /* Decorative Vines (SVG Overlay) */
        .vine-decor {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }
        .vine-top-left { top: -15px; left: -10px; width: 60px; height: 60px; }
        .vine-bottom-right { bottom: -15px; right: -10px; width: 60px; height: 60px; transform: rotate(180deg); }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px; /* Consistent Gap */
            background-color: #3E2723; /* Dark gap color */
            padding: 6px;
            border-radius: 12px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6); /* Inner depth */
            position: relative;
        }

        /* --- Tiles --- */
        .tile {
            width: 64px;
            height: 64px;
            background-color: var(--tile-base);
            /* Subtle texture via gradient */
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 60%);
            border-radius: 8px;
            position: relative;
            border: 1px solid var(--tile-shadow);
            /* Tactile inset look */
            box-shadow: 
                inset 1px 1px 2px rgba(255,255,255,0.6),
                inset -2px -2px 4px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s ease;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-2px);
            z-index: 2;
        }
        .tile:active {
            transform: scale(0.96);
        }

        /* --- Paths (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--path-color);
            stroke-width: 12px; /* Standardized width */
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Subtle 3D bevel on paths */
            filter: drop-shadow(1px 1px 0px var(--path-shadow)) 
                    drop-shadow(-1px -1px 0px var(--path-highlight));
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active Path State (Orange) */
        .path-active {
            stroke: var(--btn-primary) !important;
            filter: drop-shadow(1px 1px 0px var(--btn-shadow)) 
                    drop-shadow(-1px -1px 0px #FFCCBC) !important;
        }

        /* --- Characters --- */
        
        /* The Cub (Warm Brown, Tactile) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
        }

        .cub-svg {
            width: 100%;
            height: 100%;
        }

        /* The Star (3D-ish, Glowing) */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(255, 143, 0, 0.3));
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-4px) rotate(5deg); }
        }

        /* --- Footer (Controls) --- */
        footer {
            margin-top: 16px; /* Tightened */
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        button {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 28px;
            border: none;
            border-radius: 12px; /* Unified Radius */
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            outline: none;
        }

        /* Reset (Ghost Style) */
        .btn-reset {
            background-color: transparent;
            color: var(--btn-ghost-text);
            border: 1px solid rgba(141, 110, 99, 0.2);
        }
        .btn-reset:hover {
            background-color: rgba(0,0,0,0.03);
            color: var(--text-primary);
            border-color: rgba(141, 110, 99, 0.4);
        }
        .btn-reset:active {
            transform: translateY(2px);
        }

        /* Run (Primary Tactile) */
        .btn-run {
            background-color: var(--btn-primary);
            color: white;
            box-shadow: 
                0 4px 0 var(--btn-shadow),
                0 6px 12px rgba(0,0,0,0.1);
            transform: translateY(0);
        }
        
        .btn-run:hover {
            background-color: #FF8A65;
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 var(--btn-shadow),
                0 10px 16px rgba(0,0,0,0.15);
        }
        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--btn-shadow);
        }

        /* --- Responsive --- */
        @media (max-width: 400px) {
            h1 { font-size: 1.8rem; }
            .tile { width: 56px; height: 56px; }
            .cub-token { width: 34px; height: 34px; }
            .star-marker { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="level-badge">Level 01 — The Garden Path</div>
    </header>

    <div class="game-wrapper">
        <!-- Decorative Vines -->
        <svg class="vine-decor vine-top-left" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#A5D6A7" stroke-width="4" stroke-linecap="round"/>
            <circle cx="25" cy="60" r="4" fill="#81C784"/>
            <circle cx="45" cy="35" r="5" fill="#66BB6A"/>
            <path d="M25 60 Q 35 50 40 55" stroke="#4CAF50" stroke-width="2" fill="none"/>
        </svg>
        <svg class="vine-decor vine-bottom-right" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#A5D6A7" stroke-width="4" stroke-linecap="round"/>
            <circle cx="25" cy="60" r="4" fill="#81C784"/>
            <circle cx="45" cy="35" r="5" fill="#66BB6A"/>
        </svg>

        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker (Star)
            const endTile = getTile(END.x, END.y);
            if(endTile) endTile.el.appendChild(createStarSVG());

            // Add Cub Token
            const startTile = getTile(START.x, START.y);
            if(startTile) startTile.el.appendChild(createCubToken());
        }

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            el.addEventListener('click', () => {
                el.style.transform = 'scale(0.95)';
                setTimeout(() => el.style.transform = '', 100);
            });

            return { el, x, y, connections, path };
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("fill", "var(--star-gold)");
            path.setAttribute("stroke", "var(--star-stroke)");
            path.setAttribute("stroke-width", "1.5");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        function createCubToken() {
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            // Warm, tactile SVG Cub
            cub.innerHTML = `
                <svg class="cub-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ears -->
                    <circle cx="25" cy="30" r="12" fill="var(--cub-fur)" stroke="var(--cub-fur-light)" stroke-width="2"/>
                    <circle cx="75" cy="30" r="12" fill="var(--cub-fur)" stroke="var(--cub-fur-light)" stroke-width="2"/>
                    
                    <!-- Head Base -->
                    <path d="M20 40 Q 50 10 80 40 Q 100 70 80 90 Q 50 110 20 90 Q 0 70 20 40" fill="var(--cub-fur)" stroke="var(--cub-fur-light)" stroke-width="2"/>
                    
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="18" ry="14" fill="var(--cub-snout)"/>
                    
                    <!-- Eyes -->
                    <circle cx="35" cy="50" r="3" fill="#3E2723"/>
                    <circle cx="65" cy="50" r="3" fill="#3E2723"/>
                    
                    <!-- Nose -->
                    <ellipse cx="50" cy="60" rx="5" ry="3" fill="#3E2723"/>
                    
                    <!-- Mouth -->
                    <path d="M45 68 Q 50 72 55 68" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            `;
            return cub;
        }

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset visuals
            tiles.forEach(t => {
                t.path.classList.remove('path-active');
            });

            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            if (!cub) return;

            // Reset previous run
            tiles.forEach(t => t.path.classList.remove('path-active'));

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // Highlight start
            const startTile = getTile(current.x, current.y);
            startTile.path.classList.add('path-active');

            // BFS Pathfinding
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.path.classList.add('path-active');
                }
            } else {
                // Shake animation for fail?
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump Up
                cub.style.transform = "translate(-50%, -50%) scale(0.8) translateY(-15px)";
                
                setTimeout(() => {
                    // Move DOM element
                    targetTile.appendChild(cub);
                    // Drop Down
                    cub.style.transform = "translate(-50%, -50%) scale(1) translateY(0)";
                    resolve();
                }, 150);
            });
        }

        initGame();

    </script>
</body>
</html>
