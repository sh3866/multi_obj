<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette - Storybook / Garden Theme */
            --bg-paper: #fdf6e3;
            --bg-grain: rgba(0,0,0,0.03);
            --wood-deep: #5d4037;
            --wood-light: #8d6e63;
            --wood-frame: #d7ccc8;
            --tile-cream: #fffbf0;
            --tile-shadow: #e0d6c8;
            
            /* Paths */
            --path-color: #3e2723; /* Dark earthy brown */
            --path-highlight: #5d4037;
            --path-width: 16px;
            
            /* Accents */
            --accent-gold: #fbc02d;
            --accent-gold-shadow: #f57f17;
            --accent-blue: #5c6bc0; /* Cub color */
            --accent-blue-shadow: #3949ab;
            --btn-primary: #ef6c00; /* Vibrant Orange */
            --btn-primary-shadow: #bf360c;
            
            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Dimensions */
            --grid-size: 5;
            --cell-size: 72px;
            --gap: 8px;
            --board-padding: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Paper grain texture using inline SVG data URI */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: var(--font-display);
            color: #3e2723;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: -0.5px;
            color: #3e2723;
            font-weight: 700;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
            /* Playful curve to text */
            transform: rotate(-1deg);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #8d6e63;
            margin-top: 8px;
            font-weight: 600;
            background: rgba(255,255,255,0.5);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
        }

        /* --- Game Board Container --- */
        .game-container {
            position: relative;
            padding: var(--board-padding);
            background: linear-gradient(135deg, var(--wood-light), var(--wood-deep));
            border-radius: 18px;
            /* Complex shadow for 3D "Tray" effect */
            box-shadow: 
                0 20px 40px -10px rgba(0,0,0,0.4),
                0 10px 20px -5px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.2);
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Inner rim of the wooden tray */
        .game-container::after {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            pointer-events: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            background-color: var(--wood-deep);
            padding: var(--gap);
            border-radius: 10px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5); /* Deep inset for the grid area */
        }

        /* --- Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-cream);
            border-radius: 8px; /* Soft rounded corners */
            position: relative;
            /* "Well" effect: recessed into the board */
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.08),
                inset -1px -1px 2px rgba(255,255,255,0.8),
                0 2px 0 rgba(255,255,255,0.1); /* Subtle highlight on edge */
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden; /* Keep paths inside rounded corners */
        }

        .tile:hover {
            transform: translateY(-2px);
            z-index: 2;
        }
        
        .tile:active {
            transform: scale(0.96);
        }

        /* --- Paths (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .path-line {
            stroke: var(--path-color);
            stroke-width: var(--path-width);
            stroke-linecap: round; /* Crucial for organic look */
            fill: none;
            /* Soft shadow to make path sit on tile */
            filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.3)); 
        }

        /* --- Characters & Markers --- */
        
        /* The Cub */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 52px; /* Larger scale */
            height: 52px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cub-body {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #9fa8da, var(--accent-blue));
            border-radius: 50% 50% 45% 45%; /* Organic blob shape */
            box-shadow: 
                0 6px 10px rgba(0,0,0,0.3),
                inset 2px 2px 6px rgba(255,255,255,0.5),
                inset -2px -2px 6px rgba(0,0,0,0.15);
            position: relative;
        }

        /* Ears */
        .cub-ear {
            position: absolute;
            top: -6px;
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border-radius: 50%;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.2);
        }
        .cub-ear.left { left: 4px; transform: rotate(-15deg); }
        .cub-ear.right { right: 4px; transform: rotate(15deg); }

        /* Face */
        .cub-face {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            display: flex;
            justify-content: space-between;
        }
        .eye {
            width: 5px;
            height: 6px;
            background: #1a237e;
            border-radius: 50%;
            position: relative;
        }
        .eye::after {
            content: '';
            position: absolute;
            top: 1px; left: 1px;
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
        }
        .nose {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 5px;
            background: #1a237e;
            border-radius: 4px 4px 6px 6px;
        }
        .mouth {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 4px;
            border-bottom: 2px solid #1a237e;
            border-radius: 0 0 8px 8px;
        }

        /* The Star (Goal) */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-5px) rotate(5deg); }
        }

        .star-path {
            fill: var(--accent-gold);
            stroke: var(--accent-gold-shadow);
            stroke-width: 1.5;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.2));
        }

        /* --- Footer / Controls --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 16px; /* Tighter grouping */
            z-index: 10;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1rem;
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn-reset {
            background-color: #efebe9;
            color: #5d4037;
            box-shadow: 
                0 4px 0 #bcaaa4,
                0 5px 10px rgba(0,0,0,0.1);
        }
        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #bcaaa4;
        }

        .btn-run {
            background-color: var(--btn-primary);
            color: white;
            box-shadow: 
                0 6px 0 var(--btn-primary-shadow),
                0 8px 15px rgba(0,0,0,0.2);
            font-size: 1.1rem;
        }
        
        .btn-run:hover {
            background-color: #f57c00;
            transform: translateY(-1px);
            box-shadow: 
                0 7px 0 var(--btn-primary-shadow),
                0 12px 20px rgba(0,0,0,0.25);
        }
        .btn-run:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--btn-primary-shadow);
        }

        /* --- Responsive --- */
        @media (max-width: 500px) {
            :root {
                --cell-size: 60px;
                --gap: 6px;
                --board-padding: 12px;
            }
            h1 { font-size: 1.8rem; }
            .cub-token { width: 44px; height: 44px; }
            footer { gap: 10px; }
            button { padding: 10px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W (Binary mask for connections)
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        // 0,0 is start. 4,4 is end.
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        // Start/End Coordinates
        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker (Star) to END cell
            const endTile = getTile(END.x, END.y);
            if(endTile) endTile.el.appendChild(createStarSVG());

            // Add Cub Token to START cell
            const startTile = getTile(START.x, START.y);
            if(startTile) startTile.el.appendChild(createCubToken());
        }

        // --- SVG Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            el.dataset.conn = connections;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none"); // Fill the tile
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates based on binary mask
            // Center is 50,50. 
            // Paths must extend to the edges (0 or 100) to connect visually.
            let d = "";
            
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            // Interaction (Click to rotate for puzzle feel)
            el.addEventListener('click', () => {
                // Visual feedback only for this demo
                el.style.transform = 'scale(0.95)';
                setTimeout(() => el.style.transform = '', 100);
            });

            return { el, x, y, connections, svg, path };
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            // Standard 5-point star path
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("class", "star-path");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        function createCubToken() {
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = `
                <div class="cub-body">
                    <div class="cub-ear left"></div>
                    <div class="cub-ear right"></div>
                    <div class="cub-face">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>
            `;
            return cub;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            // Remove old cub
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset any visual changes (colors)
            tiles.forEach(t => {
                t.path.style.stroke = "var(--path-color)";
                t.path.style.strokeWidth = "var(--path-width)";
            });

            // Re-init
            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            if (!cub) return;

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // Highlight start
            const startTile = getTile(current.x, current.y);
            startTile.path.style.stroke = "#ef6c00"; // Orange to match button
            startTile.path.style.strokeWidth = "18";

            // BFS to find path to END
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                // Check neighbors
                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Animate Cub along path
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.path.style.stroke = "#ef6c00";
                    tile.path.style.strokeWidth = "18";
                }
                
                // Win state animation
                setTimeout(() => {
                    const body = cub.querySelector('.cub-body');
                    body.style.backgroundColor = "#fbc02d"; // Gold
                    body.style.transform = "scale(1.1)";
                }, 200);

            } else {
                alert("No path found!");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            // North
            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            // East
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            // South
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            // West
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }

            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump animation
                cub.style.transform = "translate(-50%, -50%) scale(0.5) translateY(-20px)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1) translateY(0)";
                    resolve();
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
