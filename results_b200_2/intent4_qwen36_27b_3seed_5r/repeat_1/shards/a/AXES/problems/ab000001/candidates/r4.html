<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Warm, Earthy, Storybook --- */
            --bg-wallpaper: #F0E6D2;
            --bg-paper: #FDFBF7;
            
            /* Wood / Bookbinding */
            --wood-dark: #4E342E;
            --wood-mid: #6D4C41;
            --wood-light: #8D6E63;
            --wood-highlight: #A1887F;
            
            /* Board Surface */
            --board-bg: #EFEBE9;
            --tile-base: #FFFFFF;
            --tile-shadow: #D7CCC8;
            --tile-border: #EFEBE9;
            
            /* Paths */
            --path-color: #5D4037;
            --path-highlight: #8D6E63;
            --path-active: #E65100; /* Burnt Orange */
            --path-active-glow: #FFCC80;
            
            /* Characters */
            --cub-brown: #5D4037;
            --cub-skin: #D7CCC8;
            --cub-belly: #EFEBE9;
            --star-gold: #FFD54F;
            --star-glow: rgba(255, 213, 79, 0.6);
            
            /* UI */
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            
            /* Buttons */
            --btn-run-bg: #FF7043;
            --btn-run-border: #D84315;
            --btn-reset-bg: #EFEBE9;
            --btn-reset-border: #BCAAA4;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-wallpaper);
            /* Subtle paper texture via noise */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            font-family: "Georgia", "Times New Roman", serif; /* Fallback for Storybook feel */
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Header: Reduced Scale, Better Hierarchy --- */
        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 24px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 2rem; /* Reduced from 2.2rem */
            margin: 0;
            line-height: 1;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.5px;
            /* Soft ink bleed effect */
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
            transform: rotate(-1deg); /* Playful tilt */
        }

        .level-badge {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-main); /* Higher contrast */
            margin-top: 8px;
            background: var(--bg-paper);
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid #D7CCC8;
            box-shadow: 0 2px 0 #D7CCC8; /* Physical button feel */
            display: inline-block;
        }

        /* --- Game Board: Immersive Wood Frame --- */
        .game-wrapper {
            position: relative;
            padding: 16px;
            /* Rich wood gradient */
            background: linear-gradient(135deg, var(--wood-mid) 0%, var(--wood-dark) 100%);
            border-radius: 24px; /* Soft, organic radius */
            border: 4px solid var(--wood-dark);
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.4), /* Deep cast shadow */
                inset 0 0 0 2px rgba(255,255,255,0.1), /* Inner rim light */
                inset 0 0 20px rgba(0,0,0,0.6); /* Inner depth */
            transform: translateY(0);
        }

        /* Decorative Vines: Crisp SVGs */
        .vine-decor {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }
        .vine-top-left { top: -25px; left: -15px; width: 80px; height: 80px; }
        .vine-bottom-right { bottom: -25px; right: -15px; width: 80px; height: 80px; transform: rotate(180deg); }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background-color: #3E2723; /* Dark recessed area */
            padding: 10px;
            border-radius: 16px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.7);
            position: relative;
        }

        /* --- Tiles: Tactile Cardstock --- */
        .tile {
            width: 60px;
            height: 60px;
            background-color: var(--tile-base);
            /* Soft gradient for paper volume */
            background-image: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border-radius: 12px; /* Unified soft radius */
            position: relative;
            /* Physical inset shadow */
            box-shadow: 
                0 4px 0 var(--tile-shadow),
                0 5px 5px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--tile-shadow);
        }

        /* --- Paths: Painted Stone --- */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--path-color);
            stroke-width: 14px;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* 3D bevel effect via drop shadow */
            filter: drop-shadow(1px 1px 0px rgba(0,0,0,0.2));
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active Path: Glowing Juice */
        .path-active {
            stroke: var(--path-active) !important;
            filter: drop-shadow(0 0 4px var(--path-active-glow));
        }

        /* --- Characters --- */
        
        /* The Cub: Hand-drawn style */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.25));
            transition: all 0.2s ease;
        }

        /* The Star: Magical Glow */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 6px var(--star-glow));
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-4px) rotate(10deg); }
        }

        /* --- Footer: Spacing & Tactile Buttons --- */
        footer {
            margin-top: 32px; /* Increased breathing room */
            display: flex;
            gap: 16px;
            z-index: 10;
            width: 100%;
            justify-content: center;
            padding: 0 20px;
        }

        button {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 800;
            font-size: 1rem;
            padding: 12px 32px;
            border: none;
            border-radius: 16px; /* Unified soft radius */
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            outline: none;
            position: relative;
            min-width: 120px;
        }

        /* Reset: Secondary Wood Block */
        .btn-reset {
            background-color: var(--btn-reset-bg);
            color: var(--text-muted);
            border: 2px solid var(--btn-reset-border);
            box-shadow: 0 4px 0 var(--btn-reset-border);
        }
        .btn-reset:hover {
            background-color: #FFF;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 var(--btn-reset-border);
        }
        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--btn-reset-border);
        }

        /* Run: Primary Terracotta Block */
        .btn-run {
            background-color: var(--btn-run-bg);
            color: white;
            border: 2px solid var(--btn-run-border);
            box-shadow: 0 4px 0 var(--btn-run-border);
        }
        .btn-run:hover {
            background-color: #FF8A65;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--btn-run-border);
        }
        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--btn-run-border);
        }

        /* --- Responsive --- */
        @media (max-width: 400px) {
            h1 { font-size: 1.8rem; }
            .tile { width: 54px; height: 54px; }
            .cub-token { width: 40px; height: 40px; }
            .star-marker { width: 30px; height: 30px; }
            .game-wrapper { padding: 12px; }
            .board { gap: 6px; padding: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="level-badge">Level 01 — The Garden Path</div>
    </header>

    <div class="game-wrapper">
        <!-- Crisp Vector Vines -->
        <svg class="vine-decor vine-top-left" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#81C784" stroke-width="6" stroke-linecap="round"/>
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#A5D6A7" stroke-width="2" stroke-linecap="round"/>
            <!-- Leaves -->
            <path d="M30 60 Q 20 50 15 65 Q 30 70 30 60" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
            <path d="M50 35 Q 40 25 35 40 Q 50 45 50 35" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
            <path d="M70 20 Q 60 10 55 25 Q 70 30 70 20" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
        </svg>
        
        <svg class="vine-decor vine-bottom-right" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#81C784" stroke-width="6" stroke-linecap="round"/>
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#A5D6A7" stroke-width="2" stroke-linecap="round"/>
            <!-- Leaves -->
            <path d="M30 60 Q 20 50 15 65 Q 30 70 30 60" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
            <path d="M50 35 Q 40 25 35 40 Q 50 45 50 35" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
        </svg>

        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker (Star)
            const endTile = getTile(END.x, END.y);
            if(endTile) endTile.el.appendChild(createStarSVG());

            // Add Cub Token
            const startTile = getTile(START.x, START.y);
            if(startTile) startTile.el.appendChild(createCubToken());
        }

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            el.addEventListener('click', () => {
                el.style.transform = 'scale(0.95)';
                setTimeout(() => el.style.transform = '', 100);
            });

            return { el, x, y, connections, path };
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            // Star shape
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("fill", "var(--star-gold)");
            path.setAttribute("stroke", "#FF8F00");
            path.setAttribute("stroke-width", "1");
            path.setAttribute("stroke-linejoin", "round");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        function createCubToken() {
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            // Warm, tactile SVG Cub
            cub.innerHTML = `
                <svg class="cub-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ears -->
                    <circle cx="25" cy="30" r="12" fill="var(--cub-brown)" stroke="var(--cub-skin)" stroke-width="2"/>
                    <circle cx="75" cy="30" r="12" fill="var(--cub-brown)" stroke="var(--cub-skin)" stroke-width="2"/>
                    
                    <!-- Head Base -->
                    <path d="M20 40 Q 50 10 80 40 Q 100 70 80 90 Q 50 110 20 90 Q 0 70 20 40" fill="var(--cub-brown)" stroke="var(--cub-skin)" stroke-width="2"/>
                    
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="18" ry="14" fill="var(--cub-skin)"/>
                    
                    <!-- Eyes -->
                    <circle cx="35" cy="50" r="3" fill="#3E2723"/>
                    <circle cx="65" cy="50" r="3" fill="#3E2723"/>
                    
                    <!-- Nose -->
                    <ellipse cx="50" cy="60" rx="5" ry="3" fill="#3E2723"/>
                    
                    <!-- Mouth -->
                    <path d="M45 68 Q 50 72 55 68" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            `;
            return cub;
        }

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset visuals
            tiles.forEach(t => {
                t.path.classList.remove('path-active');
            });

            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            if (!cub) return;

            // Reset previous run
            tiles.forEach(t => t.path.classList.remove('path-active'));

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // Highlight start
            const startTile = getTile(current.x, current.y);
            startTile.path.classList.add('path-active');

            // BFS Pathfinding
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.path.classList.add('path-active');
                }
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump Up
                cub.style.transform = "translate(-50%, -50%) scale(0.8) translateY(-15px)";
                
                setTimeout(() => {
                    // Move DOM element
                    targetTile.appendChild(cub);
                    // Drop Down
                    cub.style.transform = "translate(-50%, -50%) scale(1) translateY(0)";
                    resolve();
                }, 150);
            });
        }

        initGame();

    </script>
</body>
</html>
