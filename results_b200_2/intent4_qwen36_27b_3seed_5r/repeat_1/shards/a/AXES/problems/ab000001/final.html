<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Deep, Warm Storybook --- */
            --bg-wall: #F3E9D2;
            --bg-page: #FDFBF7;
            
            /* Wood & Frame */
            --wood-dark: #3E2723;
            --wood-mid: #5D4037;
            --wood-light: #795548;
            --wood-grain: rgba(0,0,0,0.15);
            
            /* The Board Surface */
            --board-bg: #EFEBE9;
            --tile-base: #FFF8E1; /* Warm cream, not stark white */
            --tile-shadow: #D7CCC8;
            --tile-bevel: #FFFFFF;
            
            /* Paths: "Garden Vines" */
            --path-color: #4E342E;
            --path-highlight: #8D6E63;
            --path-active: #E65100; /* Deep Terracotta */
            --path-active-glow: #FFCC80;
            
            /* Characters */
            --star-gold: #FFD54F;
            --star-stroke: #F57F17;
            --star-glow: rgba(255, 213, 79, 0.8);
            
            /* Typography */
            --font-display: "Georgia", "Times New Roman", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* UI */
            --text-main: #3E2723;
            --text-muted: #8D6E63;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-wall);
            /* Subtle paper grain */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            font-family: var(--font-display);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Prevent scroll on full screen */
        }

        /* --- Header: Minimal, Contextual --- */
        header {
            text-align: center;
            margin-top: 5vh;
            margin-bottom: 2vh;
            z-index: 10;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            line-height: 1;
            color: var(--wood-dark);
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 0 rgba(255,255,255,0.5);
            opacity: 0.9;
        }

        .level-badge {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--wood-mid);
            margin-top: 6px;
            background: rgba(255,255,255,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* --- Game Board: The Immersive "Garden Bed" --- */
        .game-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .board-frame {
            /* Rich wood gradient */
            background: linear-gradient(145deg, var(--wood-mid) 0%, var(--wood-dark) 100%);
            border-radius: 32px;
            padding: 16px;
            /* Deep, tactile shadows */
            box-shadow: 
                0 20px 40px -10px rgba(62, 39, 35, 0.6),
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        /* Decorative Vines: Integrated */
        .vine-decor {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        .vine-top-left { top: -30px; left: -20px; width: 100px; height: 100px; }
        .vine-bottom-right { bottom: -30px; right: -20px; width: 100px; height: 100px; transform: rotate(180deg); }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background-color: #2D1A11; /* Deep recess */
            padding: 8px;
            border-radius: 24px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.6);
            width: 100%;
            aspect-ratio: 1 / 1; /* Keep it square */
        }

        /* --- Tiles: Tactile Stone/Plaster --- */
        .tile {
            background-color: var(--tile-base);
            /* Organic texture gradient */
            background-image: radial-gradient(circle at 30% 30%, #FFF 0%, #F5EEDC 100%);
            border-radius: 14px;
            position: relative;
            /* Soft, physical inset shadow */
            box-shadow: 
                0 4px 0 var(--tile-shadow),
                0 6px 10px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.8);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.2s ease;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                0 2px 0 var(--tile-shadow),
                0 3px 5px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.8);
        }

        /* --- Paths: Painted/Raised Lines --- */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--path-color);
            stroke-width: 16; /* Thicker, more tactile */
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Subtle bevel for 3D effect */
            filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.4)) drop-shadow(1px 2px 1px rgba(0,0,0,0.2));
            transition: stroke 0.4s ease, filter 0.4s ease;
        }

        /* Active Path: Glowing Juice */
        .path-active {
            stroke: var(--path-active) !important;
            /* Bloom effect */
            filter: drop-shadow(0 0 5px var(--path-active-glow)) drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        /* --- Characters: Rich Illustrations --- */
        
        /* The Cub */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70%; /* Larger relative to tile */
            height: 70%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* The Star */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            height: 50%;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 8px var(--star-glow));
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-4px) rotate(10deg); }
        }

        /* --- Footer: Distinct Hierarchy --- */
        footer {
            margin-bottom: 4vh;
            display: flex;
            gap: 16px;
            z-index: 10;
            width: 100%;
            justify-content: center;
            padding: 0 20px;
            flex-shrink: 0;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 32px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            outline: none;
            position: relative;
            min-width: 110px;
        }

        /* Reset: Secondary (Ghost/Flat) */
        .btn-reset {
            background-color: transparent;
            color: var(--text-muted);
            /* Subtle border only */
            border: 2px solid transparent; 
        }
        .btn-reset:hover {
            background-color: rgba(0,0,0,0.05);
            color: var(--text-main);
        }
        .btn-reset:active {
            transform: scale(0.95);
        }

        /* Run: Primary (Tactile Block) */
        .btn-run {
            background-color: var(--path-active);
            color: white;
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 
                0 6px 0 #BF360C, /* Thick 3D border */
                0 10px 10px rgba(0,0,0,0.15);
        }
        .btn-run:hover {
            background-color: #FF5722;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 #BF360C,
                0 15px 15px rgba(0,0,0,0.2);
        }
        .btn-run:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 #BF360C,
                inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .board-frame { padding: 12px; border-radius: 24px; }
            .board { gap: 4px; padding: 6px; border-radius: 18px; }
            .path-line { stroke-width: 14; }
            .tile { border-radius: 10px; }
            .game-wrapper { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="level-badge">Level 01 — The Garden Path</div>
    </header>

    <div class="game-wrapper">
        <!-- Integrated Vines -->
        <svg class="vine-decor vine-top-left" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#66BB6A" stroke-width="8" stroke-linecap="round"/>
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#A5D6A7" stroke-width="2" stroke-linecap="round"/>
            <!-- Leaves -->
            <path d="M30 60 Q 20 50 15 65 Q 30 70 30 60" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
            <path d="M50 35 Q 40 25 35 40 Q 50 45 50 35" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
            <path d="M70 20 Q 60 10 55 25 Q 70 30 70 20" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
        </svg>
        
        <svg class="vine-decor vine-bottom-right" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#66BB6A" stroke-width="8" stroke-linecap="round"/>
            <path d="M10 90 C 10 50, 30 10, 90 10" stroke="#A5D6A7" stroke-width="2" stroke-linecap="round"/>
            <!-- Leaves -->
            <path d="M30 60 Q 20 50 15 65 Q 30 70 30 60" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
            <path d="M50 35 Q 40 25 35 40 Q 50 45 50 35" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
        </svg>

        <div class="board-frame">
            <div class="board" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker (Star)
            const endTile = getTile(END.x, END.y);
            if(endTile) endTile.el.appendChild(createStarSVG());

            // Add Cub Token
            const startTile = getTile(START.x, START.y);
            if(startTile) startTile.el.appendChild(createCubToken());
        }

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            return { el, x, y, connections, path };
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            // Star shape
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("fill", "var(--star-gold)");
            path.setAttribute("stroke", "var(--star-stroke)");
            path.setAttribute("stroke-width", "1");
            path.setAttribute("stroke-linejoin", "round");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        function createCubToken() {
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            // Warm, tactile SVG Cub
            cub.innerHTML = `
                <svg class="cub-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ears -->
                    <circle cx="25" cy="30" r="12" fill="#5D4037" stroke="#D7CCC8" stroke-width="2"/>
                    <circle cx="75" cy="30" r="12" fill="#5D4037" stroke="#D7CCC8" stroke-width="2"/>
                    
                    <!-- Head Base -->
                    <path d="M20 40 Q 50 10 80 40 Q 100 70 80 90 Q 50 110 20 90 Q 0 70 20 40" fill="#5D4037" stroke="#D7CCC8" stroke-width="2"/>
                    
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="18" ry="14" fill="#D7CCC8"/>
                    
                    <!-- Eyes -->
                    <circle cx="35" cy="50" r="3" fill="#3E2723"/>
                    <circle cx="65" cy="50" r="3" fill="#3E2723"/>
                    
                    <!-- Nose -->
                    <ellipse cx="50" cy="60" rx="5" ry="3" fill="#3E2723"/>
                    
                    <!-- Mouth -->
                    <path d="M45 68 Q 50 72 55 68" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            `;
            return cub;
        }

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset visuals
            tiles.forEach(t => {
                t.path.classList.remove('path-active');
            });

            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            if (!cub) return;

            // Reset previous run
            tiles.forEach(t => t.path.classList.remove('path-active'));

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // Highlight start
            const startTile = getTile(current.x, current.y);
            startTile.path.classList.add('path-active');

            // BFS Pathfinding
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.path.classList.add('path-active');
                }
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump Up
                cub.style.transform = "translate(-50%, -50%) scale(0.8) translateY(-20px)";
                
                setTimeout(() => {
                    // Move DOM element
                    targetTile.appendChild(cub);
                    // Drop Down
                    cub.style.transform = "translate(-50%, -50%) scale(1) translateY(0)";
                    resolve();
                }, 200);
            });
        }

        initGame();

    </script>
</body>
</html>
