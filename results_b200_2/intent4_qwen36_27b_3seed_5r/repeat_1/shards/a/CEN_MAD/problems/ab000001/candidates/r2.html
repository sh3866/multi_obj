<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Earthy Storybook */
            --bg-paper: #f4f1ea;
            --bg-paper-dark: #e0dbd2;
            --frame-wood: #4e342e;
            --frame-shadow: #3e2723;
            --stone-base: #e3dac9;
            --stone-dark: #c7bba5;
            --stone-inner-shadow: rgba(62, 39, 35, 0.3);
            --path-dirt: #6d4c41;
            --path-highlight: #8d6e63;
            --accent-green: #558b2f;
            --accent-green-dark: #33691e;
            --accent-gold: #fbc02d;
            --text-main: #3e2723;
            
            /* Dimensions */
            --grid-size: 5;
            --cell-size: 70px;
            --gap: 8px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-paper);
            /* Complex Parchment Texture */
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.08) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem; /* Reduced size */
            font-weight: 400; /* Reduced weight */
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.5px;
            font-style: italic; /* Storybook flair */
            text-shadow: 0px 2px 0px rgba(255,255,255,0.6);
        }

        .subtitle {
            font-family: sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #8d6e63;
            margin-top: 6px;
            font-weight: 700;
            opacity: 0.7;
        }

        /* --- Board Construction (The Hero) --- */
        .game-container {
            position: relative;
            /* Wood Frame */
            background: linear-gradient(135deg, #6d4c41 0%, #4e342e 100%);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 2px rgba(255,255,255,0.3),
                inset 0 -2px 5px rgba(0,0,0,0.3);
            border: 1px solid #3e2723;
        }

        /* Inner groove for the stones */
        .game-container::after {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px solid rgba(0,0,0,0.4);
            border-radius: 8px;
            pointer-events: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            position: relative;
            z-index: 2;
        }

        /* --- Garden Stone Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--stone-base);
            /* Organic irregularity */
            border-radius: 12% 18% 15% 20% / 15% 12% 22% 18%;
            position: relative;
            cursor: pointer;
            /* Carved look */
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.4),
                inset -3px -3px 8px var(--stone-inner-shadow),
                1px 1px 2px rgba(0,0,0,0.2);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tile:hover {
            transform: scale(1.02);
            z-index: 2;
        }

        /* --- Paths (Carved into Stone) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .path-line {
            stroke: var(--path-dirt);
            stroke-width: 14;
            stroke-linecap: round;
            fill: none;
            /* The Carved Effect: Drop shadow + Highlight */
            filter: drop-shadow(1px 1px 0px var(--stone-base)) drop-shadow(-1px -1px 0px var(--stone-dark));
        }

        /* Active path state */
        .tile.active .path-line {
            stroke: var(--accent-green);
            filter: drop-shadow(1px 1px 0px var(--stone-base)) drop-shadow(0px 0px 4px rgba(85, 139, 47, 0.6));
        }

        /* --- Game Assets --- */

        /* The Goal: Glowing Bone */
        .goal-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
            z-index: 5;
            animation: pulse-glow 2s infinite ease-in-out;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 5px var(--accent-gold)); }
            50% { transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 0 12px var(--accent-gold)); }
        }

        /* The Cub: Illustrated Bear */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 54px;
            height: 54px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bear-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            animation: bear-bounce 3s infinite ease-in-out;
        }

        @keyframes bear-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .bear-head {
            width: 44px;
            height: 40px;
            background: #8d6e63;
            border-radius: 50% 50% 45% 45%;
            position: absolute;
            top: 10px;
            left: 5px;
            box-shadow: inset 3px 3px 5px rgba(255,255,255,0.2), inset -2px -2px 5px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .bear-ear {
            width: 16px;
            height: 16px;
            background: #795548;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            z-index: 1;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3);
        }
        .bear-ear.left { left: 4px; }
        .bear-ear.right { right: 4px; }

        .bear-eye {
            width: 5px;
            height: 5px;
            background: #212121;
            border-radius: 50%;
            position: absolute;
            top: 14px;
            z-index: 3;
        }
        .bear-eye.left { left: 10px; }
        .bear-eye.right { right: 10px; }
        .bear-eye::after {
            content:''; position: absolute; top:0; left:1px; width:2px; height:2px; background:white; border-radius:50%;
        }

        .bear-snout {
            width: 20px;
            height: 14px;
            background: #d7ccc8;
            border-radius: 12px;
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1);
        }

        .bear-nose {
            width: 8px;
            height: 5px;
            background: #3e2723;
            border-radius: 4px;
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- UI Controls: Die-cut Tactile --- */
        footer {
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            /* Group closer */
        }

        button {
            font-family: 'Georgia', serif;
            border: none;
            cursor: pointer;
            outline: none;
            position: relative;
            color: #fff;
            /* Die-cut shape */
            border-radius: 8px 12px 10px 14px; 
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Wood Button Texture */
        button::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 3h1v1H1V3zm2-2h1v1H3V1z' fill='%23000000' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.3;
            border-radius: inherit;
            pointer-events: none;
        }

        .btn-run {
            background: linear-gradient(to bottom, #689f38, #558b2f);
            font-size: 1.2rem;
            font-weight: 700;
            padding: 12px 36px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 
                0 6px 0 #33691e, 
                0 10px 10px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        .btn-run:active {
            transform: translateY(2px);
            box-shadow: 
                0 2px 0 #33691e, 
                0 4px 4px rgba(0,0,0,0.2);
        }

        .btn-reset {
            background: linear-gradient(to bottom, #d7ccc8, #bcaaa4);
            color: #4e342e;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 18px;
            box-shadow: 
                0 4px 0 #a1887f, 
                0 6px 6px rgba(0,0,0,0.15);
        }

        .btn-reset:active {
            transform: translateY(2px);
            box-shadow: 
                0 2px 0 #a1887f, 
                0 3px 3px rgba(0,0,0,0.15);
        }

        /* --- Responsive --- */
        @media (max-width: 500px) {
            :root { --cell-size: 58px; }
            h1 { font-size: 1.8rem; }
            .game-container { padding: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // Level Map
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Goal Marker (Bone SVG)
            const endTile = getTile(END.x, END.y);
            const boneWrapper = document.createElement('div');
            boneWrapper.className = 'goal-marker';
            boneWrapper.innerHTML = `<svg viewBox="0 0 24 24" fill="#fff" stroke="#f57f17" stroke-width="1">
                <path d="M17.5,7.5c-1.5-1.5-4-1.5-5.5,0l-5,5c-1.5,1.5-1.5,4,0,5.5s4,1.5,5.5,0l5-5C19,11.5,19,9,17.5,7.5z M7,17c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S8.1,17,7,17z M17,7c1.1,0,2,0.9,2,2s-0.9,2-2,2s-2-0.9-2-2S15.9,7,17,7z"/>
            </svg>`;
            endTile.el.appendChild(boneWrapper);

            // Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = `
                <div class="bear-wrapper">
                    <div class="bear-ear left"></div>
                    <div class="bear-ear right"></div>
                    <div class="bear-head">
                        <div class="bear-eye left"></div>
                        <div class="bear-eye right"></div>
                        <div class="bear-snout">
                            <div class="bear-nose"></div>
                        </div>
                    </div>
                </div>
            `;
            getTile(START.x, START.y).el.appendChild(cub);
        }

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Draw path lines
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            return { el, x, y, connections, path };
        }

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();
            
            tiles.forEach(t => {
                t.el.classList.remove('active');
            });

            initGame();
        }

        async function runGame() {
            // BFS Solver
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let visited = new Set();
            visited.add(`${START.x},${START.y}`);
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({x: n.x, y: n.y, path: [...curr.path, n]});
                    }
                }
            }

            if (found) {
                const cub = document.getElementById('cub');
                // Highlight start
                getTile(pathToGoal[0].x, pathToGoal[0].y).el.classList.add('active');

                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    getTile(pathToGoal[i].x, pathToGoal[i].y).el.classList.add('active');
                }
                
                // Victory Wiggle
                const bearHead = document.querySelector('.bear-head');
                bearHead.style.transform = "rotate(-10deg)";
                setTimeout(() => bearHead.style.transform = "rotate(10deg)", 100);
                setTimeout(() => bearHead.style.transform = "rotate(0deg)", 200);

            } else {
                alert("The path is blocked! Try resetting.");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump effect
                cub.style.transform = "translate(-50%, -50%) scale(0.5) translateY(-20px)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1.1) translateY(0)";
                    setTimeout(() => {
                        cub.style.transform = "translate(-50%, -50%) scale(1)";
                        resolve();
                    }, 150);
                }, 200);
            });
        }

        initGame();
    </script>
</body>
</html>
