<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Storybook & Earthy */
            --bg-color: #e8e4d9;
            
            /* Wood Materials */
            --wood-frame: #5d4037;
            --wood-frame-light: #795548;
            --wood-frame-dark: #3e2723;
            --wood-btn-run: #d84315;
            --wood-btn-run-dark: #a1310a;
            --wood-btn-reset: #f5f0e8;
            --wood-btn-reset-dark: #d7ccc8;

            /* Parchment / Stone Materials */
            --parchment: #fdfbf7;
            --parchment-shadow: #e0dcd3;
            --path-dirt: #8d6e63;
            --path-dirt-shadow: #5d4037;
            --path-dirt-light: #a1887f;
            --path-active: #66bb6a; /* Mossy Green */

            /* Dimensions */
            --grid-size: 5;
            --cell-size: 64px;
            --gap: 2px;
            --tray-padding: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-color);
            /* Subtle noise texture for background */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--wood-frame-dark);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; /* Hand-lettered fallbacks */
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            color: var(--wood-frame-dark);
            letter-spacing: -2px;
            line-height: 0.9;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.4);
            transform: rotate(-2deg); /* Playful tilt */
        }

        .subtitle {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #795548;
            margin-top: 8px; /* Tight grouping */
            font-weight: 700;
            background: rgba(255,255,255,0.5);
            padding: 4px 12px;
            border-radius: 4px;
        }

        /* --- Board Construction (The Wooden Frame) --- */
        .game-container {
            position: relative;
            background: linear-gradient(145deg, var(--wood-frame-light), var(--wood-frame-dark));
            padding: var(--tray-padding);
            border-radius: 12px;
            
            /* Deep 3D Frame */
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.4), /* Deep Drop Shadow */
                inset 0 2px 5px rgba(255,255,255,0.2), /* Top Highlight */
                inset 0 -5px 10px rgba(0,0,0,0.5), /* Bottom Inner Shadow */
                0 0 0 8px var(--wood-frame-dark); /* Thick outer border */
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The recessed area for the tiles */
        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            position: relative;
            z-index: 2;
            background-color: #3e2723; /* Dark gap color */
            /* Inner shadow to make the hole look deep */
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.8);
            border-radius: 6px;
            padding: 0;
        }

        /* --- Tiles (Textured Parchment) --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--parchment);
            /* Parchment texture via CSS noise */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            border-radius: 4px; 
            position: relative;
            cursor: pointer;
            
            /* Subtle inset shadow to sit flush in the tray */
            box-shadow: 
                inset 1px 1px 3px rgba(255,255,255,0.7),
                inset -1px -1px 3px rgba(0,0,0,0.1);
            
            transition: transform 0.1s;
        }

        .tile:hover {
            transform: scale(1.02);
            z-index: 2;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        /* --- Paths (Tactile Dirt/Rope) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .path-line {
            stroke: var(--path-dirt);
            stroke-width: 16; /* Thick tracks */
            stroke-linecap: round;
            fill: none;
            
            /* Bevel/Depth Effect */
            filter: drop-shadow(2px 2px 0px var(--path-dirt-shadow)) 
                    drop-shadow(-1px -1px 0px var(--path-dirt-light));
        }

        /* Active path state (Mossy growth) */
        .tile.active .path-line {
            stroke: var(--path-active);
            filter: drop-shadow(2px 2px 0px #2e7d32) 
                    drop-shadow(-1px -1px 0px #a5d6a7)
                    drop-shadow(0px 0px 4px rgba(102, 187, 106, 0.8));
            transition: stroke 0.3s ease;
        }

        /* --- Game Assets --- */

        /* The Goal: Magical Beacon */
        .goal-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            z-index: 5;
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; filter: drop-shadow(0 0 5px rgba(255, 235, 59, 0.6)); }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px rgba(255, 235, 59, 1)); }
        }

        /* The Cub: Wooden Peg / Plush Hybrid */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Deep physical shadow */
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.35));
        }

        .bear-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            animation: bear-breathe 3s infinite ease-in-out;
        }

        @keyframes bear-breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        /* Bear Body Parts - Styled as a wooden peg toy */
        .bear-head {
            width: 40px;
            height: 38px;
            background: radial-gradient(circle at 30% 30%, #bcaaa4, #795548); /* Wood grain gradient */
            border-radius: 45% 45% 40% 40%;
            position: absolute;
            top: 8px;
            left: 5px;
            z-index: 2;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .bear-ear {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #a1887f, #5d4037);
            border-radius: 50%;
            position: absolute;
            top: 2px;
            z-index: 1;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .bear-ear.left { left: 2px; }
        .bear-ear.right { right: 2px; }

        .bear-eye {
            width: 4px;
            height: 4px;
            background: #212121;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            z-index: 3;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.5);
        }
        .bear-eye.left { left: 10px; }
        .bear-eye.right { right: 10px; }

        .bear-snout {
            width: 18px;
            height: 12px;
            background: #d7ccc8;
            border-radius: 10px;
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }

        .bear-nose {
            width: 6px;
            height: 4px;
            background: #3e2723;
            border-radius: 4px;
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- UI Controls (Wooden Planks) --- */
        footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }

        button {
            font-family: 'Georgia', serif;
            border: none;
            cursor: pointer;
            outline: none;
            position: relative;
            text-transform: uppercase;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px; /* Rounded corners per critique */
        }

        /* Run Button: Terracotta Wood */
        .btn-run {
            background: linear-gradient(to bottom, #e64a19, var(--wood-btn-run));
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 40px;
            letter-spacing: 1px;
            
            /* 3D Wood Block effect */
            box-shadow: 
                0 6px 0 var(--wood-btn-run-dark), 
                0 10px 15px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-2px);
            border: 1px solid rgba(0,0,0,0.1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0 var(--wood-btn-run-dark), 
                0 4px 6px rgba(0,0,0,0.3);
        }

        /* Reset Button: Cream/Leather Tab */
        .btn-reset {
            background: linear-gradient(to bottom, #ffffff, var(--wood-btn-reset));
            color: #5d4037;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 12px 24px;
            
            /* Leather Tab effect */
            box-shadow: 
                0 5px 0 var(--wood-btn-reset-dark), 
                0 8px 10px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.8);
            transform: translateY(-1px);
            border: 1px solid #d7ccc8;
        }

        .btn-reset:active {
            transform: translateY(3px);
            box-shadow: 
                0 2px 0 var(--wood-btn-reset-dark), 
                0 3px 5px rgba(0,0,0,0.15);
        }

        /* --- Responsive --- */
        @media (max-width: 450px) {
            :root { 
                --cell-size: 56px; 
                --tray-padding: 12px; 
            }
            h1 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // Level Map (Paths)
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Goal Marker (Radiant Star SVG)
            const endTile = getTile(END.x, END.y);
            const starWrapper = document.createElement('div');
            starWrapper.className = 'goal-marker';
            // Gradient Star SVG
            starWrapper.innerHTML = `
            <svg viewBox="0 0 24 24" fill="url(#starGrad)">
                <defs>
                    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff59d;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#fbc02d;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/>
            </svg>`;
            endTile.el.appendChild(starWrapper);

            // Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = `
                <div class="bear-wrapper">
                    <div class="bear-ear left"></div>
                    <div class="bear-ear right"></div>
                    <div class="bear-head">
                        <div class="bear-eye left"></div>
                        <div class="bear-eye right"></div>
                        <div class="bear-snout">
                            <div class="bear-nose"></div>
                        </div>
                    </div>
                </div>
            `;
            getTile(START.x, START.y).el.appendChild(cub);
        }

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Draw path lines
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            return { el, x, y, connections, path };
        }

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();
            
            tiles.forEach(t => {
                t.el.classList.remove('active');
            });

            initGame();
        }

        async function runGame() {
            // BFS Solver
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let visited = new Set();
            visited.add(`${START.x},${START.y}`);
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({x: n.x, y: n.y, path: [...curr.path, n]});
                    }
                }
            }

            if (found) {
                const cub = document.getElementById('cub');
                // Highlight start
                getTile(pathToGoal[0].x, pathToGoal[0].y).el.classList.add('active');

                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    getTile(pathToGoal[i].x, pathToGoal[i].y).el.classList.add('active');
                }
                
                // Victory Wiggle
                const bearHead = document.querySelector('.bear-head');
                bearHead.style.transition = "transform 0.1s";
                bearHead.style.transform = "rotate(-15deg)";
                setTimeout(() => bearHead.style.transform = "rotate(15deg)", 100);
                setTimeout(() => bearHead.style.transform = "rotate(-15deg)", 200);
                setTimeout(() => bearHead.style.transform = "rotate(15deg)", 300);
                setTimeout(() => bearHead.style.transform = "rotate(0deg)", 400);

            } else {
                alert("The path is blocked! Try resetting.");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump effect
                cub.style.transform = "translate(-50%, -50%) scale(0.8) translateY(-15px)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1.1) translateY(0)";
                    setTimeout(() => {
                        cub.style.transform = "translate(-50%, -50%) scale(1)";
                        resolve();
                    }, 150);
                }, 200);
            });
        }

        initGame();
    </script>
</body>
</html>
