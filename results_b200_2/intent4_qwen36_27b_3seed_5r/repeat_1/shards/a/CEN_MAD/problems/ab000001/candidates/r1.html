<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm, Storybook, Earthy */
            --bg-parchment: #fdfbf7;
            --bg-noise: #e8e4d9;
            --wood-light: #e6d4b8;
            --wood-dark: #cbb68c;
            --board-frame: #5d4037;
            --board-inner: #8d6e63;
            --path-color: #5d4037; /* Dark dirt/stone */
            --path-shadow: #3e2723;
            --accent-gold: #fbc02d;
            --accent-gold-shadow: #f57f17;
            --btn-primary: #689f38; /* Sage Green */
            --btn-primary-shadow: #558b2f;
            --btn-secondary: #d7ccc8; /* Soft Grey-Brown */
            --btn-secondary-shadow: #bcaaa4;
            --text-main: #3e2723;
            --text-sub: #8d6e63;
            
            /* Dimensions */
            --grid-size: 5;
            --cell-size: 70px;
            --gap: 6px;
            --radius-large: 16px;
            --radius-small: 8px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-parchment);
            /* Subtle paper texture via CSS noise */
            background-image: radial-gradient(var(--bg-noise) 1px, transparent 0);
            background-size: 20px 20px;
            font-family: 'Georgia', 'Times New Roman', serif; /* Storybook Serif */
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: -1px;
            font-weight: 900;
            color: var(--text-main);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
            /* Hand-drawn feel */
            font-family: 'Georgia', serif; 
            transform: rotate(-1deg);
        }

        .subtitle {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-sub);
            margin-top: 8px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* --- Game Board (The "Physical" Object) --- */
        .game-container {
            position: relative;
            /* Wood Frame Styling */
            background-color: var(--board-frame);
            padding: 12px;
            border-radius: var(--radius-large);
            box-shadow: 
                0 20px 40px -10px rgba(62, 39, 35, 0.3), /* Deep drop shadow */
                inset 0 2px 5px rgba(255,255,255,0.2), /* Top highlight */
                inset 0 -2px 5px rgba(0,0,0,0.4); /* Bottom depth */
            border: 2px solid #3e2723;
        }

        /* Inner Bevel/Rug edge */
        .game-container::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            pointer-events: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            background-color: var(--board-inner); /* Wood filler color */
            padding: var(--gap);
            border-radius: 8px;
            position: relative;
        }

        /* --- Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #fdf5e6; /* Off-white stone */
            /* Stone/Wood Texture via Gradient */
            background-image: linear-gradient(135deg, #fdfbf7 0%, #f0e6d2 100%);
            border-radius: var(--radius-small);
            position: relative;
            /* Inset shadow for "cutout" look */
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.8),
                inset 0 -3px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .tile:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.8),
                inset 0 -3px 6px rgba(0,0,0,0.1),
                0 5px 10px rgba(0,0,0,0.1);
        }

        /* SVG Drawing for Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
            position: absolute;
            top: 0; left: 0;
        }

        .path-line {
            stroke: var(--path-color);
            stroke-width: 12; /* Thicker, organic */
            stroke-linecap: round;
            fill: none;
            /* 3D effect on path */
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.15)); 
        }

        /* --- Characters & Markers --- */
        
        /* The Star (Goal) */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-5px) rotate(5deg); }
        }

        .star-path {
            fill: var(--accent-gold);
            stroke: var(--accent-gold-shadow);
            stroke-width: 2;
        }

        /* The Cub (Character) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.3));
        }

        /* Pure CSS Bear Character */
        .bear-body {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Ears */
        .bear-ear {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #5d4037;
            border-radius: 50%;
            top: -2px;
            z-index: -1;
        }
        .bear-ear.left { left: 4px; }
        .bear-ear.right { right: 4px; }

        /* Head */
        .bear-head {
            width: 40px;
            height: 36px;
            background: #8d6e63; /* Bear Brown */
            border-radius: 50% 50% 45% 45%;
            margin: 0 auto;
            position: relative;
            border: 2px solid #4e342e;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2);
        }

        /* Snout */
        .bear-snout {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 12px;
            background: #d7ccc8;
            border-radius: 10px;
            border: 1px solid #4e342e;
        }

        /* Nose */
        .bear-nose {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 4px;
            background: #3e2723;
            border-radius: 4px;
        }

        /* Eyes */
        .bear-eye {
            position: absolute;
            top: 10px;
            width: 4px;
            height: 5px;
            background: #3e2723;
            border-radius: 50%;
        }
        .bear-eye.left { left: 9px; }
        .bear-eye.right { right: 9px; }

        /* --- Footer / Controls --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 16px;
        }

        button {
            font-family: 'Georgia', serif; /* Consistent typography */
            font-weight: 700;
            font-size: 1.1rem;
            padding: 12px 32px;
            border: none;
            border-radius: var(--radius-large); /* Consistent radius */
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
            color: #fff;
            position: relative;
        }

        .btn-reset {
            background-color: var(--btn-secondary);
            color: #5d4037;
            box-shadow: 0 4px 0 var(--btn-secondary-shadow);
        }
        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-run {
            background-color: var(--btn-primary);
            color: white;
            box-shadow: 0 4px 0 var(--btn-primary-shadow);
            text-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }
        
        /* Subtle gloss overlay for storybook feel */
        .btn-run::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--radius-large);
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        .btn-run:hover {
            background-color: #7cb342;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--btn-primary-shadow);
        }
        .btn-run:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* --- Responsive --- */
        @media (max-width: 500px) {
            :root {
                --cell-size: 60px;
            }
            h1 { font-size: 2.2rem; }
            .game-container { padding: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W (Binary mask for connections)
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        // 0,0 is start. 4,4 is end.
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        // Start/End Coordinates
        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker (Star) at End
            const endTile = getTile(END.x, END.y);
            endTile.el.appendChild(createStarSVG());

            // Add Cub Token (Character) at Start
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            // Bear SVG/CSS Construction
            cub.innerHTML = `
                <div class="bear-body">
                    <div class="bear-ear left"></div>
                    <div class="bear-ear right"></div>
                    <div class="bear-head">
                        <div class="bear-eye left"></div>
                        <div class="bear-eye right"></div>
                        <div class="bear-snout">
                            <div class="bear-nose"></div>
                        </div>
                    </div>
                </div>
            `;
            getTile(START.x, START.y).el.appendChild(cub);
        }

        // --- SVG Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            el.dataset.conn = connections;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates based on binary mask
            // Center is 50,50. N:0,50 E:100,50 S:100,50 W:0,50
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            // Interaction (Click to rotate for puzzle feel)
            el.addEventListener('click', () => {
                // Visual feedback only for this demo
                el.style.transform = 'scale(0.95)';
                setTimeout(() => el.style.transform = '', 100);
            });

            return { el, x, y, connections, svg, path };
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            // Standard 5-point star path
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("class", "star-path");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            // Remove old cub
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset any visual changes (colors)
            tiles.forEach(t => {
                t.path.style.stroke = "var(--path-color)";
                t.path.style.strokeWidth = "12";
            });

            // Re-init
            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // Highlight start
            const startTile = getTile(current.x, current.y);
            startTile.path.style.stroke = "#689f38"; // Sage Green
            startTile.path.style.strokeWidth = "14";

            // Simple BFS to find path to END
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let found = false;
            let pathToGoal = [];

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                // Check neighbors
                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Animate Cub along path
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.path.style.stroke = "#689f38"; // Sage Green
                    tile.path.style.strokeWidth = "14";
                }
                
                // Win state animation
                setTimeout(() => {
                    const head = cub.querySelector('.bear-head');
                    head.style.backgroundColor = "#fbc02d"; // Gold
                    cub.style.transform = "translate(-50%, -50%) scale(1.2) rotate(10deg)";
                }, 200);

            } else {
                alert("No path found! (This shouldn't happen in this demo level)");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            // North
            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            // East
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            // South
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            // West
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }

            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // "Jump" animation logic
                cub.style.transform = "translate(-50%, -50%) scale(0.6)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1)";
                    resolve();
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
