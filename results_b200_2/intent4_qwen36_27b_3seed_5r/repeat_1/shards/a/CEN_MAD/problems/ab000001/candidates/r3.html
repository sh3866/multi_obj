<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-wall: #f4f1ea;
            --bg-texture: #e8e4d8;
            --wood-dark: #3e2723;
            --wood-med: #5d4037;
            --wood-light: #795548;
            --paper-cream: #fdfbf7;
            --paper-shadow: #e0dcd3;
            --tile-stone: #efe9dd;
            --tile-stone-dark: #d7cfd6;
            --path-dirt: #5d4037;
            --path-highlight: #8d6e63;
            --accent-green: #689f38;
            --accent-gold: #fbc02d;
            --text-main: #4e342e;
            --text-sub: #8d6e63;

            /* Dimensions */
            --grid-size: 5;
            --cell-size: 64px;
            --gap: 6px;
            --frame-thickness: 18px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-wall);
            /* Heavy Cream Textured Background */
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.8) 0%, transparent 70%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 12px; /* Tightened spacing */
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 1.8rem; /* Reduced scale */
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 1px;
            font-family: 'Times New Roman', serif; /* Soft serif */
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            display: inline-block;
            position: relative;
        }
        
        /* Decorative underline for title */
        h1::after {
            content: '';
            display: block;
            width: 60%;
            height: 3px;
            background: var(--wood-med);
            margin: 4px auto 0;
            border-radius: 2px;
            opacity: 0.6;
        }

        .subtitle {
            font-family: sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px; /* Tightened tracking */
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 700;
            opacity: 0.8;
        }

        /* --- Board Construction (The Hero) --- */
        .game-container {
            position: relative;
            /* The Wooden Frame */
            background: linear-gradient(to bottom, var(--wood-light), var(--wood-dark));
            padding: var(--frame-thickness);
            border-radius: 16px;
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.4),
                inset 0 2px 5px rgba(255,255,255,0.2),
                inset 0 -2px 5px rgba(0,0,0,0.3);
            border: 1px solid #261613;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Inner groove (recessed area for tiles) */
        .game-container::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px solid rgba(0,0,0,0.3);
            border-radius: 10px;
            pointer-events: none;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            position: relative;
            z-index: 2;
            background: #3e2723; /* Fallback color for gaps */
            padding: 4px;
            border-radius: 6px;
        }

        /* --- Garden Stone Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-stone);
            /* Slightly organic feel */
            border-radius: 8px; 
            position: relative;
            cursor: pointer;
            /* Bevel/Inner Shadow for "Set into frame" look */
            box-shadow: 
                inset 2px 2px 4px rgba(255,255,255,0.8),
                inset -2px -2px 4px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tile:hover {
            transform: scale(1.03);
            z-index: 2;
        }

        /* --- Paths (Carved into Stone) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .path-line {
            stroke: var(--path-dirt);
            stroke-width: 10;
            stroke-linecap: round;
            fill: none;
            /* Carved Effect: Shadow + Highlight */
            filter: drop-shadow(1px 1px 0px var(--tile-stone)) drop-shadow(-1px -1px 0px var(--tile-stone-dark));
        }

        /* Active path state */
        .tile.active .path-line {
            stroke: var(--accent-green);
            filter: drop-shadow(1px 1px 0px var(--tile-stone)) drop-shadow(0px 0px 4px rgba(104, 159, 56, 0.5));
        }

        /* --- Game Assets --- */

        /* The Goal: Radiant Star */
        .goal-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36px;
            height: 36px;
            transform: translate(-50%, -50%);
            z-index: 5;
            animation: pulse-glow 2s infinite ease-in-out;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 5px var(--accent-gold)); }
            50% { transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 0 12px var(--accent-gold)); }
        }

        /* The Cub: Plush Toy */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }

        .bear-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            animation: bear-bounce 3s infinite ease-in-out;
        }

        @keyframes bear-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        /* Plush Texture */
        .bear-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        }

        .bear-head {
            width: 40px;
            height: 36px;
            background: #8d6e63;
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            top: 8px;
            left: 5px;
            box-shadow: inset 2px 2px 6px rgba(255,255,255,0.2), inset -2px -2px 6px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .bear-ear {
            width: 14px;
            height: 14px;
            background: #795548;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            z-index: 1;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.4);
        }
        .bear-ear.left { left: 3px; }
        .bear-ear.right { right: 3px; }

        .bear-eye {
            width: 4px;
            height: 4px;
            background: #212121;
            border-radius: 50%;
            position: absolute;
            top: 14px;
            z-index: 3;
        }
        .bear-eye.left { left: 10px; }
        .bear-eye.right { right: 10px; }
        /* Eye shine */
        .bear-eye::after {
            content:''; position: absolute; top:0; left:1px; width:1.5px; height:1.5px; background:white; border-radius:50%;
        }

        .bear-snout {
            width: 18px;
            height: 12px;
            background: #d7ccc8;
            border-radius: 10px;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1);
        }

        .bear-nose {
            width: 6px;
            height: 4px;
            background: #3e2723;
            border-radius: 3px;
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- UI Controls: Stamped Signs --- */
        footer {
            margin-top: 20px; /* Moved closer */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }

        button {
            font-family: 'Georgia', serif;
            border: none;
            cursor: pointer;
            outline: none;
            position: relative;
            text-transform: uppercase;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Run Button: Dominant, Wooden Sign */
        .btn-run {
            background: linear-gradient(to bottom, #7cb342, #558b2f);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 10px 40px;
            letter-spacing: 1px;
            border-radius: 4px;
            /* Sign aesthetic */
            box-shadow: 
                0 4px 0 #33691e, 
                0 8px 10px rgba(0,0,0,0.2);
            transform: translateY(-2px);
            border: 1px solid rgba(0,0,0,0.1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-run:active {
            transform: translateY(2px);
            box-shadow: 
                0 1px 0 #33691e, 
                0 2px 4px rgba(0,0,0,0.2);
        }

        /* Reset Button: Demoted, Stamped Paper */
        .btn-reset {
            background: linear-gradient(to bottom, #f5f5f5, #e0e0e0);
            color: var(--wood-dark);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 2px;
            box-shadow: 
                0 3px 0 #bdbdbd, 
                0 4px 6px rgba(0,0,0,0.1);
            transform: translateY(-1px);
            border: 1px solid #d7ccc8;
        }

        .btn-reset:active {
            transform: translateY(1px);
            box-shadow: 
                0 1px 0 #bdbdbd, 
                0 1px 2px rgba(0,0,0,0.1);
        }

        /* --- Responsive --- */
        @media (max-width: 450px) {
            :root { --cell-size: 52px; --frame-thickness: 12px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // Level Map
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Goal Marker (Radiant Star SVG)
            const endTile = getTile(END.x, END.y);
            const starWrapper = document.createElement('div');
            starWrapper.className = 'goal-marker';
            starWrapper.innerHTML = `<svg viewBox="0 0 24 24" fill="#fbc02d" stroke="#f57f17" stroke-width="1">
                <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/>
            </svg>`;
            endTile.el.appendChild(starWrapper);

            // Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = `
                <div class="bear-wrapper">
                    <div class="bear-ear left bear-texture"></div>
                    <div class="bear-ear right bear-texture"></div>
                    <div class="bear-head bear-texture">
                        <div class="bear-eye left"></div>
                        <div class="bear-eye right"></div>
                        <div class="bear-snout">
                            <div class="bear-nose"></div>
                        </div>
                    </div>
                </div>
            `;
            getTile(START.x, START.y).el.appendChild(cub);
        }

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Draw path lines
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            return { el, x, y, connections, path };
        }

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();
            
            tiles.forEach(t => {
                t.el.classList.remove('active');
            });

            initGame();
        }

        async function runGame() {
            // BFS Solver
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let visited = new Set();
            visited.add(`${START.x},${START.y}`);
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({x: n.x, y: n.y, path: [...curr.path, n]});
                    }
                }
            }

            if (found) {
                const cub = document.getElementById('cub');
                // Highlight start
                getTile(pathToGoal[0].x, pathToGoal[0].y).el.classList.add('active');

                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    getTile(pathToGoal[i].x, pathToGoal[i].y).el.classList.add('active');
                }
                
                // Victory Wiggle
                const bearHead = document.querySelector('.bear-head');
                bearHead.style.transform = "rotate(-15deg)";
                setTimeout(() => bearHead.style.transform = "rotate(15deg)", 100);
                setTimeout(() => bearHead.style.transform = "rotate(-15deg)", 200);
                setTimeout(() => bearHead.style.transform = "rotate(15deg)", 300);
                setTimeout(() => bearHead.style.transform = "rotate(0deg)", 400);

            } else {
                alert("The path is blocked! Try resetting.");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump effect
                cub.style.transform = "translate(-50%, -50%) scale(0.8) translateY(-15px)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1.1) translateY(0)";
                    setTimeout(() => {
                        cub.style.transform = "translate(-50%, -50%) scale(1)";
                        resolve();
                    }, 150);
                }, 200);
            });
        }

        initGame();
    </script>
</body>
</html>
