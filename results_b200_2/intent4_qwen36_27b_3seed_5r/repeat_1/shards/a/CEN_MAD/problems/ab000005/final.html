<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | Resurface Reality</title>
    <style>
        :root {
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --cta-color: #FFD54F; /* Bright Amber/Yellow */
            --cta-hover: #FFCA28;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #1a120b; /* Deep warm brown fallback */
            color: #ffffff;
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            cursor: none; /* We draw our own cursor (the mop) */
        }

        /* SVG Scene Layer */
        #scene-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Ensure SVG filters work */
            filter: contrast(1.1) saturate(1.1);
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allow clicks to pass to SVG */
            z-index: 10;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Top-Left alignment */
        }

        /* Typography & Brand */
        header {
            margin-bottom: 2rem;
        }

        .brand {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .brand-dot {
            width: 6px;
            height: 6px;
            background-color: var(--cta-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--cta-color);
        }

        /* Text Card - Reduced Width */
        .hero-content {
            max-width: 340px; /* Reduced by ~30% */
            position: relative;
            z-index: 2;
        }

        .text-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 2rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 2.75rem; /* Tighter size */
            line-height: 1.05;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: #ffffff;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }

        p.description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: rgba(255,255,255,0.75);
            font-weight: 400;
            margin-bottom: 1.75rem;
        }

        /* Call to Action Button - High Contrast */
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #2c1e12; /* Dark text for contrast */
            text-transform: uppercase;
            letter-spacing: 0.05em;
            
            /* Solid Bright Color */
            background-color: var(--cta-color);
            color: #2c1e12;
            
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 213, 79, 0.3);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s;
            animation: pulse 3s infinite ease-in-out;
        }

        .cta-button:hover {
            background-color: var(--cta-hover);
            transform: scale(1.05);
        }

        .cta-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 213, 79, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 6px 20px rgba(255, 213, 79, 0.5); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .ui-layer { padding: 1.5rem; }
            h1 { font-size: 2.25rem; }
            .text-card { padding: 1.5rem; }
            .hero-content { max-width: 300px; }
        }
    </style>
</head>
<body>

    <!-- 1. SVG SCENE LAYER -->
    <svg id="scene-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 3. ENHANCED FLOOR TEXTURE FILTER -->
            <!-- Combines fractal noise for grain and a color matrix for wood tone -->
            <filter id="woodTexture" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="3" result="noise" />
                <feColorMatrix type="matrix" values="
                    0.2 0 0 0 0.35
                    0.1 0 0 0 0.2
                    0.05 0 0 0 0.1
                    0   0 0 1 0" in="noise" result="woodNoise" />
                <!-- Blur slightly to soften digital harshness -->
                <feGaussianBlur in="woodNoise" stdDeviation="2" result="blur" />
            </filter>

            <!-- Radial Gradient for Liquid Depth -->
            <radialGradient id="spillGradient" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                <stop offset="0%" stop-color="#5D4037" stop-opacity="0.95" /> <!-- Deep center -->
                <stop offset="60%" stop-color="#3E2723" stop-opacity="0.85" /> <!-- Body -->
                <stop offset="90%" stop-color="#281815" stop-opacity="0.6" />  <!-- Edge -->
                <stop offset="100%" stop-color="#1a0f0c" stop-opacity="0" />   <!-- Fade out -->
            </radialGradient>

            <!-- Mop Rag Gradient -->
            <linearGradient id="ragGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5D4037" />
                <stop offset="100%" stop-color="#3E2723" />
            </linearGradient>
        </defs>

        <!-- Background Floor -->
        <rect id="floor-rect" width="100%" height="100%" fill="#5D4037" filter="url(#woodTexture)" />
        
        <!-- Vignette for mood -->
        <rect width="100%" height="100%" fill="url(#vignetteGrad)" style="mix-blend-mode: multiply;" pointer-events="none" />

        <!-- 1. ORGANIC SPILL GROUP -->
        <!-- We use a group so we can mask it out as we "clean" -->
        <g id="mess-group">
            <!-- Main organic blob path -->
            <path id="main-spill" d="" fill="url(#spillGradient)" />
            <!-- Splatters will be injected here via JS -->
            <g id="splatters"></g>
        </g>

        <!-- 2. WET MOP GROUP -->
        <!-- Positioned via JS based on mouse -->
        <g id="mop-group" transform="translate(0,0) rotate(0)">
            <!-- Shadow -->
            <ellipse cx="15" cy="15" rx="60" ry="45" fill="rgba(0,0,0,0.4)" filter="blur(8px)" />
            
            <!-- Handle (Wood/Metal) -->
            <rect x="-6" y="-400" width="12" height="400" rx="2" fill="#d7ccc8" />
            <rect x="-4" y="-400" width="4" height="400" fill="rgba(255,255,255,0.3)" />
            
            <!-- Connector -->
            <path d="M-20,0 L20,0 L15,20 L-15,20 Z" fill="#78909C" />
            
            <!-- Rag Head (Base) -->
            <rect x="-50" y="20" width="100" height="90" rx="8" fill="#3E2723" />
            
            <!-- Rag Strips (Wet Look) -->
            <g stroke="#281815" stroke-width="1">
                <path d="M-45,20 L-45,110" stroke="#4E342E" stroke-width="12" />
                <path d="M-30,20 L-30,110" stroke="#4E342E" stroke-width="12" />
                <path d="M-15,20 L-15,110" stroke="#4E342E" stroke-width="12" />
                <path d="M0,20 L0,110" stroke="#4E342E" stroke-width="12" />
                <path d="M15,20 L15,110" stroke="#4E342E" stroke-width="12" />
                <path d="M30,20 L30,110" stroke="#4E342E" stroke-width="12" />
                <path d="M45,20 L45,110" stroke="#4E342E" stroke-width="12" />
            </g>
            
            <!-- Wet Highlight -->
            <rect x="-40" y="25" width="80" height="80" rx="5" fill="rgba(255,255,255,0.1)" style="mix-blend-mode: overlay;" />
        </g>
    </svg>

    <!-- 4. REBALANCED UI LAYER -->
    <div class="ui-layer">
        <header>
            <div class="brand">
                <div class="brand-dot"></div>
                Spotless
            </div>
        </header>

        <div class="hero-content">
            <div class="text-card">
                <h1>Resurface<br>Reality.</h1>
                <p class="description">
                    Life makes a mess. We make it simple. Reveal the pristine, warm grain beneath the chaos.
                </p>
                <div class="cta-button">
                    <!-- Drag Icon -->
                    <svg class="cta-icon" viewBox="0 0 24 24">
                        <path d="M5 9l4-4 4 4M5 15l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Drag to Clean
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * INTERACTIVE ENGINE
         * Handles SVG manipulation, mouse tracking, and the "erasing" logic.
         */
        
        const svg = document.getElementById('scene-svg');
        const mopGroup = document.getElementById('mop-group');
        const messGroup = document.getElementById('mess-group');
        const mainSpillPath = document.getElementById('main-spill');
        const splattersGroup = document.getElementById('splatters');
        
        // State
        let mouse = { x: -1000, y: -1000, px: -1000, py: -1000, active: false };
        let rotation = 0;
        let isMobile = window.innerWidth < 768;

        // 1. GENERATE ORGANIC SPILL
        function generateSpill() {
            const cx = window.innerWidth * 0.6; // Center slightly right
            const cy = window.innerHeight * 0.55;
            const size = Math.min(window.innerWidth, window.innerHeight) * 0.35;

            // Create an organic shape using a path with randomized control points
            // We construct a closed path string
            let d = "";
            const points = 12;
            const angleStep = (Math.PI * 2) / points;
            
            // Generate main blob coordinates
            const coords = [];
            for (let i = 0; i < points; i++) {
                const angle = i * angleStep;
                // Vary radius significantly for organic look
                const r = size * (0.8 + Math.random() * 0.4); 
                coords.push({
                    x: cx + Math.cos(angle) * r,
                    y: cy + Math.sin(angle) * r
                });
            }

            // Construct smooth cubic bezier path through points
            d = `M ${coords[0].x} ${coords[0].y}`;
            for (let i = 0; i < coords.length; i++) {
                const p0 = coords[i];
                const p1 = coords[(i + 1) % coords.length];
                const p2 = coords[(i + 2) % coords.length];
                
                // Simple Catmull-Rom to Bezier conversion logic for smoothness
                const cp1x = p0.x + (p1.x - coords[(i - 1 + coords.length) % coords.length].x) / 3;
                const cp1y = p0.y + (p1.y - coords[(i - 1 + coords.length) % coords.length].y) / 3;
                const cp2x = p1.x - (p2.x - p0.x) / 3;
                const cp2y = p1.y - (p2.y - p0.y) / 3;

                d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p1.x} ${p1.y}`;
            }
            d += " Z";
            
            mainSpillPath.setAttribute('d', d);

            // Generate Splatters (Circles)
            splattersGroup.innerHTML = '';
            for(let i=0; i<25; i++) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const angle = Math.random() * Math.PI * 2;
                const dist = size * (1.1 + Math.random() * 0.5);
                const r = Math.random() * 8 + 2;
                
                circle.setAttribute("cx", cx + Math.cos(angle) * dist);
                circle.setAttribute("cy", cy + Math.sin(angle) * dist);
                circle.setAttribute("r", r);
                circle.setAttribute("fill", "#3E2723"); // Dark coffee color
                circle.style.opacity = "0.8";
                splattersGroup.appendChild(circle);
            }
        }

        // 2. SETUP CLEANING MECHANIC (SVG Mask)
        // We will use an SVG Mask to hide the mess. 
        // Black = Hidden, White = Visible.
        // We start with all White, and draw Black circles where the mop moves.
        
        let maskGroup, maskCircle;
        
        function setupMask() {
            const defs = svg.querySelector('defs');
            
            // Create Mask
            const mask = document.createElementNS("http://www.w3.org/2000/svg", "mask");
            mask.setAttribute("id", "cleaning-mask");
            mask.setAttribute("maskUnits", "userSpaceOnUse");
            
            // The "Canvas" for the mask (initially white/visible)
            const maskRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            maskRect.setAttribute("width", "100%");
            maskRect.setAttribute("height", "100%");
            maskRect.setAttribute("fill", "white");
            mask.appendChild(maskRect);
            
            // The "Eraser" brush (will follow mouse)
            maskGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            maskGroup.setAttribute("fill", "black"); // Black erases the object
            
            // We will append circles to this group
            defs.appendChild(mask);
            defs.appendChild(maskGroup);
            
            // Apply mask to the mess
            messGroup.setAttribute("mask", "url(#cleaning-mask)");
        }

        function addEraserTrace(x, y) {
            if (!mouse.active) return;
            
            // Create a circle in the mask group to "wipe" the area
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", 60); // Mop radius
            maskGroup.appendChild(circle);
        }

        // 3. ANIMATION LOOP
        function animate() {
            if (mouse.x > 0) {
                // Calculate angle for rotation
                const dx = mouse.x - mouse.px;
                const dy = mouse.y - mouse.py;
                
                // Only rotate if moving significantly
                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                    const targetAngle = Math.atan2(dy, dx) * (180 / Math.PI);
                    // Smooth interpolation
                    rotation += (targetAngle - rotation) * 0.1;
                    
                    // Add cleaning trace
                    addEraserTrace(mouse.x, mouse.y);
                    
                    mouse.px = mouse.x;
                    mouse.py = mouse.y;
                }

                // Update Mop Transform
                // Note: The SVG coordinate system has Y down. 
                // The mop graphic is drawn pointing "down" relative to its local Y.
                // So 0 degrees is down. We want the handle to be at the top.
                // We rotate the group so the handle points opposite to movement.
                mopGroup.setAttribute("transform", `translate(${mouse.x}, ${mouse.y}) rotate(${rotation + 180})`);
            }
            
            requestAnimationFrame(animate);
        }

        // 4. EVENTS
        function handleMove(x, y) {
            mouse.x = x;
            mouse.y = y;
            mouse.active = true;
        }

        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Stop scrolling
            handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('resize', () => {
            generateSpill(); // Regenerate spill on resize to fit screen
        });

        // Initialize
        generateSpill();
        setupMask();
        animate();

    </script>
</body>
</html>
