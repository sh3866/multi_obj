<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | Resurface Reality</title>
    <style>
        :root {
            --text-light: #ffffff;
            --text-muted: #e5e5e5;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1512; /* Fallback */
            color: var(--text-light);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            cursor: none; /* Hide default cursor */
        }

        /* Scene Container */
        .scene-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Typography & Layout */
        header {
            margin-bottom: 2rem;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        .hero-content {
            max-width: 450px;
            position: relative;
            z-index: 2;
        }

        /* Text Background Overlay for Pop */
        .text-bg {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: rgba(20, 15, 10, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 24px;
            z-index: -1;
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 4.5rem;
            line-height: 1;
            font-weight: 900;
            margin-bottom: 1.5rem;
            color: #ffffff;
            letter-spacing: -0.04em;
            text-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
            font-weight: 400;
            max-width: 320px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 2rem;
        }

        /* Interactive Hint */
        .interaction-hint {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: rgba(0,0,0,0.3);
            padding: 10px 16px;
            border-radius: 50px;
            width: fit-content;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            animation: floatHint 3s infinite ease-in-out;
        }

        .hint-arrow {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: relative;
        }
        
        .hint-arrow::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
        }

        @keyframes floatHint {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
            }
            h1 {
                font-size: 3rem;
            }
            .text-bg {
                display: none; /* Less blur on mobile for performance */
            }
        }
    </style>
</head>
<body>

    <div class="scene-wrapper">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-dot"></div>
                    Spotless
                </div>
            </header>

            <div class="hero-content">
                <!-- Semi-transparent background block -->
                <div class="text-bg"></div>
                
                <h1>Resurface<br>Reality.</h1>
                <p class="description">
                    The mess is just a layer. Move your cursor to engage the wet mop and reveal the pristine, warm grain beneath.
                </p>
                <div class="interaction-hint">
                    <div class="hint-arrow"></div>
                    Drag to Clean
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * VISUAL DESIGN ENGINE - REVISED
         * 1. Wood Texture: High-fidelity procedural grain with knots and planks.
         * 2. Liquid Physics: Organic Bézier blobs with specular highlights.
         * 3. Mop: Detailed SVG-style vector construction with wet rag texture.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: -1000, y: -1000, prevX: -1000, prevY: -1000, active: false };
        let mopAngle = -Math.PI / 4; 
        
        // --- CONFIGURATION ---
        const config = {
            woodBase: '#5d4037',      // Deep walnut
            woodLight: '#795548',     // Grain highlight
            woodDark: '#3e2723',      // Shadow
            plankGap: 5,
            
            // Liquid Palette: Rich Red Wine
            spillCore: '#3a0000',     // Deep center
            spillMid: '#7f0000',      // Body
            spillEdge: '#4a0000',     // Dried edge
            spillHighlight: 'rgba(255, 180, 180, 0.4)',
            
            // Mop Palette
            handleWood: '#d7ccc8',    // Light ash handle
            handleDark: '#a1887f',
            ragWet: '#263238',        // Dark wet slate
            ragDry: '#546e7a',        // Lighter slate
            metal: '#cfd8dc'          // Chrome connector
        };

        // --- STATE ---
        let messBlobs = [];
        let woodPattern = null;
        let noisePattern = null;

        // --- INITIALIZATION ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createWoodTexture();
            createNoiseTexture();
            spawnMess();
        }
        window.addEventListener('resize', resize);

        // --- 1. ADVANCED WOOD TEXTURE ---
        // Uses layers of noise and curves to simulate high-end hardwood.

        function createWoodTexture() {
            const pCanvas = document.createElement('canvas');
            // Pattern size
            pCanvas.width = 300; 
            pCanvas.height = 1400; // Tall to minimize vertical repetition
            const pCtx = pCanvas.getContext('2d');

            // Base Color
            pCtx.fillStyle = config.woodBase;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // Wood Grain: Layered Sine Waves
            for (let i = 0; i < 150; i++) {
                pCtx.beginPath();
                pCtx.strokeStyle = Math.random() > 0.5 ? config.woodLight : config.woodDark;
                pCtx.globalAlpha = Math.random() * 0.15 + 0.05;
                pCtx.lineWidth = Math.random() * 2 + 1;
                
                let y = Math.random() * pCanvas.height;
                pCtx.moveTo(0, y);
                
                // Organic curves
                for (let x = 0; x < pCanvas.width; x += 20) {
                    // The 'y' shifts based on sine waves to create grain flow
                    y += (Math.sin(x * 0.02 + i) * 2) + (Math.random() - 0.5);
                    pCtx.lineTo(x, y);
                }
                pCtx.stroke();
            }
            pCtx.globalAlpha = 1.0;

            // Wood Knots (Visual Interest)
            const addKnot = (x, y, r) => {
                const grad = pCtx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, config.woodDark);
                grad.addColorStop(0.4, config.woodBase);
                grad.addColorStop(0.8, config.woodLight);
                grad.addColorStop(1, 'transparent');
                pCtx.fillStyle = grad;
                pCtx.beginPath();
                // Elliptical knots
                pCtx.ellipse(x, y, r, r * 0.6, Math.PI/4, 0, Math.PI*2);
                pCtx.fill();
            };
            
            // Place a few knots
            addKnot(100, 400, 45);
            addKnot(250, 900, 35);

            // Plank Lines (Vertical Separators)
            // We simulate planks by drawing a dark shadow line and a lighter bevel line
            pCtx.fillStyle = 'rgba(0,0,0,0.4)'; // Shadow gap
            pCtx.fillRect(0, 0, config.plankGap, pCanvas.height);
            
            pCtx.fillStyle = 'rgba(255,255,255,0.05)'; // Bevel highlight
            pCtx.fillRect(config.plankGap + 2, 0, 2, pCanvas.height);

            // Create repeating pattern
            woodPattern = ctx.createPattern(pCanvas, 'repeat-x');
        }

        // --- 2. ATMOSPHERE: NOISE OVERLAY ---
        // Adds film grain to unify the vector graphics.

        function createNoiseTexture() {
            const size = 256;
            const pCanvas = document.createElement('canvas');
            pCanvas.width = size;
            pCanvas.height = size;
            const pCtx = pCanvas.getContext('2d');
            
            const imageData = pCtx.createImageData(size, size);
            const buffer = imageData.data;

            for (let i = 0; i < buffer.length; i += 4) {
                const val = Math.random() * 255;
                buffer[i] = val;     // R
                buffer[i+1] = val;   // G
                buffer[i+2] = val;   // B
                buffer[i+3] = 30;    // Alpha (Subtle)
            }
            pCtx.putImageData(imageData, 0, 0);
            noisePattern = ctx.createPattern(pCanvas, 'repeat');
        }

        // --- 3. VOLUMETRIC LIQUID SPILL (Wine) ---
        // Uses smooth curves and radial gradients for viscosity.

        function spawnMess() {
            messBlobs = [];
            const centerX = width * 0.5; // Center stage
            const centerY = height * 0.55;

            // Main Spill Body (Overlapping blobs)
            for (let i = 0; i < 12; i++) {
                messBlobs.push({
                    type: 'blob',
                    x: centerX + (Math.random() - 0.5) * 500,
                    y: centerY + (Math.random() - 0.5) * 400,
                    radius: 80 + Math.random() * 120,
                    alpha: 1,
                    rotation: Math.random() * Math.PI
                });
            }

            // Splatters (Droplets)
            for (let i = 0; i < 80; i++) {
                messBlobs.push({
                    type: 'drop',
                    x: centerX + (Math.random() - 0.5) * 800,
                    y: centerY + (Math.random() - 0.5) * 700,
                    radius: Math.random() * 6 + 1,
                    alpha: 1
                });
            }
        }

        // --- RENDERING FUNCTIONS ---

        function drawFloor() {
            if (!woodPattern) return;
            ctx.fillStyle = woodPattern;
            ctx.fillRect(0, 0, width, height);

            // Vignette for depth (Darker corners)
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)'); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            messBlobs.forEach(p => {
                if (p.alpha <= 0.01) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.globalAlpha = p.alpha;

                if (p.type === 'blob') {
                    // Draw Organic Blob Shape using Bezier curves
                    ctx.beginPath();
                    const points = 8;
                    for (let i = 0; i <= points; i++) {
                        const angle = (i / points) * Math.PI * 2;
                        // Vary radius slightly for organic feel
                        const r = p.radius + Math.sin(angle * 3 + p.rotation) * 15; 
                        const x = Math.cos(angle) * r;
                        const y = Math.sin(angle) * r;
                        if (i===0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();

                    // Volumetric Gradient (Depth)
                    const grad = ctx.createRadialGradient(-p.radius/3, -p.radius/3, 0, 0, 0, p.radius);
                    grad.addColorStop(0, config.spillMid);
                    grad.addColorStop(0.6, config.spillCore);
                    grad.addColorStop(1, config.spillEdge);
                    
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Specular Highlight (Wetness)
                    ctx.fillStyle = config.spillHighlight;
                    ctx.beginPath();
                    ctx.ellipse(-p.radius/3, -p.radius/3, p.radius/4, p.radius/8, Math.PI/4, 0, Math.PI*2);
                    ctx.fill();

                } else {
                    // Drop
                    ctx.fillStyle = config.spillCore;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function drawMop() {
            if (!mouse.active) return;

            const mx = mouse.x;
            const my = mouse.y;
            const dx = mouse.x - mouse.prevX;
            const dy = mouse.y - mouse.prevY;
            
            // Smooth rotation logic
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                const targetAngle = Math.atan2(dy, dx) - Math.PI / 2;
                mopAngle += (targetAngle - mopAngle) * 0.15;
            }

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // 1. MOP SHADOW (On floor)
            ctx.save();
            ctx.translate(15, 15); 
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.roundRect(-50, -50, 100, 130, 15);
            ctx.fill();
            ctx.restore();

            // 2. HANDLE
            // Wood Body
            const handleGrad = ctx.createLinearGradient(-6, 0, 6, 0);
            handleGrad.addColorStop(0, config.handleDark);
            handleGrad.addColorStop(0.5, config.handleWood);
            handleGrad.addColorStop(1, config.handleDark);
            ctx.fillStyle = handleGrad;
            
            ctx.beginPath();
            ctx.roundRect(-6, -600, 12, 600, 2);
            ctx.fill();

            // 3. CONNECTOR (Metal)
            ctx.fillStyle = config.metal;
            ctx.beginPath();
            ctx.roundRect(-12, -15, 24, 25, 3);
            ctx.fill();
            // Metal highlight
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(-8, -12, 4, 18);

            // 4. MOP HEAD (Base)
            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            ctx.roundRect(-55, 10, 110, 110, 10);
            ctx.fill();

            // 5. RAG STRIPS (The "Wet Mop" texture)
            const stripCount = 10;
            const w = 110 / stripCount;
            
            for (let i = 0; i < stripCount; i++) {
                const x = -55 + (i * w);
                
                ctx.save();
                // Slight rotation per strip for realism
                ctx.rotate((Math.random() - 0.5) * 0.05);
                
                // Gradient for wet rag
                const ragGrad = ctx.createLinearGradient(x, 10, x, 120);
                ragGrad.addColorStop(0, config.ragWet);
                ragGrad.addColorStop(1, config.ragDry);
                
                ctx.fillStyle = ragGrad;
                ctx.beginPath();
                ctx.moveTo(x + 2, 10);
                ctx.lineTo(x + w - 2, 10);
                ctx.lineTo(x + w - 4, 120);
                ctx.lineTo(x + 4, 120);
                ctx.closePath();
                ctx.fill();

                // Highlight on rag
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(x + 4, 15, 3, 80);
                
                ctx.restore();
            }

            // 6. GLOSS OVERLAY (Wetness)
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.roundRect(-45, 20, 90, 90, 8);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            ctx.restore();
        }

        // --- PHYSICS ---

        function updatePhysics() {
            const cleanRadius = 80; 

            messBlobs.forEach(p => {
                if (p.alpha <= 0) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < cleanRadius) {
                    // Stronger cleaning force at center
                    const force = (1 - dist / cleanRadius);
                    p.alpha -= force * 0.15; 
                    if (p.alpha < 0) p.alpha = 0;
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Floor
            drawFloor();

            // 2. Mess (Under Mop)
            drawMess();

            // 3. Logic
            if (mouse.active) {
                updatePhysics();
                mouse.prevX = mouse.x;
                mouse.prevY = mouse.y;
            }

            // 4. Mop (Top)
            drawMop();

            // 5. Noise Overlay (Atmosphere)
            if (noisePattern) {
                ctx.fillStyle = noisePattern;
                ctx.fillRect(0, 0, width, height);
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        }, { passive: false });

        // Initialize
        resize();
        animate();

    </script>
</body>
</html>
