<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | Resurface Reality</title>
    <style>
        :root {
            --bg-dark: #1c1917;
            --text-light: #f5f5f4;
            --text-muted: #a8a29e;
            --btn-color: #7c2d12; /* Deep Terracotta */
            --btn-hover: #9a3412;
            --shadow-color: rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Hide default cursor as we draw a custom mop */
            cursor: none; 
        }

        /* Layout Container */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* The Canvas - Full Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 10;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: #d6d3d1;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .hero-text {
            max-width: 450px;
            margin-top: auto;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.95;
            font-weight: 800; /* Heavy weight per critique */
            margin-bottom: 1.5rem;
            color: #ffffff;
            /* Subtle drop shadow for legibility against wood */
            text-shadow: 0 4px 12px rgba(0,0,0,0.6); 
            letter-spacing: -0.02em;
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #e7e5e4;
            margin-bottom: 2.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: 400;
        }

        .btn {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 36px;
            background-color: var(--btn-color);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 1rem;
            letter-spacing: 0.02em;
            /* Button polish */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(1px);
        }

        /* Footer */
        .footer-info {
            display: flex;
            gap: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
                justify-content: flex-end;
                padding-bottom: 3rem;
            }
            h1 {
                font-size: 3rem;
            }
            header {
                margin-bottom: auto;
            }
            .footer-info {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-dot"></div>
                    Spotless
                </div>
                <div class="tagline">Surface Restoration</div>
            </header>

            <div class="hero-text">
                <h1>Resurface<br>Reality.</h1>
                <p class="description">
                    The mess is just a layer. Move your cursor to engage the wet mop and reveal the pristine, warm grain beneath.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset Scene</a>
            </div>

            <div class="footer-info">
                <span>Procedural Wood</span>
                <span>Fluid Dynamics</span>
                <span>Real-time Render</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * VISUAL DESIGN ENGINE - REVISED
         * 1. Warm Wood Texture (Walnut/Oak tones)
         * 2. Organic Liquid Spill (Amoeba paths, radial gradients, speculars)
         * 3. Realistic Wet Mop (Wooden handle, rag strips, angled active)
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, prevX: -1000, prevY: -1000, active: false };
        let mopAngle = -Math.PI / 4; // Default 45 deg
        
        // --- CONFIGURATION ---
        const config = {
            // Warm Wood Palette
            woodBase: '#5D4037',      // Deep brown
            woodLight: '#795548',     // Lighter grain
            woodDark: '#3E2723',      // Dark grain/shadows
            plankGap: 3,
            
            // Liquid Palette
            spillCore: '#3E2723',     // Very dark coffee
            spillEdge: '#5D4037',     // Lighter coffee
            spillHighlight: 'rgba(255,255,255,0.2)',
            
            // Mop Palette
            handleWood: '#8D6E63',
            handleDark: '#4E342E',
            metal: '#90A4AE',
            ragWet: '#455A64',        // Wet slate blue/grey
            ragDry: '#78909C'         // Dry slate
        };

        // --- STATE ---
        let messBlobs = [];
        let woodPattern = null;
        let woodPatternOffset = 0;

        // --- INITIALIZATION ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createWoodTexture();
            spawnMess();
        }
        window.addEventListener('resize', resize);

        // --- 1. REFINED FLOOR TEXTURE (Warm Wood) ---

        function createWoodTexture() {
            const pCanvas = document.createElement('canvas');
            // Create a pattern that repeats horizontally but has vertical variation
            pCanvas.width = 200; 
            pCanvas.height = 600;
            const pCtx = pCanvas.getContext('2d');

            // Base
            pCtx.fillStyle = config.woodBase;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // Generate wood grain (noise)
            for (let i = 0; i < 150; i++) {
                pCtx.strokeStyle = Math.random() > 0.5 ? config.woodLight : config.woodDark;
                pCtx.globalAlpha = Math.random() * 0.15;
                pCtx.lineWidth = Math.random() * 2;
                
                pCtx.beginPath();
                let y = Math.random() * pCanvas.height;
                pCtx.moveTo(0, y);
                
                // Wavy grain lines
                for (let x = 0; x < pCanvas.width; x += 20) {
                    y += (Math.random() - 0.5) * 10;
                    pCtx.lineTo(x, y);
                }
                pCtx.stroke();
            }
            pCtx.globalAlpha = 1.0;

            // Plank Gaps (Vertical lines)
            pCtx.fillStyle = '#1a1a1a'; // Shadow gap
            pCtx.fillRect(0, 0, config.plankGap, pCanvas.height);
            
            // Plank Highlight (Edge of the next plank)
            pCtx.fillStyle = 'rgba(255,255,255,0.05)';
            pCtx.fillRect(config.plankGap + 2, 0, 2, pCanvas.height);

            woodPattern = ctx.createPattern(pCanvas, 'repeat-x');
        }

        // --- 2. OVERHAUL 'MESS' MATERIAL (Organic Liquid) ---

        function spawnMess() {
            messBlobs = [];
            const centerX = width * 0.65;
            const centerY = height * 0.6;

            // Create "Amoeba" Blobs
            for (let i = 0; i < 12; i++) {
                messBlobs.push({
                    type: 'blob',
                    x: centerX + (Math.random() - 0.5) * 300,
                    y: centerY + (Math.random() - 0.5) * 200,
                    // Irregular shape points
                    points: generateBlobPoints(50 + Math.random() * 80), 
                    alpha: 1,
                    opacity: 0.9
                });
            }

            // Create Splatters
            for (let i = 0; i < 40; i++) {
                messBlobs.push({
                    type: 'drop',
                    x: centerX + (Math.random() - 0.5) * 500,
                    y: centerY + (Math.random() - 0.5) * 400,
                    radius: Math.random() * 6 + 1,
                    alpha: 1,
                    opacity: 0.8
                });
            }
        }

        // Helper to generate irregular blob points
        function generateBlobPoints(radius) {
            const points = [];
            const numPoints = 8;
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const r = radius + (Math.random() - 0.5) * (radius * 0.4);
                points.push({
                    x: Math.cos(angle) * r,
                    y: Math.sin(angle) * r
                });
            }
            return points;
        }

        function drawFloor() {
            if (!woodPattern) return;
            ctx.fillStyle = woodPattern;
            ctx.fillRect(0, 0, width, height);

            // Vignette for mood
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)'); // Darker edges
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            messBlobs.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.globalAlpha = p.alpha * p.opacity;

                if (p.type === 'blob') {
                    // Draw Amoeba Shape
                    ctx.beginPath();
                    const pts = p.points;
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 0; i < pts.length; i++) {
                        const p1 = pts[i];
                        const p2 = pts[(i + 1) % pts.length];
                        // Smooth curve
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
                    }
                    ctx.closePath();

                    // Radial Gradient for viscosity
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 80);
                    grad.addColorStop(0, config.spillCore);
                    grad.addColorStop(0.7, config.spillEdge);
                    grad.addColorStop(1, 'rgba(93, 64, 55, 0)'); // Soft edge
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Specular Highlight (Wetness)
                    ctx.fillStyle = config.spillHighlight;
                    ctx.beginPath();
                    // Offset highlight to top-left
                    ctx.ellipse(-15, -15, 20, 10, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    // Drop
                    ctx.fillStyle = config.spillCore;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        // --- 3. ADD THE WET MOP (Realistic, Angled, Overlapping) ---

        function drawMop() {
            if (!mouse.active) return;

            const mx = mouse.x;
            const my = mouse.y;

            // Calculate movement angle for dynamic feel
            const dx = mouse.x - mouse.prevX;
            const dy = mouse.y - mouse.prevY;
            
            // Only update angle if moving significantly
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                const targetAngle = Math.atan2(dy, dx) - Math.PI / 2;
                // Smoothly interpolate angle
                mopAngle += (targetAngle - mopAngle) * 0.1;
            }

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // --- SHADE & SHADOW ---
            // Shadow of the mop head on the floor
            ctx.save();
            ctx.translate(10, 10); // Offset shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.roundRect(-60, -60, 120, 140, 20);
            ctx.fill();
            ctx.restore();

            // --- HANDLE ---
            // Wooden Handle (extends UP from center)
            ctx.fillStyle = config.handleWood;
            ctx.beginPath();
            ctx.roundRect(-8, -500, 16, 500, 4);
            ctx.fill();
            
            // Handle Wood Grain details (simple lines)
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-4, -500); ctx.lineTo(-4, 0);
            ctx.moveTo(4, -500); ctx.lineTo(4, 0);
            ctx.stroke();

            // Metal Connector
            ctx.fillStyle = config.metal;
            ctx.beginPath();
            ctx.roundRect(-14, -10, 28, 30, 4);
            ctx.fill();
            // Connector screws
            ctx.fillStyle = '#37474F';
            ctx.beginPath(); ctx.arc(-8, 5, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, 5, 2, 0, Math.PI*2); ctx.fill();

            // --- MOP HEAD (The "Wet" Part) ---
            // Base metal plate
            ctx.fillStyle = '#546E7A';
            ctx.beginPath();
            ctx.roundRect(-65, 20, 130, 120, 15);
            ctx.fill();

            // The Rags (Wet Strips)
            // We draw them overlapping the "mess" logic area
            const stripCount = 7;
            const stripWidth = 130 / stripCount;
            
            for (let i = 0; i < stripCount; i++) {
                const x = -65 + (i * stripWidth) + 2;
                
                ctx.save();
                // Slight random rotation for each strip to look messy/wet
                ctx.rotate((Math.random() - 0.5) * 0.05);
                
                ctx.fillStyle = i % 2 === 0 ? config.ragWet : config.ragDry;
                ctx.beginPath();
                
                // Rag shape
                ctx.moveTo(x, 20);
                ctx.lineTo(x + stripWidth - 4, 20);
                ctx.lineTo(x + stripWidth - 6, 135);
                ctx.lineTo(x + 2, 135);
                ctx.closePath();
                ctx.fill();

                // Wet highlight on rag
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(x + 4, 25, 4, 100);
                
                ctx.restore();
            }

            // Wet sheen on the whole head (gloss)
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.roundRect(-55, 30, 110, 100, 10);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            ctx.restore();
        }

        // --- PHYSICS & LOGIC ---

        function updatePhysics() {
            const cleanRadius = 80; // Radius of the mop head effective cleaning area

            messBlobs.forEach(p => {
                if (p.alpha <= 0) return;

                // Distance from center of mop head (which is at mouse pos)
                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < cleanRadius) {
                    // Calculate cleaning force based on distance from center
                    // Closer to center = cleaner
                    const force = (1 - dist / cleanRadius);
                    p.alpha -= force * 0.15; // Clean speed
                    
                    if (p.alpha < 0) p.alpha = 0;
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Floor
            drawFloor();

            // 2. Draw Mess (Mess sits ON TOP of floor)
            drawMess();

            // 3. Update Logic
            if (mouse.active) {
                updatePhysics();
                mouse.prevX = mouse.x;
                mouse.prevY = mouse.y;
            }

            // 4. Draw Mop (Mop sits ON TOP of mess)
            drawMop();

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
