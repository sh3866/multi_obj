<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | Resurface Reality</title>
    <style>
        :root {
            --text-light: #f5f5f4;
            --text-muted: #d6d3d1;
            --font-stack: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1c1917;
            color: var(--text-light);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            cursor: none; /* Hide default cursor for immersion */
        }

        /* Scene Container */
        .scene-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #2e2622; /* Fallback color */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Hardware acceleration hint */
            transform: translateZ(0); 
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Align to top */
        }

        /* Typography & Layout */
        header {
            margin-bottom: 2rem;
        }

        .brand {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }

        .hero-content {
            max-width: 400px;
            /* Position specifically top-left as requested */
        }

        h1 {
            font-size: 3.5rem; /* Reduced slightly from 4.5rem */
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 1.2rem;
            color: #ffffff;
            letter-spacing: -0.03em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        p.description {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            font-weight: 400;
            max-width: 320px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Interactive Hint */
        .interaction-hint {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 2s infinite ease-in-out;
        }

        .hint-icon {
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 4px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="scene-wrapper">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-dot"></div>
                    Spotless
                </div>
            </header>

            <div class="hero-content">
                <h1>Resurface<br>Reality.</h1>
                <p class="description">
                    The mess is just a layer. Move your cursor to engage the wet mop and reveal the pristine, warm grain beneath.
                </p>
                <div class="interaction-hint">
                    <div class="hint-icon"></div>
                    Drag to Clean
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * VISUAL DESIGN ENGINE - REVISED
         * Focus: High-fidelity wood texture, volumetric liquid, realistic mop, noise grain.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: -1000, y: -1000, prevX: -1000, prevY: -1000, active: false };
        let mopAngle = -Math.PI / 4; 
        
        // --- CONFIGURATION ---
        const config = {
            woodBase: '#4a3b32',      // Darker, richer walnut base
            woodLight: '#6d5446',     // Warm grain
            woodDark: '#261c18',      // Deep shadow
            plankGap: 4,
            
            // Liquid Palette: Rich Red Wine
            spillCore: '#4a0e0e',     // Deep burgundy
            spillMid: '#721c24',      // Ruby
            spillEdge: '#5e1820',     // Dried edge
            spillHighlight: 'rgba(255, 150, 150, 0.3)',
            
            // Mop Palette
            handleWood: '#8D6E63',
            ragWet: '#3f4c6b',        // Dark damp slate
            ragDry: '#546e7a'         // Lighter slate
        };

        // --- STATE ---
        let messBlobs = [];
        let woodPattern = null;
        let noisePattern = null;

        // --- INITIALIZATION ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createWoodTexture();
            createNoiseTexture();
            spawnMess();
        }
        window.addEventListener('resize', resize);

        // --- 1. ADVANCED WOOD TEXTURE ---
        // Generates a high-contrast, realistic wood grain with knots and vertical planks.

        function createWoodTexture() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 400; 
            pCanvas.height = 1200; // Tall pattern to reduce repetition
            const pCtx = pCanvas.getContext('2d');

            // Base Color
            pCtx.fillStyle = config.woodBase;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // Procedural Grain
            // We draw multiple layers of wavy lines with varying opacity
            for (let i = 0; i < 300; i++) {
                pCtx.strokeStyle = Math.random() > 0.5 ? config.woodLight : config.woodDark;
                pCtx.globalAlpha = Math.random() * 0.15 + 0.02;
                pCtx.lineWidth = Math.random() * 3;
                
                pCtx.beginPath();
                let y = Math.random() * pCanvas.height;
                pCtx.moveTo(0, y);
                
                // Create organic wavy grain
                for (let x = 0; x < pCanvas.width; x += 10) {
                    // Wobble factor
                    let wobble = Math.sin(x * 0.01 + i) * 5; 
                    y += (Math.random() - 0.5) * 2 + (wobble * 0.1);
                    pCtx.lineTo(x, y);
                }
                pCtx.stroke();
            }
            pCtx.globalAlpha = 1.0;

            // Add Knots (Visual Interest)
            const addKnot = (x, y, r) => {
                const grad = pCtx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, config.woodDark);
                grad.addColorStop(0.5, config.woodBase);
                grad.addColorStop(1, 'transparent');
                pCtx.fillStyle = grad;
                pCtx.beginPath();
                pCtx.ellipse(x, y, r, r/2, Math.PI/4, 0, Math.PI*2);
                pCtx.fill();
            };
            
            // Random knots
            addKnot(150, 300, 40);
            addKnot(320, 800, 60);

            // Plank Gaps (Vertical Lines) - Strictly aligned
            pCtx.fillStyle = '#0f0d0c'; // Deep shadow gap
            pCtx.fillRect(0, 0, config.plankGap, pCanvas.height);
            
            // Bevel highlight on the plank edge
            pCtx.fillStyle = 'rgba(255,255,255,0.03)';
            pCtx.fillRect(config.plankGap + 2, 0, 4, pCanvas.height);

            woodPattern = ctx.createPattern(pCanvas, 'repeat-x');
        }

        // --- 2. ATMOSPHERE: NOISE OVERLAY ---
        // Adds film grain to unify the vector graphics.

        function createNoiseTexture() {
            const size = 256;
            const pCanvas = document.createElement('canvas');
            pCanvas.width = size;
            pCanvas.height = size;
            const pCtx = pCanvas.getContext('2d');
            
            const imageData = pCtx.createImageData(size, size);
            const buffer = imageData.data;

            for (let i = 0; i < buffer.length; i += 4) {
                const val = Math.random() * 255;
                buffer[i] = val;     // R
                buffer[i+1] = val;   // G
                buffer[i+2] = val;   // B
                buffer[i+3] = 20;    // Alpha (Subtle)
            }
            pCtx.putImageData(imageData, 0, 0);
            noisePattern = ctx.createPattern(pCanvas, 'repeat');
        }

        // --- 3. VOLUMETRIC LIQUID SPILL (Wine) ---

        function spawnMess() {
            messBlobs = [];
            const centerX = width * 0.5; // Center stage
            const centerY = height * 0.55;

            // Main Spill Body
            for (let i = 0; i < 8; i++) {
                messBlobs.push({
                    type: 'blob',
                    x: centerX + (Math.random() - 0.5) * 400,
                    y: centerY + (Math.random() - 0.5) * 300,
                    radius: 60 + Math.random() * 100,
                    alpha: 1,
                    rotation: Math.random() * Math.PI
                });
            }

            // Splatters
            for (let i = 0; i < 60; i++) {
                messBlobs.push({
                    type: 'drop',
                    x: centerX + (Math.random() - 0.5) * 700,
                    y: centerY + (Math.random() - 0.5) * 600,
                    radius: Math.random() * 8 + 2,
                    alpha: 1
                });
            }
        }

        // --- RENDERING FUNCTIONS ---

        function drawFloor() {
            if (!woodPattern) return;
            ctx.fillStyle = woodPattern;
            ctx.fillRect(0, 0, width, height);

            // Vignette for depth
            const grad = ctx.createRadialGradient(width/2, height/2, height/4, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.5)'); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            messBlobs.forEach(p => {
                if (p.alpha <= 0.01) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.globalAlpha = p.alpha;

                if (p.type === 'blob') {
                    // Draw Organic Blob Shape
                    ctx.beginPath();
                    const points = 8;
                    for (let i = 0; i <= points; i++) {
                        const angle = (i / points) * Math.PI * 2;
                        // Vary radius slightly for organic feel
                        const r = p.radius + Math.sin(angle * 3) * 10; 
                        const x = Math.cos(angle) * r;
                        const y = Math.sin(angle) * r;
                        if (i===0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();

                    // Volumetric Gradient
                    const grad = ctx.createRadialGradient(-p.radius/3, -p.radius/3, 0, 0, 0, p.radius);
                    grad.addColorStop(0, config.spillMid);
                    grad.addColorStop(0.8, config.spillCore);
                    grad.addColorStop(1, config.spillEdge);
                    
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Specular Highlight (Wetness)
                    ctx.fillStyle = config.spillHighlight;
                    ctx.beginPath();
                    ctx.ellipse(-p.radius/3, -p.radius/3, p.radius/4, p.radius/8, Math.PI/4, 0, Math.PI*2);
                    ctx.fill();

                } else {
                    // Drop
                    ctx.fillStyle = config.spillCore;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function drawMop() {
            if (!mouse.active) return;

            const mx = mouse.x;
            const my = mouse.y;
            const dx = mouse.x - mouse.prevX;
            const dy = mouse.y - mouse.prevY;
            
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                const targetAngle = Math.atan2(dy, dx) - Math.PI / 2;
                mopAngle += (targetAngle - mopAngle) * 0.15;
            }

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // 1. MOP SHADOW (On floor)
            ctx.save();
            ctx.translate(15, 15); 
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.roundRect(-50, -50, 100, 130, 15);
            ctx.fill();
            ctx.restore();

            // 2. HANDLE
            // Wood
            ctx.fillStyle = config.handleWood;
            ctx.beginPath();
            ctx.roundRect(-6, -600, 12, 600, 2);
            ctx.fill();
            // Wood grain detail
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-2, -600); ctx.lineTo(-2, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(2, -600); ctx.lineTo(2, 0); ctx.stroke();

            // 3. CONNECTOR (Metal)
            ctx.fillStyle = '#90A4AE';
            ctx.beginPath();
            ctx.roundRect(-12, -15, 24, 25, 3);
            ctx.fill();

            // 4. MOP HEAD (Base)
            ctx.fillStyle = '#455A64';
            ctx.beginPath();
            ctx.roundRect(-55, 10, 110, 110, 10);
            ctx.fill();

            // 5. RAG STRIPS (The "Wet Mop" texture)
            // We draw strips that overlap to look like a mop head
            const stripCount = 8;
            const w = 110 / stripCount;
            
            for (let i = 0; i < stripCount; i++) {
                const x = -55 + (i * w);
                
                ctx.save();
                // Slight rotation per strip for realism
                ctx.rotate((Math.random() - 0.5) * 0.02);
                
                // Gradient for wet rag
                const ragGrad = ctx.createLinearGradient(x, 10, x, 120);
                ragGrad.addColorStop(0, config.ragWet);
                ragGrad.addColorStop(1, config.ragDry);
                
                ctx.fillStyle = ragGrad;
                ctx.beginPath();
                ctx.moveTo(x + 2, 10);
                ctx.lineTo(x + w - 2, 10);
                ctx.lineTo(x + w - 4, 120);
                ctx.lineTo(x + 4, 120);
                ctx.closePath();
                ctx.fill();

                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(x + 4, 15, 3, 90);
                
                ctx.restore();
            }

            // 6. GLOSS OVERLAY (Wetness)
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.roundRect(-45, 20, 90, 90, 8);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            ctx.restore();
        }

        // --- PHYSICS ---

        function updatePhysics() {
            const cleanRadius = 70; 

            messBlobs.forEach(p => {
                if (p.alpha <= 0) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < cleanRadius) {
                    // Stronger cleaning force at center
                    const force = (1 - dist / cleanRadius);
                    p.alpha -= force * 0.2; 
                    if (p.alpha < 0) p.alpha = 0;
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 1. Floor
            drawFloor();

            // 2. Mess (Under Mop)
            drawMess();

            // 3. Logic
            if (mouse.active) {
                updatePhysics();
                mouse.prevX = mouse.x;
                mouse.prevY = mouse.y;
            }

            // 4. Mop (Top)
            drawMop();

            // 5. Noise Overlay (Atmosphere)
            if (noisePattern) {
                ctx.fillStyle = noisePattern;
                ctx.fillRect(0, 0, width, height);
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        }, { passive: false });

        // Initialize
        resize();
        animate();

    </script>
</body>
</html>
