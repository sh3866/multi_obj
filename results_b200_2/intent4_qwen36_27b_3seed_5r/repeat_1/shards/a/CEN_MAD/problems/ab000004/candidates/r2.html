<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Tactical Command</title>
<style>
  :root {
    --bg-dark: #05070a;
    --bg-panel: rgba(10, 15, 25, 0.9);
    --color-primary: #00f0ff; /* Cyan */
    --color-primary-dim: rgba(0, 240, 255, 0.15);
    --color-alert: #ff2a4d;   /* Red */
    --color-warn: #ffaa00;    /* Amber */
    --color-text: #e0f0ff;
    --color-text-muted: #6b8299;
    --font-mono: 'Courier New', Courier, monospace; /* System Mono */
    --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: var(--font-ui);
    color: var(--color-text);
  }

  /* --- ATMOSPHERE & BACKGROUND --- */
  #scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background: radial-gradient(circle at 50% 40%, #0a121d 0%, #020305 100%);
  }

  canvas { display: block; width: 100%; height: 100%; opacity: 0.85; }

  /* CRT Scanlines */
  .scanlines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
    opacity: 0.6;
  }

  .vignette {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 60%, #000 100%);
    pointer-events: none;
    z-index: 11;
  }

  /* --- MAIN UI LAYOUT --- */
  .ui-layer {
    position: relative;
    z-index: 20;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  /* --- HUD HEADER --- */
  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    height: 60px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 0 10px;
    margin-bottom: 20px;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
  }

  .hud-block { display: flex; flex-direction: column; justify-content: center; }
  .hud-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--color-primary);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  .hud-data {
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
  }

  .hud-data .sub { font-size: 0.7em; color: var(--color-text-muted); }
  .hud-data .val-alert { color: var(--color-alert); text-shadow: 0 0 8px var(--color-alert); }
  .hud-data .val-warn { color: var(--color-warn); }

  /* --- CENTRAL COMMAND (Flow: Title -> Briefing -> Start -> Upgrades) --- */
  .central-command {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* Vertically center the group */
    gap: 24px;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }

  /* Title */
  .game-title {
    font-family: var(--font-ui);
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 10px;
    margin: 0;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #8daab9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    text-align: center;
    line-height: 1;
  }

  /* Briefing Panel */
  .briefing-panel {
    background: linear-gradient(90deg, transparent 0%, var(--bg-panel) 15%, var(--bg-panel) 85%, transparent 100%);
    border-top: 1px solid var(--color-primary);
    border-bottom: 1px solid var(--color-primary);
    padding: 16px 40px;
    position: relative;
    text-align: center;
    width: 100%;
  }

  /* Orthogonal Decorative Corners */
  .briefing-panel::before, .briefing-panel::after {
    content: ''; position: absolute; top: 50%; width: 4px; height: 12px;
    background: var(--color-primary); transform: translateY(-50%);
    box-shadow: 0 0 8px var(--color-primary);
  }
  .briefing-panel::before { left: 0; }
  .briefing-panel::after { right: 0; }

  .briefing-text {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0;
  }
  .briefing-text strong { color: var(--color-text); }
  .briefing-text .warn { color: var(--color-alert); }

  /* START BUTTON (Orthogonal, High Contrast) */
  .start-btn {
    background: var(--color-primary);
    color: #000;
    border: 1px solid var(--color-primary);
    padding: 16px 64px;
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    box-shadow: 0 0 20px var(--color-primary-dim), inset 0 0 0 1px rgba(255,255,255,0.4);
    margin-top: 8px;
    /* Strict Orthogonal: No clip-path */
  }

  .start-btn:hover {
    background: #fff;
    box-shadow: 0 0 30px var(--color-primary);
    transform: translateY(-2px);
  }

  /* Pulsing Glow */
  .start-btn::after {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    border: 1px solid var(--color-primary);
    opacity: 0.5;
    animation: pulse-border 2s infinite;
    pointer-events: none;
  }

  @keyframes pulse-border {
    0% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.02); }
    100% { opacity: 0.2; transform: scale(1); }
  }

  /* --- UPGRADE MENU (Moved Below Button) --- */
  .upgrade-menu {
    display: flex;
    gap: 16px;
    width: 100%;
    margin-top: 10px;
  }

  .upgrade-btn {
    flex: 1;
    background: rgba(0, 240, 255, 0.03);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    /* Orthogonal corners */
  }

  .upgrade-btn:hover {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--color-primary);
    transform: translateY(-2px);
  }

  .btn-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 6px;
  }

  .btn-title {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: bold;
    color: #fff;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-stat {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--color-warn);
  }

  .btn-desc {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--color-text-muted);
    text-transform: uppercase;
  }

  /* Icons */
  svg {
    width: 16px; height: 16px;
    stroke: var(--color-primary);
    fill: none;
    stroke-width: 2;
    stroke-linecap: square; /* Orthogonal feel */
    stroke-linejoin: miter;
  }

  /* Mobile Adjustments */
  @media (max-width: 768px) {
    .game-title { font-size: 2.2rem; letter-spacing: 4px; }
    .upgrade-menu { flex-direction: column; }
    .hud-header { flex-wrap: wrap; gap: 10px; }
    .hud-block { min-width: 80px; }
    .briefing-panel { padding: 12px 20px; }
  }
</style>
</head>
<body>

<!-- 1. Background Scene -->
<div id="scene-container">
  <canvas id="bgCanvas"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>
</div>

<!-- 2. UI Layer -->
<div class="ui-layer">
  
  <!-- HUD Header (Reset State) -->
  <header class="hud-header">
    <!-- Left: Wave & HP -->
    <div style="display:flex; gap: 40px;">
      <div class="hud-block">
        <span class="hud-label">Sector Wave</span>
        <span class="hud-data">
          <span class="val-warn">00</span><span class="sub">/ 00</span>
        </span>
      </div>
      
      <div class="hud-block">
        <span class="hud-label">Planet HP</span>
        <span class="hud-data">
          <!-- Redrawn Heart Icon (Orthogonal/Stroke Match) -->
          <svg viewBox="0 0 24 24" style="width:16px; height:16px; stroke:var(--color-alert); margin-right:6px;">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          100<span class="sub">%</span>
        </span>
      </div>
    </div>

    <!-- Center: Status -->
    <div class="hud-block" style="align-items: center; opacity: 0.6;">
      <span class="hud-label" style="letter-spacing: 6px;">SYS.RDY</span>
    </div>

    <!-- Right: Credits -->
    <div class="hud-block" style="align-items: flex-end;">
      <span class="hud-label">Credits</span>
      <span class="hud-data" style="color: var(--color-warn);">100</span>
    </div>
  </header>

  <!-- Central Command (Reorganized Flow) -->
  <main class="central-command">
    
    <h1 class="game-title">Planet Defense</h1>
    
    <div class="briefing-panel">
      <p class="briefing-text">
        <strong>COMMANDER:</strong> Orbital shields critical. Hostiles detected in sector 7.<br>
        Allocate resources below. <span class="warn">FAILURE IS NOT AN OPTION.</span>
      </p>
    </div>

    <button class="start-btn">Initialize Defense</button>

    <!-- Upgrade Menu (Moved Below Button, Simplified) -->
    <section class="upgrade-menu">
      
      <!-- Upgrade 1: Damage -->
      <div class="upgrade-btn">
        <div class="btn-header">
          <span class="btn-title">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            TURRET DMG
          </span>
          <span class="btn-stat">BASE: 10</span>
        </div>
        <span class="btn-desc">Upgrade Impact</span>
      </div>

      <!-- Upgrade 2: Fire Rate -->
      <div class="upgrade-btn">
        <div class="btn-header">
          <span class="btn-title">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            FIRE RATE
          </span>
          <span class="btn-stat">BASE: 1.0s</span>
        </div>
        <span class="btn-desc">Upgrade Speed</span>
      </div>

      <!-- Upgrade 3: Reload/Cooldown -->
      <div class="upgrade-btn">
        <div class="btn-header">
          <span class="btn-title">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"></path></svg>
            SHIELD RNG
          </span>
          <span class="btn-stat">BASE: 50m</span>
        </div>
        <span class="btn-desc">Upgrade Range</span>
      </div>

    </section>
  </main>
</div>

<script>
/**
 * VISUAL ENGINE
 * Renders a procedural holographic planet and starfield.
 */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let stars = [];
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  cy = height / 2 + 80; // Planet center
  initStars();
}

function initStars() {
  stars = [];
  const numStars = 150;
  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      speed: Math.random() * 0.2 + 0.05,
      alpha: Math.random()
    });
  }
}

function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.02 + star.x));
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

function drawPlanet() {
  const radius = Math.min(width, height) * 0.35;
  
  // 1. Holographic Glow
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.4);
  glow.addColorStop(0, 'rgba(0, 240, 255, 0.05)');
  glow.addColorStop(0.5, 'rgba(0, 240, 255, 0.1)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.4, 0, Math.PI * 2);
  ctx.fill();

  // 2. Planet Body (Wireframe style)
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
  
  // Base Circle
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.stroke();

  // 3. Tech Grid (Longitudes/Latitudes)
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.clip();

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
  
  // Longitudes
  for(let i=1; i<=4; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, radius * (i/5), radius, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Latitudes
  for(let i=-3; i<=3; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - radius, cy + i * (radius * 0.35));
    ctx.lineTo(cx + radius, cy + i * (radius * 0.35));
    ctx.stroke();
  }

  ctx.restore();

  // 4. Orbital Rings (Orthogonal/Clean)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 8); 
  
  // Ring
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(0, 240, 255, 0.8)';
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 1.6, radius * 0.2, 0, 0, Math.PI * 2); 
  ctx.stroke();
  
  // Satellite
  const satAngle = time * 0.02;
  const satX = Math.cos(satAngle) * (radius * 1.6);
  const satY = Math.sin(satAngle) * (radius * 0.2);
  
  // Draw satellite only if in front (simplified z-index)
  if (Math.sin(satAngle) > -0.2) {
     ctx.fillStyle = '#fff';
     ctx.shadowBlur = 5;
     ctx.shadowColor = '#fff';
     ctx.beginPath();
     ctx.arc(satX, satY, 2, 0, Math.PI*2);
     ctx.fill();
  }

  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, width, height);
  time++;
  drawStars();
  drawPlanet();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
</body>
</html>
