<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Tactical Command</title>
<style>
  :root {
    --bg-dark: #05070a;
    --panel-bg: rgba(12, 20, 30, 0.85);
    --panel-border: rgba(0, 240, 255, 0.2);
    --primary: #00f0ff; /* Electric Cyan */
    --primary-dim: rgba(0, 240, 255, 0.15);
    --accent: #ff2a4d; /* Alert Red */
    --accent-glow: rgba(255, 42, 77, 0.5);
    --text-main: #e0f0ff;
    --text-muted: #7da0b5;
    --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    --font-mono: 'Courier New', Courier, monospace; /* Tactical Data Font */
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: var(--font-ui);
    color: var(--text-main);
  }

  /* --- BACKGROUND & ATMOSPHERE --- */
  #scene-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    /* Radial Gradient for depth */
    background: radial-gradient(circle at 50% 40%, #0f1c2e 0%, #05070a 80%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0.8;
  }

  /* Radar Grid Overlay */
  .radar-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--panel-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-border) 1px, transparent 1px);
    background-size: 100px 100px;
    background-position: center center;
    opacity: 0.1;
    mask-image: radial-gradient(circle, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle, black 30%, transparent 80%);
    pointer-events: none;
    z-index: 1;
  }

  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
    opacity: 0.4;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 50%, #000 120%);
    pointer-events: none;
    z-index: 9;
  }

  /* --- UI LAYOUT --- */
  .ui-layer {
    position: relative;
    z-index: 20;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
  }

  /* --- HUD HEADER (Top) --- */
  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    padding: 0 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .hud-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .hud-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.9;
    font-weight: 700;
  }

  .hud-data {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 0 10px var(--primary-dim);
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .hud-data .sub {
    font-size: 0.8em;
    color: var(--text-muted);
  }

  .hud-data .val-warn { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); }
  .hud-data .val-gold { color: #ffd700; }

  /* --- CENTRAL COMMAND (Middle) --- */
  .central-command {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    width: 100%;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Title Styling */
  .game-title {
    font-family: var(--font-ui);
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 8px; /* Wide sci-fi spacing */
    margin: 0;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #a5b8c8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3));
    text-align: center;
    line-height: 1;
  }

  /* Briefing Panel */
  .briefing-panel {
    background: linear-gradient(90deg, transparent 0%, var(--panel-bg) 10%, var(--panel-bg) 90%, transparent 100%);
    border-top: 1px solid var(--primary);
    border-bottom: 1px solid var(--primary);
    padding: 20px 40px;
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 600px;
  }
  
  /* Decorative corners on briefing */
  .briefing-panel::before, .briefing-panel::after {
    content: ''; position: absolute; top: 50%; width: 6px; height: 6px;
    background: var(--primary); transform: translateY(-50%);
  }
  .briefing-panel::before { left: 0; }
  .briefing-panel::after { right: 0; }

  .briefing-text {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .briefing-text strong { color: var(--text-main); }
  .briefing-text .warn { color: var(--accent); }

  /* START BUTTON (High Contrast Block) */
  .start-btn {
    background: var(--primary);
    color: #000;
    border: none;
    padding: 18px 60px;
    font-family: var(--font-mono);
    font-size: 1.2rem;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 15px var(--primary-dim);
    margin-top: 10px;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .start-btn:hover {
    background: #fff;
    box-shadow: 0 0 30px var(--primary);
    transform: scale(1.02);
  }

  /* Pulsing Glow Animation */
  .start-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7);
    animation: pulse-glow 2s infinite;
    pointer-events: none;
  }

  @keyframes pulse-glow {
    0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(0, 240, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
  }

  /* --- UPGRADE PREP PANEL (Bottom) --- */
  .prep-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-top: 2px solid var(--primary);
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    /* Angled bottom corners */
    clip-path: polygon(0 0, 100% 0, 100% 100%, calc(50% + 20px) 100%, calc(50% - 20px) 100%, 0 100%);
  }

  .prep-label {
    position: absolute;
    top: -12px;
    left: 20px;
    background: var(--bg-dark);
    padding: 0 10px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--primary);
    border: 1px solid var(--panel-border);
  }

  .upgrade-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    flex: 1;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .upgrade-card:hover {
    background: rgba(0, 240, 255, 0.05);
    border-color: var(--primary);
  }
  
  /* Active state simulation */
  .upgrade-card.active {
    border-color: var(--primary);
    background: linear-gradient(180deg, rgba(0,240,255,0.1) 0%, transparent 100%);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
  }

  .card-title {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: bold;
    color: #fff;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-level {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--primary);
    background: rgba(0, 240, 255, 0.1);
    padding: 2px 6px;
    border-radius: 2px;
  }

  .card-bar-container {
    height: 6px;
    background: rgba(0,0,0,0.5);
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .card-bar-fill {
    height: 100%;
    background: var(--primary);
    box-shadow: 0 0 8px var(--primary);
    position: relative;
  }
  
  /* Striped effect on bars */
  .card-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.2) 75%,transparent 75%,transparent);
    background-size: 10px 10px;
  }

  /* Icons */
  svg {
    width: 18px;
    height: 18px;
    stroke: var(--primary);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Mobile Adjustments */
  @media (max-width: 768px) {
    .game-title { font-size: 2rem; letter-spacing: 4px; }
    .prep-panel { flex-direction: column; gap: 10px; padding-bottom: 40px; }
    .hud-header { flex-wrap: wrap; gap: 10px; }
    .hud-block { min-width: 100px; }
  }
</style>
</head>
<body>

<!-- 1. Background Scene -->
<div id="scene-container">
  <canvas id="bgCanvas"></canvas>
  <div class="radar-grid"></div>
</div>

<!-- 2. Overlays -->
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- 3. UI Layer -->
<div class="ui-layer">
  
  <!-- HUD Header -->
  <header class="hud-header">
    <!-- Left: Wave & HP -->
    <div style="display:flex; gap: 30px;">
      <div class="hud-block">
        <span class="hud-label">Sector Wave</span>
        <span class="hud-data">
          <span class="val-warn">00</span><span class="sub">/ 12</span>
        </span>
      </div>
      
      <div class="hud-block">
        <span class="hud-label">Planet HP</span>
        <span class="hud-data">
          <svg viewBox="0 0 24 24" style="width:16px; height:16px; stroke:var(--accent); margin-right:4px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          100<span class="sub">%</span>
        </span>
      </div>
    </div>

    <!-- Center: Status -->
    <div class="hud-block" style="align-items: center; opacity: 0.7;">
      <span class="hud-label" style="letter-spacing: 4px;">DEFENSE GRID ONLINE</span>
    </div>

    <!-- Right: Credits -->
    <div class="hud-block" style="align-items: flex-end;">
      <span class="hud-label">Credits</span>
      <span class="hud-data val-gold">1,450</span>
    </div>
  </header>

  <!-- Central Command -->
  <main class="central-command">
    
    <h1 class="game-title">Planet Defense</h1>
    
    <div class="briefing-panel">
      <p class="briefing-text">
        <strong>COMMANDER:</strong> Orbital shields critical. Hostiles detected in sector 7.<br>
        Allocate resources to turret upgrades. <span class="warn">FAILURE IS NOT AN OPTION.</span>
      </p>
    </div>

    <button class="start-btn">Initialize Defense</button>

  </main>

  <!-- Prep Panel (Upgrades) -->
  <section class="prep-panel">
    <div class="prep-label">PRE-DEPLOYMENT UPGRADES</div>

    <!-- Upgrade 1: Damage -->
    <div class="upgrade-card active">
      <div class="card-header">
        <span class="card-title">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          TURRET DMG
        </span>
        <span class="card-level">LVL 3</span>
      </div>
      <div class="card-bar-container">
        <div class="card-bar-fill" style="width: 60%;"></div>
      </div>
    </div>

    <!-- Upgrade 2: Fire Rate -->
    <div class="upgrade-card">
      <div class="card-header">
        <span class="card-title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          FIRE RATE
        </span>
        <span class="card-level">LVL 1</span>
      </div>
      <div class="card-bar-container">
        <div class="card-bar-fill" style="width: 25%;"></div>
      </div>
    </div>

    <!-- Upgrade 3: Speed -->
    <div class="upgrade-card">
      <div class="card-header">
        <span class="card-title">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          TURRET SPD
        </span>
        <span class="card-level">LVL 5</span>
      </div>
      <div class="card-bar-container">
        <div class="card-bar-fill" style="width: 90%;"></div>
      </div>
    </div>

  </section>
</div>

<script>
/**
 * VISUAL ENGINE
 * Renders a procedural planet, starfield, and radar effects.
 */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let stars = [];
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  cy = height / 2 + 50; // Planet center
  initStars();
}

function initStars() {
  stars = [];
  const numStars = 150;
  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      speed: Math.random() * 0.2 + 0.05,
      alpha: Math.random()
    });
  }
}

function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.02 + star.x));
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Radar sweep effect on stars
    if (Math.random() > 0.99) {
      ctx.fillStyle = '#00f0ff';
      ctx.fill();
      ctx.fillStyle = '#fff';
    }
  });
  ctx.globalAlpha = 1.0;
}

function drawPlanet() {
  const radius = Math.min(width, height) * 0.35;
  
  // 1. Atmosphere Glow
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius * 1.3);
  glow.addColorStop(0, 'rgba(0, 240, 255, 0.15)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.3, 0, Math.PI * 2);
  ctx.fill();

  // 2. Planet Body
  const planetGrad = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, radius * 0.1, cx, cy, radius);
  planetGrad.addColorStop(0, '#1e293b'); 
  planetGrad.addColorStop(0.6, '#0f172a'); 
  planetGrad.addColorStop(1, '#020617'); 
  
  ctx.fillStyle = planetGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  // 3. Tech Grid on Planet
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.clip();

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 1;
  
  // Longitudes
  for(let i=1; i<=4; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, radius * (i/5), radius, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Latitudes
  for(let i=-3; i<=3; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - radius, cy + i * (radius * 0.3));
    ctx.lineTo(cx + radius, cy + i * (radius * 0.3));
    ctx.stroke();
  }

  ctx.restore();

  // 4. Orbital Rings
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 8); 
  
  // Back Ring
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 1.8, radius * 0.25, 0, Math.PI, Math.PI * 2); 
  ctx.stroke();

  // Front Ring
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, radius * 1.8, radius * 0.25, 0, 0, Math.PI); 
  ctx.stroke();
  
  // Satellite
  const satAngle = time * 0.015;
  const satX = Math.cos(satAngle) * (radius * 1.8);
  const satY = Math.sin(satAngle) * (radius * 0.25);
  
  if (Math.sin(satAngle) < 0) { // Front side
     ctx.fillStyle = '#fff';
     ctx.shadowBlur = 5;
     ctx.shadowColor = '#fff';
     ctx.beginPath();
     ctx.arc(satX, satY, 3, 0, Math.PI*2);
     ctx.fill();
  }

  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, width, height);
  time++;
  drawStars();
  drawPlanet();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
animate();
</script>
</body>
</html>
