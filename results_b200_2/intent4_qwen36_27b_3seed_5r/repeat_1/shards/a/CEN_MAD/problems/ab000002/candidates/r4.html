<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Matrix: Void Walker</title>
<style>
  :root {
    /* Palette: Deep Void & Neon Violet */
    --bg-deep: #050508;
    --bg-panel: rgba(10, 10, 15, 0.85);
    --bg-sidebar: rgba(8, 8, 12, 0.98);
    
    --accent-primary: #8b5cf6; 
    --accent-secondary: #4f46e5; 
    --accent-glow: rgba(139, 92, 246, 0.5);
    --accent-glow-intense: rgba(139, 92, 246, 0.9);
    --accent-hot: #c4b5fd;

    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dark: #334155;

    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-active: rgba(139, 92, 246, 0.6);

    --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; /* Fallback safe */

    /* Critique 3: Increased Node Scale */
    --node-size: 80px; 
    --node-inner-size: 72px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Critique 5: Atmospheric Background */
  .background-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 40%, #1e1b4b 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, #2e1065 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, #172554 0%, transparent 40%),
      linear-gradient(to bottom, #020203, #09090b);
  }

  /* Noise Texture Overlay */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 340px 1fr;
    width: 100vw;
    height: 100vh;
    position: relative;
    z-index: 2;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    padding: 3rem 2rem;
    z-index: 10;
    box-shadow: 20px 0 60px rgba(0,0,0,0.6);
    backdrop-filter: blur(20px);
  }

  .profile-header {
    text-align: center;
    margin-bottom: 4rem;
  }

  .avatar-container {
    width: 140px;
    height: 140px;
    margin: 0 auto 2rem;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Critique 3: Unified Geometry (Hexagon) with Bevel/Lighting */
  .avatar-hex {
    width: 100%;
    height: 100%;
    background: #0f0f13;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(139, 92, 246, 0.4);
  }
  
  /* Inner Bevel Layer */
  .avatar-hex::before {
    content: '';
    position: absolute;
    inset: 2px;
    background: linear-gradient(135deg, #2e1065, #000);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 0;
  }

  /* Lighting Overlay */
  .avatar-hex::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, transparent 50%);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 1;
  }

  .avatar-hex svg {
    width: 60px;
    height: 60px;
    fill: var(--accent-primary);
    filter: drop-shadow(0 0 15px var(--accent-glow));
    z-index: 2;
  }

  .char-name {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .char-class {
    font-size: 0.8rem;
    color: var(--accent-primary);
    text-transform: uppercase;
    letter-spacing: 6px;
    font-weight: 700;
    text-shadow: 0 0 10px var(--accent-glow);
  }

  /* Stats Layout */
  .stats-container {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    width: 100%;
  }

  .stat-row {
    width: 100%;
  }

  /* Critique 4: Snapped Baseline Alignment */
  .label-val-group {
    display: flex;
    justify-content: space-between;
    align-items: flex-end; /* Snap to bottom */
    margin-bottom: 1rem;
    padding: 0 5px;
  }

  .stat-label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px; /* Optical alignment adjustment */
  }

  .stat-value {
    font-size: 3rem;
    font-weight: 200;
    color: var(--text-main);
    line-height: 1;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }

  /* XP Bar */
  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
    width: 75%;
    box-shadow: 0 0 15px var(--accent-glow);
    position: relative;
  }
  
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: translateX(-100%);
    animation: shimmer 3s infinite;
  }

  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }

  .xp-text {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: 0.75rem;
    font-family: monospace;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  /* Critique 3 & 4: Refined Available Points */
  .sp-container {
    width: 100%;
    padding: 2rem;
    background: transparent;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .sp-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
    margin-bottom: 1rem;
  }

  .sp-value {
    font-size: 4rem;
    font-weight: 700;
    color: var(--text-main);
    text-shadow: 0 0 25px var(--accent-glow);
    letter-spacing: -2px;
    line-height: 1;
    position: relative;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  /* Decorative Hexagonal Bracket behind SP */
  .sp-container::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 180px; height: 180px;
    border: 1px solid rgba(139, 92, 246, 0.15);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: -1;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-bar {
    height: 100px;
    display: flex;
    align-items: center;
    padding: 0 4rem;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(5,5,8,0.8), transparent);
    z-index: 5;
  }

  /* Critique 4: Demoted Title */
  .tree-title {
    font-size: 1rem;
    color: var(--text-muted);
    letter-spacing: 6px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.6;
  }

  .tabs {
    display: flex;
    gap: 2rem;
    height: 100%;
    align-items: flex-end;
    padding-bottom: 20px;
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
    position: relative;
    font-weight: 600;
    opacity: 0.5;
  }

  .tab:hover { opacity: 1; color: var(--text-main); }

  .tab.active {
    color: var(--text-main);
    border-bottom: 2px solid var(--accent-primary);
    opacity: 1;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    /* Subtle radial focus */
    background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 60%);
  }
  .tree-viewport:active { cursor: grabbing; }

  /* --- THE TREE --- */
  .tree-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1600px;
    height: 1200px;
    transform-origin: center center;
    transition: transform 0.1s linear;
  }

  svg.connections {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Critique 2: Visible Connecting Lines */
  path.connection-line {
    fill: none;
    stroke-width: 3;
    transition: all 0.6s ease;
    stroke-linecap: round;
  }

  /* Locked Path */
  path.connection-line.locked {
    stroke: rgba(255, 255, 255, 0.03);
    stroke-dasharray: 10, 10;
  }

  /* Active Path (Pulsing Energy) */
  path.connection-line.active {
    stroke: url(#lineGradient);
    stroke-width: 4;
    filter: drop-shadow(0 0 6px var(--accent-glow));
    stroke-dasharray: none;
    animation: pulse-line 3s infinite linear;
  }

  @keyframes pulse-line {
    0% { filter: drop-shadow(0 0 4px var(--accent-glow)); }
    50% { filter: drop-shadow(0 0 12px var(--accent-glow-intense)); }
    100% { filter: drop-shadow(0 0 4px var(--accent-glow)); }
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 10;
  }

  /* Critique 3: Refined Node Rendering (Hexagon + Bevel) */
  .node-inner {
    width: 100%;
    height: 100%;
    background: #0b0b0f;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.4s;
  }
  
  /* Bevel Border & Inner Shadow */
  .node-inner::before {
    content: '';
    position: absolute;
    inset: 2px;
    background: #1e1b4b;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 1;
    transition: all 0.3s;
  }

  /* Top Highlight for 3D feel */
  .node-inner::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, transparent 50%);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 2;
    pointer-events: none;
  }

  .node-inner svg {
    width: 36px;
    height: 36px;
    z-index: 3;
    transition: fill 0.3s, filter 0.3s;
    fill: var(--text-dark);
  }

  /* STATE: LOCKED */
  .node.locked .node-inner::before {
    background: #0f0f13;
    box-shadow: inset 0 0 10px #000;
  }
  .node.locked .node-inner svg {
    fill: #334155;
    opacity: 0.4;
  }
  .node.locked .node-inner {
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* STATE: UNLOCKED (Active) */
  .node.unlocked .node-inner::before {
    background: linear-gradient(135deg, #4c1d95, #1e1b4b);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
  }
  .node.unlocked .node-inner {
    /* Border effect via padding trickery or SVG stroke, simplified here to box-shadow on pseudo */
    filter: drop-shadow(0 0 10px var(--accent-glow));
  }
  .node.unlocked .node-inner svg {
    fill: #fff;
    filter: drop-shadow(0 0 8px var(--accent-primary));
  }

  /* STATE: AVAILABLE (Can Afford) */
  .node.available .node-inner::before {
    background: linear-gradient(135deg, #312e81, #0f0f13);
    box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
  }
  .node.available .node-inner svg {
    fill: var(--accent-hot);
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
  }
  
  /* Pulse animation for available nodes */
  .node.available {
    animation: pulse-node 2.5s infinite ease-in-out;
  }
  
  @keyframes pulse-node {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.05); filter: brightness(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    width: 300px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent-secondary);
    padding: 1.5rem;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    text-align: center;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  
  /* Tooltip Arrow */
  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 12px;
    height: 12px;
    background: rgba(15, 23, 42, 0.95);
    border-right: 1px solid var(--accent-secondary);
    border-bottom: 1px solid var(--accent-secondary);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--text-main);
    margin-bottom: 0.75rem;
    font-size: 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 1rem;
    font-weight: 400;
  }

  .tooltip .cost {
    font-weight: 700;
    color: var(--accent-primary);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: inline-block;
    padding: 6px 16px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 2px;
  }

</style>
</head>

<div class="dashboard">

  <!-- Main Content -->

                </linearGradient>
            </defs>
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    // Keep defs, clear paths
    const defs = connectionsLayer.querySelector('defs');
    connectionsLayer.innerHTML = '';
    connectionsLayer.appendChild(defs);

    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve logic for smoother flow
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine line state
      // Active if start is unlocked AND end is unlocked OR available
      const isPathActive = (startNode.state === 'unlocked' && (endNode.state === 'unlocked' || endNode.state === 'available'));
      
      if (isPathActive) {
        path.classList.add('active');
      } else {
        path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${node.state === 'locked' ? 'Requires Unlock' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`)}</div>
      `;
      el.appendChild(tooltip);

      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      element.className = 'node unlocked';
      
      updateSPDisplay();
      drawConnections();
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        spDisplay.style.color = "#ef4444"; // Error red
        setTimeout(() => spDisplay.style.color = "var(--text-main)", 300);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.2)";
    setTimeout(() => spDisplay.style.transform = "scale(1)", 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING ---
  const viewport = document.getElementById('viewport');
  const treeCont = document.getElementById('tree-container');
  let isDown = false;
  let startX, startY, scrollLeft, scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.style.cursor = 'grabbing';
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => { isDown = false; viewport.style.cursor = 'grab'; });
  viewport.addEventListener('mouseup', () => { isDown = false; viewport.style.cursor = 'grab'; });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
