<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    --bg-deep: #050507;
    --bg-panel: rgba(18, 20, 26, 0.6);
    --accent-gold: #ffd700;
    --accent-gold-dim: #8a7628;
    --accent-glow: rgba(255, 215, 0, 0.4);
    --text-main: #e0e0e0;
    --text-muted: #7a849b;
    --border-rune: rgba(255, 215, 0, 0.15);
    --font-heading: 'Georgia', serif;
    --font-ui: 'Segoe UI', sans-serif;
    --node-size: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Deep Void Radial Gradient */
    background: radial-gradient(circle at 50% 40%, #161820 0%, #08090c 60%, #000000 100%);
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 280px 1fr;
    width: 96vw;
    height: 92vh;
    background: rgba(10, 12, 16, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
    border-radius: 2px;
    position: relative;
    backdrop-filter: blur(10px);
    overflow: hidden;
  }

  /* --- ARCANES BORDERS (Replaces Camera Brackets) --- */
  .rune-border {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    opacity: 0.6;
    transition: opacity 0.5s;
  }
  .dashboard:hover .rune-border { opacity: 1; }
  
  .rune-tl { top: -1px; left: -1px; width: 60px; height: 60px; border-top: 2px solid var(--accent-gold); border-left: 2px solid var(--accent-gold); box-shadow: -2px -2px 15px var(--border-rune); }
  .rune-tr { top: -1px; right: -1px; width: 60px; height: 60px; border-top: 2px solid var(--accent-gold); border-right: 2px solid var(--accent-gold); box-shadow: 2px -2px 15px var(--border-rune); }
  .rune-bl { bottom: -1px; left: -1px; width: 60px; height: 60px; border-bottom: 2px solid var(--accent-gold); border-left: 2px solid var(--accent-gold); box-shadow: -2px 2px 15px var(--border-rune); }
  .rune-br { bottom: -1px; right: -1px; width: 60px; height: 60px; border-bottom: 2px solid var(--accent-gold); border-right: 2px solid var(--accent-gold); box-shadow: 2px 2px 15px var(--border-rune); }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(20,20,25,0.8) 100%);
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    z-index: 10;
    position: relative;
  }

  .profile-header {
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 1.5rem;
  }

  .avatar-frame {
    width: 90px;
    height: 90px;
    margin: 0 auto 1rem;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Hexagon Avatar Shape */
  .avatar-frame::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--accent-gold-dim), transparent);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: -1;
    border: 1px solid var(--accent-gold);
  }
  
  .avatar-inner {
    width: 80px;
    height: 80px;
    background: #0b0c10;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-frame svg {
    width: 40px;
    height: 40px;
    fill: var(--text-main);
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 1.6rem;
    color: var(--accent-gold);
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
  }

  .char-class {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }

  /* UNIFIED STAT BLOCK */
  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .level-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: var(--font-heading);
  }

  .level-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .level-val {
    font-size: 3rem;
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .xp-container {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 0.5rem;
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
    box-shadow: 0 0 8px var(--accent-gold);
  }

  .xp-text {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: -0.5rem;
    font-family: monospace;
  }

  /* MERGED SKILL POINTS */
  .sp-container {
    margin-top: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    padding: 0.8rem 1rem;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 4px;
  }

  .sp-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .sp-val {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    color: var(--text-main);
    text-shadow: 0 0 5px rgba(255,255,255,0.1);
  }
  
  .sp-hint {
    font-size: 0.7rem;
    color: var(--accent-gold-dim);
    margin-top: 0.5rem;
    text-align: center;
    font-style: italic;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-bar {
    height: 70px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    padding: 0 3rem;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(0,0,0,0.4), transparent);
  }

  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.3rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .tabs {
    display: flex;
    gap: 3rem;
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .tab:hover { color: var(--text-main); }

  .tab.active {
    color: var(--accent-gold);
    border-bottom-color: var(--accent-gold);
    text-shadow: 0 0 10px var(--accent-glow);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 2rem;
    cursor: grab;
    /* Hide Scrollbars */
    scrollbar-width: none; 
  }
  .tree-viewport::-webkit-scrollbar { display: none; }
  .tree-viewport:active { cursor: grabbing; }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 900px;
    height: 700px;
    margin-top: 2rem;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* PATH STYLES (Critique Point 1) */
  path.connection-line {
    fill: none;
    stroke-width: 2;
    transition: all 0.5s ease;
  }

  /* Locked Path: Dim, Dashed */
  path.connection-line.locked {
    stroke: rgba(255, 255, 255, 0.08);
    stroke-dasharray: 6, 6;
  }

  /* Active Path: Solid, Glowing Gold */
  path.connection-line.active {
    stroke: var(--accent-gold);
    stroke-width: 2.5;
    filter: drop-shadow(0 0 4px var(--accent-gold));
    stroke-linecap: round;
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 10;
  }

  /* CRITIQUE: Standardized Geometry - Hexagons */
  .node-inner {
    width: 100%;
    height: 100%;
    background: #0b0c10;
    /* Hexagon Clip */
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.4s;
  }
  
  /* Stroke simulation for clip-path */
  .node-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid var(--text-muted);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    opacity: 0.3;
    transition: border-color 0.3s, opacity 0.3s, box-shadow 0.3s;
    z-index: 1;
  }

  .node-inner svg {
    width: 26px;
    height: 26px;
    z-index: 2;
    transition: fill 0.3s, filter 0.3s;
  }

  /* STATE: LOCKED (Grey) */
  .node.locked .node-inner::before {
    border-color: #333;
    opacity: 0.4;
  }
  .node.locked .node-inner svg {
    fill: #333;
    opacity: 0.5;
  }

  /* STATE: UNLOCKED (Gold) */
  .node.unlocked .node-inner {
    background: radial-gradient(circle at 50% 30%, #2a2510, #0b0c10);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
  }
  .node.unlocked .node-inner::before {
    border-color: var(--accent-gold);
    opacity: 1;
    /* Attempting glow on clipped element via pseudo shadow isn't perfect, using SVG filter on node group instead usually, but here we use filter on node */
  }
  .node.unlocked {
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  .node.unlocked .node-inner svg {
    fill: var(--accent-gold);
  }

  /* STATE: AVAILABLE (Pulsing) */
  .node.available .node-inner {
    background: radial-gradient(circle at 50% 30%, #1a1a20, #0b0c10);
  }
  .node.available .node-inner::before {
    border-color: var(--text-main);
    opacity: 0.8;
    animation: pulse-border 3s infinite;
  }
  .node.available .node-inner svg {
    fill: var(--text-main);
    opacity: 0.9;
  }

  @keyframes pulse-border {
    0% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
    50% { box-shadow: inset 0 0 10px 0 rgba(255,255,255,0.3); }
    100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    background: rgba(10, 12, 16, 0.95);
    border: 1px solid var(--accent-gold-dim);
    padding: 1rem;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, bottom 0.2s;
    box-shadow: 0 15px 30px rgba(0,0,0,0.8);
    text-align: center;
    z-index: 100;
  }
  
  /* Tooltip Arrow */
  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(10, 12, 16, 0.95);
    border-right: 1px solid var(--accent-gold-dim);
    border-bottom: 1px solid var(--accent-gold-dim);
  }

  .node:hover .tooltip {
    opacity: 1;
    bottom: 90px;
  }

  .tooltip h4 {
    color: var(--accent-gold);
    font-family: var(--font-heading);
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.5rem;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .tooltip .cost {
    margin-top: 0.75rem;
    font-weight: bold;
    color: var(--text-main);
    font-size: 0.8rem;
    display: inline-block;
    padding: 2px 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
  }

</style>
</head>
<body>

<div class="dashboard">
  
  <!-- Arcane Borders -->
  <div class="rune-border rune-tl"></div>
  <div class="rune-border rune-tr"></div>
  <div class="rune-border rune-bl"></div>
  <div class="rune-border rune-br"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <div class="avatar-inner">
          <!-- Simple SVG Knight Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <!-- Unified Stat Block -->
    <div class="stat-block">
      <div class="level-row">
        <span class="level-label">Level</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>

      <!-- Merged Skill Points -->
      <div class="sp-container">
        <span class="sp-label">Skill Points</span>
        <span class="sp-val" id="sp-display">3</span>
      </div>
      <div class="sp-hint">Click pulsing nodes to upgrade</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 90, name: "Void Core", desc: "Unlocks all Void abilities. Increases mana regeneration.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 25, y: 70, name: "Shadow Step", desc: "Teleport 10 yards instantly. Cooldown reduced by 2s.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 75, y: 70, name: "Arcane Blast", desc: "Fire a bolt of energy. +15% Critical Strike.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 50, name: "Entropy", desc: "Drain life from enemies. Heals for 50% of damage dealt.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 15, y: 50, name: "Phase Shift", desc: "Become intangible for 3s. Immune to physical damage.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 85, y: 50, name: "Nova", desc: "Explosive radius damage. Stuns enemies for 1s.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 30, name: "Void Walk", desc: "Permanent stealth while standing still.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 30, name: "Meteor", desc: "Call down destruction. Massive AoE damage.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 10, name: "Singularity", desc: "Ultimate power. Collapses space around you.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (Simple SVG Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // CRITIQUE: Dim dashed for locked, Solid glowing for unlocked
      // A line is active if both connected nodes are unlocked
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else {
        path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    // Clear existing nodes
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Inner Hexagon
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${node.state === 'locked' ? 'Requires Unlock' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`)}</div>
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      // Unlock logic
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      // Visual update
      element.className = 'node unlocked';
      
      // Update UI
      updateSPDisplay();
      drawConnections(); // Redraw lines to show active state
      
      // Check if new nodes become available (Simple logic for demo)
      // In a real app, check dependencies here
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        // Error feedback
        spDisplay.style.color = "#ff4444";
        setTimeout(() => spDisplay.style.color = "var(--text-main)", 300);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    // Subtle pop animation
    spDisplay.style.transform = "scale(1.2)";
    setTimeout(() => spDisplay.style.transform = "scale(1)", 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING FOR VIEWPORT ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.style.cursor = 'grabbing';
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.style.cursor = 'grab';
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.style.cursor = 'grab';
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
