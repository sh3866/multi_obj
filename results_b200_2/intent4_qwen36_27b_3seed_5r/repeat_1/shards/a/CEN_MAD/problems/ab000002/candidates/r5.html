<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Matrix: Void Walker</title>
<style>
  :root {
    /* Palette: Deep Void & Neon Violet */
    --bg-deep: #020204;
    --bg-panel: rgba(10, 10, 15, 0.7);
    --bg-sidebar: rgba(6, 6, 9, 0.95);
    
    --accent-primary: #8b5cf6; 
    --accent-secondary: #4f46e5; 
    --accent-glow: rgba(139, 92, 246, 0.6);
    --accent-glow-intense: rgba(139, 92, 246, 1);
    --accent-hot: #e0e7ff;

    --text-main: #f8fafc;
    --text-muted: #64748b;
    --text-dark: #1e293b;

    --border-subtle: rgba(255, 255, 255, 0.05);
    --border-active: rgba(139, 92, 246, 0.5);

    --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    
    /* Node Dimensions */
    --node-size: 60px;
    --node-gap: 70px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Critique 5: Atmospheric Background (Nebula & Grid) */
  .background-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 50%, #1e1b4b 0%, transparent 60%),
      radial-gradient(circle at 80% 20%, #312e81 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, #172554 0%, transparent 40%),
      linear-gradient(to bottom, #050508, #020204);
  }

  /* Geometric Grid Overlay */
  .grid-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    background-image: 
      linear-gradient(var(--border-subtle) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 320px 1fr;
    width: 100vw;
    height: 100vh;
    position: relative;
    z-index: 2;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
    z-index: 10;
    box-shadow: 10px 0 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
  }

  /* Avatar Area */
  .profile-header {
    text-align: center;
    margin-bottom: 3rem;
    position: relative;
  }

  .avatar-container {
    width: 120px;
    height: 120px;
    margin: 0 auto 1.5rem;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Critique 2: Hexagonal Geometry for Avatar */
  .avatar-hex {
    width: 100%;
    height: 100%;
    background: #0f0f13;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 1px solid rgba(139, 92, 246, 0.4); /* Border approximation */
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  
  .avatar-hex::before {
    content: '';
    position: absolute;
    inset: 2px;
    background: linear-gradient(135deg, #2e1065, #000);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 0;
  }

  .avatar-hex svg {
    width: 50px;
    height: 50px;
    fill: var(--accent-primary);
    filter: drop-shadow(0 0 10px var(--accent-glow));
    z-index: 2;
  }

  .char-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  .char-class {
    font-size: 0.75rem;
    color: var(--accent-primary);
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 700;
    text-shadow: 0 0 10px var(--accent-glow);
  }

  /* Stats Layout */
  .stats-container {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    width: 100%;
  }

  /* Critique 4: Refined Hierarchy */
  .stat-block {
    width: 100%;
    border-left: 2px solid rgba(255,255,255,0.1);
    padding-left: 1rem;
    position: relative;
  }

  .stat-block::before {
    content: '';
    position: absolute;
    left: -2px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--accent-primary);
    opacity: 0.3;
    transition: opacity 0.3s;
  }

  .stat-block:hover::before { opacity: 1; box-shadow: 0 0 8px var(--accent-glow); }

  .label-val-group {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.75rem;
  }

  .stat-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .stat-value {
    font-size: 2.5rem;
    font-weight: 200;
    color: var(--text-main);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* Critique 2: Hexagonal XP Bar Container */
  .xp-track-container {
    position: relative;
    padding: 4px 8px;
    background: rgba(0,0,0,0.3);
    clip-path: polygon(0% 0%, 95% 0%, 100% 50%, 95% 100%, 0% 100%, 5% 50%);
    border: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 0.5rem;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
    width: 75%;
    box-shadow: 0 0 10px var(--accent-glow);
    position: relative;
  }
  
  /* Critique 5: Glitch/Chromatic Effect on Fill */
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: translateX(-100%);
    animation: shimmer 3s infinite;
  }

  @keyframes shimmer { 100% { transform: translateX(100%); } }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    font-family: monospace;
    opacity: 0.7;
  }

  /* Critique 4: Subordinate Available Points */
  .sp-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 1rem;
    background: rgba(139, 92, 246, 0.05);
    border: 1px solid rgba(139, 92, 246, 0.2);
    clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 100%, 0 100%);
  }

  .sp-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .sp-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent-hot);
    text-shadow: 0 0 10px var(--accent-glow);
    font-family: monospace;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-bar {
    height: 80px;
    display: flex;
    align-items: center;
    padding: 0 3rem;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(5,5,8,0.9), transparent);
    z-index: 5;
    pointer-events: none; /* Let clicks pass through to tree if needed */
  }

  .header-content { pointer-events: auto; display: flex; gap: 3rem; align-items: center; }

  .tree-title {
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .tree-title::before {
    content: ''; display: block; width: 20px; height: 1px; background: var(--accent-primary);
  }

  .tabs {
    display: flex;
    gap: 2rem;
    height: 100%;
    align-items: flex-end;
    padding-bottom: 20px;
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
    opacity: 0.6;
  }

  .tab:hover { opacity: 1; color: var(--text-main); }
  .tab.active {
    color: var(--text-main);
    border-bottom: 2px solid var(--accent-primary);
    opacity: 1;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.03) 0%, transparent 70%);
  }
  .tree-viewport:active { cursor: grabbing; }

  /* --- THE TREE --- */
  .tree-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1600px;
    height: 1400px;
    transform-origin: center center;
    transition: transform 0.1s linear;
  }

  svg.connections {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* Critique 1 & 2: Visible Glowing Lines */
  path.connection-line {
    fill: none;
    stroke-width: 2;
    transition: all 0.6s ease;
    stroke-linecap: round;
  }

  /* Locked Path */
  path.connection-line.locked {
    stroke: rgba(255, 255, 255, 0.04);
    stroke-dasharray: 5, 5;
  }

  /* Active Path */
  path.connection-line.active {
    stroke: var(--accent-primary);
    stroke-width: 2;
    filter: drop-shadow(0 0 5px var(--accent-glow));
    stroke-dasharray: none;
    animation: pulse-line 4s infinite linear;
  }

  @keyframes pulse-line {
    0% { filter: drop-shadow(0 0 2px var(--accent-glow)); stroke-opacity: 0.6; }
    50% { filter: drop-shadow(0 0 8px var(--accent-glow-intense)); stroke-opacity: 1; }
    100% { filter: drop-shadow(0 0 2px var(--accent-glow)); stroke-opacity: 0.6; }
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.2);
    z-index: 10;
  }

  /* Critique 2 & 3: Unified Hexagonal Geometry */
  .node-inner {
    width: 100%;
    height: 100%;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.3s;
    /* Critique 5: Glitch Border Simulation via pseudo */
    border: 1px solid transparent; 
  }

  /* The "Crystal" Bevel */
  .node-inner::before {
    content: '';
    position: absolute;
    inset: 2px;
    background: #0b0b0f;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 1;
    transition: background 0.3s;
  }

  /* Top Highlight */
  .node-inner::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, transparent 40%);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 2;
    pointer-events: none;
  }

  .node-inner svg {
    width: 28px;
    height: 28px;
    z-index: 3;
    transition: fill 0.3s, filter 0.3s;
    fill: var(--text-dark);
  }

  /* STATE: LOCKED (Dormant) */
  .node.locked .node-inner::before {
    background: linear-gradient(135deg, #0f172a, #020617);
    box-shadow: inset 0 0 15px #000;
  }
  .node.locked .node-inner svg {
    fill: #334155;
    opacity: 0.3;
  }

  /* STATE: UNLOCKED (Active) */
  .node.unlocked .node-inner::before {
    background: linear-gradient(135deg, #4c1d95, #1e1b4b);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .node.unlocked .node-inner {
    /* Critique 5: Glitch/Chromatic Border */
    border: 1px solid var(--accent-primary);
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  .node.unlocked .node-inner svg {
    fill: #fff;
    filter: drop-shadow(0 0 5px var(--accent-primary));
  }

  /* STATE: AVAILABLE (Pulsing) */
  .node.available .node-inner::before {
    background: linear-gradient(135deg, #312e81, #0f0f13);
    box-shadow: 0 0 15px rgba(167, 139, 250, 0.3);
  }
  .node.available .node-inner {
    border: 1px solid rgba(167, 139, 250, 0.6);
  }
  .node.available .node-inner svg {
    fill: var(--accent-hot);
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
  }
  
  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 260px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent-secondary);
    padding: 1.2rem;
    /* Critique 5: Subtle Glitch Edge */
    box-shadow: 2px 2px 0px rgba(139, 92, 246, 0.3); 
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    text-align: center;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  
  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(15, 23, 42, 0.95);
    border-right: 1px solid var(--accent-secondary);
    border-bottom: 1px solid var(--accent-secondary);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--text-main);
    margin-bottom: 0.5rem;
    font-size: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .tooltip p {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    font-weight: 700;
    color: var(--accent-primary);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-block;
    padding: 4px 12px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
  }

</style>
</head>
<body>

<!-- Background Effects -->
<div class="background-layer"></div>
<div class="grid-overlay"></div>

<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-container">
        <div class="avatar-hex">
          <!-- Void Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"/>
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
          </svg>
        </div>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <div class="stats-container">
      
      <!-- Level Block -->
      <div class="stat-block">
        <div class="label-val-group">
          <span class="stat-label">Level</span>
          <span class="stat-value">42</span>
        </div>
        <div class="xp-track-container">
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
        </div>
        <div class="xp-text">12,450 / 15,000 XP</div>
      </div>

      <!-- Skill Points Block -->
      <div class="sp-container">
        <span class="sp-label">Points</span>
        <span class="sp-value" id="sp-display">3</span>
      </div>

    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="header-content">
        <div class="tree-title">Ascension Matrix</div>
        <div class="tabs">
          <div class="tab active">Combat</div>
          <div class="tab">Utility</div>
          <div class="tab">Passive</div>
        </div>
      </div>
    </div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
            <defs>
                <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--accent-secondary);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--accent-primary);stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA GENERATION ---
  // Critique 1: Generate a dense Hexagonal Grid (30-40 nodes)
  const skillTreeData = [];
  const connections = [];
  
  // Configuration for the Hex Grid
  const rows = 7;
  const maxCols = 6;
  let nodeIdCounter = 1;
  
  // Helper to get hex neighbors
  const hexDirections = [
    {q: 1, r: 0}, {q: 1, r: -1}, {q: 0, r: -1},
    {q: -1, r: 0}, {q: -1, r: 1}, {q: 0, r: 1}
  ];

  // Generate Nodes in a Hexagonal Shape
  for (let r = -3; r <= 3; r++) {
    for (let q = -3; q <= 3; q++) {
      // Check if within bounds (roughly circular/hex shape)
      if (Math.abs(q + r) <= 3 && Math.abs(q) <= 3 && Math.abs(r) <= 3) {
        
        // Convert Axial (q, r) to Pixel Coordinates (approximate for visual layout)
        // Hex width = 60, gap = 10. 
        const x = 50 + (q * 55 + (r % 2) * 27.5); // offset for pointy top hex
        const y = 90 - (r * 48); // Negative r goes up (screen coords)

        // Determine State Logic
        let state = 'locked';
        let cost = 1;
        let icon = 'core';

        // Center Node (Root)
        if (q === 0 && r === 0) {
          state = 'unlocked';
          icon = 'singularity';
          cost = 0;
        } 
        // First Ring (Available)
        else if (Math.abs(q) + Math.abs(r) + Math.abs(q+r) <= 2) {
          state = 'available';
          icon = ['blast', 'shadow', 'phase'][Math.floor(Math.random()*3)];
        }
        // Second Ring (Some Available)
        else if (Math.abs(q) + Math.abs(r) + Math.abs(q+r) <= 4) {
           if (Math.random() > 0.5) state = 'available';
           icon = ['drain', 'nova', 'walk'][Math.floor(Math.random()*3)];
           cost = 2;
        }
        // Outer Ring (Locked)
        else {
          icon = 'meteor';
          cost = 3;
        }

        skillTreeData.push({
          id: nodeIdCounter++,
          q, r, // Store axial coords for connection logic
          x, y,
          name: `Node ${nodeIdCounter-1}`, // Placeholder name
          desc: "Increases void affinity and mana regeneration.",
          state,
          icon,
          cost
        });
      }
    }
  }

  // Generate Connections based on Hex Adjacency
  skillTreeData.forEach(node => {
    // Check "Up" directions (q+1, r-1, 0,-1) to avoid duplicates
    const forwardDirs = [
      {q: 1, r: 0}, {q: 1, r: -1}, {q: 0, r: -1}
    ];

    forwardDirs.forEach(dir => {
      const neighbor = skillTreeData.find(n => n.q === node.q + dir.q && n.r === node.r + dir.r);
      if (neighbor) {
        connections.push([node.id, neighbor.id]);
      }
    });
  });

  // --- ICONS ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    const defs = connectionsLayer.querySelector('defs');
    connectionsLayer.innerHTML = '';
    connectionsLayer.appendChild(defs);

    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Straight lines for Hex Grid look better than curves
      const d = `M ${startNode.x}% ${startNode.y}% L ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine line state
      // Active if start is unlocked AND end is unlocked OR available
      const isPathActive = (startNode.state === 'unlocked' && (endNode.state === 'unlocked' || endNode.state === 'available'));
      
      if (isPathActive) {
        path.classList.add('active');
      } else {
        path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${node.state === 'locked' ? 'Requires Unlock' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`)}</div>
      `;
      el.appendChild(tooltip);

      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      element.className = 'node unlocked';
      
      updateSPDisplay();
      drawConnections();
      
      // Check neighbors to unlock them if they become available
      // (Simple logic: if all parents are unlocked, become available)
      checkNeighbors(nodeData);
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        spDisplay.style.color = "#ef4444";
        setTimeout(() => spDisplay.style.color = "var(--accent-hot)", 300);
    }
  }
  
  function checkNeighbors(unlockedNode) {
    // Find connections where this node is the parent
    const relevantConns = connections.filter(c => c[0] === unlockedNode.id);
    
    relevantConns.forEach(conn => {
        const child = skillTreeData.find(n => n.id === conn[1]);
        if (child && child.state === 'locked') {
            // Check if ALL parents of child are unlocked
            const parents = connections.filter(c => c[1] === child.id).map(c => skillTreeData.find(n => n.id === c[0]));
            const allParentsUnlocked = parents.every(p => p.state === 'unlocked');
            
            if (allParentsUnlocked) {
                child.state = 'available';
                // Update DOM directly for performance
                const el = document.querySelector(`.node[data-id="${child.id}"]`) || [...document.querySelectorAll('.node')].find(n => n.querySelector('.tooltip h4').innerText === child.name);
                if (el) el.className = 'node available';
            }
        }
    });
    drawConnections();
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.2)";
    setTimeout(() => spDisplay.style.transform = "scale(1)", 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING ---
  const viewport = document.getElementById('viewport');
  const treeCont = document.getElementById('tree-container');
  let isDown = false;
  let startX, startY, scrollLeft, scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.style.cursor = 'grabbing';
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => { isDown = false; viewport.style.cursor = 'grab'; });
  viewport.addEventListener('mouseup', () => { isDown = false; viewport.style.cursor = 'grab'; });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
