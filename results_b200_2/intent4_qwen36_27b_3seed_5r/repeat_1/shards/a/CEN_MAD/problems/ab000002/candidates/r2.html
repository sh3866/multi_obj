<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker: Skill Matrix</title>
<style>
  :root {
    /* Palette: Void & Violet */
    --bg-deep: #050505;
    --bg-panel: rgba(15, 12, 20, 0.7);
    --bg-sidebar: rgba(8, 6, 12, 0.95);
    
    --accent-primary: #8b5cf6; /* Electric Violet */
    --accent-secondary: #6366f1; /* Indigo */
    --accent-glow: rgba(139, 92, 246, 0.5);
    
    --accent-gold: #ffd700; /* Retained for Level/SP */
    --accent-gold-dim: #6b5a12;

    --text-main: #f0f0f5;
    --text-muted: #94a3b8;
    --text-dark: #475569;

    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-active: rgba(139, 92, 246, 0.4);

    --font-heading: 'Georgia', serif;
    --font-ui: 'Segoe UI', system-ui, sans-serif;
    
    --node-size: 64px;
    --node-radius: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Critique 2: Deep Void Gradient */
    background: radial-gradient(ellipse at 50% 30%, #1e1b4b 0%, #0f172a 40%, #000000 100%);
  }

  /* Noise Overlay for texture */
  body::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 300px 1fr;
    width: 98vw;
    height: 96vh;
    background: rgba(10, 10, 15, 0.4);
    border: 1px solid var(--border-subtle);
    box-shadow: 0 0 100px rgba(0,0,0,0.8);
    border-radius: 4px;
    position: relative;
    backdrop-filter: blur(12px);
    overflow: hidden;
    z-index: 1;
  }

  /* Critique 5: Polished Accents - Corner Brackets */
  .corner-accent {
    position: absolute;
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 20;
    transition: all 0.4s ease;
  }
  
  .corner-accent::before, .corner-accent::after {
    content: '';
    position: absolute;
    background: var(--text-muted);
    opacity: 0.5;
  }
  
  .corner-tl { top: 12px; left: 12px; }
  .corner-tl::before { top: 0; left: 0; width: 100%; height: 1px; }
  .corner-tl::after { top: 0; left: 0; width: 1px; height: 100%; }

  .corner-tr { top: 12px; right: 12px; }
  .corner-tr::before { top: 0; right: 0; width: 100%; height: 1px; }
  .corner-tr::after { top: 0; right: 0; width: 1px; height: 100%; }

  .corner-bl { bottom: 12px; left: 12px; }
  .corner-bl::before { bottom: 0; left: 0; width: 100%; height: 1px; }
  .corner-bl::after { bottom: 0; left: 0; width: 1px; height: 100%; }

  .corner-br { bottom: 12px; right: 12px; }
  .corner-br::before { bottom: 0; right: 0; width: 100%; height: 1px; }
  .corner-br::after { bottom: 0; right: 0; width: 1px; height: 100%; }

  /* --- SIDEBAR --- */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
    z-index: 10;
    position: relative;
  }

  .profile-header {
    text-align: center;
  }

  .avatar-container {
    width: 100px;
    height: 100px;
    margin: 0 auto 1.5rem;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Hexagon Avatar */
  .avatar-hex {
    width: 100%;
    height: 100%;
    background: #0f0f13;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border-subtle);
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  
  .avatar-hex::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: linear-gradient(135deg, #1e1b4b, #000);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: -1;
  }

  .avatar-hex svg {
    width: 48px;
    height: 48px;
    fill: var(--accent-primary);
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  .char-class {
    font-size: 0.7rem;
    color: var(--accent-primary);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
    text-shadow: 0 0 10px var(--accent-glow);
  }

  /* Critique 3: Refined Sidebar Hierarchy */
  .stats-container {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    align-items: flex-start; /* Left alignment */
    width: 100%;
  }

  .stat-row {
    width: 100%;
  }

  .label-val-group {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }

  .stat-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-value {
    font-family: var(--font-heading);
    font-size: 2.5rem;
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
  }

  /* XP Bar */
  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
    width: 75%;
    box-shadow: 0 0 10px var(--accent-glow);
    position: relative;
  }
  
  /* Shimmer effect on bar */
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: translateX(-100%);
    animation: shimmer 3s infinite;
  }

  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: 0.4rem;
    font-family: monospace;
    opacity: 0.7;
  }

  /* Critique 3: Skill Points - Bordered Container */
  .sp-container {
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--accent-gold-dim);
    background: rgba(255, 215, 0, 0.03);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    margin-top: 0.5rem;
  }
  
  /* Corner accents for SP box */
  .sp-container::before {
    content: ''; position: absolute; top: -1px; left: -1px; width: 8px; height: 8px;
    border-top: 2px solid var(--accent-gold); border-left: 2px solid var(--accent-gold);
  }
  .sp-container::after {
    content: ''; position: absolute; bottom: -1px; right: -1px; width: 8px; height: 8px;
    border-bottom: 2px solid var(--accent-gold); border-right: 2px solid var(--accent-gold);
  }

  .sp-label {
    font-size: 0.8rem;
    color: var(--accent-gold);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .sp-value {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: var(--accent-gold);
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-bar {
    height: 80px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 3rem;
    justify-content: space-between;
    background: rgba(0,0,0,0.2);
  }

  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.5rem;
    color: var(--text-main);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: normal;
    text-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
  }

  .tabs {
    display: flex;
    gap: 2.5rem;
    height: 100%;
    align-items: flex-end;
    padding-bottom: 0; /* Aligns with bottom border */
    margin-bottom: -1px; /* Overlap border */
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding-bottom: 12px; /* Distance from visual line */
    border-bottom: 1px solid transparent;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
    position: relative;
  }

  .tab:hover { color: var(--text-main); }

  /* Critique 5: Thin precise underline */
  .tab.active {
    color: var(--text-main);
    border-bottom: 1px solid var(--accent-primary);
  }
  
  /* Glow dot under active tab */
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: var(--accent-primary);
    box-shadow: 0 0 8px var(--accent-primary);
    border-radius: 50%;
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: hidden; /* Custom scroll handling */
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
  }
  .tree-viewport:active { cursor: grabbing; }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 1000px;
    height: 800px;
    /* Centered initially */
    transform-origin: center center;
    transition: transform 0.1s linear;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Critique 1: Visible Connecting Lines */
  path.connection-line {
    fill: none;
    stroke-width: 2;
    transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Locked Path */
  path.connection-line.locked {
    stroke: rgba(255, 255, 255, 0.1);
    stroke-dasharray: 4, 6;
  }

  /* Active Path */
  path.connection-line.active {
    stroke: var(--accent-primary);
    stroke-width: 3;
    filter: drop-shadow(0 0 6px var(--accent-glow));
    stroke-linecap: round;
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 10;
  }

  /* Critique 4: Standardized Node Geometry (Hexagonal Rim) */
  .node-inner {
    width: 100%;
    height: 100%;
    background: #0f0f13;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.4s;
  }
  
  /* The Rim */
  .node-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid var(--text-dark);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: 1;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .node-inner svg {
    width: 30px;
    height: 30px;
    z-index: 2;
    transition: fill 0.3s, filter 0.3s;
    fill: var(--text-dark);
  }

  /* STATE: LOCKED */
  .node.locked .node-inner::before {
    border-color: #1e293b;
  }
  .node.locked .node-inner svg {
    fill: #334155;
  }

  /* STATE: UNLOCKED (Violet Glow) */
  .node.unlocked .node-inner {
    background: radial-gradient(circle at 50% 30%, #2e1065, #0f0f13);
  }
  .node.unlocked .node-inner::before {
    border-color: var(--accent-primary);
    box-shadow: inset 0 0 15px var(--accent-glow);
  }
  .node.unlocked .node-inner svg {
    fill: var(--accent-primary);
    filter: drop-shadow(0 0 5px var(--accent-primary));
  }

  /* STATE: AVAILABLE (Pulsing Gold/White) */
  .node.available .node-inner {
    background: radial-gradient(circle at 50% 30%, #1e1b4b, #0f0f13);
  }
  .node.available .node-inner::before {
    border-color: var(--text-main);
    animation: pulse-border 2s infinite;
  }
  .node.available .node-inner svg {
    fill: var(--text-main);
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
  }

  @keyframes pulse-border {
    0% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); border-color: #64748b; }
    50% { box-shadow: inset 0 0 15px 0 rgba(255,255,255,0.2); border-color: #fff; }
    100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); border-color: #64748b; }
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 260px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent-secondary);
    padding: 1.2rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    text-align: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  
  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(15, 23, 42, 0.95);
    border-right: 1px solid var(--accent-secondary);
    border-bottom: 1px solid var(--accent-secondary);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--text-main);
    font-family: var(--font-heading);
    margin-bottom: 0.6rem;
    font-size: 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.6rem;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    font-weight: 700;
    color: var(--accent-primary);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-block;
    padding: 4px 10px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 2px;
  }

</style>
</head>
<body>

<div class="dashboard">
  
  <!-- Corner Accents -->
  <div class="corner-accent corner-tl"></div>
  <div class="corner-accent corner-tr"></div>
  <div class="corner-accent corner-bl"></div>
  <div class="corner-accent corner-br"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-container">
        <div class="avatar-hex">
          <!-- Stylized Void Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"/>
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
          </svg>
        </div>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <!-- Refined Stats -->
    <div class="stats-container">
      
      <!-- Level Block -->
      <div class="stat-row">
        <div class="label-val-group">
          <span class="stat-label">Level</span>
          <span class="stat-value">42</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <div class="xp-text">12,450 / 15,000 XP</div>
      </div>

      <!-- Skill Points Block -->
      <div class="sp-container">
        <span class="sp-label">Available Points</span>
        <span class="sp-value" id="sp-display">3</span>
      </div>

    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer"></svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

  // --- DATA ---
  // Using percentages for responsive node placement
  const skillTreeData = [
    { id: 1, x: 50, y: 85, name: "Void Core", desc: "Unlocks all Void abilities. Increases mana regeneration by 15%.", state: "unlocked", icon: "core", cost: 0 },

  // --- ICONS ---
  const icons = {

  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve logic
      const midY = (startNode.y + endNode.y) / 2;
      // Using Q (Quadratic) or C (Cubic). Cubic allows S-curve.
      // Here we use a simple vertical S-curve logic
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine line state
      // If both nodes are unlocked, the line is active.
      // If one is unlocked and one is available, line is active (visual path).
      const isPathActive = (startNode.state === 'unlocked' && (endNode.state === 'unlocked' || endNode.state === 'available'));
      
      if (isPathActive) {
        path.classList.add('active');
      } else {
        path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${node.state === 'locked' ? 'Requires Unlock' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`)}</div>
      `;
      el.appendChild(tooltip);

      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      element.className = 'node unlocked';
      
      updateSPDisplay();
      drawConnections();
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        spDisplay.style.color = "#ef4444"; // Error red
        setTimeout(() => spDisplay.style.color = "var(--accent-gold)", 300);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.2)";
    setTimeout(() => spDisplay.style.transform = "scale(1)", 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING ---
  const viewport = document.getElementById('viewport');
  const treeCont = document.getElementById('tree-container');
  let isDown = false;
  let startX, startY, scrollLeft, scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.style.cursor = 'grabbing';
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => { isDown = false; viewport.style.cursor = 'grab'; });
  viewport.addEventListener('mouseup', () => { isDown = false; viewport.style.cursor = 'grab'; });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
