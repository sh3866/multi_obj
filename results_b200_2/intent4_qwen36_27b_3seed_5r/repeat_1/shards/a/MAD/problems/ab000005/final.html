<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resurface Reality | Cleaning Simulator</title>
    <style>
        :root {
            /* Palette: Warm, Moody, High Contrast */
            --bg-color: #1a1008;
            --text-primary: #ffffff; /* Pure white for hierarchy */
            --text-secondary: #d4c5b0;
            
            /* Card Vars */
            --card-bg: rgba(15, 10, 5, 0.92); /* High opacity dark brown */
            --card-border: rgba(255, 255, 255, 0.15);
            --card-highlight: rgba(255, 255, 255, 0.05);
            --card-shadow: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none; /* Hide default cursor for custom mop */
        }

        /* The Canvas - Full Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            margin-bottom: 2rem;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.9;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: #ff9f43; 
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 159, 67, 0.6);
        }

        /* Hero Section - Solid, Legible Card */
        .hero-section {
            max-width: 400px;
            pointer-events: auto;
            
            /* Solid Background per critique */
            background: var(--card-bg);
            
            /* Crisp Border */
            border: 1px solid var(--card-border);
            
            padding: 2.5rem;
            border-radius: 4px; /* Sharper corners for industrial look */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.2rem;
            line-height: 0.95;
            font-weight: 800;
            margin-bottom: 1.2rem;
            color: var(--text-primary); /* Brightest element */
            letter-spacing: -0.03em;
        }

        p.description {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* Footer / Reset Action */
        .footer-actions {
            position: absolute;
            bottom: 0;
            right: 0;
            padding: 0 4rem 3rem 0;
            display: flex;
            justify-content: flex-end;
            width: 100%;
            pointer-events: none;
        }

        /* Reset Button - Visible, Solid */
        .btn-reset {
            pointer-events: auto;
            background: #2a2a2a; /* Solid dark grey */
            border: 1px solid #444; /* Distinct border */
            color: #fff;
            padding: 12px 28px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-reset:hover {
            background: #3d3d3d;
            border-color: #666;
            transform: translateY(-1px);
        }

        .btn-reset:active {
            transform: translateY(1px);
            background: #1a1a1a;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 1.5rem;
                justify-content: flex-end;
                padding-bottom: 5rem;
            }
            header { display: none; }
            .hero-section {
                padding: 2rem;
                max-width: 100%;
            }
            h1 { font-size: 2.5rem; }
            .footer-actions {
                position: relative;
                padding: 0;
                margin-top: 2rem;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>
    
    <div class="ui-layer">
        <header>
            <div class="brand">
                <div class="brand-dot"></div>
                Resurface
            </div>
        </header>

        <div class="hero-section">
            <h1>Restore<br>The Surface.</h1>
            <p class="description">
                A spill disrupts the order. 
                Move your cursor to engage the mop and 
                clean the floor.
            </p>
        </div>

        <div class="footer-actions">
            <button class="btn-reset" id="resetBtn">Reset Scene</button>
        </div>
    </div>

    <script>
        /**
         * REVISED ENGINE
         * Focus: High-fidelity visuals, organic physics, material definition.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
        let lastMouse = { x: 0, y: 0 };
        
        // State
        let messParticles = [];
        let floorPattern = null;
        let floorPatternCanvas = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- TEXTURES ---

        function createFloorPattern() {
            floorPatternCanvas = document.createElement('canvas');
            const plankWidth = 300;
            const plankHeight = 1200; 
            floorPatternCanvas.width = plankWidth;
            floorPatternCanvas.height = plankHeight;
            const pCtx = floorPatternCanvas.getContext('2d');

            // 1. Base Wood Gradient (Deep warm tones)
            const grad = pCtx.createLinearGradient(0, 0, plankWidth, 0);
            grad.addColorStop(0, '#2b1b10');
            grad.addColorStop(0.5, '#4a2e1d');
            grad.addColorStop(1, '#2b1b10');
            pCtx.fillStyle = grad;
            pCtx.fillRect(0, 0, plankWidth, plankHeight);

            // 2. Wood Grain (High Fidelity)
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            for (let i = 0; i < 80; i++) {
                pCtx.beginPath();
                // Varying opacity for depth
                const opacity = Math.random() * 0.15 + 0.02;
                pCtx.strokeStyle = `rgba(10, 5, 2, ${opacity})`;
                pCtx.lineWidth = Math.random() * 4 + 1;
                
                let x = Math.random() * plankWidth;
                pCtx.moveTo(x, 0);
                
                for (let y = 0; y < plankHeight; y += 20) {
                    // Perlin-like noise via random step
                    x += (Math.random() - 0.5) * 30; 
                    pCtx.quadraticCurveTo(x + (Math.random()-0.5)*40, y + 10, x, y + 20);
                }
                pCtx.stroke();
            }

            // 3. Knots (Organic imperfections)
            for(let k=0; k<3; k++) {
                pCtx.save();
                pCtx.translate(Math.random() * plankWidth, Math.random() * plankHeight);
                pCtx.rotate(Math.random() * Math.PI);
                
                // Dark center
                const kGrad = pCtx.createRadialGradient(0,0,2, 0,0,50);
                kGrad.addColorStop(0, 'rgba(10, 5, 0, 0.6)');
                kGrad.addColorStop(0.6, 'rgba(20, 10, 0, 0.2)');
                kGrad.addColorStop(1, 'rgba(20, 10, 0, 0)');
                pCtx.fillStyle = kGrad;
                pCtx.beginPath();
                pCtx.ellipse(0, 0, 20, 60, 0, 0, Math.PI*2);
                pCtx.fill();
                
                // Ring lines
                pCtx.strokeStyle = 'rgba(10, 5, 0, 0.3)';
                pCtx.lineWidth = 1.5;
                for(let r=10; r<50; r+=10) {
                    pCtx.beginPath();
                    pCtx.ellipse(0, 0, r/3, r, 0, 0, Math.PI*2);
                    pCtx.stroke();
                }
                pCtx.restore();
            }

            // 4. Plank Gaps (Deep shadows for 3D effect)
            pCtx.fillStyle = '#0a0502'; 
            pCtx.fillRect(0, 0, 8, plankHeight);
            pCtx.fillRect(plankWidth - 8, 0, 8, plankHeight);

            // 5. Highlights (Bevels)
            pCtx.fillStyle = 'rgba(255,255,255,0.03)';
            pCtx.fillRect(8, 0, 3, plankHeight);
            
            floorPattern = ctx.createPattern(floorPatternCanvas, 'repeat');
        }

        // --- MESS GENERATION (Viscous Liquid) ---

        function spawnMess() {
            messParticles = [];
            // Composition: Center-right bias
            const centerX = width * 0.65;
            const centerY = height * 0.55;

            // Main Puddle (Metaballs)
            // Using more particles for a smoother, organic blob shape
            for (let i = 0; i < 250; i++) {
                const angle = Math.random() * Math.PI * 2;
                // Organic irregular distribution
                const dist = Math.random() * (Math.min(width, height) * 0.12); 
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist * 1.8,
                    y: centerY + Math.sin(angle) * dist * 0.8, // Flattened perspective
                    radius: Math.random() * 60 + 30,
                    type: 'puddle',
                    alpha: 1,
                    removed: false
                });
            }

            // Splatters
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.2) + 150;
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist * 0.8,
                    radius: Math.random() * 12 + 4,
                    type: 'splatter',
                    alpha: 1,
                    removed: false
                });
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Vignette: Focus on center
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, width*0.8);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.85)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            // Layer 1: The Body (Viscous Liquid)
            // Creamy off-white / Pale amber
            ctx.save();
            ctx.globalCompositeOperation = 'source-over'; 
            
            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.globalAlpha = p.alpha;
                
                // Viscous Gradient: Darker edges (shadow/refraction), creamy center
                const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
                // Core: Creamy off-white
                g.addColorStop(0, '#f2e8d5'); 
                // Mid: Pale Amber
                g.addColorStop(0.6, '#e6d0b3');
                // Edge: Darker shadow to ground it (NOT glow)
                g.addColorStop(0.9, '#c4a882'); 
                g.addColorStop(1, 'rgba(150, 120, 90, 0)'); 
                
                ctx.fillStyle = g;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // Layer 2: Specular Highlights (Wetness)
            // Subtle white shine to simulate surface tension
            ctx.save();
            ctx.globalCompositeOperation = 'screen'; 
            
            messParticles.forEach(p => {
                if (p.alpha <= 0.05 || p.type !== 'puddle') return;

                ctx.globalAlpha = p.alpha * 0.3;
                
                // Offset gradient for the "shine" (top-left light source)
                const g = ctx.createRadialGradient(p.x - p.radius*0.3, p.y - p.radius*0.3, 0, p.x, p.y, p.radius);
                g.addColorStop(0, 'rgba(255, 255, 255, 0.9)'); // Bright reflection
                g.addColorStop(0.2, 'rgba(255, 255, 255, 0.2)');
                g.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.fillStyle = g;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
            
            // Layer 3: Drop Shadow (Grounding)
            // A dark shadow underneath the liquid blob to separate from floor
            ctx.save();
            ctx.globalCompositeOperation = 'multiply';
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#000';
            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;
                // Slight offset for shadow
                ctx.beginPath();
                ctx.arc(p.x + 2, p.y + 4, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Calculate velocity for dynamic tilt
            const dx = mouse.x - lastMouse.x;
            const dy = mouse.y - lastMouse.y;
            const speed = Math.sqrt(dx*dx + dy*dy);
            
            // Angle of movement
            const moveAngle = Math.atan2(dy, dx);
            
            // Add a slight wobble/tilt based on speed
            const wobble = Math.sin(Date.now() / 100) * (speed * 0.02);

            ctx.save();
            ctx.translate(mx, my);
            
            // Rotate mop to face movement direction + offset
            ctx.rotate(moveAngle + Math.PI/2 + wobble);

            // 1. Handle (Wood) - Drawn upwards
            const handleGrad = ctx.createLinearGradient(-6, 0, 6, 0);
            handleGrad.addColorStop(0, '#1a0f08');
            handleGrad.addColorStop(0.5, '#3d2616');
            handleGrad.addColorStop(1, '#1a0f08');
            
            ctx.fillStyle = handleGrad;
            ctx.beginPath();
            ctx.roundRect(-6, -600, 12, 660, 2); 
            ctx.fill();
            
            // Handle Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(-2, -600, 4, 660);

            // 2. Mop Head (The Pads)
            // Drawn as a cluster of textured lines (strings)
            const headW = 140;
            const headH = 130;
            
            // Base Shadow (Grounding the mop)
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.roundRect(-headW/2 + 8, 25, headW, headH, 30);
            ctx.fill();

            // Draw individual strings (The "Strings" of a wet mop)
            const stringCount = 22;
            const spacing = headW / stringCount;
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for(let i=0; i<stringCount; i++) {
                const x = -headW/2 + (i * spacing) + (spacing/2);
                
                // Create a wavy string path
                ctx.beginPath();
                ctx.moveTo(x - 3, 10);
                // Bezier curves for organic string hang
                ctx.bezierCurveTo(x - 8, 50, x + 8, 90, x - 2, 140);
                ctx.lineTo(x + 6, 140);
                ctx.bezierCurveTo(x + 12, 90, x - 2, 50, x + 3, 10);
                
                // Color: Darker grey/brown for a used/wet mop
                ctx.fillStyle = '#555'; 
                if (i % 3 === 0) ctx.fillStyle = '#444'; // Variation
                if (i % 7 === 0) ctx.fillStyle = '#666'; // Variation
                ctx.fill();
            }

            // 3. Wetness Overlay (The "Soaked" look)
            // Darker tint to simulate liquid absorption
            ctx.fillStyle = 'rgba(20, 10, 5, 0.5)'; 
            ctx.beginPath();
            ctx.roundRect(-headW/2 + 10, 30, headW - 20, headH - 20, 25);
            ctx.fill();

            // 4. Wet Highlights on Mop
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.roundRect(-headW/2 + 20, 40, headW - 40, 10, 5);
            ctx.fill();

            ctx.restore();

            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = 110; // Mop cleaning radius

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // Cleaning Logic
                if (dist < cleanRadius) {
                    const reduction = 0.06; // Smooth fade
                    p.alpha -= reduction;
                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            
            // Only draw mop if mouse is active
            if (mouse.x > 0 && mouse.y > 0) {
                drawMop();
            }

            updatePhysics();

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
