<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resurface Reality | Cleaning Simulator</title>
    <style>
        :root {
            --bg-color: #1a120b; /* Dark warm brown */
            --text-primary: #fffaf0; /* Floral White */
            --text-secondary: #d7ccc8; /* Light Brownish Grey */
            --accent: #d84315; /* Deep Terracotta */
            --accent-hover: #bf360c;
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; /* System fonts for offline safety */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Canvas - Full Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: none; /* Hide default cursor, we draw the mop */
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Removed the "Interactive Surface Engine" label */
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Hero Section */
        .hero-section {
            max-width: 500px;
            pointer-events: auto; /* Allow clicking buttons */
            margin-bottom: 5vh;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            text-shadow: 0 10px 30px rgba(0,0,0,0.6);
            letter-spacing: -0.03em;
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
            padding: 1rem;
            border-radius: 8px;
        }

        /* Button Styling - Warm Terracotta */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 40px;
            background-color: var(--accent);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Footer */
        .footer-info {
            display: flex;
            gap: 2rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
                justify-content: flex-end;
                padding-bottom: 6rem;
            }
            h1 {
                font-size: 3rem;
            }
            .brand {
                font-size: 1rem;
            }
            .footer-info {
                display: none;
            }
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>
    
    <div class="ui-layer">
        <header>
            <div class="brand">
                <div class="brand-dot"></div>
                Resurface
            </div>
        </header>

        <div class="hero-section">
            <h1>Resurface<br>Reality.</h1>
            <p class="description">
                The floor is a canvas. The mess is the moment. 
                Move your cursor to engage the mop and restore 
                the surface to its pristine state.
            </p>
            <a href="#" class="btn" id="resetBtn">Reset Scene</a>
        </div>

        <div class="footer-info">
            <span>Procedural Grain</span>
            <span>Fluid Dynamics</span>
        </div>
    </div>

    <script>
        /**
         * VISUAL DESIGN ENGINE - REVISED
         * Focus: Warm wood textures, realistic liquid spill, detailed mop.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
        let lastMouse = { x: 0, y: 0 };
        let mopAngle = -Math.PI / 2;
        let mopTilt = 0;

        // Configuration - Palette
        const config = {
            // Warm Wood Palette
            woodBase: '#8B5A2B',
            woodLight: '#A06B35',
            woodDark: '#5D3A1A',
            grainColor: 'rgba(40, 20, 10, 0.15)',
            
            // Liquid Palette (Coffee/Wine)
            liquidBase: '#3E2723',
            liquidHighlight: '#5D4037',
            
            // Mop Palette
            handleWood: '#4E342E',
            handleMetal: '#90A4AE',
            mopWetColor: '#263238', // Dark blue/grey when wet
            mopDryColor: '#ECEFF1'
        };

        // State
        let messParticles = [];
        let floorPattern = null;
        let floorPatternCanvas = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- TEXTURES ---

        function createFloorPattern() {
            floorPatternCanvas = document.createElement('canvas');
            const plankWidth = 160;
            const plankHeight = 600; // Long vertical planks
            floorPatternCanvas.width = plankWidth;
            floorPatternCanvas.height = plankHeight;
            const pCtx = floorPatternCanvas.getContext('2d');

            // 1. Base Wood Gradient
            const grad = pCtx.createLinearGradient(0, 0, plankWidth, 0);
            grad.addColorStop(0, config.woodDark);
            grad.addColorStop(0.5, config.woodBase);
            grad.addColorStop(1, config.woodDark);
            pCtx.fillStyle = grad;
            pCtx.fillRect(0, 0, plankWidth, plankHeight);

            // 2. Wood Grain (Procedural Noise)
            pCtx.strokeStyle = config.grainColor;
            pCtx.lineWidth = 2;
            for (let i = 0; i < 15; i++) {
                pCtx.beginPath();
                let x = Math.random() * plankWidth;
                pCtx.moveTo(x, 0);
                for (let y = 0; y < plankHeight; y += 20) {
                    x += (Math.random() - 0.5) * 10; // Wiggle
                    pCtx.lineTo(x, y);
                }
                pCtx.stroke();
            }

            // 3. Knots
            pCtx.fillStyle = 'rgba(30, 10, 0, 0.2)';
            pCtx.beginPath();
            pCtx.ellipse(plankWidth/2, plankHeight * 0.3, 15, 40, 0, 0, Math.PI*2);
            pCtx.fill();

            // 4. Plank Gaps (The "Real" look)
            // Left Gap
            pCtx.fillStyle = '#1a0f08'; // Very dark brown/black shadow
            pCtx.fillRect(0, 0, 4, plankHeight);
            // Right Gap
            pCtx.fillRect(plankWidth - 2, 0, 2, plankHeight);

            // Highlight edge
            pCtx.fillStyle = 'rgba(255,255,255,0.05)';
            pCtx.fillRect(4, 0, 1, plankHeight);

            floorPattern = ctx.createPattern(floorPatternCanvas, 'repeat');
        }

        // --- MESS GENERATION (Organic Blobs) ---

        function spawnMess() {
            messParticles = [];
            // Center the mess slightly off-center for composition
            const centerX = width * 0.65;
            const centerY = height * 0.55;

            // Generate a large puddle using overlapping circles (metaballs concept simplified)
            // We use varying opacities and sizes to create an organic shape
            for (let i = 0; i < 120; i++) {
                const angle = Math.random() * Math.PI * 2;
                // Non-uniform distribution to make it look spilled
                const dist = Math.random() * (Math.min(width, height) * 0.22); 
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    radius: Math.random() * 50 + 20,
                    type: 'puddle',
                    opacity: 0.9,
                    alpha: 1, // Wiping state
                    removed: false
                });
            }

            // Splatters (smaller, scattered further)
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.35) + 50;
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    radius: Math.random() * 8 + 2,
                    type: 'splatter',
                    opacity: 0.8,
                    alpha: 1,
                    removed: false
                });
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Vignette for depth
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            ctx.save();
            // Composite operation to make the puddles blend nicely
            // 'multiply' helps it look like it's soaking INTO the wood
            ctx.globalCompositeOperation = 'multiply'; 
            
            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.globalAlpha = p.alpha * p.opacity;
                ctx.fillStyle = config.liquidBase;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();

            // Draw Highlights (Specular) separately to pop over the multiply layer
            ctx.save();
            messParticles.forEach(p => {
                if (p.alpha <= 0.05 || p.type !== 'puddle') return;

                ctx.globalAlpha = p.alpha * 0.3;
                ctx.fillStyle = '#D7CCC8'; // Light highlight
                
                // Offset highlight to simulate light source from top-left
                ctx.beginPath();
                ctx.arc(p.x - p.radius*0.3, p.y - p.radius*0.3, p.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Calculate velocity for tilt
            const dx = mouse.x - lastMouse.x;
            const dy = mouse.y - lastMouse.y;
            const speed = Math.sqrt(dx*dx + dy*dy);
            
            // Smooth angle calculation based on movement
            const moveAngle = Math.atan2(dy, dx);
            
            // Interpolate tilt for smoother visual
            mopTilt += (dx * 0.05 - mopTilt) * 0.1;

            ctx.save();
            ctx.translate(mx, my);
            
            // Rotate the whole mop group based on movement direction + tilt
            // We add -90deg (PI/2) because the mop is drawn pointing UP relative to handle
            ctx.rotate(moveAngle + Math.PI/2 + mopTilt);

            // 1. Handle Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.roundRect(-6, -350, 12, 400, 6);
            ctx.fill();

            // 2. Handle (Wood)
            const handleGrad = ctx.createLinearGradient(-6, 0, 6, 0);
            handleGrad.addColorStop(0, '#3E2723');
            handleGrad.addColorStop(0.5, '#6D4C41');
            handleGrad.addColorStop(1, '#3E2723');
            
            ctx.fillStyle = handleGrad;
            ctx.beginPath();
            ctx.roundRect(-6, -450, 12, 500, 6);
            ctx.fill();

            // 3. Metal Connector
            ctx.fillStyle = config.handleMetal;
            ctx.beginPath();
            ctx.roundRect(-15, 0, 30, 40, 4);
            ctx.fill();

            // 4. Mop Head (The Pads)
            // The head is wide and rectangular with rounded corners
            const headW = 160;
            const headH = 140;
            
            ctx.fillStyle = '#CFD8DC'; // Base color
            ctx.beginPath();
            ctx.roundRect(-headW/2, 40, headW, headH, 15);
            ctx.fill();

            // Draw individual rags/strings
            ctx.globalCompositeOperation = 'source-over';
            const ragCount = 10;
            const ragSpacing = headW / ragCount;
            
            for(let i=0; i<ragCount; i++) {
                const x = -headW/2 + (i * ragSpacing) + 5;
                
                // Wavy line for rag
                ctx.beginPath();
                ctx.moveTo(x, 40);
                ctx.bezierCurveTo(x + 5, 80, x - 5, 120, x + 2, 180);
                ctx.lineTo(x + ragSpacing - 10, 180);
                ctx.bezierCurveTo(x + ragSpacing - 5, 120, x + ragSpacing + 5, 80, x + ragSpacing - 10, 40);
                
                // Color logic: Darker where wet (simulated by darker color)
                ctx.fillStyle = i % 2 === 0 ? '#B0BEC5' : '#ECEFF1';
                ctx.fill();
                
                // Shadow inside the rag fold
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fill();
            }

            // 5. Wetness Effect on Mop
            // Add a dark overlay to the mop head to simulate it soaking up the coffee
            ctx.fillStyle = 'rgba(62, 39, 35, 0.4)'; // Coffee color with opacity
            ctx.beginPath();
            ctx.roundRect(-headW/2 + 10, 60, headW - 20, headH - 20, 10);
            ctx.fill();

            ctx.restore();

            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = 100; // Size of the cleaning area

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // If close to mop, fade out
                if (dist < cleanRadius) {
                    const reduction = 0.08; // How fast it cleans
                    p.alpha -= reduction;
                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            
            // Only draw mop if mouse is on screen
            if (mouse.x > 0 && mouse.y > 0) {
                drawMop();
            }

            updatePhysics();

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
