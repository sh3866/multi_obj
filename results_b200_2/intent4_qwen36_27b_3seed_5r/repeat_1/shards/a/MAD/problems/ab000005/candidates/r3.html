<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resurface Reality | Cleaning Simulator</title>
    <style>
        :root {
            --bg-color: #1a1008; /* Darker, richer background */
            --text-primary: #fffcf5; /* Crisp warm white */
            --text-secondary: #e0d4c5; /* Soft beige */
            --accent: #8b3a1a; /* Burnt Amber/Terracotta */
            --accent-hover: #a84a22;
            --accent-shadow: #5e250d;
            
            /* Glassmorphism Vars */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Canvas - Full Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: none; /* Hide default cursor */
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .brand {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.9;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Hero Section - Advanced Glassmorphism */
        .hero-section {
            max-width: 440px;
            pointer-events: auto;
            margin-bottom: 4vh;
            position: relative;
            
            /* Glass Effect: High Blur + Gradient Overlay */
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            
            /* Stroke */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3.25rem;
            line-height: 0.95;
            font-weight: 700;
            margin-bottom: 1.25rem;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        p.description {
            font-size: 1.1rem; /* Increased size */
            line-height: 1.65;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.01em; /* Slight tracking */
        }

        /* Button Styling - Textured Burnt Amber */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 36px;
            background: var(--accent);
            /* Texture Gradient */
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.1));
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-size: 1rem;
            letter-spacing: 0.02em;
            
            /* Borders & Shadows for Physical Weight */
            border: 1px solid rgba(0,0,0,0.2);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.2), /* Top inner highlight */
                inset 0 -1px 0 rgba(0,0,0,0.1), /* Bottom inner shadow */
                0 4px 12px rgba(0,0,0,0.3); /* Drop shadow */
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.25),
                inset 0 -1px 0 rgba(0,0,0,0.1),
                0 8px 20px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(0);
            background-color: var(--accent-shadow);
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.3),
                0 2px 6px rgba(0,0,0,0.2);
        }

        /* Footer */
        .footer-info {
            display: flex;
            gap: 2.5rem;
            font-size: 0.8rem;
            /* Higher contrast color */
            color: rgba(255,255,255,0.6); 
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 500;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 1.5rem;
                justify-content: flex-end;
                padding-bottom: 4rem;
            }
            .hero-section {
                padding: 1.5rem;
                max-width: 100%;
            }
            h1 {
                font-size: 2.5rem;
            }
            .brand {
                font-size: 0.9rem;
            }
            .footer-info {
                display: none;
            }
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>
    
    <div class="ui-layer">
        <header>
            <div class="brand">
                <div class="brand-dot"></div>
                Resurface
            </div>
        </header>

        <div class="hero-section">
            <h1>Resurface<br>Reality.</h1>
            <p class="description">
                The floor is a canvas. The mess is the moment. 
                Move your cursor to engage the mop and restore 
                the surface to its pristine state.
            </p>
            <a href="#" class="btn" id="resetBtn">Reset Scene</a>
        </div>

        <div class="footer-info">
            <span>Procedural Grain</span>
            <span>Fluid Dynamics</span>
        </div>
    </div>

    <script>
        /**
         * VISUAL DESIGN ENGINE - REVISED
         * Focus: Warm wood textures, realistic liquid spill, detailed mop.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
        let lastMouse = { x: 0, y: 0 };
        let mopAngle = -Math.PI / 2;
        let mopTilt = 0;
        
        // State
        let messParticles = [];
        let floorPattern = null;
        let floorPatternCanvas = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- TEXTURES ---

        function createFloorPattern() {
            floorPatternCanvas = document.createElement('canvas');
            const plankWidth = 180;
            const plankHeight = 800; 
            floorPatternCanvas.width = plankWidth;
            floorPatternCanvas.height = plankHeight;
            const pCtx = floorPatternCanvas.getContext('2d');

            // 1. Base Wood Gradient (Rich Mahogany)
            const grad = pCtx.createLinearGradient(0, 0, plankWidth, 0);
            grad.addColorStop(0, '#3d2314');
            grad.addColorStop(0.2, '#5c351e');
            grad.addColorStop(0.5, '#6b3f23');
            grad.addColorStop(0.8, '#5c351e');
            grad.addColorStop(1, '#3d2314');
            pCtx.fillStyle = grad;
            pCtx.fillRect(0, 0, plankWidth, plankHeight);

            // 2. Wood Grain (Procedural Noise)
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            for (let i = 0; i < 50; i++) {
                pCtx.beginPath();
                pCtx.strokeStyle = `rgba(20, 10, 5, ${Math.random() * 0.2 + 0.05})`;
                pCtx.lineWidth = Math.random() * 2 + 0.5;
                
                let x = Math.random() * plankWidth;
                pCtx.moveTo(x, 0);
                
                // Create organic wavy lines
                for (let y = 0; y < plankHeight; y += 20) {
                    x += (Math.random() - 0.5) * 15; 
                    pCtx.quadraticCurveTo(x + (Math.random()-0.5)*20, y + 10, x, y + 20);
                }
                pCtx.stroke();
            }

            // 3. Knots
            for(let k=0; k<2; k++) {
                pCtx.save();
                pCtx.translate(Math.random() * plankWidth, Math.random() * plankHeight);
                pCtx.rotate(Math.random() * Math.PI);
                
                // Outer ring
                pCtx.beginPath();
                pCtx.ellipse(0, 0, 25, 70, 0, 0, Math.PI*2);
                pCtx.fillStyle = 'rgba(20, 10, 0, 0.15)';
                pCtx.fill();
                
                // Inner rings
                pCtx.beginPath();
                pCtx.ellipse(0, 0, 12, 35, 0, 0, Math.PI*2);
                pCtx.strokeStyle = 'rgba(20, 10, 0, 0.2)';
                pCtx.stroke();
                pCtx.restore();
            }

            // 4. Plank Gaps (Darker)
            pCtx.fillStyle = '#140a04'; 
            pCtx.fillRect(0, 0, 6, plankHeight);
            pCtx.fillRect(plankWidth - 4, 0, 4, plankHeight);

            // 5. Highlights (Bevels)
            pCtx.fillStyle = 'rgba(255,255,255,0.04)';
            pCtx.fillRect(6, 0, 2, plankHeight);
            pCtx.fillRect(plankWidth - 6, 0, 2, plankHeight);

            floorPattern = ctx.createPattern(floorPatternCanvas, 'repeat');
        }

        // --- MESS GENERATION (Organic Blobs) ---

        function spawnMess() {
            messParticles = [];
            // Center the mess slightly off-center for composition
            const centerX = width * 0.6;
            const centerY = height * 0.55;

            // Generate a large puddle using overlapping circles (metaballs concept simplified)
            // We use varying opacities and sizes to create an organic shape
            for (let i = 0; i < 160; i++) {
                const angle = Math.random() * Math.PI * 2;
                // Non-uniform distribution to make it look spilled
                const dist = Math.random() * (Math.min(width, height) * 0.18); 
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    radius: Math.random() * 65 + 30,
                    type: 'puddle',
                    opacity: 0.95,
                    alpha: 1, // Wiping state
                    removed: false
                });
            }

            // Splatters (smaller, scattered further)
            for (let i = 0; i < 90; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.3) + 80;
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    radius: Math.random() * 12 + 3,
                    type: 'splatter',
                    opacity: 0.9,
                    alpha: 1,
                    removed: false
                });
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Vignette for depth
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            ctx.save();
            // 'multiply' helps it look like it's soaking INTO the wood
            ctx.globalCompositeOperation = 'multiply'; 
            
            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.globalAlpha = p.alpha * p.opacity;
                // Deep dark coffee/wine color - No bright white centers
                ctx.fillStyle = '#1a0b08'; 
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();

            // Draw Highlights (Specular) separately to pop over the multiply layer
            ctx.save();
            ctx.globalCompositeOperation = 'screen'; // Additive blending for highlights
            
            messParticles.forEach(p => {
                if (p.alpha <= 0.05 || p.type !== 'puddle') return;

                ctx.globalAlpha = p.alpha * 0.15; // Reduced opacity for subtlety
                
                // Gradient for the rim light - Warm but not "glowing"
                const g = ctx.createRadialGradient(p.x - p.radius*0.3, p.y - p.radius*0.3, 0, p.x - p.radius*0.3, p.y - p.radius*0.3, p.radius);
                g.addColorStop(0, 'rgba(255, 220, 180, 1.0)'); // Warm highlight
                g.addColorStop(0.5, 'rgba(255, 220, 180, 0.1)');
                g.addColorStop(1, 'rgba(255, 220, 180, 0)');
                
                ctx.fillStyle = g;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Calculate velocity for tilt
            const dx = mouse.x - lastMouse.x;
            const dy = mouse.y - lastMouse.y;
            const speed = Math.sqrt(dx*dx + dy*dy);
            
            // Smooth angle calculation based on movement
            const moveAngle = Math.atan2(dy, dx);
            
            // Interpolate tilt for smoother visual
            mopTilt += (dx * 0.05 - mopTilt) * 0.1;

            ctx.save();
            ctx.translate(mx, my);
            
            // Rotate the whole mop group based on movement direction + tilt
            // We add -90deg (PI/2) because the mop is drawn pointing UP relative to handle
            ctx.rotate(moveAngle + Math.PI/2 + mopTilt);

            // 1. Handle Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.roundRect(-8, -360, 16, 420, 8);
            ctx.fill();

            // 2. Handle (Wood)
            const handleGrad = ctx.createLinearGradient(-8, 0, 8, 0);
            handleGrad.addColorStop(0, '#2D1A11');
            handleGrad.addColorStop(0.5, '#6D4C41');
            handleGrad.addColorStop(1, '#2D1A11');
            
            ctx.fillStyle = handleGrad;
            ctx.beginPath();
            ctx.roundRect(-8, -500, 16, 560, 8);
            ctx.fill();
            
            // Handle highlight
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.rect(-4, -500, 2, 560);
            ctx.fill();

            // 3. Metal Connector
            const metalGrad = ctx.createLinearGradient(-18, 0, 18, 0);
            metalGrad.addColorStop(0, '#90A4AE');
            metalGrad.addColorStop(0.5, '#CFD8DC');
            metalGrad.addColorStop(1, '#90A4AE');
            
            ctx.fillStyle = metalGrad;
            ctx.beginPath();
            ctx.roundRect(-18, 10, 36, 50, 6);
            ctx.fill();
            
            // Connector Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(-18, 30, 36, 30);

            // 4. Mop Head (The Pads)
            // The head is wide and rectangular with rounded corners
            const headW = 180;
            const headH = 160;
            
            // Base shadow for the mop head
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.roundRect(-headW/2 + 8, 68, headW, headH, 20);
            ctx.fill();

            ctx.fillStyle = '#ECEFF1'; // Base color (Clean cotton)
            ctx.beginPath();
            ctx.roundRect(-headW/2, 60, headW, headH, 20);
            ctx.fill();

            // Draw individual rags/strings
            ctx.globalCompositeOperation = 'source-over';
            const ragCount = 12;
            const ragSpacing = headW / ragCount;
            
            for(let i=0; i<ragCount; i++) {
                const x = -headW/2 + (i * ragSpacing) + 5;
                
                // Wavy line for rag
                ctx.beginPath();
                ctx.moveTo(x, 60);
                ctx.bezierCurveTo(x + 8, 100, x - 8, 150, x + 2, 220);
                ctx.lineTo(x + ragSpacing - 10, 220);
                ctx.bezierCurveTo(x + ragSpacing - 5, 150, x + ragSpacing + 8, 100, x + ragSpacing - 10, 60);
                
                // Color logic: Darker where wet (simulated by darker color)
                // Alternating shades for texture
                ctx.fillStyle = i % 2 === 0 ? '#90A4AE' : '#B0BEC5';
                ctx.fill();
                
                // Shadow inside the rag fold
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();
            }

            // 5. Wetness Effect on Mop (Viscous dark overlay)
            ctx.fillStyle = 'rgba(30, 15, 10, 0.6)'; // Dark coffee color
            ctx.beginPath();
            ctx.roundRect(-headW/2 + 15, 80, headW - 30, headH - 30, 15);
            ctx.fill();

            // Wet shine on mop
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.roundRect(-headW/2 + 20, 85, headW - 40, 20, 5);
            ctx.fill();

            ctx.restore();

            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = 120; // Size of the cleaning area

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // If close to mop, fade out
                if (dist < cleanRadius) {
                    const reduction = 0.12; // How fast it cleans
                    p.alpha -= reduction;
                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            
            // Only draw mop if mouse is on screen
            if (mouse.x > 0 && mouse.y > 0) {
                drawMop();
            }

            updatePhysics();

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
