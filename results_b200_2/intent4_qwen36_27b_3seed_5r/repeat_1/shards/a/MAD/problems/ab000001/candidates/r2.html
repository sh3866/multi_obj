<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Storybook & Wood */
            --bg-paper: #fdfbf7;
            --bg-noise: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48ZmlsdGVyIGlkPSJub2lzZSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuNjUiIG51bW9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbm9pc2UpIiBvcGFjaXR5PSIwLjA1Ii8+PC9zdmc+');
            
            --board-wood: #dcbfa6;
            --board-wood-shadow: #c4a682;
            --board-inner: #eaddce;
            
            --tile-stone: #f4f1ea;
            --tile-stone-shadow: #e0dcd1;
            --tile-border: #dcd6c8;
            
            --path-track: #6b4c3b; /* Dark wood color */
            --path-track-inner: #8a6652;
            --path-track-border: #4a352a;
            
            --accent-cub-top: #ff9f1c;
            --accent-cub-side: #e07a5f;
            --accent-cub-front: #c55b3d;
            
            --accent-star: #ffca3a;
            --accent-star-glow: rgba(255, 202, 58, 0.6);
            
            --text-main: #3d405b;
            
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            --grid-size: 5;
            --cell-size: 70px;
            --gap: 10px; /* The Gutter */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            background-image: var(--bg-noise);
            font-family: var(--font-display);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 16px;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--text-main);
            font-weight: 700;
            font-style: italic;
            text-shadow: 0 2px 0 rgba(255,255,255,0.9);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8d99ae;
            margin-top: 6px;
            font-weight: 600;
        }

        /* --- Game Board (The Tray) --- */
        .game-container {
            position: relative;
            padding: 16px;
            background-color: var(--board-wood);
            border-radius: 18px;
            /* Deep tactile shadow */
            box-shadow: 
                0 20px 40px -10px rgba(61, 64, 91, 0.3),
                0 10px 20px -5px rgba(61, 64, 91, 0.2),
                inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 -4px 6px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            padding: 8px;
            background-color: var(--board-inner);
            border-radius: 12px;
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.08);
        }

        /* --- Tiles & Gutter --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-stone);
            border-radius: 8px;
            position: relative;
            /* Raised Tile Effect */
            box-shadow: 
                0 4px 0 var(--tile-stone-shadow),
                0 6px 10px rgba(0,0,0,0.08);
            border: 1px solid var(--tile-border);
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--tile-stone-shadow);
        }

        /* --- Path Rendering (The Track Fix) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            overflow: visible;
            z-index: 0;
        }

        .path-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Layer 1: The Border/Shadow for 3D effect */
        .path-border {
            stroke: var(--path-track-border);
            stroke-width: 18px;
            opacity: 0.8;
        }

        /* Layer 2: The Main Track */
        .path-main {
            stroke: var(--path-track);
            stroke-width: 14px;
        }

        /* Layer 3: The Highlight/Inner Detail */
        .path-highlight {
            stroke: var(--path-track-inner);
            stroke-width: 8px;
            opacity: 0.6;
        }

        /* --- The Cub Token (Identity Fix) --- */
        .cub-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Soft shadow on the board */
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.25));
        }

        .cub-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- The Star Marker (Hierarchy Fix) --- */
        .star-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px; /* Scaled up */
            height: 60px;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) scale(1); }
            50% { transform: translate(-50%, -50%) translateY(-6px) scale(1.05); }
        }

        .star-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1));
        }

        /* --- Footer / Controls (Aesthetic Fix) --- */
        footer {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 700;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.1s ease;
        }

        /* Reset: Subtle Ghost Link */
        .btn-reset {
            background: transparent;
            color: #9a8c98;
            font-size: 0.9rem;
            padding: 8px 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 4px;
        }
        .btn-reset:hover {
            background: rgba(0,0,0,0.04);
            color: var(--text-main);
        }

        /* Run: Tactile Block */
        .btn-run {
            background-color: #e07a5f; /* Terracotta */
            color: white;
            font-size: 1rem;
            padding: 10px 36px;
            border-radius: 8px; /* Slight round, not pill */
            /* 3D Extrusion */
            box-shadow: 0 6px 0 #b55a42, 0 10px 10px rgba(0,0,0,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            top: 0;
        }
        
        .btn-run:hover {
            background-color: #e88c74;
            transform: translateY(-1px);
            box-shadow: 0 7px 0 #b55a42, 0 12px 12px rgba(0,0,0,0.1);
        }
        
        .btn-run:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b55a42, inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- Responsive --- */
        @media (max-width: 450px) {
            :root {
                --cell-size: 56px;
                --gap: 8px;
            }
            h1 { font-size: 2rem; }
            .game-container { padding: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Cub Token to Start
            const startTile = getTile(START.x, START.y);
            startTile.el.appendChild(createCubSVG());

            // Add Star Marker to End
            const endTile = getTile(END.x, END.y);
            endTile.el.appendChild(createStarSVG());
        }

        // --- SVG Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            el.dataset.conn = connections;
            
            // Draw the path SVGs (Layered for 3D look)
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            // Layer 1: Shadow/Border
            const pathBorder = document.createElementNS(svgNS, "path");
            pathBorder.setAttribute("class", "path-line path-border");
            
            // Layer 2: Main Track
            const pathMain = document.createElementNS(svgNS, "path");
            pathMain.setAttribute("class", "path-line path-main");
            
            // Layer 3: Highlight
            const pathHighlight = document.createElementNS(svgNS, "path");
            pathHighlight.setAttribute("class", "path-line path-highlight");
            
            // Calculate path coordinates (Center 50,50 -> Edges)
            let d = "";
            if (connections & DIR.N) d += `M50 50 L50 0 `;
            if (connections & DIR.E) d += `M50 50 L100 50 `;
            if (connections & DIR.S) d += `M50 50 L50 100 `;
            if (connections & DIR.W) d += `M50 50 L0 50 `;

            const pathD = d;

            pathBorder.setAttribute("d", pathD);
            pathMain.setAttribute("d", pathD);
            pathHighlight.setAttribute("d", pathD);
            
            svg.appendChild(pathBorder);
            svg.appendChild(pathMain);
            svg.appendChild(pathHighlight);
            el.appendChild(svg);

            // Store main path ref for color updates later
            tilePathRef = pathMain; 

            // Interaction
            el.addEventListener('click', () => {
                el.style.transform = 'scale(0.96)';
                setTimeout(() => el.style.transform = '', 100);
            });

            return { el, x, y, connections, pathMain, pathBorder, pathHighlight };
        }

        function createCubSVG() {
            // Isometric 3D Cube Construction using SVG
            const wrapper = document.createElement('div');
            wrapper.className = 'cub-wrapper';
            wrapper.id = 'cub';
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("class", "cub-svg");

            // Cube Geometry (Isometric-ish projection)
            // Top Face
            const top = document.createElementNS(svgNS, "path");
            top.setAttribute("d", "M50 10 L90 30 L50 50 L10 30 Z");
            top.setAttribute("fill", "var(--accent-cub-top)");
            top.setAttribute("stroke", "var(--accent-cub-side)");
            top.setAttribute("stroke-width", "1");
            
            // Front Face (Left-ish)
            const front = document.createElementNS(svgNS, "path");
            front.setAttribute("d", "M10 30 L50 50 L50 90 L10 70 Z");
            front.setAttribute("fill", "var(--accent-cub-side)");
            front.setAttribute("stroke", "var(--accent-cub-front)");
            front.setAttribute("stroke-width", "1");

            // Right Face (Dark side)
            const right = document.createElementNS(svgNS, "path");
            right.setAttribute("d", "M50 50 L90 30 L90 70 L50 90 Z");
            right.setAttribute("fill", "var(--accent-cub-front)");
            right.setAttribute("stroke", "var(--accent-cub-front)");
            right.setAttribute("stroke-width", "1");

            // Face Details (Eyes & Mouth on Front Face)
            // Projected coordinates roughly for the front face
            const eyeL = document.createElementNS(svgNS, "circle");
            eyeL.setAttribute("cx", "25"); eyeL.setAttribute("cy", "45"); eyeL.setAttribute("r", "4");
            eyeL.setAttribute("fill", "#3d405b");
            
            const eyeR = document.createElementNS(svgNS, "circle");
            eyeR.setAttribute("cx", "40"); eyeR.setAttribute("cy", "55"); eyeR.setAttribute("r", "4");
            eyeR.setAttribute("fill", "#3d405b");

            const mouth = document.createElementNS(svgNS, "path");
            mouth.setAttribute("d", "M28 62 Q35 68 42 60");
            mouth.setAttribute("fill", "none");
            mouth.setAttribute("stroke", "#3d405b");
            mouth.setAttribute("stroke-width", "3");
            mouth.setAttribute("stroke-linecap", "round");

            svg.appendChild(top);
            svg.appendChild(right);
            svg.appendChild(front);
            svg.appendChild(eyeL);
            svg.appendChild(eyeR);
            svg.appendChild(mouth);

            wrapper.appendChild(svg);
            return wrapper;
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-wrapper';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("class", "star-svg");
            
            // Glow Aura
            const glow = document.createElementNS(svgNS, "circle");
            glow.setAttribute("cx", "50"); glow.setAttribute("cy", "50"); glow.setAttribute("r", "40");
            glow.setAttribute("fill", "var(--accent-star-glow)");
            glow.setAttribute("opacity", "0.8");
            glow.setAttribute("filter", "blur(4px)");

            // Star Shape
            const star = document.createElementNS(svgNS, "path");
            // Centered star path
            star.setAttribute("d", "M50 15 L61 39 L87 39 L66 54 L73 80 L50 65 L27 80 L34 54 L13 39 L39 39 Z");
            star.setAttribute("fill", "var(--accent-star)");
            star.setAttribute("stroke", "#d4a373");
            star.setAttribute("stroke-width", "2");
            star.setAttribute("stroke-linejoin", "round");

            svg.appendChild(glow);
            svg.appendChild(star);
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset paths to default wood color
            tiles.forEach(t => {
                t.pathMain.style.stroke = "var(--path-track)";
                t.pathMain.style.strokeWidth = "14";
                t.pathBorder.style.stroke = "var(--path-track-border)";
                t.pathBorder.style.strokeWidth = "18";
            });

            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            if(!cub) return;

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // BFS to find path
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Animate Cub along path
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    
                    // Highlight path (Greenish Sage)
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.pathMain.style.stroke = "#81b29a"; 
                    tile.pathBorder.style.stroke = "#6b9680"; 
                    tile.pathBorder.style.strokeWidth = "16"; // Shrink border slightly to emphasize fill
                }
                
                // Win state
                setTimeout(() => {
                    const svg = cub.querySelector('.cub-svg');
                    // Spin animation via CSS class or transform
                    svg.style.transition = "transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                    svg.style.transform = "rotate(360deg) scale(1.2)";
                    
                    // Change face color to gold
                    const topFace = svg.querySelector('path:first-child');
                    topFace.setAttribute("fill", "#f2cc8f");
                }, 200);

            } else {
                alert("No path found! (Try checking the connections)");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump animation preparation
                cub.style.transform = "translate(-50%, -50%) scale(0.8) translateY(-10px)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1) translateY(0)";
                    resolve();
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
