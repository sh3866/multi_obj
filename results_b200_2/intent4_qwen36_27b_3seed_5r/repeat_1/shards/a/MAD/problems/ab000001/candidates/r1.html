<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Storybook Warmth */
            --bg-paper: #fdfbf7;
            --board-tray: #e6dcc8;
            --board-tray-shadow: #c4b89e;
            --tile-stone: #f5f1e6;
            --tile-stone-shadow: #e0dcd1;
            
            --path-dirt: #8d6e63;
            --path-highlight: #a1887f;
            
            --accent-cub: #e07a5f; /* Terracotta */
            --accent-star: #f2cc8f; /* Soft Gold */
            --accent-star-stroke: #d4a373;
            
            --text-main: #3d405b;
            --text-sub: #81b29a;
            
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            --grid-size: 5;
            --cell-size: 70px;
            --gap: 8px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Paper Texture Effect */
            background-image: 
                radial-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 30px 30px, 100% 4px, 4px 100%;
            font-family: var(--font-display);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 10px;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--text-main);
            font-weight: normal;
            font-style: italic;
            text-shadow: 0px 2px 0px rgba(255,255,255,0.8);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8d99ae;
            margin-top: 4px;
            font-weight: 700;
        }

        /* --- Game Board (The "Tray") --- */
        .game-container {
            position: relative;
            padding: 12px;
            background-color: var(--board-tray);
            border-radius: 14px;
            /* Deep tactile shadow */
            box-shadow: 
                0 12px 24px -8px rgba(61, 64, 91, 0.25),
                0 6px 10px -4px rgba(61, 64, 91, 0.15),
                inset 0 2px 4px rgba(255,255,255,0.4),
                inset 0 -4px 8px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            padding: var(--gap);
            background-color: #d6cbb8; /* Inner tray color */
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-stone);
            border-radius: 6px;
            position: relative;
            /* Stone texture feel */
            box-shadow: 
                0 3px 0 var(--tile-stone-shadow),
                0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--tile-stone-shadow);
        }

        /* SVG Drawing for Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .path-line {
            stroke: var(--path-dirt);
            stroke-width: 10; /* Thickened */
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            /* Texture overlay on path */
            filter: drop-shadow(1px 1px 0px var(--path-highlight));
        }

        /* --- Characters & Markers --- */
        
        /* The Cub (Flat 2.0) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cub-body {
            width: 100%;
            height: 100%;
            background: var(--accent-cub);
            /* Flat 2.0 shadow */
            box-shadow: 2px 3px 0px rgba(0,0,0,0.15);
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simple Face */
        .cub-face {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .eye {
            position: absolute;
            top: 38%;
            width: 5px;
            height: 5px;
            background: #3d405b;
            border-radius: 50%;
        }
        .eye.left { left: 30%; }
        .eye.right { right: 30%; }
        
        .mouth {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 4px;
            border-bottom: 2px solid #3d405b;
            border-radius: 0 0 4px 4px;
        }

        /* The Star (Goal) */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0px 2px 0px rgba(0,0,0,0.1));
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-5px) rotate(5deg); }
        }

        .star-path {
            fill: var(--accent-star);
            stroke: var(--accent-star-stroke);
            stroke-width: 1.5px;
        }

        /* --- Footer / Controls --- */
        footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 700;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        .btn-reset {
            background: transparent;
            color: #8d99ae;
            font-size: 0.85rem;
            padding: 8px 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
        }
        .btn-reset:hover {
            background: rgba(0,0,0,0.05);
            color: var(--text-main);
        }

        .btn-run {
            background-color: #81b29a; /* Sage Green */
            color: white;
            font-size: 1rem;
            padding: 10px 32px;
            border-radius: 30px;
            box-shadow: 0 4px 0 #5c8574;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            top: 0;
        }
        
        .btn-run:hover {
            background-color: #8fc1b1;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 #5c8574;
        }
        
        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #5c8574;
        }

        /* --- Responsive --- */
        @media (max-width: 450px) {
            :root {
                --cell-size: 58px;
                --gap: 6px;
            }
            h1 { font-size: 1.8rem; }
            .game-container { padding: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W (Binary mask for connections)
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        // Start/End Coordinates
        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Cub Token to Start
            const startTile = getTile(START.x, START.y);
            startTile.el.appendChild(createCubSVG());

            // Add Star Marker to End
            const endTile = getTile(END.x, END.y);
            endTile.el.appendChild(createStarSVG());
        }

        // --- SVG Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            el.dataset.conn = connections;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates based on binary mask
            let d = "";
            // Center is 50,50. N:0,50 E:100,50 S:100,50 W:0,50
            
            // Draw lines from center outwards
            if (connections & DIR.N) d += `M50 50 L50 0 `;
            if (connections & DIR.E) d += `M50 50 L100 50 `;
            if (connections & DIR.S) d += `M50 50 L50 100 `;
            if (connections & DIR.W) d += `M50 50 L0 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            // Interaction (Click to rotate - visual only)
            el.addEventListener('click', () => {
                el.style.transform = 'scale(0.95)';
                setTimeout(() => el.style.transform = '', 100);
            });

            return { el, x, y, connections, path };
        }

        function createCubSVG() {
            // Using a wrapper div for positioning and CSS styling (Flat 2.0)
            const wrapper = document.createElement('div');
            wrapper.className = 'cub-token';
            wrapper.id = 'cub';
            
            const body = document.createElement('div');
            body.className = 'cub-body';
            
            const face = document.createElement('div');
            face.className = 'cub-face';
            face.innerHTML = `
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
            `;
            
            body.appendChild(face);
            wrapper.appendChild(body);
            return wrapper;
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            // Star shape
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("class", "star-path");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            // Remove Cub
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset paths
            tiles.forEach(t => {
                t.path.style.stroke = "var(--path-dirt)";
                t.path.style.strokeWidth = "10";
            });

            // Re-init
            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            if(!cub) return;

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // BFS to find path
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Animate Cub along path
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    
                    // Highlight path
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.path.style.stroke = "#81b29a"; // Sage Green
                    tile.path.style.strokeWidth = "12";
                }
                
                // Win state
                setTimeout(() => {
                    const body = cub.querySelector('.cub-body');
                    body.style.backgroundColor = "#f2cc8f"; // Gold
                    body.style.transform = "scale(1.1) rotate(360deg)";
                    body.style.transition = "all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                }, 200);

            } else {
                alert("No path found!");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump animation
                cub.style.transform = "translate(-50%, -50%) scale(0.5)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1)";
                    resolve();
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
