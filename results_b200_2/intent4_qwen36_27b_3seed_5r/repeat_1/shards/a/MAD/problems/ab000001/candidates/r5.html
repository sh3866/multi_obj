<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Refined Storybook */
            --bg-paper: #e8dfce;
            --bg-paper-dark: #d5cbb8;
            
            --wood-frame: #7a4622;
            --wood-frame-light: #9c5a30;
            --wood-frame-shadow: #4a2b13;
            
            --board-cream: #fcf9f2;
            
            --path-clay: #d95d39; 
            --path-clay-dark: #b54524;
            --path-clay-light: #f07a5d;
            
            --text-primary: #3e2723;
            --text-secondary: #8d6e63;
            
            --accent-gold: #f4a261;
            --accent-terra: #e76f51;
            
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: 'Trebuchet MS', 'Segoe UI', Roboto, sans-serif;
            
            --grid-size: 5;
            --cell-size: 72px;
        }

        /* --- Noise Texture Generation (SVG Data URI) --- */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            background-image: radial-gradient(circle at center, #f0e8d9 0%, #e8dfce 60%, #d5cbb8 100%);
            font-family: var(--font-ui);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Header (Critique: Reduced Scale & Contrast) --- */
        header {
            text-align: center;
            margin-bottom: 16px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.6rem; /* Reduced from 3.5rem */
            margin: 0;
            color: #5d4037; /* Lightened contrast */
            line-height: 1;
            letter-spacing: -0.5px;
            font-weight: 700;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .subtitle {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 0.9rem; /* Reduced size */
            color: var(--text-secondary); /* Lighter color */
            margin-top: 4px;
            opacity: 0.8;
        }

        /* --- Game Board (Critique: Multi-layered Shadow) --- */
        .game-container {
            position: relative;
            z-index: 5;
            padding: 12px;
            background: linear-gradient(135deg, var(--wood-frame-light), var(--wood-frame));
            border-radius: 14px;
            /* Tight/Dark shadow + Soft/Light shadow */
            box-shadow: 
                0 4px 6px rgba(74, 43, 19, 0.35), /* Tight, dark */
                0 12px 24px rgba(0, 0, 0, 0.2);    /* Soft, light */
            border: 1px solid var(--wood-frame-shadow);
        }

        .game-container::after {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            pointer-events: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: 0px;
            background-color: var(--board-cream);
            /* Subtle texture */
            background-image: radial-gradient(#eaddcf 15%, transparent 16%);
            background-size: 12px 12px;
            border-radius: 6px;
            box-shadow: inset 1px 1px 4px rgba(0,0,0,0.05);
            position: relative;
        }

        /* --- Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background: transparent;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .tile:hover {
            background-color: rgba(0,0,0,0.02);
        }

        /* --- Path Aesthetics --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            overflow: visible;
            z-index: 0;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .path-shadow {
            stroke: rgba(0,0,0,0.12);
            stroke-width: 16px;
            transform: translateY(2px); 
        }

        .path-main {
            stroke: var(--path-clay);
            stroke-width: 16px;
            transition: stroke 0.3s ease;
        }

        .path-highlight {
            stroke: var(--path-clay-light);
            stroke-width: 4px;
            opacity: 0.7;
        }

        /* --- Grid Dots (Critique: Visible on empty/disconnected) --- */
        .grid-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #d7ccc8;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Asset Cohesion: Cub Token (Critique: Shadow added) --- */
        .cub-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Drop shadow for depth */
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.25));
        }

        /* --- Asset Cohesion: Star Marker --- */
        .star-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 54px;
            height: 54px;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.3)); }
            50% { transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.6)); }
        }

        /* --- Footer Controls (Critique: Pill container, Renamed, Styles) --- */
        footer {
            margin-top: 24px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            padding: 6px;
            border-radius: 50px; /* Pill shape */
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.8);
        }

        button {
            font-family: var(--font-ui);
            font-weight: 700;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Reset: Ghost Style */
        .btn-reset {
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 10px 24px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-reset:hover {
            background: rgba(0,0,0,0.04);
            color: var(--text-primary);
        }
        .btn-reset:active { transform: scale(0.96); }

        /* Check: Warm Accent (Terracotta) */
        .btn-check {
            background-color: var(--accent-terra);
            color: white;
            font-size: 1rem;
            padding: 12px 36px;
            border-radius: 40px;
            box-shadow: 0 4px 0 #c05035, 0 6px 12px rgba(231, 111, 81, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            top: 0;
        }
        
        .btn-check:hover {
            background-color: #e87a60;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 #c05035, 0 8px 16px rgba(231, 111, 81, 0.4);
        }
        
        .btn-check:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #c05035;
        }

        /* --- Responsive --- */
        @media (max-width: 450px) {
            :root {
                --cell-size: 58px;
            }
            h1 { font-size: 2.2rem; }
            .game-container { padding: 8px; }
            .cub-wrapper { width: 48px; height: 48px; }
            .controls-group { padding: 4px; gap: 8px; }
            .btn-check { padding: 10px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Texture Overlay -->
    <div class="noise-overlay"></div>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Chapter 1: The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <div class="controls-group">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-check" onclick="runGame()">Check</button>
        </div>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A solvable path configuration (used as the base for unsolved state)
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];
        let cubEl = null;

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            // Create tiles
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    // 1. Get the base connection type
                    const baseConnections = LEVEL_DATA[y][x];
                    
                    // 2. Scramble rotation to create "Unsolved" state
                    // Random rotation 0, 1, 2, 3 (0, 90, 180, 270 deg)
                    // We avoid rotation 0 for start and end to ensure they look wrong initially
                    let rot = 0;
                    if (x !== START.x || y !== START.y) {
                        rot = Math.floor(Math.random() * 4);
                    }

                    // 3. Calculate scrambled connections
                    const scrambledConns = rotateConnections(baseConnections, rot);

                    const tile = createTile(x, y, scrambledConns, rot);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Cub Token to Start
            const startTile = getTile(START.x, START.y);
            cubEl = createCubSVG();
            startTile.el.appendChild(cubEl);

            // Add Star Marker to End
            const endTile = getTile(END.x, END.y);
            endTile.el.appendChild(createStarSVG());
        }

        // Helper: Rotate connections (N->E->S->W)
        function rotateConnections(conn, times) {
            let c = conn;
            for(let i=0; i<times; i++) {
                let newC = 0;
                if (c & DIR.N) newC |= DIR.E;
                if (c & DIR.E) newC |= DIR.S;
                if (c & DIR.S) newC |= DIR.W;
                if (c & DIR.W) newC |= DIR.N;
                c = newC;
            }
            return c;
        }

        // --- SVG Generators ---

        function createTile(x, y, connections, rotationDeg) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            el.dataset.conn = connections;
            el.dataset.rotation = rotationDeg; // Store visual rotation

            // --- Grid Dots (Critique: Visible here) ---
            const dot = document.createElement('div');
            dot.className = 'grid-dot';
            el.appendChild(dot);

            // Draw the path SVGs
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            // Layer 1: Shadow
            const pathShadow = document.createElementNS(svgNS, "path");
            pathShadow.setAttribute("class", "path-line path-shadow");
            
            // Layer 2: Main Track
            const pathMain = document.createElementNS(svgNS, "path");
            pathMain.setAttribute("class", "path-line path-main");
            
            // Layer 3: Highlight
            const pathHighlight = document.createElementNS(svgNS, "path");
            pathHighlight.setAttribute("class", "path-line path-highlight");
            
            // Calculate path coordinates based on connections
            let d = "";
            if (connections & DIR.N) d += `M50 50 L50 0 `;
            if (connections & DIR.E) d += `M50 50 L100 50 `;
            if (connections & DIR.S) d += `M50 50 L50 100 `;
            if (connections & DIR.W) d += `M50 50 L0 50 `;

            const pathD = d;

            pathShadow.setAttribute("d", pathD);
            pathMain.setAttribute("d", pathD);
            pathHighlight.setAttribute("d", pathD);
            
            // Apply visual rotation via CSS transform on the SVG group or container
            // Note: We rotate the whole SVG element to show the scrambled state
            svg.style.transform = `rotate(${rotationDeg * 90}deg)`;
            
            svg.appendChild(pathShadow);
            svg.appendChild(pathMain);
            svg.appendChild(pathHighlight);
            el.appendChild(svg);

            // Click to Rotate Logic
            el.addEventListener('click', () => {
                // Only rotate if not start/end
                if ((x === START.x && y === START.y) || (x === END.x && y === END.y)) return;

                // Update rotation
                let currentRot = parseInt(el.dataset.rotation);
                currentRot = (currentRot + 1) % 4;
                el.dataset.rotation = currentRot;
                
                // Update Connections
                // We need to know the "original" un-rotated connection type to rotate from.
                // In this simple demo, we just re-rotate the CURRENT connections by 90deg
                // (This effectively cycles the tile through 4 states)
                let currentConns = parseInt(el.dataset.conn);
                let newConns = rotateConnections(currentConns, 1);
                el.dataset.conn = newConns;

                // Update Visuals
                svg.style.transform = `rotate(${currentRot * 90}deg)`;
                
                // Redraw paths for new connection set
                let dNew = "";
                if (newConns & DIR.N) dNew += `M50 50 L50 0 `;
                if (newConns & DIR.E) dNew += `M50 50 L100 50 `;
                if (newConns & DIR.S) dNew += `M50 50 L50 100 `;
                if (newConns & DIR.W) dNew += `M50 50 L0 50 `;

                pathShadow.setAttribute("d", dNew);
                pathMain.setAttribute("d", dNew);
                pathHighlight.setAttribute("d", dNew);
            });

            return { el, x, y, connections, pathMain, pathShadow, pathHighlight, svg };
        }

        function createCubSVG() {
            const wrapper = document.createElement('div');
            wrapper.className = 'cub-wrapper';
            wrapper.id = 'cub';
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("class", "cub-svg");

            const earL = document.createElementNS(svgNS, "path");
            earL.setAttribute("d", "M25 40 L15 15 L45 30 Z");
            earL.setAttribute("fill", "#e76f51");
            
            const earR = document.createElementNS(svgNS, "path");
            earR.setAttribute("d", "M75 40 L85 15 L55 30 Z");
            earR.setAttribute("fill", "#e76f51");

            const head = document.createElementNS(svgNS, "path");
            head.setAttribute("d", "M20 40 Q20 85 50 85 Q80 85 80 40 L75 25 Q50 15 25 25 Z");
            head.setAttribute("fill", "#e76f51");
            
            const snout = document.createElementNS(svgNS, "path");
            snout.setAttribute("d", "M35 60 Q35 80 50 80 Q65 80 65 60 L65 55 Q50 45 35 55 Z");
            snout.setAttribute("fill", "#fff");
            snout.setAttribute("opacity", "0.9");

            const nose = document.createElementNS(svgNS, "circle");
            nose.setAttribute("cx", "50"); nose.setAttribute("cy", "65"); nose.setAttribute("r", "5");
            nose.setAttribute("fill", "#264653");

            const eyeL = document.createElementNS(svgNS, "circle");
            eyeL.setAttribute("cx", "35"); eyeL.setAttribute("cy", "45"); eyeL.setAttribute("r", "4");
            eyeL.setAttribute("fill", "#264653");
            
            const eyeR = document.createElementNS(svgNS, "circle");
            eyeR.setAttribute("cx", "65"); eyeR.setAttribute("cy", "45"); eyeR.setAttribute("r", "4");
            eyeR.setAttribute("fill", "#264653");

            svg.appendChild(earL);
            svg.appendChild(earR);
            svg.appendChild(head);
            svg.appendChild(snout);
            svg.appendChild(eyeL);
            svg.appendChild(eyeR);
            svg.appendChild(nose);

            wrapper.appendChild(svg);
            return wrapper;
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-wrapper';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const glow = document.createElementNS(svgNS, "circle");
            glow.setAttribute("cx", "50"); glow.setAttribute("cy", "50"); glow.setAttribute("r", "35");
            glow.setAttribute("fill", "rgba(255, 215, 0, 0.3)");

            const star = document.createElementNS(svgNS, "path");
            star.setAttribute("d", "M50 15 L61 39 L87 39 L66 54 L73 80 L50 65 L27 80 L34 54 L13 39 L39 39 Z");
            star.setAttribute("fill", "#ffd700");
            star.setAttribute("stroke", "#d4a373");
            star.setAttribute("stroke-width", "2");
            star.setAttribute("stroke-linejoin", "round");

            svg.appendChild(glow);
            svg.appendChild(star);
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            // Remove Cub
            if(cubEl) cubEl.remove();
            
            // Reset paths to default colors
            tiles.forEach(t => {
                t.pathMain.style.stroke = "var(--path-clay)";
                t.pathShadow.style.stroke = "rgba(0,0,0,0.15)";
            });

            initGame();
        }

        async function runGame() {
            if(!cubEl) return;

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // BFS to find path based on CURRENT tile connections
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Animate Cub along path
                // Reset Cub to start visually just in case
                const startTile = getTile(START.x, START.y);
                startTile.el.appendChild(cubEl);
                cubEl.style.transform = "translate(-50%, -50%) scale(1)";
                await new Promise(r => setTimeout(r, 200));

                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    
                    // Highlight path (Success Green)
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.pathMain.style.stroke = "#4caf50"; 
                    tile.pathShadow.style.stroke = "rgba(0,0,0,0.15)"; 
                }
                
                // Win state animation
                setTimeout(() => {
                    const svg = cubEl.querySelector('.cub-svg');
                    svg.style.transition = "transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                    svg.style.transform = "rotate(360deg) scale(1.2)";
                }, 200);

            } else {
                // Shake animation on Cub to indicate failure
                cubEl.style.transition = "transform 0.1s";
                cubEl.style.transform = "translate(-50%, -50%) translateX(-5px)";
                setTimeout(() => {
                    cubEl.style.transform = "translate(-50%, -50%) translateX(5px)";
                    setTimeout(() => {
                        cubEl.style.transform = "translate(-50%, -50%) translateX(0)";
                    }, 100);
                }, 100);
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            // Check North
            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                // Check if neighbor connects South
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            // Check East
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            // Check South
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            // Check West
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump animation
                cubEl.style.transition = "transform 0.15s ease-in";
                cubEl.style.transform = "translate(-50%, -50%) scale(0.8) translateY(-15px)";
                
                setTimeout(() => {
                    targetTile.appendChild(cubEl);
                    cubEl.style.transition = "transform 0.15s ease-out";
                    cubEl.style.transform = "translate(-50%, -50%) scale(1) translateY(0)";
                    
                    // Wait for animation to finish slightly before resolving
                    setTimeout(resolve, 150);
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
