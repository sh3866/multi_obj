<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    /* Palette - Deep Void & Arcane Gold */
    --bg-deep: #030405;
    --bg-panel: #0a0c10;
    --bg-panel-highlight: #151922;
    
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(197, 160, 89, 0.5);
    
    --gold-primary: #d4af37;
    --gold-bright: #fff0b3;
    --gold-dim: #5e4b26;
    
    --cyan-magic: #50eaff;
    --cyan-dim: #103a40;
    
    --text-main: #e6eaf0;
    --text-muted: #8b9bb4;
    --text-dark: #2a3546;

    /* Typography - Single Family */
    --font-main: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    
    /* Dimensions */
    --node-size: 48px;
    --sidebar-width: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Critique 6: Flat background for contrast */
    background: radial-gradient(circle at center, #0e1116 0%, #030405 100%);
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    width: 100vw;
    height: 100vh;
    background: transparent;
    position: relative;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: rgba(10, 12, 16, 0.85);
    border-right: 1px solid var(--border-subtle);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    z-index: 20;
    backdrop-filter: blur(10px);
    box-shadow: 5px 0 30px rgba(0,0,0,0.5);
  }

  .profile-header {
    text-align: center;
    margin-bottom: 1rem;
  }

  .avatar-frame {
    width: 96px;
    height: 96px;
    border: 2px solid var(--gold-dim);
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #1a1d26 0%, #0b0c10 100%);
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    position: relative;
  }

  .avatar-frame::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px dashed var(--gold-primary);
    opacity: 0.3;
    animation: spin 30s linear infinite;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  .avatar-frame svg {
    width: 44px;
    height: 44px;
    fill: var(--text-muted);
  }

  .char-name {
    font-size: 1.6rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }

  .char-class {
    font-size: 0.8rem;
    color: var(--gold-primary);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
    opacity: 0.8;
  }

  /* Critique 3: Points moved to top, high contrast */
  .points-section {
    margin-bottom: 3rem;
    text-align: center;
    padding: 1.5rem;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  .points-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan-magic), transparent);
    opacity: 0.7;
  }

  .points-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    display: block;
    font-weight: 600;
  }

  .points-val {
    font-size: 3.5rem;
    color: var(--cyan-magic);
    line-height: 1;
    font-weight: 800;
    text-shadow: 0 0 15px rgba(80, 234, 255, 0.4);
    font-variant-numeric: tabular-nums;
    transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .points-val.pulse {
    transform: scale(1.15);
  }

  /* Stats Block */
  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .level-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 4px;
  }

  .level-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 1px;
  }

  .level-val {
    font-size: 2rem;
    color: var(--text-main);
    font-weight: 300;
  }

  .xp-container {
    position: relative;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-primary));
    box-shadow: 0 0 10px var(--gold-primary);
    border-radius: 3px;
  }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: -1rem;
    font-variant-numeric: tabular-nums;
    opacity: 0.7;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-bar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 3rem;
    z-index: 5;
    /* Critique 3: Reduced Title size */
  }

  .tree-title {
    font-size: 1.4rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.8;
  }
  
  .tabs {
    display: flex;
    gap: 0.5rem;
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 8px 20px;
    border-radius: 4px;
    transition: all 0.3s;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid transparent;
  }

  .tab:hover {
    color: var(--text-main);
    background: rgba(255,255,255,0.05);
  }

  .tab.active {
    background: rgba(212, 175, 55, 0.1);
    color: var(--gold-primary);
    border: 1px solid rgba(212, 175, 55, 0.3);
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.05);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
    /* Hide scrollbars */
    scrollbar-width: none; 
    -ms-overflow-style: none;
  }
  
  .tree-viewport::-webkit-scrollbar { 
    display: none; 
  }

  .tree-viewport:active {
    cursor: grabbing;
  }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 900px;
    height: 800px;
    margin: 50px;
    /* No 3D transform for cleaner lines */
  }

  /* Critique 1 & 4: Connections with Glow */
  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  path.connection-line {
    fill: none;
    stroke: var(--text-dark);
    stroke-width: 2;
    stroke-linecap: round;
    transition: all 0.5s ease;
    opacity: 0.2;
  }

  /* Active path (Unlocked to Unlocked) */
  path.connection-line.active {
    stroke: var(--gold-primary);
    stroke-width: 3;
    opacity: 1;
    filter: drop-shadow(0 0 5px var(--gold-primary));
  }

  /* Available path (Unlocked to Available) */
  path.connection-line.available {
    stroke: var(--cyan-magic);
    stroke-width: 2;
    stroke-dasharray: 6 6;
    opacity: 0.6;
    filter: drop-shadow(0 0 3px var(--cyan-magic));
    animation: flow 15s linear infinite;
  }
  
  @keyframes flow {
    to { stroke-dashoffset: -100; }
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.2);
    z-index: 10;
  }

  .node-inner {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  /* Hexagon Shape via Clip Path */
  .node-geo {
    position: absolute;
    inset: 0;
    background: #1a1d26;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    transition: background 0.3s, transform 0.3s;
    z-index: -1;
  }

  /* Hexagon Border (Simulated with a larger clip-path behind) */
  .node-border {
    position: absolute;
    inset: -2px;
    background: var(--text-dark);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: -2;
    transition: background 0.3s;
  }

  .node-inner svg {
    width: 24px;
    height: 24px;
    fill: var(--text-muted);
    opacity: 0.6;
    transition: all 0.3s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  }

  /* Node States */
  
  /* Locked */
  .node.locked .node-geo { background: #0f1115; }
  .node.locked .node-border { background: var(--text-dark); }
  .node.locked .node-inner svg { opacity: 0.3; fill: var(--text-dark); }

  /* Available - Critique 4: Bloom/Glow */
  .node.available .node-geo {
    background: rgba(80, 234, 255, 0.1);
  }
  .node.available .node-border {
    background: var(--cyan-magic);
    box-shadow: 0 0 15px var(--cyan-magic); /* Glow effect */
  }
  .node.available .node-inner svg {
    fill: var(--cyan-magic);
    opacity: 1;
    filter: drop-shadow(0 0 5px var(--cyan-magic));
  }

  /* Unlocked */
  .node.unlocked .node-geo {
    background: radial-gradient(circle, #3a301a 0%, #1a150b 100%);
  }
  .node.unlocked .node-border {
    background: var(--gold-primary);
    box-shadow: 0 0 12px var(--gold-primary); /* Glow effect */
  }
  .node.unlocked .node-inner svg {
    fill: var(--gold-bright);
    opacity: 1;
    filter: drop-shadow(0 0 5px var(--gold-primary));
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 240px;
    background: rgba(10, 12, 16, 0.95);
    border: 1px solid var(--gold-dim);
    padding: 1.2rem;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    text-align: center;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: rgba(10, 12, 16, 0.95);
    border-right: 1px solid var(--gold-dim);
    border-bottom: 1px solid var(--gold-dim);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--gold-primary);
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.5rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: #ccc;
    line-height: 1.5;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--cyan-magic);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-block;
    padding: 4px 10px;
    border: 1px solid rgba(80, 234, 255, 0.3);
    border-radius: 4px;
    background: rgba(80, 234, 255, 0.1);
  }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <!-- Critique 3: Points at top -->
    <div class="points-section">
      <span class="points-label">Available Skill Points</span>
      <div class="points-val" id="sp-display">5</div>
    </div>

    <div class="stat-block">
      <div class="level-row">
        <span class="level-label">LEVEL</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA (Denser Matrix per Critique 2) ---
  // Coordinates are percentages (x, y)
  const skillTreeData = [
    // Tier 1 (Root)
    { id: 1, x: 50, y: 90, name: "Void Core", desc: "Unlocks all Void abilities. Increases mana regeneration.", state: "unlocked", icon: "core", cost: 0 },
    
    // Tier 2
    { id: 2, x: 25, y: 70, name: "Shadow Step", desc: "Teleport short distances instantly.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 75, y: 70, name: "Arcane Blast", desc: "Fire a concentrated bolt of energy.", state: "available", icon: "blast", cost: 1 },
    
    // Tier 3
    { id: 4, x: 10, y: 50, name: "Phase Shift", desc: "Become intangible for 3 seconds.", state: "locked", icon: "phase", cost: 2 },
    { id: 5, x: 50, y: 50, name: "Entropy", desc: "Drain life from enemies to heal self.", state: "available", icon: "drain", cost: 2 },
    { id: 6, x: 90, y: 50, name: "Nova", desc: "Explosive radius damage around caster.", state: "locked", icon: "nova", cost: 2 },
    
    // Tier 4
    { id: 7, x: 20, y: 30, name: "Void Walk", desc: "Permanent stealth when standing still.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 40, y: 30, name: "Siphon", desc: "Steal stats from nearby enemies.", state: "locked", icon: "drain", cost: 3 },
    { id: 9, x: 60, y: 30, name: "Meteor", desc: "Call down a devastating meteor strike.", state: "locked", icon: "meteor", cost: 3 },
    { id: 10, x: 80, y: 30, name: "Time Warp", desc: "Slow time for enemies.", state: "locked", icon: "phase", cost: 3 },
    
    // Tier 5 (Ultimate)
    { id: 11, x: 50, y: 10, name: "Singularity", desc: "Ultimate power: Collapse the area.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3],
    [2, 4], [2, 5],
    [3, 5], [3, 6],
    [4, 7], [4, 8],
    [5, 8], [5, 9],
    [6, 9], [6, 10],
    [7, 11], [8, 11], [9, 11], [10, 11]
  ];

  // --- ICONS (Simple SVG Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 5;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Calculate Bezier Curve
      const midY = (startNode.y + endNode.y) / 2;
      // Straighter lines for a more rigid structure
      const d = `M ${startNode.x}% ${startNode.y}% Q ${startNode.x}% ${midY}% ${endNode.x}% ${midY}% T ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine State
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         path.classList.add('available');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      const border = document.createElement('div');
      border.className = 'node-border';
      
      const geo = document.createElement('div');
      geo.className = 'node-geo';

      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(border);
      inner.appendChild(geo);
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${node.state === 'locked' ? 'Prerequisites Locked' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`)}</div>
      `;
      el.appendChild(tooltip);

      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      element.className = 'node unlocked';
      
      updateSPDisplay();
      drawConnections();
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        spDisplay.style.color = '#ff4d4d';
        setTimeout(() => { spDisplay.style.color = 'var(--cyan-magic)'; }, 300);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.classList.add('pulse');
    setTimeout(() => { spDisplay.classList.remove('pulse'); }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.style.cursor = 'grabbing';
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.style.cursor = 'grab';
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.style.cursor = 'grab';
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1.5; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1.5;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
