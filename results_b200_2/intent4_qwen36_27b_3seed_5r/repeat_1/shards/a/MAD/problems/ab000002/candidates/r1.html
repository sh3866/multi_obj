<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    /* Palette */
    --bg-void: #050608;
    --bg-panel: rgba(15, 18, 24, 0.7);
    --border-color: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(197, 160, 89, 0.3);
    
    --accent-gold: #c5a059;
    --accent-gold-bright: #f3d68d;
    --accent-gold-dim: #5e4b26;
    
    --accent-cyan: #66fcf1;
    --accent-cyan-dim: #1f3a3f;
    
    --text-main: #e6e6e6;
    --text-muted: #8892b0;
    --text-dark: #4a5568;

    /* Typography */
    --font-heading: 'Georgia', 'Times New Roman', serif;
    --font-ui: 'Segoe UI', 'Helvetica Neue', sans-serif;
    
    /* Dimensions */
    --node-size: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-void);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Critique 4: Void Atmosphere */
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(20, 25, 35, 0.8) 0%, rgba(5, 6, 8, 1) 100%),
      repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255,255,255,0.02) 1px, rgba(255,255,255,0.02) 2px);
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 320px 1fr;
    width: 96vw;
    height: 94vh;
    background: rgba(10, 12, 16, 0.4);
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
    border-radius: 8px;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(15,18,24,0.95) 0%, rgba(10,12,16,0.8) 100%);
    border-right: 1px solid var(--border-color);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    z-index: 10;
    position: relative;
  }

  /* Decorative line on sidebar right edge */
  .sidebar::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, var(--accent-gold-dim), transparent, var(--accent-gold-dim));
    opacity: 0.3;
  }

  .profile-header {
    text-align: center;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border-color);
  }

  .avatar-frame {
    width: 90px;
    height: 90px;
    border: 2px solid var(--accent-gold-dim);
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #1a1d26 0%, #0b0c10 100%);
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }

  /* Inner ring for avatar */
  .avatar-frame::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px dashed var(--accent-gold-dim);
    opacity: 0.5;
  }

  .avatar-frame svg {
    width: 44px;
    height: 44px;
    fill: var(--text-muted);
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 1.6rem;
    color: var(--text-main);
    margin-bottom: 0.2rem;
    letter-spacing: 1px;
  }

  .char-class {
    font-size: 0.8rem;
    color: var(--accent-gold);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }

  /* Stats Block */
  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .level-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .level-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 1px;
  }

  .level-val {
    font-size: 2.8rem;
    font-family: var(--font-heading);
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
  }

  .xp-container {
    position: relative;
    height: 6px;
    background: rgba(0,0,0,0.4);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
    box-shadow: 0 0 8px var(--accent-gold);
    border-radius: 3px;
  }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: -0.5rem;
    opacity: 0.7;
  }

  /* Critique 2: Relocate Skill Points */
  .points-section {
    margin-top: 1rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-color);
    text-align: center;
  }

  .points-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 0.5rem;
    display: block;
  }

  .points-val {
    font-size: 4.5rem;
    font-family: var(--font-heading);
    color: var(--accent-cyan);
    line-height: 1;
    /* Glow effect */
    text-shadow: 0 0 20px rgba(102, 252, 241, 0.3), 0 0 40px rgba(102, 252, 241, 0.1);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .points-val.pulse {
    transform: scale(1.2);
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(circle at 70% 30%, rgba(30, 35, 45, 0.4) 0%, transparent 60%);
  }

  .header-bar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 3rem;
    background: linear-gradient(90deg, rgba(15,18,24,0.9), transparent);
    z-index: 5;
  }

  /* Critique 5: Typography Hierarchy */
  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 8px 20px;
    border-radius: 4px;
    transition: all 0.3s;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .tab:hover {
    color: var(--text-main);
  }

  /* Critique 5: Active Tab State */
  .tab.active {
    background: var(--accent-gold-dim);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: auto; /* Allow scrolling if needed */
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
    perspective: 1000px;
  }

  .tree-viewport:active {
    cursor: grabbing;
  }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 700px;
    height: 600px;
    transform-style: preserve-3d;
  }

  /* Critique 1: Ley Line Aesthetic */
  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  path.connection-line {
    fill: none;
    stroke: var(--border-color);
    stroke-width: 1.5;
    transition: stroke 0.5s, stroke-dashoffset 0.5s, filter 0.5s;
  }

  /* Active path (Unlocked to Unlocked) */
  path.connection-line.active {
    stroke: var(--accent-gold);
    stroke-width: 2;
    filter: drop-shadow(0 0 3px var(--accent-gold));
    stroke-dasharray: 0;
  }

  /* Available path (Unlocked to Available) */
  path.connection-line.available {
    stroke: var(--accent-cyan-dim);
    stroke-dasharray: 5 5;
    animation: flow 30s linear infinite;
  }
  
  @keyframes flow {
    to { stroke-dashoffset: 100; }
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.15) translateZ(10px);
    z-index: 10;
  }

  /* Critique 3: Unified Node Geometry (Hexagon) */
  .node-inner {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  /* Hexagon Shape via Clip Path */
  .node-geo {
    position: absolute;
    inset: 0;
    background: #1a1d26;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    transition: background 0.3s, transform 0.3s;
    z-index: -1;
  }

  /* Border simulation for Hexagon */
  .node-border {
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    z-index: -2;
    transition: background 0.3s;
  }

  .node-inner svg {
    width: 28px;
    height: 28px;
    fill: var(--text-muted);
    opacity: 0.6;
    transition: all 0.3s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  /* Node States */
  
  /* Locked: Grey, Thin border */
  .node.locked .node-geo {
    background: #0f1115;
  }
  .node.locked .node-border {
    background: var(--text-dark);
    transform: scale(1.15); /* Makes it look like a thin border */
  }
  .node.locked .node-inner svg {
    opacity: 0.3;
    fill: var(--text-dark);
  }

  /* Available: Cyan glow, dashed border feel */
  .node.available .node-geo {
    background: rgba(102, 252, 241, 0.1);
    box-shadow: inset 0 0 10px var(--accent-cyan);
  }
  .node.available .node-border {
    background: var(--accent-cyan);
    transform: scale(1.15);
    animation: pulse-border 2s infinite;
  }
  .node.available .node-inner svg {
    fill: var(--accent-cyan);
    opacity: 1;
    filter: drop-shadow(0 0 5px var(--accent-cyan));
  }

  /* Unlocked: Gold, Solid fill */
  .node.unlocked .node-geo {
    background: radial-gradient(circle at center, #4a3b1a 0%, #2a2214 100%);
    box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
  }
  .node.unlocked .node-border {
    background: var(--accent-gold);
    transform: scale(1.15);
    box-shadow: 0 0 10px var(--accent-gold);
  }
  .node.unlocked .node-inner svg {
    fill: var(--accent-gold-bright);
    opacity: 1;
    filter: drop-shadow(0 0 5px var(--accent-gold));
  }

  @keyframes pulse-border {
    0% { transform: scale(1.15); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.7; }
    100% { transform: scale(1.15); opacity: 1; }
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 240px;
    background: rgba(10, 12, 16, 0.95);
    border: 1px solid var(--accent-gold-dim);
    padding: 1.2rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    text-align: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  /* Arrow for tooltip */
  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: rgba(10, 12, 16, 0.95);
    border-right: 1px solid var(--accent-gold-dim);
    border-bottom: 1px solid var(--accent-gold-dim);
    transform: translateX(-50%) rotate(45deg);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--accent-gold);
    font-family: var(--font-heading);
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.5rem;
    letter-spacing: 1px;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: #ccc;
    line-height: 1.5;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid rgba(102, 252, 241, 0.2);
    border-radius: 2px;
  }

  /* Decorative corner accents */
  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 1px solid var(--accent-gold-dim);
    z-index: 5;
    opacity: 0.5;
  }
  .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
  .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
  .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <!-- Simple SVG Knight Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <div class="stat-block">
      <div class="level-row">
        <span class="level-label">LEVEL</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>

    <!-- Critique 2: Relocated Skill Points -->
    <div class="points-section">
      <span class="points-label">Available Skill Points</span>
      <div class="points-val" id="sp-display">3</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <!-- Decorative Corners -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 85, name: "Void Core", desc: "Unlocks all Void abilities. Increases mana regeneration.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 25, y: 65, name: "Shadow Step", desc: "Teleport short distances instantly.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 75, y: 65, name: "Arcane Blast", desc: "Fire a concentrated bolt of energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 45, name: "Entropy", desc: "Drain life from enemies to heal self.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 15, y: 45, name: "Phase Shift", desc: "Become intangible for 3 seconds.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 85, y: 45, name: "Nova", desc: "Explosive radius damage around caster.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 35, y: 25, name: "Void Walk", desc: "Permanent stealth when standing still.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 65, y: 25, name: "Meteor", desc: "Call down a devastating meteor strike.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 5, name: "Singularity", desc: "Ultimate power: Collapse the area.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (Simple SVG Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Calculate Bezier Curve
      // We use a slight curve to make it look more organic/magical
      const midY = (startNode.y + endNode.y) / 2;
      // Control points pulled slightly inward for a "tension" look
      const cp1x = startNode.x;
      const cp1y = startNode.y + (midY - startNode.y) * 0.8;
      const cp2x = endNode.x;
      const cp2y = endNode.y - (endNode.y - midY) * 0.8;
      
      const d = `M ${startNode.x}% ${startNode.y}% C ${cp1x}% ${cp1y}%, ${cp2x}% ${cp2y}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine State
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         path.classList.add('available');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    // Clear existing nodes (keep SVG)
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Critique 3: Unified Geometry
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Hexagon Border (Outer)
      const border = document.createElement('div');
      border.className = 'node-border';
      
      // Hexagon Fill (Inner)
      const geo = document.createElement('div');
      geo.className = 'node-geo';

      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(border);
      inner.appendChild(geo);
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${node.state === 'locked' ? 'Prerequisites Locked' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`)}</div>
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      // Unlock logic
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      // Visual update
      element.className = 'node unlocked';
      
      // Update UI
      updateSPDisplay();
      drawConnections(); // Redraw lines to show active state
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        // Feedback for not enough points
        spDisplay.style.color = '#ff4d4d';
        setTimeout(() => {
            spDisplay.style.color = 'var(--accent-cyan)';
        }, 300);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.classList.add('pulse');
    setTimeout(() => {
      spDisplay.classList.remove('pulse');
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING FOR VIEWPORT ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.style.cursor = 'grabbing';
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.style.cursor = 'grab';
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.style.cursor = 'grab';
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1.5; // Scroll speed multiplier
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1.5;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
