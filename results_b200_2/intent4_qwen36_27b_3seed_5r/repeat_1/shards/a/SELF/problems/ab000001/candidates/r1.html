<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-paper: #fdfbf7;
            --bg-pattern: #e5e2d8;
            
            --board-frame: #d6cbb6;
            --board-inner: #f2ebd8;
            --tile-base: #fffdf5;
            --tile-shadow: #e6e0cc;
            
            --path-ink: #4a5568;
            --path-highlight: #48bb78;
            
            --cub-blue: #4299e1;
            --cub-shadow: #2b6cb0;
            --cub-highlight: #bee3f8;
            
            --star-gold: #ecc94b;
            --star-glow: #f6e05e;
            
            --btn-primary: #48bb78;
            --btn-primary-dark: #2f855a;
            --btn-secondary: #e2e8f0;
            --btn-secondary-text: #718096;
            
            --font-heading: 'Georgia', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            --cell-size: 72px;
            --grid-gap: 8px;
            --grid-size: 5;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle dot grid pattern */
            background-image: radial-gradient(var(--bg-pattern) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            font-family: var(--font-ui);
            color: #2d3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3rem;
            margin: 0;
            letter-spacing: -0.02em;
            color: #2d3748;
            text-shadow: 2px 2px 0px rgba(255,255,255,1);
            line-height: 1;
        }

        .subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #718096;
            margin-top: 8px;
            font-weight: 700;
            background: rgba(255,255,255,0.6);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }

        /* --- Game Board Area --- */
        .game-wrapper {
            position: relative;
            padding: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 
                0 20px 25px -5px rgba(0, 0, 0, 0.1), 
                0 10px 10px -5px rgba(0, 0, 0, 0.04),
                inset 0 0 0 1px rgba(0,0,0,0.02);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        /* Decorative frame border */
        .game-wrapper::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 2px solid var(--board-frame);
            border-radius: 12px;
            pointer-events: none;
            opacity: 0.5;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--grid-gap);
            background-color: var(--board-inner);
            padding: var(--grid-gap);
            border-radius: 8px;
            position: relative;
        }

        /* --- Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-base);
            border-radius: 6px;
            position: relative;
            /* Soft bevel effect */
            box-shadow: 
                inset 1px 1px 0 rgba(255,255,255,1),
                inset -1px -1px 0 rgba(0,0,0,0.05),
                0 4px 0 var(--tile-shadow);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
            z-index: 1;
        }

        .tile:active {
            transform: translateY(4px);
            box-shadow: 
                inset 1px 1px 0 rgba(255,255,255,1),
                inset -1px -1px 0 rgba(0,0,0,0.05),
                0 0 0 var(--tile-shadow);
        }

        /* SVG Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .path-line {
            stroke: var(--path-ink);
            stroke-width: 10;
            stroke-linecap: round;
            fill: none;
            transition: stroke 0.3s ease;
        }
        
        /* Highlighted path state */
        .tile.active .path-line {
            stroke: var(--path-highlight);
            stroke-width: 12;
            filter: drop-shadow(0 0 4px rgba(72, 187, 120, 0.5));
        }

        /* --- Characters --- */
        
        /* The Cub (Player) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cub-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--cub-highlight) 0%, var(--cub-blue) 100%);
            border-radius: 12px;
            box-shadow: 
                0 6px 0 var(--cub-shadow),
                0 10px 10px rgba(0,0,0,0.15),
                inset 0 2px 4px rgba(255,255,255,0.6);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Face Details */
        .cub-face {
            width: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(-2px);
        }
        
        .eye {
            width: 5px;
            height: 5px;
            background: #1a202c;
            border-radius: 50%;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }
        
        .eye::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 4px;
            border-bottom: 2px solid #1a202c;
            border-radius: 0 0 8px 8px;
        }

        /* The Star (Goal) */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-5px) rotate(5deg); }
        }

        .star-path {
            fill: var(--star-gold);
            stroke: #b7791f;
            stroke-width: 1;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }

        /* --- Controls --- */
        footer {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            z-index: 10;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 0.95rem;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn-reset {
            background-color: var(--btn-secondary);
            color: var(--btn-secondary-text);
            box-shadow: 0 4px 0 #cbd5e0;
        }
        .btn-reset:hover { background-color: #edf2f7; transform: translateY(-1px); box-shadow: 0 5px 0 #cbd5e0; }
        .btn-reset:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e0; }

        .btn-run {
            background-color: var(--btn-primary);
            color: white;
            box-shadow: 0 4px 0 var(--btn-primary-dark);
        }
        
        .btn-run:hover {
            background-color: #4ade80;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 var(--btn-primary-dark);
        }
        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--btn-primary-dark);
        }

        /* --- Win Animation --- */
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.4) rotate(15deg); }
            100% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); }
        }

        .cub-token.winner .cub-body {
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background: linear-gradient(135deg, #f6e05e 0%, #d69e2e 100%);
            box-shadow: 0 6px 0 #975a16, 0 0 15px var(--star-glow);
        }

        /* Responsive */
        @media (max-width: 500px) {
            :root { --cell-size: 60px; --grid-gap: 6px; }
            h1 { font-size: 2.2rem; }
            footer { gap: 12px; }
            button { padding: 12px 24px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 &mdash; The Garden Path</div>
    </header>

    <div class="game-wrapper">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run Path</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W (Binary mask for connections)
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // Level Layout (Solvable path exists)
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];
        let isAnimating = false;

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            isAnimating = false;
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker
            const endTile = getTile(END.x, END.y);
            endTile.el.appendChild(createStarSVG());

            // Add Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = `
                <div class="cub-body">
                    <div class="cub-face">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            `;
            getTile(START.x, START.y).el.appendChild(cub);
        }

        // --- SVG Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            return { el, x, y, connections, path };
        }

        function createStarSVG() {
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("class", "star-path");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            if (isAnimating) return;
            const cub = document.getElementById('cub');
            if(cub) cub.classList.remove('winner');
            initGame();
        }

        async function runGame() {
            if (isAnimating) return;
            isAnimating = true;
            
            const cub = document.getElementById('cub');
            cub.classList.remove('winner');

            // Clear previous highlights
            tiles.forEach(t => t.el.classList.remove('active'));

            // Find Path (BFS)
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let visited = new Set();
            visited.add(`${START.x},${START.y}`);
            let pathToGoal = [];

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (pathToGoal.length > 0) {
                // Animate
                for (let i = 0; i < pathToGoal.length; i++) {
                    const step = pathToGoal[i];
                    const targetTile = getTile(step.x, step.y);
                    
                    // Highlight tile
                    targetTile.el.classList.add('active');
                    
                    // Move Cub if not start
                    if (i > 0) {
                        await moveCub(targetTile.el);
                    }
                }
                
                // Win State
                setTimeout(() => {
                    cub.classList.add('winner');
                    isAnimating = false;
                }, 300);
            } else {
                isAnimating = false;
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            // Check connections and matching neighbors
            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }
            return neighbors;
        }

        function moveCub(targetEl) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                
                // Simple "Hop" animation logic
                // 1. Scale down
                cub.style.transform = "translate(-50%, -50%) scale(0.8)";
                
                setTimeout(() => {
                    // 2. Move DOM node
                    targetEl.appendChild(cub);
                    // 3. Scale up
                    cub.style.transform = "translate(-50%, -50%) scale(1)";
                    resolve();
                }, 100);
            });
        }

        // Start
        initGame();

    </script>
</body>
</html>
