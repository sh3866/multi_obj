<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --bg-panel: #12141a;
    --bg-panel-light: #1a1d26;
    --accent-gold: #c5a059;
    --accent-gold-dim: #6e572b;
    --accent-gold-glow: rgba(197, 160, 89, 0.6);
    --accent-blue: #66fcf1;
    --accent-blue-dim: #1f3a3f;
    --accent-blue-glow: rgba(102, 252, 241, 0.5);
    --text-main: #e0e0e0;
    --text-muted: #8892b0;
    --border-color: #2d3446;
    --node-unlocked: #c5a059;
    --node-available: #66fcf1;
    --node-locked: #3a3f4f;
    --font-heading: 'Georgia', 'Times New Roman', serif;
    --font-ui: 'Segoe UI', 'Helvetica Neue', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: radial-gradient(circle at 50% 50%, #1a1d26 0%, #0b0c10 100%);
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 320px 1fr;
    width: 96vw;
    height: 92vh;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 100%);
    border-right: 1px solid var(--border-color);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    z-index: 10;
    position: relative;
  }

  .sidebar::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 1px; height: 100%;
    background: linear-gradient(to bottom, transparent, var(--accent-gold-dim), transparent);
    opacity: 0.3;
  }

  .profile-header {
    text-align: center;
    padding-bottom: 2rem;
    border-bottom: 1px solid rgba(45, 52, 70, 0.5);
  }

  .avatar-frame {
    width: 90px;
    height: 90px;
    border: 2px solid var(--accent-gold);
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #2a2214 0%, var(--bg-dark) 70%);
    box-shadow: 0 0 20px var(--accent-gold-dim), inset 0 0 10px rgba(0,0,0,0.8);
    position: relative;
  }

  .avatar-frame::before {
    content: '';
    position: absolute;
    top: -4px; left: -4px; right: -4px; bottom: -4px;
    border: 1px solid var(--accent-gold-dim);
    border-radius: 50%;
    opacity: 0.5;
  }

  .avatar-frame svg {
    width: 44px;
    height: 44px;
    fill: var(--text-main);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 1.6rem;
    color: var(--accent-gold);
    margin-bottom: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 10px var(--accent-gold-dim);
  }

  .char-class {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }

  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .level-display {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--font-heading);
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
  }

  .level-val {
    font-size: 2.8rem;
    color: var(--text-main);
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
    line-height: 1;
  }

  .xp-container {
    position: relative;
    height: 10px;
    background: #000;
    border: 1px solid var(--border-color);
    border-radius: 2px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
    box-shadow: 0 0 10px var(--accent-gold);
    position: relative;
  }

  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .points-display {
    background: linear-gradient(135deg, var(--bg-panel-light) 0%, rgba(26,29,38,0.5) 100%);
    border: 1px solid var(--border-color);
    padding: 1.5rem;
    border-radius: 4px;
    text-align: center;
    margin-top: auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .points-label {
    font-size: 0.75rem;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.8rem;
    font-weight: 600;
  }

  .points-val {
    font-size: 3.5rem;
    font-family: var(--font-heading);
    color: var(--text-main);
    text-shadow: 0 0 20px var(--accent-blue-glow);
    line-height: 1;
  }

  .points-action {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-style: italic;
    letter-spacing: 0.5px;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1a1d26 0%, #0f1115 100%);
  }

  .header-bar {
    height: 65px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 2.5rem;
    justify-content: space-between;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(5px);
  }

  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.3rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .tabs {
    display: flex;
    gap: 2.5rem;
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    padding-bottom: 6px;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }

  .tab:hover {
    color: var(--text-main);
  }

  .tab.active {
    color: var(--accent-gold);
    border-bottom-color: var(--accent-gold);
    text-shadow: 0 0 10px var(--accent-gold-dim);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 3rem 2rem;
    cursor: grab;
  }

  .tree-viewport:active {
    cursor: grabbing;
  }

  /* Custom Scrollbar */
  .tree-viewport::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .tree-viewport::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2);
  }
  .tree-viewport::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 3px;
  }
  .tree-viewport::-webkit-scrollbar-thumb:hover {
    background: var(--accent-gold-dim);
  }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 900px;
    height: 700px;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  path.connection-line {
    fill: none;
    stroke: var(--border-color);
    stroke-width: 2;
    transition: stroke 0.5s, filter 0.5s, stroke-width 0.5s;
  }

  path.connection-line.active {
    stroke: var(--accent-gold);
    stroke-width: 2.5;
    filter: drop-shadow(0 0 3px var(--accent-gold));
  }

  path.connection-line.available-path {
    stroke: var(--accent-blue-dim);
    stroke-width: 1.5;
    stroke-dasharray: 5, 5;
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: 56px;
    height: 56px;
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.2);
    z-index: 10;
  }

  .node-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid var(--node-locked);
    background: radial-gradient(circle, #1a1d26 0%, #0f1115 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    transition: all 0.3s;
    position: relative;
  }

  .node-inner::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    border-radius: 50%;
    border: 1px solid transparent;
    transition: all 0.3s;
  }

  .node-inner svg {
    width: 28px;
    height: 28px;
    fill: var(--text-muted);
    opacity: 0.4;
    transition: all 0.3s;
  }

  /* Node States */
  .node.unlocked .node-inner {
    border-color: var(--node-unlocked);
    background: radial-gradient(circle, #2a2214 0%, #1a1510 100%);
    box-shadow: 0 0 20px var(--accent-gold-dim), inset 0 0 10px rgba(197, 160, 89, 0.2);
  }
  
  .node.unlocked .node-inner::before {
    border-color: var(--accent-gold-dim);
    opacity: 0.5;
  }
  
  .node.unlocked .node-inner svg {
    fill: var(--node-unlocked);
    opacity: 1;
    filter: drop-shadow(0 0 6px var(--accent-gold));
  }

  .node.available .node-inner {
    border-color: var(--node-available);
    border-style: dashed;
    animation: pulse 3s infinite;
    background: radial-gradient(circle, rgba(102, 252, 241, 0.1) 0%, #0f1115 100%);
  }
  
  .node.available .node-inner svg {
    fill: var(--node-available);
    opacity: 0.8;
    filter: drop-shadow(0 0 4px var(--accent-blue));
  }

  .node.locked .node-inner {
    border-color: var(--node-locked);
    background: #0f1115;
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    background: rgba(18, 20, 26, 0.98);
    border: 1px solid var(--accent-gold);
    padding: 1.2rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, bottom 0.2s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    text-align: center;
    z-index: 100;
  }

  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: rgba(18, 20, 26, 0.98);
    border-right: 1px solid var(--accent-gold);
    border-bottom: 1px solid var(--accent-gold);
    transform: translateX(-50%) rotate(45deg);
  }

  .node:hover .tooltip {
    opacity: 1;
    bottom: 80px;
  }

  .tooltip h4 {
    color: var(--accent-gold);
    font-family: var(--font-heading);
    margin-bottom: 0.6rem;
    font-size: 1.15rem;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.6rem;
    letter-spacing: 1px;
  }

  .tooltip p {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    margin-top: 0.5rem;
    font-weight: bold;
    color: var(--accent-blue);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .tooltip .cost.locked-text {
    color: var(--text-muted);
    font-style: italic;
  }

  /* Animations */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(102, 252, 241, 0.3); }
    70% { box-shadow: 0 0 0 12px rgba(102, 252, 241, 0); }
    100% { box-shadow: 0 0 0 0 rgba(102, 252, 241, 0); }
  }

  /* Decorative corner accents */
  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid var(--accent-gold-dim);
    z-index: 5;
    opacity: 0.6;
  }
  .tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

  /* Background texture overlay */
  .bg-texture {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(circle at 20% 80%, rgba(197, 160, 89, 0.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(102, 252, 241, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
  }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <!-- Simple SVG Knight Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <div class="stat-block">
      <div class="level-display">
        <span>LVL</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>

    <div class="points-display">
      <div class="points-label">Skill Points</div>
      <div class="points-val" id="sp-display">3</div>
      <div class="points-action">Click a pulsing node to upgrade</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <!-- Decorative Corners -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    
    <!-- Background Texture -->
    <div class="bg-texture"></div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 85, name: "Void Core", desc: "Unlocks all Void abilities.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 20, y: 65, name: "Shadow Step", desc: "Teleport short distances.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 80, y: 65, name: "Arcane Blast", desc: "Fire a bolt of energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 45, name: "Entropy", desc: "Drain life from enemies.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 10, y: 45, name: "Phase Shift", desc: "Become intangible.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 90, y: 45, name: "Nova", desc: "Explosive radius damage.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 25, name: "Void Walk", desc: "Permanent invisibility.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 25, name: "Meteor", desc: "Call down destruction.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 5, name: "Singularity", desc: "Ultimate power.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (Simple SVG Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve for smoother look
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine if line should be active (both ends unlocked)
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         path.classList.add('available-path');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    // Clear existing nodes (keep SVG)
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Inner circle
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      const costText = node.state === 'locked' ? '<span class="locked-text">Locked</span>' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`);
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${costText}</div>
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      // Unlock logic
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      // Visual update
      element.className = 'node unlocked';
      
      // Update UI
      updateSPDisplay();
      drawConnections(); // Redraw lines to show active state
      
      // Check if next nodes should become available
      checkNextNodes(nodeData.id);
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        // Shake animation or error feedback could go here
        console.log("Not enough points");
    }
  }
  
  function checkNextNodes(currentId) {
    // Simple logic: if a node is unlocked, check if any locked nodes connected to it should become available
    // This is a simplified version. In a real app, you'd check prerequisites more thoroughly.
    connections.forEach(conn => {
      if (conn[0] === currentId) {
        const nextNode = skillTreeData.find(n => n.id === conn[1]);
        if (nextNode && nextNode.state === 'locked') {
          nextNode.state = 'available';
          // Re-render nodes to update classes
          renderNodes();
        }
      }
      if (conn[1] === currentId) {
        const prevNode = skillTreeData.find(n => n.id === conn[0]);
        if (prevNode && prevNode.state === 'locked') {
           // This case shouldn't happen with our data structure, but for completeness
        }
      }
    });
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.5)";
    spDisplay.style.color = "var(--accent-blue)";
    setTimeout(() => {
      spDisplay.style.transform = "scale(1)";
      spDisplay.style.color = "var(--text-main)";
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING FOR VIEWPORT ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.classList.add('active');
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1.5; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1.5;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
