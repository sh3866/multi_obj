<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    --bg-deep: #030405;
    --bg-panel: #0b0d10;
    --bg-sidebar: #07080a;
    
    --accent-gold: #d4af37;
    --accent-gold-bright: #f3d060;
    --accent-gold-dim: #5e4b24;
    --accent-gold-glow: rgba(212, 175, 55, 0.5);
    
    --accent-blue: #4deeea;
    --accent-blue-dim: #1a4d52;
    --accent-blue-glow: rgba(77, 238, 234, 0.4);
    
    --text-main: #e8e8e8;
    --text-muted: #7a8290;
    --text-dark: #3a404a;
    
    --border-color: #232830;
    --border-highlight: #3e485e;
    
    --node-size: 56px;
    
    --font-heading: 'Georgia', 'Times New Roman', serif;
    --font-ui: 'Segoe UI', 'Helvetica Neue', sans-serif;
    --font-mono: 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: #000;
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 360px 1fr;
    width: 100%;
    height: 100%;
    background: var(--bg-panel);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 100px rgba(0,0,0,0.9);
  }

  /* Global Grain Overlay */
  .dashboard::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    mix-blend-mode: overlay;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, var(--bg-sidebar) 0%, #040506 100%);
    border-right: 1px solid var(--border-color);
    padding: 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    z-index: 10;
    position: relative;
    box-shadow: 5px 0 30px rgba(0,0,0,0.5);
  }

  .profile-header {
    text-align: center;
    padding-bottom: 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: relative;
  }

  .avatar-frame {
    width: 110px;
    height: 110px;
    border: 1px solid var(--accent-gold-dim);
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 40% 40%, #2a2214, #000);
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(212, 175, 55, 0.1);
    position: relative;
  }

  .avatar-frame::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 1px solid transparent;
    border-top-color: var(--accent-gold);
    border-bottom-color: var(--accent-gold);
    border-radius: 50%;
    opacity: 0.5;
    animation: spin 12s linear infinite;
  }

  .avatar-frame svg {
    width: 50px;
    height: 50px;
    stroke: var(--accent-gold);
    stroke-width: 1.2;
    fill: none;
    filter: drop-shadow(0 0 8px var(--accent-gold-glow));
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: var(--accent-gold);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    font-weight: normal;
  }

  .char-class {
    font-size: 0.7rem;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 700;
    opacity: 0.9;
    text-shadow: 0 0 10px var(--accent-blue-glow);
  }

  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .level-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 0.5rem;
    padding: 0 5px;
  }

  .level-label {
    font-family: var(--font-heading);
    font-size: 1.1rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 5px;
  }

  .level-val {
    font-family: var(--font-heading);
    font-size: 3.5rem;
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
    font-variant-numeric: tabular-nums;
  }

  .xp-container {
    position: relative;
    height: 4px;
    background: #000;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    margin-top: 5px;
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
    box-shadow: 0 0 10px var(--accent-gold);
    position: relative;
  }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: 10px;
    font-family: var(--font-mono);
    letter-spacing: 1px;
    opacity: 0.7;
  }

  .points-display {
    margin-top: auto;
    background: linear-gradient(145deg, rgba(20,22,28,0.6), rgba(10,11,14,0.8));
    border: 1px solid var(--border-color);
    padding: 2rem;
    text-align: center;
    position: relative;
    /* Refined corners */
    clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
  }

  .points-display::before {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.02);
  }

  .points-label {
    font-size: 0.8rem;
    color: var(--accent-blue);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 1rem;
    font-weight: 700;
    text-shadow: 0 0 15px var(--accent-blue-glow);
  }

  .points-val {
    font-size: 5rem;
    font-family: var(--font-heading);
    color: var(--text-main);
    text-shadow: 0 0 25px rgba(255,255,255,0.15);
    line-height: 1;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .points-action {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: var(--text-muted);
    font-style: italic;
    opacity: 0.6;
    letter-spacing: 0.5px;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #151920 0%, #050608 100%);
  }

  .header-bar {
    height: 80px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 4rem;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(10, 12, 16, 0.8) 0%, rgba(10, 12, 16, 0) 100%);
    backdrop-filter: blur(5px);
    z-index: 5;
  }

  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.5rem;
    color: var(--text-main);
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    font-weight: normal;
    position: relative;
    padding-left: 15px;
  }

  .tree-title::before {
    content: '';
    position: absolute;
    left: 0;
    top: 20%;
    height: 60%;
    width: 3px;
    background: var(--accent-gold);
    box-shadow: 0 0 10px var(--accent-gold-glow);
  }

  .tabs {
    display: flex;
    gap: 4rem;
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }

  .tab:hover {
    color: var(--text-main);
  }

  .tab.active {
    color: var(--accent-gold);
    border-bottom-color: var(--accent-gold);
    text-shadow: 0 0 15px var(--accent-gold-glow);
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
  }

  .tree-viewport:active {
    cursor: grabbing;
  }

  /* Decorative HUD Corners */
  .hud-corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    z-index: 5;
    pointer-events: none;
    transition: border-color 0.3s;
  }
  .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
  .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
  .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

  /* --- THE TREE --- */
  .tree-container {
    position: relative;
    width: 1200px;
    height: 900px;
    transform-origin: center center;
    transition: transform 0.1s linear;
    margin: auto; /* Center in viewport initially */
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
  }

  path.connection-line {
    fill: none;
    stroke: #2a3040;
    stroke-width: 3;
    transition: stroke 0.5s, stroke-width 0.5s, filter 0.5s;
  }

  path.connection-line.active {
    stroke: var(--accent-gold);
    stroke-width: 4;
    filter: drop-shadow(0 0 8px var(--accent-gold-glow));
  }

  path.connection-line.available-path {
    stroke: var(--accent-blue);
    stroke-width: 2;
    stroke-dasharray: 8, 8;
    opacity: 0.5;
    filter: drop-shadow(0 0 5px var(--accent-blue-glow));
    animation: dashFlow 20s linear infinite;
  }
  
  @keyframes dashFlow {
    to { stroke-dashoffset: -1000; }
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: var(--node-size);
    height: var(--node-size);
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.2);
    z-index: 10;
  }

  .node-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid var(--border-color);
    background: radial-gradient(circle at 30% 30%, #1e222b, #0a0c10);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.9);
    transition: all 0.3s;
    position: relative;
  }

  .node-inner svg {
    width: 26px;
    height: 26px;
    fill: var(--text-muted);
    opacity: 0.4;
    transition: all 0.3s;
  }

  /* Node States */
  .node.unlocked .node-inner {
    border-color: var(--accent-gold);
    background: radial-gradient(circle at 30% 30%, #4a3d20, #1a150b);
    box-shadow: 0 0 30px var(--accent-gold-glow), inset 0 0 15px rgba(0,0,0,0.6);
  }
  
  .node.unlocked .node-inner svg {
    fill: var(--accent-gold-bright);
    opacity: 1;
    filter: drop-shadow(0 0 6px var(--accent-gold));
  }

  .node.available .node-inner {
    border-color: var(--accent-blue);
    border-style: dashed;
    background: radial-gradient(circle at 30% 30%, rgba(77, 238, 234, 0.15), rgba(10, 12, 16, 0.9));
    animation: pulse 3s infinite ease-in-out;
  }
  
  .node.available .node-inner svg {
    fill: var(--accent-blue);
    opacity: 1;
    filter: drop-shadow(0 0 8px var(--accent-blue));
  }

  .node.locked .node-inner {
    border-color: #1f232a;
    background: #08090a;
    box-shadow: none;
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 280px;
    background: rgba(10, 12, 16, 0.95);
    border: 1px solid var(--border-color);
    border-top: 3px solid var(--accent-gold);
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 15px 50px rgba(0,0,0,0.9);
    text-align: center;
    z-index: 100;
    backdrop-filter: blur(5px);
  }

  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 12px;
    height: 12px;
    background: rgba(10, 12, 16, 0.95);
    border-right: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--accent-gold);
    font-family: var(--font-heading);
    margin-bottom: 0.8rem;
    font-size: 1.3rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: normal;
  }

  .tooltip p {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 1rem;
    font-weight: 300;
  }

  .tooltip .cost {
    margin-top: 0.5rem;
    font-weight: bold;
    color: var(--accent-blue);
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 0.8rem;
    font-family: var(--font-ui);
  }

  .tooltip .cost.locked-text {
    color: var(--text-muted);
    font-style: italic;
    opacity: 0.6;
    font-weight: normal;
  }

  /* Animations */
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(77, 238, 234, 0.2); }
    70% { box-shadow: 0 0 0 20px rgba(77, 238, 234, 0); }
    100% { box-shadow: 0 0 0 0 rgba(77, 238, 234, 0); }
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <!-- Cleaned up Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <div class="stat-block">
      <div class="level-row">
        <span class="level-label">LVL</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>

    <div class="points-display">
      <div class="points-label">Skill Points</div>
      <div class="points-val" id="sp-display">3</div>
      <div class="points-action">Click a pulsing node to upgrade</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <!-- Decorative Corners -->
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    
    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 90, name: "Void Core", desc: "Unlocks all Void abilities.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 25, y: 70, name: "Shadow Step", desc: "Teleport short distances instantly.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 75, y: 70, name: "Arcane Blast", desc: "Fire a bolt of condensed energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 50, name: "Entropy", desc: "Drain life from enemies to heal self.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 15, y: 50, name: "Phase Shift", desc: "Become intangible to attacks.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 85, y: 50, name: "Nova", desc: "Explosive radius damage.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 30, name: "Void Walk", desc: "Permanent stealth in shadows.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 30, name: "Meteor", desc: "Call down destruction from orbit.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 10, name: "Singularity", desc: "Ultimate power: Collapse space.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (SVG Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Determine if line should be active
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         path.classList.add('available-path');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Inner circle
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      const costText = node.state === 'locked' ? '<span class="locked-text">Locked</span>' : (node.state === 'unlocked' ? 'Mastered' : `Cost: ${node.cost} SP`);
      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${costText}</div>
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      element.className = 'node unlocked';
      
      updateSPDisplay();
      drawConnections();
      checkNextNodes(nodeData.id);
    }
  }
  
  function checkNextNodes(currentId) {
    connections.forEach(conn => {
      if (conn[0] === currentId) {
        const nextNode = skillTreeData.find(n => n.id === conn[1]);
        if (nextNode && nextNode.state === 'locked') {
          nextNode.state = 'available';
          renderNodes();
        }
      }
    });
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.5)";
    spDisplay.style.color = "var(--accent-blue)";
    setTimeout(() => {
      spDisplay.style.transform = "scale(1)";
      spDisplay.style.color = "var(--text-main)";
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.classList.add('active');
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1.5; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1.5;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
