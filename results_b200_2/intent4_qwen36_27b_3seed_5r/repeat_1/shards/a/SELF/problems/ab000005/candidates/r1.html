<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | The Art of Clean</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #e09f67;
            --accent-hover: #f0b07a;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layout */
        .scene-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Canvas Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: none; /* Hide default cursor for immersion */
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Allow clicks to pass through to canvas */
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            animation: fadeDown 1s ease-out forwards 0.2s;
        }

        .brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* Hero Section */
        .hero-section {
            max-width: 480px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease-out forwards 0.5s;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.95;
            font-weight: 200;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 span {
            display: block;
            font-weight: 600;
            color: var(--accent);
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 2.5rem;
            font-weight: 300;
            max-width: 340px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Interactive Elements */
        .btn {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 36px;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-weight: 500;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(224, 159, 103, 0.3);
        }

        /* Footer */
        .footer-info {
            display: flex;
            gap: 3rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 0.8s;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-layer { padding: 2rem; }
            h1 { font-size: 3rem; }
            .footer-info { display: none; }
        }
    </style>
</head>
<body>

    <div class="scene-wrapper">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">Spotless</div>
                <div class="tagline">Interactive Surface Engine</div>
            </header>

            <div class="hero-section">
                <h1>Resurface<br><span>Reality.</span></h1>
                <p class="description">
                    Experience the satisfaction of a perfect clean. 
                    Move your cursor to sweep away the mess and reveal 
                    the pristine texture beneath.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset Scene</a>
            </div>

            <div class="footer-info">
                <span>Vector Graphics</span>
                <span>Procedural Texture</span>
                <span>Real-time Physics</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * ADVANCED VISUAL ENGINE
         * 1. High-res procedural wood floor generation.
         * 2. Complex fluid-like spill particles with specular highlights.
         * 3. Detailed vector mop rendering.
         * 4. Physics-based cleaning interaction.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0, lastX: 0, lastY: 0 };
        let mopAngle = 0;
        
        // Configuration
        const config = {
            floorColor: '#e3dcd2', // Warm stone/wood
            plankWidth: 140,
            plankGap: 3,
            messBaseColor: '#3e2723', // Dark Coffee
            messHighlight: '#5d4037',
            messCount: 80,
            mopHandleColor: '#4e342e',
            mopHeadColor: '#90a4ae',
            mopHeadDark: '#607d8b'
        };

        // State
        let messParticles = [];
        let floorPattern = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- PROCEDURAL TEXTURES ---

        function createFloorPattern() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = config.plankWidth + config.plankGap;
            pCanvas.height = 400;
            const pCtx = pCanvas.getContext('2d');

            // Base plank color
            pCtx.fillStyle = config.floorColor;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // Wood grain simulation (multiple passes for realism)
            for (let i = 0; i < 120; i++) {
                pCtx.strokeStyle = `rgba(160, 140, 120, ${Math.random() * 0.15})`;
                pCtx.lineWidth = Math.random() * 2;
                pCtx.beginPath();
                const y = Math.random() * pCanvas.height;
                pCtx.moveTo(0, y);
                // Wavy lines
                pCtx.bezierCurveTo(
                    pCanvas.width * 0.25, y + (Math.random() * 20 - 10),
                    pCanvas.width * 0.75, y + (Math.random() * 20 - 10),
                    pCanvas.width, y + (Math.random() * 10 - 5)
                );
                pCtx.stroke();
            }

            // Knots (occasional)
            if(Math.random() > 0.5) {
                pCtx.save();
                pCtx.globalAlpha = 0.1;
                pCtx.beginPath();
                pCtx.ellipse(pCanvas.width * 0.5, pCanvas.height * 0.3, 10, 30, 0, 0, Math.PI*2);
                pCtx.fillStyle = '#8d6e63';
                pCtx.fill();
                pCtx.restore();
            }

            // Plank Gap (Shadow)
            pCtx.fillStyle = 'rgba(0,0,0,0.15)';
            pCtx.fillRect(0, 0, config.plankGap, pCanvas.height);
            
            // Plank Edge (Highlight)
            pCtx.fillStyle = 'rgba(255,255,255,0.3)';
            pCtx.fillRect(config.plankGap, 0, 1, pCanvas.height);

            floorPattern = ctx.createPattern(pCanvas, 'repeat');
        }

        function spawnMess() {
            messParticles = [];
            // Center the mess slightly to the right to balance the left-aligned text
            const centerX = width * 0.65;
            const centerY = height * 0.55;

            // Create puddle structure
            for (let i = 0; i < config.messCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                // Elliptical distribution
                const rx = Math.min(width, height) * 0.25;
                const ry = Math.min(width, height) * 0.18;
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * rx,
                    y: centerY + Math.sin(angle) * ry,
                    radius: Math.random() * 50 + 20,
                    opacity: Math.random() * 0.6 + 0.4,
                    alpha: 1,
                    removed: false,
                    type: 'puddle'
                });
            }

            // Splatter drops (chaos)
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.35);
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    radius: Math.random() * 8 + 2,
                    opacity: Math.random() * 0.8 + 0.2,
                    alpha: 1,
                    removed: false,
                    type: 'drop'
                });
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Vignette for depth
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            // Draw from smallest to largest for correct layering
            messParticles.sort((a, b) => a.radius - b.radius);

            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Main liquid body
                ctx.fillStyle = config.messBaseColor;
                ctx.globalAlpha = p.opacity * p.alpha;
                
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Wet Specular Highlight (The "Shine")
                // Offset to top-left to simulate light source
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.arc(-p.radius * 0.3, -p.radius * 0.3, p.radius * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // Inner shadow for depth
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.arc(p.radius * 0.2, p.radius * 0.2, p.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Calculate velocity for dynamic tilt
            const speed = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
            const tilt = Math.min(Math.max(mouse.vx * 0.005, -0.5), 0.5); // Clamp tilt
            
            // Base angle 45 degrees + dynamic tilt
            const targetAngle = -Math.PI / 4 + tilt;
            
            // Smooth rotation interpolation
            mopAngle += (targetAngle - mopAngle) * 0.2;

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // 1. Handle (Wood)
            ctx.fillStyle = config.mopHandleColor;
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 8;
            ctx.shadowOffsetY = 8;
            
            // Main pole
            ctx.beginPath();
            ctx.roundRect(-10, -450, 20, 450, 5);
            ctx.fill();

            // Metallic Connector
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.fillStyle = '#cfd8dc';
            ctx.fillRect(-14, 0, 28, 15);
            ctx.fillStyle = '#546e7a'; // Darker rim
            ctx.fillRect(-14, 10, 28, 5);

            // 2. Mop Head (The Rags)
            // We draw a base plate
            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            ctx.roundRect(-75, 15, 150, 160, 10);
            ctx.fill();

            // The Rags (Strips)
            const stripCount = 10;
            const stripWidth = 150 / stripCount;
            
            for(let i=0; i<stripCount; i++) {
                const sx = -75 + (i * stripWidth);
                
                // Create wavy rag shape
                ctx.beginPath();
                ctx.moveTo(sx + 2, 15);
                // Wavy curves
                ctx.bezierCurveTo(sx + 10, 50, sx - 5, 90, sx + 2, 170);
                ctx.lineTo(sx + stripWidth - 2, 170);
                ctx.bezierCurveTo(sx + stripWidth + 5, 90, sx + stripWidth - 10, 50, sx + stripWidth - 2, 15);
                
                // Alternating rag colors for texture
                ctx.fillStyle = i % 2 === 0 ? config.mopHeadColor : config.mopHeadDark;
                ctx.fill();
                
                // Rag Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fill();
            }

            // 3. Handle Grip (Rubber) - Foreground
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.roundRect(-12, -350, 24, 80, 4);
            ctx.fill();

            // Grip Texture lines
            ctx.fillStyle = '#424242';
            for(let i=0; i<4; i++) {
                ctx.fillRect(-12, -340 + (i*15), 24, 2);
            }

            ctx.restore();
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = 140; // Size of the cleaning area

            // Calculate mouse velocity for next frame
            mouse.vx = mouse.x - mouse.lastX;
            mouse.vy = mouse.y - mouse.lastY;
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < cleanRadius) {
                    // Calculate "force" based on distance (closer = faster clean)
                    const force = (cleanRadius - dist) / cleanRadius;
                    p.alpha -= force * 0.15; // Cleaning speed

                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            updatePhysics();
            
            // Draw the interactive mop tool
            if (mouse.x > 0 && mouse.y > 0) {
                drawMop();
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
