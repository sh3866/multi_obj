<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | The Art of Clean</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #fbbf24;
            --accent-hover: #f59e0b;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layout */
        .scene-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Canvas Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: none; 
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 4rem 6%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            /* Refined Gradient for better contrast */
            background: linear-gradient(to right, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.7) 25%, rgba(0,0,0,0.1) 55%, transparent 100%);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            animation: fadeDown 1s ease-out forwards 0.2s;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
            border-radius: 1px;
        }

        .tagline {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        /* Hero Section */
        .hero-section {
            max-width: 500px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.4s;
        }

        h1 {
            font-size: clamp(3rem, 5.5vw, 5rem);
            line-height: 0.95;
            font-weight: 300;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            color: #fff;
        }

        h1 span {
            display: block;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #d1d5db;
            margin-bottom: 3rem;
            font-weight: 300;
            max-width: 400px;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Interactive Elements */
        .btn {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 20px 45px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.3);
        }

        /* Footer */
        .footer-info {
            display: flex;
            gap: 4rem;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 0.8s;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 1.5rem;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .ui-layer { padding: 2rem; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%); }
            .hero-section { margin-top: auto; max-width: 100%; }
            h1 { font-size: 2.8rem; }
            .footer-info { display: none; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="scene-wrapper">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-icon"></div>
                    Spotless
                </div>
                <div class="tagline">Interactive Surface Engine</div>
            </header>

            <div class="hero-section">
                <h1>Resurface<br><span>Reality.</span></h1>
                <p class="description">
                    Experience the satisfaction of a perfect clean. 
                    Move your cursor to sweep away the mess and reveal 
                    the pristine texture beneath.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset Scene</a>
            </div>

            <div class="footer-info">
                <span>Procedural Texture</span>
                <span>Vector Graphics</span>
                <span>Real-time Physics</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * REBUILT VISUAL ENGINE
         * Improvements:
         * 1. Lighting: Added a warm, directional "sun" beam to the floor.
         * 2. Floor Texture: More sophisticated wood grain with knots and varnish sheen.
         * 3. Liquid: Coffee spill with viscosity, distinct droplets, and specular highlights.
         * 4. Mop: Detailed handle, realistic cloth strips with physics-based wave animation.
         * 5. Interaction: Smoothed out the cleaning radius and added "wet trail" logic.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0, lastX: 0, lastY: 0 };
        let mopAngle = -Math.PI / 4;
        
        // Configuration
        const config = {
            messColor: '#3e2723', // Dark coffee
            messHighlight: '#5d4037',
            messCount: 150,
            plankWidth: 200,
            cleanRadius: 150,
        };

        // State
        let messParticles = [];
        let floorPattern = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- PROCEDURAL TEXTURES ---

        function createFloorPattern() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = config.plankWidth;
            pCanvas.height = 600; // Taller for better vertical repetition
            const pCtx = pCanvas.getContext('2d');

            // 1. Base Wood Color (Warm Oak)
            pCtx.fillStyle = '#d4b483'; 
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // 2. Wood Grain (Horizontal lines with variation)
            for (let i = 0; i < 400; i++) {
                pCtx.strokeStyle = `rgba(101, 67, 33, ${Math.random() * 0.12})`;
                pCtx.lineWidth = Math.random() * 1.5 + 0.5;
                pCtx.beginPath();
                const y = Math.random() * pCanvas.height;
                pCtx.moveTo(0, y);
                
                // Subtle waviness
                const cp1y = y + (Math.random() * 8 - 4);
                const cp2y = y + (Math.random() * 8 - 4);
                
                pCtx.bezierCurveTo(
                    pCanvas.width * 0.33, cp1y,
                    pCanvas.width * 0.66, cp2y,
                    pCanvas.width, y
                );
                pCtx.stroke();
            }

            // 3. Wood Knots (Rare, adds realism)
            if(Math.random() > 0.4) {
                pCtx.save();
                pCtx.globalAlpha = 0.15;
                const kx = Math.random() * pCanvas.width;
                const ky = Math.random() * pCanvas.height;
                
                // Concentric rings
                for(let r=2; r<40; r+=5) {
                    pCtx.strokeStyle = '#5c4033';
                    pCtx.lineWidth = 1;
                    pCtx.beginPath();
                    pCtx.ellipse(kx, ky, r, r*3.5, 0, 0, Math.PI*2);
                    pCtx.stroke();
                }
                pCtx.restore();
            }

            // 4. Varnish (Subtle sheen across the plank)
            const plankGrad = pCtx.createLinearGradient(0, 0, pCanvas.width, 0);
            plankGrad.addColorStop(0, 'rgba(255,255,255,0.1)');
            plankGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
            plankGrad.addColorStop(1, 'rgba(0,0,0,0.05)');
            pCtx.fillStyle = plankGrad;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // 5. Plank Edge (Bevel/Shadow)
            // Left edge shadow
            const shadowGrad = pCtx.createLinearGradient(0, 0, 20, 0);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0.2)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            pCtx.fillStyle = shadowGrad;
            pCtx.fillRect(0, 0, 20, pCanvas.height);

            // Right edge shadow (Next plank)
            const shadowGradRight = pCtx.createLinearGradient(pCanvas.width - 15, 0, pCanvas.width, 0);
            shadowGradRight.addColorStop(0, 'rgba(0,0,0,0)');
            shadowGradRight.addColorStop(1, 'rgba(0,0,0,0.2)');
            pCtx.fillStyle = shadowGradRight;
            pCtx.fillRect(pCanvas.width - 15, 0, 15, pCanvas.height);

            floorPattern = ctx.createPattern(pCanvas, 'repeat');
        }

        function spawnMess() {
            messParticles = [];
            // Center the mess slightly to the right to balance the text on the left
            const centerX = width * 0.65;
            const centerY = height * 0.55;

            // Main Puddle (Organic shape using overlapping circles)
            for (let i = 0; i < config.messCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                // Elliptical distribution for a spill look
                const rx = Math.min(width, height) * 0.25;
                const ry = Math.min(width, height) * 0.18;
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * rx,
                    y: centerY + Math.sin(angle) * ry,
                    radius: Math.random() * 60 + 25,
                    opacity: Math.random() * 0.6 + 0.4,
                    alpha: 1,
                    removed: false,
                    type: 'puddle'
                });
            }

            // Splatters (Small droplets flying out)
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.35) + 50;
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    radius: Math.random() * 6 + 1,
                    opacity: Math.random() * 0.8 + 0.2,
                    alpha: 1,
                    removed: false,
                    type: 'drop'
                });
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Cinematic Lighting (Sun beam from top right)
            const grad = ctx.createRadialGradient(width*0.7, height*0.3, 0, width*0.7, height*0.3, width);
            grad.addColorStop(0, 'rgba(255, 220, 180, 0.15)'); // Warm light
            grad.addColorStop(0.5, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)'); // Vignette
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            // Sort by size so small drops are on top of big puddle
            messParticles.sort((a, b) => a.radius - b.radius);

            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                
                // 1. Base Liquid (Coffee)
                ctx.fillStyle = config.messColor;
                ctx.globalAlpha = p.opacity * p.alpha;
                
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // 2. Specular Highlight (Wet reflection)
                // Offset slightly top-left
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(-p.radius * 0.3, -p.radius * 0.3, p.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // 3. Inner Shadow (Depth/Viscosity)
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.arc(p.radius * 0.2, p.radius * 0.2, p.radius * 0.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Physics: Tilt based on velocity
            const speed = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
            const tilt = Math.min(Math.max(mouse.vx * 0.008, -0.8), 0.8);
            
            // Target angle: 45 degrees + tilt
            const targetAngle = -Math.PI / 4 + tilt;
            mopAngle += (targetAngle - mopAngle) * 0.15; // Smooth rotation

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // --- SHADOW ---
            // Dynamic shadow based on height (simulated)
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 15;
            ctx.shadowOffsetY = 15;

            // --- HANDLE ---
            // Main pole
            const poleGrad = ctx.createLinearGradient(-12, 0, 12, 0);
            poleGrad.addColorStop(0, '#222'); 
            poleGrad.addColorStop(0.5, '#444');
            poleGrad.addColorStop(1, '#111');
            
            ctx.fillStyle = poleGrad;
            ctx.beginPath();
            ctx.roundRect(-12, -480, 24, 480, 8);
            ctx.fill();

            // Reset shadow for details
            ctx.shadowBlur = 0; 
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // --- CONNECTOR (Metal Plate) ---
            const collarGrad = ctx.createLinearGradient(-25, 0, 25, 0);
            collarGrad.addColorStop(0, '#7f8c8d');
            collarGrad.addColorStop(0.5, '#ecf0f1');
            collarGrad.addColorStop(1, '#505a5e');
            
            ctx.fillStyle = collarGrad;
            ctx.beginPath();
            ctx.roundRect(-25, -15, 50, 35, 4);
            ctx.fill();
            
            // Bolts
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.arc(-15, 2, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(15, 2, 3, 0, Math.PI*2); ctx.fill();

            // --- MOP HEAD (RAGS) ---
            // Base plate (Hidden mostly but provides structure)
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.roundRect(-100, 25, 200, 180, 15);
            ctx.fill();

            // Rags (Cloth strips)
            const stripCount = 16;
            const stripWidth = 200 / stripCount;
            
            for(let i=0; i<stripCount; i++) {
                const sx = -100 + (i * stripWidth);
                
                ctx.beginPath();
                ctx.moveTo(sx + 4, 25);
                // Wavy cloth shape using Bezier curves
                // Control points create the "swish" effect
                const wave = Math.sin(Date.now() / 150 + i) * 6; // Slight animation
                
                ctx.bezierCurveTo(
                    sx + 12 + wave, 80, 
                    sx - 8 - wave, 130, 
                    sx + 4, 200
                );
                ctx.lineTo(sx + stripWidth - 4, 200);
                ctx.bezierCurveTo(
                    sx + stripWidth + 8 + wave, 130, 
                    sx + stripWidth - 12 - wave, 80, 
                    sx + stripWidth - 4, 25
                );
                
                // Alternating cloth colors for texture
                ctx.fillStyle = i % 2 === 0 ? '#bdc3c7' : '#95a5a6';
                ctx.fill();
                
                // Cloth fold shadow
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fill();
            }

            // --- GRIP ---
            // Rubber grip texture
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.roundRect(-14, -380, 28, 120, 8);
            ctx.fill();
            
            // Grip ridges
            ctx.fillStyle = '#333';
            for(let i=0; i<8; i++) {
                ctx.fillRect(-14, -370 + (i*14), 28, 5);
            }

            ctx.restore();
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = config.cleanRadius; 

            mouse.vx = mouse.x - mouse.lastX;
            mouse.vy = mouse.y - mouse.lastY;
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // If mop is close enough
                if (dist < cleanRadius) {
                    // Fade out based on proximity (center is stronger)
                    const force = (cleanRadius - dist) / cleanRadius;
                    p.alpha -= force * 0.12; 

                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            updatePhysics();
            
            // Only draw mop if mouse is on screen
            if (mouse.x > 0 && mouse.y > 0) {
                drawMop();
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
