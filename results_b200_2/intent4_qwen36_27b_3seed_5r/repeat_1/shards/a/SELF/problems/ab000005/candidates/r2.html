<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | The Art of Clean</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent: #fbbf24;
            --accent-hover: #f59e0b;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layout */
        .scene-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Canvas Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: none; 
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 4rem 5%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            /* Modern Gradient Overlay */
            background: linear-gradient(to right, rgba(15,15,17,0.95) 0%, rgba(15,15,17,0.6) 40%, transparent 70%);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            animation: fadeDown 1s ease-out forwards 0.2s;
        }

        .brand {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
        }

        .tagline {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* Hero Section */
        .hero-section {
            max-width: 520px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.4s;
        }

        h1 {
            font-size: clamp(3rem, 5vw, 5rem);
            line-height: 0.9;
            font-weight: 300;
            margin-bottom: 1.5rem;
            letter-spacing: -0.04em;
            color: #fff;
        }

        h1 span {
            display: block;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #d1d5db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.1em;
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #d1d5db;
            margin-bottom: 3rem;
            font-weight: 300;
            max-width: 360px;
        }

        /* Interactive Elements */
        .btn {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 20px 42px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(251, 191, 36, 0.3);
        }

        /* Footer */
        .footer-info {
            display: flex;
            gap: 3rem;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 0.8s;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .ui-layer { padding: 2rem; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); }
            .hero-section { margin-top: auto; }
            h1 { font-size: 3rem; }
            .footer-info { display: none; }
        }
    </style>
</head>
<body>

    <div class="scene-wrapper">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-icon"></div>
                    Spotless
                </div>
                <div class="tagline">Interactive Surface Engine</div>
            </header>

            <div class="hero-section">
                <h1>Resurface<br><span>Reality.</span></h1>
                <p class="description">
                    Experience the satisfaction of a perfect clean. 
                    Move your cursor to sweep away the mess and reveal 
                    the pristine texture beneath.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset Scene</a>
            </div>

            <div class="footer-info">
                <span>Procedural Texture</span>
                <span>Vector Graphics</span>
                <span>Real-time Physics</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * REBUILT VISUAL ENGINE
         * - Improved Wood Generation (more realistic grain, knots, varnish)
         * - Enhanced Mop Design (modern, detailed)
         * - Better Liquid Physics (specular highlights, puddle depth)
         * - Cinematic Lighting (vignette, shadows)
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0, lastX: 0, lastY: 0 };
        let mopAngle = -Math.PI / 4;
        
        // Configuration
        const config = {
            floorBase: '#e6d5c3', 
            floorDark: '#c2b09c',
            plankWidth: 160,
            plankGap: 4,
            messColor: '#2c1b18', // Deep dark coffee
            messHighlight: '#4e342e',
            messCount: 100,
        };

        // State
        let messParticles = [];
        let floorPattern = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- PROCEDURAL TEXTURES ---

        function createFloorPattern() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = config.plankWidth + config.plankGap;
            pCanvas.height = 400;
            const pCtx = pCanvas.getContext('2d');

            // 1. Base Wood Color
            pCtx.fillStyle = config.floorBase;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // 2. Wood Grain (Noise)
            for (let i = 0; i < 200; i++) {
                pCtx.strokeStyle = `rgba(139, 69, 19, ${Math.random() * 0.1})`;
                pCtx.lineWidth = Math.random() * 1.5;
                pCtx.beginPath();
                const y = Math.random() * pCanvas.height;
                pCtx.moveTo(0, y);
                // More natural curves
                pCtx.bezierCurveTo(
                    pCanvas.width * 0.33, y + (Math.random() * 10 - 5),
                    pCanvas.width * 0.66, y + (Math.random() * 10 - 5),
                    pCanvas.width, y + (Math.random() * 10 - 5)
                );
                pCtx.stroke();
            }

            // 3. Wood Knots
            if(Math.random() > 0.6) {
                pCtx.save();
                pCtx.globalAlpha = 0.15;
                const kx = Math.random() * pCanvas.width;
                const ky = Math.random() * pCanvas.height;
                
                // Outer knot ring
                pCtx.strokeStyle = '#8b4513';
                pCtx.lineWidth = 2;
                pCtx.beginPath();
                pCtx.ellipse(kx, ky, 15, 40, 0, 0, Math.PI*2);
                pCtx.stroke();
                
                // Inner knot
                pCtx.fillStyle = '#5d4037';
                pCtx.beginPath();
                pCtx.ellipse(kx, ky, 5, 15, 0, 0, Math.PI*2);
                pCtx.fill();
                pCtx.restore();
            }

            // 4. Varnish/Sheen (Subtle gradient on plank)
            const plankGrad = pCtx.createLinearGradient(0, 0, pCanvas.width, 0);
            plankGrad.addColorStop(0, 'rgba(255,255,255,0.05)');
            plankGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
            plankGrad.addColorStop(1, 'rgba(0,0,0,0.05)');
            pCtx.fillStyle = plankGrad;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // 5. Plank Gap (Shadow)
            pCtx.fillStyle = 'rgba(0,0,0,0.2)';
            pCtx.fillRect(0, 0, config.plankGap, pCanvas.height);
            
            // 6. Plank Edge (Highlight)
            pCtx.fillStyle = 'rgba(255,255,255,0.4)';
            pCtx.fillRect(config.plankGap, 0, 1, pCanvas.height);

            floorPattern = ctx.createPattern(pCanvas, 'repeat');
        }

        function spawnMess() {
            messParticles = [];
            // Shift mess slightly right
            const centerX = width * 0.65;
            const centerY = height * 0.55;

            // Main Puddle (Overlapping circles for organic look)
            for (let i = 0; i < config.messCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const rx = Math.min(width, height) * 0.22;
                const ry = Math.min(width, height) * 0.15;
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * rx,
                    y: centerY + Math.sin(angle) * ry,
                    radius: Math.random() * 40 + 15,
                    opacity: Math.random() * 0.5 + 0.5,
                    alpha: 1,
                    removed: false,
                    type: 'puddle'
                });
            }

            // Splatters
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (Math.min(width, height) * 0.35);
                messParticles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    radius: Math.random() * 6 + 1,
                    opacity: Math.random() * 0.8 + 0.2,
                    alpha: 1,
                    removed: false,
                    type: 'drop'
                });
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Cinematic Vignette
            const grad = ctx.createRadialGradient(width/2, height/2, height/4, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            // Sort by size for proper layering (small drops on top of puddle)
            messParticles.sort((a, b) => a.radius - b.radius);

            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                
                // 1. Base Liquid
                ctx.fillStyle = config.messColor;
                ctx.globalAlpha = p.opacity * p.alpha;
                
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // 2. Specular Highlight (Wet look)
                // Draw a smaller circle offset from center
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(-p.radius * 0.25, -p.radius * 0.25, p.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // 3. Inner Shadow (Depth)
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(p.radius * 0.1, p.radius * 0.1, p.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Physics: Tilt based on velocity
            const speed = Math.sqrt(mouse.vx*mouse.vx + mouse.vy*mouse.vy);
            const tilt = Math.min(Math.max(mouse.vx * 0.008, -0.6), 0.6);
            
            // Target angle: 45 degrees + tilt
            const targetAngle = -Math.PI / 4 + tilt;
            mopAngle += (targetAngle - mopAngle) * 0.25;

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // --- SHADOW ---
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetX = 15;
            ctx.shadowOffsetY = 15;

            // --- HANDLE ---
            // Main pole (Wood/Metal mix)
            const poleGrad = ctx.createLinearGradient(-8, 0, 8, 0);
            poleGrad.addColorStop(0, '#3e2723');
            poleGrad.addColorStop(0.5, '#5d4037');
            poleGrad.addColorStop(1, '#3e2723');
            
            ctx.fillStyle = poleGrad;
            ctx.beginPath();
            ctx.roundRect(-8, -450, 16, 450, 4);
            ctx.fill();

            // --- CONNECTOR ---
            ctx.shadowBlur = 0; // Reset shadow for details
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Metal collar
            const collarGrad = ctx.createLinearGradient(-14, 0, 14, 0);
            collarGrad.addColorStop(0, '#78909c');
            collarGrad.addColorStop(0.5, '#cfd8dc');
            collarGrad.addColorStop(1, '#546e7a');
            
            ctx.fillStyle = collarGrad;
            ctx.beginPath();
            ctx.roundRect(-14, 0, 28, 20, 2);
            ctx.fill();

            // --- MOP HEAD (RAGS) ---
            // Base plate
            ctx.fillStyle = '#263238';
            ctx.beginPath();
            ctx.roundRect(-80, 20, 160, 170, 12);
            ctx.fill();

            // Rags (Cloth strips)
            const stripCount = 12;
            const stripWidth = 160 / stripCount;
            
            for(let i=0; i<stripCount; i++) {
                const sx = -80 + (i * stripWidth);
                
                ctx.beginPath();
                ctx.moveTo(sx + 2, 20);
                // Wavy cloth shape
                ctx.bezierCurveTo(sx + 10, 60, sx - 5, 100, sx + 2, 185);
                ctx.lineTo(sx + stripWidth - 2, 185);
                ctx.bezierCurveTo(sx + stripWidth + 5, 100, sx + stripWidth - 10, 60, sx + stripWidth - 2, 20);
                
                // Cloth texture
                ctx.fillStyle = i % 2 === 0 ? '#90a4ae' : '#78909c';
                ctx.fill();
                
                // Shadow inside rags
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();
            }

            // --- FOREGROUND GRIIP ---
            // Rubber grip
            ctx.fillStyle = '#212121';
            ctx.beginPath();
            ctx.roundRect(-10, -360, 20, 90, 4);
            ctx.fill();
            
            // Grip texture
            ctx.fillStyle = '#424242';
            for(let i=0; i<5; i++) {
                ctx.fillRect(-10, -350 + (i*16), 20, 3);
            }

            ctx.restore();
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = 130; 

            mouse.vx = mouse.x - mouse.lastX;
            mouse.vy = mouse.y - mouse.lastY;
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < cleanRadius) {
                    // Stronger force closer to center
                    const force = (cleanRadius - dist) / cleanRadius;
                    p.alpha -= force * 0.2; 

                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            updatePhysics();
            
            if (mouse.x > 0 && mouse.y > 0) {
                drawMop();
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
