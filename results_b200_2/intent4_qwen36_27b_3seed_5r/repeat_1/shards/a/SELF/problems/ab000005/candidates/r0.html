<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | The Art of Clean</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --accent: #d4a373;
            --accent-hover: #faedcd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layout Container */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: auto 1fr auto;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 10;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        .hero-text {
            max-width: 400px;
        }

        h1 {
            font-size: 4rem;
            line-height: 1.1;
            font-weight: 300;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .btn {
            pointer-events: auto;
            display: inline-block;
            padding: 16px 32px;
            background-color: var(--accent);
            color: #1a1a1a;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* The Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        /* Footer */
        .footer-info {
            display: flex;
            gap: 2rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .scene-container {
                grid-template-columns: 1fr;
            }
            .ui-layer {
                padding: 2rem;
                justify-content: flex-end;
                padding-bottom: 4rem;
            }
            h1 {
                font-size: 2.5rem;
            }
            header {
                margin-bottom: auto;
            }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-dot"></div>
                    Spotless
                </div>
                <div class="tagline">Interactive Surface Engine</div>
            </header>

            <div class="hero-text">
                <h1>Resurface<br>Reality.</h1>
                <p class="description">
                    Experience the satisfaction of a perfect clean. 
                    Move your cursor to sweep away the mess and reveal 
                    the pristine texture beneath.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset Scene</a>
            </div>

            <div class="footer-info">
                <span>Vector Graphics</span>
                <span>Procedural Texture</span>
                <span>Real-time Physics</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * VISUAL DESIGN ENGINE
         * Renders a stylized floor, a messy spill, and a mop tool.
         * Interaction: Mouse movement wipes the mess.
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, isDown: false };
        let mopAngle = 0;
        
        // Configuration
        const config = {
            floorColor: '#e6e2dd', // Warm beige/grey
            plankWidth: 120,
            plankGap: 4,
            messColor: '#5d4037', // Dark coffee/mud
            messCount: 60,
            mopHandleColor: '#8d6e63',
            mopHeadColor: '#cfd8dc',
            mopHeadAccent: '#b0bec5'
        };

        // State
        let messParticles = [];
        let floorPattern = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- TEXTURES ---

        function createFloorPattern() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = config.plankWidth + config.plankGap;
            pCanvas.height = 200; // Arbitrary height for pattern
            const pCtx = pCanvas.getContext('2d');

            // Base plank
            pCtx.fillStyle = config.floorColor;
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            // Wood grain noise
            for (let i = 0; i < 40; i++) {
                pCtx.strokeStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
                pCtx.beginPath();
                pCtx.moveTo(0, Math.random() * pCanvas.height);
                pCtx.bezierCurveTo(
                    pCanvas.width * 0.3, Math.random() * pCanvas.height,
                    pCanvas.width * 0.7, Math.random() * pCanvas.height,
                    pCanvas.width, Math.random() * pCanvas.height
                );
                pCtx.stroke();
            }

            // Plank gap (shadow)
            pCtx.fillStyle = 'rgba(0,0,0,0.1)';
            pCtx.fillRect(0, 0, config.plankGap, pCanvas.height);

            // Plank edge highlight
            pCtx.fillStyle = 'rgba(255,255,255,0.2)';
            pCtx.fillRect(config.plankGap, 0, 2, pCanvas.height);

            floorPattern = ctx.createPattern(pCanvas, 'repeat');
        }

        function spawnMess() {
            messParticles = [];
            const centerX = width * 0.6;
            const centerY = height * 0.6;

            // Create puddle blobs
            for (let i = 0; i < config.messCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * (Math.min(width, height) * 0.25);
                
                messParticles.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    radius: Math.random() * 40 + 10,
                    opacity: Math.random() * 0.8 + 0.2,
                    alpha: 1, // For wiping effect
                    removed: false
                });
            }

            // Splatter drops
            for (let i = 0; i < 50; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * (Math.min(width, height) * 0.35);
                messParticles.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    radius: Math.random() * 6 + 2,
                    opacity: Math.random() * 0.5 + 0.5,
                    alpha: 1,
                    removed: false
                });
            }
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Global shadow for depth
            const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            messParticles.forEach(p => {
                if (p.alpha <= 0.05) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Wet look
                ctx.fillStyle = config.messColor;
                ctx.globalAlpha = p.opacity * p.alpha;
                
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Specular highlight (wetness)
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.beginPath();
                ctx.arc(-p.radius * 0.3, -p.radius * 0.3, p.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawMop() {
            // Position mop at mouse, but slightly offset to look like it's being held
            const mx = mouse.x;
            const my = mouse.y;

            // Calculate angle based on movement (simple easing)
            // In a real app we'd track velocity, here we just tilt slightly
            const tilt = (mx % 50) * 0.005; 
            const targetAngle = -Math.PI / 4 + tilt; // 45 degrees
            
            // Smooth rotation
            mopAngle += (targetAngle - mopAngle) * 0.1;

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // 1. Handle (Behind)
            ctx.fillStyle = config.mopHandleColor;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            
            // Draw handle extending "up"
            ctx.beginPath();
            ctx.roundRect(-8, -400, 16, 400, 8);
            ctx.fill();

            // Handle connector
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(-12, 0, 24, 20);

            // 2. Mop Head (The Pads)
            ctx.shadowBlur = 0; // Reset shadow for head details
            
            const headWidth = 140;
            const headHeight = 160;

            // Base of mop head
            ctx.fillStyle = '#78909c';
            ctx.beginPath();
            ctx.roundRect(-headWidth/2, 10, headWidth, headHeight, 10);
            ctx.fill();

            // The "Rags" (Strips)
            ctx.globalCompositeOperation = 'source-over';
            const stripCount = 8;
            const stripWidth = headWidth / stripCount;
            
            for(let i=0; i<stripCount; i++) {
                const sx = -headWidth/2 + (i * stripWidth) + 2;
                
                // Wavy rag effect
                ctx.beginPath();
                ctx.moveTo(sx, 10);
                ctx.bezierCurveTo(sx + 5, 40, sx - 5, 80, sx + 2, 170);
                ctx.lineTo(sx + stripWidth - 4, 170);
                ctx.bezierCurveTo(sx + stripWidth - 5 + 5, 80, sx + stripWidth - 5 - 5, 40, sx + stripWidth - 4, 10);
                
                // Alternating colors for rag depth
                ctx.fillStyle = i % 2 === 0 ? config.mopHeadColor : config.mopHeadAccent;
                ctx.fill();
                
                // Rag shadow
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fill();
            }

            // 3. Handle Grip (Foreground)
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.roundRect(-10, -380, 20, 60, 4);
            ctx.fill();

            // 4. Cleaning Effect (The "Wet" Trail)
            // We draw a semi-transparent shape where the mop is to simulate the "cleaned" area
            // This is visual feedback only, the logic happens in the update loop
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = '#fff'; // Simulates the clean floor color
            ctx.beginPath();
            ctx.roundRect(-headWidth/2 + 10, 20, headWidth - 20, headHeight - 10, 5);
            ctx.fill();

            ctx.restore();
        }

        function drawCursor() {
            // Custom cursor ring
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 20, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = 120;

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < cleanRadius) {
                    // Fade out based on distance
                    const reduction = 0.05;
                    p.alpha -= reduction;
                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            updatePhysics();
            
            // Only draw mop if mouse is on screen
            if (mouse.x > 0 && mouse.y > 0) {
                drawMop();
                // Don't draw cursor ring if we are drawing the detailed mop
            } else {
                // If we wanted a default cursor when idle
                // drawCursor(); 
            }

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
