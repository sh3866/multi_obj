<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Matrix: Void Walker</title>
<style>
  :root {
    /* Palette - Deep Void & Arcane Gold */
    --bg-dark: #050508;
    --bg-panel: #0a0b10;
    --bg-panel-light: #12141c;
    
    --accent-gold: #eeb654;
    --accent-gold-dim: #8a6d3b;
    --accent-gold-glow: rgba(238, 182, 84, 0.6);
    
    --accent-cyan: #5de0e6;
    --accent-cyan-dim: #2a6b6e;
    --accent-cyan-glow: rgba(93, 224, 230, 0.5);
    
    --text-main: #e6e6e6;
    --text-muted: #6d7285;
    --text-bright: #ffffff;
    
    --border-color: #2a2e3d;
    
    /* Typography */
    --font-heading: 'Times New Roman', 'Cinzel', serif;
    --font-ui: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 340px 1fr;
    width: 98vw;
    height: 96vh;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    box-shadow: 0 0 100px rgba(0,0,0,0.8);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(18,20,28,0.95) 0%, rgba(8,8,10,0.98) 100%);
    border-right: 1px solid var(--border-color);
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    z-index: 10;
    position: relative;
    box-shadow: 5px 0 30px rgba(0,0,0,0.6);
  }

  /* Decorative sidebar line */
  .sidebar::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--accent-gold-dim), transparent);
    box-shadow: 0 0 10px var(--accent-gold-dim);
  }

  .profile-header {
    text-align: center;
    position: relative;
    margin-bottom: 1rem;
  }

  .avatar-frame {
    width: 120px;
    height: 120px;
    border: 2px solid var(--accent-gold-dim);
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, #2a2e3d, #0b0c10);
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }
  
  /* Spinning outer ring */
  .avatar-frame::before {
    content: '';
    position: absolute;
    top: -10px; left: -10px; right: -10px; bottom: -10px;
    border-radius: 50%;
    border: 2px dashed var(--accent-gold-dim);
    opacity: 0.4;
    animation: spin 25s linear infinite;
  }
  
  .avatar-frame::after {
    content: '';
    position: absolute;
    top: -15px; left: -15px; right: -15px; bottom: -15px;
    border-radius: 50%;
    border-top: 2px solid var(--accent-cyan-dim);
    border-bottom: 2px solid var(--accent-cyan-dim);
    border-left: transparent;
    border-right: transparent;
    animation: spin 15s linear infinite reverse;
  }

  .avatar-frame svg {
    width: 55px;
    height: 55px;
    fill: var(--accent-gold);
    filter: drop-shadow(0 0 10px var(--accent-gold-glow));
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: var(--text-bright);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .char-class {
    font-size: 0.85rem;
    color: var(--accent-gold);
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 700;
    text-shadow: 0 0 10px var(--accent-gold-dim);
  }

  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    padding: 0 1rem;
  }

  .level-display {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: var(--font-heading);
  }

  .level-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    font-weight: 600;
  }

  .level-val {
    font-size: 3.5rem;
    color: var(--text-bright);
    line-height: 1;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  .xp-container {
    position: relative;
    height: 12px;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #333;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    /* Upgrade: Gradient and subtle glow */
    background: linear-gradient(90deg, #8a6d3b, #eeb654, #ffe0a6);
    box-shadow: 0 0 20px var(--accent-gold-glow);
    border-radius: 4px;
    position: relative;
  }
  
  /* Shine effect on XP bar */
  .xp-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shine 4s infinite;
  }

  .xp-text {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: right;
    font-family: monospace;
    letter-spacing: 1px;
    margin-top: -0.5rem;
  }

  /* --- SP DISPLAY (Moved to Sidebar per Critique) --- */
  .sp-container {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--accent-cyan-dim);
    padding: 1.2rem;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 0 15px rgba(0,0,0,0.3), inset 0 0 20px rgba(93, 224, 230, 0.05);
    position: relative;
    overflow: hidden;
  }
  
  .sp-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 2px; height: 100%;
    background: var(--accent-cyan);
    box-shadow: 0 0 10px var(--accent-cyan);
  }

  .sp-info {
    display: flex;
    flex-direction: column;
  }

  .sp-label {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .sp-val {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: var(--text-bright);
    text-shadow: 0 0 10px var(--accent-cyan-glow);
  }

  .sp-icon {
    width: 32px;
    height: 32px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 8px var(--accent-cyan));
    animation: pulse 3s infinite ease-in-out;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: #08090d;
  }

  /* Background Texture & Depth */
  .main-area::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(circle at 50% 30%, rgba(30, 35, 50, 0.5) 0%, rgba(5,5,8,1) 70%);
    pointer-events: none;
    z-index: 0;
  }
  
  /* Grid overlay */
  .main-area::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .header-bar {
    height: 90px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 3rem;
    justify-content: space-between;
    background: rgba(15, 17, 24, 0.85);
    backdrop-filter: blur(10px);
    z-index: 5;
  }

  /* Critique: Refined Title */
  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    color: var(--text-bright);
    letter-spacing: 4px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 15px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    position: relative;
    padding-left: 20px;
  }
  
  .tree-title::before {
    content: '';
    display: block;
    width: 6px;
    height: 28px;
    background: linear-gradient(to bottom, var(--accent-gold), transparent);
    border-radius: 3px;
    box-shadow: 0 0 15px var(--accent-gold);
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.4);
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 10px 28px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .tab:hover {
    color: var(--text-main);
    background: rgba(255,255,255,0.05);
  }

  .tab.active {
    color: var(--bg-dark);
    background: var(--accent-gold);
    box-shadow: 0 0 20px var(--accent-gold-dim);
    text-shadow: none;
    border: 1px solid rgba(255,255,255,0.5);
  }

  /* --- THE TREE --- */
  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    z-index: 1;
  }

  .tree-viewport:active {
    cursor: grabbing;
  }

  .tree-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1000px;
    height: 800px;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* Connection Lines */
  path.connection-line {
    fill: none;
    stroke: #2a2e3d;
    stroke-width: 4;
    transition: stroke 0.5s, stroke-width 0.5s, filter 0.5s;
  }

  /* Active Path: Glowing Gold (Critique Point 1) */
  path.connection-line.active {
    stroke: var(--accent-gold);
    stroke-width: 6;
    filter: drop-shadow(0 0 8px var(--accent-gold));
    stroke-dasharray: none;
  }
  
  /* Locked Path: Faint Dashed (Critique Point 1) */
  path.connection-line.locked {
    stroke: #333;
    stroke-dasharray: 6, 10;
    opacity: 0.5;
  }

  /* Potential Path: Glowing Cyan Dashed */
  path.connection-line.potential {
    stroke: var(--accent-cyan);
    stroke-width: 4;
    stroke-dasharray: 8, 8;
    opacity: 0.8;
    filter: drop-shadow(0 0 4px var(--accent-cyan));
    animation: dash-flow 20s linear infinite;
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: 80px;
    height: 80px;
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.2);
    z-index: 10;
  }

  .node-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #0b0c10;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Hexagon Clip for unique shape */
  .node-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    z-index: -1;
    transition: all 0.3s ease;
  }

  /* Upgrade: Crisp SVG Icons (Critique Point 3) */
  .node-inner svg {
    width: 36px;
    height: 36px;
    fill: var(--text-muted);
    opacity: 0.3;
    transition: all 0.3s;
    z-index: 2;
  }

  /* --- STATE: LOCKED --- */
  .node.locked .node-bg {
    background: #12141a;
    border: 1px solid #333;
    opacity: 0.6;
  }
  
  /* Lock Icon overlay */
  .node.locked .node-inner::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid var(--text-muted);
    border-radius: 50%;
    border-bottom-color: transparent;
    transform: rotate(-45deg);
    opacity: 0.3;
    top: 50%; left: 50%;
    margin-top: -8px; margin-left: -8px;
  }

  /* --- STATE: AVAILABLE --- */
  .node.available .node-bg {
    background: radial-gradient(circle, #1a2526 0%, #0b0c10 100%);
    border: 2px solid var(--accent-cyan);
    box-shadow: 0 0 20px var(--accent-cyan-glow);
  }
  
  .node.available .node-inner svg {
    fill: var(--accent-cyan);
    opacity: 1;
    filter: drop-shadow(0 0 6px var(--accent-cyan));
  }
  
  /* Hover effect for available */
  .node.available:hover .node-bg {
     box-shadow: 0 0 30px var(--accent-cyan);
  }

  /* --- STATE: UNLOCKED (Active) --- */
  .node.unlocked .node-bg {
    background: radial-gradient(circle, #3d3015 0%, #1a150b 100%);
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 25px var(--accent-gold-glow);
  }
  
  .node.unlocked .node-inner svg {
    fill: var(--accent-gold);
    opacity: 1;
    filter: drop-shadow(0 0 8px var(--accent-gold));
  }
  
  /* Outer ring for unlocked nodes */
  .node.unlocked .node-inner::before {
    content: '';
    position: absolute;
    top: -6px; left: -6px; right: -6px; bottom: -6px;
    border: 1px solid var(--accent-gold);
    border-radius: 50%;
    opacity: 0.5;
    animation: pulse-ring 4s infinite;
  }
  
  /* Critique Point 4: Radial Gradient Depth behind Active Nodes */
  .node.unlocked::after {
    content: '';
    position: absolute;
    width: 150%;
    height: 150%;
    top: 25%;
    left: 25%;
    background: radial-gradient(circle, rgba(238, 182, 84, 0.15) 0%, transparent 70%);
    z-index: -2;
    pointer-events: none;
  }

  /* --- TOOLTIP --- */
  .tooltip {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 280px;
    background: rgba(10, 11, 16, 0.98);
    border: 1px solid var(--accent-gold-dim);
    padding: 1.2rem;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    text-align: left;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  /* Arrow */
  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 14px;
    height: 14px;
    background: var(--bg-panel-light);
    border-right: 1px solid var(--accent-gold-dim);
    border-bottom: 1px solid var(--accent-gold-dim);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--text-bright);
    font-family: var(--font-heading);
    margin-bottom: 0.6rem;
    font-size: 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.6rem;
    letter-spacing: 1px;
  }

  .tooltip p {
    font-size: 0.9rem;
    color: #aab0c0;
    line-height: 1.5;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding-top: 0.5rem;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  
  .tooltip .cost span { color: var(--accent-cyan); }
  .tooltip .cost.locked-text { color: var(--text-muted); font-style: italic; font-weight: normal; }
  .tooltip .cost.mastered { color: var(--accent-gold); }

  /* Animations */
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.2; }
    100% { transform: scale(1); opacity: 0.5; }
  }
  
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  @keyframes shine {
    0% { transform: translateX(-150%); }
    100% { transform: translateX(150%); }
  }

  @keyframes dash-flow {
    to { stroke-dashoffset: -100; }
  }

  @keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 8px var(--accent-cyan)); }
    50% { transform: scale(1.1); filter: drop-shadow(0 0 15px var(--accent-cyan)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--accent-cyan)); }
  }

  /* Decorative UI Elements */
  .corner-accents {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  
  .corner-accents::before, .corner-accents::after {
    content: '';
    position: absolute;
    width: 80px;
    height: 80px;
    border: 2px solid var(--accent-gold-dim);
    opacity: 0.2;
  }
  
  .corner-accents::before { top: 30px; left: 30px; border-right: none; border-bottom: none; }
  .corner-accents::after { bottom: 30px; right: 30px; border-left: none; border-top: none; }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <!-- Simple SVG Knight Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <div class="stat-block">
      <div class="level-display">
        <span class="level-label">LEVEL</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>

    <!-- Critique Point 2: Moved Points to Sidebar & Renamed -->
    <div class="sp-container">
      <div class="sp-info">
        <span class="sp-label">Available Skill Points</span>
        <span class="sp-val" id="sp-display">3</span>
      </div>
      <div class="sp-icon">
        <!-- Crisp Void Diamond Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 12l10 10 10-10L12 2zm0 16l-6-6 6-6 6 6-6 6z"/>
        </svg>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>

      <!-- Spacer to balance layout since points moved -->
      <div style="width: 150px;"></div> 
    </div>

    <div class="corner-accents"></div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  const skillTreeData = [
    { id: 1, x: 50, y: 90, name: "Void Core", desc: "Unlocks all Void abilities. Increases base mana.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 20, y: 70, name: "Shadow Step", desc: "Teleport short distances behind enemies.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 80, y: 70, name: "Arcane Blast", desc: "Fire a concentrated bolt of energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 50, name: "Entropy", desc: "Drain life from enemies to heal self.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 10, y: 50, name: "Phase Shift", desc: "Become intangible for 3 seconds.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 90, y: 50, name: "Nova", desc: "Explosive radius damage around you.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 30, name: "Void Walk", desc: "Permanent low-level invisibility.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 30, name: "Meteor", desc: "Call down destruction from the sky.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 10, name: "Singularity", desc: "Ultimate power. Erase a target.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (Crisp Geometric Paths) ---
  const icons = {
    core: "M12 2L2 12l10 10 10-10L12 2zm0 16l-6-6 6-6 6 6-6 6z", // Diamond
    shadow: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z", // Circle with hole
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Lightning
    drain: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z", // Target
    phase: "M12 2l-5.5 9h11z M12 22l5.5-9h-11z", // Hourglass/Abstract
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z", // Star
    walk: "M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99z", // Triangle
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", // Fire
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99z" // Triangle Warning
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve for smoother look
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Logic for line state
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         path.classList.add('potential');
      } else {
         path.classList.add('locked');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    // Clear existing nodes (keep SVG)
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Inner circle
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Hexagon Background
      const bg = document.createElement('div');
      bg.className = 'node-bg';
      inner.appendChild(bg);
      
      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      
      let costHtml = '';
      if(node.state === 'locked') costHtml = '<span class="locked-text">Requires Prerequisite</span>';
      else if(node.state === 'unlocked') costHtml = '<span class="mastered">Mastered</span>';
      else costHtml = `<span>${node.cost} SP</span>`;

      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${costHtml}</div>
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      // Unlock logic
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      // Visual update
      element.className = 'node unlocked';
      
      // Update UI
      updateSPDisplay();
      drawConnections(); // Redraw lines to show active state
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        // Shake animation logic could go here
        spDisplay.style.color = "#d65c5c";
        setTimeout(() => {
            spDisplay.style.color = "#ffffff";
        }, 500);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.5)";
    spDisplay.style.color = "var(--accent-gold)";
    setTimeout(() => {
      spDisplay.style.transform = "scale(1)";
      spDisplay.style.color = "var(--text-bright)";
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING FOR VIEWPORT ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.classList.add('active');
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
