<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension: Skill Matrix</title>
<style>
  :root {
    /* Palette - Deep Void & Arcane Gold */
    --bg-dark: #050508;
    --bg-panel: #0f1118;
    --bg-panel-light: #161922;
    
    --accent-gold: #eeb654;
    --accent-gold-dim: #8a6d3b;
    --accent-cyan: #5de0e6;
    --accent-cyan-dim: #2a6b6e;
    --accent-red: #d65c5c;
    
    --text-main: #e6e6e6;
    --text-muted: #6d7285;
    --text-bright: #ffffff;
    
    --border-color: #2a2e3d;
    --grid-color: rgba(255, 255, 255, 0.03);
    
    /* Typography */
    --font-heading: 'Cinzel', 'Times New Roman', serif;
    --font-ui: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT --- */
  .dashboard {
    display: grid;
    grid-template-columns: 320px 1fr;
    width: 98vw;
    height: 94vh;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 100px rgba(0,0,0,0.5);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }

  /* --- SIDEBAR --- */
  .sidebar {
    background: linear-gradient(180deg, rgba(15,17,24,0.95) 0%, rgba(5,5,8,0.95) 100%);
    border-right: 1px solid var(--border-color);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    z-index: 10;
    position: relative;
  }

  .profile-header {
    text-align: center;
    position: relative;
  }

  .avatar-frame {
    width: 100px;
    height: 100px;
    border: 2px solid var(--accent-gold-dim);
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #1a1d26 0%, #0b0c10 100%);
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    position: relative;
  }
  
  /* Decorative ring around avatar */
  .avatar-frame::after {
    content: '';
    position: absolute;
    top: -6px; left: -6px; right: -6px; bottom: -6px;
    border: 1px solid var(--accent-gold-dim);
    border-radius: 50%;
    border-top-color: transparent;
    border-bottom-color: transparent;
    animation: spin 10s linear infinite;
  }

  .avatar-frame svg {
    width: 48px;
    height: 48px;
    fill: var(--accent-gold);
    filter: drop-shadow(0 0 5px rgba(238, 182, 84, 0.4));
  }

  .char-name {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    color: var(--text-bright);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .char-class {
    font-size: 0.8rem;
    color: var(--accent-gold);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
  }

  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .level-display {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: var(--font-heading);
    margin-bottom: 0.5rem;
  }

  .level-label {
    font-size: 1rem;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  .level-val {
    font-size: 3.5rem;
    color: var(--text-bright);
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
  }

  .xp-container {
    position: relative;
    height: 6px;
    background: #000;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  .xp-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
    box-shadow: 0 0 10px var(--accent-gold);
    border-radius: 3px;
  }

  .xp-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: right;
    font-family: monospace;
  }

  .points-display {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-color);
    border-left: 3px solid var(--accent-cyan);
    padding: 1.5rem;
    border-radius: 2px;
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .points-info {
    display: flex;
    flex-direction: column;
  }

  .points-label {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 0.25rem;
  }

  .points-val {
    font-size: 2rem;
    font-family: var(--font-heading);
    color: var(--text-bright);
    text-shadow: 0 0 10px var(--accent-cyan-dim);
  }

  .points-icon {
    width: 24px;
    height: 24px;
    fill: var(--accent-cyan);
    opacity: 0.8;
  }

  /* --- MAIN AREA --- */
  .main-area {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: #08090d;
  }

  /* Background Texture */
  .main-area::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(20, 25, 40, 0.8) 0%, rgba(5,5,8,1) 100%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .header-bar {
    height: 70px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 3rem;
    justify-content: space-between;
    background: rgba(15, 17, 24, 0.9);
    backdrop-filter: blur(5px);
    z-index: 5;
  }

  .tree-title {
    font-family: var(--font-heading);
    font-size: 1.4rem;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .tree-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 20px;
    background: var(--accent-gold);
    border-radius: 2px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
  }

  .tab {
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 8px 20px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .tab:hover {
    color: var(--text-main);
    background: rgba(255,255,255,0.05);
  }

  .tab.active {
    color: var(--bg-dark);
    background: var(--accent-gold);
    box-shadow: 0 0 10px var(--accent-gold-dim);
    text-shadow: none;
  }

  .tree-viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    z-index: 1;
  }

  .tree-viewport:active {
    cursor: grabbing;
  }

  /* --- THE TREE --- */
  .tree-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 700px;
  }

  svg.connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }

  path.connection-line {
    fill: none;
    stroke: #2a2e3d;
    stroke-width: 3;
    transition: stroke 0.5s, stroke-width 0.5s, filter 0.5s;
  }

  path.connection-line.active {
    stroke: var(--accent-gold-dim);
    stroke-width: 4;
    filter: drop-shadow(0 0 4px var(--accent-gold));
  }
  
  path.connection-line.potential {
    stroke: var(--accent-cyan-dim);
    stroke-dasharray: 5, 5;
  }

  /* --- NODES --- */
  .node {
    position: absolute;
    width: 60px;
    height: 60px;
    transform: translate(-50%, -50%);
    z-index: 2;
    cursor: pointer;
    transition: transform 0.2s ease-out;
  }

  .node:hover {
    transform: translate(-50%, -50%) scale(1.1);
    z-index: 10;
  }

  .node-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #0b0c10;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  /* Hexagon Clip for unique shape */
  .node-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    z-index: -1;
    transition: all 0.3s ease;
  }

  .node-inner svg {
    width: 28px;
    height: 28px;
    fill: var(--text-muted);
    opacity: 0.4;
    transition: all 0.3s;
    z-index: 2;
  }

  /* --- STATE: LOCKED --- */
  .node.locked .node-bg {
    background: #12141a;
    border: 1px solid #2a2e3d;
    opacity: 0.6;
  }
  
  /* Lock Icon overlay for locked */
  .node.locked .node-inner::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid var(--text-muted);
    border-radius: 50%;
    border-bottom-color: transparent;
    transform: rotate(-45deg);
    opacity: 0.3;
  }

  /* --- STATE: AVAILABLE --- */
  .node.available .node-bg {
    background: radial-gradient(circle, #1a2526 0%, #0b0c10 100%);
    border: 1px solid var(--accent-cyan);
    box-shadow: 0 0 15px var(--accent-cyan-dim);
    animation: pulse-cyan 2.5s infinite;
  }
  
  .node.available .node-inner svg {
    fill: var(--accent-cyan);
    opacity: 1;
    filter: drop-shadow(0 0 2px var(--accent-cyan));
  }

  /* --- STATE: UNLOCKED (Active) --- */
  .node.unlocked .node-bg {
    background: radial-gradient(circle, #2f2514 0%, #1a150b 100%);
    border: 1px solid var(--accent-gold);
    box-shadow: 0 0 20px var(--accent-gold-dim);
  }
  
  .node.unlocked .node-inner svg {
    fill: var(--accent-gold);
    opacity: 1;
    filter: drop-shadow(0 0 4px var(--accent-gold));
  }

  /* --- TOOLTIP --- */
  .tooltip {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 240px;
    background: rgba(11, 12, 16, 0.95);
    border: 1px solid var(--accent-gold-dim);
    padding: 1.2rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    text-align: left;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background: var(--accent-gold-dim);
    border-right: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .node:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip h4 {
    color: var(--text-bright);
    font-family: var(--font-heading);
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.5rem;
    letter-spacing: 0.5px;
  }

  .tooltip p {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 0.8rem;
  }

  .tooltip .cost {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .tooltip .cost span { color: var(--accent-cyan); }
  .tooltip .cost.locked-text { color: var(--text-muted); font-style: italic; }
  .tooltip .cost.mastered { color: var(--accent-gold); }

  /* Animations */
  @keyframes pulse-cyan {
    0% { box-shadow: 0 0 0 0 rgba(93, 224, 230, 0.4); }
    70% { box-shadow: 0 0 0 12px rgba(93, 224, 230, 0); }
    100% { box-shadow: 0 0 0 0 rgba(93, 224, 230, 0); }
  }
  
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Decorative UI Elements */
  .corner-accents {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  
  .corner-accents::before, .corner-accents::after {
    content: '';
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid var(--accent-gold-dim);
    opacity: 0.5;
  }
  
  .corner-accents::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .corner-accents::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

</style>
</head>
<body>

<div class="dashboard">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-frame">
        <!-- Simple SVG Knight Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </div>
      <div class="char-name">Kaelen</div>
      <div class="char-class">Void Walker</div>
    </div>

    <div class="stat-block">
      <div class="level-display">
        <span class="level-label">LEVEL</span>
        <span class="level-val">42</span>
      </div>
      <div class="xp-container">
        <div class="xp-fill"></div>
      </div>
      <div class="xp-text">12,450 / 15,000 XP</div>
    </div>

    <div class="points-display">
      <div class="points-info">
        <div class="points-label">Skill Points</div>
        <div class="points-val" id="sp-display">3</div>
      </div>
      <div class="points-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div class="header-bar">
      <div class="tree-title">Ascension Matrix</div>
      <div class="tabs">
        <div class="tab active">Combat</div>
        <div class="tab">Utility</div>
        <div class="tab">Passive</div>
      </div>
    </div>

    <div class="corner-accents"></div>

    <div class="tree-viewport" id="viewport">
      <div class="tree-container" id="tree-container">
        <!-- SVG Layer for Connections -->
        <svg class="connections" id="connections-layer">
          <!-- Paths injected by JS -->
        </svg>
        <!-- Nodes injected by JS -->
      </div>
    </div>
  </main>
</div>

<script>
  // --- DATA ---
  // Coordinates are percentages (0-100) relative to container
  const skillTreeData = [
    { id: 1, x: 50, y: 90, name: "Void Core", desc: "Unlocks all Void abilities. Increases base mana.", state: "unlocked", icon: "core", cost: 0 },
    { id: 2, x: 20, y: 70, name: "Shadow Step", desc: "Teleport short distances behind enemies.", state: "unlocked", icon: "shadow", cost: 1 },
    { id: 3, x: 80, y: 70, name: "Arcane Blast", desc: "Fire a concentrated bolt of energy.", state: "available", icon: "blast", cost: 1 },
    { id: 4, x: 50, y: 50, name: "Entropy", desc: "Drain life from enemies to heal self.", state: "locked", icon: "drain", cost: 2 },
    { id: 5, x: 10, y: 50, name: "Phase Shift", desc: "Become intangible for 3 seconds.", state: "locked", icon: "phase", cost: 2 },
    { id: 6, x: 90, y: 50, name: "Nova", desc: "Explosive radius damage around you.", state: "locked", icon: "nova", cost: 2 },
    { id: 7, x: 30, y: 30, name: "Void Walk", desc: "Permanent low-level invisibility.", state: "locked", icon: "walk", cost: 3 },
    { id: 8, x: 70, y: 30, name: "Meteor", desc: "Call down destruction from the sky.", state: "locked", icon: "meteor", cost: 3 },
    { id: 9, x: 50, y: 10, name: "Singularity", desc: "Ultimate power. Erase a target.", state: "locked", icon: "singularity", cost: 5 }
  ];

  const connections = [
    [1, 2], [1, 3], [1, 4],
    [2, 5], [2, 4],
    [3, 6], [3, 4],
    [5, 7], [5, 9],
    [6, 8], [6, 9],
    [4, 9]
  ];

  // --- ICONS (Simple SVG Paths) ---
  const icons = {
    core: "M12 2L2 7l10 5 10-5-10-5zm0 9l2-1-2 1zm0 0l-2-1 2 1zm0 0v5m0 0l10-5M2 17l10 5 10-5M2 12l10 5 10-5",
    shadow: "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z",
    blast: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
    drain: "M19 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM5 14c1.49 0 2.7 1.21 2.7 2.7 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-1.49 1.21-2.7 2.7-2.7zM12 2a10 10 0 0 0-10 10h20A10 10 0 0 0 12 2z",
    phase: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
    nova: "M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z",
    walk: "M13 5.69L17.69 10.39C19.08 11.77 19.08 14 17.69 15.39L12 21.08L5.31 15.39C3.92 14 3.92 11.77 5.31 10.39L10 4.7L13 5.69Z",
    meteor: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
    singularity: "M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v4h-2z"
  };

  // --- STATE ---
  let skillPoints = 3;

  // --- RENDER ---
  const treeContainer = document.getElementById('tree-container');
  const connectionsLayer = document.getElementById('connections-layer');
  const spDisplay = document.getElementById('sp-display');

  function drawConnections() {
    connectionsLayer.innerHTML = '';
    connections.forEach(conn => {
      const startNode = skillTreeData.find(n => n.id === conn[0]);
      const endNode = skillTreeData.find(n => n.id === conn[1]);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      
      // Bezier Curve for smoother look
      // Control points create a nice "S" curve or gentle arc
      const midY = (startNode.y + endNode.y) / 2;
      const d = `M ${startNode.x}% ${startNode.y}% C ${startNode.x}% ${midY}%, ${endNode.x}% ${midY}%, ${endNode.x}% ${endNode.y}%`;
      
      path.setAttribute("d", d);
      path.setAttribute("class", "connection-line");
      
      // Logic for line state
      if (startNode.state === 'unlocked' && endNode.state === 'unlocked') {
        path.classList.add('active');
      } else if (startNode.state === 'unlocked' && endNode.state === 'available') {
         path.classList.add('potential');
      }
      
      connectionsLayer.appendChild(path);
    });
  }

  function renderNodes() {
    // Clear existing nodes (keep SVG)
    const existingNodes = document.querySelectorAll('.node');
    existingNodes.forEach(n => n.remove());

    skillTreeData.forEach(node => {
      const el = document.createElement('div');
      el.className = `node ${node.state}`;
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      
      // Inner circle
      const inner = document.createElement('div');
      inner.className = 'node-inner';
      
      // Hexagon Background
      const bg = document.createElement('div');
      bg.className = 'node-bg';
      inner.appendChild(bg);
      
      // Icon
      const svgIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgIcon.setAttribute("viewBox", "0 0 24 24");
      const pathIcon = document.createElementNS("http://www.w3.org/2000/svg", "path");
      pathIcon.setAttribute("d", icons[node.icon]);
      svgIcon.appendChild(pathIcon);
      
      inner.appendChild(svgIcon);
      el.appendChild(inner);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      
      let costHtml = '';
      if(node.state === 'locked') costHtml = '<span class="locked-text">Requires Prerequisite</span>';
      else if(node.state === 'unlocked') costHtml = '<span class="mastered">Mastered</span>';
      else costHtml = `<span>${node.cost} SP</span>`;

      tooltip.innerHTML = `
        <h4>${node.name}</h4>
        <p>${node.desc}</p>
        <div class="cost">${costHtml}</div>
      `;
      el.appendChild(tooltip);

      // Interaction
      el.addEventListener('click', () => handleNodeClick(node, el));

      treeContainer.appendChild(el);
    });
  }

  function handleNodeClick(nodeData, element) {
    if (nodeData.state === 'available' && skillPoints >= nodeData.cost) {
      // Unlock logic
      skillPoints -= nodeData.cost;
      nodeData.state = 'unlocked';
      
      // Visual update
      element.className = 'node unlocked';
      
      // Update UI
      updateSPDisplay();
      drawConnections(); // Redraw lines to show active state
    } else if (nodeData.state === 'available' && skillPoints < nodeData.cost) {
        // Shake animation logic could go here
        spDisplay.style.color = "var(--accent-red)";
        setTimeout(() => {
            spDisplay.style.color = "var(--text-bright)";
        }, 500);
    }
  }

  function updateSPDisplay() {
    spDisplay.innerText = skillPoints;
    spDisplay.style.transform = "scale(1.5)";
    spDisplay.style.color = "var(--accent-cyan)";
    setTimeout(() => {
      spDisplay.style.transform = "scale(1)";
      spDisplay.style.color = "var(--text-bright)";
    }, 200);
  }

  // --- INIT ---
  renderNodes();
  drawConnections();

  // --- DRAG SCROLLING FOR VIEWPORT ---
  const viewport = document.getElementById('viewport');
  let isDown = false;
  let startX;
  let scrollLeft;
  let startY;
  let scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    isDown = true;
    viewport.classList.add('active');
    startX = e.pageX - viewport.offsetLeft;
    scrollLeft = viewport.scrollLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mouseup', () => {
    isDown = false;
    viewport.classList.remove('active');
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const walkX = (x - startX) * 1; 
    viewport.scrollLeft = scrollLeft - walkX;
    const y = e.pageY - viewport.offsetTop;
    const walkY = (y - startY) * 1;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
</body>
</html>
