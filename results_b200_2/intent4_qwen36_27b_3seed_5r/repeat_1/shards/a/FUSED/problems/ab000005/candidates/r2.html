<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless | The Art of Clean</title>
    <style>
        :root {
            /* Palette: Warm Earth, Natural Wood, Deep Shadows */
            --bg-color: #1a1410;
            --text-primary: #f4ecd8; /* Warm Cream */
            --text-secondary: #a89f91; /* Taupe */
            --accent: #c26a42; /* Burnt Orange - Muted */
            --accent-hover: #d67b4f;
            --wood-dark: #3e2723;
            --wood-light: #8d6e63;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; /* Custom cursor (mop) handles interaction */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: "Georgia", "Times New Roman", serif; /* Classic Serif */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Canvas Scene */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Subtle noise filter for texture */
            filter: contrast(1.05) saturate(1.1);
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 10;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Stronger Vignette for atmosphere */
            background: radial-gradient(circle at center, transparent 40%, rgba(26, 20, 16, 0.8) 100%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0.9;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            background-color: var(--accent);
            border-radius: 2px; /* Square for modern look */
            transform: rotate(45deg);
        }

        .tagline {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-align: right;
        }

        .hero-text {
            max-width: 480px;
            margin-bottom: 5vh;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.95;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        h1 span {
            font-style: italic;
            color: var(--accent);
        }

        p.description {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            max-width: 320px;
        }

        /* Refined Button: Earthy, tactile */
        .btn {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            background-color: var(--wood-dark);
            color: var(--text-primary);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px; /* Slightly rounded */
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .btn:hover {
            background-color: var(--wood-light);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.2);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .footer-info {
            display: flex;
            gap: 2rem;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        @media (max-width: 768px) {
            .ui-layer {
                padding: 2rem;
                justify-content: flex-end;
                padding-bottom: 4rem;
            }
            h1 { font-size: 3rem; }
            header { margin-bottom: auto; }
            .hero-text { margin-top: 0; }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <canvas id="mainCanvas"></canvas>
        
        <div class="ui-layer">
            <header>
                <div class="brand">
                    <div class="brand-icon"></div>
                    Spotless
                </div>
                <div class="tagline">Premium Surface Care</div>
            </header>

            <div class="hero-text">
                <h1>Restore the<br><span>Warmth</span>.</h1>
                <p class="description">
                    A beautiful surface deserves a beautiful clean. 
                    Drag the mop to sweep away the mess and reveal 
                    the honey oak beneath.
                </p>
                <a href="#" class="btn" id="resetBtn">Reset the Mess</a>
            </div>

            <div class="footer-info">
                <span>Procedural Design</span>
                <span>Canvas Render</span>
                <span>Interactive</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * VISUAL DESIGN ENGINE - REVISED
         * Focus: Materiality, Lighting, Organic Shapes, "Wet" Feel
         */
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('resetBtn');

        let width, height;
        let mouse = { x: -1000, y: -1000, px: -1000, py: -1000, isDown: false };
        let mopAngle = 0;
        
        // Configuration - Refined Palette
        const config = {
            // Mess: Dark, oily, viscous (Coffee/Cola mix)
            messColorBase: '#2b1d16', // Very dark brown
            messColorLight: '#5d4037', // Lighter brown for depth
            messHighlight: 'rgba(255, 255, 255, 0.15)', // Specular
            
            // Mop
            mopHandleColor: '#4e342e', // Dark Wood
            mopHandleHighlight: '#6d4c41',
            mopMetal: '#90a4ae',
            mopMetalDark: '#546e7a',
            
            // Rag Colors (Muted, earthy)
            ragColors: ['#d7ccc8', '#a1887f', '#8d6e63', '#5d4037', '#4e342e']
        };

        // State
        let messParticles = [];
        let floorPattern = null;
        let floorPatternCanvas = null;

        // --- SETUP ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createFloorPattern();
            spawnMess();
        }

        window.addEventListener('resize', resize);

        // --- TEXTURES ---

        function createFloorPattern() {
            const pSize = 400;
            if (!floorPatternCanvas) {
                floorPatternCanvas = document.createElement('canvas');
            }
            floorPatternCanvas.width = pSize;
            floorPatternCanvas.height = pSize;
            const pCtx = floorPatternCanvas.getContext('2d');

            // 1. Base Wood Color (Honey Oak)
            pCtx.fillStyle = '#c68c53'; 
            pCtx.fillRect(0, 0, pSize, pSize);

            // 2. Plank Gaps (Vertical)
            const plankWidth = pSize / 3;
            for(let i=0; i<4; i++) {
                const x = i * plankWidth;
                // Shadow side
                pCtx.fillStyle = 'rgba(30, 20, 10, 0.5)'; 
                pCtx.fillRect(x, 0, 3, pSize);
                // Highlight side
                pCtx.fillStyle = 'rgba(255, 240, 200, 0.2)';
                pCtx.fillRect(x+3, 0, 1, pSize);
            }

            // 3. Wood Grain (Organic Noise)
            // Use random bezier curves for grain
            for (let i = 0; i < 400; i++) {
                const opacity = Math.random() * 0.15;
                // Mix of dark and light grain
                pCtx.strokeStyle = Math.random() > 0.5 
                    ? `rgba(101, 67, 33, ${opacity})` 
                    : `rgba(210, 180, 140, ${opacity})`;
                
                pCtx.lineWidth = Math.random() * 1.5 + 0.2;
                pCtx.beginPath();
                const startY = Math.random() * pSize;
                pCtx.moveTo(0, startY);
                
                // Wobbly line
                pCtx.bezierCurveTo(
                    pSize * 0.25, startY + (Math.random() * 40 - 20),
                    pSize * 0.75, startY + (Math.random() * 40 - 20),
                    pSize, startY + (Math.random() * 20 - 10)
                );
                pCtx.stroke();
            }

            // 4. Plank Variation (Randomize plank brightness slightly)
            for(let i=0; i<3; i++) {
                pCtx.fillStyle = `rgba(0,0,0,${Math.random() * 0.1})`;
                pCtx.fillRect(i * plankWidth, 0, plankWidth, pSize);
            }

            floorPattern = ctx.createPattern(floorPatternCanvas, 'repeat');
        }

        function spawnMess() {
            messParticles = [];
            const centerX = width * 0.5;
            const centerY = height * 0.5;
            const spread = Math.min(width, height) * 0.25;

            // Create organic puddle blobs
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * spread;
                
                messParticles.push({
                    type: 'blob',
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    radius: Math.random() * 80 + 40,
                    opacity: Math.random() * 0.5 + 0.5,
                    alpha: 1,
                    removed: false,
                    shape: generateBlobShape(Math.random() * 80 + 40)
                });
            }

            // Splatter drops
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * (spread * 1.5);
                messParticles.push({
                    type: 'drop',
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    radius: Math.random() * 6 + 1,
                    opacity: Math.random() * 0.8 + 0.2,
                    alpha: 1,
                    removed: false
                });
            }
        }

        function generateBlobShape(baseRadius) {
            const points = [];
            const numPoints = 8;
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const r = baseRadius + (Math.random() * baseRadius * 0.4 - baseRadius * 0.2);
                points.push({
                    x: Math.cos(angle) * r,
                    y: Math.sin(angle) * r
                });
            }
            return points;
        }

        // --- DRAWING FUNCTIONS ---

        function drawFloor() {
            if (!floorPattern) return;
            
            // Draw Wood
            ctx.fillStyle = floorPattern;
            ctx.fillRect(0, 0, width, height);

            // Lighting Overlay (Vignette + Top Light)
            const grad = ctx.createRadialGradient(width/2, height/2, height * 0.1, width/2, height/2, height * 0.8);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.08)'); // Center light
            grad.addColorStop(0.6, 'rgba(0, 0, 0, 0)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0.6)'); // Dark edges
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawMess() {
            // 1. Shadow Layer (Depth)
            ctx.save();
            ctx.translate(8, 12); // Offset
            ctx.globalCompositeOperation = 'source-over';
            
            messParticles.forEach(p => {
                if (p.alpha <= 0.01) return;
                ctx.fillStyle = '#000';
                ctx.globalAlpha = p.opacity * p.alpha * 0.4;
                
                if(p.type === 'blob') drawBlobShape(p);
                else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.restore();

            // 2. Base Liquid Layer
            messParticles.forEach(p => {
                if (p.alpha <= 0.01) return;

                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Base Color
                ctx.fillStyle = config.messColorBase;
                ctx.globalAlpha = p.opacity * p.alpha;
                
                if(p.type === 'blob') drawBlobShape(p);
                else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 3. Viscosity/Highlight Layer (Wetness)
                if(p.type === 'blob') {
                    // Simulate light reflection on viscous liquid
                    // Offset slightly towards top-left
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.beginPath();
                    ctx.ellipse(-p.radius * 0.2, -p.radius * 0.2, p.radius * 0.5, p.radius * 0.3, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        function drawBlobShape(p) {
            ctx.beginPath();
            const pts = p.shape;
            if(pts.length === 0) return;
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 0; i < pts.length; i++) {
                const p0 = pts[(i + pts.length - 1) % pts.length];
                const p1 = pts[i];
                const p2 = pts[(i + 1) % pts.length];
                const p3 = pts[(i + 2) % pts.length];
                
                const cp1x = p1.x + (p2.x - p0.x) / 3;
                const cp1y = p1.y + (p2.y - p0.y) / 3;
                const cp2x = p2.x - (p3.x - p1.x) / 3;
                const cp2y = p2.y - (p3.y - p1.y) / 3;
                
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
            }
            ctx.closePath();
            ctx.fill();
        }

        function drawMop() {
            const mx = mouse.x;
            const my = mouse.y;

            // Physics for rotation
            const vx = mouse.x - mouse.px;
            const vy = mouse.y - mouse.py;
            const velocity = Math.sqrt(vx*vx + vy*vy);
            
            if (velocity > 1) {
                const targetAngle = Math.atan2(vy, vx) + Math.PI / 2;
                mopAngle += (targetAngle - mopAngle) * 0.2;
            } else {
                // Idle sway
                mopAngle += (Math.PI / 4 - mopAngle) * 0.05;
            }

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(mopAngle);

            // 1. Handle (Wood)
            ctx.fillStyle = config.mopHandleColor;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 12;
            ctx.shadowOffsetY = 12;
            
            // Tapered Handle
            ctx.beginPath();
            ctx.moveTo(-7, -500); // Top of handle (off screen usually)
            ctx.lineTo(7, -500);
            ctx.lineTo(12, 0);   // Connector
            ctx.lineTo(-12, 0);
            ctx.fill();
            
            // Wood Highlight
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.moveTo(-4, -500);
            ctx.lineTo(-2, -500);
            ctx.lineTo(-6, 0);
            ctx.lineTo(-8, 0);
            ctx.fill();

            // 2. Connector (Metal)
            ctx.fillStyle = config.mopMetal;
            // Simple cylinder shape
            ctx.fillRect(-18, -25, 36, 30);
            // Darker bottom plate
            ctx.fillStyle = config.mopMetalDark;
            ctx.fillRect(-20, 5, 40, 8);

            // 3. Mop Head (The Rags) - "Wet & Heavy"
            const headWidth = 180;
            const headHeight = 200;
            
            const stripCount = 12;
            const stripWidth = headWidth / stripCount;
            
            for(let i=0; i<stripCount; i++) {
                const sx = -headWidth/2 + (i * stripWidth);
                
                // Rag Shape (Tapered at bottom)
                ctx.beginPath();
                ctx.moveTo(sx + 2, 13);
                ctx.lineTo(sx + stripWidth - 2, 13);
                // Curved bottom for wet look
                ctx.quadraticCurveTo(sx + stripWidth, headHeight, sx + stripWidth - 5, headHeight);
                ctx.quadraticCurveTo(sx + stripWidth/2, headHeight + 10, sx + 5, headHeight);
                ctx.quadraticCurveTo(sx, headHeight, sx + 2, 13);
                ctx.closePath();

                // Color variation for texture
                ctx.fillStyle = config.ragColors[i % config.ragColors.length];
                ctx.fill();
                
                // Folds/Shadows in the rag
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(sx + stripWidth/2, 13, stripWidth/2 - 2, headHeight);

                // Wet shine on rag tips
                if (Math.random() > 0.7) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc(sx + stripWidth/2, headHeight - 20, 5, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // 4. Cleaning Trail (Wet floor effect)
            // Draw a faint, shiny patch on the floor where the mop is
            ctx.globalCompositeOperation = 'screen';
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(0, 100, headWidth/2 - 10, headHeight/2 - 10, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
            
            // Store previous pos for velocity calc
            mouse.px = mx;
            mouse.py = my;
        }

        // --- INTERACTION ---

        function updatePhysics() {
            const cleanRadius = 120;

            messParticles.forEach(p => {
                if (p.removed) return;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < cleanRadius) {
                    // Fade out based on distance
                    const reduction = 0.1;
                    p.alpha -= reduction;
                    if (p.alpha < 0) {
                        p.alpha = 0;
                        p.removed = true;
                    }
                }
            });
        }

        // --- MAIN LOOP ---

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawFloor();
            drawMess();
            updatePhysics();
            
            // Draw Mop
            drawMop();

            requestAnimationFrame(animate);
        }

        // --- EVENTS ---

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            spawnMess();
        });

        // Init
        resize();
        animate();

    </script>
</body>
</html>
