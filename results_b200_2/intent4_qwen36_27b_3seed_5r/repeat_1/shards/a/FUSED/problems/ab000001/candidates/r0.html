<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --board-bg: #f0e6d2;
            --tile-color: #fffaf0;
            --tile-border: #eaddc5;
            --path-color: #4a5568;
            --path-shadow: #2d3748;
            --accent-green: #68d391;
            --accent-red: #fc8181;
            --accent-blue: #63b3ed;
            --text-color: #4a5568;
            --font-main: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --grid-size: 5;
            --cell-size: 70px;
            --gap: 6px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: var(--font-main);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: -1px;
            color: #2d3748;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #718096;
            margin-top: 5px;
            font-weight: 600;
        }

        /* --- Game Board --- */
        .game-container {
            position: relative;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 
                0 10px 25px -5px rgba(0, 0, 0, 0.1), 
                0 8px 10px -6px rgba(0, 0, 0, 0.1),
                inset 0 0 0 1px rgba(0,0,0,0.03);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            background-color: var(--board-bg);
            padding: var(--gap);
            border-radius: 8px;
            border: 2px solid #e2d1b9;
        }

        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-color);
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .tile:hover {
            transform: translateY(-1px);
        }

        /* SVG Drawing for Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .path-line {
            stroke: var(--path-color);
            stroke-width: 8;
            stroke-linecap: round;
            fill: none;
            filter: drop-shadow(1px 1px 0 var(--path-shadow));
        }

        /* --- Characters & Markers --- */
        
        /* The Cub */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cub-body {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #63b3ed, #3182ce);
            border-radius: 8px;
            box-shadow: 
                0 4px 6px rgba(0,0,0,0.2),
                inset 2px 2px 4px rgba(255,255,255,0.4),
                inset -2px -2px 4px rgba(0,0,0,0.2);
            position: relative;
        }

        /* Cub Face */
        .cub-face {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            display: flex;
            justify-content: space-between;
        }
        .eye {
            width: 4px;
            height: 4px;
            background: #1a202c;
            border-radius: 50%;
        }
        .mouth {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 3px;
            border-bottom: 2px solid #1a202c;
            border-radius: 0 0 6px 6px;
        }

        /* The Star */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-4px); }
        }

        .star-path {
            fill: #ecc94b;
            stroke: #d69e2e;
            stroke-width: 1;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        /* --- Footer / Controls --- */
        footer {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
        }

        .btn-reset {
            background-color: #edf2f7;
            color: #718096;
            box-shadow: 0 2px 0 #cbd5e0;
        }
        .btn-reset:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .btn-run {
            background-color: #48bb78;
            color: white;
            box-shadow: 0 4px 0 #2f855a;
            position: relative;
            overflow: hidden;
        }
        
        .btn-run::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
        }

        .btn-run:hover {
            background-color: #4ade80;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 #2f855a;
        }
        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2f855a;
        }

        /* --- Responsive --- */
        @media (max-width: 500px) {
            :root {
                --cell-size: 60px;
            }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run Path</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W (Binary mask for connections)
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        // 0,0 is start. 4,4 is end.
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        // Start/End Coordinates
        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Start Marker (Star)
            const startTile = getTile(START.x, START.y);
            startTile.el.appendChild(createStarSVG());

            // Add Cub Token
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            cub.innerHTML = `
                <div class="cub-body">
                    <div class="cub-face">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            `;
            startTile.el.appendChild(cub);
        }

        // --- SVG Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            el.dataset.conn = connections;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates based on binary mask
            // Center is 50,50. N:0,50 E:100,50 S:100,50 W:0,50
            let d = "";
            const cx = 50, cy = 50;
            
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            // Interaction (Click to rotate for puzzle feel)
            el.addEventListener('click', () => {
                // Visual feedback only for this demo
                el.style.transform = 'scale(0.95)';
                setTimeout(() => el.style.transform = '', 100);
            });

            return { el, x, y, connections, svg, path };
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("class", "star-path");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            // Remove old cub
            const oldCub = document.getElementById('cub');
            if(oldCub) oldCub.remove();

            // Reset any visual changes (colors)
            tiles.forEach(t => {
                t.path.style.stroke = "var(--path-color)";
                t.path.style.strokeWidth = "8";
            });

            // Re-init
            initGame();
        }

        async function runGame() {
            const cub = document.getElementById('cub');
            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // Highlight start
            const startTile = getTile(current.x, current.y);
            startTile.path.style.stroke = "#48bb78"; // Green
            startTile.path.style.strokeWidth = "10";

            // Simple DFS to find path to END
            const stack = [{x: START.x, y: START.y}];
            const pathToGoal = [];

            // Find path algorithm (BFS for shortest)
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                // Check neighbors
                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Animate Cub along path
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.path.style.stroke = "#48bb78";
                    tile.path.style.strokeWidth = "10";
                }
                
                // Win state animation
                setTimeout(() => {
                    cub.querySelector('.cub-body').style.backgroundColor = "#ecc94b"; // Gold
                    cub.querySelector('.cub-body').style.transform = "scale(1.2) rotate(360deg)";
                    cub.querySelector('.cub-body').style.transition = "all 0.5s ease";
                }, 200);

            } else {
                alert("No path found! (This shouldn't happen in this demo level)");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            // North
            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            // East
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            // South
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            // West
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }

            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Calculate relative position
                // We need to move the cub from its current parent to the new parent, 
                // but visually it looks like a slide.
                // Simplest way in CSS Grid: Move the DOM element to the new cell.
                // To animate, we need to calculate offset.
                
                // For this simple demo, we'll just teleport with a transition effect
                // Or better: append to new cell, CSS transition handles it if we use absolute positioning relative to board?
                // No, Cub is absolute relative to TILE.
                
                // Let's do a "Jump" animation
                cub.style.transform = "translate(-50%, -50%) scale(0.5)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1)";
                    resolve();
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
