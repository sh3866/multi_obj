<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Earthy, Storybook, Refined */
            --bg-paper: #f2efe9;
            --bg-paper-dark: #e6e2d8;
            
            --wood-dark: #4e342e; /* Deep wood */
            --wood-light: #6d4c41; /* Frame wood */
            --wood-grain: rgba(0,0,0,0.15);
            
            --tile-cream: #fdfbf7;
            --tile-shadow: #dcd6cc;
            
            --path-color: #3e2723; /* Dark wood path */
            --path-highlight: #5d4037;
            --path-active: #d84315; /* Terracotta active path */
            --path-active-glow: #ff8a65;
            
            --accent-olive: #558b2f; /* Olive Green */
            --accent-olive-dark: #33691e;
            --accent-terracotta: #bf360c; /* Deep Terracotta */
            
            --star-gold: #fbc02d;
            --star-glow: rgba(251, 192, 45, 0.6);

            /* Typography */
            --font-display: "Cooper Black", "Chalkboard SE", "Arial Black", sans-serif;
            --font-serif: "Georgia", "Times New Roman", serif;
            
            /* Dimensions */
            --grid-size: 5;
            --cell-size: 70px;
            --gap: 8px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle paper noise texture using CSS gradients */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0,0,0,0.02) 0%, transparent 80%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            font-family: var(--font-serif);
            color: var(--wood-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            margin: 0;
            color: var(--wood-dark);
            letter-spacing: -1px;
            text-shadow: 2px 2px 0px var(--bg-paper-dark);
            line-height: 1;
            transform: rotate(-1deg);
        }

        .subtitle {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.1rem;
            color: var(--wood-light);
            margin-top: 6px;
            letter-spacing: 0.5px;
            opacity: 0.9;
            font-weight: normal;
        }

        /* --- The Playmat --- */
        .playmat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 10px 30px -5px rgba(0, 0, 0, 0.1), 
                0 2px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(2px);
        }

        /* --- The Game Board --- */
        .game-board-frame {
            background-color: var(--wood-light);
            padding: 10px;
            border-radius: 8px;
            /* Soft 3D wood look */
            box-shadow: 
                inset 0 1px 3px rgba(255,255,255,0.2),
                inset 0 -2px 5px rgba(0,0,0,0.3),
                0 15px 25px rgba(0,0,0,0.2);
            position: relative;
            /* Wood grain texture */
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, var(--wood-grain) 10px, var(--wood-grain) 11px);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            background-color: var(--wood-light);
            padding: var(--gap);
            border-radius: 4px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* --- Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-cream);
            border-radius: 4px;
            position: relative;
            /* Physical "Tile" look: Raised slightly from board, inset shadow on face */
            box-shadow: 
                inset 1px 1px 0px rgba(255,255,255,1),
                inset -2px -2px 4px rgba(0,0,0,0.05),
                0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .tile:hover {
            transform: translateY(-2px);
            background-color: #fff;
        }

        /* --- Paths (The Wood Carving) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .path-line {
            stroke: var(--path-color);
            stroke-width: 16; /* Thicker */
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            /* Carved effect */
            filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.5)) 
                    drop-shadow(-1px -1px 0px rgba(0,0,0,0.1));
            transition: stroke 0.3s ease, stroke-width 0.3s ease, filter 0.3s;
        }

        /* Active path: The "Red Ribbon" */
        .path-line.active {
            stroke: var(--path-active);
            stroke-width: 18;
            /* Soft glow */
            filter: drop-shadow(0px 2px 4px rgba(216, 67, 21, 0.4));
        }

        /* --- Characters --- */
        
        /* The Cub Token (SVG) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 54px;
            height: 54px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* The Star Marker */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 5;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1); 
                filter: drop-shadow(0 0 2px var(--star-glow));
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1); 
                filter: drop-shadow(0 0 8px var(--star-glow));
            }
        }

        /* --- Footer Controls (Wooden Blocks) --- */
        .controls {
            margin-top: 28px;
            display: flex;
            gap: 24px;
        }

        button {
            font-family: var(--font-display);
            font-size: 1.1rem;
            padding: 12px 32px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: 0.5px;
            
            /* Soft "Block" Look */
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            top: 0;
            box-shadow: 
                0 6px 0 rgba(0,0,0,0.15), /* The thickness */
                0 8px 10px rgba(0,0,0,0.1), /* The shadow */
                inset 0 1px 0 rgba(255,255,255,0.2); /* Top highlight */
        }

        button:active {
            top: 6px;
            box-shadow: 
                0 0 0 rgba(0,0,0,0.15), 
                inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .btn-run {
            background: var(--accent-olive);
            box-shadow: 0 6px 0 var(--accent-olive-dark), 0 8px 10px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-run:active {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .btn-reset {
            background: var(--accent-terracotta);
            box-shadow: 0 6px 0 #872506, 0 8px 10px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-reset:active {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* --- Responsive --- */
        @media (max-width: 500px) {
            :root { --cell-size: 58px; --gap: 4px; }
            h1 { font-size: 2.8rem; }
            .cub-token { width: 44px; height: 44px; }
            .playmat { padding: 15px; }
            .controls { gap: 16px; }
            button { padding: 10px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Chapter I — The Garden Path</div>
    </header>

    <!-- Unified Playmat Container -->
    <div class="playmat">
        
        <div class="game-board-frame">
            <div class="board" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <div class="controls">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="runGame()">Run</button>
        </div>

    </div>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W (Binary mask for connections)
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker (Star) at End
            const endTile = getTile(END.x, END.y);
            endTile.el.appendChild(createStarSVG());

            // Add Cub Token at Start
            const startTile = getTile(START.x, START.y);
            startTile.el.appendChild(createCubToken());
        }

        // --- SVG & DOM Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates (Center is 50,50)
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            return { el, x, y, connections, pathEl: path };
        }

        function createCubToken() {
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            
            // Custom SVG Bear Face
            cub.innerHTML = `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <!-- Ears -->
                    <circle cx="25" cy="25" r="15" fill="#5d4037" />
                    <circle cx="75" cy="25" r="15" fill="#5d4037" />
                    <circle cx="25" cy="25" r="8" fill="#8d6e63" />
                    <circle cx="75" cy="25" r="8" fill="#8d6e63" />
                    
                    <!-- Head -->
                    <circle cx="50" cy="55" r="35" fill="#8d6e63" />
                    
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="16" ry="12" fill="#efebe9" />
                    
                    <!-- Eyes -->
                    <circle cx="40" cy="50" r="4" fill="#3e2723" />
                    <circle cx="60" cy="50" r="4" fill="#3e2723" />
                    <circle cx="41" cy="49" r="1.5" fill="#fff" />
                    <circle cx="61" cy="49" r="1.5" fill="#fff" />
                    
                    <!-- Nose -->
                    <ellipse cx="50" cy="62" rx="5" ry="3" fill="#3e2723" />
                </svg>
            `;
            return cub;
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            
            // Define Gradient for metallic look
            const defs = document.createElementNS(svgNS, "defs");
            const gradient = document.createElementNS(svgNS, "linearGradient");
            gradient.setAttribute("id", "starGradient");
            gradient.setAttribute("x1", "0%"); gradient.setAttribute("y1", "0%");
            gradient.setAttribute("x2", "100%"); gradient.setAttribute("y2", "100%");
            
            const stop1 = document.createElementNS(svgNS, "stop");
            stop1.setAttribute("offset", "0%"); stop1.setAttribute("stop-color", "#fff59d");
            const stop2 = document.createElementNS(svgNS, "stop");
            stop2.setAttribute("offset", "100%"); stop2.setAttribute("stop-color", "#fbc02d");
            
            gradient.appendChild(stop1);
            gradient.appendChild(stop2);
            defs.appendChild(gradient);
            svg.appendChild(defs);

            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("fill", "url(#starGradient)");
            path.setAttribute("stroke", "#f57f17");
            path.setAttribute("stroke-width", "1");
            svg.appendChild(path);
            
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            initGame();
        }

        async function runGame() {
            // Reset previous run styles
            tiles.forEach(t => {
                t.pathEl.classList.remove('active');
            });

            const cub = document.getElementById('cub');
            
            // BFS to find path
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let visited = new Set();
            visited.add(`${START.x},${START.y}`);
            let pathToGoal = [];
            let found = false;

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Highlight Start immediately
                getTile(START.x, START.y).pathEl.classList.add('active');

                // Animate Cub along path
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    
                    // Highlight path
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.pathEl.classList.add('active');
                }
                
                // Win state animation
                setTimeout(() => {
                    const svg = cub.querySelector('svg');
                    // Simple color shift to indicate "happy/winner"
                    const head = svg.querySelector('circle:nth-child(4)'); // The main head circle
                    head.style.transition = "fill 0.5s";
                    head.style.fill = "#ffcc80"; // Lighter, happy color
                }, 200);

            } else {
                console.log("No path found");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            // North
            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            // East
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            // South
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            // West
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }

            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Jump animation start
                cub.style.transform = "translate(-50%, -50%) scale(0.8) rotate(-15deg)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    // Jump animation land
                    cub.style.transform = "translate(-50%, -50%) scale(1.1) rotate(0deg)";
                    
                    setTimeout(() => {
                        cub.style.transform = "translate(-50%, -50%) scale(1) rotate(0deg)";
                        resolve();
                    }, 100);
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
