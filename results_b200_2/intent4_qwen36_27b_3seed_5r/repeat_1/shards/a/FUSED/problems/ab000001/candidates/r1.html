<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook / Parchment */
            --bg-paper: #f4ecd8;
            --bg-paper-dark: #e6dcc3;
            --wood-dark: #5d4037;
            --wood-light: #8d6e63;
            --wood-shadow: #3e2723;
            --tile-bg: #fffbf0;
            --tile-border: #e0d6c2;
            --path-color: #2c1e16; /* Deep warm brown */
            --path-highlight: #d32f2f; /* Red ribbon */
            
            /* Character Colors */
            --cub-fur: #607d8b;
            --cub-ear: #455a64;
            --star-gold: #fbc02d;
            --star-shadow: #f57f17;

            /* Typography */
            --font-title: "Brush Script MT", "Cursive", "Segoe Print", sans-serif;
            --font-ui: "Georgia", "Times New Roman", serif;
            
            /* Dimensions */
            --grid-size: 5;
            --cell-size: 70px;
            --gap: 8px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Simulating paper texture with noise and radial gradients */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0%, transparent 40%);
            font-family: var(--font-ui);
            color: var(--wood-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: var(--font-title);
            font-size: 3.5rem;
            margin: 0;
            color: #3e2723;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5), 3px 3px 0px rgba(0,0,0,0.1);
            transform: rotate(-2deg);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--wood-light);
            margin-top: 5px;
            font-weight: bold;
            background: rgba(255,255,255,0.4);
            padding: 4px 12px;
            border-radius: 4px;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* --- Game Board Container (The Wooden Frame) --- */
        .game-container {
            position: relative;
            padding: 18px;
            background: linear-gradient(135deg, var(--wood-light), var(--wood-dark));
            border-radius: 12px;
            box-shadow: 
                0 15px 35px -5px rgba(0, 0, 0, 0.4), 
                inset 0 1px 0 rgba(255,255,255,0.2),
                inset 0 -1px 0 rgba(0,0,0,0.3);
            border: 1px solid var(--wood-shadow);
        }

        /* Stitching effect on the board */
        .game-container::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 8px;
            pointer-events: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
            background-color: var(--bg-paper-dark);
            padding: var(--gap);
            border-radius: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            border: 1px solid #d7ccc8;
        }

        /* --- Tiles --- */
        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--tile-bg);
            /* Fabric texture effect */
            background-image: radial-gradient(#e0d6c2 1px, transparent 0);
            background-size: 4px 4px;
            border-radius: 4px;
            position: relative;
            box-shadow: 
                inset 0 -3px 0 rgba(0,0,0,0.05),
                inset 0 0 0 1px rgba(255,255,255,0.8);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .tile:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset 0 -3px 0 rgba(0,0,0,0.05),
                0 4px 6px rgba(0,0,0,0.1);
        }

        /* SVG Drawing for Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .path-line {
            stroke: var(--path-color);
            stroke-width: 10; /* Thicker paths */
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(1px 2px 0px rgba(0,0,0,0.15));
            transition: stroke 0.3s ease;
        }

        /* --- Characters & Markers --- */
        
        /* The Cub Token (Characterful Dog) */
        .cub-token {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Drawn via CSS for crispness */
        .cub-head {
            width: 40px;
            height: 36px;
            background: var(--cub-fur);
            border-radius: 50% 50% 45% 45%;
            position: absolute;
            top: 8px;
            left: 5px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 3px 3px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .cub-ear {
            position: absolute;
            width: 14px;
            height: 20px;
            background: var(--cub-ear);
            top: 2px;
            border-radius: 4px 4px 8px 8px;
            z-index: 1;
        }
        .cub-ear.left { left: 0px; transform: rotate(-15deg); }
        .cub-ear.right { right: 0px; transform: rotate(15deg); }

        .cub-face-details {
            position: absolute;
            top: 14px;
            left: 10px;
            width: 20px;
            height: 12px;
        }
        .eye {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #1a202c;
            border-radius: 50%;
            top: 0;
        }
        .eye.left { left: 2px; }
        .eye.right { right: 2px; }
        
        .snout {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 6px;
            background: #cfd8dc;
            border-radius: 4px;
        }
        .nose {
            position: absolute;
            top: 1px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 3px;
            background: #1a202c;
            border-radius: 2px;
        }

        /* The Star Marker (Goal) */
        .star-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-5px); }
        }

        .star-path {
            fill: var(--star-gold);
            stroke: var(--star-shadow);
            stroke-width: 2;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        /* --- Footer / Controls (Wooden Blocks) --- */
        footer {
            margin-top: 35px;
            display: flex;
            gap: 24px;
        }

        button {
            font-family: var(--font-title);
            font-size: 1.6rem;
            padding: 8px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            color: #fff;
            position: relative;
            /* Wood block look */
            background: linear-gradient(to bottom, #8d6e63, #5d4037);
            box-shadow: 
                0 6px 0 #3e2723, 
                0 10px 10px rgba(0,0,0,0.2);
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            min-width: 120px;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 #3e2723, 
                inset 0 2px 4px rgba(0,0,0,0.2);
        }

        button:hover {
            filter: brightness(1.1);
        }

        /* Specific Button Styles */
        .btn-run {
            background: linear-gradient(to bottom, #66bb6a, #2e7d32);
            box-shadow: 0 6px 0 #1b5e20, 0 10px 10px rgba(0,0,0,0.2);
        }
        .btn-run:active { box-shadow: 0 0 0 #1b5e20; }

        .btn-reset {
            background: linear-gradient(to bottom, #ef5350, #c62828);
            box-shadow: 0 6px 0 #b71c1c, 0 10px 10px rgba(0,0,0,0.2);
        }
        .btn-reset:active { box-shadow: 0 0 0 #b71c1c; }

        /* --- Responsive --- */
        @media (max-width: 500px) {
            :root { --cell-size: 58px; }
            h1 { font-size: 2.8rem; }
            .game-container { padding: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 01 — The Garden Path</div>
    </header>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Grid generated by JS -->
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Configuration ---
        const GRID_SIZE = 5;
        // 0:None, 1:N, 2:E, 4:S, 8:W (Binary mask for connections)
        const DIR = { N:1, E:2, S:4, W:8 };
        
        // A simple solvable path for demo
        // 0,0 is start. 4,4 is end.
        const LEVEL_DATA = [
            [DIR.E | DIR.S, DIR.W | DIR.E, DIR.W | DIR.S, DIR.N | DIR.E, DIR.W | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.E, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.S, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.S, DIR.N | DIR.S],
            [DIR.N | DIR.E, DIR.N | DIR.W, DIR.N | DIR.W, DIR.N | DIR.E, DIR.N | DIR.W] 
        ];

        // Start/End Coordinates
        const START = { x: 0, y: 0 };
        const END = { x: 4, y: 4 };

        const boardEl = document.getElementById('board');
        let tiles = [];

        // --- Initialization ---

        function initGame() {
            boardEl.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = createTile(x, y, LEVEL_DATA[y][x]);
                    boardEl.appendChild(tile.el);
                    tiles.push(tile);
                }
            }

            // Add Goal Marker (Star) at End
            const endTile = getTile(END.x, END.y);
            endTile.el.appendChild(createStarSVG());

            // Add Cub Token at Start
            const startTile = getTile(START.x, START.y);
            startTile.el.appendChild(createCubToken());
        }

        // --- SVG & DOM Generators ---

        function createTile(x, y, connections) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.dataset.x = x;
            el.dataset.y = y;
            
            // Draw the path SVG
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("class", "path-line");
            
            // Calculate path coordinates based on binary mask
            let d = "";
            if (connections & DIR.N) d += `M50 0 L50 50 `;
            if (connections & DIR.E) d += `M100 50 L50 50 `;
            if (connections & DIR.S) d += `M50 100 L50 50 `;
            if (connections & DIR.W) d += `M0 50 L50 50 `;

            path.setAttribute("d", d);
            svg.appendChild(path);
            el.appendChild(svg);

            return { el, x, y, connections, pathEl: path };
        }

        function createCubToken() {
            const cub = document.createElement('div');
            cub.className = 'cub-token';
            cub.id = 'cub';
            // CSS drawn dog face
            cub.innerHTML = `
                <div class="cub-ear left"></div>
                <div class="cub-ear right"></div>
                <div class="cub-head">
                    <div class="cub-face-details">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                        <div class="snout">
                            <div class="nose"></div>
                        </div>
                    </div>
                </div>
            `;
            return cub;
        }

        function createStarSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const wrapper = document.createElement('div');
            wrapper.className = 'star-marker';
            
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z");
            path.setAttribute("class", "star-path");
            svg.appendChild(path);
            wrapper.appendChild(svg);
            return wrapper;
        }

        // --- Game Logic ---

        function getTile(x, y) {
            return tiles.find(t => t.x === x && t.y === y);
        }

        function resetGame() {
            initGame();
        }

        async function runGame() {
            // Reset previous run styles
            tiles.forEach(t => {
                t.pathEl.style.stroke = "var(--path-color)";
                t.pathEl.style.strokeWidth = "10";
                t.pathEl.style.filter = "drop-shadow(1px 2px 0px rgba(0,0,0,0.15))";
            });

            const cub = document.getElementById('cub');
            // Reset Cub color
            const head = cub.querySelector('.cub-head');
            head.style.backgroundColor = "";
            head.style.transform = "";

            let current = { x: START.x, y: START.y };
            let visited = new Set();
            visited.add(`${current.x},${current.y}`);
            
            // BFS to find path
            let queue = [{x: START.x, y: START.y, path: [{x: START.x, y: START.y}]}];
            let found = false;
            let pathToGoal = [];

            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === END.x && curr.y === END.y) {
                    pathToGoal = curr.path;
                    found = true;
                    break;
                }

                const neighbors = getValidNeighbors(curr.x, curr.y);
                for (let n of neighbors) {
                    if (!visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push({
                            x: n.x, 
                            y: n.y, 
                            path: [...curr.path, {x: n.x, y: n.y}]
                        });
                    }
                }
            }

            if (found) {
                // Animate Cub along path
                for (let i = 1; i < pathToGoal.length; i++) {
                    await moveCub(pathToGoal[i].x, pathToGoal[i].y);
                    
                    // Highlight path
                    const tile = getTile(pathToGoal[i].x, pathToGoal[i].y);
                    tile.pathEl.style.stroke = "var(--path-highlight)";
                    tile.pathEl.style.strokeWidth = "12";
                    tile.pathEl.style.filter = "drop-shadow(0 0 3px rgba(211, 47, 47, 0.5))";
                }
                
                // Win state animation
                setTimeout(() => {
                    head.style.backgroundColor = "#fbc02d"; // Gold fur
                    head.style.transition = "all 0.5s ease";
                    head.style.transform = "scale(1.2) rotate(10deg)";
                }, 200);

            } else {
                console.log("No path found");
            }
        }

        function getValidNeighbors(x, y) {
            const tile = getTile(x, y);
            if(!tile) return [];
            const conns = tile.connections;
            const neighbors = [];

            // North
            if ((conns & DIR.N) && y > 0) {
                const nTile = getTile(x, y-1);
                if (nTile && (nTile.connections & DIR.S)) neighbors.push({x, y: y-1});
            }
            // East
            if ((conns & DIR.E) && x < GRID_SIZE-1) {
                const nTile = getTile(x+1, y);
                if (nTile && (nTile.connections & DIR.W)) neighbors.push({x: x+1, y});
            }
            // South
            if ((conns & DIR.S) && y < GRID_SIZE-1) {
                const nTile = getTile(x, y+1);
                if (nTile && (nTile.connections & DIR.N)) neighbors.push({x, y: y+1});
            }
            // West
            if ((conns & DIR.W) && x > 0) {
                const nTile = getTile(x-1, y);
                if (nTile && (nTile.connections & DIR.E)) neighbors.push({x: x-1, y});
            }

            return neighbors;
        }

        function moveCub(targetX, targetY) {
            return new Promise(resolve => {
                const cub = document.getElementById('cub');
                const targetTile = getTile(targetX, targetY).el;
                
                // Simple "Jump" animation
                cub.style.transform = "translate(-50%, -50%) scale(0.5) rotate(-10deg)";
                
                setTimeout(() => {
                    targetTile.appendChild(cub);
                    cub.style.transform = "translate(-50%, -50%) scale(1) rotate(0deg)";
                    resolve();
                }, 150);
            });
        }

        // Run init
        initGame();

    </script>
</body>
</html>
