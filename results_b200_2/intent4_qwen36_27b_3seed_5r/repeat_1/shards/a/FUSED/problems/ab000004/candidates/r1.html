<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense</title>
<style>
  :root {
    --bg-color: #05070a;
    --primary: #00f3ff; /* Cyan */
    --primary-dim: rgba(0, 243, 255, 0.15);
    --secondary: #ff9d00; /* Amber/Orange */
    --secondary-dim: rgba(255, 157, 0, 0.15);
    --danger: #ff2a2a;
    --text-main: #e0e6ed;
    --text-muted: #8b9bb4;
    --panel-bg: rgba(8, 12, 20, 0.85);
    
    /* Fonts */
    --font-hud: 'Courier New', Courier, monospace;
    --font-display: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-color);
    font-family: var(--font-display);
    color: var(--text-main);
  }

  /* --- BACKGROUND SCENE --- */
  #scene-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
  }

  /* CRT & Vignette */
  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
    opacity: 0.6;
  }
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
    pointer-events: none;
    z-index: 5;
  }

  /* --- UI LAYOUT --- */
  .ui-layer {
    position: relative;
    z-index: 20;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
  }

  /* --- HUD HEADER --- */
  .hud-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 15px;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
  }

  .hud-item {
    display: flex;
    flex-direction: column;
  }

  .hud-label {
    font-family: var(--font-hud);
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .hud-value {
    font-family: var(--font-hud); /* Monospace as requested */
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
    letter-spacing: 1px;
  }

  /* HP Bar Styling */
  .hp-container {
    width: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hp-bar-bg {
    width: 100%;
    height: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    transform: skewX(-20deg);
    overflow: hidden;
    position: relative;
  }
  .hp-bar-fill {
    height: 100%;
    width: 85%; /* Mock value */
    background: var(--primary);
    box-shadow: 0 0 10px var(--primary);
    position: relative;
  }
  .hp-bar-fill::after {
    content: '';
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,0.3) 4px, rgba(0,0,0,0.3) 8px);
  }

  /* --- CENTER STAGE --- */
  .center-stage {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 0 20px;
    position: relative;
  }

  /* Title Design */
  .game-title {
    font-size: 4.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 12px; /* Cinematic spacing */
    margin: 0 0 20px 0;
    color: #fff;
    /* Glow & Shadow */
    text-shadow: 
      0 0 10px rgba(0, 243, 255, 0.5),
      0 0 30px rgba(0, 243, 255, 0.3),
      0 4px 0 rgba(0,0,0,0.8);
    z-index: 2;
    position: relative;
  }

  /* Mission Brief */
  .mission-brief {
    background: var(--panel-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-left: 3px solid var(--primary);
    padding: 15px 25px;
    max-width: 550px;
    margin-bottom: 40px;
    backdrop-filter: blur(4px);
    position: relative;
    text-align: left;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  
  .mission-brief::before {
    content: 'INCOMING TRANSMISSION';
    position: absolute;
    top: -10px;
    left: 10px;
    background: var(--bg-color);
    padding: 0 8px;
    font-family: var(--font-hud);
    font-size: 0.65rem;
    color: var(--primary);
    border: 1px solid var(--primary-dim);
  }

  .mission-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #b0c4de;
  }
  .mission-text strong { color: #fff; }

  /* Start Button */
  .start-btn-container {
    position: relative;
    z-index: 10;
    /* Push button down slightly to avoid orbital ring intersection */
    margin-top: 20px; 
  }

  .start-btn {
    background: rgba(0, 243, 255, 0.1); /* Semi-transparent background */
    backdrop-filter: blur(8px); /* Blur the line behind it */
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 18px 70px;
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
  }

  .start-btn:hover {
    background: var(--primary);
    color: #000;
    box-shadow: 0 0 40px var(--primary);
    transform: scale(1.02);
  }

  /* --- FOOTER / UPGRADES --- */
  .footer-panel {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 25px;
    padding-top: 20px;
    background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
  }

  /* Tech Module Cards */
  .upgrade-card {
    width: 160px;
    height: 110px;
    background: rgba(15, 20, 30, 0.7);
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    padding: 12px;
    /* Tech shape */
    clip-path: polygon(0 0, 100% 0, 100% 85%, 90% 100%, 0 100%);
  }

  .upgrade-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 3px;
    background: var(--card-accent);
    box-shadow: 0 -2px 10px var(--card-accent);
  }

  .upgrade-card:hover {
    transform: translateY(-5px);
    background: rgba(20, 30, 40, 0.9);
    border-color: var(--card-accent);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
  }

  .card-icon {
    width: 20px;
    height: 20px;
    fill: var(--card-accent);
  }

  .card-stats {
    font-family: var(--font-hud);
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-level {
    color: var(--card-accent);
    font-weight: bold;
  }

  /* Specific Card Colors */
  .card-damage { --card-accent: var(--primary); }
  .card-rate { --card-accent: var(--primary); }
  .card-speed { --card-accent: var(--secondary); } /* Secondary accent for Speed */

</style>
</head>
<body>

<!-- Background Canvas -->
<div id="scene-container">
  <canvas id="bgCanvas"></canvas>
</div>

<!-- Overlays -->
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- Main UI -->
<div class="ui-layer">
  
  <!-- HUD Header -->
  <header class="hud-header">
    <!-- Left: Wave -->
    <div class="hud-item">
      <span class="hud-label">Current Wave</span>
      <span class="hud-value">04 <span style="font-size:0.6em; color:#666">/ 12</span></span>
    </div>

    <!-- Center: HP Indicator (Requested) -->
    <div class="hp-container">
      <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:4px;">
        <span class="hud-label" style="margin:0;">Planet Integrity</span>
        <span class="hud-value" style="font-size:0.9rem; color:var(--primary);">85%</span>
      </div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill"></div>
      </div>
    </div>

    <!-- Right: Credits -->
    <div class="hud-item" style="align-items: flex-end;">
      <span class="hud-label">Credits</span>
      <span class="hud-value" style="color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.3);">2,450</span>
    </div>
  </header>

  <!-- Center Content -->
  <main class="center-stage">
    <h1 class="game-title">PLANET DEFENSE</h1>
    
    <div class="mission-brief">
      <p class="mission-text">
        <strong>COMMANDER:</strong> Orbital grid synchronization complete. 
        Hostile signatures detected in Sector 7. 
        Upgrade turret systems immediately.
        <br><br>
        <span style="color:var(--secondary); font-family:var(--font-hud); font-size:0.8em;">> AWAITING INPUT...</span>
      </p>
    </div>

    <div class="start-btn-container">
      <button class="start-btn">INITIALIZE DEFENSE</button>
    </div>
  </main>

  <!-- Footer / Upgrades -->
  <footer class="footer-panel">
    
    <!-- 1. Damage (Cyan) -->
    <div class="upgrade-card card-damage">
      <div class="card-header">
        <span class="card-title">DAMAGE</span>
        <!-- Lightning Icon -->
        <svg class="card-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="card-stats">
        <span>MOD: MK-IV</span>
        <span class="card-level">LVL 3</span>
      </div>
    </div>

    <!-- 2. Fire Rate (Cyan) -->
    <div class="upgrade-card card-rate">
      <div class="card-header">
        <span class="card-title">FIRE RATE</span>
        <!-- Clock/Speed Icon -->
        <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      </div>
      <div class="card-stats">
        <span>120 RPM</span>
        <span class="card-level">LVL 1</span>
      </div>
    </div>

    <!-- 3. Speed (Orange/Amber - Requested Change) -->
    <div class="upgrade-card card-speed">
      <div class="card-header">
        <span class="card-title">PROJ. SPEED</span>
        <!-- Rocket/Arrow Icon -->
        <svg class="card-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      </div>
      <div class="card-stats">
        <span>VELOCITY</span>
        <span class="card-level">LVL 5</span>
      </div>
    </div>

  </footer>
</div>

<script>
/**
 * VISUAL ENGINE
 * Creates a stylized planet with wireframe grid and orbital rings.
 */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let stars = [];
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  // Center planet slightly lower to balance the top-heavy text
  cy = height / 2 + 80; 
  initStars();
}

function initStars() {
  stars = [];
  const numStars = 150;
  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      alpha: Math.random(),
      speed: Math.random() * 0.2 + 0.05
    });
  }
}

function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    // Twinkle effect
    const flicker = 0.5 + 0.5 * Math.sin(time * 0.05 + star.x);
    ctx.globalAlpha = star.alpha * flicker;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Move slowly
    star.y += star.speed;
    if (star.y > height) {
      star.y = 0;
      star.x = Math.random() * width;
    }
  });
  ctx.globalAlpha = 1.0;
}

function drawPlanet() {
  const radius = Math.min(width, height) * 0.35;
  
  // 1. Atmospheric Glow (Stronger gradient)
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius * 1.3);
  glow.addColorStop(0, 'rgba(0, 243, 255, 0.2)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.3, 0, Math.PI * 2);
  ctx.fill();

  // 2. The Planet Body (Dark, distinct from stars)
  const planetGrad = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, radius * 0.1, cx, cy, radius);
  planetGrad.addColorStop(0, '#1a2530'); // Lighter core
  planetGrad.addColorStop(0.4, '#0d1117'); // Mid
  planetGrad.addColorStop(1, '#000000'); // Edge
  
  ctx.fillStyle = planetGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  // 3. Wireframe Overlay (Tech feel)
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.clip();

  ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
  ctx.lineWidth = 1;
  
  // Longitudes
  for(let i=1; i<=4; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, radius * (i/5), radius, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Latitudes (rotated slightly for 3D effect)
  for(let i=-3; i<=3; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - radius, cy + i * (radius/3.5));
    ctx.lineTo(cx + radius, cy + i * (radius/3.5));
    ctx.stroke();
  }
  ctx.restore();

  // 4. Orbital Ring
  // We draw the back part of the ring first
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 6); // Tilt
  
  const ringW = radius * 2.2;
  const ringH = radius * 0.4;

  // Back half of ring
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, ringW, ringH, 0, 0, Math.PI); 
  ctx.stroke();

  // Front half of ring (drawn after planet body to appear in front)
  // Wait, we haven't drawn the front half yet.
  // We need to draw: Stars -> Back Ring -> Planet -> Front Ring
  
  // Let's restructure the draw order logic in the main loop or just draw here carefully.
  // Since we are inside drawPlanet, we can't easily split layers without clearing or multiple passes.
  // However, for a 2D canvas, we just draw.
  // The planet body is drawn. Now we draw the front ring.
  
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.8)';
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(0, 243, 255, 0.6)';
  
  ctx.beginPath();
  ctx.ellipse(0, 0, ringW, ringH, 0, 0, Math.PI); // Bottom half
  ctx.stroke();
  
  // Satellite on ring
  const satAngle = time * 0.015;
  const satX = Math.cos(satAngle) * ringW;
  const satY = Math.sin(satAngle) * ringH;
  
  // Only draw if on front half (0 to PI)
  if (satAngle % (Math.PI*2) > 0 && satAngle % (Math.PI*2) < Math.PI) {
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(satX, satY, 4, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

// Main Loop
function animate() {
  ctx.clearRect(0, 0, width, height);
  
  time++;
  
  // 1. Stars
  drawStars();
  
  // 2. Back Orbital Ring (Needs to be behind planet)
  // We will duplicate the ring logic slightly to ensure layering
  // Actually, to keep code clean, let's just draw the ring in two parts.
  
  // Part A: Back Ring
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 6);
  const rW = Math.min(width, height) * 0.35 * 2.2;
  const rH = Math.min(width, height) * 0.35 * 0.4;
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, rW, rH, 0, 0, Math.PI); 
  ctx.stroke();
  ctx.restore();

  // 3. Planet
  drawPlanet();

  // Part B: Front Ring (Drawn over planet)
  // Note: drawPlanet() actually draws the ring inside it in the previous version. 
  // To fix the layering properly without rewriting drawPlanet, I'll rely on the 
  // fact that drawPlanet draws the planet body. 
  // Wait, in my refactor above, I put the ring logic INSIDE drawPlanet.
  // I need to move the Front Ring logic OUTSIDE or just accept the simple layering.
  // Let's fix it properly here:
  
  // Re-draw Front Ring here to ensure it's on top of the planet body drawn above
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 6);
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(0, 243, 255, 0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, rW, rH, 0, 0, Math.PI); 
  ctx.stroke();
  
  // Satellite
  const satAngle = time * 0.015;
  const satX = Math.cos(satAngle) * rW;
  const satY = Math.sin(satAngle) * rH;
  
  // Check if front side (0 to PI)
  const normalizedAngle = satAngle % (Math.PI * 2);
  if (normalizedAngle > 0 && normalizedAngle < Math.PI) {
     ctx.fillStyle = '#fff';
     ctx.beginPath();
     ctx.arc(satX, satY, 5, 0, Math.PI*2);
     ctx.fill();
  }
  ctx.restore();
  
  requestAnimationFrame(animate);
}

// Override drawPlanet to remove the ring logic from inside it to avoid double drawing
// We will strip the ring logic from the function definition above in the final output
// But for this specific block, I'll redefine drawPlanet cleanly.
function drawPlanetClean() {
  const radius = Math.min(width, height) * 0.35;
  
  // 1. Atmosphere Glow
  const glow = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius * 1.3);
  glow.addColorStop(0, 'rgba(0, 243, 255, 0.2)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 1.3, 0, Math.PI * 2);
  ctx.fill();

  // 2. Planet Body
  const planetGrad = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, radius * 0.1, cx, cy, radius);
  planetGrad.addColorStop(0, '#1a2530');
  planetGrad.addColorStop(0.4, '#0d1117');
  planetGrad.addColorStop(1, '#000000');
  
  ctx.fillStyle = planetGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  // 3. Wireframe
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.clip();

  ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
  ctx.lineWidth = 1;
  
  // Longitudes
  for(let i=1; i<=4; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, radius * (i/5), radius, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Latitudes
  for(let i=-3; i<=3; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - radius, cy + i * (radius/3.5));
    ctx.lineTo(cx + radius, cy + i * (radius/3.5));
    ctx.stroke();
  }
  ctx.restore();
}

// Corrected Loop
function loop() {
  ctx.clearRect(0, 0, width, height);
  time++;
  
  drawStars();
  
  // Back Ring
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 6);
  const rW = Math.min(width, height) * 0.35 * 2.2;
  const rH = Math.min(width, height) * 0.35 * 0.4;
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, rW, rH, 0, 0, Math.PI); 
  ctx.stroke();
  ctx.restore();

  // Planet
  drawPlanetClean();

  // Front Ring
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 6);
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
  ctx.lineWidth = 3;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(0, 243, 255, 0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, rW, rH, 0, 0, Math.PI); 
  ctx.stroke();
  
  // Satellite
  const satAngle = time * 0.015;
  const satX = Math.cos(satAngle) * rW;
  const satY = Math.sin(satAngle) * rH;
  const normalizedAngle = satAngle % (Math.PI * 2);
  if (normalizedAngle > 0 && normalizedAngle < Math.PI) {
     ctx.fillStyle = '#fff';
     ctx.beginPath();
     ctx.arc(satX, satY, 5, 0, Math.PI*2);
     ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
loop();
