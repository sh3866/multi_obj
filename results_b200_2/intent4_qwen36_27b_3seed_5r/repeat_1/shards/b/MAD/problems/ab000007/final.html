<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #020205;
    --bg-mid: #0a0a16;
    
    --neon-cyan: #00f0ff;
    --neon-purple: #d500ff;
    --neon-red: #ff2a5f;
    
    --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', Geneva, Verdana, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-ui);
    color: white;
    background: var(--bg-deep);
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* 2. Visual Hierarchy: Title as Watermark */
  .title-block {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0.08; /* Very subtle */
    pointer-events: none;
    width: 100%;
  }

  .title-block h1 {
    font-family: var(--font-display);
    font-size: 12vw;
    font-weight: 900;
    letter-spacing: -0.05em;
    margin: 0;
    color: #fff;
    text-transform: uppercase;
    line-height: 0.8;
    text-shadow: 0 0 80px rgba(0, 240, 255, 0.2);
  }

  /* HUD - Minimalist & Clean */
  .hud-panel {
    display: flex;
    gap: 3rem;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 1rem 2rem;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
    left: 2rem;
    top: 2rem;
  }

  .stat {
    display: flex;
    flex-direction: column;
  }

  .stat-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--neon-cyan);
    margin-bottom: 4px;
    opacity: 0.8;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    font-family: var(--font-display);
    letter-spacing: -0.02em;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }

  /* Footer - Button Position */
  footer {
    display: flex;
    justify-content: center; /* 3. Bottom Center */
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
    padding-bottom: 3rem;
  }

  /* 3. Elevate 'Collect' Button */
  .collect-btn {
    position: relative;
    width: 180px;
    height: 60px;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.05));
    border: 2px solid var(--neon-cyan); /* 5. Unified 2px stroke */
    border-radius: 30px; /* Pill shape */
    color: #fff;
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(5px);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1);
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Button Glare */
  .collect-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
  }

  .collect-btn:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.6);
    transform: translateY(-3px);
  }

  .collect-btn:hover::before {
    left: 100%;
  }

  .collect-btn:active {
    transform: scale(0.95);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10, 10, 20, 0.8);
    border: 1px solid var(--neon-purple);
    padding: 0.8rem 2rem;
    color: #fff;
    font-family: var(--font-ui);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border-radius: 4px;
    text-transform: uppercase;
    font-weight: 600;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background: var(--neon-purple);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--neon-purple);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

</style>
</head>
<body>

  <!-- Canvas Layer -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header>
      <!-- 2. Title Watermark -->
      <div class="title-block">
        <h1>Aether<br>Catch</h1>
      </div>

      <div class="hud-panel">
        <div class="stat">
          <span class="stat-label">Collected</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Net Energy</span>
          <span class="stat-value" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      Specimen Secured
    </div>

    <footer>
      <!-- 3. Elevated Button -->
      <button class="collect-btn" id="collectBtn">
        Collect
      </button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders organic creatures, a stylized player avatar, and atmospheric effects.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let time = 0;
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

// Palette
const PALETTE = {
  bg: '#020205',
  ui: '#00f0ff',
  wisp: '#ff2a5f',
  eye: '#d500ff',
  jelly: '#00f0ff',
  net: '#00f0ff'
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.01;
      this.size = Math.random() * 3 + 1;
    } else {
      // Ambient dust
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = (Math.random() - 0.5) * 0.2;
      this.life = 1.0;
      this.decay = Math.random() * 0.001;
      this.size = Math.random() * 1.5;
      this.alpha = Math.random() * 0.4;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life * (this.alpha || 1);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Base Creature Class
class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    // Drifting physics
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.wobbleOffset = Math.random() * 100;
    this.wobbleSpeed = Math.random() * 0.02 + 0.01;
    this.scale = Math.random() * 0.4 + 0.8; 
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
  }

  update() {
    // Drift
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.1;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.1;
    this.rotation += this.rotSpeed;

    // Bounce boundaries
    if (this.x < -100) this.x = width + 100;
    if (this.x > width + 100) this.x = -100;
    if (this.y < -100) this.y = height + 100;
    if (this.y > height + 100) this.y = -100;
  }
}

// 4. Refine Creatures: Organic Silhouettes
class EmberWisp extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    ctx.rotate(this.rotation);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.wisp;
    
    const pulse = 1 + Math.sin(time * 0.1) * 0.1;
    
    // 4. Organic Blob shape
    ctx.fillStyle = 'rgba(255, 42, 95, 0.6)';
    ctx.strokeStyle = PALETTE.wisp;
    ctx.lineWidth = 2; // Unified stroke
    
    ctx.beginPath();
    // Irregular blob path
    ctx.moveTo(0, -20 * pulse);
    ctx.bezierCurveTo(20, -20, 25, 0, 10, 20);
    ctx.bezierCurveTo(0, 35, -20, 20, -15, 5);
    ctx.bezierCurveTo(-10, -15, -5, -15, 0, -20 * pulse);
    ctx.fill();
    ctx.stroke();

    // Inner eye/core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(2, -2, 2, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class VoidEye extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    ctx.shadowBlur = 20;
    ctx.shadowColor = PALETTE.eye;
    
    // 4. Organic Blob Shape (Wireframe heavy)
    ctx.fillStyle = 'rgba(213, 0, 255, 0.15)';
    ctx.strokeStyle = PALETTE.eye;
    ctx.lineWidth = 2; // Unified stroke
    
    ctx.beginPath();
    const points = 8;
    for(let i=0; i<=points; i++) {
      const angle = (i / points) * Math.PI * 2;
      const r = 25 + Math.sin(angle * 3 + time * 0.05) * 5; // Wobbly radius
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Pupil Tracking
    const angle = Math.atan2(mouseY - this.y, mouseX - this.x);
    const dist = 6;
    const px = Math.cos(angle) * dist;
    const py = Math.sin(angle) * dist;

    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class AetherJelly extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.jelly;
    
    ctx.strokeStyle = PALETTE.jelly;
    ctx.lineWidth = 2; // Unified stroke
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 4. Jellyfish Dome (Organic)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.beginPath();
    ctx.arc(0, 0, 20, Math.PI, 0);
    ctx.bezierCurveTo(20, 15, -20, 15, -20, 0);
    ctx.fill();
    ctx.stroke();

    // Tentacles
    for(let i=-12; i<=12; i+=6) {
      ctx.beginPath();
      ctx.moveTo(i, 5);
      const offset = Math.sin(time * 0.1 + i) * 8;
      ctx.bezierCurveTo(i + offset, 25, i - offset, 45, i, 65);
      ctx.stroke();
    }

    // Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, -8, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// 1. Replace Central Reticle with Player Avatar
class PlayerAvatar {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 45; // Net radius
    this.rotation = 0;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.1;
    this.y += (mouseY - this.y) * 0.1;
    // Slight rotation based on movement for dynamic feel
    this.rotation = (mouseX - this.x) * 0.002;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // 2. Increase visual weight of Player Avatar
    
    // --- The Net (Behind body) ---
    ctx.shadowBlur = 20;
    ctx.shadowColor = PALETTE.net;
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 4; // Thicker for Player (4px vs 2px)
    
    // Outer Hoop
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI*2);
    ctx.stroke();

    // Inner Grid lines on Net
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.moveTo(0, -this.radius);
    ctx.lineTo(0, this.radius);
    ctx.moveTo(-this.radius, 0);
    ctx.lineTo(this.radius, 0);
    ctx.stroke();
    ctx.globalAlpha = 1.0;

    // --- The Player Body (Drone/Avatar) ---
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#fff';

    // Drone Shape (Diamond/Tech)
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4; // 4px stroke for Player

    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(12, 0);
    ctx.lineTo(0, 15);
    ctx.lineTo(-12, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Center Core Glow
    ctx.fillStyle = PALETTE.net;
    ctx.shadowColor = PALETTE.net;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const dustParticles = [];
const player = new PlayerAvatar();

// Initialize creatures
const types = [EmberWisp, VoidEye, AetherJelly];
for (let i = 0; i < 7; i++) {
  const Type = types[Math.floor(Math.random() * types.length)];
  creatures.push(new Type());
}

// Initialize Dust
for (let i = 0; i < 80; i++) {
  dustParticles.push(new Particle(Math.random() * width, Math.random() * height, '#ffffff', 'dust'));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - player.x;
    const dy = c.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Hitbox (Net Radius + Creature Buffer)
    if (dist < player.radius + 25) { 
      // Captured!
      let color = PALETTE.jelly;
      if (c instanceof VoidEye) color = PALETTE.eye;
      if (c instanceof EmberWisp) color = PALETTE.wisp;

      createExplosion(c.x, c.y, color);
      creatures.splice(i, 1);
      score++;
      
      // Update UI
      scoreEl.innerText = score < 10 ? '0' + score : score;
      
      caught = true;
      
      // Respawn
      setTimeout(() => {
        const Type = types[Math.floor(Math.random() * types.length)];
        creatures.push(new Type());
      }, 2000);
    }
  }

  if (caught) {
    showToast();
    // Visual feedback for success
    energyEl.style.color = PALETTE.net;
    setTimeout(() => {
      energyEl.style.color = '#fff';
    }, 300);
  } else {
    // Visual feedback for miss
    const btn = document.getElementById('collectBtn');
    btn.style.borderColor = 'var(--neon-red)';
    btn.style.boxShadow = '0 0 20px var(--neon-red)';
    btn.style.color = 'var(--neon-red)';
    setTimeout(() => {
      btn.style.borderColor = 'var(--neon-cyan)';
      btn.style.boxShadow = '0 0 20px rgba(0, 240, 255, 0.2)';
      btn.style.color = '#fff';
    }, 200);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Main Loop
function animate() {
  time++;
  
  // Clear Canvas
  ctx.clearRect(0, 0, width, height);

  // Draw Dust (Background Atmosphere)
  dustParticles.forEach(p => {
    p.update();
    if (p.life <= 0) {
      p.x = Math.random() * width;
      p.y = height + 10;
      p.life = 1;
    }
    p.draw(ctx);
  });

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Player (Visual Anchor)
  player.update();
  player.draw(ctx);

  // Update & Draw Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
