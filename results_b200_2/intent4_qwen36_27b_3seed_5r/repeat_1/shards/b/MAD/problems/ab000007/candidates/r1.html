<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #05050a;
    --accent-primary: #00f2ff;
    --accent-secondary: #bd00ff;
    --glass-bg: rgba(10, 15, 30, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-display: "Times New Roman", "Didot", serif;
    --font-mono: "Courier New", "Consolas", monospace;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-deep);
    overflow: hidden;
    font-family: var(--font-mono);
    color: white;
  }

  /* Background Atmosphere (CSS) */
  .nebula-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    background: 
      radial-gradient(circle at 20% 30%, rgba(20, 40, 80, 0.4) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(80, 10, 80, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(10, 20, 40, 0.8) 0%, transparent 80%);
    filter: blur(40px);
    animation: breathe 10s infinite alternate ease-in-out;
  }

  @keyframes breathe {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.1); opacity: 1; }
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header / HUD */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
    font-style: italic;
  }

  .title-block p {
    font-size: 0.7rem;
    color: var(--accent-primary);
    margin: 0.5rem 0 0 0;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .hud-panel {
    display: flex;
    gap: 2rem;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 1rem 2rem;
    border-radius: 4px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
  }

  /* Decorative corner accents for HUD */
  .hud-panel::before, .hud-panel::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    border: 1px solid var(--accent-primary);
    transition: all 0.3s ease;
  }
  .hud-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .hud-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px var(--accent-primary);
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 2rem;
  }

  /* Artifact Button */
  .artifact-btn {
    position: relative;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(5px);
    color: #fff;
    padding: 0;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .artifact-gem {
    width: 80px;
    height: 80px;
    border: 2px solid rgba(255,255,255,0.2);
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
    transition: all 0.4s ease;
    position: relative;
  }

  .artifact-gem::after {
    content: '';
    position: absolute;
    inset: -5px;
    border: 1px solid var(--accent-primary);
    opacity: 0.3;
    transform: rotate(0deg);
    transition: all 0.4s ease;
  }

  .artifact-icon {
    transform: rotate(-45deg);
    width: 24px;
    height: 24px;
    fill: var(--accent-primary);
    filter: drop-shadow(0 0 5px var(--accent-primary));
  }

  .artifact-label {
    margin-top: 12px;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-primary);
    opacity: 0.8;
  }

  .artifact-btn:hover {
    transform: translateY(-5px);
  }

  .artifact-btn:hover .artifact-gem {
    border-color: var(--accent-primary);
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
    background: rgba(0, 242, 255, 0.1);
  }
  
  .artifact-btn:hover .artifact-icon {
    fill: #fff;
    filter: drop-shadow(0 0 8px #fff);
  }

  .artifact-btn:active {
    transform: scale(0.95);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--accent-secondary);
    padding: 1rem 2.5rem;
    color: #fff;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-style: italic;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 40px rgba(189, 0, 255, 0.3);
    text-align: center;
    white-space: nowrap;
  }
  
  .toast span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--accent-secondary);
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

  <!-- CSS Background Layer -->
  <div class="nebula-layer"></div>

  <!-- Canvas Layer -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether Catch</h1>
        <p>Atmosphere: Stable</p>
      </div>
      <div class="hud-panel">
        <div class="stat">
          <span class="stat-label">Specimens</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Resonance</span>
          <span class="stat-value" id="energyVal">100</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      Specimen Secured
      <span>Added to collection</span>
    </div>

    <footer>
      <button class="artifact-btn" id="collectBtn">
        <div class="artifact-gem">
          <!-- Simple SVG Icon for the gem -->
          <svg class="artifact-icon" viewBox="0 0 24 24">
            <path d="M12 2L2 12l10 10 10-10L12 2zm0 3.415L18.585 12 12 18.585 5.415 12 12 5.415z"/>
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>
        <span class="artifact-label">Collect</span>
      </button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders stylized SVG-like creatures, a magical net, and atmospheric particles.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let time = 0;
let energy = 100;

// Colors
const PALETTE = {
  creature1: '#00f2ff', // Cyan
  creature2: '#bd00ff', // Purple
  creature3: '#ff0055', // Pink
  net: '#ffffff'
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 3 + 1;
    } else {
      // Ambient dust
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = -Math.random() * 0.5 - 0.1;
      this.life = 1.0;
      this.decay = Math.random() * 0.005;
      this.size = Math.random() * 2;
      this.alpha = Math.random() * 0.5;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life * (this.alpha || 1);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Base Creature Class
class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    // Drift
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.wobbleOffset = Math.random() * 100;
    this.wobbleSpeed = Math.random() * 0.05 + 0.02;
    this.scale = Math.random() * 0.5 + 0.8;
  }

  update() {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.2;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.2;

    // Bounce
    if (this.x < -50) this.x = width + 50;
    if (this.x > width + 50) this.x = -50;
    if (this.y < -50) this.y = height + 50;
    if (this.y > height + 50) this.y = -50;
  }
}

// 1. The Jellyfish (Cyan)
class Jellyfish extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.creature1;
    ctx.strokeStyle = PALETTE.creature1;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    // Dome
    ctx.beginPath();
    ctx.arc(0, 0, 20, Math.PI, 0);
    ctx.stroke();

    // Tentacles
    for(let i=-15; i<=15; i+=10) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.quadraticCurveTo(i + Math.sin(time*0.1)*5, 20, i, 40);
      ctx.stroke();
    }

    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -5, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// 2. The Geometric Spirit (Purple)
class Spirit extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    ctx.shadowBlur = 20;
    ctx.shadowColor = PALETTE.creature2;
    ctx.fillStyle = 'rgba(189, 0, 255, 0.2)';
    ctx.strokeStyle = PALETTE.creature2;
    ctx.lineWidth = 2;

    const rot = time * 0.02;
    ctx.rotate(rot);
    
    // Outer Diamond
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.lineTo(20, 0);
    ctx.lineTo(0, 25);
    ctx.lineTo(-20, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner Square
    ctx.rotate(-rot * 2); // Counter rotate
    ctx.beginPath();
    ctx.rect(-10, -10, 20, 20);
    ctx.stroke();

    ctx.restore();
  }
}

// 3. The Wisp (Pink)
class Wisp extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    ctx.shadowBlur = 25;
    ctx.shadowColor = PALETTE.creature3;
    
    const pulse = 1 + Math.sin(time * 0.1) * 0.2;
    
    // Flame shape
    ctx.fillStyle = PALETTE.creature3;
    ctx.beginPath();
    ctx.moveTo(0, -20 * pulse);
    ctx.bezierCurveTo(15, -10, 15, 10, 0, 25);
    ctx.bezierCurveTo(-15, 10, -15, -10, 0, -20 * pulse);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -5, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 40;
    this.active = false;
    this.rotation = 0;
  }

  update(mouseX, mouseY) {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.rotation += 0.02;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    ctx.shadowBlur = 10;
    ctx.shadowColor = PALETTE.net;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 2;

    // Outer dashed ring
    ctx.setLineDash([10, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner solid ring
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius - 10, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshair lines
    ctx.beginPath();
    ctx.moveTo(-this.radius - 10, 0);
    ctx.lineTo(-this.radius + 5, 0);
    ctx.moveTo(this.radius + 10, 0);
    ctx.lineTo(this.radius - 5, 0);
    ctx.moveTo(0, -this.radius - 10);
    ctx.lineTo(0, -this.radius + 5);
    ctx.moveTo(0, this.radius + 10);
    ctx.lineTo(0, this.radius - 5);
    ctx.stroke();

    // Center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const dustParticles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize creatures
const types = [Jellyfish, Spirit, Wisp];
for (let i = 0; i < 6; i++) {
  const Type = types[Math.floor(Math.random() * types.length)];
  creatures.push(new Type());
}

// Initialize Dust
for (let i = 0; i < 50; i++) {
  dustParticles.push(new Particle(Math.random() * width, Math.random() * height, '#ffffff', 'dust'));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// Touch support
window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < net.radius + 20) { // 20 is approx creature radius
      // Captured!
      createExplosion(c.x, c.y, c instanceof Jellyfish ? PALETTE.creature1 : (c instanceof Spirit ? PALETTE.creature2 : PALETTE.creature3));
      creatures.splice(i, 1);
      score++;
      
      // Update UI
      scoreEl.innerText = score < 10 ? '0' + score : score;
      
      caught = true;
      
      // Respawn
      setTimeout(() => {
        const Type = types[Math.floor(Math.random() * types.length)];
        creatures.push(new Type());
      }, 1500);
    }
  }

  if (caught) {
    showToast();
    // Flash Energy
    energyEl.innerText = "MAX";
    setTimeout(() => energyEl.innerText = "100", 500);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Main Loop
function animate() {
  time++;
  
  // Clear Canvas
  ctx.clearRect(0, 0, width, height);

  // Draw Dust (Background)
  dustParticles.forEach(p => {
    p.update();
    if (p.life <= 0) {
      p.x = Math.random() * width;
      p.y = height + 10;
      p.life = 1;
    }
    p.draw(ctx);
  });

  // Draw Connection Lines (Constellation effect)
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for(let i=0; i<creatures.length; i++) {
    for(let j=i+1; j<creatures.length; j++) {
      const d = Math.hypot(creatures[i].x - creatures[j].x, creatures[i].y - creatures[j].y);
      if (d < 200) {
        ctx.beginPath();
        ctx.moveTo(creatures[i].x, creatures[i].y);
        ctx.lineTo(creatures[j].x, creatures[j].y);
        ctx.stroke();
      }
    }
  }

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Update & Draw Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
