<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-gradient: linear-gradient(135deg, #020205 0%, #0a0a20 50%, #120520 100%);
    --ui-color: #00f2ff;
    --magic-pink: #ff0055;
    --magic-purple: #bd00ff;
    --glass-bg: rgba(10, 15, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --font-display: "Times New Roman", "Didot", serif;
    --font-mono: "Courier New", "Consolas", monospace;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-deep);
    background-image: var(--bg-gradient);
    overflow: hidden;
    font-family: var(--font-mono);
    color: white;
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header / HUD - Glassmorphism & Sharp Geometry */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
    font-style: italic;
  }

  .title-block p {
    font-size: 0.65rem;
    color: var(--ui-color);
    margin: 0.5rem 0 0 0;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .hud-panel {
    display: flex;
    gap: 2.5rem;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 0.8rem 2rem;
    /* Sharp geometric corners */
    clip-path: polygon(
      10px 0, 100% 0, 
      100% calc(100% - 10px), calc(100% - 10px) 100%, 
      0 100%, 0 10px
    );
    border: 1px solid var(--glass-border);
    border-left: 2px solid var(--ui-color);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px var(--ui-color);
    font-family: var(--font-mono);
    line-height: 1;
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 2rem;
    position: relative;
  }

  /* Connected Collect Button */
  .control-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* The connecting line visual */
  .control-tether {
    width: 2px;
    height: 0;
    background: linear-gradient(to top, var(--ui-color), transparent);
    opacity: 0.5;
    transition: height 0.3s ease;
    margin-bottom: -5px; /* connect to button */
    z-index: 0;
  }

  .artifact-btn {
    position: relative;
    background: rgba(0, 20, 30, 0.8);
    backdrop-filter: blur(4px);
    color: var(--ui-color);
    border: 1px solid var(--ui-color);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 2;
    /* Sharp diamond shape */
    width: 80px;
    height: 80px;
    transform: rotate(45deg);
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);
  }

  .artifact-btn * {
    transform: rotate(-45deg); /* Counter rotate content */
  }

  .artifact-icon {
    width: 24px;
    height: 24px;
    fill: var(--ui-color);
    filter: drop-shadow(0 0 5px var(--ui-color));
    transition: all 0.3s ease;
  }

  .artifact-label {
    position: absolute;
    bottom: -25px;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ui-color);
    opacity: 0.8;
    font-weight: bold;
    text-shadow: 0 0 5px var(--ui-color);
  }

  .artifact-btn:hover {
    background: rgba(0, 242, 255, 0.1);
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
    transform: rotate(45deg) scale(1.1);
  }
  
  .artifact-btn:hover + .control-tether {
    height: 40px;
    opacity: 1;
  }

  .artifact-btn:active {
    transform: rotate(45deg) scale(0.95);
    background: rgba(0, 242, 255, 0.3);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(10, 10, 20, 0.9);
    border: 1px solid var(--magic-purple);
    padding: 1rem 2.5rem;
    color: #fff;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-style: italic;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 50px rgba(189, 0, 255, 0.2);
    text-align: center;
    white-space: nowrap;
    z-index: 20;
  }
  
  .toast span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--magic-pink);
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

  <!-- Canvas Layer -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether Catch</h1>
        <p>Atmosphere: Stable</p>
      </div>
      <div class="hud-panel">
        <div class="stat">
          <span class="stat-label">Specimens</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Resonance</span>
          <span class="stat-value" id="energyVal">100</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      Specimen Secured
      <span>Added to collection</span>
    </div>

    <footer>
      <div class="control-container">
        <div class="control-tether"></div>
        <button class="artifact-btn" id="collectBtn">
          <!-- Simple SVG Icon for the gem -->
          <svg class="artifact-icon" viewBox="0 0 24 24">
            <path d="M12 2L2 12l10 10 10-10L12 2zm0 3.415L18.585 12 12 18.585 5.415 12 12 5.415z"/>
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span class="artifact-label">Collect</span>
        </button>
      </div>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders stylized SVG-like creatures, a magical net, and atmospheric particles.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let time = 0;
let energy = 100;

// Colors
const PALETTE = {
  ui: '#00f2ff',
  creature1: '#00f2ff', // Cyan
  creature2: '#bd00ff', // Purple
  creature3: '#ff0055', // Pink
  net: '#00f2ff'
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.01;
      this.size = Math.random() * 4 + 1;
    } else {
      // Ambient dust
      this.vx = (Math.random() - 0.5) * 0.1;
      this.vy = (Math.random() - 0.5) * 0.1;
      this.life = 1.0;
      this.decay = Math.random() * 0.002;
      this.size = Math.random() * 1.5;
      this.alpha = Math.random() * 0.4;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life * (this.alpha || 1);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Base Creature Class
class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    // Drift
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.wobbleOffset = Math.random() * 100;
    this.wobbleSpeed = Math.random() * 0.03 + 0.01;
    this.scale = Math.random() * 0.5 + 1.2; // Increased scale
  }

  update() {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.3;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.3;

    // Bounce
    if (this.x < -100) this.x = width + 100;
    if (this.x > width + 100) this.x = -100;
    if (this.y < -100) this.y = height + 100;
    if (this.y > height + 100) this.y = -100;
  }
}

// 1. The Jellyfish (Cyan)
class Jellyfish extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Strong outer glow
    ctx.shadowBlur = 40;
    ctx.shadowColor = PALETTE.creature1;
    
    ctx.strokeStyle = PALETTE.creature1;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    // Dome (Organic)
    ctx.beginPath();
    ctx.arc(0, 0, 25, Math.PI, 0);
    ctx.stroke();

    // Tentacles (Flowing)
    for(let i=-20; i<=20; i+=10) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.bezierCurveTo(i + Math.sin(time*0.1)*10, 20, i - Math.sin(time*0.1)*10, 40, i, 60);
      ctx.stroke();
    }

    // Inner Core (Brightest point)
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, -8, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// 2. The Geometric Spirit (Purple) - Organic Flow
class Spirit extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Strong outer glow
    ctx.shadowBlur = 45;
    ctx.shadowColor = PALETTE.creature2;
    
    ctx.fillStyle = 'rgba(189, 0, 255, 0.3)';
    ctx.strokeStyle = PALETTE.creature2;
    ctx.lineWidth = 3;

    const rot = time * 0.02;
    ctx.rotate(rot);
    
    // Flowing shape (Teardrop-ish)
    ctx.beginPath();
    ctx.moveTo(0, -30);
    ctx.bezierCurveTo(25, -10, 25, 20, 0, 30);
    ctx.bezierCurveTo(-25, 20, -25, -10, 0, -30);
    ctx.fill();
    ctx.stroke();

    // Inner detail
    ctx.rotate(-rot * 2); 
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}

// 3. The Wisp (Pink)
class Wisp extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Strong outer glow
    ctx.shadowBlur = 50;
    ctx.shadowColor = PALETTE.creature3;
    
    const pulse = 1 + Math.sin(time * 0.15) * 0.15;
    
    // Flame shape (Organic)
    ctx.fillStyle = PALETTE.creature3;
    ctx.beginPath();
    ctx.moveTo(0, -30 * pulse);
    ctx.bezierCurveTo(20, -15, 20, 15, 0, 35);
    ctx.bezierCurveTo(-20, 15, -20, -15, 0, -30 * pulse);
    ctx.fill();

    // Eye (Bright)
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(0, -8, 5, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 50;
    this.active = false;
    this.rotation = 0;
  }

  update(mouseX, mouseY) {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.rotation += 0.015;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // Tone down brightness, match UI color
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.net;
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.6)'; // Cyan, 60% opacity
    ctx.lineWidth = 2;

    // Sharp Geometry (Squares/Diamonds)
    
    // Outer dashed square
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
    ctx.stroke();

    // Inner solid diamond
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)'; // Lower opacity
    ctx.beginPath();
    ctx.moveTo(0, -this.radius * 0.6);
    ctx.lineTo(this.radius * 0.6, 0);
    ctx.lineTo(0, this.radius * 0.6);
    ctx.lineTo(-this.radius * 0.6, 0);
    ctx.closePath();
    ctx.stroke();

    // Crosshair lines (Sharp)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.beginPath();
    ctx.moveTo(-this.radius - 15, 0);
    ctx.lineTo(-this.radius + 5, 0);
    ctx.moveTo(this.radius + 15, 0);
    ctx.lineTo(this.radius - 5, 0);
    ctx.moveTo(0, -this.radius - 15);
    ctx.lineTo(0, -this.radius + 5);
    ctx.moveTo(0, this.radius + 15);
    ctx.lineTo(0, this.radius - 5);
    ctx.stroke();

    // Center dot (Sharp)
    ctx.fillStyle = PALETTE.net;
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI*2);
    ctx.fill();

    // Mesh overlay (Subtle)
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = PALETTE.net;
    ctx.beginPath();
    ctx.rect(-this.radius * 0.6, -this.radius * 0.6, this.radius * 1.2, this.radius * 1.2);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const dustParticles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize creatures
const types = [Jellyfish, Spirit, Wisp];
for (let i = 0; i < 5; i++) {
  const Type = types[Math.floor(Math.random() * types.length)];
  creatures.push(new Type());
}

// Initialize Dust
for (let i = 0; i < 60; i++) {
  dustParticles.push(new Particle(Math.random() * width, Math.random() * height, '#ffffff', 'dust'));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// Touch support
window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Hitbox adjusted for the square net
    if (dist < net.radius + 30) { 
      // Captured!
      let color = PALETTE.creature1;
      if (c instanceof Spirit) color = PALETTE.creature2;
      if (c instanceof Wisp) color = PALETTE.creature3;

      createExplosion(c.x, c.y, color);
      creatures.splice(i, 1);
      score++;
      
      // Update UI
      scoreEl.innerText = score < 10 ? '0' + score : score;
      
      caught = true;
      
      // Respawn
      setTimeout(() => {
        const Type = types[Math.floor(Math.random() * types.length)];
        creatures.push(new Type());
      }, 1500);
    }
  }

  if (caught) {
    showToast();
    // Flash Energy
    energyEl.innerText = "MAX";
    energyEl.style.color = "#fff";
    setTimeout(() => {
      energyEl.innerText = "100";
      energyEl.style.color = "#fff";
    }, 500);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Main Loop
function animate() {
  time++;
  
  // Clear Canvas
  ctx.clearRect(0, 0, width, height);

  // Draw Dust (Background)
  dustParticles.forEach(p => {
    p.update();
    if (p.life <= 0) {
      p.x = Math.random() * width;
      p.y = height + 10;
      p.life = 1;
    }
    p.draw(ctx);
  });

  // Draw Connection Lines (Constellation effect) - Very subtle
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for(let i=0; i<creatures.length; i++) {
    for(let j=i+1; j<creatures.length; j++) {
      const d = Math.hypot(creatures[i].x - creatures[j].x, creatures[i].y - creatures[j].y);
      if (d < 250) {
        ctx.beginPath();
        ctx.moveTo(creatures[i].x, creatures[i].y);
        ctx.lineTo(creatures[j].x, creatures[j].y);
        ctx.stroke();
      }
    }
  }

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Update & Draw Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
