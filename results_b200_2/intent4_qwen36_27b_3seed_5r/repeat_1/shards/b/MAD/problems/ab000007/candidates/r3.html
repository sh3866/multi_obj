<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #020205;
    --bg-mid: #0a0a1a;
    --bg-light: #120824;
    
    --neon-cyan: #00f2ff;
    --neon-purple: #bd00ff;
    --neon-red: #ff0055;
    
    --ui-glass: rgba(10, 15, 30, 0.6);
    --ui-border: 2px solid rgba(0, 242, 255, 0.3);
    --ui-border-active: 2px solid var(--neon-cyan);
    
    --font-system: system-ui, -apple-system, sans-serif;
    --font-display: "Times New Roman", "Didot", serif;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-system);
    color: white;
    background: radial-gradient(circle at 50% 50%, var(--bg-light), var(--bg-deep));
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
    font-style: italic;
  }

  .title-block p {
    font-size: 0.7rem;
    color: var(--neon-cyan);
    margin: 0.5rem 0 0 0;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* HUD - Tech-Magical Overlay */
  .hud-panel {
    display: flex;
    gap: 3rem;
    background: var(--ui-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 1rem 2rem;
    border-radius: 12px;
    border: var(--ui-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: border-color 0.3s ease;
  }

  .hud-panel:hover {
    border-color: var(--neon-cyan);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.6);
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-cyan);
    font-family: var(--font-system);
    line-height: 1;
  }

  /* Footer */
  footer {
    display: flex;
    justify-content: flex-start; /* Bottom Left */
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
    padding-bottom: 2rem;
  }

  /* Collection Button - Crystalline Diamond */
  .control-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .artifact-btn {
    position: relative;
    background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(0, 50, 80, 0.8));
    backdrop-filter: blur(4px);
    color: var(--neon-cyan);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 2;
    
    /* Diamond Shape */
    width: 100px;
    height: 100px;
    transform: rotate(45deg);
    border: 2px solid var(--neon-cyan);
    border-radius: 4px; /* Slight roundness on corners */
    box-shadow: 0 10px 40px rgba(0, 242, 255, 0.2), inset 0 0 20px rgba(0, 242, 255, 0.1);
  }

  .artifact-btn * {
    transform: rotate(-45deg); /* Counter rotate content */
  }

  .artifact-icon {
    width: 28px;
    height: 28px;
    fill: var(--neon-cyan);
    filter: drop-shadow(0 0 5px var(--neon-cyan));
    transition: all 0.3s ease;
    margin-bottom: 4px;
  }

  .artifact-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 5px var(--neon-cyan);
  }

  .artifact-btn:hover {
    background: linear-gradient(135deg, rgba(0, 242, 255, 0.3), rgba(0, 100, 150, 0.9));
    box-shadow: 0 0 50px rgba(0, 242, 255, 0.6), inset 0 0 30px rgba(0, 242, 255, 0.3);
    transform: rotate(45deg) scale(1.1);
    border-color: #fff;
  }

  .artifact-btn:active {
    transform: rotate(45deg) scale(0.95);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 10, 0.95);
    border: 1px solid var(--neon-purple);
    padding: 1.2rem 3rem;
    color: #fff;
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-style: italic;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 60px rgba(189, 0, 255, 0.3);
    text-align: center;
    white-space: nowrap;
    z-index: 20;
  }
  
  .toast span {
    display: block;
    font-family: var(--font-system);
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--neon-red);
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

  <!-- Canvas Layer -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether Catch</h1>
        <p>Atmosphere: Stable</p>
      </div>
      <div class="hud-panel">
        <div class="stat">
          <span class="stat-label">Specimens</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Resonance</span>
          <span class="stat-value" id="energyVal">100</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      Specimen Secured
      <span>Added to collection</span>
    </div>

    <footer>
      <div class="control-container">
        <button class="artifact-btn" id="collectBtn">
          <!-- SVG Icon for the gem -->
          <svg class="artifact-icon" viewBox="0 0 24 24">
            <path d="M12 2L2 12l10 10 10-10L12 2zm0 3.415L18.585 12 12 18.585 5.415 12 12 5.415z"/>
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span class="artifact-label">Collect</span>
        </button>
      </div>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders stylized creatures, an energy net, and atmospheric particles.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let time = 0;
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

// Colors
const PALETTE = {
  ui: '#00f2ff',
  wisp: '#ff0055',
  eye: '#bd00ff',
  jelly: '#00f2ff',
  net: '#00f2ff'
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.01;
      this.size = Math.random() * 4 + 1;
    } else {
      // Ambient dust
      this.vx = (Math.random() - 0.5) * 0.15;
      this.vy = (Math.random() - 0.5) * 0.15;
      this.life = 1.0;
      this.decay = Math.random() * 0.002;
      this.size = Math.random() * 2;
      this.alpha = Math.random() * 0.5;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life * (this.alpha || 1);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Base Creature Class
class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.wobbleOffset = Math.random() * 100;
    this.wobbleSpeed = Math.random() * 0.03 + 0.01;
    this.scale = Math.random() * 0.4 + 1.0; 
    this.baseY = this.y;
  }

  update() {
    // Drift
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.2;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.2;

    // Bounce
    if (this.x < -100) this.x = width + 100;
    if (this.x > width + 100) this.x = -100;
    if (this.y < -100) this.y = height + 100;
    if (this.y > height + 100) this.y = -100;
  }
}

// 1. Ember Wisp (Red)
class EmberWisp extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Bioluminescent Glow
    ctx.shadowBlur = 25;
    ctx.shadowColor = PALETTE.wisp;
    
    const pulse = 1 + Math.sin(time * 0.1) * 0.1;
    
    // Teardrop Shape
    ctx.fillStyle = PALETTE.wisp;
    ctx.beginPath();
    ctx.moveTo(0, -20 * pulse);
    ctx.bezierCurveTo(15, -10, 15, 15, 0, 30);
    ctx.bezierCurveTo(-15, 15, -15, -10, 0, -20 * pulse);
    ctx.fill();

    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(0, -5, 3, 0, Math.PI*2);
    ctx.fill();

    // Trailing Tail
    ctx.shadowBlur = 0;
    ctx.strokeStyle = PALETTE.wisp;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 30);
    ctx.bezierCurveTo(Math.sin(time*0.1)*10, 50, -Math.sin(time*0.1)*10, 70, 0, 90);
    ctx.stroke();

    ctx.restore();
  }
}

// 2. Void Eye (Purple)
class VoidEye extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Bioluminescent Glow
    ctx.shadowBlur = 25;
    ctx.shadowColor = PALETTE.eye;
    
    // Organic Blob Shape
    ctx.fillStyle = 'rgba(189, 0, 255, 0.2)';
    ctx.strokeStyle = PALETTE.eye;
    ctx.lineWidth = 3;
    
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.bezierCurveTo(20, -35, 40, -10, 30, 15);
    ctx.bezierCurveTo(20, 40, -20, 40, -30, 15);
    ctx.bezierCurveTo(-40, -10, -20, -35, 0, -25);
    ctx.fill();
    ctx.stroke();

    // Pupil Tracking
    const angle = Math.atan2(mouseY - this.y, mouseX - this.x);
    const dist = Math.min(8, Math.hypot(mouseX - this.x, mouseY - this.y) * 0.05);
    const px = Math.cos(angle) * dist;
    const py = Math.sin(angle) * dist;

    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI*2);
    ctx.fill();

    // Pupil dot
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// 3. Aether Jelly (Cyan)
class AetherJelly extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Bioluminescent Glow
    ctx.shadowBlur = 30;
    ctx.shadowColor = PALETTE.jelly;
    
    ctx.strokeStyle = PALETTE.jelly;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    // Dome
    ctx.beginPath();
    ctx.arc(0, 0, 25, Math.PI, 0);
    ctx.stroke();

    // Tentacles
    for(let i=-15; i<=15; i+=10) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      const offset = Math.sin(time * 0.1 + i) * 10;
      ctx.bezierCurveTo(i + offset, 20, i - offset, 40, i, 60);
      ctx.stroke();
    }

    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, -8, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 50;
    this.rotation = 0;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.rotation += 0.01;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.net;
    
    // Mesh Grid Effect
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.lineWidth = 1;
    
    // Draw a web pattern
    const steps = 4;
    for(let i=1; i<=steps; i++) {
        const r = (this.radius / steps) * i;
        ctx.beginPath();
        // Square
        ctx.rect(-r, -r, r*2, r*2);
        ctx.stroke();
    }

    // Diagonals
    ctx.beginPath();
    ctx.moveTo(-this.radius, -this.radius);
    ctx.lineTo(this.radius, this.radius);
    ctx.moveTo(this.radius, -this.radius);
    ctx.lineTo(-this.radius, this.radius);
    ctx.stroke();

    // Outer Border (Strong)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(-this.radius, -this.radius, this.radius*2, this.radius*2);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = PALETTE.net;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const dustParticles = [];
const net = new Net();

// Initialize creatures
const types = [EmberWisp, VoidEye, AetherJelly];
for (let i = 0; i < 6; i++) {
  const Type = types[Math.floor(Math.random() * types.length)];
  creatures.push(new Type());
}

// Initialize Dust
for (let i = 0; i < 80; i++) {
  dustParticles.push(new Particle(Math.random() * width, Math.random() * height, '#ffffff', 'dust'));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Hitbox
    if (dist < net.radius + 20) { 
      // Captured!
      let color = PALETTE.jelly;
      if (c instanceof VoidEye) color = PALETTE.eye;
      if (c instanceof EmberWisp) color = PALETTE.wisp;

      createExplosion(c.x, c.y, color);
      creatures.splice(i, 1);
      score++;
      
      // Update UI
      scoreEl.innerText = score < 10 ? '0' + score : score;
      
      caught = true;
      
      // Respawn
      setTimeout(() => {
        const Type = types[Math.floor(Math.random() * types.length)];
        creatures.push(new Type());
      }, 1500);
    }
  }

  if (caught) {
    showToast();
    // Flash Energy
    energyEl.innerText = "MAX";
    energyEl.style.color = "#fff";
    setTimeout(() => {
      energyEl.innerText = "100";
      energyEl.style.color = "#fff";
    }, 500);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Main Loop
function animate() {
  time++;
  
  // Clear Canvas
  ctx.clearRect(0, 0, width, height);

  // Draw Dust (Background)
  dustParticles.forEach(p => {
    p.update();
    if (p.life <= 0) {
      p.x = Math.random() * width;
      p.y = height + 10;
      p.life = 1;
    }
    p.draw(ctx);
  });

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update();
  net.draw(ctx);

  // Update & Draw Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
