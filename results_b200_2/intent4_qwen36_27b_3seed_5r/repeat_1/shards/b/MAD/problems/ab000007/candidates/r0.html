<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-color: #0f172a;
    --ui-bg: rgba(15, 23, 42, 0.85);
    --accent: #38bdf8;
    --accent-glow: #0ea5e9;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color);
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none; /* Let clicks pass to canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    text-transform: uppercase;
    background: linear-gradient(to right, #fff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .title-block p {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin: 0.25rem 0 0 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .hud-stats {
    display: flex;
    gap: 1.5rem;
    background: var(--ui-bg);
    backdrop-filter: blur(12px);
    padding: 0.75rem 1.5rem;
    border-radius: 99px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 1rem;
  }

  .action-btn {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 1rem 2.5rem;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
    position: relative;
    overflow: hidden;
  }

  .action-btn:hover {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    transform: translateY(-2px);
  }

  .action-btn:active {
    transform: translateY(0);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--accent);
    padding: 1rem 2rem;
    border-radius: 8px;
    color: var(--accent);
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
  }
  
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether Catch</h1>
        <p>System: Online</p>
      </div>
      <div class="hud-stats">
        <div class="stat">
          <span class="stat-label">Collected</span>
          <span class="stat-value" id="scoreVal">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Net Energy</span>
          <span class="stat-value" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">Creature Captured!</div>

    <footer>
      <button class="action-btn" id="collectBtn">Open Collection</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders a cohesive, atmospheric scene with particle effects and floating entities.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;

// Colors
const PALETTE = {
  bg: '#0f172a',
  creature: ['#38bdf8', '#818cf8', '#c084fc', '#2dd4bf'],
  particle: '#ffffff'
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = Math.random() * 0.03 + 0.01;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.radius = Math.random() * 20 + 15;
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    
    // Drift velocity
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    
    this.color = PALETTE.creature[Math.floor(Math.random() * PALETTE.creature.length)];
    this.pulseSpeed = Math.random() * 0.05 + 0.02;
    this.pulseOffset = Math.random() * Math.PI * 2;
    
    // Trail history for visual flair
    this.history = [];
    this.historyLimit = 10;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    // Soft bounce off walls
    if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;

    // Keep inside
    this.x = Math.max(0, Math.min(width, this.x));
    this.y = Math.max(0, Math.min(height, this.y));

    // Store history for trail
    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) {
      this.history.shift();
    }
  }

  draw(ctx) {
    const pulse = Math.sin(time * this.pulseSpeed + this.pulseOffset) * 5;
    const currentRadius = this.radius + pulse;

    // Draw Trail
    ctx.beginPath();
    for (let i = 0; i < this.history.length; i++) {
      const pos = this.history[i];
      const alpha = (i / this.history.length) * 0.3;
      const size = currentRadius * (i / this.history.length);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // Draw Core
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    
    // Gradient body
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, currentRadius);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.4, this.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, currentRadius * 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Inner eye/core
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, currentRadius * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 30;
    this.active = false;
  }

  update(mouseX, mouseY) {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.1;
    this.y += (mouseY - this.y) * 0.1;
  }

  draw(ctx) {
    // Draw Net Ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Draw Crosshairs
    ctx.beginPath();
    ctx.moveTo(this.x - this.radius - 10, this.y);
    ctx.lineTo(this.x + this.radius + 10, this.y);
    ctx.moveTo(this.x, this.y - this.radius - 10);
    ctx.lineTo(this.x, this.y + this.radius + 10);
    ctx.stroke();

    // Inner pulsing ring
    const pulse = Math.sin(time * 0.1) * 5;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius - 5 + pulse, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize creatures
for (let i = 0; i < 5; i++) {
  creatures.push(new Creature());
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// Touch support
window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < net.radius + c.radius) {
      // Captured!
      createExplosion(c.x, c.y, c.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score;
      caught = true;
      
      // Respawn a new one after a delay to keep the game going
      setTimeout(() => creatures.push(new Creature()), 1000);
    }
  }

  if (caught) {
    showToast();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1000);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Stars
const stars = [];
for(let i=0; i<100; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 2,
    alpha: Math.random()
  });
}

function drawBackground() {
  // Draw a subtle gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#020617');
  grad.addColorStop(1, '#1e293b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Draw Stars
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    ctx.globalAlpha = Math.abs(Math.sin(time * 0.01 + star.x)) * star.alpha;
    ctx.beginPath();
    ctx.arc(star.x % width, star.y % height, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

// Main Loop
function animate() {
  time++;
  
  drawBackground();

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
