<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #030308;
    --bg-mid: #0b0b1a;
    
    --neon-cyan: #00f0ff;
    --neon-purple: #d500ff;
    --neon-red: #ff2a5f;
    
    --glass-bg: rgba(10, 12, 25, 0.45);
    --glass-border: rgba(255, 255, 255, 0.15);
    
    --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Geneva, Verdana, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-ui);
    color: white;
    background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-deep) 100%);
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2.5rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    transform: translateY(-5px);
  }

  .title-block h1 {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    line-height: 0.9;
  }

  .title-block p {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--neon-cyan);
    margin: 0.8rem 0 0 0.2rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  }

  /* HUD - Glassmorphism */
  .hud-panel {
    display: flex;
    gap: 2.5rem;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 1rem 2.5rem;
    border-radius: 4px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    transition: transform 0.3s ease, border-color 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  /* Tech accent line on HUD */
  .hud-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--neon-cyan);
    box-shadow: 0 0 10px var(--neon-cyan);
  }

  .hud-panel:hover {
    border-color: rgba(255,255,255,0.3);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 15px var(--neon-cyan);
    font-family: var(--font-display);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  /* Footer */
  footer {
    display: flex;
    justify-content: flex-start;
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
    padding-bottom: 2rem;
  }

  /* Collection Button - Tangible Tool */
  .control-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .capture-node {
    position: relative;
    background: linear-gradient(160deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 50, 80, 0.9) 100%);
    backdrop-filter: blur(8px);
    color: var(--neon-cyan);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    
    /* Shape: Rounded Square with bevels */
    width: 110px;
    height: 110px;
    border-radius: 16px;
    border: 1px solid rgba(0, 240, 255, 0.4);
    box-shadow: 
      0 10px 30px rgba(0, 240, 255, 0.15), 
      inset 0 1px 0 rgba(255,255,255,0.3),
      inset 0 0 20px rgba(0, 240, 255, 0.1);
    
    /* Tech details */
    overflow: hidden;
  }

  /* Etched lines */
  .capture-node::after {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px dashed rgba(0, 240, 255, 0.2);
    border-radius: 10px;
    pointer-events: none;
  }

  .node-icon {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: var(--neon-cyan);
    stroke-width: 2;
    filter: drop-shadow(0 0 8px var(--neon-cyan));
    transition: all 0.2s ease;
    margin-bottom: 6px;
  }

  .node-label {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 5px var(--neon-cyan);
  }

  .capture-node:hover {
    background: linear-gradient(160deg, rgba(0, 240, 255, 0.3) 0%, rgba(0, 80, 120, 0.9) 100%);
    border-color: #fff;
    box-shadow: 
      0 0 40px rgba(0, 240, 255, 0.4), 
      inset 0 1px 0 rgba(255,255,255,0.5);
    transform: translateY(-2px);
  }

  .capture-node:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 5px 15px rgba(0, 240, 255, 0.2);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 10, 0.9);
    border: 1px solid var(--neon-purple);
    padding: 1.5rem 3rem;
    color: #fff;
    font-family: var(--font-display);
    font-size: 1.5rem;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 60px rgba(189, 0, 255, 0.4);
    text-align: center;
    white-space: nowrap;
    z-index: 20;
    border-radius: 4px;
    backdrop-filter: blur(5px);
  }
  
  .toast span {
    display: block;
    font-family: var(--font-ui);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--neon-cyan);
    margin-top: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 8px;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

  <!-- Canvas Layer -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether<br>Catch</h1>
        <p>System: Active</p>
      </div>
      <div class="hud-panel">
        <div class="stat">
          <span class="stat-label">Specimens</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Resonance</span>
          <span class="stat-value" id="energyVal">100</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      Specimen Secured
      <span>Added to collection</span>
    </div>

    <footer>
      <div class="control-container">
        <button class="capture-node" id="collectBtn">
          <!-- SVG Icon: Holographic Capture Tool -->
          <svg class="node-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-dasharray="4 2" />
            <path d="M12 3v18M3 12h18" stroke-opacity="0.5" stroke-width="1"/>
            <circle cx="12" cy="12" r="3" fill="var(--neon-cyan)" stroke="none"/>
          </svg>
          <span class="node-label">Collect</span>
        </button>
      </div>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders stylized creatures, a sci-fi player entity, and atmospheric particles.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let time = 0;
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

// Colors
const PALETTE = {
  ui: '#00f0ff',
  wisp: '#ff2a5f',
  eye: '#d500ff',
  jelly: '#00f0ff',
  net: '#00f0ff'
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.01;
      this.size = Math.random() * 4 + 1;
    } else {
      // Ambient dust
      this.vx = (Math.random() - 0.5) * 0.15;
      this.vy = (Math.random() - 0.5) * 0.15;
      this.life = 1.0;
      this.decay = Math.random() * 0.002;
      this.size = Math.random() * 2;
      this.alpha = Math.random() * 0.5;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life * (this.alpha || 1);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Base Creature Class
class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.wobbleOffset = Math.random() * 100;
    this.wobbleSpeed = Math.random() * 0.03 + 0.01;
    this.scale = Math.random() * 0.4 + 1.0; 
    this.baseY = this.y;
  }

  update() {
    // Drift
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.2;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.2;

    // Bounce
    if (this.x < -100) this.x = width + 100;
    if (this.x > width + 100) this.x = -100;
    if (this.y < -100) this.y = height + 100;
    if (this.y > height + 100) this.y = -100;
  }
}

// 1. Ember Wisp (Red) - Simple Wireframe/Fill
class EmberWisp extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.wisp;
    
    const pulse = 1 + Math.sin(time * 0.1) * 0.1;
    
    // Teardrop Shape
    ctx.fillStyle = PALETTE.wisp;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -20 * pulse);
    ctx.bezierCurveTo(15, -10, 15, 15, 0, 30);
    ctx.bezierCurveTo(-15, 15, -15, -10, 0, -20 * pulse);
    ctx.fill();

    // Wireframe Core
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, -5, 3, 0, Math.PI*2);
    ctx.stroke();

    // Trailing Tail
    ctx.shadowBlur = 0;
    ctx.strokeStyle = PALETTE.wisp;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 30);
    ctx.bezierCurveTo(Math.sin(time*0.1)*10, 50, -Math.sin(time*0.1)*10, 70, 0, 90);
    ctx.stroke();

    ctx.restore();
  }
}

// 2. Void Eye (Purple) - Geometric Blob
class VoidEye extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.eye;
    
    // Organic Blob Shape (Wireframe)
    ctx.fillStyle = 'rgba(213, 0, 255, 0.1)';
    ctx.strokeStyle = PALETTE.eye;
    ctx.lineWidth = 2; // Standardized stroke
    
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.bezierCurveTo(20, -35, 40, -10, 30, 15);
    ctx.bezierCurveTo(20, 40, -20, 40, -30, 15);
    ctx.bezierCurveTo(-40, -10, -20, -35, 0, -25);
    ctx.fill();
    ctx.stroke();

    // Pupil Tracking
    const angle = Math.atan2(mouseY - this.y, mouseX - this.x);
    const dist = Math.min(8, Math.hypot(mouseX - this.x, mouseY - this.y) * 0.05);
    const px = Math.cos(angle) * dist;
    const py = Math.sin(angle) * dist;

    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI*2);
    ctx.fill();

    // Pupil dot
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// 3. Aether Jelly (Cyan) - Elegant Wireframe
class AetherJelly extends Creature {
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    ctx.shadowBlur = 20;
    ctx.shadowColor = PALETTE.jelly;
    
    ctx.strokeStyle = PALETTE.jelly;
    ctx.lineWidth = 2; // Standardized stroke
    ctx.lineCap = 'round';

    // Dome
    ctx.beginPath();
    ctx.arc(0, 0, 25, Math.PI, 0);
    ctx.stroke();

    // Tentacles
    for(let i=-15; i<=15; i+=10) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      const offset = Math.sin(time * 0.1 + i) * 10;
      ctx.bezierCurveTo(i + offset, 20, i - offset, 40, i, 60);
      ctx.stroke();
    }

    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, -8, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// Player Entity - Sci-Fi Drone with Net
class PlayerDrone {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 50;
    this.rotation = 0;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.12;
    this.y += (mouseY - this.y) * 0.12;
    this.rotation += 0.005; // Slow ambient rotation
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    
    // --- 1. The Net (Glowing Hoop) ---
    // Drawn first so it's behind the main body
    ctx.shadowBlur = 20;
    ctx.shadowColor = PALETTE.net;
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 3; // Thicker for Player
    
    // Outer Hoop
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI*2);
    ctx.stroke();

    // Inner Hoop (Rotating counter)
    ctx.rotate(-this.rotation * 2);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.7, 0, Math.PI*2);
    ctx.stroke();

    // Reset rotation for body
    ctx.rotate(this.rotation); // Undo counter
    ctx.rotate(this.rotation); // Restore original

    // --- 2. The Player Body (Complex Silhouette) ---
    ctx.shadowBlur = 15;
    ctx.shadowColor = PALETTE.net;

    // Core Body (Hexagon-ish)
    ctx.fillStyle = '#050510';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    // A stylized drone shape
    ctx.moveTo(0, -25);
    ctx.lineTo(15, -10);
    ctx.lineTo(15, 15);
    ctx.lineTo(0, 25);
    ctx.lineTo(-15, 15);
    ctx.lineTo(-15, -10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Mechanical Details (Internal)
    ctx.strokeStyle = PALETTE.net;
    ctx.lineWidth = 1;
    
    // Center Core
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI*2);
    ctx.stroke();

    // Pulsating Core Fill
    const pulse = 0.5 + Math.sin(time * 0.2) * 0.5;
    ctx.fillStyle = `rgba(0, 240, 255, ${pulse})`;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    // "Arms" holding the net
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.lineTo(this.radius - 5, 0);
    ctx.moveTo(-15, 0);
    ctx.lineTo(-this.radius + 5, 0);
    ctx.stroke();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const dustParticles = [];
const player = new PlayerDrone();

// Initialize creatures
const types = [EmberWisp, VoidEye, AetherJelly];
for (let i = 0; i < 6; i++) {
  const Type = types[Math.floor(Math.random() * types.length)];
  creatures.push(new Type());
}

// Initialize Dust
for (let i = 0; i < 60; i++) {
  dustParticles.push(new Particle(Math.random() * width, Math.random() * height, '#ffffff', 'dust'));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - player.x;
    const dy = c.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Hitbox (Net Radius + Creature Buffer)
    if (dist < player.radius + 20) { 
      // Captured!
      let color = PALETTE.jelly;
      if (c instanceof VoidEye) color = PALETTE.eye;
      if (c instanceof EmberWisp) color = PALETTE.wisp;

      createExplosion(c.x, c.y, color);
      creatures.splice(i, 1);
      score++;
      
      // Update UI
      scoreEl.innerText = score < 10 ? '0' + score : score;
      
      caught = true;
      
      // Respawn
      setTimeout(() => {
        const Type = types[Math.floor(Math.random() * types.length)];
        creatures.push(new Type());
      }, 1500);
    }
  }

  if (caught) {
    showToast();
    // Flash Energy
    energyEl.innerText = "MAX";
    energyEl.style.color = "#fff";
    setTimeout(() => {
      energyEl.innerText = "100";
      energyEl.style.color = "#fff";
    }, 500);
  } else {
    // Visual feedback for miss (shake or flash red)
    const btn = document.getElementById('collectBtn');
    btn.style.borderColor = 'var(--neon-red)';
    btn.style.boxShadow = '0 0 20px var(--neon-red)';
    setTimeout(() => {
      btn.style.borderColor = 'rgba(0, 240, 255, 0.4)';
      btn.style.boxShadow = '0 10px 30px rgba(0, 240, 255, 0.15)';
    }, 200);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Main Loop
function animate() {
  time++;
  
  // Clear Canvas
  ctx.clearRect(0, 0, width, height);

  // Draw Dust (Background)
  dustParticles.forEach(p => {
    p.update();
    if (p.life <= 0) {
      p.x = Math.random() * width;
      p.y = height + 10;
      p.life = 1;
    }
    p.draw(ctx);
  });

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Player (Visual Anchor)
  player.update();
  player.draw(ctx);

  // Update & Draw Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
