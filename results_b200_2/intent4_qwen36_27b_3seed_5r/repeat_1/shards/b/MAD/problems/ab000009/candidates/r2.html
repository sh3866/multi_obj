<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Deep Walnut & Warm Ivory */
            --board-dark: #4a3b32;
            --board-light: #e8dcca;
            
            /* UI Palette: Dark Slate */
            --bg-app: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #5c7c8a; /* Muted Deep Slate Blue */
            --accent-hover: #4a6572;
            
            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
            
            /* Dimensions */
            --board-size: min(80vh, 85vw);
            --square-size: calc(var(--board-size) / 8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 40px;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* The Board */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            user-select: none;
            background: #333; /* Fallback border */
            border: 8px solid #2a2a2a; /* Dark wood frame simulation */
            border-radius: 6px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-family: var(--font-mono);
            font-size: 14px; /* Slightly larger */
            font-weight: 600;
            pointer-events: none;
            line-height: 1;
            z-index: 1;
        }
        
        /* Specific styling for contrast on different square types */
        .square.light .coord { color: #4a3b32; opacity: 0.8; }
        .square.dark .coord { color: #e8dcca; opacity: 0.8; }

        .coord.rank { top: 6px; left: 6px; }
        .coord.file { bottom: 6px; right: 6px; }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.25);
            z-index: 1;
            pointer-events: none;
        }

        /* SVG Pieces */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3)); /* Subtle depth */
        }
        .piece:hover {
            transform: scale(1.05);
        }

        /* Side Panel */
        .panel {
            width: 340px;
            background-color: #252525; /* Flat neutral dark */
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: var(--board-size);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        /* Header & Turn Indicator */
        .header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 16px;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .turn-main {
            font-size: 16px; /* Standard status size */
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        .turn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e8dcca;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
        }
        
        .turn-dot.black {
            background-color: #4a3b32;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
        }

        /* Move History */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 24px;
            font-family: var(--font-mono);
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 0;
        }

        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: transparent; }
        .history-container::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 8px 12px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .move-row:last-child { border-bottom: none; }
        .move-row:nth-child(odd) { background-color: rgba(255,255,255,0.02); }
        
        .move-num { width: 30px; color: var(--text-muted); opacity: 0.6; }
        .move-ply { width: 70px; color: var(--text-main); font-weight: 500; }
        .move-ply.black-move { color: var(--text-muted); }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Accent Button */
        .btn-primary {
            background-color: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { 
            background-color: var(--accent-hover);
        }

        /* Reset Button (Subtle) */
        .btn-secondary {
            background-color: transparent;
            border: 1px solid #444;
            color: var(--text-muted);
        }
        .btn-secondary:hover { 
            background-color: rgba(255,255,255,0.05); 
            border-color: #666;
            color: var(--text-main);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { flex-direction: column; gap: 30px; }
            .panel { width: 100%; height: auto; max-height: 300px; }
            .board-wrapper { width: 95vw; height: 95vw; border-width: 4px; }
            :root { --board-size: 95vw; }
            .coord { font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Chess Board Area -->
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="header">
                <div class="turn-indicator">
                    <div class="turn-dot" id="turnDot"></div>
                    <span class="turn-main" id="turnText">Black's Turn</span>
                </div>
                <!-- Analysis mode text removed as per critique -->
            </div>

            <div class="history-container" id="historyList">
                <!-- Moves populated by JS -->
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="resetGame()">Reset</button>
                <button class="btn-primary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

    <script>
        // --- SVG Assets (High-fidelity Staunton-style paths) ---
        // Coordinates mapped to 45x45 viewBox
        const piecePaths = {
            p: "M22 5c-3 0-5 2-5 5 0 2 1 3 2 4-2 1-3 3-3 5 0 2 1 3 2 4-3 1-5 4-5 7v3h20v-3c0-3-2-6-5-7 1-1 2-2 2-4 0-2-1-4-3-5 1-1 2-2 2-4 0-3-2-5-5-5z",
            r: "M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5M34 14l-3 3H14l-3-3M31 17v12.5c1 2 2 2 2 3.5S34 36 34 36H11s1-3 1-3 1-1.5 2-3.5V17h17zM31 29.5l1.5 2.5h-20l1.5-2.5M11 14h23",
            n: "M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.32-2.58 2.9-3 3-3.65.9-5.83 6.24-8 8-7.13 5.13-11.5 6.37-11.5 11h20c4-4.5 5-11.5 5-15.5 0-3.5-3.5-5-4.5-5.5zM9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0zM15 15.5c-1.61 2.59-2.75 5.94-2.75 5.94",
            b: "M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32c-3.39.97-9.11 1.45-13.5 1.45-4.39 0-10.11-.48-13.5-1.45v4zM15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2zM25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0zM17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5",
            q: "M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14.5V25l-7-11-2 12M9 26c0 2 1.5 2 2.5 4 1 2.5 1 1 .5 4.5-5 2-10 2-15 2s-10 0-15-2c-.5-3.5-.5-2 .5-4.5 1-2 2.5-2 2.5-4M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0",
            k: "M22.5 11.63V6M20 8h5M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 2-8 2-5-2-8-2-4-1-9-1c-3 6 6 10.5 6 10.5v7M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"
        };

        // Helper to generate SVG string
        const createPieceSVG = (type, color) => {
            // White: Solid cream/ivory with subtle dark outline
            // Black: Solid charcoal/dark grey with white outline
            const fill = color === 'w' ? '#f0f0f0' : '#222222';
            const stroke = color === 'w' ? '#1a1a1a' : '#ffffff';
            
            return `<svg viewBox="0 0 45 45" class="piece" fill="${fill}" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="${piecePaths[type]}" />
            </svg>`;
        };

        // --- Game Logic & State ---
        
        // Board Setup (Standard Position)
        // Array index 0 is Rank 8 (Black back rank)
        // Array index 7 is Rank 1 (White back rank)
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Rank 8 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Rank 7
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // Rank 2 (White)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // Rank 1 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += createPieceSVG(type, color);
                    }

                    // Highlights
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            square.innerHTML += `<div class="highlight"></div>`;
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            
            // Update turn dot visual
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : ''}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const to = `${files[toC]}${8-toR}`;
            const pieceChar = piece.toUpperCase() === 'P' ? '' : piece.toUpperCase();
            const notation = `${pieceChar}${to}`;
            
            let moveRow = historyEl.lastElementChild;
            const moveNumber = Math.ceil((moveHistory.length + 1) / 2);
            
            // If it's White's move, start a new row
            if (turn === 'w') {
                moveRow = document.createElement('div');
                moveRow.className = 'move-row';
                
                const numSpan = document.createElement('span');
                numSpan.className = 'move-num';
                numSpan.innerText = `${moveNumber}.`;
                moveRow.appendChild(numSpan);
                
                historyEl.appendChild(moveRow);
            }
            
            const plySpan = document.createElement('span');
            plySpan.className = `move-ply ${turn === 'b' ? 'black-move' : ''}`;
            plySpan.innerText = notation;
            
            moveRow.appendChild(plySpan);
            
            historyEl.scrollTop = historyEl.scrollHeight;
            moveHistory.push(notation);
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isWhitePiece = clickedPiece && clickedPiece === clickedPiece.toUpperCase();
            const isBlackPiece = clickedPiece && clickedPiece === clickedPiece.toLowerCase();
            
            // Check if clicking own piece
            const isOwnPiece = (turn === 'w' && isWhitePiece) || (turn === 'b' && isBlackPiece);

            // Select Piece
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move Piece
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Basic move execution (No complex rules for this visual demo)
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Record move
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                // Switch Turn
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            historyEl.innerHTML = '';
            
            // Re-populate sample game
            initSampleGame();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // --- Initialization ---
        // Populate with sample moves to demonstrate layout
        function initSampleGame() {
            // 1. e4
            boardState[6][4] = null; 
            boardState[4][4] = 'P'; 
            addMoveToHistory(6, 4, 4, 4, 'P');
            
            // 1... e5
            boardState[1][4] = null;
            boardState[3][4] = 'p';
            addMoveToHistory(1, 4, 3, 4, 'p');
            
            // 2. Nf3
            boardState[7][6] = null;
            boardState[5][5] = 'N';
            addMoveToHistory(7, 6, 5, 5, 'N');
            
            // 2... Nc6
            boardState[0][1] = null;
            boardState[2][2] = 'n';
            addMoveToHistory(0, 1, 2, 2, 'n');

            // It is now White's turn
            turn = 'w';
            updateUI();
        }

        // Start
        renderBoard();
        initSampleGame();

    </script>
</body>
</html>
