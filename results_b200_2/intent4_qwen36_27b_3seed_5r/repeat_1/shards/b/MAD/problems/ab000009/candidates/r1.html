<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Interface</title>
    <style>
        :root {
            /* Palette: Refined Dark Slate */
            --bg-app: #16181b;
            --bg-panel: #202328;
            --text-main: #f0f2f5;
            --text-muted: #6b7280;
            --accent: #3b82f6; /* Crisp Blue */
            --accent-glow: rgba(59, 130, 246, 0.4);
            
            /* Board Palette: Sage & Charcoal */
            --board-light: #e8ebd5; /* Muted Cream/Sage */
            --board-dark: #779556;  /* Deep Sage */
            --board-highlight: rgba(255, 255, 255, 0.2);
            --board-move: rgba(0, 0, 0, 0.1);

            /* Dimensions */
            --board-size: min(80vh, 80vw);
            --square-size: calc(var(--board-size) / 8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 48px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* The Board */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            user-select: none;
            background: #333; /* Border color base */
            padding: 4px; /* Acts as the border */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Coordinate Labels: Monospaced, legible, contrasting */
        .coord {
            position: absolute;
            font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.8;
            line-height: 1;
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--board-highlight);
            z-index: 1;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
        }
        .move-marker {
            width: 25%;
            height: 25%;
            background-color: var(--board-move);
            border-radius: 50%;
            z-index: 2;
        }

        /* SVG Pieces: Crisp, high contrast, no heavy shadows */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .piece:active { transform: scale(0.95); }

        /* Side Panel */
        .panel {
            width: 360px;
            background-color: var(--bg-panel);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            height: var(--board-size);
            /* No border, just background differentiation */
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-indicator {
            display: flex;
            flex-direction: column;
        }

        .turn-main {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        /* Critique Point 7: Focal Moment / Active Player Glow */
        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .turn-dot.active {
            box-shadow: 0 0 0 3px var(--bg-panel), 0 0 12px rgba(255,255,255,0.4);
        }
        .turn-dot.black.active {
            box-shadow: 0 0 0 3px var(--bg-panel), 0 0 12px rgba(0,0,0,0.6);
            background-color: #111;
            border: 1px solid #444;
        }

        .status-text {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        /* Move History */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 24px;
            font-family: 'SF Mono', 'Menlo', monospace;
            border-radius: 8px;
            background: rgba(0,0,0,0.15);
            padding: 4px;
        }

        /* Scrollbar */
        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: transparent; }
        .history-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 6px 12px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .move-row:last-child { border-bottom: none; }
        .move-row:nth-child(odd) { background-color: rgba(255,255,255,0.02); }
        
        .move-num { width: 35px; color: var(--text-muted); opacity: 0.7; }
        .move-ply { width: 80px; color: var(--text-main); font-weight: 500; }
        .move-ply.black-move { color: var(--text-muted); }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        /* Critique Point 6: Refined System Blue */
        .btn-primary {
            background-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .btn-primary:hover { 
            background-color: #2563eb; 
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            background-color: rgba(255,255,255,0.05);
            color: var(--text-main);
        }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.1); }

        /* Responsive */
        @media (max-width: 1000px) {
            .container { flex-direction: column; gap: 30px; }
            .panel { width: 100%; height: auto; max-height: 350px; }
            .board-wrapper { width: 90vw; height: 90vw; }
            :root { --board-size: 90vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Chess Board Area -->
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="header">
                <div class="turn-indicator">
                    <div class="turn-main">
                        <div class="turn-dot active" id="turnDot"></div>
                        <span id="turnText">White's Turn</span>
                    </div>
                    <div class="status-text">Analysis Mode</div>
                </div>
            </div>

            <div class="history-container" id="historyList">
                <!-- Moves populated by JS -->
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="resetGame()">Reset</button>
                <button class="btn-primary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

    <script>
        // --- SVG Assets (Clean, vector fills, no heavy strokes) ---
        // Using standard paths but filling them solid for the "crisp" look requested.
        const piecePaths = {
            p: "M22 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-2.78-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z",
            r: "M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5M34 14l-3 3H14l-3-3M31 17v12.5c1 2 2 2 2 3.5S34 36 34 36H11s1-3 1-3 1-1.5 2-3.5V17h17zM31 29.5l1.5 2.5h-20l1.5-2.5M11 14h23",
            n: "M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.32-2.58 2.9-3 3-3.65.9-5.83 6.24-8 8-7.13 5.13-11.5 6.37-11.5 11h20c4-4.5 5-11.5 5-15.5 0-3.5-3.5-5-4.5-5.5zM9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0zM15 15.5c-1.61 2.59-2.75 5.94-2.75 5.94",
            b: "M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32c-3.39.97-9.11 1.45-13.5 1.45-4.39 0-10.11-.48-13.5-1.45v4zM15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2zM25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0zM17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5",
            q: "M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14.5V25l-7-11-2 12M9 26c0 2 1.5 2 2.5 4 1 2.5 1 1 .5 4.5-5 2-10 2-15 2s-10 0-15-2c-.5-3.5-.5-2 .5-4.5 1-2 2.5-2 2.5-4M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0",
            k: "M22.5 11.63V6M20 8h5M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 2-8 2-5-2-8-2-4-1-9-1c-3 6 6 10.5 6 10.5v7M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"
        };

        // Helper to generate SVG string
        const createPieceSVG = (type, color) => {
            // White is filled with light cream, Black with solid dark charcoal
            const fill = color === 'w' ? '#f0f0f0' : '#222222';
            const stroke = color === 'w' ? '#111' : '#fff';
            const strokeWidth = color === 'w' ? '1.5' : '1';
            
            // We construct the SVG manually to ensure correct styling
            // Paths are combined into a single path string for simplicity in this specific SVG set
            // Note: Some pieces have multiple sub-paths in the paths object above.
            // We need to ensure stroke settings apply correctly.
            
            // For Black pieces, we often want the stroke to be white or a lighter grey to define details
            // For White pieces, the stroke is dark to define edges against the board.
            
            // Special handling for internal details (like Bishop cross or King cross)
            // In this specific SVG set, the paths are mixed. 
            // To ensure the "crisp" look, we will render the main body with the fill.
            
            return `<svg viewBox="0 0 45 45" class="piece" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">
                <path d="${piecePaths[type]}" />
            </svg>`;
        };

        // --- Game Logic & State ---
        
        // Critique 1: Fixed Board Setup (Standard Position)
        // White on bottom (ranks 1, 2), Black on top (ranks 7, 8)
        // Array index 0 is Rank 8 (Black back rank)
        // Array index 7 is Rank 1 (White back rank)
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Rank 8 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Rank 7
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // Rank 2 (White)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // Rank 1 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += createPieceSVG(type, color);
                    }

                    // Highlights
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            square.innerHTML += `<div class="highlight"></div>`;
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            
            // Update turn dot visual
            turnDotEl.className = `turn-dot active ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const to = `${files[toC]}${8-toR}`;
            const pieceChar = piece.toUpperCase() === 'P' ? '' : piece.toUpperCase();
            const notation = `${pieceChar}${to}`;
            
            // Critique 4: Populate Move History properly
            
            let moveRow = historyEl.lastElementChild;
            const moveNumber = Math.ceil((moveHistory.length + 1) / 2);
            
            // If it's White's move, start a new row
            if (turn === 'w') {
                moveRow = document.createElement('div');
                moveRow.className = 'move-row';
                
                const numSpan = document.createElement('span');
                numSpan.className = 'move-num';
                numSpan.innerText = `${moveNumber}.`;
                moveRow.appendChild(numSpan);
                
                historyEl.appendChild(moveRow);
            }
            
            const plySpan = document.createElement('span');
            plySpan.className = `move-ply ${turn === 'b' ? 'black-move' : ''}`;
            plySpan.innerText = notation;
            
            moveRow.appendChild(plySpan);
            
            historyEl.scrollTop = historyEl.scrollHeight;
            moveHistory.push(notation);
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isWhitePiece = clickedPiece && clickedPiece === clickedPiece.toUpperCase();
            const isBlackPiece = clickedPiece && clickedPiece === clickedPiece.toLowerCase();
            
            // Check if clicking own piece
            const isOwnPiece = (turn === 'w' && isWhitePiece) || (turn === 'b' && isBlackPiece);

            // Select Piece
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move Piece
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Basic move execution (No complex rules for this visual demo)
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Record move
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                // Switch Turn
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            historyEl.innerHTML = '';
            updateUI();
            renderBoard();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // Critique 4: Pre-populate with a sample move to show layout immediately
        function initSampleGame() {
            // Simulate a move for visual rhythm
            boardState[6][4] = null; // White pawn moves
            boardState[4][4] = 'P'; // to e4
            
            const files = ['a','b','c','d','e','f','g','h'];
            const moveRow = document.createElement('div');
            moveRow.className = 'move-row';
            moveRow.innerHTML = `<span class="move-num">1.</span><span class="move-ply">e4</span>`;
            historyEl.appendChild(moveRow);
            
            // Now it's Black's turn
            turn = 'b';
            updateUI();
        }

        // Init
        renderBoard();
        updateUI();
        initSampleGame();

    </script>
</body>
</html>
