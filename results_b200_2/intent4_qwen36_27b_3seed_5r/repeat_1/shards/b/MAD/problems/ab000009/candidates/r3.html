<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess Interface</title>
    <style>
        :root {
            /* Palette: Slate Blue & Cream (High Contrast) */
            --board-dark: #457B9D;
            --board-light: #E8EDF9;
            
            /* UI Palette: Clean Dark Mode */
            --bg-app: #121212;
            --bg-panel: #1E1E1E;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --border-color: #333333;
            
            /* Controls */
            --accent-color: #457B9D;
            --accent-hover: #3a6a88;
            
            /* Dimensions */
            --board-size: min(85vh, 90vw);
            --square-size: calc(var(--board-size) / 8);
            --gutter-size: 25px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* Board Area with Gutters */
        .board-area {
            display: grid;
            grid-template-columns: var(--gutter-size) 1fr;
            grid-template-rows: 1fr var(--gutter-size);
            gap: 4px;
            user-select: none;
        }

        /* Coordinate Labels in Gutters */
        .coords-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .coords-col {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* The Board Grid */
        .board {
            width: var(--board-size);
            height: var(--board-size);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }
        
        /* Last move highlight */
        .last-move {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 0, 0.2);
            z-index: 0;
            pointer-events: none;
        }

        /* SVG Pieces */
        .piece {
            width: 80%;
            height: 80%;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Unified Drop Shadow for depth */
            filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.4));
        }
        .piece:hover {
            transform: scale(1.1) translateY(-2px);
        }

        /* Side Panel */
        .panel {
            width: 360px;
            background-color: var(--bg-panel);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            height: var(--board-size);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }

        /* Header & Turn Indicator */
        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #FFFFFF;
            border: 2px solid #333;
        }
        
        .turn-dot.black {
            background-color: #2B2B2B;
            border: 2px solid #555;
        }

        .turn-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        /* Move History - Grouped Layout */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 24px;
            font-family: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: transparent; }
        .history-container::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .move-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            padding: 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        
        .move-row:last-child { border-bottom: none; }
        .move-row:nth-child(odd) { background-color: rgba(255,255,255,0.01); }

        .move-num { 
            color: var(--text-muted); 
            opacity: 0.5; 
            padding: 10px 0 10px 12px;
            font-size: 12px;
        }
        
        .move-ply { 
            padding: 10px 12px; 
            color: var(--text-main); 
            cursor: pointer;
            transition: background 0.2s;
        }
        .move-ply:hover {
            background-color: rgba(255,255,255,0.05);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        /* Primary Button (Matches Board Blue) */
        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }
        .btn-primary:hover { 
            background-color: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(69, 123, 157, 0.3);
        }

        /* Secondary Button (Outline) */
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
        .btn-secondary:hover { 
            background-color: rgba(255,255,255,0.05); 
            border-color: #666;
            color: var(--text-main);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { flex-direction: column; gap: 20px; }
            .panel { width: 100%; max-width: 500px; height: auto; }
            .history-container { max-height: 150px; }
            .board-area { transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Board with Coordinates in Gutters -->
        <div class="board-area">
            <!-- Top Labels (optional for aesthetic balance, usually empty or player info) -->
            <div style="grid-column: 1; grid-row: 1;"></div>
            <div style="grid-column: 2; grid-row: 1; display: flex; justify-content: space-around; padding: 0 25px;">
                <!-- Player info placeholder -->
            </div>

            <!-- Left Labels (Ranks 8-1) -->
            <div class="coords-col" style="grid-column: 1; grid-row: 2;">
                <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <!-- The Board Grid -->
            <div class="board" id="board">
                <!-- Generated by JS -->
            </div>

            <!-- Bottom Labels (Files a-h) -->
            <div class="coords-row" style="grid-column: 2; grid-row: 3;">
                <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="header">
                <div class="status-card">
                    <div class="turn-dot" id="turnDot"></div>
                    <span class="turn-text" id="turnText">White to Move</span>
                </div>
            </div>

            <div class="history-container" id="historyList">
                <!-- Moves populated by JS -->
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="resetGame()">Reset</button>
                <button class="btn-primary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

    <script>
        // --- SVG Assets ---
        // Paths optimized for solid fills and clean strokes
        const piecePaths = {
            p: "M22.5 4c-3.3 0-6 2.7-6 6 0 2.5 1.5 4.5 3 5.5-2 1.5-3 4-3 6 0 3 2 5 4 6v5h14v-5c2-1 4-3 4-6 0-2-1-4.5-3-6 1.5-1 3-3 3-5.5 0-3.3-2.7-6-6-6zm0 2c2.2 0 4 1.8 4 4 0 1.5-1 2.5-1.5 3.5l-1 1.5h-5l-1-1.5c-.5-1-1.5-2-1.5-3.5 0-2.2 1.8-4 4-4zM18 22h9v3h-9v-3zm-2 6h13v2h-13v-2z",
            r: "M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5M34 14l-3 3H14l-3-3M31 17v12.5c1 2 2 2 2 3.5S34 36 34 36H11s1-3 1-3 1-1.5 2-3.5V17h17zM31 29.5l1.5 2.5h-20l1.5-2.5M11 14h23",
            n: "M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.32-2.58 2.9-3 3-3.65.9-5.83 6.24-8 8-7.13 5.13-11.5 6.37-11.5 11h20c4-4.5 5-11.5 5-15.5 0-3.5-3.5-5-4.5-5.5zM9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0zM15 15.5c-1.61 2.59-2.75 5.94-2.75 5.94",
            b: "M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32c-3.39.97-9.11 1.45-13.5 1.45-4.39 0-10.11-.48-13.5-1.45v4zM15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2zM25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0zM17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5",
            q: "M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14.5V25l-7-11-2 12M9 26c0 2 1.5 2 2.5 4 1 2.5 1 1 .5 4.5-5 2-10 2-15 2s-10 0-15-2c-.5-3.5-.5-2 .5-4.5 1-2 2.5-2 2.5-4M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0",
            k: "M22.5 11.63V6M20 8h5M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 2-8 2-5-2-8-2-4-1-9-1c-3 6 6 10.5 6 10.5v7M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"
        };

        // Helper to generate SVG string
        const createPieceSVG = (type, color) => {
            // White: #FFFFFF with dark stroke
            // Black: #2B2B2B with white stroke
            const fill = color === 'w' ? '#FFFFFF' : '#2B2B2B';
            const stroke = color === 'w' ? '#2B2B2B' : '#FFFFFF';
            
            return `<svg viewBox="0 0 45 45" class="piece" fill="${fill}" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="${piecePaths[type]}" />
            </svg>`;
        };

        // --- Game Logic & State ---
        
        // Board Setup (Standard Position)
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // Rank 8 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // Rank 7
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // Rank 2 (White)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // Rank 1 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; 
        let selectedSquare = null;
        let moveHistory = [];

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += createPieceSVG(type, color);
                    }

                    // Highlights
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            square.innerHTML += `<div class="highlight"></div>`;
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White to Move" : "Black to Move";
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : ''}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const to = `${files[toC]}${8-toR}`;
            const pieceChar = piece.toUpperCase() === 'P' ? '' : piece.toUpperCase();
            const notation = `${pieceChar}${to}`;
            
            const moveNumber = Math.ceil((moveHistory.length + 1) / 2);
            
            // If it's White's move, start a new row
            if (turn === 'w') {
                const moveRow = document.createElement('div');
                moveRow.className = 'move-row';
                
                const numSpan = document.createElement('span');
                numSpan.className = 'move-num';
                numSpan.innerText = `${moveNumber}.`;
                moveRow.appendChild(numSpan);
                
                const whitePly = document.createElement('span');
                whitePly.className = 'move-ply';
                whitePly.innerText = notation;
                moveRow.appendChild(whitePly);
                
                // Placeholder for black
                const blackPly = document.createElement('span');
                blackPly.className = 'move-ply';
                blackPly.id = `black-${moveNumber}`;
                moveRow.appendChild(blackPly);

                historyEl.appendChild(moveRow);
            } else {
                // Find the placeholder created for this move number
                const blackPly = document.getElementById(`black-${moveNumber}`);
                if (blackPly) blackPly.innerText = notation;
            }
            
            historyEl.scrollTop = historyEl.scrollHeight;
            moveHistory.push(notation);
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isWhitePiece = clickedPiece && clickedPiece === clickedPiece.toUpperCase();
            const isBlackPiece = clickedPiece && clickedPiece === clickedPiece.toLowerCase();
            
            const isOwnPiece = (turn === 'w' && isWhitePiece) || (turn === 'b' && isBlackPiece);

            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Execute Move
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            historyEl.innerHTML = '';
            updateUI();
            renderBoard();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // Start
        renderBoard();
        updateUI();

    </script>
</body>
</html>
