<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #020204;
        --bg-vignette: #0a0a12;
        --gold-primary: #d4af37;
        --gold-bright: #ffe680;
        --gold-dim: #5c4810;
        --mystic-purple: #7b2cbf;
        --mystic-glow: #9d4edd;
        --text-main: #ffffff;
        --text-muted: #9ba4b5;
        
        /* Glass Material */
        --glass-bg: rgba(10, 10, 16, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.15);
        
        /* Typography */
        --font-display: 'Georgia', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- Atmosphere & Background --- */
    .background-layer {
        position: fixed;
        inset: 0;
        z-index: -2;
        /* Deep indigo to black radial */
        background: radial-gradient(circle at 50% 30%, #1a1025 0%, #050508 60%, #000000 100%);
    }

    .noise-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.07;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
    }

    /* Dust Particles */
    .dust-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
    }

    .dust {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.3; }
        100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    /* --- Layout Structure --- */
    .game-container {
        width: 100%;
        max-width: 1100px;
        height: 100%;
        padding: 2rem;
        display: grid;
        grid-template-rows: auto auto 1fr; /* Header, Hero, Menu */
        gap: 1rem;
        position: relative;
        z-index: 5;
    }

    /* --- Header: Status Bar --- */
    header {
        display: flex;
        align-items: center;
        justify-content: flex-start; /* Left aligned as requested */
        padding: 0 0.5rem;
    }

    .currency-pill {
        background: linear-gradient(90deg, rgba(20, 20, 30, 0.9), rgba(40, 35, 15, 0.9));
        border: 1px solid var(--gold-dim);
        padding: 0.5rem 1.2rem;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
    }

    .currency-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 3px var(--gold-primary));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-primary);
        letter-spacing: 0.05em;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 1rem;
        height: 100%;
        min-height: 0; /* Grid fix */
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 4rem;
        font-weight: 700;
        letter-spacing: 0.05em; /* Tightened tracking */
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #ffffff 0%, #b0b0b0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(157, 78, 221, 0.3));
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 2;
    }

    .title-line {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        box-shadow: 0 0 8px var(--gold-primary);
    }

    /* --- Spirit Orb Portal --- */
    .orb-container {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1rem;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .orb-container:hover {
        transform: scale(1.05);
    }

    /* Swirl Effect Pseudo-elements */
    .orb-container::before, .orb-container::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        opacity: 0.4;
        pointer-events: none;
    }

    .orb-container::before {
        width: 100%;
        height: 100%;
        border-top: 2px solid var(--mystic-glow);
        border-bottom: 2px solid var(--mystic-glow);
        animation: spin 8s linear infinite;
        box-shadow: 0 0 15px var(--mystic-purple);
    }

    .orb-container::after {
        width: 80%;
        height: 80%;
        border-left: 1px solid var(--gold-primary);
        border-right: 1px solid var(--gold-primary);
        animation: spin-rev 12s linear infinite;
        box-shadow: 0 0 10px var(--gold-dim);
    }

    /* Core */
    .orb-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0aaff 30%, #3c096c 80%, #000 100%);
        box-shadow: 
            0 0 40px var(--mystic-purple), 
            0 0 80px rgba(157, 78, 221, 0.4),
            inset 0 0 20px rgba(255,255,255,0.6);
        position: relative;
        z-index: 2;
        animation: pulse-core 4s ease-in-out infinite;
    }

    /* Rotating Inner Ring */
    .orb-ring-inner {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        animation: spin-rev 25s linear infinite;
        pointer-events: none;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes pulse-core {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--mystic-purple); }
        50% { transform: scale(1.08); box-shadow: 0 0 60px var(--mystic-purple), 0 0 20px white; }
    }

    /* --- Menu Grid & Cards --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
        /* Push to bottom */
        align-self: end;
    }

    /* Unified Void Glass Material */
    .menu-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-top: 1px solid var(--glass-highlight); /* Subtle top highlight */
        border-radius: 8px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        height: 160px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* Hover State */
    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(20, 20, 30, 0.75);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        transform: scale(1.1);
    }

    /* Hierarchy: Summon Card (Primary) */
    .menu-card.summon {
        /* Gold Gradient Border Trick */
        background: linear-gradient(var(--glass-bg), var(--glass-bg)) padding-box,
                    linear-gradient(180deg, var(--gold-bright), var(--gold-dim)) border-box;
        border: 1px solid transparent;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .menu-card.summon::before {
        /* Top Gold Glow */
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--gold-bright);
        box-shadow: 0 0 10px var(--gold-primary);
    }

    .menu-card.summon .card-title {
        color: var(--gold-bright);
    }

    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 4px var(--gold-primary));
    }

    .menu-card.summon:hover {
        background: linear-gradient(rgba(40, 35, 20, 0.8), rgba(15, 10, 5, 0.8));
        box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
    }

    /* Hierarchy: Secondary Cards (Line Art Icons) */
    .menu-card:not(.summon) .card-icon {
        /* Outline effect via stroke/fill manipulation */
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 1.5;
    }

    .menu-card:not(.summon):hover .card-icon {
        fill: none;
        stroke: var(--text-main);
    }

    /* Typography inside Cards */
    .card-icon {
        width: 40px;
        height: 40px;
        margin-bottom: 0.8rem;
        transition: all 0.3s ease;
    }

    .card-title {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.02em;
        margin-bottom: 0.25rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .card-subtitle {
        font-family: var(--font-ui); /* Geometric sans-serif */
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em; /* Tighter tracking */
    }

    /* Responsive */
    @media (max-width: 850px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .game-title {
            font-size: 2.5rem;
        }
        .game-container {
            padding: 1rem;
            justify-content: flex-start; /* Align content top on mobile */
        }
        .hero-section {
            margin-bottom: 0.5rem;
        }
    }
</style>
</head>
<body>

    <!-- Background Atmosphere -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>
    
    <!-- CSS Dust Particles -->
    <div class="dust-container" id="dust-container"></div>

    <div class="game-container">
        <!-- Header: Top Left Status Bar -->
        <header>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <!-- Hero: Title & Orb -->
        <main class="hero-section">
            <h1 class="game-title">Aetherbound<div class="title-line"></div></h1>
            
            <div class="orb-container" id="summon-orb">
                <div class="orb-core"></div>
                <div class="orb-ring-inner"></div>
            </div>
        </main>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon Card (Primary) -->
            <div class="menu-card summon">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Solid Fill Icon -->
                    <path d="M12 2L9 9H2l6 4.5L5.5 22 12 17l6.5 5-2.5-8.5L22 9h-7z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card (Secondary) -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Line Art Icon -->
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card (Secondary) -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Line Art Icon -->
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card (Secondary) -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Line Art Icon -->
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        // --- CSS Particle Generator ---
        const dustContainer = document.getElementById('dust-container');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            
            // Random positioning
            const x = Math.random() * 100;
            const size = Math.random() * 2 + 1; // Smaller particles
            const duration = Math.random() * 15 + 10; // 10-25s
            const delay = Math.random() * 15;
            
            dust.style.left = `${x}%`;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.animationDuration = `${duration}s`;
            dust.style.animationDelay = `-${delay}s`;
            
            // Depth of field
            if (Math.random() > 0.6) {
                dust.style.filter = `blur(${Math.random() * 1.5}px)`;
            }

            dustContainer.appendChild(dust);
        }

        // --- Interactive Orb Parallax ---
        const orb = document.getElementById('summon-orb');
        const core = orb.querySelector('.orb-core');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Subtle movement for depth
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             core.style.transition = 'transform 0.5s ease-out';
             core.style.transform = `translate(0px, 0px)`;
             setTimeout(() => { core.style.transition = ''; }, 500);
        });

    </script>
</body>
</html>
