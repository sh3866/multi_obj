<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-panel: rgba(10, 10, 20, 0.6);
        --accent-gold: #d4af37;
        --accent-gold-bright: #ffdf73;
        --accent-gold-dim: #8a7020;
        --accent-mystic: #7b2cbf;
        --accent-glow: #9d4edd;
        --text-main: #f0f4f8;
        --text-muted: #8b9bb4;
        --border-light: rgba(255, 255, 255, 0.08);
        --border-glow: rgba(212, 175, 55, 0.3);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- Atmosphere & Background --- */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        /* Radial gradient vignette: darker edges, lighter center */
        background: radial-gradient(circle at 50% 40%, #1a1525 0%, #090910 60%, #000000 100%);
    }

    /* CSS Dust Particles */
    .dust-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
    }

    .dust {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.5; }
        100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    /* Main Layout */
    .game-container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 2rem;
        position: relative;
        z-index: 5;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: flex-end; /* Align right */
        align-items: center;
        padding: 0 1rem;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: linear-gradient(90deg, rgba(10,10,15,0.8), rgba(30,25,10,0.8));
        border: 1px solid var(--border-glow);
        padding: 0.6rem 1.8rem;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(8px);
    }

    .currency-icon {
        width: 22px;
        height: 22px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 4px var(--accent-gold));
    }

    .currency-amount {
        font-family: 'Georgia', serif;
        font-weight: bold;
        font-size: 1.2rem;
        color: var(--accent-gold-bright);
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section & Typography --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 1rem;
    }

    .game-title {
        font-family: 'Georgia', serif;
        font-size: 4.5rem;
        font-weight: 700; /* Increased weight */
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        /* High contrast gradient */
        background: linear-gradient(to bottom, #ffffff 20%, #a0a0a0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Outer glow */
        filter: drop-shadow(0 0 15px rgba(123, 44, 191, 0.4));
        margin-bottom: 2.5rem;
        position: relative;
        z-index: 2;
    }

    .title-line {
        content: '';
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        box-shadow: 0 0 10px var(--accent-gold);
    }

    /* --- Spirit Orb Overhaul --- */
    .orb-container {
        position: relative;
        width: 240px;
        height: 240px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2rem;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .orb-container:hover {
        transform: scale(1.08);
    }

    /* The Breathing Aura */
    .orb-aura {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(123, 44, 191, 0.3) 0%, rgba(0,0,0,0) 70%);
        animation: breathe 4s infinite ease-in-out;
        z-index: 0;
    }

    /* The Essence Core */
    .orb-core {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        /* Ethereal gradient: White -> Deep Purple */
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0aaff 40%, #3c096c 100%);
        /* Strong inner glow */
        box-shadow: 
            0 0 30px var(--accent-mystic), 
            0 0 60px rgba(157, 78, 221, 0.4),
            inset 0 0 20px rgba(255,255,255,0.8);
        position: relative;
        z-index: 2;
        animation: breathe-core 4s infinite ease-in-out;
    }

    /* Mystical Rings */
    .orb-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
    }

    .ring-1 { 
        width: 160px; height: 160px; 
        border: 1px solid rgba(212, 175, 55, 0.3); 
        border-top-color: transparent; 
        animation: spin 12s linear infinite; 
    }
    
    .ring-2 { 
        width: 200px; height: 200px; 
        border: 1px dashed rgba(255, 255, 255, 0.1); 
        animation: spin-rev 20s linear infinite; 
    }

    /* Animations */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.9; }
    }

    @keyframes breathe-core {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--accent-mystic); }
        50% { transform: scale(1.05); box-shadow: 0 0 50px var(--accent-mystic), 0 0 20px white; }
    }

    /* --- Menu Grid & Cards --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
    }

    /* Dark Glass Card Style */
    .menu-card {
        background: var(--bg-panel);
        /* Gold-to-transparent border trick using gradient background */
        background-image: linear-gradient(180deg, rgba(20,20,30,0.6), rgba(5,5,10,0.8));
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        height: 180px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    /* Card Hover Effects */
    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(30, 30, 45, 0.7);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        transform: scale(1.1);
    }

    /* --- Hierarchy: Summon Card --- */
    .menu-card.summon {
        /* Distinct Gold Border */
        border: 1px solid var(--accent-gold-dim);
        background: linear-gradient(180deg, rgba(40, 35, 20, 0.7), rgba(15, 10, 5, 0.8));
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
    }

    .menu-card.summon::before {
        /* Gold Shine */
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        box-shadow: 0 0 10px var(--accent-gold);
    }

    .menu-card.summon .card-title {
        color: var(--accent-gold-bright);
    }

    .menu-card.summon .card-icon {
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    .menu-card.summon:hover {
        border-color: var(--accent-gold);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
    }

    /* Card Content */
    .card-icon {
        width: 44px;
        height: 44px;
        fill: var(--text-muted);
        margin-bottom: 1rem;
        transition: all 0.3s ease;
    }

    .card-title {
        font-family: 'Georgia', serif;
        font-size: 1.3rem;
        font-weight: 700; /* Bolder */
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .card-subtitle {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-top: 0.4rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    /* Responsive */
    @media (max-width: 850px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .game-title {
            font-size: 3rem;
        }
        .game-container {
            padding: 1rem;
        }
    }
</style>
</head>
<body>

    <!-- Background Atmosphere -->
    <div id="atmosphere"></div>
    
    <!-- CSS Dust Particles -->
    <div class="dust-container" id="dust-container"></div>

    <div class="game-container">
        <header>
            <!-- Spacer removed, header aligns right via flex-end -->
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound<div class="title-line"></div></h1>
            
            <div class="orb-container" id="summon-orb">
                <!-- New Orb Structure -->
                <div class="orb-aura"></div>
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card (Primary Action) -->
            <div class="menu-card summon">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9 9H2l6 4.5L5.5 22 12 17l6.5 5-2.5-8.5L22 9h-7z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        // --- CSS Particle Generator ---
        // Generates random dust motes without canvas for better integration with CSS transforms
        const dustContainer = document.getElementById('dust-container');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            
            // Random positioning
            const x = Math.random() * 100;
            const size = Math.random() * 3 + 1;
            const duration = Math.random() * 10 + 10; // 10-20s
            const delay = Math.random() * 10;
            
            dust.style.left = `${x}%`;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.animationDuration = `${duration}s`;
            dust.style.animationDelay = `-${delay}s`; // Start immediately at random phases
            
            // Add a subtle blur to some particles for depth of field
            if (Math.random() > 0.5) {
                dust.style.filter = `blur(${Math.random()}px)`;
            }

            dustContainer.appendChild(dust);
        }

        // --- Interactive Orb Parallax ---
        const orb = document.getElementById('summon-orb');
        const core = orb.querySelector('.orb-core');
        const aura = orb.querySelector('.orb-aura');

        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            // Calculate mouse position relative to center of orb
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Move elements slightly opposite to mouse for depth
            // Core moves more than aura
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
            aura.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px) scale(${1 + (Math.abs(x)+Math.abs(y))/1000})`;
        });

        orb.addEventListener('mouseleave', () => {
             // Reset position smoothly
             core.style.transition = 'transform 0.5s ease-out';
             aura.style.transition = 'transform 0.5s ease-out';
             
             core.style.transform = `translate(0px, 0px)`;
             aura.style.transform = `translate(0px, 0px)`;

             // Remove transition after it completes so mousemove isn't laggy
             setTimeout(() => {
                 core.style.transition = '';
                 aura.style.transition = '';
             }, 500);
        });

    </script>
</body>
</html>
