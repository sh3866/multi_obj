<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #05020a;
        --bg-violet: #120824;
        --gold-primary: #d4af37;
        --gold-bright: #ffe680;
        --gold-dim: #5c4810;
        --mystic-purple: #7b2cbf;
        --mystic-glow: #9d4edd;
        --text-main: #ffffff;
        --text-muted: #a0aab5;
        
        /* Glass Material */
        --glass-bg: rgba(10, 10, 20, 0.3);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.15);
        --glass-blur: 16px;
        
        /* Typography */
        --font-display: 'Georgia', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-display); /* Unified Serif Font */
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Atmospheric Environment --- */
    .background-layer {
        position: fixed;
        inset: 0;
        z-index: -3;
        background: radial-gradient(circle at 50% 30%, var(--bg-violet) 0%, #000000 85%);
    }

    /* Noise Texture - Smoothed per critique */
    .noise-overlay {
        position: fixed;
        inset: 0;
        z-index: -2;
        opacity: 0.04;
        pointer-events: none;
        filter: blur(4px); /* Heavy Gaussian blur for smoothness */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout Structure --- */
    .game-container {
        width: 100%;
        max-width: 1000px;
        height: 100%;
        padding: 2rem;
        display: grid;
        grid-template-rows: auto 1fr auto; /* Header, Hero, Menu */
        gap: 1rem;
        position: relative;
        z-index: 5;
    }

    /* --- Header: Status Bar --- */
    header {
        display: flex;
        justify-content: flex-end;
        padding: 0 0.5rem;
        z-index: 10;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 0.4rem 1.2rem;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(8px);
    }

    .currency-icon {
        width: 18px;
        height: 18px;
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 2px var(--gold-primary));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
    }

    /* --- Hero Section: The Axis --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center; /* Center alignment for vertical axis */
        justify-content: center;
        position: relative;
        flex: 1; /* Takes available space */
    }

    /* 1. Title: Reduced Scale & Opacity */
    .game-title {
        font-family: var(--font-display);
        font-size: 2.4rem; /* Reduced by ~30% */
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0.8; /* Reduced opacity */
        filter: drop-shadow(0 0 10px rgba(157, 78, 221, 0.2));
        margin-bottom: 2rem;
        position: relative;
        z-index: 2;
    }

    /* 5. Enhanced Orb */
    .orb-container {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        margin-bottom: 2rem;
    }

    /* Summoning Circle */
    .summoning-circle {
        position: absolute;
        width: 140%;
        height: 140%;
        z-index: 0;
        opacity: 0.4;
        animation: spin-slow 60s linear infinite;
    }
    
    .summoning-circle svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 10px var(--mystic-purple));
    }

    /* 1. Axis Beam: Connecting Orb to Menu */
    .axis-beam {
        position: absolute;
        top: 100px; /* Starts below orb */
        bottom: -200px; /* Extends down to menu */
        width: 2px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(to bottom, var(--mystic-glow), transparent);
        opacity: 0.3;
        z-index: 0;
        pointer-events: none;
        /* Dashed style */
        background-size: 100% 20px;
        background-image: linear-gradient(to bottom, var(--mystic-glow) 0%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    }

    /* Core Orb - Increased Saturation & Breathing */
    .orb-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0aaff 20%, #7b2cbf 60%, #240046 100%); /* More saturated */
        box-shadow: 
            0 0 50px var(--mystic-purple), 
            0 0 100px rgba(157, 78, 221, 0.6),
            inset 0 0 25px rgba(255,255,255,0.8);
        position: relative;
        z-index: 2;
        animation: breathe 4s ease-in-out infinite; /* Breathing Animation */
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 50px var(--mystic-purple), 0 0 100px rgba(157, 78, 221, 0.4); }
        50% { transform: scale(1.08); box-shadow: 0 0 70px var(--mystic-purple), 0 0 120px rgba(157, 78, 221, 0.7); }
    }

    @keyframes spin-slow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
        position: relative;
        z-index: 10;
        margin-top: auto; /* Push to bottom */
    }

    /* 2. & 3. Glassmorphism Cards */
    .menu-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-top: 1px solid var(--glass-highlight);
        border-radius: 16px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        height: 160px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* Secondary Cards: Unify Glass, Thin Borders */
    .menu-card:not(.summon) {
        border-color: rgba(255, 255, 255, 0.05); /* Very faint border */
    }

    .menu-card:not(.summon):hover {
        transform: translateY(-5px);
        background: rgba(20, 20, 35, 0.5);
        border-color: rgba(157, 78, 221, 0.3); /* Faint purple on hover */
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    /* 2. Summon Card: The Rift */
    .menu-card.summon {
        background: linear-gradient(135deg, rgba(60, 50, 20, 0.4) 0%, rgba(10, 10, 20, 0.3) 100%);
        /* Pulsing Gold Border */
        border: 1px solid rgba(212, 175, 55, 0.4);
        box-shadow: 
            0 0 20px rgba(212, 175, 55, 0.1),
            inset 0 0 20px rgba(212, 175, 55, 0.05); /* Inner Glow */
        animation: pulse-border 4s infinite ease-in-out;
    }

    @keyframes pulse-border {
        0%, 100% { border-color: rgba(212, 175, 55, 0.4); box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }
        50% { border-color: rgba(255, 230, 128, 0.8); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
    }

    .menu-card.summon:hover {
        border-color: var(--gold-bright);
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.4), inset 0 0 30px rgba(212, 175, 55, 0.1);
    }

    /* Typography inside Cards */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.02em;
        margin-bottom: 0.3rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .menu-card.summon .card-title {
        color: var(--gold-bright);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .card-subtitle {
        font-family: var(--font-ui);
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* 4. Unified Iconography */
    .card-icon {
        width: 36px;
        height: 36px;
        margin-bottom: 1rem;
        transition: all 0.3s ease;
    }

    /* Consistent Stroke Weight for all icons */
    .menu-card .card-icon {
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* Secondary Icons: Silver/White */
    .menu-card:not(.summon) .card-icon {
        stroke: var(--text-muted);
    }

    .menu-card:not(.summon):hover .card-icon {
        stroke: var(--text-main);
        transform: scale(1.1);
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    }

    /* Primary Icon: Gold */
    .menu-card.summon .card-icon {
        stroke: var(--gold-primary);
        fill: rgba(212, 175, 55, 0.1); /* Subtle fill */
        filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.4));
    }
    
    .menu-card.summon:hover .card-icon {
        stroke: var(--gold-bright);
        fill: rgba(212, 175, 55, 0.2);
        transform: scale(1.1);
    }

    /* Responsive */
    @media (max-width: 850px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .game-title {
            font-size: 2rem;
        }
        .game-container {
            padding: 1rem;
        }
    }
</style>
</head>
<body>

    <!-- Background Atmosphere -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>

    <div class="game-container">
        <!-- Header: Top Right Status Bar -->
        <header>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <!-- Hero: Title & Orb -->
        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            
            <div class="orb-container" id="summon-orb">
                <!-- Summoning Circle SVG -->
                <div class="summoning-circle">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="48" stroke="#7b2cbf" stroke-width="0.5" fill="none" stroke-dasharray="2 4" />
                        <circle cx="50" cy="50" r="38" stroke="#9d4edd" stroke-width="0.5" fill="none" opacity="0.5" />
                        <path d="M50 2 L50 98 M2 50 L98 50" stroke="#7b2cbf" stroke-width="0.2" opacity="0.3" />
                        <path d="M20 20 L80 80 M20 80 L80 20" stroke="#7b2cbf" stroke-width="0.2" opacity="0.3" />
                        <polygon points="50,10 90,50 50,90 10,50" stroke="#9d4edd" stroke-width="0.5" fill="none" opacity="0.4" />
                    </svg>
                </div>
                
                <div class="orb-core"></div>
            </div>

            <!-- Axis Beam connecting Orb to Menu -->
            <div class="axis-beam"></div>
        </main>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon Card (Primary) -->
            <div class="menu-card summon">
                <!-- Distinct Icon: Star/Rift (Line Art Style) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card (Secondary) -->
            <div class="menu-card">
                <!-- Line Art Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card (Secondary) -->
            <div class="menu-card">
                <!-- Line Art Icon: Sword -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card (Secondary) -->
            <div class="menu-card">
                <!-- 4. Fix Iconography: Crystal/Anvil (Line Art) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6 3h12l4 6-10 13L2 9z" />
                    <path d="M12 22V9" />
                    <path d="M2 9h20" />
                    <path d="M6.5 3l3.5 6" />
                    <path d="M17.5 3l-3.5 6" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        // --- CSS Particle Generator ---
        const dustContainer = document.createElement('div');
        dustContainer.style.position = 'absolute';
        dustContainer.style.inset = '0';
        dustContainer.style.pointerEvents = 'none';
        dustContainer.style.zIndex = '1';
        document.body.appendChild(dustContainer);

        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const dust = document.createElement('div');
            
            // Random positioning
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 2 + 1;
            const duration = Math.random() * 20 + 15; 
            const delay = Math.random() * 20;
            
            dust.style.position = 'absolute';
            dust.style.left = `${x}%`;
            dust.style.top = `${y}%`;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.background = 'var(--mystic-glow)';
            dust.style.borderRadius = '50%';
            dust.style.opacity = Math.random() * 0.5;
            dust.style.boxShadow = '0 0 4px var(--mystic-glow)';
            dust.style.animation = `floatUp ${duration}s linear infinite`;
            dust.style.animationDelay = `-${delay}s`;
            
            // Depth of field
            if (Math.random() > 0.5) {
                dust.style.filter = `blur(${Math.random() * 2}px)`;
            }

            // Add keyframes dynamically if not present (simplification for inline JS)
            const style = document.createElement('style');
            if (!document.getElementById('floatStyle')) {
                style.id = 'floatStyle';
                style.innerHTML = `
                    @keyframes floatUp {
                        0% { transform: translateY(0) scale(0.5); opacity: 0; }
                        20% { opacity: 0.4; }
                        80% { opacity: 0.2; }
                        100% { transform: translateY(-100vh) scale(1); opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            dustContainer.appendChild(dust);
        }

        // --- Interactive Orb Parallax ---
        const orb = document.getElementById('summon-orb');
        const core = orb.querySelector('.orb-core');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             core.style.transition = 'transform 0.5s ease-out';
             core.style.transform = `translate(0px, 0px)`;
             setTimeout(() => { core.style.transition = ''; }, 500);
        });
    </script>
</body>
</html>
