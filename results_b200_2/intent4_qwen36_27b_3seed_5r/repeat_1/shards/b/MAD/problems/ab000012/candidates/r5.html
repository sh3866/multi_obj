<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Deep, Mystical */
        --bg-deep: #05020a;
        --bg-violet: #120824;
        --gold-primary: #d4af37;
        --gold-bright: #ffe680;
        --gold-dim: #5c4810;
        --mystic-purple: #7b2cbf;
        --mystic-glow: #9d4edd;
        --text-main: #ffffff;
        --text-muted: #a0aab5;
        
        /* Glass Material - Unified */
        --glass-bg: rgba(20, 20, 30, 0.6);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-highlight: rgba(255, 255, 255, 0.15);
        --glass-blur: 16px;
        
        /* Typography */
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Atmospheric Environment --- */
    .background-layer {
        position: fixed;
        inset: 0;
        z-index: -3;
        /* Rich radial gradient per Critique #1 */
        background: radial-gradient(circle at 50% 40%, #2e1065 0%, #0f0518 60%, #000000 100%);
    }

    .noise-overlay {
        position: fixed;
        inset: 0;
        z-index: -2;
        opacity: 0.05;
        pointer-events: none;
        filter: blur(2px);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout Structure --- */
    .game-container {
        width: 100%;
        max-width: 1100px;
        height: 100%;
        padding: 2rem;
        display: grid;
        grid-template-rows: auto 1fr auto; /* Header, Hero, Menu */
        gap: 1rem;
        position: relative;
        z-index: 5;
    }

    /* --- Header: Status Bar --- */
    header {
        display: flex;
        justify-content: flex-end;
        padding: 0 0.5rem;
        z-index: 10;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 0.5rem 1.5rem;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        backdrop-filter: blur(8px);
        transition: transform 0.3s ease;
    }
    
    .currency-pill:hover {
        transform: translateY(-2px);
        border-color: rgba(212, 175, 55, 0.6);
    }

    .currency-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 4px var(--gold-primary));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    /* --- Hero Section --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        flex: 1;
    }

    /* 2. Typography & Title Hierarchy (Critique #2) */
    .game-title {
        font-family: var(--font-display);
        font-size: 4.5rem; /* Large, primary focal point */
        font-weight: 800; /* Extra-bold */
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 3rem;
        position: relative;
        z-index: 2;
        
        /* Gold Gradient Text */
        background: linear-gradient(to bottom, #ffffff 20%, var(--gold-bright) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        
        /* Glow Shadow */
        filter: drop-shadow(0 0 15px rgba(123, 44, 191, 0.5));
        text-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    /* 1. Hero Area & Atmosphere (Critique #1) */
    .orb-container {
        position: relative;
        width: 240px;
        height: 240px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        margin-bottom: 2rem;
    }

    /* Rotating Geometric Ring */
    .summoning-circle {
        position: absolute;
        width: 150%;
        height: 150%;
        z-index: 0;
        opacity: 0.6;
        animation: spin-slow 40s linear infinite;
        border-radius: 50%;
        border: 1px dashed rgba(157, 78, 221, 0.4);
        box-shadow: 0 0 20px rgba(123, 44, 191, 0.2);
    }
    
    .summoning-circle::before {
        content: '';
        position: absolute;
        inset: 15px;
        border-radius: 50%;
        border: 1px solid rgba(157, 78, 221, 0.3);
        border-top-color: transparent;
        border-bottom-color: transparent;
        animation: spin-slow 25s linear infinite reverse;
    }

    /* Core Orb - Pulsing Animation */
    .orb-core {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        /* Mystical Gradient */
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0aaff 20%, #7b2cbf 60%, #240046 100%);
        position: relative;
        z-index: 2;
        
        /* CSS Glow (Box Shadow) */
        box-shadow: 
            0 0 60px var(--mystic-purple), 
            0 0 120px rgba(157, 78, 221, 0.6),
            inset 0 0 20px rgba(255,255,255,0.8);
            
        animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 60px var(--mystic-purple), 0 0 120px rgba(157, 78, 221, 0.6); }
        50% { transform: scale(1.05); box-shadow: 0 0 80px var(--mystic-purple), 0 0 150px rgba(157, 78, 221, 0.8); }
    }

    @keyframes spin-slow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
        position: relative;
        z-index: 10;
        margin-top: auto;
    }

    /* 3. Card System & Material (Critique #3) */
    .menu-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        height: 180px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* 5. Hover Effects */
    .menu-card:hover {
        transform: translateY(-8px) scale(1.02);
        background: rgba(30, 30, 45, 0.7);
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    /* 4. Summon Card Differentiation (Critique #4) */
    .menu-card.summon {
        /* Distinct Gold Border & Inner Glow */
        border: 1px solid rgba(212, 175, 55, 0.5);
        box-shadow: 
            0 0 20px rgba(212, 175, 55, 0.1),
            inset 0 0 25px rgba(212, 175, 55, 0.05);
        background: linear-gradient(180deg, rgba(40, 35, 20, 0.6) 0%, rgba(10, 10, 15, 0.6) 100%);
        animation: pulse-gold 4s infinite ease-in-out;
    }

    .menu-card.summon:hover {
        border-color: var(--gold-bright);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.3), inset 0 0 30px rgba(212, 175, 55, 0.15);
    }

    @keyframes pulse-gold {
        0%, 100% { border-color: rgba(212, 175, 55, 0.4); }
        50% { border-color: rgba(255, 230, 128, 0.8); box-shadow: 0 0 25px rgba(212, 175, 55, 0.2); }
    }

    /* Typography inside Cards */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .menu-card.summon .card-title {
        color: var(--gold-bright);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    .card-subtitle {
        font-family: var(--font-ui);
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        opacity: 0.8;
    }

    /* 5. Iconography & Polish (Critique #5) */
    .card-icon {
        width: 40px;
        height: 40px;
        margin-bottom: 1.2rem;
        transition: all 0.3s ease;
    }

    /* Unified Stroke */
    .menu-card .card-icon {
        fill: none;
        stroke-width: 2px; /* Consistent weight */
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* Secondary Icons */
    .menu-card:not(.summon) .card-icon {
        stroke: var(--text-muted);
    }

    .menu-card:not(.summon):hover .card-icon {
        stroke: var(--text-main);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
    }

    /* Primary Icon */
    .menu-card.summon .card-icon {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.5));
    }
    
    .menu-card.summon:hover .card-icon {
        stroke: var(--gold-bright);
        transform: scale(1.1);
    }

    /* Responsive */
    @media (max-width: 900px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .game-title {
            font-size: 3rem;
        }
        .game-container {
            padding: 1.5rem;
        }
    }
</style>
</head>
<body>

    <!-- Background Atmosphere -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>

    <div class="game-container">
        <!-- Header: Top Right Status Bar -->
        <header>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <!-- Hero: Title & Orb -->
        <main class="hero-section">
            <!-- Title is primary focal point -->
            <h1 class="game-title">Aetherbound</h1>
            
            <div class="orb-container" id="summon-orb">
                <!-- Rotating Ritual Ring -->
                <div class="summoning-circle"></div>
                
                <!-- Pulsing Core -->
                <div class="orb-core"></div>
            </div>
        </main>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon Card (Primary) -->
            <div class="menu-card summon">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card (Secondary) -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card (Secondary) -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card (Secondary) -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6 3h12l4 6-10 13L2 9z" />
                    <path d="M12 22V9" />
                    <path d="M2 9h20" />
                    <path d="M6.5 3l3.5 6" />
                    <path d="M17.5 3l-3.5 6" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        // --- CSS Particle Generator (Atmosphere) ---
        const dustContainer = document.createElement('div');
        dustContainer.style.position = 'absolute';
        dustContainer.style.inset = '0';
        dustContainer.style.pointerEvents = 'none';
        dustContainer.style.zIndex = '1';
        document.body.appendChild(dustContainer);

        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const dust = document.createElement('div');
            
            // Random positioning
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 2 + 1;
            const duration = Math.random() * 20 + 15; 
            const delay = Math.random() * 20;
            
            dust.style.position = 'absolute';
            dust.style.left = `${x}%`;
            dust.style.top = `${y}%`;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.background = 'var(--mystic-glow)';
            dust.style.borderRadius = '50%';
            dust.style.opacity = Math.random() * 0.4;
            dust.style.boxShadow = '0 0 4px var(--mystic-glow)';
            dust.style.animation = `floatUp ${duration}s linear infinite`;
            dust.style.animationDelay = `-${delay}s`;
            
            // Depth of field
            if (Math.random() > 0.5) {
                dust.style.filter = `blur(${Math.random() * 2}px)`;
            }

            const style = document.createElement('style');
            if (!document.getElementById('floatStyle')) {
                style.id = 'floatStyle';
                style.innerHTML = `
                    @keyframes floatUp {
                        0% { transform: translateY(0) scale(0.5); opacity: 0; }
                        20% { opacity: 0.4; }
                        80% { opacity: 0.2; }
                        100% { transform: translateY(-100vh) scale(1); opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            dustContainer.appendChild(dust);
        }

        // --- Interactive Orb Parallax ---
        const orb = document.getElementById('summon-orb');
        const core = orb.querySelector('.orb-core');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Subtle movement
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             core.style.transition = 'transform 0.5s ease-out';
             core.style.transform = `translate(0px, 0px)`;
             setTimeout(() => { core.style.transition = ''; }, 500);
        });
    </script>
</body>
</html>
