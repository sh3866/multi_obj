<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #05020a;
        --bg-violet: #120824;
        --gold-primary: #d4af37;
        --gold-bright: #ffe680;
        --gold-dim: #5c4810;
        --mystic-purple: #7b2cbf;
        --mystic-glow: #9d4edd;
        --text-main: #ffffff;
        --text-muted: #a0aab5;
        
        /* Glass Material */
        --glass-bg: rgba(10, 10, 20, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.1);
        --glass-blur: 12px;
        
        /* Typography */
        --font-display: 'Georgia', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Atmospheric Environment --- */
    .background-layer {
        position: fixed;
        inset: 0;
        z-index: -3;
        /* Deep radial gradient: Dark Violet to Black */
        background: radial-gradient(circle at 50% 30%, var(--bg-violet) 0%, #000000 85%);
    }

    /* Noise Texture */
    .noise-overlay {
        position: fixed;
        inset: 0;
        z-index: -2;
        opacity: 0.06;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* CSS Mist/Fog at the bottom */
    .fog-container {
        position: fixed;
        bottom: -20px;
        left: 0;
        width: 100%;
        height: 300px;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(to top, rgba(10, 5, 20, 0.95) 0%, transparent 100%);
        display: flex;
        align-items: flex-end;
        overflow: hidden;
    }

    .fog-layer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background: repeating-linear-gradient(90deg, transparent, rgba(157, 78, 221, 0.05) 50%, transparent 100%);
        filter: blur(20px);
        animation: driftFog 60s linear infinite;
    }

    .fog-layer:nth-child(2) {
        animation-duration: 40s;
        animation-direction: reverse;
        opacity: 0.5;
    }

    @keyframes driftFog {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* Dust Particles */
    .dust-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
    }

    .dust {
        position: absolute;
        background: var(--mystic-glow);
        border-radius: 50%;
        opacity: 0;
        box-shadow: 0 0 4px var(--mystic-glow);
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.4; }
        80% { opacity: 0.2; }
        100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    /* --- Layout Structure --- */
    .game-container {
        width: 100%;
        max-width: 1000px;
        height: 100%;
        padding: 2rem;
        display: grid;
        grid-template-rows: auto 1fr auto; /* Header, Hero (flex), Menu */
        gap: 2rem;
        position: relative;
        z-index: 5;
    }

    /* --- Header: Status Bar (Top Right) --- */
    header {
        display: flex;
        justify-content: flex-end; /* Move to right */
        padding: 0 0.5rem;
    }

    /* 5. Refined Details: Translucent Glowing Pill */
    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 0.4rem 1.2rem;
        border-radius: 50px; /* Pill shape */
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(8px);
        transition: all 0.3s ease;
    }

    .currency-pill:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    .currency-icon {
        width: 18px;
        height: 18px;
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 2px var(--gold-primary));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
    }

    /* --- Hero Section --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        /* Tighten spacing */
        margin-bottom: -1rem; 
    }

    /* 4. Typography: Reduced scale and opacity */
    .game-title {
        font-family: var(--font-display);
        font-size: 3.2rem; /* Reduced from 4rem */
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0.9;
        filter: drop-shadow(0 0 10px rgba(157, 78, 221, 0.2));
        margin-bottom: 1rem;
        position: relative;
        z-index: 2;
    }

    .title-line {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--mystic-glow), transparent);
    }

    /* --- Spirit Orb Portal --- */
    .orb-container {
        position: relative;
        width: 240px;
        height: 240px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 1. Summoning Circle Background */
    .summoning-circle {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.3;
        animation: spin-slow 40s linear infinite;
    }
    
    .summoning-circle svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 8px var(--mystic-purple));
    }

    .orb-container:hover {
        transform: scale(1.05);
    }

    /* Swirl Effect Pseudo-elements */
    .orb-container::before, .orb-container::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        pointer-events: none;
    }

    .orb-container::before {
        width: 110%;
        height: 110%;
        border-top: 1px solid rgba(157, 78, 221, 0.5);
        border-bottom: 1px solid rgba(157, 78, 221, 0.5);
        animation: spin 12s linear infinite;
    }

    .orb-container::after {
        width: 90%;
        height: 90%;
        border-left: 1px solid rgba(212, 175, 55, 0.4);
        border-right: 1px solid rgba(212, 175, 55, 0.4);
        animation: spin-rev 16s linear infinite;
    }

    /* Core */
    .orb-core {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0aaff 30%, #3c096c 80%, #000 100%);
        box-shadow: 
            0 0 40px var(--mystic-purple), 
            0 0 80px rgba(157, 78, 221, 0.4),
            inset 0 0 20px rgba(255,255,255,0.6);
        position: relative;
        z-index: 2;
        animation: pulse-core 4s ease-in-out infinite;
    }

    @keyframes spin-slow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes pulse-core {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--mystic-purple); }
        50% { transform: scale(1.06); box-shadow: 0 0 60px var(--mystic-purple), 0 0 30px white; }
    }

    /* --- Menu Grid & Cards --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
        /* Connect visually to orb */
        margin-top: -2rem; 
        align-self: end;
        margin-bottom: 2rem;
    }

    /* 2. Unified Card System: Ethereal Glass */
    .menu-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-top: 1px solid var(--glass-highlight);
        border-radius: 12px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        height: 140px; /* Reduced height */
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(20, 20, 35, 0.6);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    /* 3. Primary Action Hierarchy: Gold Glow & Gradient */
    .menu-card.summon {
        /* Subtle Gold Gradient Overlay */
        background: linear-gradient(135deg, rgba(40, 35, 15, 0.6) 0%, rgba(10, 10, 20, 0.4) 100%);
        /* Gold Border Glow */
        border: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.05);
    }

    .menu-card.summon::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--gold-bright);
        box-shadow: 0 0 8px var(--gold-primary);
    }

    .menu-card.summon:hover {
        border-color: rgba(212, 175, 55, 0.6);
        box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
    }

    .menu-card.summon .card-title {
        color: var(--gold-bright);
        text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    /* 5. Refined Details: Standardized Iconography */
    .card-icon {
        width: 32px; /* Standardized size */
        height: 32px;
        margin-bottom: 0.8rem;
        transition: all 0.3s ease;
    }

    /* Standardized Stroke Weight */
    .menu-card:not(.summon) .card-icon {
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .menu-card:not(.summon):hover .card-icon {
        stroke: var(--text-main);
        transform: scale(1.1);
    }

    /* Summon Icon (Distinct) */
    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
        stroke: none;
        filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.4));
    }
    
    .menu-card.summon:hover .card-icon {
        transform: scale(1.1);
        fill: var(--gold-bright);
    }

    /* Typography inside Cards */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.02em;
        margin-bottom: 0.2rem;
    }

    .card-subtitle {
        font-family: var(--font-ui);
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Responsive */
    @media (max-width: 850px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .game-title {
            font-size: 2.5rem;
        }
        .game-container {
            padding: 1rem;
        }
        .hero-section {
            margin-bottom: 0;
        }
    }
</style>
</head>
<body>

    <!-- Background Atmosphere -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>
    
    <!-- CSS Fog -->
    <div class="fog-container">
        <div class="fog-layer"></div>
        <div class="fog-layer"></div>
    </div>
    
    <!-- CSS Dust Particles -->
    <div class="dust-container" id="dust-container"></div>

    <div class="game-container">
        <!-- Header: Top Right Status Bar -->
        <header>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <!-- Hero: Title & Orb -->
        <main class="hero-section">
            <h1 class="game-title">Aetherbound<div class="title-line"></div></h1>
            
            <div class="orb-container" id="summon-orb">
                <!-- Summoning Circle SVG -->
                <div class="summoning-circle">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="48" stroke="#7b2cbf" stroke-width="0.5" fill="none" stroke-dasharray="2 4" />
                        <circle cx="50" cy="50" r="38" stroke="#9d4edd" stroke-width="0.5" fill="none" opacity="0.5" />
                        <path d="M50 2 L50 98 M2 50 L98 50" stroke="#7b2cbf" stroke-width="0.2" opacity="0.3" />
                        <path d="M20 20 L80 80 M20 80 L80 20" stroke="#7b2cbf" stroke-width="0.2" opacity="0.3" />
                        <polygon points="50,10 90,50 50,90 10,50" stroke="#9d4edd" stroke-width="0.5" fill="none" opacity="0.4" />
                    </svg>
                </div>
                
                <div class="orb-core"></div>
            </div>
        </main>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon Card (Primary) -->
            <div class="menu-card summon">
                <!-- Distinct Icon: Star/Rift -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card (Secondary) -->
            <div class="menu-card">
                <!-- Line Art Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card (Secondary) -->
            <div class="menu-card">
                <!-- Line Art Icon: Sword -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card (Secondary) -->
            <div class="menu-card">
                <!-- Line Art Icon: Pickaxe/Resource -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        // --- CSS Particle Generator ---
        const dustContainer = document.getElementById('dust-container');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            
            // Random positioning
            const x = Math.random() * 100;
            const size = Math.random() * 2 + 1;
            const duration = Math.random() * 20 + 15; 
            const delay = Math.random() * 20;
            
            dust.style.left = `${x}%`;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.animationDuration = `${duration}s`;
            dust.style.animationDelay = `-${delay}s`;
            
            // Depth of field
            if (Math.random() > 0.5) {
                dust.style.filter = `blur(${Math.random() * 2}px)`;
            }

            dustContainer.appendChild(dust);
        }

        // --- Interactive Orb Parallax ---
        const orb = document.getElementById('summon-orb');
        const core = orb.querySelector('.orb-core');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             core.style.transition = 'transform 0.5s ease-out';
             core.style.transform = `translate(0px, 0px)`;
             setTimeout(() => { core.style.transition = ''; }, 500);
        });
    </script>
</body>
</html>
