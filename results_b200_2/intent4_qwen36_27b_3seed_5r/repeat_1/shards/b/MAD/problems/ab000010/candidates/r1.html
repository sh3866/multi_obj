<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life // Bioluminescent System</title>
<style>
    :root {
        --bg-color: #030304;
        --panel-bg: rgba(12, 12, 14, 0.85);
        --text-main: #e0e0e0;
        --text-muted: #6b7080;
        --accent-magenta: #d00060;
        --accent-cyan: #00f3ff;
        --border-color: rgba(255, 255, 255, 0.08);
        --grid-unit: 8px;
        --font-stack: 'IBM Plex Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        background: radial-gradient(circle at 50% 50%, #0a0a0f 0%, #000000 100%);
        cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* UI Overlay Elements */
    .hud-top {
        position: absolute;
        top: calc(var(--grid-unit) * 3);
        left: calc(var(--grid-unit) * 3);
        pointer-events: none;
        z-index: 5;
    }
    .hud-title {
        font-size: 12px;
        letter-spacing: 1.5px;
        color: var(--accent-cyan);
        text-transform: uppercase;
        font-weight: 600;
        opacity: 0.9;
    }
    .hud-coords {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 4px;
        font-family: var(--font-stack);
    }

    /* Control Panel */
    aside {
        width: 340px;
        background: var(--panel-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-left: 1px solid var(--border-color);
        padding: calc(var(--grid-unit) * 4);
        display: flex;
        flex-direction: column;
        gap: calc(var(--grid-unit) * 4);
        z-index: 10;
        box-shadow: -15px 0 40px rgba(0,0,0,0.6);
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: calc(var(--grid-unit) * 2);
    }
    .panel-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
    }
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 9px;
        color: var(--accent-cyan);
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-cyan);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-cyan);
        animation: pulse 2s infinite ease-in-out;
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: calc(var(--grid-unit) * 1.5);
    }
    .label {
        font-size: 9px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 600;
    }

    /* Custom Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 2px;
        background: var(--text-main);
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 3px var(--text-muted);
        transition: box-shadow 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
        box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 3px var(--accent-cyan);
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 1px;
        background: rgba(255,255,255,0.15);
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: calc(var(--grid-unit) * 1.25);
    }
    button {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 10px;
        font-family: var(--font-stack);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 4px;
    }
    button:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.3);
    }
    button:active {
        transform: translateY(1px);
    }
    button.primary {
        background: rgba(0, 243, 255, 0.08);
        border-color: rgba(0, 243, 255, 0.3);
        color: var(--accent-cyan);
        grid-column: span 2;
        font-weight: 600;
    }
    button.primary:hover {
        background: rgba(0, 243, 255, 0.15);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
    }
    button.accent {
        border-color: rgba(208, 0, 96, 0.3);
        color: var(--accent-magenta);
    }
    button.accent:hover {
        background: rgba(208, 0, 96, 0.1);
        border-color: var(--accent-magenta);
    }

    /* Stats */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: calc(var(--grid-unit) * 2);
        margin-top: auto;
        padding-top: calc(var(--grid-unit) * 2);
        border-top: 1px solid var(--border-color);
    }
    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .stat-val {
        font-size: 18px;
        color: #fff;
        font-weight: 400;
        letter-spacing: -0.5px;
    }

    /* Footer */
    .footer {
        font-size: 8px;
        color: rgba(255,255,255,0.25);
        text-align: left;
        line-height: 1.6;
        margin-top: calc(var(--grid-unit) * 2);
    }

    @keyframes pulse {
        0% { opacity: 0.4; box-shadow: 0 0 2px var(--accent-cyan); }
        50% { opacity: 1; box-shadow: 0 0 10px var(--accent-cyan); }
        100% { opacity: 0.4; box-shadow: 0 0 2px var(--accent-cyan); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        <div class="hud-top">
            <div class="hud-title">Spherical Life // Bio-System</div>
            <div class="hud-coords" id="coords-display">LAT: 00.00 | LON: 00.00</div>
        </div>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">System Controls</div>
            <div class="status-indicator"><div class="status-dot"></div> ACTIVE</div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed</div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">Cell Density (Resolution)</div>
            <input type="range" id="resRange" min="20" max="80" value="40">
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="primary" id="btn-toggle">Pause / Play</button>
                <button class="accent" id="btn-reset">Randomize</button>
                <button id="btn-clear">Clear</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="label">Generation</span>
                <span class="stat-val" id="gen-count">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Population</span>
                <span class="stat-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="footer">
            RENDER: HTML5 CANVAS 2D<br>
            TOPOLOGY: SPHERICAL UV MAPPING<br>
            INTERACTION: CLICK TO SPAWN • DRAG TO ROTATE
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - High Fidelity
 * 
 * Rendering: 2D Canvas with 3D projection math.
 * Optimization: Instanced drawing logic, reduced shadow calculations.
 * Aesthetic: Bioluminescent, volumetric glow, depth cues.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base canvas
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 40; // Longitude steps
let rows = 20; // Latitude steps
let grid = [];
let nextGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; // ~30fps

// Camera / Rotation
let rotX = 0.2;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    // Handle High DPI
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        // 30% density for better visuals
        grid[i] = Math.random() > 0.7 ? 1 : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    updateStats();
}

// Helper to get index from x,y
function getIdx(x, y) {
    return y * cols + x;
}

// Get neighbor count (Torus/Sphere wrapping)
function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            
            // Wrap X (Longitude)
            let col = (x + i + cols) % cols;
            // Wrap Y (Latitude) - Top connects to Bottom
            let row = (y + j + rows) % rows;
            
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const state = grid[getIdx(x, y)];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[getIdx(x, y)] = 1;
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[getIdx(x, y)] = 0;
            } else {
                nextGrid[getIdx(x, y)] = state;
            }
        }
    }
    
    // Swap buffers
    let temp = grid;
    grid = nextGrid;
    nextGrid = temp;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    // Clear with a very slight fade for trails? No, clean clear for crispness.
    ctx.fillStyle = '#000000'; 
    // Note: The background gradient is handled by CSS on the container, 
    // but we need to clear the canvas area. We use transparent fill to let CSS show.
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    // Radius adapts to screen size
    const radius = Math.min(width, height) * 0.32;

    // Draw Grid Cells
    // Pre-calculate rotation sines/cosines
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);

    // Collect cells to draw to sort them by depth (painter's algorithm)
    // This ensures correct layering of glowing cells
    let renderList = [];

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                // Spherical Coordinates
                const phi = (y / rows) * Math.PI;
                const theta = (x / cols) * Math.PI * 2;

                // 3D Position
                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.sin(phi) * Math.sin(theta);
                let pz = radius * Math.cos(phi);

                // Rotate Y
                let px2 = px * cosY - pz * sinY;
                let pz2 = px * sinY + pz * cosY;
                
                // Rotate X
                let py2 = py * cosX - pz2 * sinX;
                let pz3 = py * sinX + pz2 * cosX;

                // Project
                const fov = 600;
                const scale = fov / (fov + pz3);
                
                const sx = cx + px2 * scale;
                const sy = cy + py2 * scale;
                
                // Bioluminescent Color Logic
                // Base color based on position (Lat/Lon) for a gradient effect
                // Cyan (Equator) -> Magenta (Poles)
                const normLat = Math.abs(py2) / radius; // 0 at equator, 1 at poles
                const r = Math.floor(255 * normLat);
                const g = Math.floor(100 * (1 - normLat));
                const b = 255;
                
                // Opacity based on depth (fog)
                // pz3 goes from -radius (front) to +radius (back)
                // Normalize to 0..1 where 1 is front
                let depthOpacity = (pz3 + radius) / (2 * radius); 
                depthOpacity = Math.max(0.1, Math.min(1, 1 - depthOpacity)); // Invert: front is bright

                renderList.push({
                    x: sx,
                    y: sy,
                    z: pz3, // Lower is closer
                    scale: scale,
                    color: `rgb(${r}, ${g}, ${b})`,
                    opacity: depthOpacity
                });
            }
        }
    }

    // Sort by Z (Painter's algorithm: draw back to front)
    renderList.sort((a, b) => b.z - a.z);

    // Draw Sphere Outline (Subtle)
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Draw Cells
    // Batch drawing for performance? Canvas doesn't support instancing easily.
    // We will draw individually but optimize shadowBlur.
    
    // Draw Back layer (dimmer)
    // Draw Front layer (brighter)
    
    for (let cell of renderList) {
        const size = Math.max(1.5, (radius / cols) * cell.scale * 0.9);
        
        // Only draw if in front of camera plane (roughly)
        if (cell.z < radius * 0.5) {
            
            ctx.globalAlpha = cell.opacity;
            ctx.fillStyle = cell.color;
            
            // Glow effect
            // Only apply heavy shadow to front-most cells for performance
            if (cell.z < 0) {
                ctx.shadowBlur = 6 * cell.scale;
                ctx.shadowColor = cell.color;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    // Auto rotate if not dragging
    if (autoRotate && !isDragging) {
        rotY += 0.004;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
// Mouse Drag to Rotate
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    // Update HUD coords
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Calculate fake spherical coords based on mouse pos relative to center
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const dx = x - cx;
    const dy = y - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxR = Math.min(rect.width, rect.height) * 0.32;
    
    if (dist < maxR) {
        const lat = (dy / maxR) * 90;
        const lon = (dx / maxR) * 180;
        document.getElementById('coords-display').innerText = 
            `LAT: ${lat.toFixed(2).padStart(6, '0')} | LON: ${lon.toFixed(2).padStart(6, '0')}`;
    }

    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    // Resume auto rotate after 3 seconds of inactivity
    setTimeout(() => {
        if(!isDragging) autoRotate = true;
    }, 3000);
});

// Click to spawn life
container.addEventListener('click', (e) => {
    // Spawn a cluster of life
    const count = 5 + Math.floor(Math.random() * 5);
    for(let i=0; i<count; i++) {
        const idx = Math.floor(Math.random() * grid.length);
        grid[idx] = 1;
    }
    updateStats();
});

// UI Controls
document.getElementById('btn-toggle').addEventListener('click', () => {
    isRunning = !isRunning;
    const dot = document.querySelector('.status-dot');
    const text = document.querySelector('.status-indicator');
    if(isRunning) {
        dot.style.animation = 'pulse 2s infinite ease-in-out';
        dot.style.backgroundColor = 'var(--accent-cyan)';
        dot.style.boxShadow = '0 0 8px var(--accent-cyan)';
        text.style.color = 'var(--accent-cyan)';
    } else {
        dot.style.animation = 'none';
        dot.style.backgroundColor = '#555';
        dot.style.boxShadow = 'none';
        text.style.color = '#555';
    }
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
