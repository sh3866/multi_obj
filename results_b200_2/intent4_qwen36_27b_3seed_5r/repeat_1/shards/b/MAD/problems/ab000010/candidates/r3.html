<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life // Bio-System</title>
<style>
    :root {
        --bg-color: #050507;
        --panel-bg: #0b0c10;
        --text-main: #ffffff;
        --text-muted: #6b7280;
        --accent-cyan: #00f3ff;
        --accent-green: #39ff14;
        --accent-orange: #ff9d00;
        --border-color: rgba(255, 255, 255, 0.08);
        --radius-card: 8px;
        --radius-btn: 4px;
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        -webkit-font-smoothing: antialiased;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        background: radial-gradient(circle at 50% 50%, #111116 0%, #000000 100%);
        cursor: grab;
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* Control Panel */
    aside {
        width: 320px;
        background: var(--panel-bg);
        border-left: 1px solid var(--border-color);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        z-index: 10;
    }

    /* Header - Reduced weight */
    .panel-header {
        margin-bottom: 8px;
    }
    .panel-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #fff;
        opacity: 0.9;
        text-transform: uppercase;
    }
    .panel-subtitle {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-green);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-green);
        animation: pulse 2s infinite ease-in-out;
    }

    /* Metrics */
    .metrics-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 16px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-card);
    }
    .metric-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .metric-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 600;
    }
    .metric-val {
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.5px;
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
    }
    .val-display {
        color: #fff;
    }

    /* Custom Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
        margin-top: 8px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
        background: var(--accent-cyan);
        box-shadow: 0 0 15px var(--accent-cyan);
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 8px;
    }
    
    /* Play/Pause Toggle */
    button.toggle-btn {
        grid-column: span 2;
        height: 44px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border-color);
        color: #fff;
        font-family: var(--font-stack);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: var(--radius-btn);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    button.toggle-btn:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.2);
    }
    
    /* Secondary Actions */
    button.secondary {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 10px;
        font-family: var(--font-stack);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: var(--radius-btn);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    button.secondary:hover {
        color: #fff;
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.2);
    }
    button.secondary:active {
        transform: translateY(1px);
    }

    /* Footer */
    .footer {
        margin-top: auto;
        font-size: 11px;
        color: rgba(255,255,255,0.4);
        line-height: 1.6;
        padding-top: 24px;
        border-top: 1px solid var(--border-color);
        font-weight: 500;
        letter-spacing: 0.5px;
    }

    @keyframes pulse {
        0% { opacity: 0.5; box-shadow: 0 0 2px var(--accent-green); }
        50% { opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
        100% { opacity: 0.5; box-shadow: 0 0 2px var(--accent-green); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">Spherical Life</div>
            <div class="panel-subtitle">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">System Active</span>
            </div>
        </div>

        <div class="metrics-container">
            <div class="metric-item">
                <span class="metric-label">Generation</span>
                <span class="metric-val" id="gen-count">0</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Population</span>
                <span class="metric-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed <span class="val-display" id="speed-val">30</span></div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">Resolution <span class="val-display" id="res-val">80</span></div>
            <input type="range" id="resRange" min="40" max="120" value="80">
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="toggle-btn" id="btn-toggle">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
                    <span id="btn-toggle-text">Pause</span>
                </button>
                <button class="secondary" id="btn-reset">Randomize</button>
                <button class="secondary" id="btn-clear">Clear Grid</button>
            </div>
        </div>

        <div class="footer">
            TOPOLOGY: SPHERICAL UV MAPPING<br>
            RENDER: HTML5 CANVAS 2D<br>
            INTERACTION: DRAG TO ROTATE • CLICK TO SPAWN
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - High Density Visual Edition
 * 
 * Improvements:
 * - High density grid (80x40 default, up to 120x60).
 * - Painter's algorithm with depth sorting.
 * - Volumetric glow simulation using additive blending and opacity masking.
 * - Smooth rotation physics.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 80; // Longitude steps (High density)
let rows = 40; // Latitude steps
let grid = []; // 0 or 1
let ages = []; // Integer age of cell
let nextGrid = [];
let nextAges = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; 

// Camera / Rotation
let rotX = 0.2;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Colors
const PALETTE = [
    '#00f3ff', // Cyan (Young)
    '#39ff14', // Neon Green
    '#ff9d00', // Electric Orange
    '#ff007f', // Hot Pink
    '#b300ff'  // Deep Purple (Old)
];

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    ages = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    nextAges = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.7 ? 1 : 0;
        ages[i] = Math.floor(Math.random() * 5);
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ages.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            const state = grid[idx];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                nextAges[idx] = 0; 
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                nextAges[idx] = 0;
            } else {
                nextGrid[idx] = state;
                nextAges[idx] = ages[idx] + 1; 
            }
        }
    }
    
    // Swap
    let tempG = grid; grid = nextGrid; nextGrid = tempG;
    let tempA = ages; ages = nextAges; nextAges = tempA;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.32;

    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);

    let renderList = [];

    // Pre-calculate grid geometry
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            // Spherical Coordinates
            const phi = (y / rows) * Math.PI;
            const theta = (x / cols) * Math.PI * 2;

            // 3D Position
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi) * Math.sin(theta);
            let pz = radius * Math.cos(phi);

            // Rotate Y
            let px2 = px * cosY - pz * sinY;
            let pz2 = px * sinY + pz * cosY;
            
            // Rotate X
            let py2 = py * cosX - pz2 * sinX;
            let pz3 = py * sinX + pz2 * cosX;

            // Project
            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            // Draw cell
            if (grid[getIdx(x, y)] === 1) {
                const age = ages[getIdx(x, y)];
                const color = PALETTE[age % PALETTE.length];
                
                // Depth opacity
                let depthOpacity = (pz3 + radius) / (2 * radius); 
                depthOpacity = Math.max(0.2, 1 - depthOpacity); 

                renderList.push({
                    type: 'cell',
                    x: sx,
                    y: sy,
                    z: pz3,
                    scale: scale,
                    color: color,
                    opacity: depthOpacity,
                    age: age
                });
            }
            
            // Draw Grid Lines (Connect to next neighbor)
            // Optimization: Only draw if visible enough or on back face for structure
            if (x < cols - 1) {
                 const theta2 = ((x+1) / cols) * Math.PI * 2;
                 let npx = radius * Math.sin(phi) * Math.cos(theta2);
                 let npy = radius * Math.sin(phi) * Math.sin(theta2);
                 let npz = radius * Math.cos(phi);
                 
                 let npx2 = npx * cosY - npz * sinY;
                 let npz2 = npx * sinY + npz * cosY;
                 let npy2 = npy * cosX - npz2 * sinX;
                 let npz3 = npy * sinX + npz2 * cosX;
                 
                 const nsx = cx + npx2 * scale;
                 const nsy = cy + npy2 * scale;
                 
                 // Draw line if at least one point is somewhat visible or to maintain back-sphere structure
                 renderList.push({
                     type: 'line',
                     x1: sx, y1: sy, x2: nsx, y2: nsy,
                     z: (pz3 + npz3)/2,
                     opacity: 0.05 
                 });
            }
            
            if (y < rows - 1) {
                 const phi2 = ((y+1) / rows) * Math.PI;
                 let npx = radius * Math.sin(phi2) * Math.cos(theta);
                 let npy = radius * Math.sin(phi2) * Math.sin(theta);
                 let npz = radius * Math.cos(phi2);
                 
                 let npx2 = npx * cosY - npz * sinY;
                 let npz2 = npx * sinY + npz * cosY;
                 let npy2 = npy * cosX - npz2 * sinX;
                 let npz3 = npy * sinX + npz2 * cosX;
                 
                 const nsx = cx + npx2 * scale;
                 const nsy = cy + npy2 * scale;

                 renderList.push({
                     type: 'line',
                     x1: sx, y1: sy, x2: nsx, y2: nsy,
                     z: (pz3 + npz3)/2,
                     opacity: 0.05
                 });
            }
        }
    }

    // Sort Back to Front
    renderList.sort((a, b) => b.z - a.z);

    // Draw Sphere Base (The dark volume)
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius);
    grad.addColorStop(0, '#1a1c24'); // Lightest part
    grad.addColorStop(0.6, '#0b0c10'); // Mid
    grad.addColorStop(1, '#050507'); // Edge
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    // Draw Items
    for (let item of renderList) {
        if (item.type === 'line') {
            ctx.beginPath();
            ctx.moveTo(item.x1, item.y1);
            ctx.lineTo(item.x2, item.y2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${item.opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        } else if (item.type === 'cell') {
            const size = Math.max(1, (radius / cols) * item.scale * 0.9);
            
            // Don't draw if too far back
            if (item.z > radius * 0.9) continue;

            ctx.globalAlpha = item.opacity;
            ctx.fillStyle = item.color;
            
            // Bloom effect: Larger blur for front cells
            if (item.z < 0) {
                ctx.shadowBlur = 12 * item.scale;
                ctx.shadowColor = item.color;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.arc(item.x, item.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
    
    // Atmospheric Rim Light
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
    ctx.stroke();
    ctx.restore();
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    if (autoRotate && !isDragging) {
        rotY += 0.002;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    setTimeout(() => {
        if(!isDragging) autoRotate = true;
    }, 2000);
});

container.addEventListener('click', (e) => {
    const count = 5 + Math.floor(Math.random() * 5);
    for(let i=0; i<count; i++) {
        const idx = Math.floor(Math.random() * grid.length);
        grid[idx] = 1;
        ages[idx] = 0;
    }
    updateStats();
});

// UI Controls
const btnToggle = document.getElementById('btn-toggle');
const btnToggleText = document.getElementById('btn-toggle-text');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

btnToggle.addEventListener('click', () => {
    isRunning = !isRunning;
    if(isRunning) {
        statusDot.style.backgroundColor = 'var(--accent-green)';
        statusDot.style.boxShadow = '0 0 8px var(--accent-green)';
        statusText.innerText = 'SYSTEM ACTIVE';
        statusText.style.color = 'var(--text-muted)';
        btnToggleText.innerText = 'Pause';
        btnToggle.style.borderColor = 'var(--border-color)';
    } else {
        statusDot.style.backgroundColor = '#555';
        statusDot.style.boxShadow = 'none';
        statusText.innerText = 'SYSTEM PAUSED';
        statusText.style.color = '#8b9bb4';
        btnToggleText.innerText = 'Resume';
        btnToggle.style.borderColor = 'rgba(255,255,255,0.3)';
    }
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('speed-val').innerText = val;
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('res-val').innerText = val;
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
