<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life // Bio-System</title>
<style>
    :root {
        --bg-color: #050507;
        --panel-bg: rgba(15, 16, 24, 0.65);
        --text-main: #ffffff;
        --text-muted: #8b9bb4;
        --accent-cyan: #00f3ff;
        --accent-purple: #b300ff;
        --accent-magenta: #ff007f;
        --border-color: rgba(255, 255, 255, 0.1);
        --glass-blur: blur(16px);
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        -webkit-font-smoothing: antialiased;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        background: radial-gradient(circle at 50% 50%, #111116 0%, #000000 100%);
        cursor: grab;
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* Control Panel - Glassmorphism */
    aside {
        width: 340px;
        background: var(--panel-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-left: 1px solid var(--border-color);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        z-index: 10;
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    /* Header */
    .panel-header {
        margin-bottom: 8px;
    }
    .panel-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #fff;
        background: linear-gradient(90deg, #fff, #b3cdd1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .panel-subtitle {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-top: 6px;
    }

    /* Metrics */
    .metrics-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .metric-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .metric-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 600;
    }
    .metric-val {
        font-size: 28px;
        font-weight: 700;
        color: #fff;
        font-variant-numeric: tabular-nums;
        letter-spacing: -1px;
        text-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
    }
    .val-display {
        color: var(--accent-cyan);
        font-weight: 700;
    }

    /* Custom Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
        margin-top: 12px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -7px; /* Center on track */
        box-shadow: 0 0 10px var(--accent-cyan), 0 0 4px #fff;
        transition: transform 0.1s;
        border: 2px solid var(--bg-color);
    }
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(0, 243, 255, 0.3));
        border-radius: 2px;
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
    }
    
    /* Main Action Button */
    button.toggle-btn {
        grid-column: span 2;
        height: 48px;
        background: #fff;
        border: none;
        color: #000;
        font-family: var(--font-stack);
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 15px rgba(255,255,255,0.2);
    }
    button.toggle-btn:hover {
        background: var(--accent-cyan);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        transform: translateY(-1px);
    }
    button.toggle-btn:active {
        transform: translateY(1px);
    }
    
    /* Ghost Buttons */
    button.secondary {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 12px;
        font-family: var(--font-stack);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    button.secondary:hover {
        color: #fff;
        background: rgba(255,255,255,0.05);
        border-color: var(--accent-cyan);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    button.secondary:active {
        transform: translateY(1px);
    }

    @keyframes pulse {
        0% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-cyan); }
        50% { opacity: 1; box-shadow: 0 0 10px var(--accent-cyan); }
        100% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-cyan); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">Spherical Life</div>
            <div class="panel-subtitle">
                <span id="status-text">Bio-System Active</span>
            </div>
        </div>

        <div class="metrics-container">
            <div class="metric-item">
                <span class="metric-label">Generation</span>
                <span class="metric-val" id="gen-count">0</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Population</span>
                <span class="metric-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed <span class="val-display" id="speed-val">30</span></div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">Grid Density <span class="val-display" id="res-val">140</span></div>
            <input type="range" id="resRange" min="80" max="200" value="140">
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="toggle-btn" id="btn-toggle">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
                    <span id="btn-toggle-text">Pause</span>
                </button>
                <button class="secondary" id="btn-reset">Randomize</button>
                <button class="secondary" id="btn-clear">Clear Grid</button>
            </div>
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - Bioluminescent Edition
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 140; // High density
let rows = 70; 
let grid = []; 
let ages = []; 
let nextGrid = [];
let nextAges = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; 

// Camera / Rotation
let rotX = 0.2;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Bioluminescent Palette
const PALETTE = [
    '#00f3ff', // Cyan (Young)
    '#00b3ff', // Electric Blue
    '#b300ff', // Deep Purple
    '#ff007f', // Magenta (Old)
    '#ffffff'  // White (Ancient/Core)
];

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    ages = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    nextAges = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
}

function randomize() {
    // High density start (45%)
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.55 ? 1 : 0;
        ages[i] = 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ages.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            const state = grid[idx];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                nextAges[idx] = 0; 
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                nextAges[idx] = 0;
            } else {
                nextGrid[idx] = state;
                nextAges[idx] = ages[idx] + 1; 
            }
        }
    }
    
    // Swap
    let tempG = grid; grid = nextGrid; nextGrid = tempG;
    let tempA = ages; ages = nextAges; nextAges = tempA;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.35;

    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);

    let renderList = [];

    // Pre-calculate grid geometry
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            // Spherical Coordinates
            const phi = (y / rows) * Math.PI;
            const theta = (x / cols) * Math.PI * 2;

            // 3D Position
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi) * Math.sin(theta);
            let pz = radius * Math.cos(phi);

            // Rotate Y
            let px2 = px * cosY - pz * sinY;
            let pz2 = px * sinY + pz * cosY;
            
            // Rotate X
            let py2 = py * cosX - pz2 * sinX;
            let pz3 = py * sinX + pz2 * cosX;

            // Project
            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            // Draw cell
            if (grid[getIdx(x, y)] === 1) {
                const age = ages[getIdx(x, y)];
                const color = PALETTE[age % PALETTE.length];
                
                // Depth opacity (fade back cells slightly)
                let depthOpacity = (pz3 + radius) / (2 * radius); 
                depthOpacity = Math.max(0.1, 1 - depthOpacity); 

                renderList.push({
                    type: 'cell',
                    x: sx,
                    y: sy,
                    z: pz3,
                    scale: scale,
                    color: color,
                    opacity: depthOpacity,
                    age: age
                });
            }
        }
    }

    // Sort Back to Front (Painter's Algorithm)
    renderList.sort((a, b) => b.z - a.z);

    // 1. Draw Sphere Base (The dark volume with radial gradient)
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    // Subtle lighting on the sphere itself
    const grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius);
    grad.addColorStop(0, '#1a1c24'); 
    grad.addColorStop(0.5, '#0b0c10'); 
    grad.addColorStop(1, '#050507'); 
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    // 2. Draw Items (Cells)
    // Use additive blending for bioluminescent effect
    ctx.globalCompositeOperation = 'lighter';
    
    for (let item of renderList) {
        if (item.type === 'cell') {
            // Size based on density
            const size = Math.max(1.5, (radius / cols) * item.scale * 1.1);
            
            // Don't draw if too far back (occluded)
            if (item.z > radius * 0.95) continue;

            ctx.globalAlpha = item.opacity;
            ctx.fillStyle = item.color;
            
            // Bloom effect: Stronger glow for front cells
            if (item.z < radius * 0.5) {
                ctx.shadowBlur = 15 * item.scale;
                ctx.shadowColor = item.color;
            } else {
                ctx.shadowBlur = 4 * item.scale;
                ctx.shadowColor = item.color;
            }

            ctx.beginPath();
            ctx.arc(item.x, item.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Reset Context
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
    
    // 3. Atmospheric Rim Light (Subtle)
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
    ctx.stroke();
    ctx.restore();
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    if (autoRotate && !isDragging) {
        rotY += 0.003;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    setTimeout(() => {
        if(!isDragging) autoRotate = true;
    }, 2000);
});

container.addEventListener('click', (e) => {
    const count = 5 + Math.floor(Math.random() * 5);
    for(let i=0; i<count; i++) {
        const idx = Math.floor(Math.random() * grid.length);
        grid[idx] = 1;
        ages[idx] = 0;
    }
    updateStats();
});

// UI Controls
const btnToggle = document.getElementById('btn-toggle');
const btnToggleText = document.getElementById('btn-toggle-text');
const statusText = document.getElementById('status-text');

btnToggle.addEventListener('click', () => {
    isRunning = !isRunning;
    if(isRunning) {
        statusText.innerText = 'BIO-SYSTEM ACTIVE';
        statusText.style.color = 'var(--text-muted)';
        btnToggleText.innerText = 'Pause';
        btnToggle.style.background = '#fff';
        btnToggle.style.color = '#000';
    } else {
        statusText.innerText = 'SYSTEM PAUSED';
        statusText.style.color = '#ff007f';
        btnToggleText.innerText = 'Resume';
        btnToggle.style.background = '#2a2a35';
        btnToggle.style.color = '#fff';
    }
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('speed-val').innerText = val;
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('res-val').innerText = val;
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
