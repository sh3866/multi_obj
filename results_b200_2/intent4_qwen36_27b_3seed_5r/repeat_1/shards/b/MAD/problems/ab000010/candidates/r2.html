<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life // Bio-System</title>
<style>
    :root {
        --bg-color: #050507;
        --panel-bg: rgba(18, 19, 24, 0.85);
        --text-main: #ffffff;
        --text-muted: #8b9bb4;
        --accent-cyan: #00f3ff;
        --accent-magenta: #ff007f;
        --accent-green: #39ff14;
        --accent-orange: #ff9d00;
        --border-color: rgba(255, 255, 255, 0.08);
        --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        -webkit-font-smoothing: antialiased;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        /* Deep space radial gradient */
        background: radial-gradient(circle at 50% 50%, #13151f 0%, #020203 100%);
        cursor: grab;
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* Control Panel */
    aside {
        width: 380px;
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-left: 1px solid var(--border-color);
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        z-index: 10;
        box-shadow: -20px 0 60px rgba(0,0,0,0.7);
    }

    /* Header */
    .panel-header {
        margin-bottom: 8px;
    }
    .panel-title {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #fff;
        line-height: 1;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #fff, #8b9bb4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .panel-subtitle {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--accent-cyan);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .status-dot {
        width: 8px;
        height: 8px;
        background-color: var(--accent-green);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-green);
        animation: pulse 2s infinite ease-in-out;
    }

    /* Metrics */
    .metrics-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 20px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border-color);
        border-radius: 12px;
    }
    .metric-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .metric-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 600;
    }
    .metric-val {
        font-size: 28px;
        font-weight: 700;
        color: #fff;
        font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .label {
        font-size: 12px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.5px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
    }
    .val-display {
        color: #fff;
    }

    /* Custom Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -7px;
        box-shadow: 0 0 0 4px rgba(0,0,0,0.5), 0 0 10px rgba(0,0,0,0.5);
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
        background: var(--accent-cyan);
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 8px;
    }
    button {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-color);
        color: #fff;
        padding: 14px;
        font-family: var(--font-stack);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    button:hover {
        background: rgba(255,255,255,0.1);
        transform: translateY(-1px);
    }
    button:active {
        transform: translateY(1px);
    }
    
    /* Play/Pause - Low weight */
    button.primary {
        grid-column: span 2;
        background: rgba(0,0,0,0.3);
        border-color: rgba(255,255,255,0.2);
    }
    
    /* Reset - Neutral Positive */
    button.reset {
        border-color: rgba(0, 243, 255, 0.3);
        color: var(--accent-cyan);
    }
    button.reset:hover {
        background: rgba(0, 243, 255, 0.1);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
    }

    /* Footer */
    .footer {
        margin-top: auto;
        font-size: 10px;
        color: rgba(255,255,255,0.3);
        line-height: 1.5;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
    }

    @keyframes pulse {
        0% { opacity: 0.5; box-shadow: 0 0 2px var(--accent-green); }
        50% { opacity: 1; box-shadow: 0 0 12px var(--accent-green); }
        100% { opacity: 0.5; box-shadow: 0 0 2px var(--accent-green); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">SPHERICAL LIFE</div>
            <div class="panel-subtitle">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">SYSTEM ACTIVE</span>
            </div>
        </div>

        <div class="metrics-container">
            <div class="metric-item">
                <span class="metric-label">Generation</span>
                <span class="metric-val" id="gen-count">0</span>
            </div>
            <div class="metric-item">
                <span class="metric-label">Population</span>
                <span class="metric-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed <span class="val-display" id="speed-val">30</span></div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">Resolution <span class="val-display" id="res-val">40</span></div>
            <input type="range" id="resRange" min="20" max="80" value="40">
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="primary" id="btn-toggle">Pause Simulation</button>
                <button class="reset" id="btn-reset">Randomize</button>
                <button id="btn-clear">Clear Grid</button>
            </div>
        </div>

        <div class="footer">
            TOPOLOGY: SPHERICAL UV MAPPING<br>
            RENDER: HTML5 CANVAS 2D<br>
            INTERACTION: DRAG TO ROTATE • CLICK TO SPAWN
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - Redesigned
 * 
 * Visuals: 
 * - Solid dark sphere volume with lighting gradient.
 * - Lat/Lon grid overlay.
 * - Cells colored by age (Time to Live) for multicolor effect.
 * - Painter's algorithm for depth sorting.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 40; // Longitude steps
let rows = 20; // Latitude steps
let grid = []; // 0 or 1
let ages = []; // Integer age of cell
let nextGrid = [];
let nextAges = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; 

// Camera / Rotation
let rotX = 0.2;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Colors
const PALETTE = [
    '#00f3ff', // Cyan (Young)
    '#39ff14', // Neon Green
    '#ff9d00', // Electric Orange
    '#ff007f', // Hot Pink
    '#b300ff'  // Deep Purple (Old)
];

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    ages = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    nextAges = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.6 ? 1 : 0;
        ages[i] = Math.floor(Math.random() * 5); // Random initial ages
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ages.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            const state = grid[idx];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                nextAges[idx] = 0; // Born fresh
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                nextAges[idx] = 0;
            } else {
                nextGrid[idx] = state;
                nextAges[idx] = ages[idx] + 1; // Age up
            }
        }
    }
    
    // Swap
    let tempG = grid; grid = nextGrid; nextGrid = tempG;
    let tempA = ages; ages = nextAges; nextAges = tempA;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.32;

    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);

    let renderList = [];

    // Pre-calculate grid geometry for lines and cells
    // We draw lines first in a separate pass or just put them in renderList with low Z priority?
    // For simplicity and depth sorting, we'll put grid lines in renderList too.

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            // Spherical Coordinates
            const phi = (y / rows) * Math.PI;
            const theta = (x / cols) * Math.PI * 2;

            // 3D Position
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi) * Math.sin(theta);
            let pz = radius * Math.cos(phi);

            // Rotate Y
            let px2 = px * cosY - pz * sinY;
            let pz2 = px * sinY + pz * cosY;
            
            // Rotate X
            let py2 = py * cosX - pz2 * sinX;
            let pz3 = py * sinX + pz2 * cosX;

            // Project
            const fov = 600;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            // Grid Lines (Lat/Lon)
            // Only draw lines on the "back" or "front" consistently? 
            // We draw them as segments.
            // Optimization: Only draw grid lines if they are on the "visible" side roughly, 
            // but painter's algo handles occlusion.
            
            // Draw cell
            if (grid[getIdx(x, y)] === 1) {
                const age = ages[getIdx(x, y)];
                // Color based on age cycle
                const color = PALETTE[age % PALETTE.length];
                
                // Depth opacity
                let depthOpacity = (pz3 + radius) / (2 * radius); 
                depthOpacity = Math.max(0.1, 1 - depthOpacity); 

                renderList.push({
                    type: 'cell',
                    x: sx,
                    y: sy,
                    z: pz3,
                    scale: scale,
                    color: color,
                    opacity: depthOpacity,
                    age: age
                });
            }
            
            // Draw Grid Lines (Connect to next neighbor)
            // We only draw "Right" and "Down" connections to avoid duplicates
            // But for 3D sorting, we need segments.
            // Simplified: Draw a small dot for the grid intersection if it's not a cell,
            // or just draw the lines as part of the sphere shell.
            
            // Let's draw the grid lines as a separate pass before cells for "surface" feel,
            // or integrate them. Let's integrate for correct depth.
            
            // Line to X+1
            if (x < cols - 1) {
                 // Calculate neighbor
                 const theta2 = ((x+1) / cols) * Math.PI * 2;
                 let npx = radius * Math.sin(phi) * Math.cos(theta2);
                 let npy = radius * Math.sin(phi) * Math.sin(theta2);
                 let npz = radius * Math.cos(phi);
                 // Rotate
                 let npx2 = npx * cosY - npz * sinY;
                 let npz2 = npx * sinY + npz * cosY;
                 let npy2 = npy * cosX - npz2 * sinX;
                 let npz3 = npy * sinX + npz2 * cosX;
                 const nsx = cx + npx2 * scale; // Approx scale
                 const nsy = cy + npy2 * scale;
                 
                 renderList.push({
                     type: 'line',
                     x1: sx, y1: sy, x2: nsx, y2: nsy,
                     z: (pz3 + npz3)/2,
                     opacity: (pz3 < 0) ? 0.15 : 0.05 // Dimmer in back
                 });
            }
            
            // Line to Y+1
            if (y < rows - 1) {
                 const phi2 = ((y+1) / rows) * Math.PI;
                 let npx = radius * Math.sin(phi2) * Math.cos(theta);
                 let npy = radius * Math.sin(phi2) * Math.sin(theta);
                 let npz = radius * Math.cos(phi2);
                 // Rotate
                 let npx2 = npx * cosY - npz * sinY;
                 let npz2 = npx * sinY + npz * cosY;
                 let npy2 = npy * cosX - npz2 * sinX;
                 let npz3 = npy * sinX + npz2 * cosX;
                 const nsx = cx + npx2 * scale;
                 const nsy = cy + npy2 * scale;

                 renderList.push({
                     type: 'line',
                     x1: sx, y1: sy, x2: nsx, y2: nsy,
                     z: (pz3 + npz3)/2,
                     opacity: (pz3 < 0) ? 0.15 : 0.05
                 });
            }
        }
    }

    // Sort Back to Front
    renderList.sort((a, b) => b.z - a.z);

    // Draw Sphere Surface (The "Dark Solid" look)
    // We draw a circle behind everything with a gradient to fake the volume
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    // Deep charcoal / midnight blue gradient
    const grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius);
    grad.addColorStop(0, '#2a2d3e'); // Lightest part (highlight)
    grad.addColorStop(0.4, '#15161e'); // Mid
    grad.addColorStop(1, '#050507'); // Edge (matches bg)
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Inner shadow / rim light
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
    ctx.stroke();
    ctx.restore();

    // Draw Items
    for (let item of renderList) {
        if (item.type === 'line') {
            ctx.beginPath();
            ctx.moveTo(item.x1, item.y1);
            ctx.lineTo(item.x2, item.y2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${item.opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        } else if (item.type === 'cell') {
            const size = Math.max(1.5, (radius / cols) * item.scale * 0.8);
            
            // Optimization: Don't draw if too far back
            if (item.z > radius * 0.8) continue;

            ctx.globalAlpha = item.opacity;
            ctx.fillStyle = item.color;
            
            // Glow logic
            if (item.z < 0) {
                ctx.shadowBlur = 8 * item.scale;
                ctx.shadowColor = item.color;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.arc(item.x, item.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    if (autoRotate && !isDragging) {
        rotY += 0.003;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    setTimeout(() => {
        if(!isDragging) autoRotate = true;
    }, 2000);
});

container.addEventListener('click', (e) => {
    // Spawn life
    const count = 5 + Math.floor(Math.random() * 5);
    for(let i=0; i<count; i++) {
        const idx = Math.floor(Math.random() * grid.length);
        grid[idx] = 1;
        ages[idx] = 0;
    }
    updateStats();
});

// UI Controls
const btnToggle = document.getElementById('btn-toggle');
btnToggle.addEventListener('click', () => {
    isRunning = !isRunning;
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if(isRunning) {
        dot.style.backgroundColor = 'var(--accent-green)';
        dot.style.boxShadow = '0 0 8px var(--accent-green)';
        text.innerText = 'SYSTEM ACTIVE';
        text.style.color = 'var(--accent-cyan)';
        btnToggle.innerText = 'Pause Simulation';
    } else {
        dot.style.backgroundColor = '#555';
        dot.style.boxShadow = 'none';
        text.innerText = 'SYSTEM PAUSED';
        text.style.color = '#8b9bb4';
        btnToggle.innerText = 'Resume Simulation';
    }
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('speed-val').innerText = val;
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('res-val').innerText = val;
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
