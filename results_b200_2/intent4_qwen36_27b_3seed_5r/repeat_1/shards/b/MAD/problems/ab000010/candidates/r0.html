<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERICAL LIFE // SYSTEM</title>
<style>
    :root {
        --bg-color: #050505;
        --panel-bg: rgba(10, 10, 12, 0.65);
        --text-main: #e0e0e0;
        --text-muted: #888890;
        --accent-cyan: #00f3ff;
        --accent-pink: #ff0055;
        --accent-green: #00ff9d;
        --border-color: rgba(255, 255, 255, 0.1);
        --font-stack: 'Courier New', Courier, monospace;
        --panel-width: 320px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        background: radial-gradient(circle at center, #1a1a24 0%, #000000 70%);
        cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* UI Overlay Elements */
    .hud-top {
        position: absolute;
        top: 20px;
        left: 20px;
        pointer-events: none;
    }
    .hud-title {
        font-size: 14px;
        letter-spacing: 2px;
        color: var(--accent-cyan);
        text-transform: uppercase;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }
    .hud-coords {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 5px;
    }

    /* Control Panel */
    aside {
        width: var(--panel-width);
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-left: 1px solid var(--border-color);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        z-index: 10;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 15px;
    }
    .panel-title {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 1px;
        color: #fff;
    }
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--accent-green);
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-green);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-green);
        animation: pulse 2s infinite;
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
    }

    /* Sliders */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.2);
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    button {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 12px;
        font-family: var(--font-stack);
        font-size: 11px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    button:hover {
        background: rgba(255,255,255,0.1);
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
    }
    button:active {
        transform: translateY(1px);
    }
    button.primary {
        background: rgba(0, 243, 255, 0.1);
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        grid-column: span 2;
    }
    button.danger {
        color: var(--accent-pink);
        border-color: rgba(255,0,85,0.3);
    }
    button.danger:hover {
        background: rgba(255,0,85,0.1);
        border-color: var(--accent-pink);
        box-shadow: 0 0 15px rgba(255,0,85,0.1);
    }

    /* Stats */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: auto;
    }
    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .stat-val {
        font-size: 16px;
        color: #fff;
    }

    /* Footer */
    .footer {
        font-size: 9px;
        color: rgba(255,255,255,0.3);
        text-align: center;
        margin-top: 20px;
        line-height: 1.4;
    }

    @keyframes pulse {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        <div class="hud-top">
            <div class="hud-title">Spherical Life // v.0.9</div>
            <div class="hud-coords" id="coords-display">LAT: 00.00 | LON: 00.00</div>
        </div>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">CONTROLS</div>
            <div class="status-indicator"><div class="status-dot"></div> SIMULATION ACTIVE</div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed</div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">Resolution (Cell Density)</div>
            <input type="range" id="resRange" min="20" max="80" value="40">
        </div>

        <div class="control-group">
            <div class="label">Color Theme</div>
            <div class="btn-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                <button onclick="setTheme('neon')">Neon</button>
                <button onclick="setTheme('heat')">Heat</button>
                <button onclick="setTheme('matrix')">Mono</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="primary" id="btn-toggle">Pause / Play</button>
                <button class="danger" id="btn-reset">Randomize</button>
                <button id="btn-clear">Clear All</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="label">Generation</span>
                <span class="stat-val" id="gen-count">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Population</span>
                <span class="stat-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="footer">
            RENDER ENGINE: HTML5 CANVAS 2D<br>
            LOGIC: CONWAY'S GOL (TOPOLOGY: SPHERICAL)<br>
            INTERACTION: CLICK TO SPAWN • DRAG TO ROTATE
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life
 * 
 * Logic:
 * 1. Grid is mapped to a UV sphere (Lat/Lon).
 * 2. Neighbors are calculated by checking the 8 surrounding cells in the 2D array.
 * 3. Array edges wrap around (Longitude).
 * 4. Poles (Latitude) are handled: top row wraps to bottom row (conceptually), 
 *    though visually they are single points. For the grid logic, the top row neighbors 
 *    include the bottom row.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 40; // Longitude steps
let rows = 20; // Latitude steps
let grid = [];
let nextGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; // ~30fps
let theme = 'neon'; // neon, heat, matrix

// Camera / Rotation
let rotX = 0;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Themes
const themes = {
    neon: {
        bg: '#050505',
        cell: (age) => {
            // Cyan to Purple based on age (randomized per cell for visual noise)
            const r = Math.floor(255 * Math.random()); 
            const g = Math.floor(255 * Math.random()); 
            const b = 255;
            return `rgba(${r}, ${g}, ${b}, 0.8)`;
        },
        wireframe: 'rgba(0, 243, 255, 0.15)',
        glow: '#00f3ff'
    },
    heat: {
        bg: '#050000',
        cell: () => {
            const colors = ['#ff0000', '#ff5500', '#ffaa00', '#ffff00'];
            return colors[Math.floor(Math.random() * colors.length)];
        },
        wireframe: 'rgba(255, 69, 0, 0.15)',
        glow: '#ff4500'
    },
    matrix: {
        bg: '#000500',
        cell: () => '#00ff00',
        wireframe: 'rgba(0, 255, 0, 0.1)',
        glow: '#00ff00'
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.7 ? 1 : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    updateStats();
}

// Helper to get index from x,y
function getIdx(x, y) {
    return y * cols + x;
}

// Get neighbor count (Torus/Sphere wrapping)
function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            
            // Wrap X (Longitude)
            let col = (x + i + cols) % cols;
            // Wrap Y (Latitude) - Top connects to Bottom
            let row = (y + j + rows) % rows;
            
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const state = grid[getIdx(x, y)];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[getIdx(x, y)] = 1;
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[getIdx(x, y)] = 0;
            } else {
                nextGrid[getIdx(x, y)] = state;
            }
        }
    }
    
    // Swap buffers
    let temp = grid;
    grid = nextGrid;
    nextGrid = temp;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    // Radius adapts to screen size, max 40% of smallest dim
    const radius = Math.min(width, height) * 0.35;

    // Draw subtle wireframe/lat-long lines for 3D context
    ctx.strokeStyle = themes[theme].wireframe;
    ctx.lineWidth = 1;
    
    // Horizontal lines (Latitudes)
    for (let i = 0; i < rows; i++) {
        const phi = (i / rows) * Math.PI;
        const r = radius * Math.sin(phi);
        const z = radius * Math.cos(phi);
        
        // Only draw if facing camera (simplified)
        if (Math.cos(phi + rotX) > -0.1) {
             ctx.beginPath();
             // Simple ellipse approximation for the latitude ring
             // In a real 3D engine we'd transform points, but for this stylized view:
             // We'll just draw the active cells, the wireframe is purely aesthetic background
        }
    }
    
    // Draw Grid Cells
    // We iterate the logical grid and project to 3D, then 2D
    
    // Current rotation
    const thetaY = rotY;
    const thetaX = rotX;

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                // Spherical Coordinates
                // Phi (0 to PI) from top to bottom
                // Theta (0 to 2PI) around
                const phi = (y / rows) * Math.PI;
                const theta = (x / cols) * Math.PI * 2;

                // 3D Position
                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.sin(phi) * Math.sin(theta);
                let pz = radius * Math.cos(phi);

                // Rotate Y
                let px2 = px * Math.cos(thetaY) - pz * Math.sin(thetaY);
                let pz2 = px * Math.sin(thetaY) + pz * Math.cos(thetaY);
                
                // Rotate X
                let py2 = py * Math.cos(thetaX) - pz2 * Math.sin(thetaX);
                let pz3 = py * Math.sin(thetaX) + pz2 * Math.cos(thetaX);

                // Project
                // Simple perspective
                const fov = 400;
                const scale = fov / (fov + pz3);
                
                const sx = cx + px2 * scale;
                const sy = cy + py2 * scale;
                const size = Math.max(1, (radius / cols) * scale * 0.8); // Size depends on resolution

                // Draw only if in front of camera
                if (pz3 < 0) { 
                    ctx.fillStyle = themes[theme].cell();
                    // Add glow
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = themes[theme].glow;
                    
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.shadowBlur = 0; // Reset for performance
                }
            }
        }
    }
    
    // Draw Sphere Outline (The "Glass" look)
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Draw Equator highlight
    ctx.strokeStyle = themes[theme].wireframe;
    ctx.beginPath();
    ctx.ellipse(cx, cy, radius, radius * Math.cos(thetaX), 0, 0, Math.PI * 2);
    ctx.stroke();
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    // Auto rotate if not dragging
    if (autoRotate && !isDragging) {
        rotY += 0.005;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
// Mouse Drag to Rotate
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    // Update HUD coords
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    // Fake coordinates for visual flair
    document.getElementById('coords-display').innerText = 
        `X: ${x.toFixed(0)} | Y: ${y.toFixed(0)} | Z: ${Math.floor(Math.random()*100)}`;

    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.01;
        rotX += dy * 0.01;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
    // Resume auto rotate after 2 seconds of inactivity? (Optional, keeping it manual for now)
});

// Click to spawn life (Raycasting approximation)
container.addEventListener('click', (e) => {
    // Simple logic: just toggle a random cell if user clicks the canvas
    // Implementing true 3D picking is heavy for this snippet, 
    // so we'll just randomize a patch near the "front"
    const idx = Math.floor(Math.random() * grid.length);
    grid[idx] = 1;
    updateStats();
});

// UI Controls
document.getElementById('btn-toggle').addEventListener('click', () => {
    isRunning = !isRunning;
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    // Invert value: higher slider = lower interval (faster)
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    // Re-init grid with new resolution
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2); // Aspect ratio
    initGrid();
});

function setTheme(name) {
    theme = name;
    document.body.style.backgroundColor = themes[name].bg;
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
