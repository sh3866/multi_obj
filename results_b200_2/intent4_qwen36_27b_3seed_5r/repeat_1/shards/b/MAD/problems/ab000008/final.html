<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-purple: #bc13fe;
            --neon-white: #ffffff;
            --grid-color: #4a007a;
            --pixel-size: 4px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            /* System fonts fallback for pixel feel */
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- CRT / Retro Effects --- */
        
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 998;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Push content down slightly to give sun breathing room */
            padding-top: 15vh; 
            pointer-events: none;
        }

        /* Title Composition */
        .title-wrapper {
            position: relative;
            text-align: center;
            z-index: 10;
            margin-bottom: 4rem; /* Increased space between title and buttons */
            /* Fix 4: Dark backing box for readability */
            background: rgba(5, 0, 17, 0.6); 
            padding: 20px 40px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(2px);
        }

        /* Sun Background */
        .retro-sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: linear-gradient(to bottom, #ffcc00 0%, #ff0055 100%);
            clip-path: circle(50% at 50% 50%);
            z-index: -1; /* Behind title text */
            filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.6));
        }
        
        /* Pixel Stripes for Sun */
        .retro-sun::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 12px,
                var(--bg-dark) 12px,
                var(--bg-dark) 24px
            );
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); /* Bottom half only */
            margin-top: 15%; /* Offset stripes slightly */
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -4px;
            position: relative;
        }

        /* "PIXEL" Styling */
        .word-pixel {
            color: var(--neon-white);
            display: block;
            position: relative;
            text-shadow: 4px 4px 0px var(--neon-pink);
        }

        /* Chromatic Aberration */
        .word-pixel::before, .word-pixel::after {
            content: "PIXEL";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .word-pixel::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-3px, 0);
            clip-path: inset(0 0 50% 0);
            animation: glitch-1 2s infinite linear alternate-reverse;
        }

        .word-pixel::after {
            color: var(--neon-pink);
            z-index: -2;
            transform: translate(3px, 0);
            clip-path: inset(50% 0 0 0);
            animation: glitch-2 3s infinite linear alternate-reverse;
        }

        /* "DANCE" Styling */
        .word-dance {
            color: var(--neon-white);
            display: block;
            text-shadow: 4px 4px 0px var(--neon-cyan);
        }

        /* Glitch Animations */
        @keyframes glitch-1 {
            0% { clip-path: inset(10% 0 80% 0); }
            20% { clip-path: inset(80% 0 5% 0); }
            40% { clip-path: inset(40% 0 20% 0); }
            60% { clip-path: inset(10% 0 60% 0); }
            80% { clip-path: inset(30% 0 10% 0); }
            100% { clip-path: inset(50% 0 30% 0); }
        }
        @keyframes glitch-2 {
            0% { clip-path: inset(60% 0 10% 0); }
            20% { clip-path: inset(20% 0 70% 0); }
            40% { clip-path: inset(10% 0 40% 0); }
            60% { clip-path: inset(50% 0 20% 0); }
            80% { clip-path: inset(10% 0 80% 0); }
            100% { clip-path: inset(30% 0 50% 0); }
        }

        /* --- Buttons --- */

        /* Heroic CTA: START */
        .btn-start {
            pointer-events: auto;
            background: var(--neon-cyan);
            border: 4px solid var(--neon-white);
            /* Fix 1: Dark text for contrast */
            color: #000000; 
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 2.2rem;
            padding: 15px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* Fix 5: Glow effect */
            box-shadow: 0 0 15px var(--neon-cyan), 6px 6px 0px rgba(0,0,0,0.5); 
            margin-bottom: 30px;
            letter-spacing: 2px;
            /* Fix 1: Ensure it sits below sun (handled by margin-top on wrapper, but explicit z-index helps) */
            z-index: 50; 
        }

        .btn-start:hover {
            transform: translate(-2px, -2px);
            box-shadow: 0 0 25px var(--neon-cyan), 10px 10px 0px var(--neon-pink);
            background: var(--neon-white);
        }

        .btn-start:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 5px var(--neon-cyan), 0px 0px 0px var(--neon-pink);
        }

        /* Secondary Navigation Group */
        .menu-options {
            display: flex;
            gap: 40px;
            pointer-events: auto;
            z-index: 200;
            background: linear-gradient(to top, var(--bg-dark) 20%, transparent 100%);
            padding: 20px;
            border-radius: 20px;
        }

        .menu-link {
            color: var(--neon-white);
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem; /* Fix 3: Smaller size */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 8px 24px;
            background: rgba(5, 0, 17, 0.6);
            border: 1px solid rgba(255,255,255,0.3); /* Fix 3: Lower contrast border */
            transition: all 0.2s;
        }

        .menu-link:hover {
            background: var(--neon-pink);
            color: var(--bg-dark);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transform: translateY(-2px);
        }

        /* Canvas Container */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .btn-start { font-size: 1.5rem; padding: 12px 40px; }
            .menu-options { gap: 15px; flex-direction: column; align-items: center;}
            .retro-sun { width: 220px; height: 220px; }
            #ui-layer { padding-top: 5vh; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene (Background + Highway) -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        
        <div class="title-wrapper">
            <!-- Neon Sun Background -->
            <div class="retro-sun"></div>
            
            <h1>
                <span class="word-pixel">PIXEL</span>
                <span class="word-dance">DANCE</span>
            </h1>
        </div>

        <button class="btn-start" onclick="startGame()">START GAME</button>

        <div class="menu-options">
            <a class="menu-link" onclick="alert('Options Menu Placeholder')">Options</a>
            <a class="menu-link" onclick="alert('Credits Menu Placeholder')">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        
        // Disable smoothing for pixel art look
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;

        // Colors
        const COLORS = {
            bg: '#050011',
            grid: '#6a00a8', // Stronger purple
            gridLight: '#b300ff',
            lanes: ['#ff00ff', '#00ffff', '#ffff00', '#ffffff'],
            hitLine: '#ffffff'
        };

        // Stars
        const stars = [];
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4,
                size: Math.random() * 2 + 1,
                alpha: Math.random()
            });
        }

        // Notes
        const notes = [];
        let noteTimer = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 2 + star.x * 10));
                // Draw square stars
                ctx.fillRect(Math.floor(star.x * width), Math.floor(star.y * height), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawGrid() {
            const horizonY = height * 0.35; // Horizon line
            const centerX = width / 2;
            
            // 1. Vertical Perspective Lines (4 Lanes)
            // The grid starts narrow at horizon and expands to fill screen at bottom
            const bottomWidth = width * 1.5; 
            const topWidth = 0; // Converge to a point
            
            ctx.lineWidth = 2;
            ctx.strokeStyle = COLORS.grid;

            // Draw 5 vertical lines to create 4 lanes
            for (let i = 0; i <= 4; i++) {
                // Calculate X position at bottom
                const bottomX = (centerX - bottomWidth/2) + (i * (bottomWidth / 4));
                // Top X is always center (vanishing point)
                const topX = centerX; 

                ctx.beginPath();
                ctx.moveTo(topX, horizonY);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Moving Lines
            const speed = 0.002;
            const totalLines = 15;
            const spacing = 1.0 / totalLines;
            
            ctx.beginPath();
            
            // We draw lines from horizon (t=0) to bottom (t=1)
            // We offset 't' by time to create movement
            let t = (time * 0.5) % spacing;
            
            while(t <= 1) {
                // Perspective curve: y = horizon + (height-horizon) * t^2
                // This makes lines bunch up at horizon
                const y = horizonY + (height - horizonY) * (t * t);
                
                // Width at this Y: w = bottomWidth * t
                const currentWidth = bottomWidth * t;
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;
                
                // Line opacity fades near horizon
                ctx.globalAlpha = Math.min(1, t * 2);
                ctx.lineWidth = 1 + t * 3; // Thicker lines closer to camera
                
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                
                t += spacing;
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        function spawnNote() {
            // Spawn rhythmically
            if (noteTimer > 40) { 
                const lane = Math.floor(Math.random() * 4);
                notes.push({
                    lane: lane,
                    t: 0, // 0 = horizon, 1 = bottom
                    active: true
                });
                noteTimer = 0;
            }
            noteTimer++;
        }

        function drawNotes() {
            const horizonY = height * 0.35;
            const centerX = width / 2;
            const bottomWidth = width * 1.5;
            const noteSpeed = 0.008;

            notes.forEach(note => {
                note.t += noteSpeed; 
                
                if (note.t >= 1) {
                    note.active = false;
                    return;
                }

                // Perspective Math
                const y = horizonY + (height - horizonY) * (note.t * note.t);
                const currentWidth = bottomWidth * note.t;
                const laneWidth = currentWidth / 4;
                
                // Center of the specific lane
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Size scales with distance
                const noteSize = 10 + (60 * note.t); 

                const color = COLORS.lanes[note.lane];
                
                // Draw Glow (Pixelated block behind)
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.4;
                ctx.fillRect(laneX - noteSize/2 - 4, y - noteSize/2 - 4, noteSize + 8, noteSize + 8);
                ctx.globalAlpha = 1.0;

                // Draw Main Block
                ctx.fillStyle = color;
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner Highlight
                ctx.fillStyle = '#fff';
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            // Hit line is at approx 15% from bottom
            // Convert Y percentage to 't' value for perspective math
            // y = h + (H-h)*t^2  =>  (y-h)/(H-h) = t^2  => t = sqrt(...)
            const horizonY = height * 0.35;
            const hitY = height * 0.85; // 15% from bottom
            const centerX = width / 2;
            const bottomWidth = width * 1.5;
            
            const t = Math.sqrt((hitY - horizonY) / (height - horizonY));
            const currentWidth = bottomWidth * t;

            // Fix 5: Enhance Atmosphere - Add a stronger glow to the hit line
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
            
            // Glow
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillRect(centerX - currentWidth/2, hitY - 6, currentWidth, 12);

            // Core Line
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(centerX - currentWidth/2, hitY - 2, currentWidth, 4);
            
            // Reset shadow for other elements
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, width, height);

            time += 0.01;

            drawStarfield();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.style.transform = 'scale(0.95)';
            btn.style.boxShadow = 'none';
            setTimeout(() => {
                btn.innerHTML = 'LOADING...';
                setTimeout(() => {
                    alert('Audio Engine Initialized. Game Start.');
                    btn.innerHTML = 'START GAME';
                    btn.style.transform = 'scale(1)';
                }, 500);
            }, 100);
        }

        animate();

    </script>
</body>
</html>
