<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --bg-light: #1a0b2e;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --grid-color: rgba(255, 0, 255, 0.3);
            --lane-1: #ff00ff;
            --lane-2: #00ffff;
            --lane-3: #00ffff;
            --lane-4: #ff00ff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* System font fallback for pixel vibe */
        }

        /* CRT Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            animation: scanlineScroll 10s linear infinite;
        }

        @keyframes scanlineScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Canvas Container */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through to canvas if needed, but we have buttons */
        }

        /* Title */
        .title-container {
            margin-bottom: 60px;
            text-align: center;
            position: relative;
            pointer-events: auto;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: 4px;
            transform: skewX(-10deg);
            animation: titleFloat 3s ease-in-out infinite;
        }

        h1 span {
            display: block;
            font-size: 2rem;
            color: var(--neon-yellow);
            letter-spacing: 12px;
            margin-top: 10px;
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        /* Glitch Effect Keyframes */
        @keyframes titleFloat {
            0%, 100% { transform: skewX(-10deg) translateY(0); }
            50% { transform: skewX(-10deg) translateY(-10px); }
        }

        /* Start Button */
        .btn-start {
            pointer-events: auto;
            background: transparent;
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 0px var(--neon-cyan);
            transform: scale(1.05);
        }

        .btn-start::before {
            content: 'PRESS TO START';
        }

        /* Sub-menu */
        .menu-options {
            margin-top: 30px;
            display: flex;
            gap: 40px;
            pointer-events: auto;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            transition: color 0.2s;
            cursor: pointer;
        }

        .menu-link:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            h1 span { font-size: 1.2rem; letter-spacing: 5px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>Pixel<br>Dance</h1>
            <span>Rhythm Protocol</span>
        </div>

        <button class="btn-start" onclick="startGame()"></button>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Configuration for the Highway
        const lanes = [
            { x: 0, color: '#ff00ff', glow: '#ff00ff' },
            { x: 0, color: '#00ffff', glow: '#00ffff' },
            { x: 0, color: '#00ffff', glow: '#00ffff' },
            { x: 0, color: '#ff00ff', glow: '#ff00ff' }
        ];
        
        // Configuration for the Sun
        const sunY = 0.35; // Percentage of height
        const sunSize = 150;
        
        // Stars
        const stars = [];
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.3, // Only in sky
                size: Math.random() * 2 + 1,
                alpha: Math.random()
            });
        }

        // Notes
        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Calculate lane positions based on screen width
            // We want a perspective trapezoid
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.8, 600);
            const topWidth = 100;
            const laneSpacingBottom = bottomWidth / 4;
            
            // Update lane positions for rendering logic
            // We store the left-offset of each lane at the bottom
            lanes.forEach((lane, i) => {
                lane.bottomX = centerX - (bottomWidth/2) + (i * laneSpacingBottom);
            });
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.05 + star.x * 10));
                ctx.fillRect(star.x * width, star.y * height, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Glow
            const grd = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 3);
            grd.addColorStop(0, 'rgba(255, 0, 255, 0.4)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffff00'; // Retro yellow
            ctx.fill();
            
            // Horizontal Stripes (The "Blind" look)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050011'; // Cut out color (background color)
            const stripeHeight = 8;
            for(let y = cy; y < cy + r; y += stripeHeight + 5) {
                ctx.fillRect(cx - r, y, r * 2, stripeHeight);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            
            // Vertical Lines (Perspective)
            // We draw lines radiating from the vanishing point (center, horizonY)
            // to the bottom lane markers.
            
            ctx.lineWidth = 2;
            
            // Draw the 5 vertical lines defining the 4 lanes
            for (let i = 0; i <= 4; i++) {
                // Calculate x at bottom
                // Interpolate between a narrow point at top and wide at bottom
                const bottomX = centerX - (Math.min(width * 0.8, 600)/2) + (i * (Math.min(width * 0.8, 600) / 4));
                const topX = centerX - 50 + (i * (100/4));

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 0, 255, 0.4)';
                ctx.moveTo(topX, horizonY);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // Horizontal Lines (Moving)
            // Logarithmic spacing for perspective effect
            const speed = 0.002;
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            for (let i = 0; i < 20; i++) {
                // Map linear t [0, 1] to perspective y
                // t=0 is horizon, t=1 is bottom
                // We use a power function to bunch lines up at the horizon
                const t = (i / 20 + time) % 1;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                
                // Calculate width at this Y
                // Linear interpolation of width based on t
                const currentWidth = 100 + (Math.min(width * 0.8, 600) - 100) * Math.pow(t, 1.5); // Slight curve on width expansion
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            
            // Fade out near horizon
            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, 'rgba(255, 0, 255, 0)');
            grad.addColorStop(0.1, 'rgba(255, 0, 255, 0.8)');
            grad.addColorStop(1, 'rgba(255, 0, 255, 1)');
            
            ctx.strokeStyle = grad;
            ctx.stroke();
        }

        function spawnNote() {
            if (Math.random() < 0.05) {
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, // 0 = horizon, 1 = bottom
                    active: true
                });
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;

            notes.forEach(note => {
                note.t += 0.005; // Note speed
                if (note.t > 1.2) note.active = false;

                // Perspective math
                const t = note.t;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                const currentWidth = 100 + (Math.min(width * 0.8, 600) - 100) * Math.pow(t, 1.5);
                
                // Lane X calculation
                const laneWidth = currentWidth / 4;
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Draw Note
                const noteSize = 10 + (40 * Math.pow(t, 1.5)); // Scale up as it gets closer
                
                ctx.fillStyle = lanes[note.lane].color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = lanes[note.lane].glow;
                
                // Draw a square note
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                ctx.shadowBlur = 0;
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            // Place hit line near bottom
            const t = 0.9; 
            const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
            const currentWidth = 100 + (Math.min(width * 0.8, 600) - 100) * Math.pow(t, 1.5);
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            
            // Draw Hit Line (The "Target" area)
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = 'LOADING...';
            // Visual feedback only for this demo
            setTimeout(() => {
                alert('Initializing Audio Engine... (Demo End)');
                btn.innerHTML = 'PRESS TO START';
            }, 500);
        }

        animate();

    </script>
</body>
</html>
