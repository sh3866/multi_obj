<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-white: #ffffff;
            --grid-color: #2a004d;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Critical for crisp text */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* --- CRT / Retro Effects --- */
        
        /* Scanlines - Hard Edges */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.5) 2px,
                rgba(0,0,0,0.5) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.8;
            image-rendering: pixelated;
        }

        /* Vignette - Hard Edges */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 998;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; 
        }

        /* Title Container */
        .title-container {
            margin-bottom: 20px; /* Tighter spacing for subtitle */
            text-align: center;
            position: relative;
            z-index: 200;
            pointer-events: auto;
        }

        /* CRITIQUE 1: Strict Bitmap Font styling */
        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 4.5rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            /* Hard pixel shadow, no blur */
            text-shadow: 4px 4px 0px var(--neon-pink);
            position: relative;
            letter-spacing: -4px;
        }

        /* Glitch Animation - Pixelated movement */
        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 0); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(2px, 0); }
            40% { clip-path: inset(40% 0 20% 0); transform: translate(-2px, 0); }
            60% { clip-path: inset(10% 0 60% 0); transform: translate(2px, 0); }
            80% { clip-path: inset(30% 0 10% 0); transform: translate(-1px, 0); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(1px, 0); }
        }

        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
        }

        h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--neon-cyan);
            clip-path: inset(0 0 0 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--neon-yellow);
            clip-path: inset(0 0 0 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        /* CRITIQUE 6: Subtitle Breathing Room */
        .subtitle {
            display: block;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            color: var(--neon-yellow);
            margin-top: 10px; /* Tight to title */
            margin-bottom: 60px; /* Big gap to button */
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #000;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* --- Buttons --- */

        /* CRITIQUE 4: Demoted START button (Ghost style) */
        .btn-start {
            pointer-events: auto;
            background: transparent;
            border: 2px solid var(--neon-cyan); /* Thinner border */
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.5rem;
            padding: 15px 40px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* Hard pixel glow via box-shadow, NO blur */
            box-shadow: 
                4px 4px 0px var(--neon-cyan),
                inset 4px 4px 0px rgba(0,255,255,0.1);
            text-shadow: 2px 2px 0px #000;
            z-index: 200;
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: #000;
            /* Remove shadow on hover for stark contrast */
            box-shadow: none;
            transform: translate(-2px, -2px);
            text-shadow: none;
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* CRITIQUE 5: Secondary Navigation (High Contrast, Negative Space) */
        .menu-options {
            display: flex;
            gap: 60px;
            pointer-events: auto;
            z-index: 200;
            margin-top: 30px;
        }

        .menu-link {
            color: #ffffff; /* High contrast white */
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 5px 10px;
            background: #050011; /* Match BG to hide grid lines behind */
            border: 1px solid #ffffff;
            transition: all 0.1s;
        }

        .menu-link:hover {
            background: #ffffff;
            color: #000;
            box-shadow: 4px 4px 0px var(--neon-pink);
        }

        /* Canvas Container */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* CRITIQUE 3: Pixelated rendering */
            image-rendering: pixelated; 
        }

        @media (max-width: 600px) {
            h1 { font-size: 3rem; letter-spacing: -1px; }
            .btn-start { font-size: 1.2rem; padding: 12px 30px; }
            .menu-options { gap: 20px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene (Background + Highway) -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <span class="subtitle">Rhythm Protocol</span>
        </div>

        <button class="btn-start" onclick="startGame()">START GAME</button>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        
        // CRITIQUE 3: Disable smoothing for pixel art look
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;

        // Colors
        const COLORS = {
            bg: '#050011',
            grid: '#2a004d', // Darker purple for grid
            gridHighlight: '#ff00ff',
            sun: '#ffff00',
            lanes: ['#ff00ff', '#00ffff', '#ffff00', '#ffffff'],
            notes: ['#ff00ff', '#00ffff', '#ffff00', '#ffffff']
        };

        // Stars
        const stars = [];
        for(let i=0; i<80; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4,
                size: Math.random() * 3 + 1,
                alpha: Math.random()
            });
        }

        // Notes
        const notes = [];
        let noteTimer = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                // Pixel square
                ctx.fillRect(Math.floor(star.x * width), Math.floor(star.y * height), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * 0.25; // Moved up slightly
            const r = Math.min(width, height) * 0.12; 

            // CRITIQUE 3: No ShadowBlur, use solid layers for glow
            // Outer Glow (Layer 1)
            ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
            ctx.fillRect(cx - r - 10, cy - r - 10, (r * 2) + 20, (r * 2) + 20);
            
            // Sun Body
            ctx.fillStyle = COLORS.sun;
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

            // Retro Stripes (Hard edges)
            ctx.save();
            ctx.beginPath();
            // Use a rect clip to simulate circle-ish or just keep it square for retro feel
            ctx.rect(cx - r, cy - r, r * 2, r * 2);
            ctx.clip();
            
            ctx.fillStyle = COLORS.bg;
            // Draw horizontal bars
            for(let y = cy; y < cy + r; y += 6) {
                const distFromCenter = (y - cy) / r; 
                const barHeight = 4 + (distFromCenter * 12);
                ctx.fillRect(cx - r, y, r * 2, barHeight);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.3;
            const centerX = width / 2;
            
            // CRITIQUE 2: Vertical 4-Lane Structure
            // We make the grid wider and more distinct
            const bottomWidth = width * 2.0; 
            const topWidth = 0; 
            
            ctx.lineWidth = 2;
            ctx.strokeStyle = COLORS.gridHighlight;
            
            // 1. Vertical Lines (4 Lanes = 5 lines)
            for (let i = 0; i <= 4; i++) {
                const bottomX = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = centerX; 

                ctx.beginPath();
                ctx.moveTo(topX, horizonY);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving)
            // Use a simpler linear spacing for a more "digital" look
            const speed = 2;
            const totalLines = 20;
            const spacing = (height - horizonY) / totalLines;
            const offset = (time * 200) % spacing;

            ctx.beginPath();
            for (let i = 0; i < totalLines; i++) {
                // Calculate Y position moving up
                let y = horizonY + (i * spacing) + offset;
                
                // Perspective fade (closer to horizon = smaller width)
                const ratio = (y - horizonY) / (height - horizonY);
                
                // Skip if off screen
                if (y < horizonY || y > height) continue;

                // Width interpolation
                const currentWidth = bottomWidth * Math.pow(ratio, 1.5); // Slight curve
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;
                
                // Only draw every Nth line to keep it clean, or use the offset logic
                // Here we just draw the active lines based on offset
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            ctx.stroke();
        }

        function spawnNote() {
            // Spawn rhythmically
            if (noteTimer > 20) { 
                const lane = Math.floor(Math.random() * 4);
                notes.push({
                    lane: lane,
                    t: 0, 
                    active: true
                });
                noteTimer = 0;
            }
            noteTimer++;
        }

        function drawNotes() {
            const horizonY = height * 0.3;
            const centerX = width / 2;
            const bottomWidth = width * 2.0;

            notes.forEach(note => {
                note.t += 0.008; // Speed
                
                if (note.t >= 1) {
                    note.active = false;
                    return;
                }

                // CRITIQUE 2 & 3: Distinct blocks, hard edges
                const y = horizonY + (Math.pow(note.t, 2)) * (height - horizonY);
                const dy = y - horizonY;
                const ratio = dy / (height - horizonY);
                const currentWidth = bottomWidth * Math.pow(ratio, 1.5);
                
                const laneWidth = currentWidth / 4;
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Size based on perspective
                const noteSize = 15 + (70 * ratio); 

                const color = COLORS.notes[note.lane];
                
                // CRITIQUE 3: Pixelated Glow (Solid Rects)
                // Outer Glow
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.4;
                ctx.fillRect(laneX - noteSize/2 - 4, y - noteSize/2 - 4, noteSize + 8, noteSize + 8);
                ctx.globalAlpha = 1.0;

                // Main Block
                ctx.fillStyle = color;
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner Highlight (White)
                ctx.fillStyle = '#fff';
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * 0.3;
            const centerX = width / 2;
            const bottomWidth = width * 2.0;
            
            // CRITIQUE 2: Distinct Hit Line
            const t = 0.95; // Closer to bottom
            const y = horizonY + (Math.pow(t, 2)) * (height - horizonY);
            const ratio = Math.pow(t, 1.5); // Match grid curve
            const currentWidth = bottomWidth * ratio;

            // Glow (Solid)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(centerX - currentWidth/2, y - 2, currentWidth, 8);

            // Core Line
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(centerX - currentWidth/2, y, currentWidth, 2);
        }

        function animate() {
            // Clear
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, width, height);

            time += 0.01;

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.style.transform = 'scale(0.95)';
            btn.style.boxShadow = 'none';
            setTimeout(() => {
                btn.innerHTML = 'LOADING...';
                setTimeout(() => {
                    alert('Audio Engine Initialized. Game Start.');
                    btn.innerHTML = 'START GAME';
                    btn.style.transform = 'scale(1)';
                }, 500);
            }, 100);
        }

        animate();

    </script>
</body>
</html>
