<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --font-pixel: 'Courier New', Courier, monospace; /* Fallback for offline system font */
            --font-ui: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-pixel);
        }

        /* 
           Scanlines: Reduced opacity and applied only to foreground via CSS masking or 
           separate layer to keep background stars crisp.
        */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            /* Reduced opacity to prevent muddying */
            opacity: 0.6; 
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Canvas Container */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Typography Overhaul: Pixel Art Identity */
        .title-container {
            margin-bottom: 60px;
            text-align: center;
            position: relative;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: 4.5rem;
            margin: 0;
            line-height: 1.1;
            text-transform: uppercase;
            color: #fff;
            /* Chunky pixel shadow */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: 2px;
            /* Removed skew to keep it chunky/retro, added float animation */
            transform: translateY(0);
            animation: titleFloat 4s ease-in-out infinite;
            position: relative;
        }

        /* Glitch Effect on Pixel Font */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark); /* Match bg to hide original */
        }

        h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--neon-cyan);
            clip-path: inset(0 0 0 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--neon-pink);
            clip-path: inset(0 0 0 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 60% 0); }
            100% { clip-path: inset(30% 0 30% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 10% 0); }
            40% { clip-path: inset(80% 0 5% 0); }
            60% { clip-path: inset(10% 0 80% 0); }
            80% { clip-path: inset(50% 0 20% 0); }
            100% { clip-path: inset(0% 0 90% 0); }
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            color: var(--neon-yellow);
            letter-spacing: 8px;
            margin-top: 15px;
            text-shadow: 0 0 10px var(--neon-yellow);
            font-weight: bold;
        }

        /* Button Polish: High Contrast, Clean */
        .btn-start {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan), 2px 2px 0px #000;
            letter-spacing: 2px;
            margin-bottom: 30px;
            /* No internal lines */
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--neon-cyan), inset 0 0 0px var(--neon-cyan);
            transform: scale(1.05);
            text-shadow: none;
        }

        /* Secondary Menu: Legibility & Hierarchy */
        .menu-options {
            margin-top: 10px;
            display: flex;
            gap: 50px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-family: var(--font-ui); /* Geometric Sans */
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .menu-link:hover {
            color: #fff;
            text-shadow: 0 0 8px #fff;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            h1 span { font-size: 1rem; letter-spacing: 4px; }
            .btn-start { font-size: 1.2rem; padding: 15px 40px; }
            .menu-options { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <!-- Data-text attribute used for glitch duplication -->
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <span>Rhythm Protocol</span>
        </div>

        <button class="btn-start" onclick="startGame()">PRESS TO START</button>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Configuration for the Highway
        // Explicit 4 lanes with distinct colors
        const laneConfig = [
            { color: '#ff00ff', glow: '#ff00ff' }, // Magenta
            { color: '#00ffff', glow: '#00ffff' }, // Cyan
            { color: '#00ffff', glow: '#00ffff' }, // Cyan
            { color: '#ff00ff', glow: '#ff00ff' }  // Magenta
        ];
        
        // Configuration for the Sun
        const sunY = 0.35; // Percentage of height
        const sunSize = 150;
        
        // Stars
        const stars = [];
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4, // Sky area
                size: Math.random() * 2 + 1,
                alpha: Math.random()
            });
        }

        // Notes
        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.05 + star.x * 10));
                // Draw crisp squares for stars to match pixel theme
                ctx.fillRect(star.x * width, star.y * height, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Glow behind sun
            const grd = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 4);
            grd.addColorStop(0, 'rgba(255, 0, 255, 0.4)');
            grd.addColorStop(0.5, 'rgba(255, 0, 100, 0.1)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffff00'; // Retro yellow
            ctx.fill();
            
            // Horizontal Stripes (The "Blind" look)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050011'; // Cut out color (background color)
            const stripeHeight = 8;
            // Start stripes from center going down
            for(let y = cy; y < cy + r; y += stripeHeight + 6) {
                ctx.fillRect(cx - r, y, r * 2, stripeHeight);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            
            // Highway Dimensions
            const bottomWidth = Math.min(width * 0.8, 600);
            const topWidth = 50; // Vanishing point width
            
            ctx.lineWidth = 2;
            
            // 1. Vertical Lines (Perspective Lanes)
            // We draw 5 lines to define 4 lanes
            for (let i = 0; i <= 4; i++) {
                // Calculate X at bottom
                const bottomX = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                // Calculate X at top (vanishing point area)
                const topX = centerX - (topWidth/2) + (i * (topWidth / 4));

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 0, 255, 0.5)'; // Lane markers
                ctx.moveTo(topX, horizonY);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving Grid)
            const speed = 0.003;
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            for (let i = 0; i < 25; i++) {
                // Map linear t [0, 1] to perspective y
                // We use a power function to bunch lines up at the horizon (exponential spacing)
                const t = (i / 25 + time) % 1;
                // Curve the spacing: y = horizon + (1-horizon) * t^2
                const y = horizonY + Math.pow(t, 2) * (height - horizonY);
                
                // Calculate width at this Y based on linear interpolation
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            
            // Gradient for grid lines to fade at horizon
            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, 'rgba(255, 0, 255, 0)');
            grad.addColorStop(0.15, 'rgba(255, 0, 255, 0.8)');
            grad.addColorStop(1, 'rgba(255, 0, 255, 1)');
            
            ctx.strokeStyle = grad;
            ctx.stroke();
        }

        function spawnNote() {
            // Spawn notes rhythmically
            if (Math.random() < 0.06) {
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, // 0 = horizon, 1 = bottom
                    active: true
                });
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.8, 600);
            const topWidth = 50;

            notes.forEach(note => {
                note.t += 0.006; // Note falling speed
                if (note.t > 1.1) note.active = false;

                // Perspective math
                const t = note.t;
                const y = horizonY + Math.pow(t, 2) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
                
                // Lane X calculation
                const laneWidth = currentWidth / 4;
                // Center of the specific lane
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Draw Note
                // Size scales with perspective
                const noteSize = 8 + (40 * Math.pow(t, 1.2)); 
                const noteColor = laneConfig[note.lane].color;
                const noteGlow = laneConfig[note.lane].glow;
                
                ctx.fillStyle = noteColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = noteGlow;
                
                // Draw a blocky square note
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner white core for "pixel" look
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.8, 600);
            const topWidth = 50;

            // Place hit line near bottom (t = 0.95)
            const t = 0.95; 
            const y = horizonY + Math.pow(t, 2) * (height - horizonY);
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
            
            ctx.beginPath();
            // Neon styling for Hit Line
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff00ff'; // Magenta glow
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            
            // Draw Hit Line (The "Target" area)
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            // Simple visual feedback
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.innerHTML = 'LOADING...';
                setTimeout(() => {
                    alert('Initializing Audio Engine... (Demo End)');
                    btn.innerHTML = 'PRESS TO START';
                    btn.style.transform = 'scale(1)';
                }, 500);
            }, 100);
        }

        animate();

    </script>
</body>
</html>
