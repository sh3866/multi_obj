<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-white: #ffffff;
            --grid-color: #2a004d;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            /* System font fallback for pixel look */
            font-family: 'Courier New', Courier, monospace; 
        }

        /* --- CRT / Retro Effects --- */
        
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.7;
        }

        /* Vignette + CRT Curve (simulated with shadow) */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 998;
        }

        /* Chromatic Aberration Animation for Title */
        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(40% 0 20% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(30% 0 10% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); }
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through empty space */
        }

        /* Title Container */
        .title-container {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            z-index: 200;
            pointer-events: auto;
            /* Pixelated rendering for text */
            image-rendering: pixelated; 
        }

        h1 {
            font-family: 'Courier New', Courier, monospace; /* Strict Monospace */
            font-size: 5rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            /* Hard pixel shadow */
            text-shadow: 4px 4px 0px var(--neon-pink);
            position: relative;
            letter-spacing: -2px;
        }

        /* Glitch Layers */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark); /* Mask background */
        }

        h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--neon-cyan);
            clip-path: inset(0 0 0 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--neon-yellow);
            clip-path: inset(0 0 0 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .subtitle {
            display: block;
            font-size: 1.2rem;
            color: var(--neon-yellow);
            margin-top: 15px;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0px #000;
            text-transform: uppercase;
        }

        /* --- Buttons --- */

        /* Primary Button: START */
        .btn-start {
            pointer-events: auto;
            background: transparent;
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.8rem;
            padding: 20px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* Multi-layered hard glow */
            box-shadow: 
                0 0 10px var(--neon-cyan),
                inset 0 0 10px var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
            margin-bottom: 30px;
            z-index: 200;
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan),
                inset 0 0 20px var(--neon-cyan);
            transform: scale(1.02);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* Secondary Buttons: OPTIONS / CREDITS */
        .menu-options {
            display: flex;
            gap: 40px;
            pointer-events: auto;
            z-index: 200;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 10px 20px;
            border: 2px solid transparent;
            transition: all 0.2s;
            background: rgba(0,0,0,0.3); /* Subtle background for legibility */
        }

        .menu-link:hover {
            color: var(--neon-white);
            border-color: var(--neon-white);
            background: rgba(255,255,255,0.1);
            text-shadow: 0 0 8px var(--neon-white);
        }

        /* Canvas Container */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Pixelated rendering for the canvas itself */
            image-rendering: pixelated; 
        }

        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .btn-start { font-size: 1.2rem; padding: 15px 30px; }
            .menu-options { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene (Background + Highway) -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <span class="subtitle">Rhythm Protocol</span>
        </div>

        <button class="btn-start" onclick="startGame()">PRESS TO START</button>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        
        // Disable smoothing for pixel art look
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;

        // Colors
        const COLORS = {
            bg: '#050011',
            grid: '#ff00ff',
            sun: '#ffff00',
            lanes: ['#ff00ff', '#00ffff', '#ffff00', '#ffffff'], // Magenta, Cyan, Yellow, White
            notes: ['#ff00ff', '#00ffff', '#ffff00', '#ffffff']
        };

        // Stars
        const stars = [];
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4,
                size: Math.random() * 3 + 1,
                alpha: Math.random()
            });
        }

        // Notes
        const notes = [];
        let noteTimer = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 5 + star.x * 10));
                // Pixel square
                ctx.fillRect(Math.floor(star.x * width), Math.floor(star.y * height), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * 0.3; // Position
            const r = Math.min(width, height) * 0.15; // Responsive size

            // Glow
            ctx.save();
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff00ff';
            
            // Sun Body (Square circle for pixel look, or just circle)
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.sun;
            ctx.fill();
            ctx.restore();

            // Retro Stripes
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = COLORS.bg;
            // Draw horizontal bars that get thicker towards bottom
            for(let y = cy; y < cy + r; y += 6) {
                const distFromCenter = (y - cy) / r; // 0 to 1
                const barHeight = 4 + (distFromCenter * 10);
                ctx.fillRect(cx - r, y, r * 2, barHeight);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.35;
            const centerX = width / 2;
            
            // Perspective Setup
            const bottomWidth = width * 1.5; // Wider than screen for FOV
            const topWidth = 0; // Vanishing point at center
            
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.4)';
            
            // 1. Vertical Lines (4 Lanes = 5 lines)
            for (let i = 0; i <= 4; i++) {
                const bottomX = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = centerX; // All converge here

                ctx.beginPath();
                ctx.moveTo(topX, horizonY);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving)
            // Calculate speed to ensure smooth movement
            const speed = 2;
            const offset = (time * speed * 1000) % (height - horizonY);
            
            // Draw lines moving from horizon to bottom
            // To simulate perspective, we use logarithmic spacing or similar
            // Simple approach: Loop Y from bottom to top
            
            ctx.beginPath();
            for (let y = height; y > horizonY; y--) {
                // Exponential spacing for perspective
                const dy = y - horizonY;
                const logY = Math.log(dy);
                
                // Create a repeating pattern based on logY
                const spacing = 3; // Frequency
                if (Math.abs(logY % spacing) < 0.1) {
                    // Calculate width at this height
                    const ratio = dy / (height - horizonY);
                    const currentWidth = ratio * bottomWidth;
                    
                    const x1 = centerX - currentWidth / 2;
                    const x2 = centerX + currentWidth / 2;
                    
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                }
            }
            
            // Apply a gradient fade for the lines
            // We can't easily stroke a path with gradient on segments, 
            // so we'll overlay a gradient rect or just use simple alpha
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.6)';
            ctx.stroke();
        }

        function spawnNote() {
            // Spawn rhythmically
            if (noteTimer > 15) { // Every ~15 frames (adjust for BPM)
                const lane = Math.floor(Math.random() * 4);
                notes.push({
                    lane: lane,
                    t: 0, // 0 = horizon, 1 = bottom
                    active: true
                });
                noteTimer = 0;
            }
            noteTimer++;
        }

        function drawNotes() {
            const horizonY = height * 0.35;
            const centerX = width / 2;
            const bottomWidth = width * 1.5;

            notes.forEach(note => {
                // Move note down
                // Use log scale for movement to match grid perspective
                // Speed factor
                note.t += 0.003; 
                
                if (note.t >= 1) {
                    note.active = false;
                    return;
                }

                // Calculate Position
                // We want t=0 at horizon, t=1 at bottom
                // But visual perspective is exponential.
                // Let's invert the log math used in grid.
                // Simple linear interpolation of Y for logic, but visual rendering needs perspective mapping.
                // Actually, let's just use a simple curve for falling:
                
                // Map t [0, 1] to Y
                const y = horizonY + (Math.pow(note.t, 2)) * (height - horizonY);
                
                // Calculate Width at this Y
                const dy = y - horizonY;
                const ratio = dy / (height - horizonY);
                const currentWidth = ratio * bottomWidth;
                
                // Lane X
                const laneWidth = currentWidth / 4;
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Size based on perspective
                const noteSize = 10 + (60 * ratio); 

                // Draw
                const color = COLORS.notes[note.lane];
                
                // Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.fillStyle = color;
                
                // Draw block
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner highlight
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * 0.35;
            const centerX = width / 2;
            const bottomWidth = width * 1.5;
            
            // Hit line is near the bottom, but in perspective
            // Let's say it's at t=0.9
            const t = 0.9;
            const y = horizonY + (Math.pow(t, 2)) * (height - horizonY);
            const ratio = t; // Since y is based on t^2, ratio is roughly t for width calc
            const currentWidth = ratio * bottomWidth;

            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#fff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff00ff';
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, width, height);

            time += 0.01;

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.style.transform = 'scale(0.95)';
            btn.style.boxShadow = '0 0 50px var(--neon-cyan)';
            setTimeout(() => {
                btn.innerHTML = 'LOADING...';
                setTimeout(() => {
                    alert('Audio Engine Initialized. Game Start.');
                    btn.innerHTML = 'PRESS TO START';
                    btn.style.transform = 'scale(1)';
                }, 500);
            }, 100);
        }

        animate();

    </script>
</body>
</html>
