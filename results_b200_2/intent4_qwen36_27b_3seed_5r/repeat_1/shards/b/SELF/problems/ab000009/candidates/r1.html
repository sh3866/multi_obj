<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Refined Slate & Gold */
            --bg-app: #0f1115;
            --bg-panel: #181b21;
            --bg-panel-border: #2a2e38;
            --text-primary: #f0f2f5;
            --text-secondary: #8b949e;
            --accent: #d4af37;
            --accent-hover: #bfa030;
            --accent-dim: rgba(212, 175, 55, 0.15);

            /* Board Palette: Premium Green */
            --board-light: #eeeed2;
            --board-dark: #769656;
            --highlight-move: rgba(255, 255, 255, 0.25);
            --highlight-last: rgba(155, 199, 0, 0.41);
            --highlight-check: radial-gradient(circle, rgba(255,0,0,0.8) 0%, transparent 70%);

            /* Dimensions */
            --board-size: min(85vh, 85vw);
            --square-size: calc(var(--board-size) / 8);
            --panel-width: 380px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Layout */
        .container {
            display: flex;
            gap: 60px;
            padding: 40px;
            max-width: 1600px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* Board Container */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            border-radius: 4px;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
            background: #222;
            padding: 12px; /* Outer border/frame */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            border-radius: 2px;
            overflow: hidden;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }

        /* Coordinates */
        .coord {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.8;
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 3px; right: 4px; }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .highlight.selected { background-color: var(--highlight-move); }
        .highlight.last-move { background-color: var(--highlight-last); }
        
        /* Move Indicators (Dots) */
        .move-dot {
            width: 26%;
            height: 26%;
            background-color: rgba(0,0,0,0.15);
            border-radius: 50%;
            z-index: 2;
        }
        .square.dark .move-dot { background-color: rgba(0,0,0,0.2); }

        /* Pieces */
        .piece {
            width: 90%;
            height: 90%;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            /* Drop shadow for depth */
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4));
        }
        .piece:hover { transform: scale(1.05); }
        .piece:active { transform: scale(0.95); }

        /* Side Panel */
        .panel {
            width: var(--panel-width);
            background-color: var(--bg-panel);
            border: 1px solid var(--bg-panel-border);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            height: var(--board-size);
        }

        .header {
            margin-bottom: 24px;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-primary);
            box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 4px var(--text-secondary);
            transition: all 0.3s ease;
        }
        .turn-dot.black {
            background-color: #333;
            box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 4px #555;
        }

        .status-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* History List */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
            font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Mono", "Droid Sans Mono", "Source Code Pro", monospace;
        }

        /* Scrollbar */
        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: transparent; }
        .history-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: background 0.1s;
        }
        .move-row:hover { background-color: rgba(255,255,255,0.03); }
        .move-row:last-child { border-bottom: none; }
        .move-row.active { background-color: var(--accent-dim); color: var(--text-primary); }
        
        .move-num { width: 35px; opacity: 0.6; font-weight: 600; }
        .move-ply { width: 70px; font-weight: 500; }
        .move-ply.last { color: var(--text-primary); font-weight: 700; }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            font-family: inherit;
            outline: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #1a1a1a;
        }
        .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(1px); }

        .btn-secondary {
            background-color: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.1); }

        /* Responsive */
        @media (max-width: 1100px) {
            .container { flex-direction: column; gap: 30px; padding: 20px; }
            .panel { width: 100%; height: auto; max-height: 400px; }
            :root { --board-size: 90vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Board Area -->
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="header">
                <div class="turn-indicator">
                    <div class="turn-dot" id="turnDot"></div>
                    <span id="turnText">White's Turn</span>
                </div>
                <div class="status-sub">Analysis Mode</div>
            </div>

            <div class="history-container" id="historyList">
                <!-- Moves injected here -->
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="resetGame()">Reset</button>
                <button class="btn-primary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

    <script>
        // --- High-Fidelity SVG Assets (Standard Lichess/Wikipedia style) ---
        const pieces = {

            },
            b: {
                k: `<svg viewBox="0 0 45 45" class="piece"><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5" stroke-linejoin="miter"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#000" stroke="#fff" stroke-linecap="butt"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 2-8 2-5-2-8-2-4-1-9-1c-3 6 6 10.5 6 10.5v7" fill="#000" stroke="#fff"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0" stroke="#fff"/></g></svg>`,
                q: `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0z" stroke-linejoin="miter"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14.5V25l-7-11-2 12" stroke-linecap="butt"/><path d="M9 26c0 2 1.5 2 2.5 4 1 2.5 1 1 .5 4.5-5 2-10 2-15 2s-10 0-15-2c-.5-3.5-.5-2 .5-4.5 1-2 2.5-2 2.5-4" stroke-linecap="butt"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0" fill="none" stroke="#fff"/></g></svg>`,

                b: `<svg viewBox="0 0 45 45" class="piece"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32c-3.39.97-9.11 1.45-13.5 1.45-4.39 0-10.11-.48-13.5-1.45v4z" stroke-linecap="butt"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2zM25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z" stroke-linecap="butt"/><path d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5" stroke="#fff" stroke-linejoin="round"/></g></svg>`,

                p: `<svg viewBox="0 0 45 45" class="piece"><path d="M22 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-2.78-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>`
            }

        // --- Game Logic ---
        
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];
        let lastMove = null; // {from: {r,c}, to: {r,c}}

        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Highlights
                    const hl = document.createElement('div');
                    hl.className = 'highlight';
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        hl.classList.add('selected');
                    }
                    if (lastMove) {
                        if ((lastMove.from.r === r && lastMove.from.c === c) || 
                            (lastMove.to.r === r && lastMove.to.c === c)) {
                            hl.classList.add('last-move');
                        }
                    }
                    square.appendChild(hl);

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += pieces[color][type];
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const from = `${files[fromC]}${8-fromR}`;
            const to = `${files[toC]}${8-toR}`;
            const pieceSymbol = piece.toUpperCase() === 'P' ? '' : piece.toUpperCase();
            const notation = `${pieceSymbol}${to}`;
            
            // Grouping logic
            const moveNum = Math.ceil((moveHistory.length + 1) / 2);
            let row = historyEl.querySelector(`.move-row[data-num="${moveNum}"]`);
            
            if (!row) {
                row = document.createElement('div');
                row.className = 'move-row';
                row.dataset.num = moveNum;
                row.innerHTML = `<span class="move-num">${moveNum}.</span>`;
                historyEl.appendChild(row);
            }
            
            // Remove active class from previous
            document.querySelectorAll('.move-row.active').forEach(el => el.classList.remove('active'));
            row.classList.add('active');

            const plySpan = document.createElement('span');
            plySpan.className = 'move-ply last';
            plySpan.innerText = notation;
            row.appendChild(plySpan);
            
            // Remove 'last' class from previous ply
            const prevLast = row.querySelector('.move-ply.last:not(:last-child)');
            if(prevLast) prevLast.classList.remove('last');

            historyEl.scrollTop = historyEl.scrollHeight;
            moveHistory.push(notation);
        }

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

            // Select
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Move
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Update State
                lastMove = { from: {r: fromR, c: fromC}, to: {r, c} };
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            lastMove = null;
            moveHistory = [];
            historyEl.innerHTML = '';
            updateUI();
            renderBoard();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "Evaluating...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Position evaluated. Best move: Nf3");
            }, 1000);
        }

        // Init
        renderBoard();
        updateUI();

    </script>
</body>
</html>
