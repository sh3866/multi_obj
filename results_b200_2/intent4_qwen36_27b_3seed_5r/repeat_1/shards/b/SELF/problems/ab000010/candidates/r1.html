<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBITAL // LIFE</title>
<style>
    :root {
        --bg-deep: #030305;
        --bg-panel: #0a0a0c;
        --text-primary: #ececec;
        --text-secondary: #6b7280;
        --accent: #00f3ff;
        --accent-dim: rgba(0, 243, 255, 0.15);
        --border: rgba(255, 255, 255, 0.08);
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'Courier New', Courier, monospace;
        --panel-width: 340px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        -webkit-font-smoothing: antialiased;
    }

    /* Main Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        background: radial-gradient(circle at 50% 50%, #111118 0%, #000000 80%);
        cursor: grab;
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* Overlay HUD */
    .hud-layer {
        position: absolute;
        pointer-events: none;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
    }

    .hud-corner {
        position: absolute;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--accent);
        opacity: 0.6;
        letter-spacing: 1px;
    }
    .tl { top: 30px; left: 30px; }
    .tr { top: 30px; right: 30px; text-align: right; }
    .bl { bottom: 30px; left: 30px; }
    .br { bottom: 30px; right: 30px; text-align: right; }

    .hud-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    /* Control Panel */
    aside {
        width: var(--panel-width);
        background: var(--bg-panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 40px;
        z-index: 10;
        box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
    }

    .panel-header {
        margin-bottom: 40px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 20px;
    }

    .brand {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #fff;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .brand-dot {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent);
    }

    .status {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .status.active span { color: var(--accent); }

    /* Controls */
    .control-section {
        margin-bottom: 35px;
    }

    .label-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .val {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-primary);
    }

    /* Custom Range Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 10px rgba(255,255,255,0.3);
        transition: transform 0.1s;
    }
    input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1.2);
    }

    /* Buttons */
    .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    
    .btn-full { grid-column: span 2; }

    button {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 14px;
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 2px;
    }

    button:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.2);
    }

    button.primary {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--accent);
    }
    button.primary:hover {
        background: rgba(0, 243, 255, 0.25);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }

    button.danger {
        color: #ff4757;
        border-color: rgba(255, 71, 87, 0.3);
    }
    button.danger:hover {
        background: rgba(255, 71, 87, 0.1);
    }

    /* Theme Selector */
    .theme-selector {
        display: flex;
        gap: 8px;
    }
    .theme-opt {
        flex: 1;
        height: 32px;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid transparent;
        opacity: 0.5;
        transition: 0.2s;
        position: relative;
    }
    .theme-opt:hover { opacity: 0.8; }
    .theme-opt.active {
        opacity: 1;
        border-color: #fff;
        box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    /* Theme Colors */
    .t-neon { background: linear-gradient(135deg, #00f3ff, #ff0055); }
    .t-heat { background: linear-gradient(135deg, #ff0000, #ffff00); }
    .t-mono { background: linear-gradient(135deg, #333, #fff); }

    /* Stats Footer */
    .stats-footer {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }
    .stat-block h4 {
        font-size: 9px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }
    .stat-block div {
        font-family: var(--font-mono);
        font-size: 18px;
        color: #fff;
        font-weight: 700;
    }
    
    .footer-info {
        margin-top: 30px;
        font-size: 9px;
        color: rgba(255,255,255,0.2);
        text-align: center;
        line-height: 1.6;
    }

</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        
        <div class="hud-layer">
            <div class="hud-corner tl">
                <div class="hud-title">Spherical Topology</div>
                <div id="hud-coords">LAT: 00.00 | LON: 00.00</div>
            </div>
            <div class="hud-corner tr">
                RENDER: WEBGL-FREE<br>
                FPS: <span id="fps-counter">60</span>
            </div>
            <div class="hud-corner bl">
                CLICK: SPAWN CELL<br>
                DRAG: ROTATE VIEW
            </div>
            <div class="hud-corner br">
                V. 2.0.4
            </div>
        </div>
    </div>

    <aside>
        <div class="panel-header">
            <div class="brand">
                <div class="brand-dot"></div>
                ORBITAL // LIFE
            </div>
            <div class="status active">
                <span>●</span> SYSTEM ONLINE
            </div>
        </div>

        <div class="control-section">
            <div class="label-row">
                <span class="label">Simulation Speed</span>
                <span class="val" id="speed-val">30 FPS</span>
            </div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-section">
            <div class="label-row">
                <span class="label">Cell Density</span>
                <span class="val" id="res-val">MEDIUM</span>
            </div>
            <input type="range" id="resRange" min="20" max="100" value="50">
        </div>

        <div class="control-section">
            <div class="label-row">
                <span class="label">Visual Theme</span>
            </div>
            <div class="theme-selector">
                <div class="theme-opt t-neon active" onclick="setTheme('neon')"></div>
                <div class="theme-opt t-heat" onclick="setTheme('heat')"></div>
                <div class="theme-opt t-mono" onclick="setTheme('mono')"></div>
            </div>
        </div>

        <div class="control-section">
            <div class="label-row">
                <span class="label">Actions</span>
            </div>
            <div class="btn-group">
                <button class="primary btn-full" id="btn-toggle">Pause Simulation</button>
                <button class="danger" id="btn-reset">Randomize</button>
                <button id="btn-clear">Clear Grid</button>
            </div>
        </div>

        <div class="stats-footer">
            <div class="stat-block">
                <h4>Generation</h4>
                <div id="gen-count">0</div>
            </div>
            <div class="stat-block">
                <h4>Population</h4>
                <div id="pop-count">0</div>
            </div>
        </div>

        <div class="footer-info">
            CONWAY'S GAME OF LIFE<br>
            SPHERICAL MAPPING PROJECTION
        </div>
    </aside>

<script>
/**
 * ORBITAL LIFE - Spherical Game of Life
 * Pure JS/Canvas implementation
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

// Configuration
let width, height;
let cols = 50; // Longitude steps
let rows = 25; // Latitude steps
let grid = [];
let nextGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; 
let currentTheme = 'neon';

// Camera
let rotX = 0.2; // Slight tilt
let rotY = 0;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Themes
const themes = {
    neon: {
        bg: '#030305',
        gridColor: 'rgba(0, 243, 255, 0.05)',
        outlineColor: 'rgba(0, 243, 255, 0.2)',
        cellColor: (age) => {
            // HSL variation for living cells
            const hue = (age * 5 + 180) % 360; // Cyan/Purple range
            return `hsla(${hue}, 80%, 60%, 0.9)`;
        },
        glowColor: 'rgba(0, 243, 255, 0.6)'
    },
    heat: {
        bg: '#050000',
        gridColor: 'rgba(255, 69, 0, 0.05)',
        outlineColor: 'rgba(255, 69, 0, 0.2)',
        cellColor: (age) => {
            const hue = (age * 2) % 60; // Red to Yellow
            return `hsla(${hue}, 100%, 50%, 0.9)`;
        },
        glowColor: 'rgba(255, 69, 0, 0.6)'
    },
    mono: {
        bg: '#050505',
        gridColor: 'rgba(255, 255, 255, 0.05)',
        outlineColor: 'rgba(255, 255, 255, 0.15)',
        cellColor: () => '#ffffff',
        glowColor: 'rgba(255, 255, 255, 0.5)'
    }
};

// Resize Handler
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.75 ? 1 : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

// Spherical Neighbor Count
function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
            if (i === 0 && j === 0) continue;
            
            // Wrap X (Longitude)
            let col = (x + i + cols) % cols;
            
            // Wrap Y (Latitude) - Top connects to Bottom
            // Note: In a true sphere, the poles are points, not lines. 
            // For this grid implementation, we treat it as a cylinder wrapped top-to-bottom
            // to preserve the grid topology simplicity while mapping to a sphere visually.
            let row = (y + j + rows) % rows;
            
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const state = grid[getIdx(x, y)];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[getIdx(x, y)] = 1;
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[getIdx(x, y)] = 0;
            } else {
                nextGrid[getIdx(x, y)] = state;
            }
        }
    }
    
    // Swap buffers
    let temp = grid;
    grid = nextGrid;
    nextGrid = temp;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    // Clear with theme background
    ctx.fillStyle = themes[currentTheme].bg;
    ctx.fillRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.35;

    // 1. Draw Sphere Outline (Back layer)
    ctx.strokeStyle = themes[currentTheme].outlineColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();

    // 2. Draw Latitude/Longitude Wireframe (Subtle)
    ctx.strokeStyle = themes[currentTheme].gridColor;
    ctx.lineWidth = 1;
    
    // Draw Latitudes
    for (let y = 0; y < rows; y++) {
        const phi = (y / rows) * Math.PI;
        // Project this ring to see if it's visible
        // Simplified: just draw rings based on rotation
        const r = radius * Math.sin(phi);
        const z = radius * Math.cos(phi);
        
        // Rotate Z
        let y2 = z * Math.sin(rotX) + 0 * Math.cos(rotX); // simplified
        let z2 = z * Math.cos(rotX) - 0 * Math.sin(rotX);
        
        // We need to draw these as ellipses in 2D
        // This is a visual approximation
        const scaleY = Math.cos(rotY); 
        const scaleX = Math.cos(rotX); // Simplified projection
        
        // Only draw if somewhat facing camera
        if (Math.abs(y2) < radius) {
            ctx.beginPath();
            ctx.ellipse(cx, cy + y2, r * scaleX, r * scaleY, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    // 3. Draw Cells
    const thetaY = rotY;
    const thetaX = rotX;

    // Collect cells to draw so we can sort by Z (Painter's Algorithm)
    let cellsToDraw = [];

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            // Spherical Coordinates
            const phi = (y / rows) * Math.PI;
            const theta = (x / cols) * Math.PI * 2;

            // 3D Position
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi) * Math.sin(theta);
            let pz = radius * Math.cos(phi);

            // Rotate Y
            let px2 = px * Math.cos(thetaY) - pz * Math.sin(thetaY);
            let pz2 = px * Math.sin(thetaY) + pz * Math.cos(thetaY);
            
            // Rotate X
            let py2 = py * Math.cos(thetaX) - pz2 * Math.sin(thetaX);
            let pz3 = py * Math.sin(thetaX) + pz2 * Math.cos(thetaX);

            // Perspective Projection
            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;
            const size = Math.max(1, (radius / cols) * scale * 0.6); 

            if (grid[getIdx(x, y)] === 1) {
                cellsToDraw.push({
                    x: sx,
                    y: sy,
                    z: pz3,
                    size: size,
                    scale: scale,
                    age: generation % 50 // Fake age for color cycling
                });
            }
        }
    }

    // Sort back to front
    cellsToDraw.sort((a, b) => b.z - a.z);

    // Render cells
    cellsToDraw.forEach(cell => {
        if (cell.z < radius) { // Don't draw if completely behind
            ctx.fillStyle = themes[currentTheme].cellColor(cell.age);
            ctx.shadowBlur = 10 * cell.scale;
            ctx.shadowColor = themes[currentTheme].glowColor;
            
            ctx.beginPath();
            ctx.arc(cell.x, cell.y, cell.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    
    // Reset shadow for performance
    ctx.shadowBlur = 0;

    // 4. Draw Inner Glow/Atmosphere
    const grad = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
}

// Main Loop
let frameCount = 0;
let lastFpsTime = 0;

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    // FPS Counter
    frameCount++;
    if (timestamp - lastFpsTime >= 1000) {
        document.getElementById('fps-counter').innerText = frameCount;
        frameCount = 0;
        lastFpsTime = timestamp;
    }

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    // Auto rotate slowly
    if (!isDragging) {
        rotY += 0.002;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    document.getElementById('hud-coords').innerText = 
        `X: ${x.toFixed(0)} | Y: ${y.toFixed(0)} | Z: ${Math.floor(Math.random()*100)}`;

    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.005;
        rotX += dy * 0.005;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// Click to spawn
container.addEventListener('click', (e) => {
    // Spawn a cluster in a random area
    for(let i=0; i<5; i++) {
        const idx = Math.floor(Math.random() * grid.length);
        grid[idx] = 1;
    }
    updateStats();
});

// UI Controls
const btnToggle = document.getElementById('btn-toggle');
btnToggle.addEventListener('click', () => {
    isRunning = !isRunning;
    btnToggle.innerText = isRunning ? "Pause Simulation" : "Resume Simulation";
    document.querySelector('.status.active span').style.color = isRunning ? 'var(--accent)' : '#666';
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
    document.getElementById('speed-val').innerText = val + " FPS";
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    let label = "LOW";
    if(val > 40) label = "MEDIUM";
    if(val > 70) label = "HIGH";
    document.getElementById('res-val').innerText = label;
    
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

function setTheme(name) {
    currentTheme = name;
    document.querySelectorAll('.theme-opt').forEach(el => el.classList.remove('active'));
    document.querySelector('.t-' + name).classList.add('active');
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
