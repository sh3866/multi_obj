<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #030305;
        --bg-mid: #0b0b14;
        --accent-gold: #fbbf24;
        --accent-gold-dim: #785a12;
        --accent-gold-glow: rgba(251, 191, 36, 0.3);
        --accent-purple: #8b5cf6;
        --accent-purple-deep: #2e1065;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --glass-surface: rgba(13, 13, 20, 0.6);
        --glass-border: rgba(255, 255, 255, 0.06);
        --glass-highlight: rgba(255, 255, 255, 0.12);
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Background Layers */
    .bg-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: radial-gradient(ellipse at 50% 30%, #1a1a2e 0%, #09090b 60%, #000 100%);
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        pointer-events: none;
        z-index: 10;
    }

    /* Grain Texture - Enhanced */
    .grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 99;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Layout Container */
    .game-container {
        width: 100%;
        max-width: 1400px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2.5rem 4rem;
        position: relative;
        z-index: 5;
        justify-content: space-between;
    }

    /* Header / HUD */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--accent-gold-dim);
        padding: 0.5rem 1.5rem 0.5rem 1.2rem;
        border-radius: 100px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.03);
        backdrop-filter: blur(12px);
        transition: all 0.3s ease;
        cursor: default;
        position: relative;
        overflow: hidden;
    }

    .currency-pill::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: translateX(-100%);
        transition: transform 0.5s ease;
    }

    .currency-pill:hover::before {
        transform: translateX(100%);
    }

    .currency-pill:hover {
        border-color: var(--accent-gold);
        box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
    }

    .currency-icon {
        width: 22px;
        height: 22px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Main Hero Area */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title-group {
        text-align: center;
        margin-bottom: 3rem;
        z-index: 2;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 5.5rem;
        font-weight: 400;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin: 0;
        background: linear-gradient(to bottom, #fff 0%, #cbd5e1 40%, #64748b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        position: relative;
        opacity: 0;
        animation: slideDown 1.2s ease forwards;
        filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.2));
    }

    .game-title-sub {
        font-family: var(--font-ui);
        font-size: 0.85rem;
        letter-spacing: 0.8em;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-top: 1rem;
        opacity: 0;
        animation: fadeIn 1.5s ease 0.8s forwards;
        text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
    }

    /* The Summoning Orb - Enhanced */
    .orb-stage {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        opacity: 0;
        animation: scaleIn 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    }

    .orb-glow-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
        animation: breathe 6s infinite ease-in-out;
        z-index: 1;
    }

    .orb-core {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #e2e8f0 40%, #64748b 100%);
        box-shadow: 
            0 0 0 1px rgba(255,255,255,0.1),
            0 0 40px var(--accent-purple), 
            0 0 80px rgba(139, 92, 246, 0.5),
            inset 0 0 30px rgba(255,255,255,0.6);
        position: relative;
        z-index: 2;
        transition: all 0.4s ease;
    }

    .orb-stage:hover .orb-core {
        transform: scale(1.15);
        box-shadow: 
            0 0 0 2px rgba(255,255,255,0.2),
            0 0 60px var(--accent-purple), 
            0 0 120px rgba(139, 92, 246, 0.7);
    }

    /* Orb Rings - More intricate */
    .ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        pointer-events: none;
    }

    .ring-1 {
        width: 200px;
        height: 200px;
        border-top: 2px solid var(--accent-gold);
        border-right: 2px solid var(--accent-gold-dim);
        border-left: 1px solid transparent;
        border-bottom: 1px solid transparent;
        animation: spin 10s linear infinite;
        opacity: 0.9;
    }

    .ring-2 {
        width: 240px;
        height: 240px;
        border: 1px dashed rgba(255,255,255,0.15);
        animation: spin-rev 30s linear infinite;
    }

    .ring-3 {
        width: 280px;
        height: 280px;
        border: 1px dotted rgba(139, 92, 246, 0.2);
        animation: spin 45s linear infinite;
    }

    .ring-4 {
        width: 300px;
        height: 300px;
        border: 1px solid rgba(255,255,255,0.03);
        animation: spin 60s linear infinite;
    }

    /* Menu Grid - Enhanced cards */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(20, 20, 30, 0.7) 0%, rgba(10, 10, 15, 0.4) 100%);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        opacity: 0;
        animation: slideUp 1s ease forwards;
    }

    /* Staggered animations for cards */
    .menu-card:nth-child(1) { animation-delay: 0.8s; }
    .menu-card:nth-child(2) { animation-delay: 0.9s; }
    .menu-card:nth-child(3) { animation-delay: 1.0s; }
    .menu-card:nth-child(4) { animation-delay: 1.1s; }

    /* Card Hover Effects - More dramatic */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .menu-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 70%);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .menu-card:hover {
        transform: translateY(-10px);
        background: rgba(25, 25, 40, 0.9);
        border-color: var(--glass-highlight);
        box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(139, 92, 246, 0.1);
    }

    .menu-card:hover::before, .menu-card:hover::after {
        opacity: 1;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        transform: scale(1.15);
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
    }

    .menu-card:hover .card-title {
        color: var(--accent-gold);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        fill: var(--text-muted);
        margin-bottom: 1.2rem;
        transition: all 0.3s ease;
    }

    .card-title {
        font-family: var(--font-display);
        font-size: 1.3rem;
        color: var(--text-main);
        letter-spacing: 0.08em;
        margin-bottom: 0.4rem;
        transition: color 0.3s ease;
    }

    .card-subtitle {
        font-family: var(--font-ui);
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.25em;
        font-weight: 600;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 0.8; }
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-40px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: scale(1); }
    }

    /* Responsive */
    @media (max-width: 1024px) {
        .game-container { padding: 2rem 2rem; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); }
        .game-title { font-size: 4rem; }
    }

    @media (max-width: 600px) {
        .game-container { padding: 1.5rem; justify-content: center; }
        .menu-grid { grid-template-columns: 1fr; gap: 1rem; }
        .game-title { font-size: 2.8rem; letter-spacing: 0.2em; }
        .orb-stage { width: 240px; height: 240px; margin: 1rem 0; }
        .ring-1 { width: 140px; height: 140px; }
        .ring-2 { width: 180px; height: 180px; }
        .ring-3 { width: 210px; height: 210px; }
        .ring-4 { width: 230px; height: 230px; }
        .orb-core { width: 90px; height: 90px; }
        .hero-section { margin-bottom: 0; }
    }
</style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="bg-canvas"></canvas>
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="game-container">
        <header>
            <!-- Empty left side for balance -->
            <div></div>
            
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <div class="game-title-group">
                <h1 class="game-title">Aetherbound</h1>
                <div class="game-title-sub">Spirit Summoning</div>
            </div>
            
            <div class="orb-stage" id="summon-orb">
                <div class="orb-glow-outer"></div>
                <div class="orb-core"></div>
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="ring ring-4"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.2 + 0.3;
                this.alpha = Math.random() * 0.3;
                this.life = Math.random() * 400;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                
                // More varied particle colors
                const isPurple = Math.random() > 0.6;
                const isGold = !isPurple && Math.random() > 0.7;
                if (isPurple) {
                    this.color = '139, 92, 246';
                } else if (isGold) {
                    this.color = '251, 191, 36';
                } else {
                    this.color = '200, 210, 255';
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                this.alpha += this.fadeDir * 0.002;
                if (this.alpha >= 0.5 || this.alpha <= 0.02) {
                    this.fadeDir *= -1;
                }

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = orb.querySelector('.orb-core');
            const glow = orb.querySelector('.orb-glow-outer');
            
            // Subtle parallax movement
            core.style.transform = `translate(${x * 0.12}px, ${y * 0.12}px)`;
            glow.style.transform = `translate(${x * 0.04}px, ${y * 0.04}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             const glow = orb.querySelector('.orb-glow-outer');
             core.style.transform = `translate(0px, 0px)`;
             glow.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
