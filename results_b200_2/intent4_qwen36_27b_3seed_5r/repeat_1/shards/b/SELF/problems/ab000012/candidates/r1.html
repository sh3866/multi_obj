<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050608;
        --bg-panel: rgba(15, 20, 30, 0.65);
        --accent-gold: #d4af37;
        --accent-gold-dim: #8a7020;
        --accent-mystic: #9d4edd;
        --accent-mystic-dim: #5a189a;
        --text-main: #eef2f6;
        --text-muted: #8892a4;
        --border-light: rgba(255, 255, 255, 0.08);
        --border-gold: rgba(212, 175, 55, 0.25);
        --glow-gold: rgba(212, 175, 55, 0.15);
        --glow-mystic: rgba(157, 78, 221, 0.15);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Background Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 40%, #1a1025 0%, transparent 60%),
            radial-gradient(circle at 50% 100%, #0d1b2a 0%, #050608 100%);
    }

    /* Vignette & Grain Overlay */
    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 200px rgba(0,0,0,0.95);
        pointer-events: none;
        z-index: 10;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    }

    /* Main Layout */
    .game-container {
        width: 100%;
        max-width: 1400px;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 1.5rem 3rem;
        position: relative;
        z-index: 5;
    }

    /* Header */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 1rem;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: linear-gradient(90deg, rgba(0,0,0,0.6) 0%, rgba(20,20,30,0.8) 100%);
        border: 1px solid var(--border-gold);
        padding: 0.4rem 1.2rem 0.4rem 0.6rem;
        border-radius: 4px 20px 20px 4px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        backdrop-filter: blur(8px);
        position: relative;
        overflow: hidden;
    }

    .currency-pill::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: translateX(-100%);
        animation: shine 4s infinite;
    }

    .currency-icon {
        width: 24px;
        height: 24px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 3px var(--accent-gold));
    }

    .currency-amount {
        font-family: 'Georgia', serif;
        font-weight: bold;
        font-size: 1.2rem;
        color: var(--accent-gold);
        letter-spacing: 0.5px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Hero / Summoning Area */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        flex: 1;
    }

    .game-title {
        font-family: 'Georgia', serif;
        font-size: 4rem;
        font-weight: 400;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #fff 0%, #a0aec0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 2.5rem;
        position: relative;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
    }
    
    .game-title::after {
        content: '';
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 40%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        box-shadow: 0 0 10px var(--accent-gold);
    }

    .orb-container {
        position: relative;
        width: 260px;
        height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .orb-container:hover {
        transform: scale(1.08);
    }

    .orb-container:hover .orb-ring {
        animation-duration: 1.5s;
        border-color: var(--accent-gold);
        box-shadow: 0 0 15px var(--accent-gold);
    }

    .orb-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(157, 78, 221, 0.3) 0%, rgba(0,0,0,0) 70%);
        animation: pulse 4s infinite ease-in-out;
    }

    .orb-core {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #e0e6ed 20%, #4a4e69 100%);
        box-shadow: 
            0 0 50px var(--accent-mystic), 
            0 0 100px rgba(157, 78, 221, 0.3),
            inset 0 0 30px rgba(255,255,255,0.4);
        position: relative;
        z-index: 2;
    }

    .orb-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid var(--accent-gold-dim);
        pointer-events: none;
        transition: all 0.3s ease;
    }

    .ring-1 { 
        width: 160px; 
        height: 160px; 
        animation: spin 12s linear infinite; 
        border-top-color: transparent; 
        border-right-color: transparent;
    }
    .ring-2 { 
        width: 200px; 
        height: 200px; 
        animation: spin-rev 18s linear infinite; 
        border-bottom-color: transparent; 
        opacity: 0.7; 
        border-style: dashed;
    }
    .ring-3 { 
        width: 240px; 
        height: 240px; 
        border: 1px dotted var(--border-light); 
        animation: spin 40s linear infinite; 
        opacity: 0.5;
    }

    /* Menu Grid */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
        width: 100%;
        padding: 0 1rem;
        margin-top: 2rem;
    }

    .menu-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-light);
        border-radius: 6px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        height: 180px;
    }

    .menu-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .menu-card::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 50%;
        background: linear-gradient(to top, rgba(157, 78, 221, 0.05), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(25, 30, 45, 0.85);
        border-color: var(--border-gold);
        box-shadow: 
            0 15px 35px rgba(0,0,0,0.5),
            0 0 20px var(--glow-gold);
    }

    .menu-card:hover::before {
        opacity: 1;
    }

    .menu-card:hover::after {
        opacity: 1;
    }

    .menu-card:hover .card-icon {
        fill: var(--accent-gold);
        transform: scale(1.15);
        filter: drop-shadow(0 0 8px var(--accent-gold));
    }

    .card-icon {
        width: 48px;
        height: 48px;
        fill: var(--text-muted);
        margin-bottom: 1.2rem;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card-title {
        font-family: 'Georgia', serif;
        font-size: 1.3rem;
        color: var(--text-main);
        letter-spacing: 0.08em;
        margin-bottom: 0.5rem;
    }

    .card-subtitle {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 500;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 0.7; }
    }

    @keyframes shine {
        0% { transform: translateX(-100%); }
        20% { transform: translateX(100%); }
        100% { transform: translateX(100%); }
    }

    /* Responsive */
    @media (max-width: 900px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .game-title {
            font-size: 3rem;
        }
        .game-container {
            padding: 1.5rem;
        }
    }

    @media (max-width: 600px) {
        .menu-grid {
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .game-title {
            font-size: 2.2rem;
            letter-spacing: 0.15em;
        }
        .orb-container {
            width: 200px;
            height: 200px;
        }
        .ring-1 { width: 120px; height: 120px; }
        .ring-2 { width: 150px; height: 150px; }
        .ring-3 { width: 180px; height: 180px; }
        .orb-core { width: 80px; height: 80px; }
    }

    /* Particles */
    .particle {
        position: absolute;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
    }
</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="vignette"></div>

    <div class="game-container">
        <header>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            
            <div class="orb-container" id="summon-orb">
                <div class="orb-glow"></div>
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9 9H2l6 4.5L5.5 22 12 17l6.5 5-2.5-8.5L22 9h-7z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.4;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir * 0.003;
                if (this.alpha >= 0.6 || this.alpha <= 0.1) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(220, 220, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Subtle parallax on the inner elements
            const core = orb.querySelector('.orb-core');
            const glow = orb.querySelector('.orb-glow');
            
            core.style.transform = `translate(${x * 0.12}px, ${y * 0.12}px)`;
            glow.style.transform = `translate(${x * 0.06}px, ${y * 0.06}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             const glow = orb.querySelector('.orb-glow');
             core.style.transform = `translate(0px, 0px)`;
             glow.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
