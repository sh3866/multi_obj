<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #030407;
        --bg-panel: rgba(10, 14, 23, 0.6);
        --accent-gold: #c5a059;
        --accent-gold-dim: #6d5a29;
        --accent-mystic: #6b21a8;
        --accent-mystic-light: #d8b4fe;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --border-light: rgba(255, 255, 255, 0.06);
        --border-gold: rgba(197, 160, 89, 0.3);
        --glow-gold: rgba(197, 160, 89, 0.2);
        --font-serif: 'Times New Roman', 'Georgia', serif;
        --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-sans);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Background Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 30%, #170b24 0%, transparent 60%),
            radial-gradient(circle at 50% 100%, #0d1421 0%, #030407 100%);
    }

    /* Film Grain Overlay */
    .grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Vignette */
    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        pointer-events: none;
        z-index: 10;
    }

    /* Main Layout */
    .game-container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: grid;
        grid-template-rows: 80px 1fr 280px;
        padding: 0 3rem;
        position: relative;
        z-index: 5;
    }

    /* Header */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-right: 2rem;
    }

    .currency-pill {
        background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(20,20,30,0.6) 100%);
        border: 1px solid var(--border-gold);
        padding: 0.5rem 1.5rem 0.5rem 0.8rem;
        border-radius: 4px 24px 24px 4px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        backdrop-filter: blur(4px);
        position: relative;
        overflow: hidden;
    }

    .currency-icon {
        width: 28px;
        height: 28px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 4px var(--accent-gold-dim));
    }

    .currency-amount {
        font-family: var(--font-serif);
        font-weight: normal;
        font-size: 1.4rem;
        color: var(--accent-gold);
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        font-variant-numeric: tabular-nums;
    }

    /* Hero Section */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        flex: 1;
        margin-bottom: 1rem;
    }

    .game-title {
        font-family: var(--font-serif);
        font-size: 4.5rem;
        font-weight: 400;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #fff 20%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
        position: relative;
        filter: drop-shadow(0 0 15px rgba(255,255,255,0.15));
        opacity: 0;
        animation: fadeIn 2s ease forwards;
    }
    
    .game-title-sub {
        font-family: var(--font-sans);
        font-size: 0.8rem;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-bottom: 4rem;
        opacity: 0;
        animation: fadeIn 2s ease 0.5s forwards;
        text-shadow: 0 0 10px var(--glow-gold);
    }

    .orb-container {
        position: relative;
        width: 280px;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        opacity: 0;
        animation: scaleIn 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    }

    .orb-container:hover {
        transform: scale(1.05);
    }

    .orb-container:hover .orb-core {
        box-shadow: 
            0 0 60px var(--accent-mystic), 
            0 0 120px rgba(107, 33, 168, 0.4),
            inset 0 0 40px rgba(255,255,255,0.5);
    }

    .orb-container:hover .orb-ring {
        border-color: var(--accent-gold);
        box-shadow: 0 0 10px var(--glow-gold);
    }

    .orb-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(107, 33, 168, 0.2) 0%, rgba(0,0,0,0) 70%);
        animation: pulse 5s infinite ease-in-out;
    }

    .orb-core {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #e2e8f0 30%, #64748b 100%);
        box-shadow: 
            0 0 40px var(--accent-mystic), 
            0 0 80px rgba(107, 33, 168, 0.2),
            inset 0 0 20px rgba(255,255,255,0.3);
        position: relative;
        z-index: 2;
        transition: box-shadow 0.5s ease;
    }

    .orb-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid var(--accent-gold-dim);
        pointer-events: none;
        transition: all 0.5s ease;
    }

    .ring-1 { 
        width: 180px; 
        height: 180px; 
        animation: spin 20s linear infinite; 
        border-top-color: transparent; 
        border-right-color: transparent;
        border-width: 2px;
    }
    .ring-2 { 
        width: 230px; 
        height: 230px; 
        animation: spin-rev 30s linear infinite; 
        border-bottom-color: transparent; 
        border-left-color: transparent;
        border-style: dashed;
        opacity: 0.6;
    }
    .ring-3 { 
        width: 270px; 
        height: 270px; 
        border: 1px dotted var(--border-light); 
        animation: spin 60s linear infinite; 
        opacity: 0.4;
    }

    /* Menu Grid */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
    }

    .menu-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-light);
        border-radius: 4px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        height: 100%;
    }

    .menu-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .menu-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03), transparent 70%);
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(15, 20, 30, 0.8);
        border-color: var(--border-gold);
        box-shadow: 
            0 10px 30px rgba(0,0,0,0.6),
            0 0 15px var(--glow-gold);
    }

    .menu-card:hover::before, .menu-card:hover::after {
        opacity: 1;
    }

    .menu-card:hover .card-icon {
        fill: var(--accent-gold);
        transform: scale(1.1);
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    .menu-card:hover .card-title {
        color: #fff;
    }

    .card-icon {
        width: 40px;
        height: 40px;
        fill: var(--text-muted);
        margin-bottom: 1rem;
        transition: all 0.4s ease;
    }

    .card-title {
        font-family: var(--font-serif);
        font-size: 1.2rem;
        color: var(--text-main);
        letter-spacing: 0.1em;
        margin-bottom: 0.4rem;
        transition: color 0.3s ease;
    }

    .card-subtitle {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.25em;
        font-weight: 600;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.1); opacity: 0.6; }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

    /* Responsive */
    @media (max-width: 900px) {
        .game-container {
            grid-template-rows: 70px 1fr 200px;
            padding: 0 1.5rem;
        }
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .game-title {
            font-size: 3rem;
        }
    }

    @media (max-width: 600px) {
        .menu-grid {
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }
        .game-title {
            font-size: 2rem;
            letter-spacing: 0.2em;
        }
        .orb-container {
            width: 220px;
            height: 220px;
        }
        .ring-1 { width: 140px; height: 140px; }
        .ring-2 { width: 170px; height: 170px; }
        .ring-3 { width: 200px; height: 200px; }
        .orb-core { width: 90px; height: 90px; }
    }
</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="game-container">
        <header>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <div class="game-title-sub">Spirit Summoning</div>
            
            <div class="orb-container" id="summon-orb">
                <div class="orb-glow"></div>
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.3;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                this.alpha += this.fadeDir * 0.002;
                if (this.alpha >= 0.5 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(200, 200, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = orb.querySelector('.orb-core');
            const glow = orb.querySelector('.orb-glow');
            
            core.style.transform = `translate(${x * 0.1}px, ${y * 0.1}px)`;
            glow.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             const glow = orb.querySelector('.orb-glow');
             core.style.transform = `translate(0px, 0px)`;
             glow.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
