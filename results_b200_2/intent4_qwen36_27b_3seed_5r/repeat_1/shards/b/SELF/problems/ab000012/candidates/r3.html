<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-gradient-top: #0f0c1f;
        --bg-gradient-bottom: #020203;
        --accent-gold: #eebb6d;
        --accent-gold-dim: #8a6d3b;
        --accent-purple: #8b5cf6;
        --accent-purple-dim: #4c1d95;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --glass-surface: rgba(10, 12, 20, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.15);
        --font-display: 'Times New Roman', 'Georgia', serif;
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Background Layers */
    .bg-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: radial-gradient(ellipse at 50% 20%, var(--bg-gradient-top) 0%, var(--bg-deep) 70%);
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 200px rgba(0,0,0,0.8);
        pointer-events: none;
        z-index: 10;
    }

    /* Grain Texture */
    .grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 99;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Layout Container */
    .game-container {
        width: 100%;
        max-width: 1400px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem 3rem;
        position: relative;
        z-index: 5;
        justify-content: space-between;
    }

    /* Header / HUD */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--accent-gold-dim);
        padding: 0.6rem 1.8rem 0.6rem 1.2rem;
        border-radius: 100px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        cursor: default;
    }

    .currency-pill:hover {
        border-color: var(--accent-gold);
        box-shadow: 0 0 15px rgba(238, 187, 109, 0.15);
    }

    .currency-icon {
        width: 24px;
        height: 24px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Main Hero Area */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title-group {
        text-align: center;
        margin-bottom: 2rem;
        z-index: 2;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 5rem;
        font-weight: 400;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin: 0;
        background: linear-gradient(to bottom, #fff 0%, #a1a1aa 50%, #52525b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        position: relative;
        opacity: 0;
        animation: slideDown 1s ease forwards;
    }
    
    .game-title-sub {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-top: 0.5rem;
        opacity: 0;
        animation: fadeIn 1.5s ease 0.5s forwards;
        text-shadow: 0 0 10px rgba(238, 187, 109, 0.3);
    }

    /* The Summoning Orb */
    .orb-stage {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        opacity: 0;
        animation: scaleIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    }

    .orb-glow-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, rgba(0,0,0,0) 70%);
        animation: breathe 6s infinite ease-in-out;
        z-index: 1;
    }

    .orb-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #e2e8f0 40%, #64748b 100%);
        box-shadow: 
            0 0 0 1px rgba(255,255,255,0.1),
            0 0 30px var(--accent-purple), 
            0 0 60px rgba(139, 92, 246, 0.4),
            inset 0 0 20px rgba(255,255,255,0.5);
        position: relative;
        z-index: 2;
        transition: all 0.4s ease;
    }

    .orb-stage:hover .orb-core {
        transform: scale(1.1);
        box-shadow: 
            0 0 0 2px rgba(255,255,255,0.2),
            0 0 50px var(--accent-purple), 
            0 0 100px rgba(139, 92, 246, 0.6);
    }

    /* Orb Rings */
    .ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        pointer-events: none;
    }

    .ring-1 {
        width: 180px;
        height: 180px;
        border-top: 2px solid var(--accent-gold);
        border-right: 2px solid var(--accent-gold-dim);
        border-left: 1px solid transparent;
        border-bottom: 1px solid transparent;
        animation: spin 8s linear infinite;
        opacity: 0.8;
    }

    .ring-2 {
        width: 220px;
        height: 220px;
        border: 1px dashed rgba(255,255,255,0.2);
        animation: spin-rev 25s linear infinite;
    }

    .ring-3 {
        width: 260px;
        height: 260px;
        border: 1px dotted rgba(139, 92, 246, 0.3);
        animation: spin 40s linear infinite;
    }

    /* Menu Grid */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.6) 0%, rgba(15, 23, 42, 0.2) 100%);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(8px);
        opacity: 0;
        animation: slideUp 0.8s ease forwards;
    }
    
    /* Staggered animations for cards */
    .menu-card:nth-child(1) { animation-delay: 0.6s; }
    .menu-card:nth-child(2) { animation-delay: 0.7s; }
    .menu-card:nth-child(3) { animation-delay: 0.8s; }
    .menu-card:nth-child(4) { animation-delay: 0.9s; }

    /* Card Hover Effects */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .menu-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent 70%);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(20, 25, 40, 0.8);
        border-color: var(--glass-highlight);
        box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .menu-card:hover::before, .menu-card:hover::after {
        opacity: 1;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        transform: scale(1.1);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
    }

    .menu-card:hover .card-title {
        color: var(--accent-gold);
    }

    .card-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        margin-bottom: 1rem;
        transition: all 0.3s ease;
    }

    .card-title {
        font-family: var(--font-display);
        font-size: 1.25rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-bottom: 0.3rem;
        transition: color 0.3s ease;
    }

    .card-subtitle {
        font-family: var(--font-ui);
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 600;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 0.8; }
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

    /* Responsive */
    @media (max-width: 1024px) {
        .game-container { padding: 2rem 1.5rem; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); }
        .game-title { font-size: 3.5rem; }
    }

    @media (max-width: 600px) {
        .game-container { padding: 1rem; justify-content: center; }
        .menu-grid { grid-template-columns: 1fr; gap: 1rem; }
        .game-title { font-size: 2.5rem; letter-spacing: 0.1em; }
        .orb-stage { width: 220px; height: 220px; margin: 1rem 0; }
        .ring-1 { width: 130px; height: 130px; }
        .ring-2 { width: 160px; height: 160px; }
        .ring-3 { width: 190px; height: 190px; }
        .orb-core { width: 80px; height: 80px; }
        .hero-section { margin-bottom: 0; }
    }
</style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="bg-canvas"></canvas>
    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="game-container">
        <header>
            <!-- Empty left side for balance -->
            <div></div>
            
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <div class="game-title-group">
                <h1 class="game-title">Aetherbound</h1>
                <div class="game-title-sub">Spirit Summoning</div>
            </div>
            
            <div class="orb-stage" id="summon-orb">
                <div class="orb-glow-outer"></div>
                <div class="orb-core"></div>
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.4;
                this.life = Math.random() * 300;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                
                // Randomly tint some particles purple, others white/blue
                const isPurple = Math.random() > 0.7;
                this.color = isPurple ? '139, 92, 246' : '200, 210, 255';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                this.alpha += this.fadeDir * 0.003;
                if (this.alpha >= 0.6 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = orb.querySelector('.orb-core');
            const glow = orb.querySelector('.orb-glow-outer');
            
            // Subtle parallax movement
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
            glow.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             const glow = orb.querySelector('.orb-glow-outer');
             core.style.transform = `translate(0px, 0px)`;
             glow.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
