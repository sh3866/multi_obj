<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-bg: #050011;
            --c-pink: #ff00ff;
            --c-cyan: #00f3ff;
            --c-yellow: #ffee00;
            --c-purple: #7000ff;
            --c-white: #ffffff;
            --font-stack: 'Courier New', 'Courier', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            cursor: default;
            -webkit-font-smoothing: none; /* Keep text sharp for retro feel */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--c-bg);
            overflow: hidden;
            font-family: var(--font-stack);
            color: var(--c-white);
        }

        /* --- CRT / Scanline FX --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.8;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- Canvas --- */
        #scene {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* --- Typography & Title --- */
        .title-wrapper {
            text-align: center;
            position: relative;
            margin-bottom: 60px;
            z-index: 20;
            pointer-events: auto;
            filter: drop-shadow(0 0 15px rgba(255, 0, 255, 0.4));
        }

        h1.main-title {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: clamp(5rem, 15vw, 12rem);
            line-height: 0.8;
            margin: 0;
            text-transform: uppercase;
            color: var(--c-white);
            letter-spacing: -0.05em;
            /* 3D Layering */
            text-shadow: 
                6px 6px 0px var(--c-pink),
                12px 12px 0px rgba(0,0,0,0.4);
            transform: skewX(-12deg);
            position: relative;
        }

        .subtitle {
            display: block;
            font-family: var(--font-stack);
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            color: var(--c-yellow);
            letter-spacing: 0.8em;
            margin-top: 20px;
            text-shadow: 0 0 10px var(--c-yellow);
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.9;
            transform: skewX(-12deg);
            text-align: center;
            margin-left: 0.8em; /* Counteract letter spacing for centering */
        }

        /* --- Start Button --- */
        .start-btn {
            pointer-events: auto;
            background: rgba(5, 0, 17, 0.85);
            border: 3px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: var(--font-stack);
            font-size: 1.8rem;
            font-weight: 900;
            padding: 22px 90px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            letter-spacing: 4px;
            transform: skewX(-12deg);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 0 20px rgba(0, 243, 255, 0.4), 
                inset 0 0 20px rgba(0, 243, 255, 0.1);
            text-shadow: 0 0 8px var(--c-cyan);
            margin-bottom: 40px;
            overflow: hidden;
            z-index: 20;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 50px var(--c-cyan);
            text-shadow: none;
            transform: skewX(-12deg) scale(1.05);
        }

        .start-btn:active {
            transform: skewX(-12deg) scale(0.95);
        }

        /* Decorative corners for button */
        .start-btn::before, .start-btn::after {
            content: '';
            position: absolute;
            width: 15px; height: 15px;
            border: 3px solid var(--c-yellow);
            transition: all 0.3s;
            box-shadow: 0 0 10px var(--c-yellow);
        }
        .start-btn::before { top: -6px; left: -6px; border-right: none; border-bottom: none; }
        .start-btn::after { bottom: -6px; right: -6px; border-left: none; border-top: none; }

        /* --- Menu Links --- */
        .menu-links {
            display: flex;
            gap: 80px;
            pointer-events: auto;
            z-index: 20;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            transition: all 0.3s;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 8px;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            backdrop-filter: blur(2px);
        }

        .menu-link::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0%; height: 3px;
            background: var(--c-pink);
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--c-pink);
        }

        .menu-link:hover {
            color: var(--c-white);
            text-shadow: 0 0 10px var(--c-white);
            background: rgba(0,0,0,0.7);
        }

        .menu-link:hover::after {
            width: 100%;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0) skewX(-12deg); }
            50% { transform: translateY(-15px) skewX(-12deg); }
        }

        .title-wrapper {
            animation: float 6s ease-in-out infinite;
        }

        @media (max-width: 600px) {
            h1.main-title { font-size: 4rem; }
            .start-btn { padding: 15px 50px; font-size: 1.2rem; }
            .menu-links { gap: 20px; }
            .menu-link { font-size: 0.9rem; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <canvas id="scene"></canvas>

    <div id="ui-layer">
        <div class="title-wrapper">
            <h1 class="main-title">PIXEL</h1>
            <h1 class="main-title">DANCE</h1>
            <span class="subtitle">Rhythm Protocol</span>
        </div>

        <button class="start-btn" onclick="startGame()">PRESS START</button>

        <div class="menu-links">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        /**
         * PIXEL DANCE - ENGINE v2.0
         * Enhanced visuals: Better lighting, smoother motion, 3D highway feel.
         */
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

        let width, height;
        let time = 0;
        let mouseX = 0;
        let mouseY = 0;

        // Configuration
        const config = {
            starCount: 300,
            gridSpeed: 0.002, // Slower, smoother movement
            sunSizeRatio: 0.35,
            laneColors: ['#ff00ff', '#00f3ff', '#00f3ff', '#ff00ff'] // Pink, Cyan, Cyan, Pink
        };

        // Data
        const stars = [];
        const notes = [];
        let noteTimer = 0;

        // --- Init ---
        function init() {
            resize();
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Init Stars
            for(let i=0; i<config.starCount; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.002 + 0.001
                });
            }
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Parallax
                const parallaxX = (mouseX - width/2) * star.y * 0.08;
                const parallaxY = (mouseY - height/2) * star.y * 0.05;
                
                // Twinkle
                const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(time * 2 + star.x * 100));
                
                ctx.globalAlpha = star.alpha * twinkle;
                // Pixelated stars
                ctx.fillRect(
                    Math.floor(star.x * width + parallaxX), 
                    Math.floor(star.y * height + parallaxY), 
                    Math.ceil(star.size), 
                    Math.ceil(star.size)
                );
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const sunX = cx + (mouseX - width/2) * 0.03; // Subtle parallax
            const cy = height * 0.35;
            const r = Math.min(width, height) * config.sunSizeRatio;

            // Ambient Glow
            const grd = ctx.createRadialGradient(sunX, cy, r * 0.2, sunX, cy, r * 2.5);
            grd.addColorStop(0, 'rgba(255, 230, 0, 0.5)');
            grd.addColorStop(0.3, 'rgba(255, 0, 255, 0.2)');
            grd.addColorStop(1, 'rgba(5, 0, 17, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            const sunGrd = ctx.createLinearGradient(sunX, cy - r, sunX, cy + r);
            sunGrd.addColorStop(0, '#ffee00');
            sunGrd.addColorStop(0.4, '#ff00ff');
            sunGrd.addColorStop(1, '#4a00e0');
            ctx.fillStyle = sunGrd;
            ctx.fill();
            
            // Stripes (The "Blinds") - Pixelated
            ctx.save();
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050011'; // Match bg color
            
            const totalStripes = 20;
            const startOffset = 0.4; 
            for(let i = 0; i < totalStripes; i++) {
                const progress = i / totalStripes;
                // Exponential spacing
                const yPos = cy - r + (r * 2 * startOffset) + (progress * (r * 2 * (1-startOffset)));
                const thickness = 3 + (i * 4); // Get thicker at bottom
                
                ctx.fillRect(sunX - r, yPos, r * 2, thickness);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            
            // Mouse interaction on grid center
            const centerShift = (mouseX - width/2) * 0.15;
            const verticalShift = (mouseY - height/2) * 0.05;
            const dynamicCenter = centerX + centerShift;
            const dynamicHorizon = horizonY + verticalShift;

            const bottomWidth = Math.max(width * 3, 2500);
            const topWidth = 40;

            // 1. Vertical Lines
            ctx.globalCompositeOperation = 'lighter';
            
            for (let i = 0; i <= 4; i++) {
                const bottomX = dynamicCenter - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = dynamicCenter - (topWidth/2) + (i * (topWidth / 4));

                // Fade line at horizon
                const lineGrd = ctx.createLinearGradient(bottomX, height, topX, dynamicHorizon);
                lineGrd.addColorStop(0, 'rgba(255, 0, 255, 0.9)');
                lineGrd.addColorStop(0.6, 'rgba(255, 0, 255, 0.3)');
                lineGrd.addColorStop(1, 'rgba(255, 0, 255, 0)');

                ctx.strokeStyle = lineGrd;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff00ff';

                ctx.beginPath();
                ctx.moveTo(topX, dynamicHorizon);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving)
            time += config.gridSpeed;
            if (time > 1) time = 0;

            ctx.beginPath();
            const numLines = 40;
            
            for (let i = 0; i < numLines; i++) {
                const t = (i / numLines + time) % 1;
                
                // Perspective curve (power 2.5 bunches lines near horizon)
                const y = dynamicHorizon + (height - dynamicHorizon) * Math.pow(t, 2.5);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                const x1 = dynamicCenter - currentWidth / 2;
                const x2 = dynamicCenter + currentWidth / 2;

                ctx.globalAlpha = Math.pow(t, 1.5); // Fade near horizon
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 2 + (t * 6); // Thicker closer to camera

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            ctx.stroke();

            // Floor Glow (Ambient light from grid)
            const floorGrd = ctx.createLinearGradient(0, horizonY, 0, height);
            floorGrd.addColorStop(0, 'rgba(112, 0, 255, 0)');
            floorGrd.addColorStop(0.5, 'rgba(112, 0, 255, 0.1)');
            floorGrd.addColorStop(1, 'rgba(112, 0, 255, 0.3)');
            ctx.fillStyle = floorGrd;
            ctx.fillRect(0, horizonY, width, height - horizonY);

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function spawnNote() {
            noteTimer++;
            // Rhythmic spawning (approx 120bpm feel)
            if (noteTimer > 12 && Math.random() < 0.15) {
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    color: config.laneColors[laneIdx]
                });
                noteTimer = 0;
            }
        }

        function drawNotes() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.15;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.max(width * 3, 2500);
            const topWidth = 40;

            // Sort notes by depth (t) so further ones draw first
            notes.sort((a, b) => a.t - b.t);

            notes.forEach(note => {
                note.t += 0.015; // Note speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                // Calculate X based on lane
                const laneWidth = currentWidth / 4;
                const laneX = (dynamicCenter - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Scale size based on depth
                const noteSize = 15 + (80 * Math.pow(t, 2.5)); 
                const noteHeight = noteSize * 0.6;

                // Glow
                ctx.shadowBlur = 25;
                ctx.shadowColor = note.color;
                ctx.fillStyle = note.color;
                
                // Draw Note (Rounded Rect look)
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner Core (White)
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneX - noteSize/3, y - noteSize/3, noteSize/1.5, noteSize/1.5);
                
                // 3D Trail/Extrusion (Pixel style)
                ctx.fillStyle = note.color;
                ctx.globalAlpha = 0.5;
                // Draw "tail" behind it
                const tailLen = noteSize * 0.5;
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2 + tailLen, noteSize, tailLen);
                ctx.globalAlpha = 1;
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.15;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.max(width * 3, 2500);
            const topWidth = 40;

            // Place hit line near bottom (t=0.92)
            const t = 0.92; 
            const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffffff';
            ctx.moveTo(dynamicCenter - currentWidth/2, y);
            ctx.lineTo(dynamicCenter + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.start-btn');
            // Glitch effect on click
            document.body.style.filter = 'invert(1)';
            setTimeout(() => {
                document.body.style.filter = 'none';
                btn.innerHTML = 'LOADING...';
                setTimeout(() => {
                    alert('Initializing Audio Engine... (Demo End)');
                    btn.innerHTML = 'PRESS START';
                }, 500);
            }, 100);
        }

        // Start
        init();

    </script>
</body>
</html>
