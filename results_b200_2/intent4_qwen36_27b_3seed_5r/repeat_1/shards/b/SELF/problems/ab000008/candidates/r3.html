<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffee00;
            --bg-dark: #05000a;
            --font-main: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-main);
            color: white;
        }

        /* --- CRT / Retro FX Layers --- */
        
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            animation: scrollScanlines 10s linear infinite;
        }

        @keyframes scrollScanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 99;
        }

        /* Canvas Background */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; 
        }

        /* --- Typography & Logo --- */
        
        .title-container {
            margin-bottom: 60px;
            text-align: center;
            position: relative;
            pointer-events: auto;
            z-index: 20;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.6));
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: clamp(5rem, 15vw, 12rem);
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            font-weight: 900;
            color: #fff;
            letter-spacing: -5px;
            /* 3D Retro Stack */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                8px 8px 0px var(--neon-cyan),
                12px 12px 0px rgba(0,0,0,0.5);
            transform: skewX(-15deg);
            position: relative;
        }

        /* Glitch Layer */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-3px, -3px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--neon-pink);
            z-index: -2;
            transform: translate(3px, 3px);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .subtitle {
            display: block;
            font-family: var(--font-main);
            font-size: clamp(1rem, 3vw, 1.8rem);
            color: var(--neon-yellow);
            letter-spacing: 15px;
            margin-top: 10px;
            text-shadow: 0 0 10px var(--neon-yellow);
            text-transform: uppercase;
            transform: skewX(-15deg);
            opacity: 0.9;
            font-weight: bold;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(-2px,0); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(2px,0); }
            40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-2px,0); }
            60% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); transform: translate(2px,0); }
            80% { clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%); transform: translate(-2px,0); }
            100% { clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%); transform: translate(2px,0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); transform: translate(2px,0); }
            20% { clip-path: polygon(0 70%, 100% 70%, 100% 70%, 0 70%); transform: translate(-2px,0); }
            40% { clip-path: polygon(0 50%, 100% 50%, 100% 60%, 0 60%); transform: translate(2px,0); }
            60% { clip-path: polygon(0 80%, 100% 80%, 100% 80%, 0 80%); transform: translate(-2px,0); }
            80% { clip-path: polygon(0 30%, 100% 30%, 100% 35%, 0 35%); transform: translate(2px,0); }
            100% { clip-path: polygon(0 10%, 100% 10%, 100% 15%, 0 15%); transform: translate(-2px,0); }
        }

        /* --- Controls --- */

        .btn-start {
            pointer-events: auto;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-main);
            font-size: 1.8rem;
            font-weight: 900;
            padding: 25px 90px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px rgba(0, 255, 255, 0.2);
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 8px;
            transform: skewX(-15deg);
            overflow: hidden;
            z-index: 30;
        }

        /* Button Hover */
        .btn-start:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 60px var(--neon-cyan), inset 0 0 0px var(--neon-cyan);
            text-shadow: none;
            transform: skewX(-15deg) scale(1.05) translateY(-2px);
        }
        
        .btn-start:active {
            transform: skewX(-15deg) scale(0.95);
        }

        /* Decorative Button Corners */
        .btn-start::before, .btn-start::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 3px solid var(--neon-yellow);
            transition: all 0.3s;
        }
        .btn-start::before { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .btn-start::after { bottom: -5px; right: -5px; border-left: none; border-top: none; }

        .menu-options {
            margin-top: 60px;
            display: flex;
            gap: 80px;
            pointer-events: auto;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: all 0.3s;
            cursor: pointer;
            letter-spacing: 4px;
            position: relative;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .menu-link:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 15px var(--neon-yellow);
            transform: translateY(-5px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { letter-spacing: -2px; }
            .subtitle { letter-spacing: 8px; }
            .btn-start { padding: 20px 50px; font-size: 1.4rem; letter-spacing: 4px; }
            .menu-options { gap: 40px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <span class="subtitle">Rhythm Protocol</span>
        </div>

        <button class="btn-start" onclick="startGame()">PRESS START</button>

        <div class="menu-options">
            <a class="menu-link">OPTIONS</a>
            <a class="menu-link">CREDITS</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let mouseX = 0;
        let mouseY = 0;

        // Configuration
        const lanes = [
            { color: '#ff00ff', glow: '#ff00ff' }, // Pink
            { color: '#00ffff', glow: '#00ffff' }, // Cyan
            { color: '#00ffff', glow: '#00ffff' }, // Cyan
            { color: '#ff00ff', glow: '#ff00ff' }  // Pink
        ];
        
        // Stars
        const stars = [];
        for(let i=0; i<300; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random(),
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.005 + 0.001
            });
        }

        // Notes
        const notes = [];
        let noteTimer = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        resize();

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Parallax effect based on mouse
                const parallaxX = (mouseX - width/2) * star.y * 0.05;
                const parallaxY = (mouseY - height/2) * star.y * 0.02;
                
                // Twinkle
                const twinkle = 0.5 + 0.5 * Math.sin(time * 2 + star.x * 100);
                
                ctx.globalAlpha = star.alpha * twinkle;
                ctx.fillRect(
                    star.x * width + parallaxX, 
                    star.y * height + parallaxY, 
                    star.size, 
                    star.size
                );
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            // Sun moves slightly with mouse (parallax)
            const sunX = cx + (mouseX - width/2) * 0.05;
            const cy = height * 0.35;
            const r = Math.min(width, height) * 0.25;

            // Massive Glow
            const grd = ctx.createRadialGradient(sunX, cy, r * 0.2, sunX, cy, r * 4);
            grd.addColorStop(0, 'rgba(255, 230, 0, 0.8)');
            grd.addColorStop(0.2, 'rgba(255, 0, 255, 0.5)');
            grd.addColorStop(1, 'rgba(5, 0, 10, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            // Linear gradient for the sun itself
            const sunGrd = ctx.createLinearGradient(sunX, cy - r, sunX, cy + r);
            sunGrd.addColorStop(0, '#ffe600');
            sunGrd.addColorStop(0.5, '#ff00ff');
            sunGrd.addColorStop(1, '#6600ff');
            ctx.fillStyle = sunGrd;
            ctx.fill();
            
            // Horizontal Stripes (The "Blind" look)
            ctx.save();
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#05000a'; // Matches BG
            
            // Start stripes from the middle of the sun downwards
            const totalStripes = 20;
            const startOffset = 0.35; // Start at 35% down
            for(let i = 0; i < totalStripes; i++) {
                const progress = i / totalStripes;
                // Exponential spacing for stripes
                const yPos = cy - r + (r * 2 * startOffset) + (progress * (r * 2 * (1-startOffset)));
                
                // Curves get thicker as they go down
                const thickness = 2 + (i * 2.5); 
                
                ctx.fillRect(sunX - r, yPos, r * 2, thickness);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45; // Horizon line
            const centerX = width / 2;
            
            // Mouse parallax for the grid center
            const centerShift = (mouseX - width/2) * 0.2;
            const verticalShift = (mouseY - height/2) * 0.05;
            const dynamicCenter = centerX + centerShift;
            const dynamicHorizon = horizonY + verticalShift;

            // Dimensions
            const bottomWidth = Math.max(width * 2, 2000); // Wider for immersion
            const topWidth = 50; // Tighter vanishing point

            // 1. Vertical Lines (Perspective)
            ctx.globalCompositeOperation = 'lighter';
            
            // Draw 5 lines for 4 lanes
            for (let i = 0; i <= 4; i++) {
                // Calculate X positions
                const bottomX = dynamicCenter - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = dynamicCenter - (topWidth/2) + (i * (topWidth / 4));

                // Gradient for the line (fades at horizon)
                const lineGrd = ctx.createLinearGradient(bottomX, height, topX, dynamicHorizon);
                lineGrd.addColorStop(0, 'rgba(255, 0, 255, 0.8)');
                lineGrd.addColorStop(0.5, 'rgba(255, 0, 255, 0.2)');
                lineGrd.addColorStop(1, 'rgba(255, 0, 255, 0)');

                ctx.strokeStyle = lineGrd;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff00ff';

                ctx.beginPath();
                ctx.moveTo(topX, dynamicHorizon);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving)
            const speed = 0.003;
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            
            // Draw lines
            const numLines = 40;
            for (let i = 0; i < numLines; i++) {
                // t goes from 0 (horizon) to 1 (bottom)
                const t = (i / numLines + time) % 1;
                
                // Perspective projection math
                // Using a power curve to bunch lines at the horizon
                const y = dynamicHorizon + (height - dynamicHorizon) * Math.pow(t, 2.5);
                
                // Width interpolation
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                const x1 = dynamicCenter - currentWidth / 2;
                const x2 = dynamicCenter + currentWidth / 2;

                // Fade opacity near horizon
                ctx.globalAlpha = Math.pow(t, 1.5);
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 1 + (t * 3); // Thicker lines closer to camera

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            ctx.stroke();

            // Reset composite
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function spawnNote() {
            noteTimer++;
            // Spawn rhythmically
            if (noteTimer > 12 && Math.random() < 0.15) {
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    color: lanes[laneIdx].color,
                    glow: lanes[laneIdx].glow
                });
                noteTimer = 0;
            }
        }

        function drawNotes() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.2;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.max(width * 2, 2000);
            const topWidth = 50;

            notes.forEach(note => {
                note.t += 0.015; // Note speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                // Lane X calculation
                const laneWidth = currentWidth / 4;
                const laneX = (dynamicCenter - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Scale size based on depth
                const noteSize = 15 + (80 * Math.pow(t, 2.5)); 

                // Draw Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = note.glow;
                ctx.fillStyle = note.color;
                
                // Draw Note (Square)
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner white core
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
                
                // 3D Extrusion (fake depth)
                ctx.fillStyle = note.color;
                ctx.globalAlpha = 0.5;
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2 + noteSize/3, noteSize, noteSize * 0.3);
                ctx.globalAlpha = 1;
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.2;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.max(width * 2, 2000);
            const topWidth = 50;

            // Place hit line near bottom (t=0.95)
            const t = 0.95; 
            const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 5;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ffffff';
            ctx.moveTo(dynamicCenter - currentWidth/2, y);
            ctx.lineTo(dynamicCenter + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear with deep purple/black
            ctx.fillStyle = '#05000a';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            
            // Draw Hit Line
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            // Glitch out effect
            document.body.style.filter = 'invert(1)';
            setTimeout(() => {
                document.body.style.filter = 'none';
                btn.innerHTML = 'LOADING...';
                // Visual feedback only for this demo
                setTimeout(() => {
                    alert('Initializing Audio Engine... (Demo End)');
                    btn.innerHTML = 'PRESS START';
                }, 500);
            }, 100);
        }

        animate();

    </script>
</body>
</html>
