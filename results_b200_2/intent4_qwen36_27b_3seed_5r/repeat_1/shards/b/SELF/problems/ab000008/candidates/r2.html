<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance - Rhythm Protocol</title>
    <style>
        :root {
            --bg-dark: #050014;
            --neon-pink: #ff00ff;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-main);
        }

        /* --- CRT & Visual Effects --- */
        
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* Vignette & Glow */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 99;
        }

        /* Canvas Container */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; 
        }

        /* --- Typography & Title --- */
        
        .title-container {
            margin-bottom: 100px;
            text-align: center;
            position: relative;
            pointer-events: auto;
            z-index: 20;
            mix-blend-mode: screen; /* Better integration with background */
        }

        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif; /* Fallback for heavy headers */
            font-size: clamp(4rem, 12vw, 9rem);
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            font-weight: 900;
            color: #fff;
            /* Complex shadow stack for 3D neon block */
            text-shadow: 
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                4px 4px 0px var(--neon-cyan);
            
            letter-spacing: -2px;
            transform: skewX(-10deg);
            position: relative;
            animation: titlePulse 4s ease-in-out infinite;
        }
        
        /* Glitch overlay */
        h1::before {
            content: 'PIXEL DANCE';
            position: absolute;
            top: 0;
            left: 2px;
            width: 100%;
            height: 100%;
            color: var(--neon-cyan);
            z-index: -1;
            opacity: 0.7;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitchClip 3s infinite linear alternate-reverse;
        }

        .subtitle {
            display: block;
            font-size: clamp(0.8rem, 2vw, 1.4rem);
            color: var(--neon-yellow);
            letter-spacing: 12px;
            margin-top: 20px;
            text-shadow: 0 0 10px var(--neon-yellow);
            text-transform: uppercase;
            transform: skewX(-10deg);
            opacity: 0.9;
        }

        @keyframes titlePulse {
            0%, 100% { transform: skewX(-10deg) translateY(0) scale(1); }
            50% { transform: skewX(-10deg) translateY(-10px) scale(1.02); }
        }

        @keyframes glitchClip {
            0% { clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translate(-2px, 0); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 60%, 0 60%); transform: translate(2px, 0); }
            40% { clip-path: polygon(0 40%, 100% 40%, 100% 80%, 0 80%); transform: translate(-2px, 0); }
            60% { clip-path: polygon(0 0, 100% 0, 100% 20%, 0 20%); transform: translate(0, 0); }
            80% { clip-path: polygon(0 50%, 100% 50%, 100% 90%, 0 90%); transform: translate(2px, 0); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translate(-2px, 0); }
        }

        /* --- Controls --- */

        .btn-start {
            pointer-events: auto;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-main);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px 80px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 8px var(--neon-cyan);
            letter-spacing: 6px;
            transform: skewX(-10deg);
            overflow: hidden;
            z-index: 30;
        }

        /* Button Hover State */
        .btn-start:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 40px var(--neon-cyan), inset 0 0 0px var(--neon-cyan);
            text-shadow: none;
            transform: skewX(-10deg) scale(1.05);
        }
        
        .btn-start:active {
            transform: skewX(-10deg) scale(0.98);
        }

        /* Decorative corners for button */
        .btn-start::before, .btn-start::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid var(--neon-yellow);
            transition: all 0.2s;
        }
        .btn-start::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .btn-start::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .menu-options {
            margin-top: 50px;
            display: flex;
            gap: 60px;
            pointer-events: auto;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            transition: all 0.3s;
            cursor: pointer;
            letter-spacing: 3px;
            position: relative;
            font-weight: bold;
        }

        .menu-link:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { letter-spacing: -1px; }
            .subtitle { letter-spacing: 6px; }
            .btn-start { padding: 15px 40px; font-size: 1.2rem; letter-spacing: 3px; }
            .menu-options { gap: 30px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>Pixel<br>Dance</h1>
            <span class="subtitle">Rhythm Protocol</span>
        </div>

        <button class="btn-start" onclick="startGame()">PRESS START</button>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let mouseX = 0;
        let mouseY = 0;

        // Configuration
        const lanes = [
            { color: '#ff00ff', glow: '#ff00ff' }, // Pink
            { color: '#00f3ff', glow: '#00f3ff' }, // Cyan
            { color: '#00f3ff', glow: '#00f3ff' }, // Cyan
            { color: '#ff00ff', glow: '#ff00ff' }  // Pink
        ];
        
        // Stars
        const stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.5, // Sky area
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.002 + 0.001
            });
        }

        // Notes
        const notes = [];
        let noteTimer = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        resize();

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Parallax effect based on mouse
                const parallaxX = (mouseX - width/2) * star.y * 0.05;
                const parallaxY = (mouseY - height/2) * star.y * 0.02;
                
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.1 + star.x * 10));
                ctx.fillRect(
                    star.x * width + parallaxX, 
                    star.y * height + parallaxY, 
                    star.size, 
                    star.size
                );
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const sunX = cx + (mouseX - width/2) * 0.05;
            const cy = height * 0.32; // Slightly higher
            const r = Math.min(width, height) * 0.18;

            // Massive Glow
            const grd = ctx.createRadialGradient(sunX, cy, r * 0.2, sunX, cy, r * 3);
            grd.addColorStop(0, 'rgba(255, 230, 0, 0.6)');
            grd.addColorStop(0.4, 'rgba(255, 0, 255, 0.3)');
            grd.addColorStop(1, 'rgba(5, 0, 20, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            // Linear gradient for the sun itself
            const sunGrd = ctx.createLinearGradient(sunX, cy - r, sunX, cy + r);
            sunGrd.addColorStop(0, '#ffe600');
            sunGrd.addColorStop(1, '#ff00ff');
            ctx.fillStyle = sunGrd;
            ctx.fill();
            
            // Horizontal Stripes (The "Blind" look) - Improved thickness logic
            ctx.save();
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050014'; // Matches BG
            
            // Start stripes from the middle of the sun downwards
            const totalStripes = 15;
            const startOffset = 0.4; // Start at 40% down
            for(let i = 0; i < totalStripes; i++) {
                const progress = i / totalStripes;
                const yPos = cy - r + (r * 2 * startOffset) + (progress * (r * 2 * (1-startOffset)));
                
                // Curves get thicker as they go down
                const thickness = 2 + (i * 2.5); 
                
                ctx.fillRect(sunX - r, yPos, r * 2, thickness);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45; // Horizon line
            const centerX = width / 2;
            
            // Mouse parallax for the grid center
            const centerShift = (mouseX - width/2) * 0.2;
            const verticalShift = (mouseY - height/2) * 0.05;
            const dynamicCenter = centerX + centerShift;
            const dynamicHorizon = horizonY + verticalShift;

            // Dimensions
            const bottomWidth = Math.min(width * 1.5, 1600); // Wider for immersion
            const topWidth = 20; // Tighter vanishing point

            // 1. Vertical Lines (Perspective)
            // Use additive blending for that "light" look
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineWidth = 2;
            
            // Draw 5 lines for 4 lanes
            for (let i = 0; i <= 4; i++) {
                // Calculate X positions
                const bottomX = dynamicCenter - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = dynamicCenter - (topWidth/2) + (i * (topWidth / 4));

                // Gradient for the line (fades at horizon)
                const lineGrd = ctx.createLinearGradient(bottomX, height, topX, dynamicHorizon);
                lineGrd.addColorStop(0, 'rgba(255, 0, 255, 0.8)');
                lineGrd.addColorStop(1, 'rgba(255, 0, 255, 0)');

                ctx.strokeStyle = lineGrd;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff00ff';

                ctx.beginPath();
                ctx.moveTo(topX, dynamicHorizon);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving)
            const speed = 0.002;
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            
            // Draw lines
            const numLines = 30;
            for (let i = 0; i < numLines; i++) {
                // t goes from 0 (horizon) to 1 (bottom)
                const t = (i / numLines + time) % 1;
                
                // Perspective projection math
                // Using a power curve to bunch lines at the horizon
                const y = dynamicHorizon + (height - dynamicHorizon) * Math.pow(t, 2.5);
                
                // Width interpolation
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                const x1 = dynamicCenter - currentWidth / 2;
                const x2 = dynamicCenter + currentWidth / 2;

                // Fade opacity near horizon
                ctx.globalAlpha = Math.pow(t, 1.5);
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 1 + (t * 2); // Thicker lines closer to camera

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            ctx.stroke();

            // Reset composite
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function spawnNote() {
            noteTimer++;
            // Spawn rhythmically
            if (noteTimer > 15 && Math.random() < 0.1) {
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    color: lanes[laneIdx].color
                });
                noteTimer = 0;
            }
        }

        function drawNotes() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.2;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.min(width * 1.5, 1600);
            const topWidth = 20;

            notes.forEach(note => {
                note.t += 0.012; // Note speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                // Lane X calculation
                const laneWidth = currentWidth / 4;
                const laneX = (dynamicCenter - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Scale size based on depth
                const noteSize = 10 + (60 * Math.pow(t, 2.5)); 

                ctx.shadowBlur = 15;
                ctx.shadowColor = note.color;
                ctx.fillStyle = note.color;
                
                // Draw Note (Square)
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner white core
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.2;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.min(width * 1.5, 1600);
            const topWidth = 20;

            // Place hit line near bottom (t=0.95)
            const t = 0.95; 
            const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffffff';
            ctx.moveTo(dynamicCenter - currentWidth/2, y);
            ctx.lineTo(dynamicCenter + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear with deep purple/black
            ctx.fillStyle = '#050014';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            
            // Draw Hit Line
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            // Glitch out effect
            document.body.style.filter = 'invert(1)';
            setTimeout(() => {
                document.body.style.filter = 'none';
                btn.innerHTML = 'LOADING...';
                // Visual feedback only for this demo
                setTimeout(() => {
                    alert('Initializing Audio Engine... (Demo End)');
                    btn.innerHTML = 'PRESS START';
                }, 500);
            }, 100);
        }

        animate();

    </script>
</body>
</html>
