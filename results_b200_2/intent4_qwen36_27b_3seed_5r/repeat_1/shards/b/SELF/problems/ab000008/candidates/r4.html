<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-bg: #05000a;
            --c-pink: #ff00ff;
            --c-cyan: #00ffff;
            --c-yellow: #ffe600;
            --c-white: #ffffff;
            --c-grid: rgba(255, 0, 255, 0.4);
            --font-pixel: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--c-bg);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Fallback */
            color: var(--c-white);
        }

        /* --- CRT Overlay FX --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- Canvas --- */
        #scene {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI Layout --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* --- Typography --- */
        .title-wrapper {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
            animation: float 4s ease-in-out infinite;
            pointer-events: auto;
        }

        h1.main-title {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: clamp(4rem, 14vw, 11rem);
            line-height: 0.8;
            margin: 0;
            text-transform: uppercase;
            color: var(--c-white);
            letter-spacing: -0.02em;
            /* The stacked 3D look */
            text-shadow: 
                4px 4px 0px var(--c-pink),
                8px 8px 0px var(--c-cyan),
                12px 12px 0px rgba(0,0,0,0.5);
            transform: skewX(-10deg);
            position: relative;
        }

        /* Glitch layers */
        h1.main-title::before, h1.main-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.8;
            pointer-events: none;
        }

        h1.main-title::before {
            color: var(--c-cyan);
            z-index: -1;
            transform: translate(-3px, -3px) skewX(10deg);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        h1.main-title::after {
            color: var(--c-pink);
            z-index: -2;
            transform: translate(3px, 3px) skewX(10deg);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        .subtitle {
            display: block;
            font-family: var(--font-pixel);
            font-size: clamp(0.8rem, 2vw, 1.5rem);
            color: var(--c-yellow);
            letter-spacing: 12px;
            margin-top: 15px;
            text-shadow: 0 0 10px var(--c-yellow);
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.9;
        }

        /* --- Buttons --- */
        .start-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--c-cyan);
            color: var(--c-cyan);
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: 900;
            padding: 20px 80px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            letter-spacing: 4px;
            transform: skewX(-10deg);
            transition: all 0.15s ease;
            box-shadow: 0 0 15px var(--c-cyan), inset 0 0 15px rgba(0, 255, 255, 0.2);
            text-shadow: 0 0 5px var(--c-cyan);
            margin-bottom: 50px;
            overflow: hidden;
        }

        .start-btn:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--c-cyan);
            text-shadow: none;
            transform: skewX(-10deg) scale(1.05);
        }

        .start-btn:active {
            transform: skewX(-10deg) scale(0.95);
        }

        /* Corner accents for button */
        .start-btn::before, .start-btn::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid var(--c-yellow);
            transition: all 0.3s;
        }
        .start-btn::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .start-btn::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }

        .menu-links {
            display: flex;
            gap: 60px;
            pointer-events: auto;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 3px;
            transition: all 0.3s;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 5px;
        }

        .menu-link::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0%; height: 2px;
            background: var(--c-pink);
            transition: width 0.3s;
            box-shadow: 0 0 5px var(--c-pink);
        }

        .menu-link:hover {
            color: var(--c-white);
            text-shadow: 0 0 10px var(--c-white);
        }

        .menu-link:hover::after {
            width: 100%;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(-2px,0); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(2px,0); }
            40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-2px,0); }
            60% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); transform: translate(2px,0); }
            80% { clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%); transform: translate(-2px,0); }
            100% { clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%); transform: translate(2px,0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); transform: translate(2px,0); }
            20% { clip-path: polygon(0 70%, 100% 70%, 100% 70%, 0 70%); transform: translate(-2px,0); }
            40% { clip-path: polygon(0 50%, 100% 50%, 100% 60%, 0 60%); transform: translate(2px,0); }
            60% { clip-path: polygon(0 80%, 100% 80%, 100% 80%, 0 80%); transform: translate(-2px,0); }
            80% { clip-path: polygon(0 30%, 100% 30%, 100% 35%, 0 35%); transform: translate(2px,0); }
            100% { clip-path: polygon(0 10%, 100% 10%, 100% 15%, 0 15%); transform: translate(-2px,0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1.main-title { font-size: 3.5rem; }
            .start-btn { padding: 15px 40px; font-size: 1.2rem; }
            .menu-links { gap: 30px; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <canvas id="scene"></canvas>

    <div id="ui-layer">
        <div class="title-wrapper">
            <h1 class="main-title" data-text="PIXEL">PIXEL</h1>
            <h1 class="main-title" data-text="DANCE" style="margin-top: -0.2em;">DANCE</h1>
            <span class="subtitle">Rhythm Protocol</span>
        </div>

        <button class="start-btn" onclick="startGame()">PRESS START</button>

        <div class="menu-links">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        /**
         * PIXEL DANCE - ENGINE
         * Optimized for visual impact and performance.
         */
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let mouseX = 0;
        let mouseY = 0;

        // Configuration
        const config = {
            starCount: 400,
            gridSpeed: 0.005,
            sunSizeRatio: 0.25,
            laneColors: ['#ff00ff', '#00ffff', '#00ffff', '#ff00ff'] // Pink, Cyan, Cyan, Pink
        };

        // Data
        const stars = [];
        const notes = [];
        let noteTimer = 0;

        // --- Init ---
        function init() {
            resize();
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Init Stars
            for(let i=0; i<config.starCount; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.002 + 0.001
                });
            }
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Parallax
                const parallaxX = (mouseX - width/2) * star.y * 0.05;
                const parallaxY = (mouseY - height/2) * star.y * 0.02;
                
                // Twinkle
                const twinkle = 0.5 + 0.5 * Math.sin(time * 3 + star.x * 100);
                
                ctx.globalAlpha = star.alpha * twinkle;
                ctx.fillRect(
                    star.x * width + parallaxX, 
                    star.y * height + parallaxY, 
                    star.size, 
                    star.size
                );
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const sunX = cx + (mouseX - width/2) * 0.02; // Subtle parallax
            const cy = height * 0.35;
            const r = Math.min(width, height) * config.sunSizeRatio;

            // Glow
            const grd = ctx.createRadialGradient(sunX, cy, r * 0.2, sunX, cy, r * 3);
            grd.addColorStop(0, 'rgba(255, 230, 0, 0.6)');
            grd.addColorStop(0.4, 'rgba(255, 0, 255, 0.3)');
            grd.addColorStop(1, 'rgba(5, 0, 10, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            const sunGrd = ctx.createLinearGradient(sunX, cy - r, sunX, cy + r);
            sunGrd.addColorStop(0, '#ffe600');
            sunGrd.addColorStop(0.5, '#ff00ff');
            sunGrd.addColorStop(1, '#6600ff');
            ctx.fillStyle = sunGrd;
            ctx.fill();
            
            // Stripes (The "Blinds")
            ctx.save();
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#05000a'; // Background color
            
            const totalStripes = 15;
            const startOffset = 0.4; // Start stripes from 40% down
            for(let i = 0; i < totalStripes; i++) {
                const progress = i / totalStripes;
                // Exponential spacing
                const yPos = cy - r + (r * 2 * startOffset) + (progress * (r * 2 * (1-startOffset)));
                const thickness = 2 + (i * 3); // Get thicker at bottom
                
                ctx.fillRect(sunX - r, yPos, r * 2, thickness);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            
            // Mouse interaction on grid center
            const centerShift = (mouseX - width/2) * 0.15;
            const verticalShift = (mouseY - height/2) * 0.05;
            const dynamicCenter = centerX + centerShift;
            const dynamicHorizon = horizonY + verticalShift;

            const bottomWidth = Math.max(width * 2, 2000);
            const topWidth = 50;

            // 1. Vertical Lines
            ctx.globalCompositeOperation = 'lighter';
            
            for (let i = 0; i <= 4; i++) {
                const bottomX = dynamicCenter - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = dynamicCenter - (topWidth/2) + (i * (topWidth / 4));

                // Fade line at horizon
                const lineGrd = ctx.createLinearGradient(bottomX, height, topX, dynamicHorizon);
                lineGrd.addColorStop(0, 'rgba(255, 0, 255, 0.8)');
                lineGrd.addColorStop(0.5, 'rgba(255, 0, 255, 0.2)');
                lineGrd.addColorStop(1, 'rgba(255, 0, 255, 0)');

                ctx.strokeStyle = lineGrd;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff00ff';

                ctx.beginPath();
                ctx.moveTo(topX, dynamicHorizon);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving)
            time += config.gridSpeed;
            if (time > 1) time = 0;

            ctx.beginPath();
            const numLines = 30;
            
            for (let i = 0; i < numLines; i++) {
                const t = (i / numLines + time) % 1;
                
                // Perspective curve (power 2.5 bunches lines near horizon)
                const y = dynamicHorizon + (height - dynamicHorizon) * Math.pow(t, 2.5);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                const x1 = dynamicCenter - currentWidth / 2;
                const x2 = dynamicCenter + currentWidth / 2;

                ctx.globalAlpha = Math.pow(t, 1.5); // Fade near horizon
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 1 + (t * 4); // Thicker closer to camera

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            ctx.stroke();

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function spawnNote() {
            noteTimer++;
            // Rhythmic spawning
            if (noteTimer > 15 && Math.random() < 0.1) {
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    color: config.laneColors[laneIdx]
                });
                noteTimer = 0;
            }
        }

        function drawNotes() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.15;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.max(width * 2, 2000);
            const topWidth = 50;

            notes.forEach(note => {
                note.t += 0.02; // Note speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                // Calculate X based on lane
                const laneWidth = currentWidth / 4;
                const laneX = (dynamicCenter - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Scale size based on depth
                const noteSize = 10 + (60 * Math.pow(t, 2.5)); 

                // Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = note.color;
                ctx.fillStyle = note.color;
                
                // Draw Note
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner core
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
                
                // 3D Trail/Extrusion
                ctx.fillStyle = note.color;
                ctx.globalAlpha = 0.4;
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2 + noteSize/3, noteSize, noteSize * 0.3);
                ctx.globalAlpha = 1;
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.15;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.max(width * 2, 2000);
            const topWidth = 50;

            // Place hit line near bottom (t=0.95)
            const t = 0.95; 
            const y = horizonY + (height - horizonY) * Math.pow(t, 2.5);
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffffff';
            ctx.moveTo(dynamicCenter - currentWidth/2, y);
            ctx.lineTo(dynamicCenter + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#05000a';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.start-btn');
            // Glitch effect on click
            document.body.style.filter = 'invert(1)';
            setTimeout(() => {
                document.body.style.filter = 'none';
                btn.innerHTML = 'LOADING...';
                setTimeout(() => {
                    alert('Initializing Audio Engine... (Demo End)');
                    btn.innerHTML = 'PRESS START';
                }, 500);
            }, 100);
        }

        // Start
        init();

    </script>
</body>
</html>
