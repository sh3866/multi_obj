<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-deep: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffea00;
            --grid-color: rgba(255, 0, 255, 0.4);
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            font-family: var(--font-main);
        }

        /* --- Retro Visual Effects --- */
        
        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* Vignette & Chromatic Aberration hint */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.9) 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 99;
        }

        /* Canvas Container */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; 
        }

        /* --- Typography & Title --- */
        
        .title-container {
            margin-bottom: 80px;
            text-align: center;
            position: relative;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            font-weight: 900;
            color: #fff;
            /* Hard blocky shadow for pixel feel */
            text-shadow: 
                6px 6px 0px var(--neon-pink),
                -4px -4px 0px var(--neon-cyan);
            letter-spacing: -2px;
            transform: skewX(-12deg);
            position: relative;
            animation: titleFloat 4s ease-in-out infinite;
        }
        
        /* Double layer for glitch effect */
        h1::after {
            content: 'PIXEL DANCE';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: var(--neon-cyan);
            z-index: -1;
            opacity: 0.5;
            transform: translate(-3px, -3px);
            animation: glitchText 2.5s infinite linear alternate-reverse;
        }

        .subtitle {
            display: block;
            font-size: 1.2rem;
            color: var(--neon-yellow);
            letter-spacing: 10px;
            margin-top: 15px;
            text-shadow: 0 0 10px var(--neon-yellow);
            text-transform: uppercase;
            transform: skewX(-12deg);
        }

        @keyframes titleFloat {
            0%, 100% { transform: skewX(-12deg) translateY(0); }
            50% { transform: skewX(-12deg) translateY(-15px); }
        }

        @keyframes glitchText {
            0% { transform: translate(-3px, -3px); }
            20% { transform: translate(3px, -3px); }
            40% { transform: translate(-3px, 3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(-3px, -3px); }
            100% { transform: translate(0, 0); opacity: 0; }
        }

        /* --- Controls --- */

        .btn-start {
            pointer-events: auto;
            background: transparent;
            border: 3px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 18px 70px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px rgba(0, 255, 255, 0.2);
            text-shadow: 0 0 5px var(--neon-cyan);
            letter-spacing: 4px;
            transform: skewX(-12deg);
            overflow: hidden;
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 50px var(--neon-cyan), inset 0 0 0px var(--neon-cyan);
            text-shadow: none;
            transform: skewX(-12deg) scale(1.05);
        }
        
        .btn-start:active {
            transform: skewX(-12deg) scale(0.98);
        }

        .menu-options {
            margin-top: 40px;
            display: flex;
            gap: 50px;
            pointer-events: auto;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: all 0.2s;
            cursor: pointer;
            letter-spacing: 2px;
            position: relative;
        }

        .menu-link:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }
        
        .menu-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--neon-yellow);
            transition: width 0.3s;
        }
        
        .menu-link:hover::after {
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .subtitle { font-size: 0.9rem; letter-spacing: 5px; }
            .btn-start { padding: 15px 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>Pixel<br>Dance</h1>
            <span class="subtitle">Rhythm Protocol</span>
        </div>

        <button class="btn-start" onclick="startGame()">PRESS START</button>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let mouseX = 0;

        // Configuration
        const lanes = [
            { color: '#ff00ff', glow: '#ff00ff' }, // Pink
            { color: '#00ffff', glow: '#00ffff' }, // Cyan
            { color: '#00ffff', glow: '#00ffff' }, // Cyan
            { color: '#ff00ff', glow: '#ff00ff' }  // Pink
        ];
        
        // Stars
        const stars = [];
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4, // Sky area
                size: Math.random() * 2 + 1,
                alpha: Math.random(),
                speed: Math.random() * 0.002 + 0.001
            });
        }

        // Notes
        const notes = [];
        let noteTimer = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
        });
        resize();

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Parallax effect based on mouse
                const parallaxX = (mouseX - width/2) * star.y * 0.05;
                
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.1 + star.x * 10));
                ctx.fillRect(
                    star.x * width + parallaxX, 
                    star.y * height, 
                    star.size, 
                    star.size
                );
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            // Sun moves slightly with mouse (parallax)
            const sunX = cx + (mouseX - width/2) * 0.05;
            const cy = height * 0.35;
            const r = Math.min(width, height) * 0.18;

            // Massive Glow
            const grd = ctx.createRadialGradient(sunX, cy, r * 0.5, sunX, cy, r * 2.5);
            grd.addColorStop(0, 'rgba(255, 234, 0, 0.4)');
            grd.addColorStop(0.5, 'rgba(255, 0, 255, 0.2)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffea00'; // Bright yellow
            ctx.fill();
            
            // Horizontal Stripes (The "Blind" look)
            ctx.save();
            ctx.beginPath();
            ctx.arc(sunX, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            // Dynamic stripe thickness based on Y
            ctx.fillStyle = '#050011'; // Matches BG
            const totalStripes = 12;
            for(let i = 0; i < totalStripes; i++) {
                const y = cy - r + (i * (2 * r / totalStripes));
                const h = (i * (2 * r / totalStripes) * 0.4) + 2; // Get thicker at bottom
                ctx.fillRect(sunX - r, y, r * 2, h);
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45; // Horizon line
            const centerX = width / 2;
            
            // Mouse parallax for the grid center
            const centerShift = (mouseX - width/2) * 0.2;
            const dynamicCenter = centerX + centerShift;

            // Dimensions
            const bottomWidth = Math.min(width * 1.2, 1200); // Wider than screen for immersion
            const topWidth = 50; // Vanishing point width

            // 1. Vertical Lines (Perspective)
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'var(--neon-pink)';
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.6)';

            // Draw 5 lines for 4 lanes
            for (let i = 0; i <= 4; i++) {
                // Calculate X positions
                const bottomX = dynamicCenter - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = dynamicCenter - (topWidth/2) + (i * (topWidth / 4));

                ctx.beginPath();
                ctx.moveTo(topX, horizonY);
                ctx.lineTo(bottomX, height);
                ctx.stroke();
            }

            // 2. Horizontal Lines (Moving)
            // We use logarithmic spacing to simulate 3D depth
            const speed = 0.0015;
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.4)'; // Slightly less intense
            ctx.shadowColor = 'rgba(255, 0, 255, 0.8)';
            
            // Draw 20 lines
            for (let i = 0; i < 25; i++) {
                // t goes from 0 (horizon) to 1 (bottom)
                // We offset by 'time' to make it scroll
                const t = (i / 25 + time) % 1;
                
                // Perspective projection math:
                // y = horizon + (dist - horizon) * (t^power)
                // Power < 1 spreads lines out, Power > 1 bunches them at horizon
                const y = horizonY + (height - horizonY) * Math.pow(t, 2.2);
                
                // Width interpolation
                // Linear is okay, but power matches the Y curve
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
                
                const x1 = dynamicCenter - currentWidth / 2;
                const x2 = dynamicCenter + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset
        }

        function spawnNote() {
            noteTimer++;
            // Spawn rhythmically or randomly
            if (noteTimer > 20 && Math.random() < 0.08) {
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, // 0 = horizon, 1 = bottom
                    active: true
                });
                noteTimer = 0;
            }
        }

        function drawNotes() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.2;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.min(width * 1.2, 1200);
            const topWidth = 50;

            notes.forEach(note => {
                note.t += 0.008; // Note speed
                if (note.t > 1.1) note.active = false;

                // Perspective math (same as grid)
                const t = note.t;
                const y = horizonY + (height - horizonY) * Math.pow(t, 2.2);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
                
                // Lane X calculation
                const laneWidth = currentWidth / 4;
                // Center of the lane
                const laneX = (dynamicCenter - currentWidth / 2) + (note.lane * laneWidth) + (laneWidth / 2);

                // Draw Note
                // Scale size based on depth (closer = bigger)
                const noteSize = 8 + (50 * Math.pow(t, 2.2)); 
                const noteColor = lanes[note.lane].color;

                ctx.fillStyle = noteColor;
                ctx.shadowBlur = 20;
                ctx.shadowColor = noteColor;
                
                // Draw a square note
                ctx.fillRect(laneX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner white core for "hot" pixel look
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const centerShift = (mouseX - width/2) * 0.2;
            const dynamicCenter = centerX + centerShift;
            const bottomWidth = Math.min(width * 1.2, 1200);
            const topWidth = 50;

            // Place hit line near bottom (t=0.95)
            const t = 0.95; 
            const y = horizonY + (height - horizonY) * Math.pow(t, 2.2);
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';
            ctx.moveTo(dynamicCenter - currentWidth/2, y);
            ctx.lineTo(dynamicCenter + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear with deep purple/black
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            
            // Draw Hit Line
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            // Glitch out effect
            document.body.style.filter = 'invert(1)';
            setTimeout(() => {
                document.body.style.filter = 'none';
                btn.innerHTML = 'LOADING...';
                // Visual feedback only for this demo
                setTimeout(() => {
                    alert('Initializing Audio Engine... (Demo End)');
                    btn.innerHTML = 'PRESS START';
                }, 500);
            }, 100);
        }

        animate();

    </script>
</body>
</html>
