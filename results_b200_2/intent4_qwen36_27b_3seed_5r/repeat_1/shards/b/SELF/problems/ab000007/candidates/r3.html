<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina Collector</title>
<style>
  :root {
    --bg-deep: #030308;
    --bg-light: #0b0b1a;
    --glass-surface: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #6b7a99;
    
    /* Accents */
    --cyan: #00f0ff;
    --magenta: #ff00aa;
    --gold: #ffcc00;
    --teal: #00ffaa;
    
    --font-stack: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; cursor: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-deep);
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2.5rem 4rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .brand h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    margin: 0;
    text-transform: uppercase;
    color: var(--text-main);
    text-shadow: 0 0 30px rgba(255,255,255,0.15);
  }

  .brand p {
    font-size: 0.65rem;
    color: var(--cyan);
    margin: 0;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0.9;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background-color: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 0.5; transform: scale(1); }
  }

  /* HUD Panel */
  .hud-panel {
    display: flex;
    gap: 3rem;
    background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 1rem 3rem;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    position: relative;
  }

  .hud-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }

  .stat-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 60px;
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  .stat-value {
    font-size: 2rem;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .val-cyan { color: var(--cyan); text-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }
  .val-gold { color: var(--gold); text-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }

  /* Footer & Button */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 3rem;
    width: 100%;
  }

  .capture-btn {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 1.2rem 4rem;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    cursor: none;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    position: relative;
    overflow: hidden;
    outline: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .capture-btn:hover {
    background: rgba(0, 240, 255, 0.08);
    border-color: rgba(0, 240, 255, 0.5);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
    transform: translateY(-3px);
    letter-spacing: 0.4em;
  }

  .capture-btn:active {
    transform: scale(0.96);
    border-color: var(--cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    background: rgba(10, 10, 20, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 1.2rem 3rem;
    border-radius: 8px;
    color: var(--text-main);
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.75rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    gap: 1.2rem;
    z-index: 100;
  }

  .toast-icon {
    width: 8px; height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--cyan);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Responsive Tweaks */
  @media (max-width: 768px) {
    .ui-layer { padding: 1.5rem; }
    .hud-panel { padding: 0.8rem 1.5rem; gap: 1.5rem; }
    .stat-value { font-size: 1.5rem; }
    .capture-btn { padding: 1rem 2.5rem; font-size: 0.75rem; }
  }
</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <header>
      <div class="brand">
        <h1>Lumina Collector</h1>
        <p><span class="status-dot"></span> System: Scanning</p>
      </div>
      <div class="hud-panel">
        <div class="stat-group">
          <span class="stat-label">Specimens</span>
          <span class="stat-value val-cyan" id="scoreVal">00</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">Net Charge</span>
          <span class="stat-value val-gold" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      <div class="toast-icon"></div>
      <span id="toastMsg">Specimen Acquired</span>
    </div>

    <footer>
      <button class="capture-btn" id="collectBtn">Engage Net</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE & LOGIC
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const energyEl = document.getElementById('energyVal');
const toastEl = document.getElementById('toast');
const toastMsgEl = document.getElementById('toastMsg');

let width, height;
let score = 0;
let time = 0;
let energy = 100;
let mouseX = 0;
let mouseY = 0;

const COLORS = {
  bg: '#05050c',
  entities: [
    { core: '#00f0ff', glow: '#0077ff' }, // Cyan
    { core: '#ff00aa', glow: '#aa00ff' }, // Magenta
    { core: '#ffcc00', glow: '#ff8800' }, // Gold
    { core: '#00ffaa', glow: '#00aa77' }  // Teal
  ]
};

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();
mouseX = width / 2;
mouseY = height / 2;

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'burst') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'burst') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.decay = Math.random() * 0.03 + 0.015;
      this.size = Math.random() * 3 + 1;
    } else {
      // Trailing particle
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.decay = 0.02;
      this.size = Math.random() * 2 + 0.5;
    }
    
    this.life = 1.0;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if(this.type === 'burst') {
      this.vx *= 0.92;
      this.vy *= 0.92;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.radius = Math.random() * 18 + 12;
    
    // Spawn logic
    if (initial) {
      this.x = Math.random() * (width - 100) + 50;
      this.y = Math.random() * (height - 100) + 50;
    } else {
      const edge = Math.floor(Math.random() * 4);
      if (edge === 0) { this.x = -50; this.y = Math.random() * height; }
      if (edge === 1) { this.x = width + 50; this.y = Math.random() * height; }
      if (edge === 2) { this.x = Math.random() * width; this.y = -50; }
      if (edge === 3) { this.x = Math.random() * width; this.y = height + 50; }
    }
    
    // Target logic
    this.targetX = Math.random() * (width - 100) + 50;
    this.targetY = Math.random() * (height - 100) + 50;
    
    this.vx = 0;
    this.vy = 0;
    this.friction = 0.98;
    this.ease = 0.015 + Math.random() * 0.01;
    
    const type = COLORS.entities[Math.floor(Math.random() * COLORS.entities.length)];
    this.colorCore = type.core;
    this.colorGlow = type.glow;
    
    this.phase = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.03 + 0.01;
  }

  update() {
    // Move towards target
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < 30) {
      this.targetX = Math.random() * (width - 100) + 50;
      this.targetY = Math.random() * (height - 100) + 50;
    }

    this.vx += dx * this.ease * 0.1;
    this.vy += dy * this.ease * 0.1;

    // Wobble effect
    this.x += Math.sin(time * this.wobbleSpeed + this.phase) * 0.5;
    this.y += Math.cos(time * this.wobbleSpeed + this.phase) * 0.5;

    this.vx *= this.friction;
    this.vy *= this.friction;
    
    this.x += this.vx;
    this.y += this.vy;

    // Wrap around if far off screen
    if (this.x < -150) this.x = width + 150;
    if (this.x > width + 150) this.x = -150;
    if (this.y < -150) this.y = height + 150;
    if (this.y > height + 150) this.y = -150;
  }

  draw(ctx) {
    const pulse = Math.sin(time * 0.05 + this.phase) * 2;
    const r = this.radius + pulse;

    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Outer Glow
    ctx.globalCompositeOperation = 'screen';
    const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 3);
    grad.addColorStop(0, this.colorCore);
    grad.addColorStop(0.4, this.colorGlow);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 3, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.colorCore;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 70;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.12;
    this.y += (mouseY - this.y) * 0.12;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(time * 0.005);

    // Outer Ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Active Ring
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.65, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Crosshairs
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    // Horizontal
    ctx.moveTo(-this.radius - 10, 0); ctx.lineTo(-this.radius + 15, 0);
    ctx.moveTo(this.radius - 15, 0); ctx.lineTo(this.radius + 10, 0);
    // Vertical
    ctx.moveTo(0, -this.radius - 10); ctx.lineTo(0, -this.radius + 15);
    ctx.moveTo(0, this.radius - 15); ctx.lineTo(0, this.radius + 10);
    ctx.stroke();
    
    // Center dot
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const net = new Net();

// Initialize Creatures
for (let i = 0; i < 7; i++) {
  creatures.push(new Creature());
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

function attemptCapture() {
  if (energy < 10) {
    showToast("Insufficient Energy");
    return;
  }

  // Net Effect
  createExplosion(net.x, net.y, '#fff', 10);
  energy -= 10;
  updateEnergy();

  let caught = false;
  
  // Check collisions
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Capture radius slightly larger than visual
    if (dist < net.radius + c.radius) {
      createExplosion(c.x, c.y, c.colorCore, 30);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score < 10 ? '0' + score : score;
      caught = true;
      
      // Respawn logic
      setTimeout(() => creatures.push(new Creature()), 1500);
    }
  }

  if (caught) {
    showToast("Specimen Acquired");
  }
}

function createExplosion(x, y, color, count = 15) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color, 'burst'));
  }
}

function updateEnergy() {
  energyEl.innerText = energy + '%';
}

let toastTimeout;
function showToast(msg) {
  toastMsgEl.innerText = msg;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth; // trigger reflow
  toastEl.classList.add('show');
  
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Stars
const stars = [];
for(let i=0; i<200; i++) {
  stars.push({
    x: Math.random() * 3000,
    y: Math.random() * 3000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.3 + 0.05
  });
}

function drawBackground() {
  // Deep space gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#030308');
  grad.addColorStop(1, '#0b0b1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Draw Stars
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    // Parallax
    const parallaxX = (mouseX - width/2) * star.speed * 0.02;
    const parallaxY = (mouseY - height/2) * star.speed * 0.02;
    
    // Twinkle
    const twinkle = Math.abs(Math.sin(time * 0.02 + star.x)) * star.alpha;
    
    ctx.globalAlpha = twinkle;
    ctx.beginPath();
    ctx.arc((star.x % width) + parallaxX, (star.y % height) + parallaxY, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

// Energy Regen
setInterval(() => {
  if (energy < 100) {
    energy++;
    updateEnergy();
  }
}, 500);

function animate() {
  time++;
  
  drawBackground();

  // Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Draw Net
  net.update();
  net.draw(ctx);

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
