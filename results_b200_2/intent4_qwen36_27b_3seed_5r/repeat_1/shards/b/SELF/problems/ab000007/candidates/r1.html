<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina Collector</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-light: #121225;
    --glass: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.15);
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff00aa;
    --accent-gold: #ffcc00;
    --font-display: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; cursor: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-deep);
    overflow: hidden;
    font-family: var(--font-display);
    color: var(--text-main);
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2.5rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .title-block h1 {
    font-size: 1.8rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    margin: 0;
    text-transform: uppercase;
    color: var(--text-main);
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }

  .title-block p {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    margin: 0;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* HUD Card */
  .hud-stats {
    display: flex;
    gap: 2rem;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 1rem 2rem;
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  /* Subtle sheen on HUD */
  .hud-stats::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 60px;
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    letter-spacing: -0.02em;
  }

  #scoreVal { color: var(--accent-cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
  #energyVal { color: var(--accent-gold); text-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 2rem;
  }

  .action-btn {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 1.2rem 3rem;
    border-radius: 100px;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: none; /* Custom cursor handles this */
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    position: relative;
    overflow: hidden;
    outline: none;
  }

  .action-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }

  .action-btn:hover {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    transform: translateY(-2px);
    letter-spacing: 0.25em;
  }
  
  .action-btn:hover::after {
    left: 100%;
  }

  .action-btn:active {
    transform: scale(0.98);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    padding: 1rem 2.5rem;
    border-radius: 4px;
    color: var(--text-main);
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .toast::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--accent-cyan);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-cyan);
  }
  
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Lumina Collector</h1>
        <p>System: <span id="sysStatus">Scanning</span></p>
      </div>
      <div class="hud-stats">
        <div class="stat">
          <span class="stat-label">Specimens</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Net Charge</span>
          <span class="stat-value" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">Specimen Acquired</div>

    <footer>
      <button class="action-btn" id="collectBtn">Engage Net</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * High-fidelity rendering with additive blending, organic movement, and depth.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const energyEl = document.getElementById('energyVal');
const toastEl = document.getElementById('toast');
const sysStatusEl = document.getElementById('sysStatus');

let width, height;
let score = 0;
let time = 0;
let energy = 100;
let mouseX = 0;
let mouseY = 0;
let isMouseDown = false;

// Colors
const PALETTE = {
  bgDeep: '#050510',
  bgLight: '#121225',
  creatures: [
    { core: '#00f0ff', glow: '#0088ff' }, // Cyan
    { core: '#ff00aa', glow: '#aa00ff' }, // Magenta
    { core: '#ffcc00', glow: '#ff8800' }, // Gold
    { core: '#ffffff', glow: '#aaddff' }  // White
  ]
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();
mouseX = width / 2;
mouseY = height / 2;

// --- Classes ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.01;
    this.size = Math.random() * 2 + 0.5;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95; // Friction
    this.vy *= 0.95;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.radius = Math.random() * 15 + 10;
    
    // Spawn logic: avoid edges slightly
    const margin = 100;
    this.x = initial ? Math.random() * (width - margin*2) + margin : Math.random() < 0.5 ? -50 : width + 50;
    this.y = Math.random() * height;
    
    // Target location for organic movement
    this.targetX = Math.random() * width;
    this.targetY = Math.random() * height;
    
    // Physics
    this.vx = 0;
    this.vy = 0;
    this.friction = 0.96;
    this.ease = 0.02 + Math.random() * 0.03;
    
    // Visuals
    const type = PALETTE.creatures[Math.floor(Math.random() * PALETTE.creatures.length)];
    this.colorCore = type.core;
    this.colorGlow = type.glow;
    
    this.phase = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.05 + 0.02;
  }

  update() {
    // Organic movement logic (seek target)
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < 50) {
      // Pick new target
      this.targetX = Math.random() * width;
      this.targetY = Math.random() * height;
    }

    this.vx += dx * this.ease * 0.05;
    this.vy += dy * this.ease * 0.05;

    // Add wobble
    this.x += Math.sin(time * this.wobbleSpeed + this.phase) * 0.5;

    this.vx *= this.friction;
    this.vy *= this.friction;
    
    this.x += this.vx;
    this.y += this.vy;

    // Soft boundary wrapping
    if (this.x < -100) this.x = width + 100;
    if (this.x > width + 100) this.x = -100;
    if (this.y < -100) this.y = height + 100;
    if (this.y > height + 100) this.y = -100;
  }

  draw(ctx) {
    const pulse = Math.sin(time * 0.05 + this.phase) * 3;
    const r = this.radius + pulse;

    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Outer Glow
    ctx.shadowBlur = 30;
    ctx.shadowColor = this.colorGlow;
    ctx.globalCompositeOperation = 'screen'; // Additive blending for glow

    // Aura
    const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.5);
    grad.addColorStop(0, this.colorCore);
    grad.addColorStop(0.5, this.colorGlow);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Core Eye
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 60;
    this.active = false;
    this.pulse = 0;
  }

  update() {
    // Smooth follow with lag
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.pulse += 0.1;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Rotate slightly
    ctx.rotate(time * 0.01);

    // Outer Ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Active Ring
    const pulseSize = Math.sin(this.pulse) * 5;
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6 + pulseSize, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshairs
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-this.radius - 10, 0); ctx.lineTo(-this.radius + 10, 0);
    ctx.moveTo(this.radius - 10, 0); ctx.lineTo(this.radius + 10, 0);
    ctx.moveTo(0, -this.radius - 10); ctx.lineTo(0, -this.radius + 10);
    ctx.moveTo(0, this.radius - 10); ctx.lineTo(0, this.radius + 10);
    ctx.stroke();
    
    // Center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const net = new Net();

// Initialize creatures
for (let i = 0; i < 8; i++) {
  creatures.push(new Creature());
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  if (energy < 10) {
    showToast("Insufficient Energy");
    return;
  }

  // Visual feedback for button press
  createExplosion(net.x, net.y, '#fff');
  energy -= 10;
  updateEnergy();

  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < net.radius + c.radius) {
      // Captured!
      createExplosion(c.x, c.y, c.colorCore);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score < 10 ? '0' + score : score;
      caught = true;
      
      // Respawn
      setTimeout(() => creatures.push(new Creature()), 2000);
    }
  }

  if (caught) {
    showToast("Specimen Acquired");
    sysStatusEl.innerText = "Capturing...";
    setTimeout(() => sysStatusEl.innerText = "Scanning", 1000);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function updateEnergy() {
  energyEl.innerText = energy + '%';
}

function showToast(msg) {
  // Reset animation
  toastEl.classList.remove('show');
  void toastEl.offsetWidth; 
  toastEl.querySelector('span') ? null : null; // Force reflow hack if needed, but class toggle works
  toastEl.innerHTML = msg;
  toastEl.classList.add('show');
  
  // Clear previous timeout if exists (simple implementation)
  if (window.toastTimeout) clearTimeout(window.toastTimeout);
  window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Stars
const stars = [];
for(let i=0; i<150; i++) {
  stars.push({
    x: Math.random() * 3000,
    y: Math.random() * 3000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.2 + 0.05
  });
}

function drawBackground() {
  // Deep space gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, PALETTE.bgDeep);
  grad.addColorStop(1, PALETTE.bgLight);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Stars
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    // Parallax effect based on mouse
    const parallaxX = (mouseX - width/2) * star.speed * 0.05;
    const parallaxY = (mouseY - height/2) * star.speed * 0.05;
    
    ctx.globalAlpha = Math.abs(Math.sin(time * 0.005 + star.x)) * star.alpha;
    ctx.beginPath();
    ctx.arc((star.x % width) + parallaxX, (star.y % height) + parallaxY, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
  
  // Subtle Nebula (static for performance, could be animated)
  ctx.globalCompositeOperation = 'screen';
  const nebula = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, width);
  nebula.addColorStop(0, 'rgba(20, 30, 60, 0.2)');
  nebula.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = nebula;
  ctx.fillRect(0,0,width,height);
  ctx.globalCompositeOperation = 'source-over';
}

// Recharge energy slowly
setInterval(() => {
  if (energy < 100) {
    energy++;
    updateEnergy();
  }
}, 500);

// Main Loop
function animate() {
  time++;
  
  drawBackground();

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update();
  net.draw(ctx);

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
