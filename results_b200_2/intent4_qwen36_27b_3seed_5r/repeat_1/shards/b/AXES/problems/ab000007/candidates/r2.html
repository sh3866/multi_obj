<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-haze: #1a1c2e;
    --accent-cyan: #00f0ff;
    --accent-purple: #9d4edd;
    --accent-pink: #ff007f;
    --text-white: #ffffff;
    --text-dim: #8b9bb4;
    
    --glass-surface: rgba(10, 12, 20, 0.45);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Segoe UI", -apple-system, sans-serif; /* Fallback friendly */
    
    --radius-ui: 16px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-deep);
    font-family: var(--font-main);
    color: var(--text-white);
    -webkit-font-smoothing: antialiased;
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* --- HUD & Header --- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    animation: fadeInDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  .brand h1 {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin: 0;
    line-height: 1;
    text-transform: uppercase;
    /* Iridescent text */
    background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.2));
  }

  .brand span {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent-cyan);
    margin-top: 0.5rem;
    text-transform: uppercase;
    opacity: 0.9;
  }

  /* Floating HUD Pill */
  .hud-pill {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: var(--radius-pill);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 2rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .stat-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    position: relative;
  }

  .stat-group:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -1rem;
    top: 50%;
    transform: translateY(-50%);
    height: 24px;
    width: 1px;
    background: rgba(255,255,255,0.1);
  }

  .stat-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-white);
    line-height: 1;
  }

  .stat-value.accent {
    color: var(--accent-purple);
    text-shadow: 0 0 10px rgba(157, 78, 221, 0.4);
  }

  /* --- Footer & Action --- */
  footer {
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    margin-top: auto;
    padding-bottom: 1rem;
    animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  .action-btn {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(157, 78, 221, 0.1));
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--accent-cyan);
    padding: 1.25rem 4rem;
    border-radius: var(--radius-pill);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 0 0 rgba(0, 240, 255, 0), 0 10px 30px -10px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  /* Button Shine Effect */
  .action-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: 0.5s;
  }

  .action-btn:hover {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(157, 78, 221, 0.2));
    border-color: var(--accent-cyan);
    color: #fff;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), 0 15px 40px -10px rgba(0,0,0,0.6);
    transform: translateY(-2px) scale(1.02);
  }

  .action-btn:hover::before {
    left: 100%;
  }

  .action-btn:active {
    transform: translateY(1px) scale(0.98);
  }

  /* --- Feedback Toast --- */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(10, 12, 20, 0.85);
    border: 1px solid var(--accent-purple);
    padding: 1.5rem 3rem;
    border-radius: var(--radius-ui);
    color: #fff;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 50px rgba(157, 78, 221, 0.3);
    text-align: center;
    z-index: 20;
    backdrop-filter: blur(8px);
  }
  
  .toast h3 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--accent-purple);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .toast p {
    margin: 0.5rem 0 0 0;
    font-size: 0.9rem;
    color: var(--text-dim);
    font-weight: 400;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* --- Noise Overlay --- */
  .noise-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0.05; /* Lowered opacity per critique */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Animations */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div class="noise-overlay"></div>

  <div class="ui-layer">
    <!-- Header: Title & HUD -->
    <header>
      <div class="brand">
        <h1>Aether Catch</h1>
        <span>Field Research Unit</span>
      </div>
      
      <div class="hud-pill">
        <div class="stat-group">
          <span class="stat-label">Specimens</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">Net Charge</span>
          <span class="stat-value accent" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
      <h3>Specimen Secured</h3>
      <p>Aether Entity contained.</p>
    </div>

    <!-- Footer: Primary Action -->
    <footer>
      <button class="action-btn" id="collectBtn">Capture</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Reimagined with distinct creature silhouettes, atmospheric depth,
 * and a cohesive "living scene" aesthetic.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let energy = 100;
let time = 0;

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    } else if (type === 'dust') {
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.life = 1.0;
      this.decay = Math.random() * 0.003 + 0.001;
      this.size = Math.random() * 2 + 0.5;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.type === 'spark') {
      this.vx *= 0.92;
      this.vy *= 0.92;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    // Distinct sizes
    this.size = Math.random() * 20 + 25; 
    
    // Spawn positions
    const cx = width / 2;
    const cy = height / 2;
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * (Math.min(width, height) * 0.35);
    
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    
    // Movement
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.wobbleSpeed = Math.random() * 0.03 + 0.02;
    this.wobbleOffset = Math.random() * Math.PI * 2;
    
    // Appearance: Defined Silhouettes
    // 0: Jellyfish, 1: Geometric Shard, 2: Orb
    this.type = Math.floor(Math.random() * 3); 
    
    const colorChoice = Math.random();
    if (colorChoice < 0.33) {
        this.hue = 180; // Cyan
        this.color = '#00f0ff';
        this.glow = '#00f0ff';
    } else if (colorChoice < 0.66) {
        this.hue = 270; // Purple
        this.color = '#9d4edd';
        this.glow = '#9d4edd';
    } else {
        this.hue = 330; // Pink
        this.color = '#ff007f';
        this.glow = '#ff007f';
    }
    
    // Animation state
    this.history = [];
    this.historyLimit = 6;
    this.blinkTimer = 0;
    this.isBlinking = false;
  }

  update() {
    // Organic movement
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.8;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed * 0.8 + this.wobbleOffset) * 0.8;

    // Soft containment
    const cx = width / 2;
    const cy = height / 2;
    const dx = cx - this.x;
    const dy = cy - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > Math.min(width, height) * 0.4) {
      this.vx += dx * 0.0008;
      this.vy += dy * 0.0008;
    }

    // Velocity damping
    this.vx *= 0.99;
    this.vy *= 0.99;

    // History for trails
    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) {
      this.history.shift();
    }

    // Blinking
    this.blinkTimer++;
    if (this.blinkTimer > 200 && Math.random() < 0.02) this.isBlinking = true;
    if (this.isBlinking && this.blinkTimer > 220) this.isBlinking = false;
    if (this.isBlinking && this.blinkTimer > 240) this.blinkTimer = 0;
  }

  draw(ctx) {
    const pulse = Math.sin(time * 0.05) * 3;
    
    // Draw Trails (Tentacles/Wings)
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < this.history.length - 1; i++) {
      const pos = this.history[i];
      const nextPos = this.history[i+1];
      const progress = i / this.history.length;
      
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(nextPos.x, nextPos.y);
      
      ctx.strokeStyle = this.color;
      ctx.globalAlpha = progress * 0.4;
      ctx.lineWidth = (this.size * 0.2) * progress;
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.sin(time * 0.02) * 0.1); // Subtle rotation

    // Glow
    ctx.shadowBlur = 25;
    ctx.shadowColor = this.glow;

    // Draw Silhouette based on type
    if (this.type === 0) {
        // Jellyfish / Spirit
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size + pulse);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, this.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, this.size + pulse, 0, Math.PI * 2);
        ctx.fill();
    } else if (this.type === 1) {
        // Geometric Shard
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -(this.size + pulse));
        ctx.lineTo(this.size/1.5, this.size/2);
        ctx.lineTo(-this.size/1.5, this.size/2);
        ctx.closePath();
        ctx.fill();
    } else {
        // Orb with Core
        const grad = ctx.createRadialGradient(0, 0, this.size*0.2, 0, 0, this.size);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.3, this.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
    }

    // Inner Core / Eye (Common to all)
    if (!this.isBlinking) {
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.2, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
    ctx.shadowBlur = 0;
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.targetX = width / 2;
    this.targetY = height / 2;
    this.radius = 60;
    this.angle = 0;
  }

  update() {
    // Smooth follow
    this.x += (this.targetX - this.x) * 0.12;
    this.y += (this.targetY - this.y) * 0.12;
    this.angle += 0.015;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Outer Energy Ring
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius + 10, 0, Math.PI * 2);
    ctx.stroke();

    // The "Net" Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    // Draw a hexagonal grid pattern
    for(let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i + this.angle;
        const nextA = (Math.PI * 2 / 6) * (i+1) + this.angle;
        
        // Radial lines
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a) * this.radius, Math.sin(a) * this.radius);
        
        // Connecting arcs
        ctx.moveTo(Math.cos(a) * this.radius, Math.sin(a) * this.radius);
        ctx.arc(0, 0, this.radius, a, nextA);
    }
    ctx.stroke();

    // Inner Core (Player Avatar)
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 15);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.5, 'var(--accent-cyan)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = grad;
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'var(--accent-cyan)';
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.shadowBlur = 0;
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize creatures
for (let i = 0; i < 6; i++) {
  creatures.push(new Creature());
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  net.targetX = mouseX;
  net.targetY = mouseY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  net.targetX = mouseX;
  net.targetY = mouseY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  if (energy < 10) return; 

  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Capture radius
    if (dist < net.radius + c.size) {
      // Captured!
      createExplosion(c.x, c.y, c.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score < 10 ? '0'+score : score;
      energy = Math.max(0, energy - 15);
      energyEl.innerText = energy + '%';
      caught = true;
      
      // Respawn after delay
      setTimeout(() => creatures.push(new Creature()), 1500);
    }
  }

  if (caught) {
    showToast();
    // Button feedback
    const btn = document.getElementById('collectBtn');
    btn.style.borderColor = '#fff';
    btn.style.boxShadow = '0 0 40px rgba(0, 240, 255, 0.6)';
    setTimeout(() => {
        btn.style.borderColor = '';
        btn.style.boxShadow = '';
    }, 200);
  } else {
      // Miss feedback
      energy = Math.max(0, energy - 5);
      energyEl.innerText = energy + '%';
      // Shake effect on button
      const btn = document.getElementById('collectBtn');
      btn.style.transform = 'translateX(5px)';
      setTimeout(() => btn.style.transform = '', 100);
  }
}

// Energy Regen
setInterval(() => {
    if (energy < 100) {
        energy += 2;
        energyEl.innerText = energy + '%';
    }
}, 500);

function createExplosion(x, y, color) {
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Elements
const clouds = [];
for(let i=0; i<6; i++) {
    clouds.push({
        x: Math.random() * 2000,
        y: Math.random() * 2000,
        r: Math.random() * 400 + 150,
        color: Math.random() > 0.5 ? 'rgba(30, 20, 60, 0.3)' : 'rgba(10, 30, 60, 0.3)'
    });
}

const stars = [];
for(let i=0; i<200; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.05 + 0.01
  });
}

function drawBackground() {
  // 1. Deep Space Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#050508');
  grad.addColorStop(1, '#11111a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // 2. Nebula Clouds
  clouds.forEach(cloud => {
      cloud.x -= 0.1;
      if(cloud.x + cloud.r < 0) cloud.x = width + cloud.r;
      
      const g = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
      g.addColorStop(0, cloud.color);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(cloud.x - cloud.r, cloud.y - cloud.r, cloud.r*2, cloud.r*2);
  });

  // 3. Stars
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    const twinkle = Math.abs(Math.sin(time * star.speed));
    ctx.globalAlpha = twinkle * 0.7;
    ctx.beginPath();
    ctx.arc(star.x % width, star.y % height, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

// Main Loop
function animate() {
  time++;
  
  drawBackground();

  // Ambient Dust
  if (Math.random() < 0.15) {
      particles.push(new Particle(Math.random() * width, Math.random() * height, 'rgba(255,255,255,0.2)', 'dust'));
  }

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update();
  net.draw(ctx);

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Vignette
  const radGrad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
  radGrad.addColorStop(0, 'transparent');
  radGrad.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0,0,width,height);

  requestAnimationFrame(animate);
}

animate();

</script>
