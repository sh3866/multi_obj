<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-dark: #020617;
    --bg-light: #1e1b4b;
    --accent-primary: #22d3ee; /* Cyan */
    --accent-secondary: #c084fc; /* Purple */
    --accent-tertiary: #f472b6; /* Pink */
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-stack);
    background-color: var(--bg-dark);
    color: var(--text-main);
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    /* Subtle vignette overlay via CSS on top of canvas logic if needed, but we do it in canvas */
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Unified Header Bar */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
    /* Unified background to connect title and stats */
    background: linear-gradient(180deg, rgba(2, 6, 23, 0.8) 0%, rgba(2, 6, 23, 0) 100%);
    padding: 1rem 1.5rem;
    border-radius: 16px;
    backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border);
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title-block h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0;
    text-transform: uppercase;
    /* Mystical gradient text */
    background: linear-gradient(135deg, #fff 0%, var(--accent-primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
  }

  .title-block p {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-primary);
    margin: 0.25rem 0 0 0;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .hud-stats {
    display: flex;
    gap: 2.5rem;
    align-items: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
  }

  .stat-value.energy {
    color: var(--accent-secondary);
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    padding-bottom: 1rem;
    margin-top: auto;
  }

  .action-btn {
    /* Ghost style as per critique to demote from primary focus */
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.7);
    padding: 1rem 3rem;
    border-radius: 50px; /* Pill shape */
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .action-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent-primary);
    color: #fff;
    box-shadow: 0 0 25px rgba(34, 211, 238, 0.2);
    transform: translateY(-2px);
  }

  .action-btn:active {
    transform: translateY(1px);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--accent-primary);
    padding: 1.25rem 2.5rem;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 40px rgba(34, 211, 238, 0.3);
    text-align: center;
    z-index: 20;
  }
  
  .toast h3 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--accent-primary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  
  .toast p {
    margin: 0.25rem 0 0 0;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Grain Overlay for Atmosphere */
  .noise-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }
</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div class="noise-overlay"></div>

  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether Catch</h1>
        <p>System: Active</p>
      </div>
      <div class="hud-stats">
        <div class="stat">
          <span class="stat-label">Collected</span>
          <span class="stat-value" id="scoreVal">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Net Energy</span>
          <span class="stat-value energy" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      <h3>Captured!</h3>
      <p>Aether Spirit secured.</p>
    </div>

    <footer>
      <button class="action-btn" id="collectBtn">Open Collection</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Reimagined for biological "creatures" and atmospheric depth.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let energy = 100;
let time = 0;

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.015;
      this.size = Math.random() * 3 + 1;
    } else if (type === 'dust') {
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = (Math.random() - 0.5) * 0.2;
      this.life = 1.0;
      this.decay = Math.random() * 0.005 + 0.002;
      this.size = Math.random() * 1.5 + 0.5;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.type === 'spark') {
      this.vx *= 0.95;
      this.vy *= 0.95;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    // Distinct sizes for variety
    this.size = Math.random() * 25 + 20; 
    
    // Spawn positions (clustered towards center but spread out)
    const cx = width / 2;
    const cy = height / 2;
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * (Math.min(width, height) * 0.35);
    
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    
    // Movement
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = (Math.random() - 0.5) * 1.2;
    this.wobbleSpeed = Math.random() * 0.05 + 0.02;
    this.wobbleOffset = Math.random() * Math.PI * 2;
    
    // Appearance
    this.hue = Math.random() > 0.5 ? 190 : (Math.random() > 0.5 ? 270 : 320); // Cyan, Purple, Pink
    this.color = `hsl(${this.hue}, 80%, 60%)`;
    this.glowColor = `hsl(${this.hue}, 100%, 50%)`;
    
    // "Tentacles" or "Wings" history
    this.history = [];
    this.historyLimit = 8;
    
    // Animation state
    this.blinkTimer = 0;
    this.isBlinking = false;
  }

  update() {
    // Organic movement
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.5;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed * 0.8 + this.wobbleOffset) * 0.5;

    // Soft containment (turn back towards center if too far)
    const cx = width / 2;
    const cy = height / 2;
    const dx = cx - this.x;
    const dy = cy - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > Math.min(width, height) * 0.4) {
      this.vx += dx * 0.0005;
      this.vy += dy * 0.0005;
    }

    // Velocity damping
    this.vx *= 0.99;
    this.vy *= 0.99;

    // History for trails/wings
    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) {
      this.history.shift();
    }

    // Blinking behavior
    this.blinkTimer++;
    if (this.blinkTimer > 200 && Math.random() < 0.02) this.isBlinking = true;
    if (this.isBlinking && this.blinkTimer > 210) this.isBlinking = false;
    if (this.isBlinking && this.blinkTimer > 220) this.blinkTimer = 0;
  }

  draw(ctx) {
    const pulse = Math.sin(time * 0.05) * 2;
    
    // Draw "Wings" or "Tentacles" (The history trail)
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < this.history.length - 1; i++) {
      const pos = this.history[i];
      const nextPos = this.history[i+1];
      const progress = i / this.history.length;
      
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      // Curve towards center based on current velocity for organic feel
      ctx.quadraticCurveTo(pos.x - this.vx * 10, pos.y - this.vy * 10, nextPos.x, nextPos.y);
      
      ctx.strokeStyle = this.color;
      ctx.globalAlpha = progress * 0.4;
      ctx.lineWidth = (this.size * 0.3) * progress;
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;

    // Draw Main Body (Jellyfish/Spirit shape)
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Glow
    ctx.shadowBlur = 30;
    ctx.shadowColor = this.glowColor;

    // Body Gradient
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size + pulse);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, this.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    // Draw a slightly organic circle
    ctx.arc(0, 0, this.size + pulse, 0, Math.PI * 2);
    ctx.fill();

    // Inner Core / Eye
    if (!this.isBlinking) {
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.25, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
    ctx.shadowBlur = 0;
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.targetX = width / 2;
    this.targetY = height / 2;
    this.radius = 45;
    this.angle = 0;
  }

  update() {
    // Smooth follow (Lerp)
    this.x += (this.targetX - this.x) * 0.15;
    this.y += (this.targetY - this.y) * 0.15;
    this.angle += 0.02;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Draw Net Mesh
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1.5;
    
    // Outer Ring
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Grid (The "Net" look)
    ctx.beginPath();
    for(let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i + this.angle;
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a) * this.radius, Math.sin(a) * this.radius);
    }
    ctx.stroke();

    // Inner Ring
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.6)'; // Cyan
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    
    // Center Dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Range Indicator (Subtle)
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.1)';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius + 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize creatures
for (let i = 0; i < 6; i++) {
  creatures.push(new Creature());
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  net.targetX = mouseX;
  net.targetY = mouseY;
});

// Touch support
window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  net.targetX = mouseX;
  net.targetY = mouseY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  if (energy < 10) return; // Not enough energy

  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Capture radius
    if (dist < net.radius + c.size) {
      // Captured!
      createExplosion(c.x, c.y, c.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score;
      energy = Math.max(0, energy - 10);
      energyEl.innerText = energy + '%';
      caught = true;
      
      // Respawn
      setTimeout(() => creatures.push(new Creature()), 2000);
    }
  }

  if (caught) {
    showToast();
    // Visual feedback on button
    const btn = document.getElementById('collectBtn');
    btn.style.borderColor = 'var(--accent-primary)';
    btn.style.boxShadow = '0 0 20px var(--accent-primary)';
    setTimeout(() => {
        btn.style.borderColor = '';
        btn.style.boxShadow = '';
    }, 300);
  } else {
      // Miss feedback
      energy = Math.max(0, energy - 5);
      energyEl.innerText = energy + '%';
  }
}

// Energy Regen
setInterval(() => {
    if (energy < 100) {
        energy += 1;
        energyEl.innerText = energy + '%';
    }
}, 500);

function createExplosion(x, y, color) {
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Elements (Nebula clouds)
const clouds = [];
for(let i=0; i<5; i++) {
    clouds.push({
        x: Math.random() * 2000,
        y: Math.random() * 2000,
        r: Math.random() * 300 + 100,
        color: Math.random() > 0.5 ? 'rgba(30, 27, 75, 0.4)' : 'rgba(15, 23, 42, 0.4)'
    });
}

// Background Stars
const stars = [];
for(let i=0; i<150; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.05 + 0.01
  });
}

function drawBackground() {
  // 1. Deep Space Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#020617');
  grad.addColorStop(1, '#1e1b4b'); // Indigo tint
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // 2. Nebula Clouds (Slow drift)
  clouds.forEach(cloud => {
      cloud.x -= 0.2;
      if(cloud.x + cloud.r < 0) cloud.x = width + cloud.r;
      
      const g = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
      g.addColorStop(0, cloud.color);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(cloud.x - cloud.r, cloud.y - cloud.r, cloud.r*2, cloud.r*2);
  });

  // 3. Stars
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    // Twinkle
    const twinkle = Math.abs(Math.sin(time * star.speed));
    ctx.globalAlpha = twinkle * 0.8;
    ctx.beginPath();
    ctx.arc(star.x % width, star.y % height, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

// Main Loop
function animate() {
  time++;
  
  drawBackground();

  // Draw Ambient Dust particles
  if (Math.random() < 0.1) {
      particles.push(new Particle(Math.random() * width, Math.random() * height, 'rgba(255,255,255,0.3)', 'dust'));
  }

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update();
  net.draw(ctx);

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Vignette Overlay (Canvas based)
  const radGrad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
  radGrad.addColorStop(0, 'transparent');
  radGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0,0,width,height);

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
