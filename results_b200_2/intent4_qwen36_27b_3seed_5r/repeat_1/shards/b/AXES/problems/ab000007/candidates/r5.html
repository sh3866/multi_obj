<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether Catch: Field Research</title>
<style>
  :root {
    --bg-deep: #050508;
    --accent-cyan: #00f0ff;
    --accent-purple: #9d4edd;
    --accent-pink: #ff007f;
    --text-white: #ffffff;
    --text-dim: #8b9bb4;
    
    /* Unified UI Geometry - Softened/Rounded per critique */
    --radius-ui: 12px;
    
    /* Glass System - Elevated per critique */
    --glass-surface: rgba(10, 15, 25, 0.65);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.05);
    
    /* Typography - Unified per critique */
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-deep);
    font-family: var(--font-main);
    color: var(--text-white);
    -webkit-font-smoothing: antialiased;
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem;
  }

  /* --- HUD & Header --- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    animation: fadeSlideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  .brand {
    display: flex;
    flex-direction: column;
    pointer-events: auto;
  }

  .brand h1 {
    font-family: var(--font-main);
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0;
    line-height: 1;
    text-transform: uppercase;
    color: var(--text-white);
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .brand span {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent-cyan);
    margin-top: 0.4rem;
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
  }

  /* Unified HUD Container */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: var(--radius-ui);
    padding: 0.6rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    position: relative;
  }

  .stat-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    position: relative;
  }

  /* Separator */
  .stat-group:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -0.75rem;
    top: 50%;
    transform: translateY(-50%);
    height: 16px;
    width: 1px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 1px;
  }

  .stat-label {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: var(--font-main);
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-white);
    line-height: 1;
  }

  .stat-value.accent {
    color: var(--accent-cyan);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
  }

  /* --- Footer & Action --- */
  footer {
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    margin-top: auto;
    padding-bottom: 1rem;
    animation: fadeSlideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  /* Primary Action Button: Elevated, Glassmorphism */
  .action-btn {
    background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
    color: var(--text-white);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-top: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 50px; /* Pill shape */
    padding: 1rem 3.5rem;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }

  .action-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .action-btn:hover {
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    transform: translateY(-2px);
  }

  .action-btn:hover::before {
    transform: translateX(100%);
  }

  .action-btn:active {
    transform: translateY(1px);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
  }

  /* --- Feedback Toast --- */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 10, 20, 0.85);
    border: 1px solid var(--accent-cyan);
    border-radius: 12px;
    padding: 1.5rem 3rem;
    color: #fff;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
    text-align: center;
    z-index: 20;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  
  .toast h3 {
    margin: 0;
    font-family: var(--font-main);
    font-size: 1.5rem;
    color: var(--text-white);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .toast p {
    margin: 0.5rem 0 0 0;
    font-size: 0.8rem;
    color: var(--accent-cyan);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* --- Noise Overlay --- */
  .noise-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Animations */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <div class="noise-overlay"></div>

  <div class="ui-layer">
    <!-- Header: Title & HUD -->
    <header>
      <div class="brand">
        <h1>Aether Catch</h1>
        <span>Specimen Collection</span>
      </div>
      
      <div class="hud-panel">
        <div class="stat-group">
          <span class="stat-label">Collection</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">Net Charge</span>
          <span class="stat-value accent" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
      <h3>Specimen Secured</h3>
      <p>Added to Collection.</p>
    </div>

    <!-- Footer: Primary Action -->
    <footer>
      <button class="action-btn" id="collectBtn">Collection</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE - REVISION
 * 1. Cohesive Lighting: Creatures cast light on environment.
 * 2. Player: Ship with physical net mesh.
 * 3. Creatures: Organic silhouettes (Jelly, Shard, Moth).
 * 4. Background: Deep space with nebula clouds.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');
const energyEl = document.getElementById('energyVal');

let width, height;
let score = 0;
let energy = 100;
let time = 0;

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, type = 'spark') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    } else if (type === 'spore') {
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.life = 1.0;
      this.decay = Math.random() * 0.002 + 0.001;
      this.size = Math.random() * 3 + 1;
      this.alpha = Math.random() * 0.4;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.type === 'spark') {
      this.vx *= 0.92;
      this.vy *= 0.92;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life * (this.alpha || 1);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    this.size = Math.random() * 15 + 25; 
    
    const cx = width / 2;
    const cy = height / 2;
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * (Math.min(width, height) * 0.35);
    
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    
    // Types: 0: Jellyfish, 1: Shard, 2: Moth
    this.type = Math.floor(Math.random() * 3); 
    
    const colorChoice = Math.random();
    if (colorChoice < 0.33) {
        this.color = '#00f0ff'; // Cyan
        this.glow = '#00f0ff';
    } else if (colorChoice < 0.66) {
        this.color = '#9d4edd'; // Purple
        this.glow = '#9d4edd';
    } else {
        this.color = '#ff007f'; // Pink
        this.glow = '#ff007f';
    }
    
    this.history = [];
    this.historyLimit = 10;
    this.phase = Math.random() * Math.PI * 2;
  }

  update() {
    // Drifting physics
    this.x += this.vx + Math.sin(time * 0.02 + this.phase) * 0.3;
    this.y += this.vy + Math.cos(time * 0.015 + this.phase) * 0.3;

    // Soft containment
    const cx = width / 2;
    const cy = height / 2;
    const dx = cx - this.x;
    const dy = cy - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > Math.min(width, height) * 0.35) {
      this.vx += dx * 0.0005;
      this.vy += dy * 0.0005;
    }

    this.vx *= 0.995;
    this.vy *= 0.995;

    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Rotate slightly based on movement
    ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI/2);

    const pulse = Math.sin(time * 0.1) * 2;

    // Draw specific silhouette
    ctx.shadowBlur = 30;
    ctx.shadowColor = this.glow;

    if (this.type === 0) { 
        // --- JELLYFISH ---
        // Bell
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.size, Math.PI, 0); // Top half
        ctx.bezierCurveTo(this.size, this.size*0.8, -this.size, this.size*0.8, -this.size, 0);
        ctx.fill();
        
        // Inner glow (Nucleus)
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(0, -this.size*0.3, this.size*0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // Tentacles
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 10;
        for(let i=-1; i<=1; i++) {
            ctx.beginPath();
            ctx.moveTo(i * this.size * 0.4, 0);
            ctx.quadraticCurveTo(
                i * this.size * 0.5, this.size * 0.8 + pulse, 
                i * this.size * 0.4, this.size * 1.5 + pulse*2
            );
            ctx.stroke();
        }

    } else if (this.type === 1) { 
        // --- CRYSTAL SHARD ---
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -this.size * 1.2);
        ctx.lineTo(this.size * 0.6, 0);
        ctx.lineTo(0, this.size * 1.2);
        ctx.lineTo(-this.size * 0.6, 0);
        ctx.closePath();
        ctx.fill();
        
        // Facet highlight
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(0, -this.size * 1.2);
        ctx.lineTo(this.size * 0.6, 0);
        ctx.lineTo(0, 0);
        ctx.fill();

    } else { 
        // --- LUMINOUS MOTH ---
        // Wings
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.8;
        const wingFlap = Math.sin(time * 0.5) * 8;
        
        ctx.beginPath();
        ctx.ellipse(-this.size * 0.8, 0, this.size * 0.8, this.size * 1.2 + wingFlap, Math.PI * 0.2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.ellipse(this.size * 0.8, 0, this.size * 0.8, this.size * 1.2 + wingFlap, -Math.PI * 0.2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.globalAlpha = 1.0;
        // Body
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.2, this.size * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
    ctx.shadowBlur = 0;
  }
}

class Player {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.targetX = width / 2;
    this.targetY = height / 2;
    this.netRadius = 75;
    this.angle = 0;
  }

  update() {
    // Snappy but smooth follow
    this.x += (this.targetX - this.x) * 0.1;
    this.y += (this.targetY - this.y) * 0.1;
    this.angle += 0.002;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // --- 1. The Net (Magnetic Distortion Field) ---
    // Drawn first to be "under" the ship
    ctx.rotate(this.angle);
    
    // Outer Energy Ring
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(0, 0, this.netRadius, 0, Math.PI * 2);
    ctx.stroke();

    // The Mesh (Tangible, Hexagonal)
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    
    ctx.beginPath();
    const meshSize = 20;
    for(let r = meshSize; r < this.netRadius; r += meshSize) {
        for(let i = 0; i < 6; i++) {
            const a1 = (Math.PI * 2 / 6) * i;
            const a2 = (Math.PI * 2 / 6) * (i+1);
            
            ctx.moveTo(Math.cos(a1) * r, Math.sin(a1) * r);
            ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r);
            
            if (r > meshSize) {
                ctx.moveTo(Math.cos(a1) * (r - meshSize), Math.sin(a1) * (r - meshSize));
                ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
            }
        }
    }
    ctx.stroke();
    
    // Inner Capture Ring (Pulsing)
    const pulse = Math.sin(time * 0.2) * 5;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, this.netRadius * 0.3 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    // --- 2. The Player Avatar (Ship) ---
    // Drawn last to be on top
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Slight tilt based on movement
    const tilt = (this.targetX - this.x) * 0.05;
    ctx.rotate(tilt * 0.1);

    // Engine Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00f0ff';
    
    // Ship Body (Triangle)
    ctx.fillStyle = '#eef';
    ctx.beginPath();
    ctx.moveTo(0, -30); // Nose
    ctx.lineTo(18, 18); // Right Wing
    ctx.lineTo(0, 12);  // Engine center
    ctx.lineTo(-18, 18); // Left Wing
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(6, 0);
    ctx.lineTo(-6, 0);
    ctx.fill();

    // Engine Flame
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#ff007f';
    ctx.fillStyle = '#ff007f';
    ctx.beginPath();
    ctx.moveTo(-6, 14);
    ctx.lineTo(6, 14);
    ctx.lineTo(0, 30 + Math.random() * 15);
    ctx.fill();

    ctx.restore();
    ctx.shadowBlur = 0;
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const player = new Player();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize creatures
for (let i = 0; i < 7; i++) {
  creatures.push(new Creature());
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  player.targetX = mouseX;
  player.targetY = mouseY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault(); // Prevent scrolling
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  player.targetX = mouseX;
  player.targetY = mouseY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  if (energy < 10) return; 

  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - player.x;
    const dy = c.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Capture radius (Net Radius)
    if (dist < player.netRadius + c.size * 0.5) {
      // Captured!
      createExplosion(c.x, c.y, c.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score < 10 ? '0'+score : score;
      energy = Math.max(0, energy - 15);
      energyEl.innerText = energy + '%';
      caught = true;
      
      // Respawn after delay
      setTimeout(() => creatures.push(new Creature()), 2000);
    }
  }

  if (caught) {
    showToast();
    // Button feedback
    const btn = document.getElementById('collectBtn');
    btn.style.transform = 'scale(0.95)';
    btn.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.4)';
    btn.style.borderColor = '#fff';
    setTimeout(() => {
        btn.style.transform = '';
        btn.style.boxShadow = '';
        btn.style.borderColor = '';
    }, 150);
  } else {
      // Miss feedback
      energy = Math.max(0, energy - 5);
      energyEl.innerText = energy + '%';
      // Shake effect on button
      const btn = document.getElementById('collectBtn');
      btn.style.transform = 'translateX(5px)';
      setTimeout(() => btn.style.transform = '', 100);
  }
}

// Energy Regen
setInterval(() => {
    if (energy < 100) {
        energy += 2;
        energyEl.innerText = energy + '%';
    }
}, 500);

function createExplosion(x, y, color) {
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle(x, y, color, 'spark'));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Elements
const clouds = [];
for(let i=0; i<6; i++) {
    clouds.push({
        x: Math.random() * width * 1.5 - width * 0.25,
        y: Math.random() * height * 1.5 - height * 0.25,
        r: Math.random() * 600 + 300,
        // Deeper, moodier colors
        color: Math.random() > 0.5 ? 'rgba(30, 10, 60, 0.2)' : 'rgba(10, 30, 60, 0.2)'
    });
}

const stars = [];
for(let i=0; i<200; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * 0.05 + 0.01
  });
}

function drawBackground() {
  // 1. Deep Space Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#050508');
  grad.addColorStop(1, '#0a0a12');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // 2. Nebula Clouds (Volumetric Fog)
  clouds.forEach(cloud => {
      cloud.x -= 0.1;
      if(cloud.x + cloud.r < 0) cloud.x = width + cloud.r;
      
      const g = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
      g.addColorStop(0, cloud.color);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(cloud.x - cloud.r, cloud.y - cloud.r, cloud.r*2, cloud.r*2);
  });

  // 3. Stars
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    const twinkle = Math.abs(Math.sin(time * star.speed));
    ctx.globalAlpha = twinkle * 0.5;
    ctx.beginPath();
    ctx.arc(star.x % width, star.y % height, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

// Main Loop
function animate() {
  time++;
  
  drawBackground();

  // Ambient Spores (Living Scene)
  if (Math.random() < 0.15) {
      particles.push(new Particle(Math.random() * width, Math.random() * height, 'rgba(255,255,255,0.4)', 'spore'));
  }

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Player (Avatar + Net)
  player.update();
  player.draw(ctx);

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Vignette (Polished)
  const radGrad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height*0.9);
  radGrad.addColorStop(0, 'transparent');
  radGrad.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0,0,width,height);

  requestAnimationFrame(animate);
}

animate();

</script>
