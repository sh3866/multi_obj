<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life // Bio-Digital Interface</title>
<style>
    :root {
        /* Deep Space / Bio-Digital Palette */
        --bg-color: #050508;
        --bg-gradient: radial-gradient(circle at 50% 50%, #0f111a 0%, #020203 100%);
        
        /* UI Surface */
        --panel-bg: rgba(12, 14, 20, 0.65);
        --panel-border: rgba(255, 255, 255, 0.08);
        --glass-blur: 20px;
        
        /* Typography & Data */
        --text-main: #b0b5c5;
        --text-bright: #ffffff;
        --text-muted: #4a5060;
        
        /* Accents - Acid Green & Amber */
        --accent-primary: #39ff14; /* Acid Green */
        --accent-secondary: #ffaa00; /* Amber */
        --accent-dim: rgba(57, 255, 20, 0.1);
        
        /* Fonts */
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        
        --panel-width: 320px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background: var(--bg-color);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
        background: transparent;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* UI Overlay - Top Left (Minimal Anchors) */
    .hud-top {
        position: absolute;
        top: 32px;
        left: 32px;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .hud-title {
        font-family: var(--font-ui);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: var(--text-bright);
        text-transform: uppercase;
        opacity: 0.9;
    }
    .hud-subtitle {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 500;
    }

    /* Control Panel (Glassmorphism Container) */
    aside {
        width: var(--panel-width);
        height: 100%;
        background: var(--panel-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border-left: 1px solid var(--panel-border);
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        z-index: 20;
        box-shadow: -10px 0 50px rgba(0,0,0,0.3);
    }

    /* Panel Header */
    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--panel-border);
    }
    .panel-title {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text-muted);
        text-transform: uppercase;
    }
    .status-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(0,0,0,0.3);
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid var(--panel-border);
        font-size: 9px;
        font-family: var(--font-mono);
        color: var(--text-main);
    }
    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--accent-primary);
        box-shadow: 0 0 6px var(--accent-primary);
        animation: pulse 2s infinite;
    }
    .status-dot.paused {
        background-color: var(--accent-secondary);
        box-shadow: 0 0 6px var(--accent-secondary);
        animation: none;
    }

    /* Stats Block (Subtle) */
    .stats-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding-bottom: 8px;
    }
    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .stat-label {
        font-family: var(--font-ui);
        font-size: 9px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 600;
    }
    .stat-val {
        font-family: var(--font-mono);
        font-size: 18px; /* Reduced size */
        font-weight: 600;
        color: var(--text-bright);
        letter-spacing: -0.5px;
        line-height: 1;
    }

    /* Control Groups */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    
    .label {
        font-family: var(--font-ui);
        font-size: 10px;
        font-weight: 600;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }
    .label span:last-child {
        font-family: var(--font-mono);
        color: var(--text-main);
        font-weight: 400;
        opacity: 0.9;
    }

    /* Custom Range Slider (Thickened, High Contrast) */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: var(--text-bright);
        cursor: pointer;
        margin-top: -5px;
        box-shadow: 0 0 4px rgba(0,0,0,0.5);
        border: 2px solid var(--bg-color);
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px; /* Thickened */
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
    }

    /* Buttons (Unified Ghost Style) */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
    }
    button {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.15);
        color: var(--text-main);
        padding: 10px 0;
        font-family: var(--font-ui);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s var(--ease);
        border-radius: 4px;
        width: 100%;
    }
    button:hover {
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.3);
        color: var(--text-bright);
    }
    button:active { transform: translateY(1px); }
    
    /* Primary Action: Play/Pause (Ghost Style, not dominant) */
    button.primary {
        border-color: rgba(255,255,255,0.3);
        color: var(--text-bright);
        background: rgba(255,255,255,0.02);
    }
    button.primary:hover {
        background: rgba(255,255,255,0.08);
        border-color: var(--text-bright);
    }

    button.danger {
        color: #ff6b6b;
        border-color: rgba(255, 107, 107, 0.2);
    }
    button.danger:hover {
        background: rgba(255, 107, 107, 0.1);
        border-color: rgba(255, 107, 107, 0.5);
    }

    /* Theme Toggles */
    .theme-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
    }
    .theme-btn {
        padding: 8px;
        font-size: 9px;
        text-align: center;
        border-radius: 4px;
    }
    .theme-btn.active {
        background: rgba(255,255,255,0.1);
        border-color: var(--text-bright);
        color: var(--text-bright);
        box-shadow: 0 0 10px rgba(255,255,255,0.05);
    }

    /* Footer */
    .footer {
        margin-top: auto;
        font-family: var(--font-mono);
        font-size: 9px;
        color: rgba(255,255,255,0.4);
        line-height: 1.6;
        border-top: 1px solid var(--panel-border);
        padding-top: 20px;
        letter-spacing: 0.5px;
    }

    @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        
        <div class="hud-top">
            <div class="hud-title">Spherical Life</div>
            <div class="hud-subtitle">TOPOLOGY: CLOSED MANIFOLD</div>
        </div>
    </div>

    <aside>
        <!-- Header: State -> Action -->
        <div class="panel-header">
            <div class="panel-title">System Control</div>
            <div class="status-badge">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">RUNNING</span>
            </div>
        </div>

        <!-- Primary Action Button (Ghost Style) -->
        <div class="control-group">
            <button class="primary" id="btn-toggle">Pause Simulation</button>
        </div>

        <!-- Metrics -->
        <div class="stats-container">
            <div class="stat-item">
                <span class="stat-label">Generation</span>
                <span class="stat-val" id="gen-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Population</span>
                <span class="stat-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="control-group">
            <div class="label">
                <span>Simulation Speed</span>
                <span id="speed-val">30</span>
            </div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">
                <span>Grid Resolution</span>
                <span id="res-val">80</span>
            </div>
            <input type="range" id="resRange" min="40" max="120" value="80">
        </div>

        <div class="control-group">
            <div class="label">Visual Theme</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('bio')">Bio</button>
                <button class="theme-btn" onclick="setTheme('nebula')">Nebula</button>
                <button class="theme-btn" onclick="setTheme('thermal')">Thermal</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Manual Overrides</div>
            <div class="btn-grid">
                <button class="danger" id="btn-reset">Random</button>
                <button id="btn-clear">Clear</button>
                <button id="btn-step">Step</button>
            </div>
        </div>

        <div class="footer">
            RENDER: HTML5 CANVAS 2D<br>
            LOGIC: CONWAY'S GOL<br>
            DRAG TO ROTATE • CLICK TO SPAWN
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - High Density Visualizer
 * Optimized for Volumetric Rendering and Performance
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 80; 
let rows = 40;
let grid = [];
let nextGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; 
let theme = 'bio';

// Camera / Rotation
let rotX = 0.4; // Initial tilt
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Themes Configuration (Refined Palettes)
const themes = {
    bio: {
        bg: '#050508',
        sphereRim: '#39ff14',
        gridColor: 'rgba(57, 255, 20, 0.02)',
        cellColor: (n, age) => {
            // Bio-digital: Acid greens, deep blacks, warm ambers
            // Hue shifts based on neighbors (n)
            const hue = n > 3 ? 40 : 120; // Amber vs Green
            const sat = 90;
            const light = 50 + (n * 3);
            return `hsla(${hue}, ${sat}%, ${light}%, 1)`;
        }
    },
    nebula: {
        bg: '#030305',
        sphereRim: '#8a2be2',
        gridColor: 'rgba(138, 43, 226, 0.02)',
        cellColor: (n, age) => {
            // Deep Space: Indigos, electric violets, sharp whites
            const hue = 260 + (n * 10); 
            const sat = 80;
            const light = 60 + (n * 2);
            return `hsla(${hue}, ${sat}%, ${light}%, 1)`;
        }
    },
    thermal: {
        bg: '#080202',
        sphereRim: '#ff4500',
        gridColor: 'rgba(255, 69, 0, 0.02)',
        cellColor: (n, age) => {
            // Heat map style
            const hue = 60 - (n * 10); 
            return `hsla(${hue}, 100%, 50%, 1)`;
        }
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    width = width; 
    height = height;
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        // 30% density
        grid[i] = Math.random() > 0.7 ? 1 : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

// Get neighbor count (Torus/Sphere wrapping)
function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const state = grid[getIdx(x, y)];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[getIdx(x, y)] = 1;
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[getIdx(x, y)] = 0;
            } else {
                nextGrid[getIdx(x, y)] = state;
            }
        }
    }
    
    let temp = grid;
    grid = nextGrid;
    nextGrid = temp;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    // Clear with background color
    ctx.fillStyle = themes[theme].bg;
    ctx.fillRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.35;

    // 1. Volumetric Body (Dark core)
    // Create a deep 3D feel with a dark gradient sphere
    const grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius * 0.1, cx, cy, radius);
    grad.addColorStop(0, 'rgba(40, 40, 50, 0.1)');
    grad.addColorStop(0.6, 'rgba(15, 15, 20, 0.6)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
    
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // 2. Draw Cells
    const cellsToDraw = [];

    // Pre-calculate trig for rotation
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);

    // Optimization: Calculate sphere projection once per frame
    for (let y = 0; y < rows; y++) {
        const phi = (y / rows) * Math.PI;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            if (grid[idx] === 1) {
                const theta = (x / cols) * Math.PI * 2;
                const cosTheta = Math.cos(theta);
                const sinTheta = Math.sin(theta);

                // 3D Position (Unit Sphere)
                let px = sinPhi * cosTheta;
                let py = sinPhi * sinTheta;
                let pz = cosPhi;

                // Rotate Y
                let px2 = px * cosY - pz * sinY;
                let pz2 = px * sinY + pz * cosY;
                
                // Rotate X
                let py2 = py * cosX - pz2 * sinX;
                let pz3 = py * sinX + pz2 * cosX;

                // Project
                const fov = 400;
                const scale = fov / (fov + pz3 * radius);
                
                // Culling: Only draw if in front of camera (with some tolerance)
                if (pz3 < 0.95) { 
                    const sx = cx + px2 * radius * scale;
                    const sy = cy + py2 * radius * scale;
                    
                    // Dynamic cell size based on position
                    // Smaller cells for "lots of small cells" requirement
                    const baseSize = (Math.PI * radius) / cols; 
                    const size = Math.max(1, baseSize * scale * 0.6); 

                    // Calculate neighbor count for color mapping
                    const n = countNeighbors(x, y);
                    const color = themes[theme].cellColor(n, generation);
                    
                    cellsToDraw.push({ sx, sy, size, z: pz3, color });
                }
            }
        }
    }

    // Sort by Z (Painter's Algorithm) - back to front
    cellsToDraw.sort((a, b) => b.z - a.z);

    // Draw Cells
    // Use 'lighter' for additive glow effect (Bioluminescent feel)
    ctx.globalCompositeOperation = 'lighter';
    
    for (let cell of cellsToDraw) {
        // Depth fog: fade out back cells
        const alpha = Math.max(0.2, 1 - ((cell.z + 1) / 2));
        
        ctx.fillStyle = cell.color;
        ctx.globalAlpha = alpha;
        
        // Small glow
        ctx.shadowBlur = 8;
        ctx.shadowColor = cell.color;
        
        ctx.beginPath();
        ctx.arc(cell.sx, cell.sy, cell.size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Reset Context
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // 3. Rim Light (Fresnel effect)
    // Adds volume and separation
    const rimGrad = ctx.createRadialGradient(cx, cy, radius * 0.9, cx, cy, radius);
    rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
    rimGrad.addColorStop(0.9, 'rgba(0,0,0,0.6)');
    rimGrad.addColorStop(1, themes[theme].sphereRim);
    
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = rimGrad;
    ctx.fill();
    
    // Thin outer stroke
    ctx.strokeStyle = themes[theme].sphereRim;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    if (autoRotate && !isDragging) {
        rotY += 0.003;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.005;
        rotX += dy * 0.005;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// Click to spawn life
container.addEventListener('click', (e) => {
    // Toggle a random block of cells
    const startIdx = Math.floor(Math.random() * grid.length);
    for(let i=0; i<30; i++) {
        grid[(startIdx + i) % grid.length] = 1;
    }
    updateStats();
});

// UI Controls
document.getElementById('btn-toggle').addEventListener('click', () => {
    isRunning = !isRunning;
    const btn = document.getElementById('btn-toggle');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    
    if (isRunning) {
        btn.innerText = "Pause Simulation";
        statusText.innerText = "RUNNING";
        statusText.style.color = "var(--accent-primary)";
        statusDot.classList.remove('paused');
    } else {
        btn.innerText = "Resume Simulation";
        statusText.innerText = "PAUSED";
        statusText.style.color = "var(--accent-secondary)";
        statusDot.classList.add('paused');
    }
});

document.getElementById('btn-step').addEventListener('click', () => {
    isRunning = false;
    const btn = document.getElementById('btn-toggle');
    btn.innerText = "Resume Simulation";
    const statusText = document.getElementById('status-text');
    statusText.innerText = "PAUSED";
    statusText.style.color = "var(--accent-secondary)";
    const statusDot = document.getElementById('status-dot');
    statusDot.classList.add('paused');
    
    update();
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('speed-val').innerText = val;
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    document.getElementById('res-val').innerText = val;
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

function setTheme(name) {
    theme = name;
    document.body.style.backgroundColor = themes[name].bg;
    
    // Update active button state
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.toLowerCase() === name) {
            btn.classList.add('active');
        }
    });
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
