<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess • Modern Classic</title>
    <style>
        :root {
            /* 
               DESIGN SYSTEM: "Modern Classic"
               Palette: Deep Charcoal, Slate Blue, Warm Cream.
               Typography: High Contrast Serif (Headers) + Monospace (Data).
            */
            
            /* Environment */
            --bg-body: #1c1d20; /* Soft matte dark grey */
            --bg-panel: #242528; /* Slightly lighter for card depth */
            --bg-panel-inner: #1c1d20;
            
            /* Typography */
            --font-display: Georgia, "Times New Roman", Times, serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Courier New", Courier, monospace;
            
            --text-primary: #e8e8e8;
            --text-secondary: #9ca3af;
            --text-muted: #525252;
            
            /* Board Palette: High Contrast, Sophisticated */
            --board-light: #e8e3d9; /* Warm Ivory */
            --board-dark: #4b5358;  /* Deep Slate - distinct from white */
            --board-border: #2c2c2c;
            
            /* Highlights */
            --highlight-select: rgba(255, 215, 0, 0.35); /* Gold tint */
            --highlight-last: rgba(255, 255, 255, 0.12); /* Subtle white tint */
            --highlight-valid: rgba(0, 0, 0, 0.15);

            /* Dimensions */
            --board-size: min(85vh, 90vw);
            --panel-width: 320px; /* ~30% of width */
            --gap: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Layout Container */
        .container {
            display: flex;
            gap: var(--gap);
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* --- The Board --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Tactile border and shadow for physical presence */
            box-shadow: 
                0 25px 60px rgba(0,0,0,0.5), 
                0 0 0 8px #2a2a2a, /* Frame */
                0 0 0 10px #333; /* Frame Rim */
            border-radius: 2px;
            user-select: none;
            background-color: var(--board-border);
            display: flex;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
        }

        /* Board Coloring */
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Coordinate Labels: High Legibility */
        .coord {
            position: absolute;
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            font-weight: 700;
            pointer-events: none;
            opacity: 0.9;
            font-family: var(--font-ui);
            z-index: 2;
            line-height: 1;
        }
        
        /* Contrast logic: Coordinates adapt to square color */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }
        
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--highlight-select);
            z-index: 1;
            pointer-events: none;
        }
        .last-move {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--highlight-last);
            z-index: 1;
            pointer-events: none;
        }

        /* --- SVG Pieces --- */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Unified shadow: Grounded, not floating */
            filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.35));
        }
        .piece:active { transform: scale(0.95); }

        /* --- Side Panel --- */
        .panel {
            width: var(--panel-width);
            background-color: var(--bg-panel);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid #333;
            height: var(--board-size);
            overflow: hidden;
        }

        /* Panel Header */
        .panel-header {
            padding: 24px;
            background-color: rgba(0,0,0,0.15);
            border-bottom: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Turn Indicator: Distinctive */
        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 400;
            font-family: var(--font-display); /* Serif for elegance */
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .turn-dot.black {
            background-color: #111;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
        }

        .game-status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Move History Table */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--bg-panel-inner);
            font-family: var(--font-mono);
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Table Headers */
        .history-header {
            display: flex;
            padding: 12px 24px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid #333;
            border-top: 1px solid #333;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Custom Scrollbar */
        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: transparent; }
        .history-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .history-container::-webkit-scrollbar-thumb:hover { background: #555; }

        .move-list {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        .move-row {
            display: flex;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            font-size: 0.95rem;
            align-items: center;
            transition: background 0.15s;
        }
        .move-row:hover { background-color: rgba(255,255,255,0.03); }
        .move-row:last-child { border-bottom: none; }

        .move-num { 
            width: 30px; 
            color: var(--text-muted); 
            font-weight: bold;
            font-family: var(--font-ui);
            font-size: 0.85rem;
        }
        .move-ply { 
            flex: 1;
            color: var(--text-primary); 
            letter-spacing: 0.5px;
        }
        .move-ply.white { font-weight: 600; color: #fff; }
        .move-ply.black { color: #bbb; }

        /* Controls */
        .controls {
            padding: 24px;
            background-color: var(--bg-panel);
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        /* Clarified Hierarchy: New Game is Primary */
        .btn-primary {
            background-color: var(--board-light);
            color: #121212;
        }
        .btn-primary:hover { 
            background-color: #fff; 
            box-shadow: 0 4px 12px rgba(255,255,255,0.1); 
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Secondary: Analyze */
        .btn-secondary {
            background-color: transparent;
            border: 1px solid #444;
            color: var(--text-secondary);
        }
        .btn-secondary:hover { 
            border-color: #777; 
            color: var(--text-primary); 
            background-color: rgba(255,255,255,0.03);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { flex-direction: column; gap: 24px; }
            .panel { width: var(--board-size); height: 300px; }
            :root { --board-size: 90vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Chess Board Area -->
        <div class="board-wrapper">
            <div class="board" id="board">

            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="turn-indicator">
                    <div class="turn-dot" id="turnDot"></div>
                    <span id="turnText">White's Turn</span>
                </div>
                <div class="game-status">Standard Game • Classical</div>
            </div>

            <div class="history-container" id="historyList">
                <!-- Table Header -->
                <div class="history-header">
                    <span style="width: 30px;">#</span>
                    <span style="flex: 1;">Move</span>
                </div>
                <!-- History List -->
                <div class="move-list" id="moveListContainer">
                    <!-- Moves injected here -->
                </div>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="resetGame()">New Game</button>
                <button class="btn-secondary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

        // --- Game Logic & State ---
        
        // Standard starting position
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // 0 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // 1
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // 6 (White)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // 7 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = []; // Empty initially
        let lastMove = null; // No moves yet

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const moveListContainer = document.getElementById('moveListContainer');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Last Move Highlight
                    if (lastMove) {
                        if ((lastMove.from.r === r && lastMove.from.c === c) || 
                            (lastMove.to.r === r && lastMove.to.c === c)) {
                            const highlight = document.createElement('div');
                            highlight.className = 'last-move';
                            square.appendChild(highlight);
                        }
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += pieces[color][type];
                    }

                    // Selection Highlight
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            const highlight = document.createElement('div');
                            highlight.className = 'highlight';
                            square.appendChild(highlight);
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function renderHistory() {
            moveListContainer.innerHTML = '';

            if (moveHistory.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'move-row';
                emptyMsg.style.color = '#555';
                emptyMsg.style.fontStyle = 'italic';
                emptyMsg.innerText = 'Game Start';
                moveListContainer.appendChild(emptyMsg);
                return;
            }

            moveHistory.forEach((move, index) => {
                if (index % 2 === 0) {
                    // Start of a new row
                    const row = document.createElement('div');
                    row.className = 'move-row';
                    
                    const numSpan = document.createElement('span');
                    numSpan.className = 'move-num';
                    numSpan.innerText = `${Math.ceil((index + 1) / 2)}.`;
                    
                    const plySpan = document.createElement('span');
                    plySpan.className = `move-ply white`;
                    plySpan.innerText = move.text;
                    
                    row.appendChild(numSpan);
                    row.appendChild(plySpan);
                    moveListContainer.appendChild(row);
                } else {
                    // Second part of a row (black's move)
                    const lastRow = moveListContainer.lastElementChild;
                    const plySpan = document.createElement('span');
                    plySpan.className = `move-ply black`;
                    plySpan.innerText = move.text;
                    lastRow.appendChild(plySpan);
                }
            });

            historyEl.scrollTop = historyEl.scrollHeight;
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const from = `${files[fromC]}${8-fromR}`;
            const to = `${files[toC]}${8-toR}`;
            const notation = `${piece.toUpperCase()} ${from} → ${to}`;
            
            moveHistory.push({
                player: turn,
                text: notation
            });
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            // Check if own piece
            const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

            // Select Piece
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move Piece
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Basic move execution (No rules validation for this visual demo)
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Record move
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                renderHistory();
                
                // Update last move for highlighting
                lastMove = {
                    from: {r: fromR, c: fromC},
                    to: {r: r, c: c}
                };
                
                // Switch Turn
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            lastMove = null;
            updateUI();
            renderBoard();
            renderHistory();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-secondary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // Init
        updateUI();
        renderBoard();
        renderHistory();
    </script>
</body>
</html>
