<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            /* Palette: Grandmaster / Tournament */
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --bg-panel-accent: #252525;
            
            --text-primary: #e0e0e0;
            --text-secondary: #888888;
            --text-muted: #555555;
            
            --accent-gold: #cfaa6e; /* Subtle Gold */
            --accent-gold-dim: #8a734b;
            
            /* Board Colors: High Contrast Slate & Cream */
            --board-light: #e8edf9;
            --board-dark: #7b8ca3; /* Slate Blue/Grey */
            --board-border: #2a2a2a;
            
            /* Highlights */
            --highlight-move: rgba(207, 170, 110, 0.4); /* Goldish tint */
            --highlight-last: rgba(255, 255, 255, 0.15);
            --valid-move: rgba(0, 0, 0, 0.2);
            
            /* Dimensions */
            --board-size: min(85vh, 80vw);
            --square-size: calc(var(--board-size) / 8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 40px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* The Board */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border-radius: 4px;
            user-select: none;
            border: 1px solid #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.8;
        }
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }
        
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--highlight-move);
            z-index: 1;
            pointer-events: none;
        }
        .last-move {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--highlight-last);
            z-index: 1;
            pointer-events: none;
        }
        .valid-marker {
            width: 25%;
            height: 25%;
            background-color: var(--valid-move);
            border-radius: 50%;
            z-index: 2;
        }

        /* SVG Pieces */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 3;
            cursor: pointer;
            /* No drop-shadow filter to avoid sticker effect, rely on SVG styling */
            transition: transform 0.1s ease-out;
        }
        .piece:active { transform: scale(0.95); }

        /* Side Panel */
        .panel {
            width: 320px;
            background-color: var(--bg-panel);
            border-radius: 8px;
            padding: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid #333;
            height: var(--board-size);
            overflow: hidden;
        }

        /* Panel Header */
        .panel-header {
            padding: 25px;
            background-color: var(--bg-panel-accent);
            border-bottom: 1px solid #333;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
            border: 1px solid #ccc;
            transition: all 0.3s ease;
        }
        .turn-dot.black {
            background-color: #1a1a1a;
            border: 1px solid #555;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        .game-status {
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Move History */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            margin: 0;
            background-color: var(--bg-panel);
            font-family: 'Courier New', Courier, monospace;
            padding: 0;
        }

        /* Custom Scrollbar */
        .history-container::-webkit-scrollbar { width: 8px; }
        .history-container::-webkit-scrollbar-track { background: var(--bg-panel); }
        .history-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; border: 2px solid var(--bg-panel); }
        .history-container::-webkit-scrollbar-thumb:hover { background: #555; }

        .move-list {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        .move-row {
            display: flex;
            padding: 10px 20px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.9rem;
            align-items: center;
            transition: background 0.2s;
        }
        .move-row:hover { background-color: #252525; }
        .move-row:last-child { border-bottom: none; }

        .move-num { 
            width: 35px; 
            color: var(--text-secondary); 
            font-weight: bold;
            font-family: sans-serif;
        }
        .move-ply { 
            flex: 1;
            color: var(--text-primary); 
            letter-spacing: 0.5px;
        }
        .move-ply.white { font-weight: bold; color: #fff; }
        .move-ply.black { color: #aaa; }

        /* Empty State */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            font-family: serif;
            font-size: 1rem;
        }

        /* Controls */
        .controls {
            padding: 20px;
            background-color: var(--bg-panel-accent);
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background-color: var(--accent-gold);
            color: #121212;
        }
        .btn-primary:hover { background-color: #dab578; }
        .btn-primary:active { transform: translateY(1px); }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid #444;
            color: var(--text-secondary);
        }
        .btn-secondary:hover { 
            border-color: var(--text-secondary); 
            color: var(--text-primary); 
            background-color: rgba(255,255,255,0.03);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { flex-direction: column; gap: 20px; }
            .panel { width: 100%; height: 250px; }
            :root { --board-size: 75vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Chess Board Area -->
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="turn-indicator">
                    <div class="turn-dot" id="turnDot"></div>
                    <span id="turnText">White's Turn</span>
                </div>
                <div class="game-status">Standard Game</div>
            </div>

            <div class="history-container" id="historyList">
                <!-- Moves go here -->
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="resetGame()">New Game</button>
                <button class="btn-primary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

            },
            b: {
                k: `<svg viewBox="0 0 45 45" class="piece" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0,0)"><path d="M22.5 11.63V6M20 8h5" stroke-linejoin="miter"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#1a1a1a" stroke-linecap="butt"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 2-8 2-5-2-8-2-4-1-9-1c-3 6 6 10.5 6 10.5v7" fill="#1a1a1a"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0" stroke="#333" stroke-width="1"/></g></svg>`,

            }

        // --- Game Logic & State ---
        
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // 0 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // 1
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // 6 (White)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // 7 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];
        let lastMove = null; // {from: {r,c}, to: {r,c}}

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Last Move Highlight
                    if (lastMove) {
                        if ((lastMove.from.r === r && lastMove.from.c === c) || 
                            (lastMove.to.r === r && lastMove.to.c === c)) {
                            const highlight = document.createElement('div');
                            highlight.className = 'last-move';
                            square.appendChild(highlight);
                        }
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += pieces[color][type];
                    }

                    // Selection Highlight
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            const highlight = document.createElement('div');
                            highlight.className = 'highlight';
                            square.appendChild(highlight);
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const from = `${files[fromC]}${8-fromR}`;
            const to = `${files[toC]}${8-toR}`;
            const notation = `${piece.toUpperCase()} ${from} → ${to}`;
            
            moveHistory.push({
                player: turn,
                text: notation
            });

            // Render History
            const list = document.createElement('div');
            list.className = 'move-list';
            
            // Calculate move number
            const moveNum = Math.ceil(moveHistory.length / 2);
            
            const row = document.createElement('div');
            row.className = 'move-row';
            
            const numSpan = document.createElement('span');
            numSpan.className = 'move-num';
            numSpan.innerText = `${moveNum}.`;
            
            const plySpan = document.createElement('span');
            plySpan.className = `move-ply ${turn === 'w' ? 'white' : 'black'}`;
            plySpan.innerText = notation;
            
            row.appendChild(numSpan);
            row.appendChild(plySpan);
            
            // If white, add new row. If black, append to last row (simplified for visual demo to just list)
            // To keep it clean and "Table-like" per brief, we list them individually but numbered
            historyEl.appendChild(row);
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            // Check if own piece
            const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

            // Select Piece
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move Piece
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Basic move execution (No rules validation for this visual demo)
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Record move
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                // Update last move for highlighting
                lastMove = {
                    from: {r: fromR, c: fromC},
                    to: {r: r, c: c}
                };
                
                // Switch Turn
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            lastMove = null;
            historyEl.innerHTML = '<div class="empty-state">Waiting for first move...</div>';
            updateUI();
            renderBoard();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // Init
        historyEl.innerHTML = '<div class="empty-state">Waiting for first move...</div>';
        renderBoard();
        updateUI();

    </script>
</body>
</html>
