<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            /* Palette: Grandmaster / Luxury */
            --bg-body: #121212;
            --bg-panel: #1c1c1c;
            --bg-panel-header: #181818;
            --bg-panel-footer: #181818;
            --border-panel: #2a2a2a;
            
            --text-primary: #f0f0f0;
            --text-secondary: #888888;
            --text-muted: #555555;
            
            --accent-gold: #d4af37; /* Rich Gold */
            --accent-gold-hover: #e5c150;
            
            /* Board Colors: High Contrast Warm/Charcoal */
            --board-light: #e8e3d9; /* Warm Cream */
            --board-dark: #4a5259;  /* Deep Slate */
            --board-border: #222;
            
            /* Highlights */
            --highlight-select: rgba(212, 175, 55, 0.5); /* Gold tint */
            --highlight-last: rgba(255, 255, 255, 0.15);
            --valid-move: rgba(0, 0, 0, 0.15);
            
            /* Dimensions */
            --board-size: min(85vh, 80vw);
            --square-size: calc(var(--board-size) / 8);
            --panel-width: 340px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* The Board */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            box-shadow: 0 25px 70px rgba(0,0,0,0.7);
            border-radius: 4px;
            user-select: none;
            border: 1px solid #333;
            background-color: var(--board-border);
            display: flex;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-size: 0.75rem;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.9;
            font-family: 'Courier New', Courier, monospace; /* Monospaced for grid feel */
            z-index: 2;
        }
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }
        
        .coord.rank { top: 4px; left: 5px; }
        .coord.file { bottom: 4px; right: 5px; }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--highlight-select);
            z-index: 1;
            pointer-events: none;
        }
        .last-move {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--highlight-last);
            z-index: 1;
            pointer-events: none;
        }
        .valid-marker {
            width: 25%;
            height: 25%;
            background-color: var(--valid-move);
            border-radius: 50%;
            z-index: 2;
        }

        /* SVG Pieces */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.15s ease-out;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.3)); /* Lift pieces off board */
        }
        .piece:active { transform: scale(0.95); }

        /* Side Panel */
        .panel {
            width: var(--panel-width);
            background-color: var(--bg-panel);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--border-panel);
            height: var(--board-size);
            overflow: hidden;
        }

        /* Panel Header */
        .panel-header {
            padding: 24px;
            background-color: var(--bg-panel-header);
            border-bottom: 1px solid var(--border-panel);
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .turn-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            border: 2px solid #ddd;
            transition: all 0.3s ease;
        }
        .turn-dot.black {
            background-color: #000;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .game-status {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            opacity: 0.6;
        }

        /* Move History Table */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--bg-panel);
            font-family: 'Courier New', Courier, monospace;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Table Headers */
        .history-header {
            display: flex;
            padding: 12px 24px;
            background-color: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border-panel);
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Custom Scrollbar */
        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: var(--bg-panel); }
        .history-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .history-container::-webkit-scrollbar-thumb:hover { background: #444; }

        .move-list {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        .move-row {
            display: flex;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.95rem;
            align-items: center;
            transition: background 0.2s;
        }
        .move-row:hover { background-color: rgba(255,255,255,0.03); }
        .move-row:last-child { border-bottom: none; }

        .move-num { 
            width: 35px; 
            color: var(--text-muted); 
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.85rem;
        }
        .move-ply { 
            flex: 1;
            color: var(--text-primary); 
            letter-spacing: 0.5px;
        }
        .move-ply.white { font-weight: 700; color: #fff; }
        .move-ply.black { color: #aaa; }

        /* Empty State */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            font-family: serif;
            font-size: 1rem;
            opacity: 0.5;
        }

        /* Controls */
        .controls {
            padding: 20px;
            background-color: var(--bg-panel-footer);
            border-top: 1px solid var(--border-panel);
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: var(--text-primary);
            color: #121212;
        }
        .btn-primary:hover { background-color: #fff; box-shadow: 0 4px 12px rgba(255,255,255,0.15); }
        .btn-primary:active { transform: translateY(1px); }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid #444;
            color: var(--text-secondary);
        }
        .btn-secondary:hover { 
            border-color: var(--text-primary); 
            color: var(--text-primary); 
            background-color: rgba(255,255,255,0.05);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { flex-direction: column; gap: 20px; }
            .panel { width: 100%; height: 300px; }
            :root { --board-size: 75vw; }
        }
    </style>
</head>
<body>

    <div class="container">

            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="turn-indicator">
                    <div class="turn-dot" id="turnDot"></div>
                    <span id="turnText">White's Turn</span>
                </div>
                <div class="game-status">Standard Game</div>
            </div>

            <div class="history-container" id="historyList">
                <!-- Table Header -->
                <div class="history-header">
                    <span style="width: 35px;">#</span>
                    <span style="flex: 1;">Move</span>
                </div>
                <!-- Moves go here -->
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="resetGame()">New Game</button>
                <button class="btn-primary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

        // --- Game Logic & State ---
        
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // 0 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // 1
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // 6 (White)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // 7 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];
        let lastMove = null; // {from: {r,c}, to: {r,c}}

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Last Move Highlight
                    if (lastMove) {
                        if ((lastMove.from.r === r && lastMove.from.c === c) || 
                            (lastMove.to.r === r && lastMove.to.c === c)) {
                            const highlight = document.createElement('div');
                            highlight.className = 'last-move';
                            square.appendChild(highlight);
                        }
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += pieces[color][type];
                    }

                    // Selection Highlight
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            const highlight = document.createElement('div');
                            highlight.className = 'highlight';
                            square.appendChild(highlight);
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const from = `${files[fromC]}${8-fromR}`;
            const to = `${files[toC]}${8-toR}`;
            const notation = `${piece.toUpperCase()} ${from} → ${to}`;
            
            moveHistory.push({
                player: turn,
                text: notation
            });

            // Render History
            const list = document.createElement('div');
            list.className = 'move-list';
            
            // Calculate move number
            const moveNum = Math.ceil(moveHistory.length / 2);
            
            const row = document.createElement('div');
            row.className = 'move-row';
            
            const numSpan = document.createElement('span');
            numSpan.className = 'move-num';
            numSpan.innerText = `${moveNum}.`;
            
            const plySpan = document.createElement('span');
            plySpan.className = `move-ply ${turn === 'w' ? 'white' : 'black'}`;
            plySpan.innerText = notation;
            
            row.appendChild(numSpan);
            row.appendChild(plySpan);
            
            historyEl.appendChild(row);
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            // Check if own piece
            const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

            // Select Piece
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move Piece
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Basic move execution (No rules validation for this visual demo)
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Record move
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                // Update last move for highlighting
                lastMove = {
                    from: {r: fromR, c: fromC},
                    to: {r: r, c: c}
                };
                
                // Switch Turn
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            lastMove = null;
            historyEl.innerHTML = '<div class="history-header"><span style="width: 35px;">#</span><span style="flex: 1;">Move</span></div>';
            updateUI();
            renderBoard();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // Init
        resetGame();
    </script>
</body>
</html>
