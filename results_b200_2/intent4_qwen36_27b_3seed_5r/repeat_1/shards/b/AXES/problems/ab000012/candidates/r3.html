<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #030205;
        --bg-panel: rgba(15, 15, 25, 0.6);
        
        --gold-bright: #ffdf73;
        --gold-metal: #b08d47;
        --gold-dark: #5c4618;
        
        --magic-primary: #9d4edd;
        --magic-glow: #e0aaff;
        --magic-deep: #3c096c;
        
        --text-main: #f0f0f5;
        --text-dim: #8d99ae;
        
        --font-header: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- ATMOSPHERE --- */
    #bg-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    /* Mystical Fog Overlay */
    .fog-overlay {
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 50% 30%, rgba(60, 9, 108, 0.25) 0%, transparent 60%),
            linear-gradient(to bottom, rgba(3,2,5,0.8) 0%, transparent 30%, transparent 70%, rgba(3,2,5,1) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* Noise Texture */
    .noise {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* --- LAYOUT --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1400px;
        height: 100%;
        padding: 3rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- HEADER & HUD --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .brand {
        position: relative;
    }

    .game-title {
        font-family: var(--font-header);
        font-size: 3.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        background: linear-gradient(180deg, #fff 0%, #d4d4d4 40%, #888 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        line-height: 1;
    }

    .game-subtitle {
        font-family: var(--font-header);
        font-size: 1rem;
        letter-spacing: 0.4em;
        color: var(--magic-primary);
        text-transform: uppercase;
        text-shadow: 0 0 15px var(--magic-deep);
        margin-top: 0.5rem;
        display: block;
    }

    /* Currency HUD */
    .currency-hud {
        display: flex;
        align-items: center;
        background: rgba(10, 10, 15, 0.8);
        border: 1px solid var(--gold-dark);
        padding: 0.4rem 1rem 0.4rem 0.4rem;
        border-radius: 4px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        position: relative;
        overflow: hidden;
    }
    
    /* Bevel effect for currency */
    .currency-hud::before {
        content: '';
        position: absolute;
        inset: 1px;
        border: 1px solid rgba(255,255,255,0.05);
        pointer-events: none;
    }

    .coin-icon {
        width: 36px;
        height: 36px;
        margin-right: 12px;
        position: relative;
    }
    
    .currency-val {
        font-family: var(--font-ui);
        font-weight: 700;
        color: var(--gold-bright);
        font-size: 1.25rem;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        letter-spacing: 0.05em;
    }

    /* --- HERO SECTION (The Rift) --- */
    .hero-section {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* The Summoning Circle/Rift */
    .rift-container {
        position: relative;
        width: 400px;
        height: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    .rift-core {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, var(--magic-glow) 30%, transparent 70%);
        box-shadow: 
            0 0 50px var(--magic-primary),
            0 0 100px var(--magic-deep),
            inset 0 0 20px #fff;
        animation: pulse 4s ease-in-out infinite;
        z-index: 5;
        opacity: 0.9;
    }

    .rift-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(168, 85, 247, 0.2);
        box-shadow: 0 0 10px rgba(60, 9, 108, 0.2);
    }

    .ring-1 {
        width: 240px; height: 240px;
        border-top: 2px solid var(--magic-primary);
        border-bottom: 2px solid var(--magic-primary);
        border-left: 2px solid transparent;
        border-right: 2px solid transparent;
        animation: spin 12s linear infinite;
    }
    
    .ring-2 {
        width: 320px; height: 320px;
        border: 1px dashed var(--gold-dark);
        animation: spin-rev 25s linear infinite;
    }
    
    .ring-3 {
        width: 400px; height: 400px;
        border: 1px solid rgba(255,255,255,0.05);
        animation: spin 40s linear infinite;
    }

    /* --- MENU GRID --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        height: 340px;
        position: relative;
    }

    /* --- CARD SYSTEM --- */
    .menu-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
        
        /* Unified Geometry: Dark Glass */
        background: linear-gradient(145deg, rgba(20,20,30,0.7) 0%, rgba(10,10,15,0.8) 100%);
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
        
        /* Corner accents */
        clip-path: polygon(
            15px 0, 100% 0, 
            100% calc(100% - 15px), calc(100% - 15px) 100%, 
            0 100%, 0 15px
        );
    }

    .menu-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255,255,255,0.3);
        background: rgba(30, 30, 45, 0.85);
        box-shadow: 0 15px 40px -10px rgba(0,0,0,0.9);
    }

    /* Common Icon Styles */
    .card-icon {
        width: 44px;
        height: 44px;
        margin-bottom: 1rem;
        stroke: var(--text-dim);
        stroke-width: 1.5;
        fill: none;
        transition: 0.3s ease;
    }

    .menu-card:hover .card-icon {
        stroke: #fff;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    }

    .card-title {
        font-family: var(--font-header);
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--text-main);
        text-transform: uppercase;
    }

    .card-subtitle {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-top: 0.25rem;
    }

    /* --- SPECIFIC CARD STYLES --- */

    /* 1. SUMMON (Primary Action) */
    .card-summon {
        grid-column: 1 / 2;
        grid-row: 1 / 3;
        border: 1px solid rgba(157, 78, 221, 0.4);
        background: linear-gradient(160deg, rgba(60, 9, 108, 0.4) 0%, rgba(10,10,15,0.9) 100%);
        box-shadow: 0 0 30px rgba(60, 9, 108, 0.3);
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .card-summon::before {
        content: '';
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, transparent 60%);
        animation: pulse-bg 6s ease-in-out infinite;
        pointer-events: none;
    }

    .card-summon:hover {
        border-color: var(--magic-primary);
        box-shadow: 0 0 50px rgba(157, 78, 221, 0.5);
    }

    .card-summon .card-icon {
        width: 60px;
        height: 60px;
        stroke: var(--magic-glow);
        filter: drop-shadow(0 0 10px var(--magic-primary));
    }

    .card-summon .card-title {
        font-size: 2.2rem;
        background: linear-gradient(to bottom, #fff, var(--magic-glow));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* 2. ROSTER (Grimoire Style) */
    .card-roster {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        border-left: 4px solid var(--gold-dark);
    }
    
    .card-roster:hover {
        border-left-color: var(--gold-bright);
    }

    /* 3. BATTLE (Shard Style) */
    .card-battle {
        grid-column: 3 / 4;
        grid-row: 1 / 3;
        border-right: 4px solid #8b0000;
    }
    
    .card-battle:hover {
        border-right-color: #ff4d4d;
        box-shadow: 0 0 30px rgba(255, 77, 77, 0.2);
    }
    
    .card-battle:hover .card-icon {
        stroke: #ff4d4d;
    }

    /* 4. GRIND (Stone/Resource Style) */
    .card-grind {
        grid-column: 2 / 3;
        grid-row: 2 / 3;
        border-bottom: 4px solid var(--text-dim);
    }
    
    .card-grind:hover {
        border-bottom-color: #fff;
    }

    /* --- ANIMATIONS --- */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 70px var(--magic-primary); }
    }
    @keyframes pulse-bg {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 900px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 2rem; }
        
        .rift-container { width: 250px; height: 250px; margin: -2rem 0; }
        .rift-core { width: 80px; height: 80px; }
        .ring-1 { width: 140px; height: 140px; }
        .ring-2 { width: 190px; height: 190px; }
        .ring-3 { width: 240px; height: 240px; }

        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1.2fr 1fr 1fr;
            height: auto;
        }
        
        .card-summon { grid-column: 1 / 3; grid-row: 1 / 2; flex-direction: row; justify-content: center; gap: 2rem; padding: 0 1rem; }
        .card-summon .card-icon { margin-bottom: 0; }
        
        .card-roster { grid-column: 1 / 2; grid-row: 2 / 3; }
        .card-grind { grid-column: 2 / 3; grid-row: 2 / 3; }
        .card-battle { grid-column: 1 / 3; grid-row: 3 / 4; border-right: none; border-bottom: 4px solid #8b0000; }
        .card-battle:hover { border-bottom-color: #ff4d4d; }
    }
</style>
</head>
<body>

    <!-- SVG Assets -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffdf73" />
                <stop offset="50%" stop-color="#b08d47" />
                <stop offset="100%" stop-color="#5c4618" />
            </linearGradient>
        </defs>
    </svg>

    <canvas id="bg-canvas"></canvas>
    <div class="fog-overlay"></div>
    <div class="noise"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="brand">
                <h1 class="game-title">Aetherbound</h1>
                <span class="game-subtitle">Spirit Summoning</span>
            </div>
            
            <div class="currency-hud">
                <!-- Coin Graphic -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="url(#gold-grad)" stroke="#5c4618" stroke-width="1"/>
                    <circle cx="12" cy="12" r="7" stroke="#5c4618" stroke-width="0.5" fill="none" stroke-dasharray="2 1"/>
                    <path d="M12 7v10M9 12h6" stroke="#5c4618" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="currency-val">24,500</span>
            </div>
        </header>

        <!-- Hero / Rift Area -->
        <main class="hero-section">
            <div class="rift-container" id="rift">
                <div class="rift-core"></div>
                <div class="rift-ring ring-1" style="top:50%; left:50%; transform:translate(-50%,-50%)"></div>
                <div class="rift-ring ring-2" style="top:50%; left:50%; transform:translate(-50%,-50%)"></div>
                <div class="rift-ring ring-3" style="top:50%; left:50%; transform:translate(-50%,-50%)"></div>
            </div>
        </main>

        <!-- Navigation Grid -->
        <nav class="menu-grid">
            
            <!-- 1. Summon -->
            <div class="menu-card card-summon">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L14 9H21L15.5 13.5L17.5 21L12 16.5L6.5 21L8.5 13.5L3 9H10L12 2Z" />
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Open the Rift</div>
            </div>

            <!-- 2. Roster -->
            <div class="menu-card card-roster">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Spirits</div>
            </div>

            <!-- 3. Battle -->
            <div class="menu-card card-battle">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- 4. Grind -->
            <div class="menu-card card-grind">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 8H9l-3-8H2" />
                    <path d="M7 12V7a5 5 0 0 1 10 0v5" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Particle System for Background
         * Creates a slow, mystical floating dust effect.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                // Very slow movement
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                
                // Life cycle
                this.life = Math.random() * 200;
                this.maxLife = 200 + Math.random() * 200;
                this.alpha = 0;
                
                // Color palette: mostly dark purple/blue, occasional gold
                const r = Math.random();
                if (r > 0.9) {
                    // Gold dust
                    this.color = `255, 223, 115`; 
                } else {
                    // Mystic dust
                    this.color = `157, 78, 221`; 
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;

                // Fade in and out
                if (this.life < 50) {
                    this.alpha = this.life / 50;
                } else if (this.life > this.maxLife - 50) {
                    this.alpha = (this.maxLife - this.life) / 50;
                } else {
                    this.alpha = 1;
                }

                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life >= this.maxLife) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha * 0.4})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize particles
        for (let i = 0; i < 150; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Parallax Effect on the Rift
        const rift = document.getElementById('rift');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            // Move the rift slightly opposite to mouse
            const core = rift.querySelector('.rift-core');
            const ring1 = rift.querySelector('.ring-1');
            
            if(core) core.style.transform = `translate(${x * 1.5}px, ${y * 1.5}px) scale(1.05)`;
            if(ring1) ring1.style.transform = `translate(-50%, -50%) rotate(${Date.now() * 0.01}deg)`; // Keep rotation but add offset
        });

    </script>
</body>
</html>
