<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #05070a;
        --bg-panel: rgba(16, 20, 30, 0.7);
        --accent-gold: #d4af37;
        --accent-gold-dim: #8a7020;
        --accent-mystic: #7b2cbf;
        --accent-glow: #9d4edd;
        --text-main: #e0e6ed;
        --text-muted: #94a3b8;
        --border-light: rgba(255, 255, 255, 0.1);
        --border-gold: rgba(212, 175, 55, 0.3);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Background Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 50%, #1a1025 0%, #05070a 80%);
    }

    /* Vignette overlay */
    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        pointer-events: none;
        z-index: 10;
    }

    /* Main Layout */
    .game-container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 2rem;
        position: relative;
        z-index: 5;
    }

    /* Header */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 1rem;
        margin-bottom: 2rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border-gold);
        padding: 0.5rem 1.5rem;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(5px);
    }

    .currency-icon {
        width: 20px;
        height: 20px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 2px var(--accent-gold));
    }

    .currency-amount {
        font-family: 'Georgia', serif;
        font-weight: bold;
        font-size: 1.1rem;
        color: var(--accent-gold);
        letter-spacing: 1px;
    }

    /* Hero / Summoning Area */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 3rem;
    }

    .game-title {
        font-family: 'Georgia', serif;
        font-size: 3.5rem;
        font-weight: 400;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        margin-bottom: 2rem;
        position: relative;
    }
    
    .game-title::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }

    .orb-container {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2rem;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .orb-container:hover {
        transform: scale(1.05);
    }

    .orb-container:hover .orb-ring {
        animation-duration: 2s;
        border-color: var(--accent-gold);
    }

    .orb-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(123, 44, 191, 0.4) 0%, rgba(0,0,0,0) 70%);
        animation: pulse 4s infinite ease-in-out;
    }

    .orb-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #e0e6ed, #4a4e69);
        box-shadow: 0 0 40px var(--accent-mystic), inset 0 0 20px rgba(255,255,255,0.2);
        position: relative;
        z-index: 2;
    }

    .orb-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid var(--accent-gold-dim);
        pointer-events: none;
    }

    .ring-1 { width: 140px; height: 140px; animation: spin 10s linear infinite; border-top-color: transparent; }
    .ring-2 { width: 180px; height: 180px; animation: spin-rev 15s linear infinite; border-bottom-color: transparent; opacity: 0.6; }
    .ring-3 { width: 210px; height: 210px; border: 1px dashed var(--border-light); animation: spin 30s linear infinite; }

    /* Menu Grid */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
    }

    .menu-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-light);
        border-radius: 8px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        height: 160px;
    }

    .menu-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(30, 35, 50, 0.9);
        border-color: var(--border-gold);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .menu-card:hover::before {
        opacity: 1;
    }

    .menu-card:hover .card-icon {
        fill: var(--accent-gold);
        transform: scale(1.1);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        fill: var(--text-muted);
        margin-bottom: 1rem;
        transition: all 0.3s ease;
    }

    .card-title {
        font-family: 'Georgia', serif;
        font-size: 1.2rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
    }

    .card-subtitle {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 0.8; }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .game-title {
            font-size: 2.5rem;
        }
    }

    /* Particles */
    .particle {
        position: absolute;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
    }
</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="vignette"></div>

    <div class="game-container">
        <header>
            <div style="width: 100px;"></div> <!-- Spacer -->
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            
            <div class="orb-container" id="summon-orb">
                <div class="orb-glow"></div>
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9 9H2l6 4.5L5.5 22 12 17l6.5 5-2.5-8.5L22 9h-7z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.5;
                this.life = Math.random() * 100;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir * 0.005;
                if (this.alpha >= 0.8 || this.alpha <= 0.1) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(200, 200, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw subtle connecting lines for "mystical web" effect
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            
            // Only draw lines for particles close to center or each other
            // (Simplified for performance)
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Subtle parallax on the inner elements
            const core = orb.querySelector('.orb-core');
            const glow = orb.querySelector('.orb-glow');
            
            core.style.transform = `translate(${x * 0.1}px, ${y * 0.1}px)`;
            glow.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             const glow = orb.querySelector('.orb-glow');
             core.style.transform = `translate(0px, 0px)`;
             glow.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
