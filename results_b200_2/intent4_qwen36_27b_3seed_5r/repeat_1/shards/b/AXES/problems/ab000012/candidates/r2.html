<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-surface: #0e0e14;
        
        --gold-primary: #f0c05a;
        --gold-dim: #8a6d2b;
        --gold-glow: rgba(240, 192, 90, 0.4);
        
        --mystic-primary: #a855f7;
        --mystic-deep: #4c1d95;
        --mystic-glow: rgba(168, 85, 247, 0.5);
        
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        --font-main: 'Cinzel', 'Times New Roman', serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- ATMOSPHERE & TEXTURE --- */
    #bg-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.6;
    }

    .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.95) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .noise-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.04;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- LAYOUT CONTAINER --- */
    .game-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- HEADER --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        position: relative;
        z-index: 20;
    }

    .brand-area {
        position: relative;
    }

    .game-title {
        font-size: 3rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        background: linear-gradient(180deg, #fff 0%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px var(--gold-glow));
        line-height: 1;
        margin-bottom: 0.5rem;
        /* Distressed texture mask */
        mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
    }

    .game-subtitle {
        font-size: 0.9rem;
        letter-spacing: 0.4em;
        color: var(--mystic-primary);
        text-transform: uppercase;
        opacity: 0.8;
        text-shadow: 0 0 10px var(--mystic-deep);
    }

    /* --- CURRENCY (Gold Indicator) --- */
    .currency-pill {
        background: linear-gradient(135deg, rgba(20, 20, 25, 0.9), rgba(40, 30, 10, 0.9));
        border: 1px solid var(--gold-dim);
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 
            0 10px 30px -10px rgba(0,0,0,0.8),
            inset 0 1px 0 rgba(255,255,255,0.1);
        position: relative;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        transition: transform 0.2s ease;
    }

    .currency-pill:hover {
        transform: translateY(-2px);
        border-color: var(--gold-primary);
    }

    /* Gold Coin Icon */
    .currency-icon {
        width: 28px;
        height: 28px;
        fill: url(#gold-gradient);
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--gold-primary);
        letter-spacing: 0.05em;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* --- HERO SECTION (Integrated Orb) --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 2rem;
    }

    /* The Vortex */
    .vortex-container {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    .vortex-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, var(--mystic-primary) 40%, transparent 80%);
        box-shadow: 
            0 0 60px var(--mystic-glow),
            0 0 120px var(--mystic-deep);
        animation: breathe 4s ease-in-out infinite;
        z-index: 5;
        position: relative;
    }

    .vortex-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(168, 85, 247, 0.3);
        box-shadow: 0 0 15px var(--mystic-deep);
        pointer-events: none;
    }

    .ring-1 {
        width: 160px; height: 160px;
        border-style: dashed;
        animation: spin 15s linear infinite;
    }
    .ring-2 {
        width: 220px; height: 220px;
        border: 1px solid transparent;
        border-top: 1px solid var(--gold-primary);
        border-bottom: 1px solid var(--gold-primary);
        animation: spin-rev 20s linear infinite;
    }
    .ring-3 {
        width: 280px; height: 280px;
        border: 1px dashed rgba(255,255,255,0.1);
        animation: spin 30s linear infinite;
    }

    /* --- MAIN MENU GRID --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        height: 320px;
        padding: 0 1rem;
        position: relative;
        z-index: 20;
    }

    /* --- CARD STYLES --- */
    .menu-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        background: rgba(10, 10, 15, 0.6);
        backdrop-filter: blur(10px);
        box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }

    .menu-card:hover {
        transform: translateY(-5px);
        border-color: rgba(255,255,255,0.2);
        box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        background: rgba(20, 20, 30, 0.8);
    }

    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        opacity: 0.5;
    }

    .card-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 1rem;
        transition: transform 0.4s ease, filter 0.4s ease;
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .menu-card:hover .card-icon {
        transform: scale(1.1);
        stroke: #fff;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
    }

    .card-title {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-main);
        margin-bottom: 0.25rem;
    }

    .card-subtitle {
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    /* --- PRIMARY ACTION: SUMMON --- */
    .card-summon {
        grid-column: 1 / 2;
        grid-row: 1 / 3;
        background: linear-gradient(160deg, rgba(20, 15, 30, 0.8), rgba(40, 20, 60, 0.9));
        border: 1px solid var(--mystic-deep);
        box-shadow: 0 0 40px rgba(76, 29, 149, 0.2);
        clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    }

    .card-summon::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top center, var(--mystic-glow), transparent 70%);
        opacity: 0.3;
        pointer-events: none;
    }

    .card-summon:hover {
        border-color: var(--mystic-primary);
        box-shadow: 0 0 60px rgba(168, 85, 247, 0.4);
    }

    .card-summon .card-icon {
        width: 64px;
        height: 64px;
        stroke: var(--mystic-primary);
        filter: drop-shadow(0 0 10px var(--mystic-primary));
    }
    
    .card-summon:hover .card-icon {
        stroke: #fff;
        filter: drop-shadow(0 0 20px var(--mystic-primary));
    }

    .card-summon .card-title {
        font-size: 2rem;
        background: linear-gradient(to bottom, #fff, var(--mystic-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* --- SECONDARY ACTIONS --- */
    /* Roster - Grimoire Style */
    .card-roster {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        border-left: 3px solid var(--gold-dim);
    }
    .card-roster:hover {
        border-color: var(--gold-primary);
        border-left-color: var(--gold-primary);
    }

    /* Battle - Shard Style */
    .card-battle {
        grid-column: 3 / 4;
        grid-row: 1 / 3;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 50%);
        border-right: 3px solid #ef4444; /* Red accent for danger */
    }
    .card-battle:hover {
        border-color: #ef4444;
        box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
    }
    .card-battle:hover .card-icon {
        stroke: #ef4444;
        filter: drop-shadow(0 0 10px #ef4444);
    }

    /* Grind - Stone Style */
    .card-grind {
        grid-column: 2 / 3;
        grid-row: 2 / 3;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        border-bottom: 3px solid var(--text-muted);
    }
    .card-grind:hover {
        border-color: var(--text-main);
        border-bottom-color: var(--text-main);
    }

    /* --- ANIMATIONS --- */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 80px var(--mystic-glow); }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 900px) {
        .game-title { font-size: 2rem; }
        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            height: 400px;
        }
        .card-summon { grid-column: 1 / 3; grid-row: 1 / 2; flex-direction: row; gap: 2rem; padding: 0 2rem; }
        .card-summon .card-icon { margin-bottom: 0; width: 50px; height: 50px; }
        .card-battle { grid-column: 1 / 2; grid-row: 2 / 3; clip-path: none; border-right: 1px solid #ef4444; }
        .card-roster { grid-column: 2 / 3; grid-row: 2 / 3; clip-path: none; border-left: 1px solid var(--gold-dim); }
        .card-grind { grid-column: 1 / 3; grid-row: 3 / 4; clip-path: none; border-bottom: 1px solid var(--text-muted); }
        .vortex-container { width: 200px; height: 200px; margin-bottom: 1rem; }
    }
</style>
</head>
<body>

    <!-- SVG Defs for Gradients -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fde047" />
                <stop offset="50%" stop-color="#eab308" />
                <stop offset="100%" stop-color="#a16207" />
            </linearGradient>
        </defs>
    </svg>

    <div id="bg-canvas"></div>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <div class="game-container">
        
        <header>
            <div class="brand-area">
                <h1 class="game-title">Aetherbound</h1>
                <span class="game-subtitle">Spirit Summoning</span>
            </div>
            
            <div class="currency-pill">
                <!-- Gold Coin Icon (Replaces Star) -->
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="url(#gold-gradient)"/>
                    <text x="50%" y="50%" dy=".3em" text-anchor="middle" font-family="serif" font-weight="bold" font-size="12" fill="#78350f">$</text>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <!-- The Vortex (Atmospheric Hero) -->
            <div class="vortex-container" id="vortex">
                <div class="vortex-core"></div>
                <div class="vortex-ring ring-1" style="top:50%; left:50%; transform:translate(-50%,-50%)"></div>
                <div class="vortex-ring ring-2" style="top:50%; left:50%; transform:translate(-50%,-50%)"></div>
                <div class="vortex-ring ring-3" style="top:50%; left:50%; transform:translate(-50%,-50%)"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card (Primary Action - Dominant) -->
            <div class="menu-card card-summon">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Magic Rune Icon -->
                    <path d="M12 2L14 9H21L15.5 13.5L17.5 21L12 16.5L6.5 21L8.5 13.5L3 9H10L12 2Z" />
                </svg>
                <div>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Awaken Spirits</div>
                </div>
            </div>

            <!-- Roster Card (Grimoire Style) -->
            <div class="menu-card card-roster">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Book/Scroll Icon -->
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card (Shard Style) -->
            <div class="menu-card card-battle">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Sword/Combat Icon -->
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Enter Arena</div>
            </div>

            <!-- Grind Card (Stone Style) -->
            <div class="menu-card card-grind">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Anvil/Resource Icon -->
                    <path d="M22 12h-4l-3 8H9l-3-8H2" />
                    <path d="M7 12V7a5 5 0 0 1 10 0v5" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particle vortex.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let mouse = { x: 0, y: 0 };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                // Spawn in a circle or random
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
                this.life = Math.random() * 100 + 50;
                this.maxLife = this.life;
                
                // Colors: Gold or Purple
                const isGold = Math.random() > 0.7;
                this.color = isGold ? `240, 192, 90` : `168, 85, 247`;
                this.alpha = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                if (this.life > this.maxLife - 20) this.alpha += 0.02;
                else if (this.life < 20) this.alpha -= 0.02;
                else this.alpha = Math.min(this.alpha, 0.6);

                // Mouse interaction (Vortex effect)
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 200) {
                    const force = (200 - dist) / 200;
                    this.vx += (dx / dist) * force * 0.05;
                    this.vy += (dy / dist) * force * 0.05;
                }

                // Wrap
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create Particles
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Vortex Parallax
        const vortex = document.getElementById('vortex');
        
        vortex.addEventListener('mousemove', (e) => {
            const rect = vortex.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const moveX = (e.clientX - centerX) * 0.05;
            const moveY = (e.clientY - centerY) * 0.05;
            
            const core = vortex.querySelector('.vortex-core');
            core.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.1)`;
        });

        vortex.addEventListener('mouseleave', () => {
             const core = vortex.querySelector('.vortex-core');
             core.style.transform = `translate(0px, 0px) scale(1)`;
        });

    </script>
</body>
</html>
