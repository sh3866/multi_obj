<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Void & Alchemical Gold */
        --bg-void: #020204;
        --bg-panel: #0a0a0f;
        
        --gold-primary: #d4af37;
        --gold-light: #f9e596;
        --gold-dark: #5e4b20;
        
        --magic-purple: #7b2cbf;
        --magic-faint: #240046;
        
        --text-main: #e6e6e6;
        --text-muted: #888899;
        
        /* Typography */
        --font-display: 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-void);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- ATMOSPHERIC LAYERS --- */
    
    /* 1. Canvas for Particles */
    #bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.6;
    }

    /* 2. Deep Fog/Vignette - Pushes focus to center */
    .fog-overlay {
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 50% 40%, transparent 0%, rgba(2,2,4,0.8) 70%, rgba(2,2,4,1) 100%),
            linear-gradient(to bottom, rgba(2,2,4,0.9) 0%, transparent 20%, transparent 80%, rgba(2,2,4,1) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* 3. Noise Texture */
    .noise {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.07;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* --- MAIN LAYOUT --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        max-width: 1600px;
        padding: 3rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- HEADER --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 20;
        padding-top: 1rem;
    }

    .brand {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #fff;
        text-shadow: 0 0 20px rgba(255,255,255,0.15);
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.75rem;
        letter-spacing: 0.4em;
        color: var(--gold-primary);
        text-transform: uppercase;
        opacity: 0.9;
    }

    /* Currency HUD - Artifact Style */
    .currency-hud {
        display: flex;
        align-items: center;
        padding: 0.4rem 1.5rem 0.4rem 0.8rem;
        background: linear-gradient(90deg, rgba(10,10,15,0.8) 0%, rgba(20,20,25,0.4) 100%);
        border-left: 2px solid var(--gold-primary);
        border-right: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        clip-path: polygon(15px 0, 100% 0, 100% 100%, 0 100%, 0 15px);
        position: relative;
    }
    
    /* Inner glow for HUD */
    .currency-hud::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
        pointer-events: none;
    }

    .coin-icon {
        width: 24px;
        height: 24px;
        margin-right: 12px;
        filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
    }
    
    .currency-val {
        font-family: var(--font-ui);
        font-weight: 600;
        color: var(--gold-light);
        font-size: 1rem;
        letter-spacing: 0.05em;
    }

    /* --- HERO AREA (The Summoning Circle) --- */
    .hero-section {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        /* Dimmed to not compete with UI */
        opacity: 0.7; 
    }

    .rift-container {
        position: relative;
        width: 600px;
        height: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    /* The Central Glow - Soft and Atmospheric */
    .rift-core {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(123, 44, 191, 0.4) 40%, transparent 70%);
        box-shadow: 0 0 60px rgba(123, 44, 191, 0.3);
        filter: blur(10px);
        animation: breathe 6s ease-in-out infinite;
        z-index: 2;
    }

    /* Geometric Rings - The Ritual */
    .rift-ring {
        position: absolute;
        border-radius: 50%;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        border-style: solid;
        border-color: rgba(123, 44, 191, 0.15);
    }

    .ring-1 {
        width: 300px; height: 300px;
        border-width: 1px;
        border-top-color: var(--gold-dark);
        border-bottom-color: var(--gold-dark);
        border-left-style: dashed;
        border-right-style: dashed;
        animation: spin 40s linear infinite;
    }
    
    .ring-2 {
        width: 420px; height: 420px;
        border-width: 2px;
        border-color: transparent;
        border-left-color: rgba(255, 255, 255, 0.1);
        border-right-color: rgba(255, 255, 255, 0.1);
        animation: spin-rev 60s linear infinite;
    }
    
    .ring-3 {
        width: 540px; height: 540px;
        border-width: 1px;
        border-color: rgba(255,255,255,0.03);
        border-top: 2px solid var(--gold-dark);
        animation: spin 90s linear infinite;
    }

    /* --- NAVIGATION GRID --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        height: 240px;
        position: relative;
        z-index: 20;
        padding-bottom: 1rem;
    }

    /* --- CARD SYSTEM (Unified Geometry) --- */
    .menu-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        overflow: hidden;
        
        /* Base Material: Dark Obsidian */
        background: linear-gradient(180deg, rgba(20,20,25,0.8) 0%, rgba(10,10,12,0.95) 100%);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        
        /* Consistent Angled Corners (Chamfered) */
        clip-path: polygon(
            15px 0, 100% 0, 
            100% calc(100% - 15px), calc(100% - 15px) 100%, 
            0 100%, 0 15px
        );
    }

    /* Hover State for all cards */
    .menu-card:hover {
        transform: translateY(-5px);
        border-color: rgba(255,255,255,0.2);
        background: linear-gradient(180deg, rgba(30,30,40,0.9) 0%, rgba(15,15,20,0.95) 100%);
        box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }

    /* Typography inside cards */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        color: var(--text-main);
        text-transform: uppercase;
        margin-top: 0.5rem;
        transition: color 0.3s ease;
    }

    .card-subtitle {
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 0.4rem;
        font-weight: 500;
    }

    /* Icons - Unified Line Art */
    .card-icon {
        width: 36px;
        height: 36px;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        stroke: #6e6e7a;
        transition: all 0.3s ease;
    }

    /* --- SPECIFIC CARD STYLES --- */

    /* 1. SUMMON - The Primary Action (Gold) */
    .card-summon {
        /* Gold Accent Border */
        border: 1px solid rgba(212, 175, 55, 0.3);
        background: linear-gradient(160deg, rgba(94, 75, 32, 0.15) 0%, rgba(10,10,12,0.95) 100%);
    }
    
    /* Glowing Top Edge for Summon */
    .card-summon::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        box-shadow: 0 0 10px var(--gold-primary);
    }

    .card-summon .card-icon {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.4));
    }

    .card-summon:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), 0 15px 40px rgba(0,0,0,0.9);
    }
    
    .card-summon:hover .card-title {
        color: var(--gold-light);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    /* 2. ROSTER - Spirit Tome (Purple) */
    .card-roster:hover {
        border-color: rgba(123, 44, 191, 0.5);
    }
    .card-roster:hover .card-icon {
        stroke: #c77dff;
        filter: drop-shadow(0 0 8px rgba(123, 44, 191, 0.6));
    }
    .card-roster:hover .card-title {
        color: #e0aaff;
    }

    /* 3. BATTLE - Rune Blade (Red) */
    .card-battle:hover {
        border-color: rgba(255, 77, 77, 0.5);
    }
    .card-battle:hover .card-icon {
        stroke: #ff6b6b;
        filter: drop-shadow(0 0 8px rgba(255, 77, 77, 0.6));
    }
    .card-battle:hover .card-title {
        color: #ff8787;
    }

    /* 4. GRIND - Resources (Teal/Blue) */
    .card-grind:hover {
        border-color: rgba(100, 200, 255, 0.5);
    }
    .card-grind:hover .card-icon {
        stroke: #64c8ff;
        filter: drop-shadow(0 0 8px rgba(100, 200, 255, 0.6));
    }
    .card-grind:hover .card-title {
        color: #a2d9ff;
    }

    /* --- ANIMATIONS --- */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 1000px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 1.8rem; }
        
        .rift-container { width: 300px; height: 300px; margin: -2rem 0; opacity: 0.4; }
        .ring-1 { width: 180px; height: 180px; }
        .ring-2 { width: 240px; height: 240px; }
        .ring-3 { width: 280px; height: 280px; }

        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            height: auto;
        }
        
        /* Mobile layout: Summon spans top */
        .card-summon { grid-column: 1 / 3; flex-direction: row; justify-content: flex-start; padding-left: 3rem; gap: 1.5rem; }
        .card-summon .card-icon { margin-bottom: 0; }
        
        .card-roster { grid-column: 1 / 2; }
        .card-grind { grid-column: 2 / 3; }
        .card-battle { grid-column: 1 / 3; }
    }
</style>
</head>
<body>

    <!-- SVG Assets -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f9e596" />
                <stop offset="50%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#5e4b20" />
            </linearGradient>
        </defs>
    </svg>

    <canvas id="bg-canvas"></canvas>
    <div class="fog-overlay"></div>
    <div class="noise"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="brand">
                <h1 class="game-title">Aetherbound</h1>
                <span class="game-subtitle">Spirit Summoning</span>
            </div>
            
            <div class="currency-hud">
                <!-- Coin Graphic -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="url(#gold-grad)" stroke="#5e4b20" stroke-width="1"/>
                    <circle cx="12" cy="12" r="7" stroke="#5e4b20" stroke-width="0.5" fill="none" stroke-dasharray="2 1"/>
                    <path d="M12 7v10M9 12h6" stroke="#5e4b20" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="currency-val">24,500</span>
            </div>
        </header>

        <!-- Hero / Rift Area (Atmospheric Background) -->
        <main class="hero-section">
            <div class="rift-container" id="rift">
                <div class="rift-core"></div>
                <div class="rift-ring ring-1"></div>
                <div class="rift-ring ring-2"></div>
                <div class="rift-ring ring-3"></div>
            </div>
        </main>

        <!-- Navigation Grid -->
        <nav class="menu-grid">
            
            <!-- 1. Summon (Primary - Gold) -->
            <div class="menu-card card-summon">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Star/Rift Icon -->
                    <path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z" />
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Open the Rift</div>
            </div>

            <!-- 2. Roster (Purple) -->
            <div class="menu-card card-roster">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Book Icon -->
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Spirit Tome</div>
            </div>

            <!-- 3. Battle (Red) -->
            <div class="menu-card card-battle">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Sword Icon -->
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">The Arena</div>
            </div>

            <!-- 4. Grind (Blue) -->
            <div class="menu-card card-grind">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Anvil/Resource Icon -->
                    <path d="M22 12h-4l-3 8H9l-3-8H2" />
                    <path d="M7 12V7a5 5 0 0 1 10 0v5" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Particle System
         * Creates a subtle, mystical floating dust effect.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                // Very slow, ethereal movement
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                
                this.life = Math.random() * 200;
                this.maxLife = 200 + Math.random() * 200;
                this.alpha = 0;
                
                // Colors: Gold dust, White spirits, Purple magic
                const r = Math.random();
                if (r > 0.95) {
                    this.color = `212, 175, 55`; // Gold
                } else if (r > 0.85) {
                    this.color = `255, 255, 255`; // White
                } else {
                    this.color = `123, 44, 191`; // Purple
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;

                // Fade in and out logic
                if (this.life < 50) {
                    this.alpha = this.life / 50;
                } else if (this.life > this.maxLife - 50) {
                    this.alpha = (this.maxLife - this.life) / 50;
                } else {
                    this.alpha = 1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life >= this.maxLife) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha * 0.4})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize particles
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Subtle Parallax on the Hero Rift
        const rift = document.getElementById('rift');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 200;
            const y = (window.innerHeight - e.pageY * 2) / 200;
            
            // Move the rift slightly opposite to mouse
            const core = rift.querySelector('.rift-core');
            
            if(core) {
                // Combine translation with the breathing scale animation logic
                // Note: Since we have a CSS animation on scale, we must be careful not to overwrite it.
                // However, simple translate is usually safe alongside scale if not animated by JS.
                // Here we just add a translate.
                core.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

    </script>
</body>
</html>
