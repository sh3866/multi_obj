<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-panel: #111116;
        
        --gold-bright: #ffe699;
        --gold-metal: #c5a059;
        --gold-dark: #5e4b20;
        
        --magic-primary: #9d4edd;
        --magic-glow: #e0aaff;
        --magic-deep: #240046;
        --magic-danger: #ff4d4d;
        
        --text-main: #e0e0e8;
        --text-dim: #6e6e7a;
        
        --font-header: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- ATMOSPHERE --- */
    #bg-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    /* Deep Atmospheric Vignette */
    .fog-overlay {
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 50% 50%, rgba(36, 0, 70, 0.15) 0%, transparent 60%),
            radial-gradient(circle at 50% 50%, transparent 30%, var(--bg-deep) 90%),
            linear-gradient(to bottom, rgba(5,5,8,0.9) 0%, transparent 20%, transparent 80%, rgba(5,5,8,1) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* Film Grain */
    .noise {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.04;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* --- LAYOUT --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1600px;
        height: 100%;
        padding: 2rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- HEADER & HUD --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 20;
    }

    .brand {
        position: relative;
        text-align: left;
    }

    .game-title {
        font-family: var(--font-header);
        font-size: 3rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        background: linear-gradient(180deg, #fff 0%, #a0a0a0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
        line-height: 1;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        color: var(--magic-primary);
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(157, 78, 221, 0.5);
        margin-top: 0.5rem;
        display: block;
        opacity: 0.8;
    }

    /* Currency HUD - Crafted Artifact Style */
    .currency-hud {
        display: flex;
        align-items: center;
        background: linear-gradient(90deg, rgba(15,15,20,0.9) 0%, rgba(30,30,40,0.8) 100%);
        border: 1px solid var(--gold-dark);
        border-left: 3px solid var(--gold-metal);
        padding: 0.5rem 1.2rem 0.5rem 0.5rem;
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.8);
        /* Irregular shape */
        clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
    }
    
    .currency-hud::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
        pointer-events: none;
    }

    .coin-icon {
        width: 32px;
        height: 32px;
        margin-right: 12px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    
    .currency-val {
        font-family: var(--font-ui);
        font-weight: 700;
        color: var(--gold-bright);
        font-size: 1.1rem;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        letter-spacing: 0.05em;
    }

    /* --- HERO SECTION (The Rift) --- */
    .hero-section {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        /* Push the rift slightly up to balance the bottom menu */
        margin-top: -20px; 
    }

    /* The Summoning Circle/Rift - Expanded */
    .rift-container {
        position: relative;
        width: 600px;
        height: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1200px;
    }

    .rift-core {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, var(--magic-glow) 40%, transparent 80%);
        box-shadow: 
            0 0 60px var(--magic-primary),
            0 0 120px var(--magic-deep),
            inset 0 0 30px #fff;
        animation: pulse 5s ease-in-out infinite;
        z-index: 5;
        opacity: 0.95;
        mix-blend-mode: screen;
    }

    .rift-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(168, 85, 247, 0.1);
        box-shadow: 0 0 15px rgba(60, 9, 108, 0.1);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
    }

    /* Complex Rune Rings */
    .ring-1 {
        width: 350px; height: 350px;
        border-top: 3px solid rgba(157, 78, 221, 0.6);
        border-bottom: 3px solid rgba(157, 78, 221, 0.6);
        border-left: 1px dashed rgba(157, 78, 221, 0.3);
        border-right: 1px dashed rgba(157, 78, 221, 0.3);
        animation: spin 20s linear infinite;
    }
    
    .ring-2 {
        width: 450px; height: 450px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-left: 4px solid var(--gold-dark);
        border-right: 4px solid var(--gold-dark);
        animation: spin-rev 35s linear infinite;
    }
    
    .ring-3 {
        width: 550px; height: 550px;
        border: 1px solid rgba(255,255,255,0.03);
        border-top: 2px solid transparent;
        animation: spin 60s linear infinite;
    }

    /* --- MENU GRID (Unified System) --- */
    .menu-grid {
        display: grid;
        /* 4 Equal Columns */
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        height: 220px;
        position: relative;
        z-index: 20;
    }

    /* --- CARD SYSTEM --- */
    .menu-card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: hidden;
        
        /* Unified Geometry: Dark Glass / Obsidian Shard */
        background: linear-gradient(180deg, rgba(25,25,35,0.6) 0%, rgba(10,10,15,0.8) 100%);
        border: 1px solid rgba(255,255,255,0.05);
        border-top: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        
        /* Subtle Angled Corners */
        clip-path: polygon(
            20px 0, 100% 0, 
            100% calc(100% - 20px), calc(100% - 20px) 100%, 
            0 100%, 0 20px
        );
    }

    .menu-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: rgba(255,255,255,0.2);
        background: linear-gradient(180deg, rgba(35,35,50,0.8) 0%, rgba(15,15,25,0.9) 100%);
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    /* Common Icon Styles - Consistent Neon Wireframe */
    .card-icon {
        width: 40px;
        height: 40px;
        margin-bottom: 1rem;
        stroke: var(--text-dim);
        stroke-width: 1.5;
        fill: none;
        transition: 0.3s ease;
        filter: drop-shadow(0 0 0px transparent);
    }

    .menu-card:hover .card-icon {
        stroke: #fff;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
    }

    .card-title {
        font-family: var(--font-header);
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: var(--text-main);
        text-transform: uppercase;
        transition: 0.3s ease;
    }

    .card-subtitle {
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-top: 0.25rem;
        opacity: 0.7;
    }

    /* --- SPECIFIC CARD STATES --- */

    /* 1. SUMMON (Primary Action - Gold Accent) */
    .card-summon {
        border: 1px solid rgba(197, 160, 89, 0.4);
        background: linear-gradient(160deg, rgba(94, 75, 32, 0.2) 0%, rgba(10,10,15,0.9) 100%);
        box-shadow: 0 0 20px rgba(94, 75, 32, 0.2);
    }

    .card-summon::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
        opacity: 0.5;
    }

    .card-summon:hover {
        border-color: var(--gold-metal);
        box-shadow: 0 0 30px rgba(197, 160, 89, 0.3);
    }

    .card-summon .card-icon {
        stroke: var(--gold-bright);
        filter: drop-shadow(0 0 5px var(--gold-metal));
    }

    .card-summon .card-title {
        color: var(--gold-bright);
    }

    /* 2. ROSTER */
    .card-roster:hover {
        border-color: rgba(157, 78, 221, 0.5);
    }
    .card-roster:hover .card-icon {
        stroke: var(--magic-glow);
        filter: drop-shadow(0 0 8px var(--magic-primary));
    }

    /* 3. BATTLE */
    .card-battle:hover {
        border-color: rgba(255, 77, 77, 0.5);
    }
    .card-battle:hover .card-icon {
        stroke: var(--magic-danger);
        filter: drop-shadow(0 0 8px var(--magic-danger));
    }

    /* 4. GRIND */
    .card-grind:hover {
        border-color: rgba(100, 200, 255, 0.5);
    }
    .card-grind:hover .card-icon {
        stroke: #64c8ff;
        filter: drop-shadow(0 0 8px #64c8ff);
    }

    /* --- ANIMATIONS --- */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 80px var(--magic-primary); }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 1000px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 2rem; }
        
        .rift-container { width: 350px; height: 350px; margin: -3rem 0; }
        .rift-core { width: 100px; height: 100px; }
        .ring-1 { width: 200px; height: 200px; }
        .ring-2 { width: 260px; height: 260px; }
        .ring-3 { width: 320px; height: 320px; }

        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            height: auto;
        }
        
        .card-summon { grid-column: 1 / 3; flex-direction: row; justify-content: center; gap: 2rem; padding: 0 2rem; }
        .card-summon .card-icon { margin-bottom: 0; }
        
        .card-roster { grid-column: 1 / 2; }
        .card-grind { grid-column: 2 / 3; }
        .card-battle { grid-column: 1 / 3; }
    }
</style>
</head>
<body>

    <!-- SVG Assets -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffdf73" />
                <stop offset="50%" stop-color="#b08d47" />
                <stop offset="100%" stop-color="#5c4618" />
            </linearGradient>
        </defs>
    </svg>

    <canvas id="bg-canvas"></canvas>
    <div class="fog-overlay"></div>
    <div class="noise"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="brand">
                <h1 class="game-title">Aetherbound</h1>
                <span class="game-subtitle">Spirit Summoning</span>
            </div>
            
            <div class="currency-hud">
                <!-- Coin Graphic -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="url(#gold-grad)" stroke="#5c4618" stroke-width="1"/>
                    <circle cx="12" cy="12" r="7" stroke="#5c4618" stroke-width="0.5" fill="none" stroke-dasharray="2 1"/>
                    <path d="M12 7v10M9 12h6" stroke="#5c4618" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="currency-val">24,500</span>
            </div>
        </header>

        <!-- Hero / Rift Area -->
        <main class="hero-section">
            <div class="rift-container" id="rift">
                <div class="rift-core"></div>
                <div class="rift-ring ring-1"></div>
                <div class="rift-ring ring-2"></div>
                <div class="rift-ring ring-3"></div>
            </div>
        </main>

        <!-- Navigation Grid -->
        <nav class="menu-grid">
            
            <!-- 1. Summon (Primary) -->
            <div class="menu-card card-summon">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L14 9H21L15.5 13.5L17.5 21L12 16.5L6.5 21L8.5 13.5L3 9H10L12 2Z" />
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Open the Rift</div>
            </div>

            <!-- 2. Roster -->
            <div class="menu-card card-roster">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Spirits</div>
            </div>

            <!-- 3. Battle -->
            <div class="menu-card card-battle">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- 4. Grind -->
            <div class="menu-card card-grind">
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 8H9l-3-8H2" />
                    <path d="M7 12V7a5 5 0 0 1 10 0v5" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Particle System for Background
         * Creates a slow, mystical floating dust effect.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                // Very slow movement
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2 + 0.5;
                
                // Life cycle
                this.life = Math.random() * 200;
                this.maxLife = 200 + Math.random() * 200;
                this.alpha = 0;
                
                // Color palette: mostly dark purple/blue, occasional gold
                const r = Math.random();
                if (r > 0.92) {
                    // Gold dust
                    this.color = `255, 223, 115`; 
                } else if (r > 0.8) {
                    // White/Blue dust
                    this.color = `200, 220, 255`;
                } else {
                    // Mystic dust
                    this.color = `157, 78, 221`; 
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;

                // Fade in and out
                if (this.life < 50) {
                    this.alpha = this.life / 50;
                } else if (this.life > this.maxLife - 50) {
                    this.alpha = (this.maxLife - this.life) / 50;
                } else {
                    this.alpha = 1;
                }

                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life >= this.maxLife) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize particles
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Parallax Effect on the Rift
        const rift = document.getElementById('rift');
        
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 150;
            const y = (window.innerHeight - e.pageY * 2) / 150;
            
            // Move the rift slightly opposite to mouse
            const core = rift.querySelector('.rift-core');
            
            if(core) core.style.transform = `translate(${x * 2}px, ${y * 2}px) scale(1.05)`;
        });

    </script>
</body>
</html>
