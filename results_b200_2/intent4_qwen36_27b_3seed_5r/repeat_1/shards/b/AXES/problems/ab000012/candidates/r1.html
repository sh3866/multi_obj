<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #08090d;
        --bg-mid: #131620;
        --bg-card: rgba(20, 24, 35, 0.6);
        
        --gold-light: #ffeaa7;
        --gold-main: #d4af37;
        --gold-dark: #8a7020;
        
        --mystic-purple: #7b2cbf;
        --mystic-glow: #9d4edd;
        --mystic-teal: #00b4d8;
        
        --text-main: #e0e6ed;
        --text-muted: #94a3b8;
        
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-gold: rgba(212, 175, 55, 0.4);
        
        --font-display: 'Cinzel', 'Georgia', serif;
        --font-body: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #1a1025 0%, #05070a 70%);
    }

    /* Background Effects */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
    }

    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 200px rgba(0,0,0,0.8);
        pointer-events: none;
        z-index: 10;
        background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.6) 100%);
    }

    /* Layout Grid */
    .game-container {
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        position: relative;
        z-index: 5;
    }

    /* Header & Nav */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 2rem;
        position: relative;
        z-index: 20;
    }

    .brand-area {
        display: flex;
        flex-direction: column;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #fff 0%, var(--gold-light) 40%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        line-height: 1;
    }

    .game-subtitle {
        font-family: var(--font-display);
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 0.3em;
        margin-top: 5px;
        text-transform: uppercase;
        opacity: 0.8;
    }

    .currency-pill {
        background: linear-gradient(90deg, rgba(10, 12, 16, 0.8), rgba(30, 35, 50, 0.8));
        border: 1px solid var(--border-gold);
        border-left: 3px solid var(--gold-main);
        padding: 0.6rem 1.5rem;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        backdrop-filter: blur(8px);
    }

    .currency-icon {
        width: 24px;
        height: 24px;
        fill: var(--gold-main);
        filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.6));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
    }

    /* Hero Section */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 1rem;
    }

    /* The Summoning Orb - Reimagined */
    .orb-container {
        position: relative;
        width: 280px;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1rem;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .orb-container:hover {
        transform: scale(1.05);
    }

    .orb-container:hover .orb-glow {
        opacity: 0.8;
        transform: scale(1.2);
    }

    .orb-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(157, 78, 221, 0.3) 0%, rgba(123, 44, 191, 0.1) 50%, transparent 70%);
        filter: blur(20px);
        animation: pulse 4s infinite ease-in-out;
    }

    .orb-core {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        /* Complex gradient to simulate 3D glass/liquid */
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0) 20%),
                    radial-gradient(circle at 50% 50%, var(--mystic-purple), #1a0b2e 90%);
        box-shadow: 
            0 0 30px var(--mystic-purple),
            inset 0 0 20px rgba(255,255,255,0.3);
        position: relative;
        z-index: 2;
        border: 1px solid rgba(255,255,255,0.2);
    }
    
    /* Inner liquid swirl effect */
    .orb-core::after {
        content: '';
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80%;
        height: 80%;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.1) 20%, transparent 40%);
        animation: spin 8s linear infinite;
    }

    .orb-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid var(--gold-dark);
        pointer-events: none;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
    }

    /* Runes on the rings */
    .ring-1 { 
        width: 200px; 
        height: 200px; 
        border-style: dashed;
        animation: spin 20s linear infinite;
        border-color: rgba(212, 175, 55, 0.3);
    }
    
    .ring-2 { 
        width: 250px; 
        height: 250px; 
        border-style: solid;
        border-width: 1px;
        border-top-color: transparent;
        border-bottom-color: transparent;
        animation: spin-rev 25s linear infinite;
        border-color: rgba(157, 78, 221, 0.4);
    }

    .ring-3 {
        width: 270px;
        height: 270px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        animation: spin 60s linear infinite;
    }

    /* Menu Grid */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
        margin-bottom: 2rem;
    }

    .menu-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        height: 180px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Inner shadow for depth */
    .menu-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 12px;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        pointer-events: none;
    }

    /* Top accent line */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--text-muted), transparent);
        opacity: 0.3;
        transition: all 0.3s ease;
    }

    .menu-card:hover {
        transform: translateY(-8px);
        border-color: var(--border-gold);
        background: rgba(30, 35, 50, 0.85);
    }

    .menu-card:hover::after {
        opacity: 1;
        background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-light);
        filter: drop-shadow(0 0 8px var(--gold-main));
        transform: scale(1.1);
    }
    
    .menu-card:hover .card-title {
        color: #fff;
    }

    /* Distinct Styles for Cards based on Expressiveness Critique */
    
    /* Summon Card - Primary Action */
    .card-summon {
        background: linear-gradient(160deg, rgba(30, 35, 50, 0.8), rgba(20, 10, 30, 0.9));
        border-color: rgba(157, 78, 221, 0.3);
    }
    .card-summon::after {
        background: linear-gradient(90deg, transparent, var(--mystic-glow), transparent);
        opacity: 0.5;
    }
    .card-summon:hover {
        border-color: var(--mystic-glow);
        box-shadow: 0 0 30px rgba(157, 78, 221, 0.2);
    }
    .card-summon:hover .card-icon {
        fill: #fff;
        filter: drop-shadow(0 0 10px var(--mystic-glow));
    }
    .card-summon .card-title {
        color: var(--mystic-glow);
    }

    .card-icon {
        width: 48px;
        height: 48px;
        fill: var(--text-muted);
        margin-bottom: 1.2rem;
        transition: all 0.3s ease;
        /* Unified stroke style handled in SVG */
    }

    .card-title {
        font-family: var(--font-display);
        font-size: 1.3rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
        font-weight: 600;
        text-transform: uppercase;
    }

    .card-subtitle {
        font-family: var(--font-display);
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        opacity: 0.8;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 0.8; }
    }

    /* Responsive */
    @media (max-width: 900px) {
        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .menu-card {
            height: 140px;
        }
        .game-title {
            font-size: 1.8rem;
        }
        .orb-container {
            width: 220px;
            height: 220px;
        }
        .orb-core {
            width: 100px;
            height: 100px;
        }
    }
</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="vignette"></div>

    <div class="game-container">
        
        <header>
            <div class="brand-area">
                <h1 class="game-title">Aetherbound</h1>
                <span class="game-subtitle">Spirit Summoning</span>
            </div>
            
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9 9H2l6 4.5L5.5 22 12 17l6.5 5-2.5-8.5L22 9h-7z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <!-- The Orb is now more atmospheric and less of a focal blocker -->
            <div class="orb-container" id="summon-orb">
                <div class="orb-glow"></div>
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card (Primary Action) -->
            <div class="menu-card card-summon">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Unified stroke style -->
                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M12 2L9 9H2l6 4.5L5.5 22 12 17l6.5 5-2.5-8.5L22 9h-7z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Awaken Spirits</div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Team</div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M14.5 17.5L3 6V3h3l11.5 11.5m-5 5L21 14v3h-3L11.5 6.5"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Enter Arena</div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class - Enhanced for mystical feel
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.4;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                
                // Randomly assign color tint (gold or purple)
                this.color = Math.random() > 0.7 ? '212, 175, 55' : '200, 200, 255';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir * 0.003;
                if (this.alpha >= 0.6 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Subtle parallax on the inner elements
            const core = orb.querySelector('.orb-core');
            const glow = orb.querySelector('.orb-glow');
            
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
            glow.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             const glow = orb.querySelector('.orb-glow');
             core.style.transform = `translate(0px, 0px)`;
             glow.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
