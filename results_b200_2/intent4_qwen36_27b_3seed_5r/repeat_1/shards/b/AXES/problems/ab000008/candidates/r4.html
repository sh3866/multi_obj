<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance - Rhythm Protocol</title>
    <style>
        :root {
            --bg-sky-top: #050014;
            --bg-sky-bot: #180033;
            --neon-pink: #ff00aa;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffea00;
            --neon-purple: #bc13fe;
            --grid-color: rgba(188, 19, 254, 0.5);
            --hit-line: #ffffff;
            --font-pixel: "Courier New", Courier, monospace; /* Fallback for system pixel fonts */
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; user-select: none; -webkit-font-smoothing: none; -moz-osx-font-smoothing: unset; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-sky-top); overflow: hidden; font-family: var(--font-pixel); color: white; }

        /* --- CRT & FX --- */
        /* Global scanlines for retro monitor illusion */
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;
            background: 
                repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.3) 4px, rgba(0, 0, 0, 0.3) 6px),
                radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
            mix-blend-mode: multiply;
        }

        /* --- LAYOUT --- */
        #game-container { 
            position: relative; width: 100%; height: 100%; z-index: 10; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; /* Align top */
            padding-top: 8vh;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* --- TYPOGRAPHY & TITLE --- */
        .title-block {
            position: relative; text-align: center; z-index: 20;
            pointer-events: none; 
            margin-bottom: 2rem;
            /* Animation to make it feel alive */
            animation: floatTitle 4s ease-in-out infinite;
        }

        h1.main-title {
            font-size: 5rem; line-height: 0.9; margin: 0; color: #fff; text-transform: uppercase;
            letter-spacing: -4px;
            /* Pixelated Shadow Stack - No Blur */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            /* Glitch Animation */
            animation: glitch-skew 4s infinite linear alternate-reverse;
        }

        h1.main-title .subtitle {
            display: block; font-size: 1.4rem; color: var(--neon-yellow);
            text-shadow: 2px 2px 0px #000; letter-spacing: 6px; margin-top: 15px;
            font-weight: bold; 
            /* Diegetic UI box style */
            border: 2px solid var(--neon-yellow); 
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.8); /* Dark fill for contrast */
            box-shadow: 4px 4px 0px var(--neon-purple);
        }

        /* --- MENU & BUTTONS --- */
        .menu-anchor {
            position: relative; z-index: 30; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 2rem; 
            pointer-events: auto;
            margin-top: 2rem;
        }

        /* START Button: Diegetic "Data Pad" style */
        .btn-start {
            background: #000; color: var(--neon-cyan);
            font-family: var(--font-pixel); font-size: 2rem; font-weight: bold;
            text-transform: uppercase; padding: 15px 70px; 
            border: 4px solid var(--neon-cyan);
            cursor: pointer; position: relative; outline: none; letter-spacing: 2px;
            /* Hard shadow, no blur */
            box-shadow: 6px 6px 0px #000, inset 2px 2px 0px rgba(0, 240, 255, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            animation: pulseBtn 2s infinite;
        }

        .btn-start:hover {
            background: var(--neon-cyan); color: #000;
            box-shadow: 8px 8px 0px #fff, inset 0px 0px 0px #000; 
            transform: translate(-2px, -2px);
        }

        .btn-start:active {
            transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000;
        }

        /* Secondary Menu: Scaled up and grouped */
        .secondary-menu { 
            display: flex; gap: 2rem; 
            /* Ensure they don't overlap the highway hit line visually */
            margin-top: 1rem;
        }
        
        .link-pixel {
            color: var(--neon-yellow); text-decoration: none; font-size: 1.2rem; /* Scaled up */
            text-transform: uppercase; font-weight: bold; padding: 10px 30px;
            border: 2px solid var(--neon-yellow); background: #000;
            box-shadow: 4px 4px 0px #000; transition: all 0.1s; cursor: pointer;
        }

        .link-pixel:hover { 
            background: var(--neon-yellow); color: #000; 
            box-shadow: 6px 6px 0px #fff; transform: translate(-2px, -2px); 
        }

        /* --- ANIMATIONS --- */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(0deg); }
            21% { transform: skew(-10deg); opacity: 0.8; filter: hue-rotate(90deg); }
            22% { transform: skew(10deg); opacity: 0.8; }
            23% { transform: skew(0deg); opacity: 1; filter: none; }
            100% { transform: skew(0deg); }
        }

        @keyframes pulseBtn {
            0% { box-shadow: 6px 6px 0px #000, 0 0 10px var(--neon-cyan); }
            50% { box-shadow: 6px 6px 0px #000, 0 0 25px var(--neon-cyan); }
            100% { box-shadow: 6px 6px 0px #000, 0 0 10px var(--neon-cyan); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1.main-title { font-size: 3rem; letter-spacing: -2px; }
            h1.main-title .subtitle { font-size: 0.9rem; letter-spacing: 3px; }
            .btn-start { font-size: 1.5rem; padding: 12px 40px; }
            .secondary-menu { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="game-container">
        <div class="title-block">
            <h1 class="main-title">Pixel<br>Dance</h1>
            <h1 class="main-title" style="font-size: inherit; margin-top: 0; text-shadow: none; animation: none;">
                <span class="subtitle">RHYTHM PROTOCOL</span>
            </h1>
        </div>

        <div class="menu-anchor">
            <button class="btn-start" onclick="startGame()">Start Game</button>
            <div class="secondary-menu">
                <a class="link-pixel" onclick="alert('Options')">Options</a>
                <a class="link-pixel" onclick="alert('Credits')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // Pixel Art Mode

        let width, height;
        let time = 0;
        
        // Configuration
        const config = {
            horizonY: 0.35, // Horizon lower to show more sky/title, but grid dominates bottom
            fov: 350,
            roadWidth: 2000, // Adjusted width
            segmentLength: 100,
            drawDistance: 30,
            hitLineZ: 120, // Hit line pushed back slightly
            gridSpeed: 6,  // Faster speed for energy
            laneColors: ['#ff00aa', '#00f0ff', '#00f0ff', '#ff00aa'] // Pink, Cyan, Cyan, Pink
        };

        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3D Projection ---
        function project(x, y, z) {
            const scale = config.fov / (config.fov + z);
            const x2d = (x * scale) + (width / 2);
            const y2d = (y * scale) + (height * config.horizonY);
            return { x: x2d, y: y2d, scale: scale };
        }

        // --- Draw Functions ---

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height * config.horizonY);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(1, '#180033');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Pixel Stars
            ctx.fillStyle = '#fff';
            for(let i=0; i<50; i++) {
                const sx = ((Math.sin(i * 123.45) * 0.5 + 0.5) * width);
                const sy = ((Math.cos(i * 67.89) * 0.5 + 0.5) * (height * config.horizonY));
                // Twinkle
                if (Math.sin(time * 0.05 + i) > 0.5) {
                    ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 2);
                }
            }

            // 3. Retro Sun (Blocky)
            const sunR = Math.min(width, height) * 0.15;
            const sunY = (height * config.horizonY) - (sunR * 0.1); 
            
            // Sun Glow (Rectangular)
            ctx.fillStyle = 'rgba(255, 0, 170, 0.2)';
            ctx.fillRect(width/2 - sunR*2, sunY - sunR*2, sunR*4, sunR*4);

            // Sun Body
            ctx.fillStyle = '#ffea00';
            ctx.beginPath();
            ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
            ctx.fill();

            // Sun Stripes (Synthwave aesthetic)
            ctx.fillStyle = '#180033'; // Matches bottom sky
            for(let i=0; i<6; i++) {
                const h = 4 + (i * 3); 
                const y = sunY + (i * (sunR/3));
                if (y + h < sunY + sunR) {
                     ctx.fillRect(width/2 - sunR, y, sunR*2, h);
                }
            }
        }

        function drawGrid() {
            const centerX = width / 2;
            const horizonY = height * config.horizonY;
            
            // 1. Vertical Lanes (Neon Rails)
            // 4 Lanes = 5 Lines (Indices 0 to 4)
            ctx.lineCap = 'square';

            for (let i = 0; i <= 4; i++) {
                const xBottom = (centerX - config.roadWidth/2) + (i * (config.roadWidth/4));
                
                ctx.beginPath();
                // Use alternating neon colors for lane markers
                ctx.strokeStyle = (i===0 || i===4) ? '#fff' : config.laneColors[i-1] || '#bc13fe';
                ctx.lineWidth = (i===0 || i===4) ? 4 : 2; // Thicker outer rails
                
                ctx.moveTo(centerX, horizonY); // Vanishing point
                ctx.lineTo(xBottom, height);
                ctx.stroke();
            }

            // 2. Horizontal Grid Lines (Moving)
            const numLines = config.drawDistance;
            
            for(let i=0; i<numLines; i++) {
                const z = ((time * config.gridSpeed * 10 + i * (1200 / numLines)) % 1200);
                if (z < 10) continue; 

                const p = project(-config.roadWidth/2, 0, z); 
                const pRight = project(config.roadWidth/2, 0, z); 
                
                // Fade out near horizon
                const alpha = Math.min(1, (1200 - z) / 600) * 0.6;
                
                ctx.beginPath();
                ctx.strokeStyle = '#bc13fe'; // Purple grid
                ctx.globalAlpha = alpha;
                ctx.lineWidth = Math.max(1, 2 * p.scale);
                
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(pRight.x, pRight.y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
        }

        function spawnNote() {
            if (Math.random() < 0.04) {
                const lane = Math.floor(Math.random() * 4);
                const tooClose = notes.some(n => n.lane === lane && n.z > 1000);
                if (!tooClose) {
                    notes.push({ lane: lane, z: 1200, active: true });
                }
            }
        }

        function drawNotes() {
            const centerX = width / 2;
            const horizonY = height * config.horizonY;
            
            // Sort by Z (far to near)
            notes.sort((a, b) => b.z - a.z);

            for (let i = notes.length - 1; i >= 0; i--) {
                const n = notes[i];
                n.z -= (config.gridSpeed * 15); 

                if (n.z < 10) {
                    notes.splice(i, 1);
                    continue;
                }

                const scale = config.fov / (config.fov + n.z);
                const roadW = config.roadWidth * scale;
                const laneW = roadW / 4;
                const laneStartX = (centerX - roadW/2);
                
                const noteX = laneStartX + (n.lane * laneW) + (laneW/2);
                const noteY = horizonY; 
                
                const w = laneW * 0.6;
                const blockH = 50 * scale; // Taller blocky notes
                
                ctx.fillStyle = config.laneColors[n.lane];
                
                // Glow only when close
                if (n.z < 400) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = config.laneColors[n.lane];
                }

                ctx.fillRect(noteX - w/2, noteY - blockH, w, blockH);
                
                // Inner detail
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(noteX - w/4, noteY - blockH + (blockH*0.2), w/2, blockH*0.3);
                
                ctx.shadowBlur = 0;
            }
        }

        function drawHitLine() {
            const hitZ = config.hitLineZ;
            const pLeft = project(-config.roadWidth/2, 0, hitZ);
            const pRight = project(config.roadWidth/2, 0, hitZ);
            
            // Hit Zone Bar (Translucent)
            const barH = 15;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(pLeft.x, pLeft.y - barH, pRight.x - pLeft.x, barH * 2);
            
            // Hit Line (Solid)
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(pLeft.x, pLeft.y);
            ctx.lineTo(pRight.x, pRight.y);
            ctx.stroke();

            // Lane Receivers (The "Target" squares)
            const roadW = config.roadWidth * (config.fov / (config.fov + hitZ));
            const laneW = roadW / 4;
            const startX = (width/2) - (roadW/2);

            for(let i=0; i<4; i++) {
                const rx = startX + (i * laneW);
                // Draw a "well" or target box
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(rx + 5, pLeft.y - 15, laneW - 10, 30);
                
                // Colored Border for lane
                ctx.strokeStyle = config.laneColors[i];
                ctx.lineWidth = 2;
                ctx.strokeRect(rx + 5, pLeft.y - 15, laneW - 10, 30);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawBackground();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            time++;
            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerText;
            btn.innerText = 'LOADING...';
            btn.style.backgroundColor = '#fff';
            btn.style.color = '#000';
            
            // Simple flash effect
            setTimeout(() => {
                document.body.style.backgroundColor = '#fff';
                setTimeout(() => {
                    document.body.style.backgroundColor = '';
                    alert('GAME STARTED');
                    btn.innerText = originalText;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 100);
            }, 500);
        }

        animate();

    </script>
</body>
</html>
