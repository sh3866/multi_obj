<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-sky-top: #050014;
            --bg-sky-bot: #180033;
            --neon-pink: #ff00aa;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffea00;
            --neon-purple: #bc13fe;
            --grid-color: rgba(188, 19, 254, 0.5);
            --hit-line: #ffffff;
            --font-pixel: "Courier New", Courier, monospace;
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; user-select: none; -webkit-font-smoothing: none; -moz-osx-font-smoothing: unset; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-sky-top); overflow: hidden; font-family: var(--font-pixel); color: white; }

        /* --- CRT & FX --- */
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;
            background: 
                repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.4) 4px),
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
        }

        /* --- LAYOUT --- */
        #game-container { position: relative; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* --- TYPOGRAPHY & TITLE --- */
        .title-block {
            position: relative; margin-top: 10vh; text-align: center; z-index: 20;
            pointer-events: none; animation: floatTitle 4s ease-in-out infinite;
        }

        h1.main-title {
            font-size: 6rem; line-height: 0.9; margin: 0; color: #fff; text-transform: uppercase;
            letter-spacing: -5px;
            /* Pixelated Shadow Stack */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
        }

        h1.main-title .subtitle {
            display: block; font-size: 1.2rem; color: var(--neon-yellow);
            text-shadow: 2px 2px 0px #000; letter-spacing: 8px; margin-top: 10px;
            font-weight: bold; border: 2px solid var(--neon-yellow); padding: 5px 10px;
            background: rgba(0,0,0,0.5);
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) skewX(0deg); }
            50% { transform: translateY(-10px) skewX(0deg); }
            /* Glitch Skew */
            92% { transform: translateY(0) skewX(0deg); }
            93% { transform: translateY(2px) skewX(-5deg); opacity: 0.8; }
            94% { transform: translateY(-2px) skewX(5deg); opacity: 0.8; }
            95% { transform: translateY(0) skewX(0deg); opacity: 1; }
        }

        /* --- MENU & BUTTONS --- */
        .menu-anchor {
            position: relative; z-index: 30; width: 100%;
            padding-bottom: 15vh; /* Push above the hit line */
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem; pointer-events: auto;
        }

        /* START Button: Hard Pixel Block */
        .btn-start {
            background: #111; color: var(--neon-cyan);
            font-family: var(--font-pixel); font-size: 2rem; font-weight: bold;
            text-transform: uppercase; padding: 15px 60px; border: 4px solid var(--neon-cyan);
            cursor: pointer; position: relative; outline: none; letter-spacing: 2px;
            /* Hard shadow, no blur */
            box-shadow: 6px 6px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
            animation: pulseBtn 1s infinite alternate;
        }

        .btn-start:hover {
            background: var(--neon-cyan); color: #000;
            box-shadow: 8px 8px 0px #fff; transform: translate(-2px, -2px);
        }

        .btn-start:active {
            transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 6px 6px 0px #000, 0 0 10px var(--neon-cyan); }
            100% { box-shadow: 6px 6px 0px #000, 0 0 20px var(--neon-cyan); }
        }

        /* Secondary Menu */
        .secondary-menu { display: flex; gap: 2rem; }
        
        .link-pixel {
            color: var(--neon-yellow); text-decoration: none; font-size: 1rem;
            text-transform: uppercase; font-weight: bold; padding: 10px 20px;
            border: 2px solid var(--neon-yellow); background: #000;
            box-shadow: 4px 4px 0px #000; transition: all 0.1s; cursor: pointer;
        }

        .link-pixel:hover { background: var(--neon-yellow); color: #000; box-shadow: 6px 6px 0px #fff; transform: translate(-2px, -2px); }

        /* Responsive */
        @media (max-width: 768px) {
            h1.main-title { font-size: 3.5rem; letter-spacing: -2px; }
            h1.main-title .subtitle { font-size: 0.8rem; letter-spacing: 4px; }
            .btn-start { font-size: 1.5rem; padding: 12px 40px; }
            .menu-anchor { padding-bottom: 10vh; }
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="game-container">
        <div class="title-block">
            <h1 class="main-title">Pixel<br>Dance</h1>
            <h1 class="main-title" style="font-size: inherit; margin-top: 0;"><span class="subtitle">RHYTHM PROTOCOL</span></h1>
        </div>

        <div class="menu-anchor">
            <button class="btn-start" onclick="startGame()">Start Game</button>
            <div class="secondary-menu">
                <a class="link-pixel" onclick="alert('Options')">Options</a>
                <a class="link-pixel" onclick="alert('Credits')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // Pixel Art Mode

        let width, height;
        let time = 0;
        
        // Configuration
        const config = {
            horizonY: 0.40, // Horizon pushed up to allow Title room, but Highway dominates bottom
            fov: 400,
            roadWidth: 2400, // Wider road
            segmentLength: 100,
            drawDistance: 30,
            hitLineZ: 80, // Hit line is very close to camera
            gridSpeed: 4 // Speed of scrolling grid
        };

        // Colors
        const COLORS = {
            bgTop: '#050014',
            bgBottom: '#180033',
            grid: '#bc13fe',
            sun: '#ffea00',
            sunStripe: '#220044',
            lanes: ['#ff00aa', '#00f0ff', '#00f0ff', '#ff00aa'],
            hitLine: '#ffffff'
        };

        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3D Projection ---
        // Projects world coordinates (x,y,z) to screen (x,y)
        // World origin (0,0) is at the horizon center.
        // +Y goes down (screen space), +Z goes into screen (depth).
        function project(x, y, z) {
            const scale = config.fov / (config.fov + z);
            const x2d = (x * scale) + (width / 2);
            const y2d = (y * scale) + (height * config.horizonY);
            return { x: x2d, y: y2d, scale: scale };
        }

        // --- Draw Functions ---

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height * config.horizonY);
            grad.addColorStop(0, COLORS.bgTop);
            grad.addColorStop(1, COLORS.bgBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Pixel Stars
            ctx.fillStyle = '#fff';
            for(let i=0; i<60; i++) {
                // Deterministic pseudo-random positions
                const sx = ((Math.sin(i * 123.45) * 0.5 + 0.5) * width);
                const sy = ((Math.cos(i * 67.89) * 0.5 + 0.5) * (height * config.horizonY));
                // Twinkle
                if (Math.sin(time * 0.05 + i) > 0.5) {
                    ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 2);
                }
            }

            // 3. Retro Sun (Blocky)
            const sunR = Math.min(width, height) * 0.18;
            const sunY = (height * config.horizonY) - (sunR * 0.2); // Sun sits on horizon
            
            // Sun Glow (Rectangular to match pixel vibe)
            ctx.fillStyle = 'rgba(255, 0, 170, 0.3)';
            ctx.fillRect(width/2 - sunR*1.5, sunY - sunR*1.5, sunR*3, sunR*3);

            // Sun Body
            ctx.fillStyle = COLORS.sun;
            ctx.beginPath();
            ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
            ctx.fill();

            // Sun Stripes (Synthwave aesthetic)
            ctx.fillStyle = COLORS.sunStripe;
            for(let i=0; i<6; i++) {
                const h = 4 + (i * 3); // Increasing thickness
                const y = sunY + (i * (sunR/3));
                // Draw stripe only inside circle (approximated by clip or just rect if we want blocky)
                // Let's use rect for "Pixel" feel
                if (y + h < sunY + sunR) {
                     ctx.fillRect(width/2 - sunR, y, sunR*2, h);
                }
            }
        }

        function drawGrid() {
            const centerX = width / 2;
            const horizonY = height * config.horizonY;
            
            // 1. Vertical Lanes (Perspective Lines)
            // 4 Lanes = 5 Lines (Indices 0 to 4)
            ctx.lineWidth = 3;
            ctx.lineCap = 'square';

            for (let i = 0; i <= 4; i++) {
                // X at bottom of screen
                const xBottom = (centerX - config.roadWidth/2) + (i * (config.roadWidth/4));
                
                ctx.beginPath();
                ctx.strokeStyle = (i===0 || i===4) ? '#fff' : COLORS.grid; // Outer lines bright
                ctx.globalAlpha = (i===0 || i===4) ? 0.8 : 0.4;
                
                ctx.moveTo(centerX, horizonY); // Vanishing point
                ctx.lineTo(xBottom, height);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;

            // 2. Horizontal Grid Lines (Moving)
            const numLines = config.drawDistance;
            
            for(let i=0; i<numLines; i++) {
                // Z position moves from far (1000) to near (0)
                // Use modulo for infinite scroll
                const z = ((time * config.gridSpeed * 10 + i * (1200 / numLines)) % 1200);
                
                if (z < 10) continue; // Clipping plane

                const p = project(-config.roadWidth/2, 0, z); // Left edge of road at depth z
                const pRight = project(config.roadWidth/2, 0, z); // Right edge

                // Fade out near horizon
                const alpha = Math.min(1, (1200 - z) / 600);
                
                ctx.beginPath();
                ctx.strokeStyle = COLORS.grid;
                ctx.globalAlpha = alpha * 0.6;
                ctx.lineWidth = Math.max(1, 2 * p.scale);
                
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(pRight.x, pRight.y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
        }

        function spawnNote() {
            // Spawn rate
            if (Math.random() < 0.04) {
                const lane = Math.floor(Math.random() * 4);
                // Prevent overlap
                const tooClose = notes.some(n => n.lane === lane && n.z > 1000);
                if (!tooClose) {
                    notes.push({ lane: lane, z: 1200, active: true });
                }
            }
        }

        function drawNotes() {
            const centerX = width / 2;
            const horizonY = height * config.horizonY;
            
            // Sort by Z (far to near)
            notes.sort((a, b) => b.z - a.z);

            for (let i = notes.length - 1; i >= 0; i--) {
                const n = notes[i];
                n.z -= (config.gridSpeed * 15); // Note speed

                if (n.z < 10) {
                    notes.splice(i, 1);
                    continue;
                }

                // Calculate position
                // Road width at this Z
                const scale = config.fov / (config.fov + n.z);
                const roadW = config.roadWidth * scale;
                const laneW = roadW / 4;
                const laneStartX = (centerX - roadW/2);
                
                const noteX = laneStartX + (n.lane * laneW) + (laneW/2);
                const noteY = horizonY; // Floor is y=0 in world space
                
                // Draw Note
                const w = laneW * 0.6;
                const h = laneW * 0.3; // Blocky height
                
                ctx.fillStyle = COLORS.lanes[n.lane];
                
                // Draw slightly above the grid line to look like it's sitting on it
                // Or sticking up. Let's make it a tall block.
                const blockH = 40 * scale;
                
                // Glow
                if (n.z < 400) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = COLORS.lanes[n.lane];
                }

                ctx.fillRect(noteX - w/2, noteY - blockH, w, blockH);
                
                // Inner "Pixel" detail
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(noteX - w/4, noteY - blockH + (blockH*0.2), w/2, blockH*0.3);
                
                ctx.shadowBlur = 0;
            }
        }

        function drawHitLine() {
            // The hit line is a static visual element at a specific Z
            const hitZ = config.hitLineZ;
            const pLeft = project(-config.roadWidth/2, 0, hitZ);
            const pRight = project(config.roadWidth/2, 0, hitZ);
            
            // Draw glowing bar
            const barH = 4;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(pLeft.x, pLeft.y - barH, pRight.x - pLeft.x, barH * 2);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(pLeft.x, pLeft.y - barH, pRight.x - pLeft.x, barH * 2);

            // Draw Receivers (Lanes)
            const roadW = config.roadWidth * (config.fov / (config.fov + hitZ));
            const laneW = roadW / 4;
            const startX = (width/2) - (roadW/2);

            for(let i=0; i<4; i++) {
                const rx = startX + (i * laneW);
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(rx, pLeft.y - 10, laneW, 20);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(rx, pLeft.y - 10, laneW, 20);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawBackground();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            time++;
            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerText = 'LOADING...';
            btn.style.backgroundColor = '#fff';
            btn.style.color = '#000';
            
            // Simple flash effect
            setTimeout(() => {
                document.body.style.backgroundColor = '#fff';
                setTimeout(() => {
                    document.body.style.backgroundColor = '';
                    alert('GAME STARTED');
                    btn.innerText = 'START GAME';
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 100);
            }, 500);
        }

        animate();

    </script>
</body>
</html>
