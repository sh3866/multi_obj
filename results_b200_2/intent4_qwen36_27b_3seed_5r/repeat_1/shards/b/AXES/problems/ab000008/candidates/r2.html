<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050010;
            --neon-pink: #ff00aa;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffea00;
            --neon-purple: #bc13fe;
            --grid-line: rgba(188, 19, 254, 0.4);
            --font-main: "Courier New", Courier, monospace; /* Fallback for strict pixel feel */
        }

        /* --- Global Reset & Pixel Rendering --- */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Critical for pixel look */
            -moz-osx-font-smoothing: unset;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-main);
            color: white;
        }

        /* --- CRT & Visual FX Layers --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            background: 
                /* Scanlines */
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 2px,
                    rgba(0, 0, 0, 0.5) 4px
                ),
                /* Vignette */
                radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
        }

        .chromatic-aberration {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 95;
            mix-blend-mode: hard-light;
            opacity: 0.15;
            background: linear-gradient(110deg, var(--neon-cyan) 0%, transparent 40%, var(--neon-pink) 100%);
            animation: glitchAnim 5s infinite linear;
        }

        @keyframes glitchAnim {
            0% { transform: translate(0,0) skewX(0deg); }
            90% { transform: translate(0,0) skewX(0deg); }
            91% { transform: translate(-5px, 2px) skewX(2deg); opacity: 0.3; }
            92% { transform: translate(5px, -2px) skewX(-2deg); opacity: 0.1; }
            93% { transform: translate(0,0) skewX(0deg); opacity: 0.15; }
            100% { transform: translate(0,0) skewX(0deg); }
        }

        /* --- Layout --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Distribute Title (top) and Menu (bottom) */
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- Typography & Title --- */
        .title-block {
            position: relative;
            margin-top: 15vh; /* Push title into the sky area */
            text-align: center;
            z-index: 20;
            pointer-events: none;
            animation: floatTitle 6s ease-in-out infinite;
        }

        h1.main-title {
            font-size: 5rem;
            line-height: 0.9;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            /* Heavy pixel shadow */
            text-shadow: 
                5px 5px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: -4px;
        }

        h1.main-title span {
            display: block;
            font-size: 0.6em;
            color: var(--neon-yellow);
            text-shadow: 4px 4px 0px var(--neon-purple);
            letter-spacing: 10px;
            margin-top: 10px;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- Menu & Buttons --- */
        .menu-anchor {
            position: relative;
            z-index: 30;
            width: 100%;
            /* Anchor the menu to the bottom of the screen where the grid starts */
            padding-bottom: 5vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            pointer-events: auto;
        }

        /* START Button: Retro 3D Bevel Style */
        .btn-start {
            background: #222;
            color: var(--neon-cyan);
            font-family: var(--font-main);
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 12px 48px;
            border: 4px solid var(--neon-cyan);
            cursor: pointer;
            position: relative;
            /* Pixelated 3D effect using box-shadow */
            box-shadow: 
                inset 4px 4px 0px rgba(0, 240, 255, 0.2),
                inset -4px -4px 0px rgba(0,0,0,0.5),
                4px 4px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
            letter-spacing: 2px;
        }

        .btn-start:hover {
            background: #111;
            color: #fff;
            border-color: #fff;
            box-shadow: 
                inset 4px 4px 0px rgba(255, 255, 255, 0.2),
                inset -4px -4px 0px rgba(0,0,0,0.5),
                6px 6px 0px #000;
            transform: translate(-2px, -2px);
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 
                inset 2px 2px 0px rgba(0,0,0,0.8),
                0px 0px 0px #000;
        }

        /* Secondary Menu: High Contrast */
        .secondary-menu {
            display: flex;
            gap: 2rem;
        }

        .link-pixel {
            color: var(--neon-yellow);
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            font-weight: bold;
            padding: 8px 16px;
            border: 2px solid var(--neon-yellow);
            background: rgba(0,0,0,0.6);
            box-shadow: 3px 3px 0px #000;
            transition: all 0.2s;
            cursor: pointer;
        }

        .link-pixel:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 5px 5px 0px #000;
            transform: translate(-2px, -2px);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1.main-title { font-size: 3rem; letter-spacing: -2px; }
            h1.main-title span { font-size: 0.5em; letter-spacing: 4px; }
            .btn-start { font-size: 1.2rem; padding: 10px 30px; }
        }
    </style>
</head>
<body>

    <!-- Visual FX -->
    <div class="crt-overlay"></div>
    <div class="chromatic-aberration"></div>

    <!-- 3D Scene Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="game-container">
        
        <!-- Top: Title -->
        <div class="title-block">
            <h1 class="main-title">Pixel<br>Dance</h1>
            <h1 class="main-title" style="font-size: inherit; margin-top: 0;"><span>RHYTHM PROTOCOL</span></h1>
        </div>

        <!-- Bottom: Menu Anchored to Grid Horizon -->
        <div class="menu-anchor">
            <button class="btn-start" onclick="startGame()">Start Game</button>
            
            <div class="secondary-menu">
                <a class="link-pixel" onclick="alert('Options Menu')">Options</a>
                <a class="link-pixel" onclick="alert('Credits')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Disable smoothing for pixel art rendering
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;
        
        // Colors
        const COLORS = {
            bgTop: '#000000',
            bgBottom: '#1a0033',
            grid: 'rgba(188, 19, 254, 0.3)',
            gridBright: '#bc13fe',
            sun: '#ffea00',
            sunStripe: '#220033',
            lane1: '#ff00aa',
            lane2: '#00f0ff',
            lane3: '#00f0ff',
            lane4: '#ff00aa',
            hitLine: '#ffffff'
        };

        const laneColors = [COLORS.lane1, COLORS.lane2, COLORS.lane3, COLORS.lane4];

        // Configuration
        const config = {
            horizonY: 0.45, // Horizon slightly lower to give room for title
            fov: 600,
            roadWidth: 2000, 
            segmentLength: 80,
            drawDistance: 40, // Number of grid lines
            hitLineZ: 150 // Where the hit line is in 3D space
        };

        // Notes System
        const notes = [];
        const noteSpeed = 8; // Pixels per frame

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- 3D Math Helpers ---

        // Project 3D world coordinate to 2D screen coordinate
        // World origin (0,0,0) is at the center of the screen at the horizon
        function project(x, y, z) {
            const scale = config.fov / (config.fov + z);
            const x2d = (x * scale) + (width / 2);
            // Y calculation adjusted so 0 is at the horizon
            const y2d = (y * scale) + (height * config.horizonY); 
            return { x: x2d, y: y2d, scale: scale };
        }

        // --- Rendering Functions ---

        function drawBackground() {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height * config.horizonY);
            grad.addColorStop(0, COLORS.bgTop);
            grad.addColorStop(1, COLORS.bgBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Stars
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<80; i++) {
                // Deterministic random based on index
                const sx = ((Math.sin(i * 132.1) * 0.5 + 0.5) * width);
                const sy = ((Math.cos(i * 43.2) * 0.5 + 0.5) * (height * config.horizonY));
                // Twinkle
                const size = (Math.sin(time * 0.05 + i) > 0.8) ? 2 : 1;
                if (size > 1) ctx.fillRect(sx, sy, size, size);
            }

            // Retro Sun (Geometric / Digital Eye style)
            const sunY = (height * config.horizonY) - (Math.min(width, height) * 0.05);
            const sunR = Math.min(width, height) * 0.15;
            
            // Sun Glow
            const sunGrad = ctx.createRadialGradient(width/2, sunY, sunR * 0.8, width/2, sunY, sunR * 2.5);
            sunGrad.addColorStop(0, 'rgba(255, 0, 170, 0.4)');
            sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.fillStyle = COLORS.sun;
            ctx.beginPath();
            ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
            ctx.fill();

            // Sun Stripes (Hard Edges)
            ctx.fillStyle = COLORS.sunStripe;
            for(let i = 0; i < 8; i++) {
                const y = sunY + (i * (sunR/4));
                // Thickness increases as we go down
                const h = 2 + (i * 2.5); 
                
                ctx.save();
                ctx.beginPath();
                ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
                ctx.clip();
                ctx.fillRect(width/2 - sunR, y, sunR * 2, h);
                ctx.restore();
            }
        }

        function drawGridAndRoad() {
            const centerX = width / 2;
            const roadBottomWidth = Math.min(width * 1.2, 1200); // Wider road for impact
            
            // 1. Draw Vertical Lanes (Perspective Lines)
            // 4 Lanes = 5 Lines (0 to 4)
            ctx.lineWidth = Math.max(2, width / 600); 
            ctx.lineCap = 'square';

            for (let i = 0; i <= 4; i++) {
                // Calculate X positions at bottom
                const xBottom = (centerX - roadBottomWidth/2) + (i * (roadBottomWidth/4));
                // At horizon, they meet at center X
                const xHorizon = centerX;
                const yHorizon = height * config.horizonY;
                const yBottom = height;

                ctx.beginPath();
                // Outer lanes brighter
                ctx.strokeStyle = (i === 0 || i === 4) ? COLORS.gridBright : COLORS.grid;
                ctx.moveTo(xHorizon, yHorizon);
                ctx.lineTo(xBottom, yBottom);
                ctx.stroke();
            }

            // 2. Draw Horizontal Moving Lines
            const numLines = config.drawDistance;
            
            for(let i = 0; i < numLines; i++) {
                // Calculate Z position based on time
                // We map 0..drawDistance to world Z units
                // The lines move from far Z to near Z
                const z = ((time * 20 + i * (1000/config.drawDistance)) % 1000);
                
                // Don't draw if too close to camera (clipping)
                if (z < 10) continue;

                // Project the Z plane
                const scale = config.fov / (config.fov + z);
                
                // Y position on screen (0 is horizon)
                // We map World Z to Screen Y. 
                // Actually, since we project a flat plane at y=0, screen Y is constant for a given Z.
                const yScreen = (0 * scale) + (height * config.horizonY);
                
                // Only draw if below horizon
                if (yScreen > height * config.horizonY && yScreen < height) {
                    // Calculate width at this Z
                    const zWidth = config.roadWidth * scale;
                    const xStart = centerX - (zWidth / 2);
                    
                    // Fade out at horizon
                    const alpha = Math.min(1, (1000 - z) / 500);
                    ctx.strokeStyle = `rgba(255, 0, 255, ${alpha * 0.3})`;
                    ctx.lineWidth = Math.max(1, 2 * scale);
                    
                    ctx.beginPath();
                    ctx.moveTo(xStart, yScreen);
                    ctx.lineTo(xStart + zWidth, yScreen);
                    ctx.stroke();
                }
            }
        }

        function spawnNote() {
            // Spawn logic
            if (Math.random() < 0.03) {
                const lane = Math.floor(Math.random() * 4);
                // Ensure we don't spawn on top of another note immediately (simple check)
                const tooClose = notes.some(n => n.lane === lane && n.z > 900);
                
                if (!tooClose) {
                    notes.push({
                        lane: lane,
                        z: 1000, // Start far away
                        active: true
                    });
                }
            }
        }

        function drawNotes() {
            const centerX = width / 2;
            const horizonY = height * config.horizonY;

            // Sort notes by Z (furthest first) to draw correctly
            notes.sort((a, b) => b.z - a.z);

            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                
                // Move note towards camera
                note.z -= noteSpeed;

                if (note.z < 10) {
                    note.active = false;
                }

                if (!note.active) {
                    notes.splice(i, 1);
                    continue;
                }

                // Project Note
                const scale = config.fov / (config.fov + note.z);
                const yScreen = (0 * scale) + horizonY;
                
                // Calculate X for this lane
                const currentRoadWidth = config.roadWidth * scale;
                const laneWidth = currentRoadWidth / 4;
                const laneXStart = centerX - (currentRoadWidth / 2);
                const noteX = laneXStart + (note.lane * laneWidth) + (laneWidth / 2);

                // Draw Note Block
                // Size scales with distance
                const blockSize = 60 * scale; 
                const blockHeight = 30 * scale;

                // Don't draw if behind horizon
                if (yScreen > horizonY) {
                    ctx.fillStyle = laneColors[note.lane];
                    
                    // Glow effect (expensive, but good for foreground)
                    if (note.z < 400) {
                        ctx.shadowBlur = 15 * scale;
                        ctx.shadowColor = laneColors[note.lane];
                    } else {
                        ctx.shadowBlur = 0;
                    }
                    
                    // Draw centered block
                    ctx.fillRect(noteX - blockSize/2, yScreen - blockHeight, blockSize, blockHeight);
                    
                    // Inner highlight for 3D feel
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.fillRect(noteX - blockSize/4, yScreen - blockHeight + (blockHeight*0.2), blockSize/2, blockHeight*0.3);
                    
                    ctx.shadowBlur = 0;
                }
            }
        }

        function drawHitLine() {
            // The hit line is at a fixed Z near the camera
            const hitZ = config.hitLineZ; 
            const scale = config.fov / (config.fov + hitZ);
            const yScreen = (0 * scale) + (height * config.horizonY);
            
            const currentRoadWidth = config.roadWidth * scale;
            const centerX = width / 2;

            // Draw a glowing bar
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(centerX - currentRoadWidth/2, yScreen - 5, currentRoadWidth, 10);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(centerX - currentRoadWidth/2, yScreen - 5, currentRoadWidth, 10);
            
            // Draw "Hit" markers (receivers)
            const laneWidth = currentRoadWidth / 4;
            const laneXStart = centerX - (currentRoadWidth / 2);
            
            for(let i=0; i<4; i++) {
                const cx = laneXStart + (i * laneWidth) + (laneWidth/2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(cx - (laneWidth/3), yScreen - 10, (laneWidth/1.5), 20);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            drawGridAndRoad();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            time++;
            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerText;
            
            // Visual feedback on button
            btn.innerText = 'INITIALIZING...';
            btn.style.borderColor = '#fff';
            
            // Simulate loading
            setTimeout(() => {
                // Flash screen
                const flash = document.createElement('div');
                flash.style.position = 'fixed';
                flash.style.top = '0';
                flash.style.left = '0';
                flash.style.width = '100%';
                flash.style.height = '100%';
                flash.style.background = '#fff';
                flash.style.zIndex = '999';
                document.body.appendChild(flash);
                
                setTimeout(() => {
                    flash.style.transition = 'opacity 1s';
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 1000);
                    
                    // Reset button
                    btn.innerText = originalText;
                    btn.style.borderColor = 'var(--neon-cyan)';
                    alert('Game Started!');
                }, 100);
            }, 600);
        }

        animate();

    </script>
</body>
</html>
