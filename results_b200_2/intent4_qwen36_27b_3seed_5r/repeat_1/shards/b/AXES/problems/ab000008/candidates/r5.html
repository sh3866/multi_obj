<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance - Rhythm Protocol</title>
    <style>
        :root {
            --bg-sky-top: #050014;
            --bg-sky-bot: #120024;
            --neon-pink: #ff00aa;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffea00;
            --neon-purple: #bc13fe;
            --grid-color: rgba(188, 19, 254, 0.3);
            --hit-line: #ffffff;
            /* System pixel font fallback stack */
            --font-pixel: "Courier New", Courier, monospace; 
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; user-select: none; -webkit-font-smoothing: none; -moz-osx-font-smoothing: unset; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-sky-top); overflow: hidden; font-family: var(--font-pixel); color: white; }

        /* --- CRT & FX --- */
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;
            background: 
                repeating-linear-gradient(to bottom, rgba(18, 16, 16, 0) 0px, rgba(18, 16, 16, 0) 2px, rgba(0, 0, 0, 0.42) 3px, rgba(0, 0, 0, 0.42) 4px),
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            mix-blend-mode: multiply;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        /* --- LAYOUT --- */
        #game-container { 
            position: relative; width: 100%; height: 100%; z-index: 10; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; /* Center vertically for composition */
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* --- TYPOGRAPHY & TITLE --- */
        .title-block {
            position: absolute; top: 15%; width: 100%; text-align: center; z-index: 20;
            pointer-events: none; 
            filter: drop-shadow(0 0 10px var(--neon-pink));
            animation: breathe 3s ease-in-out infinite;
        }

        h1.main-title {
            font-size: clamp(3rem, 8vw, 6rem); line-height: 0.85; margin: 0; color: #fff; text-transform: uppercase;
            letter-spacing: -2px;
            /* Pixelated Shadow Stack */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
        }

        .subtitle {
            display: block; 
            font-size: clamp(1rem, 2.5vw, 1.5rem); 
            color: var(--neon-yellow);
            text-shadow: 2px 2px 0px #000; 
            letter-spacing: 8px; 
            margin-top: 10px;
            font-weight: bold; 
            margin-left: auto; margin-right: auto;
            padding: 5px 15px;
            background: #000; /* Solid opaque background for contrast */
            border: 2px solid var(--neon-yellow);
        }

        /* --- MENU & BUTTONS --- */
        /* Positioned lower to clear the title and hit line */
        .menu-anchor {
            position: absolute; bottom: 10%; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem; 
            pointer-events: auto;
            z-index: 30;
        }

        /* Unified Button System: Hollow/Stroked Style */
        .btn-pixel {
            background: rgba(0, 0, 0, 0.6);
            font-family: var(--font-pixel); 
            text-transform: uppercase; 
            cursor: pointer; 
            outline: none; 
            letter-spacing: 2px;
            transition: all 0.1s;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            backdrop-filter: blur(2px);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn-pixel:hover {
            background: var(--neon-cyan); 
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: scale(1.05);
        }

        .btn-pixel:active {
            transform: scale(0.95);
        }

        /* Primary Action: Larger, distinct color */
        .btn-start {
            font-size: 1.8rem; font-weight: bold;
            padding: 15px 60px; 
            border-width: 3px;
        }

        /* Secondary Actions: Grouped */
        .secondary-menu { 
            display: flex; gap: 2rem; 
        }
        
        .link-pixel {
            font-size: 1rem; 
            padding: 8px 25px;
            border-color: var(--neon-purple);
            color: var(--neon-purple);
        }

        .link-pixel:hover {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* --- ANIMATIONS --- */
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--neon-pink)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 20px var(--neon-pink)); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title-block { top: 10%; }
            .menu-anchor { bottom: 5%; }
            .btn-start { padding: 12px 40px; font-size: 1.5rem; }
            .secondary-menu { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="game-container">
        <div class="title-block">
            <h1 class="main-title">Pixel<br>Dance</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <div class="menu-anchor">
            <button class="btn-pixel btn-start" onclick="startGame()">START GAME</button>
            <div class="secondary-menu">
                <a class="btn-pixel link-pixel" onclick="alert('Options')">Options</a>
                <a class="btn-pixel link-pixel" onclick="alert('Credits')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // Pixel Art Mode

        let width, height;
        let time = 0;
        
        // Configuration
        const config = {
            horizonY: 0.35, // Horizon placed to allow title above, game below
            fov: 350,
            roadWidth: 2200, 
            segmentLength: 100,
            drawDistance: 40,
            hitLineZ: 150, // Hit line position relative to camera
            gridSpeed: 8,  
            laneColors: ['#ff00aa', '#00f0ff', '#00f0ff', '#ff00aa'] // Pink, Cyan, Cyan, Pink
        };

        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 3D Projection ---
        function project(x, y, z) {
            const scale = config.fov / (config.fov + z);
            const x2d = (x * scale) + (width / 2);
            const y2d = (y * scale) + (height * config.horizonY);
            return { x: x2d, y: y2d, scale: scale };
        }

        // --- Draw Functions ---

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height * config.horizonY);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(1, '#180033');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Pixel Stars
            ctx.fillStyle = '#fff';
            for(let i=0; i<60; i++) {
                const sx = ((Math.sin(i * 123.45) * 0.5 + 0.5) * width);
                const sy = ((Math.cos(i * 67.89) * 0.5 + 0.5) * (height * config.horizonY));
                if (Math.sin(time * 0.03 + i) > 0.6) {
                    ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 2);
                }
            }

            // 3. Retro Sun (Blocky) - Centered perfectly
            const sunR = Math.min(width, height) * 0.18;
            const sunY = (height * config.horizonY) - (sunR * 0.15); 
            
            // Sun Glow (Rectangular)
            ctx.fillStyle = 'rgba(255, 0, 170, 0.15)';
            ctx.fillRect(width/2 - sunR*2.5, sunY - sunR*2.5, sunR*5, sunR*5);

            // Sun Body
            ctx.fillStyle = '#ffea00';
            ctx.beginPath();
            ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
            ctx.fill();

            // Sun Stripes (Synthwave aesthetic)
            ctx.fillStyle = '#180033'; // Matches bottom sky
            for(let i=0; i<8; i++) {
                const h = 4 + (i * 4); 
                const y = sunY + (i * (sunR/4));
                if (y + h < sunY + sunR) {
                     ctx.fillRect(width/2 - sunR, y, sunR*2, h);
                }
            }
        }

        function drawGrid() {
            const centerX = width / 2;
            const horizonY = height * config.horizonY;
            
            // 1. Vertical Lanes (Neon Rails)
            // 4 Lanes = 5 Lines (Indices 0 to 4)
            ctx.lineCap = 'square';

            for (let i = 0; i <= 4; i++) {
                // Calculate X position at bottom based on lane index
                const xBottom = (centerX - config.roadWidth/2) + (i * (config.roadWidth/4));
                
                ctx.beginPath();
                // Lane colors: Outer rails are White, inner dividers match lane colors
                if (i===0 || i===4) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                } else {
                    ctx.strokeStyle = config.laneColors[i-1];
                    ctx.lineWidth = 2;
                }
                
                ctx.moveTo(centerX, horizonY); // Vanishing point (Center of Sun)
                ctx.lineTo(xBottom, height);
                ctx.stroke();
            }

            // 2. Horizontal Grid Lines (Moving)
            const numLines = config.drawDistance;
            
            for(let i=0; i<numLines; i++) {
                // Calculate Z based on time to create movement
                const z = ((time * config.gridSpeed * 10 + i * (1500 / numLines)) % 1500);
                if (z < 10) continue; 

                const p = project(-config.roadWidth/2, 0, z); 
                const pRight = project(config.roadWidth/2, 0, z); 
                
                // Fade out near horizon
                const alpha = Math.min(1, (1500 - z) / 800) * 0.6;
                
                ctx.beginPath();
                ctx.strokeStyle = '#bc13fe'; // Purple grid
                ctx.globalAlpha = alpha;
                ctx.lineWidth = Math.max(1, 3 * p.scale);
                
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(pRight.x, pRight.y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
        }

        function spawnNote() {
            // Spawn notes rhythmically
            if (time % 15 === 0 || Math.random() < 0.02) {
                const lane = Math.floor(Math.random() * 4);
                // Prevent overlapping in same lane
                const tooClose = notes.some(n => n.lane === lane && n.z > 1000);
                if (!tooClose) {
                    notes.push({ lane: lane, z: 1500, active: true });
                }
            }
        }

        function drawNotes() {
            const centerX = width / 2;
            const horizonY = height * config.horizonY;
            
            // Sort by Z (far to near) for proper depth rendering
            notes.sort((a, b) => b.z - a.z);

            for (let i = notes.length - 1; i >= 0; i--) {
                const n = notes[i];
                n.z -= (config.gridSpeed * 12); 

                if (n.z < 10) {
                    notes.splice(i, 1);
                    continue;
                }

                const scale = config.fov / (config.fov + n.z);
                const roadW = config.roadWidth * scale;
                const laneW = roadW / 4;
                const laneStartX = (centerX - roadW/2);
                
                const noteX = laneStartX + (n.lane * laneW) + (laneW/2);
                const noteY = horizonY; 
                
                const w = laneW * 0.6;
                const blockH = 60 * scale; // Taller blocky notes
                
                ctx.fillStyle = config.laneColors[n.lane];
                
                // Glow only when close
                if (n.z < 400) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = config.laneColors[n.lane];
                }

                ctx.fillRect(noteX - w/2, noteY - blockH, w, blockH);
                
                // Inner detail (Highlight)
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillRect(noteX - w/4, noteY - blockH + (blockH*0.2), w/2, blockH*0.3);
                
                ctx.shadowBlur = 0;
            }
        }

        function drawHitLine() {
            const hitZ = config.hitLineZ;
            const pLeft = project(-config.roadWidth/2, 0, hitZ);
            const pRight = project(config.roadWidth/2, 0, hitZ);
            
            // Hit Zone Bar (Translucent background)
            const barH = 15;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(pLeft.x, pLeft.y - barH, pRight.x - pLeft.x, barH * 2);
            
            // Hit Line (Solid, Glowing)
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.moveTo(pLeft.x, pLeft.y);
            ctx.lineTo(pRight.x, pRight.y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Lane Receivers (The "Target" squares)
            const roadW = config.roadWidth * (config.fov / (config.fov + hitZ));
            const laneW = roadW / 4;
            const startX = (width/2) - (roadW/2);

            for(let i=0; i<4; i++) {
                const rx = startX + (i * laneW);
                // Draw a "well" or target box
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(rx + 5, pLeft.y - 15, laneW - 10, 30);
                
                // Colored Border for lane
                ctx.strokeStyle = config.laneColors[i];
                ctx.lineWidth = 2;
                ctx.strokeRect(rx + 5, pLeft.y - 15, laneW - 10, 30);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawBackground();
            drawGrid();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            time++;
            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerText;
            btn.innerText = 'LOADING...';
            btn.style.backgroundColor = '#fff';
            btn.style.color = '#000';
            
            // Simple flash effect
            setTimeout(() => {
                document.body.style.backgroundColor = '#fff';
                setTimeout(() => {
                    document.body.style.backgroundColor = '';
                    alert('GAME STARTED');
                    btn.innerText = originalText;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 100);
            }, 500);
        }

        animate();

    </script>
</body>
</html>
