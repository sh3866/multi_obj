<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        /* Import a pixel font that is commonly available locally or fallback to monospace */
        @font-face {
            font-family: 'PixelFont';
            src: local('Press Start 2P'), local('PressStart2P-Regular'), local('Silkscreen'), local('Courier New');
        }

        :root {
            --bg-dark: #080014;
            --grid-color: #2a0e45;
            --neon-pink: #ff00aa;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffee00;
            --neon-purple: #bd00ff;
            --pixel-size: 4px; /* Base unit for crispness */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep fonts jagged */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: 'PixelFont', monospace;
            color: white;
        }

        /* --- CRT & Visual FX --- */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: 
                /* Scanlines */
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                /* Vignette */
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            background-size: 100% 4px, 100% 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .chromatic-aberration {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 90;
            mix-blend-mode: screen;
            opacity: 0.15;
            background: linear-gradient(45deg, var(--neon-cyan) 0%, transparent 40%, var(--neon-pink) 100%);
            animation: glitchAnim 3s infinite linear alternate-reverse;
        }

        @keyframes glitchAnim {
            0% { transform: translate(0,0); opacity: 0.1; }
            95% { transform: translate(0,0); opacity: 0.1; }
            96% { transform: translate(-2px, 1px); opacity: 0.3; }
            97% { transform: translate(2px, -1px); opacity: 0.3; }
            98% { transform: translate(-1px, 0); opacity: 0.1; }
            100% { transform: translate(0,0); opacity: 0.1; }
        }

        /* --- Layout --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Align top for better hierarchy */
            z-index: 10;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- Typography & UI --- */
        .ui-layer {
            position: relative;
            z-index: 20;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8vh; /* Space from top */
            pointer-events: none; /* Let canvas show through where empty */
        }

        .title-block {
            position: relative;
            margin-bottom: 2rem;
            text-align: center;
            pointer-events: auto;
            animation: floatTitle 4s ease-in-out infinite;
        }

        h1.main-title {
            font-size: 4.5rem;
            line-height: 1.1;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            /* Hard shadows for pixel feel, no blur */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                8px 8px 0px var(--neon-cyan);
            letter-spacing: -2px;
        }

        h2.sub-title {
            font-size: 1.2rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            display: inline-block;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) skewX(-5deg); }
            50% { transform: translateY(-8px) skewX(-5deg); }
        }

        /* --- Buttons --- */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            pointer-events: auto;
            margin-top: 2rem;
        }

        .btn-arcade {
            background: var(--neon-cyan);
            color: #000;
            font-family: 'PixelFont', monospace;
            font-size: 1.5rem;
            padding: 15px 40px;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.3),
                inset 4px 4px 0px rgba(255,255,255,0.5),
                6px 6px 0px #000; /* Hard drop shadow */
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-arcade:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.3),
                inset 4px 4px 0px rgba(255,255,255,0.5),
                8px 8px 0px #000;
            background: #fff;
        }

        .btn-arcade:active {
            transform: translate(2px, 2px);
            box-shadow: 
                inset -2px -2px 0px rgba(0,0,0,0.3),
                2px 2px 0px #000;
        }

        .secondary-menu {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .link-pixel {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            border: 2px solid transparent;
            padding: 8px 16px;
            background: rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .link-pixel:hover {
            color: var(--neon-yellow);
            border-color: var(--neon-yellow);
            background: rgba(0,0,0,0.8);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1.main-title { font-size: 2.5rem; }
            .btn-arcade { font-size: 1.2rem; padding: 12px 30px; }
        }

    </style>
</head>
<body>

    <!-- Visual FX -->
    <div class="crt-overlay"></div>
    <div class="chromatic-aberration"></div>

    <!-- 3D Scene -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="game-container">
        <div class="ui-layer">
            <div class="title-block">
                <h1 class="main-title">Pixel<br>Dance</h1>
                <h2 class="sub-title">Rhythm Protocol</h2>
            </div>

            <div class="controls">
                <button class="btn-arcade" onclick="startGame()">Start Game</button>
                
                <div class="secondary-menu">
                    <a class="link-pixel" onclick="alert('Options Menu')">Options</a>
                    <a class="link-pixel" onclick="alert('Credits')">Credits</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Disable image smoothing for pixel art look
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;
        
        // Colors
        const COLORS = {
            bg: '#080014',
            grid: '#2a0e45',
            gridBright: '#6b2c91',
            sun: '#ffcc00',
            sunStripe: '#220033',
            lane1: '#ff00aa',
            lane2: '#00f0ff',
            lane3: '#00f0ff',
            lane4: '#ff00aa',
            hitLine: '#ffffff'
        };

        const laneColors = [COLORS.lane1, COLORS.lane2, COLORS.lane3, COLORS.lane4];

        // Configuration
        const config = {
            horizonY: 0.35, // Horizon position (0 to 1)
            fov: 800,
            roadWidth: 2400, // World units
            segmentLength: 100,
            drawDistance: 30 // segments
        };

        // Notes System
        const notes = [];
        const noteSpeed = 1.5; // World units per frame

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- 3D Math Helpers ---

        // Project 3D world coordinate to 2D screen coordinate
        function project(x, y, z) {
            const scale = config.fov / (config.fov + z);
            const x2d = (x * scale) + (width / 2);
            const y2d = (y * scale) + (height / 2);
            return { x: x2d, y: y2d, scale: scale };
        }

        // --- Rendering Functions ---

        function drawBackground() {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height * config.horizonY);
            grad.addColorStop(0, '#000000');
            grad.addColorStop(1, '#1a0033');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Stars (Static for performance, could be animated)
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<50; i++) {
                const sx = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 43.2) * 0.5 + 0.5) * (height * config.horizonY);
                const ss = (Math.random() > 0.95) ? 3 : 1;
                ctx.globalAlpha = 0.5 + Math.sin(time * 0.05 + i) * 0.5;
                ctx.fillRect(sx, sy, ss, ss);
            }
            ctx.globalAlpha = 1;

            // Retro Sun
            const sunY = (height * config.horizonY) - 50;
            const sunR = Math.min(width, height) * 0.15;
            
            // Sun Glow
            const sunGrad = ctx.createRadialGradient(width/2, sunY, sunR * 0.5, width/2, sunY, sunR * 2);
            sunGrad.addColorStop(0, 'rgba(255, 100, 0, 0.4)');
            sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(0, 0, width, height);

            // Sun Body (Pixelated approach: Draw rect stripes)
            ctx.fillStyle = COLORS.sun;
            ctx.beginPath();
            ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
            ctx.fill();

            // Sun Stripes (Horizontal cuts)
            ctx.fillStyle = COLORS.sunStripe;
            for(let i = 0; i < 10; i++) {
                const y = sunY + (i * 12);
                const h = 4 + (i * 1.5); // Stripes get thicker lower down
                // Clip to circle
                ctx.save();
                ctx.beginPath();
                ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
                ctx.clip();
                ctx.fillRect(width/2 - sunR, y, sunR * 2, h);
                ctx.restore();
            }
        }

        function drawGridAndRoad() {
            const horizonScreenY = height * config.horizonY;
            const centerX = width / 2;
            
            // 1. Draw Vertical Lanes (Perspective Lines)
            // We draw 4 lanes.
            // Bottom width of the road
            const roadBottomWidth = Math.min(width * 0.9, 800);
            
            ctx.lineWidth = Math.max(2, width / 800); // Responsive line width
            ctx.lineCap = 'square';

            // Draw Lane Dividers
            for (let i = 0; i <= 4; i++) {
                // Calculate X positions
                const xBottom = (centerX - roadBottomWidth/2) + (i * (roadBottomWidth/4));
                // At horizon, they all meet at center
                const xHorizon = centerX;

                // Draw line
                ctx.beginPath();
                ctx.strokeStyle = (i === 0 || i === 4) ? COLORS.gridBright : COLORS.grid; // Outer edges brighter
                ctx.moveTo(xHorizon, horizonScreenY);
                ctx.lineTo(xBottom, height);
                ctx.stroke();
            }

            // 2. Draw Horizontal Moving Lines
            // We need to simulate depth. 
            // Z goes from 0 (camera) to Max (horizon).
            // We map Z to Y on screen using perspective formula.
            
            const numLines = 20;
            const speed = 0.8; // Movement speed
            time += speed;
            
            for(let i = 0; i < numLines; i++) {
                // Calculate Z position based on time
                // We want lines to appear at horizon and move towards camera
                const z = ((time * 100 + i * 200) % (config.drawDistance * 200));
                
                // If z is too close, skip (clipping plane)
                if (z < 10) continue;

                // Project the Z plane
                const scale = config.fov / (config.fov + z);
                const yScreen = (0 * scale) + (height / 2); // Y is always 0 (floor level)
                
                // Only draw if on screen
                if (yScreen > horizonScreenY && yScreen < height) {
                    // Calculate width at this Z
                    const zWidth = config.roadWidth * scale;
                    const xStart = centerX - (zWidth / 2);
                    
                    // Fade out at horizon
                    const alpha = Math.min(1, (z / (config.drawDistance * 200)));
                    ctx.strokeStyle = `rgba(255, 0, 255, ${alpha * 0.4})`;
                    
                    ctx.beginPath();
                    ctx.moveTo(xStart, yScreen);
                    ctx.lineTo(xStart + zWidth, yScreen);
                    ctx.stroke();
                }
            }
        }

        function spawnNote() {
            // Randomly spawn a note far away
            if (Math.random() < 0.04) {
                const lane = Math.floor(Math.random() * 4);
                notes.push({
                    lane: lane,
                    z: config.drawDistance * 200, // Start at horizon
                    active: true
                });
            }
        }

        function drawNotes() {
            const horizonScreenY = height * config.horizonY;
            const centerX = width / 2;
            const roadBottomWidth = Math.min(width * 0.9, 800);

            // Sort notes by Z (furthest first)
            notes.sort((a, b) => b.z - a.z);

            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                
                // Move note towards camera
                note.z -= 4; // Speed

                if (note.z < 10) {
                    // Hit or missed
                    note.active = false;
                    // Optional: Trigger hit effect here
                }

                if (!note.active) {
                    notes.splice(i, 1);
                    continue;
                }

                // Project Note
                const scale = config.fov / (config.fov + note.z);
                const yScreen = (0 * scale) + (height / 2);
                
                // Calculate X for this lane
                // Interpolate lane width based on scale
                const currentRoadWidth = config.roadWidth * scale;
                const laneWidth = currentRoadWidth / 4;
                const laneXStart = centerX - (currentRoadWidth / 2);
                const noteX = laneXStart + (note.lane * laneWidth) + (laneWidth / 2);

                // Draw Note Block
                const blockSize = 40 * scale * 2; // Scale size
                
                // Don't draw if behind horizon
                if (yScreen > horizonScreenY) {
                    ctx.fillStyle = laneColors[note.lane];
                    // Glow effect
                    ctx.shadowBlur = 10 * scale;
                    ctx.shadowColor = laneColors[note.lane];
                    
                    // Draw centered block
                    ctx.fillRect(noteX - blockSize/2, yScreen - blockSize/2, blockSize, blockSize);
                    
                    // Inner highlight for 3D feel
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fillRect(noteX - blockSize/4, yScreen - blockSize/4, blockSize/2, blockSize/2);
                    
                    ctx.shadowBlur = 0;
                }
            }
        }

        function drawHitLine() {
            // The hit line is at a fixed Z near the camera
            const hitZ = 100; 
            const scale = config.fov / (config.fov + hitZ);
            const yScreen = (0 * scale) + (height / 2);
            
            const currentRoadWidth = config.roadWidth * scale;
            const centerX = width / 2;

            // Draw a glowing bar
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(centerX - currentRoadWidth/2, yScreen - 5, currentRoadWidth, 10);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(centerX - currentRoadWidth/2, yScreen - 5, currentRoadWidth, 10);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            drawGridAndRoad();
            
            spawnNote();
            drawNotes();
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-arcade');
            const originalText = btn.innerText;
            btn.innerText = 'LOADING...';
            btn.style.backgroundColor = '#fff';
            
            // Simulate loading
            setTimeout(() => {
                // Flash screen
                const flash = document.createElement('div');
                flash.style.position = 'fixed';
                flash.style.top = '0';
                flash.style.left = '0';
                flash.style.width = '100%';
                flash.style.height = '100%';
                flash.style.background = '#fff';
                flash.style.zIndex = '999';
                document.body.appendChild(flash);
                
                setTimeout(() => {
                    flash.style.transition = 'opacity 1s';
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 1000);
                    btn.innerText = 'START GAME';
                    alert('Game Started!');
                }, 100);
            }, 800);
        }

        animate();

    </script>
</body>
</html>
