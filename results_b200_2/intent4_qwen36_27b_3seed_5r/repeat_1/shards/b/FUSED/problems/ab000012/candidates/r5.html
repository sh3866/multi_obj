<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Deep Mystical */
        --bg-deep: #05010a;
        --bg-gradient: radial-gradient(circle at 50% 20%, #1a0b2e 0%, #0a0212 60%, #000000 100%);
        
        --gold-light: #fff8d6;
        --gold-primary: #ffd700;
        --gold-dark: #b8860b;
        
        --mystic-purple: #9d4edd;
        --mystic-purple-glow: rgba(157, 78, 221, 0.6);
        --mystic-blue: #00b4d8;
        --mystic-red: #ff4d4d;
        --mystic-green: #a3ff00;
        
        --text-main: #f0f0f0;
        --text-muted: #a0a0b5;
        
        /* UI Properties */
        --card-bg: linear-gradient(180deg, rgba(20, 15, 40, 0.7) 0%, rgba(10, 5, 20, 0.85) 100%);
        --card-border: rgba(255, 255, 255, 0.15);
        --card-radius: 12px;
        
        /* Typography */
        --font-display: 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Background Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: var(--bg-gradient);
    }

    /* Softened Noise Texture (Critique 5) */
    .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.04; /* Reduced opacity */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Main Container */
    .game-container {
        width: 100%;
        height: 100%;
        max-width: 1600px;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 10;
        padding: 1.5rem 2rem;
    }

    /* --- Header (Top Layer) --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 0.5rem;
        margin-bottom: 0.5rem; /* Tightened spacing */
        animation: fadeDown 1s ease-out;
    }

    .game-logo {
        font-family: var(--font-display);
        font-size: 1.2rem;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.6);
        text-transform: uppercase;
        font-weight: 700;
    }

    /* Refined Currency Pill */
    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(184, 134, 11, 0.3);
        border-radius: 100px;
        padding: 0.3rem 1.2rem 0.3rem 0.6rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.05);
        position: relative;
        transition: all 0.3s ease;
        cursor: default;
    }

    .currency-pill:hover {
        background: rgba(20, 15, 5, 0.6);
        border-color: rgba(255, 215, 0, 0.5);
    }

    .currency-icon {
        width: 20px;
        height: 20px;
        fill: url(#gold-gradient);
        filter: drop-shadow(0 0 2px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
        text-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
    }

    /* --- Hero Section (Center) --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 1.5rem; /* Tightened spacing */
        height: 45vh; /* Constrain height to ensure grid fits */
        min-height: 300px;
    }

    /* Refined Title */
    .game-title {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 400;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
        margin-bottom: 1rem;
        text-shadow: 
            0 0 15px rgba(176, 38, 255, 0.3),
            0 10px 20px rgba(0,0,0,0.8);
        position: relative;
        z-index: 2;
        background: linear-gradient(to bottom, #ffffff 20%, #d0d0d0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeDown 1.2s ease-out;
    }

    /* The Portal Effect */
    .portal-container {
        position: relative;
        width: 260px; /* Scaled down slightly */
        height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        perspective: 1000px;
    }

    .portal-container:hover {
        transform: scale(1.02);
    }

    .portal-core {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--mystic-purple), #2a0a4a);
        box-shadow: 
            0 0 40px var(--mystic-purple),
            0 0 80px rgba(176, 38, 255, 0.3),
            inset 0 0 20px rgba(255,255,255,0.8);
        position: relative;
        z-index: 5;
        animation: breathe 4s ease-in-out infinite;
    }

    /* Portal Rings */
    .portal-ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
    }

    .ring-1 { 
        width: 160px; height: 160px; 
        border: 1px solid rgba(255, 215, 0, 0.2);
        border-top: 2px solid var(--gold-primary);
        border-bottom: 2px solid var(--gold-primary);
        animation: spin 12s linear infinite;
    }

    .ring-2 { 
        width: 210px; height: 210px; 
        border: 1px dashed var(--mystic-purple);
        animation: spin-rev 25s linear infinite;
        opacity: 0.5;
    }

    .ring-3 { 
        width: 250px; height: 250px; 
        border: 1px dotted rgba(255, 255, 255, 0.1);
        animation: spin 45s linear infinite;
    }
    
    .ring-glow {
        width: 130px; height: 130px;
        border: 1px solid rgba(176, 38, 255, 0.1);
        box-shadow: 0 0 30px var(--mystic-purple-glow);
        animation: pulseRing 3s ease-in-out infinite;
    }

    /* --- Grid Layout (Bottom) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2x2 Grid */
        grid-template-rows: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        max-width: 900px; /* Wider for better card aspect ratio */
        margin: 0 auto;
        flex: 1; /* Fill remaining space */
        /* Ensure visibility */
        min-height: 0; 
        animation: fadeUp 1s ease-out 0.3s backwards;
    }

    /* --- Card Styles (Critique 3: Substance & Craft) --- */
    .menu-card {
        position: relative;
        /* Subtle dark gradient background */
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--card-radius);
        padding: 1.5rem;
        display: flex;
        flex-direction: row; /* Horizontal layout for better hierarchy */
        align-items: center;
        justify-content: flex-start; /* Left align */
        text-align: left;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        height: 100%;
        overflow: hidden;
        box-shadow: 
            0 10px 20px rgba(0,0,0,0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.1); /* Inner glow top */
    }

    /* Inner Glow / Border Definition */
    .menu-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: var(--card-radius);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        pointer-events: none;
        z-index: 1;
    }

    .menu-card:hover {
        transform: translateY(-4px);
        background: linear-gradient(180deg, rgba(30, 20, 50, 0.8) 0%, rgba(15, 10, 25, 0.9) 100%);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.05);
    }

    .menu-card:hover .card-icon {
        transform: scale(1.1);
        filter: drop-shadow(0 0 8px currentColor);
    }

    /* Typography */
    .card-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-left: 1.2rem;
        z-index: 2;
    }

    .card-title {
        font-family: var(--font-display);
        font-size: 1.3rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-bottom: 0.2rem;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-subtitle {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
    }

    /* Icons (Critique 2: Unified Line Art) */
    .card-icon {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        transition: all 0.4s ease;
        filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* --- Specific Card Aesthetics --- */

    /* 1. Summon (Primary - Deep Purple/Glass + Gold Border) */
    .menu-card.summon-card {
        background: linear-gradient(135deg, rgba(40, 15, 70, 0.7), rgba(15, 5, 30, 0.8));
        border: 1px solid rgba(255, 215, 0, 0.2);
        box-shadow: 0 0 15px rgba(157, 78, 221, 0.05);
    }

    .menu-card.summon-card:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.1), 0 10px 30px rgba(0,0,0,0.5);
    }

    .menu-card.summon-card .card-icon {
        stroke: var(--gold-primary);
        fill: none;
        color: var(--gold-primary);
    }

    .menu-card.summon-card .card-title {
        color: var(--gold-light);
    }

    /* 2. Roster (Top Right) */
    .menu-card.roster .card-icon { 
        stroke: var(--mystic-blue); 
        fill: none;
        color: var(--mystic-blue); 
    }
    .menu-card.roster:hover { 
        border-color: rgba(0, 180, 216, 0.4); 
        box-shadow: 0 10px 30px rgba(0, 180, 216, 0.1); 
    }
    
    /* 3. Battle (Bottom Left) */
    .menu-card.battle .card-icon { 
        stroke: var(--mystic-red); 
        fill: none;
        color: var(--mystic-red); 
    }
    .menu-card.battle:hover { 
        border-color: rgba(255, 77, 77, 0.4); 
        box-shadow: 0 10px 30px rgba(255, 77, 77, 0.1); 
    }

    /* 4. Grind (Bottom Right) */
    .menu-card.grind .card-icon { 
        stroke: var(--mystic-green); 
        fill: none;
        color: var(--mystic-green); 
    }
    .menu-card.grind:hover { 
        border-color: rgba(163, 255, 0, 0.4); 
        box-shadow: 0 10px 30px rgba(163, 255, 0, 0.1); 
    }


    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--mystic-purple); }
        50% { transform: scale(1.05); box-shadow: 0 0 60px var(--mystic-purple), 0 0 20px #fff; }
    }
    
    @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .game-title { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: 0.15em; }
        .menu-grid { 
            grid-template-columns: 1fr 1fr; 
            gap: 1rem; 
        }
        .menu-card { padding: 1rem; }
        .card-title { font-size: 1.1rem; }
        .card-icon { width: 36px; height: 36px; }
        .portal-container { width: 200px; height: 200px; }
        .portal-core { width: 70px; height: 70px; }
        .ring-1 { width: 130px; height: 130px; }
        .ring-2 { width: 170px; height: 170px; }
        .ring-3 { width: 190px; height: 190px; }
    }

</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
        <div class="noise-overlay"></div>
    </div>

    <!-- SVG Definitions for Gradients -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </linearGradient>
    </svg>

    <div class="game-container">
        <header>
            <div class="game-logo">Aetherbound</div>
            
            <!-- Refined Currency Pill -->
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v3H8v2h3v3h2v-3h3V10h-3V7z"/>
                    <circle cx="12" cy="12" r="9" fill="none" stroke="url(#gold-gradient)" stroke-width="1.5"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Spirit Summoning</h1>
            
            <!-- Enhanced Hero Orb with Rune Circle (Critique 4) -->
            <div class="portal-container" id="summon-portal">
                <div class="portal-core"></div>
                <div class="portal-ring ring-glow"></div>
                <div class="portal-ring ring-1"></div>
                <div class="portal-ring ring-2"></div>
                <div class="portal-ring ring-3"></div>
            </div>
        </main>

        <!-- Structured 2x2 Grid -->
        <nav class="menu-grid">
            
            <!-- 1. Summon (Primary) -->
            <div class="menu-card summon-card">
                <!-- Unified Line Icon: Star/Compass -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/>
                    <path d="M12 2v20M2 12h20" stroke="currentColor" fill="none" opacity="0.5"/>
                    <path d="M12 7l2.5 5h-5L12 7z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Awaken Spirits</div>
                </div>
            </div>

            <!-- 2. Roster -->
            <div class="menu-card roster">
                <!-- Unified Line Icon: Shield/Profile -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" stroke="currentColor" fill="none"/>
                    <circle cx="12" cy="11" r="3" stroke="currentColor" fill="none"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Team</div>
                </div>
            </div>

            <!-- 3. Battle -->
            <div class="menu-card battle">
                <!-- Unified Line Icon: Crossed Swords -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" stroke="currentColor" fill="none"/>
                    <path d="M13 19l6-6" stroke="currentColor" fill="none"/>
                    <path d="M16 16l4 4" stroke="currentColor" fill="none"/>
                    <path d="M19 21l2-2" stroke="currentColor" fill="none"/>
                    
                    <path d="M9.5 6.5L21 18v3h-3L9.5 9.5" stroke="currentColor" fill="none"/>
                    <path d="M11 5l-6 6" stroke="currentColor" fill="none"/>
                    <path d="M8 8l-4-4" stroke="currentColor" fill="none"/>
                    <path d="M5 3l-2 2" stroke="currentColor" fill="none"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena</div>
                </div>
            </div>

            <!-- 4. Grind -->
            <div class="menu-card grind">
                <!-- Unified Line Icon: Pickaxe (Thematic) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14 5l5 5" stroke="currentColor" fill="none" stroke-width="2"/>
                    <path d="M19 10a2.12 2.12 0 0 1 0 3l-1 1a2.12 2.12 0 0 1-3 0l-9-9a2.12 2.12 0 0 1 0-3l1-1a2.12 2.12 0 0 1 3 0z" stroke="currentColor" fill="none"/>
                    <path d="M10 14l-9 9" stroke="currentColor" fill="none" stroke-width="2"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2; 
                this.vy = (Math.random() - 0.5) * 0.2 - 0.1; 
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                this.color = Math.random() > 0.6 ? '200, 200, 255' : '157, 78, 221';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                this.alpha += this.fadeDir * 0.005;
                if (this.alpha >= 0.7 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        const portal = document.getElementById('summon-portal');
        
        portal.addEventListener('mousemove', (e) => {
            const rect = portal.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = portal.querySelector('.portal-core');
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px) scale(1.05)`;
        });

        portal.addEventListener('mouseleave', () => {
             const core = portal.querySelector('.portal-core');
             core.style.transform = `translate(0px, 0px) scale(1)`;
        });

    </script>
</body>
</html>
