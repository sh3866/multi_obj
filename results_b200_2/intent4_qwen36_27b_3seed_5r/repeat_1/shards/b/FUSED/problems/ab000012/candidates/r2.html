<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #05010a;
        --bg-gradient: radial-gradient(ellipse at 50% 20%, #1a0b2e 0%, #0a0212 60%, #000000 100%);
        
        --gold-primary: #ffd700;
        --gold-secondary: #c5a000;
        --gold-dim: #6a5600;
        
        --mystic-purple: #b026ff;
        --mystic-blue: #00f0ff;
        
        --text-main: #f0f0f0;
        --text-muted: #8a8a9b;
        
        /* UI Properties */
        --glass-bg: rgba(10, 5, 20, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.15);
        
        --card-radius: 12px;
        
        /* Typography */
        --font-display: 'Cinzel', 'Times New Roman', serif; /* Fallback to serif if Cinzel isn't local */
        --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Background Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: var(--bg-gradient);
    }

    /* Main Container */
    .game-container {
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 2;
        padding: 2rem;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    .logo-area {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo-text {
        font-family: var(--font-display);
        font-size: 1.2rem;
        letter-spacing: 0.2em;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--gold-dim);
        border-left: 3px solid var(--gold-primary);
        padding: 0.5rem 1.5rem;
        border-radius: 2px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.05);
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .currency-pill:hover {
        background: rgba(255, 215, 0, 0.05);
        border-color: var(--gold-primary);
    }

    .currency-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-primary));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 4.5rem;
        font-weight: 400;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
        margin-bottom: 2rem;
        text-shadow: 
            0 0 10px rgba(176, 38, 255, 0.4),
            0 4px 20px rgba(0,0,0,0.8);
        position: relative;
        z-index: 2;
        background: linear-gradient(to bottom, #ffffff, #d0d0d0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* The Orb */
    .orb-container {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .orb-container:hover {
        transform: scale(1.05);
    }

    .orb-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--mystic-purple), #2a0a4a);
        box-shadow: 
            0 0 30px var(--mystic-purple),
            0 0 60px rgba(176, 38, 255, 0.4),
            inset 0 0 20px rgba(255,255,255,0.5);
        position: relative;
        z-index: 2;
        animation: breathe 4s ease-in-out infinite;
    }

    /* Orb Rings */
    .orb-ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ring-1 { 
        width: 180px; height: 180px; 
        border-top: 2px solid var(--gold-primary);
        border-bottom: 2px solid var(--gold-primary);
        border-left: 1px solid transparent;
        border-right: 1px solid transparent;
        animation: spin 12s linear infinite;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .ring-2 { 
        width: 240px; height: 240px; 
        border: 1px dashed var(--mystic-purple);
        animation: spin-rev 25s linear infinite;
        opacity: 0.6;
    }

    .ring-3 { 
        width: 290px; height: 290px; 
        border: 1px dotted rgba(255, 255, 255, 0.2);
        animation: spin 40s linear infinite;
    }

    /* --- Grid Layout --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 800px;
        margin: 0 auto; /* Center the grid */
        padding-bottom: 2rem;
    }

    /* --- Card Styles (Enchanted Panels) --- */
    .menu-card {
        position: relative;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: var(--card-radius);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        height: 200px;
        overflow: hidden;
    }

    /* Inner decorative border */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 6px; left: 6px; right: 6px; bottom: 6px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        pointer-events: none;
        transition: border-color 0.3s ease;
    }

    /* Hover State */
    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(30, 15, 50, 0.7);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(176, 38, 255, 0.1);
    }

    .menu-card:hover::before {
        border-color: rgba(255, 255, 255, 0.15);
    }

    .menu-card:hover .card-icon {
        transform: scale(1.1);
        filter: drop-shadow(0 0 12px currentColor);
    }

    /* Typography */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-top: 1rem;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-subtitle {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 600;
    }

    /* Icons */
    .card-icon {
        width: 56px;
        height: 56px;
        transition: all 0.4s ease;
        filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
    }

    /* --- Specific Card Aesthetics --- */

    /* 1. Summon (Primary) */
    .menu-card.summon-card {
        grid-column: span 2; /* Full width in 2-col grid */
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        gap: 2rem;
        padding: 0 3rem;
        background: linear-gradient(90deg, rgba(10, 5, 20, 0.8), rgba(40, 20, 60, 0.8));
        border: 1px solid var(--gold-dim);
    }

    .menu-card.summon-card::before {
        border-color: rgba(255, 215, 0, 0.2);
    }

    .menu-card.summon-card .card-icon {
        fill: var(--gold-primary);
        color: var(--gold-primary);
        width: 64px;
        height: 64px;
    }

    .menu-card.summon-card .card-content {
        text-align: left;
    }

    .menu-card.summon-card .card-title {
        color: var(--gold-primary);
        font-size: 1.8rem;
        margin-top: 0;
    }

    .menu-card.summon-card:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.15), inset 0 0 20px rgba(255, 215, 0, 0.05);
    }

    /* 2. Roster */
    .menu-card.roster .card-icon { fill: #00f0ff; color: #00f0ff; }
    .menu-card.roster:hover { border-color: rgba(0, 240, 255, 0.4); }
    
    /* 3. Battle */
    .menu-card.battle .card-icon { fill: #ff4d4d; color: #ff4d4d; }
    .menu-card.battle:hover { border-color: rgba(255, 77, 77, 0.4); }

    /* 4. Grind */
    .menu-card.grind .card-icon { fill: #a3ff00; color: #a3ff00; }
    .menu-card.grind:hover { border-color: rgba(163, 255, 0, 0.4); }


    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--mystic-purple); }
        50% { transform: scale(1.08); box-shadow: 0 0 50px var(--mystic-purple), 0 0 20px #fff; }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .menu-grid { grid-template-columns: 1fr; gap: 1rem; }
        .menu-card.summon-card { grid-column: span 1; flex-direction: column; padding: 1.5rem; height: auto; gap: 1rem; }
        .menu-card.summon-card .card-content { text-align: center; }
        .menu-card { height: 140px; }
        .orb-container { width: 220px; height: 220px; }
        .orb-core { width: 80px; height: 80px; }
        .ring-1 { width: 120px; height: 120px; }
        .ring-2 { width: 160px; height: 160px; }
        .ring-3 { width: 200px; height: 200px; }
    }

</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>

    <div class="game-container">
        <header>
            <div class="logo-area">
                <div class="logo-text">Aetherbound</div>
            </div>
            <div class="currency-pill">
                <!-- Gold Coin SVG -->
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v3H8v2h3v3h2v-3h3V10h-3V7z"/>
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            
            <div class="orb-container" id="summon-orb">
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            
            <!-- Summon Card (Primary - Full Width) -->
            <div class="menu-card summon-card">
                <!-- Stylized Glowing Star/Spiral -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="currentColor" stroke-width="1" fill="currentColor"/>
                    <circle cx="12" cy="12" r="3" fill="#fff" opacity="0.8"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Awaken Spirits</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card roster">
                <!-- Stylized Crest/Shield -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Team</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card battle">
                <!-- Stylized Crossed Weapons/Rune -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6.92 5L5 7l3 3-1.41 1.41L2 11.73V14h2.27l-2 2L2 18l2 2 2-2 2 2 2-2-2-2 2-2 2 2 2-2-2-2 2-2-2-2 2-2-2-2-2 2-2-2 2-2-2-2-2 2-2-2 2-2zm10.16 0l-2 2 2 2 2-2-2-2zm-4.24 4.24l-2 2 2 2 2-2-2-2z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card grind">
                <!-- Stylized Lightning Bolt -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2; // Slower drift
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5;
                this.alpha = Math.random() * 0.4;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                // Color tint: mix of white and purple
                this.color = Math.random() > 0.5 ? '200, 200, 255' : '180, 140, 255';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir * 0.003;
                if (this.alpha >= 0.6 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect (Parallax)
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = orb.querySelector('.orb-core');
            
            // Subtle parallax on the inner core
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px) scale(1.05)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             core.style.transform = `translate(0px, 0px) scale(1)`;
        });

    </script>
</body>
</html>
