<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Deep Mystical */
        --bg-deep: #05010a;
        --bg-gradient: radial-gradient(circle at 50% 30%, #1a0b2e 0%, #0a0212 60%, #000000 100%);
        
        --gold-light: #fff8d6;
        --gold-primary: #ffd700;
        --gold-dark: #b8860b;
        --gold-accent: #d4af37;
        
        --mystic-purple: #9d4edd;
        --mystic-purple-glow: rgba(157, 78, 221, 0.6);
        --mystic-blue: #00b4d8;
        --mystic-red: #ff4d4d;
        --mystic-green: #a3ff00;
        
        --text-main: #f0f0f0;
        --text-muted: #9a9ab0;
        
        /* UI Properties */
        --glass-bg: rgba(10, 5, 20, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --card-radius: 8px;
        
        /* Typography */
        --font-display: 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Background Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: var(--bg-gradient);
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Main Container */
    .game-container {
        width: 100%;
        height: 100%;
        max-width: 1400px;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 10;
        padding: 1.5rem 2rem;
    }

    /* --- Header (Top Layer) --- */
    header {
        display: flex;
        justify-content: flex-end; /* Remove logo text, push currency to right */
        align-items: center;
        padding: 0 0.5rem;
        margin-bottom: 1rem;
        animation: fadeDown 1s ease-out;
    }

    /* Refined Currency Pill */
    .currency-pill {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(184, 134, 11, 0.4);
        border-radius: 100px;
        padding: 0.3rem 1.5rem 0.3rem 0.8rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        position: relative;
        transition: all 0.3s ease;
        cursor: default;
    }

    .currency-pill::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 100px;
        padding: 1px;
        background: linear-gradient(90deg, rgba(255,215,0,0.1), rgba(255,215,0,0.5), rgba(255,215,0,0.1));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    .currency-pill:hover {
        background: rgba(20, 15, 5, 0.6);
        border-color: rgba(255, 215, 0, 0.6);
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
    }

    .currency-icon {
        width: 24px;
        height: 24px;
        fill: url(#gold-gradient);
        filter: drop-shadow(0 0 3px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
        text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
    }

    /* --- Hero Section (Center) --- */
    .hero-section {
        flex: 0 0 auto; /* Don't stretch, fit content */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-top: 2vh;
        margin-bottom: 1rem;
    }

    /* Refined Title */
    .game-title {
        font-family: var(--font-display);
        font-size: 4.5rem;
        font-weight: 400;
        letter-spacing: 0.3em; /* Increased for elegance */
        text-transform: uppercase;
        text-align: center;
        color: #fff;
        margin-bottom: 1.5rem;
        text-shadow: 
            0 0 10px rgba(176, 38, 255, 0.4),
            0 10px 20px rgba(0,0,0,0.8);
        position: relative;
        z-index: 2;
        background: linear-gradient(to bottom, #ffffff 30%, #d0d0d0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeDown 1.2s ease-out;
    }

    /* The Portal Effect */
    .portal-container {
        position: relative;
        width: 280px;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        perspective: 1000px;
        margin-bottom: 1rem;
    }

    .portal-container:hover {
        transform: scale(1.05);
    }

    .portal-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--mystic-purple), #2a0a4a);
        box-shadow: 
            0 0 40px var(--mystic-purple),
            0 0 80px rgba(176, 38, 255, 0.3),
            inset 0 0 20px rgba(255,255,255,0.8);
        position: relative;
        z-index: 5;
        animation: breathe 4s ease-in-out infinite;
    }

    /* Portal Rings */
    .portal-ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
    }

    .ring-1 { 
        width: 180px; height: 180px; 
        border: 1px solid rgba(255, 215, 0, 0.3);
        border-top: 2px solid var(--gold-primary);
        border-bottom: 2px solid var(--gold-primary);
        animation: spin 12s linear infinite;
    }

    .ring-2 { 
        width: 230px; height: 230px; 
        border: 1px dashed var(--mystic-purple);
        animation: spin-rev 25s linear infinite;
        opacity: 0.6;
    }

    .ring-3 { 
        width: 270px; height: 270px; 
        border: 1px dotted rgba(255, 255, 255, 0.2);
        animation: spin 45s linear infinite;
    }
    
    .ring-glow {
        width: 140px; height: 140px;
        border: 1px solid rgba(176, 38, 255, 0.1);
        box-shadow: 0 0 30px var(--mystic-purple-glow);
        animation: pulseRing 3s ease-in-out infinite;
    }

    /* --- Grid Layout (Bottom) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2x2 Grid */
        grid-template-rows: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        flex: 1; /* Fill remaining space */
        max-height: 500px;
        padding-bottom: 1rem;
        animation: fadeUp 1s ease-out 0.3s backwards;
    }

    /* --- Card Styles --- */
    .menu-card {
        position: relative;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: var(--card-radius);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        height: 100%;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* Corner Accents */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 8px; left: 8px; right: 8px; bottom: 8px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        pointer-events: none;
        border-radius: 4px;
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(25, 15, 40, 0.7);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    .menu-card:hover .card-icon {
        transform: scale(1.1);
    }

    /* Typography */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-top: 0.8rem;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-subtitle {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    /* Icons */
    .card-icon {
        width: 50px;
        height: 50px;
        transition: all 0.4s ease;
        filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
    }

    /* --- Specific Card Aesthetics --- */

    /* 1. Summon (Primary - Deep Purple/Glass + Gold Border) */
    .menu-card.summon-card {
        background: linear-gradient(135deg, rgba(30, 10, 60, 0.7), rgba(10, 5, 20, 0.6));
        border: 1px solid rgba(255, 215, 0, 0.3);
        box-shadow: 0 0 15px rgba(157, 78, 221, 0.1);
    }

    .menu-card.summon-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.1) 0%, transparent 60%);
        pointer-events: none;
    }

    .menu-card.summon-card:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.15), 0 10px 30px rgba(0,0,0,0.5);
    }

    .menu-card.summon-card .card-icon {
        fill: var(--gold-primary);
        color: var(--gold-primary);
    }

    .menu-card.summon-card .card-title {
        color: var(--gold-light);
    }

    /* 2. Roster (Top Right) */
    .menu-card.roster .card-icon { fill: var(--mystic-blue); color: var(--mystic-blue); }
    .menu-card.roster:hover { border-color: rgba(0, 180, 216, 0.4); box-shadow: 0 10px 30px rgba(0, 180, 216, 0.15); }
    
    /* 3. Battle (Bottom Left) */
    .menu-card.battle .card-icon { fill: var(--mystic-red); color: var(--mystic-red); }
    .menu-card.battle:hover { border-color: rgba(255, 77, 77, 0.4); box-shadow: 0 10px 30px rgba(255, 77, 77, 0.15); }

    /* 4. Grind (Bottom Right) */
    .menu-card.grind .card-icon { fill: var(--mystic-green); color: var(--mystic-green); }
    .menu-card.grind:hover { border-color: rgba(163, 255, 0, 0.4); box-shadow: 0 10px 30px rgba(163, 255, 0, 0.15); }


    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--mystic-purple); }
        50% { transform: scale(1.05); box-shadow: 0 0 60px var(--mystic-purple), 0 0 20px #fff; }
    }
    
    @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; margin-bottom: 1rem; letter-spacing: 0.15em; }
        .menu-grid { 
            grid-template-columns: 1fr 1fr; 
            gap: 1rem; 
            max-height: 400px;
        }
        .menu-card { padding: 1rem; }
        .card-title { font-size: 1.1rem; }
        .card-icon { width: 40px; height: 40px; }
        .portal-container { width: 220px; height: 220px; }
        .portal-core { width: 80px; height: 80px; }
        .ring-1 { width: 140px; height: 140px; }
        .ring-2 { width: 180px; height: 180px; }
        .ring-3 { width: 210px; height: 210px; }
    }

</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
        <div class="noise-overlay"></div>
    </div>

    <!-- SVG Definitions for Gradients -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </linearGradient>
    </svg>

    <div class="game-container">
        <header>
            <!-- Removed Logo Text per Critique 1 -->
            
            <!-- Refined Currency Pill (Critique 5) -->
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v3H8v2h3v3h2v-3h3V10h-3V7z"/>
                    <circle cx="12" cy="12" r="9" fill="none" stroke="url(#gold-gradient)" stroke-width="1.5"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <!-- Refined Title (Critique 1) -->
            <h1 class="game-title">Aetherbound</h1>
            
            <!-- Enhanced Hero Orb (Critique 4) -->
            <div class="portal-container" id="summon-portal">
                <div class="portal-core"></div>
                <div class="portal-ring ring-glow"></div>
                <div class="portal-ring ring-1"></div>
                <div class="portal-ring ring-2"></div>
                <div class="portal-ring ring-3"></div>
            </div>
        </main>

        <!-- Structured 2x2 Grid (Critique 2) -->
        <nav class="menu-grid">
            
            <!-- Elevated Card Design (Critique 3) -->
            
            <!-- 1. Summon (Primary) -->
            <div class="menu-card summon-card">
                <!-- Rune SVG -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="currentColor" stroke-width="0.5" fill="currentColor"/>
                    <path d="M12 6L14 10L18 11L15 14L16 18L12 16L8 18L9 14L6 11L10 10L12 6Z" fill="#fff" opacity="0.5"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Awaken Spirits</div>
                </div>
            </div>

            <!-- 2. Roster -->
            <div class="menu-card roster">
                <!-- Crest SVG -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Team</div>
                </div>
            </div>

            <!-- 3. Battle -->
            <div class="menu-card battle">
                <!-- Sword SVG -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena</div>
                </div>
            </div>

            <!-- 4. Grind -->
            <div class="menu-card grind">
                <!-- Hammer SVG -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M21.71 11.29l-9-9c-.39-.39-1.02-.39-1.41 0l-1.59 1.59 3.75 3.75 1.59-1.59 7.59 7.59-1.59 1.59 3.75 3.75 1.59-1.59c.39-.39.39-1.02 0-1.41l-1.69-1.69zM4.29 12.71l1.59-1.59-3.75-3.75-1.59 1.59c-.39.39-.39 1.02 0 1.41l2.34 2.34c.39.39 1.02.39 1.41 0z" transform="rotate(45 12 12)" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2; 
                this.vy = (Math.random() - 0.5) * 0.2 - 0.1; // Slight upward drift
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                // Color tint: mix of white and purple
                this.color = Math.random() > 0.6 ? '200, 200, 255' : '157, 78, 221';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir * 0.005;
                if (this.alpha >= 0.7 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Portal Effect (Parallax)
        const portal = document.getElementById('summon-portal');
        
        portal.addEventListener('mousemove', (e) => {
            const rect = portal.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = portal.querySelector('.portal-core');
            
            // Subtle parallax on the inner core
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px) scale(1.05)`;
        });

        portal.addEventListener('mouseleave', () => {
             const core = portal.querySelector('.portal-core');
             core.style.transform = `translate(0px, 0px) scale(1)`;
        });

    </script>
</body>
</html>
