<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #05010a;
        --bg-gradient: radial-gradient(circle at 50% 30%, #2a0a4a 0%, #110524 40%, #05010a 85%);
        --accent-gold: #ffd700;
        --accent-gold-dim: #b8860b;
        --accent-mystic: #d000ff;
        --accent-cyan: #00f0ff;
        --text-main: #ffffff;
        --text-muted: #a0a0b0;
        --glass-bg: rgba(20, 10, 30, 0.65);
        --glass-border: rgba(255, 255, 255, 0.1);
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Deep Atmosphere Background */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: var(--bg-gradient);
    }

    /* Vignette Overlay */
    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 90%);
        pointer-events: none;
        z-index: 1;
    }

    /* Main Layout Container */
    .game-container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        position: relative;
        z-index: 5;
    }

    /* Header */
    header {
        display: flex;
        justify-content: flex-end; /* Align currency to right */
        align-items: center;
        padding-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--accent-gold-dim);
        padding: 0.6rem 1.8rem;
        border-radius: 4px; /* Sharper corners for premium feel */
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        position: relative;
        overflow: hidden;
    }

    /* Shine effect on currency */
    .currency-pill::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transform: skewX(-25deg);
        animation: shine 4s infinite;
    }

    .currency-icon {
        width: 22px;
        height: 22px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 4px var(--accent-gold));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: bold;
        font-size: 1.2rem;
        color: var(--accent-gold);
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Hero Section */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 4rem;
        font-weight: normal;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
        margin-bottom: 1.5rem;
        /* Text Glow */
        text-shadow: 
            0 0 10px rgba(208, 0, 255, 0.5),
            0 0 20px rgba(208, 0, 255, 0.3),
            0 0 40px rgba(208, 0, 255, 0.1);
        position: relative;
        z-index: 2;
    }

    /* Summoning Orb */
    .orb-container {
        position: relative;
        width: 280px;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .orb-container:hover {
        transform: scale(1.08);
    }

    .orb-container:hover .orb-core {
        box-shadow: 0 0 60px var(--accent-mystic), inset 0 0 30px rgba(255,255,255,0.4);
    }

    .orb-core {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #d000ff, #2a0a4a);
        box-shadow: 0 0 40px var(--accent-mystic), inset 0 0 20px rgba(255,255,255,0.3);
        position: relative;
        z-index: 2;
        animation: breathe 4s ease-in-out infinite;
    }

    /* Runic Rings */
    .orb-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        pointer-events: none;
    }

    /* Ring 1: Inner Dashed */
    .ring-1 { 
        width: 160px; height: 160px; 
        border-style: dashed;
        border-color: var(--accent-gold-dim);
        animation: spin 20s linear infinite;
    }

    /* Ring 2: Outer Solid */
    .ring-2 { 
        width: 220px; height: 220px; 
        border: 2px solid transparent;
        border-top-color: var(--accent-mystic);
        border-bottom-color: var(--accent-mystic);
        animation: spin-rev 15s linear infinite;
    }

    /* Ring 3: Wide Runic */
    .ring-3 { 
        width: 260px; height: 260px; 
        border: 1px dashed rgba(255, 215, 0, 0.2);
        animation: spin 40s linear infinite;
    }

    /* Menu Grid - Restructured */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
        margin-top: auto; /* Push to bottom */
        margin-bottom: 2rem;
    }

    /* Base Card Styles (Glassmorphism) */
    .menu-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 6px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        height: 180px;
    }

    /* Hover Effects */
    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(40, 20, 60, 0.7);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    .menu-card:hover .card-icon {
        filter: drop-shadow(0 0 8px currentColor);
        transform: scale(1.1);
    }

    /* Typography */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-top: 0.8rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .card-subtitle {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.4rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    /* ICONS */
    .card-icon {
        width: 48px;
        height: 48px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
    }

    /* --- HIERARCHY: SUMMON CARD (Primary) --- */
    .menu-card.summon-card {
        grid-column: span 2; /* Takes up 50% width */
        height: 180px; /* Match height of others */
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(0, 0, 0, 0.4));
        border: 1px solid var(--accent-gold-dim);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        padding: 0 3rem;
        gap: 2rem;
    }

    .menu-card.summon-card .card-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
    }

    .menu-card.summon-card:hover {
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(20, 10, 30, 0.8));
        border-color: var(--accent-gold);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
    }

    .menu-card.summon-card .card-icon {
        fill: var(--accent-gold);
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    .menu-card.summon-card .card-title {
        font-size: 1.5rem;
        color: var(--accent-gold);
    }

    /* Runic Decorations on Summon Card */
    .menu-card.summon-card::before {
        content: '';
        position: absolute;
        top: 5px; left: 5px; right: 5px; bottom: 5px;
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 2px;
        pointer-events: none;
    }

    /* --- SECONDARY CARDS --- */
    /* Roster, Battle, Grind */
    .menu-card.secondary .card-icon {
        color: #a0a0b0;
        fill: #a0a0b0;
    }
    
    .menu-card.battle .card-icon { color: #ff4d4d; fill: #ff4d4d; }
    .menu-card.grind .card-icon { color: #4dff88; fill: #4dff88; }
    .menu-card.roster .card-icon { color: #4dc8ff; fill: #4dc8ff; }


    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    @keyframes shine {
        0% { left: -100%; }
        20% { left: 200%; }
        100% { left: 200%; }
    }

    /* Responsive */
    @media (max-width: 900px) {
        .menu-grid {
            grid-template-columns: 1fr 1fr;
        }
        .menu-card.summon-card {
            grid-column: span 2;
        }
    }

    @media (max-width: 600px) {
        .menu-grid {
            grid-template-columns: 1fr;
        }
        .menu-card.summon-card {
            grid-column: span 1;
            flex-direction: column;
            text-align: center;
            padding: 1.5rem;
            height: 140px;
        }
        .menu-card.summon-card .card-content {
            align-items: center;
            text-align: center;
        }
        .game-title {
            font-size: 2.5rem;
        }
        .orb-container {
            transform: scale(0.8);
        }
    }

</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="vignette"></div>

    <div class="game-container">
        <header>
            <div class="currency-pill">
                <!-- Gold Coin Icon -->
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v3H8v2h3v3h2v-3h3V10h-3V7z"/>
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            
            <div class="orb-container" id="summon-orb">
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            
            <!-- Summon Card (Primary - Larger & Gold) -->
            <div class="menu-card summon-card">
                <!-- Glowing Star Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Awaken Spirits</div>
                </div>
            </div>

            <!-- Roster Card (Secondary - Glass) -->
            <div class="menu-card roster secondary">
                <!-- Stylized Shield/Group Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Team</div>
                </div>
            </div>

            <!-- Battle Card (Secondary - Glass) -->
            <div class="menu-card battle secondary">
                <!-- Stylized Sword Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6 2l12 12-2 2-12-12zm13.5 12.5l-2-2L16 14l2 2-2 2 2 2 2-2-2-2 2-2zM3 21l2-2 2 2-2 2-2-2z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena</div>
                </div>
            </div>

            <!-- Grind Card (Secondary - Glass) -->
            <div class="menu-card grind secondary">
                <!-- Stylized Lightning/Resource Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2;
                this.alpha = Math.random() * 0.5;
                this.life = Math.random() * 100;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                // Color tint: mix of white and purple
                this.color = Math.random() > 0.5 ? '200, 200, 255' : '200, 150, 255';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir * 0.005;
                if (this.alpha >= 0.8 || this.alpha <= 0.1) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect (Parallax)
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = orb.querySelector('.orb-core');
            
            // Subtle parallax on the inner core
            core.style.transform = `translate(${x * 0.1}px, ${y * 0.1}px) scale(1.05)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             core.style.transform = `translate(0px, 0px) scale(1)`;
        });

    </script>
</body>
</html>
