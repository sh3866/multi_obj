<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #05010a;
        --bg-gradient: radial-gradient(circle at 50% 40%, #1a0b2e 0%, #0a0212 50%, #000000 100%);
        
        --gold-light: #fff0a8;
        --gold-primary: #ffd700;
        --gold-dark: #b8860b;
        --gold-metallic: #c5a000;
        
        --mystic-purple: #9d4edd;
        --mystic-blue: #00b4d8;
        --mystic-red: #ff4d4d;
        --mystic-green: #a3ff00;
        
        --text-main: #f0f0f0;
        --text-muted: #8888a0;
        
        /* UI Properties */
        --glass-bg: rgba(10, 5, 20, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.12);
        
        --card-radius: 4px; /* Sharper, more geometric corners */
        
        /* Typography */
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Background Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: var(--bg-gradient);
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Main Container */
    .game-container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 10;
        padding: 2rem;
    }

    /* --- Header (Top Layer) --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 1rem;
        margin-bottom: 1rem;
        animation: fadeDown 1s ease-out;
    }

    .logo-text {
        font-family: var(--font-display);
        font-size: 1.5rem;
        letter-spacing: 0.15em;
        color: rgba(255, 255, 255, 0.9);
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(176, 38, 255, 0.5);
        font-weight: 600;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--gold-dark);
        border-radius: 50px;
        padding: 0.4rem 1.2rem 0.4rem 0.6rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        position: relative;
        transition: all 0.3s ease;
    }

    .currency-pill::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 50px;
        border: 1px solid transparent;
        background: linear-gradient(90deg, var(--gold-primary), transparent, var(--gold-primary)) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.3;
    }

    .currency-icon {
        width: 22px;
        height: 22px;
        fill: url(#gold-gradient);
        filter: drop-shadow(0 0 4px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        background: linear-gradient(to bottom, #fff, var(--gold-metallic));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.05em;
    }

    /* --- Hero Section (Center) --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 5rem;
        font-weight: 400;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
        margin-bottom: 1rem;
        text-shadow: 
            0 0 20px rgba(176, 38, 255, 0.6),
            0 0 40px rgba(176, 38, 255, 0.3),
            0 10px 30px rgba(0,0,0,0.8);
        position: relative;
        z-index: 2;
        background: linear-gradient(to bottom, #ffffff 20%, #a8a8a8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeDown 1.2s ease-out;
    }

    /* The Portal Effect */
    .portal-container {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        perspective: 1000px;
    }

    .portal-container:hover {
        transform: scale(1.02);
    }

    .portal-core {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--mystic-purple), #2a0a4a);
        box-shadow: 
            0 0 40px var(--mystic-purple),
            0 0 80px rgba(176, 38, 255, 0.5),
            inset 0 0 20px rgba(255,255,255,0.8);
        position: relative;
        z-index: 5;
        animation: breathe 4s ease-in-out infinite;
    }

    /* Portal Rings */
    .portal-ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
    }

    /* Ring 1: Gold, thin, fast */
    .ring-1 { 
        width: 200px; height: 200px; 
        border: 1px solid rgba(255, 215, 0, 0.4);
        border-top: 2px solid var(--gold-primary);
        border-bottom: 2px solid var(--gold-primary);
        animation: spin 10s linear infinite;
    }

    /* Ring 2: Purple, dashed, reverse */
    .ring-2 { 
        width: 260px; height: 260px; 
        border: 1px dashed var(--mystic-purple);
        animation: spin-rev 20s linear infinite;
        opacity: 0.7;
    }

    /* Ring 3: Complex geometric, slow */
    .ring-3 { 
        width: 310px; height: 310px; 
        border: 1px dotted rgba(255, 255, 255, 0.3);
        animation: spin 40s linear infinite;
    }
    
    /* Ring 4: Inner glow pulse */
    .ring-glow {
        width: 160px; height: 160px;
        border: 1px solid rgba(176, 38, 255, 0.2);
        box-shadow: 0 0 20px var(--mystic-purple);
        animation: pulseRing 3s ease-in-out infinite;
    }

    /* --- Grid Layout (Bottom) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding-bottom: 2rem;
        animation: fadeUp 1s ease-out 0.3s backwards;
    }

    /* --- Card Styles --- */
    .menu-card {
        position: relative;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: var(--card-radius);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        height: 180px;
        overflow: hidden;
    }

    /* Decorative Corner Marks */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid rgba(255, 255, 255, 0.03);
        pointer-events: none;
    }

    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(20, 10, 30, 0.8);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    .menu-card:hover .card-icon {
        transform: scale(1.15);
        filter: drop-shadow(0 0 15px currentColor);
    }

    /* Typography */
    .card-title {
        font-family: var(--font-display);
        font-size: 1.6rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-top: 0.8rem;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-subtitle {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
    }

    /* Icons */
    .card-icon {
        width: 48px;
        height: 48px;
        transition: all 0.4s ease;
        filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
    }

    /* --- Specific Card Aesthetics --- */

    /* 1. Summon (Primary - Top Left, Larger, Gold) */
    .menu-card.summon-card {
        grid-column: 1 / 2;
        grid-row: 1 / 3; /* Spans two rows height */
        height: 100%;
        background: linear-gradient(135deg, rgba(20, 15, 10, 0.9), rgba(40, 30, 15, 0.8));
        border: 1px solid var(--gold-dark);
        align-items: flex-start;
        text-align: left;
        padding: 2rem;
    }

    .menu-card.summon-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(45deg, transparent 40%, rgba(255, 215, 0, 0.05) 100%);
        pointer-events: none;
    }

    .menu-card.summon-card .card-icon {
        fill: var(--gold-primary);
        color: var(--gold-primary);
        width: 60px;
        height: 60px;
        margin-bottom: 1rem;
    }

    .menu-card.summon-card .card-title {
        color: var(--gold-light);
        font-size: 2.2rem;
        margin-top: 0;
        background: linear-gradient(to right, #fff, var(--gold-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .menu-card.summon-card:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.1), inset 0 0 20px rgba(255, 215, 0, 0.05);
    }

    /* 2. Roster (Top Right) */
    .menu-card.roster .card-icon { fill: var(--mystic-blue); color: var(--mystic-blue); }
    .menu-card.roster:hover { border-color: rgba(0, 180, 216, 0.4); box-shadow: 0 10px 30px rgba(0, 180, 216, 0.1); }
    
    /* 3. Battle (Bottom Left) */
    .menu-card.battle .card-icon { fill: var(--mystic-red); color: var(--mystic-red); }
    .menu-card.battle:hover { border-color: rgba(255, 77, 77, 0.4); box-shadow: 0 10px 30px rgba(255, 77, 77, 0.1); }

    /* 4. Grind (Bottom Right) */
    .menu-card.grind .card-icon { fill: var(--mystic-green); color: var(--mystic-green); }
    .menu-card.grind:hover { border-color: rgba(163, 255, 0, 0.4); box-shadow: 0 10px 30px rgba(163, 255, 0, 0.1); }


    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--mystic-purple); }
        50% { transform: scale(1.05); box-shadow: 0 0 60px var(--mystic-purple), 0 0 20px #fff; }
    }
    
    @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; margin-bottom: 1rem; }
        .menu-grid { grid-template-columns: 1fr; gap: 1rem; }
        .menu-card.summon-card { grid-column: 1; grid-row: auto; height: 140px; flex-direction: row; padding: 1rem; }
        .menu-card.summon-card .card-icon { width: 40px; height: 40px; margin-bottom: 0; }
        .menu-card.summon-card .card-title { font-size: 1.5rem; }
        .menu-card { height: 100px; flex-direction: row; text-align: left; padding: 0 1.5rem; justify-content: flex-start; gap: 1rem; }
        .card-title { margin-top: 0; font-size: 1.2rem; }
        .card-subtitle { display: none; }
        .card-icon { margin-bottom: 0; width: 40px; height: 40px; }
        .portal-container { width: 220px; height: 220px; }
        .portal-core { width: 80px; height: 80px; }
        .ring-1 { width: 140px; height: 140px; }
        .ring-2 { width: 180px; height: 180px; }
        .ring-3 { width: 210px; height: 210px; }
    }

</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
        <div class="noise-overlay"></div>
    </div>

    <!-- SVG Definitions for Gradients -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </linearGradient>
    </svg>

    <div class="game-container">
        <header>
            <div class="logo-area">
                <div class="logo-text">Aetherbound</div>
            </div>
            <div class="currency-pill">
                <!-- Gold Coin SVG -->
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v3H8v2h3v3h2v-3h3V10h-3V7z"/>
                    <circle cx="12" cy="12" r="9" fill="none" stroke="url(#gold-gradient)" stroke-width="1.5"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            
            <div class="portal-container" id="summon-portal">
                <div class="portal-core"></div>
                <div class="portal-ring ring-glow"></div>
                <div class="portal-ring ring-1"></div>
                <div class="portal-ring ring-2"></div>
                <div class="portal-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            
            <!-- Summon Card (Primary - Tall/Left) -->
            <div class="menu-card summon-card">
                <!-- Stylized Glowing Star/Spiral -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="currentColor" stroke-width="1" fill="currentColor"/>
                    <circle cx="12" cy="12" r="3" fill="#fff" opacity="0.8"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Awaken Spirits</div>
                </div>
            </div>

            <!-- Roster Card (Top Right) -->
            <div class="menu-card roster">
                <!-- Stylized Crest/Shield -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Team</div>
                </div>
            </div>

            <!-- Battle Card (Bottom Left) -->
            <div class="menu-card battle">
                <!-- Stylized Crossed Weapons/Rune -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6.92 5L5 7l3 3-1.41 1.41L2 11.73V14h2.27l-2 2L2 18l2 2 2-2 2 2 2-2-2-2 2-2 2 2 2-2-2-2 2-2-2-2 2-2-2-2-2 2-2-2 2-2zm10.16 0l-2 2 2 2 2-2-2-2zm-4.24 4.24l-2 2 2 2 2-2-2-2z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena</div>
                </div>
            </div>

            <!-- Grind Card (Bottom Right) -->
            <div class="menu-card grind">
                <!-- Stylized Lightning Bolt -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="currentColor"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Resources</div>
                </div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3; // Slower drift
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.4;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 1 : -1;
                // Color tint: mix of white and purple
                this.color = Math.random() > 0.5 ? '200, 200, 255' : '180, 140, 255';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir * 0.003;
                if (this.alpha >= 0.6 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Portal Effect (Parallax)
        const portal = document.getElementById('summon-portal');
        
        portal.addEventListener('mousemove', (e) => {
            const rect = portal.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = portal.querySelector('.portal-core');
            
            // Subtle parallax on the inner core
            core.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px) scale(1.05)`;
        });

        portal.addEventListener('mouseleave', () => {
             const core = portal.querySelector('.portal-core');
             core.style.transform = `translate(0px, 0px) scale(1)`;
        });

    </script>
</body>
</html>
