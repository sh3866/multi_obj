<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch: Collection</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-panel: rgba(10, 15, 30, 0.6);
    --accent-cyan: #00f0ff;
    --accent-purple: #bc13fe;
    --accent-orange: #ff8a00;
    --accent-green: #00ff9d;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-deep);
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
    cursor: none; /* Hide default cursor */
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header & HUD */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block {
    position: relative;
  }

  .title-block h1 {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
  }

  .title-block p {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    margin: 0.25rem 0 0 0;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1rem;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    padding: 0.6rem 1.2rem;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  /* Scanline effect on HUD */
  .stat-row::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.03), transparent);
    transform: translateY(-100%);
    animation: hudScan 4s linear infinite;
    pointer-events: none;
  }

  @keyframes hudScan {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }

  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: white;
    min-width: 2ch;
    text-align: right;
  }

  /* Energy Gauge */
  .gauge-container {
    width: 120px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .gauge-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
    box-shadow: 0 0 10px var(--accent-cyan);
    transition: width 0.2s ease-out;
  }

  /* Footer */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 1rem;
  }

  /* Holo Button */
  .action-btn {
    position: relative;
    background: rgba(0, 240, 255, 0.05);
    backdrop-filter: blur(4px);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 1rem 3rem;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
  }

  .action-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
    transition: 0.5s;
  }

  .action-btn:hover {
    background: rgba(0, 240, 255, 0.15);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    text-shadow: 0 0 8px var(--accent-cyan);
    transform: scale(1.02);
  }

  .action-btn:hover::before {
    left: 100%;
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 8, 0.9);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 1rem 2rem;
    border-radius: 2px;
    color: white;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast-icon {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 10px var(--accent-green);
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether Catch</h1>
        <p>Zone 7 // Bio-Scan Active</p>
      </div>
      
      <div class="hud-container">
        <!-- Collected Count -->
        <div class="stat-row">
          <span class="stat-label">Collection</span>
          <span class="stat-value" id="scoreVal">00</span>
        </div>
        
        <!-- Energy Gauge -->
        <div class="stat-row">
          <span class="stat-label">Net Charge</span>
          <div class="gauge-container">
            <div class="gauge-fill" id="energyBar"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">
      <div class="toast-icon"></div>
      <span>ENTITY SECURED</span>
    </div>

    <footer>
      <button class="action-btn" id="collectBtn">Open Collection</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * High-fidelity rendering with atmospheric depth and creature behaviors.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const energyBar = document.getElementById('energyBar');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;
let energy = 100;

// --- Configuration ---
const SPECIES = [
  { name: 'Nebula Mite', color: '#00f0ff', type: 'drifter', rarity: 'common' },
  { name: 'Void Jelly', color: '#bc13fe', type: 'bobber', rarity: 'rare' },
  { name: 'Ember Sprite', color: '#ff8a00', type: 'dasher', rarity: 'epic' }
];

// --- Resize ---
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 2 * speed;
    this.vx = Math.cos(angle) * velocity;
    this.vy = Math.sin(angle) * velocity;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.01;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95; // Friction
    this.vy *= 0.95;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Background Aether Dust
class AetherDust {
  constructor() {
    this.reset(true);
  }

  reset(init = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 1.5;
    this.speedX = (Math.random() - 0.5) * 0.2;
    this.speedY = (Math.random() - 0.5) * 0.2;
    this.alpha = Math.random() * 0.3;
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    
    if (this.x < 0) this.x = width;
    if (this.x > width) this.x = 0;
    if (this.y < 0) this.y = height;
    if (this.y > height) this.y = 0;
  }

  draw(ctx) {
    ctx.fillStyle = `rgba(200, 230, 255, ${this.alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Creature {
  constructor() {
    const spec = SPECIES[Math.floor(Math.random() * SPECIES.length)];
    this.species = spec;
    this.reset(true);
  }

  reset(initial = false) {
    this.radius = Math.random() * 10 + 15;
    
    // Spawn off-screen or random
    if (initial) {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    } else {
      // Spawn from edges
      if (Math.random() > 0.5) {
        this.x = Math.random() > 0.5 ? -50 : width + 50;
        this.y = Math.random() * height;
      } else {
        this.x = Math.random() * width;
        this.y = Math.random() > 0.5 ? -50 : height + 50;
      }
    }

    // Movement Logic based on Type
    const speedMult = this.species.type === 'dasher' ? 2.5 : 1;
    this.vx = (Math.random() - 0.5) * 2 * speedMult;
    this.vy = (Math.random() - 0.5) * 2 * speedMult;
    
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.05 + Math.random() * 0.05;
    
    this.history = [];
    this.historyLimit = 15;
  }

  update() {
    // Behavior based on type
    if (this.species.type === 'bobber') {
      this.y += Math.sin(time * 0.02 + this.wobble) * 0.5;
      this.x += this.vx * 0.5;
    } else if (this.species.type === 'dasher') {
      this.vx += (Math.random() - 0.5) * 0.5; // Erratic
      this.vy += (Math.random() - 0.5) * 0.5;
      // Cap speed
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) { this.vx *= 0.9; this.vy *= 0.9; }
      this.x += this.vx;
      this.y += this.vy;
    } else {
      // Drifter
      this.x += this.vx;
      this.y += this.vy;
    }

    // Bounce
    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
      // If too far off screen, reset
      this.reset(false);
    } else if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;

    // Trail
    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    const pulse = Math.sin(time * 0.1 + this.wobble) * 2;
    const r = this.radius + pulse;

    // Draw Trail
    ctx.beginPath();
    ctx.moveTo(this.history[0]?.x || this.x, this.history[0]?.y || this.y);
    for (let i = 1; i < this.history.length; i++) {
      ctx.lineTo(this.history[i].x, this.history[i].y);
    }
    ctx.strokeStyle = this.species.color;
    ctx.lineWidth = r / 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.2;
    ctx.stroke();
    ctx.globalAlpha = 1.0;

    // Draw Body (Glow)
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.species.color;
    
    // Main Body
    ctx.fillStyle = this.species.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
    
    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Features based on species
    ctx.shadowBlur = 0;
    
    if (this.species.type === 'drifter') {
      // Antennae
      ctx.strokeStyle = this.species.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - r);
      ctx.quadraticCurveTo(this.x + 10, this.y - r - 10, this.x + 15, this.y - r - 5);
      ctx.moveTo(this.x, this.y - r);
      ctx.quadraticCurveTo(this.x - 10, this.y - r - 10, this.x - 15, this.y - r - 5);
      ctx.stroke();
    } else if (this.species.type === 'bobber') {
      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(this.x - r*0.3, this.y - r*0.2, r*0.15, 0, Math.PI*2);
      ctx.arc(this.x + r*0.3, this.y - r*0.2, r*0.15, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 40;
    this.active = false;
  }

  update(mx, my) {
    this.x += (mx - this.x) * 0.15;
    this.y += (my - this.y) * 0.15;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Rotation
    ctx.rotate(time * 0.02);

    // Outer Ring (Scanner)
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius + 10, 0, Math.PI * 1.5);
    ctx.stroke();

    // Inner Ring (Solid)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // The Net Mesh
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 1;
    
    // Cross lines
    for(let i=0; i<4; i++) {
        ctx.rotate(Math.PI/4);
        ctx.moveTo(-this.radius, 0);
        ctx.lineTo(this.radius, 0);
    }
    ctx.stroke();

    // Handle (The Player Indicator)
    // Draw a small handle extending downwards relative to mouse (but simplified for rotation)
    ctx.rotate(-time * 0.02); // Counter-rotate for handle to stay somewhat grounded? No, let it spin.
    
    // "Player" Avatar representation attached to net
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -this.radius - 15, 6, 0, Math.PI*2);
    ctx.fill();
    
    // Connector
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -this.radius - 9);
    ctx.lineTo(0, -this.radius);
    ctx.stroke();

    ctx.restore();
    
    // Range Radar Pulse
    const pulseR = (time * 0.5) % 100;
    ctx.strokeStyle = `rgba(0, 240, 255, ${1 - pulseR/100})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius + pulseR, 0, Math.PI*2);
    ctx.stroke();
  }
}

// --- Game Logic ---

const creatures = [];
const particles = [];
const dust = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Init World
for(let i=0; i<50; i++) dust.push(new AetherDust());
for(let i=0; i<6; i++) creatures.push(new Creature());

// Input
window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', e => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Capture Logic
function attemptCapture() {
  // Visual feedback on button press
  energy = Math.max(0, energy - 10);
  updateUI();

  let caught = false;
  
  // Check collision
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < net.radius + c.radius + 20) { // Generous hit box
      // Capture Animation
      createExplosion(c.x, c.y, c.species.color);
      
      // Remove creature
      creatures.splice(i, 1);
      
      // Score
      score++;
      caught = true;
      
      // Respawn logic
      setTimeout(() => creatures.push(new Creature()), 2000);
    }
  }

  if (caught) {
    showToast();
  } else {
      // Miss feedback
      createExplosion(net.x, net.y, '#fff', 0.5);
  }
}

function createExplosion(x, y, color, speedMult = 1) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color, speedMult));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

function updateUI() {
  scoreEl.innerText = score < 10 ? `0${score}` : score;
  energyBar.style.width = `${energy}%`;
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// --- Rendering ---

function drawBackground() {
  // Deep Space Gradient
  const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(1, '#020205');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Subtle Nebula
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = 'rgba(100, 50, 255, 0.05)';
  ctx.beginPath();
  ctx.arc(width*0.8, height*0.2, 400, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0, 240, 255, 0.03)';
  ctx.beginPath();
  ctx.arc(width*0.2, height*0.8, 500, 0, Math.PI*2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

function animate() {
  time++;
  
  // Regenerate Energy
  if (energy < 100) {
    energy += 0.1;
    updateUI();
  }

  drawBackground();

  // Dust
  dust.forEach(d => { d.update(); d.draw(ctx); });

  // Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
