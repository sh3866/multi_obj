<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch // Field Interface</title>
<style>
  :root {
    --bg-deep: #05070a;
    --glass-panel: rgba(12, 18, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent-cyan: #00f0ff;
    --accent-purple: #bc13fe;
    --accent-orange: #ff8a00;
    --accent-green: #00ff9d;
    --accent-red: #ff2a2a;
    --text-main: #e2e8f0;
    --text-muted: #64748b;
    --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Device Frame - The "Screen" */
  .device-frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1600px;
    background: var(--bg-deep);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 100px rgba(0,0,0,0.9);
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: none;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
    /* Subtle vignette */
    background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.4) 100%);
  }

  /* Scanline Effect */
  .ui-layer::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.1) 3px
    );
    pointer-events: none;
    z-index: 20;
    opacity: 0.6;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand h1 {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
  }

  .brand span {
    font-size: 0.65rem;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.7;
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--glass-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 0.6rem 1.2rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: white;
    line-height: 1;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
  }

  /* Collection Slots Visual */
  .collection-slots {
    display: flex;
    gap: 4px;
    margin-left: 10px;
    border-left: 1px solid rgba(255,255,255,0.1);
    padding-left: 10px;
  }

  .slot {
    width: 6px;
    height: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    transition: all 0.3s ease;
  }
  .slot.filled {
    background: var(--accent-cyan);
    box-shadow: 0 0 8px var(--accent-cyan);
  }

  /* Footer */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 2rem;
    pointer-events: auto;
    gap: 2rem;
  }

  /* Collection Button (Critique Fix #1) */
  .collection-btn-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .collection-btn-wrapper:hover {
    transform: translateY(-2px);
  }

  .icon-box {
    width: 50px;
    height: 50px;
    background: var(--glass-panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-main);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  
  .icon-box:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255,255,255,0.2);
  }

  .collection-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Capture Button */
  .capture-btn-wrapper {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .charge-ring-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
    pointer-events: none;
  }

  .charge-ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.05);
    stroke-width: 4;
  }

  .charge-ring-fill {
    fill: none;
    stroke: var(--accent-cyan);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 226;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.1s linear;
    filter: drop-shadow(0 0 6px var(--accent-cyan));
  }

  .capture-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(0, 240, 255, 0.05);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--accent-cyan);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
    position: relative;
    z-index: 2;
  }

  .capture-btn:hover {
    background: rgba(0, 240, 255, 0.15);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    border-color: var(--accent-cyan);
  }

  .capture-btn:active {
    transform: scale(0.9);
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 10, 20, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--accent-green);
    padding: 1rem 2rem;
    border-radius: 4px;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 40px rgba(0, 255, 157, 0.1);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 30;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast-icon {
    width: 12px;
    height: 12px;
    background: var(--accent-green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-green);
  }

</style>
</head>
<body>

  <div class="device-frame">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
      <header>
        <div class="brand">
          <h1>Aether Catch</h1>
          <span>Field Scanner // V4.2</span>
        </div>
        
        <div class="hud-panel">
          <div class="stat-box">
            <span class="stat-label">Specimens</span>
            <span class="stat-value" id="scoreVal">00</span>
          </div>
          <!-- Visual representation of collection slots (Critique Fix #5) -->
          <div class="collection-slots" id="slotsContainer">
            <div class="slot"></div><div class="slot"></div><div class="slot"></div>
            <div class="slot"></div><div class="slot"></div><div class="slot"></div>
          </div>
        </div>
      </header>

      <div class="toast" id="toast">
        <div class="toast-icon"></div>
        <span>ENTITY SECURED</span>
      </div>

      <footer>
        <!-- Collection Button (Critique Fix #1) -->
        <div class="collection-btn-wrapper">
          <div class="icon-box">
            <!-- Grid/Trophy Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </div>
          <span class="collection-label">Collection</span>
        </div>

        <div class="capture-btn-wrapper">
          <!-- SVG Ring for Charge -->
          <svg class="charge-ring-svg" viewBox="0 0 80 80">
            <circle class="charge-ring-bg" cx="40" cy="40" r="36"></circle>
            <circle class="charge-ring-fill" id="energyRing" cx="40" cy="40" r="36"></circle>
          </svg>
          
          <button class="capture-btn" id="collectBtn">
            <!-- Simple Capture Icon -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </button>
        </div>
      </footer>
    </div>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Implemented Critique:
 * 1. Collection Button: Icon updated to grid, label added.
 * 2. Player: Added "Drone" avatar attached to net handle.
 * 3. Creatures: Added eyes, distinct shapes (Fish/Spirit), trails.
 * 4. Background: Added parallax stars and nebula clouds.
 * 5. Net/HUD: Glowing grid, slot visualization.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const slotsContainer = document.getElementById('slotsContainer');
const energyRing = document.getElementById('energyRing');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;
let energy = 100;

// Configuration
const SPECIES = [
  { name: 'Nebula Mite', color: '#00f0ff', type: 'drifter', rarity: 'common' },
  { name: 'Void Jelly', color: '#bc13fe', type: 'bobber', rarity: 'rare' },
  { name: 'Ember Sprite', color: '#ff8a00', type: 'dasher', rarity: 'epic' }
];

// --- Resize ---
function resize() {
  const parent = canvas.parentElement;
  width = parent.clientWidth;
  height = parent.clientHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 3 * speed;
    this.vx = Math.cos(angle) * velocity;
    this.vy = Math.sin(angle) * velocity;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.015;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Critique Fix #4: Deep Background
class Star {
  constructor() {
    this.reset(true);
  }

  reset(init = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 1.5 + 0.5;
    this.alpha = Math.random() * 0.5 + 0.1;
    this.parallaxFactor = Math.random() * 0.05 + 0.01; 
    this.twinkleSpeed = Math.random() * 0.05 + 0.01;
    this.twinkleOffset = Math.random() * Math.PI * 2;
  }

  update() {
    // Slow drift
    this.y -= 0.05;
    if (this.y < -10) this.y = height + 10;
    // Twinkle
    this.currentAlpha = this.alpha + Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.2;
  }

  draw(ctx) {
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.currentAlpha)})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Critique Fix #3: Enriched Creatures
class Creature {
  constructor() {
    const spec = SPECIES[Math.floor(Math.random() * SPECIES.length)];
    this.species = spec;
    this.reset(true);
  }

  reset(initial = false) {
    this.radius = Math.random() * 10 + 15;
    
    if (initial) {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    } else {
      // Spawn outside
      if (Math.random() > 0.5) {
        this.x = Math.random() > 0.5 ? -50 : width + 50;
        this.y = Math.random() * height;
      } else {
        this.x = Math.random() * width;
        this.y = Math.random() > 0.5 ? -50 : height + 50;
      }
    }

    const speedMult = this.species.type === 'dasher' ? 2.5 : 1;
    this.vx = (Math.random() - 0.5) * 2 * speedMult;
    this.vy = (Math.random() - 0.5) * 2 * speedMult;
    
    this.wobble = Math.random() * Math.PI * 2;
    this.history = [];
    this.historyLimit = 20;
    this.angle = 0;
  }

  update() {
    if (this.species.type === 'bobber') {
      this.y += Math.sin(time * 0.02 + this.wobble) * 1.5;
      this.x += this.vx * 0.2;
      this.angle = Math.sin(time * 0.01) * 0.2; // Gentle tilt
    } else if (this.species.type === 'dasher') {
      this.vx += (Math.random() - 0.5) * 0.2;
      this.vy += (Math.random() - 0.5) * 0.2;
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 6) { this.vx *= 0.9; this.vy *= 0.9; }
      this.x += this.vx;
      this.y += this.vy;
      this.angle = Math.atan2(this.vy, this.vx);
    } else {
      // Drifter
      this.x += this.vx;
      this.y += this.vy;
      this.angle += 0.005;
    }

    // Boundaries
    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
      this.reset(false);
    } else if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;

    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    const pulse = Math.sin(time * 0.1 + this.wobble) * 2;
    const r = this.radius + pulse;
    const color = this.species.color;

    // Trail (Critique Fix #3)
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for (let i = 1; i < this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.2;
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    ctx.fillStyle = color;

    // --- SPECIFIC SILHOUETTES (Critique Fix #3) ---

    if (this.species.type === 'drifter') {
      // Antennae
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(10, -r - 15, 15, -r - 5);
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(-10, -r - 15, -15, -r - 5);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // Main Body
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
    } 
    else if (this.species.type === 'bobber') {
      // Jelly Shape
      ctx.beginPath();
      ctx.arc(0, -r*0.2, r, Math.PI, 0); // Dome
      ctx.lineTo(r, r*0.5);
      ctx.quadraticCurveTo(r*0.5, r*0.8, 0, r*0.6);
      ctx.quadraticCurveTo(-r*0.5, r*0.8, -r, r*0.5);
      ctx.closePath();
      ctx.fill();
      
      // Eyes (Critique Fix #3)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r*0.3, -r*0.2, r*0.2, 0, Math.PI*2);
      ctx.arc(r*0.3, -r*0.2, r*0.2, 0, Math.PI*2);
      ctx.fill();
    } 
    else if (this.species.type === 'dasher') {
      // Fish/Comet Shape (Critique Fix #3)
      ctx.beginPath();
      ctx.moveTo(r*1.5, 0); // Nose
      ctx.lineTo(-r, -r);
      ctx.lineTo(-r*0.5, 0);
      ctx.lineTo(-r, r);
      ctx.closePath();
      ctx.fill();
      
      // Wing flap
      const wingY = Math.sin(time * 0.5) * r;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-r*0.5, wingY, -r*1.5, wingY*0.5);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Inner Core
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 50;
    this.angle = 0;
    this.pulseScale = 0;
  }

  update(mx, my) {
    // Smooth follow
    this.x += (mx - this.x) * 0.12;
    this.y += (my - this.y) * 0.12;
    
    // Rotate slightly based on movement
    this.angle += 0.01;
    
    if (this.pulseScale > 0) this.pulseScale -= 0.1;
  }

  triggerPulse() {
    this.pulseScale = 1;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // 1. The Net Mesh (Critique Fix #5: Softened with glow)
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.clip();

    ctx.rotate(this.angle);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 4;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.6)';
    
    // Draw Grid
    for(let i = -this.radius; i <= this.radius; i+=12) {
        ctx.moveTo(i, -this.radius);
        ctx.lineTo(i, this.radius);
        ctx.moveTo(-this.radius, i);
        ctx.lineTo(this.radius, i);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.rotate(-this.angle); // Rotate back

    // 2. The Rim
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 1.8);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 3. Handle & Player Avatar (Critique Fix #2)
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, this.radius);
    ctx.lineTo(0, this.radius + 25);
    ctx.stroke();

    // Player Avatar (Drone/Orb)
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(0, this.radius + 25, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // Drone Eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, this.radius + 25, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();

    // 4. Radar Pulse (Range indicator)
    const pulseR = (time * 0.8) % 60;
    ctx.strokeStyle = `rgba(0, 240, 255, ${0.3 * (1 - pulseR/60)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, pulseR, 0, Math.PI*2);
    ctx.stroke();

    // 5. Capture Pulse Animation
    if (this.pulseScale > 0) {
      ctx.strokeStyle = `rgba(0, 240, 255, ${this.pulseScale})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + (1 - this.pulseScale) * 40, 0, Math.PI*2);
      ctx.stroke();
    }
  }
}

// --- Game Logic ---

const creatures = [];
const particles = [];
const stars = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Init World
for(let i=0; i<100; i++) stars.push(new Star());
for(let i=0; i<6; i++) creatures.push(new Creature());

// Input
window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', e => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Capture Logic
function attemptCapture() {
  if (energy < 10) return; 

  net.triggerPulse();
  energy -= 20;
  updateUI();

  let caught = false;
  
  // Check collision
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < net.radius + c.radius) { 
      // Capture!
      createExplosion(c.x, c.y, c.species.color, 2);
      creatures.splice(i, 1);
      score++;
      caught = true;
      
      // Respawn
      setTimeout(() => creatures.push(new Creature()), 1500);
    }
  }

  if (caught) {
    showToast();
    updateSlots();
  } else {
    // Miss feedback
    createExplosion(net.x, net.y, '#fff', 0.5);
  }
}

function updateSlots() {
  const slots = document.querySelectorAll('.slot');
  const filledCount = score % 6; // Fill 6 slots then loop/reset visual
  slots.forEach((slot, index) => {
    if (index < filledCount) {
      slot.classList.add('filled');
    } else {
      slot.classList.remove('filled');
    }
  });
}

function createExplosion(x, y, color, speedMult = 1) {
  for (let i = 0; i < 15; i++) {
    particles.push(new Particle(x, y, color, speedMult));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1200);
}

function updateUI() {
  scoreEl.innerText = score < 10 ? `0${score}` : score;
  
  // Update Ring
  const offset = 226 - (226 * (energy / 100));
  energyRing.style.strokeDashoffset = offset;
  
  if (energy < 30) {
    energyRing.style.stroke = 'var(--accent-red)';
  } else {
    energyRing.style.stroke = 'var(--accent-cyan)';
  }
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// --- Rendering ---

function drawBackground() {
  // Deep Space Gradient
  const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height));
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(1, '#020205');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Nebula Clouds (Critique Fix #4)
  ctx.globalCompositeOperation = 'screen';
  
  // Purple Nebula
  ctx.fillStyle = 'rgba(188, 19, 254, 0.04)';
  ctx.beginPath();
  ctx.arc(width*0.8, height*0.2, 400, 0, Math.PI*2);
  ctx.fill();
  
  // Cyan Nebula
  ctx.fillStyle = 'rgba(0, 240, 255, 0.03)';
  ctx.beginPath();
  ctx.arc(width*0.2, height*0.8, 500, 0, Math.PI*2);
  ctx.fill();
  
  ctx.globalCompositeOperation = 'source-over';
}

function animate() {
  time++;
  
  // Regenerate Energy
  if (energy < 100) {
    energy += 0.15;
    updateUI();
  }

  drawBackground();

  // Parallax Stars
  stars.forEach(s => { s.update(); s.draw(ctx); });

  // Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

animate();

</script>
