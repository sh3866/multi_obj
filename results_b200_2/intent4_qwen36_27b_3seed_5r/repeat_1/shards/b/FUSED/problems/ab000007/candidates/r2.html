<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch // Device</title>
<style>
  :root {
    --bg-device: #1a1c20;
    --screen-bg: #05070a;
    --accent-cyan: #00f0ff;
    --accent-purple: #bc13fe;
    --accent-orange: #ff8a00;
    --accent-green: #00ff9d;
    --accent-red: #ff2a2a;
    --text-main: #e2e8f0;
    --text-muted: #7a8599;
    --glass-panel: rgba(10, 15, 30, 0.65);
    --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #0f1012;
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Device Frame */
  .device-frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 800px;
    background: var(--bg-device);
    box-shadow: 
      0 0 0 2px #333,
      0 0 0 5px #111,
      0 20px 50px rgba(0,0,0,0.8),
      inset 0 0 20px rgba(0,0,0,0.5);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .device-frame {
      border-radius: 0;
      max-width: 100%;
      max-height: 100%;
    }
  }

  /* The Screen Area */
  .screen-area {
    position: relative;
    flex: 1;
    background-color: var(--screen-bg);
    overflow: hidden;
    cursor: none; /* Hide default cursor inside game */
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem;
    background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  }

  /* Scanlines */
  .ui-layer::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 20;
  }

  /* Header HUD */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    z-index: 15;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand h1 {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  }

  .brand span {
    font-size: 0.6rem;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .hud-right {
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  .hud-panel {
    background: var(--glass-panel);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 0.55rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: white;
    line-height: 1;
  }

  /* Net Charge Indicator */
  .charge-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .charge-bar-bg {
    width: 80px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .charge-fill {
    height: 100%;
    width: 100%;
    background: var(--accent-cyan);
    box-shadow: 0 0 8px var(--accent-cyan);
    transition: width 0.1s linear, background-color 0.3s;
  }

  .charge-fill.low {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
  }

  /* Footer Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 1rem;
    pointer-events: auto;
    z-index: 15;
  }

  .capture-btn {
    position: relative;
    background: rgba(0, 240, 255, 0.05);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: var(--accent-cyan);
    padding: 0.8rem 2.5rem;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .capture-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s;
  }

  .capture-btn:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    transform: translateY(-2px);
  }

  .capture-btn:active {
    transform: translateY(1px);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
  }

  .capture-btn:hover::before {
    transform: translateX(100%);
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 10, 20, 0.95);
    border: 1px solid var(--accent-cyan);
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    color: white;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 30;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast-icon {
    width: 8px;
    height: 8px;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
  }

</style>
</head>
<body>

  <div class="device-frame">
    <div class="screen-area">
      <canvas id="gameCanvas"></canvas>
      
      <div class="ui-layer">
        <header>
          <div class="brand">
            <h1>Aether Catch</h1>
            <span>Scanner V4.2 // Active</span>
          </div>
          
          <div class="hud-right">
            <!-- Net Charge HUD -->
            <div class="hud-panel charge-container">
              <span class="stat-label">Net Power</span>
              <div class="charge-bar-bg">
                <div class="charge-fill" id="energyBar"></div>
              </div>
            </div>

            <!-- Collection Count -->
            <div class="hud-panel">
              <div class="stat-box">
                <span class="stat-label">Caught</span>
                <span class="stat-value" id="scoreVal">00</span>
              </div>
            </div>
          </div>
        </header>

        <div class="toast" id="toast">
          <div class="toast-icon"></div>
          <span>ENTITY SECURED</span>
        </div>

        <footer>
          <button class="capture-btn" id="collectBtn">
            <span>Deploy Net</span>
          </button>
        </footer>
      </div>
    </div>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Refined for silhouette diversity, environmental depth, and net mechanics.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const energyBar = document.getElementById('energyBar');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;
let energy = 100;

// --- Configuration ---
const SPECIES = [
  { name: 'Nebula Mite', color: '#00f0ff', type: 'drifter', rarity: 'common' },
  { name: 'Void Jelly', color: '#bc13fe', type: 'bobber', rarity: 'rare' },
  { name: 'Ember Sprite', color: '#ff8a00', type: 'dasher', rarity: 'epic' }
];

// --- Resize ---
function resize() {
  const parent = canvas.parentElement;
  width = parent.clientWidth;
  height = parent.clientHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, speed = 1) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 3 * speed;
    this.vx = Math.cos(angle) * velocity;
    this.vy = Math.sin(angle) * velocity;
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.015;
    this.size = Math.random() * 3 + 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// Parallax Background Stars/Debris
class Star {
  constructor() {
    this.reset(true);
  }

  reset(init = false) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 1.5 + 0.5;
    this.alpha = Math.random() * 0.5 + 0.1;
    this.parallaxFactor = Math.random() * 0.05; // Move slower than mouse
  }

  update() {
    // Subtle drift
    this.y -= 0.05;
    if (this.y < -10) this.y = height + 10;
  }

  draw(ctx) {
    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Creature {
  constructor() {
    const spec = SPECIES[Math.floor(Math.random() * SPECIES.length)];
    this.species = spec;
    this.reset(true);
  }

  reset(initial = false) {
    this.radius = Math.random() * 8 + 12;
    
    if (initial) {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    } else {
      if (Math.random() > 0.5) {
        this.x = Math.random() > 0.5 ? -50 : width + 50;
        this.y = Math.random() * height;
      } else {
        this.x = Math.random() * width;
        this.y = Math.random() > 0.5 ? -50 : height + 50;
      }
    }

    const speedMult = this.species.type === 'dasher' ? 2.5 : 1;
    this.vx = (Math.random() - 0.5) * 2 * speedMult;
    this.vy = (Math.random() - 0.5) * 2 * speedMult;
    
    this.wobble = Math.random() * Math.PI * 2;
    this.history = [];
    this.historyLimit = 10;
  }

  update() {
    if (this.species.type === 'bobber') {
      this.y += Math.sin(time * 0.02 + this.wobble) * 1.5;
      this.x += this.vx * 0.2;
    } else if (this.species.type === 'dasher') {
      this.vx += (Math.random() - 0.5) * 0.2;
      this.vy += (Math.random() - 0.5) * 0.2;
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) { this.vx *= 0.9; this.vy *= 0.9; }
      this.x += this.vx;
      this.y += this.vy;
    } else {
      this.x += this.vx;
      this.y += this.vy;
    }

    // Boundaries
    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
      this.reset(false);
    } else if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;

    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    const pulse = Math.sin(time * 0.1 + this.wobble) * 2;
    const r = this.radius + pulse;
    const color = this.species.color;

    // Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for (let i = 1; i < this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.3;
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    ctx.fillStyle = color;

    // DRAW SILHOUETTES
    if (this.species.type === 'drifter') {
      // Antennae
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(10, -r - 15, 15, -r - 5);
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(-10, -r - 15, -15, -r - 5);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // Body
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
    } 
    else if (this.species.type === 'bobber') {
      // Jelly shape
      ctx.beginPath();
      ctx.arc(0, -r*0.2, r, Math.PI, 0); // Dome
      ctx.lineTo(r, r*0.5);
      ctx.lineTo(r*0.5, r*0.2);
      ctx.lineTo(0, r*0.6);
      ctx.lineTo(-r*0.5, r*0.2);
      ctx.lineTo(-r, r*0.5);
      ctx.closePath();
      ctx.fill();
      
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r*0.3, -r*0.2, r*0.2, 0, Math.PI*2);
      ctx.arc(r*0.3, -r*0.2, r*0.2, 0, Math.PI*2);
      ctx.fill();
    } 
    else if (this.species.type === 'dasher') {
      // Winged / Comet shape
      ctx.beginPath();
      ctx.moveTo(r*1.5, 0); // Nose
      ctx.lineTo(-r, -r);
      ctx.lineTo(-r*0.5, 0);
      ctx.lineTo(-r, r);
      ctx.closePath();
      ctx.fill();
      
      // Wing flap
      const wingY = Math.sin(time * 0.5) * r;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-r*0.5, wingY, -r*1.5, wingY*0.5);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Inner Core
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 50;
    this.angle = 0;
  }

  update(mx, my) {
    // Smooth follow
    this.x += (mx - this.x) * 0.12;
    this.y += (my - this.y) * 0.12;
    
    // Rotate slightly based on movement
    this.angle += 0.01;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // 1. The Net Mesh (Visualizing the "Bag")
    // Draw a scoop shape facing "down" relative to rotation, or just a circle with grid
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Grid pattern
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    for(let i = -this.radius; i <= this.radius; i+=10) {
        // Diagonal lines
        ctx.moveTo(i, -Math.sqrt(Math.max(0, this.radius*this.radius - i*i)));
        ctx.lineTo(i, Math.sqrt(Math.max(0, this.radius*this.radius - i*i)));
    }
    ctx.stroke();

    // 2. The Rim (Scanner Ring)
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 1.8);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 5;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 3. The Handle / Player Indicator
    // Draw a line extending out from the net
    ctx.rotate(-this.angle); // Counter-rotate so handle always points to "bottom" or follows logic
    
    // Handle
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, this.radius);
    ctx.lineTo(0, this.radius + 35);
    ctx.stroke();

    // Handle Grip (Player Avatar)
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(0, this.radius + 35, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();

    // 4. Radar Pulse (Range indicator)
    const pulseR = (time * 0.8) % 60;
    ctx.strokeStyle = `rgba(0, 240, 255, ${0.4 * (1 - pulseR/60)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, pulseR, 0, Math.PI*2);
    ctx.stroke();
  }
}

// --- Game Logic ---

const creatures = [];
const particles = [];
const stars = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Init World
for(let i=0; i<60; i++) stars.push(new Star());
for(let i=0; i<5; i++) creatures.push(new Creature());

// Input
window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', e => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Capture Logic
function attemptCapture() {
  if (energy < 10) return; // Not enough charge

  // Visual feedback
  energy -= 15;
  updateUI();

  let caught = false;
  
  // Check collision
  // We check distance between Net Center and Creature Center
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < net.radius + c.radius) { 
      // Capture!
      createExplosion(c.x, c.y, c.species.color, 2);
      creatures.splice(i, 1);
      score++;
      caught = true;
      
      // Respawn
      setTimeout(() => creatures.push(new Creature()), 1500);
    }
  }

  if (caught) {
    showToast();
  } else {
    // Miss feedback (small spark at net)
    createExplosion(net.x, net.y, '#fff', 0.5);
  }
}

function createExplosion(x, y, color, speedMult = 1) {
  for (let i = 0; i < 12; i++) {
    particles.push(new Particle(x, y, color, speedMult));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1200);
}

function updateUI() {
  scoreEl.innerText = score < 10 ? `0${score}` : score;
  energyBar.style.width = `${energy}%`;
  
  if (energy < 30) {
    energyBar.classList.add('low');
  } else {
    energyBar.classList.remove('low');
  }
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// --- Rendering ---

function drawBackground() {
  // Deep Space Gradient
  const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height));
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(1, '#020205');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Subtle Nebula Clouds
  ctx.globalCompositeOperation = 'screen';
  
  // Purple Nebula
  ctx.fillStyle = 'rgba(188, 19, 254, 0.04)';
  ctx.beginPath();
  ctx.arc(width*0.8, height*0.2, 300, 0, Math.PI*2);
  ctx.fill();
  
  // Cyan Nebula
  ctx.fillStyle = 'rgba(0, 240, 255, 0.03)';
  ctx.beginPath();
  ctx.arc(width*0.2, height*0.8, 400, 0, Math.PI*2);
  ctx.fill();
  
  ctx.globalCompositeOperation = 'source-over';
}

function animate() {
  time++;
  
  // Regenerate Energy
  if (energy < 100) {
    energy += 0.15;
    updateUI();
  }

  drawBackground();

  // Parallax Stars
  stars.forEach(s => { s.update(); s.draw(ctx); });

  // Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
