<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #080014;
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffee00;
            --neon-purple: #bc13fe;
            --grid-color: rgba(188, 19, 254, 0.3);
            --font-main: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-main);
            color: white;
        }

        /* --- ATMOSPHERE --- */
        /* Scanlines with slight transparency */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 49;
        }

        /* --- CANVAS --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; 
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* --- TITLE --- */
        .title-container {
            margin-bottom: 0;
            text-align: center;
            position: relative;
            pointer-events: auto;
            /* Push title up towards the sun */
            margin-top: -15vh; 
            z-index: 20;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            line-height: 0.8;
            text-transform: uppercase;
            color: #fff;
            /* Pixelated Text Shadow/Glow */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: -4px;
            transform: skewX(-10deg);
            /* Force sharp aliasing */
            -webkit-font-smoothing: none;
            animation: titleFloat 4s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: skewX(-10deg) translateY(0); }
            50% { transform: skewX(-10deg) translateY(-10px); }
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            color: var(--neon-cyan);
            font-weight: bold;
            letter-spacing: 8px;
            margin-top: 10px;
            text-shadow: 2px 2px 0px #000; 
        }

        /* --- BUTTONS --- */
        .btn-container {
            pointer-events: auto;
            margin-top: -10px; /* Pull closer to hit line */
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-start {
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-main);
            font-size: 2.5rem;
            font-weight: bold;
            padding: 15px 70px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            box-shadow: 0 0 0 2px #000, 0 0 20px var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 4px;
            /* Retro angled corners */
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 0 2px #fff, 0 0 40px var(--neon-cyan);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* --- SUB MENU --- */
        .menu-options {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            pointer-events: auto;
            z-index: 25;
        }

        .menu-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 30px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0,0,0,0.6);
            transition: all 0.2s;
            cursor: pointer;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.8);
        }

        .menu-link:hover {
            color: #000;
            border-color: var(--neon-yellow);
            background: var(--neon-yellow);
            box-shadow: 0 0 15px var(--neon-yellow), 4px 4px 0 rgba(0,0,0,0.8);
            text-shadow: none;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 4rem; }
            h1 span { font-size: 1rem; letter-spacing: 4px; }
            .btn-start { font-size: 1.5rem; padding: 12px 40px; }
            .menu-options { gap: 15px; }
            .menu-link { font-size: 1rem; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>Pixel<br>Dance</h1>
            <span>System Online</span>
        </div>

        <div class="btn-container">
            <button class="btn-start" onclick="startGame()">START GAME</button>
        </div>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let frameCount = 0;

        // Configuration
        // Synthwave palette
        const laneColors = ['#ff0055', '#00f3ff', '#ffee00', '#bc13fe']; // Pink, Cyan, Yellow, Purple
        
        // Sun Configuration - Moved down slightly to let title breathe but keep it visible
        const sunY = 0.35; 
        const sunSize = 140; 
        
        // Stars
        const stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.45, 
                size: Math.random() < 0.9 ? 2 : 4, 
                alpha: Math.random(),
                speed: Math.random() * 0.05
            });
        }

        // Notes
        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            // Set internal resolution lower for pixelated look if desired, 
            // but for crisp UI we match window and use manual snapping.
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false; 
        }

        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING FUNCTIONS ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                const twinkle = Math.sin(time * 5 + star.x * 100) * 0.5 + 0.5;
                ctx.globalAlpha = star.alpha * (0.3 + 0.7 * twinkle);
                // Snap to pixel grid
                const x = Math.floor(star.x * width);
                const y = Math.floor(star.y * height);
                ctx.fillRect(x, y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Sun Glow
            const grd = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 4);
            grd.addColorStop(0, 'rgba(255, 100, 255, 0.4)');
            grd.addColorStop(0.5, 'rgba(255, 0, 100, 0.1)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffee00'; 
            ctx.fill();
            
            // Pixelated Stripes (The "Blind" look)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#080014'; // Matches background
            
            // Draw horizontal lines with increasing thickness
            const stripeCount = 12;
            const totalHeight = r * 2;
            const step = totalHeight / stripeCount;
            
            for(let i = 0; i < stripeCount; i++) {
                // Start below center to keep top of sun solid
                if (i < 5) continue; 
                
                // Calculate y position and thickness
                let y = cy - r + (i * step); 
                let h = step + (i * 2.5); // Gets thicker at bottom
                
                // Snap to pixels
                y = Math.floor(y);
                h = Math.floor(h);

                // Ensure we stay within circle bounds roughly
                if (y > cy - r) {
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawHighway() {
            // The Horizon is the bottom of the Sun
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            
            // Highway dimensions
            const bottomWidth = Math.min(width * 0.8, 900); 
            const topWidth = 40;
            
            // Lane Backgrounds
            for (let i = 0; i < 4; i++) {
                const laneWBottom = bottomWidth / 4;
                const laneWTop = topWidth / 4;
                
                const x1Bottom = centerX - (bottomWidth/2) + (i * laneWBottom);
                const x2Bottom = x1Bottom + laneWBottom;
                
                const x1Top = centerX - (topWidth/2) + (i * laneWTop);
                const x2Top = x1Top + laneWTop;

                ctx.beginPath();
                ctx.moveTo(x1Bottom, height);
                ctx.lineTo(x2Bottom, height);
                ctx.lineTo(x2Top, horizonY);
                ctx.lineTo(x1Top, horizonY);
                ctx.closePath();

                // Alternating subtle lane colors
                ctx.fillStyle = (i % 2 === 0) ? 'rgba(0, 243, 255, 0.03)' : 'rgba(188, 19, 254, 0.03)';
                ctx.fill();
                
                // Lane Borders
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.stroke();
            }

            // Horizontal Grid Lines (Moving)
            // Update time for animation
            time += 0.002;
            
            ctx.beginPath();
            const lineCount = 20;
            for (let i = 0; i < lineCount; i++) {
                let t = (i / lineCount + time) % 1;
                // Exponential spacing for perspective
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0); 
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            
            // Grid Gradient
            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, 'rgba(188, 19, 254, 0)');
            grad.addColorStop(0.2, 'rgba(188, 19, 254, 0.3)');
            grad.addColorStop(1, 'rgba(188, 19, 254, 0.8)');
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // --- NOTES LOGIC ---

        function spawnNote() {
            // Spawn rhythmically
            if (frameCount % 35 === 0) { 
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    hit: false
                });
                
                // Occasionally spawn double notes
                if (Math.random() > 0.75) {
                    let lane2 = (laneIdx + 1 + Math.floor(Math.random() * 2)) % 4;
                    notes.push({
                        lane: lane2,
                        t: 0,
                        active: true,
                        hit: false
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.8, 900);
            const topWidth = 40;

            notes.forEach(note => {
                note.t += 0.006; // Note speed
                
                if (note.t > 1.1) {
                    note.active = false;
                } else if (note.t > 0.9 && !note.hit) {
                    note.hit = true; 
                }

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0);
                
                const laneWidth = currentWidth / 4;
                const laneStartX = (centerX - currentWidth / 2);
                const laneCenterX = laneStartX + (note.lane * laneWidth) + (laneWidth / 2);

                // Note Size
                const noteSize = 8 + (laneWidth * 0.7) * Math.pow(t, 1.5);
                
                const color = laneColors[note.lane];
                ctx.fillStyle = color;
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                
                if(note.hit) {
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#fff';
                }

                // Draw Rectangular Note (Pixelated)
                ctx.fillRect(
                    Math.floor(laneCenterX - noteSize/2), 
                    Math.floor(y - noteSize/2), 
                    Math.floor(noteSize), 
                    Math.floor(noteSize)
                );
                
                // Inner detail (Pixel highlight)
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillRect(
                    Math.floor(laneCenterX - noteSize/4), 
                    Math.floor(y - noteSize/4), 
                    Math.floor(noteSize/2), 
                    Math.floor(noteSize/2)
                );

                ctx.shadowBlur = 0; 
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            
            const t = 0.92; // Where the "hit" happens visually
            const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
            const bottomWidth = Math.min(width * 0.8, 900);
            const topWidth = 40;
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0);
            
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f3ff'; // Cyan glow
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Key markers (D, F, J, K) - Larger and clearer
            const markers = ['D', 'F', 'J', 'K'];
            const laneWidth = currentWidth / 4;
            
            // Draw background for keys
            const keyBoxH = 40;
            const keyBoxW = 50;
            
            markers.forEach((m, i) => {
                const mx = (centerX - currentWidth/2) + (i * laneWidth) + (laneWidth/2);
                const my = y + 15;
                
                // Draw box
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(mx - keyBoxW/2, my, keyBoxW, keyBoxH);
                
                // Border
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(mx - keyBoxW/2, my, keyBoxW, keyBoxH);
                
                // Draw text
                ctx.fillStyle = '#ffee00'; // Yellow text
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(m, mx, my + keyBoxH/2);
            });
        }

        function animate() {
            frameCount++;
            
            ctx.fillStyle = '#080014';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawHighway();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = 'INITIALIZING...';
            btn.style.borderColor = '#ffee00';
            btn.style.color = '#ffee00';
            btn.style.boxShadow = '0 0 30px #ffee00';
            
            setTimeout(() => {
                alert('Game Started! (Demo End)');
                btn.innerHTML = 'START GAME';
                btn.style.borderColor = '';
                btn.style.color = '';
                btn.style.boxShadow = '';
            }, 800);
        }

        animate();

    </script>
</body>
</html>
