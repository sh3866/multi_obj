<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-deep: #050010;
            --bg-grid: #1a0b2e;
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffee00;
            --neon-purple: #bc13fe;
            --font-pixel: "Courier New", "Lucida Console", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            font-family: var(--font-pixel);
            color: white;
        }

        /* --- ATMOSPHERE & FX --- */
        
        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.8;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* CRT Flicker */
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.99; }
            50% { opacity: 0.95; }
            80% { opacity: 0.9; }
            100% { opacity: 0.97; }
        }

        /* --- CANVAS --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; 
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            animation: flicker 4s infinite;
        }

        /* --- TITLE --- */
        .title-container {
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
            pointer-events: auto;
            z-index: 20;
            /* Offset to sit above the highway visually */
            margin-top: -15vh; 
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            font-weight: 900;
            /* Clean Neon Glow instead of messy glitch */
            text-shadow: 
                0 0 10px rgba(255,255,255,0.8),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan),
                4px 4px 0px var(--neon-pink);
            letter-spacing: -4px;
            /* Slight skew for synthwave feel, but readable */
            transform: skewX(-8deg); 
            -webkit-font-smoothing: none;
        }

        h1 .word-dance {
            display: block;
            color: var(--neon-yellow);
            text-shadow: 
                0 0 10px rgba(255,255,255,0.8),
                0 0 30px var(--neon-yellow),
                4px 4px 0px var(--neon-purple);
            margin-top: -10px;
        }

        /* --- BUTTONS --- */
        .btn-container {
            pointer-events: auto;
            margin-top: 1rem;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* Retro Arcade Button Style */
        .btn-start {
            background: linear-gradient(180deg, #2a2a2a 0%, #111 100%);
            border: 4px solid #444;
            border-top: 4px solid #666;
            border-bottom: 4px solid #000;
            color: var(--neon-pink);
            font-family: var(--font-pixel);
            font-size: 2.5rem;
            font-weight: 900;
            padding: 15px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-shadow: 0 0 10px var(--neon-pink);
            letter-spacing: 4px;
            outline: none;
            /* Pixelated corners */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
        }

        .btn-start:hover {
            background: linear-gradient(180deg, #333 0%, #222 100%);
            color: #fff;
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px var(--neon-pink), 0 10px 20px rgba(0,0,0,0.5);
            text-shadow: 0 0 15px var(--neon-pink), 2px 2px 0 #000;
            transform: translateY(-2px);
        }

        .btn-start:active {
            transform: translateY(4px);
            border-top: 4px solid #000;
            border-bottom: 4px solid #666;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* --- SUB MENU --- */
        /* Moved out of highway area */
        .menu-options {
            display: flex;
            gap: 60px;
            pointer-events: auto;
            z-index: 25;
            margin-top: 10px;
        }

        .menu-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 20px;
            border: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.2);
        }

        .menu-link:hover {
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; letter-spacing: -2px; }
            h1 .word-dance { margin-top: -5px; }
            .btn-start { font-size: 1.8rem; padding: 12px 40px; }
            .menu-options { gap: 30px; }
            .menu-link { font-size: 1rem; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>
                Pixel<br>
                <span class="word-dance">Dance</span>
            </h1>
        </div>

        <div class="btn-container">
            <button class="btn-start" onclick="startGame()">START GAME</button>
            
            <div class="menu-options">
                <a class="menu-link" onclick="alert('Options Menu Placeholder')">Options</a>
                <a class="menu-link" onclick="alert('Credits: Design by AI')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let frameCount = 0;

        // Configuration
        const laneColors = ['#ff0055', '#00f3ff', '#ffee00', '#bc13fe'];
        
        // Sun Configuration
        const sunY = 0.35; 
        const sunSize = 150; 
        
        // Stars
        const stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.40, 
                size: Math.random() < 0.8 ? 2 : 3, // Larger stars for pixel look
                alpha: Math.random(),
                speed: Math.random() * 0.05
            });
        }

        // Notes
        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false; 
        }

        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING FUNCTIONS ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                const twinkle = Math.sin(time * 5 + star.x * 100) * 0.5 + 0.5;
                ctx.globalAlpha = star.alpha * (0.4 + 0.6 * twinkle);
                const x = Math.floor(star.x * width);
                const y = Math.floor(star.y * height);
                // Draw square stars for pixel feel
                ctx.fillRect(x, y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Sun Glow (Soft, atmospheric)
            const grd = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 4);
            grd.addColorStop(0, 'rgba(255, 100, 255, 0.5)');
            grd.addColorStop(0.5, 'rgba(255, 0, 100, 0.2)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffee00'; 
            ctx.fill();
            
            // Pixelated Stripes (The Classic Synthwave Sun)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050010'; // Matches background
            
            const stripeCount = 10;
            const totalHeight = r * 2;
            const step = totalHeight / stripeCount;
            
            for(let i = 0; i < stripeCount; i++) {
                // Only draw bottom half stripes
                if (i < 5) continue; 
                
                let y = cy - r + (i * step); 
                let h = step + (i * 2.5); // Increasing height for perspective
                
                y = Math.floor(y);
                h = Math.floor(h);
                
                if (y > cy - r) {
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawHighway() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            
            const bottomWidth = Math.min(width * 0.95, 1200); 
            const topWidth = 40;
            
            // 1. Draw Floor Base
            const floorGrad = ctx.createLinearGradient(0, horizonY, 0, height);
            floorGrad.addColorStop(0, 'rgba(188, 19, 254, 0)');
            floorGrad.addColorStop(1, 'rgba(188, 19, 254, 0.15)');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, horizonY, width, height - horizonY);

            // 2. Draw Lanes (Subtle)
            for (let i = 0; i < 4; i++) {
                const laneWBottom = bottomWidth / 4;
                const laneWTop = topWidth / 4;
                
                const x1Bottom = centerX - (bottomWidth/2) + (i * laneWBottom);
                const x2Bottom = x1Bottom + laneWBottom;
                
                const x1Top = centerX - (topWidth/2) + (i * laneWTop);
                const x2Top = x1Top + laneWTop;

                ctx.beginPath();
                ctx.moveTo(x1Bottom, height);
                ctx.lineTo(x2Bottom, height);
                ctx.lineTo(x2Top, horizonY);
                ctx.lineTo(x1Top, horizonY);
                ctx.closePath();

                // Faint lane fills
                ctx.fillStyle = (i % 2 === 0) ? 'rgba(0, 243, 255, 0.03)' : 'rgba(188, 19, 254, 0.03)';
                ctx.fill();
                
                // Lane Borders
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(188, 19, 254, 0.5)';
                ctx.stroke();
            }

            // 3. Moving Horizontal Grid
            time += 0.003;
            
            ctx.beginPath();
            const lineCount = 20;
            for (let i = 0; i < lineCount; i++) {
                let t = (i / lineCount + time) % 1;
                
                // Exponential spacing for perspective
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                
                // Width calculation at this Y
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0); 
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            
            // Grid Gradient - Brighter at bottom
            const gridGrad = ctx.createLinearGradient(0, horizonY, 0, height);
            gridGrad.addColorStop(0, 'rgba(0, 243, 255, 0)');
            gridGrad.addColorStop(0.5, 'rgba(0, 243, 255, 0.3)');
            gridGrad.addColorStop(1, 'rgba(0, 243, 255, 0.8)');
            
            ctx.strokeStyle = gridGrad;
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function spawnNote() {
            // Spawn logic
            if (frameCount % 40 === 0) { 
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    hit: false
                });
                // Occasional double notes
                if (Math.random() > 0.8) {
                    let lane2 = (laneIdx + 1 + Math.floor(Math.random() * 2)) % 4;
                    notes.push({
                        lane: lane2,
                        t: 0,
                        active: true,
                        hit: false
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.95, 1200);
            const topWidth = 40;

            notes.forEach(note => {
                note.t += 0.006; 
                
                if (note.t > 1.1) {
                    note.active = false;
                } else if (note.t > 0.9 && !note.hit) {
                    note.hit = true; 
                }

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0);
                
                const laneWidth = currentWidth / 4;
                const laneStartX = (centerX - currentWidth / 2);
                const laneCenterX = laneStartX + (note.lane * laneWidth) + (laneWidth / 2);

                // Size grows exponentially
                const noteSize = 10 + (laneWidth * 0.6) * Math.pow(t, 1.5);
                
                const color = laneColors[note.lane];
                ctx.fillStyle = color;
                
                // Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                
                if(note.hit) {
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#fff';
                }

                // Draw pixelated block
                ctx.fillRect(
                    Math.floor(laneCenterX - noteSize/2), 
                    Math.floor(y - noteSize/2), 
                    Math.floor(noteSize), 
                    Math.floor(noteSize)
                );
                
                // Inner highlight
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillRect(
                    Math.floor(laneCenterX - noteSize/4), 
                    Math.floor(y - noteSize/4), 
                    Math.floor(noteSize/2), 
                    Math.floor(noteSize/2)
                );

                ctx.shadowBlur = 0; 
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            
            // Target line position
            const t = 0.92; 
            const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
            const bottomWidth = Math.min(width * 0.95, 1200);
            const topWidth = 40;
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0);
            
            // 1. The Hit Line (Sharp Neon Strip)
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00f3ff';
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // 2. The Keys (D F J K) - Distinct Neon Blocks
            const markers = ['D', 'F', 'J', 'K'];
            const laneWidth = currentWidth / 4;
            
            // Button Dimensions
            const btnW = 50;
            const btnH = 50;
            
            markers.forEach((m, i) => {
                const mx = (centerX - currentWidth/2) + (i * laneWidth) + (laneWidth/2);
                // Position below hit line
                const my = y + 20;
                
                // Draw Key Block
                const color = laneColors[i];
                
                // Block Body
                ctx.fillStyle = '#050010';
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                
                ctx.fillRect(mx - btnW/2, my, btnW, btnH);
                ctx.strokeRect(mx - btnW/2, my, btnW, btnH);
                
                // Text
                ctx.fillStyle = color;
                ctx.font = 'bold 28px "Courier New"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 10;
                ctx.fillText(m, mx, my + btnH/2 + 2);
                
                ctx.shadowBlur = 0;
            });
        }

        function animate() {
            frameCount++;
            
            // Clear
            ctx.fillStyle = '#050010';
            ctx.fillRect(0, 0, width, height);

            // Draw layers
            drawStarfield();
            drawSun();
            drawHighway();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerHTML;
            
            // Arcade click effect
            btn.style.transform = "scale(0.95)";
            btn.style.filter = "brightness(1.5)";
            btn.innerHTML = 'LOADING...';
            
            setTimeout(() => {
                alert('Game Started! (Demo End)');
                btn.innerHTML = originalText;
                btn.style.transform = "";
                btn.style.filter = "";
            }, 600);
        }

        animate();

    </script>
</body>
</html>
