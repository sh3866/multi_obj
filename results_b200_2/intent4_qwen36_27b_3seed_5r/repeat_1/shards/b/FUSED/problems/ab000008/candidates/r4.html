<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-deep: #05000a;
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffee00;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(0, 10, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-main: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            font-family: var(--font-main);
            color: white;
        }

        /* --- ATMOSPHERE --- */
        /* CRT Scanlines - Enhanced */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 1px,
                rgba(0,0,0,0.25) 2px,
                rgba(0,0,0,0.25) 3px
            );
            background-size: 100% 3px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
            mix-blend-mode: overlay;
        }

        /* Vignette & Glow */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Chromatic Aberration Animation Keyframes */
        @keyframes glitch-anim {
            0% { text-shadow: -3px 0 var(--neon-pink), 3px 0 var(--neon-cyan); transform: skewX(-12deg); }
            2% { text-shadow: 3px 0 var(--neon-pink), -3px 0 var(--neon-cyan); transform: skewX(-12deg); }
            4% { text-shadow: -3px 0 var(--neon-pink), 3px 0 var(--neon-cyan); transform: skewX(-12deg); }
            100% { text-shadow: -3px 0 var(--neon-pink), 3px 0 var(--neon-cyan); transform: skewX(-12deg); }
        }

        @keyframes titleFloat {
            0%, 100% { transform: skewX(-12deg) translateY(0); }
            50% { transform: skewX(-12deg) translateY(-15px); }
        }

        /* --- CANVAS --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; 
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* --- TITLE --- */
        .title-container {
            margin-bottom: 0;
            text-align: center;
            position: relative;
            pointer-events: auto;
            margin-top: -10vh;
            z-index: 20;
        }

        h1 {
            font-size: 7rem;
            margin: 0;
            line-height: 0.8;
            text-transform: uppercase;
            color: #fff;
            /* Base Pixel Shadow */
            text-shadow: 
                4px 4px 0px #000,
                -2px -2px 0px #000;
            letter-spacing: -5px;
            transform: skewX(-12deg);
            -webkit-font-smoothing: none;
            animation: titleFloat 4s ease-in-out infinite;
            position: relative;
        }

        /* The Glitch Layer */
        h1::before {
            content: "Pixel\nDance";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #fff;
            white-space: pre; /* Keeps the break */
            z-index: -1;
            animation: glitch-anim 3s infinite linear alternate-reverse;
            opacity: 0.8;
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            color: var(--neon-yellow);
            font-weight: bold;
            letter-spacing: 12px;
            margin-top: 15px;
            text-shadow: 0 0 10px var(--neon-yellow); 
            transform: skewX(0); /* Counteract parent skew slightly for readability */
            animation: none;
        }

        /* --- BUTTONS --- */
        .btn-container {
            pointer-events: auto;
            margin-top: -5px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Start Button: Glassmorphism + Glow */
        .btn-start {
            background: rgba(0, 20, 40, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 243, 255, 0.5);
            color: var(--neon-cyan);
            font-family: var(--font-main);
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
            text-shadow: 0 0 8px var(--neon-cyan);
            letter-spacing: 6px;
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
        }

        .btn-start:hover {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6), inset 0 0 10px var(--neon-cyan);
            transform: scale(1.02) skewX(-2deg);
            text-shadow: 0 0 15px var(--neon-cyan);
            color: #fff;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* --- SUB MENU --- */
        .menu-options {
            margin-top: 20px;
            display: flex;
            gap: 40px;
            pointer-events: auto;
            z-index: 25;
        }

        /* Unified UI: Smaller, Glowing Outlines */
        .menu-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0,0,0,0.3);
            transition: all 0.2s;
            cursor: pointer;
            letter-spacing: 2px;
            backdrop-filter: blur(2px);
        }

        .menu-link:hover {
            color: var(--neon-purple);
            border-color: var(--neon-purple);
            background: rgba(188, 19, 254, 0.1);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
            text-shadow: 0 0 5px var(--neon-purple);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 4.5rem; }
            h1 span { font-size: 1rem; letter-spacing: 6px; }
            .btn-start { font-size: 1.5rem; padding: 12px 40px; }
            .menu-options { gap: 20px; }
            .menu-link { font-size: 0.9rem; padding: 6px 15px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <!-- The \n is handled via CSS white-space: pre in the pseudo element -->
            <h1>Pixel<br>Dance</h1>
            <span>System Online</span>
        </div>

        <div class="btn-container">
            <button class="btn-start" onclick="startGame()">START GAME</button>
            
            <div class="menu-options">
                <a class="menu-link">Options</a>
                <a class="menu-link">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let frameCount = 0;

        // Configuration
        const laneColors = ['#ff0055', '#00f3ff', '#ffee00', '#bc13fe'];
        
        // Sun Configuration
        const sunY = 0.35; 
        const sunSize = 140; 
        
        // Stars
        const stars = [];
        for(let i=0; i<250; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.45, 
                size: Math.random() < 0.9 ? 1 : 2, 
                alpha: Math.random(),
                speed: Math.random() * 0.05
            });
        }

        // Notes
        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false; 
        }

        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING FUNCTIONS ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                const twinkle = Math.sin(time * 5 + star.x * 100) * 0.5 + 0.5;
                ctx.globalAlpha = star.alpha * (0.3 + 0.7 * twinkle);
                const x = Math.floor(star.x * width);
                const y = Math.floor(star.y * height);
                ctx.fillRect(x, y, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Sun Glow (Bigger, more intense)
            const grd = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 5);
            grd.addColorStop(0, 'rgba(255, 100, 255, 0.6)');
            grd.addColorStop(0.4, 'rgba(255, 0, 100, 0.3)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffee00'; 
            ctx.fill();
            
            // Pixelated Stripes
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#05000a'; // Matches new background
            
            const stripeCount = 14;
            const totalHeight = r * 2;
            const step = totalHeight / stripeCount;
            
            for(let i = 0; i < stripeCount; i++) {
                if (i < 6) continue; 
                let y = cy - r + (i * step); 
                let h = step + (i * 3.5); 
                y = Math.floor(y);
                h = Math.floor(h);
                if (y > cy - r) {
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawHighway() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            
            const bottomWidth = Math.min(width * 0.9, 1000); 
            const topWidth = 40;
            
            // 1. Draw Floor Gradient to ground perspective (Critique Point 3)
            const floorGrad = ctx.createLinearGradient(0, horizonY, 0, height);
            floorGrad.addColorStop(0, 'rgba(188, 19, 254, 0)');
            floorGrad.addColorStop(0.4, 'rgba(188, 19, 254, 0.1)');
            floorGrad.addColorStop(1, 'rgba(188, 19, 254, 0.3)');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, horizonY, width, height - horizonY);

            // 2. Draw Lanes
            for (let i = 0; i < 4; i++) {
                const laneWBottom = bottomWidth / 4;
                const laneWTop = topWidth / 4;
                
                const x1Bottom = centerX - (bottomWidth/2) + (i * laneWBottom);
                const x2Bottom = x1Bottom + laneWBottom;
                
                const x1Top = centerX - (topWidth/2) + (i * laneWTop);
                const x2Top = x1Top + laneWTop;

                ctx.beginPath();
                ctx.moveTo(x1Bottom, height);
                ctx.lineTo(x2Bottom, height);
                ctx.lineTo(x2Top, horizonY);
                ctx.lineTo(x1Top, horizonY);
                ctx.closePath();

                // Higher opacity lane fills
                ctx.fillStyle = (i % 2 === 0) ? 'rgba(0, 243, 255, 0.05)' : 'rgba(188, 19, 254, 0.05)';
                ctx.fill();
                
                // Lane Borders - Solid
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.stroke();
            }

            // 3. Horizontal Grid Lines (Moving) - Increased Opacity (Critique Point 3)
            time += 0.0025;
            
            ctx.beginPath();
            const lineCount = 25;
            for (let i = 0; i < lineCount; i++) {
                let t = (i / lineCount + time) % 1;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0); 
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            
            // Grid Gradient - Stronger Color
            const gridGrad = ctx.createLinearGradient(0, horizonY, 0, height);
            gridGrad.addColorStop(0, 'rgba(188, 19, 254, 0)');
            gridGrad.addColorStop(0.3, 'rgba(188, 19, 254, 0.8)');
            gridGrad.addColorStop(1, 'rgba(188, 19, 254, 1)');
            
            ctx.strokeStyle = gridGrad;
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spawnNote() {
            if (frameCount % 35 === 0) { 
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    hit: false
                });
                if (Math.random() > 0.75) {
                    let lane2 = (laneIdx + 1 + Math.floor(Math.random() * 2)) % 4;
                    notes.push({
                        lane: lane2,
                        t: 0,
                        active: true,
                        hit: false
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.9, 1000);
            const topWidth = 40;

            notes.forEach(note => {
                note.t += 0.006; 
                
                if (note.t > 1.1) {
                    note.active = false;
                } else if (note.t > 0.9 && !note.hit) {
                    note.hit = true; 
                }

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0);
                
                const laneWidth = currentWidth / 4;
                const laneStartX = (centerX - currentWidth / 2);
                const laneCenterX = laneStartX + (note.lane * laneWidth) + (laneWidth / 2);

                const noteSize = 10 + (laneWidth * 0.7) * Math.pow(t, 1.5);
                
                const color = laneColors[note.lane];
                ctx.fillStyle = color;
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                
                if(note.hit) {
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#fff';
                }

                ctx.fillRect(
                    Math.floor(laneCenterX - noteSize/2), 
                    Math.floor(y - noteSize/2), 
                    Math.floor(noteSize), 
                    Math.floor(noteSize)
                );
                
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillRect(
                    Math.floor(laneCenterX - noteSize/4), 
                    Math.floor(y - noteSize/4), 
                    Math.floor(noteSize/2), 
                    Math.floor(noteSize/2)
                );

                ctx.shadowBlur = 0; 
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = Math.floor(height * sunY + sunSize);
            const centerX = width / 2;
            
            const t = 0.92; 
            const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
            const bottomWidth = Math.min(width * 0.9, 1000);
            const topWidth = 40;
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.0);
            
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f3ff';
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // --- PIXELATED ARCADE BUTTONS (Critique Point 5) ---
            const markers = ['D', 'F', 'J', 'K'];
            const laneWidth = currentWidth / 4;
            
            // Button Dimensions
            const btnW = 40;
            const btnH = 40;
            
            markers.forEach((m, i) => {
                const mx = (centerX - currentWidth/2) + (i * laneWidth) + (laneWidth/2);
                // Position slightly below the hit line
                const my = y + 10;
                
                // 1. Shadow (3D depth)
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(mx - btnW/2 + 4, my + 4, btnW, btnH);

                // 2. Base Button Color
                ctx.fillStyle = '#222';
                ctx.fillRect(mx - btnW/2, my, btnW, btnH);

                // 3. Bevel Highlight (Top/Left)
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.moveTo(mx - btnW/2, my + btnH);
                ctx.lineTo(mx - btnW/2, my);
                ctx.lineTo(mx + btnW/2, my);
                ctx.lineTo(mx + btnW/2 - 4, my + 4);
                ctx.lineTo(mx - 4, btnH + 4); // Logic fix needed for generic polygon but rect works for bevel
                ctx.fill();
                
                // Simpler bevel rects
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(mx - btnW/2, my, btnW, 2); // Top
                ctx.fillRect(mx - btnW/2, my, 2, btnH); // Left

                // 4. Bevel Shadow (Bottom/Right)
                ctx.fillStyle = '#000';
                ctx.fillRect(mx - btnW/2, my + btnH - 2, btnW, 2); // Bottom
                ctx.fillRect(mx + btnW/2 - 2, my, 2, btnH); // Right

                // 5. Text
                ctx.fillStyle = laneColors[i]; // Match lane color
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Text Shadow for legibility
                ctx.shadowColor = laneColors[i];
                ctx.shadowBlur = 5;
                ctx.fillText(m, mx, my + btnH/2 + 2);
                ctx.shadowBlur = 0;
            });
        }

        function animate() {
            frameCount++;
            
            ctx.fillStyle = '#05000a';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawHighway();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerHTML;
            
            // Glitch effect on click
            btn.style.transform = "scale(0.95)";
            btn.style.filter = "hue-rotate(90deg)";
            btn.innerHTML = 'LOADING...';
            
            setTimeout(() => {
                alert('Game Started! (Demo End)');
                btn.innerHTML = originalText;
                btn.style.transform = "";
                btn.style.filter = "";
            }, 500);
        }

        animate();

    </script>
</body>
</html>
