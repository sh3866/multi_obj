<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --grid-color: rgba(255, 0, 255, 0.3);
            --lane-1: #ff00ff;
            --lane-2: #00ffff;
            --lane-3: #00ffff;
            --lane-4: #ff00ff;
            --font-pixel: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-pixel);
        }

        /* --- ATMOSPHERE & OVERLAYS --- */
        
        /* CRT Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            animation: scanlineScroll 8s linear infinite;
        }

        @keyframes scanlineScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- CANVAS SCENE --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Crisp pixel rendering for canvas */
            image-rendering: pixelated; 
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* --- TITLE DESIGN (Priority 2) --- */
        .title-container {
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            pointer-events: auto;
            margin-top: -10vh; /* Shift up slightly */
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            /* Pixelated Text Shadow/Glow */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: -2px;
            transform: skewX(-10deg);
            /* Sharp Aliasing */
            -webkit-font-smoothing: none;
            animation: titleFloat 4s ease-in-out infinite;
        }

        /* Glitch Animation */
        @keyframes titleFloat {
            0%, 100% { transform: skewX(-10deg) translateY(0); }
            50% { transform: skewX(-10deg) translateY(-10px); }
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            color: var(--neon-yellow);
            letter-spacing: 8px;
            margin-top: 15px;
            text-shadow: 2px 2px 0px #000; /* Sharp shadow */
        }

        /* --- BUTTONS (Priority 3) --- */
        .btn-container {
            pointer-events: auto;
            margin-top: 20px;
            z-index: 20;
        }

        .btn-start {
            background: rgba(0, 0, 0, 0.6); /* Semi-transparent to show grid */
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-pixel);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 15px 70px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* Pixelated Border Box Shadow */
            box-shadow: 0 0 0 2px #000, 6px 6px 0 rgba(0,255,255,0.4);
            text-shadow: 0 0 5px var(--neon-cyan);
            letter-spacing: 2px;
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 0 2px #fff, 8px 8px 0 rgba(0,255,255,0.8);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- SUB MENU --- */
        .menu-options {
            margin-top: 40px;
            display: flex;
            gap: 60px;
            pointer-events: auto;
        }

        .menu-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
        }

        .menu-link:hover {
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 10px var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 1rem; letter-spacing: 4px; }
            .btn-start { font-size: 1.2rem; padding: 12px 40px; }
            .menu-options { gap: 20px; }
            .menu-link { font-size: 0.9rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>Pixel<br>Dance</h1>
            <span>Rhythm Protocol</span>
        </div>

        <div class="btn-container">
            <button class="btn-start" onclick="startGame()">PRESS TO START</button>
        </div>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Configuration
        const laneColors = ['#ff00ff', '#00ffff', '#00ffff', '#ff00ff']; // P, C, C, P
        
        // Sun Configuration
        const sunY = 0.35; // Percentage of height
        const sunSize = 180; // Larger sun
        
        // Stars
        const stars = [];
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4, // Sky only
                size: Math.random() < 0.9 ? 2 : 4, // Some big stars
                alpha: Math.random(),
                speed: Math.random() * 0.02
            });
        }

        // Notes
        const notes = [];
        let frameCount = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Reset context quality
            ctx.imageSmoothingEnabled = false; 
        }

        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING FUNCTIONS ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                const twinkle = Math.sin(time * 10 + star.x * 100) * 0.5 + 0.5;
                ctx.globalAlpha = star.alpha * (0.3 + 0.7 * twinkle);
                // Draw pixel square
                ctx.fillRect(star.x * width, star.y * height, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Sun Glow (Gradient)
            const grd = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 3);
            grd.addColorStop(0, 'rgba(255, 100, 255, 0.4)');
            grd.addColorStop(0.5, 'rgba(255, 0, 100, 0.2)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffff00'; 
            ctx.fill();
            
            // Horizontal Stripes (The "Blind" look)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050011'; // Cut out color matches bg
            const stripeCount = 12;
            const totalHeight = r * 2;
            const step = totalHeight / stripeCount;
            
            for(let i = 0; i < stripeCount; i++) {
                // Get thicker at bottom
                let y = cy - r + (i * step) + (i*i * 0.5); 
                let h = step - 2 + (i * 1.5);
                if (y > cy - r) {
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawHighway() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            
            // Perspective Constants
            const bottomWidth = Math.min(width * 0.9, 800); // Wider highway
            const topWidth = 60;
            
            // Lane Backgrounds (Priority 1: Distinct Lanes)
            // We draw 4 trapezoids
            for (let i = 0; i < 4; i++) {
                // Calculate X coordinates for this lane at top and bottom
                const laneWBottom = bottomWidth / 4;
                const laneWTop = topWidth / 4;
                
                const x1Bottom = centerX - (bottomWidth/2) + (i * laneWBottom);
                const x2Bottom = x1Bottom + laneWBottom;
                
                const x1Top = centerX - (topWidth/2) + (i * laneWTop);
                const x2Top = x1Top + laneWTop;

                // Draw Lane Fill
                ctx.beginPath();
                ctx.moveTo(x1Bottom, height);
                ctx.lineTo(x2Bottom, height);
                ctx.lineTo(x2Top, horizonY);
                ctx.lineTo(x1Top, horizonY);
                ctx.closePath();

                // Alternating subtle colors
                ctx.fillStyle = (i % 2 === 0) ? 'rgba(255, 0, 255, 0.05)' : 'rgba(0, 255, 255, 0.05)';
                ctx.fill();
                
                // Draw Lane Borders (Thick lines)
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
            }

            // Horizontal Grid Lines (Moving)
            // Logarithmic spacing for perspective effect
            const speed = 0.003;
            time += speed;
            
            // Calculate grid lines
            // We map linear t [0, 1] to perspective y
            ctx.beginPath();
            for (let i = 0; i < 25; i++) {
                // Create a moving offset
                let t = (i / 25 + time) % 1;
                
                // Perspective curve: y moves slowly at top, fast at bottom
                // Using a power function to simulate depth
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                
                // Width interpolation
                // Linear interpolation of width based on t
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5); 
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            
            // Grid Gradient (Fades at horizon)
            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, 'rgba(255, 0, 255, 0)');
            grad.addColorStop(0.15, 'rgba(255, 0, 255, 0.5)');
            grad.addColorStop(1, 'rgba(255, 0, 255, 1)');
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // --- NOTES LOGIC ---

        function spawnNote() {
            // Spawn rhythmically
            if (frameCount % 45 === 0) { 
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, // 0 = horizon, 1 = bottom
                    active: true,
                    hit: false
                });
                
                // Occasionally spawn double notes
                if (Math.random() > 0.7) {
                    let lane2 = (laneIdx + 1 + Math.floor(Math.random() * 2)) % 4;
                    notes.push({
                        lane: lane2,
                        t: 0,
                        active: true,
                        hit: false
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.9, 800);
            const topWidth = 60;

            notes.forEach(note => {
                note.t += 0.008; // Note speed
                
                if (note.t > 1.1) {
                    note.active = false;
                } else if (note.t > 0.9 && !note.hit) {
                    // Visual feedback for hitting the line
                    note.hit = true; 
                    // In a real game, this would trigger sound
                }

                // Perspective math
                const t = note.t;
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
                
                // Lane X calculation
                const laneWidth = currentWidth / 4;
                const laneStartX = (centerX - currentWidth / 2);
                const laneCenterX = laneStartX + (note.lane * laneWidth) + (laneWidth / 2);

                // Note Size (Grows as it approaches)
                const noteSize = 10 + (laneWidth * 0.6) * Math.pow(t, 1.2);
                
                // Draw Note
                const color = laneColors[note.lane];
                ctx.fillStyle = color;
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                
                // Hit effect (Flash white)
                if(note.hit) {
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#fff';
                }

                // Draw square note
                ctx.fillRect(laneCenterX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner detail
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(laneCenterX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);

                ctx.shadowBlur = 0; // Reset
            });

            // Cleanup
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            
            // Place hit line near bottom (t=0.92)
            const t = 0.92; 
            const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
            const bottomWidth = Math.min(width * 0.9, 800);
            const topWidth = 60;
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
            
            ctx.beginPath();
            // Glowing Hit Line (Priority 1)
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff'; // Cyan glow
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Key markers (optional visual cue)
            const markers = ['D', 'F', 'J', 'K'];
            const laneWidth = currentWidth / 4;
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            markers.forEach((m, i) => {
                const mx = (centerX - currentWidth/2) + (i * laneWidth) + (laneWidth/2);
                ctx.fillText(m, mx, y + 25);
            });
        }

        function animate() {
            frameCount++;
            
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawHighway(); // Draws grid lines and lane backgrounds
            
            spawnNote();
            drawNotes();
            
            // Draw Hit Line on top of notes so it's crisp
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = 'INITIALIZING...';
            btn.style.borderColor = '#ffff00';
            btn.style.color = '#ffff00';
            btn.style.boxShadow = '0 0 20px #ffff00';
            
            // Visual feedback only for this demo
            setTimeout(() => {
                alert('Game Started! (Demo End)');
                btn.innerHTML = 'PRESS TO START';
                btn.style.borderColor = '';
                btn.style.color = '';
                btn.style.boxShadow = '';
            }, 800);
        }

        animate();

    </script>
</body>
</html>
