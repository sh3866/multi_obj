<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-white: #ffffff;
            --grid-color: rgba(255, 0, 255, 0.3);
            --font-pixel: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-pixel);
        }

        /* --- ATMOSPHERE & OVERLAYS --- */
        
        /* Scanline Overlay - Refined for subtle retro texture */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.25) 2px,
                rgba(0, 0, 0, 0.25) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* Vignette - Deepens the corners */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- CANVAS SCENE --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; 
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* --- TITLE DESIGN --- */
        .title-container {
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            pointer-events: auto;
            margin-top: -15vh; /* Shift up */
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            line-height: 0.85;
            text-transform: uppercase;
            color: #fff;
            /* Pixelated Text Shadow/Glow - Hard edges */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            letter-spacing: -2px;
            transform: skewX(-10deg);
            /* Force sharp aliasing */
            -webkit-font-smoothing: none;
            animation: titleFloat 4s ease-in-out infinite;
        }

        /* Glitch Animation */
        @keyframes titleFloat {
            0%, 100% { transform: skewX(-10deg) translateY(0); }
            50% { transform: skewX(-10deg) translateY(-10px); }
        }

        h1 span {
            display: block;
            font-size: 1.2rem;
            color: var(--neon-cyan); /* Critique: Changed to Cyan for visibility */
            font-weight: bold;
            letter-spacing: 6px;
            margin-top: 10px;
            text-shadow: 2px 2px 0px #000; 
        }

        /* --- BUTTONS --- */
        .btn-container {
            pointer-events: auto;
            margin-top: 20px;
            z-index: 20;
        }

        .btn-start {
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-pixel);
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* Pixelated Border Box Shadow */
            box-shadow: 0 0 0 2px #000, 6px 6px 0 rgba(0,255,255,0.4);
            text-shadow: 0 0 5px var(--neon-cyan);
            letter-spacing: 2px;
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 0 2px #fff, 8px 8px 0 rgba(0,255,255,0.8);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- SUB MENU (Hierarchy Overhaul) --- */
        .menu-options {
            margin-top: 50px;
            display: flex;
            gap: 40px;
            pointer-events: auto;
        }

        .menu-link {
            color: var(--neon-pink);
            text-decoration: none;
            font-size: 1.4rem; /* Increased size */
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 25px;
            border: 2px solid rgba(255, 0, 255, 0.3);
            background: rgba(0,0,0,0.5);
            transition: all 0.2s;
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
        }

        .menu-link:hover {
            color: #fff;
            border-color: var(--neon-pink);
            background: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink), 4px 4px 0 rgba(0,0,0,0.5);
            text-shadow: none;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            h1 span { font-size: 0.9rem; letter-spacing: 3px; }
            .btn-start { font-size: 1.4rem; padding: 12px 40px; }
            .menu-options { gap: 15px; }
            .menu-link { font-size: 1rem; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>Pixel<br>Dance</h1>
            <span>Rhythm Protocol</span>
        </div>

        <div class="btn-container">
            <button class="btn-start" onclick="startGame()">START GAME</button>
        </div>

        <div class="menu-options">
            <a class="menu-link">Options</a>
            <a class="menu-link">Credits</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Configuration
        const laneColors = ['#ff00ff', '#00ffff', '#ffff00', '#ff00ff']; // P, C, Y, P
        
        // Sun Configuration
        const sunY = 0.35; 
        const sunSize = 180; 
        
        // Stars
        const stars = [];
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4, 
                size: Math.random() < 0.9 ? 2 : 4, 
                alpha: Math.random(),
                speed: Math.random() * 0.02
            });
        }

        // Notes
        const notes = [];
        let frameCount = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false; 
        }

        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING FUNCTIONS ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                const twinkle = Math.sin(time * 10 + star.x * 100) * 0.5 + 0.5;
                ctx.globalAlpha = star.alpha * (0.3 + 0.7 * twinkle);
                ctx.fillRect(star.x * width, star.y * height, star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Sun Glow
            const grd = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 3);
            grd.addColorStop(0, 'rgba(255, 100, 255, 0.4)');
            grd.addColorStop(0.5, 'rgba(255, 0, 100, 0.2)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            // Sun Body
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffff00'; 
            ctx.fill();
            
            // Pixelated Stripes (The "Blind" look)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050011'; // Matches background
            
            // Draw horizontal lines with increasing thickness
            const stripeCount = 10;
            const totalHeight = r * 2;
            const step = totalHeight / stripeCount;
            
            for(let i = 0; i < stripeCount; i++) {
                // Start below center to keep top of sun solid
                if (i < 4) continue; 
                
                // Calculate y position and thickness
                let y = cy - r + (i * step); 
                let h = step + (i * 1.5); // Gets thicker at bottom
                
                // Ensure we stay within circle bounds roughly
                if (y > cy - r) {
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawHighway() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            
            const bottomWidth = Math.min(width * 0.9, 800); 
            const topWidth = 60;
            
            // Lane Backgrounds
            for (let i = 0; i < 4; i++) {
                const laneWBottom = bottomWidth / 4;
                const laneWTop = topWidth / 4;
                
                const x1Bottom = centerX - (bottomWidth/2) + (i * laneWBottom);
                const x2Bottom = x1Bottom + laneWBottom;
                
                const x1Top = centerX - (topWidth/2) + (i * laneWTop);
                const x2Top = x1Top + laneWTop;

                ctx.beginPath();
                ctx.moveTo(x1Bottom, height);
                ctx.lineTo(x2Bottom, height);
                ctx.lineTo(x2Top, horizonY);
                ctx.lineTo(x1Top, horizonY);
                ctx.closePath();

                // Alternating subtle lane colors
                ctx.fillStyle = (i % 2 === 0) ? 'rgba(255, 0, 255, 0.05)' : 'rgba(0, 255, 255, 0.05)';
                ctx.fill();
                
                // Lane Borders
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
            }

            // Horizontal Grid Lines (Moving)
            const speed = 0.003;
            time += speed;
            
            ctx.beginPath();
            for (let i = 0; i < 25; i++) {
                let t = (i / 25 + time) % 1;
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5); 
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
            }
            
            // Grid Gradient
            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, 'rgba(255, 0, 255, 0)');
            grad.addColorStop(0.15, 'rgba(255, 0, 255, 0.5)');
            grad.addColorStop(1, 'rgba(255, 0, 255, 1)');
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // --- NOTES LOGIC ---

        function spawnNote() {
            // Spawn rhythmically
            if (frameCount % 40 === 0) { 
                const laneIdx = Math.floor(Math.random() * 4);
                notes.push({
                    lane: laneIdx,
                    t: 0, 
                    active: true,
                    hit: false
                });
                
                // Occasionally spawn double notes
                if (Math.random() > 0.7) {
                    let lane2 = (laneIdx + 1 + Math.floor(Math.random() * 2)) % 4;
                    notes.push({
                        lane: lane2,
                        t: 0,
                        active: true,
                        hit: false
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.9, 800);
            const topWidth = 60;

            notes.forEach(note => {
                note.t += 0.008; // Note speed
                
                if (note.t > 1.1) {
                    note.active = false;
                } else if (note.t > 0.9 && !note.hit) {
                    note.hit = true; 
                }

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
                
                const laneWidth = currentWidth / 4;
                const laneStartX = (centerX - currentWidth / 2);
                const laneCenterX = laneStartX + (note.lane * laneWidth) + (laneWidth / 2);

                // Note Size
                const noteSize = 10 + (laneWidth * 0.6) * Math.pow(t, 1.2);
                
                const color = laneColors[note.lane];
                ctx.fillStyle = color;
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                
                if(note.hit) {
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#fff';
                }

                // Draw Rectangular Note
                ctx.fillRect(laneCenterX - noteSize/2, y - noteSize/2, noteSize, noteSize);
                
                // Inner detail (Pixel highlight)
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(laneCenterX - noteSize/4, y - noteSize/4, noteSize/2, noteSize/2);

                ctx.shadowBlur = 0; 
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            
            const t = 0.92; 
            const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
            const bottomWidth = Math.min(width * 0.9, 800);
            const topWidth = 60;
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
            
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff'; 
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Key markers (D, F, J, K) - Brighter and Legible
            const markers = ['D', 'F', 'J', 'K'];
            const laneWidth = currentWidth / 4;
            
            // Draw background for keys to make them pop
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            const keyBoxH = 30;
            const keyBoxW = 40;
            
            markers.forEach((m, i) => {
                const mx = (centerX - currentWidth/2) + (i * laneWidth) + (laneWidth/2);
                // Draw box
                ctx.fillRect(mx - keyBoxW/2, y + 10, keyBoxW, keyBoxH);
                // Draw text
                ctx.fillStyle = '#ffff00'; // Yellow text
                ctx.font = 'bold 20px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(m, mx, y + 10 + keyBoxH/2);
                // Reset fill for next box
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
            });
        }

        function animate() {
            frameCount++;
            
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawHighway();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = 'INITIALIZING...';
            btn.style.borderColor = '#ffff00';
            btn.style.color = '#ffff00';
            btn.style.boxShadow = '0 0 20px #ffff00';
            
            setTimeout(() => {
                alert('Game Started! (Demo End)');
                btn.innerHTML = 'START GAME';
                btn.style.borderColor = '';
                btn.style.color = '';
                btn.style.boxShadow = '';
            }, 800);
        }

        animate();

    </script>
</body>
</html>
