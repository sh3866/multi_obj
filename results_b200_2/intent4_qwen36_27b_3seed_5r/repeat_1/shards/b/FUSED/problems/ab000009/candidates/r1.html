<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Deep Slate & Warm Cream */
            --bg-body: #15171b;
            --bg-panel: #24272e;
            --bg-panel-border: #32363f;
            
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            
            --accent-color: #d4af37; /* Muted Gold */
            --accent-hover: #b5952f;
            
            /* Board Palette: Premium Slate/Stone */
            --board-light: #e8ebef; /* Cool white/grey */
            --board-dark: #7b808a;  /* Deep charcoal/slate */
            --board-border: #2f3238;
            
            /* Highlights */
            --highlight-last-move: rgba(212, 175, 55, 0.35);
            --highlight-selected: rgba(212, 175, 55, 0.5);
            
            /* Dimensions */
            --board-size: min(85vh, 80vw);
            --square-size: calc(var(--board-size) / 8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Layout */
        .layout-container {
            display: flex;
            gap: 40px;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            align-items: center;
        }

        /* --- The Board --- */
        .board-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background-color: var(--board-border);
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            border: 2px solid var(--board-border);
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Coordinate Labels (Serif) */
        .coord {
            position: absolute;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }
        
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        /* Highlights */
        .highlight-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }
        .hl-selected { background-color: var(--highlight-selected); }
        .hl-last-move { background-color: var(--highlight-last-move); }

        /* SVG Pieces */
        .piece-svg {
            width: 80%;
            height: 80%;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .piece-svg:active { transform: scale(0.9); }

        /* --- Side Panel --- */
        .info-panel {
            width: 360px;
            height: var(--board-size);
            background-color: var(--bg-panel);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--bg-panel-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Header / Turn Indicator */
        .panel-header {
            padding: 24px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--bg-panel-border);
        }

        .game-status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .turn-indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #fff;
            border: 1px solid rgba(0,0,0,0.2);
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        .turn-indicator-dot.black {
            background-color: #111;
            border-color: #444;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
        }

        .turn-text {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .sub-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Move History */
        .history-area {
            flex-grow: 1;
            padding: 0;
            overflow-y: auto;
            background-color: rgba(0,0,0,0.15);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .history-row {
            border-bottom: 1px solid var(--bg-panel-border);
        }
        .history-row:last-child { border-bottom: none; }
        
        .history-row:hover { background-color: rgba(255,255,255,0.03); }

        .h-col-num {
            width: 40px;
            text-align: center;
            color: var(--text-secondary);
            padding: 10px;
            font-family: 'Georgia', serif;
            border-right: 1px solid var(--bg-panel-border);
        }

        .h-col-move {
            padding: 10px 16px;
            font-family: 'Courier New', monospace; /* Classic notation feel */
            cursor: pointer;
        }
        .h-col-move:hover { color: var(--accent-color); }

        .h-col-move span.white { color: var(--text-primary); font-weight: 600; }
        .h-col-move span.black { color: var(--text-secondary); }

        /* Controls */
        .panel-footer {
            padding: 20px;
            border-top: 1px solid var(--bg-panel-border);
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #1a1a1a;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-ghost {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--bg-panel-border);
        }
        .btn-ghost:hover { 
            background-color: rgba(255,255,255,0.05); 
            color: var(--text-primary);
        }

        /* Scrollbar */
        .history-area::-webkit-scrollbar { width: 6px; }
        .history-area::-webkit-scrollbar-track { background: transparent; }
        .history-area::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        @media (max-width: 900px) {
            .layout-container { flex-direction: column; }
            .info-panel { width: 100%; height: 300px; }
            :root { --board-size: 85vw; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    
    <!-- Chess Board -->
    <div class="board-container">
        <div class="chess-board" id="board">
            <!-- JS renders squares here -->
        </div>
    </div>

    <!-- Side Panel -->
    <div class="info-panel">
        <div class="panel-header">
            <div class="game-status">
                <div class="turn-indicator-dot" id="turnDot"></div>
                <div class="turn-text" id="turnText">White to Move</div>
            </div>
            <div class="sub-text">Standard Time Control</div>
        </div>

        <div class="history-area">
            <table class="history-table" id="historyTable">
                <tbody>
                    <!-- Moves injected here -->
                </tbody>
            </table>
        </div>

        <div class="panel-footer">
            <button class="btn btn-ghost" onclick="resetGame()">New Game</button>
            <button class="btn btn-primary" onclick="analyzePosition()">Analyze</button>
        </div>
    </div>

</div>

<script>

    const piecePaths = {

    };

    function getPieceSVG(type, color) {
        const c = color === 'w' ? '#fff' : '#000';
        const s = color === 'w' ? '#000' : '#fff'; // stroke color
        const d = piecePaths[color][type];
        // Using standard stroke width settings for clean look
        return `<svg viewBox="0 0 45 45" class="piece-svg" fill="${c}" stroke="${s}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g>${d.split('M').map((p, i) => i === 0 ? '' : `<path d="M${p}" />`).join('')}</g></svg>`;
    }

    // --- Game State ---
    const initialBoard = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
        ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
    ];

    let boardState = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w';
    let selectedSquare = null; // {r, c}
    let lastMove = null; // {from: {r,c}, to: {r,c}}
    let moveHistory = []; // Array of {num, white, black}

    // --- DOM Elements ---
    const boardEl = document.getElementById('board');
    const historyTableEl = document.getElementById('historyTable');
    const turnTextEl = document.getElementById('turnText');
    const turnDotEl = document.getElementById('turnDot');

    // --- Rendering ---
    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.r = r;
                square.dataset.c = c;
                square.onclick = () => handleSquareClick(r, c);

                // Highlight Last Move
                if (lastMove) {
                    if ((lastMove.from.r === r && lastMove.from.c === c) || 
                        (lastMove.to.r === r && lastMove.to.c === c)) {
                        square.innerHTML += `<div class="highlight-overlay hl-last-move"></div>`;
                    }
                }

                // Highlight Selected
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.innerHTML += `<div class="highlight-overlay hl-selected"></div>`;
                }

                // Coordinates (Only on edges)
                if (c === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - r;
                    square.appendChild(rank);
                }
                if (r === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = String.fromCharCode(97 + c);
                    square.appendChild(file);
                }

                // Piece
                const pieceCode = boardState[r][c];
                if (pieceCode) {
                    const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                    const type = pieceCode.toLowerCase();
                    square.innerHTML += getPieceSVG(type, color);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function renderHistory() {
        historyTableEl.innerHTML = '';
        moveHistory.forEach(move => {
            const row = document.createElement('tr');
            row.className = 'history-row';
            row.innerHTML = `
                <td class="h-col-num">${move.num}.</td>
                <td class="h-col-move"><span class="white">${move.white}</span></td>
                <td class="h-col-move"><span class="black">${move.black || ''}</span></td>
            `;
            historyTableEl.appendChild(row);
        });
        // Auto scroll to bottom
        const historyArea = document.querySelector('.history-area');
        historyArea.scrollTop = historyArea.scrollHeight;
    }

    function updateUI() {
        turnTextEl.innerText = turn === 'w' ? "White to Move" : "Black to Move";
        turnDotEl.className = `turn-indicator-dot ${turn === 'b' ? 'black' : 'white'}`;
    }

    // --- Logic ---
    function getAlgebraic(r, c) {
        return `${String.fromCharCode(97 + c)}${8 - r}`;
    }

    function handleSquareClick(r, c) {
        const clickedPiece = boardState[r][c];
        const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

        // 1. Select Piece
        if (isOwnPiece) {
            selectedSquare = { r, c };
            renderBoard();
            return;
        }

        // 2. Move Piece (Simplified: allow any move to empty or capture)
        if (selectedSquare) {
            const fromR = selectedSquare.r;
            const fromC = selectedSquare.c;
            const piece = boardState[fromR][fromC];
            
            // Execute move
            boardState[r][c] = piece;
            boardState[fromR][fromC] = null;
            
            // Generate Notation (Simplified)
            const notation = `${piece.toUpperCase() === piece ? '' : ''}${getAlgebraic(r, c)}`;
            const fullNotation = `${piece.toUpperCase()}${getAlgebraic(r, c)}`; // Very simplified for visual demo

            // Update History
            const moveNum = Math.ceil((moveHistory.length + 1) / 2);
            if (turn === 'w') {
                moveHistory.push({ num: moveNum, white: fullNotation, black: null });
            } else {
                if (moveHistory.length > 0) {
                    moveHistory[moveHistory.length - 1].black = fullNotation;
                }
            }

            // State updates
            lastMove = { from: {r: fromR, c: fromC}, to: {r, c} };
            turn = turn === 'w' ? 'b' : 'w';
            selectedSquare = null;

            updateUI();
            renderBoard();
            renderHistory();
        }
    }

    function resetGame() {
        boardState = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        lastMove = null;
        moveHistory = [];
        updateUI();
        renderBoard();
        renderHistory();
    }

    function analyzePosition() {
        const btn = document.querySelector('.btn-primary');
        const originalText = btn.innerText;
        btn.innerText = "Analyzing...";
        btn.style.opacity = "0.7";
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.opacity = "1";
            // Simple feedback
            alert("Engine Analysis: Position is equal.");
        }, 1000);
    }

    // Init
    renderBoard();
    updateUI();

</script>
</body>
</html>
