<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERICAL LIFE // SYSTEM</title>
<style>
    :root {
        --bg-color: #030305;
        --panel-bg: rgba(10, 10, 12, 0.75);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text-main: #ffffff;
        --text-muted: #888899;
        --accent-primary: #00f3ff;
        --font-stack: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        --font-mono: 'Consolas', 'Monaco', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #0f0f15 0%, #000000 80%);
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* UI Overlay Elements */
    .hud-top {
        position: absolute;
        top: 40px;
        left: 40px;
        pointer-events: none;
        z-index: 5;
        mix-blend-mode: exclusion;
    }
    .hud-title {
        font-size: 24px;
        letter-spacing: 6px;
        color: var(--text-main);
        text-transform: uppercase;
        font-weight: 200;
    }
    .hud-subtitle {
        font-size: 12px;
        font-family: var(--font-mono);
        color: var(--accent-primary);
        margin-top: 8px;
        letter-spacing: 1px;
        opacity: 0.8;
    }

    /* Control Panel */
    aside {
        width: 360px;
        background: var(--panel-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-left: 1px solid var(--panel-border);
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        z-index: 10;
        box-shadow: -10px 0 40px rgba(0,0,0,0.5);
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 20px;
    }
    .panel-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #fff;
        text-transform: uppercase;
    }
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--accent-primary);
        background: rgba(0, 243, 255, 0.05);
        padding: 6px 10px;
        border-radius: 2px;
        border: 1px solid rgba(0, 243, 255, 0.1);
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-primary);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-primary);
        animation: pulse 2s infinite;
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 600;
    }
    .value-display {
        font-family: var(--font-mono);
        font-size: 11px;
        color: #fff;
        float: right;
        opacity: 0.8;
    }

    /* Custom Range Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin-top: 8px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 0 15px rgba(255,255,255,0.6);
        transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.3));
        border-radius: 2px;
    }

    /* Theme Buttons */
    .theme-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
    }
    .theme-btn {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--panel-border);
        color: var(--text-muted);
        padding: 12px 0;
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
        border-radius: 2px;
    }
    .theme-btn:hover {
        background: rgba(255,255,255,0.05);
        color: #fff;
        border-color: rgba(255,255,255,0.2);
    }
    .theme-btn.active {
        background: rgba(255,255,255,0.08);
        border-color: var(--accent-primary);
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }

    /* Action Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    button.action-btn {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--panel-border);
        color: var(--text-main);
        padding: 16px;
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 2px;
    }
    button.action-btn:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.4);
    }
    button.action-btn:active { transform: translateY(1px); }
    
    button.primary {
        background: rgba(0, 243, 255, 0.05);
        border-color: rgba(0, 243, 255, 0.2);
        color: var(--accent-primary);
        grid-column: span 2;
    }
    button.primary:hover {
        background: rgba(0, 243, 255, 0.15);
        border-color: var(--accent-primary);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }
    
    button.danger {
        color: #ff4757;
        border-color: rgba(255, 71, 87, 0.15);
    }
    button.danger:hover {
        background: rgba(255, 71, 87, 0.1);
        border-color: #ff4757;
    }

    /* Stats */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: auto;
        padding-top: 25px;
        border-top: 1px solid var(--panel-border);
    }
    .stat-item { display: flex; flex-direction: column; gap: 6px; }
    .stat-val {
        font-size: 24px;
        font-weight: 200;
        color: #fff;
        font-family: var(--font-mono);
        letter-spacing: -1px;
    }

    .footer {
        font-size: 9px;
        color: rgba(255,255,255,0.2);
        text-align: center;
        margin-top: 15px;
        line-height: 1.6;
        font-family: var(--font-mono);
        letter-spacing: 0.5px;
    }

    @keyframes pulse {
        0% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-primary); }
        50% { opacity: 1; box-shadow: 0 0 10px var(--accent-primary); }
        100% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-primary); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        <div class="hud-top">
            <div class="hud-title">Spherical Life</div>
            <div class="hud-subtitle" id="coords-display">SYS.ONLINE // RENDER: ACTIVE</div>
        </div>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">Control Panel</div>
            <div class="status-indicator"><div class="status-dot"></div> RUNNING</div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed <span class="value-display" id="speed-val">40 FPS</span></div>
            <input type="range" id="speedRange" min="1" max="60" value="40">
        </div>

        <div class="control-group">
            <div class="label">Grid Density <span class="value-display" id="res-val">100x50</span></div>
            <input type="range" id="resRange" min="40" max="150" value="100">
        </div>

        <div class="control-group">
            <div class="label">Color Theme</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('cyberpunk')">Cyber</button>
                <button class="theme-btn" onclick="setTheme('biolum')">Bio</button>
                <button class="theme-btn" onclick="setTheme('ember')">Ember</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="action-btn primary" id="btn-toggle">Pause / Resume</button>
                <button class="action-btn" id="btn-reset">Randomize</button>
                <button class="action-btn danger" id="btn-clear">Kill All</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="label">Generation</span>
                <span class="stat-val" id="gen-count">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Population</span>
                <span class="stat-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="footer">
            HTML5 CANVAS 2D ENGINE<br>
            TOPOLOGY: SPHERICAL TORUS
        </div>
    </aside>

<script>
/**
 * SPHERICAL GAME OF LIFE ENGINE (REVISED)
 * 
 * Design Changes:
 * 1. Increased Grid Density (Default 100x50).
 * 2. Removed heavy wireframe, replaced with subtle volumetric shading.
 * 3. Dynamic Multicolor: Colors shift based on cell age and neighbor count.
 * 4. "Glow" rendering with additive blending.
 * 5. Improved Randomize: Seeds specific patterns (Gliders) mixed with noise.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 100; // Increased default density
let rows = 50;
let grid = [];
let ageGrid = []; // Track cell age for coloring
let nextGrid = [];
let nextAgeGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 25; // ~40fps
let theme = 'cyberpunk';

// Camera / Rotation
let rotX = 0.2;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Themes Configuration
const themes = {
    cyberpunk: {
        name: 'Cyber',
        // Palette: Cyan -> Blue -> Purple
        colorFn: (neighbors, age) => {
            // Hue shift based on age
            const hue = 180 + (age * 2) % 120; 
            const sat = 100;
            const light = 50 + Math.min(age * 2, 30);
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        },
        glowColor: '#00f3ff',
        sphereAmbient: 'rgba(0, 243, 255, 0.03)',
        bgGradient: ['#0a0a12', '#000000']
    },
    biolum: {
        name: 'Bio',
        // Palette: Green -> Teal -> Blue
        colorFn: (neighbors, age) => {
            const hue = 100 + (age * 3) % 80;
            const sat = 90;
            const light = 60;
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        },
        glowColor: '#00ff99',
        sphereAmbient: 'rgba(0, 255, 150, 0.03)',
        bgGradient: ['#001a10', '#000000']
    },
    ember: {
        name: 'Ember',
        // Palette: Red -> Orange -> Yellow
        colorFn: (neighbors, age) => {
            const hue = 0 + (age * 5) % 60;
            const sat = 100;
            const light = 50;
            return `hsl(${hue}, ${sat}%, ${light}%)`;
        },
        glowColor: '#ff6600',
        sphereAmbient: 'rgba(255, 100, 0, 0.03)',
        bgGradient: ['#1a0a00', '#000000']
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    ageGrid = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    nextAgeGrid = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
    updateStats();
}

function randomize() {
    // Clear
    grid.fill(0);
    ageGrid.fill(0);
    
    // 1. Random Noise (15% density)
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.85 ? 1 : 0;
        if(grid[i]) ageGrid[i] = 1;
    }

    // 2. Seed Gliders (Randomly placed)
    const gliderCount = 15;
    for(let k=0; k<gliderCount; k++) {
        const gx = Math.floor(Math.random() * cols);
        const gy = Math.floor(Math.random() * rows);
        
        // Glider Pattern
        const p = [
            [0,1], [1,2], [2,0], [2,1], [2,2]
        ];
        p.forEach(offset => {
            const x = (gx + offset[0]) % cols;
            const y = (gy + offset[1]) % rows;
            grid[getIdx(x, y)] = 1;
            ageGrid[getIdx(x, y)] = 1;
        });
    }
    
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ageGrid.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const state = grid[getIdx(x, y)];
            const neighbors = countNeighbors(x, y);
            const idx = getIdx(x, y);
            
            // Logic
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                nextAgeGrid[idx] = 1; // Born
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                nextAgeGrid[idx] = 0; // Die
            } else if (state === 1) {
                nextGrid[idx] = 1;
                nextAgeGrid[idx] = ageGrid[idx] + 1; // Age
            } else {
                nextGrid[idx] = 0;
                nextAgeGrid[idx] = 0;
            }
        }
    }
    
    // Swap
    let tempG = grid; grid = nextGrid; nextGrid = tempG;
    let tempA = ageGrid; ageGrid = nextAgeGrid; nextAgeGrid = tempA;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering Engine
function drawSphere() {
    // 1. Clear & Background
    ctx.fillStyle = themes[theme].bgGradient[0];
    ctx.fillRect(0, 0, width, height);

    const cx = width / 2;
    const cy = height / 2;
    // Sphere radius responsive to screen
    const radius = Math.min(width, height) * 0.32;
    
    // Background Radial Gradient (Depth)
    const grad = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.5);
    grad.addColorStop(0, themes[theme].bgGradient[0]);
    grad.addColorStop(1, themes[theme].bgGradient[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Pre-calculate rotation matrices
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);
    
    const fov = 600; // Field of view

    // 2. Draw Sphere "Volume" (Subtle Atmosphere)
    // Instead of wireframe, we draw a subtle circle to define the boundary
    const scale = fov / (fov + radius); // Approximate scale at center
    ctx.beginPath();
    ctx.arc(cx, cy, radius * scale, 0, Math.PI * 2);
    ctx.fillStyle = themes[theme].sphereAmbient;
    ctx.fill();
    
    // Add a faint rim light
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 3. Prepare Cells for Rendering
    let renderList = [];

    // Optimization: Loop 1D array
    for (let y = 0; y < rows; y++) {
        // Map grid Y to Latitude (Phi)
        const phi = (y / rows) * Math.PI;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        for (let x = 0; x < cols; x++) {
            // Only process living cells
            if (grid[getIdx(x, y)] === 1) {
                // Map grid X to Longitude (Theta)
                const theta = (x / cols) * Math.PI * 2;
                const cosTheta = Math.cos(theta);
                const sinTheta = Math.sin(theta);

                // 3D Coordinates
                let px = radius * sinPhi * cosTheta;
                let py = radius * sinPhi * sinTheta;
                let pz = radius * cosPhi;

                // Rotate Y
                let px2 = px * cosY - pz * sinY;
                let pz2 = px * sinY + pz * cosY;
                
                // Rotate X
                let py2 = py * cosX - pz2 * sinX;
                let pz3 = py * sinX + pz2 * cosX;

                // Project
                // Perspective division
                const scaleP = fov / (fov + pz3);
                const sx = cx + px2 * scaleP;
                const sy = cy + py2 * scaleP;
                
                // Normalized Z for color (-1 to 1 approx)
                const zNorm = pz3 / radius; 
                
                // Store for sorting
                renderList.push({
                    x: sx,
                    y: sy,
                    z: pz3,
                    scale: scaleP,
                    age: ageGrid[getIdx(x, y)],
                    neighbors: 0 // Placeholder, we don't re-calc here to save perf, using age instead
                });
            }
        }
    }

    // Sort back to front (Painter's Algorithm)
    // Highest Z (furthest) draws first
    renderList.sort((a, b) => b.z - a.z);

    // 4. Draw Cells
    // Use additive blending for "Glow" effect
    ctx.globalCompositeOperation = 'lighter';
    
    // Base glow color for shadow
    ctx.shadowColor = themes[theme].glowColor;
    ctx.shadowBlur = 8;

    for (let cell of renderList) {
        // Only draw if in front of camera plane
        if (cell.z > -radius * 0.2) {
            // Dynamic size based on perspective
            const baseSize = (radius / cols) * 1.8; 
            const size = Math.max(0.5, baseSize * cell.scale);
            
            // Dynamic Color
            ctx.fillStyle = themes[theme].colorFn(0, cell.age);
            
            ctx.beginPath();
            ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Reset context
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    // Auto rotate if not dragging
    if (autoRotate && !isDragging) {
        rotY += 0.003; // Slower, smoother rotation
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Update HUD
    document.getElementById('coords-display').innerText = 
        `X: ${(x/width*360).toFixed(1)}° | Y: ${(y/height*180).toFixed(1)}° | Z: ${(Math.sin(Date.now()/1000)*100).toFixed(0)}`;

    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// UI Controls
document.getElementById('btn-toggle').addEventListener('click', () => {
    isRunning = !isRunning;
    const btn = document.getElementById('btn-toggle');
    btn.innerText = isRunning ? "Pause" : "Resume";
    document.querySelector('.status-indicator').style.opacity = isRunning ? 1 : 0.5;
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
    document.getElementById('speed-val').innerText = val + " FPS";
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    document.getElementById('res-val').innerText = `${cols}x${rows}`;
    initGrid();
});

function setTheme(name) {
    theme = name;
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.toLowerCase() === themes[name].name.toLowerCase()) {
            btn.classList.add('active');
        }
    });
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
