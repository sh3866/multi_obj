<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERICAL LIFE // SYSTEM</title>
<style>
    :root {
        --bg-color: #050505;
        --panel-bg: rgba(20, 20, 25, 0.6);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text-main: #ececec;
        --text-muted: #7a7a85;
        --accent-primary: #00f3ff;
        --accent-secondary: #bc13fe;
        --font-stack: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        --font-mono: 'Consolas', 'Monaco', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        /* Subtle grid background for depth */
        background-image: 
            radial-gradient(circle at 50% 50%, #1a1a24 0%, #000000 100%),
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* UI Overlay Elements */
    .hud-top {
        position: absolute;
        top: 30px;
        left: 40px;
        pointer-events: none;
        z-index: 5;
    }
    .hud-title {
        font-size: 18px;
        letter-spacing: 4px;
        color: var(--text-main);
        text-transform: uppercase;
        font-weight: 300;
        opacity: 0.9;
    }
    .hud-subtitle {
        font-size: 11px;
        font-family: var(--font-mono);
        color: var(--accent-primary);
        margin-top: 5px;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    /* Control Panel */
    aside {
        width: 340px;
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-left: 1px solid var(--panel-border);
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 35px;
        box-shadow: -20px 0 60px rgba(0,0,0,0.4);
        z-index: 10;
        transition: width 0.3s ease;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 20px;
    }
    .panel-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #fff;
        text-transform: uppercase;
    }
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--accent-primary);
        background: rgba(0, 243, 255, 0.1);
        padding: 4px 8px;
        border-radius: 4px;
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-primary);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-primary);
        animation: pulse 2s infinite;
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .label {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 500;
    }
    .value-display {
        font-family: var(--font-mono);
        font-size: 11px;
        color: #fff;
        float: right;
    }

    /* Custom Range Slider */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin-top: 5px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -7px;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
    }

    /* Theme Buttons */
    .theme-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
    }
    .theme-btn {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--panel-border);
        color: var(--text-muted);
        padding: 10px 0;
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
    }
    .theme-btn:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }
    .theme-btn.active {
        background: rgba(255,255,255,0.1);
        border-color: var(--accent-primary);
        color: var(--accent-primary);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
    }

    /* Action Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    button.action-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--panel-border);
        color: var(--text-main);
        padding: 14px;
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    button.action-btn:hover {
        background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.3);
    }
    button.action-btn:active { transform: translateY(1px); }
    
    button.primary {
        background: rgba(0, 243, 255, 0.1);
        border-color: rgba(0, 243, 255, 0.3);
        color: var(--accent-primary);
        grid-column: span 2;
    }
    button.primary:hover {
        background: rgba(0, 243, 255, 0.2);
        border-color: var(--accent-primary);
    }
    
    button.danger {
        color: #ff4757;
        border-color: rgba(255, 71, 87, 0.2);
    }
    button.danger:hover {
        background: rgba(255, 71, 87, 0.1);
        border-color: #ff4757;
    }

    /* Stats */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid var(--panel-border);
    }
    .stat-item { display: flex; flex-direction: column; gap: 5px; }
    .stat-val {
        font-size: 20px;
        font-weight: 300;
        color: #fff;
        font-family: var(--font-mono);
    }

    .footer {
        font-size: 9px;
        color: rgba(255,255,255,0.3);
        text-align: center;
        margin-top: 10px;
        line-height: 1.5;
        font-family: var(--font-mono);
    }

    @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        <div class="hud-top">
            <div class="hud-title">Spherical Life</div>
            <div class="hud-subtitle" id="coords-display">SYS.ONLINE // RENDER: ACTIVE</div>
        </div>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">Control Panel</div>
            <div class="status-indicator"><div class="status-dot"></div> RUNNING</div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed <span class="value-display" id="speed-val">30 FPS</span></div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">Grid Density <span class="value-display" id="res-val">60x30</span></div>
            <input type="range" id="resRange" min="20" max="100" value="60">
        </div>

        <div class="control-group">
            <div class="label">Color Theme</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('cyberpunk')">Cyber</button>
                <button class="theme-btn" onclick="setTheme('biolum')">Bio</button>
                <button class="theme-btn" onclick="setTheme('ember')">Ember</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="action-btn primary" id="btn-toggle">Pause / Resume</button>
                <button class="action-btn" id="btn-reset">Randomize</button>
                <button class="action-btn danger" id="btn-clear">Kill All</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="label">Generation</span>
                <span class="stat-val" id="gen-count">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Population</span>
                <span class="stat-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="footer">
            HTML5 CANVAS 2D ENGINE<br>
            TOPOLOGY: SPHERICAL TORUS
        </div>
    </aside>

<script>
/**
 * SPHERICAL GAME OF LIFE ENGINE
 * 
 * Visual Upgrades:
 * 1. True 3D Projection with perspective scaling.
 * 2. "Glow" rendering using canvas shadowBlur (optimized).
 * 3. Wireframe rendering for volume definition.
 * 4. High-resolution grid support.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 60; // Longitude steps
let rows = 30; // Latitude steps
let grid = [];
let nextGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; // ~30fps
let theme = 'cyberpunk';

// Camera / Rotation
let rotX = 0.2; // Initial tilt
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Themes Configuration
const themes = {
    cyberpunk: {
        name: 'Cyber',
        wireColor: 'rgba(0, 243, 255, 0.1)',
        cellColor: (z) => {
            // Depth-based coloring: Brighter in front, dimmer in back
            const intensity = Math.max(0.3, 1 - z); // z is -1 to 1
            const r = Math.floor(0 * intensity);
            const g = Math.floor(243 * intensity);
            const b = Math.floor(255 * intensity);
            return `rgb(${r},${g},${b})`;
        },
        glowColor: '#00f3ff',
        bgGradient: ['#0a0a12', '#000000']
    },
    biolum: {
        name: 'Bio',
        wireColor: 'rgba(0, 255, 100, 0.08)',
        cellColor: (z) => {
            const intensity = Math.max(0.4, 1 - z);
            const r = Math.floor(50 * intensity);
            const g = Math.floor(255 * intensity);
            const b = Math.floor(150 * intensity);
            return `rgb(${r},${g},${b})`;
        },
        glowColor: '#00ff99',
        bgGradient: ['#001a10', '#000000']
    },
    ember: {
        name: 'Ember',
        wireColor: 'rgba(255, 100, 0, 0.1)',
        cellColor: (z) => {
            const intensity = Math.max(0.4, 1 - z);
            const r = Math.floor(255 * intensity);
            const g = Math.floor(100 * intensity);
            const b = Math.floor(0 * intensity);
            return `rgb(${r},${g},${b})`;
        },
        glowColor: '#ff6600',
        bgGradient: ['#1a0a00', '#000000']
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    // Handle High DPI
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    // Reset styles after scale
    ctx.lineCap = 'round';
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
    updateStats();
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        // 20% chance of life
        grid[i] = Math.random() > 0.8 ? 1 : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    updateStats();
}

// Helper to get index from x,y
function getIdx(x, y) {
    return y * cols + x;
}

// Get neighbor count (Torus wrapping)
function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            
            // Wrap X (Longitude)
            let col = (x + i + cols) % cols;
            // Wrap Y (Latitude) - Top connects to Bottom
            let row = (y + j + rows) % rows;
            
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const state = grid[getIdx(x, y)];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[getIdx(x, y)] = 1;
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[getIdx(x, y)] = 0;
            } else {
                nextGrid[getIdx(x, y)] = state;
            }
        }
    }
    
    // Swap buffers
    let temp = grid;
    grid = nextGrid;
    nextGrid = temp;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering Engine
function drawSphere() {
    // Clear background
    ctx.fillStyle = themes[theme].bgGradient[0];
    ctx.fillRect(0, 0, width, height);

    // Background Radial Gradient for depth
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.35;
    
    const grad = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.5);
    grad.addColorStop(0, themes[theme].bgGradient[0]);
    grad.addColorStop(1, themes[theme].bgGradient[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Pre-calculate rotation matrices
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);
    
    const fov = 400; // Field of view for perspective

    // 1. Draw Wireframe (Volume definition)
    ctx.strokeStyle = themes[theme].wireColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    
    // Draw Latitude Lines (Horizontal rings)
    for (let y = 0; y <= rows; y++) {
        const phi = (y / rows) * Math.PI;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);
        
        // We need to draw this as a continuous line loop
        // Sample points around the ring
        for (let x = 0; x <= cols; x++) {
            const theta = (x / cols) * Math.PI * 2;
            const cosTheta = Math.cos(theta);
            const sinTheta = Math.sin(theta);

            // Sphere coords
            let px = radius * sinPhi * cosTheta;
            let py = radius * sinPhi * sinTheta;
            let pz = radius * cosPhi;

            // Rotate Y
            let px2 = px * cosY - pz * sinY;
            let pz2 = px * sinY + pz * cosY;
            
            // Rotate X
            let py2 = py * cosX - pz2 * sinX;
            let pz3 = py * sinX + pz2 * cosX;

            // Project
            const scale = fov / (fov + pz3);
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (x === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }
    // Draw Longitude Lines (Vertical loops)
    for (let x = 0; x < cols; x++) {
        const theta = (x / cols) * Math.PI * 2;
        const cosTheta = Math.cos(theta);
        const sinTheta = Math.sin(theta);

        for (let y = 0; y <= rows; y++) {
            const phi = (y / rows) * Math.PI;
            const sinPhi = Math.sin(phi);
            const cosPhi = Math.cos(phi);

            let px = radius * sinPhi * cosTheta;
            let py = radius * sinPhi * sinTheta;
            let pz = radius * cosPhi;

            let px2 = px * cosY - pz * sinY;
            let pz2 = px * sinY + pz * cosY;
            
            let py2 = py * cosX - pz2 * sinX;
            let pz3 = py * sinX + pz2 * cosX;

            const scale = fov / (fov + pz3);
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (y === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }
    ctx.stroke();

    // 2. Draw Cells
    // Optimization: Collect visible cells and sort by Z (Painter's Algorithm) for correct overlap
    // Since cells are small dots, strict sorting is less critical than large shapes, 
    // but helps with the glow effect.
    
    let renderList = [];

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                const phi = (y / rows) * Math.PI;
                const theta = (x / cols) * Math.PI * 2;

                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.sin(phi) * Math.sin(theta);
                let pz = radius * Math.cos(phi);

                // Rotate Y
                let px2 = px * cosY - pz * sinY;
                let pz2 = px * sinY + pz * cosY;
                
                // Rotate X
                let py2 = py * cosX - pz2 * sinX;
                let pz3 = py * sinX + pz2 * cosX;

                // Project
                const scale = fov / (fov + pz3);
                const sx = cx + px2 * scale;
                const sy = cy + py2 * scale;
                
                // Normalized Z for color (-1 to 1 approx)
                const zNorm = pz3 / radius; 
                
                // Store for sorting
                renderList.push({
                    x: sx,
                    y: sy,
                    z: pz3,
                    scale: scale,
                    zNorm: zNorm
                });
            }
        }
    }

    // Sort back to front (highest Z to lowest Z)
    renderList.sort((a, b) => b.z - a.z);

    // Draw sorted cells
    ctx.shadowBlur = 6;
    ctx.shadowColor = themes[theme].glowColor;

    for (let cell of renderList) {
        // Only draw if in front of camera plane (mostly)
        if (cell.z > -radius * 0.5) {
            const size = Math.max(1, (radius / cols) * cell.scale * 1.5);
            
            ctx.fillStyle = themes[theme].cellColor(cell.zNorm);
            ctx.beginPath();
            ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Reset shadow for next frame
    ctx.shadowBlur = 0;
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    // Auto rotate if not dragging
    if (autoRotate && !isDragging) {
        rotY += 0.005;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
// Mouse Drag to Rotate
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    // Update HUD coords
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    // Fake coordinates for visual flair
    document.getElementById('coords-display').innerText = 
        `X: ${x.toFixed(0)} | Y: ${y.toFixed(0)} | Z: ${(Math.sin(Date.now()/500)*50).toFixed(0)}`;

    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.005;
        rotX += dy * 0.005;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// UI Controls
document.getElementById('btn-toggle').addEventListener('click', () => {
    isRunning = !isRunning;
    const btn = document.getElementById('btn-toggle');
    btn.innerText = isRunning ? "Pause" : "Resume";
    document.querySelector('.status-indicator').style.opacity = isRunning ? 1 : 0.5;
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
    document.getElementById('speed-val').innerText = val + " FPS";
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    document.getElementById('res-val').innerText = `${cols}x${rows}`;
    initGrid();
});

function setTheme(name) {
    theme = name;
    // Update UI active state
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.toLowerCase() === themes[name].name.toLowerCase()) {
            btn.classList.add('active');
        }
    });
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
