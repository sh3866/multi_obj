<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERICAL LIFE // GENESIS</title>
<style>
    :root {
        --bg-color: #030305;
        --panel-bg: rgba(10, 15, 30, 0.65);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text-main: #eef0f5;
        --text-muted: #6e7f91;
        --accent-primary: #00f3ff;
        --accent-secondary: #bd00ff;
        --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
        background: radial-gradient(circle at center, #0f1219 0%, #000000 100%);
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* UI Overlay */
    .hud-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 2;
    }

    .hud-top-left {
        position: absolute;
        top: 40px; left: 40px;
    }
    .hud-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1px;
        color: #fff;
        text-transform: uppercase;
        line-height: 1;
        background: linear-gradient(135deg, #fff 0%, #888 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .hud-subtitle {
        font-size: 11px;
        font-family: var(--font-mono);
        color: var(--accent-primary);
        margin-top: 8px;
        letter-spacing: 1px;
        opacity: 0.8;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    /* Control Panel */
    aside {
        width: 380px;
        background: var(--panel-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-left: 1px solid var(--panel-border);
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        z-index: 10;
        box-shadow: -10px 0 60px rgba(0,0,0,0.5);
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .panel-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text-muted);
        text-transform: uppercase;
    }
    .status-badge {
        display: flex; align-items: center; gap: 6px;
        font-size: 9px; font-family: var(--font-mono);
        color: #fff;
        background: rgba(0, 243, 255, 0.1);
        padding: 6px 12px;
        border-radius: 100px;
        border: 1px solid rgba(0, 243, 255, 0.2);
    }
    .status-dot {
        width: 5px; height: 5px; background: var(--accent-primary);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-primary);
        animation: pulse 2s infinite;
    }

    /* Controls */
    .control-group { display: flex; flex-direction: column; gap: 12px; }
    .label {
        font-size: 10px; text-transform: uppercase; color: var(--text-muted);
        letter-spacing: 1.5px; font-weight: 600;
        display: flex; justify-content: space-between;
    }
    .value-display { font-family: var(--font-mono); color: #fff; font-size: 11px; }

    /* Custom Slider */
    input[type=range] {
        -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
        background: #fff; margin-top: -5px;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        border: 2px solid rgba(0,0,0,0.2);
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%; height: 2px; background: rgba(255,255,255,0.15); border-radius: 2px;
    }

    /* Theme Grid */
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .theme-btn {
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
        color: var(--text-muted); padding: 12px 0; font-size: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 6px;
        transition: all 0.2s ease;
    }
    .theme-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .theme-btn.active {
        background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3);
        color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }

    /* Action Buttons */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn {
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
        color: #fff; padding: 14px; font-size: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 6px;
        transition: all 0.2s;
    }
    .action-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
    .action-btn:active { transform: translateY(1px); }
    .action-btn.primary {
        grid-column: span 2; background: rgba(0, 243, 255, 0.05);
        border-color: rgba(0, 243, 255, 0.2); color: var(--accent-primary);
    }
    .action-btn.primary:hover { background: rgba(0, 243, 255, 0.15); }
    .action-btn.danger { color: #ff4757; border-color: rgba(255, 71, 87, 0.1); }
    .action-btn.danger:hover { background: rgba(255, 71, 87, 0.1); }

    /* Stats */
    .stats-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);
    }
    .stat-val {
        font-size: 24px; font-weight: 300; color: #fff; font-family: var(--font-mono);
        letter-spacing: -0.5px;
    }
    .footer {
        font-size: 9px; color: rgba(255,255,255,0.2); text-align: center;
        margin-top: 20px; font-family: var(--font-mono); letter-spacing: 0.5px;
    }

    @keyframes pulse {
        0% { opacity: 0.5; box-shadow: 0 0 0px var(--accent-primary); }
        50% { opacity: 1; box-shadow: 0 0 8px var(--accent-primary); }
        100% { opacity: 0.5; box-shadow: 0 0 0px var(--accent-primary); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        <div class="hud-overlay">
            <div class="hud-top-left">
                <div class="hud-title">Genesis</div>
                <div class="hud-subtitle">Topology: Spherical Manifold</div>
            </div>
        </div>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">Simulation Control</div>
            <div class="status-badge"><div class="status-dot"></div> ACTIVE</div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed <span class="value-display" id="speed-val">40 FPS</span></div>
            <input type="range" id="speedRange" min="1" max="60" value="40">
        </div>

        <div class="control-group">
            <div class="label">Grid Density <span class="value-display" id="res-val">200x100</span></div>
            <input type="range" id="resRange" min="100" max="300" value="200">
        </div>

        <div class="control-group">
            <div class="label">Palette Theme</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('cyberpunk')">Cyber</button>
                <button class="theme-btn" onclick="setTheme('biolum')">Bio</button>
                <button class="theme-btn" onclick="setTheme('ember')">Ember</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="action-btn primary" id="btn-toggle">Pause Simulation</button>
                <button class="action-btn" id="btn-reset">Randomize</button>
                <button class="action-btn danger" id="btn-clear">Kill All</button>
            </div>
        </div>

        <div class="stats-grid">
            <div>
                <div class="label">Generation</div>
                <div class="stat-val" id="gen-count">0</div>
            </div>
            <div>
                <div class="label">Population</div>
                <div class="stat-val" id="pop-count">0</div>
            </div>
        </div>

        <div class="footer">
            RENDER: HTML5 CANVAS 2D<br>
            PHYSICS: CONWAY'S RULES
        </div>
    </aside>

<script>
/**
 * SPHERICAL LIFE ENGINE
 * Optimized for visual fidelity and density.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 200; // High density
let rows = 100;
let grid = [];
let ageGrid = []; 
let nextGrid = [];
let nextAgeGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 25; 
let theme = 'cyberpunk';

// Camera
let rotX = 0.3;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Themes
const themes = {
    cyberpunk: {
        name: 'Cyber',
        colorFn: (zNorm, age) => {
            // Electric Blue to Neon Pink
            const hue = 190 + (zNorm * 40) + (age * 2) % 60;
            return `hsla(${hue}, 85%, 55%, 1)`;
        },
        glowColor: '#00f3ff',
        wireColor: 'rgba(0, 243, 255, 0.04)',
        sphereAmbient: 'rgba(0, 20, 40, 0.6)',
        highlightColor: 'rgba(0, 243, 255, 0.1)',
        bgGradient: ['#0a0a15', '#000000']
    },
    biolum: {
        name: 'Bio',
        colorFn: (zNorm, age) => {
            // Deep Teal to Neon Green
            const hue = 150 + (zNorm * 30) + (age * 3) % 40;
            return `hsla(${hue}, 90%, 50%, 1)`;
        },
        glowColor: '#00ff99',
        wireColor: 'rgba(0, 255, 150, 0.04)',
        sphereAmbient: 'rgba(0, 20, 10, 0.6)',
        highlightColor: 'rgba(0, 255, 150, 0.1)',
        bgGradient: ['#00150a', '#000000']
    },
    ember: {
        name: 'Ember',
        colorFn: (zNorm, age) => {
            // Dark Red to Bright Orange/Yellow
            const hue = 0 + (zNorm * 20) + (age * 2) % 40;
            const light = 40 + (zNorm * 20);
            return `hsla(${hue}, 95%, ${light}%, 1)`;
        },
        glowColor: '#ff6600',
        wireColor: 'rgba(255, 100, 0, 0.04)',
        sphereAmbient: 'rgba(30, 10, 0, 0.6)',
        highlightColor: 'rgba(255, 100, 0, 0.1)',
        bgGradient: ['#1a0500', '#000000']
    }
};

function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Int8Array(cols * rows);
    ageGrid = new Int32Array(cols * rows);
    nextGrid = new Int8Array(cols * rows);
    nextAgeGrid = new Int32Array(cols * rows);
    randomize();
    generation = 0;
}

function randomize() {
    grid.fill(0);
    ageGrid.fill(0);
    
    // Random Noise
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.85 ? 1 : 0;
        if(grid[i]) ageGrid[i] = 1;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ageGrid.fill(0);
    updateStats();
}

function getIdx(x, y) { return y * cols + x; }

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            const state = grid[idx];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                nextAgeGrid[idx] = 1; 
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                nextAgeGrid[idx] = 0; 
            } else if (state === 1) {
                nextGrid[idx] = 1;
                nextAgeGrid[idx] = ageGrid[idx] + 1; 
            } else {
                nextGrid[idx] = 0;
                nextAgeGrid[idx] = 0;
            }
        }
    }
    
    // Swap arrays
    let tempG = grid; grid = nextGrid; nextGrid = tempG;
    let tempA = ageGrid; ageGrid = nextAgeGrid; nextAgeGrid = tempA;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = 0;
    for(let i=0; i<grid.length; i++) pop += grid[i];
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering Engine
function drawSphere() {
    // 1. Background
    const grad = ctx.createRadialGradient(width/2, height/2, width*0.1, width/2, height/2, width*0.8);
    grad.addColorStop(0, themes[theme].bgGradient[0]);
    grad.addColorStop(1, themes[theme].bgGradient[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.35;
    
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);
    const fov = 900;

    // 2. Sphere Base (Shadow/Volume)
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = themes[theme].sphereAmbient;
    ctx.fill();

    // 3. Wireframe (Latitudes) - Creates structure
    ctx.strokeStyle = themes[theme].wireColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    // Draw every 4th line to avoid clutter
    for(let i=0; i<rows; i+=4) {
        let started = false;
        for(let j=0; j<=cols; j++) {
            const phi = (i / rows) * Math.PI;
            const theta = (j / cols) * Math.PI * 2;
            
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi) * Math.sin(theta);
            let pz = radius * Math.cos(phi);

            // Rotate Y
            let px2 = px * cosY - pz * sinY;
            let pz2 = px * sinY + pz * cosY;
            // Rotate X
            let py2 = py * cosX - pz2 * sinX;
            let pz3 = py * sinX + pz2 * cosX;

            // Don't draw lines on the back side if we want a solid look, 
            // but for wireframe "hologram" style, we draw all.
            // However, for better depth, let's only draw front wireframe.
            if (pz3 > -radius * 0.2) {
                const scaleP = fov / (fov + pz3);
                const sx = cx + px2 * scaleP;
                const sy = cy + py2 * scaleP;
                if(!started) { ctx.moveTo(sx, sy); started = true; }
                else ctx.lineTo(sx, sy);
            } else {
                started = false; // Break line if it goes behind
            }
        }
    }
    ctx.stroke();

    // 4. Render Cells
    // Optimization: Pre-allocate array to avoid GC pressure
    // We only push active cells.
    let renderList = [];
    
    for (let y = 0; y < rows; y++) {
        const phi = (y / rows) * Math.PI;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                const theta = (x / cols) * Math.PI * 2;
                const cosTheta = Math.cos(theta);
                const sinTheta = Math.sin(theta);

                let px = radius * sinPhi * cosTheta;
                let py = radius * sinPhi * sinTheta;
                let pz = radius * cosPhi;

                let px2 = px * cosY - pz * sinY;
                let pz2 = px * sinY + pz * cosY;
                let py2 = py * cosX - pz2 * sinX;
                let pz3 = py * sinX + pz2 * cosX;

                // Clip back face
                if (pz3 > -radius * 0.1) {
                    const scaleP = fov / (fov + pz3);
                    const sx = cx + px2 * scaleP;
                    const sy = cy + py2 * scaleP;
                    
                    renderList.push({
                        x: sx, y: sy, z: pz3, scale: scaleP,
                        age: ageGrid[getIdx(x, y)],
                        zNorm: pz3 / radius
                    });
                }
            }
        }
    }

    // Sort back to front
    renderList.sort((a, b) => b.z - a.z);

    // Draw
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = themes[theme].glowColor;
    ctx.shadowBlur = 6;

    for (let cell of renderList) {
        const baseSize = (radius / cols) * 1.5; 
        const size = Math.max(0.5, baseSize * cell.scale);
        
        ctx.fillStyle = themes[theme].colorFn(cell.zNorm, cell.age);
        ctx.beginPath();
        ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;

    // 5. Lighting Overlay (The "Volume" Effect)
    // A radial gradient drawn over the sphere to simulate a light source
    // hitting the sphere from the top-left.
    const lightX = cx - radius * 0.4;
    const lightY = cy - radius * 0.4;
    
    const volumeGrad = ctx.createRadialGradient(
        lightX, lightY, radius * 0.1, // Highlight center
        cx, cy, radius // Edge
    );
    // Specular Highlight -> Transparent -> Shadow -> Terminator
    volumeGrad.addColorStop(0, themes[theme].highlightColor); 
    volumeGrad.addColorStop(0.3, 'rgba(0,0,0,0)');       
    volumeGrad.addColorStop(0.8, 'rgba(0,0,0,0.4)');     
    volumeGrad.addColorStop(1, 'rgba(0,0,0,0.9)');      

    ctx.globalCompositeOperation = 'source-atop'; // Only affect existing pixels (sphere)
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = volumeGrad;
    ctx.fill();
    
    // Reset composite
    ctx.globalCompositeOperation = 'source-over';
    
    // Outer Atmosphere Ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = themes[theme].glowColor;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.15;
    ctx.stroke();
    ctx.globalAlpha = 1.0;
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    if (autoRotate && !isDragging) {
        rotY += 0.003; 
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// UI Controls
document.getElementById('btn-toggle').addEventListener('click', () => {
    isRunning = !isRunning;
    const btn = document.getElementById('btn-toggle');
    btn.innerText = isRunning ? "Pause Simulation" : "Resume Simulation";
    document.querySelector('.status-badge').style.opacity = isRunning ? 1 : 0.5;
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
    document.getElementById('speed-val').innerText = val + " FPS";
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    document.getElementById('res-val').innerText = `${cols}x${rows}`;
    initGrid();
});

function setTheme(name) {
    theme = name;
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.toLowerCase() === themes[name].name.toLowerCase()) {
            btn.classList.add('active');
        }
    });
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
