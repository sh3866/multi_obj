<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERICAL LIFE // VOLUME</title>
<style>
    :root {
        --bg-color: #050508;
        --panel-bg: rgba(255, 255, 255, 0.03);
        --panel-border: rgba(255, 255, 255, 0.08);
        --panel-highlight: rgba(255, 255, 255, 0.15);
        --text-main: #ffffff;
        --text-muted: #8899aa;
        --accent-primary: #00f3ff;
        --accent-secondary: #ff00ff;
        --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #0a0a12 0%, #000000 100%);
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* UI Overlay Elements */
    .hud-top {
        position: absolute;
        top: 40px;
        left: 40px;
        pointer-events: none;
        z-index: 5;
    }
    .hud-title {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -1.5px;
        color: var(--text-main);
        text-transform: uppercase;
        line-height: 1;
        background: linear-gradient(to right, #fff, #aaa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .hud-subtitle {
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--accent-primary);
        margin-top: 12px;
        letter-spacing: 2px;
        opacity: 0.8;
        text-transform: uppercase;
    }

    /* Control Panel - Glassmorphism */
    aside {
        width: 400px;
        background: var(--panel-bg);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-left: 1px solid var(--panel-border);
        padding: 50px 40px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        z-index: 10;
        box-shadow: -10px 0 80px rgba(0,0,0,0.4);
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--panel-border);
    }
    .panel-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        color: var(--text-muted);
        text-transform: uppercase;
    }
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-family: var(--font-mono);
        color: var(--accent-primary);
        background: rgba(0, 243, 255, 0.05);
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid rgba(0, 243, 255, 0.15);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.05);
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-primary);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-primary);
        animation: pulse 2s infinite;
    }

    /* Controls */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
    }
    .value-display {
        font-family: var(--font-mono);
        color: #fff;
        opacity: 0.9;
        font-size: 11px;
    }

    /* Custom Range Slider - High Fidelity */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 18px;
        width: 18px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -8px;
        box-shadow: 0 0 15px rgba(255,255,255,0.4);
        border: 2px solid rgba(0,0,0,0.1);
        transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }
    input[type=range]:focus { outline: none; }

    /* Theme Buttons */
    .theme-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
    }
    .theme-btn {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        color: var(--text-muted);
        padding: 16px 0;
        font-family: var(--font-stack);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
        border-radius: 8px;
    }
    .theme-btn:hover {
        background: rgba(255,255,255,0.06);
        color: #fff;
        border-color: rgba(255,255,255,0.1);
    }
    .theme-btn.active {
        background: rgba(255,255,255,0.1);
        border-color: var(--accent-primary);
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }

    /* Action Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    button.action-btn {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--text-main);
        padding: 16px;
        font-family: var(--font-stack);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 8px;
    }
    button.action-btn:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.3);
        transform: translateY(-1px);
    }
    button.action-btn:active { transform: translateY(1px); }
    
    button.primary {
        background: rgba(0, 243, 255, 0.08);
        border-color: rgba(0, 243, 255, 0.3);
        color: var(--accent-primary);
        grid-column: span 2;
    }
    button.primary:hover {
        background: rgba(0, 243, 255, 0.15);
        border-color: var(--accent-primary);
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
    }
    
    button.danger {
        color: #ff4757;
        border-color: rgba(255, 71, 87, 0.1);
    }
    button.danger:hover {
        background: rgba(255, 71, 87, 0.1);
        border-color: rgba(255, 71, 87, 0.3);
    }

    /* Stats */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: auto;
        padding-top: 30px;
        border-top: 1px solid var(--panel-border);
    }
    .stat-item { display: flex; flex-direction: column; gap: 10px; }
    .stat-val {
        font-size: 32px;
        font-weight: 200;
        color: #fff;
        font-family: var(--font-mono);
        letter-spacing: -1px;
        text-shadow: 0 0 20px rgba(255,255,255,0.15);
    }

    .footer {
        font-size: 9px;
        color: rgba(255,255,255,0.2);
        text-align: center;
        margin-top: 20px;
        line-height: 1.6;
        font-family: var(--font-mono);
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    @keyframes pulse {
        0% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-primary); }
        50% { opacity: 1; box-shadow: 0 0 12px var(--accent-primary); }
        100% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-primary); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
        <div class="hud-top">
            <div class="hud-title">Spherical Life</div>
            <div class="hud-subtitle" id="coords-display">SYS.ONLINE // VOLUME RENDER: ACTIVE</div>
        </div>
    </div>

    <aside>
        <div class="panel-header">
            <div class="panel-title">Control Panel</div>
            <div class="status-indicator"><div class="status-dot"></div> RUNNING</div>
        </div>

        <div class="control-group">
            <div class="label">Simulation Speed <span class="value-display" id="speed-val">40 FPS</span></div>
            <input type="range" id="speedRange" min="1" max="60" value="40">
        </div>

        <div class="control-group">
            <div class="label">Grid Density <span class="value-display" id="res-val">160x80</span></div>
            <input type="range" id="resRange" min="80" max="240" value="160">
        </div>

        <div class="control-group">
            <div class="label">Color Theme</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('cyberpunk')">Cyber</button>
                <button class="theme-btn" onclick="setTheme('biolum')">Bio</button>
                <button class="theme-btn" onclick="setTheme('ember')">Ember</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="action-btn primary" id="btn-toggle">Pause / Resume</button>
                <button class="action-btn" id="btn-reset">Randomize</button>
                <button class="action-btn danger" id="btn-clear">Kill All</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="label">Generation</span>
                <span class="stat-val" id="gen-count">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Population</span>
                <span class="stat-val" id="pop-count">0</span>
            </div>
        </div>

        <div class="footer">
            HTML5 CANVAS 2D ENGINE<br>
            TOPOLOGY: SPHERICAL MANIFOLD
        </div>
    </aside>

<script>
/**
 * SPHERICAL GAME OF LIFE ENGINE (REDESIGNED)
 * 
 * Visual Enhancements:
 * 1. 3D Volume: Radial gradient overlay applied via canvas drawing to simulate lighting.
 * 2. Multicolor: Dynamic hue shifting based on cell age, neighbor count, and Z-depth.
 * 3. Spherical Geometry: Fisheye distortion applied to grid cells near edges.
 * 4. High Fidelity: Subtle wireframe, glow effects, and depth-based opacity.
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 160; // Higher default density
let rows = 80;
let grid = [];
let ageGrid = []; 
let nextGrid = [];
let nextAgeGrid = [];
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 25; // ~40fps
let theme = 'cyberpunk';

// Camera / Rotation
let rotX = 0.3;
let rotY = 0;
let autoRotate = true;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

// Themes Configuration
const themes = {
    cyberpunk: {
        name: 'Cyber',
        // Palette: Cyan -> Magenta -> Violet
        colorFn: (zNorm, age, neighbors) => {
            // Hue shifts based on Z depth (200 Blue to 300 Purple) and Age
            const baseHue = 200 + (zNorm * 50); 
            const ageShift = (age * 3) % 100; // Shift hue over time
            const hue = baseHue + ageShift;
            const sat = 80;
            // Lightness varies by depth (brighter in front)
            const light = 50 + (zNorm * 20); 
            return `hsla(${hue}, ${sat}%, ${light}%, 1)`;
        },
        glowColor: '#00f3ff',
        wireColor: 'rgba(0, 243, 255, 0.05)',
        sphereAmbient: 'rgba(0, 243, 255, 0.02)',
        bgGradient: ['#0a0a15', '#000000']
    },
    biolum: {
        name: 'Bio',
        // Palette: Deep Teal -> Neon Green -> Cyan
        colorFn: (zNorm, age, neighbors) => {
            const baseHue = 140 + (zNorm * 40);
            const ageShift = (age * 4) % 60;
            const hue = baseHue + ageShift;
            const light = 40 + (zNorm * 30);
            return `hsla(${hue}, 90%, ${light}%, 1)`;
        },
        glowColor: '#00ff99',
        wireColor: 'rgba(0, 255, 150, 0.05)',
        sphereAmbient: 'rgba(0, 255, 150, 0.02)',
        bgGradient: ['#00150a', '#000000']
    },
    ember: {
        name: 'Ember',
        // Palette: Deep Red -> Orange -> Yellow
        colorFn: (zNorm, age, neighbors) => {
            const baseHue = 0 + (zNorm * 20);
            const ageShift = (age * 2) % 50;
            const hue = baseHue + ageShift;
            const light = 50 + (zNorm * 25);
            return `hsla(${hue}, 100%, ${light}%, 1)`;
        },
        glowColor: '#ff6600',
        wireColor: 'rgba(255, 100, 0, 0.05)',
        sphereAmbient: 'rgba(255, 100, 0, 0.02)',
        bgGradient: ['#1a0500', '#000000']
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Array(cols * rows).fill(0);
    ageGrid = new Array(cols * rows).fill(0);
    nextGrid = new Array(cols * rows).fill(0);
    nextAgeGrid = new Array(cols * rows).fill(0);
    randomize();
    generation = 0;
    updateStats();
}

function randomize() {
    grid.fill(0);
    ageGrid.fill(0);
    
    // 1. Random Noise (20% density)
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.80 ? 1 : 0;
        if(grid[i]) ageGrid[i] = 1;
    }

    // 2. Seed Gliders
    const gliderCount = 25;
    for(let k=0; k<gliderCount; k++) {
        const gx = Math.floor(Math.random() * cols);
        const gy = Math.floor(Math.random() * rows);
        const p = [[0,1], [1,2], [2,0], [2,1], [2,2]];
        p.forEach(offset => {
            const x = (gx + offset[0]) % cols;
            const y = (gy + offset[1]) % rows;
            grid[getIdx(x, y)] = 1;
            ageGrid[getIdx(x, y)] = 1;
        });
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ageGrid.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const state = grid[getIdx(x, y)];
            const neighbors = countNeighbors(x, y);
            const idx = getIdx(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                nextAgeGrid[idx] = 1; 
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                nextAgeGrid[idx] = 0; 
            } else if (state === 1) {
                nextGrid[idx] = 1;
                nextAgeGrid[idx] = ageGrid[idx] + 1; 
            } else {
                nextGrid[idx] = 0;
                nextAgeGrid[idx] = 0;
            }
        }
    }
    
    let tempG = grid; grid = nextGrid; nextGrid = tempG;
    let tempA = ageGrid; ageGrid = nextAgeGrid; nextAgeGrid = tempA;
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = grid.reduce((a, b) => a + b, 0);
    document.getElementById('gen-count').innerText = generation;
    document.getElementById('pop-count').innerText = pop;
}

// Rendering Engine
function drawSphere() {
    // 1. Clear & Background
    const grad = ctx.createRadialGradient(width/2, height/2, width*0.1, width/2, height/2, width*0.8);
    grad.addColorStop(0, themes[theme].bgGradient[0]);
    grad.addColorStop(1, themes[theme].bgGradient[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.35;
    
    // Pre-calculate rotation matrices
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);
    
    const fov = 800; // Field of view

    // 2. Draw Sphere "Volume" (Atmosphere & Shadow)
    // Base ambient glow
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = themes[theme].sphereAmbient;
    ctx.fill();

    // 3. Draw Wireframe (Latitudes) - Subtle
    ctx.strokeStyle = themes[theme].wireColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=1; i<rows; i+=Math.floor(rows/10)) {
        for(let j=0; j<=cols; j++) {
            const phi = (i / rows) * Math.PI;
            const theta = (j / cols) * Math.PI * 2;
            
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi) * Math.sin(theta);
            let pz = radius * Math.cos(phi);

            // Rotate Y
            let px2 = px * cosY - pz * sinY;
            let pz2 = px * sinY + pz * cosY;
            // Rotate X
            let py2 = py * cosX - pz2 * sinX;
            let pz3 = py * sinX + pz2 * cosX;

            const scaleP = fov / (fov + pz3);
            const sx = cx + px2 * scaleP;
            const sy = cy + py2 * scaleP;
            
            if(j===0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }
    ctx.stroke();

    // 4. Prepare Cells for Rendering
    let renderList = [];

    // Optimization: Loop 1D array
    for (let y = 0; y < rows; y++) {
        const phi = (y / rows) * Math.PI;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                const theta = (x / cols) * Math.PI * 2;
                const cosTheta = Math.cos(theta);
                const sinTheta = Math.sin(theta);

                // 3D Coordinates
                let px = radius * sinPhi * cosTheta;
                let py = radius * sinPhi * sinTheta;
                let pz = radius * cosPhi;

                // Rotate Y
                let px2 = px * cosY - pz * sinY;
                let pz2 = px * sinY + pz * cosY;
                
                // Rotate X
                let py2 = py * cosX - pz2 * sinX;
                let pz3 = py * sinX + pz2 * cosX;

                // Project
                const scaleP = fov / (fov + pz3);
                const sx = cx + px2 * scaleP;
                const sy = cy + py2 * scaleP;
                
                // Normalized Z for color (-1 to 1 approx)
                const zNorm = pz3 / radius; 
                
                // Count neighbors for color logic (optional, but adds detail)
                const neighbors = countNeighbors(x, y);

                renderList.push({
                    x: sx,
                    y: sy,
                    z: pz3,
                    scale: scaleP,
                    age: ageGrid[getIdx(x, y)],
                    zNorm: zNorm,
                    neighbors: neighbors
                });
            }
        }
    }

    // Sort back to front (Painter's Algorithm)
    renderList.sort((a, b) => b.z - a.z);

    // 5. Draw Cells
    // Use additive blending for "Glow" effect
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = themes[theme].glowColor;
    ctx.shadowBlur = 8;

    for (let cell of renderList) {
        // Only draw if in front of camera plane
        if (cell.z > -radius * 0.1) {
            // Dynamic size based on perspective
            const baseSize = (radius / cols) * 1.8; 
            const size = Math.max(0.5, baseSize * cell.scale);
            
            // Dynamic Color based on Z-depth and Age
            ctx.fillStyle = themes[theme].colorFn(cell.zNorm, cell.age, cell.neighbors);
            
            ctx.beginPath();
            ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Reset context
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;

    // 6. Apply 3D Volume Overlay (Shading)
    // This creates the illusion of a solid 3D object by darkening the edges
    // and brightening the center, simulating a light source.
    const volumeGrad = ctx.createRadialGradient(
        cx - radius*0.3, cy - radius*0.3, radius * 0.2, // Light source offset
        cx, cy, radius
    );
    volumeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)'); // Highlight
    volumeGrad.addColorStop(0.4, 'rgba(0, 0, 0, 0)');       // Midtone
    volumeGrad.addColorStop(0.8, 'rgba(0, 0, 0, 0.6)');     // Shadow start
    volumeGrad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');      // Terminator

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = volumeGrad;
    ctx.fill();
    
    // Outer Glow (Atmosphere)
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = themes[theme].glowColor;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.15;
    ctx.stroke();
    ctx.globalAlpha = 1.0;
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    // Auto rotate if not dragging
    if (autoRotate && !isDragging) {
        rotY += 0.002; 
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    document.getElementById('coords-display').innerText = 
        `X: ${(x/width*360).toFixed(1)}° | Y: ${(y/height*180).toFixed(1)}° | Z: ${(Math.sin(Date.now()/1000)*100).toFixed(0)}`;

    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.008;
        rotX += dy * 0.008;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// UI Controls
document.getElementById('btn-toggle').addEventListener('click', () => {
    isRunning = !isRunning;
    const btn = document.getElementById('btn-toggle');
    btn.innerText = isRunning ? "Pause" : "Resume";
    document.querySelector('.status-indicator').style.opacity = isRunning ? 1 : 0.5;
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
    document.getElementById('speed-val').innerText = val + " FPS";
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    document.getElementById('res-val').innerText = `${cols}x${rows}`;
    initGrid();
});

function setTheme(name) {
    theme = name;
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.innerText.toLowerCase() === themes[name].name.toLowerCase()) {
            btn.classList.add('active');
        }
    });
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
