<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERICAL LIFE // VISUAL REVISION</title>
<style>
    :root {
        --bg-deep: #050505;
        --bg-panel: rgba(10, 15, 20, 0.85);
        --text-main: #e0e0e0;
        --text-muted: #8a8a95;
        --accent-primary: #00f3ff;
        --accent-secondary: #ff0055;
        --accent-tertiary: #bd00ff;
        --border-color: rgba(255, 255, 255, 0.1);
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        --panel-width: 360px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        background-image: radial-gradient(circle at 50% 50%, #121218 0%, #000000 100%);
        color: var(--text-main);
        font-family: var(--font-mono);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* Control Panel */
    aside {
        width: var(--panel-width);
        background: var(--bg-panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-left: 1px solid var(--border-color);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        z-index: 10;
        box-shadow: -20px 0 60px rgba(0,0,0,0.8);
    }

    /* Header & Stats */
    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 20px;
    }
    .panel-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #fff;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    
    .stats-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 10px;
    }
    .stat-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .stat-label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        font-weight: 600;
    }
    .stat-value {
        font-family: var(--font-mono);
        font-size: 24px;
        color: var(--accent-primary);
        font-weight: 700;
        line-height: 1;
        text-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    /* Controls Section */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .label {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 600;
    }

    /* Custom Sliders */
    .slider-container {
        position: relative;
        width: 100%;
        height: 24px;
        display: flex;
        align-items: center;
    }
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
        z-index: 2;
        position: relative;
    }
    /* Track Background */
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }
    /* Thumb */
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: var(--accent-primary);
        margin-top: -6px;
        box-shadow: 0 0 10px var(--accent-primary);
        border: 2px solid #fff;
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    button {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 14px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 2px;
    }
    button:hover {
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.3);
        color: #fff;
    }

    /* Primary Action Button */
    button.primary {
        grid-column: span 2;
        background: var(--accent-primary);
        color: #000;
        border: 1px solid var(--accent-primary);
        font-size: 12px;
        padding: 16px;
        margin-bottom: 4px;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        font-weight: 800;
    }
    button.primary:hover {
        background: #fff;
        border-color: #fff;
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
    }
    button.primary.paused {
        background: #fff;
        color: #000;
        border-color: #fff;
        box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    button.danger {
        color: var(--accent-secondary);
        border-color: rgba(255, 0, 85, 0.3);
    }
    button.danger:hover {
        background: rgba(255, 0, 85, 0.1);
        border-color: var(--accent-secondary);
        color: #fff;
    }

    /* Theme Selector (Segmented Control) */
    .theme-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 4px;
        background: rgba(0,0,0,0.3);
        padding: 4px;
        border-radius: 4px;
        border: 1px solid var(--border-color);
    }
    .theme-btn {
        padding: 10px 4px;
        font-size: 10px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        border-radius: 2px;
    }
    .theme-btn:hover {
        background: rgba(255,255,255,0.05);
    }
    .theme-btn.active {
        background: rgba(255,255,255,0.1);
        color: #fff;
        box-shadow: 0 0 8px rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
    }

    /* Footer */
    .footer {
        margin-top: auto;
        font-family: var(--font-mono);
        font-size: 9px;
        color: rgba(255,255,255,0.4);
        line-height: 1.6;
        border-top: 1px solid var(--border-color);
        padding-top: 20px;
        letter-spacing: 1px;
    }

    /* Status Indicator */
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--accent-primary);
        text-transform: uppercase;
        font-weight: 700;
    }
    .status-dot {
        width: 8px;
        height: 8px;
        background-color: var(--accent-primary);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-primary);
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-primary); }
        50% { opacity: 1; box-shadow: 0 0 15px var(--accent-primary); }
        100% { opacity: 0.4; box-shadow: 0 0 0px var(--accent-primary); }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
    </div>

    <aside>
        <!-- Header & Stats -->
        <div>
            <div class="panel-header">
                <div class="panel-title">System Control</div>
                <div class="status-indicator"><div class="status-dot"></div> ONLINE</div>
            </div>
            
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">Generation</span>
                    <span class="stat-value" id="gen-count">0000</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Population</span>
                    <span class="stat-value" id="pop-count">0</span>
                </div>
            </div>
        </div>

        <!-- Simulation Settings -->
        <div class="control-group">
            <div class="label">Simulation Speed</div>
            <div class="slider-container">
                <input type="range" id="speedRange" min="1" max="60" value="40">
            </div>
        </div>

        <div class="control-group">
            <div class="label">Grid Resolution</div>
            <div class="slider-container">
                <input type="range" id="resRange" min="40" max="100" value="70">
            </div>
        </div>

        <!-- Visuals -->
        <div class="control-group">
            <div class="label">Color Material</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('neon')" id="btn-theme-neon">Neon</button>
                <button class="theme-btn" onclick="setTheme('heat')" id="btn-theme-heat">Heat</button>
                <button class="theme-btn" onclick="setTheme('matrix')" id="btn-theme-matrix">Mono</button>
            </div>
        </div>

        <!-- Actions -->
        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="primary" id="btn-toggle">Pause Simulation</button>
                <button class="danger" id="btn-reset">Randomize</button>
                <button id="btn-clear">Clear Grid</button>
            </div>
        </div>

        <div class="footer">
            CANVAS 2D RENDERER<br>
            TOPOLOGY: SPHERICAL<br>
            LOGIC: CONWAY'S GOL
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - Visual Revision
 * Focus: High density, rich colors, bloom effects, clean UI
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

// State
let width, height;
// Higher default resolution per critique
let cols = 70; 
let rows = 35;
let grid = [];
let nextGrid = [];
let ages = []; 
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 25; // Faster default
let theme = 'neon';

// Camera
let rotX = 0.2;
let rotY = 0;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };
let autoRotateSpeed = 0.002;

// Themes Configuration
const themes = {
    neon: {
        wireframe: 'rgba(0, 243, 255, 0.05)',
        glow: '#00f3ff',
        ambient: 'rgba(0, 243, 255, 0.1)',
        cellColor: (age, maxAge) => {
            // Neon Cycle: Cyan -> Magenta -> Purple
            const hue = (200 + (age * 5)) % 300; 
            return `hsla(${hue}, 100%, 60%, 0.9)`;
        }
    },
    heat: {
        wireframe: 'rgba(255, 69, 0, 0.05)',
        glow: '#ff4500',
        ambient: 'rgba(255, 69, 0, 0.1)',
        cellColor: (age, maxAge) => {
            // Heat Map: Blue (young) -> Red -> White (old)
            const hue = 240 - (age * 4) % 240; 
            return `hsla(${hue}, 100%, 50%, 0.9)`;
        }
    },
    matrix: {
        wireframe: 'rgba(0, 255, 0, 0.05)',
        glow: '#00ff00',
        ambient: 'rgba(0, 255, 0, 0.1)',
        cellColor: (age, maxAge) => {
            return `rgba(0, 255, 70, 0.8)`;
        }
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Int8Array(cols * rows);
    nextGrid = new Int8Array(cols * rows);
    ages = new Uint8Array(cols * rows);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        // Higher density start
        grid[i] = Math.random() > 0.55 ? 1 : 0;
        ages[i] = grid[i] ? Math.floor(Math.random() * 10) : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ages.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            const state = grid[idx];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                ages[idx] = 1;
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                ages[idx] = 0;
            } else {
                nextGrid[idx] = state;
                if (state === 1) ages[idx]++;
            }
        }
    }
    
    // Swap
    let tempGrid = grid; grid = nextGrid; nextGrid = tempGrid;
    generation++;
    updateStats();
}

function updateStats() {
    let pop = 0;
    for(let i=0; i<grid.length; i++) if(grid[i]) pop++;
    document.getElementById('gen-count').innerText = generation.toString().padStart(4, '0');
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    // Clear
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.38;

    // 1. Ambient Glow (The "Geode" look)
    const gradient = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.5);
    gradient.addColorStop(0, 'rgba(255,255,255,0)');
    gradient.addColorStop(0.5, themes[theme].ambient);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 2. Wireframe (Dense Grid)
    ctx.lineWidth = 0.5;
    ctx.beginPath();

    // Latitudes
    for (let i = 1; i < rows; i++) {
        const phi = (i / rows) * Math.PI;
        const r3d = radius * Math.sin(phi);
        const y3d = -radius * Math.cos(phi);
        
        for (let k = 0; k <= cols; k++) {
            const theta = (k / cols) * Math.PI * 2;
            let px = r3d * Math.cos(theta);
            let py = y3d;
            let pz = r3d * Math.sin(theta);

            // Rotate Y
            let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
            let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
            
            // Rotate X
            let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
            let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (k===0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }

    // Longitudes
    for (let i = 0; i < cols; i++) {
        const theta = (i / cols) * Math.PI * 2;
        ctx.moveTo(0,0); 
        for (let k = 0; k <= rows; k++) {
            const phi = (k / rows) * Math.PI;
            
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = -radius * Math.cos(phi);
            let pz = radius * Math.sin(phi) * Math.sin(theta);

            let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
            let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
            
            let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
            let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (k===0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }
    ctx.strokeStyle = themes[theme].wireframe;
    ctx.stroke();

    // 3. Draw Cells (The "Solid" Look)
    const cellsToDraw = [];

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                const phi = (y / rows) * Math.PI;
                const theta = (x / cols) * Math.PI * 2;

                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = -radius * Math.cos(phi);
                let pz = radius * Math.sin(phi) * Math.sin(theta);

                let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
                let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
                
                let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
                let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

                const fov = 800;
                const scale = fov / (fov + pz3);
                
                const sx = cx + px2 * scale;
                const sy = cy + py2 * scale;
                
                // Larger cells to look dense/solid
                const size = Math.max(2, (radius / cols) * scale * 1.8); 

                cellsToDraw.push({
                    x: sx,
                    y: sy,
                    z: pz3,
                    size: size,
                    age: ages[getIdx(x, y)]
                });
            }
        }
    }

    // Sort: Back to Front
    cellsToDraw.sort((a, b) => b.z - a.z);

    // Find max age for heat map normalization
    let maxAge = 1;
    for(let a of ages) if(a > maxAge) maxAge = a;

    for (let c of cellsToDraw) {
        if (c.z < 0) {
            const color = themes[theme].cellColor(c.age, maxAge);
            
            // Bloom effect
            ctx.shadowBlur = 8;
            ctx.shadowColor = themes[theme].glow;
            ctx.fillStyle = color;
            
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Inner highlight for "gem" look
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(c.x - c.size*0.2, c.y - c.size*0.2, c.size/3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 4. Glass Edge
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    if (!isDragging) {
        rotY += autoRotateSpeed;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.005;
        rotX += dy * 0.005;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// UI Controls
const btnToggle = document.getElementById('btn-toggle');
btnToggle.addEventListener('click', () => {
    isRunning = !isRunning;
    if(isRunning) {
        btnToggle.innerText = "Pause Simulation";
        btnToggle.classList.remove('paused');
    } else {
        btnToggle.innerText = "Resume Simulation";
        btnToggle.classList.add('paused');
    }
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

function setTheme(name) {
    theme = name;
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-theme-${name}`).classList.add('active');
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
