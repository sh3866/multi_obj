<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life // Volumetric</title>
<style>
    :root {
        --bg-deep: #050507;
        --panel-bg: rgba(12, 12, 14, 0.75);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text-main: #e0e0e0;
        --text-muted: #6e7681;
        --accent-cyan: #00f0ff;
        --accent-magenta: #ff00aa;
        --accent-green: #0aff00;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
        --panel-width: 340px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        -webkit-font-smoothing: antialiased;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
        /* Subtle vignette background */
        background: radial-gradient(circle at 50% 50%, #10121a 0%, #030305 100%);
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* Control Panel */
    aside {
        width: var(--panel-width);
        background: var(--panel-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-left: 1px solid var(--panel-border);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        z-index: 10;
        box-shadow: -10px 0 50px rgba(0,0,0,0.6);
    }

    /* Header */
    .panel-header {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 16px;
    }
    .panel-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
    }
    .panel-subtitle {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.5px;
    }
    
    /* Stats */
    .stats-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        background: rgba(0,0,0,0.2);
        padding: 16px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
    }
    .stat-box {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .stat-label {
        font-size: 9px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 700;
    }
    .stat-value {
        font-family: var(--font-mono);
        font-size: 18px;
        color: #fff;
        font-weight: 400;
        letter-spacing: -0.5px;
        text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* Controls Section */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .label {
        font-size: 9px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.8px;
        font-weight: 700;
    }

    /* Custom Sliders */
    .slider-container {
        position: relative;
        width: 100%;
        height: 32px;
        display: flex;
        align-items: center;
    }
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
        z-index: 2;
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 4px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 4px; /* Square for tech feel */
        background: #fff;
        margin-top: -6px;
        box-shadow: 0 0 10px rgba(255,255,255,0.4);
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.1);
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    button {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.15);
        color: #ccc;
        padding: 12px;
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 6px;
    }
    button:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255, 255, 255, 0.4);
        color: #fff;
        transform: translateY(-1px);
    }
    button:active {
        transform: translateY(0);
    }

    /* Primary Action */
    button.primary {
        grid-column: span 2;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 11px;
        padding: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }
    button.primary:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: #fff;
        box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    /* Theme Selector (Pill) */
    .theme-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        background: rgba(0,0,0,0.3);
        padding: 4px;
        border-radius: 10px;
        border: 1px solid var(--panel-border);
    }
    .theme-btn {
        padding: 8px 4px;
        font-size: 10px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        border-radius: 6px;
        text-transform: uppercase;
        font-weight: 700;
        transition: all 0.3s ease;
    }
    .theme-btn:hover {
        color: #fff;
    }
    .theme-btn.active {
        background: #fff;
        color: #000;
        box-shadow: 0 2px 8px rgba(255,255,255,0.2);
    }

</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
    </div>

    <aside>
        <!-- Header & Stats -->
        <div>
            <div class="panel-header">
                <div class="panel-title">System Control</div>
                <div class="panel-subtitle">Volumetric Life</div>
            </div>
            
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">Generation</span>
                    <span class="stat-value" id="gen-count">0000</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Population</span>
                    <span class="stat-value" id="pop-count">0</span>
                </div>
            </div>
        </div>

        <!-- Simulation Settings -->
        <div class="control-group">
            <div class="label">Simulation Speed</div>
            <div class="slider-container">
                <input type="range" id="speedRange" min="1" max="60" value="30">
            </div>
        </div>

        <div class="control-group">
            <div class="label">Grid Resolution</div>
            <div class="slider-container">
                <input type="range" id="resRange" min="80" max="180" value="140">
            </div>
        </div>

        <!-- Visuals -->
        <div class="control-group">
            <div class="label">Color Material</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('cyber')" id="btn-theme-cyber">Cyber</button>
                <button class="theme-btn" onclick="setTheme('plasma')" id="btn-theme-plasma">Plasma</button>
                <button class="theme-btn" onclick="setTheme('toxic')" id="btn-theme-toxic">Toxic</button>
            </div>
        </div>

        <!-- Actions -->
        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="primary" id="btn-toggle">Pause Simulation</button>
                <button id="btn-reset">Randomize</button>
                <button id="btn-clear">Clear Grid</button>
            </div>
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - Design Revision
 * Focus: High Density, Cyber-Organic Palette, Obsidian Form, Clean UI
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 140; // High density default
let rows = 70;  // Hemisphere ratio
let grid = [];
let nextGrid = [];
let ages = []; 
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; 
let theme = 'cyber';

// Camera
let rotX = 0.1;
let rotY = 0;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };
let autoRotateSpeed = 0.002;

// Themes Configuration - Cyber-Organic
const themes = {
    cyber: {
        // Cyan -> Magenta -> Deep Purple
        cellColor: (age, maxAge) => {
            const norm = Math.min(1, age / Math.max(1, maxAge));
            // 0 (New) = Cyan/White, 0.5 = Magenta, 1 (Old) = Deep Purple
            const hue = 190 - (norm * 140); // 190 -> 50 (wait, 190-140=50 is orange? No. 190(Cyan) -> 50(Yellow) bad. 
            // Let's do: 190 (Cyan) -> 280 (Purple).
            const h = 190 + (norm * 90);
            const s = 100;
            const l = 50 + (norm * 20); // Brighter as it ages? Or darker?
            // Let's make New = Bright, Old = Darker
            const light = 80 - (norm * 40); 
            return `hsla(${h}, ${s}%, ${light}%, 1)`;
        }
    },
    plasma: {
        // Hot Pink -> Electric Blue
        cellColor: (age, maxAge) => {
            const norm = Math.min(1, age / Math.max(1, maxAge));
            const hue = 300 - (norm * 100); // 300 (Magenta) -> 200 (Blue)
            return `hsla(${hue}, 100%, 60%, 1)`;
        }
    },
    toxic: {
        // Acid Green -> Dark Forest
        cellColor: (age, maxAge) => {
            const norm = Math.min(1, age / Math.max(1, maxAge));
            const light = 70 - (norm * 50);
            return `hsla(110, 100%, ${light}%, 1)`;
        }
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Int8Array(cols * rows);
    nextGrid = new Int8Array(cols * rows);
    ages = new Uint8Array(cols * rows);
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        // Higher density for the "contiguous surface" look
        grid[i] = Math.random() > 0.5 ? 1 : 0;
        ages[i] = grid[i] ? Math.floor(Math.random() * 5) : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ages.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            const state = grid[idx];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                ages[idx] = 1; // Reset age on birth
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                ages[idx] = 0;
            } else {
                nextGrid[idx] = state;
                if (state === 1) ages[idx]++;
            }
        }
    }
    
    // Swap
    let tempGrid = grid; grid = nextGrid; nextGrid = tempGrid;
    generation++;
    updateStats();
}

function updateStats() {
    let pop = 0;
    for(let i=0; i<grid.length; i++) if(grid[i]) pop++;
    document.getElementById('gen-count').innerText = generation.toString().padStart(4, '0');
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    // Clear
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.35;

    // 1. Atmosphere / Glow
    const gradient = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, radius * 1.6);
    let atmoColor = 'rgba(0, 240, 255, 0.05)';
    if(theme === 'plasma') atmoColor = 'rgba(255, 0, 170, 0.05)';
    if(theme === 'toxic') atmoColor = 'rgba(10, 255, 0, 0.05)';

    gradient.addColorStop(0, 'rgba(255,255,255,0.02)'); 
    gradient.addColorStop(0.7, atmoColor); 
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 1.6, 0, Math.PI * 2);
    ctx.fill();

    // 2. The "Obsidian" Form (Backface)
    // Draw the sphere backface to give it volume against the background
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#020203'; // Very dark grey
    ctx.fill();
    
    // Subtle rim light on the sphere body
    const rimGrad = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius);
    rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
    rimGrad.addColorStop(1, 'rgba(255,255,255,0.05)');
    ctx.fillStyle = rimGrad;
    ctx.fill();

    // 3. Wireframe (Faint structure)
    ctx.lineWidth = 0.5;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.beginPath();

    // Latitudes
    for (let i = 1; i < rows; i++) {
        const phi = (i / rows) * Math.PI;
        const r3d = radius * Math.sin(phi);
        const y3d = -radius * Math.cos(phi);
        
        for (let k = 0; k <= cols; k++) {
            const theta = (k / cols) * Math.PI * 2;
            let px = r3d * Math.cos(theta);
            let py = y3d;
            let pz = r3d * Math.sin(theta);

            // Rotate Y
            let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
            let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
            
            // Rotate X
            let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
            let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (k===0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }

    // Longitudes
    for (let i = 0; i < cols; i++) {
        const theta = (i / cols) * Math.PI * 2;
        for (let k = 0; k <= rows; k++) {
            const phi = (k / rows) * Math.PI;
            
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = -radius * Math.cos(phi);
            let pz = radius * Math.sin(phi) * Math.sin(theta);

            let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
            let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
            
            let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
            let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (k===0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }
    ctx.stroke();

    // 4. Draw Cells (Solid, Dense, Bloom)
    const cellsToDraw = [];
    let maxAge = 1;

    // Pre-calculate positions
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                const phi = (y / rows) * Math.PI;
                const theta = (x / cols) * Math.PI * 2;

                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = -radius * Math.cos(phi);
                let pz = radius * Math.sin(phi) * Math.sin(theta);

                let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
                let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
                
                let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
                let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

                const fov = 800;
                const scale = fov / (fov + pz3);
                
                const sx = cx + px2 * scale;
                const sy = cy + py2 * scale;
                
                // Size calculation: 
                // Circumference / cols = cell width. 
                // We want them to overlap slightly to look like a dense mesh.
                const size = (radius / cols) * scale * 2.5; 

                const age = ages[getIdx(x, y)];
                if(age > maxAge) maxAge = age;

                cellsToDraw.push({
                    x: sx,
                    y: sy,
                    z: pz3,
                    size: size,
                    age: age
                });
            }
        }
    }

    // Sort: Back to Front (Painter's Algorithm)
    cellsToDraw.sort((a, b) => b.z - a.z);

    // Use 'lighter' composite operation for "glowing" overlap effect
    ctx.globalCompositeOperation = 'lighter';

    for (let c of cellsToDraw) {
        // Only draw if on front hemisphere (or slightly behind for depth)
        if (c.z < 50) {
            const color = themes[theme].cellColor(c.age, maxAge);
            
            // Glow effect
            ctx.shadowBlur = 8;
            ctx.shadowColor = color;
            
            // Draw
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0; 
        }
    }
    
    // Reset composite
    ctx.globalCompositeOperation = 'source-over';
    
    // 5. Front Face Overlay (Glassy sheen)
    // Adds to the "Obsidian/Glass" feel
    const sheen = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius);
    sheen.addColorStop(0, 'rgba(255,255,255,0.03)');
    sheen.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sheen;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.fill();
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    if (!isDragging) {
        rotY += autoRotateSpeed;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.005;
        rotX += dy * 0.005;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// UI Controls
const btnToggle = document.getElementById('btn-toggle');
btnToggle.addEventListener('click', () => {
    isRunning = !isRunning;
    if(isRunning) {
        btnToggle.innerText = "Pause Simulation";
    } else {
        btnToggle.innerText = "Resume Simulation";
    }
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

function setTheme(name) {
    theme = name;
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-theme-${name}`).classList.add('active');
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
