<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERICAL LIFE // SYSTEM</title>
<style>
    :root {
        --bg-deep: #050505;
        --bg-panel: rgba(20, 20, 25, 0.65);
        --text-main: #e0e0e0;
        --text-muted: #7a7a85;
        --accent-cyan: #00f3ff;
        --accent-pink: #ff0055;
        --accent-green: #00ff9d;
        --border-color: rgba(255, 255, 255, 0.08);
        --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        --panel-width: 340px;
        --gap: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        background-image: radial-gradient(circle at 50% 50%, #1a1a24 0%, #000000 100%);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Canvas Area */
    #canvas-container {
        flex-grow: 1;
        position: relative;
        cursor: grab;
        overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }

    canvas { display: block; width: 100%; height: 100%; }

    /* Control Panel */
    aside {
        width: var(--panel-width);
        background: var(--bg-panel);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-left: 1px solid var(--border-color);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        z-index: 10;
        box-shadow: -10px 0 40px rgba(0,0,0,0.6);
    }

    /* Header & Stats */
    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 16px;
    }
    .panel-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #fff;
        text-transform: uppercase;
    }
    
    .stats-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 8px;
    }
    .stat-box {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .stat-label {
        font-size: 9px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 600;
    }
    .stat-value {
        font-family: var(--font-mono);
        font-size: 20px;
        color: #fff;
        font-weight: 400;
        line-height: 1;
    }

    /* Controls Section */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 600;
    }

    /* Sliders */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #fff;
        margin-top: -7px;
        box-shadow: 0 0 10px rgba(255,255,255,0.3);
        border: 2px solid #000;
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.15);
        border-radius: 2px;
    }

    /* Buttons */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    button {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 14px;
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 4px;
    }
    button:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.2);
        color: #fff;
    }
    button:active {
        transform: translateY(1px);
        background: rgba(255,255,255,0.02);
    }

    /* Primary Action Button */
    button.primary {
        grid-column: span 2;
        background: rgba(0, 243, 255, 0.08);
        border: 1px solid rgba(0, 243, 255, 0.3);
        color: var(--accent-cyan);
        font-size: 12px;
        padding: 16px;
        margin-bottom: 8px;
    }
    button.primary:hover {
        background: rgba(0, 243, 255, 0.15);
        border-color: var(--accent-cyan);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
    }
    
    button.danger {
        color: var(--accent-pink);
        border-color: rgba(255, 0, 85, 0.2);
    }
    button.danger:hover {
        background: rgba(255, 0, 85, 0.1);
        border-color: var(--accent-pink);
    }

    /* Theme Selector */
    .theme-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
    }
    .theme-btn {
        padding: 8px 4px;
        font-size: 9px;
        border-radius: 2px;
    }
    .theme-btn.active {
        background: #fff;
        color: #000;
        border-color: #fff;
    }

    /* Footer */
    .footer {
        margin-top: auto;
        font-family: var(--font-mono);
        font-size: 9px;
        color: rgba(255,255,255,0.2);
        line-height: 1.5;
        border-top: 1px solid var(--border-color);
        padding-top: 16px;
    }

    /* Status Indicator */
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--accent-green);
        margin-top: 4px;
    }
    .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-green);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-green);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
    }
</style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="sphereCanvas"></canvas>
    </div>

    <aside>
        <!-- Header & Stats -->
        <div>
            <div class="panel-header">
                <div class="panel-title">System Control</div>
                <div class="status-indicator"><div class="status-dot"></div> ACTIVE</div>
            </div>
            
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">Generation</span>
                    <span class="stat-value" id="gen-count">0000</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Population</span>
                    <span class="stat-value" id="pop-count">0</span>
                </div>
            </div>
        </div>

        <!-- Simulation Settings -->
        <div class="control-group">
            <div class="label">Simulation Speed</div>
            <input type="range" id="speedRange" min="1" max="60" value="30">
        </div>

        <div class="control-group">
            <div class="label">Grid Density</div>
            <input type="range" id="resRange" min="30" max="90" value="50">
        </div>

        <!-- Visuals -->
        <div class="control-group">
            <div class="label">Color Material</div>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="setTheme('neon')" id="btn-theme-neon">Neon</button>
                <button class="theme-btn" onclick="setTheme('heat')" id="btn-theme-heat">Heat</button>
                <button class="theme-btn" onclick="setTheme('matrix')" id="btn-theme-matrix">Mono</button>
            </div>
        </div>

        <!-- Actions -->
        <div class="control-group">
            <div class="label">Actions</div>
            <div class="btn-grid">
                <button class="primary" id="btn-toggle">Pause Simulation</button>
                <button class="danger" id="btn-reset">Randomize</button>
                <button id="btn-clear">Clear Grid</button>
            </div>
        </div>

        <div class="footer">
            CANVAS 2D RENDERER<br>
            TOPOLOGY: SPHERICAL<br>
            LOGIC: CONWAY'S GOL
        </div>
    </aside>

<script>
/**
 * Spherical Game of Life - Visual Revision
 */

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

// State
let width, height;
let cols = 50; // Longitude
let rows = 25; // Latitude
let grid = [];
let nextGrid = [];
let ages = []; // Track age for color heatmaps
let generation = 0;
let isRunning = true;
let lastTime = 0;
let fpsInterval = 33; 
let theme = 'neon';

// Camera
let rotX = 0.2; // Tilted slightly
let rotY = 0;
let isDragging = false;
let lastMouse = { x: 0, y: 0 };
let autoRotateSpeed = 0.003;

// Themes Configuration
const themes = {
    neon: {
        wireframe: 'rgba(0, 243, 255, 0.12)',
        glow: '#00f3ff',
        cellColor: (age) => {
            // Shift between Cyan and Magenta based on age
            const shift = (age % 10) / 10;
            const r = Math.floor(255 * shift);
            const g = Math.floor(255 * (1 - shift) * 0.8);
            const b = 255;
            return `rgba(${r}, ${g}, ${b}, ${0.6 + (age % 5) * 0.1})`;
        }
    },
    heat: {
        wireframe: 'rgba(255, 69, 0, 0.12)',
        glow: '#ff4500',
        cellColor: (age) => {
            // Blue (dead/cold) -> Red -> Yellow (hot/old)
            // We only draw alive cells, so this maps age to hot colors
            const hue = (age * 5) % 60; // 0 to 60 (Red to Yellow)
            return `hsl(${hue}, 100%, 50%)`;
        }
    },
    matrix: {
        wireframe: 'rgba(0, 255, 0, 0.1)',
        glow: '#00ff00',
        cellColor: (age) => {
            const alpha = 0.5 + (Math.random() * 0.5);
            return `rgba(0, 255, 70, ${alpha})`;
        }
    }
};

// Setup Canvas
function resize() {
    width = container.clientWidth;
    height = container.clientHeight;
    // Handle high DPI
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Grid Logic
function initGrid() {
    grid = new Int8Array(cols * rows);
    nextGrid = new Int8Array(cols * rows);
    ages = new Uint8Array(cols * rows); // Store age of current cell
    randomize();
    generation = 0;
}

function randomize() {
    for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() > 0.65 ? 1 : 0;
        ages[i] = grid[i] ? Math.floor(Math.random() * 20) : 0;
    }
    updateStats();
}

function clearGrid() {
    grid.fill(0);
    ages.fill(0);
    updateStats();
}

function getIdx(x, y) {
    return y * cols + x;
}

function countNeighbors(x, y) {
    let sum = 0;
    for (let i = -1; i < 2; i++) {
        for (let j = -1; j < 2; j++) {
            if (i === 0 && j === 0) continue;
            let col = (x + i + cols) % cols;
            let row = (y + j + rows) % rows;
            sum += grid[getIdx(col, row)];
        }
    }
    return sum;
}

function update() {
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = getIdx(x, y);
            const state = grid[idx];
            const neighbors = countNeighbors(x, y);
            
            if (state === 0 && neighbors === 3) {
                nextGrid[idx] = 1;
                ages[idx] = 1; // Reborn
            } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                nextGrid[idx] = 0;
                ages[idx] = 0; // Dead
            } else {
                nextGrid[idx] = state;
                if (state === 1) ages[idx]++; // Age up
            }
        }
    }
    
    // Swap
    let tempGrid = grid; grid = nextGrid; nextGrid = tempGrid;
    // Ages don't need swap logic if we update in place based on the *new* grid state above? 
    // Actually, the logic above updates ages based on the decision made for the NEXT frame.
    // But wait, we used `grid` (current) to decide. So `ages` array needs to track the state.
    // The logic above modifies `ages` directly. This is fine as long as we don't read `ages` for logic.
    
    generation++;
    updateStats();
}

function updateStats() {
    let pop = 0;
    for(let i=0; i<grid.length; i++) if(grid[i]) pop++;
    document.getElementById('gen-count').innerText = generation.toString().padStart(4, '0');
    document.getElementById('pop-count').innerText = pop;
}

// Rendering
function drawSphere() {
    // Clear with transparency to allow CSS gradient to show
    ctx.clearRect(0, 0, width, height);
    
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.38;

    // 1. Draw Sphere Atmosphere/Glow
    const gradient = ctx.createRadialGradient(cx, cy, radius * 0.8, cx, cy, radius * 1.4);
    gradient.addColorStop(0, 'rgba(255,255,255,0)');
    gradient.addColorStop(0.8, themes[theme].glow + '11'); // Very faint
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 1.4, 0, Math.PI * 2);
    ctx.fill();

    // 2. Draw Wireframe (Lat/Long)
    ctx.strokeStyle = themes[theme].wireframe;
    ctx.lineWidth = 1;
    ctx.beginPath();

    // Latitudes
    for (let i = 1; i < rows; i++) {
        const phi = (i / rows) * Math.PI;
        // Radius of this ring in 3D space
        const r3d = radius * Math.sin(phi);
        const y3d = -radius * Math.cos(phi); // -Y is up in standard math, but canvas Y is down. 
        // We will transform this in the loop.
        
        // Draw a circle for this latitude
        // Optimization: Only draw if visible (simplified)
        // To draw a rotated circle, we sample points
        for (let k = 0; k <= cols; k++) {
            const theta = (k / cols) * Math.PI * 2;
            
            // 3D Point
            let px = r3d * Math.cos(theta);
            let py = y3d;
            let pz = r3d * Math.sin(theta);

            // Rotate Y
            let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
            let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
            
            // Rotate X
            let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
            let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

            // Project
            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (k===0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }

    // Longitudes
    for (let i = 0; i < cols; i++) {
        const theta = (i / cols) * Math.PI * 2;
        ctx.moveTo(0,0); // Start point dummy
        for (let k = 0; k <= rows; k++) {
            const phi = (k / rows) * Math.PI;
            
            let px = radius * Math.sin(phi) * Math.cos(theta);
            let py = -radius * Math.cos(phi);
            let pz = radius * Math.sin(phi) * Math.sin(theta);

            // Rotate Y
            let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
            let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
            
            // Rotate X
            let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
            let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

            const fov = 800;
            const scale = fov / (fov + pz3);
            
            const sx = cx + px2 * scale;
            const sy = cy + py2 * scale;

            if (k===0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        }
    }
    ctx.stroke();

    // 3. Draw Cells
    // Sort cells by Z-depth so front cells draw over back cells
    const cellsToDraw = [];

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            if (grid[getIdx(x, y)] === 1) {
                const phi = (y / rows) * Math.PI;
                const theta = (x / cols) * Math.PI * 2;

                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = -radius * Math.cos(phi);
                let pz = radius * Math.sin(phi) * Math.sin(theta);

                // Rotate Y
                let px2 = px * Math.cos(rotY) - pz * Math.sin(rotY);
                let pz2 = px * Math.sin(rotY) + pz * Math.cos(rotY);
                
                // Rotate X
                let py2 = py * Math.cos(rotX) - pz2 * Math.sin(rotX);
                let pz3 = py * Math.sin(rotX) + pz2 * Math.cos(rotX);

                // Project
                const fov = 800;
                const scale = fov / (fov + pz3);
                
                const sx = cx + px2 * scale;
                const sy = cy + py2 * scale;
                
                // Size based on scale and resolution
                const size = Math.max(1, (radius / cols) * scale * 1.5); 

                cellsToDraw.push({
                    x: sx,
                    y: sy,
                    z: pz3,
                    size: size,
                    age: ages[getIdx(x, y)]
                });
            }
        }
    }

    // Sort: Draw back (high Z) to front (low Z)
    cellsToDraw.sort((a, b) => b.z - a.z);

    for (let c of cellsToDraw) {
        // Only draw if in front of camera plane roughly
        if (c.z < 0) {
            ctx.fillStyle = themes[theme].cellColor(c.age);
            ctx.shadowBlur = 6;
            ctx.shadowColor = themes[theme].glow;
            
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow for performance
            ctx.shadowBlur = 0;
        }
    }

    // 4. Sphere Outline (Glass Edge)
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
}

// Main Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;

    if (isRunning && elapsed > fpsInterval) {
        update();
        lastTime = timestamp;
    }

    // Auto rotate
    if (!isDragging) {
        rotY += autoRotateSpeed;
    }

    drawSphere();
    requestAnimationFrame(loop);
}

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        rotY += dx * 0.005;
        rotX += dy * 0.005;
        lastMouse = { x: e.clientX, y: e.clientY };
    }
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

// Click to spawn
container.addEventListener('click', (e) => {
    // Find a random cell
    const idx = Math.floor(Math.random() * grid.length);
    grid[idx] = 1;
    ages[idx] = 0;
    updateStats();
});

// UI Controls
const btnToggle = document.getElementById('btn-toggle');
btnToggle.addEventListener('click', () => {
    isRunning = !isRunning;
    btnToggle.innerText = isRunning ? "Pause Simulation" : "Resume Simulation";
    btnToggle.classList.toggle('primary'); // Toggle styling if desired
});

document.getElementById('btn-reset').addEventListener('click', randomize);
document.getElementById('btn-clear').addEventListener('click', clearGrid);

document.getElementById('speedRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    fpsInterval = 1000 / val;
});

document.getElementById('resRange').addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    cols = val;
    rows = Math.floor(val / 2);
    initGrid();
});

function setTheme(name) {
    theme = name;
    // Update active button state
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-theme-${name}`).classList.add('active');
}

// Start
initGrid();
requestAnimationFrame(loop);

</script>
</body>
</html>
