<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Design System: Premium & Tactile */
            --bg-app: #121212; /* Deepest Charcoal Background */
            --bg-panel: #1e1e1e; /* Panel Background */
            
            /* Board Palette: Deep Navy & Warm Cream */
            --board-dark: #2C3E50;
            --board-light: #ECECEC;
            
            /* UI Colors */
            --text-primary: #f0f0f0;
            --text-secondary: #888888;
            --accent-highlight: rgba(255, 215, 0, 0.4); /* Gold highlight */
            --border-color: #333;
            
            /* Dimensions */
            --board-size: min(85vh, 85vw);
            --square-size: calc(var(--board-size) / 8);
            
            /* Typography */
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Layout Container */
        .container {
            display: flex;
            gap: 40px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* --- Board Area --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Frame around the board */
            border: 8px solid #1a1a1a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            user-select: none;
            background-color: #000; /* Inner shadow gutter */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Board Colors */
        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }

        /* Highlight Logic */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--accent-highlight);
            z-index: 1;
        }
        /* Last move indicator (dot in corner) */
        .last-move {
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.15);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Coordinate Labels (Critique Fix: High contrast, distinct) */
        .coord {
            position: absolute;
            font-family: var(--font-ui); /* Switched to UI font for better weight */
            font-size: 14px;
            font-weight: 700; /* Bold */
            pointer-events: none;
            z-index: 5;
            opacity: 0.8;
        }
        /* Ranks (1-8) */
        .coord.rank { 
            top: 4px; 
            left: 4px; 
        }
        /* Files (a-h) */
        .coord.file { 
            bottom: 4px; 
            right: 4px; 
        }
        
        /* Dynamic coloring for coordinates to ensure legibility on any square */
        .square.dark .coord { color: var(--board-light); opacity: 0.6; }
        .square.light .coord { color: var(--board-dark); opacity: 0.6; }

        /* Pieces */
        .piece {
            width: 90%;
            height: 90%;
            z-index: 2;
            cursor: grab;
            transition: transform 0.1s ease-out;
        }
        .piece:active { cursor: grabbing; transform: scale(0.9); }

        /* --- Side Panel --- */
        .panel {
            width: 360px;
            background-color: var(--bg-panel);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            height: var(--board-size);
            border: 1px solid var(--border-color);
        }

        /* Header: Turn Indicator (Critique Fix: Elevated Hierarchy) */
        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .turn-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .turn-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .turn-display {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.8rem; /* Large Scale */
            font-weight: 700;
            color: var(--text-primary);
        }

        .turn-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .turn-icon.white { background-color: #fff; border: 1px solid #ccc; }
        .turn-icon.black { background-color: #222; border: 1px solid #555; }

        /* Controls (Critique Fix: Demoted 'New Game') */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: var(--font-ui);
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
        }

        /* Ghost Button Style */
        .btn-ghost {
            background-color: transparent;
            color: var(--text-secondary);
            border-color: #444;
        }
        .btn-ghost:hover { 
            background-color: rgba(255,255,255,0.05); 
            color: var(--text-primary);
            border-color: #666;
        }

        /* Move History (Critique Fix: No Dead Zone, Structured Grid) */
        .history-container {
            flex-grow: 1;
            background-color: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .history-header {
            padding: 15px;
            background-color: rgba(255,255,255,0.03);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
        }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
            margin: 0;
        }

        /* Scrollbar styling */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--text-primary);
            align-items: center;
        }
        
        .move-row:nth-child(odd) { background-color: rgba(255,255,255,0.02); }
        
        .move-num { 
            width: 40px; 
            color: #555; 
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .move-ply { 
            flex: 1;
            padding-right: 15px;
        }
        .move-ply.active {
            color: #fff;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 2px 5px;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .container { flex-direction: column; }
            .panel { width: var(--board-size); height: auto; max-height: 400px; }
            .board-wrapper { width: 90vw; height: 90vw; }
            :root { --board-size: 90vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Chess Board Area -->
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <!-- Elevated Hierarchy: Turn Indicator -->
            <div class="header">
                <div class="turn-indicator">
                    <span class="turn-label">Current Turn</span>
                    <div class="turn-display">
                        <div class="turn-icon white" id="turnIcon"></div>
                        <span id="turnText">White</span>
                    </div>
                </div>
            </div>

            <!-- Demoted Controls -->
            <div class="controls">
                <button class="btn-ghost" onclick="resetGame()">New Game</button>
                <button class="btn-ghost" onclick="flipBoard()">Flip Board</button>
            </div>

            <!-- Structured Move History -->
            <div class="history-container">
                <div class="history-header">Move History</div>
                <div class="history-list" id="historyList">
                    <!-- Grid Structure Placeholder -->
                    <div class="move-row" style="opacity: 0.5;">
                        <span class="move-num">1.</span>
                        <span class="move-ply">Waiting...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // --- SVG Assets (Critique Fix: Solid, Filled, Unified Staunton Silhouettes) ---

                n: `<svg viewBox="0 0 45 45" class="piece"><g fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.32-2.58 2.9-3 3-3.65.9-5.83 6.24-8 8-7.13 5.13-11.5 6.37-11.5 11h20c4-4.5 5-11.5 5-15.5 0-3.5-3.5-5-4.5-5.5z"/><path d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0z" fill="#000" stroke="none"/><path d="M15 15.5c-1.61 2.59-2.75 5.94-2.75 5.94" fill="none"/></g></svg>`,

            },
            b: {
                k: `<svg viewBox="0 0 45 45" class="piece"><g fill="#222" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 2-8 2-5-2-8-2-4-1-9-1c-3 6 6 10.5 6 10.5v7"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`,
                q: `<svg viewBox="0 0 45 45" class="piece"><g fill="#222" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14.5V25l-7-11-2 12"/><path d="M9 26c0 2 1.5 2 2.5 4 1 2.5 1 1 .5 4.5-5 2-10 2-15 2s-10 0-15-2c-.5-3.5-.5-2 .5-4.5 1-2 2.5-2 2.5-4"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0" fill="none"/></g></svg>`,
                r: `<svg viewBox="0 0 45 45" class="piece"><g fill="#222" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5c1 2 2 2 2 3.5S34 36 34 36H11s1-3 1-3 1-1.5 2-3.5V17h17z"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none"/></g></svg>`,
                b: `<svg viewBox="0 0 45 45" class="piece"><g fill="#222" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32c-3.39.97-9.11 1.45-13.5 1.45-4.39 0-10.11-.48-13.5-1.45v4z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2zM25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/><path d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/></g></svg>`,
                n: `<svg viewBox="0 0 45 45" class="piece"><g fill="#222" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.32-2.58 2.9-3 3-3.65.9-5.83 6.24-8 8-7.13 5.13-11.5 6.37-11.5 11h20c4-4.5 5-11.5 5-15.5 0-3.5-3.5-5-4.5-5.5z"/><path d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0z" fill="#fff" stroke="none"/><path d="M15 15.5c-1.61 2.59-2.75 5.94-2.75 5.94" fill="none"/></g></svg>`,
                p: `<svg viewBox="0 0 45 45" class="piece"><path d="M22 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-2.78-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#222" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
            }
        };

        // --- Game Logic & State ---
        
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // 0 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // 1
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // 6 (White Pawns)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // 7 (White)
        ];

        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];
        let isFlipped = false;

        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnIconEl = document.getElementById('turnIcon');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            // Loop logic handles flip by reversing iteration if needed
            const rowIndices = isFlipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
            const colIndices = isFlipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

            for (let r of rowIndices) {
                for (let c of colIndices) {
                    const square = document.createElement('div');
                    // Determine visual light/dark based on actual position
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    // Rank (1-8) is always shown on the left-most visual column (c=0 or c=7)
                    if (c === 0 || c === 7) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    // File (a-h) is always shown on the bottom-most visual row (r=7 or r=0)
                    if (r === 7 || r === 0) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += pieces[color][type];
                    }

                    // Highlights
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            square.innerHTML += `<div class="highlight"></div>`;
                        }
                    }

                    // Last Move Indicator
                    if (moveHistory.length > 0) {
                        const lastMove = moveHistory[moveHistory.length - 1];
                        if ((lastMove.to.r === r && lastMove.to.c === c) || 
                            (lastMove.from.r === r && lastMove.from.c === c)) {
                             square.innerHTML += `<div class="last-move"></div>`;
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White" : "Black";
            turnIconEl.className = `turn-icon ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const to = `${files[toC]}${8-toR}`;
            
            let pieceSymbol = piece.toUpperCase();
            if(pieceSymbol === 'P') pieceSymbol = ''; 
            
            const notation = `${pieceSymbol}${to}`;
            
            // Data structure for logic
            moveHistory.push({ from: {r: fromR, c: fromC}, to: {r: toR, c: toC}, notation });

            // UI Update
            // Remove placeholder if it exists
            if (moveHistory.length === 1) {
                historyEl.innerHTML = '';
            }

            // Create Row Logic
            const moveNum = Math.ceil(moveHistory.length / 2);
            
            // If White moves (odd length), create new row
            if (moveHistory.length % 2 !== 0) {
                const row = document.createElement('div');
                row.className = 'move-row';
                row.id = `move-row-${moveNum}`;
                
                const numSpan = document.createElement('span');
                numSpan.className = 'move-num';
                numSpan.innerText = `${moveNum}.`;
                
                const plySpan = document.createElement('span');
                plySpan.className = 'move-ply active';
                plySpan.innerText = notation;
                
                row.appendChild(numSpan);
                row.appendChild(plySpan);
                historyEl.appendChild(row);
            } else {
                // If Black moves (even length), append to existing row
                const lastRow = document.getElementById(`move-row-${moveNum}`);
                if (lastRow) {
                    // Remove active class from previous ply
                    const prevPly = lastRow.querySelector('.move-ply.active');
                    if(prevPly) prevPly.classList.remove('active');

                    const plySpan = document.createElement('span');
                    plySpan.className = 'move-ply active';
                    plySpan.innerText = notation;
                    lastRow.appendChild(plySpan);
                }
            }
            
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Simple move logic
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            historyEl.innerHTML = `
                <div class="move-row" style="opacity: 0.5;">
                    <span class="move-num">1.</span>
                    <span class="move-ply">Waiting...</span>
                </div>`;
            updateUI();
            renderBoard();
        }

        function flipBoard() {
            isFlipped = !isFlipped;
            renderBoard();
        }

        // Init
        renderBoard();
        updateUI();

    </script>
</body>
</html>
