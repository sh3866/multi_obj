<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Interface Redesign</title>
    <style>
        :root {
            /* Palette: Sophisticated Slate & Cream */
            --bg-app: #1e2124; /* Very dark slate */
            --bg-panel: #2c3e50; /* Deep blue-grey for panel/board dark squares */
            --bg-light: #ecf0f1; /* Warm ivory/cream */
            
            --text-main: #ecf0f1;
            --text-muted: #95a5a6;
            
            --accent-primary: #e67e22; /* Burnt Orange for primary actions */
            --accent-secondary: transparent;
            --border-secondary: #7f8c8d;
            
            --board-size: min(85vh, 85vw);
            --square-size: calc(var(--board-size) / 8);
            
            /* Typography */
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-serif: 'Georgia', 'Times New Roman', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 40px;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            justify-content: center;
            align-items: flex-start; /* Align top */
        }

        /* --- Board Area --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Gutter for coordinates */
            padding: 24px; 
            background-color: #23272a; /* Gutter color */
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            user-select: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Colors & Texture */
        .square.light { 
            background-color: var(--bg-light); 
            color: var(--bg-panel); 
        }
        .square.dark { 
            background-color: var(--bg-panel); 
            color: var(--bg-light); 
        }

        /* Subtle Noise Texture via CSS Gradients */
        .square::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* Coordinate Labels in Gutter */
        .coord {
            position: absolute;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
            pointer-events: none;
            z-index: 10;
        }
        /* Ranks (1-8) on the Left */
        .coord.rank { 
            top: 5px; 
            left: 6px; 
            width: 16px;
            text-align: center;
        }
        /* Files (a-h) on the Bottom */
        .coord.file { 
            bottom: 6px; 
            left: 50%; 
            transform: translateX(-50%);
        }
        
        /* Specific contrast adjustments for coordinates on dark/light squares */
        .square.dark .coord { color: rgba(236, 240, 241, 0.4); }
        .square.light .coord { color: rgba(44, 62, 80, 0.6); }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(230, 126, 34, 0.3); /* Orange tint */
            z-index: 1;
            box-shadow: inset 0 0 10px rgba(230, 126, 34, 0.5);
        }

        /* SVG Pieces - Clean & Crisp */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 3;
            cursor: grab;
            transition: transform 0.1s;
            /* No drop shadows per critique, just crisp vectors */
        }
        .piece:active { cursor: grabbing; transform: scale(0.95); }

        /* --- Side Panel --- */
        .panel {
            width: 380px;
            background-color: var(--bg-panel);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            /* Height matches board + gutter roughly */
            height: calc(var(--board-size) + 48px); 
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Header & Turn Indicator */
        .header {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .turn-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.2);
        }
        .turn-dot.black {
            background-color: #111;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
        }

        .status-text {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Controls (Moved to Top) */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 10px 0;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: var(--font-ui);
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #fff;
            border: none;
        }
        .btn-primary:hover { background-color: #d35400; }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-secondary);
        }
        .btn-secondary:hover { 
            background-color: rgba(255,255,255,0.05); 
            color: var(--text-main);
            border-color: var(--text-main);
        }

        /* Move History (Score Sheet Style) */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            background-color: rgba(0,0,0,0.15);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
            font-family: var(--font-mono); /* Monospace for alignment */
        }

        /* Custom Scrollbar */
        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: transparent; }
        .history-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 6px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.9rem;
            color: var(--text-main);
        }
        /* Alternating row colors */
        .move-row:nth-child(odd) { background-color: rgba(255,255,255,0.02); }
        
        .move-num { 
            width: 35px; 
            color: var(--text-muted); 
            font-size: 0.8rem;
            padding-top: 2px;
        }
        .move-ply { 
            flex: 1;
            font-weight: 500;
        }
        /* Highlight last move */
        .move-row:last-child {
            background-color: rgba(230, 126, 34, 0.1);
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .container { flex-direction: column; align-items: center; }
            .panel { width: var(--board-size); height: auto; max-height: 300px; }
            .board-wrapper { width: 90vw; height: 90vw; }
            :root { --board-size: 90vw; }
        }
    </style>
</head>

    </div>

        // --- Game Logic & State ---
        
        // Corrected Standard Starting Position
        // Row 0: Black Back Rank (Top)
        // Row 1: Black Pawns
        // Row 6: White Pawns
        // Row 7: White Back Rank (Bottom)
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // 0 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // 1
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], // 6 (White Pawns)
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']  // 7 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates in Gutter (Left for Ranks, Bottom for Files)
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += pieces[color][type];
                    }

                    // Highlights
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            square.innerHTML += `<div class="highlight"></div>`;
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const from = `${files[fromC]}${8-fromR}`;
            const to = `${files[toC]}${8-toR}`;
            
            // Determine piece symbol (P, N, B, R, Q, K)
            let pieceSymbol = piece.toUpperCase();
            if(pieceSymbol === 'P') pieceSymbol = ''; // Pawns don't show letter in simple notation usually, but let's keep it clean

            // Simplified Algebraic Notation
            const notation = `${pieceSymbol}${to}`;
            
            // Create Row
            const row = document.createElement('div');
            row.className = 'move-row';
            
            // Move Numbering Logic (1. e4 e5)
            // If White just moved (history length was even), create new row with number
            // If Black just moved (history length was odd), append to last row
            
            let moveNum = Math.floor(moveHistory.length / 2) + 1;
            
            if (turn === 'b') {
                // White just moved, it's now Black's turn. Start new row.
                const numSpan = document.createElement('span');
                numSpan.className = 'move-num';
                numSpan.innerText = `${moveNum}.`;
                row.appendChild(numSpan);
                
                const plySpan = document.createElement('span');
                plySpan.className = 'move-ply';
                plySpan.innerText = notation;
                row.appendChild(plySpan);
                
            } else {
                // Black just moved. Append to last row.
                const lastRow = historyEl.lastElementChild;
                if (lastRow) {
                    const plySpan = document.createElement('span');
                    plySpan.className = 'move-ply';
                    plySpan.innerText = notation;
                    lastRow.appendChild(plySpan);
                    return; // Don't append row again
                }
            }

            historyEl.appendChild(row);
            historyEl.scrollTop = historyEl.scrollHeight;
            moveHistory.push(notation);
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            // Check if clicked piece belongs to current turn
            const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

            // Select Piece
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move Piece
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Basic move execution (No rules validation for this visual demo)
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Record move
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                // Switch Turn
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            historyEl.innerHTML = '';
            updateUI();
            renderBoard();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-secondary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // Init
        renderBoard();
        updateUI();

    </script>
</body>
</html>
