<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-red: #ff0055;
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-pixel);
        }

        /* --- CRT & Retro Effects --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            /* Hard pixelated look for the scanlines */
            image-rendering: pixelated; 
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- Canvas --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Critical for pixel art look on high DPI screens */
            image-rendering: pixelated; 
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Typography Overhaul --- */
        .title-container {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            z-index: 20;
            /* Center relative to screen, slightly above visual center */
            margin-top: -10vh; 
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: 6rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            /* Hard aliased RGB split */
            text-shadow: 
                -4px 0 var(--neon-cyan), 
                4px 0 var(--neon-red),
                0 8px 0 #000000; /* Heavy black drop shadow */
            letter-spacing: -2px;
            /* Pixelated rendering hint */
            text-rendering: crisp-edges; 
            animation: titleFloat 4s ease-in-out infinite;
        }

        /* The "Dance" part */
        h1 .dance {
            color: var(--neon-yellow);
            display: block;
            font-size: 7rem;
            text-shadow: 
                -4px 0 var(--neon-pink), 
                4px 0 var(--neon-cyan),
                0 8px 0 #000000;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- Buttons & Menu --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            z-index: 20;
        }

        .btn-start {
            background: #000;
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 40px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            /* Hard edges only */
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5); 
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            background: var(--neon-cyan);
            color: #000;
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .menu-options {
            display: flex;
            gap: 40px;
            margin-top: 10px;
        }

        .menu-link {
            color: var(--neon-pink);
            text-decoration: none;
            font-family: var(--font-pixel);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: color 0.1s;
            cursor: pointer;
            /* Hard text shadow for legibility */
            text-shadow: 2px 2px 0 #000;
        }

        .menu-link:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        /* --- Responsive --- */
        @media (max-width: 800px) {
            h1 { font-size: 4rem; }
            h1 .dance { font-size: 4.5rem; }
            .title-container { margin-top: -5vh; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <div class="title-container">
            <h1>Pixel<br><span class="dance">Dance</span></h1>
        </div>

        <div class="menu-container">
            <button class="btn-start" onclick="startGame()">Start Game</button>

            <div class="menu-options">
                <a class="menu-link" onclick="alert('Options Placeholder')">Options</a>
                <a class="menu-link" onclick="alert('Credits Placeholder')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        // Disable smoothing for pixel art aesthetic
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;

        // Configuration
        const sunY = 0.35; 
        const sunSize = 120;
        const lanes = [
            { color: '#ff00ff' }, // Lane 1
            { color: '#00ffff' }, // Lane 2
            { color: '#00ffff' }, // Lane 3
            { color: '#ff00ff' }  // Lane 4
        ];
        
        const stars = [];
        for(let i=0; i<120; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.4, 
                size: Math.random() > 0.9 ? 3 : 2, // Chunky stars
                alpha: Math.random()
            });
        }

        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.05 + star.x * 10));
                // Draw hard squares for stars
                ctx.fillRect(Math.floor(star.x * width), Math.floor(star.y * height), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Hard light glow (no blur)
            const glowSteps = 4;
            for(let i=glowSteps; i>0; i--) {
                ctx.fillStyle = `rgba(255, 0, 255, ${0.1 * i})`;
                ctx.fillRect(cx - r - (i*10), cy - r - (i*10), (r*2) + (i*20), (r*2) + (i*20));
            }

            // Sun Body
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2); // Square sun for pixel look, or use arc
            
            // Draw circle using pixelated steps or just standard arc but with imageSmoothingEnabled = false
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            
            // Hard "Blind" Stripes (Banding effect)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050011'; // Cut out color
            const stripeCount = 8;
            const stripeHeight = r / stripeCount;
            
            for(let i = 0; i < stripeCount; i++) {
                // Draw stripes only in the bottom half
                let y = cy + (i * stripeHeight) + (i * 5); 
                if (y < cy + r) {
                    // Increase height of stripe slightly to simulate retro banding
                    ctx.fillRect(cx - r, y, r * 2, stripeHeight * 0.8);
                }
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            
            // Highway Dimensions
            const bottomWidth = Math.min(width * 0.9, 800);
            const topWidth = 100;

            ctx.lineWidth = 3; // Uniform thick stroke
            ctx.strokeStyle = '#ff00ff';
            
            // Vertical Lines (4 Lanes = 5 Lines)
            for (let i = 0; i <= 4; i++) {
                const bottomX = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = centerX - (topWidth/2) + (i * (topWidth / 4));

                ctx.beginPath();
                ctx.moveTo(Math.floor(topX), Math.floor(horizonY));
                ctx.lineTo(Math.floor(bottomX), height);
                ctx.stroke();
            }

            // Horizontal Lines
            const speed = 0.003;
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            // More lines for density
            for (let i = 0; i < 30; i++) {
                const t = (i / 30 + time) % 1;
                // Power function for perspective depth
                const y = horizonY + Math.pow(t, 2.0) * (height - horizonY);
                
                // Width interpolation
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(Math.floor(x1), Math.floor(y));
                ctx.lineTo(Math.floor(x2), Math.floor(y));
            }
            
            // Gradient fade at bottom to blend into darkness
            ctx.globalCompositeOperation = 'destination-in';
            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, '1');
            grad.addColorStop(0.8, '1');
            grad.addColorStop(1, '0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, horizonY, width, height - horizonY);
            ctx.globalCompositeOperation = 'source-over';
            
            // Re-stroke to fix compositing artifacts
            ctx.stroke();
        }

        function spawnNote() {
            // Spawn notes rhythmically
            if (Math.random() < 0.03) {
                const laneIdx = Math.floor(Math.random() * 4);
                // Don't spawn if too crowded (simple check)
                const lastNote = notes[notes.length-1];
                if (!lastNote || lastNote.t > 0.1) {
                    notes.push({
                        lane: laneIdx,
                        t: 0, 
                        active: true
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.9, 800);
            const topWidth = 100;

            notes.forEach(note => {
                note.t += 0.008; // Speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.0) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
                
                const laneWidth = currentWidth / 4;
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth);

                // Note size scales with perspective
                const noteSize = laneWidth * 0.6;
                const noteOffset = (laneWidth - noteSize) / 2;

                // Draw Note (Pixelated Square)
                ctx.fillStyle = lanes[note.lane].color;
                
                // Hard Glow (Layering)
                ctx.globalAlpha = 0.5;
                ctx.fillRect(laneX + noteOffset - 4, y - 4, noteSize + 8, noteSize + 8);
                ctx.globalAlpha = 1.0;

                ctx.fillRect(Math.floor(laneX + noteOffset), Math.floor(y), Math.floor(noteSize), Math.floor(noteSize));
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + sunSize;
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.9, 800);
            const topWidth = 100;

            // Move hit line UP to group with notes (t=0.75 means 75% down the highway)
            const t = 0.75; 
            const y = horizonY + Math.pow(t, 2.0) * (height - horizonY);
            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 1.5);
            
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15; // Keep one glow for the "Hit" line as it's a target
            ctx.shadowColor = '#ffffff';
            
            ctx.moveTo(centerX - currentWidth/2, y);
            ctx.lineTo(centerX + currentWidth/2, y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw lane markers on hit line
            for(let i=1; i<4; i++) {
                const x = (centerX - currentWidth/2) + (i * (currentWidth/4));
                ctx.fillStyle = '#fff';
                ctx.fillRect(x-2, y-2, 4, 4);
            }
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            // Simple interaction feedback
            const btn = document.querySelector('.btn-start');
            btn.style.borderColor = '#00ff00';
            btn.style.color = '#00ff00';
            btn.innerText = 'LOADING...';
            setTimeout(() => {
                alert('Starting Game...');
                btn.style.borderColor = 'var(--neon-cyan)';
                btn.style.color = 'var(--neon-cyan)';
                btn.innerText = 'START GAME';
            }, 800);
        }

        animate();

    </script>
</body>
</html>
