<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        /* 
           DESIGN CRITIQUE IMPLEMENTATION:
           1. Typography: Using a robust system pixel font stack. 
           2. Layout: Title top, Menu right, Highway Center-Left.
           3. Aesthetics: Synthwave, Glitch, CRT.
        */
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-red: #ff0055;
            --neon-purple: #bc13fe;
            --font-pixel: 'Courier New', 'Lucida Console', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-pixel);
            color: white;
        }

        /* --- CRT & Retro Effects --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Glitch overlay for screen edges */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
            mix-blend-mode: exclusion;
            opacity: 0;
            background: white;
            animation: glitch-flash 8s infinite;
        }

        @keyframes glitch-flash {
            0% { opacity: 0; transform: translate(0); }
            2% { opacity: 0.1; transform: translate(-2px, 1px); }
            4% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* --- Canvas --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            padding: 40px;
        }

        /* --- Typography Overhaul (Critique #2 & #4) --- */
        .title-container {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            z-index: 20;
            position: relative;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: 5rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            /* Heavy Stroke for Legibility */
            -webkit-text-stroke: 2px var(--neon-cyan);
            text-shadow: 6px 6px 0px var(--neon-pink);
            letter-spacing: -4px;
            position: relative;
            animation: title-undulate 4s ease-in-out infinite;
        }

        h1 .dance {
            display: block;
            font-size: 6rem;
            color: var(--neon-yellow);
            -webkit-text-stroke: 2px var(--neon-red);
            text-shadow: 6px 6px 0px #000;
            transform: skewX(-10deg); /* Warped look */
        }

        /* Kinetic Title Animation */
        @keyframes title-undulate {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }

        /* --- Diegetic UI Panel (Critique #3) --- */
        .menu-panel {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            justify-self: end;
            align-self: center;
            background: rgba(5, 0, 17, 0.9);
            border: 2px solid var(--neon-cyan);
            padding: 30px;
            width: 320px;
            position: relative;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.5), 0 0 20px var(--neon-cyan);
            transform: skewY(-2deg); /* Retro tilt */
            backdrop-filter: blur(5px);
        }

        /* Decorative corner accents */
        .menu-panel::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px;
            width: 15px; height: 15px;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }
        .menu-panel::after {
            content: '';
            position: absolute;
            bottom: -5px; right: -5px;
            width: 15px; height: 15px;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* --- Buttons (Critique #3) --- */
        .btn-start {
            width: 100%;
            background: transparent;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 0;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            text-shadow: 0 0 5px var(--neon-yellow);
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-start:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 20px var(--neon-yellow);
            transform: translate(-2px, -2px);
            text-shadow: none;
        }

        .btn-start:active {
            transform: translate(0, 0);
        }

        .menu-links {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .menu-link {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.2s;
            cursor: pointer;
        }

        .menu-link:hover {
            background: var(--neon-pink);
            color: #fff;
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            #ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                padding: 20px;
            }
            .title-container {
                text-align: center;
                margin-bottom: 20px;
            }
            h1 { font-size: 3rem; }
            h1 .dance { font-size: 4rem; }
            .menu-panel {
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
                grid-row: 3;
                transform: skewY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glitch-overlay"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <!-- Top Left Title -->
        <div class="title-container">
            <h1>Pixel<br><span class="dance">Dance</span></h1>
        </div>

        <!-- Right Side Diegetic Panel -->
        <div class="menu-panel">
            <button class="btn-start" onclick="startGame()">Start Game</button>
            <div class="menu-links">
                <a class="menu-link" onclick="alert('Options')">Options</a>
                <a class="menu-link" onclick="alert('Credits')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        // Disable smoothing for pixel art aesthetic
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;

        // Configuration
        // Horizon is higher up to emphasize the highway extending from bottom
        const sunY = 0.35; 
        const sunSize = 120;
        
        // Lane colors
        const laneColors = ['#ff00ff', '#00ffff', '#00ffff', '#ff00ff'];
        
        const stars = [];
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.35, 
                size: Math.random() > 0.8 ? 3 : 1, 
                alpha: Math.random()
            });
        }

        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                // Twinkle effect
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.05 + star.x * 10));
                ctx.fillRect(Math.floor(star.x * width), Math.floor(star.y * height), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Glowing halo
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff00ff';
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Retro Horizontal Stripes (Blinds)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            // Draw stripes from bottom half up
            for(let i = 0; i < 15; i++) {
                let y = cy + (i * 6) + (i * i * 0.3); // Curve the stripes
                let h = 4 + i; // Stripes get thicker at bottom
                if (y < cy + r) {
                    ctx.fillStyle = '#050011'; // Background color cutout
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawTerrain() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width / 2;
            
            // Draw a "terrain" effect below the horizon using sine waves
            ctx.fillStyle = '#0a0022';
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            for(let x = 0; x <= width; x+=20) {
                // Create undulating hills
                const y = horizonY + Math.sin(x * 0.01 + time * 0.02) * 10 + Math.sin(x * 0.05) * 5;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
        }

        function drawHighway() {
            const horizonY = height * sunY + (sunSize * 0.8);
            // Shift highway slightly left to balance the right-side menu
            const centerX = width * 0.45; 
            
            // Highway Dimensions
            const bottomWidth = width * 0.9; 
            const topWidth = 150;

            // 1. Draw Glowing Lane Backgrounds (Holographic Tunnel look)
            for (let i = 0; i < 4; i++) {
                const bX1 = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const bX2 = bX1 + (bottomWidth / 4);
                const tX1 = centerX - (topWidth/2) + (i * (topWidth / 4));
                const tX2 = tX1 + (topWidth / 4);

                // Alternating opacity for depth
                ctx.fillStyle = laneColors[i];
                ctx.globalAlpha = (i % 2 === 0) ? 0.15 : 0.05; 
                ctx.beginPath();
                ctx.moveTo(tX1, horizonY);
                ctx.lineTo(tX2, horizonY);
                ctx.lineTo(bX2, height);
                ctx.lineTo(bX1, height);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 2. Draw Vertical Lines (Lane Markers)
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.8)';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff00ff';
            
            for (let i = 0; i <= 4; i++) {
                const bottomX = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = centerX - (topWidth/2) + (i * (topWidth / 4));

                ctx.beginPath();
                ctx.moveTo(Math.floor(topX), Math.floor(horizonY));
                ctx.lineTo(Math.floor(bottomX), height);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // 3. Draw Horizontal Lines (Movement / "Undulating Terrain")
            // The "breathing" effect comes from the speed oscillation
            const speed = 0.003 + Math.sin(time * 0.01) * 0.001; 
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';
            
            for (let i = 0; i < 20; i++) {
                const t = (i / 20 + time) % 1;
                // Perspective projection
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                
                // Width interpolation
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                // Fade out near horizon
                ctx.globalAlpha = t; 

                ctx.moveTo(Math.floor(x1), Math.floor(y));
                ctx.lineTo(Math.floor(x2), Math.floor(y));
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        function spawnNote() {
            // Spawn notes rhythmically
            if (Math.random() < 0.06) {
                const laneIdx = Math.floor(Math.random() * 4);
                const lastNote = notes[notes.length-1];
                // Prevent overlap
                if (!lastNote || lastNote.t > 0.2) {
                    notes.push({
                        lane: laneIdx,
                        t: 0, 
                        active: true
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width * 0.45;
            const bottomWidth = width * 0.9;
            const topWidth = 150;

            notes.forEach(note => {
                note.t += 0.008; // Speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
                
                const laneWidth = currentWidth / 4;
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth);

                // Note size scales with perspective
                const noteSize = laneWidth * 0.5;
                const noteOffset = (laneWidth - noteSize) / 2;

                // Draw Note (Pixelated Square)
                ctx.fillStyle = laneColors[note.lane];
                ctx.shadowBlur = 15;
                ctx.shadowColor = laneColors[note.lane];
                
                ctx.fillRect(Math.floor(laneX + noteOffset), Math.floor(y), Math.floor(noteSize), Math.floor(noteSize));
                
                // Inner white core
                ctx.fillStyle = '#fff';
                ctx.fillRect(Math.floor(laneX + noteOffset + 2), Math.floor(y + 2), Math.floor(noteSize - 4), Math.floor(noteSize - 4));
                
                ctx.shadowBlur = 0;
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width * 0.45;
            const bottomWidth = width * 0.9;
            const topWidth = 150;

            // Hit line position: 15% up from bottom
            const targetY = height * 0.85;
            
            // Calculate width at this Y using inverse perspective logic
            // y = hY + t^p * (H - hY) -> t = ((y - hY)/(H - hY))^(1/p)
            let t = 0;
            if(targetY > horizonY) {
                 t = Math.pow((targetY - horizonY) / (height - horizonY), 1/2.5);
            }

            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.5);
            
            // Draw the Hit Bar (Base) - Distinct Glowing Line
            ctx.beginPath();
            ctx.strokeStyle = '#fff'; // Bright white core
            ctx.lineWidth = 6;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';
            
            ctx.moveTo(centerX - currentWidth/2, targetY);
            ctx.lineTo(centerX + currentWidth/2, targetY);
            ctx.stroke();
            
            // Lane dividers on the hit line
            ctx.fillStyle = '#000';
            for(let i=1; i<4; i++) {
                const x = (centerX - currentWidth/2) + (i * (currentWidth/4));
                ctx.fillRect(x-2, targetY-10, 4, 20);
            }

            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawTerrain();
            drawHighway();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            
            // Glitch out effect
            document.querySelector('.glitch-overlay').style.opacity = '0.5';
            document.querySelector('.glitch-overlay').style.animation = 'none';
            
            btn.innerText = 'INITIALIZING...';
            btn.style.borderColor = '#fff';
            btn.style.color = '#fff';

            setTimeout(() => {
                // Simulate loading
                alert('Entering the Grid...');
                // Reset for demo purposes
                btn.innerText = 'START GAME';
                btn.style.borderColor = 'var(--neon-yellow)';
                btn.style.color = 'var(--neon-yellow)';
                document.querySelector('.glitch-overlay').style.animation = 'glitch-flash 8s infinite';
            }, 800);
        }

        animate();

    </script>
</body>
</html>
