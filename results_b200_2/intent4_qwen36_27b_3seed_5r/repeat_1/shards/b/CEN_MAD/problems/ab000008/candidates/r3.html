<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART 
           We use a robust stack of bitmap fonts. If none are present, 
           Courier New is the fallback, styled to look crisp.
        */
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-red: #ff0055;
            --font-pixel: 'Press Start 2P', 'Silkscreen', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-pixel);
        }

        /* --- CRT & Retro Effects --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- Canvas --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; 
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            padding: 8vh 0 15vh 0; /* Adjusted padding to accommodate hit line */
        }

        /* --- Typography Overhaul --- */
        .title-container {
            margin-top: 10vh;
            text-align: center;
            position: relative;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through */
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: 4.5rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            color: #fff;
            /* Chromatic Aberration / Glitch */
            text-shadow: 
                -4px 0 var(--neon-cyan), 
                4px 0 var(--neon-red),
                0 4px 0 #000000; 
            letter-spacing: -2px;
            text-rendering: crisp-edges; 
            animation: titleFloat 4s ease-in-out infinite;
            position: relative;
        }

        /* The "Dance" part - Distinct styling */
        h1 .dance {
            color: var(--neon-yellow);
            display: block;
            font-size: 5.5rem;
            margin-top: 10px;
            text-shadow: 
                -4px 0 var(--neon-pink), 
                4px 0 var(--neon-cyan),
                0 4px 0 #000000;
        }

        /* Glitch animation keyframes */
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(80% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(10% 0 60% 0); transform: translate(1px, -2px); }
            80% { clip-path: inset(30% 0 20% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(0, 0); }
        }

        /* Pseudo-element for glitch overlay */
        h1::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: #fff;
            background: var(--bg-dark);
            opacity: 0;
            z-index: -1;
        }

        h1:hover::before {
            opacity: 0.5;
            animation: glitch-anim 0.3s infinite linear alternate-reverse;
            color: var(--neon-cyan);
        }

        /* --- Buttons & Menu --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            z-index: 20;
            /* Push up slightly to clear the hit line */
            margin-bottom: 2vh; 
        }

        /* REVISED START BUTTON */
        .btn-start {
            /* Semi-transparent dark fill */
            background: rgba(5, 0, 17, 0.85); 
            /* Neon Cyan Stroke */
            border: 3px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: var(--font-pixel);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 18px 60px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            /* Allow grid lines to show through */
            backdrop-filter: blur(2px);
            /* Neon Glow */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.1);
            transition: all 0.2s ease;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .btn-start:hover {
            background: rgba(0, 255, 255, 0.15);
            color: #fff;
            box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 20px var(--neon-cyan);
            transform: scale(1.05);
            border-color: #fff;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* REVISED SECONDARY ACTIONS */
        .menu-options {
            display: flex;
            gap: 80px; /* Wider gap for visual breathing room */
        }

        .menu-link {
            color: var(--neon-pink);
            text-decoration: none;
            font-family: var(--font-pixel);
            font-size: 1.1rem; /* Larger font size */
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
            cursor: pointer;
            /* Strong contrast against dark bg */
            text-shadow: 2px 2px 0 #000; 
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .menu-link:hover {
            color: #fff;
            text-shadow: 0 0 15px var(--neon-pink), 2px 2px 0 var(--neon-cyan);
            opacity: 1;
            transform: translateY(-2px);
        }

        /* --- Responsive --- */
        @media (max-width: 800px) {
            h1 { font-size: 2.5rem; }
            h1 .dance { font-size: 3.5rem; }
            .btn-start { font-size: 1.2rem; padding: 15px 40px; }
            .menu-options { gap: 40px; }
            .menu-link { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <!-- Top Title -->
        <div class="title-container">
            <h1 data-text="Pixel">Pixel<br><span class="dance" data-text="Dance">Dance</span></h1>
        </div>

        <!-- Bottom Menu -->
        <div class="menu-container">
            <button class="btn-start" onclick="startGame()">Start Game</button>

            <div class="menu-options">
                <a class="menu-link" onclick="alert('Options Placeholder')">Options</a>
                <a class="menu-link" onclick="alert('Credits Placeholder')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        // Disable smoothing for pixel art aesthetic
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;

        // Configuration
        // Horizon is higher up to emphasize the highway extending from bottom
        const sunY = 0.40; 
        const sunSize = 140;
        
        // Lane colors for the 4 distinct lanes
        const lanes = [
            { color: '#ff00ff' }, // Lane 1 (Magenta)
            { color: '#00ffff' }, // Lane 2 (Cyan)
            { color: '#00ffff' }, // Lane 3 (Cyan)
            { color: '#ff00ff' }  // Lane 4 (Magenta)
        ];
        
        const stars = [];
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.45, 
                size: Math.random() > 0.9 ? 3 : 1, 
                alpha: Math.random()
            });
        }

        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.05 + star.x * 10));
                ctx.fillRect(Math.floor(star.x * width), Math.floor(star.y * height), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Hard light glow (no blur)
            const glowSteps = 5;
            for(let i=glowSteps; i>0; i--) {
                ctx.fillStyle = `rgba(255, 0, 255, ${0.08 * i})`;
                ctx.fillRect(cx - r - (i*15), cy - r - (i*15), (r*2) + (i*30), (r*2) + (i*30));
            }

            // Sun Body
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            
            // Hard "Blind" Stripes (Banding effect)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            ctx.fillStyle = '#050011'; // Cut out color (Background color)
            const stripeCount = 12;
            const stripeHeight = r / stripeCount;
            
            for(let i = 0; i < stripeCount; i++) {
                // Draw stripes only in the bottom half
                let y = cy + (i * stripeHeight) + (i * 4); 
                if (y < cy + r) {
                    // Increase height of stripe slightly to simulate retro banding
                    ctx.fillRect(cx - r, y, r * 2, stripeHeight * 0.7 + 2);
                }
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * sunY + (sunSize * 0.8); // Horizon slightly below sun center
            const centerX = width / 2;
            
            // Highway Dimensions
            // Much wider at bottom to fill screen
            const bottomWidth = width * 1.2; 
            const topWidth = 100;

            ctx.lineWidth = 2; 

            // 1. Draw Glowing Lane Backgrounds
            // We draw polygons for the 4 lanes to make them solid tracks
            for (let i = 0; i < 4; i++) {
                const bX1 = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const bX2 = bX1 + (bottomWidth / 4);
                const tX1 = centerX - (topWidth/2) + (i * (topWidth / 4));
                const tX2 = tX1 + (topWidth / 4);

                ctx.fillStyle = lanes[i].color;
                ctx.globalAlpha = 0.10; // Subtle fill
                ctx.beginPath();
                ctx.moveTo(tX1, horizonY);
                ctx.lineTo(tX2, horizonY);
                ctx.lineTo(bX2, height);
                ctx.lineTo(bX1, height);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 2. Draw Vertical Lines (Lane Markers)
            // These explicitly define the 4 lanes
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ff00ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff00ff';
            
            for (let i = 0; i <= 4; i++) {
                const bottomX = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = centerX - (topWidth/2) + (i * (topWidth / 4));

                ctx.beginPath();
                ctx.moveTo(Math.floor(topX), Math.floor(horizonY));
                ctx.lineTo(Math.floor(bottomX), height);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // 3. Draw Horizontal Lines (Movement)
            const speed = 0.003; // Slightly faster movement
            time += speed;
            if (time > 1) time = 0;

            ctx.beginPath();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            
            // More lines for density
            for (let i = 0; i < 25; i++) {
                const t = (i / 25 + time) % 1;
                // Power function for perspective depth (t^2 makes them bunch up at horizon)
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                
                // Width interpolation
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                ctx.moveTo(Math.floor(x1), Math.floor(y));
                ctx.lineTo(Math.floor(x2), Math.floor(y));
            }
            ctx.stroke();
        }

        function spawnNote() {
            // Spawn notes rhythmically
            if (Math.random() < 0.05) {
                const laneIdx = Math.floor(Math.random() * 4);
                // Don't spawn if too crowded
                const lastNote = notes[notes.length-1];
                if (!lastNote || lastNote.t > 0.15) {
                    notes.push({
                        lane: laneIdx,
                        t: 0, 
                        active: true
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width / 2;
            const bottomWidth = width * 1.2;
            const topWidth = 100;

            notes.forEach(note => {
                note.t += 0.007; // Speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
                
                const laneWidth = currentWidth / 4;
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth);

                // Note size scales with perspective
                const noteSize = laneWidth * 0.6;
                const noteOffset = (laneWidth - noteSize) / 2;

                // Draw Note (Pixelated Square)
                ctx.fillStyle = lanes[note.lane].color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = lanes[note.lane].color;
                
                ctx.fillRect(Math.floor(laneX + noteOffset), Math.floor(y), Math.floor(noteSize), Math.floor(noteSize));
                
                // Inner white core for "hot" look
                ctx.fillStyle = '#fff';
                ctx.fillRect(Math.floor(laneX + noteOffset + 2), Math.floor(y + 2), Math.floor(noteSize - 4), Math.floor(noteSize - 4));
                
                ctx.shadowBlur = 0;
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width / 2;
            const bottomWidth = width * 1.2;
            const topWidth = 100;

            // Hit line position: 20% up from bottom
            // We need to find the 't' value that corresponds to 20% up from bottom
            // y = horizonY + t^2 * (height - horizonY)
            // targetY = height * 0.80
            // t = sqrt( (targetY - horizonY) / (height - horizonY) )
            
            const targetY = height * 0.80;
            let t = 0;
            if(targetY > horizonY) {
                 t = Math.sqrt((targetY - horizonY) / (height - horizonY));
            }

            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
            
            // Draw the Hit Bar (Base)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)'; // Faint background bar
            ctx.lineWidth = 12;
            ctx.moveTo(centerX - currentWidth/2, targetY);
            ctx.lineTo(centerX + currentWidth/2, targetY);
            ctx.stroke();

            // Draw the Hit Bar (Active Line)
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15; 
            ctx.shadowColor = '#ffffff';
            
            ctx.moveTo(centerX - currentWidth/2, targetY);
            ctx.lineTo(centerX + currentWidth/2, targetY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw lane markers on hit line
            for(let i=1; i<4; i++) {
                const x = (centerX - currentWidth/2) + (i * (currentWidth/4));
                ctx.fillStyle = '#fff';
                ctx.fillRect(x-4, targetY-4, 8, 8);
            }
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawGrid();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            // Simple interaction feedback
            const btn = document.querySelector('.btn-start');
            btn.style.borderColor = '#00ff00';
            btn.style.color = '#00ff00';
            btn.style.boxShadow = '0 0 30px #00ff00';
            btn.innerText = 'LOADING...';
            
            // Glitch effect on title
            const title = document.querySelector('h1');
            title.style.textShadow = '10px 0 red, -10px 0 cyan';
            title.style.transform = 'translateX(5px)';

            setTimeout(() => {
                alert('Starting Game...');
                btn.style.borderColor = 'var(--neon-cyan)';
                btn.style.color = 'var(--neon-cyan)';
                btn.style.boxShadow = '0 0 15px var(--neon-cyan)';
                btn.innerText = 'START GAME';
                title.style.textShadow = '';
                title.style.transform = '';
            }, 800);
        }

        animate();

    </script>
</body>
</html>
