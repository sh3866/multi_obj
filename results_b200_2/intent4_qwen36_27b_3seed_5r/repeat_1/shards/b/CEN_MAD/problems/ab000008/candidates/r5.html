<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dance</title>
    <style>
        /* 
           DESIGN CRITIQUE IMPLEMENTATION:
           1. Typography: System Monospace stack for pixel aesthetic (Press Start 2P fallback).
           2. Layout: Centralized "Arcade Cabinet" menu, Title Top-Center.
           3. Aesthetics: Synthwave, Hard Aliasing, Blocky Glows.
        */
        :root {
            --bg-dark: #050011;
            --neon-magenta: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-red: #ff0055;
            --font-pixel: 'Courier New', 'Lucida Console', 'Courier', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            font-family: var(--font-pixel);
            color: white;
        }

        /* --- CRT & Retro Effects --- */
        /* Scanlines: subtle, dark */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.25) 2px,
                rgba(0,0,0,0.25) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* Vignette: heavy edges to focus center */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.95) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Glitch overlay */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
            mix-blend-mode: exclusion;
            opacity: 0;
            background: white;
            animation: glitch-flash 10s infinite;
        }

        @keyframes glitch-flash {
            0% { opacity: 0; transform: translate(0); }
            1% { opacity: 0.2; transform: translate(-2px, 0); }
            2% { opacity: 0; }
            95% { opacity: 0; }
            96% { opacity: 0.1; transform: translate(2px, 0); }
            97% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* --- Canvas --- */
        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; /* Key for pixel art look */
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px; /* Space from top */
        }

        /* --- Typography Overhaul (Critique #1) --- */
        .title-container {
            position: relative;
            margin-bottom: 40px;
            z-index: 20;
            text-align: center;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: 4.5rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            color: #fff;
            /* Hard, stepped drop shadow instead of RGB split */
            text-shadow: 6px 6px 0px var(--neon-magenta);
            letter-spacing: -2px;
            /* Slight skew for speed */
            transform: skewX(-12deg);
            position: relative;
        }

        h1 .dance {
            display: block;
            font-size: 6rem;
            color: var(--neon-yellow);
            /* Stroke for definition */
            -webkit-text-stroke: 1px var(--neon-red);
            text-shadow: 8px 8px 0px #000;
            margin-top: -10px;
        }

        /* --- Diegetic UI Panel (Critique #2 & #6) --- */
        /* Arcade Cabinet / Cassette Aesthetic */
        .menu-panel {
            background: rgba(5, 0, 17, 0.85);
            /* Pixelated border effect using box-shadow layers */
            border: 4px solid var(--neon-cyan);
            /* Hard alias glow */
            box-shadow: 
                8px 8px 0px 0px rgba(0, 0, 0, 0.8), 
                0 0 15px 0px var(--neon-cyan);
            padding: 30px 40px;
            width: 380px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
            /* Centered alignment */
            align-self: center;
        }

        /* Decorative "Rivets" or corners */
        .menu-panel::before, .menu-panel::after {
            content: '';
            position: absolute;
            width: 8px; height: 8px;
            background: var(--neon-magenta);
            box-shadow: 0 0 5px var(--neon-magenta);
        }
        .menu-panel::before { top: -12px; left: -12px; }
        .menu-panel::after { bottom: -12px; right: -12px; }

        /* --- Buttons (Critique #2 & #6) --- */
        .btn-start {
            width: 100%;
            background: var(--neon-yellow);
            border: none;
            color: #000;
            font-family: var(--font-pixel);
            font-size: 1.8rem;
            font-weight: 900;
            padding: 18px 0;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* Pixelated border shadow */
            box-shadow: 4px 4px 0px #000;
            text-shadow: none;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            background: #fff;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #000;
        }

        .menu-links {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            border-top: 2px solid rgba(0, 255, 255, 0.3);
            padding-top: 15px;
        }

        .menu-link {
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 8px 12px;
            background: transparent;
            border: 2px solid transparent;
            transition: 0.1s;
            cursor: pointer;
            font-family: var(--font-pixel);
        }

        .menu-link:hover {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--neon-cyan);
            color: #fff;
            box-shadow: 2px 2px 0px var(--neon-magenta);
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            h1 .dance { font-size: 4rem; }
            .menu-panel { width: 90%; padding: 20px; }
            .btn-start { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glitch-overlay"></div>

    <!-- The Scene -->
    <canvas id="scene"></canvas>

    <!-- UI Content -->
    <div id="ui-layer">
        <!-- Centered Title -->
        <div class="title-container">
            <h1>Pixel<br><span class="dance">Dance</span></h1>
        </div>

        <!-- Centered Arcade Panel -->
        <div class="menu-panel">
            <button class="btn-start" onclick="startGame()">Start Game</button>
            <div class="menu-links">
                <a class="menu-link" onclick="alert('Options')">Options</a>
                <a class="menu-link" onclick="alert('Credits')">Credits</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        // Disable smoothing for pixel art aesthetic (Critique #3)
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let time = 0;

        // Configuration
        // Sun is smaller and further back (Critique #6)
        const sunY = 0.30; 
        const sunSize = 80;
        
        // Lane colors (Magenta/Cyan distinct)
        const laneColors = ['#ff00ff', '#00ffff', '#00ffff', '#ff00ff'];
        
        const stars = [];
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.35, 
                size: Math.random() > 0.9 ? 2 : 1, 
                alpha: Math.random()
            });
        }

        const notes = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + 0.5 * Math.sin(time * 0.05 + star.x * 10));
                // Pixelated stars
                ctx.fillRect(Math.floor(star.x * width), Math.floor(star.y * height), star.size, star.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawSun() {
            const cx = width / 2;
            const cy = height * sunY;
            const r = sunSize;

            // Reduced Glow (Critique #5)
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff00ff';
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Retro Horizontal Stripes (Blinds) - Stepped
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            for(let i = 0; i < 10; i++) {
                // Hard edges, increasing height
                let y = cy + (i * 8) + 10; 
                let h = 2 + i * 1.5; 
                if (y < cy + r) {
                    ctx.fillStyle = '#050011'; 
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawHighway() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width / 2; // Centered Highway
            
            // Highway Dimensions
            const bottomWidth = Math.min(width * 0.9, 1000); 
            const topWidth = 100;

            // 1. Draw Lane Backgrounds (Solid Colors, Distinct)
            // Alternating solid fills to define lanes clearly (Critique #3)
            for (let i = 0; i < 4; i++) {
                const bX1 = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const bX2 = bX1 + (bottomWidth / 4);
                const tX1 = centerX - (topWidth/2) + (i * (topWidth / 4));
                const tX2 = tX1 + (topWidth / 4);

                ctx.fillStyle = laneColors[i];
                ctx.globalAlpha = 0.15; // Subtle background
                ctx.beginPath();
                ctx.moveTo(tX1, horizonY);
                ctx.lineTo(tX2, horizonY);
                ctx.lineTo(bX2, height);
                ctx.lineTo(bX1, height);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 2. Vertical Lines (Hard Aliased Glow)
            // Instead of shadowBlur, we draw offset rectangles for a "glitch" glow
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ff00ff';
            
            for (let i = 0; i <= 4; i++) {
                const bottomX = centerX - (bottomWidth/2) + (i * (bottomWidth / 4));
                const topX = centerX - (topWidth/2) + (i * (topWidth / 4));

                // Hard Glow Layer (Offset)
                ctx.beginPath();
                ctx.moveTo(Math.floor(topX + 4), Math.floor(horizonY));
                ctx.lineTo(Math.floor(bottomX + 4), height);
                ctx.strokeStyle = 'rgba(255, 0, 255, 0.5)';
                ctx.stroke();

                // Core Line
                ctx.beginPath();
                ctx.moveTo(Math.floor(topX), Math.floor(horizonY));
                ctx.lineTo(Math.floor(bottomX), height);
                ctx.strokeStyle = '#fff'; // Bright core
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 3. Horizontal Grid Lines (Stepped Perspective)
            // Using power function for perspective
            const speed = 0.004; 
            time += speed;
            if (time > 1) time = 0;

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#00ffff'; // Cyan Grid (Critique #5)
            
            for (let i = 0; i < 30; i++) {
                const t = (i / 30 + time) % 1;
                
                // Perspective math
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
                
                const x1 = centerX - currentWidth / 2;
                const x2 = centerX + currentWidth / 2;

                // Fade out near horizon
                ctx.globalAlpha = t * 0.8; 

                // Draw thick line for pixel feel
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(Math.floor(x1), Math.floor(y), Math.floor(x2 - x1), 2);
            }
            ctx.globalAlpha = 1.0;
        }

        function spawnNote() {
            if (Math.random() < 0.05) {
                const laneIdx = Math.floor(Math.random() * 4);
                const lastNote = notes[notes.length-1];
                if (!lastNote || lastNote.t > 0.25) {
                    notes.push({
                        lane: laneIdx,
                        t: 0, 
                        active: true
                    });
                }
            }
        }

        function drawNotes() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.9, 1000);
            const topWidth = 100;

            notes.forEach(note => {
                note.t += 0.01; // Speed
                if (note.t > 1.1) note.active = false;

                const t = note.t;
                const y = horizonY + Math.pow(t, 2.2) * (height - horizonY);
                const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
                
                const laneWidth = currentWidth / 4;
                const laneX = (centerX - currentWidth / 2) + (note.lane * laneWidth);

                // Note size scales with perspective
                const noteSize = laneWidth * 0.6;
                const noteOffset = (laneWidth - noteSize) / 2;

                // Draw Note (Pixelated Square with Hard Glow)
                // Glow
                ctx.fillStyle = laneColors[note.lane];
                ctx.fillRect(Math.floor(laneX + noteOffset - 2), Math.floor(y - 2), Math.floor(noteSize + 4), Math.floor(noteSize + 4));
                
                // Core
                ctx.fillStyle = '#fff';
                ctx.fillRect(Math.floor(laneX + noteOffset), Math.floor(y), Math.floor(noteSize), Math.floor(noteSize));
            });

            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].active) notes.splice(i, 1);
            }
        }

        function drawHitLine() {
            const horizonY = height * sunY + (sunSize * 0.8);
            const centerX = width / 2;
            const bottomWidth = Math.min(width * 0.9, 1000);
            const topWidth = 100;

            // Hit line position: slightly higher for better visibility
            const targetY = height * 0.82;
            
            // Calculate width at this Y
            let t = 0;
            if(targetY > horizonY) {
                 t = Math.pow((targetY - horizonY) / (height - horizonY), 1/2.2);
            }

            const currentWidth = topWidth + (bottomWidth - topWidth) * Math.pow(t, 2.2);
            
            // Segmented, Dashed Pixel Line (Critique #4)
            // Instead of a single stroke, we draw blocks
            
            const segmentWidth = 20;
            const gapWidth = 10;
            const totalSegments = Math.floor(currentWidth / (segmentWidth + gapWidth));
            const startX = centerX - (totalSegments * (segmentWidth + gapWidth)) / 2;

            ctx.fillStyle = '#fff'; // Bright White
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff'; // Cyan Glow

            for(let i=0; i<totalSegments; i++) {
                // Skip segments that align with lane dividers to keep lanes readable
                let isDivider = false;
                const segCenter = startX + (i * (segmentWidth + gapWidth)) + (segmentWidth/2);
                const laneCenter = centerX;
                
                // Simple check if near a lane divider (approximate for visual effect)
                // We just draw the segments
                ctx.fillRect(Math.floor(startX + (i * (segmentWidth + gapWidth))), Math.floor(targetY - 4), segmentWidth, 8);
            }

            // Lane Dividers on Hit Line (Solid Blocks)
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000';
            for(let i=1; i<4; i++) {
                const x = (centerX - currentWidth/2) + (i * (currentWidth/4));
                ctx.fillRect(Math.floor(x-3), Math.floor(targetY-12), 6, 24);
            }
        }

        function animate() {
            // Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            drawStarfield();
            drawSun();
            drawHighway();
            
            spawnNote();
            drawNotes();
            
            drawHitLine();

            requestAnimationFrame(animate);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            
            // Glitch out effect
            document.querySelector('.glitch-overlay').style.opacity = '0.8';
            document.querySelector('.glitch-overlay').style.animation = 'none';
            
            btn.innerText = 'LOADING...';
            btn.style.backgroundColor = '#fff';
            btn.style.color = '#000';

            setTimeout(() => {
                // Simulate loading
                // alert('Entering the Grid...');
                // Reset for demo purposes
                btn.innerText = 'START GAME';
                btn.style.backgroundColor = 'var(--neon-yellow)';
                btn.style.color = '#000';
                document.querySelector('.glitch-overlay').style.opacity = '0';
                document.querySelector('.glitch-overlay').style.animation = 'glitch-flash 10s infinite';
            }, 1000);
        }

        animate();

    </script>
</body>
</html>
