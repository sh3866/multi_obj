<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #020617;
    --bg-light: #0f172a;
    --accent: #38bdf8;
    --accent-glow: #0ea5e9;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-bg: rgba(15, 23, 42, 0.6);
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-deep);
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.05em;
    margin: 0;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
    /* Geometric look */
    font-family: 'Impact', var(--font-stack); 
  }

  .title-block p {
    font-size: 0.7rem;
    color: var(--accent);
    margin: 0.5rem 0 0 0;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.8;
  }

  /* HUD Stats - Glassmorphism */
  .hud-stats {
    display: flex;
    gap: 2rem;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 0.75rem 2rem;
    border-radius: 99px; /* Pill shape */
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .stat:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -1rem;
    top: 10%;
    height: 80%;
    width: 1px;
    background: rgba(255,255,255,0.1);
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 1rem;
  }

  .action-btn {
    background: rgba(56, 189, 248, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid var(--accent);
    color: var(--text-main);
    padding: 1.25rem 3.5rem;
    border-radius: 99px; /* Match HUD pill shape */
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-transform: uppercase;
    box-shadow: 0 0 0 0 rgba(56, 189, 248, 0), inset 0 0 20px rgba(56, 189, 248, 0.1);
    position: relative;
    overflow: hidden;
  }

  .action-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
  }

  .action-btn:hover {
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(56, 189, 248, 0.2);
    transform: translateY(-4px) scale(1.02);
    border-color: #fff;
  }

  .action-btn:hover::before {
    left: 100%;
  }

  .action-btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--accent);
    padding: 1rem 2.5rem;
    border-radius: 12px;
    color: var(--accent);
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
    backdrop-filter: blur(4px);
  }
  
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <header>
      <div class="title-block">
        <h1>Aether Catch</h1>
        <p>System: Active</p>
      </div>
      <div class="hud-stats">
        <div class="stat">
          <span class="stat-label">Collected</span>
          <span class="stat-value" id="scoreVal">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Net Charge</span>
          <span class="stat-value" id="energyVal">100%</span>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">Creature Captured!</div>

    <footer>
      <button class="action-btn" id="collectBtn">Open Collection</button>
    </footer>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders a cohesive, atmospheric scene with particle effects and floating entities.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;

// Colors
const PALETTE = {
  bgDeep: '#020617',
  bgLight: '#0f172a',
  bgTeal: '#115e59',
  creatures: {
    jelly: ['#c084fc', '#e879f9'], // Purple
    shard: ['#38bdf8', '#0ea5e9'], // Cyan
    wisp:  ['#34d399', '#10b981']  // Emerald
  }
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, isAtmosphere = false) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.isAtmosphere = isAtmosphere;
    
    if (isAtmosphere) {
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = (Math.random() - 0.5) * 0.2;
      this.life = Math.random() * 0.5 + 0.1;
      this.decay = 0;
      this.size = Math.random() * 2 + 1;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.02;
      this.size = Math.random() * 4 + 2;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    
    if (!this.isAtmosphere) {
      this.life -= this.decay;
      this.size *= 0.95;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// --- Creature Types ---

class Jellyfish {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.color = PALETTE.creatures.jelly[Math.floor(Math.random() * 2)];
    this.scale = Math.random() * 0.5 + 0.8;
    this.wobble = Math.random() * Math.PI * 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.wobble += 0.05;

    // Bounce
    if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;
    
    // Gentle drift
    this.x += Math.sin(this.wobble) * 0.2;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    
    // Body (Dome)
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, -5, 20, Math.PI, 0);
    ctx.fill();
    
    // Inner detail
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(0, -10, 8, 0, Math.PI*2);
    ctx.fill();

    // Tentacles
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i=-15; i<=15; i+=10) {
      ctx.moveTo(i, -5);
      ctx.bezierCurveTo(i - 5, 10, i + 5, 20, i, 35 + Math.sin(this.wobble + i)*5);
    }
    ctx.stroke();

    ctx.restore();
  }
}

class Shard {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.color = PALETTE.creatures.shard[Math.floor(Math.random() * 2)];
    this.angle = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.05;
    this.size = Math.random() * 10 + 15;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.angle += this.rotSpeed;

    if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    
    // Diamond shape
    ctx.beginPath();
    ctx.moveTo(0, -this.size);
    ctx.lineTo(this.size * 0.6, 0);
    ctx.lineTo(0, this.size);
    ctx.lineTo(-this.size * 0.6, 0);
    ctx.closePath();
    ctx.fill();
    
    // Inner core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.4);
    ctx.lineTo(this.size * 0.2, 0);
    ctx.lineTo(0, this.size * 0.4);
    ctx.lineTo(-this.size * 0.2, 0);
    ctx.fill();

    ctx.restore();
  }
}

class Wisp {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = (Math.random() - 0.5) * 1.2;
    this.color = PALETTE.creatures.wisp[Math.floor(Math.random() * 2)];
    this.radius = Math.random() * 10 + 8;
    this.history = [];
    this.historyLimit = 15;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    
    // Erratic movement
    this.vx += (Math.random() - 0.5) * 0.1;
    this.vy += (Math.random() - 0.5) * 0.1;

    if (this.x < 0 || this.x > width) { this.vx *= -1; this.x = Math.max(0, Math.min(width, this.x)); }
    if (this.y < 0 || this.y > height) { this.vy *= -1; this.y = Math.max(0, Math.min(height, this.y)); }

    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    
    // Draw trail
    ctx.beginPath();
    for(let i=0; i<this.history.length; i++) {
      const pos = this.history[i];
      const alpha = (i / this.history.length);
      const size = this.radius * alpha;
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha * 0.5;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI*2);
      ctx.fill();
    }
    
    // Head
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    const types = [Jellyfish, Shard, Wisp];
    const type = types[Math.floor(Math.random() * types.length)];
    
    this.entity = new type(
      Math.random() * width,
      Math.random() * height
    );
    
    // Determine bounding radius for collision
    if (this.entity instanceof Jellyfish) this.radius = 40;
    else if (this.entity instanceof Shard) this.radius = 30;
    else this.radius = 25;
  }

  update() {
    this.entity.update();
  }

  draw(ctx) {
    this.entity.draw(ctx);
  }
}

// --- The Net (Cursor) ---

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 40;
    this.angle = 0;
    this.active = false;
  }

  update(mouseX, mouseY) {
    // Smooth follow (Lerp)
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.angle += 0.02;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Hexagonal Net Shape
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';

    // Draw Hexagon
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const theta = (i * 60) * Math.PI / 180 + this.angle;
      const r = this.radius;
      const px = r * Math.cos(theta);
      const py = r * Math.sin(theta);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // Inner Web Lines
    ctx.beginPath();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    for (let i = 0; i < 3; i++) {
      const theta = (i * 60) * Math.PI / 180 + this.angle;
      ctx.moveTo(0, 0);
      ctx.lineTo(this.radius * Math.cos(theta), this.radius * Math.sin(theta));
    }
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const atmosphereParticles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize Creatures
for (let i = 0; i < 6; i++) {
  creatures.push(new Creature());
}

// Initialize Atmosphere
for(let i=0; i<50; i++) {
  atmosphereParticles.push(new Particle(
    Math.random() * width,
    Math.random() * height,
    'rgba(255,255,255,0.3)',
    true
  ));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.entity.x - net.x;
    const dy = c.entity.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Hitbox check
    if (dist < net.radius + c.radius) {
      // Captured!
      createExplosion(c.entity.x, c.entity.y, c.entity.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score;
      caught = true;
      
      // Respawn
      setTimeout(() => creatures.push(new Creature()), 800);
    }
  }

  if (caught) {
    showToast();
  } else {
    // Visual feedback for miss (optional, maybe just a pulse on net)
    net.radius = 50;
    setTimeout(() => net.radius = 40, 100);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 25; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1000);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Layer
function drawBackground() {
  // Deep gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#020617');
  grad.addColorStop(1, '#082f49'); // Indigo to Teal
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Nebula Clouds (Static large blurred circles)
  ctx.globalCompositeOperation = 'screen';
  const nebulaGrad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/1.5);
  nebulaGrad.addColorStop(0, 'rgba(56, 189, 248, 0.05)');
  nebulaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = nebulaGrad;
  ctx.fillRect(0, 0, width, height);
  ctx.globalCompositeOperation = 'source-over';
}

// Main Loop
function animate() {
  time++;
  
  drawBackground();

  // Update Atmosphere
  atmosphereParticles.forEach(p => {
    p.update();
    p.draw(ctx);
    // Wrap around screen
    if(p.x < 0) p.x = width;
    if(p.x > width) p.x = 0;
    if(p.y < 0) p.y = height;
    if(p.y > height) p.y = 0;
  });

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Update & Draw Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
