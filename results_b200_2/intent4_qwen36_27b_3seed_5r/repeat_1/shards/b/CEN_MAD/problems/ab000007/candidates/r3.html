<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #0f0c29;
    --bg-mid: #302b63;
    --bg-light: #24243e;
    --accent-cyan: #00f2ff;
    --accent-glow: rgba(0, 242, 255, 0.6);
    --accent-pink: #ff0099;
    --accent-purple: #bd00ff;
    --text-main: #ffffff;
    --text-muted: #aab2cd;
    --glass-bg: rgba(15, 12, 41, 0.4);
    --glass-border: rgba(255, 255, 255, 0.2);
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
    background-color: var(--bg-deep);
  }

  /* 1. Visual Identity & Atmosphere */
  .scene-container {
    position: relative;
    width: 100%;
    height: 100%;
    /* Deep Indigo to Midnight Blue Gradient */
    background: radial-gradient(circle at 50% 50%, var(--bg-light) 0%, var(--bg-mid) 40%, var(--bg-deep) 100%);
    overflow: hidden;
  }

  /* CSS Noise Overlay for Depth */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* 4. UI Hierarchy & Typography */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    /* Reduced size, cleaner geometric sans */
    font-size: 1.8rem; 
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    text-transform: uppercase;
    color: var(--text-main);
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    line-height: 1.1;
  }

  .title-block p {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    margin: 0.4rem 0 0 0;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.8;
  }

  /* HUD Stats */
  .hud-stats {
    display: flex;
    gap: 2rem;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    /* Increased padding */
    padding: 1.2rem 2.5rem; 
    border-radius: 12px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Divider Line */
  .stat:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -1rem;
    top: 20%;
    height: 60%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3), transparent);
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    text-shadow: 0 0 10px var(--accent-glow);
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 2rem;
  }

  /* Button: Glassmorphism & Renamed */
  .action-btn {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: var(--text-main);
    padding: 1rem 4rem;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    text-transform: uppercase;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    position: relative;
    overflow: hidden;
  }

  .action-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: 0.5s;
  }

  .action-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 25px var(--accent-glow), 0 10px 40px rgba(0,0,0,0.4);
    transform: translateY(-3px);
    text-shadow: 0 0 8px white;
  }

  .action-btn:hover::before {
    left: 100%;
  }

  .action-btn:active {
    transform: translateY(1px);
    background: rgba(0, 242, 255, 0.15);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 12, 41, 0.9);
    border: 1px solid var(--accent-cyan);
    padding: 1rem 3rem;
    border-radius: 8px;
    color: var(--accent-cyan);
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 50px var(--accent-glow);
    backdrop-filter: blur(5px);
  }
  
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }

</style>
</head>
<body>

  <div class="scene-container">
    <!-- CSS Noise Overlay -->
    <div class="noise-overlay"></div>
    <!-- Canvas for Game Entities -->
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <header>
        <div class="title-block">
          <h1>Aether Catch</h1>
          <p>Biome: Deep Void</p>
        </div>
        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">Collected</span>
            <span class="stat-value" id="scoreVal">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Net Charge</span>
            <span class="stat-value" id="energyVal">100%</span>
          </div>
        </div>
      </header>

      <div class="toast" id="toast">Specimen Captured!</div>

      <footer>
        <button class="action-btn" id="collectBtn">Bestiary</button>
      </footer>
    </div>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders a cohesive, atmospheric scene with particle effects and floating entities.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;

// Colors
const PALETTE = {
  jelly: '#ff0099', 
  shard: '#00f2ff', 
  wisp:  '#bd00ff'  
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, isAtmosphere = false) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.isAtmosphere = isAtmosphere;
    
    if (isAtmosphere) {
      this.vx = (Math.random() - 0.5) * 0.1;
      this.vy = (Math.random() - 0.5) * 0.1;
      this.life = Math.random() * 0.5 + 0.1;
      this.decay = 0;
      this.size = Math.random() * 1.5 + 0.5;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.02;
      this.size = Math.random() * 4 + 2;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    
    if (!this.isAtmosphere) {
      this.life -= this.decay;
      this.size *= 0.96;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// --- Creature Types ---

class Jellyfish {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.jelly;
    this.scale = Math.random() * 0.4 + 0.6;
    this.driftSpeed = Math.random() * 0.4 + 0.1;
    this.swayAmp = Math.random() * 30 + 10;
    this.swaySpeed = Math.random() * 0.02 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;

    if (this.y < -150) {
      this.y = height + 150;
      this.baseX = Math.random() * width;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // 3. Creature Design: Gradient Fill & Bloom
    const grad = ctx.createRadialGradient(0, -10, 5, 0, 0, 40);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    grad.addColorStop(0.3, this.color);
    grad.addColorStop(1, 'rgba(189, 0, 255, 0)');

    ctx.shadowBlur = 25;
    ctx.shadowColor = this.color;
    
    // Body (Dome)
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(0, -5, 25, Math.PI, 0);
    ctx.fill();
    
    // Tentacles
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.7;
    
    // Draw multiple distinct tentacles
    for(let i=-15; i<=15; i+=10) {
      ctx.beginPath();
      ctx.moveTo(i, -5);
      // Wavy line logic
      ctx.bezierCurveTo(
        i - 5, 15, 
        i + 5, 25, 
        i + Math.sin(this.phase + i)*8, 50
      );
      ctx.stroke();
    }

    ctx.restore();
  }
}

class Shard {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.shard;
    this.size = Math.random() * 10 + 15;
    this.driftSpeed = Math.random() * 0.3 + 0.1;
    this.swayAmp = Math.random() * 30 + 10;
    this.swaySpeed = Math.random() * 0.03 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.angle = 0;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;
    this.angle += this.rotSpeed;

    if (this.y < -150) {
      this.y = height + 150;
      this.baseX = Math.random() * width;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.9;
    
    // Crystal shape
    ctx.beginPath();
    ctx.moveTo(0, -this.size);
    ctx.lineTo(this.size * 0.5, 0);
    ctx.lineTo(0, this.size);
    ctx.lineTo(-this.size * 0.5, 0);
    ctx.closePath();
    ctx.fill();
    
    // Inner core glow
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(0, 0, this.size * 0.3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class Wisp {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.wisp;
    this.radius = Math.random() * 8 + 6;
    this.driftSpeed = Math.random() * 0.5 + 0.2;
    this.swayAmp = Math.random() * 40 + 20;
    this.swaySpeed = Math.random() * 0.04 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
    this.history = [];
    this.historyLimit = 10;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;

    if (this.y < -150) {
      this.y = height + 150;
      this.baseX = Math.random() * width;
    }

    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    ctx.save();
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    
    // Draw trail
    ctx.beginPath();
    for(let i=0; i<this.history.length; i++) {
      const pos = this.history[i];
      const alpha = (i / this.history.length) * 0.5;
      const size = this.radius * (i / this.history.length);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI*2);
      ctx.fill();
    }
    
    // Head
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    const types = [Jellyfish, Shard, Wisp];
    const type = types[Math.floor(Math.random() * types.length)];
    
    // 5. Layout & Composition: Cluster within central 60%
    const margin = width * 0.2;
    const centerX = width / 2;
    const centerY = height / 2;
    const spreadX = (width * 0.6) / 2;
    const spreadY = (height * 0.6) / 2;

    const spawnX = centerX + (Math.random() - 0.5) * spreadX * 2;
    const spawnY = initial ? centerY + (Math.random() - 0.5) * spreadY * 2 : height + 50;

    this.entity = new type(spawnX, spawnY);
    
    if (this.entity instanceof Jellyfish) this.radius = 40;
    else if (this.entity instanceof Shard) this.radius = 30;
    else this.radius = 25;
  }

  update() {
    this.entity.update();
  }

  draw(ctx) {
    this.entity.draw(ctx);
  }
}

// --- The Net (2. Player Entity Redesign) ---

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 45;
    this.angle = 0;
    this.breathPhase = 0;
    this.targetRadius = 45;
  }

  update(mouseX, mouseY) {
    this.x += (mouseX - this.x) * 0.12;
    this.y += (mouseY - this.y) * 0.12;
    this.angle += 0.003;
    this.breathPhase += 0.05;
    
    // Smooth radius transition
    this.radius += (this.targetRadius - this.radius) * 0.2;
    this.currentScale = 1 + Math.sin(this.breathPhase) * 0.05;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.currentScale, this.currentScale);
    
    // 2. Player Entity Redesign: Hexagonal Energy Net
    ctx.lineWidth = 2;
    ctx.shadowBlur = 20; // Bloom effect
    ctx.shadowColor = 'rgba(0, 242, 255, 0.8)';

    // Draw Hexagon Border
    ctx.strokeStyle = '#00f2ff';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const theta = (i * 60) * Math.PI / 180 + this.angle;
      const r = this.radius;
      const px = r * Math.cos(theta);
      const py = r * Math.sin(theta);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // Semi-transparent Cyan Fill
    ctx.fillStyle = 'rgba(0, 242, 255, 0.2)';
    ctx.fill();

    // Internal Cross-lines (Mesh)
    ctx.beginPath();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.6)';
    for (let i = 0; i < 3; i++) {
      const theta = (i * 60) * Math.PI / 180 + this.angle;
      ctx.moveTo(-this.radius * Math.cos(theta), -this.radius * Math.sin(theta));
      ctx.lineTo(this.radius * Math.cos(theta), this.radius * Math.sin(theta));
    }
    ctx.stroke();

    // Central 'Core' Dot
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const atmosphereParticles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize Creatures
for (let i = 0; i < 5; i++) {
  creatures.push(new Creature());
}

// Initialize Atmosphere
for(let i=0; i<60; i++) {
  atmosphereParticles.push(new Particle(
    Math.random() * width,
    Math.random() * height,
    'rgba(255,255,255,0.4)',
    true
  ));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.entity.x - net.x;
    const dy = c.entity.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < net.radius + c.radius) {
      createExplosion(c.entity.x, c.entity.y, c.entity.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score;
      caught = true;
      
      setTimeout(() => creatures.push(new Creature()), 1000);
    }
  }

  if (caught) {
    showToast();
  } else {
    net.targetRadius = 65;
    setTimeout(() => net.targetRadius = 45, 150);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 30; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1200);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Main Loop
function animate() {
  time++;
  
  ctx.clearRect(0, 0, width, height);

  // Update Atmosphere
  atmosphereParticles.forEach(p => {
    p.update();
    p.draw(ctx);
    if(p.x < 0) p.x = width;
    if(p.x > width) p.x = 0;
    if(p.y < 0) p.y = height;
    if(p.y > height) p.y = 0;
  });

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
