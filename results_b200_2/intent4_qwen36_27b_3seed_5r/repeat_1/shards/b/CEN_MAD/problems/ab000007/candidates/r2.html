<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch</title>
<style>
  :root {
    --bg-center: #1a2a40;
    --bg-edge: #050a14;
    --accent: #38bdf8;
    --accent-dim: rgba(56, 189, 248, 0.4);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-bg: rgba(5, 10, 20, 0.4);
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius-std: 16px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-edge);
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
  }

  /* 1. Visual Atmosphere & Background */
  .scene-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edge) 100%);
    overflow: hidden;
  }

  /* CSS Noise Overlay for "Aetheric Dust" */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.07;
    background-image: radial-gradient(transparent 0%, #ffffff 100%), 
                      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px; /* Grainy texture + Grid dust */
    filter: contrast(150%) brightness(100%);
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    pointer-events: none; /* Let clicks pass through to UI if needed, though we track mouse on window */
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* 4. UI Hierarchy & Typography */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    font-size: 2.2rem;
    font-weight: 800; /* Increased weight */
    letter-spacing: -0.03em;
    margin: 0;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); /* Glow */
    line-height: 1;
  }

  .title-block p {
    font-size: 0.75rem;
    color: var(--accent);
    margin: 0.5rem 0 0 0;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.9;
  }

  /* HUD Stats */
  .hud-stats {
    display: flex;
    gap: 2rem;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 0.8rem 2rem;
    border-radius: var(--radius-std); /* Standardized radius */
    border: 1px solid var(--glass-border);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .stat:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -1rem;
    top: 15%;
    height: 70%;
    width: 1px;
    background: rgba(255,255,255,0.15);
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 1rem;
  }

  /* 5. Button & Call-to-Action */
  .action-btn {
    background: rgba(255, 255, 255, 0.1); /* Subtle fill */
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text-main);
    padding: 1rem 3rem;
    border-radius: var(--radius-std); /* Standardized radius */
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    text-transform: uppercase;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); /* Drop shadow to lift */
    position: relative;
    overflow: hidden;
  }

  .action-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-dim), 0 10px 30px rgba(0,0,0,0.5);
    transform: translateY(-2px);
  }

  .action-btn:active {
    transform: translateY(1px);
    background: rgba(56, 189, 248, 0.2);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 10, 20, 0.85);
    border: 1px solid var(--accent);
    padding: 1rem 2.5rem;
    border-radius: 12px;
    color: var(--accent);
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.2);
    backdrop-filter: blur(8px);
  }
  
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }

</style>
</head>
<body>

  <div class="scene-container">
    <!-- CSS Noise Overlay -->
    <div class="noise-overlay"></div>
    <!-- Canvas for Game Entities -->
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <header>
        <div class="title-block">
          <h1>Aether Catch</h1>
          <p>System: Active</p>
        </div>
        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">Collected</span>
            <span class="stat-value" id="scoreVal">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Net Charge</span>
            <span class="stat-value" id="energyVal">100%</span>
          </div>
        </div>
      </header>

      <div class="toast" id="toast">Creature Captured!</div>

      <footer>
        <button class="action-btn" id="collectBtn">Collect</button>
      </footer>
    </div>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Renders a cohesive, atmospheric scene with particle effects and floating entities.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;

// Colors
const PALETTE = {
  jelly: '#e879f9', // Pink
  shard: '#38bdf8', // Cyan
  wisp:  '#c084fc'  // Purple
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, isAtmosphere = false) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.isAtmosphere = isAtmosphere;
    
    if (isAtmosphere) {
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = (Math.random() - 0.5) * 0.2;
      this.life = Math.random() * 0.5 + 0.1;
      this.decay = 0;
      this.size = Math.random() * 2 + 1;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.02;
      this.size = Math.random() * 4 + 2;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    
    if (!this.isAtmosphere) {
      this.life -= this.decay;
      this.size *= 0.95;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// --- Creature Types (3. Creature Variety & Animation) ---

class Jellyfish {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.jelly;
    this.scale = Math.random() * 0.5 + 0.8;
    // Animation props for drift/sway
    this.driftSpeed = Math.random() * 0.5 + 0.2;
    this.swayAmp = Math.random() * 40 + 20;
    this.swaySpeed = Math.random() * 0.02 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
  }

  update() {
    this.phase += this.swaySpeed;
    // Vertical drift
    this.y -= this.driftSpeed;
    // Horizontal sway
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;

    // Reset if off screen
    if (this.y < -100) {
      this.y = height + 100;
      this.baseX = Math.random() * width;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    
    // Body (Dome)
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(0, -5, 20, Math.PI, 0);
    ctx.fill();
    
    // Inner detail
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(0, -10, 8, 0, Math.PI*2);
    ctx.fill();

    // Tentacles
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    for(let i=-15; i<=15; i+=10) {
      ctx.moveTo(i, -5);
      ctx.bezierCurveTo(i - 5, 10, i + 5, 20, i, 35 + Math.sin(this.phase + i)*5);
    }
    ctx.stroke();

    ctx.restore();
  }
}

class Shard {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.shard;
    this.size = Math.random() * 10 + 15;
    // Animation props
    this.driftSpeed = Math.random() * 0.3 + 0.1;
    this.swayAmp = Math.random() * 30 + 10;
    this.swaySpeed = Math.random() * 0.03 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
    this.rotSpeed = (Math.random() - 0.5) * 0.02;
    this.angle = 0;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;
    this.angle += this.rotSpeed;

    if (this.y < -100) {
      this.y = height + 100;
      this.baseX = Math.random() * width;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.9;
    
    // Diamond shape
    ctx.beginPath();
    ctx.moveTo(0, -this.size);
    ctx.lineTo(this.size * 0.6, 0);
    ctx.lineTo(0, this.size);
    ctx.lineTo(-this.size * 0.6, 0);
    ctx.closePath();
    ctx.fill();
    
    // Inner core
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.4);
    ctx.lineTo(this.size * 0.2, 0);
    ctx.lineTo(0, this.size * 0.4);
    ctx.lineTo(-this.size * 0.2, 0);
    ctx.fill();

    ctx.restore();
  }
}

class Wisp {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.wisp;
    this.radius = Math.random() * 10 + 8;
    // Animation props
    this.driftSpeed = Math.random() * 0.6 + 0.3;
    this.swayAmp = Math.random() * 50 + 20;
    this.swaySpeed = Math.random() * 0.04 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
    this.history = [];
    this.historyLimit = 15;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;

    if (this.y < -100) {
      this.y = height + 100;
      this.baseX = Math.random() * width;
    }

    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    
    // Draw trail
    ctx.beginPath();
    for(let i=0; i<this.history.length; i++) {
      const pos = this.history[i];
      const alpha = (i / this.history.length);
      const size = this.radius * alpha;
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha * 0.4;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI*2);
      ctx.fill();
    }
    
    // Head
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    const types = [Jellyfish, Shard, Wisp];
    const type = types[Math.floor(Math.random() * types.length)];
    
    this.entity = new type(
      Math.random() * width,
      initial ? Math.random() * height : height + 50 // Start off screen if not initial
    );
    
    // Determine bounding radius for collision
    if (this.entity instanceof Jellyfish) this.radius = 40;
    else if (this.entity instanceof Shard) this.radius = 30;
    else this.radius = 25;
  }

  update() {
    this.entity.update();
  }

  draw(ctx) {
    this.entity.draw(ctx);
  }
}

// --- The Net (2. Player Entity Redesign) ---

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 45;
    this.angle = 0;
    this.breathPhase = 0;
  }

  update(mouseX, mouseY) {
    // Smooth follow (Lerp)
    this.x += (mouseX - this.x) * 0.12;
    this.y += (mouseY - this.y) * 0.12;
    this.angle += 0.005; // Very slow rotation
    
    // Breathing animation
    this.breathPhase += 0.05;
    this.currentScale = 1 + Math.sin(this.breathPhase) * 0.05; // Scale 1.0 to 1.05
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.currentScale, this.currentScale);
    
    // 2. Player Entity Redesign: Hexagonal Net Shape
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';

    // Draw Hexagon Border
    ctx.strokeStyle = '#38bdf8';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const theta = (i * 60) * Math.PI / 180 + this.angle;
      const r = this.radius;
      const px = r * Math.cos(theta);
      const py = r * Math.sin(theta);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // Semi-transparent Cyan Fill
    ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
    ctx.fill();

    // Internal Cross-lines (Mesh)
    ctx.beginPath();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
    for (let i = 0; i < 3; i++) {
      const theta = (i * 60) * Math.PI / 180 + this.angle;
      ctx.moveTo(-this.radius * Math.cos(theta), -this.radius * Math.sin(theta));
      ctx.lineTo(this.radius * Math.cos(theta), this.radius * Math.sin(theta));
    }
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const atmosphereParticles = [];
const net = new Net();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize Creatures
for (let i = 0; i < 6; i++) {
  creatures.push(new Creature());
}

// Initialize Atmosphere
for(let i=0; i<50; i++) {
  atmosphereParticles.push(new Particle(
    Math.random() * width,
    Math.random() * height,
    'rgba(255,255,255,0.3)',
    true
  ));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Filter creatures
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.entity.x - net.x;
    const dy = c.entity.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Hitbox check
    if (dist < net.radius + c.radius) {
      // Captured!
      createExplosion(c.entity.x, c.entity.y, c.entity.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score;
      caught = true;
      
      // Respawn
      setTimeout(() => creatures.push(new Creature()), 800);
    }
  }

  if (caught) {
    showToast();
  } else {
    // Visual feedback for miss
    net.radius = 55;
    setTimeout(() => net.radius = 45, 100);
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 25; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1000);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Background Layer (Removed from Canvas as per CSS Background)
// We only draw entities now.

// Main Loop
function animate() {
  time++;
  
  // Clear canvas
  ctx.clearRect(0, 0, width, height);

  // Update Atmosphere (Particles)
  atmosphereParticles.forEach(p => {
    p.update();
    p.draw(ctx);
    // Wrap around screen
    if(p.x < 0) p.x = width;
    if(p.x > width) p.x = 0;
    if(p.y < 0) p.y = height;
    if(p.y > height) p.y = 0;
  });

  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // Update & Draw Net
  net.update(mouseX, mouseY);
  net.draw(ctx);

  // Update & Draw Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
