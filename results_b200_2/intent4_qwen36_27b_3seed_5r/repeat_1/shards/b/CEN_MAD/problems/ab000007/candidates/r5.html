<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Catch: Deep Void</title>
<style>
  :root {
    /* Palette */
    --bg-deep: #020205;
    --bg-mid: #0a0a16;
    
    --accent-cyan: #00f0ff;
    --accent-pink: #ff0055;
    --accent-purple: #bd00ff;
    
    --text-main: #ffffff;
    --text-muted: #6e7691;
    
    /* UI Geometry */
    --radius: 4px;
    
    /* Typography */
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-stack);
    color: var(--text-main);
    background-color: var(--bg-deep);
  }

  /* 1. Atmosphere & Layout */
  .scene-container {
    position: relative;
    width: 100%;
    height: 100%;
    /* Critique Point 5: Deepen Background with Vignette */
    background: radial-gradient(circle at center, #1a1a2e 0%, var(--bg-mid) 40%, var(--bg-deep) 90%);
    overflow: hidden;
  }

  /* Subtle noise for texture */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    gap: 2rem;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    font-size: 1.2rem; 
    font-weight: 800;
    letter-spacing: 0.05em;
    margin: 0;
    text-transform: uppercase;
    color: var(--text-main);
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    line-height: 1;
  }

  .title-block p {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    margin: 0.5rem 0 0 0;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.7;
  }

  /* HUD Panel: Glassmorphism & Hierarchy */
  .hud-stats {
    display: flex;
    align-items: center;
    background: rgba(10, 10, 20, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 0.6rem 1.2rem; 
    border-radius: var(--radius);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    min-width: 70px;
    position: relative;
  }

  /* Critique Point 4: Vertical Divider */
  .stat:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -0.8rem;
    top: 15%;
    height: 70%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
  }

  .stat-label {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 2px;
    font-weight: 600;
    opacity: 0.7; /* Reduced opacity for hierarchy */
  }

  .stat-value {
    font-size: 1.5rem; /* Increased font size */
    font-weight: 800; /* Increased weight */
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }

  /* Footer / Controls */
  footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 2rem;
  }

  /* Critique Point 3: Elevate 'Collection' Button - Crystalline Artifact */
  .action-btn {
    background: rgba(0, 240, 255, 0.05); /* Semi-transparent glass */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--accent-cyan); /* Bright cyan border */
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1); /* Subtle glow */
    color: #fff;
    padding: 1rem 3rem;
    border-radius: 2px;
    font-size: 0.85rem;
    font-weight: 700; /* Increased weight */
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .action-btn:hover {
    background: rgba(0, 240, 255, 0.15);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
    transform: translateY(-2px);
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
  }

  .action-btn:active {
    transform: translateY(0);
    background: rgba(0, 240, 255, 0.25);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid var(--accent-cyan);
    padding: 0.8rem 2rem;
    border-radius: var(--radius);
    color: var(--accent-cyan);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    backdrop-filter: blur(8px);
  }
  
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

  <div class="scene-container">
    <div class="noise-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <header>
        <div class="title-block">
          <h1>Aether Catch</h1>
          <p>Biome: Deep Void</p>
        </div>
        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">Collected</span>
            <span class="stat-value" id="scoreVal">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Net Charge</span>
            <span class="stat-value" id="energyVal">100%</span>
          </div>
        </div>
      </header>

      <div class="toast" id="toast">Specimen Captured!</div>

      <footer>
        <button class="action-btn" id="collectBtn">Collection</button>
      </footer>
    </div>
  </div>

<script>
/**
 * VISUAL ENGINE
 * Implements Player/Net mechanic, enhanced creature silhouettes, and parallax layers.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const toastEl = document.getElementById('toast');

let width, height;
let score = 0;
let time = 0;

// Colors - Increased Saturation (Critique Point 2)
const PALETTE = {
  jelly: '#ff0077', // Hotter Pink
  shard: '#00ffff', // Pure Cyan
  wisp:  '#cc00ff', // Deep Purple
  drone: '#ffffff'
};

// Resize handling
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Classes ---

class Particle {
  constructor(x, y, color, isAtmosphere = false) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.isAtmosphere = isAtmosphere;
    
    if (isAtmosphere) {
      this.z = Math.random() * 0.5 + 0.1;
      this.vx = (Math.random() - 0.5) * 0.2 * this.z;
      this.vy = (Math.random() - 0.5) * 0.2 * this.z;
      this.life = 1.0;
      this.decay = 0;
      this.size = (Math.random() * 1.5 + 0.5) * this.z;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.02;
      this.size = Math.random() * 4 + 2;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    
    if (!this.isAtmosphere) {
      this.life -= this.decay;
      this.size *= 0.96;
    } else {
        if(this.x < 0) this.x = width;
        if(this.x > width) this.x = 0;
        if(this.y < 0) this.y = height;
        if(this.y > height) this.y = 0;
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// --- Creature Types ---

class Jellyfish {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.jelly;
    this.scale = Math.random() * 0.4 + 0.7;
    this.driftSpeed = Math.random() * 0.4 + 0.15;
    this.swayAmp = Math.random() * 40 + 20;
    this.swaySpeed = Math.random() * 0.02 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;

    if (this.y < -200) {
      this.y = height + 200;
      this.baseX = Math.random() * width;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // Critique Point 2: Bloom Effect
    ctx.shadowBlur = 30;
    ctx.shadowColor = this.color;
    
    // Gradient
    const grad = ctx.createRadialGradient(0, -10, 5, 0, 0, 45);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    grad.addColorStop(0.4, this.color);
    grad.addColorStop(1, 'rgba(255, 0, 85, 0)');

    // Body (Dome)
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.bezierCurveTo(-25, -35, 25, -35, 25, 0);
    ctx.bezierCurveTo(25, 10, -25, 10, -25, 0);
    ctx.fill();
    
    // Tentacles
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.7;
    
    const tentacleCount = 5;
    for(let i=-20; i<=20; i+=10) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.bezierCurveTo(
        i - 10, 20, 
        i + 10, 35, 
        i + Math.sin(this.phase + i)*12, 65
      );
      ctx.stroke();
    }

    ctx.restore();
  }
}

class Shard {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.shard;
    this.size = Math.random() * 15 + 20;
    this.driftSpeed = Math.random() * 0.3 + 0.1;
    this.swayAmp = Math.random() * 30 + 10;
    this.swaySpeed = Math.random() * 0.03 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
    this.rotSpeed = (Math.random() - 0.5) * 0.03;
    this.angle = 0;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;
    this.angle += this.rotSpeed;

    if (this.y < -150) {
      this.y = height + 150;
      this.baseX = Math.random() * width;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Critique Point 2: Bloom Effect
    ctx.shadowBlur = 25;
    ctx.shadowColor = this.color;
    
    // Crystal shape
    const grad = ctx.createLinearGradient(0, -this.size, 0, this.size);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.5, this.color);
    grad.addColorStop(1, 'rgba(0, 255, 255, 0.1)');
    
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.9;
    
    ctx.beginPath();
    ctx.moveTo(0, -this.size);
    ctx.lineTo(this.size * 0.6, 0);
    ctx.lineTo(0, this.size);
    ctx.lineTo(-this.size * 0.6, 0);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
  }
}

class Wisp {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.color = PALETTE.wisp;
    this.radius = Math.random() * 10 + 8;
    this.driftSpeed = Math.random() * 0.6 + 0.2;
    this.swayAmp = Math.random() * 50 + 30;
    this.swaySpeed = Math.random() * 0.04 + 0.01;
    this.phase = Math.random() * Math.PI * 2;
    this.baseX = x;
    this.history = [];
    this.historyLimit = 15;
  }

  update() {
    this.phase += this.swaySpeed;
    this.y -= this.driftSpeed;
    this.x = this.baseX + Math.sin(this.phase) * this.swayAmp;

    if (this.y < -150) {
      this.y = height + 150;
      this.baseX = Math.random() * width;
    }

    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.historyLimit) this.history.shift();
  }

  draw(ctx) {
    ctx.save();
    // Critique Point 2: Bloom Effect
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    
    // Draw trail
    ctx.beginPath();
    for(let i=0; i<this.history.length; i++) {
      const pos = this.history[i];
      const alpha = (i / this.history.length) * 0.6;
      const size = this.radius * (i / this.history.length);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI*2);
      ctx.fill();
    }
    
    // Head
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
  }
}

class Creature {
  constructor() {
    this.reset(true);
  }

  reset(initial = false) {
    const types = [Jellyfish, Shard, Wisp];
    const type = types[Math.floor(Math.random() * types.length)];
    
    const margin = width * 0.2;
    const centerX = width / 2;
    const centerY = height / 2;
    
    const spawnX = centerX + (Math.random() - 0.5) * (width * 0.8);
    const spawnY = initial ? centerY + (Math.random() - 0.5) * (height * 0.6) : height + 50;

    this.entity = new type(spawnX, spawnY);
    
    if (this.entity instanceof Jellyfish) this.radius = 50;
    else if (this.entity instanceof Shard) this.radius = 35;
    else this.radius = 30;
  }

  update() {
    this.entity.update();
  }

  draw(ctx) {
    this.entity.draw(ctx);
  }
}

// --- Player & Net (Critique Point 1) ---

class Player {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.angle = 0;
    this.netOpen = false;
    this.netAngle = 0;
    this.targetNetAngle = 0;
    this.pulse = 0;
  }

  update(mouseX, mouseY) {
    // Smooth movement
    this.x += (mouseX - this.x) * 0.12;
    this.y += (mouseY - this.y) * 0.12;
    
    // Drone bobbing
    this.angle += 0.02;
    
    // Pulse animation
    this.pulse += 0.05;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // 1. Drone Body (Silhouette) - Minimal to focus on Net
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    
    // Main body
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 5, 0, 0, Math.PI*2);
    ctx.fill();

    // Glowing Core
    ctx.fillStyle = PALETTE.drone;
    ctx.shadowBlur = 10;
    ctx.shadowColor = PALETTE.drone;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // 2. The Net (Critique Point 1: Energy Net)
    this.drawNet(ctx);
  }

  drawNet(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Net Animation
    this.targetNetAngle += 0.05;
    this.netAngle += (this.targetNetAngle - this.netAngle) * 0.1;
    
    // Critique Point 1: Radius ~40px
    const baseRadius = 40;
    // Pulsing animation
    const pulseEffect = Math.sin(this.pulse) * 2;
    const expand = Math.sin(this.netAngle) * 5;
    const radius = baseRadius + expand + pulseEffect;

    // Rotate slightly
    ctx.rotate(this.netAngle * 0.1); 

    // Critique Point 1: Dashed, Glowing Cyan Circle
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.8)';
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.6)';
    
    // Outer Ring (Dashed)
    ctx.setLineDash([8, 4]); // Dashed pattern
    ctx.lineDashOffset = -time * 0.5; // Rotate dash
    
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI*2);
    ctx.stroke();

    // Inner Energy Ring (Subtle)
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(0, 0, radius - 5, 0, Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}

// --- Game State ---

const creatures = [];
const particles = [];
const atmosphereParticles = [];
const player = new Player();
let mouseX = width / 2;
let mouseY = height / 2;

// Initialize Creatures
for (let i = 0; i < 12; i++) {
  creatures.push(new Creature());
}

// Initialize Atmosphere
for(let i=0; i<100; i++) {
  atmosphereParticles.push(new Particle(
    Math.random() * width,
    Math.random() * height,
    'rgba(200, 220, 255, 0.5)',
    true
  ));
}

// Input Handling
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

// Collection Logic
function attemptCapture() {
  let caught = false;
  
  // Visual feedback on net
  player.targetNetAngle = 100;

  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const dx = c.entity.x - player.x;
    const dy = c.entity.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 45 + c.radius) { // Net radius + creature radius
      createExplosion(c.entity.x, c.entity.y, c.entity.color);
      creatures.splice(i, 1);
      score++;
      scoreEl.innerText = score;
      caught = true;
      
      setTimeout(() => creatures.push(new Creature()), 2000);
    }
  }

  if (caught) {
    showToast();
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 25; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function showToast() {
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1200);
}

document.getElementById('collectBtn').addEventListener('click', attemptCapture);

// Main Loop
function animate() {
  time++;
  
  ctx.clearRect(0, 0, width, height);

  // 1. Background Atmosphere (Parallax)
  ctx.globalCompositeOperation = 'screen';
  atmosphereParticles.forEach(p => {
    p.update();
    p.draw(ctx);
  });
  ctx.globalCompositeOperation = 'source-over';

  // 2. Creatures
  creatures.forEach(c => {
    c.update();
    c.draw(ctx);
  });

  // 3. Player & Net
  player.update(mouseX, mouseY);
  player.draw(ctx);

  // 4. Particles (Explosions)
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
