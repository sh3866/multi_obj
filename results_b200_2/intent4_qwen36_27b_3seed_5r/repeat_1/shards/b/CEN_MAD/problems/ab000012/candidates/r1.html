<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #020305;
        --bg-panel: rgba(10, 12, 18, 0.65);
        
        /* Golds */
        --gold-bright: #ffd700;
        --gold-main: #d4af37;
        --gold-dark: #8a7020;
        --gold-glow: rgba(212, 175, 55, 0.4);
        
        /* Mystics */
        --mystic-purple: #7b2cbf;
        --mystic-blue: #3a0ca3;
        --mystic-glow: rgba(123, 44, 191, 0.5);
        
        /* Text */
        --text-main: #ffffff;
        --text-muted: #a0a5b0;
        
        /* UI Elements */
        --border-glass: rgba(255, 215, 0, 0.25);
        --border-glass-hover: rgba(255, 215, 0, 0.6);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Background & Atmosphere */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 40%, #1a0b2e 0%, #05070a 70%);
    }

    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 200px rgba(0,0,0,0.95);
        pointer-events: none;
        z-index: 10;
    }

    /* Main Layout */
    .game-container {
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 1.5rem 2rem;
        position: relative;
        z-index: 5;
    }

    /* Header & Currency */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(20,15,5,0.8) 100%);
        border: 1px solid var(--gold-main);
        padding: 0.6rem 1.8rem;
        border-radius: 4px; /* Slightly sharper corners for game feel */
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 15px var(--gold-glow), inset 0 0 10px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        transform: skewX(-5deg); /* Dynamic tilt */
    }

    .currency-pill span {
        transform: skewX(5deg); /* Counter-skew text */
    }

    .currency-icon {
        width: 24px;
        height: 24px;
        fill: url(#goldGradient);
        filter: drop-shadow(0 0 4px var(--gold-main));
    }

    .currency-amount {
        font-family: 'Georgia', serif;
        font-weight: bold;
        font-size: 1.2rem;
        /* Metallic Text */
        background: linear-gradient(to bottom, #fff 0%, #ffd700 40%, #b8860b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Typography: Title */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-grow: 1;
    }

    .game-title {
        font-family: 'Georgia', serif;
        font-size: 4rem;
        font-weight: 400;
        letter-spacing: 0.02em; /* Tighter, more modern */
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #ffffff 30%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 40px rgba(0,0,0,0.8);
        margin-bottom: 0.5rem;
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.8);
        text-transform: uppercase;
        margin-bottom: 2rem;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* Hero: The Ritual Anchor (Summoning Circle) */
    .orb-container {
        position: relative;
        width: 260px;
        height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        margin-bottom: 2rem;
    }

    /* The Void Core */
    .orb-core {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        /* Deep Purple/Blue Void */
        background: radial-gradient(circle at 40% 40%, #4a0e4e 0%, #1a0525 60%, #000000 100%);
        box-shadow: 
            0 0 30px var(--mystic-purple),
            0 0 60px var(--mystic-blue),
            inset 0 0 20px rgba(255,255,255,0.1);
        position: relative;
        z-index: 2;
        animation: breathe 4s ease-in-out infinite;
    }

    /* Inner Glow Pulse */
    .orb-core::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        opacity: 0.5;
        animation: pulse-light 2s infinite;
    }

    /* The Rings */
    .orb-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid var(--gold-dark);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        pointer-events: none;
    }

    .ring-1 { 
        width: 160px; height: 160px; 
        border-top-color: var(--gold-bright); 
        border-bottom-color: var(--gold-bright);
        border-left-color: transparent;
        border-right-color: transparent;
        animation: spin 12s linear infinite; 
    }
    
    .ring-2 { 
        width: 200px; height: 200px; 
        border: 1px dashed var(--mystic-purple); 
        opacity: 0.6; 
        animation: spin-rev 20s linear infinite; 
    }
    
    .ring-3 { 
        width: 250px; height: 250px; 
        border: 1px solid rgba(255,255,255,0.05);
        border-top-color: var(--gold-main);
        animation: spin 30s linear infinite; 
    }

    /* Menu Grid */
    .menu-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr; /* 2 columns for Summon */
        grid-template-rows: 1fr 1fr; /* 2 rows */
        gap: 1.2rem;
        width: 100%;
        padding: 0 1rem;
    }

    /* Card Material System: Glass & Gold */
    .menu-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: 12px;
        padding: 1.2rem;
        display: flex;
        flex-direction: row; /* Horizontal layout */
        align-items: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        height: 90px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Inner Glow Effect */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 12px;
        box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.05);
        pointer-events: none;
        transition: box-shadow 0.3s ease;
    }

    .menu-card:hover {
        transform: translateY(-3px);
        background: rgba(20, 24, 35, 0.8);
        border-color: var(--border-glass-hover);
        box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 15px var(--gold-glow);
    }

    .menu-card:hover::before {
        box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.15);
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 8px var(--gold-main));
        transform: scale(1.1);
    }

    /* Primary Action: Summon */
    .menu-card.primary {
        grid-column: 1 / 2;
        grid-row: 1 / 3; /* Spans full height */
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(160deg, rgba(20, 15, 5, 0.8) 0%, rgba(40, 20, 5, 0.6) 100%);
        border: 1px solid rgba(255, 215, 0, 0.5);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
    }

    .menu-card.primary:hover {
        border-color: var(--gold-bright);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }

    .menu-card.primary .card-icon {
        width: 60px;
        height: 60px;
        fill: var(--gold-bright);
        margin-bottom: 1rem;
    }

    .menu-card.primary .card-title {
        font-size: 1.8rem;
        letter-spacing: 0.1em;
        color: var(--gold-bright);
    }

    .menu-card.primary .card-subtitle {
        color: var(--text-main);
        opacity: 0.8;
        font-weight: 500;
    }

    /* Secondary Actions Layout */
    .card-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
        flex-shrink: 0;
    }

    .card-content {
        display: flex;
        flex-direction: column;
    }

    .card-title {
        font-family: 'Georgia', serif;
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-bottom: 2px;
    }

    .card-subtitle {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: translate(-50%, -50%) rotate(360deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--mystic-purple), inset 0 0 20px rgba(255,255,255,0.1); }
        50% { transform: scale(1.05); box-shadow: 0 0 50px var(--mystic-purple), inset 0 0 30px rgba(255,255,255,0.2); }
    }

    @keyframes pulse-light {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .game-container { padding: 1rem; }
        
        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
        }
        
        .menu-card.primary {
            grid-column: 1 / -1;
            grid-row: auto;
            height: 120px;
            flex-direction: row;
            justify-content: flex-start;
            padding-left: 2rem;
        }

        .menu-card.primary .card-icon {
            margin-bottom: 0;
            width: 50px;
            height: 50px;
        }

        .game-title { font-size: 2.5rem; }
        .orb-container { width: 200px; height: 200px; }
        .orb-core { width: 90px; height: 90px; }
        .ring-1 { width: 120px; height: 120px; }
        .ring-2 { width: 150px; height: 150px; }
        .ring-3 { width: 190px; height: 190px; }
    }
</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="vignette"></div>

    <!-- SVG Gradients Defs -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                <stop offset="30%" style="stop-color:#ffd700;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="game-container">
        <header>
            <!-- Spacer to balance layout -->
            <div style="width: 120px; display: flex; align-items: center;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>

            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <div class="game-subtitle">Awaken Spirits</div>
            
            <div class="orb-container" id="summon-orb">
                <div class="orb-core"></div>
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-ring ring-3"></div>
            </div>
        </main>

        <nav class="menu-grid">
            <!-- Summon Card (Primary) -->
            <div class="menu-card primary">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L9 9H2l6 4.5L5.5 22 12 17l6.5 5-2.5-8.5L22 9h-7z"/>
                </svg>
                <div class="card-content" style="text-align: center;">
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">The Ritual</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Team</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 21.29 21.29 19.86l-1.43-1.43L22 16.29l-1.43-1.43z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Resources</div>
                </div>
            </div>

            <!-- Settings/Extra Card to fill grid nicely -->
            <div class="menu-card">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
                <div class="card-content">
                    <div class="card-title">Config</div>
                    <div class="card-subtitle">System</div>
                </div>
            </div>
        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles and the interactive orb.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.4;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 0.005 : -0.005;
                
                // Mystical colors
                const colors = ['200, 200, 255', '212, 175, 55', '123, 44, 191'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir;
                if (this.alpha >= 0.6 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Orb Effect
        const orb = document.getElementById('summon-orb');
        
        orb.addEventListener('mousemove', (e) => {
            const rect = orb.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Subtle parallax on the inner elements
            const core = orb.querySelector('.orb-core');
            
            // Move core slightly opposite to mouse for depth
            core.style.transform = `translate(${-x * 0.08}px, ${-y * 0.08}px)`;
        });

        orb.addEventListener('mouseleave', () => {
             const core = orb.querySelector('.orb-core');
             // Reset transform but keep animation playing via CSS class logic or just default
             core.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
