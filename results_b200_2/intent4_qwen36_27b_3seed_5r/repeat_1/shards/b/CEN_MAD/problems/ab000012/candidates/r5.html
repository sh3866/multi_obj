<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Darker, richer tones */
        --bg-deep: #05020a;
        --bg-void: #000000;
        
        /* Golds - Metallic & Glowing */
        --gold-bright: #fff4cc;
        --gold-main: #d4af37;
        --gold-dark: #8a6e0f;
        --gold-metal: linear-gradient(180deg, #fff4cc 0%, #d4af37 40%, #8a6e0f 60%, #d4af37 100%);
        --gold-glow: rgba(212, 175, 55, 0.5);
        
        /* Mystics */
        --mystic-purple: #b026ff;
        --mystic-deep: #240046;
        --mystic-glow: rgba(176, 38, 255, 0.4);
        
        /* UI Elements */
        --glass-bg: rgba(10, 5, 15, 0.6);
        --glass-border: rgba(212, 175, 55, 0.2);
        --glass-border-hover: rgba(212, 175, 55, 0.6);
        
        /* Typography */
        --font-main: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: #f0f0f0;
        font-family: var(--font-main);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1000px;
    }

    /* --- 1. Atmosphere & Texture --- */

    /* Deep Void Background */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #000000 70%);
    }

    /* Grain Texture Overlay */
    .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.08;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Heavy Vignette */
    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 200px rgba(0,0,0,0.95);
        pointer-events: none;
        z-index: 5;
    }

    /* Main Container */
    .game-container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 2rem 3rem 2rem;
        position: relative;
        z-index: 10;
    }

    /* --- 2. Header & Currency (Pill Design) --- */
    header {
        width: 100%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(10, 5, 15, 0.85);
        border: 1px solid var(--gold-main);
        border-radius: 50px; /* Pill shape */
        padding: 0.4rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 
            0 0 15px rgba(0,0,0,0.8),
            inset 0 0 10px rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
    }

    .currency-pill:hover {
        box-shadow: 
            0 0 20px var(--gold-glow),
            inset 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .currency-icon {
        width: 18px;
        height: 18px;
        fill: url(#gold-grad);
        filter: drop-shadow(0 0 4px var(--gold-glow));
    }

    .currency-amount {
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--gold-bright);
        letter-spacing: 0.5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.8);
    }

    /* --- 3. Typography (Hero) --- */
    .hero-section {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-bottom: 1rem;
    }

    .game-title {
        font-family: var(--font-main);
        font-size: clamp(3rem, 7vw, 6rem);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: center;
        background: var(--gold-metal);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.9));
        margin-bottom: 0.2rem;
        z-index: 2;
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-main);
        font-size: clamp(0.8rem, 1.5vw, 1.1rem);
        font-weight: 400;
        letter-spacing: 0.6em;
        color: var(--gold-main); /* Muted gold */
        text-transform: uppercase;
        opacity: 0.85;
        text-shadow: 0 0 10px rgba(0,0,0,1);
        z-index: 2;
        margin-bottom: 2rem;
    }

    /* --- 4. The Spirit Rift (Living Circle) --- */
    .rift-container {
        position: relative;
        width: 400px;
        height: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 1rem;
        /* 3D Tilt */
        transform: rotateX(20deg);
        transform-style: preserve-3d;
    }

    /* The Void Center (Deep Glowing Purple) */
    .rift-void {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #1a0033 0%, #000000 70%, transparent 100%);
        box-shadow: 
            inset 0 0 60px rgba(0,0,0,1),
            0 0 30px var(--mystic-deep),
            0 0 80px rgba(176, 38, 255, 0.2);
        z-index: 1;
        animation: pulse-void 5s ease-in-out infinite;
    }

    /* Rotating Dashed Rings */
    .rift-ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        border-color: var(--gold-dark);
        pointer-events: none;
        opacity: 0.6;
        box-shadow: 0 0 10px rgba(138, 110, 15, 0.1);
    }

    .ring-outer {
        width: 380px;
        height: 380px;
        border-width: 1px;
        border-top-color: var(--gold-main);
        border-bottom-color: var(--gold-main);
        animation: spin 40s linear infinite;
    }

    .ring-middle {
        width: 290px;
        height: 290px;
        border-width: 2px;
        border-color: rgba(176, 38, 255, 0.2);
        border-top-color: var(--mystic-purple);
        border-bottom-color: var(--mystic-purple);
        animation: spin-rev 25s linear infinite;
    }

    .ring-inner {
        width: 210px;
        height: 210px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.1);
        border-top-color: rgba(255,255,255,0.5);
        animation: spin 15s linear infinite;
    }

    /* Core Spark */
    .rift-core {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, var(--mystic-purple) 40%, transparent 80%);
        box-shadow: 0 0 25px var(--mystic-purple);
        z-index: 2;
        animation: pulse-core 3s ease-in-out infinite;
    }

    /* --- 5. Menu Cards (Glassmorphism System) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 1000px;
        margin-bottom: 2rem; 
    }

    .menu-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border); /* Subtle gold border */
        border-radius: 8px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        height: 160px;
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.5),
            0 5px 15px rgba(0,0,0,0.5);
    }

    /* Ghost Button Hover State */
    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(20, 10, 30, 0.8);
        border-color: var(--gold-main);
        box-shadow: 
            inset 0 0 15px rgba(212, 175, 55, 0.15),
            0 10px 25px rgba(0,0,0,0.6);
    }

    .menu-card:hover .card-icon {
        stroke: var(--gold-bright);
        filter: drop-shadow(0 0 8px var(--gold-glow));
        transform: scale(1.1);
    }

    /* Primary Action: Summon */
    .menu-card.primary {
        background: rgba(30, 15, 45, 0.9);
        border: 1px solid var(--gold-main); /* Solid gold border */
        box-shadow: 
            inset 0 0 20px rgba(212, 175, 55, 0.2),
            0 5px 15px rgba(0,0,0,0.5);
        animation: pulse-summon 4s infinite ease-in-out;
    }

    .menu-card.primary .card-title {
        color: var(--gold-bright);
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Typography inside cards */
    .card-title {
        font-family: var(--font-main); /* Serif font */
        font-size: 1.3rem;
        color: #fff;
        margin-top: 0.8rem;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-subtitle {
        font-family: var(--font-main); /* Serif font */
        font-size: 0.7rem;
        color: var(--gold-main); /* Legible muted gold */
        text-transform: uppercase;
        letter-spacing: 0.15em;
        opacity: 0.9;
        margin-top: 0.3rem;
    }

    /* Icons - Standardized Stroke */
    .card-icon {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: #a3a3a3;
        stroke-width: 2px; /* Consistent stroke weight */
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
    }

    /* Animations */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    
    @keyframes pulse-core {
        0%, 100% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 40px var(--mystic-purple); }
    }
    
    @keyframes pulse-void {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    @keyframes pulse-summon {
        0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(0,0,0,0.5); }
        50% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.1); }
    }

    /* Responsive */
    @media (max-width: 900px) {
        .game-container { padding: 1rem; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .rift-container { transform: scale(0.7) rotateX(10deg); margin: 1rem 0; }
        .game-title { letter-spacing: 0.05em; }
    }
</style>
</head>
<body>

    <!-- Backgrounds -->
    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <div class="game-container">
        
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <!-- Inline SVG Gradient Definition -->
                <svg width="0" height="0">
                    <defs>
                        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#fff4cc;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8a6e0f;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Gold Coin Icon -->
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="url(#gold-grad)" stroke="#5c4609" stroke-width="1"/>
                    <text x="12" y="16" font-family="serif" font-size="12" text-anchor="middle" fill="#5c4609" font-weight="bold">$</text>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <!-- Hero / Rift Area -->
        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <div class="game-subtitle">Spirit Summoning</div>
            
            <div class="rift-container" id="rift-vortex">
                <div class="rift-void"></div>
                <div class="rift-core"></div>
                
                <!-- Rings -->
                <div class="rift-ring ring-outer"></div>
                <div class="rift-ring ring-middle"></div>
                <div class="rift-ring ring-inner"></div>
            </div>
        </main>

        <!-- Navigation / Menu -->
        <nav class="menu-grid">
            
            <!-- Primary: Summon -->
            <div class="menu-card primary">
                <!-- Star Rune Icon (Stroke) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">The Ritual</div>
            </div>

            <!-- Roster -->
            <div class="menu-card">
                <!-- Group Icon (Stroke) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Team</div>
            </div>

            <!-- Battle -->
            <div class="menu-card">
                <!-- Sword Icon (Stroke) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
                    <path d="M13 19l6-6"></path>
                    <path d="M16 16l4 4"></path>
                    <path d="M19 21l2-2"></path>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind -->
            <div class="menu-card">
                <!-- Pickaxe Icon (Stroke) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.3;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 0.002 : -0.002;
                
                // Mystical colors (Purple/Gold/White)
                const colors = ['157, 78, 221', '212, 175, 55', '255, 255, 255'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                this.alpha += this.fadeDir;
                if (this.alpha >= 0.5 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Rift Effect
        const rift = document.getElementById('rift-vortex');
        
        rift.addEventListener('mousemove', (e) => {
            const rect = rift.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = rift.querySelector('.rift-core');
            const voidEl = rift.querySelector('.rift-void');
            
            // Move core slightly opposite to mouse for depth
            core.style.transform = `translate(${-x * 0.08}px, ${-y * 0.08}px)`;
            
            // Subtle parallax on the void glow
            voidEl.style.transform = `translate(${x * 0.04}px, ${y * 0.04}px)`;
        });

        rift.addEventListener('mouseleave', () => {
             const core = rift.querySelector('.rift-core');
             const voidEl = rift.querySelector('.rift-void');
             core.style.transform = `translate(0px, 0px)`;
             voidEl.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
