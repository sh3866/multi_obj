<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #05020a;
        --bg-panel: rgba(20, 10, 30, 0.6);
        
        /* Golds */
        --gold-bright: #ffd700;
        --gold-main: #d4af37;
        --gold-dim: #8a7020;
        --gold-glow: rgba(212, 175, 55, 0.6);
        
        /* Mystics */
        --mystic-purple: #9d4edd;
        --mystic-deep: #240046;
        
        /* Text */
        --text-main: #f0f0f0;
        --text-muted: #a3a3a3;
        
        /* UI Elements */
        --border-glass: rgba(212, 175, 55, 0.25);
        --border-glass-hover: rgba(212, 175, 55, 0.8);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Hero Area Transformation (The Ritual Circle) --- */
    
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        /* Deep radial gradient: Deep purple floor fading to black void */
        background: radial-gradient(circle at 50% 55%, #1a0b2e 0%, #000000 70%);
    }

    /* Grain Texture Overlay */
    .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.08;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 200px rgba(0,0,0,1);
        pointer-events: none;
        z-index: 5;
    }

    /* Main Layout */
    .game-container {
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 2rem;
        position: relative;
        z-index: 10;
    }

    /* --- 5. Currency & Layout Refinement --- */
    header {
        display: flex;
        justify-content: flex-end; /* Align currency right */
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: linear-gradient(180deg, rgba(30, 15, 45, 0.8) 0%, rgba(10, 5, 20, 0.9) 100%);
        border: 1px solid var(--gold-main);
        padding: 0.6rem 1.8rem;
        border-radius: 4px; /* Slightly squared for elegance */
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 
            inset 0 1px 1px rgba(255, 255, 255, 0.1),
            0 4px 15px rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
        position: relative;
    }

    /* Decorative corners for currency */
    .currency-pill::before, .currency-pill::after {
        content: '';
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--gold-bright);
        box-shadow: 0 0 5px var(--gold-main);
    }
    .currency-pill::before { top: 2px; left: 2px; }
    .currency-pill::after { bottom: 2px; right: 2px; }

    .currency-icon {
        width: 22px;
        height: 22px;
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 2px var(--gold-main));
    }

    .currency-amount {
        font-family: 'Times New Roman', serif;
        font-weight: bold;
        font-size: 1.2rem;
        color: #fff;
        letter-spacing: 0.5px;
        text-shadow: 0 0 8px var(--gold-glow);
    }

    /* --- 4. Typography & Icon Polish --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-grow: 1;
        /* Significant whitespace separation */
        padding-bottom: 3rem; 
    }

    .game-title {
        font-family: 'Times New Roman', serif;
        font-size: 5rem;
        font-weight: normal;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #ffffff 0%, #d4af37 50%, #8a7020 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Metallic Gold Text Effect */
        filter: drop-shadow(0 2px 0px rgba(0,0,0,0.8));
        margin-bottom: 0.5rem;
        z-index: 2;
        position: relative;
    }

    .game-subtitle {
        font-family: 'Times New Roman', serif;
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.4em; /* Elegant spacing */
        color: #e0e0e0;
        text-transform: uppercase;
        opacity: 0.8;
        margin-bottom: 4rem; /* Push away from title */
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        z-index: 2;
    }

    /* --- 1. The Summoning Circle Visuals --- */
    .vortex-container {
        position: relative;
        width: 350px;
        height: 350px;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Floor illusion */
        transform: rotateX(10deg); 
    }

    /* The Floor Glow */
    .ritual-floor {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(157, 78, 221, 0.3) 0%, transparent 70%);
        box-shadow: 0 0 50px var(--mystic-purple);
        animation: pulse-floor 4s ease-in-out infinite;
    }

    /* Rotating Rings */
    .vortex-ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        border-color: var(--gold-dim);
        pointer-events: none;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
    }

    .ring-outer {
        width: 320px;
        height: 320px;
        border-width: 1px;
        border-top-color: var(--gold-main);
        border-bottom-color: var(--gold-main);
        animation: spin 25s linear infinite;
    }

    .ring-middle {
        width: 260px;
        height: 260px;
        border-width: 2px;
        border-color: rgba(212, 175, 55, 0.3);
        border-top-color: var(--mystic-purple);
        animation: spin-rev 18s linear infinite;
    }

    .ring-inner {
        width: 200px;
        height: 200px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.1);
        animation: spin 12s linear infinite;
    }

    /* Core Spark */
    .vortex-core {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #ffffff 0%, var(--mystic-purple) 40%, transparent 80%);
        box-shadow: 0 0 30px var(--mystic-purple), 0 0 60px var(--mystic-deep);
        z-index: 2;
        animation: pulse-core 3s ease-in-out infinite;
    }

    /* --- 2. Unified Card Material (Glass & Gold) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
    }

    .menu-card {
        /* Unified Material */
        background: var(--bg-panel);
        border: 1px solid var(--gold-dim);
        border-radius: 6px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        height: 140px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(30, 15, 45, 0.7);
        border-color: var(--gold-main);
        box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-main);
        filter: drop-shadow(0 0 4px var(--gold-glow));
    }

    .card-title {
        font-family: 'Times New Roman', serif;
        font-size: 1.3rem;
        color: var(--text-main);
        margin-top: 0.8rem;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-subtitle {
        font-family: 'Segoe UI', sans-serif;
        font-size: 0.75rem;
        color: var(--gold-main); /* Pale gold */
        text-transform: uppercase;
        letter-spacing: 0.2em;
        opacity: 0.9;
        margin-top: 0.3rem;
    }

    /* --- 3. Hierarchy via Lighting (The Summon Anchor) --- */
    .menu-card.primary {
        /* Keep background consistent, change lighting */
        background: rgba(30, 15, 45, 0.8);
        border: 1px solid var(--gold-main);
        box-shadow: 
            0 0 15px rgba(212, 175, 55, 0.15),
            inset 0 0 20px rgba(212, 175, 55, 0.05);
        animation: pulse-summon-border 4s infinite ease-in-out;
    }

    .menu-card.primary::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 60%);
        animation: rotate-light 6s linear infinite;
        pointer-events: none;
    }

    .menu-card.primary:hover {
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        border-color: var(--gold-bright);
    }

    .menu-card.primary .card-title {
        color: var(--gold-bright);
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Icons */
    .card-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
        stroke: none;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes pulse-core {
        0%, 100% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 50px var(--mystic-purple); }
    }

    @keyframes pulse-floor {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes pulse-summon-border {
        0%, 100% { border-color: var(--gold-dim); box-shadow: 0 0 10px rgba(212, 175, 55, 0.1); }
        50% { border-color: var(--gold-main); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
    }
    
    @keyframes rotate-light {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 800px) {
        .game-container { padding: 1rem; }
        
        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 1rem;
        }
        
        .game-title { font-size: 3rem; }
        .vortex-container { transform: scale(0.8) rotateX(10deg); margin: -2rem 0; }
    }
</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <div class="game-container">
        <header>
            <!-- Currency Pill -->
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <div class="game-subtitle">Spirit Summoning</div>
            
            <div class="vortex-container" id="summon-vortex">
                <!-- Floor Glow -->
                <div class="ritual-floor"></div>
                
                <!-- The Core -->
                <div class="vortex-core"></div>
                
                <!-- Rings -->
                <div class="vortex-ring ring-outer"></div>
                <div class="vortex-ring ring-middle"></div>
                <div class="vortex-ring ring-inner"></div>
            </div>
        </main>

        <!-- Unified Menu Grid -->
        <nav class="menu-grid">
            
            <!-- Primary Action: Summon (The Anchor) -->
            <div class="menu-card primary">
                <!-- Star Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">The Ritual</div>
            </div>

            <!-- Roster -->
            <div class="menu-card">
                <!-- Group Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Team</div>
            </div>

            <!-- Battle -->
            <div class="menu-card">
                <!-- Sword Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind -->
            <div class="menu-card">
                <!-- Hammer Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M22.7 13.03L22.7 13.03c.39.39.39 1.02 0 1.41l-2.34 2.34c-.39.39-1.02.39-1.41 0l-1.83-1.83-3.75 3.75 1.83 1.83c.39.39.39 1.02 0 1.41l-2.34 2.34c-.39.39-1.02.39-1.41 0L3.29 9.34c-.39-.39-.39-1.02 0-1.41l2.34-2.34c.39-.39 1.02-.39 1.41 0l1.83 1.83 3.75-3.75-1.83-1.83c-.39-.39-.39-1.02 0-1.41l2.34-2.34c.39-.39 1.02-.39 1.41 0l9.16 9.94z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.3;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 0.002 : -0.002;
                
                // Mystical colors (Purple/Gold)
                const colors = ['157, 78, 221', '212, 175, 55', '255, 255, 255'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir;
                if (this.alpha >= 0.5 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Vortex Effect
        const vortex = document.getElementById('summon-vortex');
        
        vortex.addEventListener('mousemove', (e) => {
            const rect = vortex.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = vortex.querySelector('.vortex-core');
            const floor = vortex.querySelector('.ritual-floor');
            
            // Move core slightly opposite to mouse for depth
            core.style.transform = `translate(${-x * 0.05}px, ${-y * 0.05}px)`;
            
            // Subtle parallax on the floor glow
            floor.style.transform = `translate(${x * 0.02}px, ${y * 0.02}px)`;
        });

        vortex.addEventListener('mouseleave', () => {
             const core = vortex.querySelector('.vortex-core');
             const floor = vortex.querySelector('.ritual-floor');
             core.style.transform = `translate(0px, 0px)`;
             floor.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
