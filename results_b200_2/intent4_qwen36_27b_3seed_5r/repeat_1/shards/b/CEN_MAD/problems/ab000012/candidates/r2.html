<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #020305;
        --bg-panel: rgba(10, 12, 18, 0.75);
        
        /* Golds */
        --gold-bright: #ffd700;
        --gold-main: #d4af37;
        --gold-dark: #8a7020;
        --gold-glow: rgba(212, 175, 55, 0.5);
        
        /* Mystics */
        --mystic-purple: #7b2cbf;
        --mystic-blue: #3a0ca3;
        --mystic-glow: rgba(123, 44, 191, 0.6);
        
        /* Text */
        --text-main: #ffffff;
        --text-muted: #a0a5b0;
        
        /* UI Elements */
        --border-glass: rgba(255, 215, 0, 0.15);
        --border-glass-hover: rgba(255, 215, 0, 0.5);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Hero Area Overhaul (Atmosphere & Grain) --- */
    
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        /* Deep radial gradient: deep violet to black */
        background: radial-gradient(circle at 50% 30%, #2e0f3d 0%, #0a0a12 60%, #000000 100%);
    }

    /* Grain Texture Overlay */
    .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.07;
        /* CSS Noise generation */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        pointer-events: none;
        z-index: 5;
    }

    /* Main Layout */
    .game-container {
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 2rem;
        position: relative;
        z-index: 10;
    }

    /* --- 4. Currency UI (The 'Clarity' Fix) --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(10, 10, 15, 0.9);
        border: 1px solid var(--gold-main);
        padding: 0.5rem 1.5rem;
        border-radius: 50px; /* Pill shape */
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        backdrop-filter: blur(5px);
    }

    .currency-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 2px var(--gold-main));
    }

    .currency-amount {
        font-family: 'Georgia', serif;
        font-weight: bold;
        font-size: 1.1rem;
        color: #fff;
        letter-spacing: 0.5px;
        text-shadow: 0 0 5px var(--gold-glow);
    }

    /* --- 3. Typography & Icon Polish --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-grow: 1;
        /* Push content slightly up to balance the bottom grid */
        padding-bottom: 2rem; 
    }

    .game-title {
        font-family: 'Georgia', serif;
        font-size: 4.5rem;
        font-weight: 400;
        letter-spacing: 0.15em; /* Cinematic spacing */
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(to bottom, #ffffff 20%, #b0b5c0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        margin-bottom: 0.2rem;
        z-index: 2;
    }

    .game-subtitle {
        font-family: 'Times New Roman', 'Georgia', serif; /* Elegant serif */
        font-size: 1.2rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        color: var(--gold-main); /* Gold color */
        text-transform: uppercase;
        margin-bottom: 2.5rem;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        z-index: 2;
    }

    /* Swirling Spirit Vortex */
    .vortex-container {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1rem;
    }

    .vortex-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ff00ff 0%, #4a004a 40%, #000000 100%);
        box-shadow: 
            0 0 40px var(--mystic-purple),
            0 0 80px var(--mystic-blue),
            inset 0 0 15px rgba(255,255,255,0.3);
        position: relative;
        z-index: 2;
        animation: pulse-core 4s ease-in-out infinite;
    }

    /* Rotating Dashed Borders */
    .vortex-ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        pointer-events: none;
    }

    .ring-outer {
        width: 260px;
        height: 260px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.15);
        border-top-color: var(--gold-main);
        border-right-color: var(--gold-main);
        animation: spin 20s linear infinite;
    }

    .ring-middle {
        width: 210px;
        height: 210px;
        border-width: 2px;
        border-color: transparent;
        border-top-color: var(--mystic-purple);
        border-bottom-color: var(--mystic-purple);
        animation: spin-rev 15s linear infinite;
        box-shadow: 0 0 15px var(--mystic-glow);
    }

    .ring-inner {
        width: 150px;
        height: 150px;
        border-width: 1px;
        border-color: var(--gold-dark);
        animation: spin 10s linear infinite;
    }

    /* --- 2. Menu Grid Restructure --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2 Columns */
        grid-template-rows: 1fr 1fr;    /* 2 Rows */
        gap: 1rem;
        width: 100%;
        padding: 0 0.5rem;
    }

    /* Base Card Style */
    .menu-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-glass);
        border-radius: 8px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        height: 100px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .menu-card:hover {
        transform: translateY(-2px);
        background: rgba(20, 24, 35, 0.85);
        border-color: var(--border-glass-hover);
        box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 0 10px var(--gold-glow);
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 5px var(--gold-main));
    }

    .card-title {
        font-family: 'Georgia', serif;
        font-size: 1.2rem;
        color: var(--text-main);
        margin-top: 0.5rem;
        letter-spacing: 0.05em;
    }

    .card-subtitle {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Primary Action: Summon */
    /* Spans full width of first column (effectively a tall card or wide depending on preference, 
       brief says "span full width of first column (or be visually larger)". 
       Let's make it span the full width of the grid (Row 1) to be the "Primary Action" as requested 
       OR keep it as a tall card. The brief says "Row 1: [Summon] [Roster]". 
       So Summon is Row 1 Col 1. Roster is Row 1 Col 2.
       To make it distinct: Give it a gold gradient border and glowing background. */
    .menu-card.primary {
        background: linear-gradient(160deg, rgba(40, 20, 5, 0.9) 0%, rgba(20, 10, 5, 0.8) 100%);
        border: 1px solid var(--gold-main);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }

    .menu-card.primary::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(45deg, transparent 40%, rgba(255, 215, 0, 0.05) 50%, transparent 60%);
        background-size: 200% 200%;
        animation: shimmer 3s infinite;
        pointer-events: none;
    }

    .menu-card.primary:hover {
        border-color: var(--gold-bright);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
    }

    .menu-card.primary .card-title {
        color: var(--gold-bright);
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Icons */
    .card-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
        stroke-width: 1.5; /* Uniform stroke */
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* Animations */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes pulse-core {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 50px var(--mystic-purple); }
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .game-container { padding: 1rem; }
        
        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            gap: 0.8rem;
        }

        .game-title { font-size: 3rem; letter-spacing: 0.1em; }
        .game-subtitle { font-size: 1rem; }
        
        .vortex-container { width: 220px; height: 220px; }
        .vortex-core { width: 70px; height: 70px; }
        .ring-outer { width: 200px; height: 200px; }
        .ring-middle { width: 160px; height: 160px; }
        .ring-inner { width: 110px; height: 110px; }
    }
</style>
</head>
<body>

    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    
    <!-- Grain Texture -->
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <!-- SVG Gradients Defs -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                <stop offset="30%" style="stop-color:#ffd700;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="game-container">
        <header>
            <!-- Left spacer or logo placeholder -->
            <div style="width: 40px; opacity: 0.5;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>

            <!-- Currency Pill -->
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <div class="game-subtitle">Awaken Spirits</div>
            
            <div class="vortex-container" id="summon-vortex">
                <div class="vortex-core"></div>
                <div class="vortex-ring ring-outer"></div>
                <div class="vortex-ring ring-middle"></div>
                <div class="vortex-ring ring-inner"></div>
            </div>
        </main>

        <!-- Restructured Menu Grid -->
        <nav class="menu-grid">
            
            <!-- Row 1: Summon (Primary) -->
            <div class="menu-card primary">
                <!-- Star/Spark Icon -->
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">The Ritual</div>
            </div>

            <!-- Row 1: Roster -->
            <div class="menu-card">
                <!-- Two Figures Icon -->
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="9" cy="7" r="3"/>
                    <circle cx="17" cy="7" r="2.5"/>
                    <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
                    <path d="M17 11a3 3 0 0 1 3 3v7"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Team</div>
            </div>

            <!-- Row 2: Battle -->
            <div class="menu-card">
                <!-- Crossed Swords Icon -->
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/>
                    <path d="M13 19l6-6"/>
                    <path d="M16 16l4 4"/>
                    <path d="M19 21l2-2"/>
                    <path d="M9.5 6.5L21 18v3h-3L9.5 9.5"/>
                    <path d="M11 5l-6 6"/>
                    <path d="M8 8l-4-4"/>
                    <path d="M5 3l-2 2"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Row 2: Grind -->
            <div class="menu-card">
                <!-- Hammer/Anvil Icon -->
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M18 6L6 18"/>
                    <path d="M14 6l4-4 4 4-4 4"/>
                    <path d="M6 18l-4 4 4 4 4-4"/>
                    <path d="M10 14l4 4"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.3;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 0.002 : -0.002;
                
                // Mystical colors (Purple/Blue/Gold)
                const colors = ['200, 180, 255', '212, 175, 55', '123, 44, 191'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Fade in/out
                this.alpha += this.fadeDir;
                if (this.alpha >= 0.5 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Vortex Effect
        const vortex = document.getElementById('summon-vortex');
        
        vortex.addEventListener('mousemove', (e) => {
            const rect = vortex.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = vortex.querySelector('.vortex-core');
            const ringOuter = vortex.querySelector('.ring-outer');
            
            // Move core slightly opposite to mouse for depth
            core.style.transform = `translate(${-x * 0.05}px, ${-y * 0.05}px)`;
            // Move outer ring slightly with mouse
            ringOuter.style.transform = `rotate(${Date.now() / 50}deg) translate(${x * 0.02}px, ${y * 0.02}px)`;
        });

        vortex.addEventListener('mouseleave', () => {
             const core = vortex.querySelector('.vortex-core');
             core.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
