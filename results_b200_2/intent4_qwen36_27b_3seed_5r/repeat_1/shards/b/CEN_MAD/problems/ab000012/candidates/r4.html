<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Darker, richer tones */
        --bg-deep: #05020a;
        --bg-void: #000000;
        
        /* Golds - Metallic & Glowing */
        --gold-bright: #fff4cc;
        --gold-main: #d4af37;
        --gold-dark: #8a6e0f;
        --gold-metal: linear-gradient(180deg, #fff4cc 0%, #d4af37 40%, #8a6e0f 60%, #d4af37 100%);
        --gold-glow: rgba(212, 175, 55, 0.5);
        
        /* Mystics */
        --mystic-purple: #b026ff;
        --mystic-deep: #240046;
        --mystic-glow: rgba(176, 38, 255, 0.4);
        
        /* UI Elements */
        --glass-bg: rgba(10, 5, 15, 0.75);
        --glass-border: rgba(212, 175, 55, 0.3);
        --glass-border-hover: rgba(212, 175, 55, 0.8);
        
        /* Typography */
        --font-main: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: #f0f0f0;
        font-family: var(--font-main);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1000px; /* For subtle 3D depth */
    }

    /* --- 1. Atmosphere & Texture --- */

    /* Deep Void Background */
    #atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background: radial-gradient(circle at 50% 60%, #1a0b2e 0%, #000000 65%);
    }

    /* Grain Texture Overlay (Gritty Feel) */
    .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Heavy Vignette */
    .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        pointer-events: none;
        z-index: 5;
    }

    /* Main Container */
    .game-container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* Push header top, menu bottom */
        align-items: center;
        padding: 2rem 2rem 4rem 2rem;
        position: relative;
        z-index: 10;
    }

    /* --- 2. Header & Currency --- */
    header {
        width: 100%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: 1rem;
    }

    .currency-pill {
        background: var(--glass-bg);
        border: 1px solid var(--gold-dark);
        border-radius: 2px;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.8),
            0 0 10px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        position: relative;
        transition: border-color 0.3s ease;
    }

    .currency-pill:hover {
        border-color: var(--gold-main);
    }

    /* Corner details */
    .currency-pill::before, .currency-pill::after {
        content: '';
        position: absolute;
        width: 6px;
        height: 6px;
        border: 1px solid var(--gold-main);
    }
    .currency-pill::before { top: 2px; left: 2px; border-right: none; border-bottom: none; }
    .currency-pill::after { bottom: 2px; right: 2px; border-left: none; border-top: none; }

    .currency-icon {
        width: 20px;
        height: 20px;
        fill: url(#gold-grad); /* Use SVG def */
        filter: drop-shadow(0 0 3px var(--gold-glow));
    }

    .currency-amount {
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 1rem;
        color: #fff;
        letter-spacing: 1px;
        text-shadow: 0 0 5px rgba(0,0,0,1);
    }

    /* --- 3. Typography (Hero) --- */
    .hero-section {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-main);
        font-size: clamp(3rem, 6vw, 5.5rem);
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-align: center;
        /* Metallic Gold Gradient */
        background: var(--gold-metal);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Deep shadow to separate from background */
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        margin-bottom: 0.25rem;
        z-index: 2;
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-main);
        font-size: clamp(0.8rem, 1.5vw, 1.1rem);
        font-weight: 400;
        letter-spacing: 0.5em;
        color: #e0e0e0;
        text-transform: uppercase;
        opacity: 0.9;
        text-shadow: 0 0 15px rgba(176, 38, 255, 0.3);
        z-index: 2;
    }

    /* --- 4. The Spirit Rift (Hero Visual) --- */
    .rift-container {
        position: relative;
        width: 380px;
        height: 380px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 2rem;
        /* Slight tilt for perspective */
        transform: rotateX(15deg);
        transform-style: preserve-3d;
    }

    /* The Void Center */
    .rift-void {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #000000 0%, rgba(20, 0, 40, 0.8) 60%, transparent 100%);
        box-shadow: 
            inset 0 0 40px rgba(0,0,0,1),
            0 0 20px var(--mystic-glow);
        z-index: 1;
        animation: pulse-void 4s ease-in-out infinite;
    }

    /* Rotating Dashed Rings */
    .rift-ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        border-color: var(--gold-dark);
        pointer-events: none;
        opacity: 0.7;
        box-shadow: 0 0 8px rgba(138, 110, 15, 0.2);
    }

    .ring-outer {
        width: 360px;
        height: 360px;
        border-width: 1px;
        border-top-color: var(--gold-main);
        border-bottom-color: var(--gold-main);
        animation: spin 30s linear infinite;
    }

    .ring-middle {
        width: 280px;
        height: 280px;
        border-width: 2px;
        border-color: rgba(176, 38, 255, 0.3);
        border-top-color: var(--mystic-purple);
        border-bottom-color: var(--mystic-purple);
        animation: spin-rev 20s linear infinite;
    }

    .ring-inner {
        width: 200px;
        height: 200px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        animation: spin 12s linear infinite;
    }

    /* Core Spark */
    .rift-core {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, var(--mystic-purple) 50%, transparent 80%);
        box-shadow: 0 0 30px var(--mystic-purple);
        z-index: 2;
        animation: pulse-core 3s ease-in-out infinite;
    }

    /* --- 5. Menu Cards (Arcane Artifacts) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 900px;
        /* Floating effect */
        margin-bottom: 2rem; 
    }

    .menu-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 4px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        height: 150px;
        /* Physical Weight */
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.8),
            0 5px 15px rgba(0,0,0,0.5);
    }

    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(30, 15, 45, 0.85);
        border-color: var(--gold-main);
        box-shadow: 
            inset 0 0 10px rgba(212, 175, 55, 0.1),
            0 15px 30px rgba(0,0,0,0.6);
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 6px var(--gold-glow));
        transform: scale(1.1);
    }

    .card-title {
        font-family: var(--font-main);
        font-size: 1.2rem;
        color: #fff;
        margin-top: 0.8rem;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-subtitle {
        font-family: var(--font-ui);
        font-size: 0.7rem;
        color: var(--gold-main);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        opacity: 0.8;
        margin-top: 0.2rem;
    }

    /* Primary Action: Summon */
    .menu-card.primary {
        background: rgba(30, 15, 45, 0.9);
        border: 1px solid var(--gold-main);
        /* Pulsing Glow */
        animation: pulse-summon 4s infinite ease-in-out;
    }

    .menu-card.primary::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at center, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
        pointer-events: none;
    }

    .menu-card.primary .card-title {
        color: var(--gold-bright);
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Icons */
    .card-icon {
        width: 32px;
        height: 32px;
        fill: #a3a3a3;
        transition: all 0.3s ease;
        stroke: none;
    }

    /* Animations */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    
    @keyframes pulse-core {
        0%, 100% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 40px var(--mystic-purple); }
    }
    
    @keyframes pulse-void {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    @keyframes pulse-summon {
        0%, 100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.1), inset 0 0 20px rgba(0,0,0,0.8); }
        50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(0,0,0,0.8); }
    }

    /* Responsive */
    @media (max-width: 850px) {
        .game-container { padding: 1rem; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .rift-container { transform: scale(0.8) rotateX(10deg); margin: 1rem 0; }
        .game-title { letter-spacing: 0.05em; }
    }
</style>
</head>
<body>

    <!-- Backgrounds -->
    <div id="atmosphere">
        <canvas id="bg-canvas"></canvas>
    </div>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <div class="game-container">
        
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <!-- Inline SVG Gradient Definition -->
                <svg width="0" height="0">
                    <defs>
                        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#fff4cc;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8a6e0f;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>

                <svg class="currency-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">24,500</span>
            </div>
        </header>

        <!-- Hero / Rift Area -->
        <main class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <div class="game-subtitle">Spirit Summoning</div>
            
            <div class="rift-container" id="rift-vortex">
                <div class="rift-void"></div>
                <div class="rift-core"></div>
                
                <!-- Rings -->
                <div class="rift-ring ring-outer"></div>
                <div class="rift-ring ring-middle"></div>
                <div class="rift-ring ring-inner"></div>
            </div>
        </main>

        <!-- Navigation / Menu -->
        <nav class="menu-grid">
            
            <!-- Primary: Summon -->
            <div class="menu-card primary">
                <!-- Star Rune Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">The Ritual</div>
            </div>

            <!-- Roster -->
            <div class="menu-card">
                <!-- Group/Scroll Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Team</div>
            </div>

            <!-- Battle -->
            <div class="menu-card">
                <!-- Sword Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind -->
            <div class="menu-card">
                <!-- Pickaxe/Tool Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M22.7 13.03L22.7 13.03c.39.39.39 1.02 0 1.41l-2.34 2.34c-.39.39-1.02.39-1.41 0l-1.83-1.83-3.75 3.75 1.83 1.83c.39.39.39 1.02 0 1.41l-2.34 2.34c-.39.39-1.02.39-1.41 0L3.29 9.34c-.39-.39-.39-1.02 0-1.41l2.34-2.34c.39-.39 1.02-.39 1.41 0l1.83 1.83 3.75-3.75-1.83-1.83c-.39-.39-.39-1.02 0-1.41l2.34-2.34c.39-.39 1.02-.39 1.41 0l9.16 9.94z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>

        </nav>
    </div>

    <script>
        /**
         * Visual Effects Script
         * Handles the background particles.
         */
        
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.3;
                this.life = Math.random() * 200;
                this.fadeDir = Math.random() > 0.5 ? 0.002 : -0.002;
                
                // Mystical colors (Purple/Gold/White)
                const colors = ['157, 78, 221', '212, 175, 55', '255, 255, 255'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                this.alpha += this.fadeDir;
                if (this.alpha >= 0.5 || this.alpha <= 0.05) {
                    this.fadeDir *= -1;
                }

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                if (this.life <= 0) this.init();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Interactive Rift Effect
        const rift = document.getElementById('rift-vortex');
        
        rift.addEventListener('mousemove', (e) => {
            const rect = rift.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const core = rift.querySelector('.rift-core');
            const voidEl = rift.querySelector('.rift-void');
            
            // Move core slightly opposite to mouse for depth
            core.style.transform = `translate(${-x * 0.08}px, ${-y * 0.08}px)`;
            
            // Subtle parallax on the void glow
            voidEl.style.transform = `translate(${x * 0.04}px, ${y * 0.04}px)`;
        });

        rift.addEventListener('mouseleave', () => {
             const core = rift.querySelector('.rift-core');
             const voidEl = rift.querySelector('.rift-void');
             core.style.transform = `translate(0px, 0px)`;
             voidEl.style.transform = `translate(0px, 0px)`;
        });

    </script>
</body>
</html>
