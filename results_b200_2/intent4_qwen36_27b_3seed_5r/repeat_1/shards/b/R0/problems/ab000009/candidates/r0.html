<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Interface</title>
    <style>
        :root {
            /* Palette: Slate & Gold */
            --bg-dark: #1e2024;
            --bg-panel: #25282e;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent: #d4af37; /* Muted Gold */
            --accent-glow: rgba(212, 175, 55, 0.3);
            
            /* Board Colors: Classic Wood/Stone vibe */
            --board-light: #ebecd0;
            --board-dark: #739552; /* Greenish-grey, very classic */
            --board-highlight: rgba(255, 255, 0, 0.4);
            --board-move: rgba(0, 0, 0, 0.15);
            
            /* Dimensions */
            --board-size: min(85vh, 85vw);
            --square-size: calc(var(--board-size) / 8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 40px;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* The Board */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 4px;
            user-select: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            border: 5px solid #333;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-size: 12px;
            font-weight: 700;
            pointer-events: none;
        }
        .coord.rank { top: 2px; left: 2px; }
        .coord.file { bottom: 2px; right: 2px; }

        /* Highlights */
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--board-highlight);
            z-index: 1;
        }
        .move-marker {
            width: 25%;
            height: 25%;
            background-color: var(--board-move);
            border-radius: 50%;
            z-index: 2;
        }

        /* SVG Pieces */
        .piece {
            width: 85%;
            height: 85%;
            z-index: 3;
            cursor: pointer;
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.4));
            transition: transform 0.1s;
        }
        .piece:active { transform: scale(0.95); }

        /* Side Panel */
        .panel {
            width: 350px;
            background-color: var(--bg-panel);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            height: var(--board-size);
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .turn-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .turn-dot.black {
            background-color: #333;
            border: 1px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .status-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Move History */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
        }

        /* Custom Scrollbar */
        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-track { background: transparent; }
        .history-container::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 8px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.95rem;
        }
        .move-row:nth-child(even) { background-color: rgba(255,255,255,0.02); }
        .move-num { width: 30px; color: var(--text-muted); }
        .move-ply { width: 70px; color: var(--text-main); font-weight: bold; }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #1a1a1a;
        }
        .btn-primary:hover { background-color: #eac54e; }

        .btn-secondary {
            background-color: rgba(255,255,255,0.05);
            color: var(--text-main);
        }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.1); }

        /* Responsive */
        @media (max-width: 1000px) {
            .container { flex-direction: column; }
            .panel { width: 100%; height: auto; max-height: 300px; }
            .board-wrapper { width: 90vw; height: 90vw; }
            :root { --board-size: 90vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Chess Board Area -->
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Side Panel -->
        <div class="panel">
            <div class="header">
                <div class="turn-indicator">
                    <div class="turn-dot" id="turnDot"></div>
                    <span id="turnText">White's Turn</span>
                </div>
                <div class="status-text">Analysis Mode</div>
            </div>

            <div class="history-container" id="historyList">
                <!-- Moves go here -->
            </div>

            <div class="controls">
                <button class="btn-secondary" onclick="resetGame()">New Game</button>
                <button class="btn-primary" onclick="analyzePosition()">Analyze</button>
            </div>
        </div>
    </div>

    <script>

                n: `<svg viewBox="0 0 45 45" class="piece" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#fff"/><path d="M24 18c.38 2.32-2.58 2.9-3 3-3.65.9-5.83 6.24-8 8-7.13 5.13-11.5 6.37-11.5 11h20c4-4.5 5-11.5 5-15.5 0-3.5-3.5-5-4.5-5.5z" fill="#fff"/><path d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0z" fill="#000" stroke="#000"/><path d="M15 15.5c-1.61 2.59-2.75 5.94-2.75 5.94" fill="none" stroke-linejoin="miter"/></svg>`,
                p: `<svg viewBox="0 0 45 45" class="piece" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-2.78-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" stroke-linecap="butt"/></svg>`
            },
            b: {
                k: `<svg viewBox="0 0 45 45" class="piece" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0,0)"><path d="M22.5 11.63V6M20 8h5" stroke-linejoin="miter"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#000" stroke-linecap="butt"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-1-9-1-5 2-8 2-5-2-8-2-4-1-9-1c-3 6 6 10.5 6 10.5v7" fill="#000"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0" stroke="#fff"/></g></svg>`,
                q: `<svg viewBox="0 0 45 45" class="piece" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 1 1 4 0z" stroke-linejoin="miter"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14.5V25l-7-11-2 12" fill="#000" stroke-linecap="butt"/><path d="M9 26c0 2 1.5 2 2.5 4 1 2.5 1 1 .5 4.5-5 2-10 2-15 2s-10 0-15-2c-.5-3.5-.5-2 .5-4.5 1-2 2.5-2 2.5-4" fill="#000"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0" fill="none" stroke="#fff"/></svg>`,
                r: `<svg viewBox="0 0 45 45" class="piece" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g fill="#000" stroke="#fff" stroke-linecap="butt"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5" stroke-linecap="round"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5c1 2 2 2 2 3.5S34 36 34 36H11s1-3 1-3 1-1.5 2-3.5V17h17z" stroke-linecap="round"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none" stroke-linejoin="round"/></g></svg>`,
                b: `<svg viewBox="0 0 45 45" class="piece" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g fill="#000" stroke="#fff" stroke-linecap="butt"><path d="M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32c-3.39.97-9.11 1.45-13.5 1.45-4.39 0-10.11-.48-13.5-1.45v4z" stroke-linecap="round"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2zM25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/></g><path d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5" stroke="#fff" stroke-linejoin="round"/></svg>`,
                n: `<svg viewBox="0 0 45 45" class="piece" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#000"/><path d="M24 18c.38 2.32-2.58 2.9-3 3-3.65.9-5.83 6.24-8 8-7.13 5.13-11.5 6.37-11.5 11h20c4-4.5 5-11.5 5-15.5 0-3.5-3.5-5-4.5-5.5z" fill="#000"/><path d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0z" fill="#fff" stroke="#fff"/><path d="M15 15.5c-1.61 2.59-2.75 5.94-2.75 5.94" fill="none" stroke="#fff" stroke-linejoin="miter"/></svg>`,
                p: `<svg viewBox="0 0 45 45" class="piece" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-2.78-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" stroke-linecap="butt"/></svg>`
            }
        };

        // --- Game Logic & State ---
        
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], // 0 (Black)
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // 1
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'], // 6
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']  // 7 (White)
        ];

        // State
        let boardState = JSON.parse(JSON.stringify(initialBoard));
        let turn = 'w'; // 'w' or 'b'
        let selectedSquare = null; // {r, c}
        let moveHistory = [];

        // DOM Elements
        const boardEl = document.getElementById('board');
        const historyEl = document.getElementById('historyList');
        const turnTextEl = document.getElementById('turnText');
        const turnDotEl = document.getElementById('turnDot');

        // --- Rendering ---

        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.r = r;
                    square.dataset.c = c;
                    square.onclick = () => handleSquareClick(r, c);

                    // Coordinates
                    if (c === 0) {
                        const rank = document.createElement('span');
                        rank.className = 'coord rank';
                        rank.innerText = 8 - r;
                        square.appendChild(rank);
                    }
                    if (r === 7) {
                        const file = document.createElement('span');
                        file.className = 'coord file';
                        file.innerText = String.fromCharCode(97 + c);
                        square.appendChild(file);
                    }

                    // Pieces
                    const pieceCode = boardState[r][c];
                    if (pieceCode) {
                        const color = pieceCode === pieceCode.toUpperCase() ? 'w' : 'b';
                        const type = pieceCode.toLowerCase();
                        square.innerHTML += pieces[color][type];
                    }

                    // Highlights
                    if (selectedSquare) {
                        if (selectedSquare.r === r && selectedSquare.c === c) {
                            square.innerHTML += `<div class="highlight"></div>`;
                        }
                    }

                    boardEl.appendChild(square);
                }
            }
        }

        function updateUI() {
            turnTextEl.innerText = turn === 'w' ? "White's Turn" : "Black's Turn";
            turnDotEl.className = `turn-dot ${turn === 'b' ? 'black' : 'white'}`;
        }

        function addMoveToHistory(fromR, fromC, toR, toC, piece) {
            const files = ['a','b','c','d','e','f','g','h'];
            const from = `${files[fromC]}${8-fromR}`;
            const to = `${files[toC]}${8-toR}`;
            const notation = `${piece.toUpperCase()} ${from} → ${to}`;
            
            const row = document.createElement('div');
            row.className = 'move-row';
            
            // Logic to append to existing row if black, or new row if white
            let moveNum = Math.ceil((moveHistory.length + 1) / 2);
            
            // Simplified history for visual demo (just appending list items)
            const numSpan = document.createElement('span');
            numSpan.className = 'move-num';
            numSpan.innerText = `${moveNum}.`;
            
            const plySpan = document.createElement('span');
            plySpan.className = 'move-ply';
            plySpan.innerText = notation;
            
            // Note: In a real app, we'd group White/Black in one row. 
            // Here we just list them for simplicity of the "Visual Design" task.
            row.appendChild(numSpan);
            row.appendChild(plySpan);
            
            historyEl.appendChild(row);
            historyEl.scrollTop = historyEl.scrollHeight;
            moveHistory.push(notation);
        }

        // --- Interaction ---

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isOwnPiece = clickedPiece && (turn === 'w' ? clickedPiece === clickedPiece.toUpperCase() : clickedPiece === clickedPiece.toLowerCase());

            // Select Piece
            if (isOwnPiece) {
                selectedSquare = { r, c };
                renderBoard();
                return;
            }

            // Move Piece
            if (selectedSquare) {
                const fromR = selectedSquare.r;
                const fromC = selectedSquare.c;
                
                // Basic move execution (No rules validation for this visual demo)
                boardState[r][c] = boardState[fromR][fromC];
                boardState[fromR][fromC] = null;
                
                // Record move
                addMoveToHistory(fromR, fromC, r, c, boardState[r][c]);
                
                // Switch Turn
                turn = turn === 'w' ? 'b' : 'w';
                selectedSquare = null;
                
                updateUI();
                renderBoard();
            }
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'w';
            selectedSquare = null;
            moveHistory = [];
            historyEl.innerHTML = '';
            updateUI();
            renderBoard();
        }

        function analyzePosition() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert("Analysis complete. Position is balanced.");
            }, 800);
        }

        // Init
        renderBoard();
        updateUI();

    </script>
</body>
</html>
