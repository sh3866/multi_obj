<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Ascension</title>
<style>
    :root {
        /* Palette - Deep Void & Neon Arcanum */
        --bg-deep: #030406;
        --bg-panel: #0a0e14;
        --bg-panel-highlight: #121922;
        --border-color: rgba(255, 255, 255, 0.06);
        --border-highlight: rgba(255, 255, 255, 0.15);
        
        --accent-primary: #00e5ff; /* Electric Cyan */
        --accent-glow: rgba(0, 229, 255, 0.4);
        --accent-secondary: #7000ff; /* Deep Violet */
        --accent-gold: #ffaa00; /* Magma Gold */
        --accent-gold-glow: rgba(255, 170, 0, 0.3);
        
        --text-main: #e6edf3;
        --text-muted: #8b949e;
        --text-dim: #484f58;

        /* Typography */
        --font-display: 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; outline: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* --- Background & Atmosphere --- */
    .bg-atmosphere {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, #111827 0%, #030406 70%, #000000 100%);
        z-index: -3;
    }

    /* Subtle Grid Overlay for Depth */
    .bg-grid {
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(var(--border-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.1;
        z-index: -2;
        pointer-events: none;
    }

    .bg-vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 120px rgba(0,0,0,0.95);
        z-index: -1;
        pointer-events: none;
    }

    /* --- Main Sidebar (Character Panel) --- */
    aside {
        width: 340px;
        background: linear-gradient(180deg, #0d1219 0%, #080b10 100%);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        z-index: 20;
        box-shadow: 4px 0 40px rgba(0,0,0,0.6);
        position: relative;
    }

    /* Brand Header */
    .brand-header {
        height: 64px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        border-bottom: 1px solid var(--border-color);
        background: rgba(0,0,0,0.3);
    }

    .brand-logo {
        width: 28px;
        height: 28px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 6px var(--accent-glow));
        margin-right: 14px;
    }

    .brand-text {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #fff;
    }

    /* Character Profile */
    .char-profile {
        padding: 24px 24px 10px 24px;
        text-align: center;
        position: relative;
        background: radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.06), transparent 70%);
    }

    .avatar-ring {
        width: 96px;
        height: 96px;
        margin: 0 auto 12px;
        border-radius: 50%;
        padding: 2px;
        background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.15);
        position: relative;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #05070a;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #080b10;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.6rem;
        margin: 0;
        color: #fff;
        letter-spacing: 0.5px;
    }

    .char-class {
        font-size: 0.65rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 2.5px;
        margin-top: 4px;
        font-weight: 700;
        opacity: 0.9;
    }

    /* Panel Content Scroll */
    .panel-content {
        padding: 20px 24px;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Level Block */
    .level-block {
        position: relative;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 8px;
    }

    .level-label {
        font-size: 0.6rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
    }

    .level-val {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    .xp-bar-container {
        height: 4px;
        background: #161b22;
        border-radius: 2px;
        border: 1px solid rgba(255,255,255,0.05);
        overflow: hidden;
        position: relative;
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 8px var(--accent-secondary);
        position: relative;
    }
    
    /* XP Shimmer Animation */
    .xp-fill::after {
        content: '';
        position: absolute;
        top:0; left:0; right:0; bottom:0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 2.5s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    .xp-text {
        font-size: 0.65rem;
        color: var(--text-dim);
        text-align: right;
        margin-top: 6px;
        font-family: monospace;
    }

    /* Skill Points - The Primary Resource */
    .sp-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0, 229, 255, 0.04);
        border: 1px solid rgba(0, 229, 255, 0.15);
        border-radius: 4px;
        padding: 16px 20px;
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
        transition: border-color 0.3s;
    }
    
    .sp-box:hover {
        border-color: rgba(0, 229, 255, 0.4);
    }

    .sp-box::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-primary);
        border-radius: 3px 0 0 3px;
    }

    .sp-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .sp-val {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: #fff;
        text-shadow: 0 0 12px var(--accent-glow);
        line-height: 1;
    }

    /* Attributes - Compact Icon List */
    .section-title {
        font-family: var(--font-display);
        font-size: 0.9rem;
        color: var(--text-muted);
        margin: 10px 0 12px 0;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
    }

    .stat-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .stat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 4px;
        background: rgba(255,255,255,0.01);
        border: 1px solid transparent;
        transition: all 0.2s;
    }

    .stat-row:hover {
        background: rgba(255,255,255,0.03);
        border-color: var(--border-color);
    }

    .stat-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .stat-icon {
        width: 18px;
        height: 18px;
        fill: var(--text-dim);
        transition: fill 0.2s;
    }

    .stat-row:hover .stat-icon {
        fill: var(--accent-primary);
    }

    .stat-name {
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 0.5px;
    }

    .stat-val {
        font-family: var(--font-display);
        font-size: 1rem;
        color: #fff;
        font-weight: 500;
    }

    /* --- Main Canvas Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 50%, rgba(20, 30, 50, 0.3) 0%, transparent 60%);
    }
    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; /* Let clicks pass through to canvas if needed, nodes re-enable */
    }

    /* --- Nodes Design --- */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    .node-shape {
        width: 100%;
        height: 100%;
        position: relative;
    }

    .node-shape svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        transition: all 0.3s ease;
    }

    /* Inner Content */
    .node-icon {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 24px; height: 24px;
        fill: #fff;
        opacity: 0;
        transition: opacity 0.3s;
    }
    
    /* Lock Icon (Default for locked) */
    .node-lock {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 20px; height: 20px;
        fill: #333;
        opacity: 0.5;
    }

    /* Plus Icon (Available) */
    .node-plus {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 24px; height: 24px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        opacity: 0;
    }

    /* Label */
    .node-label {
        position: absolute;
        bottom: -30px;
        width: 160px;
        text-align: center;
        font-size: 0.7rem;
        color: var(--text-muted);
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.2s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        font-weight: 600;
        white-space: nowrap;
    }

    .node:hover .node-label { opacity: 1; transform: translateY(0); color: #fff; }

    /* --- States --- */
    
    /* 1. Locked */
    .node.locked .node-shape svg {
        fill: #0d1117;
        stroke: #1f2937;
        stroke-width: 1;
    }

    /* 2. Available (The "Next" Node) */
    .node.available .node-shape svg {
        fill: #0f1520;
        stroke: var(--accent-primary);
        stroke-width: 2;
        filter: drop-shadow(0 0 10px var(--accent-glow));
        animation: pulse-available 2s infinite ease-in-out;
    }
    
    .node.available .node-plus { opacity: 0.8; stroke: var(--accent-primary); }
    .node.available:hover .node-plus { opacity: 1; stroke: #fff; }

    @keyframes pulse-available {
        0% { filter: drop-shadow(0 0 5px var(--accent-glow)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 15px var(--accent-glow)); transform: scale(1.02); }
        100% { filter: drop-shadow(0 0 5px var(--accent-glow)); transform: scale(1); }
    }

    /* 3. Unlocked (Active) */
    .node.unlocked .node-shape svg {
        fill: #0b1016;
        stroke: var(--accent-primary);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.3));
    }
    .node.unlocked .node-icon { opacity: 0.8; fill: var(--accent-primary); }

    /* 4. Maxed (Gold - Distinct "Current" / Completed State) */
    .node.maxed .node-shape svg {
        fill: #1a1400;
        stroke: var(--accent-gold);
        stroke-width: 2;
        filter: drop-shadow(0 0 12px var(--accent-gold-glow));
    }
    .node.maxed .node-icon { opacity: 1; fill: var(--accent-gold); }
    .node.maxed .node-label { color: var(--accent-gold); opacity: 1; transform: translateY(0); }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        background: rgba(10, 12, 16, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 24px;
        width: 320px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        transform: translate(20px, -50%);
        border-left: 3px solid var(--accent-primary);
    }

    .tooltip.visible { opacity: 1; transform: translate(20px, -50%) scale(1); }
    
    .tooltip h3 {
        margin: 0 0 6px;
        font-family: var(--font-display);
        color: #fff;
        font-size: 1.4rem;
        letter-spacing: 0.5px;
    }
    
    .tooltip .type {
        font-size: 0.6rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
        display: block;
        font-weight: 700;
        background: rgba(0, 229, 255, 0.1);
        padding: 3px 8px;
        border-radius: 2px;
        width: fit-content;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 20px;
        font-style: italic;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 16px;
    }

    .tooltip .stats-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.2);
        padding: 10px;
        border-radius: 4px;
    }

    .tooltip .stat-bonus {
        font-size: 0.95rem;
        color: var(--accent-gold);
        font-weight: 600;
        text-shadow: 0 0 10px rgba(255, 170, 0, 0.15);
    }
    
    .tooltip .cost-badge {
        font-size: 0.7rem;
        background: rgba(255,255,255,0.05);
        padding: 4px 12px;
        border-radius: 20px;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    /* --- Particles --- */
    .particle {
        position: absolute;
        width: 4px; height: 4px;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        animation: floatUp 0.8s ease-out forwards;
        box-shadow: 0 0 6px var(--accent-primary);
        z-index: 50;
    }

    @keyframes floatUp {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

</style>
</head>

        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 40, level: 0, max: 3, cost: 2, type: 'Movement', desc: 'Teleport short distance.', stat: '+5% Move Speed' },
        { id: 'mid_3', name: 'Void Ward', x: 65, y: 40, level: 0, max: 3, cost: 2, type: 'Defense', desc: 'Damage shield.', stat: '+15% Block' },
        { id: 'int_3', name: 'Time Warp', x: 95, y: 40, level: 0, max: 3, cost: 2, type: 'Control', desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed' },

        // Tier 4
        { id: 'str_4', name: 'Iron Skin', x: 10, y: 25, level: 0, max: 3, cost: 1, type: 'Defense', desc: 'Reduce physical dmg.', stat: '+20% Armor' },
        { id: 'str_5', name: 'Cleave', x: 20, y: 25, level: 0, max: 3, cost: 2, type: 'Attack', desc: 'Hit all enemies.', stat: '+10% AOE' },
        { id: 'mid_4', name: 'Entropy', x: 50, y: 25, level: 0, max: 1, cost: 3, type: 'Unique', desc: 'Decay enemy stats.', stat: '-5% All Stats' },
        { id: 'int_4', name: 'Telekinesis', x: 80, y: 25, level: 0, max: 3, cost: 2, type: 'Utility', desc: 'Move objects.', stat: 'Range +5%' },
        { id: 'int_5', name: 'Fireball', x: 90, y: 25, level: 0, max: 3, cost: 1, type: 'Spell', desc: 'Hurl fire.', stat: '+15% Fire DMG' },

        // Apex Tier
        { id: 'apex_1', name: 'Singularity', x: 30, y: 10, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Collapse space.', stat: 'ALL STATS +10%' },
        { id: 'apex_2', name: 'Ascension', x: 70, y: 10, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Transcend mortality.', stat: 'Immunity 5s' }
    ];

    const connections = [
        // T1
        ['root', 'str_1'], ['root', 'int_1'],
        // T2
        ['str_1', 'str_2'], ['str_1', 'mid_1'], 
        ['int_1', 'mid_1'], ['int_1', 'int_2'],
        // T3
        ['str_2', 'str_3'], ['str_2', 'mid_2'],
        ['mid_1', 'mid_2'], ['mid_1', 'mid_3'],
        ['int_2', 'mid_3'], ['int_2', 'int_3'],
        // T4
        ['str_3', 'str_4'], ['str_3', 'str_5'],
        ['mid_2', 'str_5'], ['mid_2', 'mid_4'],
        ['mid_3', 'mid_4'], ['mid_3', 'int_4'],
        ['int_3', 'int_4'], ['int_3', 'int_5'],
        // Apex
        ['str_4', 'apex_1'], ['str_5', 'apex_1'],
        ['mid_4', 'apex_1'], ['mid_4', 'apex_2'],
        ['int_4', 'apex_2'], ['int_5', 'apex_2']
    ];

    // --- State ---
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---
    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            
            // State Logic
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = skill.level === skill.max ? 'maxed' : 'unlocked';
            } else {
                // Demo availability
                if((skill.id === 'int_1' || skill.id === 'mid_2' || skill.id === 'mid_3') && availablePoints > 0) {
                    stateClass = 'available';
                }
            }

            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Shape Logic
            let shapePath = '';
            let iconPath = '';
            
            if(skill.id.includes('str')) {
                shapePath = `<path d="M24 4 L40 12 L40 32 L24 44 L8 32 L8 12 Z" />`; // Hexagon
                iconPath = `<path d="M15 10h10v2h-10z M15 14h10v2h-10z M15 18h10v2h-10z" />`; // Sword abstract
            } else if(skill.id.includes('int')) {
                shapePath = `<path d="M24 4 L40 16 L24 44 L8 16 Z" />`; // Diamond
                iconPath = `<circle cx="24" cy="24" r="6" />`; // Orb
            } else if(skill.id.includes('mid')) {
                shapePath = `<circle cx="24" cy="24" r="18" />`; // Circle
                iconPath = `<path d="M20 20 L28 28 M28 20 L20 28" />`; // Cross
            } else if(skill.id === 'root') {
                shapePath = `<circle cx="24" cy="24" r="18" stroke-dasharray="4,2" />`;
                iconPath = `<path d="M24 14 L24 34 M14 24 L34 24" />`;
            } else if(skill.id.includes('apex')) {
                shapePath = `<path d="M24 4 L30 18 L44 20 L32 30 L36 44 L24 36 L12 44 L16 30 L4 20 L18 18 Z" />`; // Star
                iconPath = `<circle cx="24" cy="24" r="4" />`;
            } else {
                shapePath = `<rect x="8" y="8" width="32" height="32" rx="4" />`;
                iconPath = `<circle cx="24" cy="24" r="6" />`;
            }

            // Lock Icon
            const lockPath = `<path d="M12 17a2 2 0 0 0 2-2 2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 10 0v2h1m-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3Z" />`;
            // Plus Icon
            const plusPath = `<path d="M12 5v14M5 12h14" stroke-linecap="round" />`;

            el.innerHTML = `
                <div class="node-shape">
                    <svg viewBox="0 0 48 48">${shapePath}</svg>
                    <svg class="node-icon" viewBox="0 0 48 48">${iconPath}</svg>
                    <svg class="node-lock" viewBox="0 0 24 24">${lockPath}</svg>
                    <svg class="node-plus" viewBox="0 0 24 24">${plusPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---
    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Bezier
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2y = end.y - (end.y - start.y) / 2;
            ctx.bezierCurveTo(start.x, cp1y, end.x, cp2y, end.x, end.y);

            if (isUnlocked) {
                // Active: Thick, Gradient/Glow
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.6)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0, 229, 255, 0.4)';
                ctx.stroke();
                
                // Core line (white)
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else if (isPath) {
                // Available Path: Dim Cyan, Thicker than locked
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.15)';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else {
                // Locked: Dashed Dark
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.setLineDash([4, 4]);
                ctx.shadowBlur = 0;
                ctx.stroke();
            }
            ctx.setLineDash([]);
        });

        ctx.restore();
    }

    // --- Logic ---
    function spawnParticles(x, y) {
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            const tx = (Math.random() - 0.5) * 150;
            const ty = (Math.random() - 0.5) * 150;
            p.style.setProperty('--tx', `${tx}px`);
            p.style.setProperty('--ty', `${ty}px`);
            container.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }
    }

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        if(skill.cost > availablePoints) return;

        availablePoints -= skill.cost;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked', 'available');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        const rect = node.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        spawnParticles(rect.left - containerRect.left + 32, rect.top - containerRect.top + 32);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-type').textContent = skill.type;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat-val').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = `Cost: ${skill.cost} SP`;

        const titleEl = document.getElementById('tt-title');
        if(skill.level === skill.max) titleEl.style.color = 'var(--accent-gold)';
        else titleEl.style.color = 'var(--accent-primary)';

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction ---
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
