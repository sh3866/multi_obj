<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Skill Ascension</title>
<style>
    :root {
        --bg-dark: #05070a;
        --bg-panel: rgba(12, 16, 24, 0.85);
        --border-dim: #2a3245;
        --accent-primary: #00f0ff; /* Cyan */
        --accent-secondary: #7000ff; /* Violet */
        --accent-gold: #ffd700;
        --accent-gold-dim: #997a00;
        --text-main: #e2e8f0;
        --text-muted: #8892b0;
        
        /* Fantasy Font Stack: Serif for headers, System Sans for data */
        --font-display: 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Atmosphere --- */
    /* Deep Radial Gradient */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, #1a2035 0%, #05070a 60%, #000000 100%);
        z-index: -3;
    }

    /* Grid */
    .bg-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -2;
        pointer-events: none;
    }
    
    /* Noise Texture (SVG Data URI) */
    .bg-noise {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.05;
        z-index: -1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
        z-index: -1;
        pointer-events: none;
    }

    /* --- Header --- */
    header {
        height: 60px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: rgba(5, 7, 10, 0.9);
        backdrop-filter: blur(10px);
        z-index: 10;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
        font-family: var(--font-display);
        font-size: 1.5rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: bold;
    }
    
    .brand svg {
        width: 28px;
        height: 28px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 8px var(--accent-primary));
    }

    .nav-links span {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-left: 30px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
    }
    .nav-links span:hover { 
        color: #fff; 
        text-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 60px);
        position: relative;
    }

    /* --- Sidebar (Stats) --- */
    aside {
        width: 340px;
        background: var(--bg-panel);
        border-right: 1px solid rgba(255,255,255,0.08);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 25px;
        position: relative;
        backdrop-filter: blur(10px);
        z-index: 5;
    }

    .character-card {
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 25px;
        position: relative;
    }

    .avatar-frame {
        width: 110px;
        height: 110px;
        margin: 0 auto 15px;
        border-radius: 50%;
        border: 2px solid var(--border-dim);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05070a;
        overflow: hidden;
        box-shadow: 0 0 0 4px rgba(0,0,0,0.5);
    }

    .avatar-frame::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--accent-primary);
        border-bottom-color: var(--accent-secondary);
        animation: spin 8s linear infinite;
    }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.6rem;
        margin: 0;
        color: #fff;
        letter-spacing: 1px;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 5px;
        font-weight: 600;
    }

    /* Grouped Level & XP */
    .level-xp-group {
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--border-dim);
        border-radius: 8px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .level-label {
        font-family: var(--font-display);
        font-size: 0.9rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .level-val {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: #fff;
        line-height: 1;
    }

    .xp-bar-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .xp-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: var(--font-ui);
    }

    .xp-track {
        height: 6px;
        background: #05070a;
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid #1e232e;
    }
    
    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-secondary);
        position: relative;
    }
    
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 2s infinite;
    }

    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .stat-item {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        padding: 5px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .stat-item span:first-child { color: var(--text-muted); }
    .stat-item span:last-child { color: #fff; font-weight: 600; }

    /* Points Badge */
    .points-badge {
        margin-top: auto;
        background: radial-gradient(circle at top right, rgba(255, 215, 0, 0.1), transparent);
        border: 1px solid var(--accent-gold-dim);
        border-radius: 8px;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: default;
        transition: transform 0.2s;
    }

    .points-badge:hover {
        border-color: var(--accent-gold);
        background: radial-gradient(circle at top right, rgba(255, 215, 0, 0.15), transparent);
    }

    .points-info {
        display: flex;
        flex-direction: column;
    }

    .points-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-gold);
        letter-spacing: 1px;
        font-weight: 600;
    }

    .points-count {
        font-family: var(--font-display);
        font-size: 2rem;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .points-action {
        font-size: 0.75rem;
        color: var(--accent-gold);
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        border: 1px solid var(--accent-gold-dim);
        padding: 6px 12px;
        border-radius: 4px;
        transition: all 0.3s;
    }

    .points-badge:hover .points-action {
        background: var(--accent-gold);
        color: #000;
        box-shadow: 0 0 15px var(--accent-gold);
    }

    /* --- Center (Tree) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    /* --- The Node (Redesigned) --- */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    /* The Shape */
    .node-shape {
        width: 48px;
        height: 48px;
        position: relative;
        transition: all 0.4s ease;
    }

    .node-shape svg {
        width: 100%;
        height: 100%;
        transition: all 0.4s ease;
    }

    /* Label */
    .node-label {
        position: absolute;
        bottom: -22px;
        width: 120px;
        text-align: center;
        font-size: 0.7rem;
        color: var(--text-muted);
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.3s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
    }

    .node:hover .node-label {
        opacity: 1;
        transform: translateY(0);
        color: #fff;
    }

    /* --- Node States --- */

    /* 1. Locked */
    .node.locked .node-shape svg {
        fill: #1e232e;
        stroke: #2a3245;
        stroke-width: 2;
        filter: grayscale(1);
        opacity: 0.6;
    }

    /* 2. Available (Pulsing) */
    .node.available .node-shape svg {
        fill: #1e232e;
        stroke: var(--accent-primary);
        stroke-width: 2;
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .node.available .node-shape::after {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 1px solid var(--accent-primary);
        opacity: 0;
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
    }

    /* 3. Active/Unlocked */
    .node.unlocked .node-shape svg {
        fill: var(--accent-primary);
        stroke: #fff;
        stroke-width: 1;
        filter: drop-shadow(0 0 8px var(--accent-primary));
    }

    /* 4. Maxed (Gold) */
    .node.maxed .node-shape svg {
        fill: var(--accent-gold);
        stroke: #fff;
        stroke-width: 1;
        filter: drop-shadow(0 0 10px var(--accent-gold));
    }

    .node:hover {
        transform: translate(-50%, -55%) scale(1.1);
        z-index: 10;
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(10, 12, 16, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 15px;
        width: 240px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 240, 255, 0.05);
        backdrop-filter: blur(5px);
    }

    /* Tooltip Decorative Corner */
    .tooltip::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px;
        width: 10px; height: 10px;
        border-top: 2px solid var(--accent-primary);
        border-left: 2px solid var(--accent-primary);
    }

    .tooltip.visible { opacity: 1; }
    
    .tooltip h3 {
        margin: 0 0 8px;
        font-family: var(--font-display);
        color: var(--accent-primary);
        font-size: 1.1rem;
        letter-spacing: 0.5px;
    }
    
    .tooltip .desc {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 12px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-gold);
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
    }

    /* Floating Particles */
    .particle {
        position: absolute;
        background: var(--accent-primary);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        animation: floatUp 1s ease-out forwards;
    }

    @keyframes floatUp {
        0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>
<div class="vignette"></div>

<header>
    <div class="brand">
        <!-- Rune Icon -->
        <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5L18.5 12 12 18.5 5.5 12 12 5.5z"/></svg>
        Arcanum
    </div>
    <div class="nav-links">
        <span>Inventory</span>
        <span>Quests</span>
        <span>Settings</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <div class="character-card">
            <div class="avatar-frame">
                <!-- Abstract Hero Silhouette -->
                <svg viewBox="0 0 100 100" style="width:100%; height:100%; fill:#2a3245;">
                    <path d="M50 20 C40 20 35 30 35 40 C35 50 40 55 45 55 L45 80 L55 80 L55 55 C60 55 65 50 65 40 C65 30 60 20 50 20" />
                    <circle cx="50" cy="45" r="12" fill="#1e232e" />
                    <path d="M40 80 L60 80 L55 95 L45 95 Z" fill="#1e232e" />
                </svg>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <!-- Grouped Level & XP -->
        <div class="level-xp-group">
            <div class="level-header">
                <span class="level-label">Level</span>
                <span class="level-val">42</span>
            </div>
            <div class="xp-bar-container">
                <div class="xp-text">Experience: 7,500 / 10,000</div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><span>Strength</span><span>124</span></div>
            <div class="stat-item"><span>Dexterity</span><span>89</span></div>
            <div class="stat-item"><span>Intellect</span><span>210</span></div>
            <div class="stat-item"><span>Vitality</span><span>156</span></div>
        </div>

        <!-- Prominent Points Badge -->
        <div class="points-badge">
            <div class="points-info">
                <div class="points-label">Available Points</div>
                <div class="points-count" id="sp-display">3</div>
            </div>
            <div class="points-action">Spend</div>
        </div>
    </aside>

    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-container" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat-val">+10% Damage</span>
                <span id="tt-stat-lvl" style="color:var(--text-muted); font-size:0.7em;">LVL 1/3</span>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * Data Structure
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%' }
    ];

    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            
            // Determine State
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = skill.level === skill.max ? 'maxed' : 'unlocked';
            } else {
                // Check if available (simplified: if parent is unlocked and points > 0)
                // For this demo, we'll just mark some as available visually
                if((skill.id === 'int_1' || skill.id === 'mid_2') && availablePoints > 0) {
                    stateClass = 'available';
                }
            }

            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Runes/Shapes
            let shapeSVG = '';
            if(skill.id.includes('str')) {
                // Shield/Shard
                shapeSVG = `<path d="M24 4 L40 12 L40 32 L24 44 L8 32 L8 12 Z" />`;
            } else if(skill.id.includes('int')) {
                // Diamond/Gem
                shapeSVG = `<path d="M24 4 L40 16 L24 44 L8 16 Z" />`;
            } else if(skill.id === 'apex') {
                // Star
                shapeSVG = `<path d="M24 4 L30 18 L44 20 L32 30 L36 44 L24 36 L12 44 L16 30 L4 20 L18 18 Z" />`;
            } else {
                // Circle/Rune
                shapeSVG = `<circle cx="24" cy="24" r="16" />`;
            }

            el.innerHTML = `
                <div class="node-shape">
                    <svg viewBox="0 0 48 48">${shapeSVG}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Bezier Curve
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            // Curvature logic
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isUnlocked) {
                // Active Path: Bright Cyan
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';
            } else if (isPath) {
                // Potential Path: Faint Cyan/White
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.shadowBlur = 0;
            } else {
                // Locked: Dashed Dark
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(42, 50, 69, 0.5)';
                ctx.setLineDash([5, 5]);
                ctx.shadowBlur = 0;
            }
            
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash
        });

        ctx.restore();
    }

    // --- Logic ---

    function spawnParticles(x, y) {
        for(let i=0; i<10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            
            // Random direction
            const tx = (Math.random() - 0.5) * 100;
            const ty = (Math.random() - 0.5) * 100;
            p.style.setProperty('--tx', `${tx}px`);
            p.style.setProperty('--ty', `${ty}px`);
            
            container.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }
    }

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        // Check affordability
        if(skill.cost > availablePoints) return; // Simplified check

        availablePoints -= skill.cost;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked', 'available');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Particles
        const rect = node.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        spawnParticles(rect.left - containerRect.left + 30, rect.top - containerRect.top + 30);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top - 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat-val').textContent = skill.stat;
        document.getElementById('tt-stat-lvl').textContent = `LVL ${skill.level}/${skill.max}`;

        // Dynamic color for title based on state
        const titleEl = document.getElementById('tt-title');
        if(skill.level === skill.max) titleEl.style.color = 'var(--accent-gold)';
        else titleEl.style.color = 'var(--accent-primary)';

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
