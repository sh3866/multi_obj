<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Ascension</title>
<style>
    :root {
        --bg-deep: #030406;
        --bg-panel: rgba(12, 16, 24, 0.92);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(0, 240, 255, 0.3);
        
        --accent-primary: #00f0ff; /* Cyan */
        --accent-secondary: #7000ff; /* Violet */
        --accent-gold: #ffd700;
        --accent-gold-dim: #7a6200;
        
        --text-main: #e2e8f0;
        --text-muted: #8892b0;
        --text-dim: #4a5568;

        /* Typography */
        --font-display: 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Atmosphere & Background --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, #1a2035 0%, #05070a 60%, #000000 100%);
        z-index: -3;
    }

    .bg-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
        background-size: 60px 60px;
        z-index: -2;
        pointer-events: none;
    }
    
    .bg-noise {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.04;
        z-index: -1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Header --- */
    header {
        height: 70px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: rgba(3, 4, 6, 0.95);
        backdrop-filter: blur(12px);
        z-index: 20;
        box-shadow: 0 4px 30px rgba(0,0,0,0.6);
    }

    .brand {
        font-family: var(--font-display);
        font-size: 1.8rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: bold;
        font-variant: small-caps;
    }
    
    .brand svg {
        width: 32px;
        height: 32px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .nav-links {
        display: flex;
        gap: 30px;
    }

    .nav-links span {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.3s ease;
        opacity: 0.6;
        position: relative;
    }
    
    .nav-links span:hover { 
        color: var(--accent-primary); 
        opacity: 1;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 70px);
        position: relative;
    }

    /* --- Sidebar --- */
    aside {
        width: 320px;
        background: linear-gradient(180deg, var(--bg-panel) 0%, rgba(8, 10, 15, 0.95) 100%);
        border-right: 1px solid var(--border-subtle);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        position: relative;
        z-index: 10;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Character Card */
    .character-card {
        text-align: center;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-subtle);
    }

    .avatar-frame {
        width: 100px;
        height: 100px;
        margin: 0 auto 15px;
        border-radius: 50%;
        border: 1px solid var(--border-subtle);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, #1a2035, #05070a);
        box-shadow: 0 0 0 2px rgba(0,0,0,0.8);
    }

    .avatar-frame::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--accent-primary);
        border-bottom-color: var(--accent-secondary);
        animation: spin 10s linear infinite;
        opacity: 0.7;
    }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.5rem;
        margin: 0;
        color: #fff;
        letter-spacing: 0.5px;
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 5px;
        font-weight: 700;
    }

    /* Level & XP */
    .level-xp-group {
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
        padding: 15px;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 10px;
    }

    .level-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .level-val {
        font-family: var(--font-display);
        font-size: 2rem;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .xp-track {
        height: 4px;
        background: #111;
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-secondary);
        position: relative;
    }

    .xp-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 6px;
        text-align: right;
        font-family: monospace;
    }

    /* Stats Grid */
    .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        padding: 8px;
        background: rgba(255,255,255,0.02);
        border-radius: 4px;
        border: 1px solid transparent;
        transition: border-color 0.3s;
    }

    .stat-item:hover { border-color: var(--border-subtle); }
    
    .stat-name { 
        font-size: 0.65rem; 
        color: var(--text-muted); 
        text-transform: uppercase; 
        letter-spacing: 1px;
        margin-bottom: 4px;
    }
    .stat-val { 
        font-size: 1.1rem; 
        color: #fff; 
        font-weight: 700; 
        font-family: var(--font-display);
    }

    /* Skill Points - Unified Style */
    .points-badge {
        margin-top: auto;
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.05), rgba(0, 0, 0, 0));
        border: 1px solid rgba(0, 240, 255, 0.15);
        border-radius: 4px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
    }

    .points-badge::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-primary);
    }

    .points-badge:hover {
        border-color: rgba(0, 240, 255, 0.4);
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 0, 0, 0));
    }

    .points-info { display: flex; flex-direction: column; }

    .points-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .points-count {
        font-family: var(--font-display);
        font-size: 2.5rem;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    /* --- Main Canvas --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 50%, transparent 0%, #000 120%);
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 56px;
        height: 56px;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }

    .node-shape {
        width: 44px;
        height: 44px;
        position: relative;
        transition: all 0.3s ease;
    }

    .node-shape svg {
        width: 100%;
        height: 100%;
        transition: all 0.3s ease;
    }

    /* Icon inside node */
    .node-icon {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 20px; height: 20px;
        fill: #fff;
        opacity: 0;
        transition: opacity 0.3s;
    }
    
    .node.unlocked .node-icon, .node.maxed .node-icon { opacity: 1; }

    /* Node Label */
    .node-label {
        position: absolute;
        bottom: -24px;
        width: 140px;
        text-align: center;
        font-size: 0.65rem;
        color: var(--text-muted);
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.3s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        font-weight: 600;
    }

    .node:hover .node-label { opacity: 1; transform: translateY(0); color: #fff; }

    /* --- Node States --- */
    
    /* Locked */
    .node.locked .node-shape svg {
        fill: #11151e;
        stroke: #2a3245;
        stroke-width: 1;
        filter: drop-shadow(0 0 1px rgba(0,0,0,0.5));
    }

    /* Available */
    .node.available .node-shape svg {
        fill: #11151e;
        stroke: var(--accent-primary);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 6px var(--accent-primary));
        animation: pulse-node 2s infinite;
    }
    
    @keyframes pulse-node {
        0% { filter: drop-shadow(0 0 4px var(--accent-primary)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 12px var(--accent-primary)); transform: scale(1.05); }
        100% { filter: drop-shadow(0 0 4px var(--accent-primary)); transform: scale(1); }
    }

    /* Unlocked */
    .node.unlocked .node-shape svg {
        fill: var(--accent-primary);
        stroke: #fff;
        stroke-width: 1;
        filter: drop-shadow(0 0 8px var(--accent-primary));
    }
    
    .node.unlocked .node-icon { fill: #05070a; } /* Dark icon on bright bg */

    /* Maxed */
    .node.maxed .node-shape svg {
        fill: var(--accent-gold);
        stroke: #fff;
        stroke-width: 1;
        filter: drop-shadow(0 0 10px var(--accent-gold));
    }
    
    .node.maxed .node-icon { fill: #2a2000; }

    .node:hover { transform: translate(-50%, -55%) scale(1.15); z-index: 10; }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        background: rgba(10, 12, 16, 0.95);
        border: 1px solid var(--border-subtle);
        padding: 15px;
        width: 260px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(0, 240, 255, 0.03);
        backdrop-filter: blur(8px);
        transform: translate(15px, -50%);
    }

    .tooltip::before {
        content: '';
        position: absolute;
        left: -1px; top: 10px; bottom: 10px; width: 2px;
        background: var(--accent-primary);
        box-shadow: 0 0 8px var(--accent-primary);
    }
    
    .tooltip.visible { opacity: 1; }
    
    .tooltip h3 {
        margin: 0 0 5px;
        font-family: var(--font-display);
        color: #fff;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
    }
    
    .tooltip .type {
        font-size: 0.6rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        display: block;
    }
    
    .tooltip .desc {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 12px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-gold);
        border-top: 1px solid var(--border-subtle);
        padding-top: 10px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .tooltip .cost-badge {
        font-size: 0.7rem;
        background: rgba(255,255,255,0.05);
        padding: 2px 6px;
        border-radius: 3px;
        color: var(--text-main);
    }

    /* --- Particles --- */
    .particle {
        position: absolute;
        width: 3px; height: 3px;
        background: var(--accent-primary);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        animation: floatUp 1.2s ease-out forwards;
        box-shadow: 0 0 6px var(--accent-primary);
    }

    @keyframes floatUp {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5L18.5 12 12 18.5 5.5 12 12 5.5z"/></svg>
        Arcanum
    </div>
    <div class="nav-links">
        <span>Inventory</span>
        <span>Quests</span>
        <span>Journal</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <div class="character-card">
            <div class="avatar-frame">
                <svg viewBox="0 0 100 100" style="width:80%; height:80%; fill:#3a4255;">
                    <path d="M50 20 C40 20 35 30 35 40 C35 50 40 55 45 55 L45 80 L55 80 L55 55 C60 55 65 50 65 40 C65 30 60 20 50 20" />
                </svg>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="level-xp-group">
            <div class="level-header">
                <span class="level-label">Level</span>
                <span class="level-val">42</span>
            </div>
            <div class="xp-track">
                <div class="xp-fill"></div>
            </div>
            <div class="xp-text">7,500 / 10,000 XP</div>
        </div>

        <div class="stat-grid">
            <div class="stat-item">
                <span class="stat-name">Strength</span>
                <span class="stat-val">124</span>
            </div>
            <div class="stat-item">
                <span class="stat-name">Dexterity</span>
                <span class="stat-val">89</span>
            </div>
            <div class="stat-item">
                <span class="stat-name">Intellect</span>
                <span class="stat-val">210</span>
            </div>
            <div class="stat-item">
                <span class="stat-name">Vitality</span>
                <span class="stat-val">156</span>
            </div>
        </div>

        <div class="points-badge">
            <div class="points-info">
                <div class="points-label">Available Points</div>
                <div class="points-count" id="sp-display">3</div>
            </div>
            <div style="font-size: 0.7rem; color: var(--text-muted); text-align:right;">
                TOTAL<br>ALLOCATED<br><span style="color:#fff; font-weight:bold; font-size:1.2rem;">14</span>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-container" id="node-layer"></div>
        
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <span class="type" id="tt-type">Passive</span>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat-val">+10% Damage</span>
                <span class="cost-badge" id="tt-cost">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<script>
    // --- Data ---
    // Expanded to 24 nodes for density
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 90, level: 1, max: 1, cost: 0, type: 'Origin', desc: 'The source of your power.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 75, level: 1, max: 3, cost: 1, type: 'Physical', desc: 'Increases melee damage.', stat: '+5% Strength' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 75, level: 0, max: 3, cost: 1, type: 'Arcane', desc: 'Reduces mana regen time.', stat: '-10% Cooldown' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 60, level: 0, max: 3, cost: 2, type: 'Weaponry', desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 60, level: 1, max: 3, cost: 1, type: 'Hybrid', desc: 'Heals on kill.', stat: '+2% Lifesteal' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 60, level: 0, max: 3, cost: 2, type: 'Defense', desc: 'Mana absorbs damage.', stat: '+10% Max HP' },

        // Tier 3 (The Expansion)
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 45, level: 0, max: 1, cost: 3, type: 'Ultimate', desc: 'Smash the ground.', stat: 'Unlock Skill' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 45, level: 0, max: 3, cost: 2, type: 'Movement', desc: 'Teleport short distance.', stat: '+5% Move Speed' },
        { id: 'mid_3', name: 'Void Ward', x: 65, y: 45, level: 0, max: 3, cost: 2, type: 'Defense', desc: 'Damage shield.', stat: '+15% Block' },
        { id: 'int_3', name: 'Time Warp', x: 95, y: 45, level: 0, max: 3, cost: 2, type: 'Control', desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed' },

        // Tier 4 (Specialization)
        { id: 'str_4', name: 'Iron Skin', x: 10, y: 30, level: 0, max: 3, cost: 1, type: 'Defense', desc: 'Reduce physical dmg.', stat: '+20% Armor' },
        { id: 'str_5', name: 'Cleave', x: 20, y: 30, level: 0, max: 3, cost: 2, type: 'Attack', desc: 'Hit all enemies.', stat: '+10% AOE' },
        { id: 'mid_4', name: 'Entropy', x: 50, y: 30, level: 0, max: 1, cost: 3, type: 'Unique', desc: 'Decay enemy stats.', stat: '-5% All Stats' },
        { id: 'int_4', name: 'Telekinesis', x: 80, y: 30, level: 0, max: 3, cost: 2, type: 'Utility', desc: 'Move objects.', stat: 'Range +5%' },
        { id: 'int_5', name: 'Fireball', x: 90, y: 30, level: 0, max: 3, cost: 1, type: 'Spell', desc: 'Hurl fire.', stat: '+15% Fire DMG' },

        // Apex Tier
        { id: 'apex_1', name: 'Singularity', x: 30, y: 15, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Collapse space.', stat: 'ALL STATS +10%' },
        { id: 'apex_2', name: 'Ascension', x: 70, y: 15, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Transcend mortality.', stat: 'Immunity 5s' }
    ];

    const connections = [
        // T1
        ['root', 'str_1'], ['root', 'int_1'],
        // T2
        ['str_1', 'str_2'], ['str_1', 'mid_1'], 
        ['int_1', 'mid_1'], ['int_1', 'int_2'],
        // T3
        ['str_2', 'str_3'], ['str_2', 'mid_2'],
        ['mid_1', 'mid_2'], ['mid_1', 'mid_3'],
        ['int_2', 'mid_3'], ['int_2', 'int_3'],
        // T4
        ['str_3', 'str_4'], ['str_3', 'str_5'],
        ['mid_2', 'str_5'], ['mid_2', 'mid_4'],
        ['mid_3', 'mid_4'], ['mid_3', 'int_4'],
        ['int_3', 'int_4'], ['int_3', 'int_5'],
        // Apex
        ['str_4', 'apex_1'], ['str_5', 'apex_1'],
        ['mid_4', 'apex_1'], ['mid_4', 'apex_2'],
        ['int_4', 'apex_2'], ['int_5', 'apex_2']
    ];

    // --- State ---
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---
    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            
            // State Logic
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = skill.level === skill.max ? 'maxed' : 'unlocked';
            } else {
                // Demo availability
                if((skill.id === 'int_1' || skill.id === 'mid_2' || skill.id === 'mid_3') && availablePoints > 0) {
                    stateClass = 'available';
                }
            }

            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Shape Logic
            let shapePath = '';
            let iconPath = '';
            
            if(skill.id.includes('str')) {
                shapePath = `<path d="M24 4 L40 12 L40 32 L24 44 L8 32 L8 12 Z" />`; // Hexagon
                iconPath = `<path d="M15 10h10v2h-10z M15 14h10v2h-10z M15 18h10v2h-10z" />`; // Sword abstract
            } else if(skill.id.includes('int')) {
                shapePath = `<path d="M24 4 L40 16 L24 44 L8 16 Z" />`; // Diamond
                iconPath = `<circle cx="24" cy="24" r="6" />`; // Orb
            } else if(skill.id.includes('mid')) {
                shapePath = `<circle cx="24" cy="24" r="18" />`; // Circle
                iconPath = `<path d="M20 20 L28 28 M28 20 L20 28" />`; // Cross
            } else if(skill.id === 'root') {
                shapePath = `<circle cx="24" cy="24" r="18" stroke-dasharray="4,2" />`;
                iconPath = `<path d="M24 14 L24 34 M14 24 L34 24" />`;
            } else if(skill.id.includes('apex')) {
                shapePath = `<path d="M24 4 L30 18 L44 20 L32 30 L36 44 L24 36 L12 44 L16 30 L4 20 L18 18 Z" />`; // Star
                iconPath = `<circle cx="24" cy="24" r="4" />`;
            } else {
                shapePath = `<rect x="8" y="8" width="32" height="32" rx="4" />`;
                iconPath = `<circle cx="24" cy="24" r="6" />`;
            }

            el.innerHTML = `
                <div class="node-shape">
                    <svg viewBox="0 0 48 48">${shapePath}</svg>
                    <svg class="node-icon" viewBox="0 0 48 48">${iconPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---
    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Bezier
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2y = end.y - (end.y - start.y) / 2;
            ctx.bezierCurveTo(start.x, cp1y, end.x, cp2y, end.x, end.y);

            if (isUnlocked) {
                // Active: Bright Glow
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.stroke();
                
                // Core line (white)
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else if (isPath) {
                // Available Path: Dim Cyan
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else {
                // Locked: Dashed Dark
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(42, 50, 69, 0.3)';
                ctx.setLineDash([4, 4]);
                ctx.shadowBlur = 0;
                ctx.stroke();
            }
            ctx.setLineDash([]);
        });

        ctx.restore();
    }

    // --- Logic ---
    function spawnParticles(x, y) {
        for(let i=0; i<15; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            const tx = (Math.random() - 0.5) * 150;
            const ty = (Math.random() - 0.5) * 150;
            p.style.setProperty('--tx', `${tx}px`);
            p.style.setProperty('--ty', `${ty}px`);
            container.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }
    }

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        if(skill.cost > availablePoints) return;

        availablePoints -= skill.cost;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked', 'available');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        const rect = node.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        spawnParticles(rect.left - containerRect.left + 28, rect.top - containerRect.top + 28);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-type').textContent = skill.type;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat-val').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = `Cost: ${skill.cost} SP`;

        const titleEl = document.getElementById('tt-title');
        if(skill.level === skill.max) titleEl.style.color = 'var(--accent-gold)';
        else titleEl.style.color = 'var(--accent-primary)';

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction ---
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
