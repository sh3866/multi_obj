<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Ascension</title>
<style>
    :root {
        /* Palette - Darker, more contrast */
        --bg-deep: #020305;
        --bg-panel: #0b0f16;
        --bg-panel-highlight: #131a24;
        --border-color: rgba(255, 255, 255, 0.08);
        
        --accent-primary: #00f0ff; /* Cyan */
        --accent-primary-dim: rgba(0, 240, 255, 0.15);
        --accent-secondary: #7000ff; /* Violet */
        --accent-gold: #ffcc00;
        --accent-gold-dim: rgba(255, 204, 0, 0.2);
        --accent-red: #ff4444;

        --text-main: #e2e8f0;
        --text-muted: #8892b0;
        --text-dim: #4a5568;

        /* Typography */
        --font-display: 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; outline: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* --- Atmosphere & Texture --- */
    .bg-atmosphere {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, #111827 0%, #020305 80%, #000000 100%);
        z-index: -3;
    }

    /* Vignette */
    .bg-vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        z-index: -2;
        pointer-events: none;
    }
    
    /* Noise Texture */
    .bg-noise {
        position: absolute;
        inset: 0;
        opacity: 0.04;
        z-index: -1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Sidebar Navigation (Vertical Tabs) --- */
    .sidebar-nav {
        width: 60px;
        background: rgba(5, 7, 10, 0.95);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 20px;
        z-index: 30;
        backdrop-filter: blur(5px);
    }

    .nav-btn {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        cursor: pointer;
        color: var(--text-dim);
        transition: all 0.2s;
        position: relative;
    }

    .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }
    
    .nav-btn:hover { 
        background: rgba(255,255,255,0.05); 
        color: var(--text-main); 
    }

    .nav-btn.active {
        background: rgba(0, 240, 255, 0.1);
        color: var(--accent-primary);
        box-shadow: inset 2px 0 0 var(--accent-primary);
    }

    /* --- Main Sidebar (Character Panel) --- */
    aside {
        width: 320px;
        background: linear-gradient(180deg, #0b0f16 0%, #05070a 100%);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        z-index: 20;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Brand Header */
    .brand-header {
        height: 70px;
        display: flex;
        align-items: center;
        padding: 0 25px;
        border-bottom: 1px solid var(--border-color);
        background: rgba(0,0,0,0.2);
    }

    .brand-logo {
        width: 32px;
        height: 32px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        margin-right: 12px;
    }

    .brand-text {
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #fff;
    }

    /* Character Profile */
    .char-profile {
        padding: 30px 25px;
        text-align: center;
        background: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 60%);
        border-bottom: 1px solid var(--border-color);
    }

    .avatar-ring {
        width: 100px;
        height: 100px;
        margin: 0 auto 15px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        position: relative;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #05070a;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid #05070a;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.8rem;
        margin: 0;
        color: #fff;
        letter-spacing: 0.5px;
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-top: 5px;
        font-weight: 700;
        opacity: 0.9;
    }

    /* Stats & Currency */
    .panel-content {
        padding: 25px;
        flex: 1;
        overflow-y: auto;
    }

    /* Level & XP Integration */
    .level-block {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 25px;
        position: relative;
        overflow: hidden;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
    }

    .level-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .level-val {
        font-family: var(--font-display);
        font-size: 1.5rem;
        color: #fff;
    }

    .xp-bar-container {
        height: 6px;
        background: #000;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.1);
        overflow: hidden;
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-secondary);
        position: relative;
    }
    
    .xp-fill::after {
        content: '';
        position: absolute;
        top:0; left:0; right:0; bottom:0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    .xp-text {
        font-size: 0.6rem;
        color: var(--text-dim);
        text-align: right;
        margin-top: 4px;
    }

    /* Skill Points Box */
    .sp-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0, 240, 255, 0.03);
        border: 1px solid var(--accent-primary-dim);
        border-radius: 6px;
        padding: 12px 15px;
        margin-bottom: 25px;
        position: relative;
    }
    
    .sp-box::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--accent-primary);
        box-shadow: 0 0 8px var(--accent-primary);
        border-radius: 3px 0 0 3px;
    }

    .sp-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .sp-val {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: #fff;
        text-shadow: 0 0 10px var(--accent-primary);
    }

    /* Attributes Grid */
    .section-title {
        font-family: var(--font-display);
        font-size: 1rem;
        color: #fff;
        margin: 0 0 15px 0;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
    }

    .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .stat-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.2s;
        position: relative;
    }
    
    .stat-card:hover {
        border-color: rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.04);
    }

    .stat-card svg {
        width: 16px; height: 16px;
        fill: var(--text-dim);
        margin-bottom: 5px;
    }

    .stat-card:hover svg { fill: var(--text-muted); }

    .stat-name {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .stat-val {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: #fff;
    }

    /* --- Main Canvas Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 50%, rgba(20, 30, 50, 0.2) 0%, transparent 70%);
    }
    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
    }

    /* --- Nodes Design --- */
    .node {
        position: absolute;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    .node-shape {
        width: 100%;
        height: 100%;
        position: relative;
        transition: all 0.3s ease;
    }

    .node-shape svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.6));
        transition: all 0.3s ease;
    }

    /* Inner content */
    .node-icon {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 28px; height: 28px;
        fill: #fff;
        opacity: 0;
        transition: opacity 0.3s;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    
    /* Checkmark for active */
    .node-check {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 32px; height: 32px;
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
    }

    /* Label */
    .node-label {
        position: absolute;
        bottom: -32px;
        width: 140px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.3s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        font-weight: 600;
        white-space: nowrap;
    }

    .node:hover .node-label { opacity: 1; transform: translateY(0); color: #fff; }

    /* --- States --- */
    
    /* Locked */
    .node.locked .node-shape svg {
        fill: #0d1117;
        stroke: #1f2937;
        stroke-width: 2;
    }

    /* Available (The "Next" Node) */
    .node.available .node-shape svg {
        fill: #111827;
        stroke: var(--accent-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 12px var(--accent-primary));
        animation: pulse-available 2s infinite ease-in-out;
    }
    
    .node.available .node-icon { opacity: 0.7; fill: var(--accent-primary); }

    @keyframes pulse-available {
        0% { filter: drop-shadow(0 0 8px var(--accent-primary)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 20px var(--accent-primary)); transform: scale(1.05); }
        100% { filter: drop-shadow(0 0 8px var(--accent-primary)); transform: scale(1); }
    }

    /* Unlocked (Active) */
    .node.unlocked .node-shape svg {
        fill: #0b1016;
        stroke: var(--accent-primary);
        stroke-width: 2;
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
    }
    .node.unlocked .node-icon { opacity: 1; fill: #fff; }
    .node.unlocked .node-check { opacity: 0.3; stroke: var(--accent-primary); }

    /* Maxed (Gold) */
    .node.maxed .node-shape svg {
        fill: #1f1a08;
        stroke: var(--accent-gold);
        stroke-width: 3;
        filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.4));
    }
    .node.maxed .node-icon { opacity: 1; fill: var(--accent-gold); }
    .node.maxed .node-check { opacity: 1; stroke: var(--accent-gold); }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        background: rgba(10, 12, 16, 0.98);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 20px;
        width: 300px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 15px 60px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.05);
        backdrop-filter: blur(12px);
        transform: translate(25px, -50%);
        border-left: 3px solid var(--accent-primary);
    }

    .tooltip.visible { opacity: 1; transform: translate(25px, -50%) scale(1); }
    
    .tooltip h3 {
        margin: 0 0 4px;
        font-family: var(--font-display);
        color: #fff;
        font-size: 1.3rem;
        letter-spacing: 0.5px;
    }
    
    .tooltip .type {
        font-size: 0.65rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 15px;
        display: block;
        font-weight: 700;
        background: rgba(0, 240, 255, 0.1);
        padding: 2px 6px;
        border-radius: 2px;
        width: fit-content;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 15px;
        font-style: italic;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 12px;
    }

    .tooltip .stats-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .tooltip .stat-bonus {
        font-size: 0.9rem;
        color: var(--accent-gold);
        font-weight: 600;
        text-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
    }
    
    .tooltip .cost-badge {
        font-size: 0.75rem;
        background: rgba(255,255,255,0.05);
        padding: 4px 10px;
        border-radius: 20px;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
        font-weight: 600;
    }

    /* --- Particles --- */
    .particle {
        position: absolute;
        width: 4px; height: 4px;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        animation: floatUp 1s ease-out forwards;
        box-shadow: 0 0 8px var(--accent-primary);
        z-index: 50;
    }

    @keyframes floatUp {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

</style>
</head>

            </div>
            <div class="stat-card">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                <span class="stat-name">Willpower</span>
                <span class="stat-val">180</span>
            </div>
            <div class="stat-card">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                <span class="stat-name">Perception</span>
                <span class="stat-val">95</span>
            </div>
        </div>
    </div>
</aside>

<main id="tree-container">
    <canvas id="tree-canvas"></canvas>
    <div class="node-container" id="node-layer"></div>
    
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <span class="type" id="tt-type">Passive</span>
        <div class="desc" id="tt-desc">Description goes here.</div>
        <div class="stats-row">
            <span class="stat-bonus" id="tt-stat-val">+10% Damage</span>
            <span class="cost-badge" id="tt-cost">Cost: 1</span>
        </div>
    </div>
</main>

<script>
    // --- Data ---
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 90, level: 1, max: 1, cost: 0, type: 'Origin', desc: 'The source of your power.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 75, level: 1, max: 3, cost: 1, type: 'Physical', desc: 'Increases melee damage.', stat: '+5% Strength' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 75, level: 0, max: 3, cost: 1, type: 'Arcane', desc: 'Reduces mana regen time.', stat: '-10% Cooldown' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 60, level: 0, max: 3, cost: 2, type: 'Weaponry', desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 60, level: 1, max: 3, cost: 1, type: 'Hybrid', desc: 'Heals on kill.', stat: '+2% Lifesteal' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 60, level: 0, max: 3, cost: 2, type: 'Defense', desc: 'Mana absorbs damage.', stat: '+10% Max HP' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 45, level: 0, max: 1, cost: 3, type: 'Ultimate', desc: 'Smash the ground.', stat: 'Unlock Skill' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 45, level: 0, max: 3, cost: 2, type: 'Movement', desc: 'Teleport short distance.', stat: '+5% Move Speed' },
        { id: 'mid_3', name: 'Void Ward', x: 65, y: 45, level: 0, max: 3, cost: 2, type: 'Defense', desc: 'Damage shield.', stat: '+15% Block' },
        { id: 'int_3', name: 'Time Warp', x: 95, y: 45, level: 0, max: 3, cost: 2, type: 'Control', desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed' },

        // Tier 4
        { id: 'str_4', name: 'Iron Skin', x: 10, y: 30, level: 0, max: 3, cost: 1, type: 'Defense', desc: 'Reduce physical dmg.', stat: '+20% Armor' },
        { id: 'str_5', name: 'Cleave', x: 20, y: 30, level: 0, max: 3, cost: 2, type: 'Attack', desc: 'Hit all enemies.', stat: '+10% AOE' },
        { id: 'mid_4', name: 'Entropy', x: 50, y: 30, level: 0, max: 1, cost: 3, type: 'Unique', desc: 'Decay enemy stats.', stat: '-5% All Stats' },
        { id: 'int_4', name: 'Telekinesis', x: 80, y: 30, level: 0, max: 3, cost: 2, type: 'Utility', desc: 'Move objects.', stat: 'Range +5%' },
        { id: 'int_5', name: 'Fireball', x: 90, y: 30, level: 0, max: 3, cost: 1, type: 'Spell', desc: 'Hurl fire.', stat: '+15% Fire DMG' },

        // Apex Tier
        { id: 'apex_1', name: 'Singularity', x: 30, y: 15, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Collapse space.', stat: 'ALL STATS +10%' },
        { id: 'apex_2', name: 'Ascension', x: 70, y: 15, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Transcend mortality.', stat: 'Immunity 5s' }
    ];

    const connections = [
        // T1
        ['root', 'str_1'], ['root', 'int_1'],
        // T2
        ['str_1', 'str_2'], ['str_1', 'mid_1'], 
        ['int_1', 'mid_1'], ['int_1', 'int_2'],
        // T3
        ['str_2', 'str_3'], ['str_2', 'mid_2'],
        ['mid_1', 'mid_2'], ['mid_1', 'mid_3'],
        ['int_2', 'mid_3'], ['int_2', 'int_3'],
        // T4
        ['str_3', 'str_4'], ['str_3', 'str_5'],
        ['mid_2', 'str_5'], ['mid_2', 'mid_4'],
        ['mid_3', 'mid_4'], ['mid_3', 'int_4'],
        ['int_3', 'int_4'], ['int_3', 'int_5'],
        // Apex
        ['str_4', 'apex_1'], ['str_5', 'apex_1'],
        ['mid_4', 'apex_1'], ['mid_4', 'apex_2'],
        ['int_4', 'apex_2'], ['int_5', 'apex_2']
    ];

    // --- State ---
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---
    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            
            // State Logic
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = skill.level === skill.max ? 'maxed' : 'unlocked';
            } else {
                // Demo availability
                if((skill.id === 'int_1' || skill.id === 'mid_2' || skill.id === 'mid_3') && availablePoints > 0) {
                    stateClass = 'available';
                }
            }

            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Shape Logic
            let shapePath = '';
            let iconPath = '';
            
            if(skill.id.includes('str')) {
                shapePath = `<path d="M24 4 L40 12 L40 32 L24 44 L8 32 L8 12 Z" />`; // Hexagon
                iconPath = `<path d="M15 10h10v2h-10z M15 14h10v2h-10z M15 18h10v2h-10z" />`; // Sword abstract
            } else if(skill.id.includes('int')) {
                shapePath = `<path d="M24 4 L40 16 L24 44 L8 16 Z" />`; // Diamond
                iconPath = `<circle cx="24" cy="24" r="6" />`; // Orb
            } else if(skill.id.includes('mid')) {
                shapePath = `<circle cx="24" cy="24" r="18" />`; // Circle
                iconPath = `<path d="M20 20 L28 28 M28 20 L20 28" />`; // Cross
            } else if(skill.id === 'root') {
                shapePath = `<circle cx="24" cy="24" r="18" stroke-dasharray="4,2" />`;
                iconPath = `<path d="M24 14 L24 34 M14 24 L34 24" />`;
            } else if(skill.id.includes('apex')) {
                shapePath = `<path d="M24 4 L30 18 L44 20 L32 30 L36 44 L24 36 L12 44 L16 30 L4 20 L18 18 Z" />`; // Star
                iconPath = `<circle cx="24" cy="24" r="4" />`;
            } else {
                shapePath = `<rect x="8" y="8" width="32" height="32" rx="4" />`;
                iconPath = `<circle cx="24" cy="24" r="6" />`;
            }

            el.innerHTML = `
                <div class="node-shape">
                    <svg viewBox="0 0 48 48">${shapePath}</svg>
                    <svg class="node-icon" viewBox="0 0 48 48">${iconPath}</svg>
                    <svg class="node-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---
    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Bezier
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2y = end.y - (end.y - start.y) / 2;
            ctx.bezierCurveTo(start.x, cp1y, end.x, cp2y, end.x, end.y);

            if (isUnlocked) {
                // Active: Thick, Gradient/Glow
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';
                ctx.stroke();
                
                // Core line (white)
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else if (isPath) {
                // Available Path: Dim Cyan
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else {
                // Locked: Dashed Dark
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(42, 50, 69, 0.5)';
                ctx.setLineDash([4, 4]);
                ctx.shadowBlur = 0;
                ctx.stroke();
            }
            ctx.setLineDash([]);
        });

        ctx.restore();
    }

    // --- Logic ---
    function spawnParticles(x, y) {
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            const tx = (Math.random() - 0.5) * 150;
            const ty = (Math.random() - 0.5) * 150;
            p.style.setProperty('--tx', `${tx}px`);
            p.style.setProperty('--ty', `${ty}px`);
            container.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }
    }

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        if(skill.cost > availablePoints) return;

        availablePoints -= skill.cost;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked', 'available');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        const rect = node.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        spawnParticles(rect.left - containerRect.left + 36, rect.top - containerRect.top + 36);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-type').textContent = skill.type;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat-val').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = `Cost: ${skill.cost} SP`;

        const titleEl = document.getElementById('tt-title');
        if(skill.level === skill.max) titleEl.style.color = 'var(--accent-gold)';
        else titleEl.style.color = 'var(--accent-primary)';

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction ---
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
