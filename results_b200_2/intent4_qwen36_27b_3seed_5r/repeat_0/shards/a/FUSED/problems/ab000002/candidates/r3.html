<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Ascension</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #05070a;
        --bg-panel: #0b0f16;
        --bg-panel-highlight: #131a24;
        
        --accent-primary: #00f0ff; /* Cyan */
        --accent-primary-dim: rgba(0, 240, 255, 0.15);
        --accent-secondary: #7000ff; /* Violet */
        --accent-gold: #ffcc00;
        --accent-gold-dim: rgba(255, 204, 0, 0.2);
        
        --text-main: #e2e8f0;
        --text-muted: #8892b0;
        --text-dim: #4a5568;

        /* Fonts */
        --font-display: 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; outline: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Atmosphere & Texture --- */
    .bg-atmosphere {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 30%, #1a2035 0%, #05070a 60%, #000000 100%);
        z-index: -3;
    }

    /* Grid Texture */
    .bg-grid {
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -2;
        pointer-events: none;
    }
    
    /* Noise Texture */
    .bg-noise {
        position: absolute;
        inset: 0;
        opacity: 0.05;
        z-index: -1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Header --- */
    header {
        height: 60px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: rgba(5, 7, 10, 0.8);
        backdrop-filter: blur(10px);
        z-index: 50;
    }

    .brand {
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: bold;
        font-variant: small-caps;
    }
    
    .brand svg {
        width: 24px;
        height: 24px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .nav-links {
        display: flex;
        gap: 5px;
    }

    .nav-item {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 8px 16px;
        border: 1px solid transparent;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
    }
    
    .nav-item:hover { 
        color: var(--accent-primary); 
        border-color: rgba(0, 240, 255, 0.3);
        background: rgba(0, 240, 255, 0.05);
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }
    
    .nav-item.active {
        color: #fff;
        border-bottom: 2px solid var(--accent-primary);
    }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 60px);
        position: relative;
    }

    /* --- Sidebar --- */
    aside {
        width: 340px;
        background: linear-gradient(180deg, rgba(11, 15, 22, 0.95) 0%, rgba(5, 7, 10, 0.98) 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        padding: 0;
        display: flex;
        flex-direction: column;
        z-index: 20;
        box-shadow: 10px 0 40px rgba(0,0,0,0.6);
    }

    /* Character Header Section */
    .char-header {
        padding: 30px 30px 20px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: radial-gradient(circle at top, rgba(0, 240, 255, 0.05), transparent 70%);
    }

    .avatar-frame {
        width: 90px;
        height: 90px;
        margin: 0 auto 15px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #0b0f16;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    
    .avatar-inner svg {
        width: 60%;
        height: 60%;
        fill: var(--text-muted);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.6rem;
        margin: 0;
        color: #fff;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-top: 5px;
        font-weight: 700;
        opacity: 0.9;
    }

    /* Currency & Level Section (Restructured) */
    .currency-section {
        padding: 20px 30px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        background: rgba(0,0,0,0.2);
    }

    .level-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .level-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .level-val {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: #fff;
        line-height: 1;
    }

    .xp-track {
        width: 120px;
        height: 4px;
        background: #1a202c;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 5px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 8px var(--accent-secondary);
    }

    /* Skill Points Badge */
    .sp-badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--accent-primary-dim);
        padding: 5px 15px;
        border-radius: 4px;
        position: relative;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
    }
    
    .sp-badge::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 4px;
        padding: 1px;
        background: linear-gradient(180deg, rgba(0, 240, 255, 0.4), transparent);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    .sp-label {
        font-size: 0.55rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
    }

    .sp-count {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px var(--accent-primary);
    }

    /* Stats Grid */
    .stats-container {
        padding: 25px 30px;
        flex: 1;
        overflow-y: auto;
    }

    .section-label {
        font-size: 0.7rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 15px;
        display: block;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 5px;
    }

    .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .stat-item {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 4px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s;
    }

    .stat-item:hover { 
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.1);
    }
    
    .stat-name { 
        font-size: 0.7rem; 
        color: var(--text-muted); 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
    }
    .stat-val { 
        font-size: 1rem; 
        color: #fff; 
        font-weight: 600; 
        font-family: var(--font-display);
    }

    /* --- Main Canvas --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 50%, transparent 0%, #000 120%);
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.2);
        z-index: 10;
    }

    .node-shape {
        width: 100%;
        height: 100%;
        position: relative;
        transition: all 0.3s ease;
    }

    .node-shape svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    /* Inner details for nodes */
    .node-inner-border {
        position: absolute;
        inset: 15%;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        pointer-events: none;
    }
    
    .node-icon {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 24px; height: 24px;
        fill: #fff;
        opacity: 0;
        transition: opacity 0.3s;
        filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }
    
    .node.unlocked .node-icon, .node.maxed .node-icon, .node.available .node-icon { opacity: 1; }

    /* Node Label */
    .node-label {
        position: absolute;
        bottom: -28px;
        width: 160px;
        text-align: center;
        font-size: 0.7rem;
        color: var(--text-muted);
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.3s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        font-weight: 600;
    }

    .node:hover .node-label { opacity: 1; transform: translateY(0); color: #fff; }

    /* --- Node States --- */
    
    /* Locked */
    .node.locked .node-shape svg {
        fill: #11151e;
        stroke: #2a3245;
        stroke-width: 2;
    }
    .node.locked .node-inner-border { display: none; }

    /* Available (Pulsing) */
    .node.available .node-shape svg {
        fill: #1a202c;
        stroke: var(--accent-primary);
        stroke-width: 2;
        filter: drop-shadow(0 0 10px var(--accent-primary));
        animation: pulse-node 2s infinite ease-in-out;
    }
    
    @keyframes pulse-node {
        0% { filter: drop-shadow(0 0 5px var(--accent-primary)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 15px var(--accent-primary)); transform: scale(1.05); }
        100% { filter: drop-shadow(0 0 5px var(--accent-primary)); transform: scale(1); }
    }

    /* Unlocked (Active) */
    .node.unlocked .node-shape svg {
        fill: #0b1016;
        stroke: var(--accent-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 8px var(--accent-primary));
    }
    .node.unlocked .node-inner-border { border-color: var(--accent-primary); opacity: 0.5; }
    .node.unlocked .node-icon { fill: var(--accent-primary); }

    /* Maxed (Gold) */
    .node.maxed .node-shape svg {
        fill: #2a2510;
        stroke: var(--accent-gold);
        stroke-width: 3;
        filter: drop-shadow(0 0 12px var(--accent-gold));
    }
    .node.maxed .node-inner-border { border-color: var(--accent-gold); opacity: 0.8; }
    .node.maxed .node-icon { fill: var(--accent-gold); }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        background: rgba(10, 12, 16, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 18px;
        width: 280px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0, 240, 255, 0.05);
        backdrop-filter: blur(10px);
        transform: translate(20px, -50%);
        border-left: 3px solid var(--accent-primary);
    }

    .tooltip.visible { opacity: 1; transform: translate(20px, -50%) scale(1); }
    
    .tooltip h3 {
        margin: 0 0 5px;
        font-family: var(--font-display);
        color: #fff;
        font-size: 1.2rem;
        letter-spacing: 0.5px;
    }
    
    .tooltip .type {
        font-size: 0.65rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        display: block;
        font-weight: 700;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 15px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.85rem;
        color: var(--accent-gold);
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 12px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .tooltip .cost-badge {
        font-size: 0.75rem;
        background: rgba(255,255,255,0.05);
        padding: 3px 8px;
        border-radius: 3px;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* --- Particles --- */
    .particle {
        position: absolute;
        width: 4px; height: 4px;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        animation: floatUp 1s ease-out forwards;
        box-shadow: 0 0 8px var(--accent-primary);
        z-index: 50;
    }

    @keyframes floatUp {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5L18.5 12 12 18.5 5.5 12 12 5.5z"/></svg>
        Arcanum
    </div>
    <div class="nav-links">
        <div class="nav-item">Inventory</div>
        <div class="nav-item active">Skills</div>
        <div class="nav-item">Quests</div>
        <div class="nav-item">Journal</div>

</header>

<div class="dashboard">
    <aside>
        <div class="char-header">
            <div class="avatar-frame">
                <div class="avatar-inner">
                    <svg viewBox="0 0 100 100">
                        <path d="M50 20 C40 20 35 30 35 40 C35 50 40 55 45 55 L45 80 L55 80 L55 55 C60 55 65 50 65 40 C65 30 60 20 50 20" />
                    </svg>
                </div>

            <h2 class="char-name">Kaelen</h2>

        <div class="currency-section">
            <div class="level-group">
                <div style="display:flex; justify-content:space-between; align-items:baseline;">

                <div style="font-size:0.6rem; color:var(--text-dim); text-align:right; margin-top:2px;">7,500 / 10,000</div>
            </div>
            
            <div class="sp-badge">
                <span class="sp-label">Points</span>
                <span class="sp-count" id="sp-display">3</span>

        <div class="stats-container">
            <span class="section-label">Attributes</span>
            <div class="stat-grid">
                <div class="stat-item">
                    <span class="stat-name">Strength</span>
                    <span class="stat-val">124</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">Dexterity</span>
                    <span class="stat-val">89</span>

                <div class="stat-item">
                    <span class="stat-name">Intellect</span>
                    <span class="stat-val">210</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">Vitality</span>
                    <span class="stat-val">156</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">Willpower</span>
                    <span class="stat-val">180</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">Perception</span>
                    <span class="stat-val">95</span>
                </div>
            </div>
        </div>
    </aside>

    <main id="tree-container">

        <div class="node-container" id="node-layer"></div>
        
        <div class="tooltip" id="tooltip">

            <span class="type" id="tt-type">Passive</span>

                <span id="tt-stat-val">+10% Damage</span>
                <span class="cost-badge" id="tt-cost">Cost: 1</span>
            </div>

    </main>
</div>

<script>
    // --- Data ---
    // Expanded to 24 nodes for density, organized in tiers
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 90, level: 1, max: 1, cost: 0, type: 'Origin', desc: 'The source of your power.', stat: 'Base Attribute' },

        // Tier 3 (The Expansion)
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 45, level: 0, max: 1, cost: 3, type: 'Ultimate', desc: 'Smash the ground.', stat: 'Unlock Skill' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 45, level: 0, max: 3, cost: 2, type: 'Movement', desc: 'Teleport short distance.', stat: '+5% Move Speed' },
        { id: 'mid_3', name: 'Void Ward', x: 65, y: 45, level: 0, max: 3, cost: 2, type: 'Defense', desc: 'Damage shield.', stat: '+15% Block' },
        { id: 'int_3', name: 'Time Warp', x: 95, y: 45, level: 0, max: 3, cost: 2, type: 'Control', desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed' },

        // Tier 4 (Specialization)
        { id: 'str_4', name: 'Iron Skin', x: 10, y: 30, level: 0, max: 3, cost: 1, type: 'Defense', desc: 'Reduce physical dmg.', stat: '+20% Armor' },
        { id: 'str_5', name: 'Cleave', x: 20, y: 30, level: 0, max: 3, cost: 2, type: 'Attack', desc: 'Hit all enemies.', stat: '+10% AOE' },
        { id: 'mid_4', name: 'Entropy', x: 50, y: 30, level: 0, max: 1, cost: 3, type: 'Unique', desc: 'Decay enemy stats.', stat: '-5% All Stats' },
        { id: 'int_4', name: 'Telekinesis', x: 80, y: 30, level: 0, max: 3, cost: 2, type: 'Utility', desc: 'Move objects.', stat: 'Range +5%' },
        { id: 'int_5', name: 'Fireball', x: 90, y: 30, level: 0, max: 3, cost: 1, type: 'Spell', desc: 'Hurl fire.', stat: '+15% Fire DMG' },

        // Apex Tier
        { id: 'apex_1', name: 'Singularity', x: 30, y: 15, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Collapse space.', stat: 'ALL STATS +10%' },
        { id: 'apex_2', name: 'Ascension', x: 70, y: 15, level: 0, max: 1, cost: 5, type: 'Apex', desc: 'Transcend mortality.', stat: 'Immunity 5s' }
    ];

    const connections = [
        // T1
        ['root', 'str_1'], ['root', 'int_1'],
        // T2
        ['str_1', 'str_2'], ['str_1', 'mid_1'], 
        ['int_1', 'mid_1'], ['int_1', 'int_2'],
        // T3
        ['str_2', 'str_3'], ['str_2', 'mid_2'],
        ['mid_1', 'mid_2'], ['mid_1', 'mid_3'],
        ['int_2', 'mid_3'], ['int_2', 'int_3'],
        // T4
        ['str_3', 'str_4'], ['str_3', 'str_5'],
        ['mid_2', 'str_5'], ['mid_2', 'mid_4'],
        ['mid_3', 'mid_4'], ['mid_3', 'int_4'],
        ['int_3', 'int_4'], ['int_3', 'int_5'],
        // Apex
        ['str_4', 'apex_1'], ['str_5', 'apex_1'],
        ['mid_4', 'apex_1'], ['mid_4', 'apex_2'],
        ['int_4', 'apex_2'], ['int_5', 'apex_2']
    ];

    // --- State ---
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---
    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            
            // State Logic
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = skill.level === skill.max ? 'maxed' : 'unlocked';
            } else {
                // Demo availability
                if((skill.id === 'int_1' || skill.id === 'mid_2' || skill.id === 'mid_3') && availablePoints > 0) {
                    stateClass = 'available';
                }
            }

            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Shape Logic
            let shapePath = '';
            let iconPath = '';
            
            if(skill.id.includes('str')) {
                shapePath = `<path d="M24 4 L40 12 L40 32 L24 44 L8 32 L8 12 Z" />`; // Hexagon
                iconPath = `<path d="M15 10h10v2h-10z M15 14h10v2h-10z M15 18h10v2h-10z" />`; // Sword abstract
            } else if(skill.id.includes('int')) {
                shapePath = `<path d="M24 4 L40 16 L24 44 L8 16 Z" />`; // Diamond
                iconPath = `<circle cx="24" cy="24" r="6" />`; // Orb
            } else if(skill.id.includes('mid')) {
                shapePath = `<circle cx="24" cy="24" r="18" />`; // Circle
                iconPath = `<path d="M20 20 L28 28 M28 20 L20 28" />`; // Cross
            } else if(skill.id === 'root') {
                shapePath = `<circle cx="24" cy="24" r="18" stroke-dasharray="4,2" />`;
                iconPath = `<path d="M24 14 L24 34 M14 24 L34 24" />`;
            } else if(skill.id.includes('apex')) {
                shapePath = `<path d="M24 4 L30 18 L44 20 L32 30 L36 44 L24 36 L12 44 L16 30 L4 20 L18 18 Z" />`; // Star
                iconPath = `<circle cx="24" cy="24" r="4" />`;
            } else {
                shapePath = `<rect x="8" y="8" width="32" height="32" rx="4" />`;
                iconPath = `<circle cx="24" cy="24" r="6" />`;
            }

            el.innerHTML = `
                <div class="node-shape">
                    <svg viewBox="0 0 48 48">${shapePath}</svg>
                    <div class="node-inner-border"></div>
                    <svg class="node-icon" viewBox="0 0 48 48">${iconPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---
    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Bezier
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2y = end.y - (end.y - start.y) / 2;
            ctx.bezierCurveTo(start.x, cp1y, end.x, cp2y, end.x, end.y);

            if (isUnlocked) {
                // Active: Bright Glow
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';
                ctx.stroke();
                
                // Core line (white)
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else if (isPath) {
                // Available Path: Dim Cyan
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
                ctx.shadowBlur = 0;
                ctx.stroke();
            } else {
                // Locked: Dashed Dark
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(42, 50, 69, 0.4)';
                ctx.setLineDash([4, 4]);
                ctx.shadowBlur = 0;
                ctx.stroke();
            }
            ctx.setLineDash([]);
        });

        ctx.restore();
    }

    // --- Logic ---
    function spawnParticles(x, y) {
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            const tx = (Math.random() - 0.5) * 150;
            const ty = (Math.random() - 0.5) * 150;
            p.style.setProperty('--tx', `${tx}px`);
            p.style.setProperty('--ty', `${ty}px`);
            container.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }
    }

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        if(skill.cost > availablePoints) return;

        availablePoints -= skill.cost;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked', 'available');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        const rect = node.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        spawnParticles(rect.left - containerRect.left + 32, rect.top - containerRect.top + 32);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-type').textContent = skill.type;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat-val').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = `Cost: ${skill.cost} SP`;

        const titleEl = document.getElementById('tt-title');
        if(skill.level === skill.max) titleEl.style.color = 'var(--accent-gold)';
        else titleEl.style.color = 'var(--accent-primary)';

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction ---
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
