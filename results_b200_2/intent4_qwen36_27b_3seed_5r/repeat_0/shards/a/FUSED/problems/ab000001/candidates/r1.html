<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-paper: #FDF6E3;
            --bg-paper-dark: #EFEBE9;
            
            --ink-dark: #3E2723; /* Deep Brown */
            --ink-light: #5D4037; /* Medium Brown */
            
            --wood-frame: #8D6E63;
            --wood-frame-shadow: #5D4037;
            --wood-inner: #D7CCC8;
            
            --tile-cream: #FFF8E1;
            --tile-shadow: #D7CCC8;
            
            --path-color: #827717; /* Olive/Brown path for contrast */
            --path-dark: #5D4037;
            
            --cub-brown: #795548;
            --cub-snout: #D7CCC8;
            --cub-dark: #3E2723;
            
            --star-gold: #FFD54F;
            --star-glow: #FFECB3;

            --btn-wood: #A1887F;
            --btn-wood-shadow: #795548;
            --btn-paper: #FFF8E1;
            --btn-paper-shadow: #D7CCC8;

            --font-main: "Georgia", "Times New Roman", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle paper texture using noise-like gradients */
            background-image: 
                radial-gradient(var(--bg-paper-dark) 15%, transparent 16%),
                radial-gradient(var(--bg-paper-dark) 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: var(--font-main);
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 25px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 700;
            color: var(--ink-dark);
            /* Hand-drawn feel text shadow */
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            letter-spacing: -0.5px;
        }

        h1 span {
            display: inline-block;
            transform: rotate(-2deg);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            /* Soft container, no heavy outer border */
            padding: 15px;
            background: var(--wood-frame);
            border-radius: 20px;
            /* Inner shadow to create depth */
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.2),
                inset -2px -2px 5px rgba(0,0,0,0.2),
                0 15px 35px rgba(62, 39, 35, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .board-inner {
            background: var(--wood-inner);
            padding: 10px;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            width: 80vmin;
            height: 80vmin;
            max-width: 450px;
            max-height: 450px;
            background: var(--wood-inner); /* Shows between tiles */
            border-radius: 4px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-cream);
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            /* Raised effect */
            box-shadow: 
                0 4px 0 var(--tile-shadow),
                0 6px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 var(--tile-shadow),
                0 0 0 rgba(0,0,0,0.1);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Game Elements (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 10px; /* Matches inner padding */
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        /* The Cub (CSS Bear) */
        .cub-token {
            width: 70%;
            height: 70%;
            background: var(--cub-brown);
            border-radius: 45%;
            position: relative;
            box-shadow: 0 4px 0 var(--cub-dark);
            animation: bounce 2s infinite ease-in-out;
        }

        /* Ears */
        .cub-token::before, .cub-token::after {
            content: '';
            position: absolute;
            top: -15%;
            width: 30%;
            height: 30%;
            background: var(--cub-brown);
            border-radius: 50%;
            z-index: -1;
            box-shadow: 0 2px 0 var(--cub-dark);
        }
        .cub-token::before { left: 0; }
        .cub-token::after { right: 0; }

        /* Face details */
        .cub-face {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 40%;
        }

        .cub-eyes {
            position: absolute;
            top: 10%;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
        .cub-eye {
            width: 18%;
            height: 18%;
            background: var(--cub-dark);
            border-radius: 50%;
        }
        
        .cub-snout {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            height: 45%;
            background: var(--cub-snout);
            border-radius: 40%;
        }
        .cub-nose {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 35%;
            height: 25%;
            background: var(--cub-dark);
            border-radius: 40%;
        }

        /* The Star */
        .star-container {
            width: 70%;
            height: 70%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .star-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed var(--star-gold);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }

        .star-icon {
            width: 80%;
            height: 80%;
            fill: var(--star-gold);
            filter: drop-shadow(0 0 5px var(--star-glow));
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 35px;
            display: flex;
            gap: 25px;
            z-index: 10;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.15s ease;
            position: relative;
            top: 0;
        }

        /* Wooden Block Button */
        .btn-run {
            background-color: var(--btn-wood);
            color: #fff;
            box-shadow: 0 6px 0 var(--btn-wood-shadow), 0 8px 10px rgba(0,0,0,0.15);
        }
        .btn-run:hover {
            background-color: #8D6E63;
        }
        .btn-run:active {
            top: 6px;
            box-shadow: 0 0 0 var(--btn-wood-shadow), 0 0 0 rgba(0,0,0,0.15);
        }

        /* Stamped Paper Button */
        .btn-reset {
            background-color: var(--btn-paper);
            color: var(--ink-light);
            border: 2px solid var(--ink-dark);
            box-shadow: 0 4px 0 var(--ink-dark), 0 6px 10px rgba(0,0,0,0.1);
        }
        .btn-reset:hover {
            background-color: #fff;
            transform: rotate(-1deg);
        }
        .btn-reset:active {
            top: 4px;
            box-shadow: 0 0 0 var(--ink-dark);
        }

        /* --- Animations --- */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--star-glow)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 10px var(--star-glow)); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .grid { width: 90vmin; height: 90vmin; }
            .controls { gap: 15px; }
            button { padding: 12px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1><span>Cub n</span> <span>Pup</span></h1>
        <div class="subtitle">Guide the Cub Home</div>
    </header>

    <main class="game-container">
        <div class="board-inner">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: 0=Empty, 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        // Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = []; 

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');

            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                
                // Face Details
                const face = document.createElement('div');
                face.className = 'cub-face';
                
                const eyes = document.createElement('div');
                eyes.className = 'cub-eyes';
                eyes.innerHTML = '<div class="cub-eye"></div><div class="cub-eye"></div>';
                
                const snout = document.createElement('div');
                snout.className = 'cub-snout';
                snout.innerHTML = '<div class="cub-nose"></div>';

                face.appendChild(eyes);
                face.appendChild(snout);
                cub.appendChild(face);
                
                cell.appendChild(cub);
            } else if (type === 'star') {
                const container = document.createElement('div');
                container.className = 'star-container';
                
                const ring = document.createElement('div');
                ring.className = 'star-ring';
                
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-icon");
                star.innerHTML = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
                
                container.appendChild(ring);
                container.appendChild(star);
                cell.appendChild(container);
            }
        }

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 32; // Thicker paths
            const length = 90; 

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = thickness;
            
            // 3D-ish path effect
            ctx.shadowColor = 'rgba(255,255,255,0.6)';
            ctx.shadowBlur = 2;
            ctx.shadowOffsetX = -2;
            ctx.shadowOffsetY = -2;
            ctx.strokeStyle = '#827717'; // Base color
            ctx.stroke();

            const drawSegment = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length);
                if (dir === 1) ctx.lineTo(cx + length, cy);
                if (dir === 2) ctx.lineTo(cx, cy + length);
                if (dir === 3) ctx.lineTo(cx - length, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }

            // Center Hub
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2, 0, Math.PI * 2);
            ctx.fillStyle = '#827717';
            ctx.fill();
        }

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Running...";
            btn.style.backgroundColor = "#8D6E63"; // Darker wood
            
            const tiles = document.querySelectorAll('.tile');
            
            // Simulate path finding
            // Just a visual demo path
            const pathIndices = [0, 1, 6, 11, 16]; 
            
            let delay = 0;
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.style.backgroundColor = '#E8F5E9'; // Success green
                    t.style.boxShadow = '0 4px 0 #A5D6A7, 0 6px 6px rgba(0,0,0,0.1)';
                }, delay);
                delay += 250;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.backgroundColor = "#66BB6A"; 
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; 
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                        t.style.boxShadow = '';
                    });
                }, 1500);
            }, delay + 500);
        }

        initGame();
    </script>
</body>
</html>
