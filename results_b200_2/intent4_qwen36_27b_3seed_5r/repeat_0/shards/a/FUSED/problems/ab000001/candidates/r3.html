<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Refined Storybook */
            --bg-wall: #F9F6F0;
            
            --wood-dark: #5D4037;
            --wood-mid: #795548;
            --wood-light: #8D6E63;
            
            --tile-base: #FDFBF7;
            --tile-border: #EAE0D5;
            
            --path-color: #A1887F;
            --path-dark: #8D6E63;
            --path-light: #D7CCC8;
            
            --ink-primary: #3E2723;
            --ink-secondary: #5D4037;
            
            --cub-brown: #6D4C41;
            --cub-belly: #D7CCC8;
            --cub-scarf: #D84315; /* Deep Terracotta */
            
            --star-gold: #FFB300;
            --star-glow: #FFECB3;

            --btn-primary-bg: #8D6E63; /* Warm Terracotta/Brown */
            --btn-primary-shadow: #5D4037;
            --btn-secondary-border: #A1887F;
            
            --font-header: "Georgia", "Times New Roman", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-wall);
            /* Paper Texture */
            background-image: 
                radial-gradient(var(--tile-border) 1px, transparent 1px),
                radial-gradient(var(--tile-border) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: var(--font-header);
            color: var(--ink-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 900;
            color: var(--ink-primary);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8), 3px 3px 0px rgba(0,0,0,0.05);
            letter-spacing: -1px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.1em;
        }

        h1 span {
            display: inline-block;
        }

        /* The Stylized 'n' */
        .connector-n {
            color: var(--cub-scarf);
            font-family: var(--font-ui);
            font-weight: 300;
            font-style: italic;
            transform: scale(1.2) rotate(-10deg);
            display: inline-block;
            margin: 0 0.1em;
            text-shadow: none;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--ink-secondary);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 8px;
            font-weight: 700;
            opacity: 0.6;
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            width: 85vmin;
            height: 85vmin;
            max-width: 500px;
            max-height: 500px;
            background: var(--wood-dark);
            border-radius: 16px;
            box-shadow: 
                0 20px 50px rgba(62, 39, 35, 0.3),
                0 8px 20px rgba(0,0,0,0.2),
                inset 0 2px 5px rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px; /* Frame thickness */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* The Grid Surface */
        .board-inner {
            background: var(--tile-base);
            width: 100%;
            height: 100%;
            border-radius: 4px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            position: relative;
            /* Subtle paper texture on board */
            background-image: 
                radial-gradient(#E0D6C8 1px, transparent 1px);
            background-size: 12px 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 0; /* No gap for continuous trail */
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- Tiles --- */
        .tile {
            position: relative;
            cursor: pointer;
            /* No box-shadow on individual tiles to merge them */
            background: transparent;
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Game Elements (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            padding: 10%; /* Keep tokens slightly smaller than cell */
        }

        /* The Cub (Illustrative CSS) */
        .cub-token {
            width: 100%;
            height: 100%;
            background: var(--cub-brown);
            border-radius: 45% 45% 40% 40%;
            position: relative;
            /* Grounding Shadow */
            box-shadow: 
                0 8px 12px rgba(0,0,0,0.3),
                0 3px 0 rgba(0,0,0,0.2) inset;
            animation: breathe 3s infinite ease-in-out;
        }

        /* Ears */
        .cub-token::before, .cub-token::after {
            content: '';
            position: absolute;
            top: -12%;
            width: 32%;
            height: 32%;
            background: var(--cub-brown);
            border-radius: 50%;
            z-index: -1;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        .cub-token::before { left: -5%; }
        .cub-token::after { right: -5%; }

        /* Inner Ears */
        .cub-inner-ear-l, .cub-inner-ear-r {
            position: absolute;
            top: -8%;
            width: 20%;
            height: 20%;
            background: #A1887F;
            border-radius: 50%;
            z-index: 0;
        }
        .cub-inner-ear-l { left: 0%; }
        .cub-inner-ear-r { right: 0%; }

        /* Face */
        .cub-face {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 45%;
            background: var(--cub-belly);
            border-radius: 45%;
        }

        .cub-eyes {
            position: absolute;
            top: -20%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10%;
        }
        .cub-eye {
            width: 16%;
            height: 16%;
            background: #212121;
            border-radius: 50%;
            position: relative;
        }
        /* Eye Shine */
        .cub-eye::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 40%;
            height: 40%;
            background: white;
            border-radius: 50%;
        }

        .cub-nose {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 20%;
            background: #3E2723;
            border-radius: 40%;
        }

        /* Scarf */
        .cub-scarf {
            position: absolute;
            bottom: -5%;
            left: -10%;
            width: 120%;
            height: 25%;
            background: var(--cub-scarf);
            border-radius: 10px 10px 20px 20px;
            z-index: 2;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        .cub-scarf-tail {
            position: absolute;
            bottom: -20%;
            right: 10%;
            width: 30%;
            height: 40%;
            background: var(--cub-scarf);
            border-radius: 5px 5px 10px 10px;
            transform: rotate(10deg);
            z-index: 1;
        }

        /* The Star */
        .star-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 3s infinite ease-in-out;
        }

        .star-glow-bg {
            position: absolute;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, var(--star-glow) 0%, transparent 70%);
            opacity: 0.6;
            animation: pulse-opacity 2s infinite alternate;
        }

        .star-icon {
            width: 100%;
            height: 100%;
            fill: var(--star-gold);
            /* Grounding Shadow */
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25));
            z-index: 2;
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 24px;
            z-index: 10;
            align-items: center;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.15s ease;
            position: relative;
            outline: none;
        }

        /* Primary: Run (Terracotta/Brown) */
        .btn-run {
            background-color: var(--cub-scarf);
            color: #fff;
            border: none;
            padding: 14px 44px;
            border-radius: 50px;
            /* Soft tactile shadow */
            box-shadow: 
                0 6px 0 var(--btn-primary-shadow),
                0 10px 20px rgba(62, 39, 35, 0.2);
        }
        .btn-run:hover {
            background-color: #E64A19;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-primary-shadow),
                0 15px 25px rgba(62, 39, 35, 0.3);
        }
        .btn-run:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 var(--btn-primary-shadow),
                0 0 0 rgba(62, 39, 35, 0.3);
        }

        /* Secondary: Reset */
        .btn-reset {
            background: transparent;
            color: var(--ink-secondary);
            border: 2px solid var(--btn-secondary-border);
            padding: 12px 32px;
            border-radius: 50px;
            box-shadow: none;
        }
        .btn-reset:hover {
            background-color: rgba(141, 110, 99, 0.1);
            border-color: var(--ink-secondary);
            color: var(--ink-primary);
        }
        .btn-reset:active {
            transform: scale(0.95);
        }

        /* --- Animations --- */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes pulse-opacity {
            from { opacity: 0.4; transform: scale(0.9); }
            to { opacity: 0.8; transform: scale(1.1); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .game-container { width: 92vmin; height: 92vmin; }
            .controls { gap: 15px; }
            button { font-size: 0.9rem; padding: 12px 32px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span>Cub</span> 
            <span class="connector-n">&</span> 
            <span>Pup</span>
        </h1>
        <div class="subtitle">Guide the Cub Home</div>
    </header>

    <main class="game-container">
        <div class="board-inner">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: 0=Empty, 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        // Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = []; 

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    // High DPI support
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');

            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                
                // Inner ears
                const earL = document.createElement('div'); earL.className = 'cub-inner-ear-l';
                const earR = document.createElement('div'); earR.className = 'cub-inner-ear-r';
                cub.appendChild(earL);
                cub.appendChild(earR);

                // Face
                const face = document.createElement('div');
                face.className = 'cub-face';
                
                const eyes = document.createElement('div');
                eyes.className = 'cub-eyes';
                eyes.innerHTML = '<div class="cub-eye"></div><div class="cub-eye"></div>';
                
                const nose = document.createElement('div');
                nose.className = 'cub-nose';

                face.appendChild(eyes);
                face.appendChild(nose);
                cub.appendChild(face);

                // Scarf
                const scarf = document.createElement('div');
                scarf.className = 'cub-scarf';
                const tail = document.createElement('div');
                tail.className = 'cub-scarf-tail';
                scarf.appendChild(tail);
                cub.appendChild(scarf);
                
                cell.appendChild(cub);
            } else if (type === 'star') {
                const container = document.createElement('div');
                container.className = 'star-container';
                
                const glow = document.createElement('div');
                glow.className = 'star-glow-bg';
                
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-icon");
                star.innerHTML = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
                
                container.appendChild(glow);
                container.appendChild(star);
                cell.appendChild(container);
            }
        }

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPath(ctx, state.type, state.rotation);
            });
        }

        function drawPath(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            // Wider path for "Trail" look
            const thickness = 50; 
            const length = 100; // Draw to edge

            ctx.lineCap = 'square'; // Square caps to touch neighbors perfectly
            ctx.lineJoin = 'bevel'; 
            
            // Define the "Dirt" Gradient
            // Center is lighter, edges are darker
            const gradient = ctx.createLinearGradient(0, 0, 200, 200);
            gradient.addColorStop(0, '#A1887F');
            gradient.addColorStop(0.5, '#8D6E63');
            gradient.addColorStop(1, '#A1887F');

            const drawSegment = (dir) => {
                ctx.beginPath();
                ctx.lineWidth = thickness;
                ctx.strokeStyle = gradient;
                
                ctx.moveTo(cx, cy);
                // Move to the absolute edge of the tile
                if (dir === 0) ctx.lineTo(cx, 0);
                if (dir === 1) ctx.lineTo(200, cy);
                if (dir === 2) ctx.lineTo(cx, 200);
                if (dir === 3) ctx.lineTo(0, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            
            // 1. Draw the Base Dirt Path
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }

            // 2. Draw Center Hub (to smooth corners)
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2 + 2, 0, Math.PI * 2);
            ctx.fillStyle = '#8D6E63'; // Darker fill
            ctx.fill();

            // 3. Add Texture (Noise dots)
            // We use a pseudo-random seed based on type/rotation to keep it static per tile
            let seed = (type * 100) + rotation;
            for(let k=0; k<20; k++) {
                seed = (seed * 9301 + 49297) % 233280;
                const r = seed / 233280;
                
                // Random position within the tile
                const rx = r * 200;
                const ry = ( (seed * 9301 + 49297) % 233280 ) / 233280 * 200;
                
                // Only draw if inside the path (approximate check for simplicity or just scatter lightly)
                // For better perf, just scatter and let opacity handle it
                ctx.fillStyle = 'rgba(62, 39, 35, 0.1)';
                ctx.fillRect(rx, ry, 4, 4);
            }
        }

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Running...";
            btn.style.transform = "scale(0.95)";
            
            const tiles = document.querySelectorAll('.tile');
            
            // Simulate path finding (Visual Demo)
            const pathIndices = [0, 1, 6, 11, 16]; 
            
            let delay = 0;
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    // Success state - subtle warm glow
                    t.style.boxShadow = 'inset 0 0 20px rgba(255, 179, 0, 0.3)';
                    t.style.zIndex = 5; // Bring to front slightly
                }, delay);
                delay += 200;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.transform = "scale(1)";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    tiles.forEach(t => {
                        t.style.boxShadow = '';
                        t.style.zIndex = '';
                    });
                }, 1500);
            }, delay + 500);
        }

        initGame();
    </script>
</body>
</html>
