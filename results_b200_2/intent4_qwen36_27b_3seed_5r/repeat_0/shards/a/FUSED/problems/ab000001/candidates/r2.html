<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Refined Storybook */
            --bg-wall: #F4EFE6;
            --bg-wall-texture: #EBE3D5;
            
            --wood-dark: #5D4037;
            --wood-mid: #8D6E63;
            --wood-light: #D7CCC8;
            
            --tile-base: #FFFDF5;
            --tile-shadow: #E0D6C8;
            
            --path-color: #8D6E63; /* Brown path */
            --path-highlight: #A1887F;
            --path-shadow: #4E342E;
            
            --ink-primary: #3E2723;
            --ink-secondary: #5D4037;
            
            --cub-brown: #6D4C41;
            --cub-belly: #D7CCC8;
            --cub-scarf: #EF5350; /* Pop of Red */
            
            --star-gold: #FFCA28;
            --star-glow: #FFF59D;

            --btn-primary-bg: #66BB6A; /* Friendly Green */
            --btn-primary-shadow: #388E3C;
            --btn-secondary-border: #8D6E63;
            
            --font-header: "Georgia", "Times New Roman", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-wall);
            /* Subtle Wall Paper Texture */
            background-image: 
                radial-gradient(circle, var(--bg-wall-texture) 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: var(--font-header);
            color: var(--ink-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 900;
            color: var(--ink-primary);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5), 4px 4px 0px rgba(0,0,0,0.05);
            letter-spacing: -1px;
            line-height: 1;
        }

        h1 span {
            display: inline-block;
            transform: rotate(-3deg);
        }
        h1 span:nth-child(2) {
            transform: rotate(2deg);
            color: var(--wood-mid);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            color: var(--ink-secondary);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 8px;
            font-weight: 600;
            opacity: 0.7;
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            width: 85vmin;
            height: 85vmin;
            max-width: 500px;
            max-height: 500px;
            background: var(--wood-mid);
            border-radius: 24px;
            /* Deep tactile shadow, no hard border */
            box-shadow: 
                0 20px 40px rgba(62, 39, 35, 0.25),
                0 5px 15px rgba(0,0,0,0.15),
                inset 0 2px 5px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px; /* The Frame Thickness */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .board-inner {
            background: var(--tile-shadow); /* Grout color */
            width: 100%;
            height: 100%;
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            height: 100%;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-base);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            /* Tactile "Card" feel */
            box-shadow: 
                0 3px 0 var(--tile-shadow),
                0 5px 8px rgba(0,0,0,0.08);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(3px);
            box-shadow: 
                0 0 0 var(--tile-shadow),
                inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Slight rounded corners on content */
            border-radius: 6px; 
        }

        /* --- Game Elements (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 12px; /* Matches container padding */
            left: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* The Cub (Illustrative CSS) */
        .cub-token {
            width: 75%;
            height: 75%;
            background: var(--cub-brown);
            border-radius: 45% 45% 40% 40%;
            position: relative;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            animation: breathe 3s infinite ease-in-out;
        }

        /* Ears */
        .cub-token::before, .cub-token::after {
            content: '';
            position: absolute;
            top: -12%;
            width: 32%;
            height: 32%;
            background: var(--cub-brown);
            border-radius: 50%;
            z-index: -1;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        .cub-token::before { left: -5%; }
        .cub-token::after { right: -5%; }

        /* Inner Ears */
        .cub-inner-ear-l, .cub-inner-ear-r {
            position: absolute;
            top: -8%;
            width: 20%;
            height: 20%;
            background: #A1887F;
            border-radius: 50%;
            z-index: 0;
        }
        .cub-inner-ear-l { left: 0%; }
        .cub-inner-ear-r { right: 0%; }

        /* Face */
        .cub-face {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 45%;
            background: var(--cub-belly);
            border-radius: 45%;
        }

        .cub-eyes {
            position: absolute;
            top: -20%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10%;
        }
        .cub-eye {
            width: 16%;
            height: 16%;
            background: #212121;
            border-radius: 50%;
            position: relative;
        }
        /* Eye Shine */
        .cub-eye::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 40%;
            height: 40%;
            background: white;
            border-radius: 50%;
        }

        .cub-nose {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 20%;
            background: #3E2723;
            border-radius: 40%;
        }

        /* Scarf */
        .cub-scarf {
            position: absolute;
            bottom: -5%;
            left: -10%;
            width: 120%;
            height: 25%;
            background: var(--cub-scarf);
            border-radius: 10px 10px 20px 20px;
            z-index: 2;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        .cub-scarf-tail {
            position: absolute;
            bottom: -20%;
            right: 10%;
            width: 30%;
            height: 40%;
            background: var(--cub-scarf);
            border-radius: 5px 5px 10px 10px;
            transform: rotate(10deg);
            z-index: 1;
        }

        /* The Star */
        .star-container {
            width: 80%;
            height: 80%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 3s infinite ease-in-out;
        }

        .star-glow-bg {
            position: absolute;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, var(--star-glow) 0%, transparent 70%);
            opacity: 0.6;
            animation: pulse-opacity 2s infinite alternate;
        }

        .star-icon {
            width: 100%;
            height: 100%;
            fill: var(--star-gold);
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
            z-index: 2;
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            z-index: 10;
            align-items: center;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
            position: relative;
            outline: none;
        }

        /* Primary: Run */
        .btn-run {
            background-color: var(--btn-primary-bg);
            color: #fff;
            border: none;
            padding: 16px 48px;
            border-radius: 50px;
            /* Soft Glow */
            box-shadow: 
                0 6px 0 var(--btn-primary-shadow),
                0 10px 20px rgba(102, 187, 106, 0.3);
        }
        .btn-run:hover {
            background-color: #76C97A;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-primary-shadow),
                0 15px 25px rgba(102, 187, 106, 0.4);
        }
        .btn-run:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 var(--btn-primary-shadow),
                0 0 0 rgba(102, 187, 106, 0.3);
        }

        /* Secondary: Reset */
        .btn-reset {
            background: transparent;
            color: var(--ink-secondary);
            border: 2px solid var(--btn-secondary-border);
            padding: 14px 36px;
            border-radius: 50px;
            box-shadow: none;
        }
        .btn-reset:hover {
            background-color: rgba(141, 110, 99, 0.1);
            border-color: var(--ink-secondary);
            color: var(--ink-primary);
        }
        .btn-reset:active {
            transform: scale(0.95);
        }

        /* --- Animations --- */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse-opacity {
            from { opacity: 0.4; transform: scale(0.9); }
            to { opacity: 0.8; transform: scale(1.1); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .game-container { width: 92vmin; height: 92vmin; }
            .controls { gap: 15px; }
            button { font-size: 0.9rem; padding: 14px 32px; }
        }
    </style>
</head>
<body>

    <header>
        <h1><span>Cub n</span> <span>Pup</span></h1>
        <div class="subtitle">Guide the Cub Home</div>
    </header>

    <main class="game-container">
        <div class="board-inner">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: 0=Empty, 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        // Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = []; 

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    // High DPI support
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');

            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                
                // Inner ears
                const earL = document.createElement('div'); earL.className = 'cub-inner-ear-l';
                const earR = document.createElement('div'); earR.className = 'cub-inner-ear-r';
                cub.appendChild(earL);
                cub.appendChild(earR);

                // Face
                const face = document.createElement('div');
                face.className = 'cub-face';
                
                const eyes = document.createElement('div');
                eyes.className = 'cub-eyes';
                eyes.innerHTML = '<div class="cub-eye"></div><div class="cub-eye"></div>';
                
                const nose = document.createElement('div');
                nose.className = 'cub-nose';

                face.appendChild(eyes);
                face.appendChild(nose);
                cub.appendChild(face);

                // Scarf
                const scarf = document.createElement('div');
                scarf.className = 'cub-scarf';
                const tail = document.createElement('div');
                tail.className = 'cub-scarf-tail';
                scarf.appendChild(tail);
                cub.appendChild(scarf);
                
                cell.appendChild(cub);
            } else if (type === 'star') {
                const container = document.createElement('div');
                container.className = 'star-container';
                
                const glow = document.createElement('div');
                glow.className = 'star-glow-bg';
                
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-icon");
                star.innerHTML = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
                
                container.appendChild(glow);
                container.appendChild(star);
                cell.appendChild(container);
            }
        }

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 36; // Slightly thicker
            const length = 95; 

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = thickness;
            
            // 1. Shadow for depth (Carved look)
            ctx.shadowColor = 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.strokeStyle = '#8D6E63'; // Darker base for shadow
            
            const drawSegment = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length);
                if (dir === 1) ctx.lineTo(cx + length, cy);
                if (dir === 2) ctx.lineTo(cx, cy + length);
                if (dir === 3) ctx.lineTo(cx - length, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            
            // Draw Shadow Layer
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }
            // Center Hub Shadow
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2, 0, Math.PI * 2);
            ctx.fillStyle = '#8D6E63';
            ctx.fill();

            // 2. Main Path Layer (The "Carved" groove)
            ctx.shadowColor = 'rgba(255,255,255,0.8)'; // Inner light
            ctx.shadowBlur = 1;
            ctx.shadowOffsetX = -1;
            ctx.shadowOffsetY = -1;
            ctx.strokeStyle = '#A1887F'; // Mid tone
            
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2 - 2, 0, Math.PI * 2); // Slightly smaller hub
            ctx.fillStyle = '#A1887F';
            ctx.fill();

            // 3. Highlight (Top edge)
            ctx.shadowColor = 'transparent';
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            
            // Simple center highlight
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2 - 4, 0, Math.PI * 2);
            ctx.stroke();
        }

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Running...";
            btn.style.transform = "scale(0.95)";
            
            const tiles = document.querySelectorAll('.tile');
            
            // Simulate path finding
            // Just a visual demo path
            const pathIndices = [0, 1, 6, 11, 16]; 
            
            let delay = 0;
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    // Success state
                    t.style.backgroundColor = '#E8F5E9'; 
                    // Add a subtle green glow
                    t.style.boxShadow = '0 0 15px rgba(102, 187, 106, 0.5)';
                }, delay);
                delay += 200;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.transform = "scale(1)";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                        t.style.boxShadow = '';
                    });
                }, 1500);
            }, delay + 500);
        }

        initGame();
    </script>
</body>
</html>
