<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Storybook & Wood */
            --bg-paper: #FDFBF7;
            --bg-dots: #EFEBE9;
            
            --ink-dark: #3E2723;
            --ink-text: #5D4037;
            
            /* Wood Frame Gradients */
            --wood-frame: linear-gradient(135deg, #8D6E63, #5D4037);
            --wood-inner: #4E342E;
            
            /* Tile Surface */
            --tile-bg: #FFF8E1;
            --tile-shadow: #D7CCC8;
            --tile-border: #D7CCC8;
            
            /* The Path (Pipe) */
            --path-color: #795548;
            --path-highlight: #8D6E63;
            --path-shadow: #3E2723;
            
            /* Entities */
            --cub-primary: #FF7043;
            --cub-secondary: #D84315;
            --cub-highlight: #FFAB91;
            
            --star-primary: #FFCA28;
            --star-shadow: #FFB300;
            --star-glow: rgba(255, 202, 40, 0.4);

            /* UI */
            --btn-run: #FF7043;
            --btn-run-hover: #F4511E;
            --btn-run-shadow: #BF360C;
            
            --btn-reset: #FFFFFF;
            --btn-reset-text: #5D4037;
            --btn-reset-shadow: #D7CCC8;

            /* Typography */
            --font-display: 'Georgia', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Playful dot grid */
            background-image: radial-gradient(var(--bg-dots) 2px, transparent 2px);
            background-size: 28px 28px;
            font-family: var(--font-display);
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            color: var(--ink-dark);
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        .logo-block {
            width: 44px;
            height: 44px;
            background: var(--ink-dark);
            border-radius: 10px;
            position: relative;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }
        .logo-block::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px;
            width: 8px; height: 8px;
            background: white; border-radius: 50%;
            box-shadow: 16px 0 0 white; /* Right eye */
        }
        .logo-block::after {
            content: '';
            position: absolute;
            bottom: 10px; left: 16px;
            width: 12px; height: 4px;
            background: white; border-radius: 2px;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--ink-text);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            font-weight: 700;
            opacity: 0.7;
        }

        /* --- Game Board --- */
        .game-wrapper {
            position: relative;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* The heavy wooden frame */
        .game-frame {
            background: var(--wood-frame);
            padding: 16px;
            border-radius: 20px;
            box-shadow: 
                0 20px 50px rgba(62, 39, 35, 0.3),
                0 8px 20px rgba(0,0,0,0.2),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.3);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .board-recess {
            background: var(--wood-inner);
            padding: 6px;
            border-radius: 10px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            width: 80vmin;
            height: 80vmin;
            max-width: 460px;
            max-height: 460px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-bg);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            /* 3D Tile Effect */
            box-shadow: 
                0 4px 0 var(--tile-shadow),
                0 6px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, box-shadow 0.1s;
            overflow: hidden;
            border: 1px solid var(--tile-border);
        }

        .tile:active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 var(--tile-shadow),
                0 2px 2px rgba(0,0,0,0.1);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Overlay (Entities) --- */
        .overlay-layer {
            position: absolute;
            top: 22px; /* Frame padding + recess padding */
            left: 22px;
            right: 22px;
            bottom: 22px;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            z-index: 10;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Cub Token */
        .cub-token {
            width: 50%;
            height: 50%;
            background: var(--cub-primary);
            border-radius: 10px;
            position: relative;
            box-shadow: 
                inset 3px 3px 0 var(--cub-highlight),
                inset -3px -3px 0 var(--cub-secondary),
                0 6px 12px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        .cub-face {
            position: absolute;
            top: 35%; left: 25%;
            width: 15%; height: 15%;
            background: var(--ink-dark);
            border-radius: 50%;
            box-shadow: 22px 0 0 var(--ink-dark); /* Right eye */
        }
        .cub-mouth {
            position: absolute;
            bottom: 25%; left: 50%;
            transform: translateX(-50%);
            width: 20%; height: 6px;
            background: var(--ink-dark);
            border-radius: 4px;
        }

        /* The Star Token */
        .star-token {
            width: 60%;
            height: 60%;
            fill: var(--star-primary);
            filter: drop-shadow(0 4px 0 var(--star-shadow));
            animation: pulse 2s infinite ease-in-out;
        }

        /* --- Controls --- */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 40px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
        }

        button:active {
            transform: translateY(3px);
        }

        .btn-run {
            background-color: var(--btn-run);
            color: white;
            box-shadow: 
                0 6px 0 var(--btn-run-shadow),
                0 12px 20px rgba(255, 112, 67, 0.3);
        }
        .btn-run:hover {
            background-color: var(--btn-run-hover);
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-run-shadow),
                0 15px 25px rgba(255, 112, 67, 0.4);
        }
        .btn-run:active {
            transform: translateY(3px);
            box-shadow: 
                0 2px 0 var(--btn-run-shadow),
                0 4px 10px rgba(255, 112, 67, 0.2);
        }

        .btn-reset {
            background-color: var(--btn-reset);
            color: var(--btn-reset-text);
            box-shadow: 
                0 6px 0 var(--btn-reset-shadow),
                0 8px 15px rgba(0,0,0,0.05);
        }
        .btn-reset:hover {
            background-color: #FAFAFA;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-reset-shadow),
                0 12px 20px rgba(0,0,0,0.08);
        }
        .btn-reset:active {
            transform: translateY(3px);
            box-shadow: 
                0 2px 0 var(--btn-reset-shadow),
                0 3px 6px rgba(0,0,0,0.05);
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 0 var(--star-shadow)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 6px 10px var(--star-glow)); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Solved State */
        .tile.solved {
            background-color: #E8F5E9;
        }
        .tile.solved canvas {
            filter: brightness(1.1);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .grid { width: 92vmin; height: 92vmin; }
            .controls { gap: 12px; }
            button { padding: 12px 24px; font-size: 0.9rem; }
            .game-frame { padding: 12px; }
            .overlay-layer { top: 18px; left: 18px; right: 18px; bottom: 18px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <div class="logo-block"></div>
            Cub n Pup
        </h1>
        <div class="subtitle">Connect the path to the star</div>
    </header>

    <div class="game-wrapper">
        <div class="game-frame">
            <div class="board-recess">
                <div class="grid" id="grid">
                    <!-- Tiles generated by JS -->
                </div>
                <div class="overlay-layer" id="overlay">
                    <!-- Entities injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Connections: [Top, Right, Bottom, Left]
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = [];

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                const face = document.createElement('div');
                face.className = 'cub-face';
                const mouth = document.createElement('div');
                mouth.className = 'cub-mouth';
                cub.appendChild(face);
                cub.appendChild(mouth);
                cell.appendChild(cub);
            } else if (type === 'star') {
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-token");
                star.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                cell.appendChild(star);
            }
        }

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 32;
            const length = 90;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 1. Draw Shadow (Offset)
            ctx.save();
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = thickness;
            ctx.translate(4, 4);
            drawSegments(ctx, type, rotation, cx, cy, length);
            ctx.restore();

            // 2. Draw Main Pipe
            ctx.strokeStyle = '#795548';
            ctx.lineWidth = thickness;
            drawSegments(ctx, type, rotation, cx, cy, length);

            // 3. Draw Highlight (Inner Bevel)
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 4;
            drawSegments(ctx, type, rotation, cx, cy, length);
            
            // 4. Center Hub (Smooths intersections)
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2 + 2, 0, Math.PI * 2);
            ctx.fillStyle = '#795548';
            ctx.fill();
            
            // Hub Highlight
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fill();
        }

        function drawSegments(ctx, type, rotation, cx, cy, length) {
            const drawSeg = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length);
                if (dir === 1) ctx.lineTo(cx + length, cy);
                if (dir === 2) ctx.lineTo(cx, cy + length);
                if (dir === 3) ctx.lineTo(cx - length, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSeg(targetDir);
                }
            }
        }

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            btn.disabled = true;
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Simulate path finding
            const pathIndices = [0, 1, 6, 11, 16]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.classList.add('solved');
                }, delay);
                delay += 200;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.backgroundColor = "#66BB6A";
                btn.style.boxShadow = "0 6px 0 #388E3C, 0 10px 15px rgba(0,0,0,0.15)";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.boxShadow = "";
                    btn.disabled = false;
                    tiles.forEach(t => t.classList.remove('solved'));
                }, 1500);
            }, delay + 500);
        }

        initGame();
    </script>
</body>
</html>
