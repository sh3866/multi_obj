<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Storybook Warmth */
            --bg-paper: #F7F5F0;
            --bg-pattern: #EBE8E1;
            
            --wood-dark: #4E342E;
            --wood-mid: #6D4C41;
            --wood-light: #8D6E63;
            --wood-highlight: #A1887F;
            
            --tile-face: #FFFDF5;
            --tile-shadow: #D7CCC8;
            
            --pipe-color: #5D4037;
            --pipe-highlight: #8D6E63;
            --pipe-shadow: #3E2723;
            
            --cub-orange: #FF7043;
            --cub-dark: #D84315;
            --cub-light: #FFAB91;
            
            --star-gold: #FFCA28;
            --star-shadow: #FFB300;
            
            --ink-primary: #3E2723;
            --ink-secondary: #795548;
            
            --ui-active: #FF7043;
            --ui-active-shadow: #BF360C;
            --ui-passive: #FFFFFF;
            --ui-passive-shadow: #D7CCC8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle texture pattern */
            background-image: radial-gradient(var(--bg-pattern) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
            animation: slideDown 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        h1 {
            font-family: "Georgia", serif;
            font-size: 2.8rem;
            margin: 0;
            color: var(--ink-primary);
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 2px 2px 0 rgba(255,255,255,1);
        }

        /* Custom Logo Icon */
        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--ink-primary);
            border-radius: 12px;
            position: relative;
            transform: rotate(-5deg);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }
        .logo-icon::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px;
            width: 8px; height: 8px;
            background: var(--cub-orange); border-radius: 50%;
            box-shadow: 16px 0 0 var(--cub-orange);
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            bottom: 12px; left: 18px;
            width: 12px; height: 4px;
            background: var(--cub-orange); border-radius: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--ink-secondary);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-top: 8px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* --- Game Board --- */
        .game-wrapper {
            position: relative;
            animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* The Wooden Frame */
        .game-frame {
            background: linear-gradient(145deg, var(--wood-light), var(--wood-dark));
            padding: 18px;
            border-radius: 24px;
            box-shadow: 
                0 25px 60px rgba(62, 39, 35, 0.4),
                0 10px 25px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,255,255,0.3),
                inset 0 -2px 4px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,0,0,0.2);
        }

        .board-recess {
            background: var(--wood-mid);
            padding: 8px;
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            width: 85vmin;
            height: 85vmin;
            max-width: 480px;
            max-height: 480px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-face);
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            /* 3D Block Effect */
            box-shadow: 
                0 6px 0 var(--tile-shadow),
                0 10px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .tile:active {
            transform: translateY(5px);
            box-shadow: 
                0 1px 0 var(--tile-shadow),
                0 2px 2px rgba(0,0,0,0.15);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Overlay (Entities) --- */
        .overlay-layer {
            position: absolute;
            top: 26px; /* Frame padding + recess padding */
            left: 26px;
            right: 26px;
            bottom: 26px;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            z-index: 20;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Cub Token */
        .cub-token {
            width: 45%;
            height: 45%;
            background: var(--cub-orange);
            border-radius: 12px;
            position: relative;
            box-shadow: 
                inset 3px 3px 0 var(--cub-light),
                inset -3px -3px 0 var(--cub-dark),
                0 8px 15px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        .cub-face {
            position: absolute;
            top: 30%; left: 25%;
            width: 12%; height: 12%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 20px 0 0 #3E2723; /* Right eye */
        }
        .cub-mouth {
            position: absolute;
            bottom: 25%; left: 50%;
            transform: translateX(-50%);
            width: 16%; height: 5px;
            background: #3E2723;
            border-radius: 4px;
        }

        /* The Star Token */
        .star-token {
            width: 55%;
            height: 55%;
            fill: var(--star-gold);
            filter: drop-shadow(0 4px 0 var(--star-shadow));
            animation: pulse 2s infinite ease-in-out;
        }

        /* --- Controls --- */
        .controls {
            margin-top: 36px;
            display: flex;
            gap: 24px;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        button {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 800;
            font-size: 1rem;
            padding: 16px 48px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
        }

        button:active {
            transform: translateY(4px);
        }

        .btn-run {
            background-color: var(--ui-active);
            color: white;
            box-shadow: 
                0 8px 0 var(--ui-active-shadow),
                0 15px 25px rgba(255, 112, 67, 0.4);
        }
        .btn-run:hover {
            background-color: #F4511E;
            transform: translateY(-2px);
            box-shadow: 
                0 10px 0 var(--ui-active-shadow),
                0 20px 30px rgba(255, 112, 67, 0.4);
        }
        .btn-run:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0 var(--ui-active-shadow),
                0 5px 10px rgba(255, 112, 67, 0.2);
        }

        .btn-reset {
            background-color: var(--ui-passive);
            color: var(--ink-secondary);
            box-shadow: 
                0 8px 0 var(--ui-passive-shadow),
                0 12px 20px rgba(0,0,0,0.08);
        }
        .btn-reset:hover {
            background-color: #FAFAFA;
            transform: translateY(-2px);
            box-shadow: 
                0 10px 0 var(--ui-passive-shadow),
                0 15px 25px rgba(0,0,0,0.1);
        }
        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0 var(--ui-passive-shadow),
                0 4px 8px rgba(0,0,0,0.05);
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 0 var(--star-shadow)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 6px 12px rgba(255, 202, 40, 0.6)); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Solved State */
        .tile.solved {
            background-color: #E8F5E9;
        }
        .tile.solved canvas {
            filter: brightness(1.1) saturate(1.2);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .grid { width: 92vmin; height: 92vmin; }
            .controls { gap: 16px; }
            button { padding: 14px 32px; font-size: 0.9rem; }
            .game-frame { padding: 12px; }
            .overlay-layer { top: 20px; left: 20px; right: 20px; bottom: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <div class="logo-icon"></div>
            Cub n Pup
        </h1>
        <div class="subtitle">Connect the path to the star</div>
    </header>

    <div class="game-wrapper">
        <div class="game-frame">
            <div class="board-recess">
                <div class="grid" id="grid">
                    <!-- Tiles generated by JS -->
                </div>
                <div class="overlay-layer" id="overlay">
                    <!-- Entities injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Connections: [Top, Right, Bottom, Left]
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = [];

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                const face = document.createElement('div');
                face.className = 'cub-face';
                const mouth = document.createElement('div');
                mouth.className = 'cub-mouth';
                cub.appendChild(face);
                cub.appendChild(mouth);
                cell.appendChild(cub);
            } else if (type === 'star') {
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-token");
                star.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                cell.appendChild(star);
            }
        }

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 36; // Slightly thicker
            const length = 95;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 1. Draw Shadow (Offset)
            ctx.save();
            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.lineWidth = thickness;
            ctx.translate(5, 5);
            drawSegments(ctx, type, rotation, cx, cy, length);
            ctx.restore();

            // 2. Draw Main Pipe (Base)
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = thickness;
            drawSegments(ctx, type, rotation, cx, cy, length);

            // 3. Draw Highlight (Inner Bevel - Top Left)
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 6;
            drawSegments(ctx, type, rotation, cx, cy, length);
            
            // 4. Draw Shadow (Inner Bevel - Bottom Right)
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 6;
            ctx.translate(1, 1);
            drawSegments(ctx, type, rotation, cx, cy, length);
            ctx.translate(-1, -1);

            // 5. Center Hub (Smooths intersections)
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2 + 2, 0, Math.PI * 2);
            ctx.fillStyle = '#5D4037';
            ctx.fill();
            
            // Hub Highlight
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fill();
        }

        function drawSegments(ctx, type, rotation, cx, cy, length) {
            const drawSeg = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length);
                if (dir === 1) ctx.lineTo(cx + length, cy);
                if (dir === 2) ctx.lineTo(cx, cy + length);
                if (dir === 3) ctx.lineTo(cx - length, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSeg(targetDir);
                }
            }
        }

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            btn.disabled = true;
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Simulate path finding
            const pathIndices = [0, 1, 6, 11, 16]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.classList.add('solved');
                }, delay);
                delay += 200;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.backgroundColor = "#66BB6A";
                btn.style.boxShadow = "0 8px 0 #388E3C, 0 15px 25px rgba(0,0,0,0.15)";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.boxShadow = "";
                    btn.disabled = false;
                    tiles.forEach(t => t.classList.remove('solved'));
                }, 1500);
            }, delay + 500);
        }

        initGame();
    </script>
</body>
</html>
