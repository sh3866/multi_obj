<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* 
               PALETTE: "Woodland Storybook"
               Rich, tactile, and warm.
            */
            --bg-color: #FDFBF7;
            --bg-accent: #F0EBE5;
            
            /* Wood Textures */
            --wood-frame-outer: #5D4037;
            --wood-frame-inner: #795548;
            --wood-highlight: #8D6E63;
            --wood-shadow: #3E2723;
            
            /* Tile Colors */
            --tile-base: #FFF8E1; /* Warm cream */
            --tile-border: #D7CCC8;
            --tile-shadow: #BCAAA4;
            
            /* Pipe (Path) Colors */
            --pipe-base: #6D4C41;
            --pipe-light: #8D6E63;
            --pipe-dark: #4E342E;
            
            /* Character: The Cub */
            --cub-body: #FF7043;
            --cub-dark: #D84315;
            --cub-highlight: #FFAB91;
            
            /* Goal: The Star */
            --star-gold: #FFCA28;
            --star-glow: rgba(255, 202, 40, 0.6);
            
            /* UI Elements */
            --btn-primary: #FF7043;
            --btn-primary-shadow: #D84315;
            --btn-secondary: #FFFFFF;
            --btn-secondary-shadow: #CFD8DC;
            
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-display: "Georgia", serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Subtle "paper" noise pattern */
            background-image: radial-gradient(var(--bg-accent) 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: var(--font-main);
            color: var(--wood-frame-outer);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            animation: dropIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            position: relative;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            margin: 0;
            color: var(--wood-frame-outer);
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--wood-frame-inner);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* --- Game Board Container --- */
        .game-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 500px;
            max-height: 500px;
            animation: floatBoard 6s ease-in-out infinite;
        }

        /* The 3D Wooden Frame */
        .frame-outer {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--wood-highlight), var(--wood-frame-outer));
            border-radius: 32px;
            padding: 16px;
            box-shadow: 
                0 20px 50px rgba(62, 39, 35, 0.4),
                inset 0 2px 0 rgba(255,255,255,0.2),
                inset 0 -2px 0 rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frame-inner {
            width: 100%;
            height: 100%;
            background: var(--wood-frame-inner);
            border-radius: 20px;
            padding: 12px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
            position: relative;
        }

        /* The Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        /* --- Individual Tile --- */
        .tile {
            background-color: var(--tile-base);
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            /* 3D Block Look */
            box-shadow: 
                0 6px 0 var(--tile-shadow),
                0 10px 10px rgba(0,0,0,0.15),
                inset 0 0 0 1px rgba(255,255,255,0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(5px);
            box-shadow: 
                0 1px 0 var(--tile-shadow),
                0 2px 2px rgba(0,0,0,0.15);
        }

        .tile canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- Entities (Cub & Star) --- */
        .entities-layer {
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            pointer-events: none;
            z-index: 20;
        }

        .entity-cell {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Cub Character */
        .cub {
            width: 50%;
            height: 50%;
            background: var(--cub-body);
            border-radius: 14px;
            position: relative;
            box-shadow: 
                inset 4px 4px 0 var(--cub-highlight),
                inset -4px -4px 0 var(--cub-dark),
                0 8px 12px rgba(0,0,0,0.3);
            animation: bounce 2s infinite;
        }

        /* Cub Face Details */
        .cub::before {
            content: '';
            position: absolute;
            top: 35%; left: 25%;
            width: 15%; height: 15%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 22px 0 0 #3E2723; /* Right Eye */
        }
        .cub::after {
            content: '';
            position: absolute;
            bottom: 30%; left: 50%;
            transform: translateX(-50%);
            width: 20%; height: 6px;
            background: #3E2723;
            border-radius: 4px;
        }

        /* The Star Goal */
        .star {
            width: 60%;
            height: 60%;
            fill: var(--star-gold);
            filter: drop-shadow(0 4px 0 #FFB300);
            animation: spinStar 4s linear infinite;
        }

        /* --- Controls --- */
        .controls {
            margin-top: 32px;
            display: flex;
            gap: 20px;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        button {
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 1rem;
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
            position: relative;
            top: 0;
        }

        button:active {
            top: 4px;
        }

        .btn-run {
            background-color: var(--btn-primary);
            color: white;
            box-shadow: 
                0 6px 0 var(--btn-primary-shadow),
                0 15px 25px rgba(255, 112, 67, 0.3);
        }
        .btn-run:hover {
            background-color: #F4511E;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-primary-shadow),
                0 20px 30px rgba(255, 112, 67, 0.4);
        }
        .btn-run:active {
            box-shadow: 
                0 0 0 var(--btn-primary-shadow),
                0 5px 10px rgba(255, 112, 67, 0.2);
        }

        .btn-reset {
            background-color: var(--btn-secondary);
            color: var(--wood-frame-outer);
            box-shadow: 
                0 6px 0 var(--btn-secondary-shadow),
                0 10px 15px rgba(0,0,0,0.05);
        }
        .btn-reset:hover {
            background-color: #FAFAFA;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--btn-secondary-shadow),
                0 15px 20px rgba(0,0,0,0.1);
        }
        .btn-reset:active {
            box-shadow: 
                0 0 0 var(--btn-secondary-shadow),
                0 2px 5px rgba(0,0,0,0.05);
        }

        /* --- Animations --- */
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }
        @keyframes spinStar {
            0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 4px 0 #FFB300); }
            50% { transform: scale(1.1) rotate(180deg); filter: drop-shadow(0 6px 15px var(--star-glow)); }
            100% { transform: scale(1) rotate(360deg); filter: drop-shadow(0 4px 0 #FFB300); }
        }
        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatBoard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        /* Solved State */
        .tile.solved {
            background-color: #E8F5E9;
        }
        .tile.solved canvas {
            filter: brightness(1.1);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .game-container { width: 94vmin; height: 94vmin; }
            .controls { gap: 12px; }
            button { padding: 14px 24px; font-size: 0.9rem; }
            .frame-outer { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <!-- Vector Logo Icon -->
            <svg class="logo-mark" viewBox="0 0 100 100">
                <rect x="10" y="10" width="80" height="80" rx="20" fill="#3E2723"/>
                <circle cx="35" cy="40" r="8" fill="#FF7043"/>
                <circle cx="65" cy="40" r="8" fill="#FF7043"/>
                <rect x="40" y="60" width="20" height="6" rx="3" fill="#FF7043"/>
                <rect x="10" y="10" width="80" height="80" rx="20" fill="none" stroke="#5D4037" stroke-width="4"/>
            </svg>
            <h1>Cub n Pup</h1>
        </div>
        <div class="subtitle">Connect the path to the star</div>
    </header>

    <div class="game-container">
        <div class="frame-outer">
            <div class="frame-inner">
                <div class="grid" id="grid">
                    <!-- Tiles generated by JS -->
                </div>
                <div class="entities-layer" id="overlay">
                    <!-- Entities injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Connections: [Top, Right, Bottom, Left]
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = [];

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Generate random tile
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // Create Tile DOM
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    // High res for crispness
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Create Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity-cell';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            // Place Entities
            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');
            
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub';
                cell.appendChild(cub);
            } else if (type === 'star') {
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star");
                star.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                cell.appendChild(star);
            }
        }

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 40; // Thicker, chunkier pipes
            const length = 98;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 1. Shadow
            ctx.save();
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = thickness;
            ctx.translate(4, 4);
            drawSegments(ctx, type, rotation, cx, cy, length);
            ctx.restore();

            // 2. Main Pipe Base
            ctx.strokeStyle = '#6D4C41';
            ctx.lineWidth = thickness;
            drawSegments(ctx, type, rotation, cx, cy, length);

            // 3. Top Highlight (Bevel)
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 8;
            drawSegments(ctx, type, rotation, cx, cy, length);

            // 4. Bottom Inner Shadow
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 8;
            ctx.translate(0, 2);
            drawSegments(ctx, type, rotation, cx, cy, length);

            // 5. Center Hub
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2 + 2, 0, Math.PI * 2);
            ctx.fillStyle = '#6D4C41';
            ctx.fill();
            
            // Hub Highlight
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fill();
        }

        function drawSegments(ctx, type, rotation, cx, cy, length) {
            const drawSeg = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length);
                if (dir === 1) ctx.lineTo(cx + length, cy);
                if (dir === 2) ctx.lineTo(cx, cy + length);
                if (dir === 3) ctx.lineTo(cx - length, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSeg(targetDir);
                }
            }
        }

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            btn.disabled = true;
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Fake path solving animation
            const pathIndices = [0, 1, 6, 11, 16]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.classList.add('solved');
                }, delay);
                delay += 250;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.backgroundColor = "#66BB6A";
                btn.style.boxShadow = "0 6px 0 #388E3C, 0 15px 25px rgba(0,0,0,0.15)";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.boxShadow = "";
                    btn.disabled = false;
                    tiles.forEach(t => t.classList.remove('solved'));
                }, 1500);
            }, delay + 500);
        }

        // Initialize
        initGame();
    </script>
</body>
</html>
