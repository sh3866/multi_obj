<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Refined Storybook */
            --bg-paper: #FDF8E7;
            --bg-pattern: #F0E6D2;
            
            --ink-dark: #3E2723;
            --ink-soft: #5D4037;
            
            /* Wood Frame */
            --wood-deep: #5D4037;
            --wood-mid: #8D6E63;
            --wood-light: #A1887F;
            
            /* Tile Surface */
            --tile-bg: #FFF8E1;
            --tile-border: #E0E0E0;
            --tile-shadow: #D7CCC8;
            
            /* The Pipe */
            --pipe-color: #6D4C41;
            --pipe-highlight: #8D6E63;
            --pipe-shadow: #3E2723;
            
            /* Entities */
            --cub-primary: #FF7043;
            --cub-shadow: #D84315;
            
            --star-primary: #FFCA28;
            --star-glow: #FFF59D;

            /* UI */
            --btn-run: #FF7043;
            --btn-run-hover: #F4511E;
            --btn-reset: #FFFFFF;
            --btn-reset-hover: #F5F5F5;
            
            /* Fonts */
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle dot grid pattern */
            background-image: radial-gradient(var(--bg-pattern) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            font-family: var(--font-display);
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: var(--ink-dark);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            font-weight: 700;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--ink-dark);
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-icon::before, .logo-icon::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--bg-paper);
            border-radius: 50%;
            position: absolute;
            top: 14px;
        }
        .logo-icon::before { left: 14px; }
        .logo-icon::after { right: 14px; }
        .logo-mouth {
            width: 12px;
            height: 4px;
            background: var(--bg-paper);
            border-radius: 2px;
            position: absolute;
            top: 26px;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-top: 8px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* --- Game Board Area --- */
        .game-container {
            position: relative;
            padding: 16px;
            background: var(--wood-mid);
            border-radius: 16px;
            /* Complex shadow for depth */
            box-shadow: 
                0 20px 40px rgba(62, 39, 35, 0.25),
                0 8px 16px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.3),
                inset 0 -2px 0 rgba(0,0,0,0.1);
            z-index: 10;
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* The inner recess of the board */
        .board-inner {
            background: var(--wood-deep);
            padding: 8px;
            border-radius: 8px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            width: 80vmin;
            height: 80vmin;
            max-width: 480px;
            max-height: 480px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-bg);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            /* Soft physical feel */
            box-shadow: 
                0 4px 0 var(--tile-shadow),
                0 6px 8px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.3s;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                0 2px 0 var(--tile-shadow),
                0 3px 4px rgba(0,0,0,0.1);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Overlay (Entities) --- */
        .overlay-layer {
            position: absolute;
            top: 8px; /* Match board-inner padding */
            left: 8px;
            right: 8px;
            bottom: 8px;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        /* The Cub */
        .cub-token {
            width: 55%;
            height: 55%;
            background: var(--cub-primary);
            border-radius: 12px;
            box-shadow: 
                inset 3px 3px 0 rgba(255,255,255,0.4),
                inset -3px -3px 0 rgba(0,0,0,0.15),
                0 6px 10px rgba(0,0,0,0.2);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        
        /* Cub Face Details */
        .cub-token::before {
            content: '';
            position: absolute;
            top: 35%;
            left: 25%;
            width: 18%;
            height: 18%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 20px 0 0 #3E2723; /* Right Eye */
        }
        .cub-token::after {
            content: '';
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            width: 20%;
            height: 8%;
            background: #3E2723;
            border-radius: 4px;
        }

        /* The Star */
        .star-token {
            width: 60%;
            height: 60%;
            fill: var(--star-primary);
            filter: drop-shadow(0 0 8px var(--star-glow));
            animation: pulse 2s infinite;
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 32px;
            display: flex;
            gap: 24px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 36px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        button:active {
            transform: translateY(3px);
        }

        .btn-run {
            background-color: var(--btn-run);
            color: white;
            box-shadow: 
                0 6px 0 var(--cub-shadow),
                0 10px 15px rgba(0,0,0,0.15);
        }
        .btn-run:hover {
            background-color: var(--btn-run-hover);
            transform: translateY(-1px);
        }
        .btn-run:active {
            box-shadow: 
                0 2px 0 var(--cub-shadow),
                0 4px 6px rgba(0,0,0,0.15);
        }

        .btn-reset {
            background-color: var(--btn-reset);
            color: var(--ink-soft);
            border: 2px solid #E0E0E0;
            box-shadow: 0 6px 0 #E0E0E0;
        }
        .btn-reset:hover {
            background-color: var(--btn-reset-hover);
            transform: translateY(-1px);
            border-color: #BDBDBD;
        }
        .btn-reset:active {
            box-shadow: 0 2px 0 #E0E0E0;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px var(--star-glow)); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Solved State */
        .tile.solved {
            background-color: #E8F5E9;
        }
        .tile.solved canvas {
            filter: brightness(1.05);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .grid { width: 92vmin; height: 92vmin; }
            .controls { gap: 16px; }
            button { padding: 12px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <div class="logo-icon">
                <div class="logo-mouth"></div>
            </div>
            Cub n Pup
        </h1>
        <div class="subtitle">Connect the path to the star</div>
    </header>

    <main class="game-container">
        <div class="board-inner">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        // Connections: [Top, Right, Bottom, Left]
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = [];

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            // Generate Grid
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // Create DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    // Canvas
                    const canvas = document.createElement('canvas');
                    // Higher res for crispness
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                cell.appendChild(cub);
            } else if (type === 'star') {
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-token");
                // Better star path
                star.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                cell.appendChild(star);
            }
        }

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 28;
            const length = 85; // Distance from center

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = thickness;

            // Draw Shadow
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = thickness;
            ctx.shadowBlur = 0;
            ctx.translate(3, 3); // Offset shadow

            drawSegments(ctx, type, rotation);
            
            // Reset transform
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Draw Highlight (Inner Bevel)
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 4;
            drawSegments(ctx, type, rotation);

            // Draw Main Pipe
            ctx.strokeStyle = '#6D4C41';
            ctx.lineWidth = thickness;
            drawSegments(ctx, type, rotation);
            
            // Draw Center Hub (Smooths corners)
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2 + 1, 0, Math.PI * 2);
            ctx.fillStyle = '#6D4C41';
            ctx.fill();
        }

        function drawSegments(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const length = 85;
            
            const drawSeg = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length);
                if (dir === 1) ctx.lineTo(cx + length, cy);
                if (dir === 2) ctx.lineTo(cx, cy + length);
                if (dir === 3) ctx.lineTo(cx - length, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSeg(targetDir);
                }
            }
        }

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            btn.disabled = true;
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Simulate a path finding animation
            const pathIndices = [0, 1, 6, 11, 16]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.classList.add('solved');
                }, delay);
                delay += 250;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.backgroundColor = "#66BB6A";
                btn.style.boxShadow = "0 6px 0 #388E3C, 0 10px 15px rgba(0,0,0,0.15)";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.boxShadow = "";
                    btn.disabled = false;
                    tiles.forEach(t => t.classList.remove('solved'));
                }, 1500);
            }, delay + 500);
        }

        initGame();
    </script>
</body>
</html>
