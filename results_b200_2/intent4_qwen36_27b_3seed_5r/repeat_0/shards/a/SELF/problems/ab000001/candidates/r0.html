<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook / Clay & Wood */
            --bg-paper: #FDF6E3;
            --ink-dark: #2C241B;
            --ink-light: #6B5B4F;
            
            --wood-dark: #8D6E63;
            --wood-light: #A1887F;
            --wood-highlight: #D7CCC8;
            
            --tile-base: #FFF8E1;
            --tile-shadow: #D7CCC8;
            --tile-solved: #E8F5E9; /* Soft green for solved paths */
            
            --path-color: #5D4037;
            
            --cub-primary: #FF7043; /* Terracotta */
            --cub-shadow: #D84315;
            --cub-highlight: #FFAB91;
            
            --star-color: #FFCA28;
            --star-glow: #FFE082;

            --btn-primary: #FF7043;
            --btn-primary-hover: #F4511E;
            --btn-secondary: #78909C;
            --btn-secondary-hover: #546E7A;

            --font-main: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            background-image: 
                radial-gradient(#E0E0E0 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: var(--font-main);
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -1px;
            color: var(--ink-dark);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Decorative Icon in Header */
        .header-icon {
            width: 40px;
            height: 40px;
            fill: var(--cub-primary);
            filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.1));
        }

        /* --- The Game Board (The Focal Point) --- */
        .game-container {
            position: relative;
            padding: 12px;
            background: var(--wood-dark);
            border-radius: 12px;
            box-shadow: 
                0 10px 25px rgba(44, 36, 27, 0.3),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The inner board frame */
        .board-frame {
            background: var(--wood-light);
            padding: 8px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            width: 85vmin;
            height: 85vmin;
            max-width: 500px;
            max-height: 500px;
            background: var(--wood-dark);
            border-radius: 2px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-base);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            box-shadow: 
                0 4px 0 var(--tile-shadow),
                0 5px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 
                0 2px 0 var(--tile-shadow),
                0 2px 2px rgba(0,0,0,0.1);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Game Elements (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            padding: 0; /* Gap handled by grid alignment */
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Cub (Player) */
        .cub-token {
            width: 60%;
            height: 60%;
            background: var(--cub-primary);
            border-radius: 12px;
            box-shadow: 
                inset 2px 2px 0 var(--cub-highlight),
                inset -2px -2px 0 var(--cub-shadow),
                0 4px 6px rgba(0,0,0,0.2);
            position: relative;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }
        
        /* Cub Face */
        .cub-token::after {
            content: '';
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 15%;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }
        .cub-token::before {
            content: '';
            position: absolute;
            top: 30%;
            left: 25%;
            width: 15%;
            height: 15%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 18px 0 0 #3E2723; /* Right eye */
        }

        /* The Star (Goal) */
        .star-token {
            width: 50%;
            height: 50%;
            fill: var(--star-color);
            filter: drop-shadow(0 0 5px var(--star-glow));
            animation: pulse 2s infinite;
            z-index: 5;
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }

        .btn-run {
            background-color: var(--btn-primary);
            color: white;
            box-shadow: 0 4px 0 var(--cub-shadow);
        }
        .btn-run:hover {
            background-color: var(--btn-primary-hover);
        }

        .btn-reset {
            background-color: white;
            color: var(--ink-light);
            border: 2px solid #E0E0E0;
        }
        .btn-reset:hover {
            background-color: #F5F5F5;
            color: var(--ink-dark);
            border-color: #BDBDBD;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 8px var(--star-glow)); }
        }

        /* --- Responsive Tweaks --- */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .grid { width: 90vmin; height: 90vmin; }
        }

    </style>
</head>
<body>

    <header>
        <h1>
            <svg class="header-icon" viewBox="0 0 100 100">
                <rect x="10" y="10" width="80" height="80" rx="20" fill="currentColor" />
                <circle cx="35" cy="40" r="8" fill="#3E2723" />
                <circle cx="65" cy="40" r="8" fill="#3E2723" />
                <rect x="40" y="60" width="20" height="6" rx="3" fill="#3E2723" />
            </svg>
            Cub n Pup
        </h1>
        <div class="subtitle">Connect the path to the star</div>
    </header>

    <main class="game-container">
        <div class="board-frame">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star to sit on top of tiles -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: 0=Empty, 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        // Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight (N-S)
            2: [1, 1, 0, 0], // Corner (N-E)
            3: [1, 1, 1, 0], // T-Junction (N-E-S)
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = []; // Stores { type, rotation }

        // --- Initialization ---

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            // Generate Grid
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Create logic state
                    // Randomize type and rotation for demo purposes
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4); // 0, 1, 2, 3 (90deg steps)
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // Create DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    // Canvas for drawing the pipe
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    // Click to rotate interaction
                    tile.addEventListener('click', () => rotateTile(x, y));

                    gridEl.appendChild(tile);

                    // Create Overlay Cell (Empty initially)
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            // Place Cub (Start) at 0,0
            placeEntity(0, 0, 'cub');
            // Place Star (Goal) at 4,4
            placeEntity(4, 4, 'star');

            // Initial Draw
            drawBoard();
        }

        function placeEntity(x, y, type) {
            // Find the corresponding overlay cell
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                cell.appendChild(cub);
            } else if (type === 'star') {
                // SVG Star
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-token");
                star.innerHTML = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
                cell.appendChild(star);
            }
        }

        // --- Drawing Logic ---

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                // Clear
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Path
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 24;
            const length = 80; // distance from center to edge

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = thickness;
            ctx.strokeStyle = '#5D4037'; // Dark wood ink
            ctx.shadowColor = 'rgba(255,255,255,0.5)';
            ctx.shadowBlur = 2;
            ctx.shadowOffsetX = -2;
            ctx.shadowOffsetY = -2;

            // Helper to draw a line segment
            const drawSegment = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length); // Top
                if (dir === 1) ctx.lineTo(cx + length, cy); // Right
                if (dir === 2) ctx.lineTo(cx, cy + length); // Bottom
                if (dir === 3) ctx.lineTo(cx - length, cy); // Left
                ctx.stroke();
            };

            // Get base connections
            let conns = TILE_TYPES[type];
            
            // Apply rotation logic
            // Rot 1 (90deg): T->R, R->B, B->L, L->T
            // Rot 2 (180): T->B, R->L...
            // Rot 3 (270): T->L...
            
            // Map current connections to rotated indices
            // Original: [0, 1, 2, 3]
            // Rotated index = (original_index + rotation) % 4
            
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }

            // Draw Center Hub (to smooth corners)
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2, 0, Math.PI * 2);
            ctx.fillStyle = '#5D4037';
            ctx.fill();
        }

        // --- Actions ---

        function resetGame() {
            // Simple reset: just re-randomize
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            
            // Visual feedback: highlight a path (simulated for design)
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Simulate a path finding animation from start to end
            // Just highlighting a few tiles for visual effect
            const pathIndices = [0, 1, 6, 11, 16]; // A diagonal-ish path
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.style.backgroundColor = '#E8F5E9'; // Success green
                    t.style.boxShadow = '0 4px 0 #A5D6A7, 0 5px 5px rgba(0,0,0,0.1)';
                }, delay);
                delay += 200;
            });

            setTimeout(() => {
                btn.innerText = "Solved!";
                btn.style.backgroundColor = "#66BB6A"; // Green
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; // Reset
                    // Reset tiles
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                        t.style.boxShadow = '';
                    });
                }, 1500);
            }, delay + 500);
        }

        // Start
        initGame();

    </script>
</body>
</html>
