<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Skill Ascension</title>
<style>
    :root {
        --bg-deep: #030508;
        --bg-panel: rgba(12, 16, 24, 0.75);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-glow: rgba(0, 240, 255, 0.3);
        
        --accent-cyan: #00f0ff;
        --accent-violet: #7000ff;
        --accent-gold: #ffd700;
        
        --text-primary: #ffffff;
        --text-secondary: #94a3b8;
        --text-dim: #475569;

        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; outline: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background FX --- */
    .bg-fx {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        pointer-events: none;
    }

    /* Subtle Grid */
    .grid-pattern {
        position: absolute;
        width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
        -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
    }

    /* Ambient Glow */
    .ambient-glow {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 120%;
        height: 120%;
        background: radial-gradient(circle, rgba(112, 0, 255, 0.08) 0%, transparent 60%);
        mix-blend-mode: screen;
    }

    /* --- Header --- */
    header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(3, 5, 8, 0.8);
        backdrop-filter: blur(12px);
        z-index: 100;
    }

    .brand {
        font-family: var(--font-display);
        font-size: 1.5rem;
        letter-spacing: 4px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .brand-icon {
        width: 28px;
        height: 28px;
        fill: var(--accent-cyan);
        filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    .nav-links {
        display: flex;
        gap: 40px;
    }

    .nav-links span {
        font-size: 0.8rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
    }

    .nav-links span:hover {
        color: var(--accent-cyan);
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    /* --- Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar --- */
    aside {
        width: 340px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-subtle);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        backdrop-filter: blur(10px);
        z-index: 10;
    }

    /* Avatar */
    .character-card {
        text-align: center;
    }

    .avatar-frame {
        width: 110px;
        height: 110px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 2px solid var(--accent-cyan);
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.1);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 30%, #1a202c, #000);
    }

    /* SVG Avatar Art */
    .avatar-art {
        width: 70%;
        height: 70%;
        fill: #1e293b;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.6rem;
        margin: 0;
        color: var(--text-primary);
        letter-spacing: 1px;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-cyan);
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-top: 8px;
        font-weight: 600;
    }

    /* Stats */
    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 16px;
        border-top: 1px solid var(--border-subtle);
        padding-top: 25px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
    }
    
    .stat-label { color: var(--text-secondary); }
    .stat-value { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }

    /* XP Bar */
    .xp-container {
        margin-top: 5px;
    }
    
    .xp-bar-bg {
        height: 4px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 10px;
        position: relative;
    }
    
    .xp-bar-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
        box-shadow: 0 0 10px var(--accent-cyan);
        position: relative;
    }
    
    /* Shine effect on bar */
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* Points Box */
    .points-available {
        background: linear-gradient(145deg, rgba(255, 215, 0, 0.05), rgba(0,0,0,0));
        border: 1px solid rgba(255, 215, 0, 0.15);
        padding: 20px;
        border-radius: 4px;
        text-align: center;
        margin-top: auto;
        position: relative;
        overflow: hidden;
    }

    .points-available::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }

    .points-count {
        font-size: 3rem;
        font-weight: 700;
        color: var(--accent-gold);
        line-height: 1;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        font-family: var(--font-display);
    }
    
    .points-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: rgba(255, 215, 0, 0.8);
        margin-top: 8px;
        font-weight: 600;
    }

    /* --- Main Tree Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, transparent 0%, #000 120%);
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform: translate(-50%, -50%);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        backdrop-filter: blur(4px);
    }

    .node::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px solid transparent;
        transition: all 0.3s;
    }

    .node svg {
        width: 28px;
        height: 28px;
        fill: var(--text-dim);
        transition: all 0.3s;
        opacity: 0.7;
    }

    /* Locked */
    .node.locked {
        background: rgba(10, 12, 16, 0.8);
        border-color: rgba(255, 255, 255, 0.05);
    }

    /* Unlocked */
    .node.unlocked {
        border-color: var(--accent-cyan);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1);
    }
    .node.unlocked svg { 
        fill: var(--accent-cyan); 
        opacity: 1;
        filter: drop-shadow(0 0 5px var(--accent-cyan));
    }
    .node.unlocked:hover {
        transform: translate(-50%, -50%) scale(1.15);
        background: rgba(0, 240, 255, 0.1);
    }

    /* Maxed */
    .node.maxed {
        border-color: var(--accent-gold);
        background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, rgba(15, 23, 42, 0.9) 100%);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 10px rgba(255, 215, 0, 0.1);
    }
    .node.maxed svg { 
        fill: var(--accent-gold); 
        opacity: 1;
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }
    .node.maxed:hover {
        transform: translate(-50%, -50%) scale(1.15);
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    }

    /* Apex (Special) */
    .node.apex {
        width: 76px;
        height: 76px;
        border: 2px solid var(--accent-violet);
        box-shadow: 0 0 30px rgba(112, 0, 255, 0.3);
    }
    .node.apex svg { width: 32px; height: 32px; fill: var(--accent-violet); }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(10, 14, 23, 0.95);
        border: 1px solid var(--accent-cyan);
        padding: 20px;
        width: 260px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.2s ease;
        z-index: 200;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
    }

    .tooltip.visible { 
        opacity: 1; 
        transform: translateY(0); 
    }
    
    .tooltip::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 2px;
        background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
    }

    .tooltip h3 {
        margin: 0 0 8px;
        font-family: var(--font-display);
        color: var(--text-primary);
        font-size: 1.1rem;
        letter-spacing: 0.5px;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 15px;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-cyan);
        border-top: 1px solid var(--border-subtle);
        padding-top: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Animations */
    @keyframes pulse-ring {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
        100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }

    .node.upgrading::after {
        content: '';
        position: absolute;
        width: 100%; height: 100%;
        border-radius: 50%;
        border: 2px solid var(--accent-cyan);
        animation: pulse-ring 0.8s ease-out;
    }

</style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-fx">
    <div class="grid-pattern"></div>
    <div class="ambient-glow"></div>
</div>

<header>
    <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        ARCANUM
    </div>
    <div class="nav-links">
        <span>Inventory</span>
        <span>Quests</span>
        <span>Settings</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <div class="character-card">
            <div class="avatar-frame">
                <!-- Detailed SVG Avatar -->
                <svg class="avatar-art" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <!-- Shoulders -->
                    <path d="M20,35 Q50,15 80,35 L90,80 L10,80 Z" fill="url(#armorGrad)" stroke="#00f0ff" stroke-width="1"/>
                    <!-- Hood -->
                    <path d="M35,35 Q50,10 65,35 L60,60 Q50,70 40,60 Z" fill="#020617"/>
                    <!-- Glowing Eyes -->
                    <circle cx="45" cy="45" r="2" fill="#00f0ff" filter="drop-shadow(0 0 3px #00f0ff)"/>
                    <circle cx="55" cy="45" r="2" fill="#00f0ff" filter="drop-shadow(0 0 3px #00f0ff)"/>
                    <!-- Chest Emblem -->
                    <path d="M45,65 L50,60 L55,65 L50,70 Z" fill="#7000ff" opacity="0.8"/>
                </svg>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="stat-block">
            <div class="stat-row">
                <span class="stat-label">Level</span>
                <span class="stat-value">42</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Strength</span>
                <span class="stat-value">124</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Dexterity</span>
                <span class="stat-value">89</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Intelligence</span>
                <span class="stat-value">210</span>
            </div>
            
            <div class="xp-container">
                <div class="stat-row">
                    <span class="stat-label">Experience</span>
                    <span class="stat-value">7,500 / 10,000</span>
                </div>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="points-available">
            <div class="points-count" id="sp-display">3</div>
            <div class="points-label">Available Points</div>
        </div>
    </aside>

    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-container" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats" id="tt-stats">+10% Damage</div>
        </div>
    </main>
</div>

<script>
    /**
     * Data Structure
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute', type: 'star' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength', type: 'sword' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown', type: 'orb' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance', type: 'sword' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal', type: 'star' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP', type: 'orb' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill', type: 'sword' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed', type: 'star' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed', type: 'orb' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill', type: 'orb' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%', type: 'apex' }
    ];

    // Connections
    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            if(skill.id === 'apex') el.classList.add('apex');
            
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Icons
            let iconPath = '';
            if(skill.type === 'sword') iconPath = '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>'; 
            else if(skill.type === 'orb') iconPath = '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#000" opacity="0.3"/>'; 
            else if(skill.type === 'apex') iconPath = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
            else iconPath = '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>';

            el.innerHTML = `<svg viewBox="0 0 24 24">${iconPath}</svg>`;
            
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Bezier Logic
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;

            // Draw Base Line (Dark)
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Draw Active Line
            if (isUnlocked) {
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
                
                // Glow Effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Reset shadow for next
                ctx.shadowBlur = 0;
            } else if (isPath) {
                // Path is available but not fully unlocked
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
                ctx.strokeStyle = 'rgba(100, 116, 139, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        // Simple parent check (In a real graph, we'd traverse)
        // For this demo, we assume if you can click it, you can buy it, 
        // but we check points and max level.
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 800);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        
        let statsText = skill.stat;
        if (skill.level < skill.max) {
            statsText += ` (Lvl ${skill.level}/${skill.max})`;
        } else {
            statsText += ` (MAXED)`;
        }
        document.getElementById('tt-stats').textContent = statsText;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
