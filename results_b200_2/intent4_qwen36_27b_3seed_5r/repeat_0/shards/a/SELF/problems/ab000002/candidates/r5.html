<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Ascension</title>
<style>
    :root {
        /* Palette: Deep Void & Ethereal */
        --bg-dark: #030305;
        --bg-panel: rgba(10, 14, 20, 0.7);
        --bg-panel-solid: #0a0e14;
        --border-dim: rgba(255, 255, 255, 0.04);
        --border-light: rgba(255, 255, 255, 0.1);
        
        --c-primary: #00f0ff;   /* Cyan */
        --c-primary-glow: rgba(0, 240, 255, 0.4);
        --c-secondary: #7000ff; /* Violet */
        --c-secondary-glow: rgba(112, 0, 255, 0.4);
        --c-gold: #ffd700;      /* Gold */
        --c-gold-glow: rgba(255, 215, 0, 0.4);
        --c-danger: #ff3366;
        
        --text-main: #e2e8f0;
        --text-muted: #64748b;
        --text-dim: #334155;

        /* Typography */
        --font-head: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'Consolas', 'Courier New', monospace;
    }

    * { box-sizing: border-box; user-select: none; outline: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-rows: 70px 1fr;
        grid-template-columns: 340px 1fr;
        font-size: 14px;
    }

    /* --- Global Background FX --- */
    .bg-layer {
        position: absolute;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 30%, rgba(112, 0, 255, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 30%),
            var(--bg-dark);
        pointer-events: none;
    }

    /* Vignette */
    .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 40%, #000000 100%);
        pointer-events: none;
        z-index: 1;
    }

    /* --- Header --- */
    header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: rgba(3, 3, 5, 0.8);
        border-bottom: 1px solid var(--border-dim);
        backdrop-filter: blur(10px);
        z-index: 100;
    }

    .brand {
        font-family: var(--font-head);
        font-size: 1.4rem;
        letter-spacing: 4px;
        color: var(--text-main);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 600;
        opacity: 0.9;
    }
    
    .brand-logo {
        width: 18px;
        height: 18px;
        fill: var(--c-primary);
        filter: drop-shadow(0 0 8px var(--c-primary));
    }

    .nav { display: flex; gap: 40px; }
    .nav-item {
        font-size: 0.7rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 500;
        position: relative;
    }
    .nav-item:hover { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    .nav-item.active::after {
        content: '';
        position: absolute;
        bottom: -26px; left: 0; width: 100%; height: 1px;
        background: var(--c-primary);
        box-shadow: 0 0 10px var(--c-primary);
    }

    /* --- Sidebar --- */
    aside {
        background: linear-gradient(180deg, rgba(10, 14, 20, 0.95) 0%, rgba(5, 5, 7, 0.95) 100%);
        border-right: 1px solid var(--border-dim);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        z-index: 10;
        position: relative;
    }

    /* Profile Card */
    .profile { text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; }
    
    .avatar-container {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
    }

    /* Animated Rotating Ring */
    .avatar-ring {
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: var(--c-primary);
        border-bottom-color: var(--c-secondary);
        opacity: 0.6;
        animation: spin 8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle at center, #1e293b, #0f172a);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--border-dim);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .char-name {
        font-family: var(--font-head);
        font-size: 1.8rem;
        margin: 0;
        letter-spacing: 1px;
        color: var(--text-main);
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    
    .char-title {
        color: var(--c-primary);
        font-size: 0.7rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-top: 5px;
        font-weight: 700;
        opacity: 0.8;
        text-shadow: 0 0 10px var(--c-primary-glow);
    }

    /* Stats */
    .stats-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-top: 25px;
        border-top: 1px solid var(--border-dim);
        width: 100%;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.95rem;
        align-items: center;
        padding: 0 5px;
        border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .stat-lbl { color: var(--text-muted); font-weight: 400; letter-spacing: 0.5px; }
    .stat-val { font-weight: 600; color: var(--text-main); font-family: var(--font-mono); letter-spacing: 0.5px; }

    /* XP Bar */
    .xp-wrapper { margin-top: 10px; width: 100%; }
    .xp-track {
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    }
    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--c-secondary), var(--c-primary));
        position: relative;
        box-shadow: 0 0 10px var(--c-secondary);
    }
    /* Shine effect on XP bar */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shine 3s infinite;
    }
    @keyframes shine { 100% { transform: translateX(100%); } }

    /* Points Box */
    .points-box {
        margin-top: auto;
        background: linear-gradient(160deg, rgba(255, 215, 0, 0.05), transparent);
        border: 1px solid rgba(255, 215, 0, 0.2);
        border-radius: 4px;
        padding: 25px;
        text-align: center;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        transition: all 0.3s ease;
        cursor: default;
    }
    
    .points-box:hover {
        border-color: rgba(255, 215, 0, 0.5);
        background: linear-gradient(160deg, rgba(255, 215, 0, 0.1), transparent);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
    }

    .pts-num {
        font-family: var(--font-mono);
        font-size: 3.5rem;
        line-height: 1;
        color: var(--c-gold);
        text-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        font-weight: 700;
        letter-spacing: -2px;
    }
    .pts-lbl {
        font-size: 0.65rem;
        letter-spacing: 3px;
        color: var(--c-gold);
        opacity: 0.8;
        margin-top: 10px;
        text-transform: uppercase;
        font-weight: 700;
    }

    /* --- Main Content (Tree) --- */
    main {
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Subtle radial gradient in center of main area */
        background: radial-gradient(circle at 50% 50%, rgba(20, 20, 30, 0.3) 0%, transparent 60%);
    }
    main:active { cursor: grabbing; }

    /* Canvas for lines */
    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    /* Grid Overlay */
    .grid-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 80px 80px;
        z-index: 0;
        pointer-events: none;
        mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    }

    /* Nodes Container */
    #node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        transform-origin: center center;
    }

    /* Node Styling */
    .node {
        position: absolute;
        width: 56px;
        height: 56px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(10, 12, 18, 0.8);
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        z-index: 2;
        backdrop-filter: blur(4px);
    }

    /* Inner glow for node */
    .node::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .node svg {
        width: 24px;
        height: 24px;
        fill: var(--text-dim);
        transition: all 0.4s;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Node States */
    .node.locked { opacity: 0.5; }
    .node.locked:hover { transform: translate(-50%, -50%) scale(1.1); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
    
    /* Unlocked: Cyan Glow */
    .node.unlocked {
        border-color: var(--c-primary);
        background: radial-gradient(circle at 30% 30%, rgba(0, 240, 255, 0.1), rgba(10, 12, 18, 0.95));
        box-shadow: 0 0 20px var(--c-primary-glow), inset 0 0 5px rgba(0, 240, 255, 0.2);
    }
    .node.unlocked::before { opacity: 1; box-shadow: inset 0 0 10px var(--c-primary); }
    .node.unlocked svg {
        fill: var(--c-primary);
        filter: drop-shadow(0 0 5px var(--c-primary));
    }
    .node.unlocked:hover {
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow: 0 0 30px var(--c-primary-glow);
        z-index: 10;
    }

    /* Maxed: Gold Glow */
    .node.maxed {
        border-color: var(--c-gold);
        background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.15), rgba(10, 12, 18, 0.95));
        box-shadow: 0 0 25px var(--c-gold-glow), inset 0 0 5px rgba(255, 215, 0, 0.2);
    }
    .node.maxed svg { fill: var(--c-gold); filter: drop-shadow(0 0 5px var(--c-gold)); }

    /* Apex: Violet Glow */
    .node.apex {
        width: 70px; height: 70px;
        border: 1px solid var(--c-secondary);
        background: radial-gradient(circle at 30% 30%, rgba(112, 0, 255, 0.2), rgba(10, 12, 18, 0.95));
        box-shadow: 0 0 30px var(--c-secondary-glow), inset 0 0 15px rgba(112, 0, 255, 0.1);
    }
    .node.apex svg { fill: var(--c-secondary); width: 30px; height: 30px; filter: drop-shadow(0 0 6px var(--c-secondary)); }
    .node.apex:hover { box-shadow: 0 0 50px var(--c-secondary-glow); transform: translate(-50%, -50%) scale(1.15); }

    /* Tooltip */
    .tooltip {
        position: absolute;
        width: 260px;
        background: rgba(10, 12, 18, 0.95);
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--c-primary);
        padding: 18px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translate(20px, 20px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        backdrop-filter: blur(15px);
        box-shadow: 0 15px 50px rgba(0,0,0,0.9);
    }
    .tooltip.show { opacity: 1; transform: translate(0, 0); }
    
    .tt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-dim); padding-bottom: 10px; }
    .tt-title { font-family: var(--font-head); font-size: 1.2rem; color: var(--text-main); letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .tt-cost { font-size: 0.7rem; color: var(--c-gold); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-mono); background: rgba(255,215,0,0.1); padding: 2px 6px; border-radius: 2px; }
    .tt-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 15px; font-style: italic; }
    .tt-stat { 
        font-size: 0.75rem; color: var(--c-primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        background: rgba(0, 240, 255, 0.05);
        padding: 8px 12px;
        border-radius: 2px;
        display: inline-block;
        border: 1px solid rgba(0, 240, 255, 0.15);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.05);
    }

    /* Upgrade Animation */
    @keyframes pulse-ring {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; border-width: 2px; }
        100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; border-width: 0px; }
    }
    .node.upgrading::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--c-primary);
        animation: pulse-ring 0.6s ease-out forwards;
    }
    
    /* Particle burst effect */
    @keyframes particle-float {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
    .particle {
        position: absolute;
        width: 6px; height: 6px;
        background: var(--c-primary);
        border-radius: 50%;
        pointer-events: none;
        z-index: 20;
        box-shadow: 0 0 10px var(--c-primary);
        animation: particle-float 0.8s ease-out forwards;
    }

</style>
</head>
<body>

<!-- Backgrounds -->
<div class="bg-layer"></div>
<div class="vignette"></div>

<header>
    <div class="brand">
        <!-- Diamond Logo -->
        <svg class="brand-logo" viewBox="0 0 24 24">
            <path d="M12 2L2 12l10 10 10-10L12 2z"/>
        </svg>
        ARCANUM
    </div>
    <div class="nav">
        <div class="nav-item">Inventory</div>
        <div class="nav-item active">Ascension</div>
        <div class="nav-item">Quests</div>
    </div>
</header>

<aside>
    <div class="profile">
        <div class="avatar-container">
            <div class="avatar-ring"></div>
            <div class="avatar-inner">
                <!-- Stylized Hooded Figure SVG -->
                <svg viewBox="0 0 100 100" style="width: 65%; height: 65%;">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M20,80 L80,80 L70,30 Q50,10 30,30 Z" fill="url(#grad1)" />
                    <circle cx="42" cy="45" r="2.5" fill="#00f0ff" filter="drop-shadow(0 0 4px #00f0ff)"/>
                    <circle cx="58" cy="45" r="2.5" fill="#00f0ff" filter="drop-shadow(0 0 4px #00f0ff)"/>
                    <path d="M45,60 L50,55 L55,60 L50,65 Z" fill="#7000ff" opacity="0.8"/>
                </svg>
            </div>
        </div>
        <h2 class="char-name">Kaelen</h2>
        <div class="char-title">Void Walker</div>
    </div>

    <div class="stats-list">
        <div class="stat-row"><span class="stat-lbl">Level</span><span class="stat-val">42</span></div>
        <div class="stat-row"><span class="stat-lbl">Strength</span><span class="stat-val">124</span></div>
        <div class="stat-row"><span class="stat-lbl">Dexterity</span><span class="stat-val">89</span></div>
        <div class="stat-row"><span class="stat-lbl">Intelligence</span><span class="stat-val">210</span></div>
        
        <div class="xp-wrapper">
            <div class="stat-row" style="margin-bottom: 8px; border:none;">
                <span class="stat-lbl">Experience</span>
                <span class="stat-val">7,500 / 10,000</span>
            </div>
            <div class="xp-track">
                <div class="xp-fill"></div>
            </div>
        </div>
    </div>

    <div class="points-box">
        <div class="pts-num" id="sp-display">3</div>
        <div class="pts-lbl">Available Points</div>
    </div>
</aside>

<main id="tree-container">
    <div class="grid-overlay"></div>
    <canvas id="tree-canvas"></canvas>
    <div id="node-layer"></div>
    
    <div class="tooltip" id="tooltip">
        <div class="tt-header">
            <div class="tt-title" id="tt-title">Skill Name</div>
            <div class="tt-cost" id="tt-cost">1 SP</div>
        </div>
        <div class="tt-desc" id="tt-desc">Skill description goes here.</div>
        <div class="tt-stat" id="tt-stat">+10% Damage</div>
    </div>
</main>

<script>
    // --- Data ---
    // Adjusted coordinates for a more balanced, centered tree structure
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 90, level: 1, max: 1, cost: 0, desc: 'The primordial source of your power.', stat: 'Base Attribute', type: 'star' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 70, level: 1, max: 3, cost: 1, desc: 'Increases physical impact.', stat: '+5% Strength', type: 'sword' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 70, level: 0, max: 3, cost: 1, desc: 'Channels mana faster.', stat: '-10% Cooldown', type: 'orb' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 50, level: 0, max: 3, cost: 2, desc: 'Mastery of heavy weapons.', stat: '+15% Crit Chance', type: 'sword' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 50, level: 1, max: 3, cost: 1, desc: 'Steals life from enemies.', stat: '+2% Lifesteal', type: 'star' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 50, level: 0, max: 3, cost: 2, desc: 'Absorbs damage with mana.', stat: '+10% Max HP', type: 'orb' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 30, level: 0, max: 1, cost: 3, desc: 'Ultimate seismic ability.', stat: 'Unlock Skill', type: 'sword' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 30, level: 0, max: 3, cost: 2, desc: 'Blink through shadows.', stat: '+5% Move Speed', type: 'star' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 30, level: 0, max: 3, cost: 2, desc: 'Distorts local time.', stat: '-20% Enemy Speed', type: 'orb' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 30, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill', type: 'orb' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 8, level: 0, max: 1, cost: 5, desc: 'Mastery over the void.', stat: 'ALL STATS +10%', type: 'apex' }
    ];

    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    // --- State ---
    let availablePoints = 3;
    let scale = 1;
    let panning = false;
    let startX = 0, startY = 0;
    let offsetX = 0, offsetY = 0;

    // --- Elements ---
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // --- Icons ---
    const icons = {
        sword: '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>', 
        orb: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#000" opacity="0.5"/>', 
        star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
        apex: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" transform="scale(1.2) translate(-3, -3)"/>'
    };

    // --- Init ---
    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            const statusClass = skill.level === 0 ? 'locked' : (skill.level === skill.max ? 'maxed' : 'unlocked');
            el.className = `node ${statusClass} ${skill.id === 'apex' ? 'apex' : ''}`;
            
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            el.innerHTML = `<svg viewBox="0 0 24 24">${icons[skill.type]}</svg>`;
            
            // Events
            el.addEventListener('click', (e) => upgradeSkill(skill, e));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Drawing ---
    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        // Apply Pan/Zoom
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            // Convert % to pixels
            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            // Bezier Curve Logic (S-Curve)
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;

            // Check connection status
            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // 1. Base Line (Always visible but dim)
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 2. Active Glow Line
            if (isUnlocked) {
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
                
                // Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.shadowBlur = 0;
            } else if (isPath) {
                // Path available (Parent unlocked, Child locked)
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        ctx.restore();
    }

    // --- Logic ---
    function createParticles(x, y) {
        for(let i=0; i<10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 30;
            p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
            container.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
    }

    function upgradeSkill(skill, e) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Trigger Animation
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 600);

        // Particles
        const rect = node.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        createParticles(rect.left - containerRect.left + rect.width/2, rect.top - containerRect.top + rect.height/2);

        drawConnections();
    }

    function showTooltip(e, skill) {
        // Position logic
        const rect = container.getBoundingClientRect();
        // Offset slightly from mouse
        const x = e.clientX - rect.left + 20; 
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        
        const costEl = document.getElementById('tt-cost');
        if (skill.level >= skill.max) {
            costEl.textContent = "MAXED";
            costEl.style.color = "var(--c-gold)";
        } else {
            costEl.textContent = `${skill.cost} SP`;
            costEl.style.color = availablePoints >= skill.cost ? "var(--c-primary)" : "var(--c-danger)";
        }

        // Boundary check (simple)
        const ttWidth = 300;
        const finalX = (x + ttWidth > rect.width) ? x - ttWidth - 40 : x;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('show');
    }

    function hideTooltip() {
        tooltip.classList.remove('show');
    }

    // --- Interaction (Pan) ---
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container || e.target.classList.contains('grid-overlay')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Start ---
    window.addEventListener('resize', resize);
    createNodes();
    // Small delay to ensure layout is settled
    setTimeout(resize, 50);

</script>
</body>
</html>
