<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Artisan Cleaning</title>
    <style>
        :root {
            --bg-wall: #F2EFE9;
            --bg-floor: #E6E0D4;
            --text-main: #1C1917;
            --text-sub: #57534E;
            --accent-green: #15803D;
            --accent-green-hover: #166534;
            --accent-red: #DC2626;
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- UI Layer --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 4rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            mix-blend-mode: multiply; /* Allows the floor texture to subtly show through text if desired, or keeps it clean */
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-transform: uppercase;
            z-index: 20;
        }

        .brand-icon {
            width: 12px;
            height: 12px;
            background-color: var(--accent-green);
            border-radius: 50%;
            position: relative;
        }
        
        .brand-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: rgba(21, 128, 61, 0.2);
        }

        nav ul {
            display: flex;
            gap: 3.5rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            opacity: 0.7;
        }

        nav a:hover {
            color: var(--accent-green);
            opacity: 1;
        }

        .hero-content {
            max-width: 520px;
            pointer-events: auto;
            margin-bottom: 1rem;
            z-index: 20;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            /* Subtle texture on text */
            text-shadow: 0 1px 0 rgba(255,255,255,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            line-height: 1.5;
            color: var(--text-sub);
            margin-bottom: 2.5rem;
            font-weight: 400;
            max-width: 380px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--text-main);
            color: #fff;
            padding: 1.1rem 2.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-xl);
            letter-spacing: 0.01em;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent-green);
            box-shadow: 0 15px 30px rgba(21, 128, 61, 0.3);
        }

        /* --- The Scene --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Warm gradient background */
            background: linear-gradient(to bottom, #F5F2EC 0%, #EBE5D9 100%);
        }

        svg.main-scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- SVG Animations --- */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; transform: translateY(-10px) scale(1); }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }

        .bubble-anim {
            animation: floatBubble 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .ui-layer { padding: 1.5rem; }
            h1 { font-size: 3.5rem; }
            nav { display: none; }
            .hero-content { margin-bottom: 0; }
            .brand-icon { display: none; }
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header>
            <div class="brand">
                <span class="brand-icon"></span>
                Scrub & Shine
            </div>
            <nav>
                <ul>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <div class="hero-content">
            <h1>Make it<br>Shine Again.</h1>
            <p class="subtitle">Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.</p>
            <button class="cta-btn" id="cleanBtn">Start Cleaning</button>
        </div>
    </div>

    <!-- SVG Scene -->
    <div class="scene-container">
        <svg class="main-scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="blur-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="10" dy="25" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="wet-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>

                <filter id="soft-glow">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Wood Floor Pattern (Premium Texture) -->
                <pattern id="woodPattern" width="200" height="1200" patternUnits="userSpaceOnUse">
                    <!-- Base -->
                    <rect width="200" height="1200" fill="#E8E0D5" />
                    
                    <!-- Planks -->
                    <rect x="0" y="0" width="198" height="1200" fill="#F0EAE2" rx="1"/>
                    
                    <!-- Grain Texture (Subtle) -->
                    <path d="M0,100 Q100,120 200,100 M0,300 Q100,280 200,300 M0,600 Q100,620 200,600 M0,900 Q100,880 200,900" stroke="#DCD3C6" stroke-width="2" fill="none" opacity="0.5"/>
                    <path d="M0,150 Q50,155 100,150 M0,450 Q50,445 100,450" stroke="#DCD3C6" stroke-width="1" fill="none" opacity="0.3"/>
                    
                    <!-- Knots -->
                    <g transform="translate(100, 400)">
                        <ellipse cx="0" cy="0" rx="12" ry="4" fill="#D6CDBA" opacity="0.6" transform="rotate(90)"/>
                        <ellipse cx="0" cy="0" rx="4" ry="1.5" fill="#C2B7A5" opacity="0.8" transform="rotate(90)"/>
                    </g>
                    <g transform="translate(100, 850)">
                        <ellipse cx="0" cy="0" rx="10" ry="3" fill="#D6CDBA" opacity="0.6" transform="rotate(90)"/>
                    </g>
                </pattern>

                <!-- Gradient for the Mess (Richer, Glossy) -->
                <radialGradient id="messGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#B91C1C;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#7F1D1D;stop-opacity:1" />
                </radialGradient>

                <!-- Highlight for Glossy Liquid -->
                <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#fff;stop-opacity:0.4" />
                    <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                </linearGradient>
                
                <!-- Gradient for Mop Handle (Realistic Wood) -->
                <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#5D4037" />
                    <stop offset="20%" style="stop-color:#795548" />
                    <stop offset="50%" style="stop-color:#8D6E63" />
                    <stop offset="80%" style="stop-color:#795548" />
                    <stop offset="100%" style="stop-color:#5D4037" />
                </linearGradient>
            </defs>

            <!-- 1. The Floor -->
            <g id="floor">
                <!-- Planks -->
                <rect x="-100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="300" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="500" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="700" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="900" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="1100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                
                <!-- Plank Gaps (Realistic depth) -->
                <g stroke="#D6CFC3" stroke-width="3">
                    <line x1="0" y1="0" x2="0" y2="900" />
                    <line x1="200" y1="0" x2="200" y2="900" />
                    <line x1="400" y1="0" x2="400" y2="900" />
                    <line x1="600" y1="0" x2="600" y2="900" />
                    <line x1="800" y1="0" x2="800" y2="900" />
                    <line x1="1000" y1="0" x2="1000" y2="900" />
                    <line x1="1200" y1="0" x2="1200" y2="900" />
                </g>
                <!-- Darker shadow inside gaps for depth -->
                <g stroke="#BDB4A5" stroke-width="1" opacity="0.5">
                    <line x1="3" y1="0" x2="3" y2="900" />
                    <line x1="203" y1="0" x2="203" y2="900" />
                    <line x1="403" y1="0" x2="403" y2="900" />
                    <line x1="603" y1="0" x2="603" y2="900" />
                    <line x1="803" y1="0" x2="803" y2="900" />
                    <line x1="1003" y1="0" x2="1003" y2="900" />
                </g>
            </g>

            <!-- 2. The Mess (Spilled Soup) -->
            <g id="mess-group" transform="translate(750, 650)">
                <!-- Wet Shadow on Floor (Darkens the wood) -->
                <path d="M-160,0 C-160,-70 -100,-80 -60,-70 C0,-90 80,-80 110,-60 C150,-70 170,-40 160,20 C150,80 100,100 60,90 C-10,100 -160,70 -160,0 Z" fill="#000" opacity="0.12" filter="url(#wet-blur)"/>
                
                <!-- Main Puddle Body -->
                <path id="main-puddle" d="M-140,0 C-140,-55 -90,-65 -50,-60 C0,-75 70,-75 95,-55 C130,-65 155,-40 145,10 C135,65 95,85 55,75 C-5,85 -140,75 -140,0 Z" fill="url(#messGradient)" />
                
                <!-- Glossy Highlight (The "Wet" look) -->
                <ellipse cx="-40" cy="-20" rx="35" ry="12" fill="#fff" opacity="0.25" transform="rotate(-15 -40 -20)"/>
                <ellipse cx="75" cy="30" rx="15" ry="6" fill="#fff" opacity="0.2" transform="rotate(-15 75 30)"/>

                <!-- Splatters (Organic) -->
                <g fill="#B91C1C">
                    <circle cx="-170" cy="-10" r="14" />
                    <circle cx="-155" cy="30" r="7" />
                    <circle cx="160" cy="50" r="18" />
                    <circle cx="180" cy="30" r="10" />
                    <circle cx="-30" cy="-100" r="8" />
                    <circle cx="120" cy="-90" r="12" />
                </g>
                
                <!-- Drips (3D effect) -->
                <path d="M-100,60 Q-105,100 -102,105 A 4 4 0 0 0 -94 105 Q-95,100 -100,60 Z" fill="#7F1D1D" /> <!-- Darker drip -->
                <path d="M60,75 Q65,110 62,115 A 4 4 0 0 0 54 115 Q55,110 60,75 Z" fill="#7F1D1D" />
            </g>

            <!-- 3. The Mop -->
            <g id="mop-group" transform="translate(750, 650) rotate(15)">
                <!-- Shadow -->
                <ellipse cx="0" cy="25" rx="55" ry="45" fill="#000" opacity="0.25" filter="url(#blur-shadow)"/>

                <!-- Handle -->
                <g transform="translate(0, -190)">
                    <!-- Wood Handle -->
                    <rect x="-8" y="-340" width="16" height="390" rx="8" fill="url(#handleGradient)" />
                    <!-- Highlight on Handle -->
                    <rect x="-4" y="-340" width="3" height="390" fill="#fff" opacity="0.15" rx="1.5"/>
                    
                    <!-- Metal/Plastic connector -->
                    <rect x="-12" y="30" width="24" height="30" rx="3" fill="#37474F" />
                    <rect x="-12" y="30" width="24" height="5" fill="#78909C" opacity="0.6"/>
                    <rect x="-8" y="60" width="16" height="10" fill="#263238"/>
                </g>

                <!-- Mop Head (Strings) -->
                <g transform="translate(0, 0)">
                    <!-- Base Plate -->
                    <ellipse cx="0" cy="0" rx="45" ry="40" fill="#37474F" opacity="0.9"/>
                    
                    <!-- Strings (Detailed curves) -->
                    <g stroke="#5D4037" stroke-width="4" fill="none" stroke-linecap="round">
                        <path d="M-35,-10 Q-45,0 -35,20" />
                        <path d="M-25,-20 Q-35,0 -25,30" />
                        <path d="M-15,-30 Q-25,0 -15,35" />
                        <path d="M-5,-35 Q-15,0 -5,38" />
                        <path d="M5,-35 Q15,0 5,38" />
                        <path d="M15,-30 Q25,0 15,35" />
                        <path d="M25,-20 Q35,0 25,30" />
                        <path d="M35,-10 Q45,0 35,20" />
                    </g>
                    
                    <!-- Wet sheen on strings -->
                    <g stroke="#A1887F" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
                        <path d="M-25,-20 Q-35,0 -25,30" />
                        <path d="M15,-30 Q25,0 15,35" />
                    </g>
                </g>
            </g>
            
            <!-- 4. Bubbles Container -->
            <g id="bubbles"></g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const messGroup = document.getElementById('mess-group');
            const cleanBtn = document.getElementById('cleanBtn');
            const bubblesContainer = document.getElementById('bubbles');
            
            // State
            let isCleaning = false;
            let scrubInterval;

            // Parallax Effect (Smoother)
            document.addEventListener('mousemove', (e) => {
                if(isCleaning) return;

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                // Subtle movement
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                const moveX = deltaX * 20; 
                const moveY = deltaY * 15;
                const tilt = deltaX * 5;

                // Update transform directly
                mopGroup.setAttribute('transform', `translate(${750 + moveX}, ${650 + moveY}) rotate(${15 + tilt})`);
            });

            // Cleaning Logic
            cleanBtn.addEventListener('click', () => {
                if (isCleaning) return;
                
                isCleaning = true;
                cleanBtn.textContent = "Scrubbing...";
                cleanBtn.style.backgroundColor = "var(--accent-green)";
                cleanBtn.style.transform = "scale(0.95)";

                // 1. Animate Mop (Scrubbing)
                let scrubTime = 0;
                scrubInterval = setInterval(() => {
                    scrubTime += 0.15;
                    
                    // Complex movement: figure 8 + rotation
                    const x = Math.sin(scrubTime) * 60;
                    const y = Math.cos(scrubTime * 0.5) * 40;
                    const rot = 15 + Math.sin(scrubTime * 3) * 25;
                    
                    mopGroup.setAttribute('transform', `translate(${750 + x}, ${650 + y}) rotate(${rot})`);
                    
                    // Spawn bubbles randomly
                    if (Math.random() > 0.6) {
                        spawnBubble(750 + x, 650 + y);
                    }
                }, 16); // ~60fps

                // 2. Fade out mess after a short delay
                setTimeout(() => {
                    messGroup.style.transition = "opacity 1.5s ease-out";
                    messGroup.style.opacity = 0;
                }, 600);

                // 3. Cleanup Sequence
                setTimeout(() => {
                    clearInterval(scrubInterval);
                    
                    // Reset Mop
                    mopGroup.setAttribute('transform', `translate(750, 650) rotate(15)`);
                    
                    cleanBtn.textContent = "Sparkling Clean!";
                    cleanBtn.style.backgroundColor = "var(--accent-green-hover)";
                    
                    // Update Text
                    const h1 = document.querySelector('h1');
                    const p = document.querySelector('.subtitle');
                    
                    h1.style.opacity = 0;
                    p.style.opacity = 0;
                    
                    setTimeout(() => {
                        h1.innerHTML = "Good as<br>new.";
                        p.textContent = "We leave no trace behind. Just a pristine, healthy floor.";
                        h1.style.transition = "opacity 0.5s";
                        p.style.transition = "opacity 0.5s";
                        h1.style.opacity = 1;
                        p.style.opacity = 1;
                    }, 500);

                    // Reset Button after delay
                    setTimeout(() => {
                        cleanBtn.textContent = "Start Cleaning";
                        cleanBtn.style.backgroundColor = "var(--text-main)";
                        isCleaning = false;
                        
                        // Reset Mess (for demo purposes)
                        messGroup.style.transition = "none";
                        messGroup.style.opacity = 1;
                        
                        // Reset Text (for demo purposes)
                        setTimeout(() => {
                            h1.innerHTML = "Make it<br>Shine Again.";
                            p.textContent = "Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.";
                        }, 1000);

                    }, 3500);

                }, 2200);
            });

            function spawnBubble(x, y) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const r = Math.random() * 10 + 5;
                const offsetX = (Math.random() * 80 - 40);
                const offsetY = (Math.random() * 80 - 40);
                
                circle.setAttribute("cx", x + offsetX);
                circle.setAttribute("cy", y + offsetY);
                circle.setAttribute("r", r);
                circle.setAttribute("fill", "#fff");
                circle.setAttribute("opacity", "0.8");
                circle.classList.add('bubble-anim');
                
                bubblesContainer.appendChild(circle);

                // Remove after animation
                setTimeout(() => {
                    if(circle.parentNode) circle.parentNode.removeChild(circle);
                }, 1200);
            }
        });
    </script>
</body>
</html>
