<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Artisan Cleaning</title>
    <style>
        :root {
            --bg-color: #e6e0d4;
            --text-main: #1a1a1a;
            --text-sub: #4a4a4a;
            --accent-green: #2d6a4f;
            --accent-green-light: #40916c;
            --wood-dark: #8d6e63;
            --wood-light: #a1887f;
            --wood-knot: #5d4037;
            --shadow-soft: 0 10px 30px -5px rgba(0,0,0,0.15);
            --font-stack: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Layer --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 4rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-transform: uppercase;
        }

        .brand-icon {
            width: 14px;
            height: 14px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.15);
        }

        nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
            opacity: 0.8;
        }

        nav a:hover {
            color: var(--accent-green);
            opacity: 1;
        }

        .hero-content {
            max-width: 480px;
            pointer-events: auto;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 3rem;
            font-weight: 400;
            max-width: 400px;
            opacity: 0.9;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--text-main);
            color: #fff;
            padding: 1.2rem 2.8rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            letter-spacing: 0.5px;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            background-color: var(--accent-green);
            box-shadow: 0 15px 30px rgba(45, 106, 79, 0.25);
        }

        /* --- The Scene --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #e6e0d4;
        }

        svg.main-scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- SVG Animations --- */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-50px) scale(1.8); opacity: 0; }
        }

        .bubble-anim {
            animation: floatBubble 1.5s ease-out forwards;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .ui-layer { padding: 1.5rem; }
            h1 { font-size: 3.5rem; }
            nav { display: none; }
            .hero-content { margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header>
            <div class="brand">
                <span class="brand-icon"></span>
                Scrub & Shine
            </div>
            <nav>
                <ul>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <div class="hero-content">
            <h1>Make it<br>Shine Again.</h1>
            <p class="subtitle">Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.</p>
            <button class="cta-btn" id="cleanBtn">Start Cleaning</button>
        </div>
    </div>

    <!-- SVG Scene -->
    <div class="scene-container">
        <svg class="main-scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="blur-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
                    <feOffset dx="0" dy="25" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.2" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="wet-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" />
                </filter>

                <!-- Wood Floor Pattern (Refined) -->
                <pattern id="woodPattern" width="200" height="1200" patternUnits="userSpaceOnUse">
                    <!-- Base -->
                    <rect width="200" height="1200" fill="#e3dcd2" />
                    
                    <!-- Subtle Grain Texture -->
                    <path d="M0,100 Q100,120 200,100" stroke="#d1c7b7" stroke-width="2" fill="none" opacity="0.6"/>
                    <path d="M0,300 Q100,280 200,300" stroke="#d1c7b7" stroke-width="2" fill="none" opacity="0.6"/>
                    <path d="M0,600 Q100,620 200,600" stroke="#d1c7b7" stroke-width="2" fill="none" opacity="0.6"/>
                    <path d="M0,900 Q100,880 200,900" stroke="#d1c7b7" stroke-width="2" fill="none" opacity="0.6"/>
                    
                    <!-- Knots -->
                    <g transform="translate(100, 400)">
                        <ellipse cx="0" cy="0" rx="15" ry="6" fill="#cbbba5" opacity="0.5" transform="rotate(90)"/>
                        <ellipse cx="0" cy="0" rx="5" ry="2" fill="#a1887f" opacity="0.6" transform="rotate(90)"/>
                    </g>
                    <g transform="translate(100, 900)">
                        <ellipse cx="0" cy="0" rx="15" ry="6" fill="#cbbba5" opacity="0.5" transform="rotate(90)"/>
                        <ellipse cx="0" cy="0" rx="5" ry="2" fill="#a1887f" opacity="0.6" transform="rotate(90)"/>
                    </g>
                </pattern>

                <!-- Gradient for the Mess (Richer) -->
                <radialGradient id="messGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#e53935;stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#c62828;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8e0000;stop-opacity:0.9" />
                </radialGradient>
                
                <!-- Gradient for Mop Handle -->
                <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#5d4037" />
                    <stop offset="50%" style="stop-color:#8d6e63" />
                    <stop offset="100%" style="stop-color:#5d4037" />
                </linearGradient>
            </defs>

            <!-- 1. The Floor -->
            <g id="floor">
                <rect x="-100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="300" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="500" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="700" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="900" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="1100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                
                <!-- Plank Gaps (Softer) -->
                <line x1="0" y1="0" x2="0" y2="900" stroke="#cbbba5" stroke-width="2" opacity="0.4"/>
                <line x1="200" y1="0" x2="200" y2="900" stroke="#cbbba5" stroke-width="2" opacity="0.4"/>
                <line x1="400" y1="0" x2="400" y2="900" stroke="#cbbba5" stroke-width="2" opacity="0.4"/>
                <line x1="600" y1="0" x2="600" y2="900" stroke="#cbbba5" stroke-width="2" opacity="0.4"/>
                <line x1="800" y1="0" x2="800" y2="900" stroke="#cbbba5" stroke-width="2" opacity="0.4"/>
                <line x1="1000" y1="0" x2="1000" y2="900" stroke="#cbbba5" stroke-width="2" opacity="0.4"/>
                <line x1="1200" y1="0" x2="1200" y2="900" stroke="#cbbba5" stroke-width="2" opacity="0.4"/>
            </g>

            <!-- 2. The Mess (Tomato Soup) -->
            <g id="mess-group" transform="translate(750, 650)">
                <!-- Wet Shadow on Floor -->
                <path d="M-150,0 C-150,-70 -90,-80 -50,-70 C0,-90 70,-80 100,-60 C140,-70 160,-40 150,20 C140,80 90,100 50,90 C-10,100 -150,70 -150,0 Z" fill="#000" opacity="0.1" filter="url(#blur-shadow)"/>
                
                <!-- Main Puddle -->
                <path id="main-puddle" d="M-130,0 C-130,-50 -80,-60 -40,-55 C10,-70 60,-70 85,-50 C120,-60 145,-35 135,10 C125,60 85,80 45,70 C-5,80 -130,70 -130,0 Z" fill="url(#messGradient)" />
                
                <!-- Splatters (More organic) -->
                <circle cx="-160" cy="-15" r="12" fill="#c62828" />
                <circle cx="-145" cy="25" r="6" fill="#c62828" />
                <circle cx="150" cy="45" r="16" fill="#c62828" />
                <circle cx="170" cy="25" r="9" fill="#c62828" />
                <circle cx="-25" cy="-95" r="7" fill="#c62828" />
                <circle cx="110" cy="-85" r="10" fill="#c62828" />
                
                <!-- Drips -->
                <path d="M-95,55 Q-100,90 -97,95 A 4 4 0 0 0 -89 95 Q-90,90 -95,55 Z" fill="#c62828" />
                <path d="M55,70 Q60,105 57,110 A 4 4 0 0 0 49 110 Q50,105 55,70 Z" fill="#c62828" />
                
                <!-- Highlights (Glossy look) -->
                <ellipse cx="-45" cy="-25" rx="25" ry="10" fill="#fff" opacity="0.2" transform="rotate(-10 -45 -25)"/>
                <ellipse cx="65" cy="25" rx="12" ry="5" fill="#fff" opacity="0.2" transform="rotate(-10 65 25)"/>
            </g>

            <!-- 3. The Mop -->
            <g id="mop-group" transform="translate(750, 650) rotate(15)">
                <!-- Shadow -->
                <ellipse cx="0" cy="20" rx="60" ry="50" fill="#000" opacity="0.2" filter="url(#blur-shadow)"/>

                <!-- Handle -->
                <g transform="translate(0, -180)">
                    <!-- Wood Handle -->
                    <rect x="-10" y="-350" width="20" height="400" rx="10" fill="url(#handleGradient)" />
                    <!-- Highlight on Handle -->
                    <rect x="-5" y="-350" width="4" height="400" fill="#fff" opacity="0.1" rx="2"/>
                    <!-- Metal connector -->
                    <rect x="-14" y="40" width="28" height="35" rx="3" fill="#4e342e" />
                    <rect x="-14" y="40" width="28" height="5" fill="#795548" opacity="0.5"/>
                </g>

                <!-- Mop Head (Strings) -->
                <g transform="translate(0, 0)">
                    <!-- Base Plate -->
                    <ellipse cx="0" cy="0" rx="48" ry="42" fill="#4e342e" opacity="0.95"/>
                    <ellipse cx="0" cy="0" rx="48" ry="42" fill="none" stroke="#3e2723" stroke-width="2"/>
                    
                    <!-- Strings (More detailed) -->
                    <g stroke="#6d4c41" stroke-width="5" fill="none" stroke-linecap="round">
                        <path d="M-38,-12 Q-48,0 -38,22" />
                        <path d="M-28,-22 Q-38,0 -28,32" />
                        <path d="M-18,-32 Q-28,0 -18,38" />
                        <path d="M-8,-38 Q-18,0 -8,42" />
                        <path d="M8,-38 Q18,0 8,42" />
                        <path d="M18,-32 Q28,0 18,38" />
                        <path d="M28,-22 Q38,0 28,32" />
                        <path d="M38,-12 Q48,0 38,22" />
                    </g>
                    
                    <!-- Wet sheen on strings -->
                    <g stroke="#d7ccc8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
                        <path d="M-28,-22 Q-38,0 -28,32" />
                        <path d="M18,-32 Q28,0 18,38" />
                    </g>
                </g>
            </g>
            
            <!-- 4. Bubbles Container -->
            <g id="bubbles"></g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const messGroup = document.getElementById('mess-group');
            const cleanBtn = document.getElementById('cleanBtn');
            const bubblesContainer = document.getElementById('bubbles');
            
            // State
            let isCleaning = false;
            let scrubInterval;

            // Parallax Effect (Smoother)
            document.addEventListener('mousemove', (e) => {
                if(isCleaning) return;

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                const moveX = deltaX * 30; 
                const moveY = deltaY * 20;
                const tilt = deltaX * 10;

                mopGroup.setAttribute('transform', `translate(${750 + moveX}, ${650 + moveY}) rotate(${15 + tilt})`);
            });

            // Cleaning Logic
            cleanBtn.addEventListener('click', () => {
                if (isCleaning) return;
                
                isCleaning = true;
                cleanBtn.textContent = "Scrubbing...";
                cleanBtn.style.backgroundColor = "var(--accent-green)";
                cleanBtn.style.transform = "scale(0.95)";

                // 1. Animate Mop (Scrubbing)
                let scrubTime = 0;
                scrubInterval = setInterval(() => {
                    scrubTime += 0.4;
                    
                    // Complex movement: figure 8 + rotation
                    const x = Math.sin(scrubTime) * 50;
                    const y = Math.cos(scrubTime * 0.6) * 30;
                    const rot = 15 + Math.sin(scrubTime * 2) * 20;
                    
                    mopGroup.setAttribute('transform', `translate(${750 + x}, ${650 + y}) rotate(${rot})`);
                    
                    // Spawn bubbles randomly
                    if (Math.random() > 0.5) {
                        spawnBubble(750 + x, 650 + y);
                    }
                }, 30);

                // 2. Fade out mess after a short delay
                setTimeout(() => {
                    messGroup.style.transition = "opacity 1.5s ease-out";
                    messGroup.style.opacity = 0;
                }, 800);

                // 3. Cleanup Sequence
                setTimeout(() => {
                    clearInterval(scrubInterval);
                    
                    // Reset Mop
                    mopGroup.setAttribute('transform', `translate(750, 650) rotate(15)`);
                    
                    cleanBtn.textContent = "Sparkling Clean!";
                    cleanBtn.style.backgroundColor = "var(--accent-green-light)";
                    
                    // Update Text
                    const h1 = document.querySelector('h1');
                    const p = document.querySelector('.subtitle');
                    
                    h1.style.opacity = 0;
                    p.style.opacity = 0;
                    
                    setTimeout(() => {
                        h1.innerHTML = "Good as<br>new.";
                        p.textContent = "We leave no trace behind. Just a pristine, healthy floor.";
                        h1.style.transition = "opacity 0.5s";
                        p.style.transition = "opacity 0.5s";
                        h1.style.opacity = 1;
                        p.style.opacity = 1;
                    }, 500);

                    // Reset Button after delay
                    setTimeout(() => {
                        cleanBtn.textContent = "Start Cleaning";
                        cleanBtn.style.backgroundColor = "var(--text-main)";
                        isCleaning = false;
                        
                        // Reset Mess (for demo purposes)
                        messGroup.style.transition = "none";
                        messGroup.style.opacity = 1;
                        
                        // Reset Text (for demo purposes)
                        setTimeout(() => {
                            h1.innerHTML = "Make it<br>Shine Again.";
                            p.textContent = "Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.";
                        }, 1000);

                    }, 3000);

                }, 2000);
            });

            function spawnBubble(x, y) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const r = Math.random() * 8 + 4;
                const offsetX = (Math.random() * 70 - 35);
                const offsetY = (Math.random() * 70 - 35);
                
                circle.setAttribute("cx", x + offsetX);
                circle.setAttribute("cy", y + offsetY);
                circle.setAttribute("r", r);
                circle.setAttribute("fill", "#fff");
                circle.setAttribute("opacity", "0.7");
                circle.classList.add('bubble-anim');
                
                bubblesContainer.appendChild(circle);

                // Remove after animation
                setTimeout(() => {
                    if(circle.parentNode) circle.parentNode.removeChild(circle);
                }, 1500);
            }
        });
    </script>
</body>
</html>
