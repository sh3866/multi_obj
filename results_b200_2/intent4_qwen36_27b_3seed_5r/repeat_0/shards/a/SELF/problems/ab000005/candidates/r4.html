<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Artisan Floor Care</title>
    <style>
        :root {
            --bg-wall: #F4F1EA;
            --text-main: #1A1A1A;
            --text-muted: #555555;
            --accent: #2C7A4B; /* Deep Emerald */
            --accent-hover: #1E5C37;
            --btn-text: #FFFFFF;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 5%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        .hero-content {
            max-width: 500px;
            pointer-events: auto;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(3rem, 5vw, 5rem);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 1.125rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-weight: 400;
            max-width: 400px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--text-main);
            color: var(--btn-text);
            padding: 1rem 2.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent);
            box-shadow: 0 15px 30px rgba(44, 122, 75, 0.25);
        }

        /* --- Scene Container --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Subtle warm radial gradient for lighting */
            background: radial-gradient(circle at 70% 60%, #FFFFFF 0%, var(--bg-wall) 60%);
        }

        svg.main-scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- Animations --- */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.9; transform: translateY(-15px) scale(1); }
            100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
        }

        .bubble-anim {
            animation: floatBubble 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        
        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .ui-layer { padding: 1.5rem; }
            nav { display: none; }
            .hero-content { margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header>
            <div class="brand">
                <span class="brand-dot"></span>
                Scrub & Shine
            </div>
            <nav>
                <ul>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <div class="hero-content">
            <h1>Make it<br>Shine Again.</h1>
            <p class="subtitle">Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.</p>
            <button class="cta-btn" id="cleanBtn">Start Cleaning</button>
        </div>
    </div>

    <!-- SVG Scene -->
    <div class="scene-container">
        <svg class="main-scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="18" />
                    <feOffset dx="12" dy="24" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="mess-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="5" dy="10" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.25" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Wood Floor Pattern (High Fidelity) -->
                <pattern id="woodPattern" width="220" height="1400" patternUnits="userSpaceOnUse">
                    <!-- Base Color -->
                    <rect width="220" height="1400" fill="#EBE4D9" />
                    
                    <!-- Grain Texture -->
                    <g stroke="#D6CFC3" stroke-width="1.5" fill="none" opacity="0.6">
                        <path d="M0,50 Q110,60 220,40 M0,150 Q110,140 220,160 M0,250 Q110,260 220,240 M0,350 Q110,340 220,360 M0,450 Q110,460 220,440 M0,550 Q110,540 220,560 M0,650 Q110,660 220,640 M0,750 Q110,740 220,760 M0,850 Q110,860 220,840 M0,950 Q110,940 220,960 M0,1050 Q110,1060 220,1040 M0,1150 Q110,1140 220,1160 M0,1250 Q110,1260 220,1240 M0,1350 Q110,1340 220,1360" />
                    </g>
                    
                    <!-- Knots -->
                    <g transform="translate(110, 300)">
                        <ellipse cx="0" cy="0" rx="15" ry="5" fill="#DCD3C6" opacity="0.5" transform="rotate(90)"/>
                        <ellipse cx="0" cy="0" rx="5" ry="2" fill="#C2B7A5" opacity="0.7" transform="rotate(90)"/>
                    </g>
                    <g transform="translate(110, 800)">
                        <ellipse cx="0" cy="0" rx="12" ry="4" fill="#DCD3C6" opacity="0.5" transform="rotate(90)"/>
                    </g>
                </pattern>

                <!-- Gradient for Mess (Rich Berry/Soup) -->
                <radialGradient id="messGradient" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" /> <!-- Bright highlight -->
                    <stop offset="40%" style="stop-color:#A61D24;stop-opacity:1" /> <!-- Main body -->
                    <stop offset="100%" style="stop-color:#5E0F14;stop-opacity:1" /> <!-- Shadow edge -->
                </radialGradient>

                <!-- Mop Handle Gradient -->
                <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4A3B32" />
                    <stop offset="30%" style="stop-color:#6D5648" />
                    <stop offset="70%" style="stop-color:#6D5648" />
                    <stop offset="100%" style="stop-color:#4A3B32" />
                </linearGradient>
            </defs>

            <!-- 1. The Floor (Planks) -->
            <g id="floor" opacity="0.8">
                <!-- Planks Background -->
                <rect x="-200" y="0" width="220" height="900" fill="url(#woodPattern)" />
                <rect x="0" y="0" width="220" height="900" fill="url(#woodPattern)" />
                <rect x="220" y="0" width="220" height="900" fill="url(#woodPattern)" />
                <rect x="440" y="0" width="220" height="900" fill="url(#woodPattern)" />
                <rect x="660" y="0" width="220" height="900" fill="url(#woodPattern)" />
                <rect x="880" y="0" width="220" height="900" fill="url(#woodPattern)" />
                <rect x="1100" y="0" width="220" height="900" fill="url(#woodPattern)" />
                
                <!-- Plank Gaps (Realistic depth) -->
                <g stroke="#D1C7B7" stroke-width="2">
                    <line x1="0" y1="0" x2="0" y2="900" />
                    <line x1="220" y1="0" x2="220" y2="900" />
                    <line x1="440" y1="0" x2="440" y2="900" />
                    <line x1="660" y1="0" x2="660" y2="900" />
                    <line x1="880" y1="0" x2="880" y2="900" />
                    <line x1="1100" y1="0" x2="1100" y2="900" />
                </g>
                <!-- Inner shadow for gaps -->
                <g stroke="#B8AD9E" stroke-width="1" opacity="0.4">
                    <line x1="2" y1="0" x2="2" y2="900" />
                    <line x1="222" y1="0" x2="222" y2="900" />
                    <line x1="442" y1="0" x2="442" y2="900" />
                    <line x1="662" y1="0" x2="662" y2="900" />
                    <line x1="882" y1="0" x2="882" y2="900" />
                    <line x1="1102" y1="0" x2="1102" y2="900" />
                </g>
            </g>

            <!-- 2. The Mess (Spilled Soup/Berry) -->
            <!-- Positioned right-center to balance text on left -->
            <g id="mess-group" transform="translate(750, 600)">
                <!-- Wet Shadow on Floor (Darkens the wood) -->
                <path d="M-160,0 C-160,-70 -100,-80 -60,-70 C0,-90 80,-80 110,-60 C150,-70 170,-40 160,20 C150,80 100,100 60,90 C-10,100 -160,70 -160,0 Z" fill="#000" opacity="0.15" filter="url(#mess-shadow)"/>
                
                <!-- Main Puddle Body -->
                <path id="main-puddle" d="M-140,0 C-140,-55 -90,-65 -50,-60 C0,-75 70,-75 95,-55 C130,-65 155,-40 145,10 C135,65 95,85 55,75 C-5,85 -140,75 -140,0 Z" fill="url(#messGradient)" />
                
                <!-- Glossy Highlight (The "Wet" look) -->
                <ellipse cx="-30" cy="-25" rx="45" ry="15" fill="#fff" opacity="0.2" transform="rotate(-15 -30 -25)"/>
                <ellipse cx="80" cy="35" rx="20" ry="8" fill="#fff" opacity="0.15" transform="rotate(-15 80 35)"/>

                <!-- Splatters (Organic) -->
                <g fill="#A61D24">
                    <circle cx="-170" cy="-10" r="14" />
                    <circle cx="-155" cy="30" r="7" />
                    <circle cx="160" cy="50" r="18" />
                    <circle cx="180" cy="30" r="10" />
                    <circle cx="-30" cy="-100" r="8" />
                    <circle cx="120" cy="-90" r="12" />
                </g>
                
                <!-- Drips (3D effect) -->
                <path d="M-100,60 Q-105,100 -102,105 A 4 4 0 0 0 -94 105 Q-95,100 -100,60 Z" fill="#5E0F14" /> 
                <path d="M60,75 Q65,110 62,115 A 4 4 0 0 0 54 115 Q55,110 60,75 Z" fill="#5E0F14" />
            </g>

            <!-- 3. The Mop -->
            <g id="mop-group" transform="translate(750, 600) rotate(15)">
                <!-- Mop Shadow -->
                <ellipse cx="0" cy="25" rx="60" ry="50" fill="#000" opacity="0.2" filter="url(#drop-shadow)"/>

                <!-- Handle -->
                <g transform="translate(0, -190)">
                    <!-- Wood Handle -->
                    <rect x="-10" y="-340" width="20" height="390" rx="10" fill="url(#handleGradient)" />
                    <!-- Highlight on Handle -->
                    <rect x="-4" y="-340" width="4" height="390" fill="#fff" opacity="0.1" rx="2"/>
                    
                    <!-- Metal/Plastic connector -->
                    <rect x="-14" y="30" width="28" height="30" rx="4" fill="#455A64" />
                    <rect x="-14" y="30" width="28" height="6" fill="#90A4AE" opacity="0.6"/>
                    <rect x="-10" y="60" width="20" height="12" fill="#37474F"/>
                </g>

                <!-- Mop Head (Strings) -->
                <g transform="translate(0, 0)">
                    <!-- Base Plate -->
                    <ellipse cx="0" cy="0" rx="50" ry="45" fill="#37474F" opacity="0.9"/>
                    
                    <!-- Strings (Detailed curves) -->
                    <g stroke="#6D4C41" stroke-width="5" fill="none" stroke-linecap="round">
                        <path d="M-40,-10 Q-55,0 -40,25" />
                        <path d="M-25,-20 Q-40,0 -25,35" />
                        <path d="M-10,-35 Q-25,0 -10,40" />
                        <path d="M5,-40 Q-10,0 5,40" />
                        <path d="M20,-35 Q35,0 20,40" />
                        <path d="M35,-20 Q50,0 35,35" />
                        <path d="M45,-10 Q60,0 45,25" />
                    </g>
                    
                    <!-- Wet sheen on strings -->
                    <g stroke="#A1887F" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
                        <path d="M-25,-20 Q-40,0 -25,35" />
                        <path d="M20,-35 Q35,0 20,40" />
                    </g>
                </g>
            </g>
            
            <!-- 4. Bubbles Container -->
            <g id="bubbles"></g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const messGroup = document.getElementById('mess-group');
            const cleanBtn = document.getElementById('cleanBtn');
            const bubblesContainer = document.getElementById('bubbles');
            
            let isCleaning = false;
            let scrubInterval;

            // Parallax Effect
            document.addEventListener('mousemove', (e) => {
                if(isCleaning) return;

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                // Calculate movement relative to the base position (750, 600)
                const moveX = deltaX * 25; 
                const moveY = deltaY * 20;
                const tilt = deltaX * 6;

                mopGroup.setAttribute('transform', `translate(${750 + moveX}, ${600 + moveY}) rotate(${15 + tilt})`);
            });

            // Cleaning Logic
            cleanBtn.addEventListener('click', () => {
                if (isCleaning) return;
                
                isCleaning = true;
                cleanBtn.textContent = "Scrubbing...";
                cleanBtn.style.backgroundColor = "var(--accent)";
                cleanBtn.style.transform = "scale(0.98)";

                // 1. Animate Mop (Scrubbing)
                let scrubTime = 0;
                scrubInterval = setInterval(() => {
                    scrubTime += 0.12;
                    
                    // Figure 8 + rotation scrubbing motion
                    const x = Math.sin(scrubTime * 2) * 50;
                    const y = Math.cos(scrubTime) * 40;
                    const rot = 15 + Math.sin(scrubTime * 3) * 30;
                    
                    mopGroup.setAttribute('transform', `translate(${750 + x}, ${600 + y}) rotate(${rot})`);
                    
                    // Spawn bubbles
                    if (Math.random() > 0.5) {
                        spawnBubble(750 + x, 600 + y);
                    }
                }, 16); 

                // 2. Fade out mess
                setTimeout(() => {
                    messGroup.style.transition = "opacity 1s ease-out";
                    messGroup.style.opacity = 0;
                }, 500);

                // 3. Cleanup Sequence
                setTimeout(() => {
                    clearInterval(scrubInterval);
                    
                    // Reset Mop to center
                    mopGroup.setAttribute('transform', `translate(750, 600) rotate(15)`);
                    
                    cleanBtn.textContent = "Sparkling Clean!";
                    cleanBtn.style.backgroundColor = "var(--accent-hover)";
                    
                    // Update Text
                    const h1 = document.querySelector('h1');
                    const p = document.querySelector('.subtitle');
                    
                    h1.style.opacity = 0;
                    p.style.opacity = 0;
                    
                    setTimeout(() => {
                        h1.innerHTML = "Good as<br>new.";
                        p.textContent = "We leave no trace behind. Just a pristine, healthy floor.";
                        h1.style.transition = "opacity 0.5s";
                        p.style.transition = "opacity 0.5s";
                        h1.style.opacity = 1;
                        p.style.opacity = 1;
                    }, 400);

                    // Reset Button after delay
                    setTimeout(() => {
                        cleanBtn.textContent = "Start Cleaning";
                        cleanBtn.style.backgroundColor = "var(--text-main)";
                        isCleaning = false;
                        
                        // Reset Mess (for demo purposes)
                        messGroup.style.transition = "none";
                        messGroup.style.opacity = 1;
                        
                        // Reset Text (for demo purposes)
                        setTimeout(() => {
                            h1.innerHTML = "Make it<br>Shine Again.";
                            p.textContent = "Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.";
                        }, 1000);

                    }, 3500);

                }, 2000);
            });

            function spawnBubble(x, y) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const r = Math.random() * 12 + 6;
                const offsetX = (Math.random() * 100 - 50);
                const offsetY = (Math.random() * 100 - 50);
                
                circle.setAttribute("cx", x + offsetX);
                circle.setAttribute("cy", y + offsetY);
                circle.setAttribute("r", r);
                circle.setAttribute("fill", "#fff");
                circle.setAttribute("opacity", "0.8");
                circle.classList.add('bubble-anim');
                
                bubblesContainer.appendChild(circle);

                // Remove after animation
                setTimeout(() => {
                    if(circle.parentNode) circle.parentNode.removeChild(circle);
                }, 1200);
            }
        });
    </script>
</body>
</html>
