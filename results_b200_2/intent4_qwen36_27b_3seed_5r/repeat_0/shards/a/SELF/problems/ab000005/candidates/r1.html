<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Artisan Cleaning</title>
    <style>
        :root {
            --bg-color: #f2efe9;
            --text-main: #1e1e1e;
            --text-sub: #5c5c5c;
            --accent-green: #2e7d32;
            --accent-green-dark: #1b5e20;
            --wood-dark: #bcaaa4;
            --wood-light: #d7ccc8;
            --wood-knot: #a1887f;
            --shadow-soft: 0 20px 40px -10px rgba(0,0,0,0.15);
            --font-stack: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- UI Layer --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to SVG where needed */
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 4rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-transform: uppercase;
        }

        .brand-icon {
            width: 12px;
            height: 12px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
        }

        nav ul {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-green);
        }

        .hero-content {
            max-width: 450px;
            pointer-events: auto;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -2.5px;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 2.5rem;
            font-weight: 400;
            max-width: 380px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--text-main);
            color: #fff;
            padding: 1.1rem 2.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent-green);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.3);
        }

        /* --- The Scene --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #e6e0d4; /* Fallback */
        }

        svg.main-scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- SVG Animations --- */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
        }

        .bubble-anim {
            animation: floatBubble 2s ease-out forwards;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .ui-layer { padding: 1.5rem; }
            h1 { font-size: 3rem; }
            nav { display: none; }
            .hero-content { margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header>
            <div class="brand">
                <span class="brand-icon"></span>
                Scrub & Shine
            </div>
            <nav>
                <ul>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <div class="hero-content">
            <h1>Make it<br>Shine Again.</h1>
            <p class="subtitle">Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.</p>
            <button class="cta-btn" id="cleanBtn">Start Cleaning</button>
        </div>
    </div>

    <!-- SVG Scene -->
    <div class="scene-container">
        <svg class="main-scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="blur-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="0" dy="20" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="wet-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>

                <!-- Wood Floor Pattern (Realistic) -->
                <pattern id="woodPattern" width="200" height="1200" patternUnits="userSpaceOnUse">
                    <!-- Base -->
                    <rect width="200" height="1200" fill="#dcd0c0" />
                    
                    <!-- Grain Texture -->
                    <path d="M0,0 L200,0 M0,50 L200,50 M0,100 L200,100" stroke="#cbbba5" stroke-width="1" opacity="0.5"/>
                    <path d="M10,200 Q50,220 10,240" stroke="#cbbba5" stroke-width="2" fill="none" opacity="0.4"/>
                    <path d="M180,600 Q150,650 190,700" stroke="#cbbba5" stroke-width="2" fill="none" opacity="0.4"/>
                    
                    <!-- Knots -->
                    <ellipse cx="100" cy="300" rx="12" ry="5" fill="#bcaaa4" opacity="0.4" transform="rotate(90 100 300)"/>
                    <ellipse cx="100" cy="300" rx="4" ry="1.5" fill="#a1887f" opacity="0.5" transform="rotate(90 100 300)"/>
                </pattern>

                <!-- Gradient for the Mess -->
                <radialGradient id="messGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#b71c1c;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8e0000;stop-opacity:0.8" />
                </radialGradient>
            </defs>

            <!-- 1. The Floor -->
            <g id="floor">
                <rect x="-100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="300" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="500" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="700" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="900" y="0" width="200" height="900" fill="url(#woodPattern)" />
                <rect x="1100" y="0" width="200" height="900" fill="url(#woodPattern)" />
                
                <!-- Plank Gaps -->
                <line x1="0" y1="0" x2="0" y2="900" stroke="#bcaaa4" stroke-width="2" opacity="0.6"/>
                <line x1="200" y1="0" x2="200" y2="900" stroke="#bcaaa4" stroke-width="2" opacity="0.6"/>
                <line x1="400" y1="0" x2="400" y2="900" stroke="#bcaaa4" stroke-width="2" opacity="0.6"/>
                <line x1="600" y1="0" x2="600" y2="900" stroke="#bcaaa4" stroke-width="2" opacity="0.6"/>
                <line x1="800" y1="0" x2="800" y2="900" stroke="#bcaaa4" stroke-width="2" opacity="0.6"/>
                <line x1="1000" y1="0" x2="1000" y2="900" stroke="#bcaaa4" stroke-width="2" opacity="0.6"/>
                <line x1="1200" y1="0" x2="1200" y2="900" stroke="#bcaaa4" stroke-width="2" opacity="0.6"/>
            </g>

            <!-- 2. The Mess (Tomato Soup) -->
            <g id="mess-group" transform="translate(750, 650)">
                <!-- Wet Shadow on Floor -->
                <path d="M-140,0 C-140,-60 -80,-70 -40,-60 C0,-80 60,-70 90,-50 C130,-60 150,-30 140,20 C130,70 80,90 40,80 C-20,90 -140,60 -140,0 Z" fill="#000" opacity="0.15" filter="url(#blur-shadow)"/>
                
                <!-- Main Puddle -->
                <path id="main-puddle" d="M-120,0 C-120,-45 -70,-55 -35,-50 C10,-65 50,-65 75,-45 C110,-55 135,-30 125,15 C115,55 75,75 35,65 C-15,75 -120,65 -120,0 Z" fill="url(#messGradient)" />
                
                <!-- Splatters -->
                <circle cx="-150" cy="-10" r="10" fill="#c62828" />
                <circle cx="-135" cy="20" r="5" fill="#c62828" />
                <circle cx="140" cy="40" r="14" fill="#c62828" />
                <circle cx="160" cy="20" r="8" fill="#c62828" />
                <circle cx="-20" cy="-90" r="6" fill="#c62828" />
                <circle cx="100" cy="-80" r="9" fill="#c62828" />
                
                <!-- Drips -->
                <path d="M-90,50 Q-95,80 -92,85 A 4 4 0 0 0 -84 85 Q-85,80 -90,50 Z" fill="#c62828" />
                <path d="M50,65 Q55,95 52,100 A 4 4 0 0 0 44 100 Q45,95 50,65 Z" fill="#c62828" />
                
                <!-- Highlights (Glossy look) -->
                <ellipse cx="-40" cy="-20" rx="20" ry="8" fill="#fff" opacity="0.15" transform="rotate(-10 -40 -20)"/>
                <ellipse cx="60" cy="20" rx="10" ry="4" fill="#fff" opacity="0.15" transform="rotate(-10 60 20)"/>
            </g>

            <!-- 3. The Mop -->
            <g id="mop-group" transform="translate(750, 650) rotate(15)">
                <!-- Shadow -->
                <ellipse cx="0" cy="15" rx="55" ry="45" fill="#000" opacity="0.25" filter="url(#blur-shadow)"/>

                <!-- Handle -->
                <g transform="translate(0, -180)">
                    <!-- Wood Handle -->
                    <rect x="-8" y="-350" width="16" height="400" rx="8" fill="#8d6e63" />
                    <rect x="-4" y="-350" width="6" height="400" fill="#a1887f" opacity="0.5"/>
                    <!-- Metal connector -->
                    <rect x="-12" y="40" width="24" height="30" rx="2" fill="#5d4037" />
                </g>

                <!-- Mop Head (Strings) -->
                <g transform="translate(0, 0)">
                    <!-- Base Plate -->
                    <ellipse cx="0" cy="0" rx="45" ry="40" fill="#5d4037" opacity="0.9"/>
                    
                    <!-- Strings (Procedural looking paths) -->
                    <g stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round">
                        <path d="M-35,-10 Q-45,0 -35,20" />
                        <path d="M-25,-20 Q-35,0 -25,30" />
                        <path d="M-15,-30 Q-25,0 -15,35" />
                        <path d="M-5,-35 Q-15,0 -5,40" />
                        <path d="M5,-35 Q15,0 5,40" />
                        <path d="M15,-30 Q25,0 15,35" />
                        <path d="M25,-20 Q35,0 25,30" />
                        <path d="M35,-10 Q45,0 35,20" />
                    </g>
                    
                    <!-- Wet sheen on strings -->
                    <g stroke="#bcaaa4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4">
                        <path d="M-25,-20 Q-35,0 -25,30" />
                        <path d="M15,-30 Q25,0 15,35" />
                    </g>
                </g>
            </g>
            
            <!-- 4. Bubbles Container -->
            <g id="bubbles"></g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const messGroup = document.getElementById('mess-group');
            const cleanBtn = document.getElementById('cleanBtn');
            const bubblesContainer = document.getElementById('bubbles');
            
            // State
            let isCleaning = false;
            let scrubInterval;

            // Parallax Effect
            document.addEventListener('mousemove', (e) => {
                if(isCleaning) return; // Disable parallax during cleaning animation

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                // Mop moves slightly
                const moveX = deltaX * 40; 
                const moveY = deltaY * 25;
                const tilt = deltaX * 12;

                // Mess stays put but we could add subtle depth if we wanted
                // Keeping mess static emphasizes it's on the floor
                
                mopGroup.setAttribute('transform', `translate(${750 + moveX}, ${650 + moveY}) rotate(${15 + tilt})`);
            });

            // Cleaning Logic
            cleanBtn.addEventListener('click', () => {
                if (isCleaning) return;
                
                isCleaning = true;
                cleanBtn.textContent = "Scrubbing...";
                cleanBtn.style.backgroundColor = "var(--accent-green)";
                cleanBtn.style.transform = "scale(0.95)";

                // 1. Animate Mop (Scrubbing)
                let scrubTime = 0;
                scrubInterval = setInterval(() => {
                    scrubTime += 0.3;
                    
                    // Complex movement: figure 8 + rotation
                    const x = Math.sin(scrubTime) * 60;
                    const y = Math.cos(scrubTime * 0.5) * 40;
                    const rot = 15 + Math.sin(scrubTime * 2) * 15;
                    
                    mopGroup.setAttribute('transform', `translate(${750 + x}, ${650 + y}) rotate(${rot})`);
                    
                    // Spawn bubbles randomly
                    if (Math.random() > 0.6) {
                        spawnBubble(750 + x, 650 + y);
                    }
                }, 30);

                // 2. Fade out mess after a short delay
                setTimeout(() => {
                    messGroup.style.transition = "opacity 1.5s ease-out";
                    messGroup.style.opacity = 0;
                }, 800);

                // 3. Cleanup Sequence
                setTimeout(() => {
                    clearInterval(scrubInterval);
                    
                    // Reset Mop
                    mopGroup.setAttribute('transform', `translate(750, 650) rotate(15)`);
                    
                    cleanBtn.textContent = "Sparkling Clean!";
                    cleanBtn.style.backgroundColor = "var(--accent-green-dark)";
                    
                    // Update Text
                    const h1 = document.querySelector('h1');
                    const p = document.querySelector('.subtitle');
                    
                    h1.style.opacity = 0;
                    p.style.opacity = 0;
                    
                    setTimeout(() => {
                        h1.innerHTML = "Good as<br>new.";
                        p.textContent = "We leave no trace behind. Just a pristine, healthy floor.";
                        h1.style.transition = "opacity 0.5s";
                        p.style.transition = "opacity 0.5s";
                        h1.style.opacity = 1;
                        p.style.opacity = 1;
                    }, 500);

                    // Reset Button after delay
                    setTimeout(() => {
                        cleanBtn.textContent = "Start Cleaning";
                        cleanBtn.style.backgroundColor = "var(--text-main)";
                        isCleaning = false;
                        
                        // Reset Mess (for demo purposes)
                        messGroup.style.transition = "none";
                        messGroup.style.opacity = 1;
                        
                        // Reset Text (for demo purposes)
                        setTimeout(() => {
                            h1.innerHTML = "Make it<br>Shine Again.";
                            p.textContent = "Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.";
                        }, 1000);

                    }, 3000);

                }, 2000);
            });

            function spawnBubble(x, y) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const r = Math.random() * 6 + 3;
                const offsetX = (Math.random() * 60 - 30);
                const offsetY = (Math.random() * 60 - 30);
                
                circle.setAttribute("cx", x + offsetX);
                circle.setAttribute("cy", y + offsetY);
                circle.setAttribute("r", r);
                circle.setAttribute("fill", "#fff");
                circle.setAttribute("opacity", "0.6");
                circle.classList.add('bubble-anim');
                
                bubblesContainer.appendChild(circle);

                // Remove after animation
                setTimeout(() => {
                    if(circle.parentNode) circle.parentNode.removeChild(circle);
                }, 2000);
            }
        });
    </script>
</body>
</html>
