<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Premium Care</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --text-main: #1a1a1a;
            --text-secondary: #4a4a4a;
            --accent-color: #2c3e50;
            --accent-hover: #1a252f;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            background-color: var(--text-main);
            border-radius: 4px;
            transform: rotate(45deg);
        }

        nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            letter-spacing: 0.5px;
        }

        nav a:hover {
            color: var(--text-main);
        }

        /* --- Hero Section --- */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 3rem;
            position: relative;
            z-index: 5;
            max-width: 600px;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 1.5rem;
            color: #111;
        }

        p.subtitle {
            font-size: 1.4rem; /* Increased size per critique */
            line-height: 1.5;
            color: #333; /* Darker color per critique */
            margin-bottom: 2.5rem;
            font-weight: 600;
            max-width: 480px;
        }

        .cta-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-color);
            color: #fff;
            padding: 1.2rem 3rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.4); /* Softened shadow */
            transform: translateY(0);
        }

        .cta-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(44, 62, 80, 0.5);
        }

        .cta-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(44, 62, 80, 0.3);
        }

        /* --- The Scene Container --- */
        .scene-container {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        svg.main-scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            header { padding: 1.5rem; }
            .hero-section { 
                padding: 0 1.5rem; 
                z-index: 10;
                background: linear-gradient(to right, rgba(244,241,234,1) 0%, rgba(244,241,234,0.9) 70%, rgba(244,241,234,0) 100%);
                width: 100%;
            }
            h1 { font-size: 3.5rem; }
            p.subtitle { font-size: 1.2rem; }
            nav { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            SCRUB & SHINE
        </div>
        <nav>
            <ul>
                <li><a href="#">Services</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-section">
        <h1>Restore<br>Purity.</h1>
        <p class="subtitle">Expert floor care for the modern home. We handle the mess so you can enjoy the space.</p>
        <button class="cta-btn" id="cleanBtn">Start Cleaning</button>
    </div>

    <div class="scene-container">
        <svg class="main-scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Shadows -->
                <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="8" dy="20" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.25" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Wood Floor Texture (High Fidelity & Rich) -->
                <pattern id="floorPattern" width="300" height="1200" patternUnits="userSpaceOnUse">
                    <!-- Base Wood Color (Honey Oak) -->
                    <rect width="300" height="1200" fill="#e3d2b6" />
                    
                    <!-- Wood Grain (Curved paths for organic feel) -->
                    <path d="M0,0 Q150,60 300,0 M0,100 Q150,160 300,100 M0,200 Q150,260 300,200 M0,300 Q150,360 300,300 M0,400 Q150,460 300,400 M0,500 Q150,560 300,500 M0,600 Q150,660 300,600 M0,700 Q150,760 300,700 M0,800 Q150,860 300,800 M0,900 Q150,960 300,900 M0,1000 Q150,1060 300,1000 M0,1100 Q150,1160 300,1100" 
                          stroke="#cbb692" stroke-width="4" fill="none" opacity="0.5"/>
                    <path d="M0,50 Q150,110 300,50 M0,150 Q150,210 300,150 M0,250 Q150,310 300,250 M0,350 Q150,410 300,350 M0,450 Q150,510 300,450 M0,550 Q150,610 300,550 M0,650 Q150,710 300,650 M0,750 Q150,810 300,750 M0,850 Q150,910 300,850 M0,950 Q150,1010 300,950 M0,1050 Q150,1110 300,1050 M0,1150 Q150,1210 300,1150" 
                          stroke="#cbb692" stroke-width="1.5" fill="none" opacity="0.3"/>
                    
                    <!-- Plank Separation Lines (Vertical) -->
                    <line x1="0" y1="0" x2="0" y2="1200" stroke="#b39a76" stroke-width="3" opacity="0.8"/>
                    <line x1="300" y1="0" x2="300" y2="1200" stroke="#b39a76" stroke-width="3" opacity="0.8"/>
                    
                    <!-- Subtle knots -->
                    <ellipse cx="150" cy="420" rx="20" ry="50" fill="none" stroke="#cbb692" stroke-width="2" opacity="0.6" transform="rotate(10 150 420)"/>
                    <ellipse cx="50" cy="820" rx="10" ry="30" fill="none" stroke="#cbb692" stroke-width="1.5" opacity="0.5" transform="rotate(-15 50 820)"/>
                </pattern>

                <!-- Liquid Gradient (Coffee/Mud - Warm Organic Tone) -->
                <radialGradient id="liquidGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" stop-color="#6d4c41" stop-opacity="0.95" /> <!-- Lighter brown center -->
                    <stop offset="60%" stop-color="#4e342e" stop-opacity="0.98" /> <!-- Darker brown -->
                    <stop offset="100%" stop-color="#3e2723" stop-opacity="1" /> <!-- Deep edge -->
                </radialGradient>
                
                <!-- Specular Highlight Gradient -->
                <radialGradient id="highlightGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </radialGradient>

                <!-- Mop Handle Gradient (3D Cylinder) -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#37474f" />
                    <stop offset="30%" stop-color="#b0bec5" /> <!-- Specular Highlight -->
                    <stop offset="60%" stop-color="#78909c" />
                    <stop offset="100%" stop-color="#263238" />
                </linearGradient>

            </defs>

            <!-- 1. Floor Background -->
            <g id="floor-layer">
                <rect x="0" y="0" width="1200" height="900" fill="url(#floorPattern)" />
                <!-- Vignette/Shadow overlay for depth -->
                <rect x="0" y="0" width="1200" height="900" fill="#000" opacity="0.04" />
            </g>

            <!-- 2. The Mess (Spilled Liquid) -->
            <!-- Positioned center-right -->
            <g id="mess-group" transform="translate(750, 650)">
                <!-- Wet shadow on floor (darkening the wood) -->
                <ellipse cx="0" cy="10" rx="180" ry="110" fill="#3e2723" opacity="0.15" />
                
                <!-- Main puddle body -->
                <path d="M-130,0 C-130,-50 -80,-60 -50,-55 C-10,-65 30,-65 60,-45 C90,-55 140,-30 130,20 C120,60 70,80 20,75 C-30,85 -130,75 -130,0 Z" 
                      fill="url(#liquidGrad)" />
                
                <!-- Specular Highlight (Wetness) -->
                <ellipse cx="-30" cy="-20" rx="40" ry="15" fill="url(#highlightGrad)" transform="rotate(-15 -30 -20)" opacity="0.8" />
                
                <!-- Splatters (Droplets) -->
                <g>
                    <circle cx="-160" cy="-30" r="10" fill="#4e342e" />
                    <circle cx="-175" cy="-10" r="5" fill="#4e342e" />
                    <circle cx="150" cy="40" r="15" fill="#3e2723" opacity="0.9" />
                    <circle cx="175" cy="20" r="7" fill="#4e342e" />
                    <circle cx="20" cy="-80" r="8" fill="#4e342e" />
                    <circle cx="70" cy="-75" r="9" fill="#4e342e" />
                    <circle cx="-100" cy="-70" r="4" fill="#4e342e" />
                </g>

                <!-- Drips -->
                <path d="M-70,45 Q-75,80 -72,90 A 3 3 0 0 0 -66 90 Q-64,80 -70,45 Z" fill="url(#liquidGrad)" />
                <path d="M50,65 Q55,100 52,110 A 3 3 0 0 0 46 110 Q44,100 50,65 Z" fill="url(#liquidGrad)" />
            </g>

            <!-- 3. The Mop -->
            <!-- Angled inward (towards text), textured head -->
            <g id="mop-group" class="interactive-mop" filter="url(#drop-shadow)">
                <!-- 
                  Transform origin is set to the center of the mop head for rotation.
                  Positioned closer to text block.
                -->
                <g transform="translate(700, 620) rotate(30)"> <!-- Angle adjusted inward -->
                    
                    <!-- Handle (Drawn first so it goes "behind" the head connection) -->
                    <g transform="rotate(-5)"> 
                        <!-- 3D Cylinder Effect -->
                        <rect x="-12" y="-400" width="24" height="450" rx="12" fill="url(#handleGrad)" />
                        
                        <!-- Top Knob -->
                        <circle cx="0" cy="-400" r="18" fill="#263238" />
                        <circle cx="-5" cy="-405" r="6" fill="#546e7a" /> <!-- Highlight -->
                    </g>

                    <!-- Mop Head (Fibrous String Construction) -->
                    <g transform="translate(0, 0)">
                        
                        <!-- Connecting Ring (Where handle meets head) -->
                        <circle cx="0" cy="-70" r="20" fill="#37474f" />
                        <circle cx="0" cy="-70" r="12" fill="#546e7a" />
                        <circle cx="-4" cy="-74" r="4" fill="#cfd8dc" /> <!-- Metal shine -->

                        <!-- Base Shape for clipping strings -->
                        <path id="mopShape" d="M-65,-60 Q-75,10 -50,70 Q0,90 50,70 Q75,10 65,-60 Q0,-80 -65,-60 Z" />

                        <!-- Strings Layer -->
                        <g stroke="#90a4ae" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
                            <!-- Left side strings -->
                            <path d="M-50,-65 Q-60,10 -40,75" />
                            <path d="M-35,-68 Q-45,15 -30,80" />
                            <path d="M-20,-70 Q-30,20 -20,82" />
                            <path d="M-5,-72 Q-15,25 -10,80" />
                            <!-- Right side strings -->
                            <path d="M10,-72 Q15,25 10,80" />
                            <path d="M25,-70 Q30,20 20,82" />
                            <path d="M40,-68 Q45,15 30,80" />
                            <path d="M55,-65 Q60,10 40,75" />
                            <!-- Center Strings -->
                            <path d="M0,-75 Q-5,10 0,85" stroke="#546e7a" stroke-width="5" />
                            <path d="M15,-71 Q20,15 15,78" />
                            <path d="M-15,-71 Q-20,15 -15,78" />
                        </g>

                        <!-- Wet/Darkened Center (Where it touches the floor) -->
                        <path d="M-40,40 Q0,70 40,40 Q50,60 40,70 Q0,90 -40,70 Q-50,60 -40,40 Z" fill="#3e2723" opacity="0.4" />

                        <!-- Dripping Water Droplets -->
                        <circle cx="-20" cy="85" r="3" fill="#4fc3f7" opacity="0.8" />
                        <circle cx="25" cy="82" r="2.5" fill="#4fc3f7" opacity="0.8" />
                        <circle cx="0" cy="90" r="4" fill="#4fc3f7" opacity="0.8" />
                    </g>
                </g>
            </g>

            <!-- 4. Bubbles (Visual Interest) -->
            <g id="bubbles" fill="#fff" opacity="0.6">
                <!-- Initial bubbles near the mess -->
                <circle cx="680" cy="580" r="5" />
                <circle cx="690" cy="595" r="3" />
                <circle cx="760" cy="660" r="7" />
                <circle cx="790" cy="650" r="4" />
                <circle cx="660" cy="630" r="2" />
            </g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const messGroup = document.getElementById('mess-group');
            const cleanBtn = document.getElementById('cleanBtn');
            const bubblesContainer = document.getElementById('bubbles');
            
            // State
            let isCleaning = false;
            let animationId;

            // Mouse Parallax Effect
            // Moves the mop slightly opposite to mouse to create depth
            document.addEventListener('mousemove', (e) => {
                if (isCleaning) return;

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                // Calculate new position relative to SVG center
                // Base position is translate(700, 620)
                const moveX = deltaX * 20; 
                const moveY = deltaY * 10;
                
                // Slight rotation tilt
                const tilt = 30 + (deltaX * 5);

                mopGroup.setAttribute('transform', `translate(${700 + moveX}, ${620 + moveY}) rotate(${tilt})`);
            });

            // Cleaning Interaction
            cleanBtn.addEventListener('click', () => {
                if (isCleaning) return;
                
                isCleaning = true;
                cleanBtn.textContent = "Scrubbing...";

                let startTime = null;
                const duration = 2500; 

                const animate = (timestamp) => {
                    if (!startTime) startTime = timestamp;
                    const progress = timestamp - startTime;

                    if (progress < duration) {
                        // Create a figure-8 scrubbing motion
                        const t = progress / 150; 
                        const scrubX = Math.sin(t) * 40;
                        const scrubY = Math.cos(t * 1.5) * 20;
                        const scrubRot = 30 + Math.sin(t) * 20;

                        // Apply scrubbing transform
                        mopGroup.setAttribute('transform', `translate(${700 + scrubX}, ${620 + scrubY}) rotate(${scrubRot})`);

                        // Generate bubbles dynamically
                        if (Math.random() > 0.7) {
                            addBubble(700 + scrubX, 620 + scrubY);
                        }

                        // Fade the mess
                        const fadeProgress = Math.min(progress / 1200, 1); 
                        messGroup.style.opacity = 1 - fadeProgress;
                        messGroup.style.transform = `translate(750px, 650px) scale(${1 - (fadeProgress * 0.8)})`;

                        animationId = requestAnimationFrame(animate);
                    } else {
                        cleanup();
                    }
                };

                animationId = requestAnimationFrame(animate);
            });

            function cleanup() {
                cancelAnimationFrame(animationId);
                
                // Reset Mop Position gracefully
                mopGroup.style.transition = "transform 0.5s ease-out";
                mopGroup.setAttribute('transform', `translate(700, 620) rotate(30)`);
                
                setTimeout(() => {
                    mopGroup.style.transition = "";
                }, 500);

                cleanBtn.textContent = "Sparkling Clean!";
                
                // Update Text
                document.querySelector('h1').innerHTML = "Good as<br>new.";
                document.querySelector('.subtitle').textContent = "We leave no trace behind. Just a pristine floor.";
                document.querySelector('.subtitle').style.color = "#2c3e50"; // Accent color for success

                // Reset State after delay
                setTimeout(() => {
                    cleanBtn.textContent = "Start Cleaning";
                    isCleaning = false;
                    
                    // Reset Mess (Instant for demo purposes)
                    messGroup.style.transition = "none";
                    messGroup.style.opacity = 1;
                    messGroup.style.transform = "translate(750px, 650px) scale(1)";
                    
                    // Reset Text
                    document.querySelector('h1').innerHTML = "Restore<br>Purity.";
                    document.querySelector('.subtitle').textContent = "Expert floor care for the modern home. We handle the mess so you can enjoy the space.";
                    document.querySelector('.subtitle').style.color = "#333";
                }, 3500);
            }

            function addBubble(x, y) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const rX = x + (Math.random() * 80 - 40);
                const rY = y + (Math.random() * 80 - 40);
                
                circle.setAttribute("cx", rX);
                circle.setAttribute("cy", rY);
                circle.setAttribute("r", Math.random() * 6 + 2);
                circle.setAttribute("fill", "#fff");
                circle.setAttribute("opacity", "0.8");
                
                bubblesContainer.appendChild(circle);

                let op = 0.8;
                let cy = parseFloat(rY);
                
                const bubbleAnim = setInterval(() => {
                    op -= 0.02;
                    cy -= 1.5; 
                    circle.setAttribute("opacity", op);
                    circle.setAttribute("cy", cy);

                    if (op <= 0) {
                        clearInterval(bubbleAnim);
                        if(circle.parentNode) circle.parentNode.removeChild(circle);
                    }
                }, 30);
            }
        });
    </script>
</body>
</html>
