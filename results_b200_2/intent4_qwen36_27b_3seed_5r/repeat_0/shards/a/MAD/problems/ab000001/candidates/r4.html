<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        /* 
           DESIGN SYSTEM: STORYBOOK TACTILE
           Identity: Chunky Serif, Graph Paper, Recessed Grid, Ink Paths, 3D Toys.
           Palette: Cream, Terracotta, Indigo, Mustard, Warm Grey.
        */

        :root {
            /* Palette */
            --bg-page: #F4F1EB; /* Soft warm grey-beige */
            --board-bg: #FDFBF7; /* Paper white */
            --board-texture: #EBE4D5; /* Graph paper lines */
            
            --color-primary: #D95A41; /* Terracotta/Rust */
            --color-path: #3D4C53; /* Deep Indigo/Slate Ink */
            --color-accent: #F4C430; /* Mustard/Gold */
            --color-cub: #FF8C42; /* Orange Cub */
            --color-grid-line: #D3CFC4; /* Soft grid lines */
            
            --text-dark: #2B2D31;
            --text-muted: #6B6E74;
            
            /* Shadows for Tactile Feel */
            --shadow-board: 0 20px 40px -10px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
            --shadow-tile-inset: inset 3px 3px 6px rgba(0,0,0,0.06), inset -3px -3px 6px rgba(255,255,255,0.8);
            --shadow-btn: 0 4px 0 #A6422E; /* Darker Terracotta for 3D depth */
            --shadow-btn-reset: 0 4px 0 #B0B3B8; /* Darker Grey */
            --shadow-token: 0 6px 10px rgba(0,0,0,0.25), 0 2px 0 rgba(0,0,0,0.1);
            
            --radius-board: 12px;
            --radius-tile: 4px;
            --radius-btn: 8px;
            
            --gap-grid: 6px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            /* System Serif Fallback */
            font-family: "Merriweather", "Lora", "Georgia", serif;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
            line-height: 1;
        }

        /* Typography accents */
        h1 span.title-cub { color: var(--color-primary); }
        h1 span.title-n { color: var(--text-muted); font-size: 0.6em; margin: 0 -2px; font-weight: 700; }
        h1 span.title-pup { color: var(--color-primary); }

        .subtitle {
            /* Handwritten style via system cursive */
            font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive;
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 600;
            font-style: italic;
            transform: rotate(-2deg);
        }

        /* --- The Game Board (Tactile Surface) --- */
        .game-container {
            position: relative;
            border-radius: var(--radius-board);
            
            /* Soft diffuse shadow for the whole board */
            box-shadow: var(--shadow-board);
            
            /* Paper Texture: Radial Gradient + Dot Pattern */
            background-color: var(--board-bg);
            background-image: 
                radial-gradient(circle at center, #FFFFFF 0%, #F4F0E6 100%),
                radial-gradient(var(--board-texture) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 20px 20px; /* Dots aligned to grid logic */
            background-position: center center, 10px 10px;
            
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        /* Inner frame to give "lip" to the board */
        .board-frame {
            border-radius: calc(var(--radius-board) - 4px);
            position: relative;
            /* Subtle inner border to define the play area */
            border: 1px solid rgba(0,0,0,0.03); 
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: var(--gap-grid);
            width: 80vmin;
            height: 80vmin;
            max-width: 480px;
            max-height: 480px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: rgba(255,255,255,0.4); /* Semi-transparent for paper feel */
            border-radius: var(--radius-tile);
            position: relative;
            cursor: pointer;
            
            /* RECESSED LOOK (Inner Bevel) */
            box-shadow: var(--shadow-tile-inset);
            border: 1px solid rgba(0,0,0,0.02);
            
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        /* Hover state: Slightly deeper */
        .tile:hover {
            background-color: rgba(255,255,255,0.6);
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.08), inset -4px -4px 8px rgba(255,255,255,0.9);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Game Elements (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: var(--gap-grid);
            z-index: 10;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Character Base Styles --- */
        .character-token {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            position: relative;
            z-index: 5;
            box-shadow: var(--shadow-token);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 4s ease-in-out infinite;
        }

        /* --- The Cub (Start) --- */
        .cub-token {
            background: var(--color-cub);
            /* Thick white sticker border */
            border: 4px solid #FFF;
            /* Isometric Cube Illusion using pseudo elements */
            overflow: visible;
        }

        /* 3D Cube Face Construction */
        .cub-face {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* Top Face (Lighter Orange) */
        .cub-face::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px;
            width: 100%; height: 100%;
            background: #FFB07A;
            border-radius: 50%;
            transform: scale(0.75);
            z-index: -1;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Eyes */
        .cub-face::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 25%;
            width: 18%;
            height: 18%;
            background: #FFF;
            border-radius: 50%;
            box-shadow: 24px 0 0 #FFF; /* Right eye */
        }
        
        /* Pupils (Using a separate div or pseudo on a child would be better, but let's stick to simple CSS) */
        /* We need a child element for pupils to not conflict with ::before/::after */
        .cub-pupils {
            position: absolute;
            top: 35%;
            left: 30%;
            width: 6%;
            height: 6%;
            background: #2B2D31;
            border-radius: 50%;
            box-shadow: 24px 0 0 #2B2D31;
        }
        
        /* Snout */
        .cub-snout {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 35%;
            height: 22%;
            background: #FFE0B2;
            border-radius: 10px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.1);
        }
        /* Nose */
        .cub-snout::after {
            content: '';
            position: absolute;
            top: 30%; left: 50%;
            transform: translateX(-50%);
            width: 40%; height: 40%;
            background: #2B2D31;
            border-radius: 50%;
        }

        /* --- The Star (Goal) --- */
        .star-token {
            /* Glowing effect */
            background: radial-gradient(circle, #FFF 10%, var(--color-accent) 90%);
            border: 3px solid #FFF;
            animation-delay: 2s;
        }
        
        .star-token svg {
            width: 60%;
            height: 60%;
            fill: #FFF;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.15));
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 1.5rem; /* Tightened spacing */
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
            max-width: 480px; /* Align with board width */
        }

        .btn-group {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        button {
            font-family: "Merriweather", "Georgia", serif; /* Match header */
            font-weight: 900;
            font-size: 1.1rem;
            padding: 14px 40px;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            position: relative;
            min-width: 140px;
            
            /* 3D Extrusion via Box Shadow (Bottom border) */
            box-shadow: var(--shadow-btn);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none; /* Remove shadow on press */
        }

        /* Run Button (Terracotta) */
        .btn-run {
            background-color: var(--color-primary);
            color: white;
        }
        .btn-run:hover {
            filter: brightness(1.05);
        }

        /* Reset Button (Ghost/Grey) */
        .btn-reset {
            background-color: #FFF;
            color: var(--text-muted);
            box-shadow: var(--shadow-btn-reset);
            border: 1px solid #E0E0E0;
        }
        .btn-reset:hover {
            color: var(--color-primary);
            border-color: #D0D0D0;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            h1 { font-size: 2.8rem; }
            .grid { width: 92vmin; height: 92vmin; }
            .btn-group { gap: 12px; }
            button { padding: 12px 24px; font-size: 1rem; min-width: 110px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <!-- Decorative Icon (Isometric Cube) -->
            <svg width="36" height="36" viewBox="0 0 100 100" style="vertical-align: middle; margin-right: 6px; overflow: visible;">
                <path d="M50 15 L85 35 L85 65 L50 85 L15 65 L15 35 Z" fill="#D95A41" stroke="#FFF" stroke-width="4" stroke-linejoin="round"/>
                <path d="M50 15 L50 85" stroke="#FFF" stroke-width="2" opacity="0.3"/>
                <path d="M15 35 L85 35" stroke="#FFF" stroke-width="2" opacity="0.3"/>
                <path d="M15 65 L85 65" stroke="#FFF" stroke-width="2" opacity="0.3"/>
            </svg>
            <span class="title-cub">Cub</span> <span class="title-n">n</span> <span class="title-pup">Pup</span>
        </h1>
        <div class="subtitle">Find the Way Home</div>
    </header>

    <main class="game-container">
        <div class="board-frame">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <div class="btn-group">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="runGame()">Run</button>
        </div>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: 0=Empty, 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        // Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight (N-S)
            2: [1, 1, 0, 0], // Corner (N-E)
            3: [1, 1, 1, 0], // T-Junction (N-E-S)
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = []; // Stores { type, rotation }

        // --- Initialization ---

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            // Generate Grid
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Create logic state
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // Create DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    // Canvas for drawing the pipe
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    // Click to rotate interaction
                    tile.addEventListener('click', () => rotateTile(x, y));

                    gridEl.appendChild(tile);

                    // Create Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            // Place Cub (Start) at 0,0
            placeEntity(0, 0, 'cub');
            // Place Star (Goal) at 4,4
            placeEntity(4, 4, 'star');

            // Initial Draw
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token character-token';
                
                // Inner Face Structure
                const face = document.createElement('div');
                face.className = 'cub-face';
                const snout = document.createElement('div');
                snout.className = 'cub-snout';
                const pupils = document.createElement('div');
                pupils.className = 'cub-pupils';
                
                cub.appendChild(face);
                cub.appendChild(snout);
                cub.appendChild(pupils);
                cell.appendChild(cub);
            } else if (type === 'star') {
                const star = document.createElement('div');
                star.className = 'star-token character-token';
                
                // SVG Star
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 24 24");
                svg.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                
                star.appendChild(svg);
                cell.appendChild(star);
            }
        }

        // --- Drawing Logic ---

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                // Clear
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Path
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            
            // Polygon dimensions - Slightly thinner, Ink-like
            const thickness = 36; 
            const halfThick = thickness / 2;
            const length = 110; // Extend fully to edge to meet neighbors

            ctx.fillStyle = '#3D4C53'; // Deep Indigo/Slate Ink
            
            // Rounded caps logic handled by drawing center rect first, then segments
            
            // Helper to draw a rectangular segment
            const drawSegment = (dir) => {
                ctx.beginPath();
                let x1, y1, w, h;

                if (dir === 0) { // Top
                    x1 = cx - halfThick;
                    y1 = cy - length;
                    w = thickness;
                    h = length;
                } else if (dir === 1) { // Right
                    x1 = cx;
                    y1 = cy - halfThick;
                    w = length;
                    h = thickness;
                } else if (dir === 2) { // Bottom
                    x1 = cx - halfThick;
                    y1 = cy;
                    w = thickness;
                    h = length;
                } else { // Left
                    x1 = cx - length;
                    y1 = cy - halfThick;
                    w = length;
                    h = thickness;
                }
                
                ctx.rect(x1, y1, w, h);
                ctx.fill();
            };

            // Get base connections
            let conns = TILE_TYPES[type];
            
            // Apply rotation logic and draw segments
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }

            // Draw Center Hub (Polygon) to cover joins and ensure clean center
            ctx.beginPath();
            ctx.rect(cx - halfThick, cy - halfThick, thickness, thickness);
            ctx.fill();
            
            // Optional: Add a subtle inner highlight to make it look "inlaid"
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath();
            ctx.rect(cx - halfThick + 2, cy - halfThick + 2, thickness - 4, thickness - 4);
            ctx.fill();
        }

        // --- Actions ---

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Simulate a path finding animation
            // Hardcoded path for demo visual: Diagonal
            const pathIndices = [0, 6, 12, 18, 24]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    // Highlight effect - Warm Cream to Bright White
                    t.style.backgroundColor = '#FFF'; 
                    t.style.boxShadow = 'inset 2px 2px 4px rgba(0,0,0,0.05), inset -2px -2px 4px rgba(255,255,255,0.9), 0 0 15px rgba(244, 196, 48, 0.4)';
                    
                    // Add a small pulse to the character if it hits the goal
                    if (i === pathIndices.length - 1) {
                        const star = document.querySelector('.star-token');
                        if(star) {
                            star.style.transform = "scale(1.3) rotate(15deg)";
                            setTimeout(() => star.style.transform = "", 500);
                        }
                    }
                }, delay);
                delay += 250;
            });

            setTimeout(() => {
                btn.innerText = "Done!";
                btn.style.backgroundColor = "#F4C430"; // Mustard Success
                btn.style.boxShadow = "0 4px 0 #C7A052";
                btn.style.color = "#2B2D31";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; 
                    btn.style.boxShadow = "";
                    btn.style.color = "";
                    
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                        t.style.boxShadow = '';
                    });
                }, 1500);
            }, delay + 500);
        }

        // Start
        initGame();

    </script>
</body>
</html>
