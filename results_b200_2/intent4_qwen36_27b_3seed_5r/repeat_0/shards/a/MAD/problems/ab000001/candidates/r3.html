<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        /* 
           DESIGN SYSTEM: STORYBOOK PLAYFUL
           Identity: Warm, tactile, rounded, high contrast.
           Palette: Cream, Terracotta, Deep Teal, Mustard.
        */

        :root {
            /* Palette */
            --bg-page: #FDFCF8;
            --bg-board-texture: #F0E6D2;
            --bg-tile: #FFF8E1; /* Warm cream */
            
            --color-primary: #E76F51; /* Terracotta */
            --color-secondary: #2A9D8F; /* Deep Teal */
            --color-accent: #E9C46A; /* Mustard */
            
            --text-dark: #264653;
            --text-muted: #8D99AE;
            
            --path-color: #264653; /* Dark Teal/Brown for paths */
            --path-highlight: #2A9D8F;
            
            --shadow-soft: 0 10px 25px rgba(38, 70, 83, 0.15);
            --shadow-tile: 0 4px 0 #E6DCC3, 0 5px 5px rgba(0,0,0,0.05);
            --shadow-tile-active: 0 2px 0 #E6DCC3, 0 2px 2px rgba(0,0,0,0.05);
            --shadow-piece: 0 8px 15px rgba(0,0,0,0.2), 0 4px 0 rgba(0,0,0,0.1);
            
            --radius-board: 24px;
            --radius-tile: 16px;
            --radius-btn: 50px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            font-family: "Fredoka One", "Chalkboard SE", "Comic Sans MS", "Arial Rounded MT Bold", sans-serif;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 1rem;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 2px 2px 0px rgba(231, 111, 81, 0.2);
            line-height: 1;
        }

        /* Typography accents */
        h1 span.title-cub { color: var(--color-primary); }
        h1 span.title-n { color: var(--text-muted); font-size: 0.7em; margin: 0 -4px; font-weight: 600; }
        h1 span.title-pup { color: var(--color-secondary); }

        .subtitle {
            font-family: "Arial", sans-serif; /* Clean sans for subtitle */
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 6px;
            font-weight: 700;
        }

        /* --- The Game Board (Tactile Surface) --- */
        .game-container {
            position: relative;
            border-radius: var(--radius-board);
            
            /* Soft diffuse shadow */
            box-shadow: var(--shadow-soft);
            
            /* Wood/Texture Background using gradients */
            background-color: var(--bg-board-texture);
            background-image: 
                radial-gradient(#D4C5A9 15%, transparent 16%), 
                radial-gradient(#D4C5A9 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        /* Inner frame to give "lip" to the board */
        .board-frame {
            background: rgba(255,255,255,0.4);
            padding: 4px;
            border-radius: calc(var(--radius-board) - 8px);
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px; /* Gap creates the grid lines implicitly */
            width: 80vmin;
            height: 80vmin;
            max-width: 480px;
            max-height: 480px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--bg-tile);
            border-radius: var(--radius-tile);
            position: relative;
            cursor: pointer;
            
            /* Raised Square Look */
            box-shadow: var(--shadow-tile);
            border: 1px solid rgba(255,255,255,0.6);
            
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: var(--shadow-tile-active);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Game Elements (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 4px; /* Matches board-frame padding */
            left: 4px;
            right: 4px;
            bottom: 4px;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            z-index: 10;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Character Base Styles --- */
        .character-token {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            position: relative;
            z-index: 5;
            box-shadow: var(--shadow-piece);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 3s ease-in-out infinite;
        }

        /* --- The Cub (Start) --- */
        .cub-token {
            background: var(--color-primary);
            border: 3px solid #FFF;
        }
        /* Cub Face */
        .cub-face {
            width: 100%;
            height: 100%;
            position: relative;
        }
        /* Eyes */
        .cub-face::before {
            content: '';
            position: absolute;
            top: 35%;
            left: 25%;
            width: 16%;
            height: 16%;
            background: #FFF;
            border-radius: 50%;
            box-shadow: 22px 0 0 #FFF; /* Right eye */
        }
        /* Pupils */
        .cub-face::after {
            content: '';
            position: absolute;
            top: 40%;
            left: 30%;
            width: 6%;
            height: 6%;
            background: #264653;
            border-radius: 50%;
            box-shadow: 22px 0 0 #264653;
        }
        /* Snout */
        .cub-snout {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 20%;
            background: #FFE0B2;
            border-radius: 10px;
        }

        /* --- The Star (Goal) --- */
        .star-token {
            background: var(--color-accent);
            border: 3px solid #FFF;
            animation-delay: 1.5s;
        }
        /* Star Shape via SVG */
        .star-token svg {
            width: 65%;
            height: 65%;
            fill: #FFF;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            background: rgba(255,255,255,0.8);
            padding: 8px;
            border-radius: var(--radius-btn);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        button {
            font-family: inherit;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 12px 40px;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-width: 120px;
        }

        button:active {
            transform: translateY(2px);
        }

        /* Run Button (Vibrant Accent) */
        .btn-run {
            background-color: var(--color-secondary);
            color: white;
            box-shadow: 0 4px 0 #1D776F; /* Solid shadow, no blur */
        }
        .btn-run:hover {
            background-color: #21867a;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1D776F;
        }
        .btn-run:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #1D776F;
        }

        /* Reset Button (Ghost/Outline) */
        .btn-reset {
            background-color: transparent;
            color: var(--text-muted);
            border: 2px solid #D1D9E6;
            box-shadow: none;
        }
        .btn-reset:hover {
            color: var(--color-primary);
            border-color: var(--color-primary);
            background-color: rgba(231, 111, 81, 0.05);
        }
        .btn-reset:active {
            transform: translateY(2px);
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            h1 { font-size: 2.5rem; }
            .grid { width: 90vmin; height: 90vmin; }
            .btn-group { gap: 8px; padding: 6px; }
            button { padding: 10px 24px; font-size: 0.9rem; min-width: 90px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <!-- Decorative SVG Icon -->
            <svg width="40" height="40" viewBox="0 0 100 100" style="vertical-align: middle; margin-right: 4px; overflow: visible;">
                <rect x="15" y="15" width="70" height="70" rx="20" fill="#E76F51" />
                <circle cx="35" cy="45" r="7" fill="#FFF" />
                <circle cx="65" cy="45" r="7" fill="#FFF" />
                <circle cx="35" cy="45" r="3" fill="#264653" />
                <circle cx="65" cy="45" r="3" fill="#264653" />
                <rect x="35" y="60" width="30" height="12" rx="6" fill="#FFE0B2" />
            </svg>
            <span class="title-cub">Cub</span> <span class="title-n">n</span> <span class="title-pup">Pup</span>
        </h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <main class="game-container">
        <div class="board-frame">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <div class="btn-group">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="runGame()">Run</button>
        </div>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: 0=Empty, 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        // Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight (N-S)
            2: [1, 1, 0, 0], // Corner (N-E)
            3: [1, 1, 1, 0], // T-Junction (N-E-S)
            4: [1, 1, 1, 1], // Cross
        };

        let boardState = []; // Stores { type, rotation }

        // --- Initialization ---

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            // Generate Grid
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Create logic state
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // Create DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    // Canvas for drawing the pipe
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    // Click to rotate interaction
                    tile.addEventListener('click', () => rotateTile(x, y));

                    gridEl.appendChild(tile);

                    // Create Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            // Place Cub (Start) at 0,0
            placeEntity(0, 0, 'cub');
            // Place Star (Goal) at 4,4
            placeEntity(4, 4, 'star');

            // Initial Draw
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token character-token';
                
                // Inner Face Structure
                const face = document.createElement('div');
                face.className = 'cub-face';
                const snout = document.createElement('div');
                snout.className = 'cub-snout';
                
                cub.appendChild(face);
                cub.appendChild(snout);
                cell.appendChild(cub);
            } else if (type === 'star') {
                const star = document.createElement('div');
                star.className = 'star-token character-token';
                
                // SVG Star
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 24 24");
                svg.innerHTML = '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>';
                
                star.appendChild(svg);
                cell.appendChild(star);
            }
        }

        // --- Drawing Logic ---

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                // Clear
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Path
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            
            // Polygon dimensions - Thicker and Saturated
            const thickness = 44; 
            const halfThick = thickness / 2;
            const length = 100; // Extend fully to edge

            ctx.fillStyle = '#264653'; // Dark Teal/Brown
            
            // Rounded caps logic handled by drawing center rect first, then segments
            
            // Helper to draw a rectangular segment
            const drawSegment = (dir) => {
                ctx.beginPath();
                let x1, y1, w, h;

                if (dir === 0) { // Top
                    x1 = cx - halfThick;
                    y1 = cy - length;
                    w = thickness;
                    h = length;
                } else if (dir === 1) { // Right
                    x1 = cx;
                    y1 = cy - halfThick;
                    w = length;
                    h = thickness;
                } else if (dir === 2) { // Bottom
                    x1 = cx - halfThick;
                    y1 = cy;
                    w = thickness;
                    h = length;
                } else { // Left
                    x1 = cx - length;
                    y1 = cy - halfThick;
                    w = length;
                    h = thickness;
                }
                
                ctx.rect(x1, y1, w, h);
                ctx.fill();
            };

            // Get base connections
            let conns = TILE_TYPES[type];
            
            // Apply rotation logic and draw segments
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }

            // Draw Center Hub (Polygon) to cover joins and ensure clean center
            ctx.beginPath();
            ctx.rect(cx - halfThick, cy - halfThick, thickness, thickness);
            ctx.fill();
            
            // Optional: Add a subtle inner highlight to make it look "inlaid"
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.rect(cx - halfThick + 2, cy - halfThick + 2, thickness - 4, thickness - 4);
            ctx.fill();
        }

        // --- Actions ---

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Simulate a path finding animation
            // Hardcoded path for demo visual: Diagonal
            const pathIndices = [0, 6, 12, 18, 24]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    // Highlight effect - Warm Cream to Bright White
                    t.style.backgroundColor = '#FFF'; 
                    t.style.boxShadow = '0 4px 0 #FFF, 0 5px 5px rgba(0,0,0,0.1)';
                    
                    // Add a small pulse to the character if it hits the goal
                    if (i === pathIndices.length - 1) {
                        const star = document.querySelector('.star-token');
                        if(star) {
                            star.style.transform = "scale(1.3) rotate(15deg)";
                            setTimeout(() => star.style.transform = "", 500);
                        }
                    }
                }, delay);
                delay += 250;
            });

            setTimeout(() => {
                btn.innerText = "Done!";
                btn.style.backgroundColor = "#E9C46A"; // Mustard Success
                btn.style.boxShadow = "0 4px 0 #C7A052";
                btn.style.color = "#264653";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; 
                    btn.style.boxShadow = "";
                    btn.style.color = "";
                    
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                        t.style.boxShadow = '';
                    });
                }, 1500);
            }, delay + 500);
        }

        // Start
        initGame();

    </script>
</body>
</html>
