<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        /* 
           DESIGN SYSTEM: STORYBOOK TACTILE
           Identity: Parchment, Wood Blocks, Ink, Warmth.
           Palette: Cream, Terracotta, Wood, Mustard, Ink.
        */

        :root {
            /* Palette */
            --bg-parchment: #F5F1E8;
            --bg-parchment-dark: #EBE4D5;
            
            --tile-wood-light: #EAE1D3;
            --tile-wood-dark: #D6CBB8;
            --tile-shadow: #C5B8A3;
            
            --color-path: #C05640; /* Terracotta Ink */
            --color-path-shadow: #9E4331;
            
            --color-cub-body: #8D5B4C; /* Warm Brown */
            --color-cub-face: #E6C2B5; /* Cream */
            
            --color-accent: #F4C430; /* Gold */
            
            --text-dark: #4A3B32; /* Warm Brown Ink */
            --text-muted: #7D6E63;
            
            /* Shadows */
            --shadow-board: 0 25px 50px -12px rgba(74, 59, 50, 0.25), 0 0 0 1px rgba(74, 59, 50, 0.05);
            --shadow-tile: 
                inset 2px 2px 5px rgba(255,255,255,0.6), 
                inset -2px -2px 5px rgba(0,0,0,0.05),
                1px 1px 0px rgba(255,255,255,0.5),
                2px 2px 4px rgba(0,0,0,0.1);
            
            --shadow-btn-run: 0 6px 0 #9E4331;
            --shadow-btn-reset: 0 6px 0 #B5A895;

            --radius-tile: 8px;
            --radius-btn: 12px;
            
            --gap-grid: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-parchment);
            /* Subtle Noise Texture via SVG Data URI */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            
            font-family: "Georgia", "Times New Roman", serif;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700; /* Serif Bold */
            margin: 0;
            letter-spacing: 0.05em;
            color: var(--color-path);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
            line-height: 1;
        }

        /* Typography accents */
        h1 span.title-cub, h1 span.title-pup { color: var(--color-path); }
        h1 span.title-n { color: var(--text-muted); font-size: 0.7em; margin: 0 -4px; font-weight: 400; font-style: italic; }

        .subtitle {
            font-family: "Courier New", Courier, monospace; /* Typewriter feel */
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 0.1em;
            position: relative;
            display: inline-block;
        }
        
        /* Decorative lines for subtitle */
        .subtitle::before, .subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 1px;
            background: var(--tile-shadow);
        }
        .subtitle::before { left: -25px; }
        .subtitle::after { right: -25px; }

        /* --- The Game Board (Wooden Frame) --- */
        .game-container {
            position: relative;
            border-radius: 16px;
            padding: 20px;
            
            /* Board Background */
            background-color: var(--bg-parchment-dark);
            box-shadow: 
                inset 0 0 40px rgba(0,0,0,0.05),
                var(--shadow-board);
            
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* Inner shadow for depth of play area */
        .board-frame {
            border-radius: 10px;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.1);
            padding: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: var(--gap-grid);
            width: 80vmin;
            height: 80vmin;
            max-width: 450px;
            max-height: 450px;
        }

        /* --- Tiles (Wooden Blocks) --- */
        .tile {
            background-color: var(--tile-wood-light);
            border-radius: var(--radius-tile);
            position: relative;
            cursor: pointer;
            
            /* 3D Block Look */
            box-shadow: var(--shadow-tile);
            border: 1px solid var(--tile-wood-dark);
            
            transition: transform 0.1s ease, filter 0.2s ease;
            overflow: hidden;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Game Elements (Cub & Den) --- */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: var(--gap-grid);
            z-index: 10;
            padding: 4px; /* Match board-frame padding */
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- The Cub (Custom CSS Bear) --- */
        .cub-token {
            width: 60%;
            aspect-ratio: 1;
            position: relative;
            z-index: 5;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2));
            animation: breathe 3s ease-in-out infinite;
        }

        /* Bear Head */
        .cub-head {
            width: 100%;
            height: 100%;
            background: var(--color-cub-body);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2);
        }

        /* Ears */
        .cub-head::before, .cub-head::after {
            content: '';
            position: absolute;
            top: -10%;
            width: 30%;
            height: 30%;
            background: var(--color-cub-body);
            border-radius: 50%;
            z-index: -1;
        }
        .cub-head::before { left: -5%; }
        .cub-head::after { right: -5%; }

        /* Face Mask */
        .cub-mask {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 55%;
            background: var(--color-cub-face);
            border-radius: 50% 50% 40% 40%;
        }

        /* Eyes */
        .cub-eyes {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            display: flex;
            justify-content: space-between;
        }
        .eye {
            width: 12%;
            height: 12%;
            background: #3E2723;
            border-radius: 50%;
            position: relative;
        }
        .eye::after {
            content: '';
            position: absolute;
            top: 20%; left: 20%;
            width: 40%; height: 40%;
            background: white;
            border-radius: 50%;
        }

        /* Nose */
        .cub-nose {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 18%;
            height: 12%;
            background: #3E2723;
            border-radius: 40% 40% 50% 50%;
        }

        /* --- The Goal (Den/Star) --- */
        .goal-token {
            width: 60%;
            aspect-ratio: 1;
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .goal-token svg {
            width: 100%;
            height: 100%;
            fill: var(--color-accent);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* --- Footer Controls (Physical Buttons) --- */
        .controls {
            margin-top: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .btn-group {
            display: flex;
            gap: 24px;
            padding: 8px;
        }

        button {
            font-family: "Georgia", serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 12px 36px;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s;
            position: relative;
        }

        /* Run Button (Primary - Terracotta Wood) */
        .btn-run {
            background-color: var(--color-path);
            color: #FFF;
            box-shadow: var(--shadow-btn-run);
            font-size: 1.25rem;
            padding: 14px 48px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-run:hover {
            background-color: #D0634C;
        }
        .btn-run:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Reset Button (Secondary - Fabric/Grey) */
        .btn-reset {
            background-color: #FFF;
            color: var(--text-muted);
            box-shadow: var(--shadow-btn-reset);
            border: 1px solid #E0DCD3;
        }
        .btn-reset:hover {
            color: var(--color-path);
            background-color: #FAFAFA;
        }
        .btn-reset:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* --- Animations --- */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(244, 196, 48, 0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 12px rgba(244, 196, 48, 0.7)); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            h1 { font-size: 2.8rem; }
            .grid { width: 90vmin; height: 90vmin; }
            .btn-group { gap: 16px; }
            button { padding: 10px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span class="title-cub">Cub</span> <span class="title-n">n</span> <span class="title-pup">Pup</span>
        </h1>
        <div class="subtitle">Find the way home</div>
    </header>

    <main class="game-container">
        <div class="board-frame">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Goal -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <footer class="controls">
        <div class="btn-group">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="runGame()">Run</button>
        </div>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: Connections [Top, Right, Bottom, Left]
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight
            2: [1, 1, 0, 0], // Corner
            3: [1, 1, 1, 0], // T-Junction
            4: [1, 1, 1, 1], // Cross
            5: [0, 0, 0, 0], // Empty (Start/End)
        };

        let boardState = [];

        // --- Initialization ---

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Logic State
                    const typeKeys = Object.keys(TILE_TYPES).map(Number).filter(k => k !== 5);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            // Clear start/end tiles visually
            boardState[0][0].type = 5; // Start
            boardState[4][4].type = 5; // End

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'goal');
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                
                const head = document.createElement('div');
                head.className = 'cub-head';
                
                const mask = document.createElement('div');
                mask.className = 'cub-mask';
                
                const eyes = document.createElement('div');
                eyes.className = 'cub-eyes';
                eyes.innerHTML = '<div class="eye"></div><div class="eye"></div>';
                
                const nose = document.createElement('div');
                nose.className = 'cub-nose';
                
                head.appendChild(mask);
                head.appendChild(eyes);
                head.appendChild(nose);
                cub.appendChild(head);
                cell.appendChild(cub);
            } else if (type === 'goal') {
                const goal = document.createElement('div');
                goal.className = 'goal-token';
                
                // Hand-drawn style Star SVG
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 100 100");
                svg.innerHTML = '<path d="M50 5 L63 35 L95 35 L69 55 L78 85 L50 68 L22 85 L31 55 L5 35 L37 35 Z" />';
                
                goal.appendChild(svg);
                cell.appendChild(goal);
            }
        }

        // --- Drawing Logic ---

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (state.type !== 5) {
                    drawPipe(ctx, state.type, state.rotation);
                }
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 40; 
            const halfThick = thickness / 2;
            const length = 120; // Edge to edge

            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            // Shadow for the path (Ink effect)
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = thickness + 6;
            ctx.beginPath();
            drawPathGeometry(ctx, type, rotation, cx, cy, length);
            ctx.stroke();

            // Main Path
            ctx.strokeStyle = '#C05640'; // Terracotta
            ctx.lineWidth = thickness;
            ctx.beginPath();
            drawPathGeometry(ctx, type, rotation, cx, cy, length);
            ctx.stroke();

            // Highlight (Subtle)
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = thickness - 8;
            ctx.beginPath();
            drawPathGeometry(ctx, type, rotation, cx, cy, length);
            ctx.stroke();
        }

        // Helper to draw the geometry based on type/rotation
        function drawPathGeometry(ctx, type, rotation, cx, cy, len) {
            const conns = TILE_TYPES[type];
            
            // Draw center dot first to ensure connectivity
            // ctx.moveTo(cx, cy); 

            // We draw lines from center to edges
            // Directions: 0:Top, 1:Right, 2:Bottom, 3:Left
            
            // Draw segments
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    ctx.moveTo(cx, cy);
                    
                    if (targetDir === 0) ctx.lineTo(cx, cy - len);
                    if (targetDir === 1) ctx.lineTo(cx + len, cy);
                    if (targetDir === 2) ctx.lineTo(cx, cy + len);
                    if (targetDir === 3) ctx.lineTo(cx - len, cy);
                }
            }
        }

        // --- Actions ---

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Solving...";
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Simulate a path finding animation (Hardcoded diagonal for demo)
            const pathIndices = [0, 6, 12, 18, 24]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    // Highlight effect - Warm Cream to Bright White
                    t.style.backgroundColor = '#FFF'; 
                    t.style.boxShadow = 'inset 2px 2px 4px rgba(0,0,0,0.05), inset -2px -2px 4px rgba(255,255,255,0.9), 0 0 15px rgba(244, 196, 48, 0.4)';
                    
                    if (i === pathIndices.length - 1) {
                        const goal = document.querySelector('.goal-token');
                        if(goal) {
                            goal.style.transform = "scale(1.3) rotate(15deg)";
                            setTimeout(() => goal.style.transform = "", 500);
                        }
                    }
                }, delay);
                delay += 250;
            });

            setTimeout(() => {
                btn.innerText = "Done!";
                btn.style.backgroundColor = "#F4C430"; // Mustard Success
                btn.style.boxShadow = "0 4px 0 #C7A052";
                btn.style.color = "#2B2D31";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; 
                    btn.style.boxShadow = "";
                    btn.style.color = "";
                    
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                        t.style.boxShadow = '';
                    });
                }, 1500);
            }, delay + 500);
        }

        // Start
        initGame();

    </script>
</body>
</html>
