<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension — Skill Matrix</title>
<style>
    :root {
        /* Palette: Ethereal Void */
        --bg-deep: #05020a;
        --bg-panel: rgba(10, 8, 18, 0.75);
        --border-dim: rgba(139, 120, 200, 0.2);
        --border-highlight: rgba(139, 120, 200, 0.5);
        
        /* Accents */
        --accent-primary: #a855f7; /* Vibrant Purple */
        --accent-glow: #d8b4fe; /* Soft Lavender */
        --accent-secondary: #4c1d95; /* Deep Violet */
        --accent-gold: #fbbf24; /* Amber */
        --accent-gold-glow: #f59e0b;
        
        /* Text */
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --text-dark: #4b5563; 
        
        /* Typography */
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif;
        --font-header: 'Palatino Linotype', 'Book Antiqua', Palatino, serif; /* Fantasy Serif */
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background: Atmospheric Nebula --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -2;
        /* Multi-stop radial gradient to simulate nebula */
        background: 
            radial-gradient(circle at 80% 20%, rgba(76, 29, 149, 0.25) 0%, transparent 50%),
            radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, #1e1b4e 0%, #0f0f1a 60%, #000000 100%);
    }

    /* Particle Field Simulation via CSS */
    .bg-particles {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background-image: 
            radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
            radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
            radial-gradient(1px 1px at 160px 120px, #ffffff, rgba(0,0,0,0));
        background-size: 200px 200px;
        opacity: 0.3;
        animation: drift 60s linear infinite;
    }

    @keyframes drift {
        from { background-position: 0 0; }
        to { background-position: 100px 100px; }
    }

    /* --- Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: 100%;
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        background: linear-gradient(180deg, rgba(10, 8, 18, 0.9) 0%, rgba(5, 2, 10, 0.8) 100%);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        z-index: 10;
        backdrop-filter: blur(12px);
        position: relative;
    }

    /* Sidebar Header */
    .sidebar-title {
        font-family: var(--font-header);
        font-size: 1.2rem;
        color: var(--accent-glow);
        text-transform: uppercase;
        letter-spacing: 3px;
        text-align: center;
        margin-bottom: 40px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 15px;
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    .character-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .avatar-ring {
        width: 110px;
        height: 110px;
        margin: 0 auto 20px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--accent-primary), var(--bg-deep), var(--accent-secondary));
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        position: relative;
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* CSS-only Avatar Graphic */
    .avatar-graphic {
        width: 60px;
        height: 60px;
        background: var(--accent-secondary);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.9;
        position: relative;
    }
    .avatar-graphic::after {
        content: '';
        position: absolute;
        top: 10px; left: 10px; right: 10px; bottom: 10px;
        background: var(--accent-primary);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.8;
    }

    .char-name {
        font-family: var(--font-header);
        font-size: 1.6rem;
        font-weight: 600;
        color: #fff;
        margin: 0;
        letter-spacing: 0.5px;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-primary);
        letter-spacing: 2px;
        margin-top: 5px;
        text-transform: uppercase;
        font-weight: 700;
    }

    /* Stats Block */
    .stats-block {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .level-display {
        text-align: center;
        padding: 10px 0;
    }

    .level-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 5px;
    }

    .level-value {
        font-family: var(--font-header);
        font-size: 3.5rem;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    /* XP Section */
    .xp-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .xp-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    .xp-track {
        height: 4px; /* Thinner track */
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-primary), 0 0 20px rgba(168, 85, 247, 0.3); /* Glow */
        position: relative;
    }
    
    /* Skill Points Box */
    .points-box {
        margin-top: 10px;
        padding: 20px;
        background: rgba(168, 85, 247, 0.05);
        border: 1px solid var(--border-dim);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        position: relative;
        overflow: hidden;
    }
    
    /* Subtle shine effect on points box */
    .points-box::before {
        content: '';
        position: absolute;
        top: 0; left: -50%; width: 200%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: skewX(-20deg);
    }

    .points-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .points-count {
        font-family: var(--font-header);
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent-glow);
        text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        line-height: 1;
    }

    /* --- Main Canvas Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(20,10,30,0.2) 0%, transparent 80%);
    }
    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- Node Styles: Unified Triangles --- */
    .node {
        position: absolute;
        width: 100px; /* Wider for label */
        height: 100px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Triangle Container */
    .tri-shape {
        width: 50px;
        height: 50px;
        position: relative;
        margin-top: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* The Triangle Clip Path */
    .tri-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        /* Upward pointing triangle */
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        transition: all 0.3s ease;
        z-index: 1;
    }

    /* The Triangle Border (Simulated via SVG) */
    .tri-border {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
    }
    
    .tri-border svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .tri-icon {
        width: 20px;
        height: 20px;
        z-index: 3;
        margin-top: 10px; /* Push icon down slightly to center visually in triangle */
        transition: all 0.3s ease;
    }

    .node-label {
        margin-top: 12px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: center;
        white-space: nowrap;
        font-weight: 600;
        transition: all 0.3s ease;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* --- States --- */

    /* 1. LOCKED */
    .node.locked .tri-bg {
        background: #1a1a24;
    }
    .node.locked .tri-border svg path {
        fill: none;
        stroke: #3f3f5a; /* Visible dark border */
        stroke-width: 2;
    }
    .node.locked .tri-icon {
        fill: #3f3f5a;
        opacity: 0.6;
    }
    .node.locked .node-label {
        color: #8888aa; /* Increased contrast */
        text-shadow: 0 1px 2px #000;
    }

    /* 2. UNLOCKED (Active Path) */
    .node.unlocked .tri-bg {
        background: linear-gradient(180deg, rgba(76, 29, 149, 0.8), rgba(168, 85, 247, 0.4));
        box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.5);
    }
    .node.unlocked .tri-border svg path {
        fill: none;
        stroke: var(--accent-glow);
        stroke-width: 2;
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }
    .node.unlocked .tri-icon {
        fill: #fff;
        filter: drop-shadow(0 0 3px var(--accent-glow));
    }
    .node.unlocked .node-label {
        color: #fff;
        text-shadow: 0 0 10px var(--accent-primary);
    }

    /* 3. MAXED (Gold/Amber Gradient) */
    .node.maxed .tri-bg {
        background: linear-gradient(180deg, rgba(251, 191, 36, 0.8), rgba(245, 158, 11, 0.4));
    }
    .node.maxed .tri-border svg path {
        fill: none;
        stroke: #fff; /* White stroke for high contrast against gold */
        stroke-width: 2;
        filter: drop-shadow(0 0 6px var(--accent-gold));
    }
    .node.maxed .tri-icon {
        fill: #fff;
        filter: drop-shadow(0 0 2px #fff);
    }
    .node.maxed .node-label {
        color: var(--accent-gold);
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    /* Hover Effects */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 100;
    }
    .node:hover .tri-bg {
        filter: brightness(1.3);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        width: 280px;
        background: rgba(15, 12, 25, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 20px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        transform: translateY(10px);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 10px;
        font-family: var(--font-header);
        font-size: 1.3rem;
        color: var(--accent-glow);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }
    
    .tooltip .desc {
        font-size: 0.9rem;
        color: #d1d5db;
        line-height: 1.6;
        margin-bottom: 15px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.85rem;
        color: var(--accent-gold);
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        background: rgba(255,255,255,0.05);
        padding: 8px 12px;
        border-radius: 4px;
    }

</style>
</head>
<body>

<!-- Backgrounds -->
<div class="bg-atmosphere"></div>
<div class="bg-particles"></div>

<div class="dashboard">
    <!-- Sidebar -->
    <aside>
        <!-- Stylized Header -->
        <div class="sidebar-title">Skill Matrix</div>

        <div class="character-header">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <div class="avatar-graphic"></div>
                </div>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="stats-block">
            <div class="level-display">
                <span class="level-label">Level</span>
                <div class="level-value">42</div>
            </div>

            <div class="xp-section">
                <div class="xp-header">
                    <span>Experience</span>
                    <span>7,500 / 10,000</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <!-- Points Box: Integrated into sidebar -->
            <div class="points-box">
                <span class="points-label">Available Points</span>
                <div class="points-count" id="sp-display">3</div>
            </div>
        </div>
    </aside>

    <!-- Main Tree Area -->
    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span id="tt-cost" style="color: #fff; opacity: 0.7;">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * Skill Tree Data
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your connection to the Void.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'shadow', name: 'Shadow Step', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Move through shadows instantly.', stat: '+5% Move Speed' },
        { id: 'shield', name: 'Void Shield', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Absorb damage into the void.', stat: '+10% Armor' },
        
        // Tier 2
        { id: 'drain', name: 'Soul Drain', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Steal life from enemies.', stat: '+5% Lifesteal' },
        { id: 'blink', name: 'Phantom Blink', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Teleport short distances.', stat: '-15% Cooldown' },
        { id: 'ward', name: 'Entropy Ward', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Reflect void damage.', stat: '+10% Reflect' },

        // Tier 3
        { id: 'shatter', name: 'Reality Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Crack the fabric of reality.', stat: 'Unlock Ultimate' },
        { id: 'time', name: 'Time Warp', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Slow time around you.', stat: '-20% Enemy Speed' },
        { id: 'void', name: 'Dark Matter', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Increase void gravity.', stat: '+15% Pull Radius' },
        { id: 'disint', name: 'Disintegrate', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Turn enemies to dust.', stat: 'Unlock Skill' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Become the Void.', stat: 'ALL STATS +10%' }
    ];

    const connections = [
        ['root', 'shadow'], ['root', 'shield'],
        ['shadow', 'drain'], ['shadow', 'blink'], ['shield', 'blink'], ['shield', 'ward'],
        ['drain', 'shatter'], ['blink', 'time'], ['ward', 'void'],
        ['time', 'apex'], ['void', 'apex']
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // Triangle SVG Path (Point Up)
    const triPath = "M25 0 L50 50 L0 50 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // SVG Icon selection (All Triangles now)
            let iconPath = '';
            // Different icon paths for visual variety inside the unified shape
            if(skill.id.includes('shield') || skill.id.includes('ward')) {
                // Shield Icon
                iconPath = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>';
            } else if(skill.id.includes('shadow') || skill.id.includes('blink')) {
                // Moon/Shadow Icon
                iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/>';
            } else {
                // Lightning/Attack Icon
                iconPath = '<path d="M7 2v11h3v9l7-12h-4l4-8z"/>';
            }

            el.innerHTML = `
                <div class="tri-shape">
                    <div class="tri-bg"></div>
                    <div class="tri-border">
                        <svg viewBox="0 0 50 50"><path d="${triPath}"/></svg>
                    </div>
                    <svg class="tri-icon" viewBox="0 0 24 24">${iconPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                upgradeSkill(skill);
            });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering Connections (Refined: Thinner, Subtle) ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isPathActive = parent.level > 0;
            const isFullyUnlocked = parent.level > 0 && child.level > 0;

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            // Bezier curve for smooth flow
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isFullyUnlocked) {
                // Active Path: Neon Glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.8)';
                ctx.strokeStyle = '#d8b4fe'; // Lighter core
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Outer Glow
                ctx.shadowBlur = 20;
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.3)';
                ctx.lineWidth = 4;
                ctx.stroke();

            } else if (isPathActive) {
                // Path exists but destination locked
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#4c1d95'; 
                ctx.lineWidth = 1.5;
                ctx.stroke();

            } else {
                // Locked path: Dashed, subtle
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(100, 100, 120, 0.2)'; // Very subtle
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]); 
                ctx.stroke();
                ctx.setLineDash([]);
            }
        });

        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        let hasParentUnlocked = false;
        if(skill.id === 'root') hasParentUnlocked = true;
        else {
            connections.forEach(([p, c]) => {
                if(c === skill.id) {
                    const parent = skillData.find(s => s.id === p);
                    if(parent.level > 0) hasParentUnlocked = true;
                }
            });
        }

        if(!hasParentUnlocked) return;

        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Visual feedback
        const tri = node.querySelector('.tri-shape');
        tri.style.transform = 'scale(1.3)';
        setTimeout(() => tri.style.transform = 'scale(1)', 200);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        
        const costEl = document.getElementById('tt-cost');
        if (skill.level < skill.max) {
            costEl.textContent = `Cost: ${skill.cost} | Lvl ${skill.level}/${skill.max}`;
            costEl.style.color = availablePoints >= skill.cost ? '#fff' : '#ff4444';
        } else {
            costEl.textContent = 'MAXED';
            costEl.style.color = 'var(--accent-gold)';
        }

        if(x + 280 > window.innerWidth) {
            tooltip.style.left = (x - 300) + 'px';
        } else {
            tooltip.style.left = x + 'px';
        }
        tooltip.style.top = y + 'px';
        
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
