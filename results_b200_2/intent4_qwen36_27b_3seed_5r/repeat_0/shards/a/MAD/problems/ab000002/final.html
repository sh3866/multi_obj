<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension — Skill Matrix</title>
<style>
    :root {
        /* Palette: Ethereal Void */
        --bg-deep: #05020a;
        --bg-panel: rgba(10, 8, 18, 0.6);
        --border-dim: rgba(139, 120, 200, 0.1);
        
        /* Accents */
        --accent-primary: #a855f7; /* Purple */
        --accent-secondary: #581c87;
        --accent-gold: #fbbf24;
        
        /* Skill Colors */
        --color-offense: #f43f5e; /* Red/Pink for Attack */
        --color-defense: #3b82f6; /* Blue for Defense */
        --color-utility: #8b5cf6; /* Purple for Core */

        /* Text */
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #475569; 
        
        /* Typography: Unified Sans-Serif */
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background: Living Void (Canvas) --- */
    #bg-canvas {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -2;
    }

    /* Subtle Grid Overlay */
    .bg-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        opacity: 0.6;
        pointer-events: none;
    }

    /* --- Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: 100%;
    }

    /* --- Sidebar (Refined Hierarchy) --- */
    aside {
        width: 300px;
        background: linear-gradient(180deg, rgba(10, 8, 18, 0.9) 0%, rgba(5, 2, 10, 0.95) 100%);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        z-index: 10;
        backdrop-filter: blur(10px);
        box-shadow: 5px 0 40px rgba(0,0,0,0.6);
    }

    .sidebar-title {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 4px;
        text-align: center;
        margin-bottom: 40px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 15px;
        font-weight: 600;
    }

    .character-header {
        text-align: center;
        margin-bottom: 50px;
    }

    .avatar-ring {
        width: 100px;
        height: 100px;
        margin: 0 auto 20px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--accent-primary), var(--bg-deep));
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-dim);
    }

    /* CSS Avatar */
    .avatar-graphic {
        width: 40px;
        height: 40px;
        background: var(--accent-secondary);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        position: relative;
    }
    .avatar-graphic::after {
        content: '';
        position: absolute;
        top: 6px; left: 6px; right: 6px; bottom: 6px;
        background: var(--accent-primary);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.8;
    }

    .char-name {
        font-size: 1.8rem;
        font-weight: 700;
        color: #fff;
        margin: 0;
        letter-spacing: 1px;
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-primary);
        letter-spacing: 3px;
        margin-top: 5px;
        text-transform: uppercase;
        font-weight: 700;
    }

    /* Stats Block */
    .stats-block {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 5px;
    }

    .stat-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
    }

    .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
    }

    /* Skill Points - Reduced Visual Weight */
    .points-box {
        margin-top: 10px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background 0.3s ease;
    }
    
    .points-box:hover {
        background: rgba(255, 255, 255, 0.06);
    }

    .points-count {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--accent-gold);
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
    }

    /* --- Main Canvas Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Radial fade for edges */
        background: radial-gradient(circle at center, rgba(15, 10, 25, 0) 0%, rgba(5, 2, 10, 0.8) 100%);
    }
    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- HUD Overlay (Top Left) --- */
    .hud-overlay {
        position: absolute;
        top: 30px;
        left: 30px;
        z-index: 5;
        pointer-events: none; /* Let clicks pass through to map */
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 300px;
    }

    .hud-level {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 5px;
    }

    .hud-lvl-num {
        font-size: 4rem;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.15); /* Dimmed to not distract */
        line-height: 1;
        text-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .hud-lvl-label {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .hud-xp-container {
        width: 100%;
    }

    .hud-xp-bar-bg {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .hud-xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-primary);
    }

    .hud-xp-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right;
        margin-top: 5px;
        letter-spacing: 1px;
    }

    /* --- Node Styles: Unified Geometry (Triangle) --- */
    .node {
        position: absolute;
        width: 140px; /* Space for label */
        height: 100px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tri-shape {
        width: 50px;
        height: 50px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* The Triangle Geometry */
    .tri-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        transition: all 0.3s ease;
        z-index: 1;
    }

    /* Border (SVG) */
    .tri-border {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
    }
    .tri-border svg { width: 100%; height: 100%; }

    .tri-icon {
        width: 20px;
        height: 20px;
        z-index: 3;
        margin-top: 14px; /* Visual center */
    }

    .node-label {
        margin-top: 10px;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        text-align: center;
        white-space: nowrap;
        font-weight: 700;
        transition: all 0.3s ease;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
    }

    /* --- Node States & Colors --- */

    /* 1. LOCKED */
    .node.locked .tri-bg { background: #1e2029; }
    .node.locked .tri-border svg path { fill: none; stroke: #3f3f5a; stroke-width: 1; }
    .node.locked .tri-icon { fill: #3f3f5a; opacity: 0.5; }
    .node.locked .node-label { color: #64748b; }

    /* 2. UNLOCKED (Active) - Uses Type Colors */
    .node.unlocked.type-offense .tri-bg { background: linear-gradient(180deg, #be123c, var(--color-offense)); }
    .node.unlocked.type-defense .tri-bg { background: linear-gradient(180deg, #1d4ed8, var(--color-defense)); }
    .node.unlocked.type-utility .tri-bg { background: linear-gradient(180deg, #6d28d9, var(--color-utility)); }
    
    .node.unlocked .tri-border svg path { fill: none; stroke: #fff; stroke-width: 1.5; filter: drop-shadow(0 0 4px currentColor); }
    .node.unlocked .tri-icon { fill: #fff; filter: drop-shadow(0 0 2px #fff); }
    .node.unlocked .node-label { color: #fff; }

    /* 3. MAXED (Gold) */
    .node.maxed .tri-bg { background: linear-gradient(180deg, #b45309, var(--accent-gold)); }
    .node.maxed .tri-border svg path { fill: none; stroke: #fff; stroke-width: 2; filter: drop-shadow(0 0 6px var(--accent-gold)); }
    .node.maxed .tri-icon { fill: #fff; }
    .node.maxed .node-label { color: var(--accent-gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.8); }

    /* 4. ROOT (Dimmed Anchor) */
    .node.root-node .tri-bg { background: #0f172a; opacity: 0.6; }
    .node.root-node .tri-border svg path { fill: none; stroke: #334155; stroke-width: 1; }
    .node.root-node .tri-icon { fill: #475569; }
    .node.root-node .node-label { color: #64748b; opacity: 0.7; }
    .node.root-node:hover { transform: translate(-50%, -50%) scale(1); cursor: default; }

    /* Hover */
    .node:hover:not(.root-node) {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 100;
    }
    .node:hover:not(.root-node) .tri-bg { filter: brightness(1.2); }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        width: 280px;
        background: rgba(15, 12, 25, 0.95);
        border: 1px solid var(--border-dim);
        border-left: 3px solid var(--accent-primary);
        padding: 20px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        transform: translateY(10px);
        backdrop-filter: blur(12px);
    }

    .tooltip.visible { opacity: 1; transform: translateY(0); }

    .tooltip h3 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        color: var(--text-main);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: #cbd5e1;
        line-height: 1.5;
        margin-bottom: 15px;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-gold);
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        background: rgba(255,255,255,0.05);
        padding: 8px 12px;
        border-radius: 2px;
    }

</style>
</head>
<body>

<!-- Backgrounds -->
<canvas id="bg-canvas"></canvas>
<div class="bg-grid"></div>

<div class="dashboard">
    <!-- Sidebar -->
    <aside>
        <div class="sidebar-title">Character Stats</div>

        <div class="character-header">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <div class="avatar-graphic"></div>
                </div>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="stats-block">
            <!-- Stats only (Level/XP moved to HUD) -->
            <div class="stat-row">
                <span class="stat-label">Strength</span>
                <div class="stat-value">18</div>
            </div>
            <div class="stat-row">
                <span class="stat-label">Agility</span>
                <div class="stat-value">24</div>
            </div>
            <div class="stat-row">
                <span class="stat-label">Intellect</span>
                <div class="stat-value">42</div>
            </div>

            <div class="points-box">
                <span class="stat-label">Skill Points</span>
                <div class="points-count" id="sp-display">3</div>
            </div>
        </div>
    </aside>

    <!-- Main Tree Area -->
    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- HUD Overlay: Level & XP -->
        <div class="hud-overlay">
            <div class="hud-level">
                <div class="hud-lvl-num">42</div>
                <div class="hud-lvl-label">Level</div>
            </div>
            <div class="hud-xp-container">
                <div class="hud-xp-bar-bg">
                    <div class="hud-xp-fill"></div>
                </div>
                <div class="hud-xp-text">7,500 / 10,000 XP</div>
            </div>
        </div>

        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span id="tt-cost" style="color: #fff; opacity: 0.7;">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * Skill Tree Data
     * Added 'type' for color coding
     */
    const skillData = [
        // ROOT
        { id: 'root', name: 'Void Core', x: 50, y: 90, level: 1, max: 1, cost: 0, type: 'utility', desc: 'The singularity from which all void power flows.', stat: 'Base Attribute' },
        
        // TIER 1
        { id: 'shadow', name: 'Shadow Step', x: 30, y: 75, level: 1, max: 3, cost: 1, type: 'utility', desc: 'Phase through shadows to reposition instantly.', stat: '+5% Move Speed' },
        { id: 'shield', name: 'Void Shield', x: 70, y: 75, level: 0, max: 3, cost: 1, type: 'defense', desc: 'Generate a barrier of negative energy.', stat: '+10% Armor' },
        
        // TIER 2
        { id: 'drain', name: 'Soul Drain', x: 15, y: 60, level: 0, max: 3, cost: 2, type: 'offense', desc: 'Extract life force from targets.', stat: '+5% Lifesteal' },
        { id: 'blink', name: 'Phantom Blink', x: 50, y: 60, level: 1, max: 3, cost: 1, type: 'utility', desc: 'Teleport short distances, leaving an afterimage.', stat: '-15% Cooldown' },
        { id: 'ward', name: 'Entropy Ward', x: 85, y: 60, level: 0, max: 3, cost: 2, type: 'defense', desc: 'Passively reflects void damage.', stat: '+10% Reflect' },

        // TIER 3
        { id: 'shatter', name: 'Reality Shatter', x: 5, y: 45, level: 0, max: 1, cost: 3, type: 'offense', desc: 'Crack the fabric of reality.', stat: 'Unlock Ultimate' },
        { id: 'time', name: 'Time Warp', x: 35, y: 45, level: 0, max: 3, cost: 2, type: 'utility', desc: 'Slow the flow of time in an area.', stat: '-20% Enemy Speed' },
        { id: 'matter', name: 'Dark Matter', x: 65, y: 45, level: 0, max: 3, cost: 2, type: 'defense', desc: 'Increase gravitational pull.', stat: '+15% Pull Radius' },
        { id: 'disint', name: 'Disintegrate', x: 95, y: 45, level: 0, max: 1, cost: 3, type: 'offense', desc: 'Instantly destroy weak entities.', stat: 'Unlock Skill' },

        // TIER 4
        { id: 'void_s', name: 'Void Slash', x: 20, y: 30, level: 0, max: 3, cost: 1, type: 'offense', desc: 'A sweeping attack infused with void.', stat: '+20% Damage' },
        { id: 'void_b', name: 'Void Barrier', x: 80, y: 30, level: 0, max: 3, cost: 1, type: 'defense', desc: 'An impenetrable wall of darkness.', stat: '+30% Block' },
        
        // TIER 5
        { id: 'apex', name: 'Singularity', x: 50, y: 15, level: 0, max: 1, cost: 5, type: 'utility', desc: 'Collapse into a star of infinite density.', stat: 'ALL STATS +10%' }
    ];

    const connections = [
        ['root', 'shadow'], ['root', 'shield'],
        ['shadow', 'drain'], ['shadow', 'blink'], 
        ['shield', 'blink'], ['shield', 'ward'],
        ['drain', 'shatter'], ['blink', 'time'], ['ward', 'matter'],
        ['shatter', 'void_s'], ['time', 'void_s'], 
        ['matter', 'void_b'], ['disint', 'void_b'],
        ['time', 'apex'], ['matter', 'apex']
    ];

    // State
    let availablePoints = 3;
    const treeCanvas = document.getElementById('tree-canvas');
    const ctx = treeCanvas.getContext('2d');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        treeCanvas.width = container.offsetWidth;
        treeCanvas.height = container.offsetHeight;
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        drawConnections();
    }

    // Triangle SVG Path (Point Up)
    const triPath = "M25 2 L48 48 L2 48 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = (skill.level === skill.max) ? 'maxed' : 'unlocked';
            }
            
            el.className = `node ${stateClass} type-${skill.type}`;
            if(skill.id === 'root') el.classList.add('root-node');
            
            el.id = `node-${skill.id}`;
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Icon Logic
            let iconPath = '';
            if(skill.id.includes('shield') || skill.id.includes('ward') || skill.id.includes('barrier')) {
                iconPath = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>';
            } else if(skill.id.includes('shadow') || skill.id.includes('blink')) {
                iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/>';
            } else {
                iconPath = '<path d="M7 2v11h3v9l7-12h-4l4-8z"/>';
            }

            el.innerHTML = `
                <div class="tri-shape">
                    <div class="tri-bg"></div>
                    <div class="tri-border">
                        <svg viewBox="0 0 50 50"><path d="${triPath}"/></svg>
                    </div>
                    <svg class="tri-icon" viewBox="0 0 24 24">${iconPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                upgradeSkill(skill);
            });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Background Animation: Living Void ---
    let time = 0;
    function animateBackground() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        
        const w = bgCanvas.width;
        const h = bgCanvas.height;

        // Create moving nebula blobs
        const timeScale = time * 0.0005;
        
        // Blob 1 (Purple)
        bgCtx.globalCompositeOperation = 'screen';
        const grad1 = bgCtx.createRadialGradient(
            w * 0.8 + Math.sin(timeScale) * 100, 
            h * 0.2 + Math.cos(timeScale) * 50, 
            0, 
            w * 0.8 + Math.sin(timeScale) * 100, 
            h * 0.2 + Math.cos(timeScale) * 50, 
            400
        );
        grad1.addColorStop(0, 'rgba(76, 29, 149, 0.15)');
        grad1.addColorStop(1, 'transparent');
        bgCtx.fillStyle = grad1;
        bgCtx.fillRect(0, 0, w, h);

        // Blob 2 (Blue/Teal)
        const grad2 = bgCtx.createRadialGradient(
            w * 0.2 + Math.cos(timeScale * 1.2) * 80, 
            h * 0.8 + Math.sin(timeScale * 1.2) * 80, 
            0, 
            w * 0.2 + Math.cos(timeScale * 1.2) * 80, 
            h * 0.8 + Math.sin(timeScale * 1.2) * 80, 
            500
        );
        grad2.addColorStop(0, 'rgba(20, 184, 166, 0.1)');
        grad2.addColorStop(1, 'transparent');
        bgCtx.fillStyle = grad2;
        bgCtx.fillRect(0, 0, w, h);

        // Deep center glow
        const grad3 = bgCtx.createRadialGradient(w/2, h/2, 0, w/2, h/2, 600);
        grad3.addColorStop(0, 'rgba(168, 85, 247, 0.05)');
        grad3.addColorStop(1, 'transparent');
        bgCtx.fillStyle = grad3;
        bgCtx.fillRect(0, 0, w, h);

        bgCtx.globalCompositeOperation = 'source-over';
        time += 16;
        requestAnimationFrame(animateBackground);
    }

    // --- Rendering Connections (Refined: Energy Veins) ---

    function drawConnections() {
        ctx.clearRect(0, 0, treeCanvas.width, treeCanvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * treeCanvas.width, y: (parent.y / 100) * treeCanvas.height };
            const end = { x: (child.x / 100) * treeCanvas.width, y: (child.y / 100) * treeCanvas.height };

            const isPathActive = parent.level > 0;
            const isFullyUnlocked = parent.level > 0 && child.level > 0;

            // Bezier Control Points
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isFullyUnlocked) {
                // Active Glow Layer
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.8)';
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.4)'; 
                ctx.lineWidth = 8; // Thicker
                ctx.stroke();
                
                // Active Core
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#e9d5ff'; // Bright core
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (isPathActive) {
                // Partial (Source active, target locked)
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.3)';
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
                ctx.lineWidth = 4;
                ctx.stroke();
            } else {
                // Locked
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(100, 100, 120, 0.1)'; 
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 8]); 
                ctx.stroke();
                ctx.setLineDash([]);
            }
        });

        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        if(skill.id === 'root') return; // Root is static
        
        // Check parent
        let hasParentUnlocked = false;
        connections.forEach(([p, c]) => {
            if(c === skill.id) {
                const parent = skillData.find(s => s.id === p);
                if(parent.level > 0) hasParentUnlocked = true;
            }
        });

        if(!hasParentUnlocked) return;

        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Visual feedback
        const tri = node.querySelector('.tri-shape');
        tri.style.transform = 'scale(1.3)';
        setTimeout(() => tri.style.transform = 'scale(1)', 200);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        
        const costEl = document.getElementById('tt-cost');
        if (skill.level < skill.max) {
            costEl.textContent = `Cost: ${skill.cost} | Lvl ${skill.level}/${skill.max}`;
            costEl.style.color = availablePoints >= skill.cost ? '#fff' : '#ff4444';
        } else {
            costEl.textContent = 'MAXED';
            costEl.style.color = 'var(--accent-gold)';
        }

        if(x + 300 > window.innerWidth) {
            tooltip.style.left = (x - 320) + 'px';
        } else {
            tooltip.style.left = x + 'px';
        }
        tooltip.style.top = y + 'px';
        
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === treeCanvas || e.target === container || e.target.classList.contains('bg-grid')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();
    animateBackground();

</script>
</body>
