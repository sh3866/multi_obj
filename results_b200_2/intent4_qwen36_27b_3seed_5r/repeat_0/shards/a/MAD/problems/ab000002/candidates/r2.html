<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker — Ascension Matrix</title>
<style>
    :root {
        /* Palette: Deep Void */
        --bg-deep: #05020a;
        --bg-panel: rgba(15, 12, 25, 0.6);
        --border-dim: rgba(100, 80, 160, 0.3);
        
        /* Accents */
        --accent-primary: #9d4edd; /* Purple */
        --accent-glow: #e0aaff; /* Light Purple */
        --accent-secondary: #4a044e; /* Deep Magenta */
        --accent-gold: #ffd700; /* Gold - used sparingly */
        
        /* Text */
        --text-main: #ffffff;
        --text-muted: #a0a0a0;
        --text-dark: #6e6e6e; /* For locked items */
        
        /* Typography */
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -2;
        background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #090314 60%, #000000 100%);
    }

    /* Reduced opacity grid per critique */
    .bg-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(100, 80, 160, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(100, 80, 160, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
        opacity: 0.5;
        pointer-events: none;
    }

    /* --- Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: 100%;
    }

    /* --- Sidebar --- */
    aside {
        width: 320px;
        background: linear-gradient(90deg, rgba(5,2,10,0.9) 0%, rgba(5,2,10,0.4) 100%);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        z-index: 10;
        backdrop-filter: blur(10px);
    }

    .character-header {
        text-align: center;
        margin-bottom: 30px;
        position: relative;
    }

    .avatar-ring {
        width: 100px;
        height: 100px;
        margin: 0 auto 15px;
        border-radius: 50%;
        padding: 2px;
        background: linear-gradient(135deg, var(--accent-primary), var(--bg-deep));
        position: relative;
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .avatar-graphic {
        width: 50px;
        height: 50px;
        background: var(--accent-primary);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.8;
    }

    .char-name {
        font-size: 1.4rem;
        font-weight: 600;
        color: #fff;
        margin: 0;
        letter-spacing: 1px;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-glow);
        letter-spacing: 2px;
        margin-top: 5px;
        text-transform: uppercase;
        font-weight: 500;
    }

    /* Improved Hierarchy */
    .level-display {
        text-align: center;
        margin-bottom: 25px;
        padding: 15px 0;
        border-top: 1px solid rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .level-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 5px;
    }

    .level-value {
        font-size: 3rem;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
    }

    /* XP Section */
    .xp-section {
        margin-bottom: auto; /* Pushes content below to bottom */
    }

    .xp-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-weight: 500;
    }

    .xp-track {
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-primary);
        position: relative;
    }
    
    /* Points Box: Integrated into sidebar, no aggressive borders */
    .points-box {
        margin-top: 20px;
        padding: 15px;
        background: rgba(157, 78, 221, 0.05);
        border: 1px solid rgba(157, 78, 221, 0.2);
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .points-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .points-count {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent-glow);
        text-shadow: 0 0 10px rgba(157, 78, 221, 0.5);
    }

    /* --- Main Canvas Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(20,10,30,0.4) 0%, transparent 70%);
    }
    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- Node Styles: Standardized Hexagons --- */
    .node {
        position: absolute;
        width: 80px;
        height: 90px; /* Extra height for label */
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: transform 0.2s ease;
    }

    /* Hexagon Container */
    .hex-shape {
        width: 56px;
        height: 56px;
        position: relative;
        margin-top: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* The Hexagon Clip Path */
    .hex-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        transition: all 0.3s ease;
        z-index: 1;
    }

    /* The Hexagon Border (Simulated via SVG for precision) */
    .hex-border {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
    }
    
    .hex-border svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .hex-icon {
        width: 24px;
        height: 24px;
        z-index: 3;
        transition: all 0.3s ease;
    }

    .node-label {
        margin-top: 10px;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: center;
        white-space: nowrap;
        font-weight: 600;
        transition: all 0.3s ease;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- States --- */

    /* 1. LOCKED (Improved Visibility) */
    .node.locked .hex-bg {
        background: #15111c; /* Darker grey-purple, not black */
    }
    .node.locked .hex-border svg path {
        fill: none;
        stroke: #4a4458; /* Visible grey border */
        stroke-width: 2;
    }
    .node.locked .hex-icon {
        fill: #4a4458;
        opacity: 0.7;
    }
    .node.locked .node-label {
        color: #6e6e6e; /* Readable dark grey */
    }

    /* 2. UNLOCKED (Active Path) */
    .node.unlocked .hex-bg {
        background: rgba(74, 4, 78, 0.4);
        box-shadow: inset 0 0 10px rgba(157, 78, 221, 0.3);
    }
    .node.unlocked .hex-border svg path {
        fill: none;
        stroke: var(--accent-primary);
        stroke-width: 2;
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }
    .node.unlocked .hex-icon {
        fill: var(--accent-glow);
        filter: drop-shadow(0 0 5px var(--accent-glow));
    }
    .node.unlocked .node-label {
        color: #fff;
        text-shadow: 0 0 8px var(--accent-primary);
    }

    /* 3. MAXED (Distinct accent) */
    .node.maxed .hex-bg {
        background: rgba(255, 215, 0, 0.15);
    }
    .node.maxed .hex-border svg path {
        fill: none;
        stroke: var(--accent-gold);
        stroke-width: 2;
    }
    .node.maxed .hex-icon {
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 2px var(--accent-gold));
    }
    .node.maxed .node-label {
        color: var(--accent-gold);
    }

    /* Hover Effects */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.1);
        z-index: 100;
    }
    .node:hover .hex-bg {
        filter: brightness(1.2);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        width: 260px;
        background: rgba(10, 5, 20, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 16px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        transform: translateY(10px);
        backdrop-filter: blur(5px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
        color: var(--accent-glow);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: #ccc;
        line-height: 1.5;
        margin-bottom: 12px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-gold);
        font-weight: 600;
        display: flex;
        justify-content: space-between;
    }

    /* Floating Badge for Points (Alternative location) */
    .points-badge {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(10, 10, 20, 0.8);
        border: 1px solid var(--accent-primary);
        padding: 8px 16px;
        border-radius: 20px;
        color: var(--accent-glow);
        font-weight: 700;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 0 15px rgba(157, 78, 221, 0.2);
        z-index: 5;
    }
    .points-badge span {
        color: var(--text-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        margin-right: 4px;
    }

</style>
</head>
<body>

<!-- Backgrounds -->
<div class="bg-atmosphere"></div>
<div class="bg-grid"></div>

<div class="dashboard">
    <!-- Sidebar -->
    <aside>
        <div class="character-header">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <div class="avatar-graphic"></div>
                </div>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="level-display">
            <span class="level-label">Character Level</span>
            <div class="level-value">42</div>
        </div>

        <div class="xp-section">
            <div class="xp-header">
                <span>Experience</span>
                <span>7,500 / 10,000</span>
            </div>
            <div class="xp-track">
                <div class="xp-fill"></div>
            </div>
        </div>

        <!-- Points Box (Integrated) -->
        <div class="points-box">
            <span class="points-label">Skill Points</span>
            <div class="points-count" id="sp-display">3</div>
        </div>
    </aside>

    <!-- Main Tree Area -->
    <main id="tree-container">
        <!-- Floating Badge (Critique Fix: Contextualize resources) -->
        <div class="points-badge">
            <span>Available</span> <span id="sp-badge" style="color: #fff; margin-left:5px;">3</span>
        </div>

        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span id="tt-cost" style="color: #fff; opacity: 0.7;">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * Skill Tree Data
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your connection to the Void.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'shadow', name: 'Shadow Step', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Move through shadows instantly.', stat: '+5% Move Speed' },
        { id: 'shield', name: 'Void Shield', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Absorb damage into the void.', stat: '+10% Armor' },
        
        // Tier 2
        { id: 'drain', name: 'Soul Drain', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Steal life from enemies.', stat: '+5% Lifesteal' },
        { id: 'blink', name: 'Phantom Blink', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Teleport short distances.', stat: '-15% Cooldown' },
        { id: 'ward', name: 'Entropy Ward', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Reflect void damage.', stat: '+10% Reflect' },

        // Tier 3
        { id: 'shatter', name: 'Reality Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Crack the fabric of reality.', stat: 'Unlock Ultimate' },
        { id: 'time', name: 'Time Warp', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Slow time around you.', stat: '-20% Enemy Speed' },
        { id: 'void', name: 'Dark Matter', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Increase void gravity.', stat: '+15% Pull Radius' },
        { id: 'disint', name: 'Disintegrate', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Turn enemies to dust.', stat: 'Unlock Skill' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Become the Void.', stat: 'ALL STATS +10%' }
    ];

    const connections = [
        ['root', 'shadow'], ['root', 'shield'],
        ['shadow', 'drain'], ['shadow', 'blink'], ['shield', 'blink'], ['shield', 'ward'],
        ['drain', 'shatter'], ['blink', 'time'], ['ward', 'void'],
        ['time', 'apex'], ['void', 'apex']
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');
    const spBadge = document.getElementById('sp-badge');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // Hexagon SVG Path for crisp borders
    const hexPath = "M28 0 L56 14 L56 42 L28 56 L0 42 L0 14 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // SVG Icon selection
            let iconPath = '';
            if(skill.id.includes('shield') || skill.id.includes('ward')) {
                iconPath = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>';
            } else if(skill.id.includes('shadow') || skill.id.includes('blink')) {
                iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/>';
            } else {
                iconPath = '<path d="M12 2L2 22h20L12 2zm0 3.5L18.5 19H5.5L12 5.5z"/>';
            }

            el.innerHTML = `
                <div class="hex-shape">
                    <div class="hex-bg"></div>
                    <div class="hex-border">
                        <svg viewBox="0 0 56 56"><path d="${hexPath}"/></svg>
                    </div>
                    <svg class="hex-icon" viewBox="0 0 24 24">${iconPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                upgradeSkill(skill);
            });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering Connections (Refined) ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isPathActive = parent.level > 0;
            const isFullyUnlocked = parent.level > 0 && child.level > 0;

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            // Bezier curve
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isFullyUnlocked) {
                // Multi-layered glow effect for active path
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(157, 78, 221, 0.8)';
                ctx.strokeStyle = '#bfa2db'; // Lighter core
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Second pass for outer glow
                ctx.shadowBlur = 25;
                ctx.strokeStyle = 'rgba(157, 78, 221, 0.4)';
                ctx.lineWidth = 6;
                ctx.stroke();

            } else if (isPathActive) {
                // Path exists but destination locked
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#4a3b69'; 
                ctx.lineWidth = 2;
                ctx.stroke();

            } else {
                // Locked path (Critique Fix: Increased visibility)
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(100, 80, 160, 0.3)'; // Higher opacity
                ctx.lineWidth = 1;
                ctx.setLineDash([6, 6]); 
                ctx.stroke();
                ctx.setLineDash([]);
            }
        });

        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        let hasParentUnlocked = false;
        if(skill.id === 'root') hasParentUnlocked = true;
        else {
            connections.forEach(([p, c]) => {
                if(c === skill.id) {
                    const parent = skillData.find(s => s.id === p);
                    if(parent.level > 0) hasParentUnlocked = true;
                }
            });
        }

        if(!hasParentUnlocked) return;

        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        spBadge.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Visual feedback
        const hex = node.querySelector('.hex-shape');
        hex.style.transform = 'scale(1.2)';
        setTimeout(() => hex.style.transform = 'scale(1)', 200);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        
        const costEl = document.getElementById('tt-cost');
        if (skill.level < skill.max) {
            costEl.textContent = `Cost: ${skill.cost} | Lvl ${skill.level}/${skill.max}`;
            costEl.style.color = availablePoints >= skill.cost ? '#fff' : '#ff4444';
        } else {
            costEl.textContent = 'MAXED';
            costEl.style.color = 'var(--accent-gold)';
        }

        if(x + 260 > window.innerWidth) {
            tooltip.style.left = (x - 280) + 'px';
        } else {
            tooltip.style.left = x + 'px';
        }
        tooltip.style.top = y + 'px';
        
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container || e.target.classList.contains('points-badge')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
