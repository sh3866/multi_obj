<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Skill Ascension</title>
<style>
    :root {
        --bg-dark: #05070a;
        --bg-panel: #0f1219;
        --border-dim: #1e232e;
        --border-light: #2a3245;
        --accent-primary: #00f0ff; /* Cyan */
        --accent-secondary: #7000ff; /* Violet */
        --accent-gold: #ffd700;
        --text-main: #e2e8f0;
        --text-muted: #64748b;
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Background Texture */
    .bg-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -1;
        pointer-events: none;
    }
    
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 0%, #000000 120%);
        z-index: -1;
        pointer-events: none;
    }

    /* --- Header --- */
    header {
        height: 70px;
        border-bottom: 1px solid var(--border-dim);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: rgba(5, 7, 10, 0.8);
        backdrop-filter: blur(10px);
        z-index: 10;
    }

    .brand {
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 10px rgba(255,255,255,0.1);
        display: flex;
        align-items: center;
        gap: 15px;
    }
    
    .brand svg {
        width: 24px;
        height: 24px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .nav-links span {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-left: 30px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: color 0.3s;
    }
    .nav-links span:hover { color: var(--accent-primary); }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 70px);
    }

    /* --- Sidebar (Stats) --- */
    aside {
        width: 320px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-dim);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        position: relative;
    }

    .character-card {
        text-align: center;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 20px;
    }

    .avatar-frame {
        width: 100px;
        height: 100px;
        margin: 0 auto 15px;
        border-radius: 50%;
        border: 2px solid var(--accent-primary);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
    }
    
    .avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.8;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.5rem;
        margin: 0;
        color: #fff;
    }

    .char-class {
        font-size: 0.8rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 5px;
    }

    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
    }
    
    .stat-label { color: var(--text-muted); }
    .stat-value { font-weight: bold; color: #fff; }

    .xp-container {
        margin-top: 10px;
    }
    
    .xp-bar-bg {
        height: 6px;
        background: #1e232e;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 8px;
    }
    
    .xp-bar-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-primary);
    }

    .points-available {
        background: rgba(255, 215, 0, 0.05);
        border: 1px solid rgba(255, 215, 0, 0.2);
        padding: 15px;
        border-radius: 4px;
        text-align: center;
        margin-top: auto;
    }

    .points-count {
        font-size: 2.5rem;
        font-weight: bold;
        color: var(--accent-gold);
        line-height: 1;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }
    
    .points-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent-gold);
        margin-top: 5px;
    }

    /* --- Center (Tree) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Let clicks pass to canvas if needed, but nodes need events */
        z-index: 2;
    }

    /* --- The Node --- */
    .node {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--bg-panel);
        border: 2px solid var(--border-light);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transform: translate(-50%, -50%);
    }

    .node svg {
        width: 24px;
        height: 24px;
        fill: var(--text-muted);
        transition: fill 0.3s;
    }

    /* Node States */
    .node.locked {
        opacity: 0.5;
        filter: grayscale(1);
    }
    
    .node.unlocked {
        border-color: var(--accent-primary);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .node.unlocked svg { fill: var(--accent-primary); }

    .node.maxed {
        border-color: var(--accent-gold);
        background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, var(--bg-panel) 100%);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }
    .node.maxed svg { fill: var(--accent-gold); }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(15, 18, 25, 0.95);
        border: 1px solid var(--border-light);
        padding: 15px;
        width: 220px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(5px);
    }

    .tooltip.visible { opacity: 1; }
    
    .tooltip h3 {
        margin: 0 0 5px;
        font-family: var(--font-display);
        color: var(--accent-primary);
        font-size: 1rem;
    }
    
    .tooltip .desc {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.4;
        margin-bottom: 10px;
    }

    .tooltip .stats {
        font-size: 0.75rem;
        color: var(--accent-gold);
        border-top: 1px solid var(--border-dim);
        padding-top: 8px;
    }

    /* Animations */
    @keyframes pulse-ring {
        0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }

    .node.upgrading::after {
        content: '';
        position: absolute;
        width: 100%; height: 100%;
        border-radius: 50%;
        border: 1px solid var(--accent-primary);
        animation: pulse-ring 1s ease-out infinite;
    }

    /* Floating particles */
    .particle {
        position: absolute;
        background: var(--accent-primary);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
    }

</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="vignette"></div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        Arcanum
    </div>
    <div class="nav-links">
        <span>Inventory</span>
        <span>Quests</span>
        <span>Settings</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <div class="character-card">
            <div class="avatar-frame">
                <!-- Simple SVG Avatar Placeholder -->
                <svg viewBox="0 0 100 100" style="width:100%; height:100%; fill:#2a3245;">
                    <path d="M30,30 Q50,10 70,30 L80,80 L20,80 Z" />
                    <circle cx="50" cy="45" r="15" fill="#1e232e" />
                    <rect x="35" y="65" width="30" height="15" fill="#1e232e" />
                </svg>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="stat-block">
            <div class="stat-row">
                <span class="stat-label">Level</span>
                <span class="stat-value">42</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Strength</span>
                <span class="stat-value">124</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Dexterity</span>
                <span class="stat-value">89</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Intelligence</span>
                <span class="stat-value">210</span>
            </div>
            
            <div class="xp-container">
                <div class="stat-row">
                    <span class="stat-label">Experience</span>
                    <span class="stat-value">7,500 / 10,000</span>
                </div>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="points-available">
            <div class="points-count" id="sp-display">3</div>
            <div class="points-label">Available Points</div>
        </div>
    </aside>

    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-container" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats" id="tt-stats">+10% Damage</div>
        </div>
    </main>
</div>

<script>
    /**
     * Data Structure for the Skill Tree
     * x, y are percentages (0-100)
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%' }
    ];

    // Connections (Parent ID -> Child ID)
    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex'] // Apex connects to multiple
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            // Center position logic handled in CSS translate, but we set top/left here
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Icon (SVG Path based on type)
            let iconPath = '';
            if(skill.id.includes('str')) iconPath = '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>'; // Shield/Sword
            else if(skill.id.includes('int')) iconPath = '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10h-20A10 10 0 0 1 12 2z" fill="none" stroke="currentColor" stroke-width="2"/>'; // Orb
            else iconPath = '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>'; // Star

            el.innerHTML = `<svg viewBox="0 0 24 24">${iconPath}</svg>`;
            
            // Events
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---

    function getCoordinates(id) {
        const skill = skillData.find(s => s.id === id);
        return {
            x: (skill.x / 100) * canvas.width,
            y: (skill.y / 100) * canvas.height
        };
    }

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Apply Pan/Zoom transform to context
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        // We need to recalculate coordinates based on current canvas size but logic is percentage based
        // For simplicity in this demo, we redraw lines based on node positions relative to container
        // But since canvas is 1:1 with container, we use percentages.

        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; // Path exists if parent is unlocked

            // Draw Bezier Curve
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            // Control points for curve
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isUnlocked) {
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
            } else if (isPath) {
                ctx.strokeStyle = '#2a3245';
                ctx.shadowBlur = 0;
            } else {
                ctx.strokeStyle = '#1e232e';
                ctx.shadowBlur = 0;
            }
            
            ctx.stroke();
        });

        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        // Simple check: Is parent unlocked? (Simplified for this demo)
        // In a real app, check graph connectivity.
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 1000);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        // Position tooltip near mouse
        const x = e.clientX - rect.left + 15;
        const y = e.clientY - rect.top + 15;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        
        let statsText = skill.stat;
        if (skill.level < skill.max) {
            statsText += ` (Lvl ${skill.level}/${skill.max})`;
        } else {
            statsText += ` (MAXED)`;
        }
        document.getElementById('tt-stats').textContent = statsText;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan/Zoom) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });
    
    // Note: Zooming implementation omitted for brevity, but structure is there.

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize(); // Initial draw

</script>
</body>
</html>
