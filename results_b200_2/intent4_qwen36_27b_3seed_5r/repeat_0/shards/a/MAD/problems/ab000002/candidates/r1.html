<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker — Ascension Matrix</title>
<style>
    :root {
        /* Palette: Void Purple & Deep Black */
        --bg-deep: #05020a;
        --bg-panel: rgba(15, 12, 25, 0.85);
        --border-dim: rgba(100, 80, 160, 0.2);
        --border-active: rgba(180, 140, 255, 0.6);
        
        /* Accents */
        --accent-void: #9d4edd; /* Purple */
        --accent-glow: #e0aaff; /* Light Purple */
        --accent-gold: #ffd700; /* Gold */
        --accent-gold-dim: rgba(255, 215, 0, 0.15);
        
        /* Text */
        --text-main: #f0f0f0;
        --text-muted: #9a8c98;
        
        /* Typography */
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Atmosphere --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        /* Deep radial gradient */
        background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #090314 60%, #000000 100%);
    }

    /* Subtle Grid Overlay */
    .bg-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        /* Very subtle grid lines */
        background-image: 
            linear-gradient(var(--border-dim) 1px, transparent 1px),
            linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
        background-size: 60px 60px;
        /* Fade out grid at edges */
        mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
        -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
        opacity: 0.3;
        pointer-events: none;
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        border-bottom: 1px solid var(--border-dim);
        background: rgba(5, 2, 10, 0.6);
        backdrop-filter: blur(8px);
    }

    .brand {
        font-size: 0.9rem;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--accent-glow);
        text-shadow: 0 0 15px var(--accent-void);
        font-weight: 600;
    }

    /* --- Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 60px);
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        z-index: 10;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    .character-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .avatar-ring {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--accent-void), transparent);
        position: relative;
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* CSS-only Avatar Graphic */
    .avatar-graphic {
        width: 60%;
        height: 60%;
        background: var(--accent-void);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.8;
    }

    .char-name {
        font-size: 1.2rem;
        font-weight: 300;
        letter-spacing: 2px;
        color: #fff;
        margin: 0;
        text-transform: uppercase;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-glow);
        letter-spacing: 3px;
        margin-top: 5px;
        text-transform: uppercase;
    }

    .level-display {
        text-align: center;
        margin-bottom: 30px;
        padding: 15px 0;
        border-top: 1px solid var(--border-dim);
        border-bottom: 1px solid var(--border-dim);
    }

    .level-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 5px;
    }

    .level-value {
        font-size: 3.5rem;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .xp-section {
        margin-bottom: auto;
    }

    .xp-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    .xp-track {
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: var(--accent-void);
        box-shadow: 0 0 10px var(--accent-void);
        position: relative;
    }
    
    /* Shimmer on XP bar */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    /* --- Points Box (Critique Fix: Dark BG, Yellow Border) --- */
    .points-box {
        background: rgba(10, 8, 15, 0.6);
        border: 1px solid var(--accent-gold);
        padding: 20px;
        text-align: center;
        position: relative;
        /* Glow effect */
        box-shadow: 0 0 15px var(--accent-gold-dim), inset 0 0 10px var(--accent-gold-dim);
    }

    .points-label {
        font-size: 0.7rem;
        color: var(--accent-gold);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
        display: block;
    }

    .points-count {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent-gold);
        text-shadow: 0 0 15px var(--accent-gold);
        line-height: 1;
    }

    /* --- Main Canvas Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; /* Let clicks pass through empty space */
    }

    /* --- Node Styles (Critique Fix: Hexagons, Labels) --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        /* Center the node */
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* Hexagon Shape */
    .hex-shape {
        width: 50px;
        height: 50px;
        background: #0f0c14;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        border: 2px solid var(--border-dim); /* Fallback */
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.3s ease;
    }

    /* Border hack for clip-path */
    .hex-shape::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: transparent;
        border: 2px solid var(--border-dim);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
    }

    .hex-icon {
        width: 20px;
        height: 20px;
        fill: var(--text-muted);
        opacity: 0.5;
        transition: all 0.3s;
    }

    /* Label below node */
    .node-label {
        margin-top: 8px;
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 2px 4px #000;
        transition: color 0.3s;
    }

    /* --- Node States --- */
    
    /* Locked */
    .node.locked .hex-shape {
        background: #05020a;
        border-color: #1a1a1a;
    }
    .node.locked .hex-icon { fill: #333; }
    .node.locked .node-label { color: #444; }

    /* Unlocked (Active Path) */
    .node.unlocked .hex-shape {
        background: rgba(157, 78, 221, 0.1);
        border-color: var(--accent-void);
        box-shadow: 0 0 10px var(--accent-void);
    }
    .node.unlocked .hex-shape::before { border-color: var(--accent-void); }
    .node.unlocked .hex-icon { fill: var(--accent-glow); opacity: 1; filter: drop-shadow(0 0 5px var(--accent-void)); }
    .node.unlocked .node-label { color: #fff; }

    /* Maxed */
    .node.maxed .hex-shape {
        background: rgba(255, 215, 0, 0.1);
        border-color: var(--accent-gold);
    }
    .node.maxed .hex-shape::before { border-color: var(--accent-gold); }
    .node.maxed .hex-icon { fill: var(--accent-gold); opacity: 1; }
    .node.maxed .node-label { color: var(--accent-gold); text-shadow: 0 0 5px var(--accent-gold-dim); }

    /* Hover */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.1);
        z-index: 100;
    }
    .node:hover .hex-shape {
        background: rgba(255,255,255,0.05);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        width: 240px;
        background: rgba(10, 5, 20, 0.95);
        border: 1px solid var(--accent-void);
        padding: 15px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        transform: translateY(10px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 5px;
        font-size: 1rem;
        color: var(--accent-glow);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .tooltip .desc {
        font-size: 0.8rem;
        color: #ccc;
        line-height: 1.4;
        margin-bottom: 10px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.75rem;
        color: var(--accent-gold);
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
        font-weight: bold;
    }

    /* Animations */
    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    @keyframes pulse-glow {
        0% { box-shadow: 0 0 5px var(--accent-void); }
        50% { box-shadow: 0 0 20px var(--accent-void); }
        100% { box-shadow: 0 0 5px var(--accent-void); }
    }

</style>
</head>
<body>

<!-- Backgrounds -->
<div class="bg-atmosphere"></div>
<div class="bg-grid"></div>

<header>
    <div class="brand">Void Walker: Ascension</div>
</header>

<div class="dashboard">
    <!-- Sidebar -->
    <aside>
        <div class="character-header">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <div class="avatar-graphic"></div>
                </div>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="level-display">
            <span class="level-label">Character Level</span>
            <div class="level-value">42</div>
        </div>

        <div class="xp-section">
            <div class="xp-header">
                <span>Experience</span>
                <span>7,500 / 10,000</span>
            </div>
            <div class="xp-track">
                <div class="xp-fill"></div>
            </div>
        </div>

        <!-- Points Box (Refined) -->
        <div class="points-box">
            <span class="points-label">Available Points</span>
            <div class="points-count" id="sp-display">3</div>
        </div>
    </aside>

    <!-- Main Tree Area -->
    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats" id="tt-stats">+10% Damage</div>
        </div>
    </main>
</div>

<script>
    /**
     * Skill Tree Data
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your connection to the Void.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'shadow', name: 'Shadow Step', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Move through shadows instantly.', stat: '+5% Move Speed' },
        { id: 'shield', name: 'Void Shield', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Absorb damage into the void.', stat: '+10% Armor' },
        
        // Tier 2
        { id: 'drain', name: 'Soul Drain', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Steal life from enemies.', stat: '+5% Lifesteal' },
        { id: 'blink', name: 'Phantom Blink', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Teleport short distances.', stat: '-15% Cooldown' },
        { id: 'ward', name: 'Entropy Ward', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Reflect void damage.', stat: '+10% Reflect' },

        // Tier 3
        { id: 'shatter', name: 'Reality Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Crack the fabric of reality.', stat: 'Unlock Ultimate' },
        { id: 'time', name: 'Time Warp', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Slow time around you.', stat: '-20% Enemy Speed' },
        { id: 'void', name: 'Dark Matter', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Increase void gravity.', stat: '+15% Pull Radius' },
        { id: 'disint', name: 'Disintegrate', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Turn enemies to dust.', stat: 'Unlock Skill' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Become the Void.', stat: 'ALL STATS +10%' }
    ];

    const connections = [
        ['root', 'shadow'], ['root', 'shield'],
        ['shadow', 'drain'], ['shadow', 'blink'], ['shield', 'blink'], ['shield', 'ward'],
        ['drain', 'shatter'], ['blink', 'time'], ['ward', 'void'],
        ['time', 'apex'], ['void', 'apex']
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // SVG Icon selection based on name/type
            let iconPath = '';
            if(skill.id.includes('shield') || skill.id.includes('ward')) {
                iconPath = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>';
            } else if(skill.id.includes('shadow') || skill.id.includes('blink')) {
                iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/>';
            } else {
                iconPath = '<path d="M12 2L2 22h20L12 2zm0 3.5L18.5 19H5.5L12 5.5z"/>';
            }

            el.innerHTML = `
                <div class="hex-shape">
                    <svg class="hex-icon" viewBox="0 0 24 24">${iconPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                upgradeSkill(skill);
            });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        // Stroke settings
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            // Coordinates relative to container size
            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            // Logic: Is the line active?
            // If parent is unlocked, the path to the child exists.
            // If child is ALSO unlocked, the path is fully active (glowing).
            const isPathActive = parent.level > 0;
            const isFullyUnlocked = parent.level > 0 && child.level > 0;

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            // Bezier curve for organic feel
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isFullyUnlocked) {
                ctx.strokeStyle = '#9d4edd'; // Active Purple
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#e0aaff'; // Glow
                ctx.lineWidth = 4;
            } else if (isPathActive) {
                ctx.strokeStyle = '#4a3b69'; // Dimmer path
                ctx.shadowBlur = 0;
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = '#1f152e'; // Locked path
                ctx.shadowBlur = 0;
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]); // Dashed for locked
            }
            
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash
        });

        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        // Check parent logic (simplified for demo)
        // Find if any parent connecting to this node is unlocked
        let hasParentUnlocked = false;
        if(skill.id === 'root') hasParentUnlocked = true;
        else {
            connections.forEach(([p, c]) => {
                if(c === skill.id) {
                    const parent = skillData.find(s => s.id === p);
                    if(parent.level > 0) hasParentUnlocked = true;
                }
            });
        }

        if(!hasParentUnlocked) return; // Cannot skip tiers

        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Visual feedback
        const hex = node.querySelector('.hex-shape');
        hex.style.transform = 'scale(1.2)';
        setTimeout(() => hex.style.transform = 'scale(1)', 200);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        
        let statsText = skill.stat;
        if (skill.level < skill.max) {
            statsText += ` (Cost: ${skill.cost} | Lvl ${skill.level}/${skill.max})`;
        } else {
            statsText += ` (MAXED)`;
        }
        document.getElementById('tt-stats').textContent = statsText;

        // Boundary check (simple)
        if(x + 240 > window.innerWidth) {
            tooltip.style.left = (x - 260) + 'px';
        } else {
            tooltip.style.left = x + 'px';
        }
        tooltip.style.top = y + 'px';
        
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan/Zoom) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
