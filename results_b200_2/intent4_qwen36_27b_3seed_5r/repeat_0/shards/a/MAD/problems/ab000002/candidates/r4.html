<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension — Skill Matrix</title>
<style>
    :root {
        /* Palette: Ethereal Void */
        --bg-deep: #05020a;
        --bg-panel: rgba(10, 8, 18, 0.85);
        --border-dim: rgba(139, 120, 200, 0.15);
        --border-highlight: rgba(139, 120, 200, 0.4);
        
        /* Accents */
        --accent-primary: #a855f7; /* Vibrant Purple */
        --accent-glow: #e9d5ff; /* Soft Lavender */
        --accent-secondary: #581c87; /* Deep Violet */
        --accent-gold: #fbbf24; /* Amber */
        --accent-gold-dim: #b45309;
        
        /* Text */
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #475569; 
        
        /* Typography */
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif;
        --font-header: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background: Atmospheric Nebula --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -2;
        background: 
            radial-gradient(circle at 80% 20%, rgba(76, 29, 149, 0.2) 0%, transparent 50%),
            radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 50% 50%, #1e1b4e 0%, #0f0f1a 60%, #000000 100%);
    }

    /* Subtle Grid Background */
    .bg-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.5;
    }

    /* --- Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: 100%;
    }

    /* --- Sidebar --- */
    aside {
        width: 320px;
        background: linear-gradient(180deg, rgba(10, 8, 18, 0.95) 0%, rgba(5, 2, 10, 0.9) 100%);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 40px 35px;
        z-index: 10;
        backdrop-filter: blur(12px);
        position: relative;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Sidebar Header */
    .sidebar-title {
        font-family: var(--font-ui);
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 4px;
        text-align: center;
        margin-bottom: 40px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 15px;
        font-weight: 600;
    }

    .character-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .avatar-ring {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(135deg, var(--accent-primary), var(--bg-deep), var(--accent-secondary));
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
        position: relative;
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--border-dim);
    }

    /* CSS-only Avatar Graphic */
    .avatar-graphic {
        width: 50px;
        height: 50px;
        background: var(--accent-secondary);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.9;
        position: relative;
    }
    .avatar-graphic::after {
        content: '';
        position: absolute;
        top: 8px; left: 8px; right: 8px; bottom: 8px;
        background: var(--accent-primary);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.8;
    }

    .char-name {
        font-family: var(--font-header);
        font-size: 2rem;
        font-weight: 700;
        color: #fff;
        margin: 0;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-primary);
        letter-spacing: 3px;
        margin-top: 8px;
        text-transform: uppercase;
        font-weight: 700;
    }

    /* Stats Block */
    .stats-block {
        display: flex;
        flex-direction: column;
        gap: 35px;
    }

    .level-display {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 0 5px;
    }

    .level-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
    }

    .level-value {
        font-family: var(--font-header);
        font-size: 3rem;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    /* XP Section - Elevated Craft */
    .xp-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .xp-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .xp-track {
        height: 10px;
        background: rgba(0,0,0,0.4);
        border-radius: 4px;
        overflow: hidden;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.05);
        position: relative;
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        position: relative;
        border-radius: 3px;
    }
    
    /* XP Glow Effect */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 20px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
        filter: blur(2px);
        animation: pulse-glow 2s infinite alternate;
    }

    @keyframes pulse-glow {
        from { opacity: 0.5; }
        to { opacity: 1; }
    }

    /* Skill Points Box - Balanced Scale */
    .points-box {
        padding: 25px;
        background: rgba(168, 85, 247, 0.03);
        border: 1px solid var(--border-dim);
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
        transition: border-color 0.3s ease;
    }
    
    .points-box:hover {
        border-color: var(--border-highlight);
    }

    .points-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
    }

    .points-count {
        font-family: var(--font-header);
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--accent-glow);
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        line-height: 1;
    }

    /* --- Main Canvas Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(20,10,30,0.3) 0%, transparent 70%);
    }
    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- Node Styles: Unified Triangles --- */
    .node {
        position: absolute;
        width: 120px; /* Wider for label space */
        height: 100px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Triangle Container - Strict Geometry */
    .tri-shape {
        width: 50px;
        height: 50px;
        position: relative;
        margin-top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* The Triangle Clip Path */
    .tri-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        /* Upward pointing triangle */
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        transition: all 0.3s ease;
        z-index: 1;
    }

    /* The Triangle Border (Simulated via SVG) */
    .tri-border {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
    }
    
    .tri-border svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .tri-icon {
        width: 22px;
        height: 22px;
        z-index: 3;
        margin-top: 12px; /* Center icon visually */
        transition: all 0.3s ease;
    }

    /* Standardized Vertical Alignment: Label 12px below vertex */
    .node-label {
        margin-top: 12px; 
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        white-space: nowrap;
        font-weight: 600;
        transition: all 0.3s ease;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        font-family: var(--font-ui);
    }

    /* --- States --- */

    /* 1. LOCKED (Desaturated Slate) */
    .node.locked .tri-bg {
        background: #1e2029;
    }
    .node.locked .tri-border svg path {
        fill: none;
        stroke: #3f3f5a;
        stroke-width: 1.5;
    }
    .node.locked .tri-icon {
        fill: #3f3f5a;
        opacity: 0.5;
    }
    .node.locked .node-label {
        color: #64748b;
    }

    /* 2. UNLOCKED (Active Path - Purple) */
    .node.unlocked .tri-bg {
        background: linear-gradient(180deg, #7e22ce, #a855f7);
        box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
    }
    .node.unlocked .tri-border svg path {
        fill: none;
        stroke: var(--accent-glow);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 3px var(--accent-primary));
    }
    .node.unlocked .tri-icon {
        fill: #fff;
        filter: drop-shadow(0 0 2px var(--accent-glow));
    }
    .node.unlocked .node-label {
        color: #fff;
        text-shadow: 0 0 8px var(--accent-primary);
    }

    /* 3. MAXED / ROOT (Gold - High Contrast) */
    .node.maxed .tri-bg {
        background: linear-gradient(180deg, #fbbf24, #d97706);
    }
    .node.maxed .tri-border svg path {
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }
    .node.maxed .tri-icon {
        fill: #fff;
        filter: drop-shadow(0 0 2px #fff);
    }
    .node.maxed .node-label {
        color: var(--accent-gold);
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    /* Hover Effects */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.1);
        z-index: 100;
    }
    .node:hover .tri-bg {
        filter: brightness(1.2);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        width: 300px;
        background: rgba(15, 12, 25, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 24px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        transform: translateY(10px);
        backdrop-filter: blur(12px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 12px;
        font-family: var(--font-header);
        font-size: 1.4rem;
        color: var(--accent-glow);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 12px;
    }
    
    .tooltip .desc {
        font-size: 0.95rem;
        color: #cbd5e1;
        line-height: 1.6;
        margin-bottom: 20px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.85rem;
        color: var(--accent-gold);
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        background: rgba(255,255,255,0.05);
        padding: 10px 14px;
        border-radius: 2px;
        border: 1px solid rgba(255,255,255,0.05);
    }

</style>
</head>
<body>

<!-- Backgrounds -->
<div class="bg-atmosphere"></div>
<div class="bg-grid"></div>

<div class="dashboard">
    <!-- Sidebar -->
    <aside>
        <div class="sidebar-title">Skill Matrix</div>

        <div class="character-header">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <div class="avatar-graphic"></div>
                </div>
            </div>
            <h2 class="char-name">Kaelen</h2>
            <div class="char-class">Void Walker</div>
        </div>

        <div class="stats-block">
            <div class="level-display">
                <span class="level-label">Level</span>
                <div class="level-value">42</div>
            </div>

            <div class="xp-section">
                <div class="xp-header">
                    <span>Experience</span>
                    <span>7,500 / 10,000</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <div class="points-box">
                <span class="points-label">Available Points</span>
                <div class="points-count" id="sp-display">3</div>
            </div>
        </div>
    </aside>

    <!-- Main Tree Area -->
    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span id="tt-cost" style="color: #fff; opacity: 0.7;">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * Skill Tree Data - Expanded Matrix
     * Coordinates are percentages (0-100) to fill screen width
     */
    const skillData = [
        // ROOT
        { id: 'root', name: 'Void Core', x: 50, y: 90, level: 1, max: 1, cost: 0, desc: 'The singularity from which all void power flows.', stat: 'Base Attribute' },
        
        // TIER 1
        { id: 'shadow', name: 'Shadow Step', x: 30, y: 75, level: 1, max: 3, cost: 1, desc: 'Phase through shadows to reposition instantly.', stat: '+5% Move Speed' },
        { id: 'shield', name: 'Void Shield', x: 70, y: 75, level: 0, max: 3, cost: 1, desc: 'Generate a barrier of negative energy.', stat: '+10% Armor' },
        
        // TIER 2
        { id: 'drain', name: 'Soul Drain', x: 15, y: 60, level: 0, max: 3, cost: 2, desc: 'Extract life force from targets.', stat: '+5% Lifesteal' },
        { id: 'blink', name: 'Phantom Blink', x: 50, y: 60, level: 1, max: 3, cost: 1, desc: 'Teleport short distances, leaving an afterimage.', stat: '-15% Cooldown' },
        { id: 'ward', name: 'Entropy Ward', x: 85, y: 60, level: 0, max: 3, cost: 2, desc: 'Passively reflects void damage.', stat: '+10% Reflect' },

        // TIER 3
        { id: 'shatter', name: 'Reality Shatter', x: 5, y: 45, level: 0, max: 1, cost: 3, desc: 'Crack the fabric of reality.', stat: 'Unlock Ultimate' },
        { id: 'time', name: 'Time Warp', x: 35, y: 45, level: 0, max: 3, cost: 2, desc: 'Slow the flow of time in an area.', stat: '-20% Enemy Speed' },
        { id: 'matter', name: 'Dark Matter', x: 65, y: 45, level: 0, max: 3, cost: 2, desc: 'Increase gravitational pull.', stat: '+15% Pull Radius' },
        { id: 'disint', name: 'Disintegrate', x: 95, y: 45, level: 0, max: 1, cost: 3, desc: 'Instantly destroy weak entities.', stat: 'Unlock Skill' },

        // TIER 4
        { id: 'void_s', name: 'Void Slash', x: 20, y: 30, level: 0, max: 3, cost: 1, desc: 'A sweeping attack infused with void.', stat: '+20% Damage' },
        { id: 'void_b', name: 'Void Barrier', x: 80, y: 30, level: 0, max: 3, cost: 1, desc: 'An impenetrable wall of darkness.', stat: '+30% Block' },
        
        // TIER 5
        { id: 'apex', name: 'Singularity', x: 50, y: 15, level: 0, max: 1, cost: 5, desc: 'Collapse into a star of infinite density.', stat: 'ALL STATS +10%' }
    ];

    const connections = [
        ['root', 'shadow'], ['root', 'shield'],
        ['shadow', 'drain'], ['shadow', 'blink'], 
        ['shield', 'blink'], ['shield', 'ward'],
        ['drain', 'shatter'], ['blink', 'time'], ['ward', 'matter'],
        ['shatter', 'void_s'], ['time', 'void_s'], 
        ['matter', 'void_b'], ['disint', 'void_b'],
        ['time', 'apex'], ['matter', 'apex']
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // Triangle SVG Path (Point Up)
    const triPath = "M25 2 L48 48 L2 48 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            // Determine initial state class
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = (skill.level === skill.max) ? 'maxed' : 'unlocked';
            }
            
            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Icon Logic
            let iconPath = '';
            if(skill.id.includes('shield') || skill.id.includes('ward') || skill.id.includes('barrier')) {
                iconPath = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>';
            } else if(skill.id.includes('shadow') || skill.id.includes('blink')) {
                iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/>';
            } else {
                iconPath = '<path d="M7 2v11h3v9l7-12h-4l4-8z"/>';
            }

            el.innerHTML = `
                <div class="tri-shape">
                    <div class="tri-bg"></div>
                    <div class="tri-border">
                        <svg viewBox="0 0 50 50"><path d="${triPath}"/></svg>
                    </div>
                    <svg class="tri-icon" viewBox="0 0 24 24">${iconPath}</svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;
            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                upgradeSkill(skill);
            });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering Connections (Refined: Glow & Bezier) ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isPathActive = parent.level > 0;
            const isFullyUnlocked = parent.level > 0 && child.level > 0;

            // Calculate Control Points for Smooth Bezier
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;

            // 1. Draw Glow Layer (Thicker, blurred)
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isFullyUnlocked) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.8)';
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.3)'; // Soft outer glow
                ctx.lineWidth = 6;
                ctx.stroke();
            } else if (isPathActive) {
                // Partially active path
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.3)';
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                // Locked path
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(100, 100, 120, 0.15)'; // Very subtle
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 6]); 
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 2. Draw Core Line (Thinner, brighter)
            if (isFullyUnlocked) {
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);
                
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#e9d5ff'; // Bright core
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        });

        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        // Check parent
        let hasParentUnlocked = false;
        if(skill.id === 'root') hasParentUnlocked = true;
        else {
            connections.forEach(([p, c]) => {
                if(c === skill.id) {
                    const parent = skillData.find(s => s.id === p);
                    if(parent.level > 0) hasParentUnlocked = true;
                }
            });
        }

        if(!hasParentUnlocked) return;

        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Visual feedback
        const tri = node.querySelector('.tri-shape');
        tri.style.transform = 'scale(1.3)';
        setTimeout(() => tri.style.transform = 'scale(1)', 200);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        
        const costEl = document.getElementById('tt-cost');
        if (skill.level < skill.max) {
            costEl.textContent = `Cost: ${skill.cost} | Lvl ${skill.level}/${skill.max}`;
            costEl.style.color = availablePoints >= skill.cost ? '#fff' : '#ff4444';
        } else {
            costEl.textContent = 'MAXED';
            costEl.style.color = 'var(--accent-gold)';
        }

        // Boundary check
        if(x + 300 > window.innerWidth) {
            tooltip.style.left = (x - 320) + 'px';
        } else {
            tooltip.style.left = x + 'px';
        }
        tooltip.style.top = y + 'px';
        
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
