<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree</title>
<style>
  :root {
    --c-sky: #4287C9;
    --c-snow: #E8F0F5;
    --c-ui-bg: #222;
    --c-ui-text: #FFF;
    --c-btn: #D93636;
    --c-btn-shadow: #8B0000;
    --c-btn-highlight: #FF8080;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace; /* Fallback */
    user-select: none;
  }

  /* CRT Monitor Container */
  #crt-case {
    position: relative;
    width: 640px;
    height: 480px;
    background: #111;
    border-radius: 20px;
    box-shadow: 
      0 0 0 5px #333,
      0 0 0 10px #111,
      0 20px 50px rgba(0,0,0,0.8);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #screen-bezel {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 60% 60% 55% 55% / 10%; /* CRT Curve */
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated; /* Sharp Pixels */
    image-rendering: crisp-edges;
  }

  /* UI Overlay Layer */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    box-sizing: border-box;
    z-index: 5;
  }

  /* Typography: Chunky Pixel Style */
  .title-container {
    text-align: center;
    transform: translateY(-10px);
  }

  h1 {
    font-family: 'Courier New', monospace;
    font-size: 56px;
    font-weight: 900;
    color: #fff;
    margin: 0;
    line-height: 1;
    letter-spacing: -2px;
    text-transform: uppercase;
    /* Hard aliased shadow */
    text-shadow: 
      4px 4px 0px #000, 
      -2px -2px 0px #D93636;
    position: relative;
  }

  /* Instructions Bar */
  .hud-bar {
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid #fff;
    color: #fff;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 12px;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    white-space: nowrap;
  }

  /* Bottom Controls */
  .controls-area {
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .hint-text {
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
  }

  /* Pixel Button */
  .pixel-btn {
    pointer-events: auto;
    background-color: var(--c-btn);
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 12px 30px;
    border: none;
    cursor: pointer;
    position: relative;
    /* CSS Pixel Art Border Trick */
    box-shadow: 
      inset 4px 4px 0px var(--c-btn-highlight),
      inset -4px -4px 0px var(--c-btn-shadow),
      4px 4px 0px #000; /* Hard Drop Shadow */
    animation: pulse 1.5s infinite;
    outline: none;
  }

  .pixel-btn:hover {
    background-color: #ff4d4d;
    transform: translate(-1px, -1px);
    box-shadow: 
      inset 4px 4px 0px var(--c-btn-highlight),
      inset -4px -4px 0px var(--c-btn-shadow),
      6px 6px 0px #000;
  }

  .pixel-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 
      inset 4px 4px 0px var(--c-btn-shadow),
      inset -4px -4px 0px var(--c-btn-highlight),
      0px 0px 0px #000;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* CRT Effects */
  #scanlines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 50%,
      rgba(0,0,0,0.15) 50%,
      rgba(0,0,0,0.15)
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
  }
  
  #vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 11;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }

</style>
</head>
<body>

<div id="crt-case">
  <div id="screen-bezel">
    <canvas id="gameCanvas" width="320" height="240"></canvas>
    
    <!-- UI Overlay -->
    <div id="ui-layer">
      <div class="title-container">
        <h1>SkiFree</h1>
        <div class="hud-bar">Avoid the trees. Avoid the Yeti.</div>
      </div>
      
      <div class="controls-area">
        <div class="hint-text">Arrows to Move</div>
        <button class="pixel-btn" onclick="startGame()">START</button>
      </div>
    </div>

    <div id="scanlines"></div>
    <div id="vignette"></div>
  </div>
</div>

<script>
/**
 * VISUAL SYSTEM: NATIVE PIXEL ART
 * Drawing assets at 1x resolution onto a 320x240 canvas.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 320;
const H = 240;

// Palette
const C_SKY = '#4287C9';
const C_SNOW = '#E8F0F5';
const C_SNOW_DARK = '#C0D0D8';
const C_TRUNK = '#5D4037';
const C_LEAF_DARK = '#2E7D32';
const C_LEAF_LIGHT = '#4CAF50';
const C_SUN = '#FFD54F';
const C_SKIER_J = '#D32F2F';
const C_SKIER_P = '#1976D2';
const C_SKIN = '#FFCCBC';

// State
let frame = 0;
let gameActive = false;
let skierX = W / 2;
let trees = [];

// --- ASSET DRAWING FUNCTIONS ---

function drawRect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawSun(x, y) {
  // Pixelated circle approximation
  const r = 12;
  drawRect(x-r, y-2, r*2, 4, C_SUN);
  drawRect(x-r+2, y-6, r*2-4, 4, C_SUN);
  drawRect(x-r+4, y-r, r*2-8, 4, C_SUN);
  // Glow
  ctx.globalAlpha = 0.3;
  drawRect(x-r-4, y-r-4, r*2+8, r*2+8, C_SUN);
  ctx.globalAlpha = 1.0;
}

function drawTree(x, y, scale) {
  const s = scale;
  // Shadow
  drawRect(x - 4*s, y + 12*s, 16*s, 3*s, 'rgba(0,0,0,0.1)');
  
  // Trunk
  drawRect(x, y + 10*s, 4*s, 6*s, C_TRUNK);
  
  // Leaves (Staggered)
  drawRect(x - 8*s, y + 8*s, 20*s, 6*s, C_LEAF_DARK);
  drawRect(x - 6*s, y + 4*s, 16*s, 6*s, C_LEAF_LIGHT);
  drawRect(x - 4*s, y, 12*s, 6*s, C_LEAF_DARK);
  drawRect(x - 2*s, y - 4*s, 8*s, 4*s, C_LEAF_LIGHT);
  
  // Snow caps (randomized slightly for variety)
  if ((x + y) % 3 !== 0) {
     drawRect(x - 2*s, y - 4*s, 2*s, 2*s, C_SNOW);
     drawRect(x + 4*s, y, 2*s, 2*s, C_SNOW);
  }
}

function drawSkier(x, y) {
  const s = 2; // Skier scale
  
  // Bobbing animation
  const bob = (frame % 10 < 5) ? 0 : 1;
  const lean = (Math.sin(frame * 0.1) * 2); // Subtle sway

  const sx = Math.floor(x);
  const sy = Math.floor(y + bob);

  // Skis
  drawRect(sx - 6*s, sy + 16*s, 4*s, 2*s, '#333'); // Left
  drawRect(sx + 2*s, sy + 16*s, 4*s, 2*s, '#333'); // Right
  
  // Legs
  drawRect(sx - 4*s, sy + 12*s, 2*s, 4*s, C_SKIER_P);
  drawRect(sx + 2*s, sy + 12*s, 2*s, 4*s, C_SKIER_P);
  
  // Body
  drawRect(sx - 3*s, sy + 6*s, 6*s, 6*s, C_SKIER_J);
  
  // Head
  drawRect(sx - 2*s, sy + 2*s, 4*s, 4*s, C_SKIN);
  drawRect(sx - 2*s, sy + 1*s, 4*s, 2*s, '#333'); // Hair/Hat
  
  // Arms (Poles)
  drawRect(sx - 6*s, sy + 8*s, 2*s, 8*s, '#888');
  drawRect(sx + 4*s, sy + 8*s, 2*s, 8*s, '#888');
}

function drawSnowDrift(x, y) {
  ctx.fillStyle = C_SNOW_DARK;
  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI, true);
  ctx.fill();
}

// --- SCENE GENERATION ---

function initScene() {
  trees = [];
  // Create a natural scattered slope
  for(let i=0; i<40; i++) {
    trees.push({
      x: Math.random() * W,
      y: Math.random() * H + 50, // Start below horizon
      scale: 0.8 + Math.random() * 0.6,
      speed: 0.5 + Math.random() * 0.5
    });
  }
}

function update() {
  frame++;
  
  if (gameActive) {
    // Skier movement (Idle sway if not moving)
    // Trees scroll
    trees.forEach(t => {
      t.y += t.speed;
      // Wrap around
      if (t.y > H + 20) {
        t.y = -20;
        t.x = Math.random() * W;
      }
    });
  }
}

function render() {
  // Clear
  ctx.fillStyle = C_SKY;
  ctx.fillRect(0, 0, W, H);
  
  // Sun
  drawSun(260, 40);
  
  // Horizon
  drawRect(0, 80, W, H - 80, C_SNOW);
  
  // Draw Trees (Sorted by Y for depth)
  trees.sort((a, b) => a.y - b.y);
  trees.forEach(t => {
    drawTree(t.x, t.y, t.scale);
  });
  
  // Draw Skier
  // If game not active, place skier in center foreground
  if (!gameActive) {
     drawSkier(W/2, 140);
  } else {
     drawSkier(skierX, 60);
  }
  
  // Foreground drifts (Static decoration)
  drawSnowDrift(20, H);
  drawSnowDrift(300, H-10);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// --- INTERACTION ---

function startGame() {
  if(gameActive) return;
  
  // Flash effect
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,W,H);
  
  gameActive = true;
  
  // Hide UI elements
  const ui = document.getElementById('ui-layer');
  ui.style.opacity = '0';
  ui.style.transition = 'opacity 0.5s';
  
  // Start loop if not running (it is running, but logic changes)
}

// Input
window.addEventListener('keydown', e => {
  if(!gameActive) return;
  if(e.key === 'ArrowLeft') skierX -= 10;
  if(e.key === 'ArrowRight') skierX += 10;
  // Clamp
  if(skierX < 10) skierX = 10;
  if(skierX > W-10) skierX = W-10;
});

// Init
initScene();
loop();

</script>
</body>
</html>
