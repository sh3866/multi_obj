<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension — Skill Matrix</title>
<style>
    :root {
        --bg-deep: #050508;
        --accent-primary: #b084f0; /* Lighter, punchier purple */
        --accent-secondary: #7000ff; /* Deep violet for gradients */
        --accent-glow: rgba(176, 132, 240, 0.6);
        --accent-gold: #f0e68c;
        --text-main: #ffffff;
        --text-muted: #8888a0;
        --text-dim: #444455;
        
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-header: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* Fallback safe */
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* --- Background Atmosphere (Nebula/Noise) --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
        background: 
            radial-gradient(circle at 50% 50%, rgba(30, 20, 50, 0.4) 0%, rgba(5, 5, 8, 0.9) 70%),
            repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 2px);
    }
    
    .bg-atmosphere::after {
        content: '';
        position: absolute;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        opacity: 0.4;
        mix-blend-mode: overlay;
    }

    /* --- Sidebar --- */
    aside {
        width: 380px;
        height: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 10;
        /* Texture and Border */
        background: linear-gradient(135deg, rgba(15, 15, 20, 0.95) 0%, rgba(10, 10, 15, 0.8) 100%);
        border-right: 1px solid rgba(255,255,255,0.08);
        box-shadow: 10px 0 40px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        position: relative;
    }

    /* Decorative Sidebar Line */
    aside::before {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 1px;
        background: linear-gradient(to bottom, transparent, var(--accent-primary), transparent);
        opacity: 0.3;
    }

    .brand {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent-primary);
        opacity: 0.8;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .brand::before {
        content: '';
        display: block;
        width: 20px;
        height: 2px;
        background: var(--accent-primary);
        box-shadow: 0 0 5px var(--accent-primary);
    }

    .char-profile {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 20px;
    }

    .char-name {
        font-family: var(--font-header);
        font-size: 3rem;
        font-weight: 800; /* Dominant */
        line-height: 1;
        letter-spacing: -1px;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        margin: 0;
    }

    .char-class {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent-primary);
        font-weight: 600;
        opacity: 0.9;
    }

    /* Level Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .lvl-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .lvl-num {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text-main);
        opacity: 0.6; /* Subordinate */
    }

    .xp-track {
        width: 100%;
        height: 6px;
        background: rgba(0,0,0,0.6);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    }

    .xp-fill {
        width: 72%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-primary);
        position: relative;
    }
    
    /* XP Shimmer */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .xp-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right;
        font-variant-numeric: tabular-nums;
        margin-top: -10px;
    }

    /* --- Relocated Points Header (Top Right of Sidebar) --- */
    .points-header {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        background: linear-gradient(90deg, rgba(176, 132, 240, 0.1), rgba(176, 132, 240, 0.05));
        border: 1px solid rgba(176, 132, 240, 0.3);
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(176, 132, 240, 0.05);
    }

    .ph-content {
        display: flex;
        flex-direction: column;
    }

    .ph-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--accent-primary);
        font-weight: 600;
    }

    .ph-value {
        font-size: 2.2rem;
        font-weight: 800; /* Heavy weight per request */
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 15px var(--accent-glow);
        font-variant-numeric: tabular-nums;
    }

    .ph-icon {
        width: 32px;
        height: 32px;
        background: var(--accent-primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 15px var(--accent-primary);
        color: #000;
        font-weight: bold;
    }

    /* --- Main Tree Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        z-index: 5;
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
        /* Allow canvas to be under nodes but visible */
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    /* --- Node Design (Hexagon) --- */
    .node {
        position: absolute;
        width: 48px;
        height: 48px;
        /* Hexagon Geometry */
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
        transform: translate(-50%, -50%);
    }

    /* Inner content container to handle border/background separation */
    .node-inner {
        width: 100%;
        height: 100%;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s, box-shadow 0.3s;
    }

    .node svg {
        width: 22px;
        height: 22px;
        fill: var(--text-dim);
        z-index: 2;
        transition: fill 0.3s, transform 0.3s, filter 0.3s;
    }

    /* --- States --- */
    
    /* 1. Locked */
    .node.locked {
        opacity: 0.5; /* Increased opacity */
    }
    .node.locked .node-inner { background: #15151e; }
    .node.locked svg { fill: #333; }

    /* 2. Unlocked (Active) */
    .node.unlocked {
        opacity: 1;
    }
    .node.unlocked .node-inner { 
        background: #2a2a35; 
    }
    .node.unlocked svg { 
        fill: #fff; 
        filter: drop-shadow(0 0 2px rgba(255,255,255,0.8));
    }

    /* 3. Maxed (Ultimate/Complete) - The "Pop" */
    .node.maxed {
        opacity: 1;
    }
    .node.maxed .node-inner { 
        background: var(--accent-secondary); 
        box-shadow: 0 0 20px var(--accent-glow); /* Glow effect */
    }
    .node.maxed svg { 
        fill: #fff; 
        transform: scale(1.1);
        filter: drop-shadow(0 0 5px #fff);
    }

    /* 4. Available (Next Step) */
    .node.available {
        animation: pulse-avail 3s infinite ease-in-out;
    }
    .node.available .node-inner {
        background: #1a1a24;
        /* Simulated border via inset shadow */
        box-shadow: inset 0 0 0 2px var(--accent-primary);
    }
    .node.available svg { 
        fill: var(--accent-primary); 
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    @keyframes pulse-avail {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.1); }
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.25) !important;
    }
    .node:hover .node-inner {
        background: #333;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        bottom: 40px;
        left: 40px;
        width: 320px;
        background: rgba(15, 15, 20, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 3px solid var(--accent-primary);
        padding: 24px;
        backdrop-filter: blur(15px);
        border-radius: 8px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 5px;
        font-size: 1.4rem;
        color: #fff;
        letter-spacing: 0.5px;
    }

    .tooltip .tier {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        display: block;
        font-weight: 600;
    }

    .tooltip p {
        margin: 0 0 15px;
        font-size: 0.95rem;
        color: #ccc;
        line-height: 1.6;
        font-weight: 300;
    }

    .tooltip .stat-box {
        background: rgba(255,255,255,0.05);
        padding: 10px 14px;
        border-radius: 6px;
        font-family: monospace;
        color: var(--accent-gold);
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    /* Upgrade Button in Tooltip */
    .upgrade-btn {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        background: rgba(176, 132, 240, 0.1);
        border: 1px solid var(--accent-primary);
        color: var(--accent-primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 4px;
        font-size: 0.8rem;
    }
    
    .upgrade-btn:hover {
        background: var(--accent-primary);
        color: #000;
        box-shadow: 0 0 15px var(--accent-primary);
    }
    
    .upgrade-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        border-color: var(--text-muted);
        color: var(--text-muted);
        background: transparent;
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>

<!-- Sidebar -->
<aside>
    <div class="brand">Ascension Matrix</div>

    <div class="char-profile">
        <h1 class="char-name">Kaelen</h1>
        <div class="char-class">Void Walker</div>
    </div>

    <!-- Relocated Points Card -->
    <div class="points-header">
        <div class="ph-content">
            <span class="ph-label">Skill Points</span>
            <span class="ph-value" id="sp-count">3</span>
        </div>
        <div class="ph-icon">✦</div>
    </div>

    <div class="level-section">
        <div class="level-header">
            <span class="lvl-label">Current Level</span>
            <span class="lvl-num">42</span>
        </div>
        <div class="xp-track">
            <div class="xp-fill"></div>
        </div>
        <div class="xp-text">7,500 / 10,000 XP</div>
    </div>
</aside>

<!-- Tree Viewport -->
<main id="viewport">
    <canvas id="tree-canvas"></canvas>
    <div class="node-layer" id="node-layer"></div>
    
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <span class="tier" id="tt-tier">Tier 1</span>
        <p id="tt-desc">Skill description goes here.</p>
        <div class="stat-box">
            <span>Effect</span>
            <span id="tt-stat">+10% Dmg</span>
        </div>
        <button class="upgrade-btn" id="tt-btn">Upgrade</button>
    </div>
</main>

<script>
    // --- Configuration & Data ---
    const skills = [
        // T0 Root
        { id: 'r1', name: 'Void Core', tier: 0, x: 50, y: 95, max: 1, lvl: 1, desc: 'The origin of your power. Increases base stats.', stat: 'All Stats +5%' },
        
        // T1
        { id: 't1_l', name: 'Shadow Step', tier: 1, x: 25, y: 80, max: 3, lvl: 1, desc: 'Move through shadows instantly.', stat: 'Cooldown -0.5s' },
        { id: 't1_r', name: 'Arcane Shell', tier: 1, x: 75, y: 80, max: 3, lvl: 1, desc: 'Create a mana barrier.', stat: 'Armor +15' },
        
        // T2
        { id: 't2_ll', name: 'Dash', tier: 2, x: 10, y: 65, max: 3, lvl: 0, desc: 'Quick burst of speed.', stat: 'Speed +10%' },
        { id: 't2_lm', name: 'Siphon', tier: 2, x: 30, y: 65, max: 3, lvl: 0, desc: 'Drain enemy health.', stat: 'Lifesteal +2%' },
        { id: 't2_rm', name: 'Reflect', tier: 2, x: 70, y: 65, max: 3, lvl: 0, desc: 'Bounce damage back.', stat: 'Reflect +5%' },
        { id: 't2_rr', name: 'Curse', tier: 2, x: 90, y: 65, max: 3, lvl: 0, desc: 'Weaken enemy armor.', stat: 'Enemy Def -10%' },

        // T3
        { id: 't3_1', name: 'Blink', tier: 3, x: 5, y: 50, max: 3, lvl: 0, desc: 'Teleport short distance.', stat: 'Range +2m' },
        { id: 't3_2', name: 'Leech', tier: 3, x: 20, y: 50, max: 3, lvl: 0, desc: 'Area heal on kill.', stat: 'Heal +5%' },
        { id: 't3_3', name: 'Nova', tier: 3, x: 40, y: 50, max: 3, lvl: 0, desc: 'Explosive aura.', stat: 'AoE Dmg +20%' },
        { id: 't3_4', name: 'Barrier', tier: 3, x: 60, y: 50, max: 3, lvl: 0, desc: 'Absorb burst dmg.', stat: 'Shield +50' },
        { id: 't3_5', name: 'Hex', tier: 3, x: 80, y: 50, max: 3, lvl: 0, desc: 'Slow enemies.', stat: 'Slow 15%' },
        { id: 't3_6', name: 'Doom', tier: 3, x: 95, y: 50, max: 3, lvl: 0, desc: 'Mark for death.', stat: 'Crit +10%' },

        // T4
        { id: 't4_1', name: 'Phase', tier: 4, x: 15, y: 35, max: 3, lvl: 0, desc: 'Invulnerability frames.', stat: '1s i-frames' },
        { id: 't4_2', name: 'Void Bomb', tier: 4, x: 35, y: 35, max: 3, lvl: 0, desc: 'High dmg projectile.', stat: 'Dmg +50%' },
        { id: 't4_3', name: 'Pulse', tier: 4, x: 65, y: 35, max: 3, lvl: 0, desc: 'Rapid fire aura.', stat: 'ASPD +20%' },
        { id: 't4_4', name: 'Plague', tier: 4, x: 85, y: 35, max: 3, lvl: 0, desc: 'DoT spread.', stat: 'DoT +50%' },

        // T5
        { id: 't5_1', name: 'Teleport', tier: 5, x: 25, y: 20, max: 1, lvl: 0, desc: 'Global recall ability.', stat: 'Ultimate' },
        { id: 't5_2', name: 'Singularity', tier: 5, x: 50, y: 20, max: 1, lvl: 0, desc: 'Create a black hole.', stat: 'Ultimate' },
        { id: 't5_3', name: 'Execute', tier: 5, x: 75, y: 20, max: 1, lvl: 0, desc: 'Kill enemies below 20% HP.', stat: 'Ultimate' },

        // T6 Apex
        { id: 'apex', name: 'Ascension', tier: 6, x: 50, y: 5, max: 1, lvl: 0, desc: 'Transcend mortality.', stat: 'ALL +100%' }
    ];

    // Connections: [ParentID, ChildID]
    const links = [
        ['r1', 't1_l'], ['r1', 't1_r'],
        ['t1_l', 't2_ll'], ['t1_l', 't2_lm'],
        ['t1_r', 't2_rm'], ['t1_r', 't2_rr'],
        ['t2_ll', 't3_1'], ['t2_ll', 't3_2'],
        ['t2_lm', 't3_2'], ['t2_lm', 't3_3'],
        ['t2_rm', 't3_3'], ['t2_rm', 't3_4'],
        ['t2_rr', 't3_4'], ['t2_rr', 't3_5'], ['t2_rr', 't3_6'],
        ['t3_1', 't4_1'], ['t3_2', 't4_1'], ['t3_2', 't4_2'],
        ['t3_3', 't4_2'], ['t3_3', 't4_3'],
        ['t3_4', 't4_3'], ['t3_5', 't4_3'], ['t3_5', 't4_4'],
        ['t3_6', 't4_4'],
        ['t4_1', 't5_1'], ['t4_2', 't5_1'], ['t4_2', 't5_2'],
        ['t4_3', 't5_2'], ['t4_3', 't5_3'], ['t4_4', 't5_3'],
        ['t5_1', 'apex'], ['t5_2', 'apex'], ['t5_3', 'apex']
    ];

    // --- State Management ---
    let points = 3;
    let scale = 1.3; 
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX, dragStartY;
    let hoveredSkill = null;

    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const nodeLayer = document.getElementById('node-layer');
    const spCount = document.getElementById('sp-count');
    const ttBtn = document.getElementById('tt-btn');
    
    // --- Init ---
    function init() {
        resize();
        createNodes();
        updateStates();
        render();
    }

    window.addEventListener('resize', () => {
        resize();
        render();
    });

    function resize() {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
    }

    // --- Node Creation ---
    function createNodes() {
        skills.forEach(s => {
            const el = document.createElement('div');
            el.className = 'node';
            el.id = `node-${s.id}`;
            el.style.left = `${s.x}%`;
            el.style.top = `${s.y}%`;
            
            // Icon Logic
            let path = '';
            if(s.tier === 6) path = '<path d="M12 2L2 22h20L12 2zm0 3.5L18.5 20h-13L12 5.5z"/>'; // Diamond
            else if(s.tier === 5) path = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>'; // Shield
            else if(s.tier % 2 === 0) path = '<circle cx="12" cy="12" r="8"/>'; // Circle
            else path = '<path d="M12 2l-5.5 9h11z"/>'; // Triangle
            
            el.innerHTML = `<div class="node-inner"><svg viewBox="0 0 24 24">${path}</svg></div>`;
            
            // Events
            el.onmouseenter = (e) => showTooltip(e, s);
            el.onmouseleave = hideTooltip;
            el.onclick = (e) => {
                e.stopPropagation(); // prevent drag start
                upgrade(s);
            };

            nodeLayer.appendChild(el);
        });
    }

    // --- Logic ---
    function updateStates() {
        skills.forEach(s => {
            const el = document.getElementById(`node-${s.id}`);
            const parentIds = links.filter(l => l[1] === s.id).map(l => l[0]);
            const parentsUnlocked = parentIds.length === 0 || parentIds.some(pid => skills.find(sk => sk.id === pid).lvl > 0);
            
            // Reset classes
            el.className = 'node';
            
            if (s.lvl > 0) {
                el.classList.add(s.lvl >= s.max ? 'maxed' : 'unlocked');
            } else if (parentsUnlocked) {
                // Always show as available if parents are unlocked, regardless of points (points check happens on click)
                // But let's add a visual cue if we have points
                if(points > 0) {
                    el.classList.add('available');
                } else {
                    el.classList.add('locked'); // Visual lock if no currency
                }
            } else {
                el.classList.add('locked');
            }
        });
        render(); // Redraw lines
    }

    function upgrade(skill) {
        if (points <= 0) return;
        if (skill.lvl >= skill.max) return;
        
        // Check parents
        const parentIds = links.filter(l => l[1] === skill.id).map(l => l[0]);
        const parentsUnlocked = parentIds.length === 0 || parentIds.some(pid => skills.find(sk => sk.id === pid).lvl > 0);
        
        if (parentsUnlocked) {
            skill.lvl++;
            points--;
            spCount.innerText = points;
            updateStates();
            
            // Update tooltip button if this skill is still hovered
            if(hoveredSkill && hoveredSkill.id === skill.id) {
                updateTooltipButton(skill);
            }
        }
    }

    // --- Rendering (Canvas Lines) ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        // Center the pan
        ctx.translate(canvas.width/2 + panX, canvas.height/2 + panY);
        ctx.scale(scale, scale);
        // Offset back so 0,0 is top left of the coordinate space
        // Mapping 0-100% to a 1000x1000 virtual grid
        ctx.translate(-500, -500); 

        links.forEach(([pid, cid]) => {
            const p = skills.find(s => s.id === pid);
            const c = skills.find(s => s.id === cid);
            
            const pActive = p.lvl > 0;
            const cActive = c.lvl > 0;

            const x1 = p.x * 10; 
            const y1 = (100 - p.y) * 10; 
            const x2 = c.x * 10;
            const y2 = (100 - c.y) * 10;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            
            // Constellation Geometry: Straight Lines
            // Critique: "Connect nodes using straight lines that link center-to-center"
            ctx.lineTo(x2, y2);

            if (pActive && cActive) {
                // Active Path: Bright, solid, glowing
                ctx.strokeStyle = 'rgba(176, 132, 240, 0.8)';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#b084f0';
                ctx.lineCap = 'round';
            } else if (pActive) {
                // Potential Path: Dashed, lighter
                ctx.strokeStyle = 'rgba(176, 132, 240, 0.2)';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 0;
                ctx.setLineDash([6, 6]);
                ctx.lineCap = 'round';
            } else {
                // Locked Path: Very faint, solid
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 1;
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
            }
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Interaction ---
    const viewport = document.getElementById('viewport');
    
    viewport.addEventListener('mousedown', e => {
        if(e.target === canvas || e.target === viewport) {
            isDragging = true;
            dragStartX = e.clientX - panX;
            dragStartY = e.clientY - panY;
        }
    });
    
    window.addEventListener('mouseup', () => isDragging = false);
    
    window.addEventListener('mousemove', e => {
        if (isDragging) {
            panX = e.clientX - dragStartX;
            panY = e.clientY - dragStartY;
            render();
        }
    });
    
    // Zoom
    viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.001;
        const newScale = scale - e.deltaY * zoomSpeed;
        scale = Math.min(Math.max(0.5, newScale), 3);
        render();
    });

    // Tooltip Logic
    const tooltip = document.getElementById('tooltip');
    
    function showTooltip(e, skill) {
        hoveredSkill = skill;
        document.getElementById('tt-title').innerText = skill.name;
        document.getElementById('tt-tier').innerText = `Tier ${skill.tier}`;
        document.getElementById('tt-desc').innerText = skill.desc;
        document.getElementById('tt-stat').innerText = skill.stat;
        
        updateTooltipButton(skill);
        
        tooltip.classList.add('visible');
    }
    
    function updateTooltipButton(skill) {
        if(skill.lvl >= skill.max) {
            ttBtn.innerText = "Maxed";
            ttBtn.disabled = true;
            ttBtn.style.display = 'block';
        } else if (points > 0) {
            ttBtn.innerText = `Upgrade (${skill.lvl}/${skill.max})`;
            ttBtn.disabled = false;
            ttBtn.style.display = 'block';
            ttBtn.onclick = () => upgrade(skill);
        } else {
            ttBtn.innerText = "No Points";
            ttBtn.disabled = true;
            ttBtn.style.display = 'block';
        }
    }
    
    function hideTooltip() {
        hoveredSkill = null;
        tooltip.classList.remove('visible');
    }

    init();

</script>
</body>
</html>
