<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Void Ascension</title>
<style>
    :root {
        --bg-void: #050508;
        --bg-void-radial: radial-gradient(circle at 50% 40%, #1a1c29 0%, #050508 80%);
        --accent-cyan: #00f0ff;
        --accent-gold: #ffd700;
        --accent-purple: #7000ff;
        --text-main: #ffffff;
        --text-muted: #94a3b8;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        
        --node-size: 56px;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background: var(--bg-void);
        background-image: var(--bg-void-radial);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.05;
        pointer-events: none;
        z-index: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 10;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(5, 5, 8, 0.6);
        backdrop-filter: blur(8px);
    }

    .brand {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .brand svg {
        width: 20px;
        height: 20px;
        fill: var(--accent-cyan);
        filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    .nav-links span {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-left: 24px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: color 0.3s;
    }
    .nav-links span:hover { color: var(--accent-cyan); }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        position: relative;
        z-index: 1;
    }

    /* --- Sidebar (Stats) --- */
    aside {
        width: 300px;
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        position: relative;
        z-index: 5;
        /* Subtle gradient border on right */
        background: linear-gradient(90deg, rgba(0,0,0,0.4) 0%, transparent 100%);
    }

    .character-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .char-info {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .avatar-frame {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
        box-shadow: 0 0 0 2px rgba(0,0,0,0.5);
    }
    
    .avatar-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }

    .char-details h2 {
        font-family: var(--font-ui); /* Unified font */
        font-size: 1.25rem;
        margin: 0;
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-cyan);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
    }

    /* Floating Artifact (Skill Points) */
    .artifact-container {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 15px;
        background: rgba(255, 215, 0, 0.05);
        border: 1px solid rgba(255, 215, 0, 0.15);
        padding: 12px 16px;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
    }

    .artifact-container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(45deg, transparent 40%, rgba(255, 215, 0, 0.1) 50%, transparent 60%);
        animation: sheen 3s infinite linear;
    }

    @keyframes sheen {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .artifact-icon {
        width: 32px;
        height: 32px;
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    .artifact-text {
        display: flex;
        flex-direction: column;
    }

    .points-count {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent-gold);
        line-height: 1;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
    
    .points-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 215, 0, 0.8);
        margin-top: 2px;
    }

    /* Stats Block */
    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 8px;
    }
    
    .stat-label { color: var(--text-muted); font-size: 0.85rem; }
    .stat-value { font-weight: 600; color: #fff; }

    .xp-container {
        margin-top: 5px;
    }
    
    .xp-bar-bg {
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 8px;
    }
    
    .xp-bar-fill {
        height: 100%;
        width: 75%;
        background: var(--accent-cyan);
        box-shadow: 0 0 10px var(--accent-cyan);
    }

    /* --- Center (Tree) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.02) 0%, transparent 60%);
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
    }

    /* --- The Crystalline Node --- */
    .node {
        position: absolute;
        width: var(--node-size);
        height: var(--node-size);
        /* Hexagon Shape */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: #0a0c12;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        transform: translate(-50%, -50%);
        border: none; /* Clip path handles shape */
    }
    
    /* Inner Glow Layer */
    .node::before {
        content: '';
        position: absolute;
        inset: 2px;
        background: #000;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
    }

    .node svg {
        width: 24px;
        height: 24px;
        fill: var(--text-muted);
        transition: fill 0.3s, transform 0.3s;
        z-index: 2;
    }

    /* Node States */
    .node.locked {
        opacity: 0.6;
        background: #1e232e;
    }
    
    .node.unlocked {
        background: #0f172a;
        box-shadow: 0 0 0 1px var(--accent-cyan); /* Doesn't work well with clip-path, handled via pseudo or filter */
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
    }
    .node.unlocked::before {
        background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, #000 80%);
    }
    .node.unlocked svg { fill: var(--accent-cyan); }

    .node.maxed {
        background: rgba(255, 215, 0, 0.1);
        filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.5));
    }
    .node.maxed::before {
        background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, #000 80%);
    }
    .node.maxed svg { fill: var(--accent-gold); transform: scale(1.1); }

    /* Focus / Upgradeable Node */
    .node.upgradeable {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.2);
        background: rgba(0, 240, 255, 0.1);
        filter: drop-shadow(0 0 15px var(--accent-cyan));
        animation: pulse-node 2s infinite ease-in-out;
    }
    .node.upgradeable::before {
        background: radial-gradient(circle, rgba(0, 240, 255, 0.3) 0%, #000 90%);
    }
    .node.upgradeable svg { fill: #fff; }

    @keyframes pulse-node {
        0% { transform: translate(-50%, -50%) scale(1.2); filter: drop-shadow(0 0 10px var(--accent-cyan)); }
        50% { transform: translate(-50%, -50%) scale(1.25); filter: drop-shadow(0 0 20px var(--accent-cyan)); }
        100% { transform: translate(-50%, -50%) scale(1.2); filter: drop-shadow(0 0 10px var(--accent-cyan)); }
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 20;
    }
    .node.upgradeable:hover {
        transform: translate(-50%, -50%) scale(1.3);
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(10, 12, 16, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 16px;
        width: 240px;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 100;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
        border-left: 3px solid var(--accent-cyan);
    }

    .tooltip.visible { opacity: 1; }
    
    .tooltip h3 {
        margin: 0 0 6px;
        font-family: var(--font-ui);
        color: var(--text-main);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    
    .tooltip .desc {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 12px;
    }

    .tooltip .stats {
        font-size: 0.75rem;
        color: var(--accent-cyan);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: rgba(0, 240, 255, 0.1);
        padding: 6px 10px;
        border-radius: 4px;
        display: inline-block;
    }

    /* Floating particles */
    .particle {
        position: absolute;
        background: var(--accent-cyan);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
    }

</style>
</head>
<body>

<div class="noise-overlay"></div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        Arcanum
    </div>
    <div class="nav-links">
        <span>Inventory</span>
        <span>Quests</span>
        <span>Settings</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <div class="character-card">
            <div class="char-info">
                <div class="avatar-frame">
                    <!-- Simple SVG Avatar -->
                    <svg viewBox="0 0 100 100" style="width:100%; height:100%; fill:#2a3245;">
                        <path d="M30,30 Q50,10 70,30 L80,80 L20,80 Z" />
                        <circle cx="50" cy="45" r="15" fill="#1e232e" />
                        <rect x="35" y="65" width="30" height="15" fill="#1e232e" />
                    </svg>
                </div>
                <div class="char-details">
                    <h2 class="char-name">Kaelen</h2>
                    <div class="char-class">Void Walker</div>
                </div>
            </div>

            <!-- Floating Artifact -->
            <div class="artifact-container">
                <svg class="artifact-icon" viewBox="0 0 24 24" fill="var(--accent-gold)">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="artifact-text">
                    <div class="points-count" id="sp-display">3</div>
                    <div class="points-label">Available Points</div>
                </div>
            </div>
        </div>

        <div class="stat-block">
            <div class="stat-row">
                <span class="stat-label">Level</span>
                <span class="stat-value">42</span>
            </div>
            
            <div class="xp-container">
                <div class="stat-row">
                    <span class="stat-label">Experience</span>
                    <span class="stat-value">7,500 / 10,000</span>
                </div>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill"></div>
                </div>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-container" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats" id="tt-stats">+10% Damage</div>
        </div>
    </main>
</div>

<script>
    /**
     * Data Structure for the Skill Tree
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%' }
    ];

    // Connections (Parent ID -> Child ID)
    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex'] 
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            
            // Determine class based on state
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = (skill.level === skill.max) ? 'maxed' : 'unlocked';
            }

            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Icon (SVG Path based on type)
            let iconPath = '';
            if(skill.id.includes('str')) iconPath = '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>'; 
            else if(skill.id.includes('int')) iconPath = '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10h-20A10 10 0 0 1 12 2z" fill="none" stroke="currentColor" stroke-width="2"/>'; 
            else iconPath = '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>'; 

            el.innerHTML = `<svg viewBox="0 0 24 24">${iconPath}</svg>`;
            
            // Events
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
        updateNodeStates();
    }

    // --- Rendering ---

    function getCoordinates(id) {
        const skill = skillData.find(s => s.id === id);
        return {
            x: (skill.x / 100) * canvas.width,
            y: (skill.y / 100) * canvas.height
        };
    }

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Draw Bezier Curve
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isUnlocked) {
                // Active Energy Conduit
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(0, 240, 255, 0.6)';
                ctx.setLineDash([]);
            } else if (isPath) {
                // Locked Path (Dashed)
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([5, 10]);
            } else {
                // Inactive Path
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
            }
            
            ctx.stroke();
        });

        ctx.restore();
    }

    // --- Logic ---

    function updateNodeStates() {
        skillData.forEach(skill => {
            const el = document.getElementById(`node-${skill.id}`);
            // Reset classes
            el.className = 'node';
            
            if (skill.level > 0) {
                el.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
            } else {
                // Check if upgradeable (has points, parent unlocked)
                const parentUnlocked = connections.some(([p, c]) => c === skill.id && skillData.find(s => s.id === p).level > 0);
                if (parentUnlocked && availablePoints > 0) {
                    el.classList.add('upgradeable');
                } else {
                    el.classList.add('locked');
                }
            }
        });
        drawConnections();
    }

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        // Check parent
        const parentUnlocked = connections.some(([p, c]) => c === skill.id && skillData.find(s => s.id === p).level > 0);
        if (!parentUnlocked) return;

        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        updateNodeStates();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 15;
        const y = e.clientY - rect.top + 15;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        
        let statsText = skill.stat;
        if (skill.level < skill.max) {
            statsText += ` (Lvl ${skill.level}/${skill.max})`;
        } else {
            statsText += ` (MAXED)`;
        }
        document.getElementById('tt-stats').textContent = statsText;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan/Zoom) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
