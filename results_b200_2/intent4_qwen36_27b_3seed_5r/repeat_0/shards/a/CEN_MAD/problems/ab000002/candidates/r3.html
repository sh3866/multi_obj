<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Matrix — Character Dashboard</title>
<style>
    :root {
        --bg-deep: #020204;
        --bg-radial: radial-gradient(circle at 50% 50%, #1a1525 0%, #050408 60%, #000000 100%);
        --accent-primary: #d0a4ff; /* Soft Purple */
        --accent-glow: #7b2cbf;    /* Deep Purple */
        --accent-gold: #ffd700;
        --text-main: #ffffff;
        --text-muted: #8a8a9b;
        --glass-bg: rgba(10, 10, 15, 0.7);
        --glass-border: rgba(255, 255, 255, 0.08);
        
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background: var(--bg-deep);
        background-image: var(--bg-radial);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* Vignette Overlay */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 50;
    }

    /* --- Sidebar (Elevated Hierarchy) --- */
    aside {
        width: 360px;
        height: 100%;
        padding: 50px 40px;
        display: flex;
        flex-direction: column;
        gap: 50px;
        z-index: 10;
        background: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%);
        border-right: 1px solid rgba(255,255,255,0.05);
        backdrop-filter: blur(5px);
    }

    .brand {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--accent-primary);
        opacity: 0.6;
        margin-bottom: 10px;
    }

    .char-profile {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .char-name {
        font-size: 2.5rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -1px;
        background: linear-gradient(to right, #fff, #b0b0b0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
    }

    .char-class {
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent-primary);
        font-weight: 600;
    }

    /* Level Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .lvl-label {
        font-size: 0.85rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .lvl-num {
        font-size: 3.5rem;
        font-weight: 800;
        line-height: 1;
        color: #fff;
        text-shadow: 0 0 20px rgba(123, 44, 191, 0.4);
    }

    .xp-track {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.1);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
    }

    .xp-fill {
        width: 72%;
        height: 100%;
        background: var(--accent-primary);
        box-shadow: 0 0 15px var(--accent-glow);
        position: relative;
    }
    
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .xp-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    /* Points Available (The CTA) */
    .sp-cta-container {
        margin-top: auto;
        display: flex;
        justify-content: center;
    }

    .sp-cta {
        width: 100%;
        padding: 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(123, 44, 191, 0.3);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .sp-cta::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, transparent, rgba(123, 44, 191, 0.1), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .sp-cta:hover {
        border-color: var(--accent-primary);
        box-shadow: 0 0 30px rgba(123, 44, 191, 0.2);
        transform: translateY(-2px);
    }

    .sp-cta:hover::before { opacity: 1; }

    .sp-info {
        display: flex;
        flex-direction: column;
    }

    .sp-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-muted);
    }

    .sp-value {
        font-size: 2rem;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 0 10px var(--accent-primary);
    }

    .sp-arrow {
        font-size: 1.5rem;
        color: var(--accent-primary);
    }

    /* --- Main Tree Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; /* Let clicks pass to canvas for panning, nodes have pointer-events: auto */
    }

    /* --- Unified Node Geometry (Chamfered Hexagon) --- */
    .node {
        position: absolute;
        width: 44px;
        height: 44px;
        /* Chamfered Hexagon via Clip Path */
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s;
        transform: translate(-50%, -50%);
        border: none; /* Border handled by pseudo-element for glow */
    }

    /* Inner fill to handle the clip-path border issue */
    .node::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: #0a0a12;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        z-index: 0;
        transition: background 0.3s;
    }

    .node svg {
        width: 50%;
        height: 50%;
        fill: var(--text-muted);
        z-index: 2;
        transition: fill 0.3s, transform 0.3s;
    }

    /* --- States --- */
    
    /* 1. Locked */
    .node.locked {
        opacity: 0.3;
    }
    .node.locked::after { background: #1a1a24; }
    .node.locked svg { fill: #444; }

    /* 2. Unlocked (Active) */
    .node.unlocked {
        opacity: 1;
    }
    .node.unlocked::after { 
        background: #2a2a35; 
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .node.unlocked svg { 
        fill: #fff; 
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    /* 3. Maxed (Ultimate/Complete) */
    .node.maxed {
        opacity: 1;
        box-shadow: 0 0 15px var(--accent-glow);
    }
    .node.maxed::after { background: #3d2a5e; }
    .node.maxed svg { 
        fill: #fff; 
        transform: scale(1.1);
    }

    /* 4. Available (Next Step) */
    .node.available {
        animation: pulse-avail 3s infinite ease-in-out;
    }
    .node.available::after {
        background: rgba(123, 44, 191, 0.1);
        border: 1px solid var(--accent-primary); /* Visual trick via inset */
    }
    .node.available svg { fill: var(--accent-primary); }

    @keyframes pulse-avail {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 0 8px var(--accent-primary)); }
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.2) !important;
    }
    .node:hover::after { background: #333; }

    /* Tooltip */
    .tooltip {
        position: absolute;
        bottom: 40px;
        left: 40px;
        width: 300px;
        background: rgba(15, 15, 20, 0.9);
        border: 1px solid var(--glass-border);
        border-left: 4px solid var(--accent-primary);
        padding: 20px;
        backdrop-filter: blur(15px);
        border-radius: 4px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 5px;
        font-size: 1.2rem;
        color: #fff;
        letter-spacing: 0.5px;
    }

    .tooltip .tier {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        letter-spacing: 1px;
        margin-bottom: 10px;
        display: block;
    }

    .tooltip p {
        margin: 0 0 15px;
        font-size: 0.9rem;
        color: #ccc;
        line-height: 1.5;
    }

    .tooltip .stat-box {
        background: rgba(255,255,255,0.05);
        padding: 8px 12px;
        border-radius: 4px;
        font-family: monospace;
        color: var(--accent-gold);
        font-size: 0.85rem;
        display: flex;
        justify-content: space-between;
    }

</style>
</head>
<body>

<div class="vignette"></div>

<!-- Sidebar -->
<aside>
    <div class="brand">System 4.0</div>

    <div class="char-profile">
        <h1 class="char-name">Kaelen</h1>
        <div class="char-class">Void Walker</div>
    </div>

    <div class="level-section">
        <div class="level-header">
            <span class="lvl-label">Current Level</span>
            <span class="lvl-num">42</span>
        </div>
        <div class="xp-track">
            <div class="xp-fill"></div>
        </div>
        <div class="xp-text">7,500 / 10,000 XP</div>
    </div>

    <div class="sp-cta-container">
        <div class="sp-cta" id="sp-btn">
            <div class="sp-info">
                <span class="sp-label">Available Points</span>
                <span class="sp-value" id="sp-count">3</span>
            </div>
            <div class="sp-arrow">→</div>
        </div>
    </div>
</aside>

<!-- Tree Viewport -->
<main id="viewport">
    <canvas id="tree-canvas"></canvas>
    <div class="node-layer" id="node-layer"></div>
    
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <span class="tier" id="tt-tier">Tier 1</span>
        <p id="tt-desc">Skill description goes here.</p>
        <div class="stat-box">
            <span>Effect</span>
            <span id="tt-stat">+10% Dmg</span>
        </div>
    </div>
</main>

<script>
    // --- Configuration & Data ---
    // Expanded to a dense 6-tier tree
    const skills = [
        // T0 Root
        { id: 'r1', name: 'Void Core', tier: 0, x: 50, y: 95, max: 1, lvl: 1, desc: 'The origin of your power.', stat: 'Base' },
        
        // T1
        { id: 't1_l', name: 'Shadow Step', tier: 1, x: 25, y: 80, max: 3, lvl: 1, desc: 'Move through shadows.', stat: '+5% Speed' },
        { id: 't1_r', name: 'Arcane Shell', tier: 1, x: 75, y: 80, max: 3, lvl: 1, desc: 'Mana barrier.', stat: '+10% Armor' },
        
        // T2
        { id: 't2_ll', name: 'Dash', tier: 2, x: 10, y: 65, max: 3, lvl: 0, desc: 'Quick burst of speed.', stat: 'Cooldown -1s' },
        { id: 't2_lm', name: 'Siphon', tier: 2, x: 30, y: 65, max: 3, lvl: 0, desc: 'Drain enemy health.', stat: '+2% Lifesteal' },
        { id: 't2_rm', name: 'Reflect', tier: 2, x: 70, y: 65, max: 3, lvl: 0, desc: 'Bounce damage back.', stat: '+5% Reflect' },
        { id: 't2_rr', name: 'Curse', tier: 2, x: 90, y: 65, max: 3, lvl: 0, desc: 'Weaken enemy armor.', stat: '-10% Enemy Def' },

        // T3
        { id: 't3_1', name: 'Blink', tier: 3, x: 5, y: 50, max: 3, lvl: 0, desc: 'Teleport short distance.', stat: 'Unlock: Blink' },
        { id: 't3_2', name: 'Leech', tier: 3, x: 20, y: 50, max: 3, lvl: 0, desc: 'Area heal on kill.', stat: '+5% Heal' },
        { id: 't3_3', name: 'Nova', tier: 3, x: 40, y: 50, max: 3, lvl: 0, desc: 'Explosive aura.', stat: '+20% AoE' },
        { id: 't3_4', name: 'Barrier', tier: 3, x: 60, y: 50, max: 3, lvl: 0, desc: 'Absorb burst dmg.', stat: '+50 Shield' },
        { id: 't3_5', name: 'Hex', tier: 3, x: 80, y: 50, max: 3, lvl: 0, desc: 'Slow enemies.', stat: '-15% Enemy SPD' },
        { id: 't3_6', name: 'Doom', tier: 3, x: 95, y: 50, max: 3, lvl: 0, desc: 'Mark for death.', stat: '+10% Crit' },

        // T4
        { id: 't4_1', name: 'Phase', tier: 4, x: 15, y: 35, max: 3, lvl: 0, desc: 'Invulnerability.', stat: '1s i-frames' },
        { id: 't4_2', name: 'Void Bomb', tier: 4, x: 35, y: 35, max: 3, lvl: 0, desc: 'High dmg projectile.', stat: '+50% Dmg' },
        { id: 't4_3', name: 'Pulse', tier: 4, x: 65, y: 35, max: 3, lvl: 0, desc: 'Rapid fire.', stat: '+20% ASPD' },
        { id: 't4_4', name: 'Plague', tier: 4, x: 85, y: 35, max: 3, lvl: 0, desc: 'DoT spread.', stat: 'DoT +50%' },

        // T5
        { id: 't5_1', name: 'Teleport', tier: 5, x: 25, y: 20, max: 1, lvl: 0, desc: 'Global recall.', stat: 'Ultimate' },
        { id: 't5_2', name: 'Singularity', tier: 5, x: 50, y: 20, max: 1, lvl: 0, desc: 'Black hole.', stat: 'Ultimate' },
        { id: 't5_3', name: 'Execute', tier: 5, x: 75, y: 20, max: 1, lvl: 0, desc: 'Kill <20% HP.', stat: 'Ultimate' },

        // T6 Apex
        { id: 'apex', name: 'Ascension', tier: 6, x: 50, y: 5, max: 1, lvl: 0, desc: 'Become god.', stat: 'ALL +100%' }
    ];

    // Connections: [ParentID, ChildID]
    const links = [
        ['r1', 't1_l'], ['r1', 't1_r'],
        ['t1_l', 't2_ll'], ['t1_l', 't2_lm'],
        ['t1_r', 't2_rm'], ['t1_r', 't2_rr'],
        ['t2_ll', 't3_1'], ['t2_ll', 't3_2'],
        ['t2_lm', 't3_2'], ['t2_lm', 't3_3'],
        ['t2_rm', 't3_3'], ['t2_rm', 't3_4'],
        ['t2_rr', 't3_4'], ['t2_rr', 't3_5'], ['t2_rr', 't3_6'],
        ['t3_1', 't4_1'], ['t3_2', 't4_1'], ['t3_2', 't4_2'],
        ['t3_3', 't4_2'], ['t3_3', 't4_3'],
        ['t3_4', 't4_3'], ['t3_5', 't4_3'], ['t3_5', 't4_4'],
        ['t3_6', 't4_4'],
        ['t4_1', 't5_1'], ['t4_2', 't5_1'], ['t4_2', 't5_2'],
        ['t4_3', 't5_2'], ['t4_3', 't5_3'], ['t4_4', 't5_3'],
        ['t5_1', 'apex'], ['t5_2', 'apex'], ['t5_3', 'apex']
    ];

    // --- State Management ---
    let points = 3;
    let scale = 1.4; // Start zoomed in per request
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX, dragStartY;

    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const nodeLayer = document.getElementById('node-layer');
    const spCount = document.getElementById('sp-count');
    
    // --- Init ---
    function init() {
        resize();
        createNodes();
        updateStates();
        render();
    }

    window.addEventListener('resize', () => {
        resize();
        render();
    });

    function resize() {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
    }

    // --- Node Creation ---
    function createNodes() {
        skills.forEach(s => {
            const el = document.createElement('div');
            el.className = 'node';
            el.id = `node-${s.id}`;
            el.style.left = `${s.x}%`;
            el.style.top = `${s.y}%`;
            
            // Simple Icon Logic
            let path = '';
            if(s.tier === 6) path = '<path d="M12 2L2 22h20L12 2zm0 3.5L18.5 20h-13L12 5.5z"/>'; // Diamond
            else if(s.tier === 5) path = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>'; // Shield
            else if(s.tier % 2 === 0) path = '<circle cx="12" cy="12" r="8"/>'; // Circle
            else path = '<path d="M12 2l-5.5 9h11z"/>'; // Triangle
            
            el.innerHTML = `<svg viewBox="0 0 24 24">${path}</svg>`;
            
            // Events
            el.onmouseenter = (e) => showTooltip(e, s);
            el.onmouseleave = hideTooltip;
            el.onclick = () => upgrade(s);

            nodeLayer.appendChild(el);
        });
    }

    // --- Logic ---
    function updateStates() {
        skills.forEach(s => {
            const el = document.getElementById(`node-${s.id}`);
            const parentIds = links.filter(l => l[1] === s.id).map(l => l[0]);
            const parentsUnlocked = parentIds.length === 0 || parentIds.some(pid => skills.find(sk => sk.id === pid).lvl > 0);
            
            // Reset classes
            el.className = 'node';
            
            if (s.lvl > 0) {
                el.classList.add(s.lvl >= s.max ? 'maxed' : 'unlocked');
            } else if (parentsUnlocked && points > 0) {
                el.classList.add('available');
            } else {
                el.classList.add('locked');
            }
        });
        render(); // Redraw lines
    }

    function upgrade(skill) {
        if (points <= 0) return;
        if (skill.lvl >= skill.max) return;
        
        // Check parents
        const parentIds = links.filter(l => l[1] === skill.id).map(l => l[0]);
        const parentsUnlocked = parentIds.length === 0 || parentIds.some(pid => skills.find(sk => sk.id === pid).lvl > 0);
        
        if (parentsUnlocked) {
            skill.lvl++;
            points--;
            spCount.innerText = points;
            updateStates();
        }
    }

    // --- Rendering (Canvas Lines) ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        // Center the pan
        ctx.translate(canvas.width/2 + panX, canvas.height/2 + panY);
        ctx.scale(scale, scale);
        // Offset back so 0,0 is top left of the coordinate space (roughly)
        // Actually, simpler: Center the coordinate system at 50,50 of the percent grid
        // We need to map percent (0-100) to pixels. 
        // Let's assume a virtual grid of 1000x1000 for calculation stability
        ctx.translate(-500, -500); 

        links.forEach(([pid, cid]) => {
            const p = skills.find(s => s.id === pid);
            const c = skills.find(s => s.id === cid);
            
            const pActive = p.lvl > 0;
            const cActive = c.lvl > 0;
            const isPath = pActive; // Path is lit if parent is active

            const x1 = p.x * 10; // Scale 0-100 to 0-1000
            const y1 = (100 - p.y) * 10; // Flip Y because canvas 0 is top
            const x2 = c.x * 10;
            const y2 = (100 - c.y) * 10;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            
            // 45 Degree Logic (Manhattan-ish)
            // Midpoint Y
            const midY = y1 + (y2 - y1) / 2;
            ctx.lineTo(x1, midY);
            ctx.lineTo(x2, midY);
            ctx.lineTo(x2, y2);

            if (pActive && cActive) {
                ctx.strokeStyle = '#d0a4ff';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#7b2cbf';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            } else if (pActive) {
                // Potential path
                ctx.strokeStyle = 'rgba(208, 164, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
                ctx.setLineDash([5, 5]);
                ctx.lineCap = 'round';
            } else {
                // Locked path
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
            }
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Interaction ---
    const viewport = document.getElementById('viewport');
    
    viewport.addEventListener('mousedown', e => {
        if(e.target === canvas || e.target === viewport) {
            isDragging = true;
            dragStartX = e.clientX - panX;
            dragStartY = e.clientY - panY;
        }
    });
    
    window.addEventListener('mouseup', () => isDragging = false);
    
    window.addEventListener('mousemove', e => {
        if (isDragging) {
            panX = e.clientX - dragStartX;
            panY = e.clientY - dragStartY;
            render();
        }
    });

    // Tooltip Logic
    const tooltip = document.getElementById('tooltip');
    
    function showTooltip(e, skill) {
        document.getElementById('tt-title').innerText = skill.name;
        document.getElementById('tt-tier').innerText = `Tier ${skill.tier}`;
        document.getElementById('tt-desc').innerText = skill.desc;
        document.getElementById('tt-stat').innerText = skill.stat;
        tooltip.classList.add('visible');
    }
    
    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    init();

</script>
</body>
</html>
