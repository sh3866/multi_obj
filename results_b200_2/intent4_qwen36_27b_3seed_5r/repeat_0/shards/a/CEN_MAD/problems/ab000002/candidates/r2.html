<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Ascension — Skill Matrix</title>
<style>
    :root {
        --bg-void: #050508;
        --bg-void-radial: radial-gradient(ellipse at 50% 30%, #161824 0%, #050508 85%);
        --accent-void: #b026ff;
        --accent-void-dim: #4a0d85;
        --accent-gold: #ffd700;
        --text-main: #f0f0f5;
        --text-muted: #8b9bb4;
        
        --font-header: "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
        --font-ui: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        
        --node-size: 48px;
        --node-ultra: 72px;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background: var(--bg-void);
        background-image: var(--bg-void-radial);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.07;
        pointer-events: none;
        z-index: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Main Layout (No Header) --- */
    .dashboard {
        display: flex;
        flex: 1;
        position: relative;
        z-index: 1;
        height: 100%;
    }

    /* --- Sidebar --- */
    aside {
        width: 320px;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        position: relative;
        z-index: 5;
        background: linear-gradient(90deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.6) 80%, transparent 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.03);
    }

    .brand-title {
        font-family: var(--font-header);
        font-size: 1.8rem;
        letter-spacing: 2px;
        color: var(--text-main);
        text-transform: uppercase;
        opacity: 0.9;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 15px;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(176, 38, 255, 0.3);
    }

    .character-card {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .char-info {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .avatar-frame {
        width: 70px;
        height: 70px;
        border-radius: 4px;
        border: 1px solid rgba(176, 38, 255, 0.3);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b10;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        transform: rotate(45deg);
    }
    
    .avatar-frame svg {
        transform: rotate(-45deg);
        width: 80%;
        height: 80%;
        fill: #2a3245;
    }

    .char-details h2 {
        font-family: var(--font-header);
        font-size: 1.6rem;
        margin: 0;
        color: #fff;
        font-weight: 400;
        letter-spacing: 1px;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-void);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        margin-top: 4px;
    }

    /* Level & XP Block */
    .level-block {
        margin-top: 10px;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
    }

    .level-number {
        font-family: var(--font-header);
        font-size: 3rem;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
    }

    .level-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .xp-container {
        width: 100%;
    }
    
    .xp-bar-bg {
        height: 6px;
        background: rgba(255,255,255,0.08);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
    }
    
    .xp-bar-fill {
        height: 100%;
        width: 75%;
        background: var(--accent-void);
        box-shadow: 0 0 10px var(--accent-void);
        position: relative;
    }
    
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: 2px;
        background: #fff;
        box-shadow: 0 0 10px #fff;
    }

    .xp-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 6px;
        text-align: right;
    }

    /* Skill Points Badge */
    .sp-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(176, 38, 255, 0.1);
        border: 1px solid rgba(176, 38, 255, 0.2);
        border-radius: 4px;
        margin-top: 15px;
    }

    .sp-count {
        font-family: var(--font-header);
        font-size: 1.2rem;
        color: var(--accent-void);
        font-weight: bold;
    }

    .sp-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* --- Center (Tree) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 50%, rgba(176, 38, 255, 0.03) 0%, transparent 60%);
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .node-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
    }

    /* --- The Architectural Node --- */
    .node {
        position: absolute;
        width: var(--node-size);
        height: var(--node-size);
        /* Octagon Shape */
        clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        background: #0f111a;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        transform: translate(-50%, -50%);
    }
    
    /* Inner Bevel */
    .node::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(0,0,0,0.5) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .node svg {
        width: 60%;
        height: 60%;
        fill: var(--text-muted);
        transition: fill 0.3s, transform 0.3s, filter 0.3s;
        z-index: 2;
        position: relative;
    }

    /* Node States */
    .node.locked {
        opacity: 0.4;
        background: #08090c;
    }
    
    .node.unlocked {
        background: #1a1d2b;
        box-shadow: 0 0 0 1px rgba(176, 38, 255, 0.3);
        filter: drop-shadow(0 0 5px rgba(176, 38, 255, 0.2));
    }
    .node.unlocked svg { 
        fill: var(--accent-void); 
        filter: drop-shadow(0 0 5px var(--accent-void));
    }

    .node.maxed {
        background: #1a1d2b;
        box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
    }
    .node.maxed svg { 
        fill: #fff; 
        filter: drop-shadow(0 0 8px var(--accent-void));
        transform: scale(1.1);
    }

    /* Ultimate Node Styling */
    .node.ultimate {
        width: var(--node-ultra);
        height: var(--node-ultra);
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        border: none;
        z-index: 3;
    }
    .node.ultimate.unlocked {
        animation: pulse-ultra 4s infinite ease-in-out;
    }

    @keyframes pulse-ultra {
        0% { filter: drop-shadow(0 0 5px rgba(176, 38, 255, 0.2)); }
        50% { filter: drop-shadow(0 0 20px rgba(176, 38, 255, 0.6)); }
        100% { filter: drop-shadow(0 0 5px rgba(176, 38, 255, 0.2)); }
    }

    /* Focus / Upgradeable Node */
    .node.upgradeable {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.1);
        background: rgba(176, 38, 255, 0.15);
        box-shadow: 0 0 0 2px var(--accent-void);
        animation: pulse-node 2s infinite ease-in-out;
    }
    .node.upgradeable svg { fill: #fff; }

    @keyframes pulse-node {
        0% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 0 2px var(--accent-void); }
        50% { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 15px var(--accent-void); }
        100% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 0 2px var(--accent-void); }
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 20;
        background: rgba(176, 38, 255, 0.2);
    }
    .node.upgradeable:hover {
        transform: translate(-50%, -50%) scale(1.2);
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(15, 16, 25, 0.95);
        border: 1px solid rgba(176, 38, 255, 0.3);
        padding: 20px;
        width: 260px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(12px);
        border-left: 3px solid var(--accent-void);
    }

    .tooltip.visible { opacity: 1; }
    
    .tooltip h3 {
        margin: 0 0 8px;
        font-family: var(--font-header);
        color: var(--text-main);
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 15px;
        font-style: italic;
    }

    .tooltip .stats {
        font-family: var(--font-ui);
        font-size: 0.8rem;
        color: var(--accent-void);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: rgba(176, 38, 255, 0.1);
        padding: 8px 12px;
        border-radius: 2px;
        display: block;
        border: 1px solid rgba(176, 38, 255, 0.1);
    }

</style>
</head>
<body>

<div class="noise-overlay"></div>

<div class="dashboard">
    <aside>
        <div class="brand-title">Arcanum</div>

        <div class="character-card">
            <div class="char-info">
                <div class="avatar-frame">
                    <!-- Stylized Rune Avatar -->
                    <svg viewBox="0 0 100 100">
                        <path d="M50 20 L65 40 L90 40 L70 60 L75 85 L50 70 L25 85 L30 60 L10 40 L35 40 Z" fill="#2a3245" />
                        <circle cx="50" cy="50" r="10" fill="var(--accent-void)" opacity="0.8"/>
                    </svg>
                </div>
                <div class="char-details">
                    <h2 class="char-name">Kaelen</h2>
                    <div class="char-class">Void Walker</div>
                </div>
            </div>

            <div class="level-block">
                <div class="level-header">
                    <span class="level-label">Level</span>
                    <span class="level-number">42</span>
                </div>
                <div class="xp-container">
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                    <div class="xp-text">7,500 / 10,000 XP</div>
                </div>
            </div>

            <div class="sp-badge">
                <div class="sp-count" id="sp-display">3</div>
                <div class="sp-label">Points Available</div>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-container" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats" id="tt-stats">+10% Damage</div>
        </div>
    </main>
</div>

<script>
    /**
     * Data Structure for the Skill Tree
     * Expanded to 22 nodes with a structured grid layout
     */
    const skillData = [
        // Root (Bottom Center)
        { id: 'root', name: 'Void Core', x: 50, y: 90, level: 1, max: 1, cost: 0, type: 'ultimate', desc: 'The source of all void energy.', stat: 'Base Attribute' },
        
        // Tier 1 (Branching Up)
        { id: 't1_warp', name: 'Spatial Shift', x: 35, y: 70, level: 1, max: 3, cost: 1, desc: 'Distort space to move faster.', stat: '+5% Move Speed' },
        { id: 't1_rune', name: 'Runic Ward', x: 65, y: 70, level: 1, max: 3, cost: 1, desc: 'Etch protective runes.', stat: '+10% Armor' },
        
        // Tier 2 (Outer Branches)
        { id: 't2_phase', name: 'Phase Walk', x: 20, y: 50, level: 0, max: 3, cost: 1, desc: 'Walk through enemies.', stat: '+2% Intangibility' },
        { id: 't2_void', name: 'Void Siphon', x: 35, y: 50, level: 1, max: 3, cost: 1, desc: 'Drain life from the void.', stat: '+1% Lifesteal' },
        { id: 't2_shield', name: 'Astral Shell', x: 65, y: 50, level: 0, max: 3, cost: 1, desc: 'Absorb damage with mana.', stat: '+5% Max Mana' },
        { id: 't2_hex', name: 'Dark Hex', x: 80, y: 50, level: 0, max: 3, cost: 1, desc: 'Weaken enemy defenses.', stat: '-5% Enemy Armor' },
        
        // Tier 3 (Mid-Game Specialization)
        { id: 't3_tele', name: 'Short Blink', x: 10, y: 30, level: 0, max: 3, cost: 2, desc: 'Short range teleport.', stat: 'Unlock Skill' },
        { id: 't3_drain', name: 'Life Drain', x: 25, y: 30, level: 0, max: 3, cost: 2, desc: 'Convert damage to health.', stat: '+5% Lifesteal' },
        { id: 't3_bomb', name: 'Void Bomb', x: 50, y: 30, level: 0, max: 3, cost: 2, desc: 'Detonate void energy.', stat: '+15% AoE Dmg' },
        { id: 't3_curse', name: 'Soul Curse', x: 75, y: 30, level: 0, max: 3, cost: 2, desc: 'DoT on enemies.', stat: '+10% Dmg over Time' },
        { id: 't3_ritual', name: 'Blood Ritual', x: 90, y: 30, level: 0, max: 3, cost: 2, desc: 'Heal self, hurt nearby.', stat: '+20% Heal Potency' },
        
        // Tier 4 (High Tier)
        { id: 't4_gate', name: 'Dimension Gate', x: 20, y: 15, level: 0, max: 1, cost: 3, desc: 'Teleport anywhere visible.', stat: 'Ultimate Ability' },
        { id: 't4_nova', name: 'Void Nova', x: 40, y: 15, level: 0, max: 1, cost: 3, desc: 'Massive explosion.', stat: 'Ultimate Ability' },
        { id: 't4_death', name: 'Death Touch', x: 60, y: 15, level: 0, max: 1, cost: 3, desc: 'Execute low HP enemies.', stat: 'Ultimate Ability' },
        { id: 't4_plague', name: 'Necro Plague', x: 80, y: 15, level: 0, max: 1, cost: 3, desc: 'Infects whole area.', stat: 'Ultimate Ability' },

        // Apex (The Endgame)
        { id: 'apex', name: 'Singularity', x: 50, y: 2, level: 0, max: 1, cost: 5, type: 'ultimate', desc: 'Become the void itself.', stat: 'ALL STATS +10%' }
    ];

    // Connections (Parent ID -> Child ID) - Grid Aligned
    const connections = [
        ['root', 't1_warp'], ['root', 't1_rune'],
        ['t1_warp', 't2_phase'], ['t1_warp', 't2_void'],
        ['t1_rune', 't2_shield'], ['t1_rune', 't2_hex'],
        ['t2_phase', 't3_tele'], ['t2_phase', 't3_drain'],
        ['t2_void', 't3_drain'], ['t2_void', 't3_bomb'],
        ['t2_shield', 't3_bomb'], ['t2_shield', 't3_curse'],
        ['t2_hex', 't3_curse'], ['t2_hex', 't3_ritual'],
        ['t3_tele', 't4_gate'], ['t3_drain', 't4_gate'], ['t3_drain', 't4_nova'],
        ['t3_bomb', 't4_nova'], ['t3_bomb', 't4_death'],
        ['t3_curse', 't4_death'], ['t3_curse', 't4_plague'], ['t3_ritual', 't4_plague'],
        ['t4_gate', 'apex'], ['t4_nova', 'apex'], ['t4_death', 'apex'], ['t4_plague', 'apex']
    ];

    // State
    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            
            // Determine class based on state
            let stateClass = 'locked';
            if (skill.level > 0) {
                stateClass = (skill.level === skill.max) ? 'maxed' : 'unlocked';
            }
            if (skill.type === 'ultimate') stateClass += ' ultimate';

            el.className = `node ${stateClass}`;
            el.id = `node-${skill.id}`;
            
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            // Icon SVGs
            let iconPath = '';
            if(skill.type === 'ultimate') {
                iconPath = '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>'; 
            } else if (skill.id.includes('warp') || skill.id.includes('tele') || skill.id.includes('gate')) {
                iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>';
            } else if (skill.id.includes('rune') || skill.id.includes('shield') || skill.id.includes('curse')) {
                iconPath = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>';
            } else if (skill.id.includes('void') || skill.id.includes('drain') || skill.id.includes('death') || skill.id.includes('nova') || skill.id.includes('bomb')) {
                iconPath = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5.5-2.5l7.51-3.49L17.5 6.5 9.99 9.99 6.5 17.5zm5.5-6.6c.61 0 1.1.49 1.1 1.1s-.49 1.1-1.1 1.1-1.1-.49-1.1-1.1.49-1.1 1.1-1.1z"/>';
            } else {
                iconPath = '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"/>';
            }

            el.innerHTML = `<svg viewBox="0 0 24 24">${iconPath}</svg>`;
            
            // Events
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
        updateNodeStates();
    }

    // --- Rendering Connections (45 Degree Angles) ---

    function getCoordinates(id) {
        const skill = skillData.find(s => s.id === id);
        return {
            x: (skill.x / 100) * canvas.width,
            y: (skill.y / 100) * canvas.height
        };
    }

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = getCoordinates(parentId);
            const end = getCoordinates(childId);

            // Check State
            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Draw Architectural Line (45 degrees)
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            // Midpoint logic for 45 deg turn
            // If X is same, go straight. If Y is same, go straight. 
            // If both different, go X first, then Y (or vice versa) to create the elbow.
            // For vertical trees, usually Y then X or X then Y. 
            // Let's do Half Y, then X, then Half Y for a smoother step.
            const midY = start.y + (end.y - start.y) / 2;
            
            ctx.lineTo(start.x, midY);
            ctx.lineTo(end.x, midY);
            ctx.lineTo(end.x, end.y);

            if (isUnlocked) {
                // Active Energy Conduit
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(176, 38, 255, 0.6)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(176, 38, 255, 0.5)';
                ctx.setLineDash([]);
                ctx.lineJoin = 'round';
            } else if (isPath) {
                // Locked Path (Dashed)
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(176, 38, 255, 0.2)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([4, 8]);
                ctx.lineJoin = 'round';
            } else {
                // Inactive Path
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
                ctx.lineJoin = 'round';
            }
            
            ctx.stroke();
        });

        ctx.restore();
    }

    // --- Logic ---

    function updateNodeStates() {
        skillData.forEach(skill => {
            const el = document.getElementById(`node-${skill.id}`);
            // Reset classes
            el.className = 'node';
            if (skill.type === 'ultimate') el.classList.add('ultimate');
            
            if (skill.level > 0) {
                el.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
            } else {
                // Check if upgradeable (has points, parent unlocked)
                const parentUnlocked = connections.some(([p, c]) => c === skill.id && skillData.find(s => s.id === p).level > 0);
                if (parentUnlocked && availablePoints > 0) {
                    el.classList.add('upgradeable');
                } else {
                    el.classList.add('locked');
                }
            }
        });
        drawConnections();
    }

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        // Check parent
        const parentUnlocked = connections.some(([p, c]) => c === skill.id && skillData.find(s => s.id === p).level > 0);
        if (!parentUnlocked) return;

        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        updateNodeStates();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        
        let statsText = skill.stat;
        if (skill.level < skill.max) {
            statsText += ` (Lvl ${skill.level}/${skill.max})`;
        } else {
            statsText += ` (MAXED)`;
        }
        document.getElementById('tt-stats').textContent = statsText;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan/Zoom) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
