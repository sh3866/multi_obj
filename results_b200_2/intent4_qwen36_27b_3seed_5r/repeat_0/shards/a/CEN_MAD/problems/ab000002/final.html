<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension — Void Matrix</title>
<style>
    :root {
        --bg-deep: #050508;
        --accent-primary: #b084f0;
        --accent-secondary: #7000ff;
        --accent-glow: rgba(176, 132, 240, 0.6);
        --accent-gold: #f0e68c;
        --text-main: #ffffff;
        --text-muted: #8888a0;
        --text-dim: #444455;
        --glass-bg: rgba(15, 15, 20, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* --- 5. Inject 'Void' Atmosphere --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
        /* Deep nebulous radial gradient */
        background: 
            radial-gradient(circle at 50% 30%, rgba(40, 20, 60, 0.3) 0%, rgba(10, 10, 15, 0.95) 60%, #000 100%);
    }
    
    .bg-atmosphere::after {
        content: '';
        position: absolute;
        inset: 0;
        /* Noise texture */
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
        opacity: 0.6;
        mix-blend-mode: overlay;
    }

    /* --- 2. Consolidate Sidebar & Fix Alignment --- */
    aside {
        width: 380px;
        height: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        z-index: 10;
        background: linear-gradient(135deg, rgba(15, 15, 20, 0.85) 0%, rgba(5, 5, 8, 0.7) 100%);
        border-right: 1px solid var(--glass-border);
        box-shadow: 10px 0 40px rgba(0,0,0,0.5);
        backdrop-filter: blur(12px);
        position: relative;
    }

    /* Decorative Sidebar Line */
    aside::before {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 1px;
        background: linear-gradient(to bottom, transparent, var(--accent-primary), transparent);
        opacity: 0.4;
    }

    .brand {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent-primary);
        opacity: 0.8;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .brand::before {
        content: '';
        display: block;
        width: 20px;
        height: 2px;
        background: var(--accent-primary);
        box-shadow: 0 0 5px var(--accent-primary);
    }

    .char-profile {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
    }

    /* 1. Establish Visual Hierarchy: Reduce Scale & Opacity */
    .char-name {
        font-family: var(--font-ui);
        font-size: 2.2rem; /* Reduced from 3rem */
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.5px;
        color: #fff;
        opacity: 0.8; /* Reduced opacity */
        margin: 0;
    }

    .char-class {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent-primary);
        font-weight: 600;
        opacity: 0.9;
        position: relative;
        display: inline-block;
        width: fit-content;
    }

    /* 5. Inject 'Void' Atmosphere: Glitch Effect */
    .char-class::before, .char-class::after {
        content: attr(data-text);
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.6;
        pointer-events: none;
    }
    .char-class::before {
        color: #ff00ff;
        z-index: -1;
        transform: translate(-2px, 0);
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        animation: glitch-anim 3s infinite linear alternate-reverse;
    }
    .char-class::after {
        color: #00ffff;
        z-index: -1;
        transform: translate(2px, 0);
        clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
        animation: glitch-anim2 2.5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 1px); }
        40% { transform: translate(-2px, -1px); }
        60% { transform: translate(2px, 1px); }
        80% { transform: translate(2px, -1px); }
        100% { transform: translate(0); }
    }
    @keyframes glitch-anim2 {
        0% { transform: translate(0); }
        20% { transform: translate(2px, -1px); }
        40% { transform: translate(2px, 1px); }
        60% { transform: translate(-2px, -1px); }
        80% { transform: translate(-2px, 1px); }
        100% { transform: translate(0); }
    }

    /* 2. Consolidated Character Status Container */
    .status-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 16px; /* Unified radius */
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        position: relative;
        overflow: hidden;
    }
    
    /* Subtle inner gradient for the card */
    .status-container::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    .status-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .status-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .status-value {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-main);
        font-variant-numeric: tabular-nums;
    }

    .level-value {
        font-size: 1.6rem;
        background: linear-gradient(to bottom right, #fff, #ccc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* 3. Refine Component Construction: XP Bar */
    .xp-track-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .xp-track {
        width: 100%;
        height: 8px;
        background: rgba(0,0,0,0.4); /* Visible low-opacity background */
        border-radius: 100px; /* Pill shape */
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .xp-fill {
        width: 75%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        border-radius: 100px;
        position: relative;
        /* Subtle glow to leading edge */
        box-shadow: 0 0 12px var(--accent-glow), inset 0 0 2px rgba(255,255,255,0.5);
    }
    
    /* Shimmer animation on the bar */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    .xp-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right; /* Right align */
        font-variant-numeric: tabular-nums;
        font-weight: 500;
    }

    /* Skill Points Section inside Container */
    .points-row {
        margin-top: 8px;
        padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .points-val {
        font-size: 2rem;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 0 15px var(--accent-glow);
        line-height: 1;
    }
    
    .points-icon {
        width: 36px;
        height: 36px;
        background: rgba(176, 132, 240, 0.1);
        border: 1px solid rgba(176, 132, 240, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-primary);
        font-size: 1.2rem;
        box-shadow: 0 0 15px rgba(176, 132, 240, 0.1);
    }

    /* --- Main Tree Area --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        z-index: 5;
    }

    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    /* --- Node Design --- */
    .node {
        position: absolute;
        width: 56px; /* Slightly larger for better icons */
        height: 56px;
        /* Hexagon Geometry */
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
        transform: translate(-50%, -50%);
    }

    /* Inner container for border/background handling */
    .node-inner {
        width: 90%;
        height: 90%;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s, box-shadow 0.3s;
        position: relative;
    }

    .node svg {
        width: 26px;
        height: 26px;
        fill: var(--text-dim);
        z-index: 2;
        transition: fill 0.3s, transform 0.3s, filter 0.3s;
    }

    /* --- 4. Differentiate States Aggressively --- */

    /* 1. Locked: Shattered/Low-Opacity Grey Echoes */
    .node.locked {
        opacity: 0.3;
        filter: grayscale(100%);
    }
    .node.locked .node-inner { 
        background: #1a1a1a;
        /* Dashed border effect via mask or just subtle color */
        border: 1px dashed rgba(255,255,255,0.1); 
    }
    .node.locked svg { 
        fill: #333; 
        opacity: 0.5;
    }

    /* 2. Available: Pulsing Border */
    .node.available {
        animation: pulse-avail 3s infinite ease-in-out;
    }
    .node.available .node-inner {
        background: #151520;
        box-shadow: inset 0 0 0 2px var(--accent-primary);
    }
    .node.available svg { 
        fill: var(--accent-primary); 
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    @keyframes pulse-avail {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* 3. Unlocked (Active): High-Energy Purple Glow */
    .node.unlocked {
        opacity: 1;
    }
    .node.unlocked .node-inner { 
        background: #22222e;
        border: 1px solid var(--accent-primary);
    }
    .node.unlocked svg { 
        fill: #fff; 
        filter: drop-shadow(0 0 3px rgba(255,255,255,0.8));
    }

    /* 4. Maxed: Ultimate Pop */
    .node.maxed {
        opacity: 1;
    }
    .node.maxed .node-inner { 
        background: var(--accent-secondary);
        box-shadow: 0 0 25px var(--accent-glow), inset 0 0 0 1px rgba(255,255,255,0.3);
    }
    .node.maxed svg { 
        fill: #fff; 
        transform: scale(1.1);
        filter: drop-shadow(0 0 8px #fff);
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.25) !important;
    }
    .node:hover .node-inner {
        background: #2a2a35;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        bottom: 40px;
        left: 40px;
        width: 320px;
        background: rgba(15, 15, 20, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 3px solid var(--accent-primary);
        padding: 24px;
        backdrop-filter: blur(15px);
        border-radius: 8px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 5px;
        font-size: 1.4rem;
        color: #fff;
        letter-spacing: 0.5px;
    }

    .tooltip .tier {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        display: block;
        font-weight: 600;
    }

    .tooltip p {
        margin: 0 0 15px;
        font-size: 0.95rem;
        color: #ccc;
        line-height: 1.6;
        font-weight: 300;
    }

    .tooltip .stat-box {
        background: rgba(255,255,255,0.05);
        padding: 10px 14px;
        border-radius: 6px;
        font-family: monospace;
        color: var(--accent-gold);
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .upgrade-btn {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        background: rgba(176, 132, 240, 0.1);
        border: 1px solid var(--accent-primary);
        color: var(--accent-primary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 4px;
        font-size: 0.8rem;
    }
    
    .upgrade-btn:hover {
        background: var(--accent-primary);
        color: #000;
        box-shadow: 0 0 15px var(--accent-primary);
    }
    
    .upgrade-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        border-color: var(--text-muted);
        color: var(--text-muted);
        background: transparent;
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>

<!-- Sidebar -->
<aside>
    <div class="brand">Ascension Matrix</div>

    <div class="char-profile">
        <h1 class="char-name">Kaelen</h1>
        <!-- 5. Glitch Effect Attribute -->
        <div class="char-class" data-text="Void Walker">Void Walker</div>
    </div>

    <!-- 2. Consolidated Container -->
    <div class="status-container">
        
        <!-- Level Section -->
        <div class="status-row">
            <span class="status-label">Current Level</span>
            <span class="status-value level-value">42</span>
        </div>

        <!-- 3. Refined XP Bar -->
        <div class="xp-track-container">
            <div class="xp-track">
                <div class="xp-fill"></div>
            </div>
            <div class="xp-text">7,500 / 10,000 XP</div>
        </div>

        <!-- 2. Merged Skill Points -->
        <div class="points-row">
            <div class="status-label">Skill Points</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="points-val" id="sp-count">3</span>
                <div class="points-icon">✦</div>
            </div>
        </div>
    </div>
</aside>

<!-- Tree Viewport -->
<main id="viewport">
    <canvas id="tree-canvas"></canvas>
    <div class="node-layer" id="node-layer"></div>
    
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <span class="tier" id="tt-tier">Tier 1</span>
        <p id="tt-desc">Skill description goes here.</p>
        <div class="stat-box">
            <span>Effect</span>
            <span id="tt-stat">+10% Dmg</span>
        </div>
        <button class="upgrade-btn" id="tt-btn">Upgrade</button>
    </div>
</main>

<script>
    // --- Configuration & Data ---
    const skills = [
        // T0 Root
        { id: 'r1', name: 'Void Core', tier: 0, x: 50, y: 95, max: 1, lvl: 1, desc: 'The origin of your power. Increases base stats.', stat: 'All Stats +5%' },
        
        // T1
        { id: 't1_l', name: 'Shadow Step', tier: 1, x: 25, y: 80, max: 3, lvl: 1, desc: 'Move through shadows instantly.', stat: 'Cooldown -0.5s' },
        { id: 't1_r', name: 'Arcane Shell', tier: 1, x: 75, y: 80, max: 3, lvl: 1, desc: 'Create a mana barrier.', stat: 'Armor +15' },
        
        // T2
        { id: 't2_ll', name: 'Dash', tier: 2, x: 10, y: 65, max: 3, lvl: 0, desc: 'Quick burst of speed.', stat: 'Speed +10%' },
        { id: 't2_lm', name: 'Siphon', tier: 2, x: 30, y: 65, max: 3, lvl: 0, desc: 'Drain enemy health.', stat: 'Lifesteal +2%' },
        { id: 't2_rm', name: 'Reflect', tier: 2, x: 70, y: 65, max: 3, lvl: 0, desc: 'Bounce damage back.', stat: 'Reflect +5%' },
        { id: 't2_rr', name: 'Curse', tier: 2, x: 90, y: 65, max: 3, lvl: 0, desc: 'Weaken enemy armor.', stat: 'Enemy Def -10%' },

        // T3
        { id: 't3_1', name: 'Blink', tier: 3, x: 5, y: 50, max: 3, lvl: 0, desc: 'Teleport short distance.', stat: 'Range +2m' },
        { id: 't3_2', name: 'Leech', tier: 3, x: 20, y: 50, max: 3, lvl: 0, desc: 'Area heal on kill.', stat: 'Heal +5%' },
        { id: 't3_3', name: 'Nova', tier: 3, x: 40, y: 50, max: 3, lvl: 0, desc: 'Explosive aura.', stat: 'AoE Dmg +20%' },
        { id: 't3_4', name: 'Barrier', tier: 3, x: 60, y: 50, max: 3, lvl: 0, desc: 'Absorb burst dmg.', stat: 'Shield +50' },
        { id: 't3_5', name: 'Hex', tier: 3, x: 80, y: 50, max: 3, lvl: 0, desc: 'Slow enemies.', stat: 'Slow 15%' },
        { id: 't3_6', name: 'Doom', tier: 3, x: 95, y: 50, max: 3, lvl: 0, desc: 'Mark for death.', stat: 'Crit +10%' },

        // T4
        { id: 't4_1', name: 'Phase', tier: 4, x: 15, y: 35, max: 3, lvl: 0, desc: 'Invulnerability frames.', stat: '1s i-frames' },
        { id: 't4_2', name: 'Void Bomb', tier: 4, x: 35, y: 35, max: 3, lvl: 0, desc: 'High dmg projectile.', stat: 'Dmg +50%' },
        { id: 't4_3', name: 'Pulse', tier: 4, x: 65, y: 35, max: 3, lvl: 0, desc: 'Rapid fire aura.', stat: 'ASPD +20%' },
        { id: 't4_4', name: 'Plague', tier: 4, x: 85, y: 35, max: 3, lvl: 0, desc: 'DoT spread.', stat: 'DoT +50%' },

        // T5
        { id: 't5_1', name: 'Teleport', tier: 5, x: 25, y: 20, max: 1, lvl: 0, desc: 'Global recall ability.', stat: 'Ultimate' },
        { id: 't5_2', name: 'Singularity', tier: 5, x: 50, y: 20, max: 1, lvl: 0, desc: 'Create a black hole.', stat: 'Ultimate' },
        { id: 't5_3', name: 'Execute', tier: 5, x: 75, y: 20, max: 1, lvl: 0, desc: 'Kill enemies below 20% HP.', stat: 'Ultimate' },

        // T6 Apex
        { id: 'apex', name: 'Ascension', tier: 6, x: 50, y: 5, max: 1, lvl: 0, desc: 'Transcend mortality.', stat: 'ALL +100%' }
    ];

    // Connections: [ParentID, ChildID]
    const links = [
        ['r1', 't1_l'], ['r1', 't1_r'],
        ['t1_l', 't2_ll'], ['t1_l', 't2_lm'],
        ['t1_r', 't2_rm'], ['t1_r', 't2_rr'],
        ['t2_ll', 't3_1'], ['t2_ll', 't3_2'],
        ['t2_lm', 't3_2'], ['t2_lm', 't3_3'],
        ['t2_rm', 't3_3'], ['t2_rm', 't3_4'],
        ['t2_rr', 't3_4'], ['t2_rr', 't3_5'], ['t2_rr', 't3_6'],
        ['t3_1', 't4_1'], ['t3_2', 't4_1'], ['t3_2', 't4_2'],
        ['t3_3', 't4_2'], ['t3_3', 't4_3'],
        ['t3_4', 't4_3'], ['t3_5', 't4_3'], ['t3_5', 't4_4'],
        ['t3_6', 't4_4'],
        ['t4_1', 't5_1'], ['t4_2', 't5_1'], ['t4_2', 't5_2'],
        ['t4_3', 't5_2'], ['t4_3', 't5_3'], ['t4_4', 't5_3'],
        ['t5_1', 'apex'], ['t5_2', 'apex'], ['t5_3', 'apex']
    ];

    // --- State Management ---
    let points = 3;
    let scale = 1.3; 
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX, dragStartY;
    let hoveredSkill = null;

    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const nodeLayer = document.getElementById('node-layer');
    const spCount = document.getElementById('sp-count');
    const ttBtn = document.getElementById('tt-btn');
    
    // --- Init ---
    function init() {
        resize();
        createNodes();
        updateStates();
        render();
    }

    window.addEventListener('resize', () => {
        resize();
        render();
    });

    function resize() {
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
    }

    // --- Node Creation (4. Populate with Distinct Icons) ---
    function createNodes() {
        skills.forEach(s => {
            const el = document.createElement('div');
            el.className = 'node';
            el.id = `node-${s.id}`;
            el.style.left = `${s.x}%`;
            el.style.top = `${s.y}%`;
            
            // Distinct Icons based on tier/role
            let path = '';
            if(s.tier === 6) {
                // Apex: Star/Diamond
                path = '<path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5L18.5 12 12 18.5 5.5 12 12 5.5z"/>';
            } else if(s.tier === 5) {
                // Ultimate: Shield
                path = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>';
            } else if(s.name.includes('Siphon') || s.name.includes('Leech')) {
                // Life Steal: Heart-ish
                path = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
            } else if(s.name.includes('Nova') || s.name.includes('Bomb')) {
                // Burst: Explosion
                path = '<path d="M11 2v2h2v-2h-2zm0 18v2h2v-2h-2zM2 11h2v2H2v-2zm18 0h2v2h-2v-2zM4.93 6.93l1.41-1.41L7.76 7.76 6.34 9.17 4.93 6.93zm12.73 10.73l1.41-1.41-1.41-1.41-1.41 1.41 1.41 1.41zM6.34 14.83l1.41 1.41-1.41 1.41-1.41-1.41 1.41-1.41zm12.73-7.07l-1.41-1.41-1.41 1.41 1.41 1.41 1.41-1.41z"/>';
            } else if(s.name.includes('Dash') || s.name.includes('Step')) {
                // Speed: Lightning
                path = '<path d="M7 2v11h3v9l7-12h-4l4-8z"/>';
            } else if(s.name.includes('Shell') || s.name.includes('Barrier')) {
                // Defense: Shield
                path = '<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>';
            } else {
                // Generic: Circle/Dot
                path = '<circle cx="12" cy="12" r="6"/>';
            }
            
            el.innerHTML = `<div class="node-inner"><svg viewBox="0 0 24 24">${path}</svg></div>`;
            
            // Events
            el.onmouseenter = (e) => showTooltip(e, s);
            el.onmouseleave = hideTooltip;
            el.onclick = (e) => {
                e.stopPropagation(); 
                upgrade(s);
            };

            nodeLayer.appendChild(el);
        });
    }

    // --- Logic ---
    function updateStates() {
        skills.forEach(s => {
            const el = document.getElementById(`node-${s.id}`);
            const parentIds = links.filter(l => l[1] === s.id).map(l => l[0]);
            const parentsUnlocked = parentIds.length === 0 || parentIds.some(pid => skills.find(sk => sk.id === pid).lvl > 0);
            
            // Reset classes
            el.className = 'node';
            
            if (s.lvl > 0) {
                el.classList.add(s.lvl >= s.max ? 'maxed' : 'unlocked');
            } else if (parentsUnlocked) {
                if(points > 0) {
                    el.classList.add('available');
                } else {
                    el.classList.add('locked'); 
                }
            } else {
                el.classList.add('locked');
            }
        });
        render(); // Redraw lines
    }

    function upgrade(skill) {
        if (points <= 0) return;
        if (skill.lvl >= skill.max) return;
        
        const parentIds = links.filter(l => l[1] === skill.id).map(l => l[0]);
        const parentsUnlocked = parentIds.length === 0 || parentIds.some(pid => skills.find(sk => sk.id === pid).lvl > 0);
        
        if (parentsUnlocked) {
            skill.lvl++;
            points--;
            spCount.innerText = points;
            updateStates();
            
            if(hoveredSkill && hoveredSkill.id === skill.id) {
                updateTooltipButton(skill);
            }
        }
    }

    // --- Rendering (Canvas Lines) ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(canvas.width/2 + panX, canvas.height/2 + panY);
        ctx.scale(scale, scale);
        ctx.translate(-500, -500); 

        links.forEach(([pid, cid]) => {
            const p = skills.find(s => s.id === pid);
            const c = skills.find(s => s.id === cid);
            
            const pActive = p.lvl > 0;
            const cActive = c.lvl > 0;

            const x1 = p.x * 10; 
            const y1 = (100 - p.y) * 10; 
            const x2 = c.x * 10;
            const y2 = (100 - c.y) * 10;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);

            if (pActive && cActive) {
                // Active Path: Bright, solid, glowing
                ctx.strokeStyle = 'rgba(176, 132, 240, 0.8)';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#b084f0';
                ctx.lineCap = 'round';
            } else if (pActive) {
                // 1. Establish Visual Hierarchy: Increase opacity of lines to 40-50%
                // Potential Path: Dashed, brighter
                ctx.strokeStyle = 'rgba(176, 132, 240, 0.45)'; 
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
                ctx.setLineDash([6, 6]);
                ctx.lineCap = 'round';
            } else {
                // Locked Path: Very faint
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
            }
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Interaction ---
    const viewport = document.getElementById('viewport');
    
    viewport.addEventListener('mousedown', e => {
        if(e.target === canvas || e.target === viewport) {
            isDragging = true;
            dragStartX = e.clientX - panX;
            dragStartY = e.clientY - panY;
        }
    });
    
    window.addEventListener('mouseup', () => isDragging = false);
    
    window.addEventListener('mousemove', e => {
        if (isDragging) {
            panX = e.clientX - dragStartX;
            panY = e.clientY - dragStartY;
            render();
        }
    });
    
    viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.001;
        const newScale = scale - e.deltaY * zoomSpeed;
        scale = Math.min(Math.max(0.5, newScale), 3);
        render();
    });

    // Tooltip Logic
    const tooltip = document.getElementById('tooltip');
    
    function showTooltip(e, skill) {
        hoveredSkill = skill;
        document.getElementById('tt-title').innerText = skill.name;
        document.getElementById('tt-tier').innerText = `Tier ${skill.tier}`;
        document.getElementById('tt-desc').innerText = skill.desc;
        document.getElementById('tt-stat').innerText = skill.stat;
        
        updateTooltipButton(skill);
        
        tooltip.classList.add('visible');
    }
    
    function updateTooltipButton(skill) {
        if(skill.lvl >= skill.max) {
            ttBtn.innerText = "Maxed";
            ttBtn.disabled = true;
            ttBtn.style.display = 'block';
        } else if (points > 0) {
            ttBtn.innerText = `Upgrade (${skill.lvl}/${skill.max})`;
            ttBtn.disabled = false;
            ttBtn.style.display = 'block';
            ttBtn.onclick = () => upgrade(skill);
        } else {
            ttBtn.innerText = "No Points";
            ttBtn.disabled = true;
            ttBtn.style.display = 'block';
        }
    }
    
    function hideTooltip() {
        hoveredSkill = null;
        tooltip.classList.remove('visible');
    }

    init();

</script>
</body>
</html>
