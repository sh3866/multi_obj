<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Artisan Cleaning</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-main: #2c2c2c;
            --accent-terracotta: #c85a42;
            --accent-terracotta-hover: #a84430;
            --accent-green: #4a7c59;
            --shadow-soft: 0 20px 40px rgba(0,0,0,0.1);
            --font-stack: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header & Typography --- */
        header {
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #333;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-terracotta);
            border-radius: 50%;
            display: inline-block;
        }

        nav ul {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        nav a:hover {
            opacity: 1;
            color: var(--accent-terracotta);
        }

        .hero-text {
            position: absolute;
            top: 25%;
            left: 3rem;
            z-index: 5;
            max-width: 450px;
            pointer-events: none; /* Let clicks pass through to scene if needed */
        }

        .hero-text > * {
            pointer-events: auto;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.9;
            font-weight: 800;
            letter-spacing: -2.5px;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
        }

        p.subtitle {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 2.5rem;
            font-weight: 400;
            max-width: 380px;
        }

        .cta-btn {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 1.1rem 2.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            background-color: var(--accent-terracotta);
            box-shadow: 0 8px 25px rgba(200, 90, 66, 0.4);
        }

        /* --- The Scene Container --- */
        .scene-container {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- SVG Styles --- */
        svg.main-scene {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Animations */
        @keyframes drip {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(20px); opacity: 0; }
        }

        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-30px) scale(1.2); opacity: 0; }
        }

        .bubble-anim {
            animation: bubbleRise 1s ease-out forwards;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            header { padding: 1.5rem; }
            h1 { font-size: 3rem; }
            .hero-text { top: 10%; left: 1.5rem; }
            nav { display: none; }
            .cta-btn { width: 100%; text-align: center; }
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-dot"></span>
            SCRUB & SHINE
        </div>
        <nav>
            <ul>
                <li><a href="#">Services</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-text">
        <h1>Make it<br>Shine Again.</h1>
        <p class="subtitle">Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.</p>
        <button class="cta-btn" id="cleanBtn">Start Cleaning</button>
    </div>

    <div class="scene-container">
        <svg class="main-scene" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="15" dy="25" stdDeviation="12" flood-opacity="0.15" flood-color="#000000"/>
                </filter>

                <filter id="liquid-blur">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
                </filter>

                <filter id="wetness-blur">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
                </filter>

                <!-- Wood Floor Texture Pattern -->
                <pattern id="woodPattern" width="160" height="1000" patternUnits="userSpaceOnUse">
                    <rect width="160" height="1000" fill="#dcd3c0" />
                    <!-- Wood Grain Lines (Horizontal) -->
                    <path d="M0,20 Q40,15 80,25 T160,20" stroke="#cbbfa0" stroke-width="1.5" fill="none" opacity="0.6"/>
                    <path d="M0,80 Q40,85 80,75 T160,80" stroke="#cbbfa0" stroke-width="1" fill="none" opacity="0.4"/>
                    <path d="M0,140 Q40,135 80,145 T160,140" stroke="#cbbfa0" stroke-width="2" fill="none" opacity="0.5"/>
                    <!-- Wood Knots -->
                    <ellipse cx="40" cy="350" rx="12" ry="3" fill="#cbbfa0" opacity="0.5" transform="rotate(-10 40 350)"/>
                    <ellipse cx="120" cy="650" rx="18" ry="5" fill="#cbbfa0" opacity="0.4" transform="rotate(10 120 650)"/>
                    <path d="M40,350 Q50,360 40,370 Q30,360 40,350" fill="none" stroke="#cbbfa0" stroke-width="1" opacity="0.5"/>
                </pattern>

                <!-- Gradients for Liquid -->
                <radialGradient id="liquidGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#d35400;stop-opacity:0.9" />
                    <stop offset="60%" style="stop-color:#a83200;stop-opacity:0.85" />
                    <stop offset="100%" style="stop-color:#6e1a00;stop-opacity:0.95" />
                </radialGradient>

                <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
                    <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
                </linearGradient>

                <!-- Mop Handle Gradient -->
                <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#8d6e63;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#5d4037;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. Background Floor -->
            <g id="floor">
                <rect x="0" y="0" width="1000" height="800" fill="url(#woodPattern)" />
                <!-- Planks separation (Vertical lines) -->
                <line x1="160" y1="0" x2="160" y2="800" stroke="#bba98b" stroke-width="3" opacity="0.7"/>
                <line x1="320" y1="0" x2="320" y2="800" stroke="#bba98b" stroke-width="3" opacity="0.7"/>
                <line x1="480" y1="0" x2="480" y2="800" stroke="#bba98b" stroke-width="3" opacity="0.7"/>
                <line x1="640" y1="0" x2="640" y2="800" stroke="#bba98b" stroke-width="3" opacity="0.7"/>
                <line x1="800" y1="0" x2="800" y2="800" stroke="#bba98b" stroke-width="3" opacity="0.7"/>
                <line x1="960" y1="0" x2="960" y2="800" stroke="#bba98b" stroke-width="3" opacity="0.7"/>
            </g>

            <!-- 2. The "Cleaning Arc" (The shiny trail left behind) -->
            <!-- This is visible beneath the mess initially, and revealed as mess fades -->
            <g id="cleaning-arc" opacity="0.8">
                <!-- A path showing where the mop has already scrubbed -->
                <path d="M 350 650 C 350 750, 650 750, 650 650 C 650 550, 350 550, 350 650" fill="none" stroke="#ffffff" stroke-width="40" opacity="0.15" filter="url(#wetness-blur)"/>
                <!-- Highlights on the clean path -->
                <path d="M 360 650 C 360 740, 640 740, 640 650" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 20" opacity="0.4" filter="url(#liquid-blur)"/>
            </g>

            <!-- 3. The Mess (Spilled Coffee/Juice) -->
            <g id="mess-group" transform="translate(500, 580)">
                <!-- Dark Wet Patch on Wood (Absorption) -->
                <ellipse cx="0" cy="10" rx="180" ry="100" fill="#222" opacity="0.15" filter="url(#wetness-blur)"/>
                
                <!-- Main puddle body -->
                <path d="M-140,10 C-140,-40 -80,-60 -40,-50 C-20,-70 40,-70 80,-40 C120,-50 150,-20 140,30 C120,70 80,90 40,80 C-20,90 -120,80 -140,10 Z" 
                      fill="url(#liquidGradient)" />
                
                <!-- Specular Highlights on Liquid (Viscosity/Wetness) -->
                <ellipse cx="-40" cy="-20" rx="30" ry="10" fill="url(#shineGradient)" transform="rotate(-20 -40 -20)" />
                <ellipse cx="60" cy="20" rx="20" ry="8" fill="url(#shineGradient)" transform="rotate(15 60 20)" />
                
                <!-- Splatters -->
                <g fill="url(#liquidGradient)">
                    <circle cx="-170" cy="-10" r="12" filter="url(#liquid-blur)" />
                    <circle cx="-160" cy="20" r="6" />
                    <circle cx="160" cy="40" r="15" filter="url(#liquid-blur)" />
                    <circle cx="180" cy="20" r="8" />
                    <circle cx="10" cy="-90" r="9" />
                    <circle cx="90" cy="-80" r="10" filter="url(#liquid-blur)" />
                </g>
                
                <!-- Drips (High viscosity) -->
                <path d="M-100,50 Q-105,70 -102,80 A 3 3 0 0 0 -96 80 Q-95,70 -100,50 Z" fill="url(#liquidGradient)" />
                <path d="M60,65 Q65,85 62,90 A 3 3 0 0 0 56 90 Q55,85 60,65 Z" fill="url(#liquidGradient)" />
            </g>

            <!-- 4. The Mop Assembly -->
            <!-- Centered roughly over the spill, angled dynamically -->
            <g id="mop-group" class="interactive-mop" transform="translate(520, 550) rotate(-15)">
                
                <!-- Mop Shadow (on floor) -->
                <ellipse cx="0" cy="15" rx="50" ry="45" fill="#000" opacity="0.2" filter="url(#wetness-blur)"/>

                <!-- Handle (Continuous line from head to top) -->
                <g id="mop-handle-group" filter="url(#drop-shadow)">
                    <!-- Main Stick -->
                    <rect x="-8" y="-450" width="16" height="460" rx="8" fill="url(#handleGradient)" />
                    <!-- Highlight on Stick -->
                    <rect x="-4" y="-450" width="4" height="460" fill="#ffffff" opacity="0.1" rx="2" />
                    <!-- Handle Grip/Top -->
                    <path d="M-10,-450 L10,-450 L8,-480 Q8,-490 -2,-490 Q-12,-490 -12,-480 Z" fill="#2d1b15"/>
                    <path d="M-10,-450 L10,-450" stroke="#000" stroke-width="2" opacity="0.3"/>
                </g>

                <!-- Mop Head (The strings) -->
                <!-- Positioned at (0,0) relative to this group, pressing into the mess -->
                <g transform="translate(0, 0)">
                    <!-- Base block (hidden mostly by strings) -->
                    <ellipse cx="0" cy="0" rx="45" ry="40" fill="#5d4037" opacity="0.2"/>
                    
                    <!-- Wet Strings (Darker, clumped) -->
                    <g stroke="#4e342e" stroke-width="4" fill="none" stroke-linecap="round">
                        <path d="M-35,-5 Q-40,20 -30,45" />
                        <path d="M-25,-10 Q-30,20 -20,50" />
                        <path d="M-15,-15 Q-20,20 -10,55" />
                        <path d="M-5,-20 Q-10,20 0,55" />
                        <path d="M5,-20 Q10,20 10,55" />
                        <path d="M15,-15 Q20,20 20,55" />
                        <path d="M25,-10 Q30,20 30,50" />
                        <path d="M35,-5 Q40,20 40,45" />
                    </g>
                    
                    <!-- Liquid on strings (Highlights) -->
                    <g stroke="#d35400" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
                         <path d="M-25,-10 Q-30,20 -20,50" />
                         <path d="M15,-15 Q20,20 20,55" />
                         <path d="M-5,-20 Q-10,20 0,55" />
                    </g>
                </g>
            </g>
            
            <!-- 5. Bubbles Container -->
            <g id="bubbles"></g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const handleGroup = document.getElementById('mop-handle-group');
            const messGroup = document.getElementById('mess-group');
            const cleanBtn = document.getElementById('cleanBtn');
            const bubblesContainer = document.getElementById('bubbles');
            
            // State
            let isCleaning = false;
            let scrubCounter = 0;
            let animationFrameId;

            // Mouse Tracking for subtle Parallax
            document.addEventListener('mousemove', (e) => {
                if(isCleaning) return; // Disable parallax during cleaning animation

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                // Subtle movement
                const moveX = deltaX * 15; 
                const moveY = deltaY * 10;
                const tilt = deltaX * 5; // Slight rotation
                
                // Apply to group
                mopGroup.style.transform = `translate(${520 + moveX}px, ${550 + moveY}px) rotate(${-15 + tilt}deg)`;
            });

            // Interactive Cleaning Logic
            cleanBtn.addEventListener('click', () => {
                if (isCleaning) return;
                
                isCleaning = true;
                cleanBtn.textContent = "Scrubbing...";
                cleanBtn.style.backgroundColor = "#c85a42"; // Terracotta active state

                // Reset transform style to allow JS animation
                mopGroup.style.transform = 'translate(520px, 550px) rotate(-15deg)';

                // 1. Animate Mop (Scrubbing motion)
                const startTime = Date.now();
                const duration = 3000; // 3 seconds

                const animateScrub = () => {
                    const now = Date.now();
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Oscillating motion
                    scrubCounter += 0.2;
                    const x = Math.sin(scrubCounter) * 40; // Left/Right scrub
                    const y = Math.cos(scrubCounter * 0.5) * 20; // Up/Down scrub
                    const rot = -15 + Math.sin(scrubCounter) * 8; // Wrist action

                    mopGroup.style.transform = `translate(${520 + x}px, ${550 + y}px) rotate(${rot}deg)`;

                    // Generate bubbles periodically
                    if (Math.random() > 0.85) {
                        addBubble(520 + x, 550 + y);
                    }

                    // 2. Fade out mess based on progress
                    // Mess starts fading halfway through
                    if (progress > 0.4) {
                        const fadeProgress = (progress - 0.4) / 0.6;
                        messGroup.style.opacity = 1 - fadeProgress;
                        messGroup.style.transform = `translate(500px, 580px) scale(${1 - (fadeProgress * 0.2)})`; // Shrink slightly
                    }

                    if (progress < 1) {
                        animationFrameId = requestAnimationFrame(animateScrub);
                    } else {
                        finishCleaning();
                    }
                };

                animationFrameId = requestAnimationFrame(animateScrub);
            });

            function finishCleaning() {
                isCleaning = false;
                cleanBtn.textContent = "Sparkling!";
                cleanBtn.style.backgroundColor = "#4a7c59"; // Success Green
                
                // Update Text
                const h1 = document.querySelector('h1');
                const sub = document.querySelector('.subtitle');
                
                h1.style.transition = "opacity 0.5s";
                h1.style.opacity = 0;
                
                setTimeout(() => {
                    h1.innerHTML = "Good as<br>new.";
                    sub.textContent = "We leave no trace behind. Just a pristine floor.";
                    h1.style.opacity = 1;
                }, 500);

                // Reset after a delay
                setTimeout(() => {
                    cleanBtn.textContent = "Start Cleaning";
                    cleanBtn.style.backgroundColor = "#333";
                    
                    // Reset Scene
                    messGroup.style.transition = "opacity 0.5s ease-in";
                    messGroup.style.opacity = 1;
                    messGroup.style.transform = "translate(500px, 580px) scale(1)";
                    mopGroup.style.transform = "translate(520px, 550px) rotate(-15deg)";
                    
                    // Reset Text
                    setTimeout(() => {
                        h1.innerHTML = "Make it<br>Shine Again.";
                        sub.textContent = "Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.";
                    }, 500);

                }, 4000);
            }

            function addBubble(x, y) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                // Randomize position slightly around the mop head
                const offsetX = (Math.random() * 60 - 30);
                const offsetY = (Math.random() * 60 - 30);
                
                circle.setAttribute("cx", x + offsetX);
                circle.setAttribute("cy", y + offsetY);
                circle.setAttribute("r", Math.random() * 4 + 2);
                circle.setAttribute("fill", "#ffffff");
                circle.setAttribute("opacity", "0"); // Start invisible for animation
                circle.setAttribute("stroke", "#ffffff");
                circle.setAttribute("stroke-width", "1");
                
                // Add class for CSS animation
                circle.classList.add('bubble-anim');
                
                bubblesContainer.appendChild(circle);

                // Cleanup DOM
                setTimeout(() => {
                    if(circle.parentNode) circle.parentNode.removeChild(circle);
                }, 1000);
            }
        });
    </script>
</body>
</html>
