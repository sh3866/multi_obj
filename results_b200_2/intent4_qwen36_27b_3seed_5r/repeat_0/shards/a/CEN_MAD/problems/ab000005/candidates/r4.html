<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub & Shine - Artisan Cleaning</title>
    <style>
        :root {
            /* Palette - Warm, Earthy & Refined */
            --wood-dark: #3E2723;
            --wood-mid: #5D4037;
            --wood-light: #8D6E63;
            --wood-highlight: #D7CCC8;
            
            /* Typography */
            --text-main: #1a1a1a;
            --text-warm-grey: #4E4036;
            --font-stack: 'Helvetica Neue', Helvetica, Arial, sans-serif;

            /* Accents */
            --accent-terracotta: #C25E48; /* Replaces Teal - Critique #5 */
            --accent-terracotta-hover: #A04633;
            
            /* Shadows & Glass */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-float: 0 20px 50px rgba(62, 39, 35, 0.25);
            --shadow-btn: 0 10px 25px rgba(194, 94, 72, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2c241b;
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: relative;
            /* Glassmorphism */
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--wood-dark);
        }

        .brand-dot {
            width: 14px;
            height: 14px;
            background-color: var(--accent-terracotta);
            border-radius: 50%;
            display: inline-block;
        }

        nav ul {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--text-warm-grey);
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        nav a:hover {
            color: var(--accent-terracotta);
        }

        /* --- Typography & Layout --- */
        .hero-text {
            position: absolute;
            top: 18%;
            left: 6%;
            z-index: 50;
            max-width: 500px;
            pointer-events: none;
        }

        .hero-text > * {
            pointer-events: auto;
        }

        /* Text Legibility Block (Critique #4: Glassmorphism) */
        .text-block-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 3rem;
            border-radius: 24px; /* Softer, more modern */
            box-shadow: var(--shadow-float);
            border: 1px solid var(--glass-border);
            transform: translateZ(0);
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.95;
            font-weight: 900; /* Extra Bold */
            letter-spacing: -2px;
            margin-bottom: 1rem;
            color: var(--text-main); /* Max Contrast */
        }

        p.subtitle {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-warm-grey);
            margin-bottom: 2.5rem;
            font-weight: 500;
            max-width: 380px;
        }

        /* --- Refined CTA (Critique #5: Terracotta) */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-terracotta);
            color: #fff;
            padding: 1.2rem 2.8rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .cta-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent-terracotta-hover);
            box-shadow: 0 14px 30px rgba(194, 94, 72, 0.5);
        }

        /* --- Scene Container --- */
        .scene-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            perspective: 1200px;
        }

        svg.main-scene {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- Animations --- */
        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }

        .bubble-anim {
            animation: bubbleRise 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @media (max-width: 768px) {
            header { padding: 1rem 1.5rem; }
            h1 { font-size: 3rem; }
            .hero-text { top: 5%; left: 5%; width: 90%; }
            .text-block-wrapper { padding: 1.5rem; }
            nav { display: none; }
            .cta-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-dot"></span>
            SCRUB & SHINE
        </div>
        <nav>
            <ul>
                <li><a href="#">Services</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-text">
        <div class="text-block-wrapper">
            <h1>Make it<br>Shine Again.</h1>
            <p class="subtitle">Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.</p>
            <button class="cta-btn" id="cleanBtn">Start Cleaning</button>
        </div>
    </div>

    <div class="scene-container">
        <svg class="main-scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. FLOOR: High-fidelity Wood Gradient (Critique #1) -->
                <linearGradient id="floorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#A67B5B" />
                    <stop offset="40%" stop-color="#8B5A2B" />
                    <stop offset="100%" stop-color="#4E342E" />
                </linearGradient>

                <!-- 2. FILTER: Wood Grain Texture -->
                <filter id="woodGrain" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.1" numOctaves="3" result="noise" />
                    <feColorMatrix type="matrix" values="
                        0 0 0 0 0.8
                        0 0 0 0 0.5
                        0 0 0 0 0.3
                        0 0 0 0.15 0" in="noise" result="coloredNoise" />
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture" />
                    <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
                </filter>

                <!-- 3. FILTER: Mop Fiber Texture (Critique #3) -->
                <filter id="roughPaper">
                    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- 4. FILTER: Drop Shadow for Grounding -->
                <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="15" dy="25" stdDeviation="12" flood-opacity="0.35" flood-color="#1a1a1a"/>
                </filter>

                <!-- 5. FILTER: Wetness Blur -->
                <filter id="wetness-blur">
                    <feGaussianBlur stdDeviation="6" />
                </filter>

                <!-- Mop Handle Gradient -->
                <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4E342E" />
                    <stop offset="50%" style="stop-color:#6D4C41" />
                    <stop offset="100%" style="stop-color:#3E2723" />
                </linearGradient>
                
                <!-- 6. SPILL: Liquid Gradient (Critique #2) -->
                <radialGradient id="spillGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#607D8B" stop-opacity="0.8" /> <!-- Light Blue/Grey -->
                    <stop offset="60%" stop-color="#37474F" stop-opacity="0.6" /> <!-- Darker Blue/Grey -->
                    <stop offset="100%" stop-color="#263238" stop-opacity="0.2" /> <!-- Transparent Edge -->
                </radialGradient>
            </defs>

            <!-- A. Background Floor -->
            <g id="floor">
                <!-- Base Gradient -->
                <rect x="0" y="0" width="1200" height="900" fill="url(#floorGradient)" />
                
                <!-- Planks (Vertical lines with varying opacity for realism) -->
                <g stroke="#3E2723" stroke-width="6" opacity="0.4">
                    <line x1="150" y1="0" x2="150" y2="900" />
                    <line x1="350" y1="0" x2="350" y2="900" />
                    <line x1="550" y1="0" x2="550" y2="900" />
                    <line x1="750" y1="0" x2="750" y2="900" />
                    <line x1="950" y1="0" x2="950" y2="900" />
                    <line x1="1150" y1="0" x2="1150" y2="900" />
                </g>
                
                <!-- Horizontal Seams -->
                <g stroke="#3E2723" stroke-width="3" opacity="0.2">
                    <line x1="0" y1="250" x2="1200" y2="250" />
                    <line x1="0" y1="500" x2="1200" y2="500" />
                    <line x1="0" y1="750" x2="1200" y2="750" />
                </g>

                <!-- Apply Grain Filter Overlay -->
                <rect x="0" y="0" width="1200" height="900" fill="none" filter="url(#woodGrain)" opacity="0.6" pointer-events="none" />
                
                <!-- Wet Sheen Overlay (Critique #1) -->
                <rect x="0" y="0" width="1200" height="900" fill="url(#floorGradient)" opacity="0.2" style="mix-blend-mode: overlay;" pointer-events="none" />
            </g>

            <!-- B. The "Clean Path" (Wet Shine) -->
            <g id="cleaning-arc" opacity="0.4">
                <path d="M 450 550 C 450 650, 850 650, 850 550 L 850 450 C 850 550, 450 550, 450 450 Z" 
                      fill="#E0C090" filter="url(#wetness-blur)"/>
                <path d="M 460 540 C 460 630, 840 630, 840 540" 
                      fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" filter="url(#wetness-blur)"/>
            </g>

            <!-- C. The "Mess" (Critique #2: Translucent Viscous Liquid) -->
            <g id="mess-group" transform="translate(750, 580)">
                <!-- 1. Wet Under-layer (Absorption into wood) -->
                <ellipse cx="0" cy="0" rx="240" ry="140" fill="#2c1b18" opacity="0.2" filter="url(#wetness-blur)"/>
                
                <!-- 2. Main Blob (Using Gradient for depth) -->
                <path d="M-160,10 C-170,-60 -90,-90 -40,-80 C0,-100 70,-90 110,-50 C160,-60 190,-20 180,30 C160,90 90,120 40,110 C-90,120 -160,100 -160,10 Z" 
                      fill="url(#spillGradient)" />
                
                <!-- 3. Inner Core (Viscous Texture - darker center) -->
                <path d="M-110,10 C-110,-40 -60,-60 -30,-50 C0,-60 50,-50 70,-30 C100,-30 120,-10 110,20 C90,50 50,80 0,70 C-70,80 -110,70 -110,10 Z" 
                      fill="#37474F" opacity="0.8"/>

                <!-- 4. Splatters (Dynamic Energy) -->
                <circle cx="60" cy="-50" r="12" fill="#607D8B" opacity="0.9" />
                <circle cx="-130" cy="30" r="15" fill="#37474F" opacity="0.8" />
                <circle cx="150" cy="-20" r="18" fill="#455A64" opacity="0.7" />
                <path d="M-80,-30 Q-60,-50 -40,-20 T30,-40" fill="none" stroke="#263238" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

                <!-- 5. Specular Highlights (Glossy, Wet Appearance) -->
                <ellipse cx="-50" cy="-40" rx="45" ry="12" fill="#FFFFFF" opacity="0.6" transform="rotate(-15 -50 -40)" />
                <ellipse cx="70" cy="10" rx="25" ry="8" fill="#FFFFFF" opacity="0.4" transform="rotate(10 70 10)" />
                <ellipse cx="-20" cy="40" rx="10" ry="4" fill="#FFFFFF" opacity="0.5" />
                
                <!-- 6. Drips -->
                <path d="M-90,60 Q-95,90 -92,100 A 3 3 0 0 0 -86 100 Q-85,90 -90,60 Z" fill="#455A64" />
                <path d="M50,80 Q55,110 52,120 A 3 3 0 0 0 46 120 Q45,110 50,80 Z" fill="#455A64" />
            </g>

            <!-- D. The Mop (Critique #3: Wet Heavy Material) -->
            <g id="mop-group" transform="translate(780, 560) rotate(-25)">
                
                <!-- Shadow on floor (Grounding) -->
                <ellipse cx="0" cy="25" rx="70" ry="55" fill="#000" opacity="0.3" filter="url(#wetness-blur)"/>

                <!-- Handle (Critique #4: Repositioned to avoid text) -->
                <!-- Extends straight up, angled slightly away from text -->
                <g filter="url(#drop-shadow)">
                    <rect x="-12" y="-550" width="24" height="580" rx="12" fill="url(#handleGradient)" />
                    <!-- Metallic/Plastic Shine -->
                    <rect x="-4" y="-550" width="6" height="580" fill="#FFFFFF" opacity="0.1" rx="2" />
                    <!-- Top Grip -->
                    <path d="M-14,-550 L14,-550 L12,-580 Q12,-590 0,-590 Q-12,-590 -12,-580 Z" fill="#261712"/>
                </g>

                <!-- Mop Head (Fibrous Texture - Smooth Curves) -->
                <g transform="translate(0, 0)">
                    <!-- Base Shadow/Volume -->
                    <ellipse cx="0" cy="0" rx="65" ry="55" fill="#263238" opacity="0.9" />
                    
                    <!-- The Fibers (Critique #3: Smooth Overlapping Curves) -->
                    <g stroke="#455A64" stroke-linecap="round" filter="url(#roughPaper)">
                        <!-- Left Cluster -->
                        <path d="M-30,-30 Q-10,20 -40,50" stroke-width="12" />
                        <path d="M-50,-10 Q-20,30 -60,60" stroke-width="10" />
                        <path d="M-10,-40 Q10,10 -20,60" stroke-width="14" />
                        
                        <!-- Right Cluster -->
                        <path d="M30,-30 Q10,20 40,50" stroke-width="12" />
                        <path d="M50,-10 Q20,30 60,60" stroke-width="10" />
                        <path d="M10,-40 Q-10,10 20,60" stroke-width="14" />
                        
                        <!-- Center Mess -->
                        <path d="M0,-40 Q0,0 0,70" stroke-width="16" stroke="#37474F" />
                    </g>

                    <!-- Wetness on Mop -->
                    <ellipse cx="-10" cy="10" rx="25" ry="15" fill="#263238" opacity="0.8" filter="url(#wetness-blur)"/>
                    <ellipse cx="20" cy="-5" rx="20" ry="12" fill="#263238" opacity="0.7" filter="url(#wetness-blur)"/>
                    
                    <!-- Shine on wet mop -->
                    <path d="M-25,-15 Q0,10 25,-15" stroke="#FFFFFF" stroke-width="2" opacity="0.3" fill="none" />
                </g>
            </g>
            
            <!-- E. Bubbles Container -->
            <g id="bubbles"></g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mopGroup = document.getElementById('mop-group');
            const messGroup = document.getElementById('mess-group');
            const cleanBtn = document.getElementById('cleanBtn');
            const bubblesContainer = document.getElementById('bubbles');
            const h1 = document.querySelector('h1');
            const sub = document.querySelector('.subtitle');
            
            // State
            let isCleaning = false;
            let scrubCounter = 0;
            let animationFrameId;

            // Mouse Tracking for subtle Parallax
            document.addEventListener('mousemove', (e) => {
                if(isCleaning) return;

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                // Subtle movement
                const moveX = deltaX * 15; 
                const moveY = deltaY * 10;
                const tilt = deltaX * 3; 
                
                // Apply to group (Base transform + offset)
                // Base transform: translate(780px, 560px) rotate(-25deg)
                mopGroup.style.transform = `translate(${780 + moveX}px, ${560 + moveY}px) rotate(${-25 + tilt}deg)`;
                
                // Subtle movement for spill
                messGroup.style.transform = `translate(${750 + moveX * 0.5}px, ${580 + moveY * 0.5}px)`;
            });

            // Interactive Cleaning Logic
            cleanBtn.addEventListener('click', () => {
                if (isCleaning) return;
                
                isCleaning = true;
                cleanBtn.textContent = "Scrubbing...";
                cleanBtn.style.backgroundColor = "#A04633"; // Darker Terracotta
                
                // Reset transform style to allow JS animation
                mopGroup.style.transform = 'translate(780px, 560px) rotate(-25deg)';
                messGroup.style.transform = 'translate(750px, 580px)';

                const startTime = Date.now();
                const duration = 3500; 

                const animateScrub = () => {
                    const now = Date.now();
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Oscillating motion (Scrubbing)
                    scrubCounter += 0.25;
                    const x = Math.sin(scrubCounter) * 50; 
                    const y = Math.cos(scrubCounter * 0.5) * 25; 
                    const rot = -25 + Math.sin(scrubCounter) * 10; 

                    mopGroup.style.transform = `translate(${780 + x}px, ${560 + y}px) rotate(${rot}deg)`;

                    // Generate bubbles
                    if (Math.random() > 0.8) {
                        addBubble(780 + x, 560 + y);
                    }

                    // Fade out mess based on progress
                    if (progress > 0.3) {
                        const fadeProgress = (progress - 0.3) / 0.7;
                        messGroup.style.opacity = 1 - fadeProgress;
                        messGroup.style.transform = `translate(750px, 580px) scale(${1 - (fadeProgress * 0.5)})`; 
                    }

                    if (progress < 1) {
                        animationFrameId = requestAnimationFrame(animateScrub);
                    } else {
                        finishCleaning();
                    }
                };

                animationFrameId = requestAnimationFrame(animateScrub);
            });

            function finishCleaning() {
                isCleaning = false;
                cleanBtn.textContent = "Sparkling!";
                cleanBtn.style.backgroundColor = "#2E7D32"; // Success Green
                
                // Update Text with smooth transition
                h1.style.transition = "opacity 0.5s";
                h1.style.opacity = 0;
                
                setTimeout(() => {
                    h1.innerHTML = "Good as<br>new.";
                    sub.textContent = "We leave no trace behind. Just a pristine floor.";
                    h1.style.opacity = 1;
                }, 500);

                // Reset after a delay
                setTimeout(() => {
                    cleanBtn.textContent = "Start Cleaning";
                    cleanBtn.style.backgroundColor = "var(--accent-terracotta)";
                    
                    // Reset Scene
                    messGroup.style.transition = "opacity 0.5s ease-in, transform 0.5s ease-in";
                    messGroup.style.opacity = 1;
                    messGroup.style.transform = "translate(750px, 580px) scale(1)";
                    mopGroup.style.transform = "translate(780px, 560px) rotate(-25deg)";
                    
                    // Reset Text
                    setTimeout(() => {
                        h1.innerHTML = "Make it<br>Shine Again.";
                        sub.textContent = "Premium floor care for the modern home. We tackle the mess so you can focus on the moments that matter.";
                    }, 500);

                }, 4000);
            }

            function addBubble(x, y) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const offsetX = (Math.random() * 80 - 40);
                const offsetY = (Math.random() * 80 - 40);
                
                circle.setAttribute("cx", x + offsetX);
                circle.setAttribute("cy", y + offsetY);
                circle.setAttribute("r", Math.random() * 5 + 2);
                circle.setAttribute("fill", "rgba(255,255,255,0.8)");
                circle.setAttribute("stroke", "#FFFFFF");
                circle.setAttribute("stroke-width", "0.5");
                
                circle.classList.add('bubble-anim');
                
                bubblesContainer.appendChild(circle);

                setTimeout(() => {
                    if(circle.parentNode) circle.parentNode.removeChild(circle);
                }, 1500);
            }
        });
    </script>
</body>
</html>
