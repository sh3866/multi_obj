<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Warm Storybook --- */
            --bg-color: #FDFBF7; /* Soft Cream */
            --text-color: #4A3B32; /* Deep Chocolate */
            --primary-action: #D95D39; /* Burnt Orange */
            --primary-action-shadow: #B3472A;
            
            /* Board & Tile */
            --board-bg: #FFFDF9;
            --tile-bg: #F4EFE6;
            --tile-shadow: rgba(74, 59, 50, 0.08);
            --tile-border: #EBE3D5;
            --path-color: #A68A76; /* Warm Wood/Chalk */
            --grid-line: #E6DFD3;

            /* Assets */
            --cub-color: #E09F6D;
            --cub-dark: #C58450;
            --star-color: #FFC107;
            --star-glow: rgba(255, 193, 7, 0.5);
        }

        /* --- Typography Setup --- */
        /* Using a stack that prioritizes chunky, rounded system fonts to simulate 'Fredoka One' without network */
        :root {
            --font-display: 'Nunito', 'Fredoka One', 'Chalkboard SE', 'Arial Rounded MT Bold', system-ui, sans-serif;
            --font-body: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: var(--font-body);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 24px; /* Spacing from board */
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem; /* Reduced size per critique */
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1;
        }

        /* Decorative Icon for Title */
        .title-icon {
            width: 40px;
            height: 40px;
            fill: var(--primary-action);
            display: inline-block;
            vertical-align: middle;
            margin-bottom: 4px;
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 700;
            color: #8C7B70;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-top: 8px; /* Centered spacing */
        }

        /* --- The Game Board --- */
        .game-container {
            /* Floating Card Appearance */
            background-color: var(--board-bg);
            padding: 12px;
            border-radius: 20px;
            /* Soft Drop Shadow */
            box-shadow: 
                0 10px 30px rgba(74, 59, 50, 0.06),
                0 2px 8px rgba(74, 59, 50, 0.04);
            border: 1px solid rgba(255,255,255,0.8);
            
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 0; /* Uniform grid lines */
            width: 80vmin;
            height: 80vmin;
            max-width: 450px;
            max-height: 450px;
            background-color: var(--grid-line); /* Acts as grid lines */
            border: 2px solid var(--grid-line); /* Uniform outer border */
            border-radius: 8px;
            overflow: hidden;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-bg);
            position: relative;
            cursor: pointer;
            /* Subtle inner shadow for 'card' look */
            box-shadow: inset 0 0 0 1px var(--tile-border);
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tile:active {
            background-color: #EFEADD;
        }

        .tile canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* --- Overlay Layer (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 12px; /* Match game-container padding */
            left: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            z-index: 20;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Character: Cub --- */
        .cub-token {
            width: 75%;
            height: 75%;
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        /* Vector CSS Cub Head */
        .cub-head {
            width: 100%;
            height: 100%;
            background: var(--cub-color);
            border-radius: 45% 45% 40% 40%;
            position: relative;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        
        .cub-ear {
            position: absolute;
            top: -10%;
            width: 30%;
            height: 30%;
            background: var(--cub-dark);
            border-radius: 50%;
            z-index: -1;
        }
        .cub-ear.left { left: 0; }
        .cub-ear.right { right: 0; }

        .cub-face-mask {
            position: absolute;
            top: 25%;
            left: 15%;
            width: 70%;
            height: 55%;
            background: #FCE4D6;
            border-radius: 50%;
        }

        .cub-eye {
            position: absolute;
            top: 35%;
            width: 14%;
            height: 14%;
            background: #4A3B32;
            border-radius: 50%;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        .cub-eye::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 40%;
            height: 40%;
            background: white;
            border-radius: 50%;
        }
        .cub-eye.left { left: 25%; }
        .cub-eye.right { right: 25%; }

        .cub-snout {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 35%;
            height: 25%;
            background: #4A3B32;
            border-radius: 40% 40% 50% 50%;
        }

        /* --- Character: Star --- */
        .star-container {
            width: 70%;
            height: 70%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .star-svg {
            width: 100%;
            height: 100%;
            fill: var(--star-color);
            filter: drop-shadow(0 0 8px var(--star-glow));
            animation: pulse 2.5s infinite ease-in-out;
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 24px; /* Reduced gap */
            display: flex;
            gap: 16px;
            z-index: 10;
            align-items: center;
        }

        button {
            font-family: var(--font-body);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Primary Button: Run */
        .btn-run {
            background-color: var(--primary-action);
            color: white;
            font-size: 1.1rem;
            padding: 14px 48px;
            box-shadow: 0 4px 0 var(--primary-action-shadow);
            transform: translateY(0);
        }

        .btn-run:hover {
            background-color: #E06845;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--primary-action-shadow);
        }

        .btn-run:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 var(--primary-action-shadow);
        }

        /* Secondary Button: Reset */
        .btn-reset {
            background-color: transparent;
            color: var(--text-color);
            font-size: 0.9rem;
            padding: 14px 24px;
            border: 2px solid #E6DFD3;
            opacity: 0.8;
        }

        .btn-reset:hover {
            opacity: 1;
            border-color: var(--text-color);
            background-color: rgba(255,255,255,0.5);
        }

        .btn-reset:active {
            transform: scale(0.98);
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .game-container { padding: 8px; }
            .grid { width: 90vmin; height: 90vmin; }
            .controls { flex-direction: row; }
            .btn-run { padding: 12px 32px; }
            .btn-reset { padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <!-- Simple SVG Icon for Title -->
            <svg class="title-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8 2 5 5 5 9C5 13 8 16 8 20H16C16 16 19 13 19 9C19 5 16 2 12 2Z" fill="currentColor"/>
                <circle cx="9" cy="9" r="1.5" fill="#4A3B32"/>
                <circle cx="15" cy="9" r="1.5" fill="#4A3B32"/>
            </svg>
            Cub n Pup
        </h1>
        <div class="subtitle">Connect the path to the star</div>
    </header>

    <main class="game-container">
        <div class="grid" id="grid">
            <!-- Tiles generated by JS -->
        </div>
        <!-- Overlay for Cub and Star -->
        <div class="overlay-layer" id="overlay"></div>
    </main>

    <footer class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <button class="btn-run" onclick="runGame()">Run</button>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        // 1=Straight, 2=Corner, 3=T-Junction, 4=Cross, 5=Empty (for visual balance)
        const TILE_TYPES = {
            1: [1, 0, 1, 0], 
            2: [1, 1, 0, 0], 
            3: [1, 1, 1, 0], 
            4: [1, 1, 1, 1],
            5: [0, 1, 0, 1], 
            6: [0, 0, 1, 1]  
        };

        let boardState = []; 

        // --- Initialization ---

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Randomize type and rotation
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    // Higher res canvas for crisp rendering
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    // Use grid placement to align with tiles perfectly
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                // Inner face details
                cub.innerHTML = `
                    <div class="cub-head">
                        <div class="cub-ear left"></div>
                        <div class="cub-ear right"></div>
                        <div class="cub-face-mask"></div>
                        <div class="cub-eye left"></div>
                        <div class="cub-eye right"></div>
                        <div class="cub-snout"></div>
                    </div>
                `;
                cell.appendChild(cub);
            } else if (type === 'star') {
                const container = document.createElement('div');
                container.className = 'star-container';
                
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-svg");
                // Standard Star Path
                star.innerHTML = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
                
                container.appendChild(star);
                cell.appendChild(container);
            }
        }

        // --- Drawing Logic ---

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 32; // Thicker, rounded paths
            const length = 105; // Reach edge

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = thickness;
            ctx.strokeStyle = '#A68A76'; // Warm Wood Color
            
            // Remove heavy shadows for cleaner look, maybe just subtle stroke
            ctx.shadowColor = 'transparent';

            const drawSegment = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length); // Top
                if (dir === 1) ctx.lineTo(cx + length, cy); // Right
                if (dir === 2) ctx.lineTo(cx, cy + length); // Bottom
                if (dir === 3) ctx.lineTo(cx - length, cy); // Left
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            
            // Apply rotation
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }

            // Center Hub to smooth connections visually
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2, 0, Math.PI * 2);
            ctx.fillStyle = '#A68A76';
            ctx.fill();
        }

        // --- Actions ---

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            
            if(btn.innerText !== "Run") return;

            btn.innerText = "Solving...";
            
            const tiles = document.querySelectorAll('.tile');
            
            // Simulate pathfinding visual flair
            // Highlight a random "path" logic for effect
            const pathIndices = [0, 1, 2, 3, 4, 9, 14, 15, 16]; 
            
            let delay = 0;
            pathIndices.forEach((idx) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.style.backgroundColor = '#E6DCCF'; // Highlight color
                    t.style.transform = 'scale(1.05)';
                    setTimeout(() => { t.style.transform = 'scale(1)'; }, 150);
                }, delay);
                delay += 150;
            });

            setTimeout(() => {
                btn.innerText = "Done!";
                btn.style.backgroundColor = "#66BB6A"; // Success Green
                btn.style.boxShadow = "0 4px 0 #2E7D32";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.boxShadow = "";
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                    });
                }, 2000);
            }, delay + 400);
        }

        // Start
        initGame();

    </script>
</body>
</html>
