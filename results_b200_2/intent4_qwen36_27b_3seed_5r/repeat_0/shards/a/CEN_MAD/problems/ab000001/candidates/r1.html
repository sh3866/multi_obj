<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Warm Storybook --- */
            --bg-color: #FDFBF7; /* Creamy canvas */
            
            /* Wood Tones */
            --wood-frame-outer: #5D4037;
            --wood-frame-inner: #8D6E63;
            --wood-highlight: #A1887F;
            --wood-shadow: #3E2723;
            
            /* Tile Colors */
            --tile-bg: #FFF8E1;
            --tile-shadow: #D7CCC8;
            
            /* Ink & Paths */
            --ink-color: #3E2723; /* Deep Chocolate */
            --path-color: #4E342E;
            
            /* UI & Accents */
            --accent-terracotta: #D84315;
            --accent-terracotta-dark: #BF360C;
            --accent-star: #FFCA28;
            --accent-star-glow: #FFECB3;
            
            --font-display: 'Fredoka One', 'Nunito', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            --font-ui: 'Nunito', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Subtle texture via CSS noise */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            font-family: var(--font-ui);
            color: var(--ink-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            margin: 0;
            letter-spacing: 1px;
            color: var(--ink-color);
            /* Removed heavy drop shadow, keeping it clean */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .subtitle {
            font-size: 1rem;
            color: #8D6E63;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            font-weight: 700;
            opacity: 0.8;
        }

        /* --- The Game Board --- */
        .game-container {
            /* Tactile 'Cutout' Frame */
            position: relative;
            padding: 16px;
            background-color: var(--wood-frame-outer);
            border-radius: 24px;
            /* Multi-layered shadow for depth */
            box-shadow: 
                0 20px 40px rgba(62, 39, 35, 0.25),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -4px 8px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Inner wood rim */
        .board-inner-rim {
            background: var(--wood-frame-inner);
            padding: 6px;
            border-radius: 16px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            width: 85vmin;
            height: 85vmin;
            max-width: 480px;
            max-height: 480px;
            background: var(--wood-frame-outer); /* Shows through gaps */
            border-radius: 8px;
            padding: 4px;
        }

        /* --- Tiles --- */
        .tile {
            background-color: var(--tile-bg);
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            /* Soft inner shadow to look like a recessed slot */
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.05),
                inset -1px -1px 2px rgba(255,255,255,0.8);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s;
            overflow: hidden;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass to tile div */
        }

        /* --- Game Elements (Cub & Star) --- */
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            padding: 4px; /* Match grid padding */
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* Redesign: Stylized Character Icon */
        .cub-token {
            width: 70%;
            height: 70%;
            background: var(--accent-terracotta);
            border-radius: 50% 50% 45% 45%; /* Plush shape */
            position: relative;
            box-shadow: 
                inset -3px -3px 0 rgba(0,0,0,0.15),
                inset 3px 3px 0 rgba(255,255,255,0.2),
                0 6px 10px rgba(0,0,0,0.25);
            animation: float 3s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cub Face Details */
        .cub-face {
            position: relative;
            width: 80%;
            height: 70%;
        }
        .cub-eye {
            position: absolute;
            top: 35%;
            width: 18%;
            height: 18%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.2);
        }
        .cub-eye.left { left: 20%; }
        .cub-eye.right { right: 20%; }
        
        .cub-nose {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            width: 24%;
            height: 18%;
            background: #3E2723;
            border-radius: 50% 50% 40% 40%;
        }

        /* Redesign: Larger, Glowing Star */
        .star-token {
            width: 80%;
            height: 80%;
            fill: var(--accent-star);
            filter: drop-shadow(0 0 8px var(--accent-star-glow));
            animation: pulse 2.5s infinite ease-in-out;
        }

        /* --- Footer Controls --- */
        .controls {
            margin-top: 32px;
            z-index: 10;
        }

        /* Unified Pill Container */
        .controls-pill {
            display: flex;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            padding: 6px;
            border-radius: 50px;
            border: 2px solid rgba(62, 39, 35, 0.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        button {
            font-family: var(--font-display);
            font-size: 1.1rem;
            padding: 12px 40px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        button:active {
            transform: scale(0.96);
        }

        /* Muted Terracotta/Brown for Run */
        .btn-run {
            background-color: var(--accent-terracotta);
            color: white;
            box-shadow: 0 4px 0 var(--accent-terracotta-dark);
        }
        .btn-run:hover {
            background-color: #E64A19;
            transform: translateY(-1px);
            box-shadow: 0 6px 0 var(--accent-terracotta-dark);
        }
        .btn-run:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--accent-terracotta-dark);
        }

        .btn-reset {
            background-color: transparent;
            color: var(--ink-color);
            font-size: 1rem;
            padding: 12px 24px;
            opacity: 0.7;
        }
        .btn-reset:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.05);
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px var(--accent-star-glow)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 12px var(--accent-star-glow)); }
        }

        @keyframes solve-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- Responsive Tweaks --- */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .grid { width: 92vmin; height: 92vmin; gap: 4px; }
            .board-inner-rim { padding: 4px; }
            .game-container { padding: 10px; }
            .cub-token { width: 60%; height: 60%; }
        }

    </style>
</head>
<body>

    <header>
        <h1>
            <!-- Custom SVG Icon matching the Cub style -->
            <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="15" y="15" width="70" height="70" rx="20" fill="#D84315" stroke="#3E2723" stroke-width="4"/>
                <circle cx="35" cy="45" r="6" fill="#3E2723"/>
                <circle cx="65" cy="45" r="6" fill="#3E2723"/>
                <ellipse cx="50" cy="65" rx="12" ry="8" fill="#3E2723"/>
            </svg>
            Cub n Pup
        </h1>
        <div class="subtitle">Connect the path to the star</div>
    </header>

    <main class="game-container">
        <div class="board-inner-rim">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay"></div>
        </div>
    </main>

    <footer class="controls">
        <div class="controls-pill">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="runGame()">Run</button>
        </div>
    </footer>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: Connections: [Top, Right, Bottom, Left] (1 = connected, 0 = not)
        // 1=Straight, 2=Corner, 3=T-Junction, 4=Cross
        const TILE_TYPES = {
            1: [1, 0, 1, 0], 
            2: [1, 1, 0, 0], 
            3: [1, 1, 1, 0], 
            4: [1, 1, 1, 1],
            5: [0, 1, 0, 1], // Empty-ish (just left/right)
            6: [0, 0, 1, 1]  // Empty-ish (just top/bottom - wait, 1 covers this)
        };

        let boardState = []; 

        // --- Initialization ---

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Randomize type and rotation
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const cub = document.createElement('div');
                cub.className = 'cub-token';
                // Inner face details
                cub.innerHTML = `
                    <div class="cub-face">
                        <div class="cub-eye left"></div>
                        <div class="cub-eye right"></div>
                        <div class="cub-nose"></div>
                    </div>
                `;
                cell.appendChild(cub);
            } else if (type === 'star') {
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 24 24");
                star.setAttribute("class", "star-token");
                // Standard Star Path
                star.innerHTML = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
                cell.appendChild(star);
            }
        }

        // --- Drawing Logic ---

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 28; // Thicker, rounded paths
            const length = 90; 

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = thickness;
            ctx.strokeStyle = '#4E342E'; // Dark chocolate path
            
            // Add a subtle stroke shadow for depth inside the tile
            ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            const drawSegment = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length); // Top
                if (dir === 1) ctx.lineTo(cx + length, cy); // Right
                if (dir === 2) ctx.lineTo(cx, cy + length); // Bottom
                if (dir === 3) ctx.lineTo(cx - length, cy); // Left
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            
            // Apply rotation
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }

            // Center Hub to smooth connections
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2, 0, Math.PI * 2);
            ctx.fillStyle = '#4E342E';
            ctx.fill();
        }

        // --- Actions ---

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            
            // Prevent double clicking
            if(btn.innerText !== "Run") return;

            btn.innerText = "Solving...";
            
            const tiles = document.querySelectorAll('.tile');
            
            // Simulate pathfinding
            // We'll just animate a random path for visual flair
            const pathIndices = [0, 1, 2, 3, 4, 9, 14, 15, 16]; 
            
            let delay = 0;
            pathIndices.forEach((idx) => {
                setTimeout(() => {
                    const t = tiles[idx];
                    t.style.backgroundColor = '#D7CCC8'; // Warm solved color
                    t.style.transform = 'scale(1.05)';
                    setTimeout(() => { t.style.transform = 'scale(1)'; }, 150);
                }, delay);
                delay += 150;
            });

            setTimeout(() => {
                btn.innerText = "Done!";
                btn.style.backgroundColor = "#66BB6A"; // Success Green
                btn.style.boxShadow = "0 4px 0 #2E7D32";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.boxShadow = "";
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                    });
                }, 2000);
            }, delay + 400);
        }

        // Start
        initGame();

    </script>
</body>
</html>
