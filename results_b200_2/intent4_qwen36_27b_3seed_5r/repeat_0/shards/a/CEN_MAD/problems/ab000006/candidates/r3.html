<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    RESET & BASE 
  */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #111; 
    overflow: hidden;
    /* System font stack optimized for pixel-art feel */
    font-family: "Courier New", Courier, monospace;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 
    THE CANVAS 
    Centered "Game Boy" style window or full arcade screen.
    We use full screen here but rely on crisp pixel rendering.
  */
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* 
    CRT EFFECTS (REVISED)
    Removed heavy vignette. Added hard scanlines.
  */
  
  /* 1. Hard Scanlines */
  .scanlines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 2px,
      rgba(0,0,0,0.25) 2px,
      rgba(0,0,0,0.25) 4px
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
  }

  /* 2. Hard Rectangular Vignette (CRT Border) */
  .vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    box-shadow: inset 0px 0px 120px rgba(0,0,0,0.75);
    pointer-events: none;
    z-index: 11;
  }

  /* 3. Subtle Screen Flicker */
  @keyframes flicker {
    0% { opacity: 0.96; }
    5% { opacity: 0.93; }
    10% { opacity: 0.96; }
    15% { opacity: 0.99; }
    50% { opacity: 0.95; }
    80% { opacity: 0.92; }
    100% { opacity: 0.96; }
  }
  
  .screen-flicker {
    animation: flicker 0.2s infinite;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.01);
    pointer-events: none;
    z-index: 12;
  }

  /* 
    UI OVERLAY 
  */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; 
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* Align top */
    align-items: center;
    z-index: 20;
  }

  /* 
    TYPOGRAPHY 
    Strict pixel-art style using CSS shadows.
  */
  .retro-text {
    font-family: "Courier New", monospace; 
    font-weight: 900;
    text-transform: uppercase;
    color: #fff;
    /* Hard Pixel Shadow: 3px offset */
    text-shadow: 3px 3px 0px #000;
    letter-spacing: 2px;
  }

  /* 
    HIERARCHY:
    1. Title (Top Center)
    2. Instructions (Just below Title)
    3. [Canvas Skier] (Middle - Rendered in Canvas)
    4. Start Button (Bottom Center)
  */

  .title-container {
    margin-top: 10vh;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  h1.game-title {
    font-size: 4.5rem;
    line-height: 1;
    color: #fff;
    margin: 0;
    /* Double shadow for "sticker" depth */
    text-shadow: 
      0px 4px 0 #000,
      4px 4px 0 #000,
      -2px -2px 0 #666; /* Subtle highlight */
  }
  
  h1.game-title span {
    color: #FF3333; /* Matches Skier Jacket */
  }

  .instruction-text {
    font-size: 1.2rem;
    color: #FFD700; 
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 4px;
    opacity: 0.9;
    margin-top: 5px;
  }

  /* 
    BUTTON 
    Redesigned: Smaller, Win95 Bevel style, anchored bottom.
  */
  .start-container {
    position: absolute;
    bottom: 10vh; /* Anchored to bottom */
    width: 100%;
    pointer-events: auto; /* Re-enable clicks */
    text-align: center;
    display: flex;
    justify-content: center;
  }

  .start-btn {
    /* Palette: Matches Skier Jacket (#DD0000) */
    background-color: #DD0000;
    color: #fff;
    font-family: "Courier New", monospace;
    font-weight: 900;
    font-size: 1.2rem;
    letter-spacing: 1px;
    padding: 12px 24px; /* Reduced scale */
    cursor: pointer;
    
    /* Win95 Style Bevel */
    border-top: 4px solid #FF6666;
    border-left: 4px solid #FF6666;
    border-bottom: 4px solid #880000;
    border-right: 4px solid #880000;
    
    outline: none;
    transition: transform 0.05s;
    text-shadow: 2px 2px 0 #880000;
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
  }

  .start-btn:hover {
    background-color: #ee2222;
    border-top-color: #ff9999;
    border-left-color: #ff9999;
    transform: translateY(-2px);
    box-shadow: 0 8px 0 rgba(0,0,0,0.4);
  }

  .start-btn:active {
    transform: translateY(4px);
    background-color: #aa0000;
    border-top: 4px solid #880000;
    border-left: 4px solid #880000;
    border-bottom: 4px solid #FF6666;
    border-right: 4px solid #FF6666;
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  .blink {
    animation: blinker 1.5s linear infinite;
  }

  @keyframes blinker {
    50% { opacity: 0.6; }
  }

  .hidden {
    display: none !important;
  }

  /* Score HUD */
  #score-hud {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 1.5rem;
    color: #fff;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    display: none;
    z-index: 30;
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="screen-flicker"></div>

  <div id="ui-layer">
    
    <div class="title-container retro-text">
      <h1 class="game-title">SKI<span>FREE</span></h1>
      <div class="instruction-text">AVOID THE TREES</div>
    </div>

    <div class="start-container">
      <button class="start-btn blink" id="startBtn" onclick="startGame()">PRESS START</button>
    </div>

  </div>

  <div id="score-hud" class="retro-text">SCORE: 0</div>

<script>
/**
 * ENGINE & RENDERER
 * 320x240 Resolution for authentic retro pixel look.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Internal resolution
const WIDTH = 320;
const HEIGHT = 240;

// Palette (Refined for contrast)
const C_SKY_TOP = '#5577AA';
const C_SKY_BOT = '#99BBEE';
const C_SNOW = '#FFFFFF';
const C_TREE_TRUNK = '#553311';
const C_TREE_LEAF = '#115511';
const C_TREE_LEAF_L = '#227722';
const C_SKIER_RED = '#DD0000'; // Matches Button
const C_SKIER_SKIN = '#FFCCAA';
const C_SKIER_PANTS = '#111155';

// Game State
let gameState = 'MENU'; 
let frameCount = 0;
let score = 0;
let skierX = WIDTH / 2;
let skierY = 70; // Adjusted for better composition
let moveDir = 0;

// --- RENDERING HELPERS ---

function drawRect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// --- ASSET DRAWING ---

function drawSun(x, y) {
  ctx.fillStyle = '#FFFF88';
  // Pixelated Sun
  ctx.fillRect(x-4, y-4, 8, 8);
  ctx.fillRect(x-6, y-2, 12, 4);
  ctx.fillRect(x-2, y-6, 4, 12);
}

function drawTree(x, y, scale) {
  // scale: 1.0 (normal), 0.75 (distant)
  
  // Hard Shadow (Grounding)
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  // Shadow is slightly offset right and down
  ctx.fillRect(Math.floor(x - 2 * scale), Math.floor(y + 26 * scale), Math.floor(24 * scale), Math.floor(6 * scale));

  // Trunk
  drawRect(x + (6 * scale), y + (12 * scale), (8 * scale), (12 * scale), C_TREE_TRUNK);

  // Leaves - Bottom tier
  drawRect(x, y + (8 * scale), (20 * scale), (8 * scale), C_TREE_LEAF);
  drawRect(x + (2 * scale), y + (8 * scale), (16 * scale), (8 * scale), C_TREE_LEAF_L); 
  
  // Leaves - Middle tier
  drawRect(x + (2 * scale), y + (2 * scale), (16 * scale), (8 * scale), C_TREE_LEAF);
  drawRect(x + (4 * scale), y + (2 * scale), (12 * scale), (8 * scale), C_TREE_LEAF_L);
  
  // Leaves - Top tier
  drawRect(x + (4 * scale), y - (4 * scale), (12 * scale), (8 * scale), C_TREE_LEAF);
  
  // Snow caps
  ctx.fillStyle = '#FFF';
  ctx.fillRect(x + (4 * scale), y - (4 * scale), (4 * scale), (2 * scale));
  ctx.fillRect(x + (10 * scale), y - (2 * scale), (2 * scale), (2 * scale));
}

function drawSkier(x, y) {
  // Animation bob
  const bob = (Math.floor(frameCount / 8) % 2 === 0) ? 0 : 1;
  
  // Hard Shadow (Grounding)
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x - 4, y + 26, 20, 4);

  // Skis (Bottom)
  let skiOffset = 0;
  if (moveDir === -1) skiOffset = -2;
  if (moveDir === 1) skiOffset = 2;
  
  drawRect(x - 4 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Left Ski
  drawRect(x + 6 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Right Ski

  // Pants
  drawRect(x - 2 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);
  drawRect(x + 6 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);

  // Jacket
  drawRect(x - 4, y + 6 + bob, 12, 8, C_SKIER_RED);
  // Arms
  drawRect(x - 8, y + 6 + bob, 4, 8, C_SKIER_RED); // Left arm
  drawRect(x + 12, y + 6 + bob, 4, 8, C_SKIER_RED); // Right arm
  // Poles
  drawRect(x - 8, y + 10 + bob, 2, 12, '#AAA');
  drawRect(x + 14, y + 10 + bob, 2, 12, '#AAA');

  // Head
  drawRect(x - 2, y - 2 + bob, 8, 8, C_SKIER_SKIN);
  // Hat/Scarf
  drawRect(x - 2, y - 2 + bob, 8, 3, C_SKIER_RED);
  // Goggles
  drawRect(x - 2, y + 2 + bob, 8, 2, '#333');
}

// --- WORLD GENERATION ---

let trees = [];
const NUM_TREES = 10;

function initWorld() {
  trees = [];
  for(let i=0; i<NUM_TREES; i++) {
    spawnTree(true);
  }
}

function spawnTree(initial = false) {
  // Depth simulation: scale affects size and speed
  // 1.0 = close, 0.75 = far
  const isClose = Math.random() > 0.4;
  const scale = isClose ? 1.0 : 0.75;
  const speedMod = isClose ? 1.0 : 0.6;

  trees.push({
    x: Math.random() * (WIDTH - 30),
    y: initial ? Math.random() * (HEIGHT + 50) : -60,
    scale: scale,
    speedMod: speedMod
  });
}

// --- MAIN LOOP ---

function update() {
  frameCount++;

  if (gameState === 'PLAYING') {
    // Skier movement
    if (moveDir !== 0) {
      skierX += moveDir * 4; 
      // Boundaries
      if (skierX < 10) skierX = 10;
      if (skierX > WIDTH - 10) skierX = WIDTH - 10;
    }
    score++;
    
    // Update HUD
    if (frameCount % 10 === 0) {
      document.getElementById('score-hud').innerText = "SCORE: " + Math.floor(score/10);
    }

    // Move Trees
    trees.forEach(t => {
      t.y += 5 * t.speedMod; // Scroll speed
      if (t.y > HEIGHT + 50) {
        t.y = -60;
        t.x = Math.random() * (WIDTH - 30);
        // Randomize depth again on respawn
        const isClose = Math.random() > 0.4;
        t.scale = isClose ? 1.0 : 0.75;
        t.speedMod = isClose ? 1.0 : 0.6;
      }
    });
  } else {
    // Menu idle animation: Slow drift
    trees.forEach(t => {
      t.y += 1.5 * t.speedMod; 
      if (t.y > HEIGHT + 50) {
        t.y = -60;
        t.x = Math.random() * (WIDTH - 30);
      }
    });
  }
}

function drawBackground() {
  // Stepped Gradient Sky (Pixel Perfect)
  const skyHeight = 80;
  const stepHeight = 10;
  
  for(let y=0; y<skyHeight; y+=stepHeight) {
    let ratio = y / skyHeight;
    let r = Math.floor(85 + (153-85)*ratio);
    let g = Math.floor(119 + (187-119)*ratio);
    let b = Math.floor(170 + (238-170)*ratio);
    
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, WIDTH, stepHeight);
  }

  drawSun(260, 40);

  // Snow
  ctx.fillStyle = C_SNOW;
  ctx.fillRect(0, skyHeight, WIDTH, HEIGHT - skyHeight);
  
  // Horizon line
  ctx.fillStyle = '#DDEEFF';
  ctx.fillRect(0, skyHeight, WIDTH, 2);
}

function render() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  drawBackground();

  // Sort trees by Y for pseudo-depth
  trees.sort((a, b) => a.y - b.y);

  trees.forEach(t => {
    drawTree(t.x, t.y, t.scale);
  });

  // Draw Skier last
  drawSkier(skierX, skierY);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// --- INPUT & CONTROL ---

function startGame() {
  if (gameState === 'PLAYING') return;
  
  gameState = 'PLAYING';
  score = 0;
  
  // UI Updates
  document.getElementById('startBtn').classList.add('hidden');
  document.querySelector('.title-container').classList.add('hidden');
  document.getElementById('score-hud').style.display = 'block';
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    startGame();
  }
  if (e.key === 'ArrowLeft') moveDir = -1;
  if (e.key === 'ArrowRight') moveDir = 1;
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' && moveDir === -1) moveDir = 0;
  if (e.key === 'ArrowRight' && moveDir === 1) moveDir = 0;
});

// --- INITIALIZATION ---

// Set canvas resolution
canvas.width = WIDTH;
canvas.height = HEIGHT;

// Disable anti-aliasing
ctx.imageSmoothingEnabled = false;

// Start
initWorld();
loop();

</script>
</body>
</html>
