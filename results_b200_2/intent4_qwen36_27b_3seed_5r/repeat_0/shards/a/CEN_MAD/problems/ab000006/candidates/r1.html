<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiFree - Retro Edition</title>
<style>
  :root {
    --bg-color: #111;
    --screen-bg: #000;
    --ui-font: 'Courier New', monospace; /* Fallback, we draw pixel text on canvas */
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: var(--ui-font);
    user-select: none;
  }

  /* The Physical Monitor/Screen Container */
  #monitor {
    position: relative;
    width: 640px;
    height: 480px;
    background: #222;
    box-shadow: 
      0 0 0 15px #333,
      0 0 0 18px #111,
      0 30px 60px rgba(0,0,0,0.6);
    border-radius: 10px;
    overflow: hidden;
  }

  /* The Game Canvas - Scaled up via CSS */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated; /* The Holy Grail of retro scaling */
    image-rendering: crisp-edges;
  }

  /* CRT Scanlines Overlay */
  #scanlines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
    opacity: 0.8;
  }
  
  /* CRT Vignette & Curvature */
  #vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 11;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.7);
  }

  /* UI Overlay - Absolute positioned over canvas */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Let clicks pass through to buttons */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    /* Internal coordinate system matches canvas aspect ratio roughly */
    padding: 40px 20px 60px 20px; 
    box-sizing: border-box;
  }

  /* Typography - Pixelated via Text Shadow hack */
  .pixel-text {
    font-family: 'Courier New', monospace;
    font-weight: 900;
    text-transform: uppercase;
    color: #fff;
    /* Hard aliased shadow simulation */
    text-shadow: 
      4px 0 0 #000,
      -2px 0 0 #000,
      0 -2px 0 #000,
      0 4px 0 #000,
      4px 4px 0 #000;
  }

  .title-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    z-index: 20;
  }

  h1 {
    font-size: 56px;
    margin: 0;
    letter-spacing: 4px;
    color: #fff;
    line-height: 1;
  }

  h1 span {
    color: #FF4444;
  }

  .instructions {
    font-size: 18px;
    margin-top: 15px;
    color: #fff;
    letter-spacing: 2px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border: 2px solid #fff;
  }

  /* Footer Hint */
  .footer-hint {
    font-size: 16px;
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  /* The Beveled Pixel Button */
  .start-btn {
    pointer-events: auto;
    position: absolute;
    top: 45%; /* Position between title and skier */
    left: 50%;
    transform: translate(-50%, -50%);
    
    background-color: #cc0000;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 2px;
    padding: 15px 30px;
    border: none;
    cursor: pointer;
    
    /* The Classic 3D Bevel */
    border-top: 6px solid #ff6666;
    border-left: 6px solid #ff6666;
    border-bottom: 6px solid #880000;
    border-right: 6px solid #880000;
    
    outline: none;
    transition: all 0.1s;
    z-index: 20;
    text-shadow: 2px 2px 0 #880000;
  }

  .start-btn:hover {
    background-color: #e60000;
    border-top-color: #ff9999;
    border-left-color: #ff9999;
  }

  .start-btn:active {
    transform: translate(-50%, -44%); /* Physical press down */
    background-color: #aa0000;
    border-top: 6px solid #880000;
    border-left: 6px solid #880000;
    border-bottom: 6px solid #ff6666;
    border-right: 6px solid #ff6666;
  }

  /* Blinking animation for button */
  @keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0.8; }
    100% { opacity: 1; }
  }
  .blink {
    animation: blink 1s infinite;
  }

</style>
</head>
<body>

<div id="monitor">
  <!-- Internal resolution 320x240 for true pixel feel -->
  <canvas id="gameCanvas" width="320" height="240"></canvas>
  
  <div id="ui-layer">
    <div class="title-block pixel-text">
      <h1>Ski<span>Free</span></h1>
      <div class="instructions">AVOID THE TREES</div>
    </div>
    
    <button class="start-btn pixel-text blink" onclick="startGame()">START</button>
    
    <div class="footer-hint pixel-text">ARROWS TO MOVE</div>
  </div>

  <div id="scanlines"></div>
  <div id="vignette"></div>
</div>

<script>
/**
 * PIXEL ART ENGINE
 * Renders a 320x240 world. No external assets.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Disable anti-aliasing
ctx.imageSmoothingEnabled = false;

const WIDTH = 320;
const HEIGHT = 240;

// Palette
const C_SKY_TOP = '#5588CC';
const C_SKY_BOT = '#88BBEE';
const C_SNOW = '#FFFFFF';
const C_SNOW_DIRT = '#E8F0F8'; // For shading
const C_TREE_TRUNK = '#663311';
const C_TREE_LEAF = '#115511';
const C_TREE_LEAF_L = '#228822';
const C_SKIER_RED = '#DD0000';
const C_SKIER_SKIN = '#FFCCAA';
const C_SKIER_PANTS = '#111144';

// Game State
let gameState = 'MENU'; // MENU or PLAYING
let frameCount = 0;
let skierX = WIDTH / 2;
let skierY = 120;
let moveDir = 0;
let speed = 0;

// --- RENDERING HELPERS ---

function drawRect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// --- ASSET DRAWING ---

function drawSun(x, y) {
  // Pixelated circle (approximation)
  ctx.fillStyle = '#FFFF88';
  const r = 16;
  // Draw a simple 8x8 block sun scaled up
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawTree(x, y) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(x - 2, y + 24, 20, 6);

  // Trunk
  drawRect(x + 6, y + 12, 8, 12, C_TREE_TRUNK);

  // Leaves (Procedural Pixel Art)
  // Bottom tier
  drawRect(x, y + 8, 20, 8, C_TREE_LEAF);
  drawRect(x + 2, y + 8, 16, 8, C_TREE_LEAF_L); // Highlight
  // Middle tier
  drawRect(x + 2, y + 2, 16, 8, C_TREE_LEAF);
  drawRect(x + 4, y + 2, 12, 8, C_TREE_LEAF_L);
  // Top tier
  drawRect(x + 4, y - 4, 12, 8, C_TREE_LEAF);
  
  // Snow caps
  ctx.fillStyle = '#FFF';
  ctx.fillRect(x + 4, y - 4, 4, 2);
  ctx.fillRect(x + 10, y - 2, 2, 2);
}

function drawSkier(x, y) {
  const scale = 2;
  
  // Skier Animation Logic
  const bob = (Math.floor(frameCount / 10) % 2 === 0) ? 0 : 1;
  
  // Draw Skis (Bottom)
  let skiOffset = 0;
  if (moveDir === -1) skiOffset = -2;
  if (moveDir === 1) skiOffset = 2;
  
  drawRect(x - 4 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Left Ski
  drawRect(x + 6 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Right Ski

  // Pants
  drawRect(x - 2 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);
  drawRect(x + 6 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);

  // Jacket
  drawRect(x - 4, y + 6 + bob, 12, 8, C_SKIER_RED);
  // Arms
  drawRect(x - 8, y + 6 + bob, 4, 8, C_SKIER_RED); // Left arm
  drawRect(x + 12, y + 6 + bob, 4, 8, C_SKIER_RED); // Right arm
  // Poles
  drawRect(x - 8, y + 10 + bob, 2, 12, '#AAA');
  drawRect(x + 14, y + 10 + bob, 2, 12, '#AAA');

  // Head
  drawRect(x - 2, y - 2 + bob, 8, 8, C_SKIER_SKIN);
  // Hat/Scarf
  drawRect(x - 2, y - 2 + bob, 8, 3, C_SKIER_RED);
  // Goggles
  drawRect(x - 2, y + 2 + bob, 8, 2, '#333');
}

// --- WORLD GENERATION ---

// Trees array
let trees = [];
const NUM_TREES = 15;

function initWorld() {
  trees = [];
  for(let i=0; i<NUM_TREES; i++) {
    trees.push({
      x: Math.random() * WIDTH,
      y: Math.random() * HEIGHT,
      scale: 0.8 + Math.random() * 0.5 // Depth simulation
    });
  }
}

// --- MAIN LOOP ---

function update() {
  frameCount++;

  if (gameState === 'PLAYING') {
    // Skier movement
    if (moveDir !== 0) {
      skierX += moveDir * 2;
      // Boundaries
      if (skierX < 10) skierX = 10;
      if (skierX > WIDTH - 10) skierX = WIDTH - 10;
    }

    // Move Trees (Simulate skiing down)
    trees.forEach(t => {
      t.y += 3; // Scroll speed
      // Wrap around
      if (t.y > HEIGHT + 20) {
        t.y = -20;
        t.x = Math.random() * WIDTH;
      }
    });
  } else {
    // Menu idle animation: Skier gently bobs
    // Trees move slowly
    trees.forEach(t => {
      t.y += 0.5;
      if (t.y > HEIGHT + 20) {
        t.y = -20;
        t.x = Math.random() * WIDTH;
      }
    });
  }
}

function drawBackground() {
  // Stepped Gradient Sky (Simulating low color depth)
  const skyHeight = 80;
  const stepHeight = 10;
  
  for(let y=0; y<skyHeight; y+=stepHeight) {
    // Interpolate color roughly
    let ratio = y / skyHeight;
    // Simple banding
    let r = Math.floor(85 + (136-85)*ratio);
    let g = Math.floor(136 + (187-136)*ratio);
    let b = Math.floor(204 + (238-204)*ratio);
    
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, WIDTH, stepHeight);
  }

  // Sun
  drawSun(280, 40);

  // Snow
  ctx.fillStyle = C_SNOW;
  ctx.fillRect(0, skyHeight, WIDTH, HEIGHT - skyHeight);
  
  // Horizon line
  ctx.fillStyle = '#DDEEFF';
  ctx.fillRect(0, skyHeight, WIDTH, 2);
}

function render() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  drawBackground();

  // Sort trees by Y for pseudo-depth
  trees.sort((a, b) => a.y - b.y);

  trees.forEach(t => {
    drawTree(t.x, t.y);
  });

  drawSkier(skierX, skierY);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// --- INPUT & CONTROL ---

function startGame() {
  if (gameState === 'PLAYING') return;
  
  gameState = 'PLAYING';
  
  // UI Updates
  const btn = document.querySelector('.start-btn');
  btn.style.display = 'none';
  
  // Hide instructions to clean up view? 
  // Let's keep them but maybe fade them out (omitted for simplicity, keeping retro static feel)
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') moveDir = -1;
  if (e.key === 'ArrowRight') moveDir = 1;
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' && moveDir === -1) moveDir = 0;
  if (e.key === 'ArrowRight' && moveDir === 1) moveDir = 0;
});

// Start
initWorld();
loop();

</script>
</body>
</html>
