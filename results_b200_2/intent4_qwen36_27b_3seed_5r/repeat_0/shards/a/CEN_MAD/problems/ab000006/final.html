<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    RESET & BASE 
  */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #000; 
    overflow: hidden;
    /* Using a system monospace font as fallback, but styled heavily for pixel look */
    font-family: "Courier New", Courier, monospace;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 
    THE CANVAS 
    Full screen, but internally 320x240.
  */
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* 
    CRT EFFECTS (REVISED PER CRITIQUE)
  */
  
  /* 1. Scanlines - Opacity reduced to 10% as requested */
  .scanlines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 2px,
      rgba(0,0,0,0.1) 2px, /* Reduced from 0.25 */
      rgba(0,0,0,0.1) 4px
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
  }

  /* 2. Vignette REMOVED per critique */

  /* 3. Subtle Screen Flicker */
  @keyframes flicker {
    0% { opacity: 0.98; }
    50% { opacity: 1.0; }
    100% { opacity: 0.99; }
  }
  
  .screen-flicker {
    animation: flicker 0.15s infinite;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(18, 16, 16, 0);
    pointer-events: none;
    z-index: 12;
  }

  /* 
    UI OVERLAY 
    Centered composition for the Start Screen.
  */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; 
    display: flex;
    flex-direction: column;
    justify-content: center; /* Vertically Centered */
    align-items: center;
    z-index: 20;
  }

  /* 
    TYPOGRAPHY 
    Critique: Unify Typography.
    Using standard fonts but styled to look like 'Press Start 2P'
  */
  .retro-text {
    font-family: "Courier New", monospace; 
    font-weight: 900;
    text-transform: uppercase;
    color: #fff;
    letter-spacing: 2px;
  }

  /* 
    HIERARCHY & COMPOSITION (REVISED PER CRITIQUE)
    1. Title Cluster
    2. Instructions (On dark background)
    3. [Canvas Skier] (Middle)
    4. Start Button (Immediate Action)
  */

  .title-container {
    margin-bottom: 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 21;
  }

  /* Critique: Solid white fill with hard, offset red shadow for entire word */
  h1.game-title {
    font-size: 4.5rem;
    line-height: 1;
    color: #ffffff;
    margin: 0;
    /* The unified shadow effect */
    text-shadow: 4px 4px 0px #DD0000; 
    letter-spacing: 6px;
    /* Slight rotation for dynamic feel */
    transform: rotate(-2deg);
    margin-bottom: 10px;
  }
  
  /* Critique: Instructions on solid opaque dark background */
  .instruction-text {
    font-size: 1.1rem;
    color: #FFFFFF;
    background-color: #000000; /* Solid opaque black */
    padding: 6px 16px;
    border: 2px solid #fff;
    letter-spacing: 3px;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
  }

  /* 
    BUTTON (REVISED PER CRITIQUE)
    Chunky, 90-degree corners, bright red/yellow, thick black outline.
  */
  .start-container {
    margin-top: 30px; /* Space below the cluster */
    width: 100%;
    pointer-events: auto; /* Re-enable clicks */
    text-align: center;
    display: flex;
    justify-content: center;
    z-index: 22;
  }

  .start-btn {
    /* Palette: Bright Red Arcade Button */
    background-color: #FF0000;
    color: #FFFF00; /* Yellow Text */
    font-family: "Courier New", monospace;
    font-weight: 900;
    font-size: 1.5rem;
    letter-spacing: 2px;
    padding: 16px 32px; 
    
    /* 90 Degree Corners */
    border-radius: 0;
    
    /* Thick Black Outline */
    border: 4px solid #000000;
    
    /* Hard Stepped Drop Shadow */
    box-shadow: 6px 6px 0px #000000;
    
    cursor: pointer;
    outline: none;
    transition: transform 0.05s;
    text-shadow: 1px 1px 0px #000;
  }

  .start-btn:hover {
    background-color: #FF3333;
    transform: translateY(-2px);
    box-shadow: 8px 8px 0px #000000;
  }

  .start-btn:active {
    transform: translateY(4px);
    background-color: #CC0000;
    box-shadow: 2px 2px 0px #000000;
  }

  .blink {
    animation: blinker 1s linear infinite;
  }

  @keyframes blinker {
    50% { opacity: 0.5; }
  }

  .hidden {
    display: none !important;
  }

  /* Score HUD */
  #score-hud {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 1.5rem;
    color: #fff;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    display: none;
    z-index: 30;
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="scanlines"></div>
  <!-- Vignette removed -->
  <div class="screen-flicker"></div>

  <div id="ui-layer">
    
    <div class="title-container retro-text">
      <h1 class="game-title">SKIFREE</h1>
      <div class="instruction-text">AVOID THE TREES</div>
    </div>

    <div class="start-container">
      <button class="start-btn blink" id="startBtn" onclick="startGame()">PRESS START</button>
    </div>

  </div>

  <div id="score-hud" class="retro-text">SCORE: 0</div>

<script>
/**
 * ENGINE & RENDERER
 * 320x240 Resolution for authentic retro pixel look.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Internal resolution
const WIDTH = 320;
const HEIGHT = 240;

// Palette (Refined for contrast)
// Critique: Solid flat blue color for sky
const C_SKY = '#5588CC'; 
const C_SNOW = '#FFFFFF';
const C_TREE_TRUNK = '#553311';
const C_TREE_LEAF = '#115511';
const C_TREE_LEAF_L = '#227722';
const C_SKIER_RED = '#DD0000'; 
const C_SKIER_SKIN = '#FFCCAA';
const C_SKIER_PANTS = '#111155';

// Game State
let gameState = 'MENU'; 
let frameCount = 0;
let score = 0;
let skierX = WIDTH / 2;
let skierY = 110; // Positioned visually nicely in the snow
let moveDir = 0;

// Trail State
let trails = [];

// --- RENDERING HELPERS ---

function drawRect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// --- ASSET DRAWING ---

function drawSun(x, y) {
  ctx.fillStyle = '#FFFF88';
  // Pixelated Sun
  ctx.fillRect(x-4, y-4, 8, 8);
  ctx.fillRect(x-6, y-2, 12, 4);
  ctx.fillRect(x-2, y-6, 4, 12);
}

function drawTree(x, y, scale) {
  // scale: 1.0 (normal), 0.75 (distant)
  
  // Hard Shadow (Grounding)
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  // Shadow is slightly offset right and down
  ctx.fillRect(Math.floor(x - 2 * scale), Math.floor(y + 26 * scale), Math.floor(24 * scale), Math.floor(6 * scale));

  // Trunk
  drawRect(x + (6 * scale), y + (12 * scale), (8 * scale), (12 * scale), C_TREE_TRUNK);

  // Leaves - Bottom tier
  drawRect(x, y + (8 * scale), (20 * scale), (8 * scale), C_TREE_LEAF);
  drawRect(x + (2 * scale), y + (8 * scale), (16 * scale), (8 * scale), C_TREE_LEAF_L); 
  
  // Leaves - Middle tier
  drawRect(x + (2 * scale), y + (2 * scale), (16 * scale), (8 * scale), C_TREE_LEAF);
  drawRect(x + (4 * scale), y + (2 * scale), (12 * scale), (8 * scale), C_TREE_LEAF_L);
  
  // Leaves - Top tier
  drawRect(x + (4 * scale), y - (4 * scale), (12 * scale), (8 * scale), C_TREE_LEAF);
  
  // Snow caps
  ctx.fillStyle = '#FFF';
  ctx.fillRect(x + (4 * scale), y - (4 * scale), (4 * scale), (2 * scale));
  ctx.fillRect(x + (10 * scale), y - (2 * scale), (2 * scale), (2 * scale));
}

function drawSkier(x, y) {
  // Animation bob
  const bob = (Math.floor(frameCount / 8) % 2 === 0) ? 0 : 1;
  
  // Hard Shadow (Grounding)
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x - 4, y + 26, 20, 4);

  // Skis (Bottom)
  let skiOffset = 0;
  if (moveDir === -1) skiOffset = -2;
  if (moveDir === 1) skiOffset = 2;
  
  drawRect(x - 4 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Left Ski
  drawRect(x + 6 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Right Ski

  // Pants
  drawRect(x - 2 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);
  drawRect(x + 6 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);

  // Jacket
  drawRect(x - 4, y + 6 + bob, 12, 8, C_SKIER_RED);
  // Arms
  drawRect(x - 8, y + 6 + bob, 4, 8, C_SKIER_RED); // Left arm
  drawRect(x + 12, y + 6 + bob, 4, 8, C_SKIER_RED); // Right arm
  // Poles
  drawRect(x - 8, y + 10 + bob, 2, 12, '#AAA');
  drawRect(x + 14, y + 10 + bob, 2, 12, '#AAA');

  // Head
  drawRect(x - 2, y - 2 + bob, 8, 8, C_SKIER_SKIN);
  // Hat/Scarf
  drawRect(x - 2, y - 2 + bob, 8, 3, C_SKIER_RED);
  // Goggles
  drawRect(x - 2, y + 2 + bob, 8, 2, '#333');
}

// --- WORLD GENERATION ---

let trees = [];
const NUM_TREES = 14; 

function initWorld() {
  trees = [];
  for(let i=0; i<NUM_TREES; i++) {
    spawnTree(true);
  }
}

function spawnTree(initial = false) {
  // Depth simulation: scale affects size and speed
  const isClose = Math.random() > 0.4;
  const scale = isClose ? 1.0 : 0.75;
  const speedMod = isClose ? 1.0 : 0.6;

  trees.push({
    x: Math.random() * (WIDTH - 30),
    y: initial ? Math.random() * (HEIGHT + 50) : -60,
    scale: scale,
    speedMod: speedMod
  });
}

// --- TRAIL SYSTEM ---
function updateTrails() {
  if (gameState === 'PLAYING') {
    trails.push({
      x: skierX,
      y: skierY + 24,
      age: 0
    });
    
    if (trails.length > 30) trails.shift();
  }
}

function drawTrails() {
  if (trails.length < 2) return;

  ctx.fillStyle = '#DDDDDD'; 
  
  for (let i = 0; i < trails.length; i++) {
    let t = trails[i];
    t.y += 5; 
    t.age++;
    
    if (t.y < HEIGHT) {
      ctx.fillRect(Math.floor(t.x - 1), Math.floor(t.y), 2, 2);
      ctx.fillRect(Math.floor(t.x + 3), Math.floor(t.y), 2, 2); 
    }
  }
}

// --- MAIN LOOP ---

function update() {
  frameCount++;

  if (gameState === 'PLAYING') {
    if (moveDir !== 0) {
      skierX += moveDir * 4; 
      if (skierX < 10) skierX = 10;
      if (skierX > WIDTH - 10) skierX = WIDTH - 10;
    }
    score++;
    
    if (frameCount % 10 === 0) {
      document.getElementById('score-hud').innerText = "SCORE: " + Math.floor(score/10);
    }
    
    updateTrails();
  }

  // Move Trees
  trees.forEach(t => {
    let speed = (gameState === 'PLAYING') ? 5 : 1.5;
    t.y += speed * t.speedMod; 
    
    if (t.y > HEIGHT + 50) {
      t.y = -60;
      t.x = Math.random() * (WIDTH - 30);
      const isClose = Math.random() > 0.4;
      t.scale = isClose ? 1.0 : 0.75;
      t.speedMod = isClose ? 1.0 : 0.6;
    }
  });
}

function drawBackground() {
  // Critique: Solid flat blue color.
  const skyHeight = 80;
  
  ctx.fillStyle = C_SKY;
  ctx.fillRect(0, 0, WIDTH, skyHeight);

  drawSun(260, 40);

  // Snow
  ctx.fillStyle = C_SNOW;
  ctx.fillRect(0, skyHeight, WIDTH, HEIGHT - skyHeight);
  
  // Horizon line
  ctx.fillStyle = '#DDEEFF';
  ctx.fillRect(0, skyHeight, WIDTH, 2);
}

function render() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  drawBackground();
  
  drawTrails();

  // Sort trees by Y for pseudo-depth
  trees.sort((a, b) => a.y - b.y);

  trees.forEach(t => {
    drawTree(t.x, t.y, t.scale);
  });

  // Draw Skier last
  drawSkier(skierX, skierY);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// --- INPUT & CONTROL ---

function startGame() {
  if (gameState === 'PLAYING') return;
  
  gameState = 'PLAYING';
  score = 0;
  
  // UI Updates
  document.getElementById('startBtn').classList.add('hidden');
  document.querySelector('.title-container').classList.add('hidden');
  document.getElementById('score-hud').style.display = 'block';
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    startGame();
  }
  if (e.key === 'ArrowLeft') moveDir = -1;
  if (e.key === 'ArrowRight') moveDir = 1;
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' && moveDir === -1) moveDir = 0;
  if (e.key === 'ArrowRight' && moveDir === 1) moveDir = 0;
});

// --- INITIALIZATION ---

// Set canvas resolution
canvas.width = WIDTH;
canvas.height = HEIGHT;

// Disable anti-aliasing
ctx.imageSmoothingEnabled = false;

// Start
initWorld();
loop();

</script>
</body>
</html>
