<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    RESET & BASE 
  */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #000; 
    overflow: hidden;
    /* Fallback to monospace, but we define a custom pixel font below */
    font-family: 'PixelFont', "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 
    CUSTOM PIXEL FONT GENERATION
    Using an inline SVG data URI to create a true 8-bit font without network requests.
    This maps standard ASCII characters to 5x7 pixel grids.
  */
  @font-face {
    font-family: 'PixelFont';
    src: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="0" y="90" font-size="90" font-weight="bold">ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?/</text></svg>') format('svg');
    /* Note: The SVG above is a fallback. The real magic is the canvas rendering logic 
       or using a system bitmap font. Since we can't load external files, we rely on 
       CSS pixelation of standard fonts to simulate this, or just use the canvas 
       drawing for UI if we wanted to be extreme. 
       However, for this implementation, we will use 'Courier New' with heavy pixelation 
       hacks to ensure it looks blocky. */
  }

  /* 
    THE CANVAS 
    Full screen, but internally 320x240.
  */
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* 
    CRT EFFECTS (REVISED)
    Replaced soft blur with hard scanlines and reduced vignette.
  */
  
  /* 1. Hard Scanlines (Simulates CRT phosphors) */
  .scanlines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 2px,
      rgba(0,0,0,0.25) 2px,
      rgba(0,0,0,0.25) 4px
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
  }

  /* 2. Hard Rectangular Vignette (CRT Border) */
  .vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    box-shadow: inset 0px 0px 100px rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 11;
  }

  /* 3. Subtle Screen Flicker */
  @keyframes flicker {
    0% { opacity: 0.97; }
    50% { opacity: 1.0; }
    100% { opacity: 0.98; }
  }
  
  .screen-flicker {
    animation: flicker 0.1s infinite;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(18, 16, 16, 0);
    pointer-events: none;
    z-index: 12;
  }

  /* 
    UI OVERLAY 
    Centered composition for the Start Screen.
  */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; 
    display: flex;
    flex-direction: column;
    justify-content: center; /* Vertically Centered */
    align-items: center;
    z-index: 20;
  }

  /* 
    TYPOGRAPHY 
    Strict pixel-art style using CSS shadows.
  */
  .retro-text {
    font-family: "Courier New", monospace; 
    font-weight: 900;
    text-transform: uppercase;
    color: #fff;
    /* Hard Pixel Shadow: 2px offset for that crisp look */
    text-shadow: 2px 2px 0px #000;
    letter-spacing: 1px;
  }

  /* 
    HIERARCHY:
    1. Title (Top Center)
    2. Instructions (Below Title)
    3. [Canvas Skier] (Middle - Rendered in Canvas)
    4. Start Button (Center - Below Skier)
  */

  .title-container {
    /* Push up slightly to make room for the button below */
    margin-top: -15vh; 
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 21;
  }

  h1.game-title {
    font-size: 5rem;
    line-height: 0.9;
    color: #fff;
    margin: 0;
    /* Double shadow for "sticker" depth */
    text-shadow: 
      0px 4px 0 #000,
      4px 4px 0 #000,
      -2px -2px 0 #555; /* Subtle highlight */
    letter-spacing: 4px;
  }
  
  h1.game-title span {
    color: #FF3333; /* Matches Skier Jacket */
  }

  .instruction-text {
    font-size: 1.2rem;
    color: #FFD700; /* Bright Yellow for contrast */
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
    opacity: 1;
    margin-top: 5px;
    background: rgba(0,0,0,0.3); /* Subtle backing for readability */
    padding: 4px 8px;
  }

  /* 
    BUTTON (REVISED)
    Relocated to center.
    Style: High-contrast Cyan, Hard Pixel Bevel.
  */
  .start-container {
    position: absolute;
    top: 65%; /* Positioned specifically below the skier */
    width: 100%;
    pointer-events: auto; /* Re-enable clicks */
    text-align: center;
    display: flex;
    justify-content: center;
    z-index: 22;
  }

  .start-btn {
    /* Palette: High Contrast Cyan (#00FFFF) */
    background-color: #00CCCC;
    color: #000; /* Black text for max contrast on cyan */
    font-family: "Courier New", monospace;
    font-weight: 900;
    font-size: 1.5rem;
    letter-spacing: 2px;
    padding: 14px 28px; 
    cursor: pointer;
    
    /* Pixel Art Bevel using Borders */
    border-top: 6px solid #FFFFFF;
    border-left: 6px solid #FFFFFF;
    border-bottom: 6px solid #006666;
    border-right: 6px solid #006666;
    
    /* Hard Stepped Drop Shadow */
    box-shadow: 6px 6px 0px #000000;
    
    outline: none;
    transition: transform 0.1s;
    text-shadow: none;
  }

  .start-btn:hover {
    background-color: #66FFFF;
    transform: translateY(-2px);
    box-shadow: 8px 8px 0px #000000;
  }

  .start-btn:active {
    transform: translateY(4px);
    background-color: #00AAAA;
    /* Invert bevel on press */
    border-top: 6px solid #006666;
    border-left: 6px solid #006666;
    border-bottom: 6px solid #FFFFFF;
    border-right: 6px solid #FFFFFF;
    box-shadow: 2px 2px 0px #000000;
  }

  .blink {
    animation: blinker 1.2s linear infinite;
  }

  @keyframes blinker {
    50% { opacity: 0.7; }
  }

  .hidden {
    display: none !important;
  }

  /* Score HUD */
  #score-hud {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 1.5rem;
    color: #fff;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    display: none;
    z-index: 30;
  }

</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="screen-flicker"></div>

  <div id="ui-layer">
    
    <div class="title-container retro-text">
      <h1 class="game-title">SKI<span>FREE</span></h1>
      <div class="instruction-text">AVOID THE TREES</div>
    </div>

    <div class="start-container">
      <button class="start-btn blink" id="startBtn" onclick="startGame()">PRESS START</button>
    </div>

  </div>

  <div id="score-hud" class="retro-text">SCORE: 0</div>

<script>
/**
 * ENGINE & RENDERER
 * 320x240 Resolution for authentic retro pixel look.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Internal resolution
const WIDTH = 320;
const HEIGHT = 240;

// Palette (Refined for contrast)
const C_SKY_TOP = '#446699';
const C_SKY_BOT = '#88AADD';
const C_SNOW = '#FFFFFF';
const C_TREE_TRUNK = '#553311';
const C_TREE_LEAF = '#115511';
const C_TREE_LEAF_L = '#227722';
const C_SKIER_RED = '#DD0000'; 
const C_SKIER_SKIN = '#FFCCAA';
const C_SKIER_PANTS = '#111155';

// Game State
let gameState = 'MENU'; 
let frameCount = 0;
let score = 0;
let skierX = WIDTH / 2;
let skierY = 100; // Moved slightly lower to balance composition
let moveDir = 0;

// Trail State
let trails = [];

// --- RENDERING HELPERS ---

function drawRect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// --- ASSET DRAWING ---

function drawSun(x, y) {
  ctx.fillStyle = '#FFFF88';
  // Pixelated Sun
  ctx.fillRect(x-4, y-4, 8, 8);
  ctx.fillRect(x-6, y-2, 12, 4);
  ctx.fillRect(x-2, y-6, 4, 12);
}

function drawTree(x, y, scale) {
  // scale: 1.0 (normal), 0.75 (distant)
  
  // Hard Shadow (Grounding)
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  // Shadow is slightly offset right and down
  ctx.fillRect(Math.floor(x - 2 * scale), Math.floor(y + 26 * scale), Math.floor(24 * scale), Math.floor(6 * scale));

  // Trunk
  drawRect(x + (6 * scale), y + (12 * scale), (8 * scale), (12 * scale), C_TREE_TRUNK);

  // Leaves - Bottom tier
  drawRect(x, y + (8 * scale), (20 * scale), (8 * scale), C_TREE_LEAF);
  drawRect(x + (2 * scale), y + (8 * scale), (16 * scale), (8 * scale), C_TREE_LEAF_L); 
  
  // Leaves - Middle tier
  drawRect(x + (2 * scale), y + (2 * scale), (16 * scale), (8 * scale), C_TREE_LEAF);
  drawRect(x + (4 * scale), y + (2 * scale), (12 * scale), (8 * scale), C_TREE_LEAF_L);
  
  // Leaves - Top tier
  drawRect(x + (4 * scale), y - (4 * scale), (12 * scale), (8 * scale), C_TREE_LEAF);
  
  // Snow caps
  ctx.fillStyle = '#FFF';
  ctx.fillRect(x + (4 * scale), y - (4 * scale), (4 * scale), (2 * scale));
  ctx.fillRect(x + (10 * scale), y - (2 * scale), (2 * scale), (2 * scale));
}

function drawSkier(x, y) {
  // Animation bob
  const bob = (Math.floor(frameCount / 8) % 2 === 0) ? 0 : 1;
  
  // Hard Shadow (Grounding)
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x - 4, y + 26, 20, 4);

  // Skis (Bottom)
  let skiOffset = 0;
  if (moveDir === -1) skiOffset = -2;
  if (moveDir === 1) skiOffset = 2;
  
  drawRect(x - 4 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Left Ski
  drawRect(x + 6 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Right Ski

  // Pants
  drawRect(x - 2 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);
  drawRect(x + 6 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);

  // Jacket
  drawRect(x - 4, y + 6 + bob, 12, 8, C_SKIER_RED);
  // Arms
  drawRect(x - 8, y + 6 + bob, 4, 8, C_SKIER_RED); // Left arm
  drawRect(x + 12, y + 6 + bob, 4, 8, C_SKIER_RED); // Right arm
  // Poles
  drawRect(x - 8, y + 10 + bob, 2, 12, '#AAA');
  drawRect(x + 14, y + 10 + bob, 2, 12, '#AAA');

  // Head
  drawRect(x - 2, y - 2 + bob, 8, 8, C_SKIER_SKIN);
  // Hat/Scarf
  drawRect(x - 2, y - 2 + bob, 8, 3, C_SKIER_RED);
  // Goggles
  drawRect(x - 2, y + 2 + bob, 8, 2, '#333');
}

// --- WORLD GENERATION ---

let trees = [];
const NUM_TREES = 14; // Increased density

function initWorld() {
  trees = [];
  for(let i=0; i<NUM_TREES; i++) {
    spawnTree(true);
  }
}

function spawnTree(initial = false) {
  // Depth simulation: scale affects size and speed
  // 1.0 = close, 0.75 = far
  const isClose = Math.random() > 0.4;
  const scale = isClose ? 1.0 : 0.75;
  const speedMod = isClose ? 1.0 : 0.6;

  trees.push({
    x: Math.random() * (WIDTH - 30),
    y: initial ? Math.random() * (HEIGHT + 50) : -60,
    scale: scale,
    speedMod: speedMod
  });
}

// --- TRAIL SYSTEM ---
// Adds visual density behind the skier
function updateTrails() {
  if (gameState === 'PLAYING') {
    // Add new trail segment
    trails.push({
      x: skierX,
      y: skierY + 24,
      age: 0
    });
    
    // Limit trail length
    if (trails.length > 30) trails.shift();
  }
}

function drawTrails() {
  if (trails.length < 2) return;

  ctx.fillStyle = '#DDDDDD'; // Slightly darker than pure white snow
  
  for (let i = 0; i < trails.length; i++) {
    let t = trails[i];
    // Age logic: trails move down with the world scroll
    t.y += 5; 
    t.age++;
    
    // Fade out or draw
    if (t.y < HEIGHT) {
      ctx.fillRect(Math.floor(t.x - 1), Math.floor(t.y), 2, 2);
      ctx.fillRect(Math.floor(t.x + 3), Math.floor(t.y), 2, 2); // Two tracks
    }
  }
}

// --- MAIN LOOP ---

function update() {
  frameCount++;

  if (gameState === 'PLAYING') {
    // Skier movement
    if (moveDir !== 0) {
      skierX += moveDir * 4; 
      // Boundaries
      if (skierX < 10) skierX = 10;
      if (skierX > WIDTH - 10) skierX = WIDTH - 10;
    }
    score++;
    
    // Update HUD
    if (frameCount % 10 === 0) {
      document.getElementById('score-hud').innerText = "SCORE: " + Math.floor(score/10);
    }
    
    updateTrails();
  }

  // Move Trees
  trees.forEach(t => {
    // In menu, trees move slower
    let speed = (gameState === 'PLAYING') ? 5 : 1.5;
    t.y += speed * t.speedMod; 
    
    if (t.y > HEIGHT + 50) {
      t.y = -60;
      t.x = Math.random() * (WIDTH - 30);
      // Randomize depth again on respawn
      const isClose = Math.random() > 0.4;
      t.scale = isClose ? 1.0 : 0.75;
      t.speedMod = isClose ? 1.0 : 0.6;
    }
  });
}

function drawBackground() {
  // Stepped Gradient Sky (Pixel Perfect)
  // Instead of smooth linear gradient, we draw horizontal bands.
  const skyHeight = 80;
  const stepHeight = 8; // 10 bands
  
  for(let y=0; y<skyHeight; y+=stepHeight) {
    let ratio = y / skyHeight;
    // Interpolate colors manually for the bands
    let r = Math.floor(68 + (136-68)*ratio);
    let g = Math.floor(102 + (170-102)*ratio);
    let b = Math.floor(153 + (221-153)*ratio);
    
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, WIDTH, stepHeight);
  }

  drawSun(260, 40);

  // Snow
  ctx.fillStyle = C_SNOW;
  ctx.fillRect(0, skyHeight, WIDTH, HEIGHT - skyHeight);
  
  // Horizon line
  ctx.fillStyle = '#DDEEFF';
  ctx.fillRect(0, skyHeight, WIDTH, 2);
}

function render() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  drawBackground();
  
  // Draw Trails (Behind trees and skier)
  drawTrails();

  // Sort trees by Y for pseudo-depth
  trees.sort((a, b) => a.y - b.y);

  trees.forEach(t => {
    drawTree(t.x, t.y, t.scale);
  });

  // Draw Skier last
  drawSkier(skierX, skierY);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// --- INPUT & CONTROL ---

function startGame() {
  if (gameState === 'PLAYING') return;
  
  gameState = 'PLAYING';
  score = 0;
  
  // UI Updates
  document.getElementById('startBtn').classList.add('hidden');
  document.querySelector('.title-container').classList.add('hidden');
  document.getElementById('score-hud').style.display = 'block';
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    startGame();
  }
  if (e.key === 'ArrowLeft') moveDir = -1;
  if (e.key === 'ArrowRight') moveDir = 1;
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' && moveDir === -1) moveDir = 0;
  if (e.key === 'ArrowRight' && moveDir === 1) moveDir = 0;
});

// --- INITIALIZATION ---

// Set canvas resolution
canvas.width = WIDTH;
canvas.height = HEIGHT;

// Disable anti-aliasing
ctx.imageSmoothingEnabled = false;

// Start
initWorld();
loop();

</script>
</body>
</html>
