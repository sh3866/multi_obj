<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkiFree - Retro Edition</title>
<style>
  /* 
    RESET & BASE 
    Removing all modern UI containers. Full screen immersive arcade.
  */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #050505; /* Deep black outside the "screen" */
    overflow: hidden;
    font-family: 'Courier New', monospace; /* Fallback */
    user-select: none;
    -webkit-user-select: none;
  }

  /* 
    THE CANVAS 
    This is the entire world. No divs, no frames.
  */
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    /* CRITICAL: Keeps pixels sharp when scaling up */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* 
    CRT & VINTAGE EFFECTS
    Applied directly over the full screen canvas.
  */
  
  /* 1. Scanlines */
  .scanlines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(255,255,255,0) 2px,
      rgba(0,0,0,0.2) 2px,
      rgba(0,0,0,0.2) 4px
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 10;
  }

  /* 2. Vignette & CRT Glow */
  .vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
    box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 11;
  }

  /* 3. Subtle Screen Flicker Animation */
  @keyframes flicker {
    0% { opacity: 0.97; }
    5% { opacity: 0.95; }
    10% { opacity: 0.9; }
    15% { opacity: 0.95; }
    20% { opacity: 0.99; }
    50% { opacity: 0.95; }
    80% { opacity: 0.9; }
    100% { opacity: 0.97; }
  }
  
  .screen-flicker {
    animation: flicker 0.15s infinite;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.02);
    pointer-events: none;
    z-index: 12;
  }

  /* 
    UI OVERLAY 
    Strict vertical hierarchy. 
    No containers, just absolute positioning relative to the screen.
  */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Allow clicks to pass through to canvas if needed */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
  }

  /* 
    TYPOGRAPHY 
    Hard pixel shadows, bold, uppercase.
  */
  .retro-text {
    font-family: 'Courier New', monospace; /* Using system font as bitmap substitute */
    font-weight: 900;
    text-transform: uppercase;
    color: #fff;
    /* The "Pixel Shadow" effect */
    text-shadow: 4px 4px 0px #000;
    letter-spacing: 2px;
  }

  /* 
    HIERARCHY:
    1. Title (Top)
    2. Instructions (Middle-Top)
    3. [Canvas Skier] (Middle-Bottom - Rendered in Canvas)
    4. Start Button (Bottom)
  */

  .title-container {
    margin-top: 15vh;
    text-align: center;
  }

  h1.game-title {
    font-size: 5rem;
    line-height: 1;
    color: #fff;
    margin: 0;
    /* Specific retro font styling */
    font-family: "Courier New", monospace; 
    /* Double shadow for depth */
    text-shadow: 
      0px 4px 0 #000,
      4px 4px 0 #000,
      -2px -2px 0 #555; /* Highlight edge */
  }
  
  h1.game-title span {
    color: #FF3333;
  }

  .instruction-text {
    font-size: 1.2rem;
    margin-top: 1rem;
    color: #FFD700; /* Gold for importance */
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 4px;
    opacity: 0.9;
  }

  /* 
    BUTTON 
    Chunky, bevelled, pixel-art style.
  */
  .start-container {
    margin-bottom: 15vh;
    pointer-events: auto; /* Re-enable clicks */
    text-align: center;
  }

  .start-btn {
    background-color: #cc0000;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-weight: 900;
    font-size: 1.5rem;
    letter-spacing: 2px;
    padding: 15px 40px;
    border: none;
    cursor: pointer;
    
    /* The 3D Bevel */
    border-top: 6px solid #ff6666;
    border-left: 6px solid #ff6666;
    border-bottom: 6px solid #660000;
    border-right: 6px solid #660000;
    
    outline: none;
    transition: transform 0.05s;
    text-shadow: 2px 2px 0 #660000;
    box-shadow: 0 10px 0 rgba(0,0,0,0.5);
  }

  .start-btn:hover {
    background-color: #e60000;
    border-top-color: #ff9999;
    border-left-color: #ff9999;
    transform: translateY(-2px);
    box-shadow: 0 12px 0 rgba(0,0,0,0.5);
  }

  .start-btn:active {
    transform: translateY(4px);
    background-color: #aa0000;
    border-top: 6px solid #660000;
    border-left: 6px solid #660000;
    border-bottom: 6px solid #ff6666;
    border-right: 6px solid #ff6666;
    box-shadow: 0 2px 0 rgba(0,0,0,0.5);
  }

  /* Blinking prompt */
  .blink {
    animation: blinker 1s linear infinite;
  }

  @keyframes blinker {
    50% { opacity: 0.3; }
  }

  /* Hide UI when playing */
  .hidden {
    display: none !important;
  }

  /* Score HUD (Hidden initially) */
  #score-hud {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 1.5rem;
    color: #fff;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
    display: none;
    z-index: 30;
  }

</style>
</head>
<body>

  <!-- The Game Canvas (Full Screen) -->
  <canvas id="gameCanvas"></canvas>

  <!-- CRT Effects -->
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="screen-flicker"></div>

  <!-- UI Layer -->
  <div id="ui-layer">
    
    <!-- Top: Title -->
    <div class="title-container retro-text">
      <h1 class="game-title">SKI<span>FREE</span></h1>
      <div class="instruction-text">AVOID THE TREES</div>
    </div>

    <!-- Bottom: Start Button -->
    <div class="start-container">
      <button class="start-btn blink" id="startBtn" onclick="startGame()">PRESS SPACE TO START</button>
    </div>

  </div>

  <div id="score-hud" class="retro-text">SCORE: 0</div>

<script>
/**
 * ENGINE & RENDERER
 * Renders at 320x240, scaled up by CSS for authentic pixel look.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Internal resolution
const WIDTH = 320;
const HEIGHT = 240;

// Palette
const C_SKY_TOP = '#446699';
const C_SKY_BOT = '#88AAFF';
const C_SNOW = '#FFFFFF';
const C_SNOW_DIRT = '#E0E8F0'; // For shading
const C_TREE_TRUNK = '#663311';
const C_TREE_LEAF = '#115511';
const C_TREE_LEAF_L = '#228822';
const C_SKIER_RED = '#DD0000';
const C_SKIER_SKIN = '#FFCCAA';
const C_SKIER_PANTS = '#111144';

// Game State
let gameState = 'MENU'; // MENU or PLAYING
let frameCount = 0;
let score = 0;
let skierX = WIDTH / 2;
let skierY = 60; // Positioned higher up for "slope" feel
let moveDir = 0;

// --- RENDERING HELPERS ---

function drawRect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// --- ASSET DRAWING ---

function drawSun(x, y) {
  ctx.fillStyle = '#FFFF88';
  // 8x8 block sun
  ctx.fillRect(x-4, y-4, 8, 8);
  ctx.fillRect(x-6, y-2, 12, 4);
  ctx.fillRect(x-2, y-6, 4, 12);
}

function drawTree(x, y) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(x - 2, y + 24, 20, 6);

  // Trunk
  drawRect(x + 6, y + 12, 8, 12, C_TREE_TRUNK);

  // Leaves
  // Bottom tier
  drawRect(x, y + 8, 20, 8, C_TREE_LEAF);
  drawRect(x + 2, y + 8, 16, 8, C_TREE_LEAF_L); 
  // Middle tier
  drawRect(x + 2, y + 2, 16, 8, C_TREE_LEAF);
  drawRect(x + 4, y + 2, 12, 8, C_TREE_LEAF_L);
  // Top tier
  drawRect(x + 4, y - 4, 12, 8, C_TREE_LEAF);
  
  // Snow caps
  ctx.fillStyle = '#FFF';
  ctx.fillRect(x + 4, y - 4, 4, 2);
  ctx.fillRect(x + 10, y - 2, 2, 2);
}

function drawSkier(x, y) {
  // Animation bob
  const bob = (Math.floor(frameCount / 8) % 2 === 0) ? 0 : 1;
  
  // Skis (Bottom)
  let skiOffset = 0;
  if (moveDir === -1) skiOffset = -2;
  if (moveDir === 1) skiOffset = 2;
  
  drawRect(x - 4 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Left Ski
  drawRect(x + 6 + skiOffset, y + 22 + bob, 8, 2, '#333'); // Right Ski

  // Pants
  drawRect(x - 2 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);
  drawRect(x + 6 + skiOffset, y + 14 + bob, 4, 8, C_SKIER_PANTS);

  // Jacket
  drawRect(x - 4, y + 6 + bob, 12, 8, C_SKIER_RED);
  // Arms
  drawRect(x - 8, y + 6 + bob, 4, 8, C_SKIER_RED); // Left arm
  drawRect(x + 12, y + 6 + bob, 4, 8, C_SKIER_RED); // Right arm
  // Poles
  drawRect(x - 8, y + 10 + bob, 2, 12, '#AAA');
  drawRect(x + 14, y + 10 + bob, 2, 12, '#AAA');

  // Head
  drawRect(x - 2, y - 2 + bob, 8, 8, C_SKIER_SKIN);
  // Hat/Scarf
  drawRect(x - 2, y - 2 + bob, 8, 3, C_SKIER_RED);
  // Goggles
  drawRect(x - 2, y + 2 + bob, 8, 2, '#333');
}

// --- WORLD GENERATION ---

let trees = [];
const NUM_TREES = 12; // Reduced density for isolation feel

function initWorld() {
  trees = [];
  for(let i=0; i<NUM_TREES; i++) {
    spawnTree(true);
  }
}

function spawnTree(initial = false) {
  trees.push({
    x: Math.random() * (WIDTH - 20),
    y: initial ? Math.random() * HEIGHT : -40,
    speedMod: 0.8 + Math.random() * 0.4 // Slight variance in speed for depth
  });
}

// --- MAIN LOOP ---

function update() {
  frameCount++;

  if (gameState === 'PLAYING') {
    // Skier movement
    if (moveDir !== 0) {
      skierX += moveDir * 3; // Faster movement
      // Boundaries
      if (skierX < 10) skierX = 10;
      if (skierX > WIDTH - 10) skierX = WIDTH - 10;
    }
    score++;
    
    // Update HUD
    if (frameCount % 10 === 0) {
      document.getElementById('score-hud').innerText = "SCORE: " + Math.floor(score/10);
    }

    // Move Trees (Simulate skiing down)
    trees.forEach(t => {
      t.y += 4 * t.speedMod; // Scroll speed
      
      // Simple Collision Check
      // Skier hitbox is roughly x-4 to x+8, y to y+24
      // Tree hitbox is roughly x to x+20, y-4 to y+24
      if (
        skierX + 4 > t.x && 
        skierX - 4 < t.x + 20 &&
        skierY + 24 > t.y - 4 &&
        skierY < t.y + 24
      ) {
        // Collision!
        // Reset for now
        score = 0;
        moveDir = 0;
      }

      // Wrap around
      if (t.y > HEIGHT + 40) {
        t.y = -40;
        t.x = Math.random() * (WIDTH - 20);
      }
    });
  } else {
    // Menu idle animation: 
    // Trees move slowly to show life, skier stays put but bobs
    trees.forEach(t => {
      t.y += 1; // Slow idle scroll
      if (t.y > HEIGHT + 40) {
        t.y = -40;
        t.x = Math.random() * (WIDTH - 20);
      }
    });
  }
}

function drawBackground() {
  // Stepped Gradient Sky
  const skyHeight = 80;
  const stepHeight = 10;
  
  for(let y=0; y<skyHeight; y+=stepHeight) {
    let ratio = y / skyHeight;
    let r = Math.floor(68 + (136-68)*ratio);
    let g = Math.floor(102 + (170-102)*ratio);
    let b = Math.floor(153 + (255-153)*ratio);
    
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, WIDTH, stepHeight);
  }

  // Sun
  drawSun(260, 40);

  // Snow
  ctx.fillStyle = C_SNOW;
  ctx.fillRect(0, skyHeight, WIDTH, HEIGHT - skyHeight);
  
  // Horizon line (Depth cue)
  ctx.fillStyle = '#DDEEFF';
  ctx.fillRect(0, skyHeight, WIDTH, 2);
}

function render() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  drawBackground();

  // Sort trees by Y for pseudo-depth
  trees.sort((a, b) => a.y - b.y);

  trees.forEach(t => {
    drawTree(t.x, t.y);
  });

  // Draw Skier last (always on top in menu, or top in game for this simple view)
  drawSkier(skierX, skierY);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// --- INPUT & CONTROL ---

function startGame() {
  if (gameState === 'PLAYING') return;
  
  gameState = 'PLAYING';
  score = 0;
  
  // UI Updates
  document.getElementById('startBtn').classList.add('hidden');
  document.querySelector('.title-container').classList.add('hidden');
  document.getElementById('score-hud').style.display = 'block';
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    startGame();
  }
  if (e.key === 'ArrowLeft') moveDir = -1;
  if (e.key === 'ArrowRight') moveDir = 1;
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' && moveDir === -1) moveDir = 0;
  if (e.key === 'ArrowRight' && moveDir === 1) moveDir = 0;
});

// --- INITIALIZATION ---

// Set canvas resolution
canvas.width = WIDTH;
canvas.height = HEIGHT;

// Disable anti-aliasing
ctx.imageSmoothingEnabled = false;

// Start
initWorld();
loop();

</script>
</body>
</html>
