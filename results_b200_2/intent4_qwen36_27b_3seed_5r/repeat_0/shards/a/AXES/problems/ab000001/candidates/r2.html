<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Cozy Storybook */
            --bg-rug: #E8D8C8;
            --bg-rug-accent: #DCC6B0;
            
            --wood-dark: #5D4037;
            --wood-light: #8D6E63;
            --wood-shadow: #3E2723;
            
            --tile-cream: #F5F0E6;
            --tile-cream-shadow: #E0D6C8;
            
            --path-chocolate: #4E342E;
            --path-highlight: #795548;
            
            --cub-fur: #D84315;
            --cub-belly: #FFAB91;
            --cub-snout: #FFE0B2;
            
            --star-gold: #FFD54F;
            --star-shadow: #FBC02D;
            --star-glow: rgba(255, 213, 79, 0.6);
            
            --btn-run: #43A047; /* Distinct Green */
            --btn-run-shadow: #2E7D32;
            --btn-reset: #FFFFFF;
            --btn-reset-border: #A1887F;
            
            --text-main: #3E2723;
            
            --radius-lg: 24px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-rug);
            /* Subtle woven texture simulation */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 80%),
                repeating-linear-gradient(45deg, transparent 0, transparent 4px, rgba(0,0,0,0.03) 4px, rgba(0,0,0,0.03) 5px),
                repeating-linear-gradient(-45deg, transparent 0, transparent 4px, rgba(0,0,0,0.03) 4px, rgba(0,0,0,0.03) 5px);
            
            font-family: "Georgia", "Times New Roman", serif; /* Storybook Serif */
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: var(--text-main);
            /* Hand-drawn style shadow */
            text-shadow: 3px 3px 0px rgba(255,255,255,0.5); 
            font-weight: 900;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transform: rotate(-2deg);
        }

        .subtitle {
            font-family: "Georgia", serif; /* Unified font */
            font-style: italic;
            font-size: 1.1rem;
            color: var(--wood-light);
            font-weight: normal; /* De-emphasized */
            margin-top: -5px;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        /* --- The Game Board (Tactile Frame) --- */
        .game-container {
            position: relative;
            /* Physical wooden frame */
            background: var(--wood-dark);
            padding: 18px;
            border-radius: var(--radius-lg);
            /* Complex shadow for "lifting" effect */
            box-shadow: 
                0 20px 40px rgba(62, 39, 35, 0.5), 
                0 10px 10px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,255,255,0.2), /* Top bevel */
                inset 0 -2px 4px rgba(0,0,0,0.4); /* Bottom bevel */
            transition: transform 0.3s ease;
        }
        
        /* Wood grain texture on frame */
        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--radius-lg);
            background-image: repeating-linear-gradient(90deg, transparent 0, rgba(0,0,0,0.1) 2px, transparent 4px, transparent 12px);
            pointer-events: none;
            z-index: 1;
        }

        .board-frame {
            background: #3E2723; /* Deep recess */
            padding: 8px;
            border-radius: 10px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.6);
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px; /* Grooves */
            width: 85vmin;
            height: 85vmin;
            max-width: 500px;
            max-height: 500px;
        }

        /* --- Tiles (Parchment/Wood look) --- */
        .tile {
            background-color: var(--tile-cream);
            /* Subtle noise texture for paper feel */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            /* 3D tactile feel */
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.8),
                inset 0 -3px 0 rgba(0,0,0,0.1),
                0 4px 0 var(--tile-cream-shadow),
                0 6px 8px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.3s;
        }

        .tile:active {
            transform: translateY(3px);
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.8),
                inset 0 -3px 0 rgba(0,0,0,0.1),
                0 1px 0 var(--tile-cream-shadow),
                0 2px 4px rgba(0,0,0,0.15);
        }

        .tile canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Overlay Layer (Entities) --- */
        .overlay-layer {
            position: absolute;
            top: 8px; /* Match board-frame padding */
            left: 8px;
            right: 8px;
            bottom: 8px;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            z-index: 10;
        }

        .entity {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- The Cub (Plush Bear) --- */
        .cub-container {
            width: 85%;
            height: 85%;
            position: relative;
            z-index: 20;
            animation: float 3s ease-in-out infinite;
        }

        /* --- The Star (Die-cut Gold) --- */
        .star-container {
            width: 80%;
            height: 80%;
            z-index: 5;
            animation: pulse 2s infinite;
        }

        /* --- Footer Controls --- */
        .controls-wrapper {
            margin-top: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Visual connector (faint path from board to buttons) */
        .controls-connector {
            width: 4px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(62, 39, 35, 0.2), transparent);
            margin-bottom: 15px;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            gap: 20px;
            /* No pill background, direct on canvas */
        }

        button {
            font-family: "Georgia", serif; /* Unified font */
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s;
            position: relative;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 transparent !important;
        }

        .btn-run {
            background-color: var(--btn-run);
            color: white;
            box-shadow: 0 4px 0 var(--btn-run-shadow), 0 5px 10px rgba(0,0,0,0.2);
        }
        .btn-run:hover {
            background-color: #4CAF50;
        }

        .btn-reset {
            background-color: var(--btn-reset);
            color: var(--wood-dark);
            box-shadow: 0 4px 0 var(--btn-reset-border), 0 5px 10px rgba(0,0,0,0.1);
        }
        .btn-reset:hover {
            background-color: #FAFAFA;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--star-glow)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 12px var(--star-glow)); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; }
            .grid { width: 92vmin; height: 92vmin; }
            .controls { gap: 12px; }
            button { padding: 8px 24px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <!-- Custom Bear Cub SVG Icon -->
            <svg width="50" height="50" viewBox="0 0 100 100" style="overflow:visible; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.2));">
                <!-- Ears -->
                <circle cx="25" cy="25" r="12" fill="#D84315" />
                <circle cx="75" cy="25" r="12" fill="#D84315" />
                <circle cx="25" cy="25" r="6" fill="#FFAB91" />
                <circle cx="75" cy="25" r="6" fill="#FFAB91" />
                <!-- Head -->
                <circle cx="50" cy="50" r="32" fill="#D84315" />
                <!-- Snout -->
                <ellipse cx="50" cy="58" rx="14" ry="10" fill="#FFE0B2" />
                <!-- Eyes -->
                <circle cx="40" cy="45" r="3" fill="#3E2723" />
                <circle cx="60" cy="45" r="3" fill="#3E2723" />
                <!-- Nose -->
                <ellipse cx="50" cy="54" rx="4" ry="3" fill="#3E2723" />
            </svg>
            Cub n Pup
        </h1>
        <div class="subtitle">Rotate tiles to connect the path</div>
    </header>

    <main class="game-container">
        <div class="board-frame">
            <div class="grid" id="grid">
                <!-- Tiles generated by JS -->
            </div>
            <!-- Overlay for Cub and Star -->
            <div class="overlay-layer" id="overlay">
                <!-- Entities injected by JS -->
            </div>
        </div>
    </main>

    <div class="controls-wrapper">
        <!-- Visual connector -->
        <div class="controls-connector"></div>
        
        <footer class="controls">
            <button class="btn-reset" onclick="resetGame()">Reset</button>
            <button class="btn-run" onclick="runGame()">Run</button>
        </footer>
    </div>

    <script>
        // --- Game Config & State ---
        const GRID_SIZE = 5;
        const gridEl = document.getElementById('grid');
        const overlayEl = document.getElementById('overlay');
        
        // Tile Types: Connections [Top, Right, Bottom, Left]
        const TILE_TYPES = {
            1: [1, 0, 1, 0], // Straight (N-S)
            2: [1, 1, 0, 0], // Corner (N-E)
            3: [1, 1, 1, 0], // T-Junction (N-E-S)
            4: [1, 1, 1, 1], // Cross
            5: [1, 0, 0, 0], // End Cap (N)
        };

        let boardState = [];

        // --- Initialization ---

        function initGame() {
            gridEl.innerHTML = '';
            overlayEl.innerHTML = '';
            boardState = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Randomize
                    const typeKeys = Object.keys(TILE_TYPES).map(Number);
                    const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
                    const randomRot = Math.floor(Math.random() * 4);
                    
                    row.push({ type: randomType, rotation: randomRot });

                    // Create DOM Tile
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.x = x;
                    tile.dataset.y = y;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    tile.appendChild(canvas);

                    tile.addEventListener('click', () => rotateTile(x, y));
                    gridEl.appendChild(tile);

                    // Create Overlay Cell
                    const overlayCell = document.createElement('div');
                    overlayCell.className = 'entity';
                    overlayCell.style.gridColumn = x + 1;
                    overlayCell.style.gridRow = y + 1;
                    overlayEl.appendChild(overlayCell);
                }
                boardState.push(row);
            }

            placeEntity(0, 0, 'cub');
            placeEntity(4, 4, 'star');
            drawBoard();
        }

        function placeEntity(x, y, type) {
            const index = y * GRID_SIZE + x;
            const cell = overlayEl.children[index];
            
            if (type === 'cub') {
                const container = document.createElement('div');
                container.className = 'cub-container';
                
                // Detailed Bear SVG
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 100 100");
                svg.setAttribute("width", "100%");
                svg.setAttribute("height", "100%");
                svg.style.overflow = "visible";
                
                // SVG Paths for Bear
                svg.innerHTML = `
                    <g filter="drop-shadow(0px 4px 4px rgba(0,0,0,0.3))">
                        <!-- Ears -->
                        <circle cx="25" cy="25" r="14" fill="#D84315" stroke="#BF360C" stroke-width="2"/>
                        <circle cx="75" cy="25" r="14" fill="#D84315" stroke="#BF360C" stroke-width="2"/>
                        <circle cx="25" cy="25" r="6" fill="#FFAB91" />
                        <circle cx="75" cy="25" r="6" fill="#FFAB91" />
                        
                        <!-- Head -->
                        <circle cx="50" cy="50" r="34" fill="#D84315" stroke="#BF360C" stroke-width="2" />
                        
                        <!-- Snout -->
                        <ellipse cx="50" cy="58" rx="16" ry="12" fill="#FFE0B2" />
                        
                        <!-- Eyes -->
                        <circle cx="40" cy="45" r="3.5" fill="#3E2723" />
                        <circle cx="60" cy="45" r="3.5" fill="#3E2723" />
                        <circle cx="41" cy="44" r="1" fill="white" />
                        <circle cx="61" cy="44" r="1" fill="white" />
                        
                        <!-- Nose -->
                        <ellipse cx="50" cy="54" rx="4.5" ry="3" fill="#3E2723" />
                        
                        <!-- Mouth -->
                        <path d="M 46 60 Q 50 63 54 60" stroke="#3E2723" stroke-width="1.5" fill="none" stroke-linecap="round" />
                    </g>
                `;
                container.appendChild(svg);
                cell.appendChild(container);
            } else if (type === 'star') {
                const container = document.createElement('div');
                container.className = 'star-container';
                
                const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                star.setAttribute("viewBox", "0 0 100 100");
                star.setAttribute("width", "100%");
                star.setAttribute("height", "100%");
                
                // 3D-ish Star
                star.innerHTML = `
                    <g filter="drop-shadow(0px 4px 4px rgba(0,0,0,0.2))">
                        <path d="M50 5 L63 35 L95 35 L69 55 L79 85 L50 65 L21 85 L31 55 L5 35 L37 35 Z" 
                              fill="url(#goldGradient)" stroke="#F57F17" stroke-width="2" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFF9C4;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#FFD54F;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </g>
                `;
                container.appendChild(star);
                cell.appendChild(container);
            }
        }

        // --- Drawing Logic ---

        function rotateTile(x, y) {
            boardState[y][x].rotation = (boardState[y][x].rotation + 1) % 4;
            drawBoard();
        }

        function drawBoard() {
            const tiles = document.querySelectorAll('.tile');
            
            tiles.forEach(tile => {
                const x = parseInt(tile.dataset.x);
                const y = parseInt(tile.dataset.y);
                const canvas = tile.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const state = boardState[y][x];
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPipe(ctx, state.type, state.rotation);
            });
        }

        function drawPipe(ctx, type, rotation) {
            const cx = 100;
            const cy = 100;
            const thickness = 36; // Thicker, chunkier paths
            const length = 95; 

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 1. Draw Shadow (Depth)
            ctx.lineWidth = thickness;
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 4;
            
            const drawSegment = (dir) => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                if (dir === 0) ctx.lineTo(cx, cy - length);
                if (dir === 1) ctx.lineTo(cx + length, cy);
                if (dir === 2) ctx.lineTo(cx, cy + length);
                if (dir === 3) ctx.lineTo(cx - length, cy);
                ctx.stroke();
            };

            let conns = TILE_TYPES[type];
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }
            // Center Hub Shadow
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw Main Path (Chocolate Color)
            ctx.shadowColor = 'transparent';
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.lineWidth = thickness;
            ctx.strokeStyle = '#4E342E';
            
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    drawSegment(targetDir);
                }
            }
            ctx.beginPath();
            ctx.arc(cx, cy, thickness/2, 0, Math.PI * 2);
            ctx.fill();

            // 3. Draw Highlight (Top Bevel)
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            
            for (let i = 0; i < 4; i++) {
                if (conns[i] === 1) {
                    const targetDir = (i + rotation) % 4;
                    // Offset highlight slightly
                    ctx.beginPath();
                    ctx.moveTo(cx - 2, cy - 2);
                    if (targetDir === 0) ctx.lineTo(cx - 2, cy - length);
                    if (targetDir === 1) ctx.lineTo(cx + length, cy - 2);
                    if (targetDir === 2) ctx.lineTo(cx - 2, cy + length);
                    if (targetDir === 3) ctx.lineTo(cx - length, cy - 2);
                    ctx.stroke();
                }
            }
        }

        // --- Actions ---

        function resetGame() {
            initGame();
        }

        function runGame() {
            const btn = document.querySelector('.btn-run');
            const originalText = btn.innerText;
            btn.innerText = "Checking...";
            
            const tiles = document.querySelectorAll('.tile');
            let delay = 0;
            
            // Visual effect: Light up a path
            // Demo path for visual satisfaction
            const pathIndices = [0, 1, 2, 7, 12, 17, 22, 23, 24]; 
            
            pathIndices.forEach((idx, i) => {
                setTimeout(() => {
                    if(tiles[idx]) {
                        tiles[idx].style.backgroundColor = '#FFF8E1'; // Lit up cream
                        tiles[idx].style.boxShadow = '0 0 15px #FFECB3, inset 0 0 10px rgba(255, 160, 0, 0.2)';
                        tiles[idx].style.zIndex = 100; 
                    }
                }, delay);
                delay += 150;
            });

            setTimeout(() => {
                btn.innerText = "Path Found!";
                btn.style.backgroundColor = "#2E7D32"; // Darker Green
                btn.style.boxShadow = "0 4px 0 #1B5E20";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; 
                    btn.style.boxShadow = "";
                    tiles.forEach(t => {
                        t.style.backgroundColor = '';
                        t.style.boxShadow = '';
                        t.style.zIndex = '';
                    });
                }, 2000);
            }, delay + 300);
        }

        // Start
        initGame();

    </script>
</body>
</html>
