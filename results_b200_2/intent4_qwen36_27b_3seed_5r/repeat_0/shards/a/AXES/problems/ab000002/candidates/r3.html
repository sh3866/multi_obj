<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Skill Matrix</title>
<style>
    :root {
        /* Palette - Refined Void & Ethereal Energy */
        --bg-deep: #05070a;
        --bg-panel: #0a0d12;
        --border-subtle: rgba(255, 255, 255, 0.08);
        
        /* Accents */
        --accent-primary: #00f0ff; /* Cyan - Active */
        --accent-primary-dim: rgba(0, 240, 255, 0.15);
        --accent-secondary: #8f00ff; /* Void Purple - Locked/Available */
        --accent-gold: #ffd700; /* Gold - Currency/Maxed */
        --accent-gold-dim: rgba(255, 215, 0, 0.15);

        /* Text - Unified Font Family */
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        
        /* Colors */
        --text-primary: #ffffff;
        --text-secondary: #8b9bb4;
        --text-muted: #4a5568;
    }

    * {
        box-sizing: border-box;
        user-select: none;
        cursor: default;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Atmosphere (Nebula/Noise) --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        background: 
            radial-gradient(circle at 70% 30%, rgba(30, 10, 60, 0.4) 0%, transparent 60%),
            radial-gradient(circle at 30% 70%, rgba(0, 40, 50, 0.3) 0%, transparent 60%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E"),
            var(--bg-deep);
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: linear-gradient(to bottom, rgba(5,7,10,0.95), rgba(5,7,10,0.4));
        z-index: 10;
        position: relative;
        border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .brand svg {
        width: 20px;
        height: 20px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 4px var(--accent-primary));
    }

    .header-status {
        display: flex;
        gap: 20px;
        font-size: 0.8rem;
        color: var(--text-secondary);
    }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 60px);
        position: relative;
        z-index: 1;
    }

    /* --- Sidebar (Clean, Vertical Dossier) --- */
    aside {
        width: 320px;
        height: 100%;
        background: linear-gradient(90deg, rgba(10,13,18,0.95) 0%, rgba(10,13,18,0.8) 100%);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        z-index: 5;
        backdrop-filter: blur(10px);
        box-shadow: 5px 0 30px rgba(0,0,0,0.3);
        padding: 30px;
    }

    .sidebar-content {
        display: flex;
        flex-direction: column;
        gap: 40px;
        height: 100%;
    }

    /* Profile */
    .character-profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 15px;
        padding-bottom: 25px;
        border-bottom: 1px solid var(--border-subtle);
    }

    .avatar-ring {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid var(--text-muted);
        padding: 4px;
        background: #000;
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    
    /* Animated glow ring */
    .avatar-ring::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px dashed var(--accent-secondary);
        opacity: 0.5;
        animation: spin-slow 10s linear infinite;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    
    .avatar-img svg {
        width: 60%;
        height: 60%;
        fill: var(--text-secondary);
    }

    .char-name {
        font-family: var(--font-ui);
        font-size: 1.5rem;
        color: #fff;
        margin: 0;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-secondary);
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 700;
        margin-top: -10px;
    }

    /* Stats Block */
    .stats-block {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .stat-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .stat-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .stat-label {
        font-size: 0.7rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
    }

    .stat-val {
        font-size: 1.2rem;
        color: #fff;
        font-weight: 300;
    }

    /* XP Bar */
    .xp-track {
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-primary);
        position: relative;
    }
    
    /* Skill Points - Prominent */
    .sp-container {
        background: var(--accent-gold-dim);
        border: 1px solid rgba(255, 215, 0, 0.3);
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 4px;
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .sp-icon {
        width: 24px;
        height: 24px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    .sp-info {
        text-align: right;
    }

    .sp-count {
        font-family: var(--font-ui);
        font-size: 1.8rem;
        color: var(--accent-gold);
        font-weight: 700;
        line-height: 1;
    }

    /* --- Center (Tree Canvas) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
    }
    main:active { cursor: grabbing; }

    /* Title - Demoted */
    .screen-title {
        position: absolute;
        top: 30px;
        left: 40px;
        font-family: var(--font-ui);
        font-size: 0.8rem;
        color: var(--text-secondary);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 700;
        z-index: 5;
        pointer-events: none;
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .screen-title::before {
        content: '';
        display: block;
        width: 20px;
        height: 2px;
        background: var(--accent-primary);
    }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- The Node (Crystalline Artifact) --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s;
    }

    /* Hexagon Shape */
    .rune-shape {
        width: 100%;
        height: 100%;
        /* Metallic gradient fill */
        fill: url(#nodeGradient); 
        stroke-width: 1.5;
        transition: all 0.3s ease;
    }

    .node-icon {
        width: 32px;
        height: 32px;
        fill: #555;
        position: absolute;
        transition: all 0.3s ease;
        z-index: 3;
    }

    /* State: Locked (Dull, Dark) */
    .node.locked .rune-shape {
        stroke: #2a2d38;
        filter: drop-shadow(0 0 0px transparent);
        opacity: 0.6;
    }
    .node.locked .node-icon { opacity: 0.2; }
    
    /* State: Unlocked (Cyan Glow) */
    .node.unlocked .rune-shape {
        stroke: var(--accent-primary);
        filter: drop-shadow(0 0 8px var(--accent-primary-dim));
    }
    .node.unlocked .node-icon {
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    /* State: Maxed (Gold Glow) */
    .node.maxed .rune-shape {
        stroke: var(--accent-gold);
        filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.4));
    }
    .node.maxed .node-icon {
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    /* Interaction */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }
    
    .node.upgrading .rune-shape {
        animation: pulse-void 0.4s ease-out;
    }

    @keyframes pulse-void {
        0% { stroke-width: 1.5; filter: drop-shadow(0 0 5px var(--accent-gold)); }
        50% { stroke-width: 4; filter: drop-shadow(0 0 25px #fff); }
        100% { stroke-width: 1.5; filter: drop-shadow(0 0 10px var(--accent-gold)); }
    }

    @keyframes spin-slow {
        100% { transform: rotate(360deg); }
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(15, 20, 30, 0.95);
        border: 1px solid var(--border-subtle);
        border-left: 3px solid var(--accent-primary);
        padding: 15px 20px;
        width: 260px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
        transform: translateY(10px);
    }

    .tooltip.visible { 
        opacity: 1; 
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 5px;
        font-family: var(--font-ui);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 12px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-primary);
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .cost-badge {
        background: rgba(255,255,255,0.05);
        padding: 4px 8px;
        border-radius: 2px;
        font-size: 0.75rem;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        Arcanum
    </div>
    <div class="header-status">
        <span>Zone: The Void</span>
        <span>Server: Stable</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <div class="sidebar-content">
            <!-- Character Profile -->
            <div class="character-profile">
                <div class="avatar-ring">
                    <div class="avatar-img">
                        <svg viewBox="0 0 100 100">
                            <path d="M50 20 C 30 20, 20 40, 20 60 L 20 80 L 80 80 L 80 60 C 80 40, 70 20, 50 20" />
                            <path d="M50 30 C 40 30, 35 40, 35 50 L 65 50 C 65 40, 60 30, 50 30" fill="#1e232e" />
                        </svg>
                    </div>
                </div>
                <div>
                    <h2 class="char-name">Kaelen</h2>
                    <div class="char-class">Void Walker</div>
                </div>
            </div>

            <div class="stats-block">
                <!-- Level & XP -->
                <div class="stat-group">
                    <div class="stat-header">
                        <span class="stat-label">Level</span>
                        <span class="stat-val">42</span>
                    </div>
                    <div class="xp-track">
                        <div class="xp-fill"></div>
                    </div>
                </div>

                <!-- Skill Points (Consolidated) -->
                <div class="sp-container">
                    <svg class="sp-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <div class="sp-info">
                        <div class="stat-label">Available Points</div>
                        <div class="sp-count" id="sp-display">3</div>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <div class="screen-title">Skill Matrix</div>
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span class="cost-badge" id="tt-cost">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<!-- SVG Definitions for Gradients/Icons -->
<svg style="display: none;">
    <defs>
        <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0a0d12;stop-opacity:1" />
        </linearGradient>
    </defs>
</svg>

<script>
    /**
     * Skill Data - Expanded for "Matrix" feel
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute', type: 'core' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength', type: 'weapon' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown', type: 'magic' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance', type: 'weapon' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal', type: 'rune' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP', type: 'magic' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill', type: 'weapon' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed', type: 'rune' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed', type: 'magic' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill', type: 'rune' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%', type: 'core' }
    ];

    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // SVG Paths for Icons
    const icons = {
        weapon: '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>',
        magic: '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10h-20A10 10 0 0 1 12 2z" fill="none" stroke="currentColor" stroke-width="2"/>',
        rune: '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>',
        core: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'
    };

    // Hexagon Shape Path
    const shapePath = "M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            // Center position logic
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            el.innerHTML = `
                <svg class="rune-shape" viewBox="0 0 24 24"><path d="${shapePath}"/></svg>
                <svg class="node-icon" viewBox="0 0 24 24">${icons[skill.type]}</svg>
            `;
            
            // Events
            el.addEventListener('click', (e) => { e.stopPropagation(); upgradeSkill(skill); });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering Connections (Enhanced Visibility) ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Draw Thick Conduits
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);

            if (isUnlocked) {
                // Glowing Active Path
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';
                ctx.globalAlpha = 0.8;
            } else if (isPath) {
                // Available Path (Darker, thicker than locked)
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#4a5570';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.6;
            } else {
                // Locked Path (Faint)
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#1e232e';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.3;
            }
            
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Animation trigger
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 600);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = skill.level >= skill.max ? 'MAXED' : `Cost: ${skill.cost}`;

        // Dynamic color for cost badge
        const costBadge = document.getElementById('tt-cost');
        if(skill.level >= skill.max) {
            costBadge.style.borderColor = 'var(--accent-gold)';
            costBadge.style.color = 'var(--accent-gold)';
        } else {
            costBadge.style.borderColor = 'rgba(255,255,255,0.1)';
            costBadge.style.color = '#fff';
        }

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container || e.target.classList.contains('bg-atmosphere')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
