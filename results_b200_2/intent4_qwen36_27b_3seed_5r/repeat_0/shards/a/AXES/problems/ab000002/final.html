<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Void Walker Matrix</title>
<style>
    :root {
        /* Palette - Deep Void & Ethereal Tech */
        --bg-deep: #05060a;
        --bg-panel: rgba(10, 12, 18, 0.85);
        
        /* Accents */
        --accent-primary: #00f0ff; /* Cyan - Active */
        --accent-primary-dim: rgba(0, 240, 255, 0.15);
        --accent-secondary: #a855f7; /* Void Purple - Magic */
        --accent-gold: #fbbf24; /* Gold - Maxed */
        
        /* Typography */
        --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --font-display: 'Impact', 'Arial Black', sans-serif;
        
        /* Colors */
        --text-primary: #ffffff;
        --text-secondary: #94a3b8;
        --text-muted: #475569;
    }

    * { box-sizing: border-box; user-select: none; cursor: default; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background: Living Void --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        background: 
            radial-gradient(circle at 15% 50%, rgba(20, 10, 40, 0.4) 0%, transparent 50%),
            radial-gradient(circle at 85% 50%, rgba(10, 30, 60, 0.3) 0%, transparent 50%),
            var(--bg-deep);
        animation: void-pulse 10s ease-in-out infinite alternate;
    }
    
    @keyframes void-pulse {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1.05); opacity: 0.8; }
    }

    /* --- Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: 100vh;
        position: relative;
        z-index: 5;
    }

    /* --- Sidebar: Etched Metal / Artifact --- */
    aside {
        width: 320px;
        height: 100%;
        background: linear-gradient(180deg, #0f1219 0%, #080a0f 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        z-index: 10;
        padding: 24px;
        position: relative;
        box-shadow: 10px 0 40px rgba(0,0,0,0.5);
    }
    
    /* Decorative side accent */
    aside::after {
        content: '';
        position: absolute;
        right: 0; top: 10%; bottom: 10%;
        width: 2px;
        background: linear-gradient(to bottom, transparent, var(--accent-primary), transparent);
        opacity: 0.3;
    }

    /* Profile Header */
    .character-profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .avatar-container {
        position: relative;
        width: 100px;
        height: 100px;
    }

    /* Hexagon Avatar Frame */
    .avatar-frame {
        width: 100%;
        height: 100%;
        background: #1a1d26;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border: 2px solid #2a3040; /* Fallback */
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    
    .avatar-frame svg {
        width: 60%;
        fill: var(--text-secondary);
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
    }

    .char-name {
        font-size: 1.5rem;
        color: #fff;
        margin: 0;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 700;
        opacity: 0.9;
        background: var(--accent-primary-dim);
        padding: 4px 12px;
        border-radius: 2px;
    }

    /* --- Hero Stat: Skill Points --- */
    .sp-container {
        background: rgba(251, 191, 36, 0.05);
        border: 1px solid rgba(251, 191, 36, 0.2);
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
        position: relative;
        /* Chamfered corners */
        clip-path: polygon(
            0 0, 
            100% 0, 
            100% calc(100% - 10px), 
            calc(100% - 10px) 100%, 
            0 100%
        );
        box-shadow: 0 0 20px rgba(251, 191, 36, 0.05);
    }

    .sp-icon {
        width: 28px;
        height: 28px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.4));
    }

    .sp-info { text-align: right; }

    .sp-label {
        font-size: 0.6rem;
        color: var(--accent-gold);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 700;
        margin-bottom: 2px;
        display: block;
    }

    .sp-count {
        font-size: 1.8rem;
        color: #fff;
        font-weight: 800;
        line-height: 1;
        text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        font-family: var(--font-display);
    }

    /* --- Secondary Stats (Demoted) --- */
    .stats-section {
        margin-bottom: 20px;
    }
    
    .section-label {
        font-size: 0.6rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
        display: block;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .stat-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.03);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: background 0.2s;
    }
    
    .stat-card:hover {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.08);
    }

    .stat-card .label {
        font-size: 0.6rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .stat-card .value {
        font-size: 0.9rem;
        color: var(--text-secondary);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    /* XP Section */
    .xp-section {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    
    .xp-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 0.75rem;
    }
    
    .xp-label { color: var(--text-secondary); font-weight: 600; }
    .xp-val { color: var(--text-muted); font-size: 0.7rem; }

    .xp-track {
        height: 4px;
        background: rgba(0,0,0,0.6);
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.02);
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-secondary);
        box-shadow: 0 0 10px var(--accent-secondary);
        position: relative;
    }

    /* --- Main Canvas --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
    }
    main:active { cursor: grabbing; }

    /* Title - Reduced Weight */
    .screen-title {
        position: absolute;
        top: 30px;
        left: 40px;
        z-index: 5;
        pointer-events: none;
    }
    
    .screen-title h1 {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 1.8rem;
        color: rgba(255,255,255,0.9);
        text-transform: uppercase;
        letter-spacing: 4px;
        font-weight: 700;
        line-height: 1;
    }
    
    .screen-title p {
        margin: 4px 0 0 2px;
        font-size: 0.75rem;
        color: var(--text-secondary);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 500;
    }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- The Node: Unified Crystal --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Master Hexagon Shape */
    .rune-shape {
        width: 100%;
        height: 100%;
        /* Geometric Hexagon */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        transition: all 0.3s ease;
    }

    /* Inner Core (The "Artifact") */
    .rune-core {
        position: absolute;
        inset: 6px;
        background: rgba(15, 20, 30, 0.9);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: none;
        stroke-width: 1.5px;
        stroke-linecap: round;
        stroke-linejoin: round;
        position: relative;
        z-index: 3;
        transition: all 0.3s ease;
    }
    
    .node-text {
        position: absolute;
        bottom: -28px;
        width: 160px;
        text-align: center;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-secondary);
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.3s;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        pointer-events: none;
    }

    .node:hover .node-text {
        opacity: 1;
        transform: translateY(0);
    }

    /* State: Locked (Dark Matter) */
    .node.locked .rune-shape {
        background: rgba(10, 12, 18, 0.5);
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: none;
    }
    .node.locked .rune-core {
        background: #0a0c12;
    }
    .node.locked .node-icon { 
        stroke: #2a3040; 
        opacity: 0.4;
    }
    
    /* State: Unlocked (Cyan Crystal) */
    .node.unlocked .rune-shape {
        background: rgba(0, 240, 255, 0.15);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1);
        border: 1px solid rgba(0, 240, 255, 0.5);
    }
    .node.unlocked .rune-core {
        background: rgba(0, 240, 255, 0.05);
        border-color: rgba(0, 240, 255, 0.3);
    }
    .node.unlocked .node-icon {
        stroke: var(--accent-primary);
        fill: rgba(0, 240, 255, 0.1);
        filter: drop-shadow(0 0 3px var(--accent-primary));
    }
    .node.unlocked .node-text { color: var(--accent-primary); opacity: 1; transform: translateY(0); }

    /* State: Maxed (Gold Artifact) */
    .node.maxed .rune-shape {
        background: rgba(251, 191, 36, 0.15);
        box-shadow: 0 0 20px rgba(251, 191, 36, 0.25), inset 0 0 10px rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.6);
    }
    .node.maxed .rune-core {
        background: rgba(251, 191, 36, 0.05);
        border-color: rgba(251, 191, 36, 0.3);
    }
    .node.maxed .node-icon {
        stroke: var(--accent-gold);
        fill: rgba(251, 191, 36, 0.2);
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }
    .node.maxed .node-text { color: var(--accent-gold); opacity: 1; transform: translateY(0); }

    /* Interaction */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }
    
    /* --- Tooltip --- */
    .tooltip {
        position: absolute;
        background: rgba(15, 20, 30, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        border-left: 3px solid var(--accent-primary);
        padding: 16px;
        width: 260px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        transform: translateY(5px);
    }

    .tooltip.visible { 
        opacity: 1; 
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 6px;
        font-family: var(--font-ui);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
        margin-bottom: 12px;
        font-style: italic;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-primary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .cost-badge {
        background: rgba(255,255,255,0.05);
        padding: 4px 8px;
        font-size: 0.75rem;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>

<div class="dashboard">
    <aside>
        <!-- Character Profile -->
        <div class="character-profile">
            <div class="avatar-container">
                <div class="avatar-frame">
                    <!-- Stylized Void Walker Icon -->
                    <svg viewBox="0 0 100 100">
                        <path d="M50 15 C 30 15, 20 35, 20 55 L 20 85 L 80 85 L 80 55 C 80 35, 70 15, 50 15" fill="#1a1d26" stroke="#2a3040" stroke-width="2"/>
                        <path d="M50 25 C 40 25, 35 40, 35 50 L 65 50 C 65 40, 60 25, 50 25" fill="#00f0ff" opacity="0.8" filter="url(#glow)"/>
                    </svg>
                </div>
            </div>
            <div>
                <h2 class="char-name">Kaelen</h2>
                <div class="char-class">Void Walker</div>
            </div>
        </div>

        <!-- Skill Points (Hero Item) -->
        <div class="sp-container">
            <svg class="sp-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <div class="sp-info">
                <span class="sp-label">Available Points</span>
                <div class="sp-count" id="sp-display">3</div>
            </div>
        </div>

        <!-- Stats Grid (Demoted) -->
        <div class="stats-section">
            <span class="section-label">Attributes</span>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="label">Health</span>
                    <span class="value">2,450</span>
                </div>
                <div class="stat-card">
                    <span class="label">Mana</span>
                    <span class="value">850</span>
                </div>
                <div class="stat-card">
                    <span class="label">Strength</span>
                    <span class="value">42</span>
                </div>
                <div class="stat-card">
                    <span class="label">Agility</span>
                    <span class="value">88</span>
                </div>
            </div>
        </div>

        <!-- XP Section -->
        <div class="xp-section">
            <div class="xp-header">
                <span class="xp-label">Level 42</span>
                <span class="xp-val">4,200 / 5,000 XP</span>
            </div>
            <div class="xp-track">
                <div class="xp-fill"></div>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <div class="screen-title">
            <h1>Skill Matrix</h1>
            <p>Void Walker Path</p>
        </div>
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span class="cost-badge" id="tt-cost">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<!-- SVG Definitions -->
<svg style="display: none;">
    <defs>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
</svg>

<script>
    /**
     * Skill Data
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute', type: 'core' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength', type: 'weapon' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown', type: 'magic' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance', type: 'weapon' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal', type: 'rune' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP', type: 'magic' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill', type: 'weapon' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed', type: 'rune' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed', type: 'magic' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill', type: 'rune' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%', type: 'core' }
    ];

    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // SVG Paths for Icons (Consistent Stroke)
    const icons = {
        weapon: '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>',
        magic: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
        rune: '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>',
        core: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'
    };

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            // Center position logic
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            el.innerHTML = `
                <div class="rune-shape">
                    <div class="rune-core">
                        <svg class="node-icon" viewBox="0 0 24 24">${icons[skill.type]}</svg>
                    </div>
                </div>
                <div class="node-text">${skill.name}</div>
            `;
            
            // Events
            el.addEventListener('click', (e) => { e.stopPropagation(); upgradeSkill(skill); });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering Connections (Energy Ribbons) ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Draw Thick Conduits
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);

            if (isUnlocked) {
                // Glowing Active Path
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f0ff';
                ctx.globalAlpha = 0.8;
            } else if (isPath) {
                // Available Path (Darker)
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#4a5570';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.5;
            } else {
                // Locked Path (Faint)
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#1e232e';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.3;
            }
            
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Animation trigger
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 600);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = skill.level >= skill.max ? 'MAXED' : `Cost: ${skill.cost}`;

        // Dynamic color for cost badge
        const costBadge = document.getElementById('tt-cost');
        if(skill.level >= skill.max) {
            costBadge.style.borderColor = 'var(--accent-gold)';
            costBadge.style.color = 'var(--accent-gold)';
        } else {
            costBadge.style.borderColor = 'rgba(255,255,255,0.1)';
            costBadge.style.color = '#fff';
        }

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container || e.target.classList.contains('bg-atmosphere')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
