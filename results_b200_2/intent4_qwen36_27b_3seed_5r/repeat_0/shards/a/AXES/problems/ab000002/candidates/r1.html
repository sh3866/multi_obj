<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Void Ascension</title>
<style>
    :root {
        /* Palette - Void & Magic */
        --bg-deep: #050508;
        --bg-panel: rgba(15, 17, 24, 0.7);
        --border-dim: rgba(255, 255, 255, 0.08);
        --border-glow: rgba(100, 200, 255, 0.3);
        
        /* Accents */
        --accent-cyan: #00f0ff;
        --accent-cyan-dim: rgba(0, 240, 255, 0.15);
        --accent-gold: #ffcc00;
        --accent-gold-dim: rgba(255, 204, 0, 0.15);
        --accent-purple: #8a2be2;
        
        /* Text */
        --text-primary: #e0e6ed;
        --text-secondary: #8b9bb4;
        --text-gold: #ffcc00;

        /* Fonts */
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
        cursor: default;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Atmosphere --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        overflow: hidden;
    }
    
    .nebula {
        position: absolute;
        width: 100%; height: 100%;
        background: 
            radial-gradient(circle at 20% 30%, rgba(75, 0, 130, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
            linear-gradient(to bottom, #020204, #0a0a12);
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: linear-gradient(to bottom, rgba(5,5,8,0.9), rgba(5,5,8,0));
        z-index: 10;
    }

    .brand {
        font-family: var(--font-display);
        font-size: 1.2rem;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--text-primary);
        text-shadow: 0 0 15px rgba(255,255,255,0.2);
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 400;
    }
    
    .brand svg {
        width: 20px;
        height: 20px;
        fill: var(--accent-cyan);
        filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    .nav-links span {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-left: 30px;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.3s;
        opacity: 0.6;
    }
    .nav-links span:hover { 
        color: var(--accent-cyan); 
        opacity: 1;
        text-shadow: 0 0 8px var(--accent-cyan);
    }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 60px);
        position: relative;
    }

    /* --- Sidebar (Stats) --- */
    aside {
        width: 340px;
        height: 100%;
        background: linear-gradient(90deg, rgba(10,12,16,0.95) 0%, rgba(10,12,16,0.4) 100%);
        border-right: 1px solid var(--border-dim);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 25px;
        z-index: 5;
        backdrop-filter: blur(10px);
    }

    /* Currency HUD - Top of Sidebar */
    .currency-hud {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-dim);
        border-left: 2px solid var(--accent-gold);
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        position: relative;
        overflow: hidden;
    }

    .currency-hud::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(90deg, var(--accent-gold-dim), transparent);
        z-index: 0;
        opacity: 0.5;
    }

    .currency-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-secondary);
        z-index: 1;
    }

    .currency-count {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: var(--accent-gold);
        z-index: 1;
        text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        display: flex;
        align-items: baseline;
        gap: 5px;
    }
    
    .currency-icon {
        width: 16px;
        height: 16px;
        fill: var(--accent-gold);
    }

    /* Character Profile */
    .character-profile {
        display: flex;
        align-items: center;
        gap: 15px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 20px;
    }

    .avatar-ring {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 2px solid var(--accent-cyan);
        padding: 3px;
        background: rgba(0,0,0,0.5);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #1a1d24;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .char-info {
        display: flex;
        flex-direction: column;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: #fff;
        margin: 0;
        letter-spacing: 1px;
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-cyan);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 4px;
    }

    /* Stats List */
    .stats-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .stat-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }
    
    .stat-val {
        color: #fff;
        font-weight: 500;
        font-family: monospace;
        font-size: 1rem;
    }

    .xp-wrapper {
        margin-top: 5px;
    }

    .xp-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 6px;
    }

    .xp-track {
        height: 4px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: var(--accent-cyan);
        box-shadow: 0 0 10px var(--accent-cyan);
        position: relative;
    }
    
    .xp-fill::after {
        content: '';
        position: absolute;
        right: 0; top: 0; bottom: 0; width: 20px;
        background: linear-gradient(90deg, transparent, #fff);
        opacity: 0.5;
    }

    /* --- Center (Tree Canvas) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, #000 120%);
        cursor: grab;
    }
    main:active { cursor: grabbing; }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; /* Clicks pass through to empty space */
    }

    /* --- The Node --- */
    .node {
        position: absolute;
        width: 56px;
        height: 56px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Rune / Node Geometry */
    .rune-shape {
        width: 100%;
        height: 100%;
        fill: rgba(10, 12, 16, 0.9);
        stroke: #3a4055;
        stroke-width: 2;
        transition: all 0.3s ease;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .node-icon {
        width: 24px;
        height: 24px;
        fill: #555;
        position: absolute;
        transition: fill 0.3s ease, filter 0.3s ease;
    }

    /* States */
    .node.locked .rune-shape {
        stroke: #2a2d38;
        fill: rgba(20, 20, 25, 0.6);
    }
    
    .node.unlocked .rune-shape {
        stroke: var(--accent-cyan);
        fill: rgba(0, 240, 255, 0.05);
        filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3));
    }
    .node.unlocked .node-icon {
        fill: var(--accent-cyan);
        filter: drop-shadow(0 0 5px var(--accent-cyan));
    }

    .node.maxed .rune-shape {
        stroke: var(--accent-gold);
        fill: rgba(255, 204, 0, 0.05);
        filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.4));
    }
    .node.maxed .node-icon {
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }

    /* Interaction */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.2);
        z-index: 10;
    }
    
    .node.upgrading .rune-shape {
        animation: pulse-void 0.5s ease-out;
    }

    @keyframes pulse-void {
        0% { stroke-width: 2; filter: drop-shadow(0 0 10px var(--accent-gold)); }
        50% { stroke-width: 4; filter: drop-shadow(0 0 25px #fff); }
        100% { stroke-width: 2; filter: drop-shadow(0 0 15px var(--accent-gold)); }
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(12, 14, 20, 0.95);
        border: 1px solid var(--border-dim);
        border-left: 3px solid var(--accent-cyan);
        padding: 15px 20px;
        width: 240px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
        transform: translateY(10px);
    }

    .tooltip.visible { 
        opacity: 1; 
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 5px;
        font-family: var(--font-display);
        color: #fff;
        font-size: 1.1rem;
        letter-spacing: 1px;
    }
    
    .tooltip .desc {
        font-size: 0.8rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 12px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-gold);
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .cost-badge {
        background: rgba(255,255,255,0.1);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.7rem;
        color: #fff;
    }

</style>
</head>
<body>

<div class="bg-atmosphere">
    <div class="nebula"></div>
</div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        Arcanum
    </div>
    <div class="nav-links">
        <span>Inventory</span>
        <span>Journal</span>
        <span>Settings</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <!-- Currency Indicator (Active Layer) -->
        <div class="currency-hud">
            <div>
                <div class="currency-label">Skill Points</div>
            </div>
            <div class="currency-count">
                <span id="sp-display">3</span>
                <svg class="currency-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </div>
        </div>

        <!-- Character Profile -->
        <div class="character-profile">
            <div class="avatar-ring">
                <div class="avatar-img">
                    <!-- Abstract Silhouette -->
                    <svg viewBox="0 0 100 100" style="width:100%; height:100%; fill:#2a3245;">
                        <path d="M50 20 C 30 20, 20 40, 20 60 L 20 80 L 80 80 L 80 60 C 80 40, 70 20, 50 20" />
                        <path d="M50 30 C 40 30, 35 40, 35 50 L 65 50 C 65 40, 60 30, 50 30" fill="#1e232e" />
                    </svg>
                </div>
            </div>
            <div class="char-info">
                <h2 class="char-name">Kaelen</h2>
                <div class="char-class">Void Walker</div>
            </div>
        </div>

        <!-- Stats List -->
        <div class="stats-list">
            <div class="stat-item">
                <span>Level</span>
                <span class="stat-val">42</span>
            </div>
            <div class="stat-item">
                <span>Strength</span>
                <span class="stat-val">124</span>
            </div>
            <div class="stat-item">
                <span>Agility</span>
                <span class="stat-val">89</span>
            </div>
            <div class="stat-item">
                <span>Intelligence</span>
                <span class="stat-val">210</span>
            </div>
            
            <div class="xp-wrapper">
                <div class="xp-header">
                    <span>Experience</span>
                    <span>7,500 / 10,000</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span class="cost-badge" id="tt-cost">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * Skill Data
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute', type: 'core' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength', type: 'weapon' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown', type: 'magic' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance', type: 'weapon' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal', type: 'rune' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP', type: 'magic' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill', type: 'weapon' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed', type: 'rune' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed', type: 'magic' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill', type: 'rune' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%', type: 'core' }
    ];

    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // SVG Paths for Icons
    const icons = {
        weapon: '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>', // Sword/Shield
        magic: '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10h-20A10 10 0 0 1 12 2z" fill="none" stroke="currentColor" stroke-width="2"/>', // Orb
        rune: '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>', // Star
        core: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>' // Diamond
    };

    // SVG Path for Node Shape (Hexagonish)
    const shapePath = "M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            // Center position logic
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            el.innerHTML = `
                <svg class="rune-shape" viewBox="0 0 24 24"><path d="${shapePath}"/></svg>
                <svg class="node-icon" viewBox="0 0 24 24">${icons[skill.type]}</svg>
            `;
            
            // Events
            el.addEventListener('click', () => upgradeSkill(skill));
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineWidth = 2; // Thinner, more precise lines
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Draw Bezier Curve
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            
            // Control points for curve
            const cp1x = start.x;
            const cp1y = start.y + (end.y - start.y) / 2;
            const cp2x = end.x;
            const cp2y = end.y - (end.y - start.y) / 2;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, end.x, end.y);

            if (isUnlocked) {
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00f0ff';
                ctx.globalAlpha = 0.8;
            } else if (isPath) {
                ctx.strokeStyle = '#4a5570';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.6;
            } else {
                ctx.strokeStyle = '#1e232e';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.3;
            }
            
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Animation trigger
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 600);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 15;
        const y = e.clientY - rect.top + 15;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = skill.level >= skill.max ? 'MAXED' : `Cost: ${skill.cost}`;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container || e.target.classList.contains('bg-atmosphere')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
