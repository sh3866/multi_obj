<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Void Walker Matrix</title>
<style>
    :root {
        /* Palette - Deep Void & Neon Ethereal */
        --bg-deep: #040508;
        --bg-panel: rgba(12, 16, 24, 0.6);
        --border-subtle: rgba(255, 255, 255, 0.06);
        
        /* Accents */
        --accent-primary: #00f0ff; /* Cyan - Active */
        --accent-primary-glow: rgba(0, 240, 255, 0.4);
        --accent-secondary: #9d00ff; /* Void Purple - Magic */
        --accent-secondary-glow: rgba(157, 0, 255, 0.4);
        --accent-gold: #ffcc00; /* Gold - Maxed */
        --accent-gold-glow: rgba(255, 204, 0, 0.4);

        /* Typography */
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        --font-display: 'Impact', 'Arial Black', sans-serif; /* Fallback for heavy headers */
        
        /* Colors */
        --text-primary: #ffffff;
        --text-secondary: #8b9bb4;
        --text-muted: #4a5568;
    }

    * { box-sizing: border-box; user-select: none; cursor: default; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background: Deep Space/Noise --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        background: 
            radial-gradient(circle at 80% 20%, rgba(20, 10, 50, 0.6) 0%, transparent 50%),
            radial-gradient(circle at 20% 80%, rgba(0, 30, 50, 0.5) 0%, transparent 50%),
            var(--bg-deep);
        opacity: 0.8;
    }
    
    .bg-noise {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        opacity: 0.04;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Header --- */
    header {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        background: linear-gradient(to bottom, rgba(4,5,8,0.9), rgba(4,5,8,0.2));
        z-index: 10;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 0.8rem;
        letter-spacing: 1px;
        color: var(--text-secondary);
    }

    .brand {
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 10px;
        text-transform: uppercase;
    }

    .brand svg {
        width: 18px;
        height: 18px;
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 5px var(--accent-primary-glow));
    }

    .header-status {
        display: flex;
        gap: 20px;
        opacity: 0.7;
    }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 50px);
        position: relative;
        z-index: 5;
    }

    /* --- Sidebar: Character Dossier --- */
    aside {
        width: 340px;
        height: 100%;
        background: linear-gradient(90deg, rgba(10,13,18,0.95) 0%, rgba(10,13,18,0.7) 90%, transparent 100%);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        z-index: 10;
        padding: 30px;
        backdrop-filter: blur(5px);
    }

    /* Profile Section */
    .character-profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
    }

    .avatar-container {
        position: relative;
        width: 110px;
        height: 110px;
    }

    .avatar-ring {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--text-muted);
        padding: 4px;
        background: #000;
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
    
    /* Animated Hexagon-ish ring */
    .avatar-ring::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1px dashed var(--accent-primary);
        opacity: 0.4;
        animation: spin 20s linear infinite;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    
    .avatar-img svg {
        width: 70%;
        fill: var(--text-secondary);
        opacity: 0.8;
    }

    .char-name {
        font-family: var(--font-ui);
        font-size: 1.8rem;
        color: #fff;
        margin: 0;
        letter-spacing: 0.5px;
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 4px;
        font-weight: 600;
        opacity: 0.9;
        margin-top: -5px;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border-subtle);
        padding: 12px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .stat-card .label {
        font-size: 0.65rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }

    .stat-card .value {
        font-size: 1.1rem;
        color: #fff;
        font-weight: 600;
    }

    /* XP Section */
    .xp-section {
        margin-bottom: 30px;
    }
    
    .xp-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.8rem;
    }
    
    .xp-label { color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
    .xp-val { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }

    .xp-track {
        height: 6px;
        background: rgba(0,0,0,0.4);
        border-radius: 3px;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-primary-glow);
        position: relative;
    }
    
    /* Skill Points (Hero Item) */
    .sp-container {
        background: linear-gradient(135deg, rgba(255, 204, 0, 0.1), rgba(255, 204, 0, 0.02));
        border: 1px solid rgba(255, 204, 0, 0.3);
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(255, 204, 0, 0.05);
        position: relative;
        overflow: hidden;
    }

    /* Geometric accent on SP box */
    .sp-container::before {
        content: '';
        position: absolute;
        top: 0; right: 0; width: 40px; height: 40px;
        background: linear-gradient(135deg, transparent 50%, rgba(255,204,0,0.1) 50%);
    }

    .sp-icon {
        width: 32px;
        height: 32px;
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 8px var(--accent-gold-glow));
    }

    .sp-info { text-align: right; }

    .sp-count {
        font-size: 2rem;
        color: var(--accent-gold);
        font-weight: 700;
        line-height: 1;
        text-shadow: 0 0 10px rgba(255,204,0,0.3);
    }

    /* --- Center (Tree Canvas) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
    }
    main:active { cursor: grabbing; }

    /* Title - Prominent */
    .screen-title {
        position: absolute;
        top: 40px;
        left: 50px;
        z-index: 5;
        pointer-events: none;
    }
    
    .screen-title h1 {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 2.5rem;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 6px;
        font-weight: 800;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
        line-height: 1;
    }
    
    .screen-title p {
        margin: 5px 0 0 2px;
        font-size: 0.9rem;
        color: var(--accent-primary);
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 600;
        opacity: 0.8;
    }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- The Node: Crystalline Artifact --- */
    .node {
        position: absolute;
        width: 80px;
        height: 80px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s;
    }

    /* Crystalline Hexagon Shape */
    .rune-shape {
        width: 100%;
        height: 100%;
        /* Glassy fill */
        fill: rgba(15, 20, 30, 0.8);
        stroke-width: 2;
        transition: all 0.3s ease;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .node-icon {
        width: 36px;
        height: 36px;
        fill: #555;
        position: absolute;
        transition: all 0.3s ease;
        z-index: 3;
        stroke: #555;
        stroke-width: 2px;
        fill: none;
    }
    
    .node-text {
        position: absolute;
        bottom: -24px;
        width: 140px;
        text-align: center;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-secondary);
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.3s;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        pointer-events: none;
    }

    .node:hover .node-text {
        opacity: 1;
        transform: translateY(0);
    }

    /* State: Locked */
    .node.locked .rune-shape {
        stroke: #2a3040;
        fill: rgba(10, 12, 18, 0.9);
    }
    .node.locked .node-icon { 
        stroke: #2a3040; 
        fill: none;
        opacity: 0.5;
    }
    
    /* State: Unlocked (Cyan) */
    .node.unlocked .rune-shape {
        stroke: var(--accent-primary);
        fill: rgba(0, 240, 255, 0.05);
        filter: drop-shadow(0 0 10px var(--accent-primary-glow));
    }
    .node.unlocked .node-icon {
        stroke: var(--accent-primary);
        fill: rgba(0, 240, 255, 0.2);
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }
    .node.unlocked .node-text { color: var(--accent-primary); opacity: 1; transform: translateY(0); }

    /* State: Maxed (Gold) */
    .node.maxed .rune-shape {
        stroke: var(--accent-gold);
        fill: rgba(255, 204, 0, 0.1);
        filter: drop-shadow(0 0 15px var(--accent-gold-glow));
    }
    .node.maxed .node-icon {
        stroke: var(--accent-gold);
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 5px var(--accent-gold));
    }
    .node.maxed .node-text { color: var(--accent-gold); opacity: 1; transform: translateY(0); }

    /* Interaction */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.2);
        z-index: 10;
    }
    
    .node.upgrading .rune-shape {
        animation: pulse-void 0.6s ease-out;
    }

    @keyframes pulse-void {
        0% { stroke-width: 2; filter: drop-shadow(0 0 5px var(--accent-gold)); }
        50% { stroke-width: 5; filter: drop-shadow(0 0 30px #fff); }
        100% { stroke-width: 2; filter: drop-shadow(0 0 15px var(--accent-gold)); }
    }

    @keyframes spin {
        100% { transform: rotate(360deg); }
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(15, 20, 30, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        border-left: 4px solid var(--accent-primary);
        padding: 20px;
        width: 280px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
        transform: translateY(10px);
    }

    .tooltip.visible { 
        opacity: 1; 
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 8px;
        font-family: var(--font-ui);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    
    .tooltip .desc {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 15px;
        font-style: italic;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }

    .tooltip .stats {
        font-size: 0.85rem;
        color: var(--accent-primary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .cost-badge {
        background: rgba(255,255,255,0.05);
        padding: 6px 10px;
        border-radius: 2px;
        font-size: 0.8rem;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>
<div class="bg-noise"></div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        Arcanum
    </div>
    <div class="header-status">
        <span>Zone: The Void</span>
        <span>Server: Stable</span>
    </div>
</header>

<div class="dashboard">
    <aside>
        <!-- Character Profile -->
        <div class="character-profile">
            <div class="avatar-container">
                <div class="avatar-ring">
                    <div class="avatar-img">
                        <!-- Stylized Void Walker Icon -->
                        <svg viewBox="0 0 100 100">
                            <path d="M50 15 C 30 15, 20 35, 20 55 L 20 85 L 80 85 L 80 55 C 80 35, 70 15, 50 15" fill="#222" />
                            <path d="M50 25 C 40 25, 35 40, 35 50 L 65 50 C 65 40, 60 25, 50 25" fill="#444" />
                            <circle cx="50" cy="50" r="10" fill="#00f0ff" opacity="0.8" filter="url(#glow)"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div>
                <h2 class="char-name">Kaelen</h2>
                <div class="char-class">Void Walker</div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="label">Health</span>
                <span class="value" style="color:#ff4444">2,450</span>
            </div>
            <div class="stat-card">
                <span class="label">Mana</span>
                <span class="value" style="color:#44aaff">850</span>
            </div>
            <div class="stat-card">
                <span class="label">Strength</span>
                <span class="value">42</span>
            </div>
            <div class="stat-card">
                <span class="label">Agility</span>
                <span class="value">88</span>
            </div>
        </div>

        <!-- XP Section -->
        <div class="xp-section">
            <div class="xp-header">
                <span class="xp-label">Level 42</span>
                <span class="xp-val">4,200 / 5,000 XP</span>
            </div>
            <div class="xp-track">
                <div class="xp-fill"></div>
            </div>
        </div>

        <!-- Skill Points -->
        <div class="sp-container">
            <svg class="sp-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <div class="sp-info">
                <div class="label" style="font-size: 0.7rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px;">Available Points</div>
                <div class="sp-count" id="sp-display">3</div>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <div class="screen-title">
            <h1>Skill Matrix</h1>
            <p>Void Walker Tree</p>
        </div>
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span class="cost-badge" id="tt-cost">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<!-- SVG Definitions -->
<svg style="display: none;">
    <defs>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
</svg>

<script>
    /**
     * Skill Data
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 85, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute', type: 'core' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 65, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength', type: 'weapon' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 65, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown', type: 'magic' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 45, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance', type: 'weapon' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 45, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal', type: 'rune' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 45, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP', type: 'magic' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 25, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill', type: 'weapon' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 25, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed', type: 'rune' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 25, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed', type: 'magic' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 25, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill', type: 'rune' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%', type: 'core' }
    ];

    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // SVG Paths for Icons (Consistent Stroke)
    const icons = {
        weapon: '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>',
        magic: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
        rune: '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>',
        core: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'
    };

    // Hexagon Shape Path (Crystalline)
    const shapePath = "M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            // Center position logic
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            el.innerHTML = `
                <svg class="rune-shape" viewBox="0 0 24 24"><path d="${shapePath}"/></svg>
                <svg class="node-icon" viewBox="0 0 24 24">${icons[skill.type]}</svg>
                <div class="node-text">${skill.name}</div>
            `;
            
            // Events
            el.addEventListener('click', (e) => { e.stopPropagation(); upgradeSkill(skill); });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering Connections (Energy Ribbons) ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Draw Thick Conduits
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);

            if (isUnlocked) {
                // Glowing Active Path
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00f0ff';
                ctx.globalAlpha = 0.6;
            } else if (isPath) {
                // Available Path (Darker)
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#4a5570';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.4;
            } else {
                // Locked Path (Faint)
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#1e232e';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.2;
            }
            
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Animation trigger
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 600);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 20;
        const y = e.clientY - rect.top + 20;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = skill.level >= skill.max ? 'MAXED' : `Cost: ${skill.cost}`;

        // Dynamic color for cost badge
        const costBadge = document.getElementById('tt-cost');
        if(skill.level >= skill.max) {
            costBadge.style.borderColor = 'var(--accent-gold)';
            costBadge.style.color = 'var(--accent-gold)';
        } else {
            costBadge.style.borderColor = 'rgba(255,255,255,0.1)';
            costBadge.style.color = '#fff';
        }

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container || e.target.classList.contains('bg-atmosphere')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
