<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Skill Matrix</title>
<style>
    :root {
        /* Palette - Deep Void & Ethereal Energy */
        --bg-deep: #030406;
        --bg-panel: rgba(8, 10, 14, 0.85);
        --border-dim: rgba(255, 255, 255, 0.05);
        --border-light: rgba(255, 255, 255, 0.1);
        
        /* Accents */
        --accent-primary: #00f0ff; /* Cyan - Magic/Active */
        --accent-primary-glow: rgba(0, 240, 255, 0.4);
        --accent-secondary: #9d00ff; /* Purple - Void */
        --accent-gold: #ffcc00; /* Gold - Currency */
        
        /* Text */
        --text-primary: #eef2f5;
        --text-secondary: #8b9bb4;
        --text-muted: #4a5568;

        /* Fonts */
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, sans-serif;
        --font-mono: 'Courier New', monospace;
    }

    * {
        box-sizing: border-box;
        user-select: none;
        cursor: default;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Atmosphere --- */
    .bg-atmosphere {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 50%, rgba(15, 20, 30, 0.4) 0%, #030406 80%),
            repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(255,255,255,0.01) 2px),
            repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(255,255,255,0.01) 2px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* --- Header --- */
    header {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 40px;
        background: linear-gradient(to bottom, rgba(3,4,6,0.9), transparent);
        z-index: 10;
        position: relative;
    }

    .brand {
        font-family: var(--font-display);
        font-size: 1rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 400;
    }
    
    .brand svg {
        width: 16px;
        height: 16px;
        fill: var(--accent-primary);
    }

    /* --- Main Layout --- */
    .dashboard {
        display: flex;
        flex: 1;
        height: calc(100vh - 50px);
        position: relative;
    }

    /* --- Sidebar (Stats) --- */
    aside {
        width: 300px;
        height: 100%;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        z-index: 5;
        backdrop-filter: blur(12px);
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        position: relative;
    }

    /* Decorative Sidebar Texture */
    aside::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0V0zm20 20h20v20H20V20zM0 20h20v20H0V20z' fill='%23ffffff' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
        pointer-events: none;
    }

    .sidebar-content {
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        height: 100%;
    }

    /* Character Profile */
    .character-profile {
        display: flex;
        align-items: center;
        gap: 15px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 20px;
    }

    .avatar-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 2px solid var(--text-muted);
        padding: 2px;
        background: #000;
        position: relative;
    }
    
    .avatar-ring::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 1px solid var(--accent-secondary);
        opacity: 0.5;
        animation: pulse-ring 3s infinite;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    
    .avatar-img svg {
        width: 70%;
        height: 70%;
        fill: var(--text-secondary);
        filter: drop-shadow(0 0 2px rgba(255,255,255,0.2));
    }

    .char-info {
        display: flex;
        flex-direction: column;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.3rem;
        color: #fff;
        margin: 0;
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-secondary);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 2px;
        font-weight: 700;
    }

    /* Level & XP Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .level-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .level-val {
        font-family: var(--font-display);
        font-size: 1.5rem;
        color: #fff;
    }

    .xp-track {
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 3px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .xp-fill {
        height: 100%;
        width: 75%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 10px var(--accent-primary-glow);
        position: relative;
    }
    
    /* XP Bar "Glitch" Effect */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 2px;
        background: #fff;
        box-shadow: 0 0 5px #fff;
    }

    /* Skill Points - Demoted but accessible */
    .sp-container {
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border-dim);
        border-left: 2px solid var(--accent-gold);
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto; /* Push to bottom of sidebar if needed, or keep in flow */
    }

    .sp-label {
        font-size: 0.7rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .sp-count {
        font-family: var(--font-mono);
        font-size: 1.1rem;
        color: var(--accent-gold);
        font-weight: bold;
    }

    /* --- Center (Tree Canvas) --- */
    main {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
    }
    main:active { cursor: grabbing; }

    /* Screen Title Overlay */
    .screen-title {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-display);
        font-size: 1.5rem;
        color: rgba(255,255,255,0.8);
        letter-spacing: 6px;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        z-index: 5;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 15px;
    }
    
    .screen-title::before, .screen-title::after {
        content: '';
        display: block;
        width: 40px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-primary));
    }
    .screen-title::after {
        background: linear-gradient(90deg, var(--accent-primary), transparent);
    }

    #tree-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .node-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none; 
    }

    /* --- The Node --- */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s;
    }

    /* Node Shape - Octagon */
    .rune-shape {
        width: 100%;
        height: 100%;
        fill: #0a0c12;
        stroke: #3a4055;
        stroke-width: 2;
        transition: all 0.3s ease;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: #555;
        position: absolute;
        transition: all 0.3s ease;
    }

    /* Node States */
    /* Locked: Inset, dark, flat */
    .node.locked .rune-shape {
        stroke: #2a2d38;
        fill: #08090c;
        filter: drop-shadow(inset 0 0 10px #000);
    }
    .node.locked .node-icon {
        opacity: 0.3;
    }
    
    /* Unlocked: Glowing, crisp borders */
    .node.unlocked .rune-shape {
        stroke: var(--accent-primary);
        fill: rgba(0, 240, 255, 0.05);
        filter: drop-shadow(0 0 10px var(--accent-primary-glow));
    }
    .node.unlocked .node-icon {
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    /* Maxed: Gold, distinct */
    .node.maxed .rune-shape {
        stroke: var(--accent-gold);
        fill: rgba(255, 204, 0, 0.05);
        filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.4));
    }
    .node.maxed .node-icon {
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 8px var(--accent-gold));
    }

    /* Interaction */
    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }
    
    .node.upgrading .rune-shape {
        animation: pulse-void 0.4s ease-out;
    }

    @keyframes pulse-void {
        0% { stroke-width: 2; filter: drop-shadow(0 0 10px var(--accent-gold)); }
        50% { stroke-width: 4; filter: drop-shadow(0 0 30px #fff); }
        100% { stroke-width: 2; filter: drop-shadow(0 0 15px var(--accent-gold)); }
    }

    @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.2; }
        100% { transform: scale(1); opacity: 0.5; }
    }

    /* Tooltip */
    .tooltip {
        position: absolute;
        background: rgba(8, 10, 14, 0.95);
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--accent-primary);
        padding: 15px 20px;
        width: 260px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
        transform: translateY(10px);
    }

    .tooltip.visible { 
        opacity: 1; 
        transform: translateY(0);
    }

    .tooltip h3 {
        margin: 0 0 5px;
        font-family: var(--font-display);
        color: #fff;
        font-size: 1.2rem;
        letter-spacing: 1px;
    }
    
    .tooltip .desc {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 12px;
        font-style: italic;
    }

    .tooltip .stats {
        font-size: 0.8rem;
        color: var(--accent-primary);
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .cost-badge {
        background: rgba(255,255,255,0.05);
        padding: 4px 8px;
        border-radius: 2px;
        font-size: 0.75rem;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.1);
    }

</style>
</head>
<body>

<div class="bg-atmosphere"></div>

<header>
    <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        Arcanum
    </div>
</header>

<div class="dashboard">
    <aside>
        <div class="sidebar-content">
            <!-- Character Profile -->
            <div class="character-profile">
                <div class="avatar-ring">
                    <div class="avatar-img">
                        <svg viewBox="0 0 100 100">
                            <path d="M50 20 C 30 20, 20 40, 20 60 L 20 80 L 80 80 L 80 60 C 80 40, 70 20, 50 20" />
                            <path d="M50 30 C 40 30, 35 40, 35 50 L 65 50 C 65 40, 60 30, 50 30" fill="#1e232e" />
                        </svg>
                    </div>
                </div>
                <div class="char-info">
                    <h2 class="char-name">Kaelen</h2>
                    <div class="char-class">Void Walker</div>
                </div>
            </div>

            <!-- Level & XP -->
            <div class="level-section">
                <div class="level-header">
                    <span class="level-label">Level</span>
                    <span class="level-val">42</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <!-- Skill Points (Bottom) -->
            <div class="sp-container">
                <div class="sp-label">Available Points</div>
                <div class="sp-count" id="sp-display">3</div>
            </div>
        </div>
    </aside>

    <main id="tree-container">
        <div class="screen-title">Skill Matrix</div>
        <canvas id="tree-canvas"></canvas>
        <div class="node-layer" id="node-layer"></div>
        
        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
            <h3 id="tt-title">Skill Name</h3>
            <div class="desc" id="tt-desc">Description goes here.</div>
            <div class="stats">
                <span id="tt-stat">+10% Damage</span>
                <span class="cost-badge" id="tt-cost">Cost: 1</span>
            </div>
        </div>
    </main>
</div>

<script>
    /**
     * Skill Data
     */
    const skillData = [
        // Root
        { id: 'root', name: 'Void Core', x: 50, y: 80, level: 1, max: 1, cost: 0, desc: 'The source of your power.', stat: 'Base Attribute', type: 'core' },
        
        // Tier 1
        { id: 'str_1', name: 'Heavy Handed', x: 30, y: 60, level: 1, max: 3, cost: 1, desc: 'Increases melee damage.', stat: '+5% Strength', type: 'weapon' },
        { id: 'int_1', name: 'Arcane Flow', x: 70, y: 60, level: 0, max: 3, cost: 1, desc: 'Reduces mana regeneration time.', stat: '-10% Cooldown', type: 'magic' },
        
        // Tier 2
        { id: 'str_2', name: 'Titan Grip', x: 15, y: 40, level: 0, max: 3, cost: 2, desc: 'Allows two-handed weapons.', stat: '+15% Crit Chance', type: 'weapon' },
        { id: 'mid_1', name: 'Soul Siphon', x: 50, y: 40, level: 1, max: 3, cost: 1, desc: 'Heals on kill.', stat: '+2% Lifesteal', type: 'rune' },
        { id: 'int_2', name: 'Mana Shield', x: 85, y: 40, level: 0, max: 3, cost: 2, desc: 'Mana absorbs damage.', stat: '+10% Max HP', type: 'magic' },

        // Tier 3
        { id: 'str_3', name: 'Earth Shatter', x: 5, y: 20, level: 0, max: 1, cost: 3, desc: 'Ultimate ability.', stat: 'Unlock Skill', type: 'weapon' },
        { id: 'mid_2', name: 'Phantom Step', x: 35, y: 20, level: 0, max: 3, cost: 2, desc: 'Teleport short distance.', stat: '+5% Move Speed', type: 'rune' },
        { id: 'int_3', name: 'Time Warp', x: 65, y: 20, level: 0, max: 3, cost: 2, desc: 'Slows enemies nearby.', stat: '-20% Enemy Speed', type: 'magic' },
        { id: 'end_1', name: 'Entropy', x: 95, y: 20, level: 0, max: 1, cost: 3, desc: 'Disintegrates matter.', stat: 'Unlock Skill', type: 'rune' },

        // Apex
        { id: 'apex', name: 'Singularity', x: 50, y: 5, level: 0, max: 1, cost: 5, desc: 'Mastery over all void aspects.', stat: 'ALL STATS +10%', type: 'core' }
    ];

    const connections = [
        ['root', 'str_1'], ['root', 'int_1'],
        ['str_1', 'str_2'], ['str_1', 'mid_1'], ['int_1', 'mid_1'], ['int_1', 'int_2'],
        ['str_2', 'str_3'], ['mid_1', 'mid_2'], ['int_2', 'int_3'],
        ['mid_2', 'apex'], ['int_3', 'apex']
    ];

    let availablePoints = 3;
    const canvas = document.getElementById('tree-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('tree-container');
    const nodeLayer = document.getElementById('node-layer');
    const tooltip = document.getElementById('tooltip');
    const spDisplay = document.getElementById('sp-display');

    // Pan/Zoom State
    let scale = 1;
    let panning = false;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    // --- Initialization ---

    function resize() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        drawConnections();
    }

    // SVG Paths for Icons
    const icons = {
        weapon: '<path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>',
        magic: '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10h-20A10 10 0 0 1 12 2z" fill="none" stroke="currentColor" stroke-width="2"/>',
        rune: '<path d="M12 2L15 9h6l-5 4 2 7-8-5-8 5 2-7-5-4h6z"/>',
        core: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>'
    };

    // SVG Path for Node Shape (Octagon)
    const shapePath = "M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z";

    function createNodes() {
        skillData.forEach(skill => {
            const el = document.createElement('div');
            el.className = `node ${skill.level > 0 ? (skill.level === skill.max ? 'maxed' : 'unlocked') : 'locked'}`;
            el.id = `node-${skill.id}`;
            
            // Center position logic
            el.style.left = `${skill.x}%`;
            el.style.top = `${skill.y}%`;
            
            el.innerHTML = `
                <svg class="rune-shape" viewBox="0 0 24 24"><path d="${shapePath}"/></svg>
                <svg class="node-icon" viewBox="0 0 24 24">${icons[skill.type]}</svg>
            `;
            
            // Events
            el.addEventListener('click', (e) => { e.stopPropagation(); upgradeSkill(skill); });
            el.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            el.addEventListener('mouseleave', hideTooltip);

            nodeLayer.appendChild(el);
        });
    }

    // --- Rendering ---

    function drawConnections() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        connections.forEach(([parentId, childId]) => {
            const parent = skillData.find(s => s.id === parentId);
            const child = skillData.find(s => s.id === childId);

            const start = { x: (parent.x / 100) * canvas.width, y: (parent.y / 100) * canvas.height };
            const end = { x: (child.x / 100) * canvas.width, y: (child.y / 100) * canvas.height };

            const isUnlocked = parent.level > 0 && child.level > 0;
            const isPath = parent.level > 0; 

            // Draw Straight Lines (Geometric Discipline)
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);

            if (isUnlocked) {
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.globalAlpha = 0.9;
            } else if (isPath) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#4a5570';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.6;
            } else {
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#1e232e';
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.3;
            }
            
            ctx.stroke();
        });
        ctx.restore();
    }

    // --- Logic ---

    function upgradeSkill(skill) {
        if (availablePoints <= 0) return;
        if (skill.level >= skill.max) return;
        
        availablePoints--;
        skill.level++;
        
        spDisplay.textContent = availablePoints;
        
        // Update DOM
        const node = document.getElementById(`node-${skill.id}`);
        node.classList.remove('locked');
        node.classList.add(skill.level === skill.max ? 'maxed' : 'unlocked');
        
        // Animation trigger
        node.classList.add('upgrading');
        setTimeout(() => node.classList.remove('upgrading'), 600);

        drawConnections();
    }

    function showTooltip(e, skill) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left + 15;
        const y = e.clientY - rect.top + 15;

        document.getElementById('tt-title').textContent = skill.name;
        document.getElementById('tt-desc').textContent = skill.desc;
        document.getElementById('tt-stat').textContent = skill.stat;
        document.getElementById('tt-cost').textContent = skill.level >= skill.max ? 'MAXED' : `Cost: ${skill.cost}`;

        // Dynamic color for cost badge
        const costBadge = document.getElementById('tt-cost');
        if(skill.level >= skill.max) {
            costBadge.style.borderColor = 'var(--accent-gold)';
            costBadge.style.color = 'var(--accent-gold)';
        } else {
            costBadge.style.borderColor = 'rgba(255,255,255,0.1)';
            costBadge.style.color = '#fff';
        }

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.classList.add('visible');
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    // --- Interaction (Pan) ---
    
    container.addEventListener('mousedown', (e) => {
        if(e.target === canvas || e.target === container || e.target.classList.contains('bg-atmosphere')) {
            panning = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        }
    });

    window.addEventListener('mouseup', () => { panning = false; });

    window.addEventListener('mousemove', (e) => {
        if (!panning) return;
        e.preventDefault();
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        drawConnections();
    });

    // --- Init ---
    window.addEventListener('resize', resize);
    createNodes();
    resize();

</script>
</body>
</html>
