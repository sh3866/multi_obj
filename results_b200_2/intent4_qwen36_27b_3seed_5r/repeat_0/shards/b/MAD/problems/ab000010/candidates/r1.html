<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere Life: Hexagonal Automata</title>
    <style>
        :root {
            --bg-color: #030305;
            --panel-bg: rgba(12, 12, 16, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --accent-cyan: #00f2ff;
            --accent-magenta: #ff0055;
            --font-stack: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            /* Layout Change: Panel is now ~25% width */
            grid-template-columns: 1fr 320px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Subtle radial gradient for depth */
            background: radial-gradient(circle at center, #0a0a12 0%, #000000 100%);
        }

        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Control Panel */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--panel-border);
            padding: 32px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            box-shadow: -10px 0 50px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Typography */
        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
            color: #fff;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 400;
        }

        /* Layout Change: Stats moved to top */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--panel-border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: auto; /* Pushes buttons down if needed, but we have fixed structure */
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px; /* 8px grid spacing */
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; /* 8px grid */
            margin-bottom: 8px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-stack);
            text-align: center;
        }

        button:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        /* Layout Change: Pause button styling */
        button#toggleBtn {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            font-weight: 700;
        }
        button#toggleBtn:hover {
            background: #e0e0e0;
            border-color: #e0e0e0;
            transform: translateY(-1px);
        }

        /* Layout Change: Clear All button styling */
        button#clearBtn {
            width: 100%;
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
            background: rgba(255, 107, 107, 0.05);
        }
        button#clearBtn:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: rgba(255, 107, 107, 0.6);
        }

        /* Responsive */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: auto;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="panel">
            <div>
                <h1>Sphere Life</h1>
                <p class="subtitle">Hexagonal manifold automaton. Drag to rotate.</p>
            </div>

            <!-- Layout Change: Stats moved to top -->
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>

            <div class="control-group">
                <div>
                    <div class="label-row">
                        <span>Simulation Speed</span>
                        <span id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div>
                    <div class="label-row">
                        <span>Cell Density</span>
                        <span id="densityVal">High</span>
                    </div>
                    <input type="range" id="densitySlider" min="15" max="45" value="25">
                </div>
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Actions</span>
                </div>
                <div class="btn-group">
                    <button id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button id="clearBtn">Clear All</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 25, // Start higher for density
            speed: 10, 
            evolutionRate: 0.03
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellAge = []; // Store age for coloring
        
        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value;
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                document.getElementById('densityVal').innerText = val < 25 ? "High" : (val < 38 ? "Med" : "Low");
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            // We use a latitude/longitude grid structure.
            // Even though we draw hexagons, the topology is a standard grid wrapped around.
            // To make it look like a hex grid, we offset the drawing of every other row.
            const rows = CONFIG.gridResolution;
            const cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[0].length; x++) {
                    grid[y][x] = Math.random() > 0.7 ? 1 : 0;
                    cellAge[y][x] = Math.random() * 100;
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; // Reset age for new cells
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        function countNeighbors(x, y) {
            let sum = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);

            if (!isDragging) {
                targetRotationY += 0.001; // Gentle auto spin
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // Draw Sphere Silhouette (Deep Indigo)
            // This creates the "Deep Space" contrast for dead cells
            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.9, centerX, centerY, radius * 1.05);
            gradient.addColorStop(0, 'rgba(10, 10, 20, 0.1)');
            gradient.addColorStop(0.9, 'rgba(20, 20, 40, 0.8)'); // Visible edge
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.1, 0, Math.PI * 2);
            ctx.fill();

            // Render Cells
            const rows = grid.length;
            const cols = grid[0].length;

            // Pre-calculate rotation matrix components to save math inside loop
            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            const fov = 800;

            // To ensure correct Z-ordering (optional but nice), we could sort, 
            // but for a dense sphere, simple alpha blending is usually sufficient and much faster.
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Map grid to Sphere
                    const u = x / cols;
                    const v = y / rows;

                    // Spherical coordinates
                    const theta = u * 2 * Math.PI;
                    const phi = (v * Math.PI) - (Math.PI / 2);

                    // 3D Point on Sphere
                    let px = radius * Math.cos(phi) * Math.cos(theta);
                    let py = radius * Math.sin(phi);
                    let pz = radius * Math.cos(phi) * Math.sin(theta);

                    // Rotate Y
                    let x1 = px * cosY - pz * sinY;
                    let z1 = px * sinY + pz * cosY;
                    
                    // Rotate X
                    let y2 = py * cosX - z1 * sinX;
                    let z2 = py * sinX + z1 * cosX;

                    // Perspective
                    // If z2 > -radius * 0.5, it's on the front half
                    if (z2 > -radius * 0.1) continue; // Cull backface

                    const scale = fov / (fov + z2);
                    const screenX = centerX + x1 * scale;
                    const screenY = centerY + y2 * scale;

                    // Draw Hexagon
                    // Size depends on grid density and perspective
                    // We calculate the arc length per cell to determine radius
                    const cellRadius = (Math.PI * radius / cols) * scale * 0.9; 

                    if (grid[y][x] === 1) {
                        drawHexagon(screenX, screenY, cellRadius, z2, cellAge[y][x]);
                    } else {
                        // Draw dead cells faintly to show the grid structure
                        drawHexagon(screenX, screenY, cellRadius, z2, -1);
                    }
                }
            }
        }

        function drawHexagon(cx, cy, r, z, age) {
            // Calculate brightness based on Z (front is bright, back is dark)
            // z ranges from -radius (front) to 0 (equator)
            const depthRatio = Math.max(0, Math.min(1, (-z + radius) / (2 * radius)));
            
            // 1. Hexagon Geometry
            // We offset odd rows to simulate hex packing visually
            // (Though topologically it's a grid, visually we shift x)
            // Note: This is purely cosmetic for the "Hex" look
            
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            // 2. Color Logic
            if (age === -1) {
                // Dead Cell: Deep Indigo/Dark Blue
                // We want this to define the silhouette
                const alpha = depthRatio * 0.15; // Very faint
                ctx.fillStyle = `rgba(20, 25, 45, ${alpha})`;
                ctx.fill();
                // Stroke to define grid
                ctx.strokeStyle = `rgba(40, 50, 80, ${alpha * 0.5})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
                return;
            }

            // Active Cell: Heat Map Gradient
            // Low age = Cyan/Blue, High age = Magenta/White
            // Cycle hue
            const hue = 200 + (age * 2) % 160; // 200 (Cyan) -> 360 (Red/Magenta)
            const saturation = 100;
            const lightness = 50 + (depthRatio * 30); // Brighter in front
            
            // Alpha based on depth (fade out at edges)
            const alpha = 0.3 + (depthRatio * 0.7);

            ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
            
            // Glow effect for front cells
            if (depthRatio > 0.8) {
                ctx.shadowBlur = 8 * depthRatio;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.6)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fill();
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function loop() {
            if (isRunning) {
                const step = Math.max(1, Math.floor(CONFIG.speed));
                if (frameCount % step === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
</html>
