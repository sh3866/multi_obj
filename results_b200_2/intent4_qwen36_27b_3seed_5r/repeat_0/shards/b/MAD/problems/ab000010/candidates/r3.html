<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere Life: Neon Automata</title>
    <style>
        :root {
            --bg-color: #030305;
            --glass-bg: rgba(10, 12, 16, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            
            --text-main: #e0e0e0;
            --text-dim: #6e7681;
            
            --accent-primary: #4f46e5; /* Indigo */
            --accent-glow: #6366f1;
            --accent-danger: #ef4444;
            
            --font-ui: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'SF Mono', 'Roboto Mono', 'Fira Code', 'Menlo', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 360px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0b0c15 0%, #000000 100%);
        }

        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Control Panel - Glassmorphism */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(120%);
            -webkit-backdrop-filter: blur(40px) saturate(120%);
            border-left: 1px solid var(--glass-border);
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Typography */
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            color: #fff;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 48px;
            border-left: 2px solid var(--accent-primary);
            padding-left: 12px;
        }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--glass-border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 400;
            color: #fff;
            letter-spacing: -0.03em;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .stat-label {
            font-family: var(--font-ui);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 32px;
            margin-bottom: 48px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .label-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            font-weight: 600;
        }

        .label-value {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-main);
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-top: 8px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.2);
            border: 2px solid rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Buttons Section */
        .actions-container {
            margin-top: auto;
            padding-top: 16px;
        }

        .label-row-section {
            margin-bottom: 16px;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        button {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-ui);
            flex: 1;
            text-align: center;
            letter-spacing: 0.02em;
        }

        button:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Primary Action */
        button#toggleBtn {
            background: var(--accent-primary);
            color: #fff;
            border: 1px solid var(--accent-primary);
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        button#toggleBtn:hover {
            background: var(--accent-glow);
            border-color: var(--accent-glow);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        /* Danger Action */
        button#clearBtn {
            width: 100%;
            color: var(--text-dim);
            border: 1px dashed rgba(255,255,255,0.1);
            font-size: 11px;
            padding: 10px;
            margin-top: 8px;
        }
        button#clearBtn:hover {
            color: var(--accent-danger);
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }

        /* Responsive */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: auto;
                max-height: 45vh;
                border-left: none;
                border-top: 1px solid var(--glass-border);
                padding: 32px 24px;
            }
            h1 { font-size: 20px; }
            .stat-val { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="panel">
            <div>
                <h1>Sphere Life</h1>
                <p class="subtitle">Hexagonal manifold automaton. Drag to rotate the geometry.</p>
            </div>

            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>

            <div class="control-group">
                <div>
                    <div class="label-row">
                        <span class="label-title">Simulation Speed</span>
                        <span class="label-value" id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div>
                    <div class="label-row">
                        <span class="label-title">Cell Density</span>
                        <span class="label-value" id="densityVal">30</span>
                    </div>
                    <input type="range" id="densitySlider" min="15" max="45" value="30">
                </div>
            </div>

            <div class="actions-container">
                <div class="label-row label-row-section">
                    <span class="label-title">Actions</span>
                </div>
                <div class="btn-row">
                    <button id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button id="clearBtn">Clear All Cells</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 30, // Default density
            speed: 10, 
            evolutionRate: 0.04
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellAge = []; // Store age for coloring
        
        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value;
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                document.getElementById('densityVal').innerText = val;
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            // Adjust radius based on screen size
            radius = Math.min(width, height) * 0.32;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            const rows = CONFIG.gridResolution;
            const cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[0].length; x++) {
                    grid[y][x] = Math.random() > 0.75 ? 1 : 0;
                    cellAge[y][x] = Math.random() * 50;
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; // Reset age for new cells
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        function countNeighbors(x, y) {
            let sum = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);

            if (!isDragging) {
                targetRotationY += 0.0015; // Gentle auto spin
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // 1. Atmospheric Nebula Glow (Behind Sphere)
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const glowGradient = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.8);
            glowGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            glowGradient.addColorStop(0.5, 'rgba(20, 0, 40, 0.0)');
            glowGradient.addColorStop(0.7, 'rgba(79, 70, 229, 0.1)'); // Indigo rim
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. Sphere Silhouette (Deep Indigo/Dark) - The "3D Form"
            const sphereGradient = ctx.createRadialGradient(centerX, centerY, radius * 0.9, centerX, centerY, radius * 1.0);
            sphereGradient.addColorStop(0, 'rgba(10, 10, 20, 0.0)');
            sphereGradient.addColorStop(0.8, 'rgba(15, 15, 25, 0.5)'); 
            sphereGradient.addColorStop(1, 'rgba(30, 30, 50, 0.8)');
            
            ctx.fillStyle = sphereGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // 3. Render Cells & Wireframe
            const rows = grid.length;
            const cols = grid[0].length;

            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            const fov = 800;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Map grid to Sphere
                    const u = x / cols;
                    const v = y / rows;

                    const theta = u * 2 * Math.PI;
                    const phi = (v * Math.PI) - (Math.PI / 2);

                    // 3D Point on Sphere
                    let px = radius * Math.cos(phi) * Math.cos(theta);
                    let py = radius * Math.sin(phi);
                    let pz = radius * Math.cos(phi) * Math.sin(theta);

                    // Rotate Y
                    let x1 = px * cosY - pz * sinY;
                    let z1 = px * sinY + pz * cosY;
                    
                    // Rotate X
                    let y2 = py * cosX - z1 * sinX;
                    let z2 = py * sinX + z1 * cosX;

                    // Perspective
                    // Cull backface (z2 > 0)
                    if (z2 > -radius * 0.1) continue; 

                    const scale = fov / (fov + z2);
                    const screenX = centerX + x1 * scale;
                    const screenY = centerY + y2 * scale;

                    // Hexagon Size
                    const cellRadius = (Math.PI * radius / cols) * scale * 0.95; 

                    // Hex Offset (Visual only)
                    const hexOffset = (y % 2 === 0) ? cellRadius * 0.5 : -cellRadius * 0.5;
                    
                    if (grid[y][x] === 1) {
                        drawHexagon(screenX + (y%2===0?2:-2), screenY, cellRadius, z2, cellAge[y][x]);
                    } else {
                        drawHexagon(screenX + (y%2===0?2:-2), screenY, cellRadius, z2, -1);
                    }
                }
            }
        }

        function drawHexagon(cx, cy, r, z, age) {
            // Calculate brightness based on Z (front is bright, back is dark)
            // z ranges from -radius (front) to 0 (equator)
            const depthRatio = Math.max(0, Math.min(1, (-z + radius) / (2 * radius)));
            
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            if (age === -1) {
                // Dead Cell: Dark Grid (Wireframe look)
                const alpha = depthRatio * 0.15; 
                ctx.fillStyle = `rgba(10, 15, 30, ${alpha})`;
                ctx.fill();
                // Subtle stroke for wireframe effect
                ctx.strokeStyle = `rgba(100, 120, 200, ${alpha * 0.5})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
                return;
            }

            // ACTIVE CELL COLOR LOGIC (Multi-hue Gradient)
            // 0 age = Cyan (190)
            // 50 age = Violet (280)
            // 100+ age = Magenta/Hot (320)
            
            // Map age 0-100 to Hue 190-330
            const hue = 190 + (age * 1.4) % 140; 
            
            const saturation = 100;
            
            // Lightness: Brighter in front
            const pulse = Math.sin(Date.now() * 0.005 + age) * 5;
            const lightness = 50 + (depthRatio * 30) + (depthRatio > 0.8 ? pulse : 0);
            
            // Alpha: Fade at edges
            const alpha = 0.5 + (depthRatio * 0.5);

            ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
            
            // GLOW EFFECT - Enhanced
            if (depthRatio > 0.85) {
                ctx.shadowBlur = 15 * depthRatio;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fill();
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function loop() {
            if (isRunning) {
                const step = Math.max(1, Math.floor(CONFIG.speed));
                if (frameCount % step === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
</html>
