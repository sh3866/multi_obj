<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Core: Sphere Life</title>
    <style>
        :root {
            /* Nebula Palette */
            --nebula-deep: #2e1065;
            --nebula-blue: #0ea5e9;
            --nebula-magenta: #d946ef;
            --nebula-cyan: #22d3ee;
            
            --bg-void: #030305;
            --bg-panel: rgba(10, 10, 15, 0.6);
            
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --font-geo: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            font-family: var(--font-geo);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Main Layout */
        .viewport {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at 30% 40%, #11111a 0%, #000000 100%);
            overflow: hidden;
            cursor: grab;
        }
        .viewport:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism Control Panel */
        .panel {
            width: 360px;
            height: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-left: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 40px;
            z-index: 10;
            box-shadow: -10px 0 50px rgba(0,0,0,0.5);
        }

        /* Typography */
        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 40px;
            letter-spacing: 0.02em;
        }

        /* Layout Groups */
        .section {
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .value-display {
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 12px;
            color: var(--nebula-cyan);
            background: rgba(34, 211, 238, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Stats Grid */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .stat-block {
            display: flex;
            flex-direction: column;
        }

        .stat-val {
            font-size: 28px;
            font-weight: 300;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        /* Controls */
        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Action Buttons */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-highlight);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Primary Action - Magenta Glow */
        .btn-primary {
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.15), rgba(217, 70, 239, 0.05));
            border: 1px solid rgba(217, 70, 239, 0.4);
            color: #fff;
            box-shadow: 0 4px 20px rgba(217, 70, 239, 0.15);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.25), rgba(217, 70, 239, 0.1));
            box-shadow: 0 6px 25px rgba(217, 70, 239, 0.25);
        }

        .btn-clear {
            width: 100%;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .btn-clear:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }

        /* Responsive */
        @media (max-width: 800px) {
            body { flex-direction: column; }
            .viewport { height: 60vh; }
            .panel { width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--glass-border); padding: 24px; }
        }
    </style>
</head>
<body>

    <div class="viewport" id="viewport">
        <canvas id="lifeCanvas"></canvas>
    </div>

    <div class="panel">
        <div>
            <h1>Sphere Life</h1>
            <div class="subtitle">NEBULA GENERATION // V.2.0</div>
        </div>

        <!-- Actions Moved to Top -->
        <div class="section">
            <div class="section-header">
                <span class="label">Simulation Control</span>
            </div>
            <div class="actions-grid">
                <button id="toggleBtn" class="btn btn-primary">Pause</button>
                <button id="resetBtn" class="btn">Randomize</button>
            </div>
            <button id="clearBtn" class="btn btn-clear">Clear All Cells</button>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-block">
                <span class="stat-val" id="genCount">0000</span>
                <span class="label">Generations</span>
            </div>
            <div class="stat-block">
                <span class="stat-val" id="popCount">0000</span>
                <span class="label">Population</span>
            </div>
        </div>

        <!-- Parameters Grouped -->
        <div class="section">
            <div class="section-header">
                <span class="label">Simulation Speed</span>
                <span class="value-display" id="speedVal">50%</span>
            </div>
            <input type="range" id="speedSlider" min="0" max="100" value="50">
        </div>

        <div class="section">
            <div class="section-header">
                <span class="label">Grid Resolution</span>
                <span class="value-display" id="densityVal">100</span>
            </div>
            <input type="range" id="densitySlider" min="40" max="150" value="100">
        </div>

    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const viewport = document.getElementById('viewport');
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            gridResolution: 100, // Higher density default
            speed: 5, // Lower = faster
            evolutionRate: 0.08,
            cellSizeScale: 1.1 // Slight overlap for solid look
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellAge = []; 
        
        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            viewport.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            viewport.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                CONFIG.speed = Math.max(1, 100 - val);
                document.getElementById('speedVal').innerText = val + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                CONFIG.gridResolution = val;
                document.getElementById('densityVal').innerText = val;
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            width = viewport.clientWidth;
            height = viewport.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
        }

        function createGrid() {
            const rows = CONFIG.gridResolution;
            const cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[0].length; x++) {
                    grid[y][x] = Math.random() > 0.6 ? 1 : 0;
                    cellAge[y][x] = Math.random() * 100;
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; 
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            document.getElementById('genCount').innerText = generation.toString().padStart(4, '0');
            document.getElementById('popCount').innerText = population.toString().padStart(4, '0');
        }

        function countNeighbors(x, y) {
            let sum = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);

            if (!isDragging) {
                targetRotationY += 0.0015; 
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // 1. Atmospheric Glow (Nebula)
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const glowGradient = ctx.createRadialGradient(centerX, centerY, radius * 0.4, centerX, centerY, radius * 2.2);
            glowGradient.addColorStop(0, 'rgba(46, 16, 101, 0.2)'); // Deep Purple Core
            glowGradient.addColorStop(0.4, 'rgba(14, 165, 233, 0.05)'); // Blue fade
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. Sphere Body (Dark Void)
            const sphereGradient = ctx.createRadialGradient(centerX, centerY, radius * 0.9, centerX, centerY, radius * 1.05);
            sphereGradient.addColorStop(0, 'rgba(0, 0, 0, 0.0)');
            sphereGradient.addColorStop(0.8, 'rgba(10, 10, 15, 0.8)'); 
            sphereGradient.addColorStop(1, 'rgba(20, 20, 30, 1)');
            
            ctx.fillStyle = sphereGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // 3. Render Cells
            const rows = grid.length;
            const cols = grid[0].length;

            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            const fov = 800;

            // Sort by Z depth is expensive, so we just draw back-to-front by assuming Z order in loop isn't strictly necessary for hex grid due to overlap,
            // but for a sphere, strict Z-sorting is hard. We rely on alpha blending.
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Map grid to Sphere
                    const u = x / cols;
                    const v = y / rows;

                    const theta = u * 2 * Math.PI;
                    const phi = (v * Math.PI) - (Math.PI / 2);

                    // 3D Point on Sphere
                    let px = radius * Math.cos(phi) * Math.cos(theta);
                    let py = radius * Math.sin(phi);
                    let pz = radius * Math.cos(phi) * Math.sin(theta);

                    // Rotate Y
                    let x1 = px * cosY - pz * sinY;
                    let z1 = px * sinY + pz * cosY;
                    
                    // Rotate X
                    let y2 = py * cosX - z1 * sinX;
                    let z2 = py * sinX + z1 * cosX;

                    // Cull backface
                    if (z2 > 0) continue; 

                    const scale = fov / (fov + z2);
                    const screenX = centerX + x1 * scale;
                    const screenY = centerY + y2 * scale;

                    // Hexagon Size
                    const cellRadius = (Math.PI * radius / cols) * scale * 1.05; 

                    if (grid[y][x] === 1) {
                        drawHexagon(screenX, screenY, cellRadius, z2, cellAge[y][x], true);
                    } else {
                        drawHexagon(screenX, screenY, cellRadius, z2, -1, false);
                    }
                }
            }
        }

        function drawHexagon(cx, cy, r, z, age, isActive) {
            // Depth calculation (0 = back, 1 = front)
            const depthRatio = Math.max(0, Math.min(1, (-z + radius) / (2 * radius)));
            
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            if (!isActive) {
                // Dead Cell: Subtle Wireframe
                const alpha = depthRatio * 0.1; 
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(100, 120, 200, ${alpha * 0.5})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
                return;
            }

            // ACTIVE CELL COLOR LOGIC (Nebula Gradient)
            // Age 0 -> Neon Cyan
            // Age Mid -> Electric Blue -> Neon Magenta
            // Age High -> Deep Violet
            
            const ageNorm = (age % 100) / 100;
            let hue, sat, light;

            // Gradient: Cyan(180) -> Blue(220) -> Magenta(290) -> Violet(270)
            if (ageNorm < 0.3) {
                hue = 180 + (ageNorm / 0.3) * 40; // Cyan to Blue
            } else if (ageNorm < 0.7) {
                hue = 220 + ((ageNorm - 0.3) / 0.4) * 70; // Blue to Magenta
            } else {
                hue = 290 - ((ageNorm - 0.7) / 0.3) * 20; // Magenta to Deep Violet
            }
            
            sat = 100;
            light = 50 + (depthRatio * 20); // Brighter in front
            
            // Alpha Fade at edges
            const alpha = 0.7 + (depthRatio * 0.3);

            ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
            
            // Glow Effect
            if (depthRatio > 0.8) {
                ctx.shadowBlur = 15 * depthRatio;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.6)`;
            } else if (depthRatio > 0.5) {
                ctx.shadowBlur = 5;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.3)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function loop() {
            if (isRunning) {
                if (frameCount % CONFIG.speed === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
</html>
