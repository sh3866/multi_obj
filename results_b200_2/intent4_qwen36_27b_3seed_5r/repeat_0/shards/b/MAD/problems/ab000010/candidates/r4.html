<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere Life: Nebula Core</title>
    <style>
        :root {
            --bg-void: #050508;
            --bg-panel: rgba(12, 12, 18, 0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            
            --text-main: #ececec;
            --text-muted: #8888a0;
            
            /* The Nebula Palette */
            --nebula-deep: #312e81; /* Deep Indigo */
            --nebula-mid: #7c3aed;  /* Electric Purple */
            --nebula-cyan: #06b6d4; /* Neon Cyan */
            --nebula-hot: #f43f5e;  /* Hot Pink */
            
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Layout */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Deep space background gradient */
            background: radial-gradient(circle at 50% 50%, #0f0f1a 0%, #000000 100%);
        }

        canvas {
            display: block;
            cursor: grab;
            touch-action: none;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Mission Control Panel - Glassmorphism */
        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border-left: 1px solid var(--border-glass);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            box-shadow: -20px 0 60px rgba(0,0,0,0.6);
            z-index: 10;
            transition: transform 0.3s ease;
        }

        /* Header */
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: #fff;
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Technical Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border-glass);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 28px;
            font-weight: 400;
            color: var(--text-main);
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .stat-label {
            font-family: var(--font-ui);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Controls Section */
        .control-section {
            margin-bottom: 40px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .label-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .label-value {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Custom Range Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-top: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
        }

        /* Actions Block */
        .actions-block {
            margin-top: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 20px;
        }

        .actions-label {
            margin-bottom: 16px;
            display: block;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-ui);
            text-align: center;
        }

        button:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--border-highlight);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Primary Action - Glowing Accent */
        button#toggleBtn {
            background: linear-gradient(135deg, var(--nebula-mid), var(--nebula-hot));
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }
        button#toggleBtn:hover {
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.5);
            filter: brightness(1.1);
        }

        /* Danger Action */
        button#clearBtn {
            width: 100%;
            color: var(--text-muted);
            border: 1px dashed rgba(255,255,255,0.1);
            font-size: 11px;
            padding: 10px;
        }
        button#clearBtn:hover {
            color: var(--nebula-hot);
            border-color: rgba(244, 63, 94, 0.3);
            background: rgba(244, 63, 94, 0.05);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: auto;
                max-height: 50vh;
                border-left: none;
                border-top: 1px solid var(--border-glass);
                padding: 32px 24px;
            }
            h1 { font-size: 24px; }
            .stat-val { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="panel">
            <div>
                <h1>Sphere Life</h1>
                <p class="subtitle">Automata Simulation // Nebula Class</p>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0000</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0000</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span class="label-title">Simulation Speed</span>
                    <span class="label-value" id="speedVal">100%</span>
                </div>
                <input type="range" id="speedSlider" min="0" max="100" value="50">
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span class="label-title">Grid Resolution</span>
                    <span class="label-value" id="densityVal">60</span>
                </div>
                <input type="range" id="densitySlider" min="30" max="90" value="60">
            </div>

            <div class="actions-block">
                <span class="label-title actions-label">Actions</span>
                <div class="btn-row">
                    <button id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button id="clearBtn">Clear All Cells</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 60, // Higher default for density
            speed: 5, // Lower number = faster updates
            evolutionRate: 0.05
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellAge = []; // Store age for coloring
        
        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                // Invert logic: higher slider = faster speed (lower delay)
                const val = parseInt(e.target.value);
                CONFIG.speed = Math.max(1, 100 - val);
                document.getElementById('speedVal').innerText = val + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                document.getElementById('densityVal').innerText = val;
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            // Adjust radius based on screen size
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            const rows = CONFIG.gridResolution;
            const cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[0].length; x++) {
                    grid[y][x] = Math.random() > 0.65 ? 1 : 0;
                    cellAge[y][x] = Math.random() * 100;
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; // Reset age for new cells
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            // Pad numbers for technical look
            document.getElementById('genCount').innerText = generation.toString().padStart(4, '0');
            document.getElementById('popCount').innerText = population.toString().padStart(4, '0');
        }

        function countNeighbors(x, y) {
            let sum = 0;
            const rows = grid.length;
            const cols = grid[0].length;

            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            if (!isDragging) {
                targetRotationY += 0.002; // Gentle auto spin
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // 1. Atmospheric Nebula Glow (Behind Sphere)
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const glowGradient = ctx.createRadialGradient(centerX, centerY, radius * 0.5, centerX, centerY, radius * 2);
            glowGradient.addColorStop(0, 'rgba(124, 58, 237, 0.15)'); // Purple core
            glowGradient.addColorStop(0.4, 'rgba(6, 182, 212, 0.05)'); // Cyan fade
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. Sphere Silhouette (Deep Indigo/Dark) - The "3D Form"
            // This creates the physical body of the sphere
            const sphereGradient = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.0);
            sphereGradient.addColorStop(0, 'rgba(10, 10, 20, 0.0)');
            sphereGradient.addColorStop(0.8, 'rgba(20, 20, 35, 0.6)'); 
            sphereGradient.addColorStop(1, 'rgba(40, 40, 60, 0.9)');
            
            ctx.fillStyle = sphereGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // 3. Render Cells & Wireframe
            const rows = grid.length;
            const cols = grid[0].length;

            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            const fov = 800;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Map grid to Sphere
                    const u = x / cols;
                    const v = y / rows;

                    const theta = u * 2 * Math.PI;
                    const phi = (v * Math.PI) - (Math.PI / 2);

                    // 3D Point on Sphere
                    let px = radius * Math.cos(phi) * Math.cos(theta);
                    let py = radius * Math.sin(phi);
                    let pz = radius * Math.cos(phi) * Math.sin(theta);

                    // Rotate Y
                    let x1 = px * cosY - pz * sinY;
                    let z1 = px * sinY + pz * cosY;
                    
                    // Rotate X
                    let y2 = py * cosX - z1 * sinX;
                    let z2 = py * sinX + z1 * cosX;

                    // Perspective
                    // Cull backface (z2 > 0)
                    if (z2 > -radius * 0.1) continue; 

                    const scale = fov / (fov + z2);
                    const screenX = centerX + x1 * scale;
                    const screenY = centerY + y2 * scale;

                    // Hexagon Size - slightly larger for density look
                    const cellRadius = (Math.PI * radius / cols) * scale * 0.98; 

                    if (grid[y][x] === 1) {
                        drawHexagon(screenX, screenY, cellRadius, z2, cellAge[y][x], true);
                    } else {
                        drawHexagon(screenX, screenY, cellRadius, z2, -1, false);
                    }
                }
            }
        }

        function drawHexagon(cx, cy, r, z, age, isActive) {
            // Calculate brightness based on Z (front is bright, back is dark)
            // z ranges from -radius (front) to 0 (equator)
            const depthRatio = Math.max(0, Math.min(1, (-z + radius) / (2 * radius)));
            
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            if (!isActive) {
                // Dead Cell: Dark Grid (Wireframe look)
                const alpha = depthRatio * 0.15; 
                ctx.fillStyle = `rgba(10, 15, 30, ${alpha})`;
                ctx.fill();
                // Subtle stroke for wireframe effect
                ctx.strokeStyle = `rgba(100, 120, 200, ${alpha * 0.5})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
                return;
            }

            // ACTIVE CELL COLOR LOGIC (Nebula Gradient)
            // Map age 0-100 to Hue:
            // 0 = Neon Cyan (190)
            // 40 = Electric Purple (270)
            // 80 = Hot Pink (330)
            // 100+ = Deep Indigo (240) -> Cycle
            
            const ageNorm = (age % 120) / 120;
            let hue;
            if (ageNorm < 0.4) {
                // Cyan to Purple
                hue = 190 + (ageNorm * 200); 
            } else if (ageNorm < 0.8) {
                // Purple to Hot Pink
                hue = 270 + ((ageNorm - 0.4) * 200);
            } else {
                // Hot Pink to Deep Indigo
                hue = 330 + ((ageNorm - 0.8) * 200);
            }
            
            // Saturation & Lightness
            const saturation = 100;
            const lightness = 50 + (depthRatio * 30); // Brighter in front
            
            // Alpha: Fade at edges
            const alpha = 0.6 + (depthRatio * 0.4);

            ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
            
            // BLOOM EFFECT - Post-processing simulation
            // Only apply heavy glow to cells near the front to save performance
            if (depthRatio > 0.85) {
                ctx.shadowBlur = 20 * depthRatio;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.6)`;
            } else if (depthRatio > 0.6) {
                ctx.shadowBlur = 10 * depthRatio;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.3)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fill();
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function loop() {
            if (isRunning) {
                // Speed Logic: if CONFIG.speed is high (slow), we skip updates
                // If CONFIG.speed is low (fast), we update every frame
                const step = CONFIG.speed; 
                if (frameCount % step === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
</html>
