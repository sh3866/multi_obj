<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    /* Palette: Deep Void & Ethereal Neon */
    --bg-deep: #030409;
    --bg-panel: rgba(10, 15, 30, 0.65);
    --accent-primary: #00f0ff; /* Cyan */
    --accent-secondary: #ff0055; /* Magenta */
    --accent-tertiary: #7000ff; /* Violet */
    --text-main: #ffffff;
    --text-muted: #9baec4;
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    --font-display: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; outline: none; }
  
  body {
    background-color: #000;
    color: var(--text-main);
    font-family: var(--font-display);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- DEVICE FRAME --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    background-color: var(--bg-deep);
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.9);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 92vh;
      border-radius: 44px;
      background: #050505;
      padding: 12px;
      border: 1px solid #222;
    }
    #screen-inner {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 0%, #151525 0%, #050510 70%);
      border-radius: 34px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
    }
  }
  
  @media (max-width: 499px) {
    #screen-inner {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 0%, #151525 0%, #050510 70%);
      position: relative;
    }
  }

  /* --- ATMOSPHERE & SCENE --- */
  .nebula-layer {
    position: absolute;
    inset: -50px;
    z-index: 1;
    opacity: 0.7;
    pointer-events: none;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.35) 0%, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0, 240, 255, 0.25) 0%, transparent 45%),
      radial-gradient(circle at 40% 80%, rgba(255, 0, 85, 0.2) 0%, transparent 40%);
    filter: blur(45px);
    animation: nebula-drift 40s infinite alternate ease-in-out;
    will-change: transform;
  }

  @keyframes nebula-drift {
    0% { transform: scale(1.1) translate(0, 0); }
    100% { transform: scale(1.25) translate(-30px, -20px); }
  }

  /* --- HUD & HEADER (Unified System) --- */
  .hud-container {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 28px 24px 0;
    z-index: 20;
    pointer-events: none;
  }

  .hud-glass-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 10px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    pointer-events: auto;
  }

  /* Left: Title */
  .title-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title-block h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    margin: 0;
  }

  .title-block span {
    font-size: 9px;
    color: var(--accent-primary);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.9;
    margin-top: 4px;
    display: block;
  }

  /* Right: Score */
  .score-block {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.3);
    padding: 6px 12px 6px 8px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .score-icon {
    width: 20px; height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .score-icon svg {
    width: 14px; height: 14px;
    fill: var(--accent-primary);
    filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.6));
  }

  .score-num {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    min-width: 20px;
    text-align: right;
  }

  /* --- COLLECTION BUTTON (Thumb Zone) --- */
  .collection-btn {
    position: absolute;
    bottom: 32px;
    right: 24px;
    z-index: 30;
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: rgba(0, 240, 255, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.3);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0, 240, 255, 0.1);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    overflow: hidden;
  }

  .collection-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
    border-radius: 20px 20px 0 0;
    pointer-events: none;
  }

  .collection-btn:active {
    transform: scale(0.92);
    background: rgba(0, 240, 255, 0.2);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
  }

  .collection-label {
    position: absolute;
    bottom: -20px;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    opacity: 0.7;
    width: 100%;
    text-align: center;
  }

  .grid-icon {
    width: 28px;
    height: 28px;
    stroke-width: 2;
    stroke: var(--accent-primary);
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.5));
  }

  /* --- GAME CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    cursor: none; 
  }

  /* --- PLAYER AVATAR (Spectral Net) --- */
  .player-anchor {
    position: absolute;
    z-index: 15;
    pointer-events: none;
    width: 100px;
    height: 100px;
    top: 0; left: 0;
    transform: translate(-50%, -50%);
    /* No transition here to keep it snappy, JS handles smoothing */
  }

  /* The spectral glow behind the net */
  .player-anchor::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 140px; height: 140px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, transparent 60%);
    border-radius: 50%;
    z-index: -1;
    animation: pulse-glow 3s infinite ease-in-out;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.15); }
  }

  /* Net SVG Styles */
  .net-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  
  .net-stroke {
    stroke: rgba(255, 255, 255, 0.6);
    stroke-width: 1.5;
    fill: none;
    filter: drop-shadow(0 0 3px rgba(0, 240, 255, 0.8));
  }

  .net-accent {
    stroke: var(--accent-primary);
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 4 4;
  }

  /* Stars */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
  }
  @keyframes twinkle { 
    0% { opacity: 0.1; transform: scale(0.8); } 
    100% { opacity: 0.9; transform: scale(1.2); } 
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Inner Screen -->
  <div id="screen-inner">
    
    <!-- Background Layers -->
    <div class="nebula-layer"></div>
    <div id="starsContainer" style="position: absolute; inset:0; z-index:2; pointer-events:none;"></div>

    <!-- HUD -->
    <div class="hud-container">
      <div class="hud-glass-panel">
        <!-- Title -->
        <div class="title-block">
          <h1>Aether Catch</h1>
          <span>Cosmic Collection</span>
        </div>

        <!-- Score -->
        <div class="score-block">
          <div class="score-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </div>
          <span class="score-num" id="score">0</span>
        </div>
      </div>
    </div>

    <!-- Main Game Area -->
    <canvas id="gameCanvas"></canvas>

    <!-- Player Avatar (Spectral Net) -->
    <div class="player-anchor" id="playerAvatar">
      <svg class="net-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Rotating Outer Ring -->
        <g class="rotating-ring" style="transform-origin: 50px 50px;">
          <circle cx="50" cy="50" r="42" class="net-accent" stroke-opacity="0.5" />
          <!-- Cardinal Accents -->
          <path d="M50 6 L52 12 L48 12 Z" fill="var(--accent-primary)" />
          <path d="M50 94 L52 88 L48 88 Z" fill="var(--accent-primary)" />
          <path d="M6 50 L12 48 L12 52 Z" fill="var(--accent-primary)" />
          <path d="M94 50 L88 48 L88 52 Z" fill="var(--accent-primary)" />
        </g>

        <!-- The Net Mesh -->
        <g class="net-stroke">
          <!-- Crosshairs -->
          <line x1="50" y1="15" x2="50" y2="85" />
          <line x1="15" y1="50" x2="85" y2="50" />
          <!-- Diagonals -->
          <line x1="25" y1="25" x2="75" y2="75" stroke-opacity="0.4" />
          <line x1="75" y1="25" x2="25" y2="75" stroke-opacity="0.4" />
          <!-- Inner Ring -->
          <circle cx="50" cy="50" r="20" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6" />
        </g>

        <!-- Center Core -->
        <circle cx="50" cy="50" r="3" fill="#fff" filter="url(#glow)" />
        <circle cx="50" cy="50" r="8" stroke="var(--accent-primary)" stroke-width="1" opacity="0.8" />
        
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
      </svg>
    </div>

    <!-- Collection Button -->
    <button class="collection-btn" id="collectionBtn" aria-label="View Collection">
      <svg class="grid-icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
      <span class="collection-label">Collection</span>
    </button>

  </div>
</div>

<script>
/**
 * AETHER CATCH - Visual Logic
 * Renders stylized geometric creatures, particle effects, and a dynamic net cursor.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const collectionBtn = document.getElementById('collectionBtn');
const starsContainer = document.getElementById('starsContainer');
const appContainer = document.getElementById('screen-inner');
const playerAvatar = document.getElementById('playerAvatar');
const avatarRing = document.querySelector('.rotating-ring');

// State
let width, height;
let score = 0;
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let lastTime = 0;

// Configuration
const CREATURE_TYPES = ['shard', 'orb', 'wisp'];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- BACKGROUND STARS ---
function initStars() {
  const fragment = document.createDocumentFragment();
  for(let i=0; i<60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    const size = Math.random() * 2 + 0.5;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.opacity = Math.random() * 0.5 + 0.1;
    star.style.animation = `twinkle ${Math.random()*4 + 2}s infinite alternate`;
    fragment.appendChild(star);
  }
  starsContainer.appendChild(fragment);
}

// --- CLASSES ---

class Particle {
  constructor(x, y, color, type = 'sparkle') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.015, 0.035);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 6);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.92; 
    this.vy *= 0.92;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, 90); 
    ctx.shadowBlur = 10;
    ctx.shadowColor = hsl(this.color.h, this.color.s, 50);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.type = CREATURE_TYPES[Math.floor(Math.random() * CREATURE_TYPES.length)];
    this.reset();
  }

  reset() {
    // Assign unique palettes based on type
    if (this.type === 'shard') {
      this.color = { h: 180, s: 85, l: 60 }; // Cyan
    } else if (this.type === 'orb') {
      this.color = { h: 320, s: 80, l: 65 }; // Magenta
    } else {
      this.color = { h: 260, s: 80, l: 70 }; // Violet
    }

    // Spawn logic: Edges
    if (Math.random() < 0.5) {
      this.x = Math.random() < 0.5 ? -80 : width + 80;
      this.y = random(80, height - 80);
    } else {
      this.x = random(50, width - 50);
      this.y = Math.random() < 0.5 ? -80 : height + 80;
    }
    
    this.radius = random(22, 38);
    this.baseRadius = this.radius;
    
    // Drift movement
    const angle = random(0, Math.PI * 2);
    this.speed = random(0.3, 0.8); 
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    // Animation params
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.02, 0.04);
    this.wobbleAmp = random(0.5, 1.0);
    
    this.history = [];
    this.maxHistory = 12;
  }

  update(time) {
    // Movement
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;

    // Pulse
    this.radius = this.baseRadius + Math.sin(time * 0.004) * 2;

    // Trail
    this.history.push({x: this.x, y: this.y});
    if(this.history.length > this.maxHistory) this.history.shift();

    // Bounds check
    if (this.x < -200 || this.x > width + 200 || this.y < -200 || this.y > height + 200) {
      this.reset();
    }
  }

  draw(ctx) {
    const { x, y, radius, color, type } = this;

    // 1. Draw Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(color.h, color.s, color.l, 0.15);
      ctx.lineWidth = radius * 0.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // 2. Draw Glow Core
    ctx.save();
    ctx.translate(x, y);

    // Soft outer glow
    const grd = ctx.createRadialGradient(0, 0, radius * 0.1, 0, 0, radius * 2.5);
    grd.addColorStop(0, 'rgba(255,255,255,0.9)');
    grd.addColorStop(0.2, hsl(color.h, color.s, color.l));
    grd.addColorStop(1, hsl(color.h, color.s, color.l, 0));
    
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // 3. Draw Silhouette (Geometric Shapes)
    ctx.fillStyle = hsl(color.h, color.s, color.l, 0.95);
    ctx.shadowBlur = 15;
    ctx.shadowColor = hsl(color.h, color.s, color.l);

    if (type === 'shard') {
      // Crystalline Shard (Diamond shape)
      ctx.beginPath();
      ctx.moveTo(0, -radius);
      ctx.lineTo(radius * 0.6, 0);
      ctx.lineTo(0, radius);
      ctx.lineTo(-radius * 0.6, 0);
      ctx.closePath();
      ctx.fill();
      
      // Inner detail
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.5);
      ctx.lineTo(radius * 0.2, 0);
      ctx.lineTo(0, radius * 0.5);
      ctx.lineTo(-radius * 0.2, 0);
      ctx.fill();
    } 
    else if (type === 'orb') {
      // Floating Flora / Geometric Flower
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const px = Math.cos(angle) * radius * 0.8;
        const py = Math.sin(angle) * radius * 0.8;
        ctx.moveTo(0, 0);
        ctx.lineTo(px, py);
      }
      ctx.stroke(); // Petals
      
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    else if (type === 'wisp') {
      // Spectral Wisp (Abstract shape)
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.bezierCurveTo(radius * 0.2, -radius * 0.8, -radius * 0.8, -radius * 0.6, -radius, 0);
      ctx.bezierCurveTo(-radius * 0.8, radius * 0.6, radius * 0.2, radius * 0.8, radius, 0);
      ctx.fill();
      
      // Inner "Eye"
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(radius * 0.3, 0, radius * 0.15, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];

function init() {
  resize();
  initStars();
  
  // Initial creatures
  for(let i=0; i<6; i++) {
    let c = new Creature();
    c.x = random(50, width-50);
    c.y = random(50, height-50);
    creatures.push(c);
  }
  
  // Event Listeners
  window.addEventListener('resize', resize);
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
    
    // Update Player Avatar DOM position
    playerAvatar.style.left = `${mouseX}px`;
    playerAvatar.style.top = `${mouseY}px`;
  };

  // Mouse
  appContainer.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  
  // Touch
  appContainer.addEventListener('touchmove', e => {
    e.preventDefault(); 
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  // Interactions
  const handleCatchAttempt = () => {
    checkCatch();
  };

  appContainer.addEventListener('mousedown', handleCatchAttempt);
  appContainer.addEventListener('touchstart', (e) => {
     updatePos(e.touches[0].clientX, e.touches[0].clientY);
     handleCatchAttempt();
  }, {passive: false});
  
  collectionBtn.addEventListener('click', () => {
    // Visual feedback
    collectionBtn.style.background = 'rgba(0, 240, 255, 0.3)';
    collectionBtn.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.6)';
    setTimeout(() => {
        collectionBtn.style.background = '';
        collectionBtn.style.boxShadow = '';
    }, 200);
  });

  requestAnimationFrame(loop);
}

function resize() {
  width = appContainer.clientWidth;
  height = appContainer.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}

function checkCatch() {
  const netRadius = 45; // Hit radius
  let caught = false;
  
  // Filter creatures that are within distance
  creatures = creatures.filter(c => {
    const dx = c.x - mouseX;
    const dy = c.y - mouseY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    // Generous hit area
    if (dist < netRadius + c.radius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      
      // Button feedback
      collectionBtn.style.boxShadow = `0 0 25px rgba(0, 240, 255, 0.5)`;
      setTimeout(() => collectionBtn.style.boxShadow = '', 300);
      
      caught = true;
      return false; // Remove creature
    }
    return true; // Keep creature
  });

  // Replenish creatures
  if (caught) {
    setTimeout(() => {
      if (creatures.length < 7) creatures.push(new Creature());
    }, 600);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<30; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  // Clear
  ctx.clearRect(0, 0, width, height);

  // Update Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  // Update Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  // Rotate the SVG ring in the DOM
  if (avatarRing) {
    avatarRing.style.transform = `rotate(${time * 0.02}deg)`;
  }

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
