<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #0f172a;
    --bg-surface: #1e293b;
    --accent-primary: #38bdf8; /* Sky Blue */
    --accent-glow: #818cf8; /* Indigo */
    --accent-warm: #f472b6; /* Pink */
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-stack);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT CONTAINER (Phone shape on desktop, full on mobile) --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    background: radial-gradient(circle at 50% 120%, #1e293b 0%, #0f172a 60%, #020617 100%);
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.5);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 90vh;
      border-radius: 32px;
      border: 8px solid #334155;
    }
  }

  /* --- BACKGROUND ATMOSPHERE --- */
  .stars {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  
  .fog {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 30%;
    background: linear-gradient(to top, rgba(56, 189, 248, 0.15), transparent);
    filter: blur(20px);
    z-index: 1;
    pointer-events: none;
  }

  /* --- HUD --- */
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 24px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none; /* Let clicks pass through to canvas */
  }

  .title-block h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 0%, var(--accent-primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
    text-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
  }

  .title-block p {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .count-badge {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }

  .count-icon {
    width: 20px; height: 20px;
    fill: var(--accent-warm);
  }

  .count-num {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  /* --- GAME CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none; /* Custom cursor logic */
  }

  /* --- CONTROLS --- */
  .controls {
    position: absolute;
    bottom: 32px;
    left: 0; width: 100%;
    padding: 0 32px;
    z-index: 10;
    display: flex;
    justify-content: center;
  }

  .action-btn {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    height: 64px;
    width: 64px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
    position: relative;
    overflow: hidden;
  }

  .action-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .action-btn:active {
    transform: scale(0.92);
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--accent-primary);
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
  }

  .action-btn:active::before { opacity: 1; }

  .btn-icon {
    width: 28px; height: 28px;
    stroke: #fff;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* --- ANIMATIONS --- */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Background Elements -->
  <div class="stars" id="starsCanvas"></div>
  <div class="fog"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="title-block">
      <h1>Aether Catch</h1>
      <p>Collection</p>
    </div>
    <div class="count-badge">
      <svg class="count-icon" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span class="count-num" id="score">0</span>
    </div>
  </div>

  <!-- Main Game Area -->
  <canvas id="gameCanvas"></canvas>

  <!-- Controls -->
  <div class="controls">
    <button class="action-btn" id="catchBtn" aria-label="Collect Creature">
      <svg class="btn-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 16v-4"></path>
        <path d="M12 8h.01"></path>
      </svg>
    </button>
  </div>
</div>

<script>
/**
 * AETHER CATCH - Visual Logic
 * Renders a generative scene with floating creatures and a net cursor.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const catchBtn = document.getElementById('catchBtn');
const starsContainer = document.getElementById('starsCanvas');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let isMouseDown = false;
let lastTime = 0;

// Configuration
const COLORS = [
  { h: 199, s: 89, l: 60 }, // Cyan
  { h: 260, s: 80, l: 65 }, // Indigo
  { h: 330, s: 70, l: 65 }, // Pink
  { h: 45, s: 90, l: 60 }   // Gold
];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- BACKGROUND STARS (DOM based for performance/separation) ---
function initStars() {
  const fragment = document.createDocumentFragment();
  for(let i=0; i<50; i++) {
    const star = document.createElement('div');
    star.style.position = 'absolute';
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    star.style.width = `${Math.random() * 3}px`;
    star.style.height = star.style.width;
    star.style.background = '#fff';
    star.style.borderRadius = '50%';
    star.style.opacity = Math.random() * 0.5;
    star.style.animation = `float ${random(3, 6)}s infinite ease-in-out`;
    star.style.animationDelay = `${random(0, 5)}s`;
    fragment.appendChild(star);
  }
  starsContainer.appendChild(fragment);
}

// --- CLASSES ---

class Particle {
  constructor(x, y, color, type = 'sparkle') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    this.life = 1.0;
    this.decay = random(0.01, 0.03);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 4);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.reset();
  }

  reset() {
    // Start at random edges
    if (Math.random() < 0.5) {
      this.x = Math.random() < 0.5 ? -50 : width + 50;
      this.y = random(0, height);
    } else {
      this.x = random(0, width);
      this.y = Math.random() < 0.5 ? -50 : height + 50;
    }
    
    this.radius = random(15, 25);
    this.baseRadius = this.radius;
    
    // Movement vector
    const angle = Math.atan2((height/2) - this.y, (width/2) - this.x) + random(-0.5, 0.5);
    this.speed = random(0.5, 1.5);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.02, 0.05);
    this.wobbleAmp = random(0.5, 1.5);
    
    // Tail for drawing
    this.history = [];
    this.maxHistory = 10;
  }

  update(time) {
    // Wobble movement
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;

    // Pulse
    this.radius = this.baseRadius + Math.sin(time * 0.005) * 2;

    // Trail history
    this.history.push({x: this.x, y: this.y});
    if(this.history.length > this.maxHistory) this.history.shift();

    // Bounds check (soft reset if way off screen)
    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
      this.reset();
    }
  }

  draw(ctx) {
    // Draw Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l, 0.2);
      ctx.lineWidth = this.radius * 0.8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // Draw Body (Glowing Orb)
    const grd = ctx.createRadialGradient(this.x, this.y, this.radius * 0.2, this.x, this.y, this.radius);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.4, hsl(this.color.h, this.color.s, this.color.l));
    grd.addColorStop(1, hsl(this.color.h, this.color.s, this.color.l, 0));

    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Draw Core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Net {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.radius = 40;
    this.angle = 0;
  }

  update() {
    // Smooth follow mouse
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.angle += 0.02;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Outer Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = hsl(199, 89, 60, 0.5);
    
    // Draw Net Ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Web
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1;
    
    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(-this.radius, 0); ctx.lineTo(this.radius, 0);
    ctx.moveTo(0, -this.radius); ctx.lineTo(0, this.radius);
    ctx.stroke();

    // Rotating dashed ring
    ctx.rotate(this.angle);
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.8, 0, Math.PI * 2);
    ctx.stroke();
    
    // Center Dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;

function init() {
  resize();
  initStars();
  net = new Net();
  for(let i=0; i<5; i++) creatures.push(new Creature());
  
  // Event Listeners
  window.addEventListener('resize', resize);
  
  // Mouse / Touch tracking
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  container.addEventListener('touchstart', e => {
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
    isMouseDown = true;
    checkCatch();
  }, {passive: false});
  
  container.addEventListener('mousedown', () => {
    isMouseDown = true;
    checkCatch();
  });
  
  catchBtn.addEventListener('click', () => {
    // Trigger button animation logic visually
    const btn = document.getElementById('catchBtn');
    btn.style.transform = 'scale(0.9)';
    setTimeout(() => btn.style.transform = 'scale(1)', 100);
    checkCatch();
  });

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  // Handle High DPI
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}

function checkCatch() {
  let caught = false;
  // Filter creatures that are within distance
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < net.radius + c.radius) {
      // Caught!
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      caught = true;
      return false; // Remove creature
    }
    return true; // Keep creature
  });

  // Replenish creatures if we caught one
  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 500);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<15; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  // Clear
  ctx.clearRect(0, 0, width, height);

  // Update Net
  net.update();
  net.draw(ctx);

  // Update Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  // Update Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
