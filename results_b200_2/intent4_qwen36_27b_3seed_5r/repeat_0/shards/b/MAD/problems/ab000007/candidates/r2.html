<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #050b14;
    --bg-surface: #0f172a;
    --accent-primary: #00f2ff; /* Cyan */
    --accent-glow: #7000ff; /* Deep Purple */
    --accent-warm: #ff0055; /* Neon Pink */
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-bg: rgba(15, 23, 42, 0.4);
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: #000;
    color: var(--text-main);
    font-family: var(--font-stack);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT CONTAINER (Device Frame) --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    overflow: hidden;
    background-color: var(--bg-deep);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 20px 60px rgba(0,0,0,0.8);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 92vh;
      border-radius: 40px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 12px;
      border: none;
    }
    #app-container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 40px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent, rgba(0, 242, 255, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 100;
    }
    #screen-inner {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% -20%, #1e1b4b 0%, #020617 60%);
      border-radius: 30px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    }
  }
  
  @media (max-width: 499px) {
    #screen-inner {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% -20%, #1e1b4b 0%, #020617 60%);
      position: relative;
    }
  }

  /* --- ATMOSPHERE & SCENE --- */
  .nebula-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.8;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.3) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0, 242, 255, 0.2) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255, 0, 85, 0.15) 0%, transparent 30%);
    filter: blur(40px);
    pointer-events: none;
    animation: nebula-drift 20s infinite alternate ease-in-out;
  }

  @keyframes nebula-drift {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }

  /* --- HUD & HEADER --- */
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 32px 24px 20px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-block h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    /* Reduced opacity gradient for better legibility without overpowering */
    background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2px;
  }

  .title-block p {
    font-size: 10px;
    color: var(--accent-primary);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.8;
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
  }

  /* Star Count HUD */
  .count-badge {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(8px);
  }

  .count-icon {
    width: 16px; height: 16px;
    fill: var(--accent-primary);
    filter: drop-shadow(0 0 4px var(--accent-primary));
  }

  .count-num {
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    letter-spacing: 1px;
  }

  /* --- GAME CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    /* Cursor is hidden because we draw the net */
    cursor: none; 
  }

  /* --- CONTROLS AREA (Bottom Right Only) --- */
  .controls-area {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 140px;
    padding: 32px;
    z-index: 10;
    display: flex;
    justify-content: flex-end; /* Align right */
    align-items: flex-end;
    pointer-events: none; 
  }

  /* --- COLLECTION BUTTON (CTA) --- */
  .collection-wrapper {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .action-btn-collection {
    height: 56px;
    padding: 0 28px;
    border-radius: 28px;
    /* Solid Vibrant Color */
    background: var(--accent-primary);
    border: none;
    color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.4), inset 0 2px 0 rgba(255,255,255,0.4);
  }

  .action-btn-collection:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.6), inset 0 2px 0 rgba(255,255,255,0.4);
    background: #fff;
  }
  
  .action-btn-collection:active {
    transform: scale(0.96);
    background: var(--accent-primary);
  }

  /* SVG Icons */
  .icon-svg {
    width: 20px;
    height: 20px;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  /* Specific icon color for the dark button */
  .icon-svg.dark-fill {
    stroke: #000;
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Inner Screen -->
  <div id="screen-inner">
    
    <!-- Backgrounds -->
    <div class="nebula-bg"></div>
    <!-- Stars generated by JS -->
    <div class="stars" id="starsCanvas" style="position: absolute; inset:0; z-index:1; pointer-events:none;"></div>

    <!-- HUD -->
    <div class="hud">
      <div class="header-row">
        <div class="title-block">
          <h1>Aether Catch</h1>
          <p>Cosmic Collection</p>
        </div>
        <div class="count-badge">
          <svg class="count-icon" viewBox="0 0 24 24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
          <span class="count-num" id="score">0</span>
        </div>
      </div>
    </div>

    <!-- Main Game Area -->
    <canvas id="gameCanvas"></canvas>

    <!-- Controls -->
    <div class="controls-area">
      
      <!-- Collection (Right) -->
      <div class="collection-wrapper">
        <button class="action-btn-collection" id="collectionBtn" aria-label="View Collection">
          <svg class="icon-svg dark-fill" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Collection
        </button>
      </div>

    </div>

  </div>
</div>

<script>
/**
 * AETHER CATCH - Visual Logic
 * Renders stylized creatures, particle effects, and a dynamic net cursor.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const collectionBtn = document.getElementById('collectionBtn');
const starsContainer = document.getElementById('starsCanvas');
const appContainer = document.getElementById('screen-inner');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// Configuration
const CREATURE_TYPES = ['jelly', 'star', 'dragon'];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- BACKGROUND STARS ---
function initStars() {
  const fragment = document.createDocumentFragment();
  for(let i=0; i<80; i++) {
    const star = document.createElement('div');
    star.style.position = 'absolute';
    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    const size = Math.random() * 2 + 1;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.background = '#fff';
    star.style.borderRadius = '50%';
    star.style.opacity = Math.random() * 0.6 + 0.1;
    // Add subtle CSS animation for twinkling
    star.style.animation = `twinkle ${Math.random()*3 + 2}s infinite alternate`;
    fragment.appendChild(star);
  }
  starsContainer.appendChild(fragment);
  
  // Inject keyframes dynamically
  const style = document.createElement('style');
  style.innerHTML = `
    @keyframes twinkle { from { opacity: 0.2; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
  `;
  document.head.appendChild(style);
}

// --- CLASSES ---

class Particle {
  constructor(x, y, color, type = 'sparkle') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    this.life = 1.0;
    this.decay = random(0.015, 0.04);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 6);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(2, 6);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.94; // Friction
    this.vy *= 0.94;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, 90); // Brighter sparks
    ctx.shadowBlur = 10;
    ctx.shadowColor = hsl(this.color.h, this.color.s, 50);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.type = CREATURE_TYPES[Math.floor(Math.random() * CREATURE_TYPES.length)];
    this.color = {
      h: random(180, 320), // Cyan to Pink range
      s: 80,
      l: 60
    };
    this.reset();
  }

  reset() {
    // Spawn outside or at edges
    if (Math.random() < 0.5) {
      this.x = Math.random() < 0.5 ? -60 : width + 60;
      this.y = random(100, height - 100);
    } else {
      this.x = random(50, width - 50);
      this.y = Math.random() < 0.5 ? -60 : height + 60;
    }
    
    this.radius = random(20, 35);
    this.baseRadius = this.radius;
    
    // Drift movement
    const angle = random(0, Math.PI * 2);
    this.speed = random(0.3, 1.0);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    // Animation params
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.02, 0.04);
    this.wobbleAmp = random(0.5, 1.5);
    
    this.history = [];
    this.maxHistory = 12;
  }

  update(time) {
    // Movement
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;

    // Pulse
    this.radius = this.baseRadius + Math.sin(time * 0.004) * 2;

    // Trail
    this.history.push({x: this.x, y: this.y});
    if(this.history.length > this.maxHistory) this.history.shift();

    // Bounds check
    if (this.x < -120 || this.x > width + 120 || this.y < -120 || this.y > height + 120) {
      this.reset();
    }
  }

  draw(ctx) {
    const { x, y, radius, color, type } = this;

    // 1. Draw Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(color.h, color.s, color.l, 0.1);
      ctx.lineWidth = radius * 0.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // 2. Draw Glow Core (Common to all)
    ctx.save();
    ctx.translate(x, y);

    // Soft outer glow
    const grd = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius * 1.5);
    grd.addColorStop(0, 'rgba(255,255,255,0.8)');
    grd.addColorStop(0.2, hsl(color.h, color.s, color.l));
    grd.addColorStop(1, hsl(color.h, color.s, color.l, 0));
    
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 3. Draw Silhouette based on Type
    ctx.fillStyle = hsl(color.h, color.s, color.l, 0.9);
    ctx.shadowBlur = 20;
    ctx.shadowColor = hsl(color.h, color.s, color.l);

    if (type === 'jelly') {
      // Dome
      ctx.beginPath();
      ctx.arc(0, -radius * 0.2, radius * 0.8, Math.PI, 0);
      // Tentacles
      ctx.lineTo(radius * 0.7, radius * 0.5);
      ctx.quadraticCurveTo(radius * 0.3, radius * 0.2, 0, radius * 0.6);
      ctx.quadraticCurveTo(-radius * 0.3, radius * 0.2, -radius * 0.7, radius * 0.5);
      ctx.closePath();
      ctx.fill();
    } 
    else if (type === 'star') {
      // Geometric Star
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * radius, 
                   -Math.sin((18 + i * 72) * Math.PI / 180) * radius);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * radius * 0.5, 
                   -Math.sin((54 + i * 72) * Math.PI / 180) * radius * 0.5);
      }
      ctx.closePath();
      ctx.fill();
    }
    else if (type === 'dragon') {
      // Abstract Dragon/Whale shape
      ctx.beginPath();
      ctx.moveTo(radius, 0); // Nose
      ctx.quadraticCurveTo(0, -radius, -radius * 0.5, 0); // Back
      ctx.quadraticCurveTo(0, radius, -radius, radius * 0.5); // Tail
      ctx.quadraticCurveTo(-radius * 0.5, 0, radius * 0.5, 0); // Belly
      ctx.fill();
      
      // Wings
      ctx.fillStyle = hsl(color.h, color.s, color.l, 0.5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-radius * 0.5, -radius, -radius, -radius * 0.5);
      ctx.lineTo(0, 0);
      ctx.fill();
    }

    // 4. Inner Eye/Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(radius * 0.2, 0, radius * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.radius = 40;
    this.angle = 0;
    this.scale = 1;
  }

  update() {
    // Smooth follow mouse
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.angle += 0.015;
    
    // Breathing animation
    this.scale = 1 + Math.sin(Date.now() * 0.005) * 0.05;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);
    
    // 1. Pulsing Outer Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.8)';
    
    // 2. Net Ring (Cyan)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // 3. Inner Web (Geometric)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.6)';
    ctx.lineWidth = 1;
    
    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(-this.radius, 0); ctx.lineTo(this.radius, 0);
    ctx.moveTo(0, -this.radius); ctx.lineTo(0, this.radius);
    ctx.stroke();

    // Rotating dashed ring
    ctx.rotate(this.angle);
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    
    // Center Target
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    
    // Crosshair center
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
    ctx.moveTo(0, -6); ctx.lineTo(0, 6);
    ctx.stroke();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;

function init() {
  resize();
  initStars();
  net = new Net();
  
  // Initial creatures
  for(let i=0; i<5; i++) {
    let c = new Creature();
    // Force spawn on screen initially
    c.x = random(50, width-50);
    c.y = random(50, height-50);
    creatures.push(c);
  }
  
  // Event Listeners
  window.addEventListener('resize', resize);
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  // Mouse
  appContainer.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  
  // Touch
  appContainer.addEventListener('touchmove', e => {
    e.preventDefault(); // Prevent scroll
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  // Interactions
  const handleCatchAttempt = () => {
    checkCatch();
  };

  appContainer.addEventListener('mousedown', handleCatchAttempt);
  appContainer.addEventListener('touchstart', (e) => {
     // Prevent default to stop double-firing on some devices, though passive: false handles scroll
     // e.preventDefault(); 
     updatePos(e.touches[0].clientX, e.touches[0].clientY);
     handleCatchAttempt();
  }, {passive: false});
  
  collectionBtn.addEventListener('click', () => {
    // Placeholder interaction
    collectionBtn.style.background = '#fff';
    collectionBtn.style.color = '#000';
    setTimeout(() => {
        collectionBtn.style.background = '';
        collectionBtn.style.color = '';
    }, 200);
  });

  requestAnimationFrame(loop);
}

function resize() {
  width = appContainer.clientWidth;
  height = appContainer.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}

function checkCatch() {
  let caught = false;
  // Filter creatures that are within distance
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    // Generous hit area
    if (dist < net.radius + c.radius + 10) {
      // Caught!
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      
      // Button feedback logic
      caught = true;
      return false; // Remove creature
    }
    return true; // Keep creature
  });

  // Replenish creatures
  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 800);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  // Clear
  ctx.clearRect(0, 0, width, height);

  // Update Net
  net.update();
  net.draw(ctx);

  // Update Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  // Update Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
