<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-deep: #090014;
            --bg-horizon: #2a003b;
            --grid-line: rgba(188, 19, 254, 0.3);
            --grid-floor: #140021;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffe600;
            --neon-purple: #bc13fe;
            --pixel-size: 4px; /* Base unit for pixel art scaling */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: "Courier New", Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND: RETRO SCENE --- */
        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        /* Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Retro Sun - Reduced Scale, Background Texture */
        .sun {
            position: absolute;
            top: 20%; /* Moved up */
            left: 50%;
            transform: translateX(-50%);
            width: 200px; /* Reduced scale */
            height: 200px;
            background: linear-gradient(to bottom, var(--neon-yellow), var(--neon-pink));
            z-index: 2;
            opacity: 0.8;
            /* Pixelated Mask for Stripes */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 80%,
                transparent 80%, transparent 85%,
                black 85%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 80%,
                transparent 80%, transparent 85%,
                black 85%, black 100%
            );
            box-shadow: 0 0 30px var(--neon-pink);
        }

        /* Grid Floor */
        .floor {
            position: absolute;
            bottom: -50px;
            left: -50%;
            width: 200%;
            height: 50%;
            background: 
                /* Horizon Fade */
                linear-gradient(to top, var(--bg-deep) 0%, transparent 100%),
                /* Grid Lines */
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px),
                linear-gradient(0deg, var(--grid-line) 2px, transparent 2px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-color: var(--bg-deep);
            transform: perspective(400px) rotateX(70deg);
            transform-origin: center top;
            z-index: 3;
            animation: gridScroll 1s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 40px; }
        }

        /* --- MAIN LAYOUT --- */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* --- IDENTITY BLOCK: TITLE + HIGHWAY --- */
        .identity-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem; /* Space before button */
            transform: translateY(-5vh); /* Pull up slightly */
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-family: "Courier New", monospace;
            font-weight: 900;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            /* Pixel Art Shadow Effect (Hard Edges) */
            text-shadow: 
                4px 4px 0px var(--neon-purple),
                -2px -2px 0px var(--neon-cyan);
            /* Disable smoothing for blocky look */
            -webkit-font-smoothing: none; 
            image-rendering: pixelated;
            animation: floatTitle 4s ease-in-out infinite;
        }

        h1 span {
            color: var(--neon-yellow);
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- HIGHWAY PREVIEW (PIXEL ART) --- */
        .highway-container {
            position: relative;
            width: 320px;
            height: 200px;
            perspective: 600px;
            transform-style: preserve-3d;
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid var(--neon-cyan);
            box-shadow: 
                0 0 0 4px var(--bg-deep), /* Double border trick for pixel look */
                0 0 20px var(--neon-cyan);
            transform: rotateX(30deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .lane {
            flex: 1;
            border-right: 2px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line - Crisp Pixel Bar */
        .hit-line {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #fff;
            box-shadow: 0 0 8px #fff, 0 0 15px var(--neon-pink);
            z-index: 5;
        }

        /* Notes - Blocky Rectangles */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px; /* Taller, chunkier */
            border-radius: 0 !important; /* Force Square */
            box-shadow: none;
            border: 2px solid rgba(255,255,255,0.5);
            animation: fall linear infinite;
        }

        /* Lane Colors & Timing */
        .lane:nth-child(1) .note { background: #ff0055; animation-duration: 1.5s; animation-delay: 0.0s; }
        .lane:nth-child(2) .note { background: #00ffff; animation-duration: 1.2s; animation-delay: 0.4s; }
        .lane:nth-child(3) .note { background: #00ff00; animation-duration: 1.6s; animation-delay: 0.8s; }
        .lane:nth-child(4) .note { background: #ffff00; animation-duration: 1.3s; animation-delay: 0.2s; }

        @keyframes fall {
            0% { top: -30px; }
            100% { top: 200%; }
        }

        /* --- CTA BUTTON --- */
        .btn-start {
            position: relative;
            font-family: "Courier New", monospace;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--bg-deep);
            background-color: var(--neon-yellow);
            padding: 1rem 4rem;
            border: none;
            cursor: pointer;
            letter-spacing: 2px;
            /* Pixel Art Button Borders (Hard Steps) */
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.2),
                inset 4px 4px 0px rgba(255,255,255,0.5),
                0 0 0 4px var(--bg-deep),
                0 0 0 8px var(--neon-cyan),
                0 0 20px var(--neon-cyan);
            transition: transform 0.1s, box-shadow 0.1s;
            z-index: 20;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.2),
                inset 4px 4px 0px rgba(255,255,255,0.5),
                0 0 0 4px var(--bg-deep),
                0 0 0 8px var(--neon-pink),
                0 0 30px var(--neon-pink);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.4),
                0 0 0 4px var(--bg-deep),
                0 0 0 8px var(--neon-cyan);
        }

        /* --- CRT SCANLINES --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.25) 2px,
                rgba(0,0,0,0.25) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.7;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .highway-container { width: 85vw; }
            .sun { width: 150px; height: 150px; }
            .btn-start { font-size: 1.4rem; padding: 0.8rem 3rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlay -->
    <div class="scanlines"></div>

    <!-- Background Scene -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content">
        
        <div class="identity-block">
            <h1>PIXEL <span>DANCE</span></h1>
            
            <!-- Highway Preview -->
            <div class="highway-container">
                <div class="highway">
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    <div class="hit-line"></div>
                </div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders blocky, retro stars on canvas.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

        let width, height;
        let stars = [];
        const starCount = 120;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.z = Math.random() * 2 + 0.5; 
                this.size = Math.random() > 0.9 ? 3 : 2; // Small or Medium pixel
                this.color = Math.random() > 0.9 ? '#ff00ff' : '#ffffff'; 
            }

            update() {
                this.y += this.z; 
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw rect instead of arc for pixel look
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            // Clear with slight transparency for trail? No, clean clear for crisp pixel look.
            ctx.fillStyle = "#090014"; // Match bg-deep
            ctx.fillRect(0,0,width,height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Adds a glitch effect to the title when hovering the start button.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        const originalTextShadow = "4px 4px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan)";

        btn.addEventListener('mouseenter', () => {
            // Glitch effect
            title.style.textShadow = `
                4px 0px 0px var(--neon-pink),
                -4px 0px 0px var(--neon-cyan)
            `;
            title.style.transform = 'skewX(-10deg)';
            title.style.color = '#ffe600';
        });

        btn.addEventListener('mouseleave', () => {
            // Reset
            title.style.textShadow = originalTextShadow;
            title.style.transform = 'skewX(0deg)';
            title.style.color = 'white';
        });
    </script>
</body>
</html>
