<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART
           Since we cannot load external fonts, we use 'Courier New' 
           and apply 'pixelated' rendering properties to simulate a grid font. 
        */
        :root {
            --bg-deep: #05000a;
            --bg-horizon: #1a0033;
            --grid-line: rgba(255, 0, 255, 0.3);
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffe600;
            --neon-purple: #bc13fe;
            --font-pixel: 'Courier New', Courier, monospace; /* Fallback for Press Start 2P */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: var(--font-pixel);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            /* Force pixelated rendering for crisp edges */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* --- BACKGROUND: RETRO SCENE --- */
        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-deep) 0%, var(--bg-horizon) 50%, var(--bg-deep) 50%);
        }

        /* Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Retro Sun - Unified with horizon */
        .sun {
            position: absolute;
            top: 20%; /* Higher up to allow more highway space */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: linear-gradient(to bottom, var(--neon-yellow), var(--neon-pink));
            z-index: 2;
            opacity: 0.95;
            /* Pixelated Mask for Stripes (Hard edges) */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 45%,
                black 45%, black 55%,
                transparent 55%, transparent 60%,
                black 60%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 45%,
                black 45%, black 55%,
                transparent 55%, transparent 60%,
                black 60%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            /* Hard shadow, no blur */
            box-shadow: 10px 10px 0px rgba(255, 0, 255, 0.4);
        }

        /* Horizon Fog - Hard Edge Fade */
        .fog {
            position: absolute;
            top: 45%;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to bottom, var(--bg-horizon), transparent);
            z-index: 3;
            pointer-events: none;
        }

        /* Grid Floor - 3D Perspective */
        .floor {
            position: absolute;
            top: 45%; /* Horizon Line */
            left: -50%;
            width: 200%;
            height: 60%;
            background: 
                linear-gradient(to bottom, var(--bg-horizon) 0%, transparent 10%),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                linear-gradient(0deg, var(--grid-line) 1px, transparent 1px);
            background-size: 100% 100%, 80px 80px, 80px 80px;
            background-color: var(--bg-deep);
            /* Steeper perspective */
            transform: perspective(400px) rotateX(70deg);
            transform-origin: top center;
            z-index: 4;
            animation: gridScroll 0.6s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 80px; }
        }

        /* --- MAIN LAYOUT --- */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            /* Push content slightly down to overlap highway */
            padding-bottom: 5vh; 
        }

        /* --- IDENTITY BLOCK: TITLE + HIGHWAY --- */
        .identity-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            /* Overlap Title with Highway */
            margin-bottom: -80px; 
        }

        /* --- TYPOGRAPHY: PIXEL & CHROMATIC ABERRATION --- */
        h1 {
            font-family: var(--font-pixel);
            font-weight: 900;
            font-size: clamp(2.5rem, 8vw, 6rem);
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 2rem;
            letter-spacing: -2px;
            position: relative;
            z-index: 15;
            /* Hard, stepped drop shadow */
            text-shadow: 
                4px 4px 0px #000, 
                6px 6px 0px var(--neon-purple);
            
            /* RGB Split Effect */
            animation: glitch-skew 3s infinite linear alternate-reverse;
        }

        /* Pseudo-elements for RGB Split */
        h1::before, h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-3px, -3px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }

        h1::after {
            color: var(--neon-pink);
            z-index: -2;
            transform: translate(3px, 3px);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(0deg); }
            21% { transform: skew(10deg); }
            22% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        /* --- HIGHWAY PREVIEW: 3D PERSPECTIVE --- */
        .highway-container {
            position: relative;
            width: 300px;
            height: 350px;
            perspective: 500px; /* Strong perspective */
            transform-style: preserve-3d;
            margin-top: 1rem;
            z-index: 5;
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(5, 0, 10, 0.9);
            /* Trapezoid Shape for 3D depth */
            clip-path: polygon(35% 0, 65% 0, 100% 100%, 0% 100%);
            transform: rotateX(25deg); /* Tilt back */
            transform-origin: bottom center;
            display: flex;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
        }

        /* Glowing Lane Dividers - Hard Edges */
        .lane-divider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--neon-cyan);
            box-shadow: 2px 0 0 var(--neon-cyan); /* Hard glow */
            z-index: 1;
            opacity: 0.6;
        }
        .lane-divider:nth-child(1) { left: 25%; transform: skewX(-10deg); } /* Perspective hack */
        .lane-divider:nth-child(2) { left: 50%; }
        .lane-divider:nth-child(3) { left: 75%; transform: skewX(10deg); }

        /* Lanes for Note positioning */
        .lane {
            flex: 1;
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        /* --- ASSET PIXELATION: NOTES --- */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 16px;
            /* Pixelated shape */
            clip-path: polygon(
                0% 20%, 20% 20%, 20% 0%, 80% 0%, 80% 20%, 100% 20%, 
                100% 80%, 80% 80%, 80% 100%, 20% 100%, 20% 80%, 0% 80%
            );
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5); /* Hard shadow */
            opacity: 1;
            animation: fall linear infinite;
        }

        /* Note Colors & Patterns */
        .lane:nth-child(5) .note { 
            background: var(--neon-pink); 
            box-shadow: 3px 3px 0px #550055;
            animation-duration: 1.2s; 
            animation-delay: 0.0s; 
        }
        .lane:nth-child(6) .note { 
            background: var(--neon-cyan); 
            box-shadow: 3px 3px 0px #005555;
            animation-duration: 1.5s; 
            animation-delay: 0.4s; 
        }
        .lane:nth-child(7) .note { 
            background: var(--neon-yellow); 
            box-shadow: 3px 3px 0px #555500;
            animation-duration: 1.1s; 
            animation-delay: 0.8s; 
        }
        .lane:nth-child(8) .note { 
            background: var(--neon-purple); 
            box-shadow: 3px 3px 0px #330055;
            animation-duration: 1.3s; 
            animation-delay: 0.2s; 
        }

        @keyframes fall {
            0% { top: -20px; opacity: 0; transform: scale(0.5); }
            10% { opacity: 1; transform: scale(1); }
            100% { top: 110%; opacity: 1; transform: scale(1.5); }
        }

        /* --- HIT LINE: HIGH CONTRAST --- */
        .hit-line {
            position: absolute;
            bottom: 5%;
            left: -5%;
            width: 110%;
            height: 8px;
            background: #fff;
            /* Stepped Glow */
            box-shadow: 
                0 0 0 2px var(--neon-cyan),
                0 0 0 4px var(--neon-pink),
                4px 4px 0px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* --- UI POLISH: BUTTON --- */
        .btn-start {
            position: relative;
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--neon-cyan);
            background-color: #000;
            padding: 1.2rem 3rem;
            /* Hard Pixel Border */
            border: 4px solid var(--neon-cyan);
            cursor: pointer;
            letter-spacing: 2px;
            /* Stepped Shadow (No blur) */
            box-shadow: 
                6px 6px 0px var(--neon-pink);
            transition: all 0.1s steps(2); /* Stepped transition */
            z-index: 20;
            outline: none;
            margin-top: 2rem;
        }

        .btn-start:hover {
            background-color: var(--neon-cyan);
            color: #000;
            box-shadow: 
                6px 6px 0px var(--neon-purple),
                0 0 0 2px #fff; /* Inner highlight */
            transform: translate(-2px, -2px);
        }

        .btn-start:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--neon-pink);
        }

        /* --- CRT SCANLINES & VIGNETTE --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.4) 2px,
                rgba(0,0,0,0.4) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.8;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .highway-container { width: 80vw; height: 300px; }
            .sun { width: 200px; height: 200px; }
            .btn-start { font-size: 1.2rem; padding: 1rem 2rem; }
        }
    </style>
</head>
<body>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background Scene -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="fog"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content">
        
        <div class="identity-block">
            <h1>PIXEL DANCE</h1>
            
            <!-- Highway Preview -->
            <div class="highway-container">
                <div class="highway">
                    <!-- Lane Dividers -->
                    <div class="lane-divider"></div>
                    <div class="lane-divider"></div>
                    <div class="lane-divider"></div>

                    <!-- Lanes with Notes -->
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    
                    <!-- Hit Line -->
                    <div class="hit-line"></div>
                </div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders blocky, retro stars on canvas.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d', { alpha: false }); 

        let width, height;
        let stars = [];
        const starCount = 100;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.z = Math.random() * 2 + 1; // Faster fall
                // Pixel sizes: 1, 2, or 3
                this.size = Math.floor(Math.random() * 3) + 1;
                this.color = Math.random() > 0.9 ? '#ff00ff' : (Math.random() > 0.5 ? '#00ffff' : '#ffffff');
            }

            update() {
                this.y += this.z * 2; // Faster for speed sensation
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw perfect squares
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            // Clear with solid color
            ctx.fillStyle = "#05000a"; 
            ctx.fillRect(0,0,width,height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Adds a glitch effect to the title when hovering the start button.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        
        // Glitch colors
        const glitchColors = ['#ff0000', '#00ff00', '#0000ff'];

        btn.addEventListener('mouseenter', () => {
            // Intensify RGB split
            title.style.textShadow = `
                6px 0px 0px rgba(255, 0, 0, 1),
                -6px 0px 0px rgba(0, 255, 255, 1)
            `;
            title.style.transform = 'skewX(-10deg) scale(1.05)';
            title.style.color = '#ffe600';
        });

        btn.addEventListener('mouseleave', () => {
            // Reset
            title.style.textShadow = '4px 4px 0px #000, 6px 6px 0px var(--neon-purple)';
            title.style.transform = 'skewX(0deg) scale(1)';
            title.style.color = '#fff';
        });
    </script>
</body>
</html>
