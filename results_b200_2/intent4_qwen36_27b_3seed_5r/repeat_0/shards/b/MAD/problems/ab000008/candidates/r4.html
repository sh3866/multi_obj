<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-deep: #05000a;
            --bg-horizon: #2a004d;
            --grid-line: rgba(188, 19, 254, 0.5);
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffe600;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: none;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: var(--font-pixel);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND SCENE --- */
        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            perspective: 800px; /* Deep perspective for the world */
        }

        /* Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 50%; /* Only top half */
            z-index: 1;
            opacity: 0.8;
        }

        /* Retro Sun - Stepped Gradient */
        .sun {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 280px;
            z-index: 2;
            /* Stepped Gradient for Pixel Look */
            background: 
                linear-gradient(to bottom, 
                    var(--neon-yellow) 0%, var(--neon-yellow) 15%, 
                    #ff8800 16%, #ff8800 30%, 
                    var(--neon-pink) 31%, var(--neon-pink) 50%, 
                    var(--neon-purple) 51%, var(--neon-purple) 100%
                );
            /* Mask for the iconic synthwave stripes */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 50%,
                transparent 50%, transparent 55%,
                black 55%, black 65%,
                transparent 65%, transparent 70%,
                black 70%, black 80%,
                transparent 80%, transparent 85%,
                black 85%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 50%,
                transparent 50%, transparent 55%,
                black 55%, black 65%,
                transparent 65%, transparent 70%,
                black 70%, black 80%,
                transparent 80%, transparent 85%,
                black 85%, black 100%
            );
            box-shadow: 0 0 0 4px rgba(255, 230, 0, 0.2); /* Subtle hard halo */
        }

        /* Horizon Line */
        .horizon {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            z-index: 5;
        }

        /* Grid Floor - 3D Perspective */
        .floor {
            position: absolute;
            top: 50%;
            left: -50%;
            width: 200%;
            height: 100%;
            background-color: var(--bg-deep);
            /* Perspective Grid */
            background-image: 
                linear-gradient(transparent 0%, var(--neon-purple) 2%, transparent 3%),
                linear-gradient(90deg, transparent 0%, var(--neon-purple) 2%, transparent 3%);
            background-size: 100% 100px, 100px 100%;
            transform: rotateX(75deg);
            transform-origin: top center;
            z-index: 4;
            animation: gridScroll 1s linear infinite;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 90%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 90%);
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 100px, 0 0; }
        }

        /* --- MAIN LAYOUT --- */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
        }

        /* --- TYPOGRAPHY: PIXEL & GLITCH --- */
        h1 {
            font-family: var(--font-pixel);
            font-weight: 900;
            font-size: clamp(2rem, 6vw, 4.5rem);
            text-transform: uppercase;
            color: #fff;
            letter-spacing: 4px;
            margin-bottom: 0; /* Tight spacing */
            position: relative;
            z-index: 20;
            /* Pixelated Shadow */
            text-shadow: 
                4px 4px 0px #000, 
                8px 8px 0px var(--neon-purple);
            mix-blend-mode: screen;
        }

        /* Glitch Layers */
        h1::before, h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep); /* To hide main text behind */
            opacity: 0.8;
            pointer-events: none;
        }

        h1::before {
            color: var(--neon-cyan);
            z-index: -1;
            transform: translate(-4px, -4px); /* 4px Grid Offset */
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--neon-pink);
            z-index: -2;
            transform: translate(4px, 4px); /* 4px Grid Offset */
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%); transform: translate(-4px, -4px); }
            20% { clip-path: polygon(0 10%, 100% 10%, 100% 30%, 0 30%); transform: translate(-2px, -2px); }
            40% { clip-path: polygon(0 40%, 100% 40%, 100% 50%, 0 50%); transform: translate(-4px, 0); }
            60% { clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%); transform: translate(-4px, -4px); }
            80% { clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translate(-4px, -4px); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translate(-4px, -4px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); transform: translate(4px, 4px); }
            20% { clip-path: polygon(0 30%, 100% 30%, 100% 40%, 0 40%); transform: translate(2px, 2px); }
            40% { clip-path: polygon(0 50%, 100% 50%, 100% 60%, 0 60%); transform: translate(4px, 0); }
            60% { clip-path: polygon(0 80%, 100% 80%, 100% 90%, 0 90%); transform: translate(4px, 4px); }
            80% { clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); transform: translate(4px, 4px); }
            100% { clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); transform: translate(4px, 4px); }
        }

        /* --- HIGHWAY CONTAINER --- */
        /* Positioned to center between Title and Button */
        .highway-wrapper {
            position: relative;
            width: 100%;
            height: 200px; /* Fixed height container */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -20px; /* Pull up slightly towards vanishing point */
            z-index: 15;
            perspective: 400px;
        }

        .highway {
            position: relative;
            width: 240px;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            /* Trapezoid for 3D effect */
            clip-path: polygon(40% 0, 60% 0, 100% 100%, 0% 100%);
            transform: rotateX(10deg);
            border-left: 4px solid var(--neon-purple);
            border-right: 4px solid var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
            overflow: hidden;
        }

        /* Lane Dividers */
        .lane-divider {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: var(--neon-cyan);
            opacity: 0.5;
            box-shadow: 0 0 5px var(--neon-cyan);
        }
        .lane-divider:nth-child(1) { left: 25%; transform: skewX(12deg); }
        .lane-divider:nth-child(2) { left: 50%; }
        .lane-divider:nth-child(3) { left: 75%; transform: skewX(-12deg); }

        /* Notes */
        .note {
            position: absolute;
            width: 20px;
            height: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-pink);
            animation: fall 1.5s linear infinite;
        }
        
        /* Lane positioning & colors for notes */
        .lane-1 .note { left: 12.5%; background: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); animation-delay: 0.2s; animation-duration: 1.4s; }
        .lane-2 .note { left: 37.5%; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); animation-delay: 0.8s; animation-duration: 1.6s; }
        .lane-3 .note { left: 62.5%; background: var(--neon-yellow); box-shadow: 0 0 8px var(--neon-yellow); animation-delay: 0.1s; animation-duration: 1.3s; }
        .lane-4 .note { left: 87.5%; background: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple); animation-delay: 0.6s; animation-duration: 1.5s; }

        @keyframes fall {
            0% { top: -20px; opacity: 0; transform: translateX(-50%) scale(0.2); }
            20% { opacity: 1; }
            100% { top: 110%; opacity: 1; transform: translateX(-50%) scale(1.5); }
        }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #fff;
            box-shadow: 
                0 0 0 2px var(--neon-cyan),
                0 0 15px var(--neon-cyan);
            z-index: 20;
        }

        /* --- BUTTON DESIGN --- */
        .btn-start {
            position: relative;
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #000;
            /* Solid Neon Block */
            background-color: var(--neon-cyan);
            padding: 1.2rem 3rem;
            border: none;
            cursor: pointer;
            letter-spacing: 2px;
            /* Heavy Arcade Button Shadow */
            box-shadow: 
                6px 6px 0px var(--neon-pink),
                inset -4px -4px 0px rgba(0,0,0,0.2);
            transition: all 0.1s steps(1);
            z-index: 20;
            margin-top: 1rem;
            /* Subtle Pulse */
            animation: pulse 2s infinite;
        }

        .btn-start:hover {
            background-color: #fff;
            color: var(--neon-purple);
            transform: translate(-2px, -2px);
            box-shadow: 
                8px 8px 0px var(--neon-pink),
                inset -4px -4px 0px rgba(0,0,0,0.2);
        }

        .btn-start:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--neon-pink);
        }

        @keyframes pulse {
            0% { box-shadow: 6px 6px 0px var(--neon-pink), 0 0 0px var(--neon-cyan); }
            50% { box-shadow: 6px 6px 0px var(--neon-pink), 0 0 20px var(--neon-cyan); }
            100% { box-shadow: 6px 6px 0px var(--neon-pink), 0 0 0px var(--neon-cyan); }
        }

        /* --- CRT OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .sun { width: 180px; height: 180px; top: 20%; }
            .highway-wrapper { height: 150px; }
            .btn-start { font-size: 1.2rem; padding: 1rem 2rem; }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background Scene -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="horizon"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content">
        
        <!-- Title -->
        <h1>PIXEL DANCE</h1>
        
        <!-- Highway Preview (Centered) -->
        <div class="highway-wrapper">
            <div class="highway">
                <div class="lane-divider"></div>
                <div class="lane-divider"></div>
                <div class="lane-divider"></div>

                <div class="lane-1"><div class="note"></div></div>
                <div class="lane-2"><div class="note"></div></div>
                <div class="lane-3"><div class="note"></div></div>
                <div class="lane-4"><div class="note"></div></div>
                
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- Button -->
        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders blocky, retro stars on canvas.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d', { alpha: false }); 

        let width, height;
        let stars = [];
        const starCount = 80;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight / 2; // Only top half
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.z = Math.random() * 2 + 0.5; // Speed variation
                // Pixel sizes: 1, 2, or 3
                this.size = Math.floor(Math.random() * 2) + 1;
                this.color = Math.random() > 0.8 ? '#ff00ff' : (Math.random() > 0.6 ? '#00ffff' : '#ffffff');
            }

            update() {
                this.y += this.z * 1.5; // Fall speed
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw perfect squares
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            // Clear with solid color
            ctx.fillStyle = "#05000a"; 
            ctx.fillRect(0,0,width,height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         */
        const btn = document.getElementById('startBtn');
        
        btn.addEventListener('mouseenter', () => {
            // Optional: Add sound or extra visual flair here
        });
    </script>
</body>
</html>
