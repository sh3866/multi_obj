<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-deep: #05000a;
            --bg-horizon: #120024;
            --grid-line: rgba(255, 0, 255, 0.4);
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffe600;
            --neon-purple: #bc13fe;
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND: RETRO SCENE --- */
        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        /* Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Retro Sun - Unified with horizon */
        .sun {
            position: absolute;
            top: 30%; /* Adjusted for horizon alignment */
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 240px;
            background: linear-gradient(to bottom, var(--neon-yellow), var(--neon-pink));
            z-index: 2;
            opacity: 0.9;
            /* Pixelated Mask for Stripes */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 45%,
                black 45%, black 55%,
                transparent 55%, transparent 60%,
                black 60%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 45%,
                black 45%, black 55%,
                transparent 55%, transparent 60%,
                black 60%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            box-shadow: 0 0 40px var(--neon-pink);
        }

        /* Horizon Fog */
        .fog {
            position: absolute;
            top: 44%;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, var(--bg-deep), transparent);
            z-index: 3;
            pointer-events: none;
        }

        /* Grid Floor */
        .floor {
            position: absolute;
            top: 44%; /* Starts exactly where sun center is (approx) */
            left: -50%;
            width: 200%;
            height: 60%;
            background: 
                /* Horizon Fade */
                linear-gradient(to bottom, var(--bg-deep) 0%, transparent 15%),
                /* Grid Lines */
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px),
                linear-gradient(0deg, var(--grid-line) 2px, transparent 2px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            background-color: var(--bg-deep);
            transform: perspective(600px) rotateX(75deg);
            transform-origin: top center;
            z-index: 4;
            animation: gridScroll 0.8s linear infinite;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 60px; }
        }

        /* --- MAIN LAYOUT --- */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* --- IDENTITY BLOCK: TITLE + HIGHWAY --- */
        .identity-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
            transform: translateY(-5vh);
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-family: var(--font-main);
            font-weight: 900;
            font-size: clamp(3rem, 9vw, 7rem);
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 2rem;
            letter-spacing: -2px;
            position: relative;
            /* Chromatic Aberration / RGB Split */
            text-shadow: 
                3px 0px 0px rgba(255, 0, 0, 0.7),
                -3px 0px 0px rgba(0, 255, 255, 0.7),
                0px 4px 0px rgba(0, 0, 0, 0.5);
            animation: floatTitle 4s ease-in-out infinite;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- HIGHWAY PREVIEW (TRAPZOID) --- */
        .highway-container {
            position: relative;
            width: 400px;
            height: 250px;
            perspective: 400px;
            transform-style: preserve-3d;
            margin-top: 1rem;
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 20, 0.85);
            /* Trapezoid Shape */
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
            border-bottom: 4px solid var(--neon-cyan);
            transform: rotateX(40deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        /* Glowing Lane Dividers */
        .lane-divider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 8px var(--neon-cyan);
            z-index: 1;
        }
        .lane-divider:nth-child(1) { left: 25%; }
        .lane-divider:nth-child(2) { left: 50%; }
        .lane-divider:nth-child(3) { left: 75%; }

        /* Hit Line - Neon Bar */
        .hit-line {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 4px;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--neon-pink);
            z-index: 5;
        }

        /* Lanes for Note positioning */
        .lane {
            flex: 1;
            position: relative;
            height: 100%;
        }

        /* Notes - Falling Blocks */
        .note {
            position: absolute;
            width: 60%;
            left: 20%;
            height: 20px;
            border-radius: 2px;
            box-shadow: 0 0 5px currentColor;
            opacity: 0.9;
            animation: fall linear infinite;
        }

        /* Note Colors & Patterns */
        .lane:nth-child(5) .note { 
            background: #ff0055; 
            color: #ff0055;
            animation-duration: 1.2s; 
            animation-delay: 0.0s; 
        }
        .lane:nth-child(6) .note { 
            background: #00ffff; 
            color: #00ffff;
            animation-duration: 1.5s; 
            animation-delay: 0.3s; 
        }
        .lane:nth-child(7) .note { 
            background: #ffe600; 
            color: #ffe600;
            animation-duration: 1.1s; 
            animation-delay: 0.6s; 
        }
        .lane:nth-child(8) .note { 
            background: #bc13fe; 
            color: #bc13fe;
            animation-duration: 1.4s; 
            animation-delay: 0.1s; 
        }

        /* Secondary notes for rhythm complexity */
        .lane:nth-child(5) .note::after {
            content: ''; position: absolute; top: 120%; left: 0; width: 100%; height: 100%;
            background: inherit; box-shadow: inherit;
            animation: inherit;
            animation-delay: 1.2s;
        }
        .lane:nth-child(7) .note::after {
            content: ''; position: absolute; top: 150%; left: 0; width: 100%; height: 100%;
            background: inherit; box-shadow: inherit;
            animation: inherit;
            animation-delay: 1.1s;
        }

        @keyframes fall {
            0% { top: -20px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- CTA BUTTON --- */
        .btn-start {
            position: relative;
            font-family: var(--font-main);
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--neon-cyan);
            background-color: #000;
            padding: 1rem 3rem;
            border: 4px solid var(--neon-cyan);
            cursor: pointer;
            letter-spacing: 2px;
            /* Glow Effect */
            box-shadow: 
                0 0 15px var(--neon-cyan),
                inset 0 0 15px rgba(0, 255, 255, 0.2);
            transition: all 0.2s ease-in-out;
            z-index: 20;
            outline: none;
        }

        .btn-start:hover {
            background-color: var(--neon-cyan);
            color: #000;
            box-shadow: 
                0 0 30px var(--neon-cyan),
                0 0 60px var(--neon-cyan),
                inset 0 0 0px rgba(0, 255, 255, 0);
            transform: scale(1.05);
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- CRT SCANLINES & VIGNETTE --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway-container { width: 90vw; height: 200px; }
            .sun { width: 180px; height: 180px; }
            .btn-start { font-size: 1.2rem; padding: 0.8rem 2rem; }
        }
    </style>
</head>
<body>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background Scene -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="fog"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content">
        
        <div class="identity-block">
            <h1>PIXEL DANCE</h1>
            
            <!-- Highway Preview -->
            <div class="highway-container">
                <div class="highway">
                    <!-- Lane Dividers -->
                    <div class="lane-divider"></div>
                    <div class="lane-divider"></div>
                    <div class="lane-divider"></div>

                    <!-- Lanes with Notes -->
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    <div class="lane"><div class="note"></div></div>
                    
                    <!-- Hit Line -->
                    <div class="hit-line"></div>
                </div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders blocky, retro stars on canvas.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

        let width, height;
        let stars = [];
        const starCount = 150;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.z = Math.random() * 2 + 0.5; 
                this.size = Math.random() > 0.95 ? 3 : (Math.random() > 0.5 ? 2 : 1);
                this.color = Math.random() > 0.8 ? '#ff00ff' : (Math.random() > 0.5 ? '#00ffff' : '#ffffff');
            }

            update() {
                this.y += this.z * 0.5; // Slower fall for depth
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            // Clear with solid color to remove trails
            ctx.fillStyle = "#05000a"; 
            ctx.fillRect(0,0,width,height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Adds a glitch effect to the title when hovering the start button.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        const originalTextShadow = "3px 0px 0px rgba(255, 0, 0, 0.7), -3px 0px 0px rgba(0, 255, 255, 0.7), 0px 4px 0px rgba(0, 0, 0, 0.5)";

        btn.addEventListener('mouseenter', () => {
            // Glitch effect
            title.style.textShadow = `
                6px 0px 0px rgba(255, 0, 0, 1),
                -6px 0px 0px rgba(0, 255, 255, 1)
            `;
            title.style.transform = 'skewX(-5deg)';
            title.style.color = '#ffe600';
        });

        btn.addEventListener('mouseleave', () => {
            // Reset
            title.style.textShadow = originalTextShadow;
            title.style.transform = 'skewX(0deg)';
            title.style.color = '#fff';
        });
    </script>
</body>
</html>
