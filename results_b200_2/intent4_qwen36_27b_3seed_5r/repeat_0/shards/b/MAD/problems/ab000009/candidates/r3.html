<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grandmaster Chess</title>
<style>
  :root {
    /* Palette - Flat Luxury & Slate */
    --bg-body: #121212;
    --bg-panel: #1e1e1e;
    --bg-panel-highlight: #2a2a2a;
    
    /* Board Colors - Cool Cream & Deep Slate */
    --board-light: #E8E8E4;
    --board-dark: #40454C;
    
    /* Highlights */
    --highlight-move: rgba(255, 255, 255, 0.15);
    --highlight-selected: rgba(100, 200, 255, 0.4);
    --highlight-last: rgba(255, 215, 0, 0.2);
    
    /* Text */
    --text-primary: #f0f0f0;
    --text-secondary: #909090;
    
    /* Typography */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    
    /* Dimensions */
    --board-size: 640px;
    --square-size: calc(var(--board-size) / 8);
    --frame-width: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

  body {
    background-color: var(--bg-body);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    display: flex;
    gap: 40px;
    padding: 20px;
    max-width: 1200px;
    width: 100%;
    height: 95vh;
    align-items: stretch;
  }

  /* --- Board Area --- */
  .board-wrapper {
    position: relative;
    flex-shrink: 0;
    background: var(--bg-panel);
    padding: var(--frame-width);
    border-radius: 4px;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: var(--board-size);
    height: var(--board-size);
    background: var(--board-light);
    user-select: none;
    position: relative;
  }

  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .square.light { background-color: var(--board-light); color: var(--board-dark); }
  .square.dark { background-color: var(--board-dark); color: var(--board-light); }
  
  /* Highlights */
  .square.last-move { background-color: var(--highlight-last); }
  .square.selected { background-color: var(--highlight-selected) !important; }

  /* --- Coordinates --- */
  .coords {
    position: absolute;
    display: flex;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.5px;
    opacity: 0.7;
  }
  
  .file-labels {
    bottom: 4px;
    left: var(--frame-width);
    right: var(--frame-width);
    justify-content: space-around;
  }
  
  .rank-labels {
    top: var(--frame-width);
    bottom: var(--frame-width);
    left: 4px;
    flex-direction: column;
    justify-content: space-around;
  }
  
  /* Coordinate coloring logic handled in JS for contrast */

  /* --- Pieces --- */
  .piece {
    width: 80%;
    height: 80%;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    margin: auto;
    z-index: 5;
  }
  
  .piece:hover {
    transform: scale(1.1) translateY(-2px);
  }

  .piece svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));
  }

  /* SVG Styling - Clean Vector */
  .piece.white svg path, .piece.white svg circle, .piece.white svg ellipse, .piece.white svg polygon, .piece.white svg rect {
    fill: #ffffff;
    stroke: #1a1a1a;
    stroke-width: 1.5px;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .piece.black svg path, .piece.black svg circle, .piece.black svg ellipse, .piece.black svg polygon, .piece.black svg rect {
    fill: #111111;
    stroke: #cccccc;
    stroke-width: 1.2px;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  /* --- Side Panel --- */
  .sidebar {
    flex: 1;
    background: var(--bg-panel);
    border-radius: 4px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255,255,255,0.03);
    max-width: 400px;
  }

  /* Header */
  .header {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  /* Turn Indicator */
  .turn-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
    font-weight: 600;
  }

  .turn-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 3px #ffffff;
    transition: all 0.3s ease;
  }
  
  .turn-indicator.black-turn {
    background: #111;
    box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 3px #111;
  }

  /* Move History */
  .move-history {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 24px;
    background: rgba(0,0,0,0.2);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.03);
    display: flex;
    flex-direction: column;
  }

  .history-header {
    display: flex;
    padding: 12px 16px;
    background: rgba(0,0,0,0.1);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .col-num { width: 30px; color: #666; }
  .col-w { flex: 1; text-align: center; }
  .col-b { flex: 1; text-align: center; }

  .move-list-container {
    flex: 1;
    padding-bottom: 10px;
  }

  .move-row {
    display: flex;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.02);
    color: var(--text-secondary);
    font-size: 14px;
    font-family: var(--font-ui);
    transition: background 0.1s;
  }
  
  .move-row:nth-child(even) { background: rgba(255,255,255,0.01); }
  .move-row:hover { background: rgba(255,255,255,0.04); }
  
  .move-row.active { 
    background: rgba(255,255,255,0.06); 
    color: var(--text-primary);
  }
  
  .move-row .col-w, .move-row .col-b { font-weight: 500; }

  /* Controls */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary);
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  button:hover {
    border-color: rgba(255,255,255,0.3);
    color: var(--text-primary);
    background: rgba(255,255,255,0.05);
  }
  
  /* Primary Action */
  button.primary {
    background: var(--text-primary);
    border-color: var(--text-primary);
    color: #000;
  }
  
  button.primary:hover {
    background: #dcdcdc;
    border-color: #dcdcdc;
    color: #000;
    transform: translateY(-1px);
  }

  /* Secondary/Ghost Action */
  button.ghost {
    border-style: dashed;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

  @media (max-width: 950px) {
    .container { flex-direction: column; height: auto; overflow-y: auto; padding: 10px; }
    .board-wrapper, .board { width: 100%; height: auto; aspect-ratio: 1/1; }
    :root { --board-size: 100%; }
    .sidebar { width: 100%; max-width: none; height: 400px; }
    .rank-labels { display: none; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="board-wrapper">
    <div class="coords rank-labels" id="rank-labels"></div>
    <div class="coords file-labels" id="file-labels"></div>
    <div class="board" id="board"></div>
  </div>

  <div class="sidebar">
    <div class="header">
      <h1>Grandmaster</h1>
      <div class="turn-badge">
        <div class="turn-indicator" id="turn-dot"></div>
        <span class="status-text" id="status-text">White to move</span>
      </div>
    </div>

    <div class="move-history">
      <div class="history-header">
        <div class="col-num">#</div>
        <div class="col-w">White</div>
        <div class="col-b">Black</div>
      </div>
      <div class="move-list-container" id="move-list">
        <!-- Populated via JS -->
      </div>
    </div>

    <div class="controls">
      <button class="primary" onclick="resetGame()">New Game</button>
      <button class="ghost" onclick="alert('Analyze feature coming soon')">Analyze</button>
    </div>
  </div>
</div>

  // --- Game State ---
  // Standard Starting Position
  let boardState = [
    ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'],
    ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
    ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']
  ];

  let turn = 'w';
  let moveCount = 1;
  let selectedSquare = null; 
  const moveList = document.getElementById('move-list');
  const statusText = document.getElementById('status-text');
  const turnDot = document.getElementById('turn-dot');

  // --- Initialization ---
  function initBoard() {
    const boardEl = document.getElementById('board');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    
    // Render Board Grid
    boardEl.innerHTML = '';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = document.createElement('div');
        const isLight = (r + c) % 2 === 0;
        square.className = `square ${isLight ? 'light' : 'dark'}`;
        square.dataset.r = r;
        square.dataset.c = c;
        
        const pieceCode = boardState[r][c];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieces[color][type];
          
          // Interaction
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handlePieceClick(r, c, color, type);
          };
          
          square.appendChild(pieceEl);
        }
        
        // Click empty square (move target)
        square.onclick = () => handleSquareClick(r, c);
        
        boardEl.appendChild(square);
      }
    }

    // Render Coordinates
    const fileLabels = document.getElementById('file-labels');
    const rankLabels = document.getElementById('rank-labels');
    fileLabels.innerHTML = '';
    rankLabels.innerHTML = '';
    
    files.forEach((f, index) => {
      const span = document.createElement('span');
      span.innerText = f;
      // Alternate color for coordinates to match board
      span.style.color = index % 2 === 0 ? 'var(--board-dark)' : 'var(--board-light)';
      fileLabels.appendChild(span);
    });
    
    for(let i=8; i>0; i--) {
      const span = document.createElement('span');
      span.innerText = i;
      // Rank 8 is index 0 (top), so parity check matches files
      const index = 8 - i;
      span.style.color = index % 2 === 0 ? 'var(--board-dark)' : 'var(--board-light)';
      rankLabels.appendChild(span);
    }
  }

  // --- Logic ---
  function handlePieceClick(r, c, color, type) {
    if (color !== (turn === 'w' ? 'w' : 'b')) return; 

    // Select piece
    selectedSquare = {r, c};
    
    // Visual Feedback
    const squares = document.querySelectorAll('.square');
    squares.forEach(sq => sq.classList.remove('selected'));
    const currentSq = squares[r * 8 + c];
    currentSq.classList.add('selected');
  }

  function handleSquareClick(r, c) {
    if (!selectedSquare) return;
    
    const fromR = selectedSquare.r;
    const fromC = selectedSquare.c;
    
    if (fromR === r && fromC === c) return;

    // Execute Move
    const pieceCode = boardState[fromR][fromC];
    const targetCode = boardState[r][c]; 
    
    // Update State
    boardState[r][c] = pieceCode;
    boardState[fromR][fromC] = '';
    
    // Generate Notation
    const pieceName = pieceCode[1] === 'p' ? '' : pieceCode[1].toUpperCase();
    const capture = targetCode ? 'x' : '';
    const notation = `${pieceName}${capture}${String.fromCharCode(97+c)}${8-r}`;
    
    addMoveToHistory(notation);
    
    // Switch Turn
    turn = turn === 'w' ? 'b' : 'w';
    selectedSquare = null;
    updateStatus();
    initBoard(); 
  }

  function addMoveToHistory(notation) {
    if (turn === 'b') {
      // White just moved, create new row
      const row = document.createElement('div');
      row.className = 'move-row active';
      document.querySelectorAll('.move-row').forEach(el => el.classList.remove('active'));
      
      row.innerHTML = `
        <div class="col-num">${moveCount}.</div>
        <div class="col-w">${notation}</div>
        <div class="col-b"></div>
      `;
      moveList.appendChild(row);
    } else {
      // Black just moved, update last row
      const lastRow = moveList.lastElementChild;
      if (lastRow) {
        lastRow.querySelector('.col-b').innerText = notation;
        moveCount++;
      }
    }
    moveList.scrollTop = moveList.scrollHeight;
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  function resetGame() {
    location.reload();
  }

  // --- Populate Sample Data (Critique Item 6) ---
  function populateSampleData() {
    const sampleMoves = [
      {w: 'e4', b: 'e5'},
      {w: 'Nf3', b: 'Nc6'},
      {w: 'Bb5', b: 'a6'},
      {w: 'Ba4', b: 'Nf6'},
      {w: 'O-O', b: 'Be7'},
      {w: 'Re1', b: 'b5'},
      {w: 'Bb3', b: 'd6'},
      {w: 'c3', b: 'O-O'},
      {w: 'h3', b: 'Nb8'},
      {w: 'd4', b: 'Nbd7'}
    ];

    sampleMoves.forEach((move, idx) => {
      const row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = `
        <div class="col-num">${idx + 1}.</div>
        <div class="col-w">${move.w}</div>
        <div class="col-b">${move.b}</div>
      `;
      moveList.appendChild(row);
    });
    
    // Update internal state to match end of this game for demonstration
    // (In a real app, we'd parse moves to update boardState)
    // Here we just update the move counter visually
    moveCount = 11;
  }

  // Start
  initBoard();
  populateSampleData();

</script>
</body>
