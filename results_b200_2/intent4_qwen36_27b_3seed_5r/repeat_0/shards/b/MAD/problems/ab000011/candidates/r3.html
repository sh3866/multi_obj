<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX: REVISED</title>
<style>
    :root {
        /* REVISED PALETTE: DARKER, HIGHER CONTRAST */
        --bg-deep: #050608;
        --bg-panel: #0f1013;
        
        --accent-cyan: #00f0ff;   /* Lever / Mechanism */
        --accent-amber: #ffb700;  /* HUD / System */
        --accent-rust: #b85c28;   /* Crates */
        
        --wall-top: #2a2e36;
        --wall-side: #14161b;
        
        --text-main: #e0e3e8;
        --text-muted: #4a505b;
        
        --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.5);
        --glow-amber: 0 0 8px rgba(255, 183, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        /* Industrial texture */
        background-image: 
            radial-gradient(circle at 50% 30%, #1a1d24 0%, #050608 100%),
            repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(255,255,255,0.02) 3px);
        color: var(--text-main);
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace; /* Strict Monospace */
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 700px;
        padding: 20px;
        z-index: 1;
    }

    /* --- HUD & HEADER --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        margin-bottom: 1rem;
        padding: 0 0.5rem;
    }

    h1 {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-main);
        /* Container for title to prevent washout */
        background: rgba(5, 6, 8, 0.6);
        padding: 0.2rem 0.8rem;
        border-left: 4px solid var(--accent-amber);
        backdrop-filter: blur(2px);
    }

    /* HUD moved to top right, tighter layout */
    .hud-panel {
        display: flex;
        gap: 2rem;
        background: rgba(15, 16, 19, 0.95);
        padding: 0.5rem 1.2rem;
        border: 1px solid #333;
        border-bottom: 2px solid var(--accent-amber);
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .hud-label {
        font-size: 0.55rem;
        font-weight: 700;
        color: var(--accent-amber);
        letter-spacing: 0.2em;
        margin-bottom: 2px;
        opacity: 0.9;
    }

    .hud-value {
        font-family: 'Consolas', monospace;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
        text-shadow: 0 0 5px rgba(255,255,255,0.1);
    }

    /* --- THE BOARD FRAME --- */
    .board-frame {
        position: relative;
        padding: 12px;
        background: #111215;
        /* Deep Well Effect */
        box-shadow: 
            inset 0 0 40px rgba(0,0,0,1),
            0 20px 60px rgba(0,0,0,0.8),
            0 0 0 1px #333;
        border-radius: 4px;
    }

    /* Diegetic HUD Overlay (Integrated into Frame) */
    .board-hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        justify-content: space-between;
        padding: 10px 15px;
        z-index: 10;
    }

    .overlay-stat {
        font-family: 'Consolas', monospace;
        font-size: 0.75rem;
        color: var(--accent-amber);
        background: rgba(0,0,0,0.6);
        padding: 2px 6px;
        border: 1px solid rgba(255, 183, 0, 0.3);
        text-shadow: 0 0 5px var(--accent-amber);
        opacity: 0.8;
    }

    canvas {
        display: block;
        border: 1px solid #222;
    }

    /* --- CONTROLS LEGEND --- */
    .controls {
        display: flex;
        gap: 4rem;
        width: 100%;
        justify-content: center;
        margin-top: 2rem;
        opacity: 0.7;
        border-top: 1px solid #222;
        padding-top: 1.5rem;
    }

    .control-item {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .key-group {
        display: flex;
        gap: 6px;
    }

    .key {
        width: 28px;
        height: 28px;
        /* Dark Metal Keys */
        background: linear-gradient(180deg, #252830 0%, #15171c 100%);
        border: 1px solid #3a3f4a;
        border-bottom: 3px solid #0a0b0e;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: bold;
        color: var(--text-main);
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .key.space { width: 90px; }

    .control-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .status-bar {
        margin-top: 1.5rem;
        font-family: 'Consolas', monospace;
        font-size: 0.65rem;
        color: var(--accent-cyan);
        letter-spacing: 0.15em;
        opacity: 0.6;
        text-transform: uppercase;
        text-align: center;
    }

</style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>IRON & FLUX</h1>
        <!-- Top Right HUD -->
        <div class="hud-panel">
            <div class="hud-item">
                <span class="hud-label">SECTOR</span>
                <span class="hud-value">04</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">MOVES</span>
                <span class="hud-value">12</span>
            </div>
        </div>
    </header>

    <div class="board-frame">
        <!-- Diegetic Overlay integrated into frame -->
        <div class="board-hud-overlay">
            <div class="overlay-stat">SYS: ONLINE</div>
            <div class="overlay-stat">LOCK: ENGAGED</div>
        </div>
        <canvas id="grid-canvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-item">
            <div class="key-group">
                <div class="key">W</div>
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
            </div>
            <span class="control-text">Navigate</span>
        </div>
        <div class="control-item">
            <div class="key-group">
                <div class="key space">SPACE</div>
            </div>
            <span class="control-text">Actuate</span>
        </div>
    </div>

    <div class="status-bar">WARNING: HIGH VOLTAGE // DO NOT TOUCH</div>
</div>

<script>
/**
 * REVISED VISUAL ENGINE
 * Focus: High Contrast, Dark Matte Floors, Mechanical Lever, Distinct Player.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Revised Palette
const C = {
    bg: '#050608',
    // Floor is now near-black matte
    floorBase: '#111215', 
    floorLight: '#1a1c22',
    floorShadow: '#08090a',
    
    wallTop: '#2a2e36',
    wallSide: '#14161b',
    wallFront: '#0f1115',
    
    cyan: '#00f0ff',   // Lever / Mechanism
    rust: '#b85c28',   // Iron / Crates
    amber: '#ffb700',  // System / HUD
    
    red: '#ff2a2a'     // Target
};

// Game State
let state = {
    player: { x: 1, y: 1 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}, {x:5, y:1}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- DRAWING HELPERS ---

function getPos(x, y) {
    return { x: x * TILE_SIZE, y: y * TILE_SIZE };
}

function drawFloorTile(x, y) {
    const p = getPos(x, y);
    const s = TILE_SIZE;
    
    // Base (Matte Dark)
    ctx.fillStyle = C.floorBase;
    ctx.fillRect(p.x, p.y, s, s);

    // INSET EFFECT (Recessed Floor) - Sharper
    // Top/Left Inner Highlight
    ctx.fillStyle = C.floorLight;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + s);
    ctx.lineTo(p.x, p.y);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - 3, p.y);
    ctx.lineTo(p.x + 3, p.y + 3);
    ctx.lineTo(p.x + 3, p.y + s - 3);
    ctx.fill();

    // Bottom/Right Inner Shadow (Consistent Angle)
    ctx.fillStyle = C.floorShadow;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + s);
    ctx.lineTo(p.x + s, p.y + s);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - 3, p.y + 3);
    ctx.lineTo(p.x + 3, p.y + s - 3);
    ctx.fill();
}

function drawWall(x, y) {
    const p = getPos(x, y);
    const s = TILE_SIZE;
    const depth = 8; 

    // Wall Front (Dark)
    ctx.fillStyle = C.wallFront;
    ctx.fillRect(p.x, p.y, s, s);

    // Wall Side (Right - Shadow)
    ctx.fillStyle = C.wallSide;
    ctx.beginPath();
    ctx.moveTo(p.x + s, p.y + s);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - depth, p.y + depth);
    ctx.lineTo(p.x + s - depth, p.y + s - depth);
    ctx.fill();

    // Wall Top (Light - Highlight)
    ctx.fillStyle = C.wallTop;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - depth, p.y + depth);
    ctx.lineTo(p.x + depth, p.y + depth);
    ctx.fill();

    // Industrial Rivets
    ctx.fillStyle = '#050608';
    ctx.beginPath(); ctx.arc(p.x + depth + 2, p.y + depth + 2, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + s - depth - 2, p.y + s - depth - 2, 1.5, 0, Math.PI*2); ctx.fill();
}

function drawTarget(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;

    // Distinct Shape: Rotated Square (Diamond) with cross
    ctx.shadowBlur = 10;
    ctx.shadowColor = C.red;
    
    ctx.strokeStyle = C.red;
    ctx.lineWidth = 2;
    
    // Outer Diamond
    ctx.beginPath();
    ctx.moveTo(cx, cy - 24);
    ctx.lineTo(cx + 24, cy);
    ctx.lineTo(cx, cy + 24);
    ctx.lineTo(cx - 24, cy);
    ctx.closePath();
    ctx.stroke();

    // Inner Crosshair
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
    ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;
}

function drawDoor(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;
    const isOpen = state.door.open;

    // Archway Shape (Recessed)
    ctx.fillStyle = '#000000'; // Deepest black
    ctx.beginPath();
    ctx.moveTo(p.x + 12, p.y + TILE_SIZE - 12);
    ctx.lineTo(p.x + 12, p.y + 32);
    ctx.arc(cx, p.y + 32, TILE_SIZE/2 - 12, Math.PI, 0);
    ctx.lineTo(p.x + TILE_SIZE - 12, p.y + TILE_SIZE - 12);
    ctx.fill();

    // Door Frame (Metallic)
    ctx.strokeStyle = isOpen ? C.cyan : '#444';
    ctx.lineWidth = 3;
    ctx.stroke();

    if (isOpen) {
        // Open Gate Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = C.cyan;
        ctx.strokeStyle = C.cyan;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.shadowBlur = 0;
    } else {
        // Closed Gate Texture (Vertical bars)
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 3;
        for(let i=1; i<4; i++) {
            let barX = p.x + 12 + (i * (TILE_SIZE - 24)/4);
            ctx.beginPath();
            ctx.moveTo(barX, p.y + 12);
            ctx.lineTo(barX, p.y + TILE_SIZE - 12);
            ctx.stroke();
        }
    }
}

function drawLever(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;
    const isActive = state.lever.active;

    // Base Plate (Cyan/Mechanical)
    ctx.fillStyle = '#0a3a40'; // Dark cyan base
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();
    
    // Plate Rim
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Mechanical Handle (Lever)
    ctx.lineCap = 'round';
    
    // Shadow of handle
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    const handleOffset = isActive ? 12 : -12;
    const handleY = isActive ? -12 : 12;
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + handleOffset, cy + handleY);
    ctx.stroke();

    // Actual Handle
    ctx.strokeStyle = isActive ? '#fff' : '#8899a6';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + handleOffset, cy + handleY);
    ctx.stroke();

    // Handle Tip (Glowing if active)
    ctx.fillStyle = isActive ? C.cyan : '#444';
    ctx.beginPath();
    ctx.arc(cx + handleOffset, cy + handleY, 5, 0, Math.PI*2);
    ctx.fill();
    
    if (isActive) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = C.cyan;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx + handleOffset, cy + handleY, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function drawCrate(x, y) {
    const p = getPos(x, y);
    const inset = 4;
    const s = TILE_SIZE - inset*2;

    // Shadow (Heavy)
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(p.x + inset + 4, p.y + inset + 4, s, s);

    // Body (Matte Rust)
    ctx.fillStyle = C.rust;
    ctx.fillRect(p.x + inset, p.y + inset, s, s);

    // 3D Top Highlight (Sharp)
    ctx.fillStyle = '#d67a40';
    ctx.fillRect(p.x + inset, p.y + inset, s, 3);
    ctx.fillRect(p.x + inset, p.y + inset, 3, s);

    // 3D Bottom Shadow (Sharp)
    ctx.fillStyle = '#7a3c14';
    ctx.fillRect(p.x + inset, p.y + TILE_SIZE - inset - 3, s, 3);
    ctx.fillRect(p.x + TILE_SIZE - inset - 3, p.y + inset, 3, s);

    // Brushed Metal Texture
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#000';
    for(let i=0; i<12; i++) {
        ctx.fillRect(p.x + inset, p.y + inset + (i*6), s, 1);
    }
    ctx.globalAlpha = 1.0;

    // Corner Rivets
    ctx.fillStyle = '#222';
    const rivetOff = 6;
    ctx.beginPath(); ctx.arc(p.x + inset + rivetOff, p.y + inset + rivetOff, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + TILE_SIZE - inset - rivetOff, p.y + TILE_SIZE - inset - rivetOff, 2, 0, Math.PI*2); ctx.fill();
}

function drawPlayer(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;

    // Dynamic Light Source (Stronger)
    // Illuminates the floor around the player
    const gradient = ctx.createRadialGradient(cx, cy, 5, cx, cy, 50);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(p.x - 20, p.y - 20, TILE_SIZE + 40, TILE_SIZE + 40);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 10, 14, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // Player Character: Distinct, Bright, Geometric
    // Outer Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#fff';
    
    // Main Shape: Inverted Triangle / Arrow
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 18);
    ctx.lineTo(cx + 14, cy + 12);
    ctx.lineTo(cx, cy + 6);
    ctx.lineTo(cx - 14, cy + 12);
    ctx.closePath();
    ctx.fill();

    // Inner Core (Cyan)
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.cyan;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 8);
    ctx.lineTo(cx + 6, cy + 4);
    ctx.lineTo(cx, cy + 1);
    ctx.lineTo(cx - 6, cy + 4);
    ctx.closePath();
    ctx.fill();
}

function draw() {
    // 1. Clear & Draw Floor
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            drawFloorTile(x, y);
        }
    }

    // 2. Draw Targets (Under everything)
    drawTarget(state.target.x, state.target.y);

    // 3. Draw Door (Floor level)
    drawDoor(state.door.x, state.door.y);

    // 4. Draw Lever (Floor level)
    drawLever(state.lever.x, state.lever.y);

    // 5. Draw Crates (Physical objects)
    state.crates.forEach(c => drawCrate(c.x, c.y));

    // 6. Draw Player (Dynamic light, on top of crates/floor)
    drawPlayer(state.player.x, state.player.y);

    // 7. Draw Walls (Highest Z-index visually)
    state.walls.forEach(w => drawWall(w.x, w.y));
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const newX = state.player.x + dx;
    const newY = state.player.y + dy;

    // Bounds Check
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Wall Check
    if (state.walls.some(w => w.x === newX && w.y === newY)) return;

    // Crate Check
    const crateIdx = state.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const nextX = newX + dx;
        const nextY = newY + dy;
        
        // Can crate move?
        const blocked = 
            nextX < 0 || nextX >= GRID_COLS || nextY < 0 || nextY >= GRID_ROWS ||
            state.walls.some(w => w.x === nextX && w.y === nextY) ||
            state.crates.some(c => c.x === nextX && c.y === nextY) ||
            (state.door.x === nextX && state.door.y === nextY && !state.door.open);

        if (!blocked) {
            state.crates[crateIdx].x = nextX;
            state.crates[crateIdx].y = nextY;
            state.player.x = newX;
            state.player.y = newY;
            updateHUD();
            draw();
        }
    } else {
        // Door Interaction
        if (state.door.x === newX && state.door.y === newY && state.door.open) {
            // Win condition (reset for demo purposes)
            state.player.x = 1;
            state.player.y = 1;
            state.crates = [{ x: 3, y: 3 }, { x: 5, y: 2 }];
            state.lever.active = false;
            state.door.open = false;
            updateHUD();
        } else {
            state.player.x = newX;
            state.player.y = newY;
            updateHUD();
        }
        draw();
    }
}

function pullLever() {
    const p = state.player;
    const l = state.lever;
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    
    if (dist === 1) {
        l.active = !l.active;
        state.door.open = l.active;
        draw();
    }
}

function updateHUD() {
    // Just a placeholder for logic hook
}

// Input
window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': movePlayer(0, -1); break;
        case 'ArrowDown': case 's': movePlayer(0, 1); break;
        case 'ArrowLeft': case 'a': movePlayer(-1, 0); break;
        case 'ArrowRight': case 'd': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
