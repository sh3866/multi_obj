<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-dark: #0f1115;
        --bg-panel: #161920;
        --accent-primary: #00f0ff; /* Electric Cyan */
        --accent-secondary: #ff0055; /* Neon Magenta */
        --accent-warn: #ffaa00; /* Amber */
        --text-main: #e6edf3;
        --text-muted: #8b949e;
        --grid-line: #2a303c;
        --tile-floor: #1c2128;
        --tile-wall: #0d1014;
        --shadow-heavy: 0 10px 30px -10px rgba(0,0,0,0.8);
        --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.4);
        --glow-magenta: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- LAYOUT & TYPOGRAPHY --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        width: 100%;
        max-width: 900px;
        padding: 20px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        border-bottom: 1px solid var(--grid-line);
        padding-bottom: 1rem;
    }

    h1 {
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: linear-gradient(90deg, var(--text-main), var(--text-muted));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .hud {
        display: flex;
        gap: 2rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    .hud-item span {
        color: var(--accent-primary);
        font-weight: bold;
        font-size: 1.2rem;
        margin-left: 0.5rem;
        text-shadow: var(--glow-cyan);
    }

    /* --- THE BOARD --- */
    .board-wrapper {
        position: relative;
        padding: 20px;
        background: var(--bg-panel);
        border-radius: 4px;
        box-shadow: var(--shadow-heavy);
        border: 1px solid var(--grid-line);
    }

    /* Subtle tech corner accents */
    .board-wrapper::before, .board-wrapper::after {
        content: ''; position: absolute; width: 10px; height: 10px;
        border: 2px solid var(--accent-primary); transition: all 0.3s ease;
    }
    .board-wrapper::before { top: 0; left: 0; border-right: none; border-bottom: none; }
    .board-wrapper::after { bottom: 0; right: 0; border-left: none; border-top: none; }

    #grid-canvas {
        display: block;
        cursor: crosshair;
    }

    /* --- CONTROLS LEGEND --- */
    .controls {
        display: flex;
        gap: 2rem;
        width: 100%;
        justify-content: center;
        margin-top: 1rem;
    }

    .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255,255,255,0.03);
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid transparent;
        transition: border-color 0.2s;
    }

    .control-group:hover {
        border-color: var(--grid-line);
    }

    .icon-box {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .key-badge {
        background: #2a303c;
        color: var(--text-main);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-family: monospace;
        border-bottom: 2px solid #111;
    }

    .label {
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
    }

    /* --- FOOTER --- */
    footer {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 0.2em;
    }

</style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>Iron & Flux</h1>
        <div class="hud">
            <div class="hud-item">LEVEL <span>04</span></div>
            <div class="hud-item">MOVES <span>12</span></div>
        </div>
    </header>

    <div class="board-wrapper">
        <!-- Canvas size will be set by JS -->
        <canvas id="grid-canvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="icon-box">
                <!-- Player Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2">
                    <circle cx="12" cy="12" r="8" />
                    <circle cx="12" cy="12" r="3" fill="#00f0ff" />
                </svg>
            </div>
            <span class="label">MOVE <span class="key-badge">ARROWS</span></span>
        </div>
        <div class="control-group">
            <div class="icon-box">
                <!-- Crate Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffaa00" stroke-width="2">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="12" y1="4" x2="12" y2="20" />
                </svg>
            </div>
            <span class="label">PUSH <span class="key-badge">WALK INTO</span></span>
        </div>
        <div class="control-group">
            <div class="icon-box">
                <!-- Lever Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff0055" stroke-width="2">
                    <path d="M12 22V12" />
                    <path d="M12 12L18 6" />
                    <circle cx="12" cy="22" r="2" fill="#ff0055"/>
                </svg>
            </div>
            <span class="label">PULL <span class="key-badge">SPACE</span></span>
        </div>
    </div>

    <footer>System Status: Online</footer>
</div>

<script>
/**
 * GAME ENGINE & RENDERER
 * Uses HTML5 Canvas for crisp, performant rendering of the grid and entities.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;
const GAP = 4; // Gap between tiles for aesthetic
const PADDING = 40; // Internal padding

// Palette
const COLORS = {
    floor: '#1c2128',
    floorHighlight: '#2a303c',
    wall: '#0d1014',
    wallBorder: '#222833',
    gridLine: '#232830',
    player: '#00f0ff',
    crate: '#ffaa00',
    lever: '#ff0055',
    target: '#333333',
    door: '#111',
    doorFrame: '#00f0ff'
};

// Game State
let gameState = {
    player: { x: 1, y: 1 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 }, // Visual target for the lever
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    // Handle High DPI
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    // Initial Draw
    draw();
}

// Drawing Helpers
function drawRect(x, y, color, stroke = null) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, TILE_SIZE - GAP, TILE_SIZE - GAP);
    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, TILE_SIZE - GAP, TILE_SIZE - GAP);
    }
}

function drawGrid() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Floor
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            drawRect(x * TILE_SIZE, y * TILE_SIZE, COLORS.floor);
            
            // Grid lines
            ctx.strokeStyle = COLORS.gridLine;
            ctx.beginPath();
            ctx.moveTo(x * TILE_SIZE, y * TILE_SIZE + TILE_SIZE);
            ctx.lineTo(x * TILE_SIZE + TILE_SIZE, y * TILE_SIZE + TILE_SIZE);
            ctx.stroke();
        }
    }
}

function drawWalls() {
    gameState.walls.forEach(w => {
        const px = w.x * TILE_SIZE;
        const py = w.y * TILE_SIZE;
        
        // Wall Base
        drawRect(px, py, COLORS.wall);
        
        // Wall Detail (3D-ish bevel)
        ctx.fillStyle = COLORS.wallBorder;
        ctx.beginPath();
        ctx.moveTo(px, py + TILE_SIZE - GAP);
        ctx.lineTo(px + TILE_SIZE - GAP, py + TILE_SIZE - GAP);
        ctx.lineTo(px + TILE_SIZE - GAP, py + TILE_SIZE - GAP - 4);
        ctx.lineTo(px, py + TILE_SIZE - GAP - 4);
        ctx.fill();
    });
}

function drawTarget() {
    const t = gameState.target;
    const cx = t.x * TILE_SIZE + TILE_SIZE/2;
    const cy = t.y * TILE_SIZE + TILE_SIZE/2;
    
    ctx.save();
    ctx.strokeStyle = '#444';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, 15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
}

function drawDoor() {
    const d = gameState.door;
    const px = d.x * TILE_SIZE;
    const py = d.y * TILE_SIZE;
    
    // Door Frame
    ctx.strokeStyle = gameState.door.open ? COLORS.player : COLORS.lever;
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 10, py + 10, TILE_SIZE - GAP - 20, TILE_SIZE - GAP - 20);

    if (!gameState.door.open) {
        // Locked Door Visual
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(px + 15, py + 15, TILE_SIZE - GAP - 30, TILE_SIZE - GAP - 30);
        
        // Lock Icon
        ctx.fillStyle = COLORS.lever;
        ctx.beginPath();
        ctx.arc(cx, cy - 2, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(cx - 4, cy + 2, 8, 10);
    } else {
        // Open Door Visual
        ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
        ctx.fillRect(px + 15, py + 15, TILE_SIZE - GAP - 30, TILE_SIZE - GAP - 30);
    }
}

function drawLever() {
    const l = gameState.lever;
    const cx = l.x * TILE_SIZE + TILE_SIZE/2;
    const cy = l.y * TILE_SIZE + TILE_SIZE/2;
    
    // Base
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI*2);
    ctx.fill();

    // Lever Handle
    ctx.strokeStyle = l.active ? COLORS.player : COLORS.lever;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    // If active, point up, else point down-right
    ctx.lineTo(l.active ? cx : cx + 8, l.active ? cy - 8 : cy + 8);
    ctx.stroke();
}

function drawCrates() {
    gameState.crates.forEach(c => {
        const px = c.x * TILE_SIZE;
        const py = c.y * TILE_SIZE;
        
        // Crate Body
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, '#e69900');
        grad.addColorStop(1, '#cc8800');
        
        ctx.fillStyle = grad;
        ctx.fillRect(px + 8, py + 8, TILE_SIZE - GAP - 16, TILE_SIZE - GAP - 16);
        
        // Crate Detail (Cross)
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + 8, py + 8);
        ctx.lineTo(px + TILE_SIZE - GAP - 8, py + TILE_SIZE - GAP - 8);
        ctx.moveTo(px + TILE_SIZE - GAP - 8, py + 8);
        ctx.lineTo(px + 8, py + TILE_SIZE - GAP - 8);
        ctx.stroke();
        
        // Crate Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(px + 8, py + TILE_SIZE - GAP - 12, TILE_SIZE - GAP - 16, 4);
    });
}

function drawPlayer() {
    const p = gameState.player;
    const cx = p.x * TILE_SIZE + TILE_SIZE/2;
    const cy = p.y * TILE_SIZE + TILE_SIZE/2;

    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = COLORS.player;

    // Body
    ctx.fillStyle = COLORS.player;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0; // Reset
}

function draw() {
    drawGrid();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- LOGIC (Minimal for visual demo) ---
// Just simple movement logic to show interactivity

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Check Bounds
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Check Walls
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Check Crates
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        // Try push crate
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        // Check if crate hits wall/other crate/door/lever
        const blocked = 
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY) ||
            (newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS);

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            draw();
        }
    } else {
        // Check Door
        if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) {
            // Blocked by closed door
            return;
        }
        gameState.player.x = newX;
        gameState.player.y = newY;
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    
    // Check adjacency
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    if (dist === 1) {
        l.active = !l.active;
        // If lever active, open door
        gameState.door.open = l.active;
        draw();
    }
}

// Input Handling
window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

// Run
init();

</script>
</body>
</html>
