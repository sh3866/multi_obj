<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX: REVISED</title>
<style>
    :root {
        /* REVISED PALETTE */
        --bg-deep: #0a0b0e;
        --bg-panel: #14161b;
        
        --accent-magenta: #FF00FF; /* Flux */
        --accent-rust: #CD7F32;    /* Iron */
        --accent-amber: #FFBF00;   /* HUD/System */
        
        --wall-top: #3a3f4a;
        --wall-side: #1f232b;
        
        --text-main: #eef1f5;
        --text-muted: #6b7280;
        
        --glow-magenta: 0 0 20px rgba(255, 0, 255, 0.6);
        --glow-amber: 0 0 10px rgba(255, 191, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        /* Subtle noise/scanline texture */
        background-image: 
            radial-gradient(circle at 50% 50%, #1a1c23 0%, #0a0b0e 100%),
            repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.2) 3px);
        color: var(--text-main);
        font-family: 'Courier New', Courier, monospace; /* Industrial fallback */
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 800px;
        padding: 20px;
        z-index: 1;
    }

    /* --- HUD & HEADER --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        margin-bottom: 1.5rem;
        padding: 0 0.5rem;
    }

    h1 {
        font-family: 'Arial Black', sans-serif; /* Geometric fallback */
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
        position: relative;
        margin: 0;
    }

    h1 span {
        color: var(--accent-magenta);
        text-shadow: var(--glow-magenta);
    }

    .hud-panel {
        display: flex;
        gap: 2.5rem;
        background: rgba(20, 22, 27, 0.9);
        padding: 0.6rem 1.5rem;
        border: 1px solid #333;
        border-top: 2px solid var(--accent-amber); /* Industrial Accent */
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        backdrop-filter: blur(4px);
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .hud-label {
        font-size: 0.6rem;
        font-weight: 700;
        color: var(--accent-amber); /* Subdued Amber */
        letter-spacing: 0.15em;
        margin-bottom: 2px;
        opacity: 0.8;
    }

    .hud-value {
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
        text-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    /* --- THE BOARD --- */
    .board-frame {
        position: relative;
        padding: 16px;
        background: #111;
        /* Physical Well Effect */
        box-shadow: 
            inset 0 0 50px rgba(0,0,0,0.9),
            inset 0 0 10px rgba(0,0,0,1),
            0 20px 50px rgba(0,0,0,0.6);
        border: 1px solid #333;
        border-radius: 2px;
    }

    /* Decorative corner bolts */
    .board-frame::before, .board-frame::after {
        content: ''; position: absolute; width: 6px; height: 6px;
        background: var(--accent-amber);
        box-shadow: 0 0 5px var(--accent-amber);
        border-radius: 50%;
    }
    .board-frame::before { top: 6px; left: 6px; }
    .board-frame::after { bottom: 6px; right: 6px; }

    canvas {
        display: block;
        /* The "Well" background color */
        background-color: #050608; 
    }

    /* --- CONTROLS LEGEND --- */
    .controls {
        display: flex;
        gap: 3rem;
        width: 100%;
        justify-content: center;
        margin-top: 2.5rem;
        opacity: 0.8;
    }

    .control-item {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .key-group {
        display: flex;
        gap: 6px;
    }

    .key {
        width: 32px;
        height: 32px;
        /* Metallic Key */
        background: linear-gradient(180deg, #2d3440 0%, #1a1e26 100%);
        border: 1px solid #444;
        border-bottom: 4px solid #0f1216;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--text-main);
        box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
    }

    .key.space { width: 100px; }

    .control-text {
        font-size: 0.8rem;
        color: var(--accent-rust); /* Rust Text */
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .status-bar {
        margin-top: 2rem;
        font-family: 'Courier New', monospace;
        font-size: 0.75rem;
        color: var(--accent-amber);
        letter-spacing: 0.1em;
        opacity: 0.5;
        text-transform: uppercase;
    }

</style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>Iron & <span>Flux</span></h1>
        <div class="hud-panel">
            <div class="hud-item">
                <span class="hud-label">SECTOR</span>
                <span class="hud-value">04</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">MOVES</span>
                <span class="hud-value">12</span>
            </div>
        </div>
    </header>

    <div class="board-frame">
        <canvas id="grid-canvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-item">
            <div class="key-group">
                <div class="key">W</div>
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
            </div>
            <span class="control-text">Navigate</span>
        </div>
        <div class="control-item">
            <div class="key-group">
                <div class="key space">SPACE</div>
            </div>
            <span class="control-text">Interact</span>
        </div>
    </div>

    <div class="status-bar">SYSTEM: ONLINE // FLUX: STABLE</div>
</div>

<script>
/**
 * REVISED VISUAL ENGINE
 * Implements "Electric Magenta & Industrial Rust" with 3D Bevels.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Revised Palette
const C = {
    bg: '#050608',
    floorBase: '#161920',
    floorLight: '#1e222b',
    floorShadow: '#0d0f12',
    
    wallTop: '#3a3f4a',
    wallSide: '#1f232b',
    wallFront: '#15181d',
    
    magenta: '#FF00FF', // Flux
    rust: '#CD7F32',    // Iron
    amber: '#FFBF00',   // System
    
    red: '#ff2a2a'
};

// Game State
let state = {
    player: { x: 1, y: 1 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}, {x:5, y:1}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- DRAWING HELPERS ---

function getPos(x, y) {
    return { x: x * TILE_SIZE, y: y * TILE_SIZE };
}

function drawFloorTile(x, y) {
    const p = getPos(x, y);
    const s = TILE_SIZE;
    
    // Base
    ctx.fillStyle = C.floorBase;
    ctx.fillRect(p.x, p.y, s, s);

    // INSET EFFECT (Recessed Floor)
    // Top/Left Inner Highlight
    ctx.fillStyle = C.floorLight;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + s);
    ctx.lineTo(p.x, p.y);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - 4, p.y);
    ctx.lineTo(p.x + 4, p.y + 4);
    ctx.lineTo(p.x + 4, p.y + s - 4);
    ctx.fill();

    // Bottom/Right Inner Shadow
    ctx.fillStyle = C.floorShadow;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + s);
    ctx.lineTo(p.x + s, p.y + s);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - 4, p.y + 4);
    ctx.lineTo(p.x + 4, p.y + s - 4);
    ctx.fill();

    // Grid Line (Subtle)
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x, p.y, s, s);
}

function drawWall(x, y) {
    const p = getPos(x, y);
    const s = TILE_SIZE;
    const depth = 10; // Bevel height

    // Wall Front (Dark)
    ctx.fillStyle = C.wallFront;
    ctx.fillRect(p.x, p.y, s, s);

    // Wall Side (Right - Shadow)
    ctx.fillStyle = C.wallSide;
    ctx.beginPath();
    ctx.moveTo(p.x + s, p.y + s);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - depth, p.y + depth);
    ctx.lineTo(p.x + s - depth, p.y + s - depth);
    ctx.fill();

    // Wall Top (Light - Highlight)
    ctx.fillStyle = C.wallTop;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s - depth, p.y + depth);
    ctx.lineTo(p.x + depth, p.y + depth);
    ctx.fill();

    // Rivets
    ctx.fillStyle = '#0f1115';
    ctx.beginPath(); ctx.arc(p.x + depth + 4, p.y + depth + 4, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + s - depth - 4, p.y + s - depth - 4, 2, 0, Math.PI*2); ctx.fill();
}

function drawTarget(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;

    // Glowing Red Target Reticle
    ctx.shadowBlur = 15;
    ctx.shadowColor = C.red;
    
    ctx.strokeStyle = C.red;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI*2);
    ctx.stroke();

    // Crosshair
    ctx.beginPath();
    ctx.moveTo(cx - 30, cy); ctx.lineTo(cx - 10, cy);
    ctx.moveTo(cx + 10, cy); ctx.lineTo(cx + 30, cy);
    ctx.moveTo(cx, cy - 30); ctx.lineTo(cx, cy - 10);
    ctx.moveTo(cx, cy + 10); ctx.lineTo(cx, cy + 30);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;
}

function drawDoor(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;
    const isOpen = state.door.open;

    // Archway Shape
    ctx.fillStyle = '#05070a'; // Deep dark interior
    ctx.beginPath();
    ctx.moveTo(p.x + 10, p.y + TILE_SIZE - 10);
    ctx.lineTo(p.x + 10, p.y + 30);
    ctx.arc(cx, p.y + 30, TILE_SIZE/2 - 10, Math.PI, 0);
    ctx.lineTo(p.x + TILE_SIZE - 10, p.y + TILE_SIZE - 10);
    ctx.fill();

    // Door Frame (Metallic)
    ctx.strokeStyle = isOpen ? C.magenta : '#444';
    ctx.lineWidth = 3;
    ctx.stroke();

    if (isOpen) {
        // Open Gate Glow
        ctx.shadowBlur = 20;
        ctx.shadowColor = C.magenta;
        ctx.strokeStyle = C.magenta;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
    } else {
        // Closed Gate Texture (Vertical bars)
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        for(let i=1; i<4; i++) {
            let barX = p.x + 10 + (i * (TILE_SIZE - 20)/4);
            ctx.beginPath();
            ctx.moveTo(barX, p.y + 10);
            ctx.lineTo(barX, p.y + TILE_SIZE - 10);
            ctx.stroke();
        }
    }
}

function drawLever(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;
    const isActive = state.lever.active;

    // Base Plate (Rust)
    ctx.fillStyle = C.rust;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Detail
    ctx.fillStyle = '#8a5a1c';
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI*2);
    ctx.fill();

    // Lever Handle
    ctx.strokeStyle = isActive ? '#fff' : '#222';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    // If active, point up/right, else down/left
    const endX = isActive ? cx + 10 : cx - 5;
    const endY = isActive ? cy - 10 : cy + 5;
    ctx.moveTo(cx, cy);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // Handle Tip
    ctx.fillStyle = isActive ? C.amber : '#111';
    ctx.beginPath();
    ctx.arc(endX, endY, 4, 0, Math.PI*2);
    ctx.fill();
}

function drawCrate(x, y) {
    const p = getPos(x, y);
    const inset = 6;
    const s = TILE_SIZE - inset*2;

    // Shadow (Heavy)
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(p.x + inset + 4, p.y + inset + 4, s, s);

    // Body (Matte Rust/Bronze)
    ctx.fillStyle = C.rust;
    ctx.fillRect(p.x + inset, p.y + inset, s, s);

    // 3D Top Highlight
    ctx.fillStyle = '#e69e4d';
    ctx.fillRect(p.x + inset, p.y + inset, s, 4);
    ctx.fillRect(p.x + inset, p.y + inset, 4, s);

    // 3D Bottom Shadow
    ctx.fillStyle = '#8c5520';
    ctx.fillRect(p.x + inset, p.y + TILE_SIZE - inset - 4, s, 4);
    ctx.fillRect(p.x + TILE_SIZE - inset - 4, p.y + inset, 4, s);

    // Brushed Metal Texture (Noise simulation)
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = '#000';
    for(let i=0; i<10; i++) {
        ctx.fillRect(p.x + inset, p.y + inset + (i*8), s, 2);
    }
    ctx.globalAlpha = 1.0;

    // Corner Rivets
    ctx.fillStyle = '#222';
    const rivetOff = 8;
    ctx.beginPath(); ctx.arc(p.x + inset + rivetOff, p.y + inset + rivetOff, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + TILE_SIZE - inset - rivetOff, p.y + TILE_SIZE - inset - rivetOff, 2, 0, Math.PI*2); ctx.fill();
}

function drawPlayer(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;

    // Dynamic Light Source (Glow)
    // This illuminates the floor around the player
    const gradient = ctx.createRadialGradient(cx, cy, 10, cx, cy, 60);
    gradient.addColorStop(0, 'rgba(255, 0, 255, 0.3)');
    gradient.addColorStop(1, 'rgba(255, 0, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(p.x - 20, p.y - 20, TILE_SIZE + 40, TILE_SIZE + 40);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 12, 12, 5, 0, 0, Math.PI*2);
    ctx.fill();

    // Player Gem (Magenta)
    ctx.shadowBlur = 15;
    ctx.shadowColor = C.magenta;

    ctx.fillStyle = C.magenta;
    ctx.beginPath();
    // Diamond shape
    ctx.moveTo(cx, cy - 16);
    ctx.lineTo(cx + 10, cy);
    ctx.lineTo(cx, cy + 16);
    ctx.lineTo(cx - 10, cy);
    ctx.closePath();
    ctx.fill();

    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 6);
    ctx.lineTo(cx + 4, cy);
    ctx.lineTo(cx, cy + 6);
    ctx.lineTo(cx - 4, cy);
    ctx.closePath();
    ctx.fill();
}

function draw() {
    // 1. Clear & Draw Floor
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            drawFloorTile(x, y);
        }
    }

    // 2. Draw Targets (Under everything)
    drawTarget(state.target.x, state.target.y);

    // 3. Draw Door (Floor level)
    drawDoor(state.door.x, state.door.y);

    // 4. Draw Walls (Highest Z-index visually)
    state.walls.forEach(w => drawWall(w.x, w.y));

    // 5. Draw Lever (Floor level)
    drawLever(state.lever.x, state.lever.y);

    // 6. Draw Crates (Physical objects)
    state.crates.forEach(c => drawCrate(c.x, c.y));

    // 7. Draw Player (Dynamic light)
    drawPlayer(state.player.x, state.player.y);
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const newX = state.player.x + dx;
    const newY = state.player.y + dy;

    // Bounds Check
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Wall Check
    if (state.walls.some(w => w.x === newX && w.y === newY)) return;

    // Crate Check
    const crateIdx = state.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const nextX = newX + dx;
        const nextY = newY + dy;
        
        // Can crate move?
        const blocked = 
            nextX < 0 || nextX >= GRID_COLS || nextY < 0 || nextY >= GRID_ROWS ||
            state.walls.some(w => w.x === nextX && w.y === nextY) ||
            state.crates.some(c => c.x === nextX && c.y === nextY) ||
            (state.door.x === nextX && state.door.y === nextY); // Can't push into door

        if (!blocked) {
            state.crates[crateIdx].x = nextX;
            state.crates[crateIdx].y = nextY;
            state.player.x = newX;
            state.player.y = newY;
            updateHUD();
            draw();
        }
    } else {
        // Door Interaction
        if (state.door.x === newX && state.door.y === newY && state.door.open) {
            // Win condition (reset for demo purposes)
            state.player.x = 1;
            state.player.y = 1;
            state.crates = [{ x: 3, y: 3 }, { x: 5, y: 2 }];
            state.lever.active = false;
            state.door.open = false;
            updateHUD();
        } else {
            state.player.x = newX;
            state.player.y = newY;
            updateHUD();
        }
        draw();
    }
}

function pullLever() {
    const p = state.player;
    const l = state.lever;
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    
    if (dist === 1) {
        l.active = !l.active;
        state.door.open = l.active;
        draw();
    }
}

function updateHUD() {
    // Just a placeholder for logic hook
}

// Input
window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': movePlayer(0, -1); break;
        case 'ArrowDown': case 's': movePlayer(0, 1); break;
        case 'ArrowLeft': case 'a': movePlayer(-1, 0); break;
        case 'ArrowRight': case 'd': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
