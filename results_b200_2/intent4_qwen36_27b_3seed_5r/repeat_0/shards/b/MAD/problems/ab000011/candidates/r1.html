<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-deep: #05070a;
        --bg-panel: #0f1216;
        --metal-dark: #1a1e26;
        --metal-light: #2d3440;
        --accent-cyan: #00f3ff;
        --accent-orange: #ffaa00;
        --accent-red: #ff2a2a;
        --text-main: #eef1f5;
        --text-muted: #6b7280;
        --glow-cyan: 0 0 12px rgba(0, 243, 255, 0.6);
        --glow-orange: 0 0 12px rgba(255, 170, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        /* Subtle grid background pattern */
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 800px;
        padding: 20px;
    }

    /* --- HUD & HEADER --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        margin-bottom: 1.5rem;
        padding: 0 0.5rem;
    }

    h1 {
        font-size: 1.8rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        position: relative;
    }

    h1::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 40px;
        height: 3px;
        background: var(--accent-cyan);
        box-shadow: var(--glow-cyan);
    }

    .hud-panel {
        display: flex;
        gap: 2rem;
        background: rgba(15, 18, 22, 0.8);
        padding: 0.8rem 1.5rem;
        border: 1px solid var(--metal-light);
        border-radius: 2px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .hud-label {
        font-size: 0.65rem;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        margin-bottom: 2px;
    }

    .hud-value {
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
    }

    .hud-value.cyan { color: var(--accent-cyan); text-shadow: var(--glow-cyan); }
    .hud-value.orange { color: var(--accent-orange); text-shadow: var(--glow-orange); }

    /* --- THE BOARD --- */
    .board-frame {
        position: relative;
        padding: 12px;
        background: var(--metal-dark);
        border: 1px solid #333;
        box-shadow: 
            inset 0 0 30px rgba(0,0,0,0.8),
            0 20px 50px rgba(0,0,0,0.6);
        border-radius: 4px;
    }

    /* Corner brackets */
    .board-frame::before, .board-frame::after {
        content: ''; position: absolute; width: 20px; height: 20px;
        border: 2px solid var(--accent-cyan);
        transition: all 0.3s ease;
        pointer-events: none;
    }
    .board-frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .board-frame::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    canvas {
        display: block;
        background-color: #080a0d;
    }

    /* --- CONTROLS LEGEND --- */
    .controls {
        display: flex;
        gap: 2rem;
        width: 100%;
        justify-content: center;
        margin-top: 2.5rem;
        opacity: 0.7;
        transition: opacity 0.3s;
    }
    
    .controls:hover { opacity: 1; }

    .control-item {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .key-group {
        display: flex;
        gap: 4px;
    }

    .key {
        width: 28px;
        height: 28px;
        background: linear-gradient(180deg, #2d3440 0%, #1a1e26 100%);
        border: 1px solid #3e4655;
        border-bottom: 3px solid #0f1216;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: bold;
        color: var(--text-main);
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .key.wide { width: 70px; }
    .key.space { width: 90px; }

    .control-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    .status-bar {
        margin-top: 2rem;
        font-family: monospace;
        font-size: 0.7rem;
        color: var(--accent-cyan);
        letter-spacing: 0.1em;
        opacity: 0.6;
    }

</style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>Iron & Flux</h1>
        <div class="hud-panel">
            <div class="hud-item">
                <span class="hud-label">SECTOR</span>
                <span class="hud-value cyan">04</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">MOVES</span>
                <span class="hud-value orange">12</span>
            </div>
        </div>
    </header>

    <div class="board-frame">
        <canvas id="grid-canvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-item">
            <div class="key-group">
                <div class="key">W</div>
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
            </div>
            <span class="control-text">Navigate</span>
        </div>
        <div class="control-item">
            <div class="key-group">
                <div class="key space">SPACE</div>
            </div>
            <span class="control-text">Pull Lever</span>
        </div>
    </div>

    <div class="status-bar">SYSTEM: ONLINE // FLUX: STABLE</div>
</div>

<script>
/**
 * VISUAL ENGINE
 * Uses Canvas for a custom "Cyber-Industrial" look with 3D bevels and lighting.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Palette
const C = {
    dark: '#080a0d',
    floorTop: '#1c2128',
    floorSide: '#12151a',
    wallTop: '#2d3440',
    wallSide: '#1a1e26',
    wallFront: '#11141a',
    cyan: '#00f3ff',
    orange: '#ffaa00',
    red: '#ff2a2a',
    white: '#ffffff'
};

// Game State
let state = {
    player: { x: 1, y: 1 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}, {x:5, y:1}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    // Handle High DPI
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- DRAWING HELPERS ---

function getPos(x, y) {
    return { x: x * TILE_SIZE, y: y * TILE_SIZE };
}

function drawFloorTile(x, y) {
    const p = getPos(x, y);
    const s = TILE_SIZE;
    
    // Base Plate
    ctx.fillStyle = C.floorTop;
    ctx.fillRect(p.x + 1, p.y + 1, s - 2, s - 2);

    // Bevel Top/Left (Light)
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x + 1, p.y + s - 1);
    ctx.lineTo(p.x + 1, p.y + 1);
    ctx.lineTo(p.x + s - 1, p.y + 1);
    ctx.stroke();

    // Bevel Bottom/Right (Shadow)
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.moveTo(p.x + 1, p.y + s - 1);
    ctx.lineTo(p.x + s - 1, p.y + s - 1);
    ctx.lineTo(p.x + s - 1, p.y + 1);
    ctx.stroke();

    // Groove (Dark line around the tile)
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, s, s);
}

function drawWall(x, y) {
    const p = getPos(x, y);
    const s = TILE_SIZE;
    const inset = 4;

    // Wall Base (Darker than floor)
    ctx.fillStyle = C.wallFront;
    ctx.fillRect(p.x + inset, p.y + inset, s - inset*2, s - inset*2);

    // 3D Top Face
    ctx.fillStyle = C.wallTop;
    ctx.beginPath();
    ctx.moveTo(p.x + inset, p.y + s - inset);
    ctx.lineTo(p.x + s - inset, p.y + s - inset);
    ctx.lineTo(p.x + s - inset - 4, p.y + s - inset - 4);
    ctx.lineTo(p.x + inset + 4, p.y + s - inset - 4);
    ctx.fill();

    // 3D Side Face (Right)
    ctx.fillStyle = C.wallSide;
    ctx.beginPath();
    ctx.moveTo(p.x + s - inset, p.y + inset);
    ctx.lineTo(p.x + s - inset, p.y + s - inset);
    ctx.lineTo(p.x + s - inset - 4, p.y + s - inset - 4);
    ctx.lineTo(p.x + s - inset - 4, p.y + inset + 4);
    ctx.fill();

    // Detail: Rivets
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(p.x + inset + 6, p.y + inset + 6, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + s - inset - 6, p.y + s - inset - 6, 1.5, 0, Math.PI*2); ctx.fill();
}

function drawTarget(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;

    // Target Ring
    ctx.strokeStyle = C.wallSide;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI*2);
    ctx.stroke();

    // Inner Dashed Circle
    ctx.strokeStyle = '#444';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawDoor(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;
    const isOpen = state.door.open;

    // Door Frame
    ctx.fillStyle = isOpen ? C.cyan : C.red;
    ctx.fillRect(p.x + 10, p.y + 10, TILE_SIZE - 20, TILE_SIZE - 20);
    
    // Inner Dark Area
    ctx.fillStyle = '#05070a';
    ctx.fillRect(p.x + 14, p.y + 14, TILE_SIZE - 28, TILE_SIZE - 28);

    // Glow Effect
    if (isOpen) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = C.cyan;
        ctx.strokeStyle = C.cyan;
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x + 10, p.y + 10, TILE_SIZE - 20, TILE_SIZE - 20);
        ctx.shadowBlur = 0;
    } else {
        // Lock Icon
        ctx.fillStyle = C.red;
        ctx.fillRect(cx - 4, cy + 2, 8, 10);
        ctx.beginPath();
        ctx.arc(cx, cy - 2, 5, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawLever(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;
    const isActive = state.lever.active;

    // Base Plate
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI*2);
    ctx.fill();

    // Lever Post
    ctx.strokeStyle = isActive ? C.cyan : C.red;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, cy - 15); // Stick up
    ctx.stroke();

    // Handle
    ctx.fillStyle = isActive ? C.cyan : C.red;
    ctx.beginPath();
    ctx.arc(cx, cy - 15, 6, 0, Math.PI*2);
    ctx.fill();

    // Glow if active
    if (isActive) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = C.cyan;
        ctx.stroke(); // Glow the handle again
        ctx.shadowBlur = 0;
    }
}

function drawCrate(x, y) {
    const p = getPos(x, y);
    const inset = 8;
    const s = TILE_SIZE - inset*2;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(p.x + inset + 4, p.y + inset + 4, s, s);

    // Body
    ctx.fillStyle = '#8a6d3b'; // Darker wood/metal
    ctx.fillRect(p.x + inset, p.y + inset, s, s);

    // Highlight Top
    ctx.fillStyle = '#cfa15f';
    ctx.fillRect(p.x + inset, p.y + inset, s, 4);
    ctx.fillRect(p.x + inset, p.y + inset, 4, s);

    // Cross Straps
    ctx.strokeStyle = '#3e321f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x + inset, p.y + inset);
    ctx.lineTo(p.x + TILE_SIZE - inset, p.y + TILE_SIZE - inset);
    ctx.moveTo(p.x + TILE_SIZE - inset, p.y + inset);
    ctx.lineTo(p.x + inset, p.y + TILE_SIZE - inset);
    ctx.stroke();

    // Center Rivet
    ctx.fillStyle = '#2a2214';
    ctx.beginPath();
    ctx.arc(p.x + TILE_SIZE/2, p.y + TILE_SIZE/2, 4, 0, Math.PI*2);
    ctx.fill();
}

function drawPlayer(x, y) {
    const p = getPos(x, y);
    const cx = p.x + TILE_SIZE/2;
    const cy = p.y + TILE_SIZE/2;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 15, 14, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // Glow Aura
    ctx.shadowBlur = 15;
    ctx.shadowColor = C.cyan;

    // Body (Mechanical Shape)
    ctx.fillStyle = C.cyan;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 18); // Head top
    ctx.lineTo(cx + 12, cy - 5);
    ctx.lineTo(cx + 12, cy + 10);
    ctx.lineTo(cx + 6, cy + 18); // Leg L
    ctx.lineTo(cx - 6, cy + 18); // Leg R
    ctx.lineTo(cx - 12, cy + 10);
    ctx.lineTo(cx - 12, cy - 5);
    ctx.closePath();
    ctx.fill();

    // Core (White)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy - 5, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0; // Reset
}

function draw() {
    // 1. Clear & Draw Floor
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            drawFloorTile(x, y);
        }
    }

    // 2. Draw Targets (Under everything)
    drawTarget(state.target.x, state.target.y);

    // 3. Draw Door
    drawDoor(state.door.x, state.door.y);

    // 4. Draw Walls
    state.walls.forEach(w => drawWall(w.x, w.y));

    // 5. Draw Lever
    drawLever(state.lever.x, state.lever.y);

    // 6. Draw Crates
    state.crates.forEach(c => drawCrate(c.x, c.y));

    // 7. Draw Player
    drawPlayer(state.player.x, state.player.y);
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const newX = state.player.x + dx;
    const newY = state.player.y + dy;

    // Bounds Check
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Wall Check
    if (state.walls.some(w => w.x === newX && w.y === newY)) return;

    // Crate Check
    const crateIdx = state.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const nextX = newX + dx;
        const nextY = newY + dy;
        
        // Can crate move?
        const blocked = 
            nextX < 0 || nextX >= GRID_COLS || nextY < 0 || nextY >= GRID_ROWS ||
            state.walls.some(w => w.x === nextX && w.y === nextY) ||
            state.crates.some(c => c.x === nextX && c.y === nextY) ||
            (state.door.x === nextX && state.door.y === nextY); // Can't push into door

        if (!blocked) {
            state.crates[crateIdx].x = nextX;
            state.crates[crateIdx].y = nextY;
            state.player.x = newX;
            state.player.y = newY;
            updateHUD();
            draw();
        }
    } else {
        // Door Interaction
        if (state.door.x === newX && state.door.y === newY && state.door.open) {
            // Win condition (reset for demo purposes)
            state.player.x = 1;
            state.player.y = 1;
            state.crates = [{ x: 3, y: 3 }, { x: 5, y: 2 }];
            state.lever.active = false;
            state.door.open = false;
            updateHUD();
        } else {
            state.player.x = newX;
            state.player.y = newY;
            updateHUD();
        }
        draw();
    }
}

function pullLever() {
    const p = state.player;
    const l = state.lever;
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    
    if (dist === 1) {
        l.active = !l.active;
        state.door.open = l.active;
        draw();
    }
}

function updateHUD() {
    // Just a placeholder for logic hook
}

// Input
window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': movePlayer(0, -1); break;
        case 'ArrowDown': case 's': movePlayer(0, 1); break;
        case 'ArrowLeft': case 'a': movePlayer(-1, 0); break;
        case 'ArrowRight': case 'd': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
