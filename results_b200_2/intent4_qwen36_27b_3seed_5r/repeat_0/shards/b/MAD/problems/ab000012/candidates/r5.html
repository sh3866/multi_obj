<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning - Hub</title>
    <style>
        :root {
            /* --- Palette: Void & Metallic Gold --- */
            --bg-deep: #030305;
            --bg-void: #0a0a12;
            
            /* Metallic Gold Gradient */
            --gold-grad: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-text-grad: linear-gradient(to bottom, #fcf6ba, #d4af37);
            --gold-glow: rgba(255, 215, 0, 0.3);
            
            /* UI Colors */
            --text-main: #E0E0E0;
            --text-muted: #888899;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(10, 10, 15, 0.65);
            
            /* Typography */
            --font-stack: 'Cinzel', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- 1. Background & Atmosphere --- */
        
        /* Canvas for particles */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Deep Void Gradient */
        .void-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 10%, #1a1a2e 0%, #050508 60%, #000000 100%);
            z-index: 0;
        }

        /* --- UI Container --- */
        .ui-container {
            position: relative;
            z-index: 10;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* --- Header (Minimalist) --- */
        header {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 20;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }

        /* --- 6. Currency Polish (Metallic) --- */
        .currency-pill {
            background: rgba(0, 0, 0, 0.6);
            /* Metallic Border */
            border: 1px solid #b38728;
            border-image: var(--gold-grad) 1;
            /* Since border-image ignores radius, we use a pseudo-element for rounded metallic border */
            border-image: none; 
            border: 1px solid transparent;
            background-image: linear-gradient(var(--bg-deep), var(--bg-deep)), var(--gold-grad);
            background-origin: border-box;
            background-clip: content-box, border-box;
            
            border-radius: 4px;
            padding: 0.4rem 1.2rem 0.4rem 0.6rem;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            cursor: default;
        }

        .currency-pill:hover {
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .currency-icon {
            width: 20px;
            height: 20px;
            /* Fill with gradient */
            fill: url(#goldGradientDef); 
        }

        .currency-val {
            font-family: var(--font-ui);
            font-size: 1.1rem;
            font-weight: 700;
            /* Metallic Text */
            background: var(--gold-text-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
        }

        /* --- Hero Section --- */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.2s forwards;
        }

        /* 2. Spotlight Effect */
        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 40vh;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        h1.game-title {
            font-size: 5rem;
            line-height: 1;
            /* 2. Bolder, Majestic */
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0;
            
            /* Metallic/White finish */
            background: linear-gradient(to bottom, #ffffff 40%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Deep Shadow for depth */
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8)) drop-shadow(0 0 30px rgba(100,100,255,0.2));
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-top: 1rem;
            font-weight: 400;
            opacity: 0.8;
        }

        /* --- 1. Menu Grid (Strict Layout) --- */
        .menu-grid {
            display: grid;
            /* Top row is wide, bottom row is 3 equal columns */
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            opacity: 0;
            animation: slideUp 1s ease-out 0.8s forwards;
        }

        /* --- 4. Unify Secondary Cards (Glassmorphism) --- */
        .menu-card {
            position: relative;
            height: 260px;
            width: 100%;
            
            /* Unified Glass Style */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.15); /* Highlight top edge */
            border-radius: 6px;
            
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(20, 20, 30, 0.8);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.05);
        }

        /* --- 3. Refine Summon Card (Primary Artifact) --- */
        .menu-card.summon {
            /* 1. Grid Span: Full width of content area */
            grid-column: 1 / -1;
            
            /* Artifact Styling */
            background: radial-gradient(circle at center, rgba(40, 30, 10, 0.9) 0%, rgba(5, 5, 5, 0.95) 100%);
            
            /* Multi-stop Gold Border */
            border: 2px solid transparent;
            border-image: var(--gold-grad) 1;
            /* Since border-image breaks radius, we use inset pseudo for glow, and solid border for corners */
            border: none;
            box-shadow: 0 0 0 2px #b38728, 0 0 30px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
            border-radius: 4px; /* Slightly sharper corners for artifact feel */
        }

        /* Inner Gold Border */
        .menu-card.summon::after {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            pointer-events: none;
            transition: border-color 0.4s ease;
        }

        .menu-card.summon:hover {
            transform: translateY(-5px) scale(1.005);
            box-shadow: 0 0 0 2px #fcf6ba, 0 0 50px rgba(0,0,0,0.9), 0 0 40px var(--gold-glow);
        }

        .menu-card.summon:hover::after {
            border-color: rgba(255, 215, 0, 0.7);
        }

        /* --- 5. Standardize Iconography --- */
        .card-icon-wrap {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            border-radius: 50%;
            /* Subtle background for icon */
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            transition: all 0.4s ease;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            stroke: var(--text-main);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.4s ease;
        }

        .menu-card:hover .card-icon {
            stroke: #fff;
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        /* Summon Specifics */
        .menu-card.summon .card-icon-wrap {
            width: 100px;
            height: 100px;
            margin-bottom: 1rem;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .menu-card.summon .card-icon {
            width: 56px;
            height: 56px;
            stroke: url(#goldGradientDef);
            filter: drop-shadow(0 0 8px var(--gold-glow));
        }

        .card-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            transition: color 0.3s;
        }

        .menu-card:hover .card-label {
            color: #fff;
        }

        .card-sublabel {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Summon Specific Typography */
        .menu-card.summon .card-label {
            font-size: 2rem;
            background: var(--gold-text-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .menu-card.summon .card-sublabel {
            color: #d4af37;
            font-weight: 500;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive --- */
        @media (max-width: 1000px) {
            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }
            /* Summon takes full width on tablet */
            .menu-card.summon {
                grid-column: 1 / -1;
                height: 200px;
                flex-direction: row;
                justify-content: flex-start;
                padding-left: 3rem;
            }
            .menu-card.summon .card-icon-wrap {
                margin-bottom: 0;
                margin-right: 2rem;
            }
            h1.game-title { font-size: 3.5rem; }
        }

        @media (max-width: 600px) {
            .ui-container { padding: 1rem; justify-content: flex-start; padding-top: 4rem; }
            header { top: 1rem; right: 1rem; }
            .hero { margin-bottom: 2rem; }
            
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .menu-card {
                height: 70px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 1.5rem;
            }
            
            .menu-card.summon {
                grid-column: 1;
                height: 110px; /* Slightly taller */
                flex-direction: row;
                padding-left: 1.5rem;
            }

            .card-icon-wrap {
                width: 32px; height: 32px;
                margin-bottom: 0; margin-right: 1rem;
                background: transparent;
                border: none;
            }
            
            .menu-card.summon .card-icon-wrap {
                width: 44px; height: 44px;
                background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
                border: 1px solid rgba(255, 215, 0, 0.3);
                margin-right: 1rem;
            }

            .card-icon { width: 20px; height: 20px; }
            .menu-card.summon .card-icon { width: 28px; height: 28px; }
            
            .card-sublabel { display: none; }
            
            h1.game-title { font-size: 2.2rem; letter-spacing: 0.05em; }
            .subtitle { font-size: 0.8rem; letter-spacing: 0.2em; }
        }
    </style>
</head>
<body>

    <!-- SVG Defs for Gradients -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="goldGradientDef" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#bf953f" />
                <stop offset="25%" stop-color="#fcf6ba" />
                <stop offset="50%" stop-color="#b38728" />
                <stop offset="75%" stop-color="#fbf5b7" />
                <stop offset="100%" stop-color="#aa771c" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Backgrounds -->
    <div class="void-gradient"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>

    <div class="ui-container">
        
        <!-- Header: Currency Only (Logo Removed) -->
        <header>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="url(#goldGradientDef)" stroke-width="2" fill="none" />
                    <path d="M12 7v10M9 10l6 4M9 14l6-4" stroke="url(#goldGradientDef)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </header>

        <section class="hero">
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Awaken the Ancient Bonds</p>
        </section>

        <nav class="menu-grid">
            
            <!-- 1. Summon (Primary - Artifact) -->
            <div class="menu-card summon" onclick="interact('summon')">
                <div class="card-icon-wrap">
                    <!-- Flame/Rune Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2c0 0-7 7.5-7 13s3.5 7 7 7 7-2 7-7-7-13-7-13z" />
                        <path d="M12 18c-2 0-3.5-1.5-3.5-4s1.5-5 3.5-5 3.5 3 3.5 5-1.5 4-3.5 4z" />
                    </svg>
                </div>
                <div class="card-label">Summon</div>
                <div class="card-sublabel">Open the Void</div>
            </div>

            <!-- 2. Roster (Secondary - Glass) -->
            <div class="menu-card" onclick="interact('roster')">
                <div class="card-icon-wrap">
                    <!-- Scroll/Book Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16v16H4z" />
                        <path d="M4 4l8 4 8-4" />
                        <path d="M12 8v12" />
                    </svg>
                </div>
                <div class="card-label">Roster</div>
                <div class="card-sublabel">Collection</div>
            </div>

            <!-- 3. Battle (Secondary - Glass) -->
            <div class="menu-card" onclick="interact('battle')">
                <div class="card-icon-wrap">
                    <!-- Crossed Swords Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                        <path d="M13 19l6-6" />
                        <path d="M16 16l4 4" />
                        <path d="M19 21l2-2" />
                        <path d="M10.5 6.5L22 18v3h-3L10.5 9.5" />
                    </svg>
                </div>
                <div class="card-label">Battle</div>
                <div class="card-sublabel">Arena</div>
            </div>

            <!-- 4. Grind (Secondary - Glass) -->
            <div class="menu-card" onclick="interact('grind')">
                <div class="card-icon-wrap">
                    <!-- Resource/Gem Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6 3h12l4 6-10 13L2 9z" />
                        <path d="M12 16V10" />
                        <path d="M9 7h6" />
                    </svg>
                </div>
                <div class="card-label">Grind</div>
                <div class="card-sublabel">Resources</div>
            </div>

        </nav>
    </div>

    <script>
        // --- Canvas Particle System (Atmospheric Dust) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15; // Slow drift
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                this.life = Math.random() * 100;
                
                // Color logic: Mostly white/blue dust, occasional gold sparks
                const isGold = Math.random() > 0.92;
                const alpha = Math.random() * 0.4 + 0.1;
                
                if (isGold) {
                    this.color = `rgba(255, 215, 0, ${alpha + 0.2})`;
                    this.size = Math.random() * 2 + 1;
                    this.vx *= 1.5; // Gold moves slightly faster
                    this.vy *= 1.5;
                } else {
                    this.color = `rgba(200, 200, 255, ${alpha * 0.6})`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                
                // Twinkle effect
                this.life++;
                if(this.life > 100) {
                    this.vx = (Math.random() - 0.5) * 0.15;
                    this.vy = (Math.random() - 0.5) * 0.15;
                    this.life = 0;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        function interact(type) {
            // Placeholder for navigation logic
            console.log(`Navigate to: ${type}`);
        }
    </script>
</body>
</html>
