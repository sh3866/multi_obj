<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        /* 
           DESIGN SYSTEM & VARIABLES 
           Focusing on deep mystical atmosphere, high contrast, and "artifact" feel.
        */
        :root {
            --bg-deep: #050508;
            --bg-panel: #0a0b10;
            
            /* Colors */
            --gold-bright: #FFD700;
            --gold-dim: #8a7020;
            --gold-plate: #C5A059;
            --silver: #E0E0E0;
            --silver-dim: #7a7a85;
            
            /* Glows */
            --glow-summon: rgba(255, 215, 0, 0.6);
            --glow-secondary: rgba(200, 200, 220, 0.3);
            
            /* Typography */
            /* Request: Single high-contrast serif. Using Trajan Pro fallback stack for authentic Fantasy feel. */
            --font-main: 'Trajan Pro', 'Cinzel', 'Palatino Linotype', 'Times New Roman', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--silver);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        /* Vignette to focus center */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, transparent 0%, var(--bg-deep) 85%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 3rem;
            position: relative;
        }

        /* Request: Logo Top Left */
        .brand-logo {
            font-size: 1.4rem;
            letter-spacing: 0.3em;
            color: var(--silver);
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            font-weight: normal;
        }

        .currency-pill {
            background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(10,10,15,0.9) 20%, rgba(10,10,15,0.9) 80%, rgba(0,0,0,0) 100%);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding: 0.5rem 3rem;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .currency-pill:hover {
            border-color: var(--gold-bright);
            text-shadow: 0 0 8px var(--glow-summon);
        }

        .gold-icon {
            width: 24px;
            height: 24px;
            fill: var(--gold-bright);
            filter: drop-shadow(0 0 4px var(--gold-bright));
        }

        .currency-amount {
            font-size: 1.3rem;
            color: var(--gold-bright);
            letter-spacing: 0.1em;
            font-variant-numeric: tabular-nums;
        }

        /* --- Hero Section --- */
        .hero-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 2rem;
        }

        /* Request: Summoning Circle Visual */
        .summoning-circle-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .summoning-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                0 0 60px rgba(0,0,0,0.8),
                inset 0 0 40px rgba(0,0,0,0.9);
            background: radial-gradient(circle, rgba(20,20,30,0.4) 0%, rgba(0,0,0,0.8) 70%);
            animation: pulse-circle 8s infinite ease-in-out;
        }

        /* Decorative rings */
        .summoning-circle::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px dashed rgba(200, 200, 200, 0.1);
            transform: rotate(45deg);
            animation: spin-slow 60s linear infinite;
        }
        
        .summoning-circle::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }

        h1.game-title {
            position: relative;
            z-index: 2;
            font-size: 4.5rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin: 0;
            line-height: 1;
            color: transparent;
            /* Metallic Gradient */
            background: linear-gradient(to bottom, #ffffff 0%, #a0a0a0 40%, #ffffff 50%, #606060 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 10px 40px rgba(0,0,0,1);
            text-align: center;
        }

        .subtitle {
            position: relative;
            z-index: 2;
            margin-top: 1rem;
            font-size: 1rem;
            color: var(--silver-dim);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            /* Request: Layout Adjustment. Summon is primary, others secondary */
            grid-template-columns: 1.4fr 1fr 1fr; 
            grid-template-rows: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 3rem auto;
            padding: 0 2rem;
        }

        /* Layout Logic: 
           Row 1: Summon (Tall, Spans 2 rows) | Roster | Battle
           Row 2: (Summon continued)          | Grind  | (Empty or spacer)
        */
        .card-summon {
            grid-column: 1;
            grid-row: 1 / span 2;
        }
        .card-roster { grid-column: 2; grid-row: 1; }
        .card-battle { grid-column: 3; grid-row: 1; }
        .card-grind  { grid-column: 2 / span 2; grid-row: 2; } /* Grind spans remaining width */

        /* --- Card Design (Artifacts) --- */
        .nav-card {
            position: relative;
            height: 100%;
            min-height: 240px;
            background: linear-gradient(160deg, #12131a 0%, #08080c 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            /* Artifact shape */
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 
                0 100%
            );
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            /* Materiality */
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        /* The "Artifact" Border & Glow */
        .nav-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid var(--silver-dim);
            opacity: 0.3;
            pointer-events: none;
            transition: border-color 0.4s, opacity 0.4s;
            /* Matching the clip path for border is tricky in CSS, using inset box-shadow for inner glow instead */
        }

        .nav-card::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 2;
        }

        /* Hover State */
        .nav-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .nav-card:hover::before {
            border-color: var(--silver);
            opacity: 0.8;
        }

        /* Card Icon Styling */
        .card-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            fill: var(--silver);
            filter: drop-shadow(0 0 2px rgba(0,0,0,1));
            transition: all 0.4s;
            opacity: 0.8;
            z-index: 1;
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1);
            fill: #fff;
            opacity: 1;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
        }

        .card-title {
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 1;
        }

        .card-subtitle {
            font-size: 0.8rem;
            color: var(--silver-dim);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            z-index: 1;
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
            color: var(--silver);
        }

        /* --- Specific Card: SUMMON (Primary) --- */
        .card-summon {
            background: linear-gradient(180deg, #1a1505 0%, #050505 100%);
            border-color: rgba(212, 175, 55, 0.3);
            /* Pulsing Glow */
            animation: breathe-gold 4s infinite ease-in-out;
        }

        .card-summon .card-icon {
            fill: var(--gold-bright);
            width: 90px;
            height: 90px;
            filter: drop-shadow(0 0 15px var(--glow-summon));
        }

        .card-summon .card-title {
            color: var(--gold-bright);
            font-size: 2.2rem;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        
        .card-summon:hover {
            border-color: var(--gold-bright);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .card-summon:hover .card-icon {
            filter: drop-shadow(0 0 25px var(--gold-bright));
        }

        /* --- Specific Card: GRIND (Resource) --- */
        /* Distinct from Summon, maybe a cooler, sharper tone */
        .card-grind .card-icon {
            fill: #b0c4de; /* Light Steel Blue */
        }
        .card-grind:hover .card-icon {
            filter: drop-shadow(0 0 10px #b0c4de);
        }

        /* --- Animations --- */
        @keyframes pulse-circle {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes breathe-gold {
            0%, 100% { box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 10px rgba(212, 175, 55, 0.1); }
            50% { box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 25px rgba(212, 175, 55, 0.3); }
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto;
            }
            .card-summon {
                grid-column: 1 / span 2;
                grid-row: auto;
                min-height: 200px;
                flex-direction: row;
                justify-content: flex-start;
                padding-left: 3rem;
            }
            .card-summon .card-icon {
                width: 70px;
                height: 70px;
                margin-bottom: 0;
                margin-right: 2rem;
            }
            .card-grind {
                grid-column: 1 / span 2;
            }
            h1.game-title {
                font-size: 3rem;
            }
        }

        @media (max-width: 600px) {
            header { padding: 1.5rem; }
            .summoning-circle-container { width: 280px; height: 280px; }
            h1.game-title { font-size: 2.2rem; letter-spacing: 0.2em; }
            .nav-grid { grid-template-columns: 1fr; }
            .card-summon { grid-column: 1; flex-direction: column; padding-left: 1rem; align-items: center; }
            .card-summon .card-icon { margin-right: 0; margin-bottom: 1rem; }
            .card-grind { grid-column: 1; }
        }

        footer {
            text-align: center;
            color: var(--silver-dim);
            font-size: 0.75rem;
            padding-bottom: 1rem;
            opacity: 0.4;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <!-- Request: Logo Top Left -->
            <div class="brand-logo">Aetheria</div>

            <!-- Currency -->
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <div class="summoning-circle-container">
                <!-- Request: Summoning Circle Visual -->
                <div class="summoning-circle"></div>
                <h1 class="game-title">Spirit<br>Summoning</h1>
            </div>
            <p class="subtitle">Awaken the ancient bonds</p>
        </section>

        <nav class="nav-grid">
            
            <!-- Summon Card (Primary) -->
            <!-- Request: Flame/Portal Icon -->
            <div class="nav-card card-summon" onclick="interact('summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Portal/Flame -->
                    <path d="M12,22c4.97,0,9-4.03,9-9c0-4.97-9-13-9-13S3,8.03,3,13C3,17.97,7.03,22,12,22z M12,19.5 c-3.55,0-6.5-2.95-6.5-6.5c0-2.85,4.02-8.13,6.5-10.67c2.48,2.54,6.5,7.82,6.5,10.67C18.5,16.55,15.55,19.5,12,19.5z M12,16 c1.66,0,3-1.34,3-3c0-1.66-3-6-3-6s-3,4.34-3,6C9,14.66,10.34,16,12,16z" />
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Open the Void</div>
            </div>

            <!-- Roster Card -->
            <!-- Request: Portrait/Scroll Icon -->
            <div class="nav-card card-roster" onclick="interact('roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Portrait Frame -->
                    <path d="M4,2H20A2,2 0 0,1 22,4V20A2,2 0 0,1 20,22H4A2,2 0 0,1 2,20V4A2,2 0 0,1 4,2M4,4V20H20V4H4M12,6C14.21,6 16,7.79 16,10C16,12.21 14.21,14 12,14C9.79,14 8,12.21 8,10C8,7.79 9.79,6 12,6Z" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Spirit Collection</div>
            </div>

            <!-- Battle Card -->
            <!-- Request: Sword/Shield Icon -->
            <div class="nav-card card-battle" onclick="interact('battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Sword -->
                    <path d="M19.36,2.64L18.22,3.78L14,8L16,10L19.22,6.78L20.36,7.92C20.75,8.31 21.38,8.31 21.76,7.92L23.36,6.32C23.75,5.93 23.75,5.3 23.36,4.92L19.36,2.64M3,17.5L5.5,15L10,19.5L7.5,22L3,17.5M6,13L12,7L15,10L9,16L6,13Z" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena</div>
            </div>

            <!-- Grind Card -->
            <!-- Request: Gem/Anvil Icon -->
            <div class="nav-card card-grind" onclick="interact('grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Gem -->
                    <path d="M3,12L12,3L21,12L12,21L3,12Z M12,5.17L6.17,11L12,16.83L17.83,11L12,5.17Z" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Daily Resources</div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80;
        const connectionDistance = 120;
        const mouseDistance = 180;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                // More mystical colors
                const isGold = Math.random() > 0.85;
                this.color = isGold 
                    ? `rgba(212, 175, 55, ${Math.random() * 0.6 + 0.2})`
                    : `rgba(180, 180, 220, ${Math.random() * 0.4 + 0.1})`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction (Subtle repulsion)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        // Gentle push
                        this.vx -= forceDirectionX * force * 0.05;
                        this.vy -= forceDirectionY * force * 0.05;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw subtle connecting lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(100, 100, 150, ${opacity * 0.1})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Visual ripple/press effect
            card.style.transform = "scale(0.98)";
            setTimeout(() => {
                card.style.transform = "";
            }, 150);
        }
    </script>
</body>
</html>
