<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning - Hub</title>
    <style>
        :root {
            /* Palette: Deep Void & Ethereal Gold */
            --bg-deep: #050508;
            --bg-void-center: #1a1a2e;
            --bg-void-edge: #000000;
            
            --gold-bright: #FFD700;
            --gold-dim: #B8860B;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --gold-text: #FFF8DC;

            --text-main: #F0F0F5;
            --text-muted: #A0A0B0;
            
            /* Glassmorphism */
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            
            /* Typography */
            --font-stack: 'Cinzel', 'Times New Roman', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- 1. Hero Area & Atmosphere --- */
        
        /* Canvas for particles */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Noise Texture Overlay (SVG Data URI) */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        /* Deep Radial Gradient - The Void */
        .void-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Centered behind the title area */
            background: radial-gradient(circle at 50% 35%, #2a2a45 0%, #0f0f1a 50%, #000000 100%);
            z-index: 0;
        }

        /* --- UI Container --- */
        .ui-container {
            position: relative;
            z-index: 10;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Header --- */
        header {
            position: absolute;
            top: 2rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.2s forwards;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- 4. Typography & Currency Polish --- */
        .currency-pill {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold-dim);
            border-radius: 50px; /* Pill shape */
            padding: 0.4rem 1.5rem 0.4rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.2);
            transition: transform 0.2s ease;
        }
        
        .currency-pill:hover {
            transform: scale(1.05);
            border-color: var(--gold-bright);
        }

        .currency-icon {
            width: 24px;
            height: 24px;
            fill: var(--gold-bright);
            filter: drop-shadow(0 0 4px var(--gold-bright));
        }

        .currency-val {
            font-size: 1.1rem;
            color: var(--gold-text);
            font-weight: 600;
            letter-spacing: 0.05em;
            font-family: sans-serif; /* Numbers usually look cleaner in sans */
        }

        /* --- Hero Section --- */
        .hero {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
            opacity: 0;
            animation: fadeIn 1.2s ease-out 0.4s forwards;
        }

        h1.game-title {
            font-size: 4.5rem; /* Massive */
            line-height: 1.1;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 0;
            color: #fff;
            /* Cinematic shadow */
            text-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 60px rgba(100,100,255,0.2);
        }

        /* 4. Subtitle Polish */
        .subtitle {
            font-size: 1.4rem; /* Increased size */
            color: var(--text-muted);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 1rem;
            font-weight: 600;
            opacity: 0.8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- 2. Menu Grid (Hierarchy) --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            opacity: 0;
            animation: slideUp 1s ease-out 0.6s forwards;
        }

        /* --- 3. Secondary Cards (Glassmorphism System) --- */
        .menu-card {
            position: relative;
            height: 280px;
            width: 100%;
            
            /* Glass Base */
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.4) 100%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 8px;
            
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        /* Inner Glow on Hover */
        .menu-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 20px rgba(255,255,255,0);
            transition: box-shadow 0.4s ease;
            pointer-events: none;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.6) 100%);
        }

        .menu-card:hover::after {
            box-shadow: inset 0 0 25px rgba(255,255,255,0.1);
        }

        /* Icons */
        .card-icon-wrap {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            stroke: var(--text-main);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: all 0.4s ease;
        }

        .menu-card:hover .card-icon {
            stroke: #fff;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
            transform: scale(1.1);
        }

        .card-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .card-sublabel {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-family: sans-serif;
        }

        /* --- 2. Elevated Summon Card (Artifact Style) --- */
        .menu-card.summon {
            /* Grid Span to be larger */
            grid-column: span 2;
            grid-row: span 2;
            
            /* Artifact Styling */
            background: linear-gradient(135deg, rgba(40, 30, 0, 0.8) 0%, rgba(10, 8, 0, 0.9) 100%);
            border: 2px solid var(--gold-dim);
            box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 15px rgba(184, 134, 11, 0.15);
            border-radius: 12px;
            position: relative;
        }

        /* Decorative Corners for Artifact */
        .menu-card.summon::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            pointer-events: none;
            border-radius: 6px;
            transition: border-color 0.4s ease;
        }

        .menu-card.summon:hover {
            transform: translateY(-10px) scale(1.01);
            border-color: var(--gold-bright);
            box-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 30px var(--gold-glow);
        }

        .menu-card.summon:hover::before {
            border-color: var(--gold-bright);
        }

        .menu-card.summon .card-icon-wrap {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            margin-bottom: 2rem;
        }

        .menu-card.summon .card-icon {
            width: 60px;
            height: 60px;
            stroke: var(--gold-bright);
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }

        .menu-card.summon .card-label {
            font-size: 1.8rem;
            color: var(--gold-bright);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .menu-card.summon .card-sublabel {
            color: #D4AF37;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive --- */
        @media (max-width: 1000px) {
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            /* Summon takes full width on tablet */
            .menu-card.summon {
                grid-column: span 2;
                grid-row: span 1;
                height: 250px;
                flex-direction: row;
                justify-content: flex-start;
                padding-left: 3rem;
            }
            .menu-card.summon .card-icon-wrap {
                margin-bottom: 0;
                margin-right: 2rem;
            }
            h1.game-title { font-size: 3rem; }
        }

        @media (max-width: 600px) {
            .ui-container { padding: 1rem; justify-content: flex-start; padding-top: 5rem; }
            header { top: 1rem; padding: 0; }
            .hero { margin-bottom: 2rem; }
            
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .menu-card {
                height: 80px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 1.5rem;
            }
            
            .menu-card.summon {
                grid-column: span 1;
                height: 100px; /* Slightly taller on mobile */
                flex-direction: row;
                padding-left: 1.5rem;
            }

            .card-icon-wrap {
                width: 40px; height: 40px;
                margin-bottom: 0; margin-right: 1.2rem;
                border: none; background: transparent;
            }
            
            .menu-card.summon .card-icon-wrap {
                width: 50px; height: 50px;
                border: 1px solid rgba(255, 215, 0, 0.3);
            }

            .card-icon { width: 24px; height: 24px; }
            .menu-card.summon .card-icon { width: 32px; height: 32px; }
            
            .card-sublabel { display: none; }
            
            h1.game-title { font-size: 2.2rem; letter-spacing: 0.05em; }
            .subtitle { font-size: 1rem; letter-spacing: 0.2em; }
        }
    </style>
</head>
<body>

    <!-- Backgrounds -->
    <div class="void-gradient"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>

    <div class="ui-container">
        <header>
            <div class="logo">
                <!-- Simple Geometric Logo Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
                Aetheria
            </div>
            <div class="currency-pill">
                <svg class="currency-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none" />
                    <path d="M12 7v10M9 10l6 4M9 14l6-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="currency-val">12,450</span>
            </div>
        </header>

        <section class="hero">
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Awaken the Ancient Bonds</p>
        </section>

        <nav class="menu-grid">
            
            <!-- 1. Summon (Primary - Artifact) -->
            <div class="menu-card summon" onclick="interact('summon')">
                <div class="card-icon-wrap">
                    <!-- Flame/Rune Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2c0 0-7 7.5-7 13s3.5 7 7 7 7-2 7-7-7-13-7-13z" />
                        <path d="M12 18c-2 0-3.5-1.5-3.5-4s1.5-5 3.5-5 3.5 3 3.5 5-1.5 4-3.5 4z" />
                    </svg>
                </div>
                <div class="card-label">Summon</div>
                <div class="card-sublabel">Open the Void</div>
            </div>

            <!-- 2. Roster (Secondary - Glass) -->
            <div class="menu-card" onclick="interact('roster')">
                <div class="card-icon-wrap">
                    <!-- Scroll/Book Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16v16H4z" />
                        <path d="M4 4l8 4 8-4" />
                        <path d="M12 8v12" />
                    </svg>
                </div>
                <div class="card-label">Roster</div>
                <div class="card-sublabel">Collection</div>
            </div>

            <!-- 3. Battle (Secondary - Glass) -->
            <div class="menu-card" onclick="interact('battle')">
                <div class="card-icon-wrap">
                    <!-- Crossed Swords Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                        <path d="M13 19l6-6" />
                        <path d="M16 16l4 4" />
                        <path d="M19 21l2-2" />
                        <path d="M10.5 6.5L22 18v3h-3L10.5 9.5" />
                    </svg>
                </div>
                <div class="card-label">Battle</div>
                <div class="card-sublabel">Arena</div>
            </div>

            <!-- 4. Grind (Secondary - Glass) -->
            <div class="menu-card" onclick="interact('grind')">
                <div class="card-icon-wrap">
                    <!-- Resource/Gem Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6 3h12l4 6-10 13L2 9z" />
                        <path d="M12 16V10" />
                        <path d="M9 7h6" />
                    </svg>
                </div>
                <div class="card-label">Grind</div>
                <div class="card-sublabel">Resources</div>
            </div>

        </nav>
    </div>

    <script>
        // --- Canvas Particle System (Atmospheric Dust) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2; // Drift speed
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                this.life = Math.random() * 100;
                
                // Color logic: Mostly white/blue dust, occasional gold sparks
                const isGold = Math.random() > 0.95;
                const alpha = Math.random() * 0.5 + 0.1;
                
                if (isGold) {
                    this.color = `rgba(255, 215, 0, ${alpha})`;
                    this.size = Math.random() * 2 + 1;
                } else {
                    this.color = `rgba(200, 200, 255, ${alpha * 0.6})`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around screen
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                
                // Twinkle effect
                this.life++;
                if(this.life > 100) {
                    this.vx = (Math.random() - 0.5) * 0.2;
                    this.vy = (Math.random() - 0.5) * 0.2;
                    this.life = 0;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        function interact(type) {
            // Placeholder for navigation logic
            console.log(`Navigate to: ${type}`);
        }
    </script>
</body>
</html>
