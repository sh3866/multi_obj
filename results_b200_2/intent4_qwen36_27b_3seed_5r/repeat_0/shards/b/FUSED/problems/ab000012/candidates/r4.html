<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette - Deep Mystical */
            --bg-deep: #020204;
            --bg-void: #000000;
            
            --gold-primary: #ffd700;
            --gold-dim: #8a6d1c;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --gold-ethereal: rgba(255, 230, 150, 0.1);
            
            --silver-primary: #e0e5ec;
            
            --magic-purple: #b066ff;
            --magic-blue: #5d9eff;
            
            --text-main: #f0f0f5;
            --text-muted: #9a9ab0;
            
            /* Typography */
            --font-display: "Trajan Pro", "Cinzel", "Palatino Linotype", "Book Antiqua", "Palatino", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Radial Gradient Overlay for "Hero" Focus */
        .hero-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 25%, rgba(20, 30, 60, 0.6) 0%, rgba(2, 2, 4, 0.95) 60%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 1rem;
        }

        /* Ornate Currency Indicator */
        .currency-indicator {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            padding: 10px 24px 10px 12px;
            border-radius: 50px;
            background: rgba(10, 12, 18, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255, 215, 0, 0.05);
            transition: all 0.3s ease;
            cursor: default;
        }

        .currency-indicator::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,215,0,0.5), transparent 40%, transparent 60%, rgba(255,215,0,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .gem-stack {
            position: relative;
            width: 28px;
            height: 28px;
            animation: pulse-gem 3s infinite ease-in-out;
        }
        
        .gem-stack svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 8px var(--gold-glow));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--gold-primary);
            letter-spacing: 0.05em;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        @keyframes pulse-gem {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            position: relative;
            margin-top: 2vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            margin-bottom: 1rem;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #fff;
            /* Metallic Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 50%, #8a8a9a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* Complex Glow */
            filter: drop-shadow(0 0 40px rgba(100, 150, 255, 0.3));
            margin-bottom: 0.5rem;
            position: relative;
            line-height: 0.9;
        }

        /* Extra text shadow trick for non-transparent text layers if needed, but clip-text handles it mostly */
        h1.game-title::after {
            content: "AETHERIA";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-top: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            position: relative;
            z-index: 2;
            opacity: 0.8;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 1fr; /* Summon is wider */
            grid-template-rows: 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            margin-bottom: 2rem;
            height: 380px;
        }

        /* --- Card Design (Glassmorphism & Metal) --- */
        .nav-card {
            position: relative;
            height: 100%;
            /* Glass Base */
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            
            /* Metallic Borders */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 3rem;
            
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Ambient Card Glow (Background) */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }

        /* Bottom Fade for Text Legibility */
        .nav-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Hover Interactions */
        .nav-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .nav-card:hover::before {
            opacity: 1;
        }

        .nav-card:hover .card-icon {
            transform: scale(1.15) translateY(-8px);
            filter: drop-shadow(0 0 20px currentColor);
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* Card Content Layout */
        .card-content {
            z-index: 5;
            text-align: center;
            width: 100%;
            position: relative;
        }

        .card-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Default color */
            fill: var(--silver-primary);
            color: var(--silver-primary); 
        }

        .card-title {
            font-family: var(--font-display); 
            font-size: 1.8rem;
            color: #fff;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 0.2rem;
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            color: var(--text-muted);
        }

        /* --- Specific Card Accents --- */
        
        /* Summon (Primary CTA) */
        .card-summon {
            /* More vibrant background */
            background: linear-gradient(160deg, rgba(60, 40, 0, 0.3) 0%, rgba(20, 15, 10, 0.6) 100%);
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 30px rgba(255, 215, 0, 0.05);
        }
        
        /* Summon Inner Glow */
        .card-summon::before {
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.15) 0%, transparent 60%);
        }

        .card-summon .card-icon {
            fill: var(--gold-primary);
            color: var(--gold-primary);
            /* Custom pulsing animation for primary action */
            animation: float 4s ease-in-out infinite;
        }
        
        .card-summon:hover {
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 215, 0, 0.15);
        }
        .card-summon:hover .card-subtitle { color: var(--gold-primary); }

        /* Roster (Silver/Blue) */
        .card-roster .card-icon {
            fill: #a0c4ff;
            color: #a0c4ff;
        }
        .card-roster:hover { border-color: rgba(160, 196, 255, 0.3); }
        .card-roster:hover .card-subtitle { color: #a0c4ff; }

        /* Battle (Deep Red/Crimson) */
        .card-battle .card-icon {
            fill: #ff6b6b;
            color: #ff6b6b;
        }
        .card-battle:hover { border-color: rgba(255, 107, 107, 0.3); }
        .card-battle:hover .card-subtitle { color: #ff6b6b; }

        /* Grind (Ethereal Green/Teal) */
        .card-grind .card-icon {
            fill: #64ffda;
            color: #64ffda;
        }
        .card-grind:hover { border-color: rgba(100, 255, 218, 0.3); }
        .card-grind:hover .card-subtitle { color: #64ffda; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            padding-bottom: 1rem;
            opacity: 0.5;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- Responsive --- */
        @media (max-width: 1024px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                height: auto;
            }
            .card-summon {
                grid-column: span 2;
                height: 250px;
            }
            h1.game-title { font-size: 4rem; }
        }

        @media (max-width: 600px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            .card-summon { grid-column: span 1; height: 220px; }
            .nav-card { height: 200px; }
            h1.game-title { font-size: 3rem; letter-spacing: 0.1em; }
            .ui-layer { padding: 1.5rem 1rem; }
            .hero-section { margin-top: 5vh; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fefcd7;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </svg>

    <!-- Background Canvas -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Radial Glow Anchor -->
    <div class="hero-glow"></div>

    <div class="ui-layer">
        
        <!-- HEADER -->
        <header>
            <div class="currency-indicator">
                <div class="gem-stack">
                    <!-- Gem Icon -->
                    <svg viewBox="0 0 24 24" fill="url(#goldGradient)">
                        <path d="M12,2L2,12L12,22L22,12L12,2Z" />
                        <path d="M12,4L17,12L12,20L7,12L12,4Z" fill="#FFF" opacity="0.4"/>
                        <path d="M12,2L12,22" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                        <path d="M2,12L22,12" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                    </svg>
                </div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- HERO -->
        <section class="hero-section">
            <h1 class="game-title">Aetheria</h1>
            <p class="subtitle">Awaken the ancient bonds</p>
        </section>

        <!-- NAVIGATION -->
        <nav class="nav-grid">
            
            <!-- Summon (Primary) -->
            <div class="nav-card card-summon" onclick="interact(this)">
                <div class="card-content">
                    <!-- Intricate Rune Icon -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="iconGradSum" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" stroke="url(#iconGradSum)" stroke-width="2" fill="none" stroke-dasharray="10 5" opacity="0.5"/>
                        <path d="M50,15 L65,35 L85,35 L70,55 L75,80 L50,65 L25,80 L30,55 L15,35 L35,35 Z" fill="url(#iconGradSum)" filter="url(#glow)"/>
                        <circle cx="50" cy="50" r="10" fill="#000" opacity="0.3"/>
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster -->
            <div class="nav-card card-roster" onclick="interact(this)">
                <div class="card-content">
                    <!-- Shield Icon -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <path d="M50,10 L85,25 V50 C85,75 65,95 50,95 C35,95 15,75 15,50 V25 L50,10 Z" fill="none" stroke="#a0c4ff" stroke-width="3" filter="url(#glow)"/>
                        <path d="M50,20 L75,32 V50 C75,70 60,85 50,85 C40,85 25,70 25,50 V32 L50,20 Z" fill="rgba(160, 196, 255, 0.2)"/>
                        <circle cx="50" cy="55" r="12" fill="#a0c4ff" opacity="0.8"/>
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle -->
            <div class="nav-card card-battle" onclick="interact(this)">
                <div class="card-content">
                    <!-- Sword Icon -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <path d="M30,80 L80,30 M70,20 L80,30 L70,40 L60,30 Z M30,80 L20,70 L30,80 L40,70 Z" stroke="#ff6b6b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
                        <path d="M35,75 L65,45" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="2 2"/>
                        <circle cx="50" cy="50" r="25" stroke="#ff6b6b" stroke-width="1" fill="none" opacity="0.3"/>
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind -->
            <div class="nav-card card-grind" onclick="interact(this)">
                <div class="card-content">
                    <!-- Anvil/Hammer Icon -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <path d="M20,60 L80,60 L85,80 L15,80 Z" fill="#64ffda" opacity="0.2" stroke="#64ffda" stroke-width="2"/>
                        <path d="M45,60 V40 L25,20 L35,10 L55,30 V40 L65,30 L75,20 L85,30 L75,40 V60" fill="none" stroke="#64ffda" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
                        <path d="M20,70 L80,70" stroke="#64ffda" stroke-width="2" opacity="0.5"/>
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; System Ready
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Mystical Mist & Dust) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80;
        
        // Mouse tracking for interaction
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                // Randomize initial Y so they don't all start at bottom
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.speed = Math.random() * 0.4 + 0.1;
                this.size = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.drift = (Math.random() - 0.5) * 0.2; // Slower drift
                
                // Ethereal Palette
                const r = Math.random();
                if (r > 0.9) {
                    // Gold dust
                    this.color = `rgba(255, 215, 0, ${this.opacity})`;
                } else if (r > 0.75) {
                    // Purple mist
                    this.color = `rgba(157, 78, 221, ${this.opacity * 0.6})`;
                } else {
                    // Blue/White star dust
                    this.color = `rgba(200, 220, 255, ${this.opacity})`;
                }
            }

            update() {
                this.y -= this.speed;
                this.x += this.drift;

                // Wrap around
                if (this.y < -10) {
                    this.reset();
                }
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;

                // Subtle Mouse Interaction (Repulsion)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        const force = (150 - distance) / 150;
                        this.x -= dx * force * 0.03;
                        this.y -= dy * force * 0.03;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(card) {
            // Quick press animation
            card.style.transform = "scale(0.97)";
            card.style.filter = "brightness(1.3)";
            
            // Reset after short delay
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
