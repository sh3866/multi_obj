<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette - Refined Mystical */
            --bg-deep: #050508;
            --bg-void: #000000;
            
            --gold-primary: #ffd700;
            --gold-highlight: #fff4cc;
            --gold-dim: #8a6d1c;
            --gold-glow: rgba(255, 215, 0, 0.8);
            
            --silver-primary: #e0e5ec;
            --text-main: #ffffff;
            --text-muted: #8f90a6;
            
            --card-glass: rgba(20, 20, 25, 0.65);
            --card-border: rgba(255, 255, 255, 0.15);
            
            /* Typography */
            --font-display: "Trajan Pro", "Cinzel", "Palatino Linotype", "Book Antiqua", "Palatino", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background Layers --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }

        /* Critique 1: Mandala / Magic Circle */
        .magic-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%); /* Shift up slightly to sit behind title */
            width: 600px;
            height: 600px;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
            animation: rotateCircle 120s linear infinite;
        }

        .magic-circle svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #fff;
            stroke-width: 1;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }

        @keyframes rotateCircle {
            from { transform: translate(-50%, -60%) rotate(0deg); }
            to { transform: translate(-50%, -60%) rotate(360deg); }
        }

        /* Fog Overlay at bottom */
        .fog-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, var(--bg-deep) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Radial Gradient Overlay for "Hero" Focus */
        .hero-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(40, 50, 90, 0.4) 0%, rgba(5, 5, 8, 0.9) 60%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 1rem;
        }

        /* Critique 3: Strengthened Currency */
        .currency-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            padding: 12px 28px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
            cursor: default;
        }

        .gem-stack {
            position: relative;
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 5px var(--gold-glow));
        }
        
        .gem-stack svg {
            width: 100%;
            height: 100%;
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.4rem; /* Increased size */
            color: var(--gold-highlight);
            letter-spacing: 0.05em;
            font-weight: 700; /* Bolder */
            text-shadow: 0 0 10px var(--gold-glow); /* Soft gold glow */
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            position: relative;
            margin-top: -2vh; /* Pull up to overlap magic circle */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* Critique 3: Typography & Hierarchy */
        h1.game-title {
            font-family: var(--font-display);
            font-size: 6.5rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #fff;
            /* Metallic Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 40%, #8a8a9a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* Complex Glow */
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 1)) drop-shadow(0 0 30px rgba(100, 150, 255, 0.2));
            margin-bottom: 0.2rem;
            line-height: 1;
            position: relative;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-top: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            position: relative;
            z-index: 2;
            opacity: 0.8;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 1fr; /* Summon is wider */
            grid-template-rows: 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            margin-bottom: 2rem;
            height: 400px;
        }

        /* --- Card Design (Glassmorphism & Craft) --- */
        .nav-card {
            position: relative;
            height: 100%;
            
            /* Glass Base */
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* Visible Border (Critique 2) */
            border: 1px solid var(--card-border);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1px solid rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 3rem;
            
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        /* Ambient Card Glow (Background) */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }

        /* Bottom Fade for Text Legibility */
        .nav-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Hover Interactions */
        .nav-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .nav-card:hover::before {
            opacity: 1;
        }

        .nav-card:hover .card-icon {
            transform: scale(1.15) translateY(-8px);
            filter: drop-shadow(0 0 25px currentColor);
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* Card Content Layout */
        .card-content {
            z-index: 5;
            text-align: center;
            width: 100%;
            position: relative;
        }

        .card-icon {
            width: 90px;
            height: 90px;
            margin-bottom: 1.5rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Default color */
            fill: var(--silver-primary);
            color: var(--silver-primary); 
        }

        /* Critique 3: Stronger Typography */
        .card-title {
            font-family: var(--font-display); 
            font-size: 2rem;
            font-weight: 700; /* Bolder */
            color: #fff;
            letter-spacing: 0.1em;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            margin-bottom: 0.2rem;
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            color: var(--text-muted);
        }

        /* --- Specific Card Accents --- */
        
        /* Critique 4: Polish Summon State */
        .card-summon {
            /* Stronger Gradient */
            background: linear-gradient(160deg, rgba(80, 60, 10, 0.5) 0%, rgba(20, 15, 5, 0.8) 100%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 30px rgba(255, 215, 0, 0.1);
        }
        
        /* Summon Inner Glow */
        .card-summon::before {
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.2) 0%, transparent 60%);
        }

        .card-summon .card-icon {
            fill: var(--gold-primary);
            color: var(--gold-primary);
            /* Custom pulsing animation for primary action */
            animation: float 4s ease-in-out infinite;
        }
        
        .card-summon:hover {
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(255, 215, 0, 0.2);
        }
        .card-summon:hover .card-subtitle { color: var(--gold-primary); }

        /* Roster (Silver/Blue) */
        .card-roster .card-icon {
            fill: #a0c4ff;
            color: #a0c4ff;
        }
        .card-roster:hover { border-color: rgba(160, 196, 255, 0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(160, 196, 255, 0.1); }
        .card-roster:hover .card-subtitle { color: #a0c4ff; }

        /* Battle (Deep Red/Crimson) */
        .card-battle .card-icon {
            fill: #ff6b6b;
            color: #ff6b6b;
        }
        .card-battle:hover { border-color: rgba(255, 107, 107, 0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(255, 107, 107, 0.1); }
        .card-battle:hover .card-subtitle { color: #ff6b6b; }

        /* Grind (Ethereal Green/Teal) */
        .card-grind .card-icon {
            fill: #64ffda;
            color: #64ffda;
        }
        .card-grind:hover { border-color: rgba(100, 255, 218, 0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(100, 255, 218, 0.1); }
        .card-grind:hover .card-subtitle { color: #64ffda; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            padding-bottom: 1rem;
            opacity: 0.6;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- Responsive --- */
        @media (max-width: 1024px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                height: auto;
            }
            .card-summon {
                grid-column: span 2;
                height: 250px;
            }
            h1.game-title { font-size: 4rem; }
            .magic-circle { width: 400px; height: 400px; }
        }

        @media (max-width: 600px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            .card-summon { grid-column: span 1; height: 220px; }
            .nav-card { height: 200px; }
            h1.game-title { font-size: 3rem; letter-spacing: 0.1em; }
            .ui-layer { padding: 1.5rem 1rem; }
            .hero-section { margin-top: 2vh; }
            .magic-circle { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fefcd7;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </svg>

    <!-- Background Canvas -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Critique 1: Magic Circle -->
    <div class="magic-circle">
        <svg viewBox="0 0 100 100">
            <!-- Geometric Mandala Pattern -->
            <circle cx="50" cy="50" r="48" stroke-dasharray="2 4" />
            <circle cx="50" cy="50" r="40" stroke-dasharray="10 5" />
            <path d="M50,2 L50,98 M2,50 L98,50 M18,18 L82,82 M18,82 L82,18" stroke-width="0.5" />
            <path d="M50,15 L85,50 L50,85 L15,50 Z" stroke-width="0.5" />
            <path d="M50,25 L75,50 L50,75 L25,50 Z" stroke-width="1" />
        </svg>
    </div>

    <!-- Fog Overlay -->
    <div class="fog-overlay"></div>
    
    <!-- Radial Glow Anchor -->
    <div class="hero-glow"></div>

    <div class="ui-layer">
        
        <!-- HEADER -->
        <header>
            <div class="currency-indicator">
                <div class="gem-stack">
                    <!-- Gem Icon -->
                    <svg viewBox="0 0 24 24" fill="url(#goldGradient)">
                        <path d="M12,2L2,12L12,22L22,12L12,2Z" />
                        <path d="M12,4L17,12L12,20L7,12L12,4Z" fill="#FFF" opacity="0.4"/>
                        <path d="M12,2L12,22" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                        <path d="M2,12L22,12" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                    </svg>
                </div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- HERO -->
        <section class="hero-section">
            <h1 class="game-title">Aetheria</h1>
            <p class="subtitle">Awaken the ancient bonds</p>
        </section>

        <!-- NAVIGATION -->
        <nav class="nav-grid">
            
            <!-- Summon (Primary) -->
            <div class="nav-card card-summon" onclick="interact(this)">
                <div class="card-content">
                    <!-- Critique 2: Bold Sigil Icon -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="iconGradSum" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Outer Ring -->
                        <circle cx="50" cy="50" r="45" stroke="url(#iconGradSum)" stroke-width="3" fill="none" stroke-dasharray="12 6" opacity="0.8"/>
                        <!-- Inner Star/Sigil -->
                        <path d="M50,15 L65,35 L85,35 L70,55 L75,80 L50,65 L25,80 L30,55 L15,35 L35,35 Z" fill="url(#iconGradSum)" filter="url(#glow)"/>
                        <!-- Center Eye/Core -->
                        <circle cx="50" cy="50" r="8" fill="#000" opacity="0.6"/>
                        <circle cx="50" cy="50" r="4" fill="#fff" filter="url(#glow)"/>
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster -->
            <div class="nav-card card-roster" onclick="interact(this)">
                <div class="card-content">
                    <!-- Critique 2: Bolder Shield -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <path d="M50,10 L85,25 V50 C85,75 65,95 50,95 C35,95 15,75 15,50 V25 L50,10 Z" fill="none" stroke="#a0c4ff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
                        <path d="M50,20 L75,32 V50 C75,70 60,85 50,85 C40,85 25,70 25,50 V32 L50,20 Z" fill="rgba(160, 196, 255, 0.15)" stroke="none"/>
                        <path d="M50,40 L50,70 M35,55 L65,55" stroke="#a0c4ff" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle -->
            <div class="nav-card card-battle" onclick="interact(this)">
                <div class="card-content">
                    <!-- Critique 2: Sharper Sword -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <g transform="rotate(45 50 50)">
                            <!-- Blade -->
                            <path d="M50,10 L55,50 L70,65 L50,90 L30,65 L45,50 Z" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
                            <path d="M50,10 L50,90" stroke="#fff" stroke-width="1" opacity="0.5"/>
                            <!-- Hilt -->
                            <path d="M25,65 L75,65" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
                            <circle cx="50" cy="75" r="5" fill="#ff6b6b"/>
                        </g>
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind -->
            <div class="nav-card card-grind" onclick="interact(this)">
                <div class="card-content">
                    <!-- Critique 2: Anvil Icon -->
                    <svg class="card-icon" viewBox="0 0 100 100">
                        <!-- Anvil Base -->
                        <path d="M20,65 L80,65 L85,85 L15,85 Z" fill="#64ffda" opacity="0.3" stroke="#64ffda" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M30,65 L70,65 L75,85 L25,85 Z" fill="#64ffda" opacity="0.1"/>
                        <!-- Hammer Head -->
                        <rect x="40" y="20" width="20" height="10" fill="#64ffda" rx="2" filter="url(#glow)"/>
                        <!-- Handle -->
                        <rect x="48" y="30" width="4" height="40" fill="#64ffda" rx="1"/>
                        <!-- Sparks -->
                        <path d="M65,40 L75,30 M60,50 L70,55" stroke="#fff" stroke-width="1" opacity="0.6"/>
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; System Ready
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Mystical Mist & Dust) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 100;
        
        // Mouse tracking for interaction
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                // Randomize initial Y so they don't all start at bottom
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.speed = Math.random() * 0.5 + 0.1;
                this.size = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.drift = (Math.random() - 0.5) * 0.2; // Slower drift
                
                // Ethereal Palette
                const r = Math.random();
                if (r > 0.9) {
                    // Gold dust
                    this.color = `rgba(255, 215, 0, ${this.opacity})`;
                } else if (r > 0.75) {
                    // Purple mist
                    this.color = `rgba(157, 78, 221, ${this.opacity * 0.6})`;
                } else {
                    // Blue/White star dust
                    this.color = `rgba(200, 220, 255, ${this.opacity})`;
                }
            }

            update() {
                this.y -= this.speed;
                this.x += this.drift;

                // Wrap around
                if (this.y < -10) {
                    this.reset();
                }
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;

                // Subtle Mouse Interaction (Repulsion)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        const force = (150 - distance) / 150;
                        this.x -= dx * force * 0.03;
                        this.y -= dy * force * 0.03;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(card) {
            // Quick press animation
            card.style.transform = "scale(0.97)";
            card.style.filter = "brightness(1.3)";
            
            // Reset after short delay
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
