<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: rgba(20, 25, 40, 0.65);
            --bg-panel-hover: rgba(30, 35, 55, 0.85);
            
            /* Palette */
            --gold-primary: #ffd700;
            --gold-dim: #8a7020;
            --gold-glow: rgba(255, 215, 0, 0.6);
            
            --magic-blue: #4da6ff;
            --magic-purple: #9d4dff;
            
            --text-main: #e8e8f0;
            --text-muted: #8888a0;
            
            /* Typography */
            --font-display: "Georgia", "Times New Roman", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Deep atmospheric fog/vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(5,5,8,0) 0%, rgba(5,5,8,0.8) 60%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        /* Small Logo Mark */
        .logo-mark {
            font-family: var(--font-display);
            font-weight: bold;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 4px;
        }

        .currency-pill {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--gold-dim);
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Shine effect on currency */
        .currency-pill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 4s infinite;
        }

        .currency-pill:hover {
            border-color: var(--gold-primary);
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .gold-icon {
            width: 22px;
            height: 22px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 5px var(--gold-glow));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--gold-primary);
            letter-spacing: 1px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            position: relative;
            margin-top: 2vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Visual Anchor: Summoning Circle */
        .summoning-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 60px rgba(157, 77, 255, 0.1), inset 0 0 40px rgba(157, 77, 255, 0.05);
            pointer-events: none;
            z-index: -1;
            animation: pulse-circle 6s infinite ease-in-out;
        }

        .summoning-circle::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            bottom: 10%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            animation: rotate 20s linear infinite;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: transparent;
            /* Metallic Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #a0a0b0 40%, #505060 100%);
            -webkit-background-clip: text;
            background-clip: text;
            /* Glow behind text */
            filter: drop-shadow(0 0 15px rgba(157, 77, 255, 0.3));
            margin-bottom: 0.5rem;
            position: relative;
            line-height: 1;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr; /* Summon is slightly wider */
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            margin-bottom: 2rem;
        }

        /* --- Card Design (Game UI) --- */
        .nav-card {
            position: relative;
            height: 260px;
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 2.5rem;
            
            /* Glassmorphism */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Noise Texture Overlay (CSS Pattern) */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Bottom Gradient Fade */
        .nav-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Hover States */
        .nav-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            background: var(--bg-panel-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .nav-card:hover .card-icon {
            transform: scale(1.15) translateY(-5px);
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- PRIMARY CARD (Summon) Specifics --- */
        .card-summon {
            border: 1px solid var(--gold-dim);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .card-summon:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 30px var(--gold-glow), 0 20px 40px rgba(0,0,0,0.7);
        }
        
        .card-summon .card-icon {
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }

        /* --- Secondary Cards --- */
        .card-roster .card-icon { fill: var(--magic-blue); }
        .card-battle .card-icon { fill: #ff4d4d; }
        .card-grind .card-icon { fill: #5eff84; }

        .nav-card:hover .card-icon {
            /* Inherit hover color logic */
        }
        .card-roster:hover .card-icon { filter: drop-shadow(0 0 15px rgba(77, 166, 255, 0.6)); }
        .card-battle:hover .card-icon { filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.6)); }
        .card-grind:hover .card-icon { filter: drop-shadow(0 0 15px rgba(94, 255, 132, 0.6)); }


        /* Card Content Layout */
        .card-content {
            z-index: 5;
            text-align: center;
            width: 100%;
            position: relative;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            margin-bottom: 1.2rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 0.2rem;
        }

        .card-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s ease;
        }

        /* Subtitle Colors */
        .card-summon .card-subtitle { color: var(--gold-primary); }
        .card-roster .card-subtitle { color: var(--magic-blue); }
        .card-battle .card-subtitle { color: #ff4d4d; }
        .card-grind .card-subtitle { color: #5eff84; }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding-bottom: 1rem;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        /* --- Animations --- */
        @keyframes pulse-circle {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .card-summon {
                grid-column: span 2; /* Summon spans full width on tablet */
                height: 200px;
            }
            h1.game-title { font-size: 3.5rem; }
            .summoning-circle { width: 300px; height: 300px; }
        }

        @media (max-width: 600px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            .card-summon { grid-column: span 1; height: 180px; }
            h1.game-title { font-size: 2.5rem; }
            .summoning-circle { width: 250px; height: 250px; }
            .ui-layer { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <!-- Decoration / Logo -->
            <div class="logo-mark">Aetheria</div>

            <!-- Currency -->
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <!-- Gold Coin Icon -->
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <!-- Visual Anchor -->
            <div class="summoning-circle"></div>
            
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Awaken the ancient bonds</p>
        </section>

        <nav class="nav-grid">
            
            <!-- Summon Card (Primary) -->
            <div class="nav-card card-summon" onclick="interact('summon')">
                <!-- Background Gradient -->
                <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.15), transparent 70%); z-index:0;"></div>
                
                <div class="card-content">
                    <!-- Crystal/Star Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L9.2,8.6L2,9.2L7.5,14L5.8,21L12,17.2L18.2,21L16.5,14L22,9.2L14.8,8.6L12,2Z" />
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="nav-card card-roster" onclick="interact('roster')">
                <!-- Background Gradient -->
                <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at 50% 30%, rgba(77, 166, 255, 0.15), transparent 70%); z-index:0;"></div>

                <div class="card-content">
                    <!-- Scroll/List Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4,2H20A2,2 0 0,1 22,4V20A2,2 0 0,1 20,22H4A2,2 0 0,1 2,20V4A2,2 0 0,1 4,2M4,4V20H20V4H4M6,6H18V8H6V6M6,10H18V12H6V10M6,14H14V16H6V14Z" />
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="nav-card card-battle" onclick="interact('battle')">
                <!-- Background Gradient -->
                <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at 50% 30%, rgba(255, 77, 77, 0.15), transparent 70%); z-index:0;"></div>

                <div class="card-content">
                    <!-- Sword/Clash Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M19.5,3.5L17,6L18,7L20.5,4.5C20.9,4.1 21.4,4.6 21,5L19.5,6.5L22,9L19,12L16,9L14.5,10.5C14.1,10.9 13.6,10.4 14,10L16.5,7.5L15,6.5L12.5,9L10,11.5L7.5,14L5,16.5L2,20L6,22L9.5,19L12,16.5L14.5,14L17,11.5L19.5,9L22,6.5C22.4,6.1 21.9,5.6 21.5,6L19.5,8L18.5,7L21,4.5C21.4,4.1 20.9,3.6 20.5,4L19.5,3.5M6.5,17.5L5,19L3.5,17.5L5,16L6.5,17.5Z" />
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="nav-card card-grind" onclick="interact('grind')">
                <!-- Background Gradient -->
                <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at 50% 30%, rgba(94, 255, 132, 0.15), transparent 70%); z-index:0;"></div>

                <div class="card-content">
                    <!-- Hammer/Resource Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M21,12L19,14L17,12L15,14V16H13V14H11V16H9V14H7V16H5V14H3V12L1,14V10L3,8V6H5V8H7V6H9V8H11V6H13V8H15V6H17V8H19V6H21V8L23,10V14L21,12M11,2H13V4H11V2Z" />
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80;
        const connectionDistance = 120;
        const mouseDistance = 180;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2 + 0.5;
                
                // Color palette: mostly ethereal white/blue, some gold
                const rand = Math.random();
                if (rand > 0.9) {
                    // Gold
                    this.color = `rgba(255, 215, 0, ${Math.random() * 0.6 + 0.2})`;
                } else if (rand > 0.7) {
                    // Purple
                    this.color = `rgba(157, 77, 255, ${Math.random() * 0.6 + 0.2})`;
                } else {
                    // Ethereal White/Blue
                    this.color = `rgba(200, 220, 255, ${Math.random() * 0.5 + 0.1})`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction (gentle repulsion)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        // Move away gently
                        this.vx -= forceDirectionX * force * 0.05;
                        this.vy -= forceDirectionY * force * 0.05;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw subtle connecting lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        // Lines are faint ethereal blue
                        ctx.strokeStyle = `rgba(150, 180, 255, ${opacity * 0.15})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            // Visual ripple effect could go here
            const card = event.currentTarget;
            
            // Quick press animation
            card.style.transform = "scale(0.96)";
            setTimeout(() => {
                card.style.transform = "";
            }, 150);
            
            console.log(`Interacting with: ${type}`);
        }
    </script>
</body>
