<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #040406;
            --bg-panel: rgba(20, 25, 40, 0.6);
            --bg-panel-hover: rgba(30, 35, 55, 0.75);
            
            --gold-primary: #ffd700;
            --gold-dim: #8a7020;
            --gold-glow: rgba(255, 215, 0, 0.5);
            
            --magic-blue: #4da6ff;
            --magic-purple: #a855f7;
            --magic-red: #ff4d4d;
            --magic-green: #5eff84;
            
            --text-main: #e8e8f0;
            --text-muted: #8888a0;
            
            /* Typography */
            --font-display: "Georgia", "Times New Roman", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Radial glow behind title */
        .hero-glow {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(77, 60, 150, 0.25) 0%, rgba(5,5,8,0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Deep atmospheric vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(5,5,8,0) 0%, rgba(5,5,8,0.6) 60%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        /* Logo Design */
        .logo-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-main {
            font-family: var(--font-display);
            font-weight: bold;
            color: #fff;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .logo-sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Currency Pill */
        .currency-pill {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--gold-dim);
            border-radius: 50px;
            padding: 0.4rem 1.2rem 0.4rem 0.4rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .currency-pill:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* Gradient Gold Coin Icon */
        .gold-icon {
            width: 28px;
            height: 28px;
            fill: url(#goldGradient);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--gold-primary);
            letter-spacing: 0.5px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
            padding-right: 8px;
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            position: relative;
            margin-top: 2vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Rotating Summoning Circle */
        .summoning-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 1px solid rgba(157, 77, 255, 0.15);
            box-shadow: 0 0 50px rgba(157, 77, 255, 0.05);
            pointer-events: none;
            z-index: -1;
            animation: pulse-circle 8s infinite ease-in-out;
        }

        .summoning-circle::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            bottom: 10%;
            border-radius: 50%;
            border: 2px dashed rgba(157, 77, 255, 0.2);
            animation: rotate 30s linear infinite;
        }
        
        .summoning-circle::after {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            right: 25%;
            bottom: 25%;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.1);
            animation: rotate 20s linear infinite reverse;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 4.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #b0b0c0 50%, #707080 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(157, 77, 255, 0.4));
            margin-bottom: 0.2rem;
            position: relative;
            line-height: 1;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-top: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            position: relative;
            z-index: 2;
            opacity: 0.8;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            margin-bottom: 2rem;
        }

        /* --- Card Design --- */
        .nav-card {
            position: relative;
            height: 280px;
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 2.5rem;
            
            /* Glassmorphism */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Texture Overlay */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Bottom Gradient Fade for text legibility */
        .nav-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Hover Interactions */
        .nav-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
            background: var(--bg-panel-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1) translateY(-5px);
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- PRIMARY CARD (Summon) Specifics --- */
        .card-summon {
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: linear-gradient(180deg, rgba(40, 30, 10, 0.4) 0%, var(--bg-panel) 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            animation: border-glow 3s infinite alternate;
        }
        
        /* Rune texture for Summon */
        .card-summon::before {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0L22 18L40 20L22 22L20 40L18 22L0 20L18 18Z' fill='%23ffd700' fill-opacity='0.05'/%3E%3C/svg%3E");
            background-size: 80px 80px;
        }

        .card-summon:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 30px var(--gold-glow), 0 20px 40px rgba(0,0,0,0.7);
        }
        
        .card-summon .card-icon {
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 10px var(--gold-glow));
        }

        /* --- Secondary Cards --- */
        .card-roster .card-icon { fill: var(--magic-blue); }
        .card-battle .card-icon { fill: var(--magic-red); }
        .card-grind .card-icon { fill: var(--magic-green); }

        .card-roster:hover .card-icon { filter: drop-shadow(0 0 15px rgba(77, 166, 255, 0.6)); }
        .card-battle:hover .card-icon { filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.6)); }
        .card-grind:hover .card-icon { filter: drop-shadow(0 0 15px rgba(94, 255, 132, 0.6)); }

        /* Card Content Layout */
        .card-content {
            z-index: 5;
            text-align: center;
            width: 100%;
            position: relative;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            margin-bottom: 1rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 0.2rem;
        }

        .card-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s ease;
        }

        /* Subtitle Colors */
        .card-summon .card-subtitle { color: var(--gold-primary); }
        .card-roster .card-subtitle { color: var(--magic-blue); }
        .card-battle .card-subtitle { color: var(--magic-red); }
        .card-grind .card-subtitle { color: var(--magic-green); }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            padding-bottom: 1rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* --- Animations --- */
        @keyframes pulse-circle {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes border-glow {
            0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); }
            100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.3); }
        }

        /* --- Responsive --- */
        @media (max-width: 1000px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .card-summon {
                grid-column: span 2;
                height: 220px;
            }
            h1.game-title { font-size: 3rem; }
        }

        @media (max-width: 600px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            .card-summon { grid-column: span 1; height: 200px; }
            h1.game-title { font-size: 2.5rem; }
            .ui-layer { padding: 1.5rem 1rem; }
            .summoning-circle { width: 280px; height: 280px; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions for Gradients/Filters -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fefcd7;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </linearGradient>
    </svg>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Visual Anchors -->
    <div class="hero-glow"></div>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <!-- Logo & Title -->
            <div class="logo-container">
                <div class="logo-main">Aetheria</div>
                <div class="logo-sub">Spirit Summoning</div>
            </div>

            <!-- Currency -->
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <div class="summoning-circle"></div>
            <h1 class="game-title">Aetheria</h1>
            <p class="subtitle">Awaken the ancient bonds</p>
        </section>

        <nav class="nav-grid">
            
            <!-- Summon Card (Primary) -->
            <div class="nav-card card-summon" onclick="interact('summon')">
                <div class="card-content">
                    <!-- Crystal/Star Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L9.2,8.6L2,9.2L7.5,14L5.8,21L12,17.2L18.2,21L16.5,14L22,9.2L14.8,8.6L12,2Z" />
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="nav-card card-roster" onclick="interact('roster')">
                <div class="card-content">
                    <!-- Scroll/List Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4,2H20A2,2 0 0,1 22,4V20A2,2 0 0,1 20,22H4A2,2 0 0,1 2,20V4A2,2 0 0,1 4,2M4,4V20H20V4H4M6,6H18V8H6V6M6,10H18V12H6V10M6,14H14V16H6V14Z" />
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="nav-card card-battle" onclick="interact('battle')">
                <div class="card-content">
                    <!-- Sword/Clash Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M19.5,3.5L17,6L18,7L20.5,4.5C20.9,4.1 21.4,4.6 21,5L19.5,6.5L22,9L19,12L16,9L14.5,10.5C14.1,10.9 13.6,10.4 14,10L16.5,7.5L15,6.5L12.5,9L10,11.5L7.5,14L5,16.5L2,20L6,22L9.5,19L12,16.5L14.5,14L17,11.5L19.5,9L22,6.5C22.4,6.1 21.9,5.6 21.5,6L19.5,8L18.5,7L21,4.5C21.4,4.1 20.9,3.6 20.5,4L19.5,3.5M6.5,17.5L5,19L3.5,17.5L5,16L6.5,17.5Z" />
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="nav-card card-grind" onclick="interact('grind')">
                <div class="card-content">
                    <!-- Vector Pickaxe Icon (Replaces Pixel Art) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.7,4.3C15.1,3.9 15.7,3.9 16.1,4.3L19.7,7.9C20.1,8.3 20.1,8.9 19.7,9.3L18.7,10.3C18.3,10.7 17.7,10.7 17.3,10.3L13.7,6.7C13.3,6.3 13.3,5.7 13.7,5.3L14.7,4.3M12.6,6.4L11.2,7.8L16.2,12.8L17.6,11.4L12.6,6.4M10.1,8.9L8.7,10.3L13.7,15.3L15.1,13.9L10.1,8.9M7.6,11.4L6.2,12.8L11.2,17.8L12.6,16.4L7.6,11.4M5.1,13.9L3.7,15.3L4.7,16.3L6.1,14.9L5.1,13.9M2.6,16.4L3.6,17.4L5.6,15.4L4.6,14.4L2.6,16.4Z" />
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 70;
        const connectionDistance = 130;
        const mouseDistance = 200;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.size = Math.random() * 2.5 + 0.5;
                
                // Color palette: mostly ethereal white/blue, some gold
                const rand = Math.random();
                if (rand > 0.92) {
                    // Gold
                    this.color = `rgba(255, 215, 0, ${Math.random() * 0.7 + 0.3})`;
                } else if (rand > 0.8) {
                    // Purple
                    this.color = `rgba(168, 85, 247, ${Math.random() * 0.6 + 0.3})`;
                } else {
                    // Ethereal White/Blue
                    this.color = `rgba(200, 220, 255, ${Math.random() * 0.6 + 0.2})`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction (gentle repulsion)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        // Move away gently
                        this.vx -= forceDirectionX * force * 0.02;
                        this.vy -= forceDirectionY * force * 0.02;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw subtle connecting lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        // Lines are faint ethereal blue
                        ctx.strokeStyle = `rgba(150, 180, 255, ${opacity * 0.15})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Quick press animation
            card.style.transform = "scale(0.97)";
            setTimeout(() => {
                card.style.transform = "";
            }, 150);
        }
    </script>
</body>
</html>
