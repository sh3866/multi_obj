<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette - Deep Mystical */
            --bg-deep: #050508;
            --bg-mid: #0a0b10;
            
            --gold-primary: #ffd700;
            --gold-dim: #5e4b14;
            --gold-glow: rgba(255, 215, 0, 0.4);
            
            --silver-primary: #e0e5ec;
            --silver-dim: #505560;
            
            --magic-purple: #9d4edd;
            --magic-blue: #4da6ff;
            
            --text-main: #f0f0f5;
            --text-muted: #8888a0;
            
            /* Typography */
            /* Using a robust serif stack for the "Runic/Premium" feel */
            --font-display: "Trajan Pro", "Cinzel", "Times New Roman", "Georgia", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Deep atmospheric vignette to frame the content */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(10,10,15,0) 0%, rgba(5,5,8,0.8) 60%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Header (Revised: No Logo, Integrated Currency) --- */
        header {
            display: flex;
            justify-content: flex-end; /* Push to right */
            align-items: center;
            padding: 0 1rem;
        }

        /* Floating Gem Currency Indicator */
        .currency-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            padding: 8px 16px 8px 8px;
            border-radius: 4px; /* Slightly squared for slate look */
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: default;
        }

        .currency-indicator:hover {
            background: rgba(30, 30, 40, 0.6);
            border-color: rgba(255, 215, 0, 0.3);
        }

        /* The "Gem" */
        .gem-stack {
            position: relative;
            width: 32px;
            height: 32px;
        }
        
        .gem-stack svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 5px var(--gold-glow));
        }

        .currency-amount {
            font-family: var(--font-display); /* Match hero font */
            font-size: 1.1rem;
            color: var(--gold-primary);
            letter-spacing: 0.05em;
            font-weight: normal;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            position: relative;
            margin-top: 4vh; /* Slightly higher */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 5rem; /* Larger */
            text-transform: uppercase;
            letter-spacing: 0.15em; /* Wider spacing */
            color: transparent;
            /* Metallic Silver/Gold Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 40%, #8a8a9a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            /* Stronger Glow */
            filter: drop-shadow(0 0 30px rgba(157, 77, 255, 0.3));
            margin-bottom: 0.5rem;
            position: relative;
            line-height: 1;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.8em; /* Very wide */
            text-transform: uppercase;
            margin-top: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            position: relative;
            z-index: 2;
            opacity: 0.7;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            margin-bottom: 2rem;
        }

        /* --- Card Design (Unified Runic Slate) --- */
        .nav-card {
            position: relative;
            height: 300px;
            /* Dark, semi-transparent slate */
            background: linear-gradient(180deg, rgba(25, 30, 45, 0.6) 0%, rgba(15, 15, 20, 0.8) 100%);
            /* Subtle Gold Border */
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 2.5rem;
            
            /* Glassmorphism */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Internal ambient glow for cards */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Bottom Fade */
        .nav-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(5,5,8,0.9) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Hover Interactions */
        .nav-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, 0.6);
            background: linear-gradient(180deg, rgba(35, 40, 60, 0.7) 0%, rgba(20, 20, 30, 0.9) 100%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1) translateY(-5px);
            filter: drop-shadow(0 0 15px currentColor);
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* Card Content Layout */
        .card-content {
            z-index: 5;
            text-align: center;
            width: 100%;
            position: relative;
        }

        .card-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Default color is silver/white */
            fill: var(--silver-primary);
            color: var(--silver-primary); /* For drop-shadow currentColor */
        }

        .card-title {
            /* Unified Typography */
            font-family: var(--font-display); 
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 0.15em; /* Premium spacing */
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 0.2rem;
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s ease;
            color: var(--text-muted);
        }

        /* --- Specific Card Accents (Subtle) --- */
        
        /* Summon (Primary) */
        .card-summon {
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 10px rgba(255, 215, 0, 0.05);
        }
        .card-summon .card-icon {
            fill: var(--gold-primary);
            color: var(--gold-primary);
        }
        .card-summon:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 215, 0, 0.2);
        }
        .card-summon:hover .card-subtitle { color: var(--gold-primary); }

        /* Roster (Silver/Blue) */
        .card-roster .card-icon {
            fill: #a0c4ff;
            color: #a0c4ff;
        }
        .card-roster:hover .card-subtitle { color: #a0c4ff; }

        /* Battle (Deep Red/Crimson) */
        .card-battle .card-icon {
            fill: #ff6b6b;
            color: #ff6b6b;
        }
        .card-battle:hover .card-subtitle { color: #ff6b6b; }

        /* Grind (Ethereal Green/Teal) */
        .card-grind .card-icon {
            fill: #64ffda;
            color: #64ffda;
        }
        .card-grind:hover .card-subtitle { color: #64ffda; }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.65rem;
            padding-bottom: 1rem;
            opacity: 0.4;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Responsive --- */
        @media (max-width: 1000px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .card-summon {
                grid-column: span 2;
                height: 240px;
            }
            h1.game-title { font-size: 3.5rem; }
        }

        @media (max-width: 600px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            .card-summon { grid-column: span 1; height: 200px; }
            h1.game-title { font-size: 2.8rem; }
            .ui-layer { padding: 1.5rem 1rem; }
            .hero-section { margin-top: 2vh; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions for Gradients/Filters -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fefcd7;stop-opacity:1" />
            <stop offset="40%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </svg>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Visual Anchors -->
    <div class="vignette"></div>

    <div class="ui-layer">
        
        <!-- HEADER: Only Currency, No Logo -->
        <header>
            <div class="currency-indicator">
                <div class="gem-stack">
                    <!-- Custom Gem Icon -->
                    <svg viewBox="0 0 24 24" fill="url(#goldGradient)">
                        <path d="M12,2L2,12L12,22L22,12L12,2Z M12,4L18.5,12L12,20L5.5,12L12,4Z" />
                        <path d="M12,2L16,8L12,14L8,8L12,2Z" fill="#FFF" opacity="0.3"/>
                    </svg>
                </div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- HERO: Sole Brand Anchor -->
        <section class="hero-section">
            <h1 class="game-title">Aetheria</h1>
            <p class="subtitle">Awaken the ancient bonds</p>
        </section>

        <!-- NAVIGATION: Unified Card System -->
        <nav class="nav-grid">
            
            <!-- Summon Card (Primary) -->
            <div class="nav-card card-summon" onclick="interact('summon')">
                <div class="card-content">
                    <!-- Custom Icon: Glowing Orb/Star -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2C12.55,2 13,2.45 13,3V6.07C15.26,6.56 17.18,8.06 18.46,10.11L21.53,5.04C21.92,4.49 22.65,4.39 23.11,4.77C23.57,5.15 23.67,5.88 23.29,6.43L19.22,11.5C20.45,13.78 20.45,16.53 19.22,18.8C18.99,19.31 18.4,19.56 17.86,19.41C17.32,19.26 16.91,18.76 16.83,18.19C16.46,15.58 14.39,13.5 11.82,13.11L11.75,13.1C11.24,13.02 10.76,13.15 10.33,13.46L12,2Z" />
                        <circle cx="12" cy="12" r="4" fill="rgba(0,0,0,0.2)" />
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="nav-card card-roster" onclick="interact('roster')">
                <div class="card-content">
                    <!-- Custom Icon: Shield/Crest -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L3,7V12C3,17.55 6.84,22.74 12,24C17.16,22.74 21,17.55 21,12V7L12,2ZM12,4.15L19,8V12C19,16.42 16.07,20.72 12,22C7.93,20.72 5,16.42 5,12V8L12,4.15Z" />
                        <path d="M12,6L16,8.5V12.5C16,15.5 14.31,18.26 12,19.5C9.69,18.26 8,15.5 8,12.5V8.5L12,6Z" />
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="nav-card card-battle" onclick="interact('battle')">
                <div class="card-content">
                    <!-- Custom Icon: Crossed Swords -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M19.4,4.6L17.9,3.1C17.5,2.7 16.8,2.7 16.4,3.1L6.7,12.8L5.3,11.4C5.1,11.2 4.8,11.2 4.6,11.4L3.1,12.9C2.7,13.3 2.7,14 3.1,14.4L4.6,15.9L12.8,24H14.2L19.4,18.8C19.8,18.4 19.8,17.7 19.4,17.3L17.9,15.8L19.4,14.3C19.8,13.9 19.8,13.2 19.4,12.8L17.9,11.3L19.4,9.8C19.8,9.4 19.8,8.7 19.4,8.3L17.9,6.8L19.4,5.3C19.8,4.9 19.8,4.2 19.4,4.6Z" />
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="nav-card card-grind" onclick="interact('grind')">
                <div class="card-content">
                    <!-- Custom Icon: Anvil/Hammer -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M19,13H17V11H19V13M19,17H17V15H19V17M15,13H13V11H15V13M15,17H13V15H15V17M11,13H9V11H11V13M11,17H9V15H11V17M7,13H5V11H7V13M7,17H5V15H7V17M19,9H17V7H19V9M15,9H13V7H15V9M11,9H9V7H11V9M7,9H5V7H7V9M20,21H4V19H20V21Z" />
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; System Ready
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Mystical Mist & Dust) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 60;
        
        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                // Randomize initial Y so they don't all start at bottom
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.speed = Math.random() * 0.3 + 0.1;
                this.size = Math.random() * 3 + 1;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.drift = (Math.random() - 0.5) * 0.5;
                
                // Ethereal Palette
                const r = Math.random();
                if (r > 0.9) {
                    // Gold dust
                    this.color = `rgba(255, 215, 0, ${this.opacity})`;
                } else if (r > 0.7) {
                    // Purple mist
                    this.color = `rgba(157, 78, 221, ${this.opacity * 0.6})`;
                } else {
                    // Blue/White star dust
                    this.color = `rgba(200, 220, 255, ${this.opacity})`;
                }
            }

            update() {
                this.y -= this.speed;
                this.x += this.drift;

                // Wrap around
                if (this.y < -10) {
                    this.reset();
                }
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;

                // Subtle Mouse Interaction
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        const force = (150 - distance) / 150;
                        this.x -= dx * force * 0.02;
                        this.y -= dy * force * 0.02;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // Clear with slight trail for motion blur effect? No, clean clear for crisp UI.
            ctx.clearRect(0, 0, width, height);
            
            // Draw deep background gradient on canvas too for performance
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#050508');
            gradient.addColorStop(1, '#0a0b15');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Quick press animation
            card.style.transform = "scale(0.97)";
            card.style.filter = "brightness(1.2)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
