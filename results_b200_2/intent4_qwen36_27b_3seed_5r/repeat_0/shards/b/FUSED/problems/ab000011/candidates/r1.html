<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-dark: #090b0e;
        --bg-panel: #12151a;
        --accent-primary: #00f0ff; /* Electric Cyan */
        --accent-secondary: #ff3355; /* Neon Red */
        --accent-warn: #ffaa00; /* Amber */
        --text-main: #e6edf3;
        --text-muted: #6e7681;
        --grid-line: #1e232b;
        --shadow-heavy: 0 20px 50px -12px rgba(0,0,0,0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        width: 100%;
        max-width: 960px;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    /* Background ambient glow */
    body::before {
        content: ''; position: absolute; top: 50%; left: 50%;
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
        transform: translate(-50%, -50%);
        z-index: 0; pointer-events: none;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        padding: 0 10px;
    }

    h1 {
        font-size: 1.6rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
        margin-bottom: 5px;
    }

    .hud {
        display: flex;
        gap: 2.5rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .hud-item span {
        color: var(--accent-primary);
        font-weight: bold;
        font-size: 1.4rem;
        line-height: 1;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        margin-top: 4px;
    }

    /* --- THE BOARD --- */
    .board-wrapper {
        position: relative;
        background: var(--bg-panel);
        border-radius: 8px;
        box-shadow: var(--shadow-heavy), 0 0 0 1px #2a303c;
        padding: 12px;
        border-top: 1px solid #333a45;
    }

    #grid-canvas {
        display: block;
        border-radius: 4px;
        cursor: crosshair;
    }

    /* --- CONTROLS LEGEND --- */
    .controls {
        display: flex;
        gap: 1rem;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    .control-group {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255,255,255,0.03);
        padding: 10px 16px;
        border-radius: 6px;
        border: 1px solid #1e232b;
        transition: all 0.2s ease;
    }

    .control-group:hover {
        background: rgba(255,255,255,0.05);
        border-color: #333a45;
    }

    .icon-box {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
    }

    .key-badge {
        background: #2a303c;
        color: var(--text-main);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-family: monospace;
        border-bottom: 2px solid #111;
        box-shadow: 0 2px 0 #000;
        margin-left: auto;
    }
    
    /* Highlight active key visually */
    .key-badge.active {
        background: var(--accent-primary);
        color: #000;
        border-bottom-color: #000;
        box-shadow: 0 0 10px rgba(0,240,255,0.5);
    }

    .label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    footer {
        margin-top: 1rem;
        font-size: 0.7rem;
        color: #333;
        text-transform: uppercase;
        letter-spacing: 0.2em;
    }

</style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>Iron & Flux</h1>
        <div class="hud">
            <div class="hud-item">LEVEL <span>04</span></div>
            <div class="hud-item">MOVES <span>12</span></div>
        </div>
    </header>

    <div class="board-wrapper">
        <canvas id="grid-canvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="icon-box">
                <!-- Player Icon: Solid Cyan -->
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="#00f0ff" />
                    <circle cx="12" cy="12" r="4" fill="#fff" />
                </svg>
            </div>
            <span class="label">Move</span>
            <span class="key-badge">ARROWS</span>
        </div>
        <div class="control-group">
            <div class="icon-box">
                <!-- Crate Icon: Solid Red Block -->
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" fill="#ff3355" />
                    <path d="M3 12h18M12 3v18" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
                    <circle cx="6" cy="6" r="1.5" fill="rgba(0,0,0,0.3)"/>
                    <circle cx="18" cy="18" r="1.5" fill="rgba(0,0,0,0.3)"/>
                </svg>
            </div>
            <span class="label">Push</span>
            <span class="key-badge">WALK</span>
        </div>
        <div class="control-group">
            <div class="icon-box">
                <!-- Lever Icon: Match on-board -->
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <circle cx="12" cy="18" r="4" fill="#333" stroke="#666" stroke-width="1"/>
                    <line x1="12" y1="18" x2="12" y2="6" stroke="#ffaa00" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="12" cy="6" r="2" fill="#fff"/>
                </svg>
            </div>
            <span class="label">Pull Lever</span>
            <span class="key-badge">SPACE</span>
        </div>
    </div>

    <footer>System Status: Online</footer>
</div>

<script>
/**
 * RENDERER & ENGINE
 * Focused on high-contrast, polished visuals.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Config
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;
const PADDING = 2; // Inner spacing between tiles

// Palette
const C = {
    bg: '#161b22',
    gridLine: '#232830',
    checkerLight: '#1c2128',
    checkerDark: '#161b22',
    wallTop: '#2f3640',
    wallSide: '#1a1f25',
    wallBorder: '#111',
    player: '#00f0ff',
    crate: '#ff3355',
    crateDark: '#cc2244',
    leverBase: '#444',
    leverHandle: '#ffaa00',
    target: '#ffd700',
    doorFrame: '#333',
    doorOpen: 'rgba(0, 240, 255, 0.15)'
};

// State
let state = {
    player: { x: 1, y: 1 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}
    ]
};

// Init
function init() {
    const w = GRID_COLS * TILE_SIZE;
    const h = GRID_ROWS * TILE_SIZE;
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    ctx.scale(dpr, dpr);
    
    draw();
}

// --- DRAWING FUNCTIONS ---

function drawGrid() {
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;
            
            // Checkerboard Floor
            ctx.fillStyle = (x + y) % 2 === 0 ? C.checkerLight : C.checkerDark;
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            
            // Subtle Grid Lines
            ctx.strokeStyle = C.gridLine;
            ctx.lineWidth = 1;
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
        }
    }
}

function drawWalls() {
    state.walls.forEach(w => {
        const px = w.x * TILE_SIZE;
        const py = w.y * TILE_SIZE;
        const s = TILE_SIZE;

        // Solid Block
        ctx.fillStyle = C.wallTop;
        ctx.fillRect(px, py, s, s);

        // Top Highlight (Bevel)
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.moveTo(px, py + s);
        ctx.lineTo(px, py);
        ctx.lineTo(px + s, py);
        ctx.lineTo(px + s, py + 4);
        ctx.lineTo(px + 4, py + 4);
        ctx.lineTo(px + 4, py + s);
        ctx.fill();

        // Bottom Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(px, py + s - 6, s, 6);
    });
}

function drawTarget() {
    const t = state.target;
    const cx = t.x * TILE_SIZE + TILE_SIZE/2;
    const cy = t.y * TILE_SIZE + TILE_SIZE/2;
    const size = 20;

    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = C.target;
    
    // Dashed Square
    ctx.strokeStyle = C.target;
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(cx - size, cy - size, size*2, size*2);
    
    // Inner Dot
    ctx.fillStyle = C.target;
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
}

function drawDoor() {
    const d = state.door;
    const px = d.x * TILE_SIZE;
    const py = d.y * TILE_SIZE;
    const size = TILE_SIZE - 10;
    const x = px + 5;
    const y = py + 5;

    // Archway Frame
    ctx.fillStyle = C.doorFrame;
    ctx.beginPath();
    ctx.roundRect(x, y, size, size, [10, 10, 0, 0]);
    ctx.fill();

    // Interior
    if (d.open) {
        ctx.fillStyle = C.doorOpen;
        ctx.fill();
        // Light beam
        ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
        ctx.fillRect(x, y, size, size);
    } else {
        ctx.fillStyle = '#0d1117';
        ctx.fill();
        // Lock Icon
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2 - 5, 6, Math.PI, 0);
        ctx.lineTo(px + TILE_SIZE/2 + 6, py + TILE_SIZE/2 + 8);
        ctx.lineTo(px + TILE_SIZE/2 - 6, py + TILE_SIZE/2 + 8);
        ctx.closePath();
        ctx.stroke();
    }
}

function drawLever() {
    const l = state.lever;
    const cx = l.x * TILE_SIZE + TILE_SIZE/2;
    const cy = l.y * TILE_SIZE + TILE_SIZE/2;

    // Base
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Handle
    ctx.strokeStyle = l.active ? C.player : C.leverHandle;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    // Angled stick
    const angle = l.active ? -Math.PI/2 : Math.PI/4;
    const len = 16;
    ctx.lineTo(cx + Math.cos(angle)*len, cy + Math.sin(angle)*len);
    ctx.stroke();
    
    // Knob
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(angle)*len, cy + Math.sin(angle)*len, 3, 0, Math.PI*2);
    ctx.fill();
}

function drawCrates() {
    state.crates.forEach(c => {
        const px = c.x * TILE_SIZE;
        const py = c.y * TILE_SIZE;
        const s = TILE_SIZE - 12;
        const x = px + 6;
        const y = py + 6;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x + 4, y + 4, s, s);

        // Body
        ctx.fillStyle = C.crate;
        ctx.fillRect(x, y, s, s);
        
        // Texture (Cross)
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x+s, y+s);
        ctx.moveTo(x+s, y); ctx.lineTo(x, y+s);
        ctx.stroke();

        // Highlights
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(x, y, s, 4);
        ctx.fillRect(x, y, 4, s);
    });
}

function drawPlayer() {
    const p = state.player;
    const cx = p.x * TILE_SIZE + TILE_SIZE/2;
    const cy = p.y * TILE_SIZE + TILE_SIZE/2;

    // Strong Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = C.player;

    // Body (Solid Circle)
    ctx.fillStyle = C.player;
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Core
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI*2);
    ctx.fill();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const nx = state.player.x + dx;
    const ny = state.player.y + dy;

    // Bounds
    if (nx < 0 || nx >= GRID_COLS || ny < 0 || ny >= GRID_ROWS) return;

    // Walls
    if (state.walls.some(w => w.x === nx && w.y === ny)) return;

    // Crates
    const crateIdx = state.crates.findIndex(c => c.x === nx && c.y === ny);
    if (crateIdx !== -1) {
        const cnx = nx + dx;
        const cny = ny + dy;
        
        // Check if crate can move
        const blocked = 
            cnx < 0 || cnx >= GRID_COLS || cny < 0 || cny >= GRID_ROWS ||
            state.walls.some(w => w.x === cnx && w.y === cny) ||
            state.crates.some(c => c.x === cnx && c.y === cny) ||
            (state.door.x === cnx && state.door.y === cny && !state.door.open);

        if (!blocked) {
            state.crates[crateIdx].x = cnx;
            state.crates[crateIdx].y = cny;
            state.player.x = nx;
            state.player.y = ny;
            draw();
        }
    } else {
        // Empty space or Door
        if (state.door.x === nx && state.door.y === ny && !state.door.open) return;
        
        state.player.x = nx;
        state.player.y = ny;
        draw();
    }
}

function pullLever() {
    const p = state.player;
    const l = state.lever;
    
    // Check adjacency (Manhattan distance = 1)
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    if (dist === 1) {
        l.active = !l.active;
        state.door.open = l.active;
        draw();
    }
}

window.addEventListener('keydown', (e) => {
    // Prevent scrolling
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
