<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-deep: #080a0f;
        --bg-panel: #12161e;
        
        --color-iron-light: #8892a0;
        --color-iron-mid: #4a5463;
        --color-iron-dark: #232b36;
        
        --color-flux: #00f0ff;
        --color-flux-dim: rgba(0, 240, 255, 0.1);
        
        --color-warn: #ffaa00;
        --color-crate-main: #d9203d;
        --color-crate-dark: #8a1226;
        
        --font-display: "Impact", "Arial Black", sans-serif;
        --font-mono: "Courier New", Courier, monospace;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: #e6edf3;
        font-family: var(--font-ui);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-image: radial-gradient(circle at 50% 30%, #161b25 0%, #080a0f 80%);
    }

    /* --- ATMOSPHERE --- */
    .ambient-glow {
        position: absolute;
        top: 20%; left: 50%;
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.04) 0%, transparent 60%);
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
    }
    
    /* Scanlines - subtle */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
        background-size: 100% 4px;
        z-index: 10;
        pointer-events: none;
        opacity: 0.6;
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        width: 100%;
        max-width: 850px;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    /* --- HEADER & HUD --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        padding: 0 5px;
        margin-bottom: 10px;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        margin: 0;
        line-height: 1;
    }
    
    h1 span {
        color: var(--color-flux);
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .hud {
        display: flex;
        gap: 2.5rem;
        font-family: var(--font-mono);
        color: #7a8290;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(0,0,0,0.3);
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.1;
    }

    .hud-item span {
        color: var(--color-flux);
        font-size: 1.4rem;
        font-weight: bold;
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    /* --- BOARD WRAPPER (The Machine) --- */
    .board-wrapper {
        position: relative;
        background: #05070a;
        padding: 16px;
        border-radius: 4px;
        /* Heavy Industrial Frame */
        box-shadow: 
            0 20px 50px -10px rgba(0,0,0,0.8),
            inset 0 0 20px rgba(0,0,0,0.8),
            0 0 0 2px #222,
            0 0 0 4px #0a0c10;
        border: 1px solid #333;
    }
    
    /* Corner Bolts */
    .board-wrapper::before, .board-wrapper::after, 
    .board-wrapper .bolt-tl, .board-wrapper .bolt-br {
        content: '';
        position: absolute;
        width: 10px; height: 10px;
        background: radial-gradient(circle, #555 0%, #222 100%);
        border-radius: 50%;
        box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.8);
        z-index: 5;
    }
    .board-wrapper::before { top: 8px; left: 8px; }
    .board-wrapper::after { bottom: 8px; right: 8px; }
    .board-wrapper .bolt-tl { top: 8px; right: 8px; }
    .board-wrapper .bolt-br { bottom: 8px; left: 8px; }

    #grid-canvas {
        display: block;
        border-radius: 2px;
        cursor: crosshair;
        background: #0d1015;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    /* --- CONTROLS LEGEND (Compact Bar) --- */
    .controls-bar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background: linear-gradient(180deg, #161a22 0%, #11141a 100%);
        border: 1px solid #2a303c;
        border-top: 2px solid #2a303c;
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        position: relative;
    }
    
    /* Screw heads for bar */
    .controls-bar::before, .controls-bar::after {
        content: '';
        position: absolute;
        top: 50%; left: 10px;
        width: 6px; height: 6px;
        background: #000;
        border-radius: 50%;
        transform: translateY(-50%);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
    }
    .controls-bar::after { left: auto; right: 10px; }

    .control-group {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .key-caps {
        display: flex;
        gap: 4px;
    }

    .key-badge {
        background: linear-gradient(180deg, #2a303c 0%, #1c232e 100%);
        color: #a0aab5;
        padding: 6px 8px;
        border-radius: 3px;
        font-size: 0.7rem;
        font-family: var(--font-mono);
        font-weight: bold;
        border-top: 1px solid #444;
        border-bottom: 3px solid #0a0c10;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        min-width: 24px;
        text-align: center;
        text-shadow: 0 1px 0 rgba(0,0,0,0.8);
    }

    .key-badge.space {
        width: 60px;
    }
    
    .label {
        font-size: 0.75rem;
        color: #8b949e;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

</style>
</head>
<body>

<div class="ambient-glow"></div>
<div class="scanlines"></div>

<div class="game-container">
    <header>
        <h1>IRON <span>&</span> FLUX</h1>
        <div class="hud">
            <div class="hud-item">LEVEL <span>04</span></div>
            <div class="hud-item">MOVES <span>12</span></div>
        </div>
    </header>

    <div class="board-wrapper">
        <div class="bolt-tl"></div>
        <div class="bolt-br"></div>
        <canvas id="grid-canvas"></canvas>
    </div>

    <div class="controls-bar">
        <div class="control-group">
            <div class="key-caps">
                <div class="key-badge">↑</div>
                <div class="key-badge">↓</div>
                <div class="key-badge">←</div>
                <div class="key-badge">→</div>
            </div>
            <span class="label">Move / Push</span>
        </div>
        <div class="control-group">
            <div class="key-caps">
                <div class="key-badge space">SPACE</div>
            </div>
            <span class="label">Toggle Lever</span>
        </div>
    </div>
</div>

<script>
/**
 * RENDERER & ENGINE
 * Visuals: High contrast, solid walls, mechanical levers, glowing archway door.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Config
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Palette
const C = {
    // Floor
    floorBase: '#14171c',
    floorGrid: '#252b36', // Slightly brighter for visibility
    floorGridBright: '#353d4a',
    
    // Iron (Walls) - Solid Metallic
    ironLight: '#9ba3b1',
    ironMid: '#5a6577',
    ironDark: '#2c3542',
    ironShadow: '#11151a',
    
    // Flux (Player)
    flux: '#00f0ff',
    fluxGlow: 'rgba(0, 240, 255, 0.6)',
    
    // Crate
    crateMain: '#d9203d',
    crateDark: '#8a1226',
    crateShadow: 'rgba(0,0,0,0.8)',
    crateMetal: '#6e7888',
    
    // Lever
    leverBase: '#1a1d23',
    leverHandle: '#ffaa00', // Yellow/Amber
    
    // Target
    target: '#ffaa00',
    targetGlow: 'rgba(255, 170, 0, 0.4)',
    
    // Door
    doorFrame: '#111',
    doorOpen: 'rgba(0, 240, 255, 0.15)'
};

// State
let state = {
    player: { x: 1, y: 1 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}
    ]
};

// Init
function init() {
    const w = GRID_COLS * TILE_SIZE;
    const h = GRID_ROWS * TILE_SIZE;
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    ctx.scale(dpr, dpr);
    
    draw();
}

// --- DRAWING HELPERS ---

function drawSolidBlock(x, y, w, h, colorBase, colorHighlight) {
    // Main body
    ctx.fillStyle = colorBase;
    ctx.fillRect(x, y, w, h);
    
    // Inner Gradient for Volume
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, colorHighlight);
    grad.addColorStop(1, colorBase);
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    // Top Highlight (Bevel)
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y, 2, h);
    
    // Bottom Shadow (Bevel)
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x + w - 2, y, 2, h);
}

// --- DRAWING FUNCTIONS ---

function drawGrid() {
    // Background Gradient for depth
    const bgGrad = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, 50,
        canvas.width/2, canvas.height/2, 500
    );
    bgGrad.addColorStop(0, '#1a1e25');
    bgGrad.addColorStop(1, '#0d1015');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;
            
            // Grid Lines (Dotted & Visible)
            ctx.strokeStyle = C.floorGrid;
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]); // Dotted lines
            ctx.strokeRect(px + 0.5, py + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
            ctx.setLineDash([]); // Reset
            
            // Subtle texture dots (Floor grate look)
            if ((x+y) % 2 === 0) {
                ctx.fillStyle = C.floorGridBright;
                ctx.fillRect(px + TILE_SIZE/2 - 1, py + TILE_SIZE/2 - 1, 2, 2);
            }
        }
    }
}

function drawWalls() {
    state.walls.forEach(w => {
        const px = w.x * TILE_SIZE;
        const py = w.y * TILE_SIZE;
        const s = TILE_SIZE - 4; // Slight padding
        const offset = 2;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(px + offset + 4, py + offset + 4, s, s);

        // Solid Metallic Block (Different from Crate)
        // Using a more uniform, "slab" look
        drawSolidBlock(px + offset, py + offset, s, s, C.ironMid, C.ironLight);

        // Inner Dark Panel (recessed look)
        const inset = 8;
        ctx.fillStyle = C.ironDark;
        ctx.fillRect(px + offset + inset, py + offset + inset, s - inset*2, s - inset*2);
        
        // Inner Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(px + offset + inset, py + offset + inset, s - inset*2, 2);

        // Rivets
        ctx.fillStyle = '#000';
        const rivetSize = 2.5;
        const rivetOff = 10;
        // 4 corners of the inner panel
        [
            {x: px + offset + rivetOff, y: py + offset + rivetOff},
            {x: px + offset + s - rivetOff, y: py + offset + rivetOff},
            {x: px + offset + rivetOff, y: py + offset + s - rivetOff},
            {x: px + offset + s - rivetOff, y: py + offset + s - rivetOff}
        ].forEach(pos => {
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, rivetSize, 0, Math.PI*2);
            ctx.fill();
            // Rivet highlight
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(pos.x-1, pos.y-1, 1, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000'; // reset
        });
    });
}

function drawTarget() {
    const t = state.target;
    const cx = t.x * TILE_SIZE + TILE_SIZE/2;
    const cy = t.y * TILE_SIZE + TILE_SIZE/2;
    const size = 28; // Increased size

    // Ambient Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = C.target;
    
    // Dashed Square (Stronger Contrast)
    ctx.strokeStyle = C.target;
    ctx.lineWidth = 4;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(cx - size, cy - size, size*2, size*2);
    
    // Inner Core
    ctx.fillStyle = C.targetGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI*2);
    ctx.fill();

    // Center Dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
}

function drawDoor() {
    const d = state.door;
    const px = d.x * TILE_SIZE;
    const py = d.y * TILE_SIZE;
    const s = TILE_SIZE - 8;
    const x = px + 4;
    const y = py + 4;

    // Archway Frame (Heavy Metal)
    drawSolidBlock(x, y, s, s, C.ironMid, C.ironLight);

    // Archway Cutout
    const cutoutPadding = 6;
    const cx = x + s/2;
    const cy = y + s/2;
    
    ctx.fillStyle = d.open ? C.doorOpen : '#05070a';
    
    // Draw Arch Shape
    ctx.beginPath();
    ctx.moveTo(x + cutoutPadding, y + s - cutoutPadding); // Bottom Left
    ctx.lineTo(x + cutoutPadding, y + s/2); // Up left side
    ctx.arc(cx, y + s/2, (s - cutoutPadding*2)/2, Math.PI, 0); // Top Arch
    ctx.lineTo(x + s - cutoutPadding, y + s - cutoutPadding); // Down right side
    ctx.fill();

    if (d.open) {
        // Glowing Portal Effect
        ctx.shadowBlur = 15;
        ctx.shadowColor = C.flux;
        ctx.strokeStyle = C.flux;
        ctx.lineWidth = 2;
        ctx.stroke(); // Stroke the arch
        
        // Inner light
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fill();
        ctx.shadowBlur = 0;
    } else {
        // Lock Icon
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy - 5, 6, Math.PI, 0);
        ctx.lineTo(cx + 6, cy + 8);
        ctx.lineTo(cx - 6, cy + 8);
        ctx.closePath();
        ctx.stroke();
    }
}

function drawLever() {
    const l = state.lever;
    const cx = l.x * TILE_SIZE + TILE_SIZE/2;
    const cy = l.y * TILE_SIZE + TILE_SIZE/2;

    // Mechanical Base (Round, recessed)
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();
    
    // Base Rim
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Handle Shaft (Yellow/Amber)
    ctx.strokeStyle = C.leverHandle;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    
    // Angled stick
    // If active, vertical (up), else diagonal
    const angle = l.active ? -Math.PI/2 : Math.PI/4;
    const len = 20;
    const endX = cx + Math.cos(angle)*len;
    const endY = cy + Math.sin(angle)*len;
    
    ctx.lineTo(endX, endY);
    ctx.stroke();
    
    // Handle Knob
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = C.leverHandle;
    ctx.beginPath();
    ctx.arc(endX, endY, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawCrates() {
    state.crates.forEach(c => {
        const px = c.x * TILE_SIZE;
        const py = c.y * TILE_SIZE;
        const s = TILE_SIZE - 12;
        const x = px + 6;
        const y = py + 6;

        // Shadow (Ambient Occlusion)
        ctx.fillStyle = C.crateShadow;
        ctx.fillRect(x + 4, y + 4, s, s);

        // Body (3D Cargo Box)
        // Main Body
        drawSolidBlock(x, y, s, s, C.crateDark, C.crateMain);

        // Metal Plating (Cross) - Distinct "Box" look
        ctx.fillStyle = C.crateMetal;
        // Vertical
        ctx.fillRect(x + s/2 - 3, y, 6, s);
        // Horizontal
        ctx.fillRect(x, y + s/2 - 3, s, 6);
        
        // Rivets on crate
        ctx.fillStyle = '#222';
        const rivetSize = 2.5;
        const rOff = 4;
        [
            {x: x + rOff, y: y + rOff},
            {x: x + s - rOff, y: y + rOff},
            {x: x + rOff, y: y + s - rOff},
            {x: x + s - rOff, y: y + s - rOff}
        ].forEach(pos => {
            ctx.beginPath(); ctx.arc(pos.x, pos.y, rivetSize, 0, Math.PI*2); ctx.fill();
        });
    });
}

function drawPlayer() {
    const p = state.player;
    const cx = p.x * TILE_SIZE + TILE_SIZE/2;
    const cy = p.y * TILE_SIZE + TILE_SIZE/2;

    // Strong Flux Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = C.flux;

    // Outer Ring
    ctx.strokeStyle = C.flux;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, Math.PI*2);
    ctx.stroke();

    // Body (Solid Circle)
    ctx.fillStyle = C.flux;
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Core
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI*2);
    ctx.fill();

    // Directional Indicator (Face/Eye) - Pointing Right
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(cx + 4, cy - 6);
    ctx.lineTo(cx + 10, cy);
    ctx.lineTo(cx + 4, cy + 6);
    ctx.fill();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const nx = state.player.x + dx;
    const ny = state.player.y + dy;

    // Bounds
    if (nx < 0 || nx >= GRID_COLS || ny < 0 || ny >= GRID_ROWS) return;

    // Walls
    if (state.walls.some(w => w.x === nx && w.y === ny)) return;

    // Crates
    const crateIdx = state.crates.findIndex(c => c.x === nx && c.y === ny);
    if (crateIdx !== -1) {
        const cnx = nx + dx;
        const cny = ny + dy;
        
        // Check if crate can move
        const blocked = 
            cnx < 0 || cnx >= GRID_COLS || cny < 0 || cny >= GRID_ROWS ||
            state.walls.some(w => w.x === cnx && w.y === cny) ||
            state.crates.some(c => c.x === cnx && c.y === cny) ||
            (state.door.x === cnx && state.door.y === cny && !state.door.open);

        if (!blocked) {
            state.crates[crateIdx].x = cnx;
            state.crates[crateIdx].y = cny;
            state.player.x = nx;
            state.player.y = ny;
            draw();
        }
    } else {
        // Empty space or Door
        if (state.door.x === nx && state.door.y === ny && !state.door.open) return;
        
        state.player.x = nx;
        state.player.y = ny;
        draw();
    }
}

function pullLever() {
    const p = state.player;
    const l = state.lever;
    
    // Check adjacency (Manhattan distance = 1)
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    if (dist === 1) {
        l.active = !l.active;
        state.door.open = l.active;
        draw();
    }
}

window.addEventListener('keydown', (e) => {
    // Prevent scrolling
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
