<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Manifold: Life</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: rgba(20, 22, 28, 0.65);
            --border-light: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --accent-orange: #ff7b00;
            --accent-cyan: #00f2ff;
            --accent-purple: #9d00ff;
            --text-main: #ffffff;
            --text-dim: #8892b0;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            /* Subtle deep space vignette */
            background: radial-gradient(circle at center, #0f111a 0%, #000000 100%);
        }

        /* --- Canvas Area --- */
        .canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            z-index: 1;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Control Panel --- */
        .panel {
            width: 380px;
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid var(--border-light);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            height: 100%;
            z-index: 10;
            box-shadow: -20px 0 60px rgba(0,0,0,0.5);
            position: relative;
        }

        /* --- Typography --- */
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
            font-weight: 400;
        }

        /* --- Controls --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .label-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            font-weight: 600;
        }

        .label-value {
            font-size: 13px;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* --- Custom Sliders --- */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 0;
            height: 24px; /* larger hit area */
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            border: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px; /* Center on track */
            border: none;
            /* Dynamic gradient glow based on position logic via JS or CSS approximation */
            box-shadow: 0 0 0 2px rgba(0,0,0,0.5), 0 0 15px rgba(255, 123, 0, 0.6);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.15);
            box-shadow: 0 0 0 2px rgba(0,0,0,0.5), 0 0 25px rgba(255, 123, 0, 0.9);
        }

        /* Firefox support */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        input[type=range]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border: none;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.6);
            cursor: pointer;
        }

        /* --- Buttons --- */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-stack);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--border-highlight);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            background: linear-gradient(135deg, rgba(255, 123, 0, 0.15) 0%, rgba(157, 0, 255, 0.15) 100%);
            border: 1px solid rgba(255, 123, 0, 0.4);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 123, 0, 0.1);
        }

        button.primary:hover {
            background: linear-gradient(135deg, rgba(255, 123, 0, 0.25) 0%, rgba(157, 0, 255, 0.25) 100%);
            box-shadow: 0 0 30px rgba(255, 123, 0, 0.3);
            border-color: rgba(255, 123, 0, 0.8);
        }

        button.ghost {
            color: #ff6b6b;
            border-color: rgba(255, 100, 100, 0.1);
        }

        button.ghost:hover {
            background: rgba(255, 50, 50, 0.05);
            border-color: rgba(255, 100, 100, 0.4);
            color: #ff8888;
        }

        /* --- Stats --- */
        .stats {
            margin-top: auto;
            padding-top: 32px;
            border-top: 1px solid var(--border-light);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .stat-val {
            font-size: 32px;
            font-weight: 200;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            margin-top: 4px;
            font-weight: 600;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .panel { 
                width: 100%; 
                height: auto; 
                flex-direction: row; 
                flex-wrap: wrap; 
                padding: 24px; 
                gap: 24px; 
                border-left: none; 
                border-top: 1px solid var(--border-light);
                order: 2;
                background: rgba(10, 10, 15, 0.9);
            }
            .canvas-container { height: 60vh; order: 1; }
            .control-group { width: 100%; flex-direction: row; justify-content: space-between; gap: 16px; }
            .stats { width: 100%; margin-top: 0; border-top: none; padding-top: 0; }
            h1, .subtitle { display: none; }
            .btn-row { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="lifeCanvas"></canvas>
    </div>

    <div class="panel">
        <div>
            <h1>Manifold</h1>
            <p class="subtitle">High-density cellular automaton mapped to a spherical manifold.</p>
        </div>

        <div class="control-group">
            <div style="flex: 1;">
                <div class="label-row">
                    <span class="label-text">Evolution Speed</span>
                    <span class="label-value" id="speedVal">50%</span>
                </div>
                <input type="range" id="speedSlider" min="0" max="100" value="50">
            </div>
            
            <div style="flex: 1;">
                <div class="label-row">
                    <span class="label-text">Grid Density</span>
                    <span class="label-value" id="densityVal">High</span>
                </div>
                <input type="range" id="densitySlider" min="20" max="60" value="35">
            </div>
        </div>

        <div class="control-group" style="gap: 16px;">
            <div class="btn-row">
                <button class="primary" id="toggleBtn">Pause</button>
                <button id="resetBtn">Randomize</button>
            </div>
            <button class="ghost" id="clearBtn">Clear All</button>
        </div>

        <div class="stats">
            <div>
                <div class="stat-val" id="genCount">0</div>
                <div class="stat-label">Generations</div>
            </div>
            <div>
                <div class="stat-val" id="popCount">0</div>
                <div class="stat-label">Population</div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Visual Config
        const CONFIG = {
            gridResolution: 35, // Reduced slightly from 50 to allow higher density logic
            speed: 5, // Lower is faster (frames per step)
            glowIntensity: 20,
            cellSizeBase: 3.5 // Slightly larger for better visual impact
        };

        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellAge = []; // Age affects color (0-100+)
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        // Pre-computed sphere points
        let spherePoints = [];

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                // Map 0-100 to 20-1 frameskip
                CONFIG.speed = Math.max(1, 21 - Math.floor(val / 5));
                document.getElementById('speedVal').innerText = val + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                CONFIG.gridResolution = val;
                document.getElementById('densityVal').innerText = val < 40 ? "High" : "Ultra";
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                const btn = document.getElementById('toggleBtn');
                btn.innerText = isRunning ? "Pause" : "Resume";
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            centerX = width / 2;
            centerY = height / 2;
            // Sphere takes up about 60% of the smallest dimension
            radius = Math.min(width, height) * 0.35;
            
            if(grid.length > 0) {
                precomputePoints();
            }
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; // Wider grid for sphere
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            
            precomputePoints();
        }

        function precomputePoints() {
            spherePoints = [];
            for (let y = 0; y < rows; y++) {
                spherePoints[y] = [];
                for (let x = 0; x < cols; x++) {
                    const u = x / cols;
                    const v = y / rows;

                    // Spherical coordinates
                    const theta = u * 2 * Math.PI;
                    const phi = (v * Math.PI) - (Math.PI / 2);

                    const px = radius * Math.cos(phi) * Math.cos(theta);
                    const py = radius * Math.sin(phi);
                    const pz = radius * Math.cos(phi) * Math.sin(theta);

                    spherePoints[y][x] = { px, py, pz };
                }
            }
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // 45% density for initial random state
                    grid[y][x] = Math.random() > 0.55 ? 1 : 0; 
                    cellAge[y][x] = Math.random() * 100; 
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; // Reset age on birth
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += 1; // Age increment
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            // Update DOM only occasionally to save perf
            if (generation % 10 === 0) {
                document.getElementById('genCount').innerText = generation.toLocaleString();
                document.getElementById('popCount').innerText = population.toLocaleString();
            }
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.clearRect(0, 0, width, height);

            // Smooth rotation
            if (!isDragging) {
                targetRotationY += 0.003; 
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // 1. Draw Sphere Volume (Atmosphere & Shadow)
            
            // Outer Atmospheric Glow
            const outerGlow = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.3);
            outerGlow.addColorStop(0, 'rgba(0, 242, 255, 0)');
            outerGlow.addColorStop(0.7, 'rgba(100, 50, 255, 0.05)');
            outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = outerGlow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.4, 0, Math.PI * 2);
            ctx.fill();

            // Inner Shadow (creates volume)
            const innerShadow = ctx.createRadialGradient(centerX - radius*0.3, centerY - radius*0.3, radius * 0.1, centerX, centerY, radius);
            innerShadow.addColorStop(0, 'rgba(255,255,255,0.05)');
            innerShadow.addColorStop(0.4, 'rgba(0,0,0,0)');
            innerShadow.addColorStop(1, 'rgba(0,0,0,0.6)');

            ctx.fillStyle = innerShadow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // 2. Prepare cells for Z-sorting
            let renderList = [];
            
            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            const fov = 800;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Optimization: Only process active cells
                    if (grid[y][x] === 1) {
                        const pt = spherePoints[y][x];
                        
                        // Rotate Y
                        let x1 = pt.px * cosY - pt.pz * sinY;
                        let z1 = pt.px * sinY + pt.pz * cosY;
                        // Rotate X
                        let y2 = pt.py * cosX - z1 * sinX;
                        let z2 = pt.py * sinX + z1 * cosX;

                        // Perspective
                        const scale = fov / (fov + z2);
                        
                        // Culling (don't draw back)
                        if (scale < 0 || z2 > radius) continue;

                        const screenX = centerX + x1 * scale;
                        const screenY = centerY + y2 * scale;
                        
                        // --- REVAMPED COLOR PALETTE ---
                        // Map age to Hue: Young (Orange/Yellow) -> Old (Purple/Blue)
                        // 30 = Orange, 60 = Yellow, 260 = Purple, 290 = Blue
                        // We map 0-100 age to a hue range
                        const age = cellAge[y][x];
                        const hue = (30 + (age * 2.5)) % 360; 
                        
                        // --- DEPTH CUES ---
                        // z2 goes from -radius (front) to radius (back)
                        // Normalize to 0 (front) to 1 (back)
                        const depth = (z2 + radius) / (2 * radius); 
                        
                        // Brightness: Front is bright (1.0), Back is dim (0.2)
                        // We apply a curve to make the front pop more
                        const brightness = Math.pow(1.0 - depth, 0.5); 
                        
                        // Alpha: Front opaque, back transparent
                        const alpha = Math.max(0, 1.0 - (depth * 1.2)); 

                        renderList.push({
                            x: screenX,
                            y: screenY,
                            z: z2,
                            scale: scale,
                            hue: hue,
                            alpha: alpha,
                            brightness: brightness
                        });
                    }
                }
            }

            // Sort by Z (Painter's algorithm: draw back to front)
            renderList.sort((a, b) => b.z - a.z);

            // 3. Render
            // Use additive blending for neon look
            ctx.globalCompositeOperation = 'lighter';

            for (const cell of renderList) {
                const size = (CONFIG.cellSizeBase * cell.scale); 
                
                // Dynamic Color
                // Lightness boosted at front, darker at back
                // 50% base + 30% boost at front = 80%
                // 50% base + 0% boost at back = 50%
                const lightness = 40 + (cell.brightness * 40); 
                
                ctx.fillStyle = `hsla(${cell.hue}, 90%, ${lightness}%, ${cell.alpha})`;
                
                // Glow effect: Only on front-most cells to save performance
                // z2 is negative in front.
                if (cell.z < -radius * 0.2) {
                    ctx.shadowBlur = CONFIG.glowIntensity * cell.scale * cell.brightness;
                    ctx.shadowColor = `hsla(${cell.hue}, 90%, 60%, 0.6)`;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Reset Composite Operation
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;

            // 4. Rim Light (Atmospheric Edge)
            // Draw a thin bright ring around the edge to separate from background
            ctx.globalCompositeOperation = 'lighter';
            const rimGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.9, centerX, centerY, radius * 1.02);
            rimGrad.addColorStop(0, 'rgba(255,255,255,0)');
            rimGrad.addColorStop(0.8, 'rgba(100, 200, 255, 0.15)');
            rimGrad.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.fillStyle = rimGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.05, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, CONFIG.speed) === 0) {
                    update();
                }
            }
            
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
