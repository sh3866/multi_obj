<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Game of Life</title>
    <style>
        :root {
            --bg-color: #030305;
            --panel-bg: rgba(15, 15, 20, 0.4);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #00f2ff;
            --accent-secondary: #bd00ff;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Ambient Background */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #030305 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Layout */
        .canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Control Panel */
        .panel {
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--panel-border);
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            height: 100%;
            z-index: 10;
            box-shadow: -20px 0 60px rgba(0,0,0,0.5);
        }

        /* Typography */
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 280px;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .label-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .label-value {
            font-size: 12px;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            border: 2px solid rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Buttons */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-stack);
            text-align: center;
        }

        button:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.2);
        }

        button.primary:hover {
            box-shadow: 0 6px 25px rgba(0, 242, 255, 0.3);
            filter: brightness(1.1);
        }

        button.ghost {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.2);
            color: #ff8888;
        }
        
        button.ghost:hover {
            background: rgba(255, 100, 100, 0.05);
            border-color: rgba(255, 100, 100, 0.4);
        }

        /* Stats */
        .stats {
            margin-top: auto;
            padding-top: 32px;
            border-top: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 300;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 800px) {
            body { flex-direction: column; }
            .panel { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; padding: 20px; gap: 20px; border-left: none; border-top: 1px solid var(--panel-border); }
            .control-group { width: 100%; }
            .stats { width: 100%; margin-top: 0; border-top: none; padding-top: 0; }
            h1, .description { display: none; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="canvas-container">
        <canvas id="lifeCanvas"></canvas>
    </div>

    <div class="panel">
        <div>
            <h1>Manifold</h1>
            <p class="description">A high-density cellular automaton simulation mapped to a 3D spherical manifold.</p>
        </div>

        <div class="control-group">
            <div>
                <div class="label-row">
                    <span class="label-text">Simulation Speed</span>
                    <span class="label-value" id="speedVal">60%</span>
                </div>
                <input type="range" id="speedSlider" min="0" max="20" value="10">
            </div>
            
            <div>
                <div class="label-row">
                    <span class="label-text">Grid Resolution</span>
                    <span class="label-value" id="densityVal">High</span>
                </div>
                <input type="range" id="densitySlider" min="20" max="60" value="40">
            </div>
        </div>

        <div class="control-group">
            <div class="btn-row">
                <button class="primary" id="toggleBtn">Pause</button>
                <button id="resetBtn">Randomize</button>
            </div>
            <button class="ghost" id="clearBtn">Clear All</button>
        </div>

        <div class="stats">
            <div>
                <div class="stat-val" id="genCount">0</div>
                <div class="stat-label">Generations</div>
            </div>
            <div>
                <div class="stat-val" id="popCount">0</div>
                <div class="stat-label">Population</div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 40, // Start high
            speed: 10, // frames per step
            evolutionRate: 0.5 // Color shift speed
        };

        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellAge = []; // Store age for coloring
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        // Pre-computed sphere points for performance
        let spherePoints = [];

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value; 
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                CONFIG.gridResolution = val;
                document.getElementById('densityVal').innerText = val < 35 ? "High" : "Ultra";
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
                document.getElementById('toggleBtn').classList.toggle('primary');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvas-container') || document.body;
            const rect = canvas.parentElement.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
            
            // Re-calculate 3D points if resolution hasn't changed, otherwise wait for grid create
            if(grid.length > 0) {
                precomputePoints();
            }
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            
            precomputePoints();
        }

        function precomputePoints() {
            // We map the 2D grid to 3D sphere points
            // x = col, y = row
            spherePoints = [];
            for (let y = 0; y < rows; y++) {
                spherePoints[y] = [];
                for (let x = 0; x < cols; x++) {
                    const u = x / cols;
                    const v = y / rows;

                    // Spherical coordinates
                    const theta = u * 2 * Math.PI;
                    const phi = (v * Math.PI) - (Math.PI / 2);

                    const px = radius * Math.cos(phi) * Math.cos(theta);
                    const py = radius * Math.sin(phi);
                    const pz = radius * Math.cos(phi) * Math.sin(theta);

                    spherePoints[y][x] = { px, py, pz };
                }
            }
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() > 0.5 ? 1 : 0;
                    cellAge[y][x] = Math.random() * 10; 
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; // Reset age on birth
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            document.getElementById('genCount').innerText = generation.toLocaleString();
            document.getElementById('popCount').innerText = population.toLocaleString();
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.clearRect(0, 0, width, height);
            // Draw a subtle base to keep the dark feel
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);

            // Smooth rotation
            if (!isDragging) {
                targetRotationY += 0.003; 
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // Draw Sphere "Atmosphere"
            const grad = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.2);
            grad.addColorStop(0, 'rgba(0, 242, 255, 0.03)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.2, 0, Math.PI * 2);
            ctx.fill();

            // Prepare cells for Z-sorting
            let renderList = [];
            
            // Pre-calculate rotation matrix components
            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);
            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            const fov = 800;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        const pt = spherePoints[y][x];
                        
                        // Rotate Y
                        let x1 = pt.px * cosY - pt.pz * sinY;
                        let z1 = pt.px * sinY + pt.pz * cosY;
                        // Rotate X
                        let y2 = pt.py * cosX - z1 * sinX;
                        let z2 = pt.py * sinX + z1 * cosX;

                        // Perspective
                        const scale = fov / (fov + z2);
                        
                        // Culling (don't draw back)
                        if (scale < 0) continue;

                        const screenX = centerX + x1 * scale;
                        const screenY = centerY + y2 * scale;
                        
                        // Color Mapping (Vibrant Gradient)
                        // Map age to Hue: 260 (Purple) -> 180 (Cyan) -> 320 (Pink)
                        const ageNorm = (cellAge[y][x] % 100) / 100;
                        const hue = 260 - (ageNorm * 80) + (ageNorm * 100); // Cycle roughly
                        const sat = 100;
                        
                        // Depth-based brightness & alpha
                        // z2 goes from -radius (front) to radius (back)
                        const depth = (z2 + radius) / (2 * radius); // 0 (front) to 1 (back)
                        const brightness = 1.0 - (depth * 0.6); // Back is darker
                        const alpha = 1.0 - (depth * 0.8); // Back is transparent

                        renderList.push({
                            x: screenX,
                            y: screenY,
                            z: z2,
                            scale: scale,
                            hue: hue,
                            alpha: alpha,
                            brightness: brightness
                        });
                    }
                }
            }

            // Sort by Z (Painter's algorithm: draw back to front)
            // z2 is negative in front, positive in back. So we sort descending (highest Z first).
            renderList.sort((a, b) => b.z - a.z);

            // Render with additive blending for glow
            ctx.globalCompositeOperation = 'lighter';

            for (const cell of renderList) {
                const size = (radius * 0.04) * cell.scale; // Cell size
                
                // Dynamic Color
                ctx.fillStyle = `hsla(${cell.hue}, ${100}%, ${60 * cell.brightness + 20}%, ${cell.alpha})`;
                
                // Glow effect for cells closer to front
                if (cell.z < -radius * 0.2) {
                    ctx.shadowBlur = 15 * cell.scale;
                    ctx.shadowColor = `hsla(${cell.hue}, 100%, 50%, 0.6)`;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.arc(cell.x, cell.y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Reset Composite Operation
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
