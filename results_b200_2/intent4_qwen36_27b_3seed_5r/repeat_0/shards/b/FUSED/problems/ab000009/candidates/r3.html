<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grandmaster Chess</title>
<style>
  :root {
    /* Palette: Deep Slate & Cream */
    --bg-body: #121214;
    --bg-panel: #1c1c1e;
    --bg-panel-border: #2c2c2e;
    
    /* Board Colors - High Contrast Dark Mode */
    --board-light: #e8e6d3; /* Cream/Off-white */
    --board-dark: #5d5c56;  /* Deep Slate/Charcoal */
    
    /* UI Accents */
    --accent-color: #4a90e2;
    --highlight-move: rgba(74, 144, 226, 0.25); /* Subtle blue overlay */
    --highlight-selected: rgba(255, 255, 255, 0.25);

    /* Typography */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Consolas", "Monaco", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-body);
    color: #d1d5db;
    font-family: var(--font-sans);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    display: flex;
    gap: 40px;
    padding: 40px;
    max-width: 1200px;
    width: 100%;
    height: 95vh;
    align-items: center;
  }

  /* --- Left Side: Board --- */
  .board-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .board-frame {
    position: relative;
    /* Subtle border to frame the board */
    border: 8px solid var(--bg-panel); 
    border-radius: 4px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    background-color: var(--bg-panel);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 640px;
    height: 640px;
    position: relative;
    user-select: none;
    overflow: hidden;
  }

  .square {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .square.light { background-color: var(--board-light); }
  .square.dark { background-color: var(--board-dark); }
  
  /* Highlight States */
  .square.selected { background-color: var(--highlight-selected) !important; }
  .square.last-move { background-color: var(--highlight-move) !important; }

  /* Coordinate Labels */
  .coord {
    position: absolute;
    font-size: 13px;
    font-weight: 600;
    pointer-events: none;
    font-family: var(--font-mono); /* Monospaced for alignment */
    line-height: 1;
    z-index: 1;
  }
  
  /* Color logic for coordinates */
  .square.light .coord { color: var(--board-dark); opacity: 0.8; }
  .square.dark .coord { color: var(--board-light); opacity: 0.7; }
  
  .coord.rank { top: 5px; left: 5px; }
  .coord.file { bottom: 4px; right: 5px; }

  /* --- Pieces --- */
  .piece {
    width: 85%;
    height: 85%;
    cursor: pointer;
    z-index: 2;
    transition: transform 0.1s ease-out;
    /* Ensure SVGs look crisp */
    shape-rendering: geometricPrecision;
  }
  
  .piece:hover {
    transform: translateY(-3px);
  }

  /* SVG Styling */
  .piece svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* White Pieces: Solid White, Drop Shadow */
  .piece.white svg path, .piece.white svg circle, .piece.white svg polygon, .piece.white svg ellipse {
    fill: #ffffff;
    stroke: none;
  }
  .piece.white {
    filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));
  }

  /* Black Pieces: Solid Dark Charcoal, Drop Shadow */
  .piece.black svg path, .piece.black svg circle, .piece.black svg polygon, .piece.black svg ellipse {
    fill: #1f2024; /* Very dark charcoal, not pure black */
    stroke: none;
  }
  .piece.black {
    filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3));
  }

  /* --- Right Side: Sidebar --- */
  .sidebar {
    flex: 1;
    max-width: 360px;
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-border);
    border-radius: 16px;
    padding: 32px;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  /* Header Area */
  .header {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .title-group h1 {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #6b7280; /* Muted header */
    margin-bottom: 8px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .turn-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.2);
  }
  .turn-indicator.black-turn {
    background: #1f2024;
    box-shadow: 0 0 0 2px #6b7280;
  }

  /* Move History */
  .move-history-container {
    flex: 1;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.03);
    position: relative;
  }

  /* Empty State Placeholder */
  .history-placeholder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #4b5563;
    font-size: 13px;
    font-style: italic;
    pointer-events: none;
    text-align: center;
    opacity: 0.6;
  }

  .history-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #6b7280;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .move-history {
    flex: 1;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 15px;
    color: #9ca3af;
    display: flex;
    flex-direction: column;
  }

  .move-row {
    display: flex;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.02);
  }
  .move-row:last-child { border-bottom: none; }

  .move-num {
    width: 32px;
    color: #4b5563;
    font-size: 13px;
    flex-shrink: 0;
  }
  
  .move-cell {
    flex: 1;
    padding: 2px 0;
    cursor: default;
    transition: color 0.2s;
    color: #d1d5db;
  }
  .move-cell:hover { color: #fff; }
  .move-cell.active { color: var(--accent-color); font-weight: 700; }

  /* Controls */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: #d1d5db;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }

  button:active {
    transform: translateY(1px);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  @media (max-width: 1100px) {
    .container { flex-direction: column; height: auto; overflow-y: auto; padding: 20px; gap: 30px; }
    .board { width: 100%; height: auto; aspect-ratio: 1/1; }
    .sidebar { width: 100%; min-height: 300px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="board-area">
    <div class="board-frame">
      <div class="board" id="board">
        <!-- Grid generated by JS -->
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="header">
      <div class="title-group">
        <h1>Grandmaster</h1>
        <div class="status-pill">
          <div class="turn-indicator" id="turn-dot"></div>
          <span id="status-text">White to move</span>
        </div>
      </div>
    </div>

    <div class="move-history-container">
      <div class="history-label">Move History</div>
      <div class="history-placeholder" id="history-placeholder">No moves yet</div>
      <div class="move-history" id="move-list">
        <!-- Moves injected via JS -->
      </div>
    </div>

    <div class="controls">
      <button onclick="resetGame()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        New Game
      </button>
      <button onclick="alert('Analysis engine offline')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Flip Board
      </button>
    </div>
  </div>
</div>

<script>
  // --- SVG Assets (Classic Staunton Style) ---
  // Clean paths designed for high fidelity rendering
  const pieceAssets = {

    b: {

    }
  };

  // --- Game Logic & State ---
  let boardState = [
    ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'],
    ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
    ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']
  ];

  let turn = 'w'; // 'w' or 'b'
  let moveCount = 1; 
  let selectedSquare = null;
  const boardEl = document.getElementById('board');
  const moveListEl = document.getElementById('move-list');
  const statusText = document.getElementById('status-text');
  const turnDot = document.getElementById('turn-dot');
  const placeholder = document.getElementById('history-placeholder');

  // --- Initialization ---
  function initGame() {
    // Clear History
    moveListEl.innerHTML = '';
    placeholder.style.display = 'block';
    
    renderBoard();
    updateStatus();
  }

  // --- Rendering ---
  function renderBoard() {
    boardEl.innerHTML = '';
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = document.createElement('div');
        const isLight = (r + c) % 2 === 0;
        square.className = `square ${isLight ? 'light' : 'dark'}`;
        square.dataset.r = r;
        square.dataset.c = c;
        
        // Coordinates (only on edges)
        if (c === 0) {
          const rank = document.createElement('span');
          rank.className = 'coord rank';
          rank.innerText = 8 - r;
          square.appendChild(rank);
        }
        if (r === 7) {
          const file = document.createElement('span');
          file.className = 'coord file';
          file.innerText = files[c];
          square.appendChild(file);
        }

        // Highlight selection
        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
          square.classList.add('selected');
        }

        // Render Piece
        const pieceCode = boardState[r][c];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieceAssets[color][type];
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handleSquareClick(r, c);
          };
          square.appendChild(pieceEl);
        }
        
        // Click on square
        square.onclick = () => handleSquareClick(r, c);
        
        boardEl.appendChild(square);
      }
    }
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  // --- Interaction ---
  function handleSquareClick(r, c) {
    const pieceCode = boardState[r][c];
    const isOwnPiece = pieceCode && pieceCode[0] === turn;

    // 1. If clicking own piece, select it
    if (isOwnPiece) {
      selectedSquare = { r, c };
      renderBoard();
      return;
    }

    // 2. If piece selected and clicking empty or enemy, attempt move
    if (selectedSquare) {
      // Visual move execution
      const fromR = selectedSquare.r;
      const fromC = selectedSquare.c;
      const movingPiece = boardState[fromR][fromC];
      
      // Generate pseudo-notation
      const typeChar = movingPiece[1].toUpperCase();
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const capture = pieceCode ? 'x' : '';
      const notation = `${typeChar === 'P' ? '' : typeChar}${capture}${files[c]}${8-r}`;

      // Update Board Array
      boardState[r][c] = movingPiece;
      boardState[fromR][fromC] = '';
      
      // Clear selection
      selectedSquare = null;
      
      // Hide placeholder
      placeholder.style.display = 'none';

      // Highlight last move
      renderBoard();
      // Add highlight class manually after render
      const squares = document.querySelectorAll('.square');
      squares[fromR * 8 + fromC].classList.add('last-move');
      squares[r * 8 + c].classList.add('last-move');

      // Add to history
      if (turn === 'w') {
        addMoveToHistoryUI(moveCount + '.', notation, '');
      } else {
        // Update last row
        const lastRow = moveListEl.lastElementChild;
        if(lastRow) {
            lastRow.querySelector('.b').innerText = notation;
            lastRow.querySelector('.b').classList.add('active');
            lastRow.querySelector('.w').classList.remove('active');
            moveCount++;
        }
      }

      // Switch Turn
      turn = turn === 'w' ? 'b' : 'w';
      updateStatus();
    }
  }

  function addMoveToHistoryUI(num, wMove, bMove) {
    const row = document.createElement('div');
    row.className = 'move-row';
    row.innerHTML = `
      <div class="move-num">${num}</div>
      <div class="move-cell w ${!bMove ? 'active' : ''}">${wMove}</div>
      <div class="move-cell b">${bMove}</div>
    `;
    moveListEl.appendChild(row);
    moveListEl.scrollTop = moveListEl.scrollHeight;
  }

  function resetGame() {
    location.reload();
  }

  // Start
  initGame();

</script>
</body>
</html>
