<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grandmaster Chess Interface</title>
<style>
  :root {
    --bg-color: #1e2124;
    --panel-bg: #282b30;
    --text-primary: #e0e0e0;
    --text-secondary: #9aa0a6;
    --accent: #d4af37; /* Muted Gold */
    --accent-dim: #8a701e;
    --board-light: #e8ebef;
    --board-dark: #7d8796;
    --highlight: rgba(212, 175, 55, 0.5);
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-main);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    display: flex;
    gap: 40px;
    padding: 20px;
    max-width: 1200px;
    width: 100%;
    height: 90vh;
    align-items: center;
  }

  /* --- Board Area --- */
  .board-wrapper {
    position: relative;
    padding: 15px;
    background: var(--panel-bg);
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .coordinates {
    position: absolute;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-around;
    width: 100%;
    bottom: 2px;
    left: 0;
    pointer-events: none;
  }
  
  .file-labels {
    position: absolute;
    bottom: -20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
  }
  
  .rank-labels {
    position: absolute;
    left: -20px;
    top: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 600px;
    height: 600px;
    border: 4px solid #15171a;
    user-select: none;
  }

  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .square.light { background-color: var(--board-light); color: var(--board-dark); }
  .square.dark { background-color: var(--board-dark); color: var(--board-light); }
  
  .square.last-move { background-color: var(--highlight) !important; }

  /* --- Pieces --- */
  .piece {
    width: 85%;
    height: 85%;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.3));
  }
  
  .piece:hover {
    transform: scale(1.1) translateY(-2px);
  }

  /* SVG Styling */
  .piece svg {
    width: 100%;
    height: 100%;
  }
  
  .piece.white svg path { fill: #fff; stroke: #000; stroke-width: 1.5px; stroke-linejoin: round; }
  .piece.black svg path { fill: #111; stroke: #fff; stroke-width: 1.5px; stroke-linejoin: round; }

  /* --- Side Panel --- */
  .sidebar {
    flex: 1;
    background: var(--panel-bg);
    border-radius: 8px;
    padding: 30px;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .header {
    margin-bottom: 30px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 20px;
  }

  h1 {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .status {
    font-size: 14px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .turn-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-primary);
    box-shadow: 0 0 8px var(--text-primary);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .turn-indicator.black-turn { background: #333; box-shadow: 0 0 8px #000; border: 1px solid #555; }

  .move-history {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 20px;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 4px;
  }

  .move-row {
    display: flex;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.02);
  }
  
  .move-row:nth-child(even) { background: rgba(255,255,255,0.02); }
  
  .move-num { width: 30px; color: var(--text-secondary); }
  .move-ply { flex: 1; cursor: pointer; }
  .move-ply:hover { color: var(--accent); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-primary);
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-main);
    font-size: 14px;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  button:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }
  
  button.primary {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #fff;
    grid-column: span 2;
  }
  
  button.primary:hover {
    background: var(--accent);
    color: #000;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  @media (max-width: 900px) {
    .container { flex-direction: column; height: auto; overflow-y: auto; }
    .board { width: 100%; height: auto; aspect-ratio: 1/1; }
    .sidebar { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="board-wrapper">
    <div class="rank-labels" id="rank-labels"></div>
    <div class="board" id="board"></div>
    <div class="file-labels" id="file-labels"></div>
  </div>

  <div class="sidebar">
    <div class="header">
      <h1>GRANDMASTER</h1>
      <div class="status">
        <div class="turn-indicator" id="turn-dot"></div>
        <span id="status-text">White to move</span>
      </div>
    </div>

    <div class="move-history" id="move-list">
      <!-- Moves injected via JS -->
    </div>

    <div class="controls">
      <button onclick="resetGame()">New Game</button>
      <button onclick="alert('Flip feature disabled in demo')">Flip Board</button>
      <button class="primary">Analyze Position</button>
    </div>
  </div>
</div>

<script>

    },
    b: {

      b: `<svg viewBox="0 0 45 45"><g fill="none" fill-rule="evenodd" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g fill="#111" stroke-linecap="butt"><path d="M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.38 0 10.11.48 13.5 1.45V30c0-2.59-1.68-5.57-4.5-7.75-1.05-.84-2.3-1.56-3.5-2.15-.91-.45-1.68-.78-2.5-1.1V13c0-1.1-.9-2-2-2h-3c-1.1 0-2 .9-2 2v2c-.82.32-1.59.65-2.5 1.1-1.2.59-2.45 1.31-3.5 2.15C10.68 24.43 9 27.41 9 30v6z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><path d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z"/></g><path d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5" stroke="#fff" stroke-linejoin="miter"/></g></svg>`,

    }
  };

  // --- Game State ---
  let boardState = [
    ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'],
    ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
    ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']
  ];

  let turn = 'w';
  let moveCount = 1;
  const moveList = document.getElementById('move-list');
  const statusText = document.getElementById('status-text');
  const turnDot = document.getElementById('turn-dot');

  // --- Initialization ---
  function initBoard() {
    const boardEl = document.getElementById('board');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    
    // Render Board Grid
    boardEl.innerHTML = '';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = document.createElement('div');
        square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
        square.dataset.r = r;
        square.dataset.c = c;
        
        const pieceCode = boardState[r][c];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieces[color][type];
          
          // Simple Click Interaction
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handlePieceClick(r, c, color, type);
          };
          
          square.appendChild(pieceEl);
        }
        
        square.onclick = () => {
           // Click on empty square logic could go here
        };
        
        boardEl.appendChild(square);
      }
    }

    // Render Coordinates
    const fileLabels = document.getElementById('file-labels');
    const rankLabels = document.getElementById('rank-labels');
    fileLabels.innerHTML = '';
    rankLabels.innerHTML = '';
    files.forEach(f => {
      const span = document.createElement('span');
      span.innerText = f;
      fileLabels.appendChild(span);
    });
    for(let i=8; i>0; i--) {
      const span = document.createElement('span');
      span.innerText = i;
      rankLabels.appendChild(span);
    }
  }

  // --- Logic ---
  function handlePieceClick(r, c, color, type) {
    if (color !== (turn === 'w' ? 'w' : 'b')) return; // Not your turn

    // Visual Feedback: Highlight clicked piece (simplified for this demo)
    const squares = document.querySelectorAll('.square');
    squares.forEach(sq => sq.classList.remove('last-move'));
    const currentSq = squares[r * 8 + c];
    currentSq.classList.add('last-move');

    // Simulate a move for visual effect (random empty-ish move)
    // In a real app, this would validate moves.
    // Here we just update the UI to look like a game is in progress.
    
    // Random target square nearby
    let tr = r + (Math.random() > 0.5 ? 1 : -1);
    let tc = c + (Math.random() > 0.5 ? 1 : -1);
    
    // Bounds check
    if (tr < 0 || tr > 7 || tc < 0 || tc > 7) return;

    // Update State
    const targetCode = boardState[tr][tc];
    boardState[tr][tc] = boardState[r][c];
    boardState[r][c] = '';
    
    // Generate notation (Simplified)
    const pieceName = type === 'p' ? '' : type.toUpperCase();
    const capture = targetCode ? 'x' : '';
    const notation = `${pieceName}${capture}${String.fromCharCode(97+tc)}${8-tr}`;
    
    addMoveToHistory(notation);
    
    // Switch Turn
    turn = turn === 'w' ? 'b' : 'w';
    updateStatus();
    initBoard(); // Re-render
  }

  function addMoveToHistory(notation) {
    if (turn === 'b') {
      // White just moved
      const row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = `
        <div class="move-num">${moveCount}.</div>
        <div class="move-ply">${notation}</div>
        <div class="move-ply" id="last-black"></div>
      `;
      moveList.appendChild(row);
    } else {
      // Black just moved
      const lastRow = moveList.lastElementChild;
      if (lastRow) {
        lastRow.querySelector('#last-black').innerText = notation;
        moveCount++;
      }
    }
    moveList.scrollTop = moveList.scrollHeight;
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  function resetGame() {
    location.reload();
  }

  // Start
  initBoard();
