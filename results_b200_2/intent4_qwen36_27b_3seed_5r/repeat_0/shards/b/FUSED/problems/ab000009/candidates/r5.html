<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Interface</title>
<style>
  :root {
    /* Palette: Slate Blue & Crisp White (Refined) */
    --bg-body: #0f1115; /* Deep, rich background */
    --bg-panel: #1c1f26; /* Slightly lighter for cards */
    --bg-panel-border: #2d323e;
    --bg-history: #16181d; /* Darker inset for history */
    
    /* Board Colors */
    --board-light: #E2E8F0; /* Crisp off-white */
    --board-dark: #475569;  /* Muted slate blue */
    
    /* UI Accents */
    --accent-color: #3b82f6; /* Bright blue for active states */
    --highlight-move: rgba(59, 130, 246, 0.25); /* Blue tint overlay */
    --highlight-selected: rgba(255, 255, 255, 0.4);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;

    /* Typography */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-serif: "Georgia", "Times New Roman", serif;
    --font-mono: "SF Mono", "Menlo", "Consolas", "Monaco", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-body);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    display: flex;
    gap: 40px;
    padding: 40px;
    max-width: 1200px;
    width: 100%;
    height: 95vh;
    align-items: center;
    justify-content: center;
  }

  /* --- Board Area --- */
  .board-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Ensure area matches sidebar height implicitly via flex alignment */
  }

  /* Artifact Frame */
  .board-frame {
    position: relative;
    padding: 16px; 
    background: linear-gradient(145deg, #2a2e38, #1a1d24);
    border-radius: 4px; /* Crisp corners */
    box-shadow: 
      0 1px 1px rgba(255,255,255,0.05), /* Top highlight */
      0 20px 50px -10px rgba(0, 0, 0, 0.7); /* Deep shadow */
    border: 1px solid #333842;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 640px;
    height: 640px;
    position: relative;
    user-select: none;
    border: 2px solid #0f1115; /* Inner border */
  }

  .square {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Subtle texture via CSS */
    background-image: linear-gradient(45deg, rgba(0,0,0,0.03) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.03) 75%, rgba(0,0,0,0.03)), 
                      linear-gradient(45deg, rgba(0,0,0,0.03) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.03) 75%, rgba(0,0,0,0.03));
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
  }

  .square.light { 
    background-color: var(--board-light); 
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }
  .square.dark { 
    background-color: var(--board-dark);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }
  
  /* Highlight States */
  .square.selected { background-color: var(--highlight-selected) !important; }
  .square.last-move { background-color: var(--highlight-move) !important; }

  /* Coordinate Labels */
  .coord {
    position: absolute;
    font-size: 11px;
    font-weight: 800;
    pointer-events: none;
    font-family: var(--font-ui); /* Modern sans for coords */
    line-height: 1;
    z-index: 1;
    opacity: 0.7;
  }
  
  /* High contrast logic */
  .square.light .coord { color: var(--board-dark); }
  .square.dark .coord { color: var(--board-light); }
  
  .coord.rank { top: 6px; left: 6px; }
  .coord.file { bottom: 5px; right: 6px; }

  /* --- Pieces --- */
  .piece {
    width: 85%;
    height: 85%;
    cursor: pointer;
    z-index: 2;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    /* Remove drop-shadow filter for cleaner look, rely on SVG stroke/fill */
  }
  
  .piece:hover {
    transform: translateY(-4px) scale(1.05);
  }

  .piece svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    /* Add a very subtle inner shadow effect via CSS filter on the SVG itself if desired, 
       but standard SVG styling is cleaner. */
  }

  /* White Pieces */
  .piece.white svg path, .piece.white svg circle, .piece.white svg polygon, .piece.white svg ellipse {
    fill: #F8FAFC;
    stroke: #1e293b;
    stroke-width: 1.5px;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  
  /* Black Pieces */
  .piece.black svg path, .piece.black svg circle, .piece.black svg polygon, .piece.black svg ellipse {
    fill: #0f172a;
    stroke: #f1f5f9;
    stroke-width: 1.5px;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  /* --- Sidebar --- */
  .sidebar {
    width: 360px;
    height: 688px; /* Matches board frame: 640px + 16px padding * 2 + 2px border */
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-border);
    border-radius: 12px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  /* Header Area */
  .header {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--bg-panel-border);
    padding-bottom: 20px;
  }

  .title-group h1 {
    font-family: var(--font-serif); /* Serif for headers */
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    margin: 0;
  }
  
  .subtitle {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-top: 4px;
    font-weight: 600;
  }

  /* Status Indicator */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.03);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .turn-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #F8FAFC;
    border: 2px solid #1e293b;
    transition: all 0.3s ease;
  }
  .turn-indicator.black-turn {
    background: #0f172a;
    border-color: #f1f5f9;
  }

  /* Move History */
  .move-history-container {
    flex: 1;
    background: var(--bg-history);
    border-radius: 8px;
    padding: 0;
    margin-bottom: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--bg-panel-border);
    position: relative;
  }

  .history-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin: 0;
    padding: 12px 16px;
    font-weight: 700;
    background: rgba(0,0,0,0.1);
    border-bottom: 1px solid var(--bg-panel-border);
  }

  .history-placeholder {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #475569;
    font-size: 13px;
    font-style: italic;
    pointer-events: none;
    text-align: center;
    opacity: 0.8;
    width: 100%;
  }

  .move-history {
    flex: 1;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    padding: 8px 0;
  }

  .move-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr;
    padding: 4px 16px;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.02);
  }
  .move-row:last-child { border-bottom: none; }

  .move-num {
    color: #475569;
    font-size: 13px;
    font-family: var(--font-ui);
    font-weight: 600;
  }
  
  .move-cell {
    padding: 4px 8px;
    cursor: default;
    transition: color 0.2s, background 0.2s;
    border-radius: 4px;
    color: var(--text-primary);
  }
  .move-cell:hover { background: rgba(255,255,255,0.05); }
  .move-cell.active { color: var(--accent-color); background: rgba(59, 130, 246, 0.1); }

  /* Controls */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--bg-panel-border);
    color: var(--text-primary);
    padding: 12px;
    border-radius: 8px; /* Match sidebar radius slightly tighter */
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  @media (max-width: 1100px) {
    .container { flex-direction: column; height: auto; overflow-y: auto; padding: 20px; gap: 30px; }
    .board { width: 100%; height: auto; aspect-ratio: 1/1; }
    .sidebar { width: 100%; height: auto; min-height: 400px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="board-area">
    <div class="board-frame">
      <div class="board" id="board">
        <!-- Grid generated by JS -->
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="header">
      <div class="title-group">
        <h1>Chess</h1>
        <div class="subtitle">Game Mode</div>
      </div>
      <div class="status-pill">
        <div class="turn-indicator" id="turn-dot"></div>
        <span id="status-text">White to move</span>
      </div>
    </div>

    <div class="move-history-container">
      <div class="history-label">Move History</div>
      <div class="history-placeholder" id="history-placeholder">Moves will appear here</div>
      <div class="move-history" id="move-list">
        <!-- Moves injected via JS -->
      </div>
    </div>

    <div class="controls">
      <button onclick="resetGame()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        New Game

      <button onclick="flipBoard()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        Flip Board
      </button>
    </div>
  </div>
</div>

        ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
        ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']
    ];

    renderBoard();
    updateStatus();
  }

  // --- Rendering ---
  function renderBoard() {
    boardEl.innerHTML = '';
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    
    // Loop based on orientation
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const actualR = isFlipped ? 7 - r : r;
        const actualC = isFlipped ? 7 - c : c;
        
        const square = document.createElement('div');
        const isLight = (actualR + actualC) % 2 === 0;
        square.className = `square ${isLight ? 'light' : 'dark'}`;
        square.dataset.r = actualR;
        square.dataset.c = actualC;
        
        // Coordinates
        if (c === 0) {
          const rank = document.createElement('span');
          rank.className = 'coord rank';
          rank.innerText = isFlipped ? actualR + 1 : 8 - actualR;
          square.appendChild(rank);
        }
        if (r === 7) {
          const file = document.createElement('span');
          file.className = 'coord file';
          file.innerText = isFlipped ? files[7 - actualC] : files[actualC];
          square.appendChild(file);
        }

        // Highlight selection
        if (selectedSquare && selectedSquare.r === actualR && selectedSquare.c === actualC) {
          square.classList.add('selected');
        }

        // Highlight last move
        if (lastMove) {
          if ((lastMove.from.r === actualR && lastMove.from.c === actualC) ||
              (lastMove.to.r === actualR && lastMove.to.c === actualC)) {
            square.classList.add('last-move');
          }
        }

        // Render Piece
        const pieceCode = boardState[actualR][actualC];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieceAssets[color][type];
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handleSquareClick(actualR, actualC);
          };
          square.appendChild(pieceEl);
        }
        
        // Click on square
        square.onclick = () => handleSquareClick(actualR, actualC);
        
        boardEl.appendChild(square);
      }
    }
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  // --- Interaction ---
  function handleSquareClick(r, c) {
    const pieceCode = boardState[r][c];
    const isOwnPiece = pieceCode && pieceCode[0] === turn;

    // 1. If clicking own piece, select it
    if (isOwnPiece) {
      selectedSquare = { r, c };
      renderBoard();
      return;
    }

    // 2. If piece selected and clicking empty or enemy, attempt move
    if (selectedSquare) {
      // Visual move execution
      const fromR = selectedSquare.r;
      const fromC = selectedSquare.c;
      const movingPiece = boardState[fromR][fromC];
      
      // Generate pseudo-notation
      const typeChar = movingPiece[1].toUpperCase();
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const capture = pieceCode ? 'x' : '';
      const notation = `${typeChar === 'P' ? '' : typeChar}${capture}${files[c]}${8-r}`;

      // Update Board Array
      boardState[r][c] = movingPiece;
      boardState[fromR][fromC] = '';
      
      // Update last move state
      lastMove = { from: {r: fromR, c: fromC}, to: {r: r, c: c} };
      
      // Clear selection
      selectedSquare = null;
      
      // Hide placeholder
      placeholder.style.display = 'none';

      // Add to history
      if (turn === 'w') {
        addMoveToHistoryUI(moveCount + '.', notation, '');
      } else {
        // Update last row
        const lastRow = moveListEl.lastElementChild;
        if(lastRow) {
            lastRow.querySelector('.b').innerText = notation;
            lastRow.querySelector('.b').classList.add('active');
            lastRow.querySelector('.w').classList.remove('active');
            moveCount++;
        }
      }

      // Switch Turn
      turn = turn === 'w' ? 'b' : 'w';
      updateStatus();
      renderBoard();
    }
  }

  function addMoveToHistoryUI(num, wMove, bMove) {
    const row = document.createElement('div');
    row.className = 'move-row';
    row.innerHTML = `
      <div class="move-num">${num}</div>
      <div class="move-cell w ${!bMove ? 'active' : ''}">${wMove}</div>
      <div class="move-cell b">${bMove}</div>
    `;
    moveListEl.appendChild(row);
    moveListEl.scrollTop = moveListEl.scrollHeight;
  }
  
  function flipBoard() {
      isFlipped = !isFlipped;
      renderBoard();
  }

  function resetGame() {
    isFlipped = false;
    initGame();
  }

  // Start
  initGame();

</script>
</body>
