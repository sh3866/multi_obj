<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cosmic Collector: Sector 7</title>
<style>
  :root {
    --bg-deep: #050510;
    --accent-cyan: #00f0ff;
    --accent-purple: #b026ff;
    --accent-pink: #ff2a6d;
    --glass-border: rgba(255, 255, 255, 0.15);
    --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: #000;
    color: #fff;
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- MAIN CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 500px;
    max-height: 950px;
    background: radial-gradient(ellipse at 50% 0%, #1a1a3a 0%, #09091a 50%, #000000 100%);
    overflow: hidden;
    box-shadow: 0 0 100px rgba(100, 50, 200, 0.15);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 94vh;
      border-radius: 32px;
      border: 1px solid rgba(255,255,255,0.05);
    }
  }

  /* --- PARALLAX LAYERS --- */
  .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Layer 1: Deep Nebula (CSS) */
  .nebula-layer { z-index: 1; opacity: 0.7; mix-blend-mode: screen; }
  
  .nebula-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    animation: drift 40s infinite alternate ease-in-out;
  }
  
  .blob-1 { width: 70vw; height: 70vw; background: #4b0082; top: -20%; left: -20%; animation-duration: 45s; }
  .blob-2 { width: 60vw; height: 60vw; background: #005f73; bottom: -20%; right: -20%; animation-duration: 55s; animation-direction: alternate-reverse; }
  .blob-3 { width: 50vw; height: 50vw; background: #9d0208; top: 30%; left: 20%; opacity: 0.3; filter: blur(90px); animation: pulse 25s infinite ease-in-out; }

  /* Layer 2: Canvas (Stars) */
  #bg-canvas { z-index: 2; }

  /* Layer 3: Game Canvas */
  #gameCanvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: none; }

  /* Layer 4: UI */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* --- HUD --- */
  .hud-top {
    padding: 40px 28px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
  }

  .title-group h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .title-group span {
    font-size: 11px;
    color: var(--accent-cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.9;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  }

  .score-pill {
    background: rgba(10, 15, 30, 0.4);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 10px 20px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }

  .score-icon { 
    color: var(--accent-pink); 
    filter: drop-shadow(0 0 6px var(--accent-pink));
    stroke-width: 2px;
  }
  
  .score-val { 
    font-weight: 800; 
    font-variant-numeric: tabular-nums; 
    font-size: 22px; 
    letter-spacing: 1px;
    font-family: 'Courier New', Courier, monospace; /* Monospace for game feel */
  }

  /* --- CONTROLS --- */
  .controls-bottom {
    padding: 32px 28px 56px;
    pointer-events: auto;
    display: flex;
    justify-content: center;
  }

  .collection-btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-top: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    height: 72px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  /* Neon Glow Effect */
  .collection-btn::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: linear-gradient(45deg, var(--accent-cyan), transparent, var(--accent-purple));
    z-index: -1;
    opacity: 0.5;
    filter: blur(10px);
    transition: opacity 0.3s;
  }

  .collection-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 15px 50px rgba(0, 242, 255, 0.15);
  }
  
  .collection-btn:hover::after { opacity: 0.8; }
  
  .collection-btn:active { transform: scale(0.97); }

  /* --- ANIMATIONS --- */
  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, 60px) scale(1.1); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.2); }
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Layer 1: Deep Atmosphere -->
  <div class="layer nebula-layer">
    <div class="nebula-blob blob-1"></div>
    <div class="nebula-blob blob-2"></div>
    <div class="nebula-blob blob-3"></div>
  </div>

  <!-- Layer 2: Stars (Canvas) -->
  <canvas id="bg-canvas" class="layer"></canvas>

  <!-- Layer 3: Game (Canvas) -->
  <canvas id="gameCanvas" class="layer"></canvas>

  <!-- Layer 4: UI -->
  <div class="layer ui-layer">
    <div class="hud-top">
      <div class="title-group">
        <h1>Cosmic Collector</h1>
        <span>Sector 7 &middot; Live</span>
      </div>
      <div class="score-pill">
        <svg class="score-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        </svg>
        <span class="score-val" id="score">00</span>
      </div>
    </div>

    <div class="controls-bottom">
      <button class="collection-btn" aria-label="View Collection">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        View Collection
      </button>
    </div>
  </div>
</div>

<script>
/**
 * COSMIC COLLECTOR - Visual Logic
 */

const gameCanvas = document.getElementById('gameCanvas');
const gameCtx = gameCanvas.getContext('2d');
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const scoreEl = document.getElementById('score');

// State
let width, height;
let dpr = window.devicePixelRatio || 1;
let score = 0;
let lastTime = 0;

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- BACKGROUND STARS ---
const stars = [];
function initStars() {
  stars.length = 0;
  // More stars, varied sizes
  for(let i=0; i<200; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2.5, // Larger max size
      alpha: Math.random(),
      speed: Math.random() * 0.1 + 0.02,
      phase: Math.random() * Math.PI * 2,
      depth: Math.random() // For parallax
    });
  }
}

function drawBackground(time) {
  bgCtx.clearRect(0, 0, width, height);
  
  stars.forEach(star => {
    // Twinkle
    star.alpha += Math.sin(time * 0.002 + star.phase) * 0.015;
    if(star.alpha < 0.1) star.alpha = 0.1;
    if(star.alpha > 1) star.alpha = 1;

    // Parallax movement based on player movement (subtle)
    const px = (player.x - width/2) * 0.02 * star.depth;
    const py = (player.y - height/2) * 0.02 * star.depth;

    bgCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    bgCtx.beginPath();
    bgCtx.arc(star.x + px, star.y + py, star.size, 0, Math.PI * 2);
    bgCtx.fill();
  });
}

// --- ENTITIES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.015, 0.03);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(2, 8);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.94; 
    this.vy *= 0.94;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    const typeRoll = Math.random();
    if (typeRoll < 0.33) {
      this.color = { h: 185, s: 100, l: 60 }; // Cyan
      this.type = 'spirit';
    } else if (typeRoll < 0.66) {
      this.color = { h: 270, s: 80, l: 65 }; // Purple
      this.type = 'jelly';
    } else {
      this.color = { h: 330, s: 100, l: 60 }; // Pink
      this.type = 'shard';
    }
    this.reset();
  }

  reset() {
    // Spawn off-screen
    const side = Math.floor(Math.random() * 4);
    if(side === 0) { this.x = -100; this.y = random(0, height); }
    else if(side === 1) { this.x = width + 100; this.y = random(0, height); }
    else if(side === 2) { this.x = random(0, width); this.y = -100; }
    else { this.x = random(0, width); this.y = height + 100; }
    
    // Critique: Scale up creatures
    this.baseRadius = random(28, 40); 
    
    const targetX = random(width * 0.15, width * 0.85);
    const targetY = random(height * 0.15, height * 0.85);
    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    
    this.speed = random(0.6, 1.5);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.02, 0.05);
    this.wobbleAmp = random(1, 3);
    this.rotAngle = 0;
    this.rotSpeed = random(-0.02, 0.02);
    
    this.history = [];
    this.maxHistory = 12;
  }

  update(time) {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.rotAngle += this.rotSpeed;

    if (Math.random() > 0.4) {
      this.history.push({x: this.x, y: this.y, r: this.baseRadius * 0.7});
      if(this.history.length > this.maxHistory) this.history.shift();
    }

    if (this.x < -300 || this.x > width + 300 || this.y < -300 || this.y > height + 300) {
      this.reset();
    }
  }

  draw(ctx, time) {
    const pulse = 1 + Math.sin(time * 0.005) * 0.05; // Subtle breathing
    const r = this.baseRadius * pulse;

    // Draw Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l, 0.2);
      ctx.lineWidth = r * 0.6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotAngle);

    // Glow Aura
    const grd = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.5);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.3, hsl(this.color.h, this.color.s, this.color.l));
    grd.addColorStop(1, hsl(this.color.h, this.color.s, this.color.l, 0));

    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Draw Shape based on type
    ctx.fillStyle = hsl(this.color.h, this.color.s, 95, 0.95);
    
    if (this.type === 'jelly') {
      // Jellyfish - distinct face
      ctx.beginPath();
      ctx.arc(0, -r*0.2, r, Math.PI, 0); // Dome
      ctx.bezierCurveTo(r, r*0.5, -r, r*0.5, -r, -r*0.2); // Body
      ctx.fill();
      
      // Tentacles
      ctx.strokeStyle = hsl(this.color.h, this.color.s, 90, 0.9);
      ctx.lineWidth = 4;
      ctx.beginPath();
      for(let i=-1; i<=1; i+=2) {
        ctx.moveTo(i*r*0.4, 0);
        ctx.quadraticCurveTo(
          i*r*0.4 + Math.sin(time*0.008)*15, r*0.8, 
          i*r*0.4 + Math.cos(time*0.008)*15, r*2.0
        );
      }
      ctx.stroke();
      
      // Eyes
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-r*0.35, -r*0.3, r*0.18, 0, Math.PI*2);
      ctx.arc(r*0.35, -r*0.3, r*0.18, 0, Math.PI*2);
      ctx.fill();
      // Eye shine
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-r*0.3, -r*0.35, r*0.06, 0, Math.PI*2);
      ctx.arc(r*0.4, -r*0.35, r*0.06, 0, Math.PI*2);
      ctx.fill();

    } else if (this.type === 'shard') {
      // Geometric Shard
      ctx.beginPath();
      ctx.moveTo(0, -r*1.3);
      ctx.lineTo(r*0.8, r*0.4);
      ctx.lineTo(0, r*1.3);
      ctx.lineTo(-r*0.8, r*0.4);
      ctx.closePath();
      ctx.fill();
      
      // Inner detail
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, -r*0.7);
      ctx.lineTo(r*0.25, 0);
      ctx.lineTo(0, r*0.7);
      ctx.lineTo(-r*0.25, 0);
      ctx.fill();

      // Eyes (Floating)
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-r*0.25, -r*0.3, r*0.2, 0, Math.PI*2);
      ctx.arc(r*0.25, -r*0.3, r*0.2, 0, Math.PI*2);
      ctx.fill();

    } else {
      // Spirit / Orb
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      
      // Eyes
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-r*0.35, -r*0.1, r*0.22, 0, Math.PI*2);
      ctx.arc(r*0.35, -r*0.1, r*0.22, 0, Math.PI*2);
      ctx.fill();
       // Eye shine
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-r*0.3, -r*0.15, r*0.08, 0, Math.PI*2);
      ctx.arc(r*0.4, -r*0.15, r*0.08, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }
}

class Player {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.targetX = width / 2;
    this.targetY = height / 2;
    this.angle = 0;
    this.bobOffset = 0;
    this.scale = 1;
    this.netOpen = 0; // 0 to 1
  }

  update() {
    // Smooth follow (Lerp)
    this.x += (this.targetX - this.x) * 0.12;
    this.y += (this.targetY - this.y) * 0.12;
    
    // Bobbing
    this.bobOffset = Math.sin(Date.now() * 0.004) * 6;
    
    // Breathing effect
    this.scale = 1 + Math.sin(Date.now() * 0.003) * 0.03;

    // Net idle animation
    this.netOpen = 0.8 + Math.sin(Date.now() * 0.005) * 0.1;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + this.bobOffset);
    ctx.scale(this.scale, this.scale);

    // --- DRAW NET (Behind Astronaut) ---
    // Net is attached to the astronaut's hand
    // Astronaut is at 0,0. Hand is roughly at -20, -10 (relative).
    
    const handX = -22;
    const handY = -12;
    
    ctx.save();
    ctx.translate(handX, handY);
    ctx.rotate(0.4); // Slight angle for the arm/net

    // Net Mesh (Holographic Cone)
    const netWidth = 50 * this.netOpen;
    
    // Cone Shape
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(netWidth, 70);
    ctx.quadraticCurveTo(0, 90, -netWidth, 70);
    ctx.lineTo(0, 0);
    
    // Fill Mesh
    ctx.fillStyle = 'rgba(0, 242, 255, 0.08)';
    ctx.fill();
    
    // Grid lines for mesh (Dynamic)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    // Vertical lines
    for(let i=-3; i<=3; i++) {
        let x = i * (netWidth/3.5);
        ctx.moveTo(0, 0);
        ctx.lineTo(x, 75);
    }
    // Horizontal lines
    for(let i=1; i<=4; i++) {
        let y = i * 15;
        let w = (y/70) * netWidth;
        ctx.moveTo(-w, y);
        ctx.lineTo(w, y);
    }
    ctx.stroke();

    // Net Rim Glow (The Catching Edge)
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.9)';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(netWidth, 70);
    ctx.quadraticCurveTo(0, 90, -netWidth, 70);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore(); // End Net

    // --- DRAW ASTRONAUT (Foreground) ---
    ctx.translate(-handX, -handY); // Back to center
    
    // Body (Bigger)
    ctx.fillStyle = '#f0f2f5';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI*2);
    ctx.fill();

    // Backpack
    ctx.fillStyle = '#b0b5bd';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillRect(-18, -18, 14, 36);
    ctx.shadowBlur = 0;
    
    // Backpack Details
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2;
    ctx.strokeRect(-18, -18, 14, 36);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fillRect(-16, -16, 10, 4);

    // Helmet Visor (Reflective)
    ctx.fillStyle = '#0a0a12';
    ctx.beginPath();
    ctx.arc(8, 0, 12, 0, Math.PI*2);
    ctx.fill();
    
    // Visor Reflection (Cyan Glow)
    ctx.fillStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.beginPath();
    ctx.arc(11, -4, 5, 0, Math.PI*2);
    ctx.fill();
    
    // Visor Edge Highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(8, 0, 12, 0, Math.PI*2);
    ctx.stroke();

    // Arm (Connecting to net)
    ctx.strokeStyle = '#eef';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.lineTo(-22, -12);
    ctx.stroke();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let player;

function init() {
  resize();
  initStars();
  player = new Player();
  
  // Spawn initial creatures
  for(let i=0; i<6; i++) {
    const c = new Creature();
    c.x = random(width * 0.2, width * 0.8);
    c.y = random(height * 0.2, height * 0.8);
    creatures.push(c);
  }
  
  window.addEventListener('resize', resize);
  
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = gameCanvas.getBoundingClientRect();
    player.targetX = x - rect.left;
    player.targetY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  const handleCatch = (e) => {
    checkCatch();
  };

  container.addEventListener('mousedown', handleCatch);
  container.addEventListener('touchstart', e => {
     updatePos(e.touches[0].clientX, e.touches[0].clientY);
     handleCatch();
  }, {passive: false});

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  dpr = window.devicePixelRatio || 1;
  
  gameCanvas.width = width * dpr;
  gameCanvas.height = height * dpr;
  gameCtx.scale(dpr, dpr);
  
  bgCanvas.width = width * dpr;
  bgCanvas.height = height * dpr;
  bgCtx.scale(dpr, dpr);
  
  initStars();
}

function checkCatch() {
  let caught = false;
  
  // Collision logic: Distance between Player Center and Creature Center
  // The net extends about 70px from player center
  const catchRadius = 80; 

  creatures = creatures.filter(c => {
    const dx = c.x - player.x;
    const dy = c.y - (player.y + player.bobOffset);
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < catchRadius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score < 10 ? '0' + score : score;
      
      // UI Feedback
      scoreEl.parentElement.style.transform = "scale(1.2)";
      setTimeout(() => scoreEl.parentElement.style.transform = "scale(1)", 150);
      
      caught = true;
      return false; // Remove creature
    }
    return true; 
  });

  if (caught) {
    setTimeout(() => {
      if (creatures.length < 7) creatures.push(new Creature());
    }, 600);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<30; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  gameCtx.clearRect(0, 0, width, height);
  
  drawBackground(time);

  // Draw Player
  player.update();
  player.draw(gameCtx);

  // Draw Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(gameCtx, time);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(gameCtx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
