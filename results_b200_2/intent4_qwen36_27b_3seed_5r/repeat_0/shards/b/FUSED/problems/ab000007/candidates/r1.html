<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #0f0c29;
    --bg-mid: #302b63;
    --bg-light: #24243e;
    --accent-primary: #00d2ff; /* Cyan */
    --accent-glow: #928dab; /* Soft Purple */
    --accent-warm: #ff0099; /* Pink */
    --text-main: #ffffff;
    --text-muted: #a8a8b3;
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: #000;
    color: var(--text-main);
    font-family: var(--font-stack);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    /* Richer Atmospheric Gradient */
    background: radial-gradient(circle at 50% 100%, #24243e 0%, #16162b 40%, #050510 100%);
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 90vh;
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,0.1);
    }
  }

  /* --- ATMOSPHERE & PARTICLES --- */
  #bg-canvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .fog-layer {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 40%;
    background: linear-gradient(to top, rgba(0, 210, 255, 0.08), transparent);
    filter: blur(30px);
    z-index: 2;
    pointer-events: none;
  }

  /* --- HUD --- */
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 28px 24px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .title-block {
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .title-block h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 30%, var(--accent-primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 6px;
  }

  .title-block p {
    font-size: 11px;
    color: var(--accent-primary);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.8;
  }

  .count-badge {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 6px 14px 6px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    pointer-events: auto; /* Allow clicking if we want to interact with badge */
  }

  .count-icon {
    width: 22px; height: 22px;
    fill: var(--accent-warm);
    filter: drop-shadow(0 0 4px rgba(255, 0, 153, 0.6));
  }

  .count-num {
    font-size: 20px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
    min-width: 20px;
    text-align: right;
  }

  /* --- GAME CANVAS --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none; /* Hide default cursor */
  }

  /* --- CONTROLS --- */
  .controls {
    position: absolute;
    bottom: 32px;
    left: 0; width: 100%;
    padding: 0 24px;
    z-index: 10;
    display: flex;
    justify-content: space-between; /* Spread items out */
    align-items: flex-end;
    pointer-events: none; /* Let clicks pass through gaps */
  }

  /* Collection Button */
  .collection-btn {
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    height: 56px;
    padding: 0 20px;
    border-radius: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    pointer-events: auto;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  .collection-btn:hover {
    background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
    transform: translateY(-2px);
    box-shadow: 0 15px 45px rgba(0, 210, 255, 0.2);
    border-color: var(--accent-primary);
  }

  .collection-btn:active {
    transform: scale(0.96);
  }

  .btn-icon {
    width: 20px; height: 20px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Net Action Button (Visual only, logic handled by cursor) */
  .action-btn-indicator {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(0, 210, 255, 0.15);
    border: 1px solid rgba(0, 210, 255, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
    animation: pulse 2s infinite ease-in-out;
  }

  .action-btn-indicator svg {
    width: 24px; height: 24px;
    stroke: var(--accent-primary);
    stroke-width: 2;
    fill: none;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.4); }
    70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Background Elements -->
  <canvas id="bg-canvas"></canvas>
  <div class="fog-layer"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="title-block">
      <h1>Aether Catch</h1>
      <p>World: Nebula</p>
    </div>
    <div class="count-badge">
      <!-- Star Icon -->
      <svg class="count-icon" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span class="count-num" id="score">0</span>
    </div>
  </div>

  <!-- Main Game Area -->
  <canvas id="gameCanvas"></canvas>

  <!-- Controls -->
  <div class="controls">
    <!-- Collection Button (New) -->
    <button class="collection-btn" aria-label="View Collection">
      <!-- Album/Bag Icon -->
      <svg class="btn-icon" viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>Collection</span>
    </button>

    <!-- Net Indicator (Visual replacement for info icon) -->
    <div class="action-btn-indicator">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-dasharray="4 4"></circle>
        <circle cx="12" cy="12" r="2"></circle>
        <path d="M12 2v4"></path>
        <path d="M12 18v4"></path>
        <path d="M2 12h4"></path>
        <path d="M18 12h4"></path>
      </svg>
    </div>
  </div>
</div>

<script>
/**
 * AETHER CATCH - Visual Logic
 * Renders a generative scene with distinct creatures and a net cursor.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const scoreEl = document.getElementById('score');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// Configuration
const COLORS = [
  { h: 199, s: 100, l: 65 }, // Cyan
  { h: 270, s: 85, l: 70 },  // Purple
  { h: 330, s: 90, l: 65 },  // Pink
  { h: 150, s: 80, l: 60 }   // Mint
];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- BACKGROUND STARS ---
const stars = [];
function initStars() {
  for(let i=0; i<80; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2,
      alpha: Math.random(),
      speed: Math.random() * 0.05 + 0.01,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawBackground(time) {
  bgCtx.clearRect(0, 0, width, height);
  
  stars.forEach(star => {
    star.alpha += Math.sin(time * 0.001 + star.phase) * 0.01;
    // Clamp alpha
    if(star.alpha < 0.1) star.alpha = 0.1;
    if(star.alpha > 1) star.alpha = 1;

    bgCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    bgCtx.beginPath();
    bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    bgCtx.fill();
  });
}

// --- CLASSES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.015, 0.03);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(2, 6);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(3, 7);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.92; // friction
    this.vy *= 0.92;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.type = Math.random() > 0.5 ? 'jelly' : 'spirit';
    this.reset();
  }

  reset() {
    // Spawn edges
    if (Math.random() < 0.5) {
      this.x = Math.random() < 0.5 ? -50 : width + 50;
      this.y = random(50, height - 50);
    } else {
      this.x = random(50, width - 50);
      this.y = Math.random() < 0.5 ? -50 : height + 50;
    }
    
    this.baseRadius = random(18, 28);
    
    // Movement vector towards center-ish
    const angle = Math.atan2((height/2) - this.y, (width/2) - this.x) + random(-0.8, 0.8);
    this.speed = random(0.4, 1.2);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.03, 0.06);
    this.wobbleAmp = random(0.5, 1.5);
    
    this.history = [];
    this.maxHistory = 15;
  }

  update(time) {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;

    // Trail history
    this.history.push({x: this.x, y: this.y});
    if(this.history.length > this.maxHistory) this.history.shift();

    // Bounds check
    if (this.x < -150 || this.x > width + 150 || this.y < -150 || this.y > height + 150) {
      this.reset();
    }
  }

  draw(ctx, time) {
    const pulse = 1 + Math.sin(time * 0.005) * 0.1;
    const r = this.baseRadius * pulse;

    // Draw Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l, 0.15);
      ctx.lineWidth = r;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // Glow
    const grd = ctx.createRadialGradient(this.x, this.y, r * 0.2, this.x, this.y, r * 2);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.3, hsl(this.color.h, this.color.s, this.color.l));
    grd.addColorStop(1, hsl(this.color.h, this.color.s, this.color.l, 0));

    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 2, 0, Math.PI * 2);
    ctx.fill();

    // Shape specific details
    if (this.type === 'jelly') {
      // Draw Jellyfish Tentacles
      ctx.strokeStyle = hsl(this.color.h, this.color.s, 80, 0.6);
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=-1; i<=1; i++) {
        ctx.moveTo(this.x + (i*8), this.y + r);
        ctx.quadraticCurveTo(
          this.x + (i*8) + Math.sin(time*0.01 + i)*10, 
          this.y + r + 20, 
          this.x + (i*8), 
          this.y + r + 30
        );
      }
      ctx.stroke();
    } else {
      // Draw Spirit Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x - 6, this.y - 2, 3, 0, Math.PI*2);
      ctx.arc(this.x + 6, this.y - 2, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

class Net {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.radius = 45;
    this.angle = 0;
    this.active = false;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.angle += 0.01;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Outer Ring
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 210, 255, 0.5)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Web (Grid)
    ctx.strokeStyle = 'rgba(0, 210, 255, 0.4)';
    ctx.lineWidth = 1;
    
    // Rotating Cross
    ctx.rotate(this.angle);
    
    // Radial lines
    for(let i=0; i<4; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(-this.radius, 0);
      ctx.lineTo(this.radius, 0);
      ctx.stroke();
    }
    
    // Concentric circles
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    
    // Center Reticle
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;

function init() {
  resize();
  initStars();
  net = new Net();
  for(let i=0; i<6; i++) creatures.push(new Creature());
  
  window.addEventListener('resize', resize);
  
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  // Catch logic on click/tap
  const handleCatch = () => {
    checkCatch();
  };

  container.addEventListener('mousedown', handleCatch);
  container.addEventListener('touchstart', e => {
     updatePos(e.touches[0].clientX, e.touches[0].clientY);
     handleCatch();
  }, {passive: false});

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  
  // Game Canvas
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  
  // BG Canvas
  bgCanvas.width = width * dpr;
  bgCanvas.height = height * dpr;
  bgCtx.scale(dpr, dpr);
}

function checkCatch() {
  let caught = false;
  // Filter creatures
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < net.radius + c.baseRadius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      scoreEl.style.transform = "scale(1.5)";
      setTimeout(() => scoreEl.style.transform = "scale(1)", 150);
      caught = true;
      return false; 
    }
    return true; 
  });

  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 800);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  // Clear
  ctx.clearRect(0, 0, width, height);
  
  // Update Background
  drawBackground(time);

  // Update Net
  net.update();
  net.draw(ctx);

  // Update Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx, time);
  });

  // Update Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
