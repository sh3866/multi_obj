<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-mid: #16162b;
    --bg-light: #24243e;
    --accent-primary: #00d2ff; /* Cyan */
    --accent-glow: #928dab;
    --accent-warm: #ff0099;
    --text-main: #ffffff;
    --text-muted: #a8a8b3;
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --glass-bg: rgba(20, 20, 35, 0.4);
    --glass-border: rgba(255, 255, 255, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: #000;
    color: var(--text-main);
    font-family: var(--font-stack);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    /* Deep Space Gradient */
    background: radial-gradient(circle at 50% 120%, #1a1a3a 0%, #0a0a1a 60%, #000000 100%);
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 90vh;
      border-radius: 32px;
      border: 1px solid rgba(255,255,255,0.08);
    }
  }

  /* --- ATMOSPHERE & PARTICLES (CSS) --- */
  .nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.4;
    z-index: 1;
    pointer-events: none;
    animation: nebulaDrift 20s infinite alternate ease-in-out;
  }

  .nebula-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #4b0082 0%, transparent 70%);
    top: -100px; left: -100px;
  }

  .nebula-2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, #008b8b 0%, transparent 70%);
    bottom: -50px; right: -50px;
    animation-delay: -5s;
  }

  .nebula-3 {
    width: 200px; height: 200px;
    background: radial-gradient(circle, #ff0099 0%, transparent 70%);
    top: 40%; left: 20%;
    opacity: 0.2;
    animation: nebulaPulse 15s infinite ease-in-out;
  }

  /* Dust Particles */
  .dust {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* --- HUD --- */
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 32px 24px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .title-block {
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
  }

  .title-block h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 0%, #b0c4de 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .title-block p {
    font-size: 11px;
    color: var(--accent-primary);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.9;
    text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
  }

  .count-badge {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    pointer-events: auto;
    transition: transform 0.2s ease;
  }
  
  .count-badge:active { transform: scale(0.95); }

  .count-icon {
    width: 20px; height: 20px;
    fill: var(--accent-warm);
    filter: drop-shadow(0 0 5px rgba(255, 0, 153, 0.8));
  }

  .count-num {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    min-width: 24px;
    text-align: right;
  }

  /* --- GAME CANVAS --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none;
  }

  /* --- CONTROLS --- */
  .controls {
    position: absolute;
    bottom: 32px;
    left: 0; width: 100%;
    padding: 0 24px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
  }

  /* Collection Button */
  .collection-btn {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    color: #fff;
    height: 52px;
    padding: 0 24px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    pointer-events: auto;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  .collection-btn:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(0, 210, 255, 0.15);
    border-color: rgba(255,255,255,0.4);
  }

  .collection-btn:active {
    transform: scale(0.96);
  }

  .btn-icon {
    width: 20px; height: 20px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Animations */
  @keyframes nebulaDrift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 20px) scale(1.1); }
  }

  @keyframes nebulaPulse {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(1.2); }
  }

  @keyframes dustFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Atmosphere Layers -->
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>
  
  <!-- CSS Dust Particles -->
  <div id="dust-container"></div>

  <!-- Canvas Layers -->
  <canvas id="bg-canvas"></canvas> <!-- Stars -->
  <canvas id="gameCanvas"></canvas> <!-- Creatures & Net -->

  <!-- HUD -->
  <div class="hud">
    <div class="title-block">
      <h1>Aether Catch</h1>
      <p>World: Nebula</p>
    </div>
    <div class="count-badge">
      <svg class="count-icon" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span class="count-num" id="score">0</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="collection-btn" aria-label="View Collection">
      <svg class="btn-icon" viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>Collection</span>
    </button>
  </div>
</div>

<script>
/**
 * AETHER CATCH - Visual Logic
 * Renders creatures and net on canvas, while static atmosphere is CSS.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const scoreEl = document.getElementById('score');
const dustContainer = document.getElementById('dust-container');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// Colors
const COLORS = [
  { h: 190, s: 100, l: 60 }, // Cyan
  { h: 270, s: 90, l: 65 },  // Purple
  { h: 330, s: 100, l: 60 }, // Pink
  { h: 140, s: 85, l: 55 }   // Mint
];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- BACKGROUND STARS (Canvas) ---
const stars = [];
function initStars() {
  stars.length = 0;
  for(let i=0; i<100; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      alpha: Math.random(),
      speed: Math.random() * 0.05 + 0.01,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawBackground(time) {
  bgCtx.clearRect(0, 0, width, height);
  
  stars.forEach(star => {
    // Twinkle
    star.alpha += Math.sin(time * 0.002 + star.phase) * 0.01;
    if(star.alpha < 0.1) star.alpha = 0.1;
    if(star.alpha > 1) star.alpha = 1;

    bgCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    bgCtx.beginPath();
    bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    bgCtx.fill();
  });
}

// --- CSS DUST PARTICLES ---
function createDust() {
  dustContainer.innerHTML = '';
  for(let i=0; i<15; i++) {
    const el = document.createElement('div');
    el.classList.add('dust');
    el.style.width = random(2, 6) + 'px';
    el.style.height = el.style.width;
    el.style.left = random(0, 100) + '%';
    el.style.top = random(0, 100) + '%';
    el.style.animation = `dustFloat ${random(10, 25)}s infinite linear`;
    el.style.animationDelay = random(-20, 0) + 's';
    dustContainer.appendChild(el);
  }
}

// --- GAME ENTITIES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.02, 0.04);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 5);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(2, 6);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.9; 
    this.vy *= 0.9;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.type = Math.random() > 0.5 ? 'jelly' : 'spirit';
    this.reset();
  }

  reset() {
    // Spawn off-screen
    const side = Math.floor(Math.random() * 4);
    if(side === 0) { this.x = -50; this.y = random(0, height); } // Left
    else if(side === 1) { this.x = width + 50; this.y = random(0, height); } // Right
    else if(side === 2) { this.x = random(0, width); this.y = -50; } // Top
    else { this.x = random(0, width); this.y = height + 50; } // Bottom
    
    this.baseRadius = random(15, 25);
    
    // Move towards center with randomness
    const targetX = random(width * 0.2, width * 0.8);
    const targetY = random(height * 0.2, height * 0.8);
    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    const spread = 0.5; // radians
    
    this.speed = random(0.3, 0.8);
    this.vx = Math.cos(angle + random(-spread, spread)) * this.speed;
    this.vy = Math.sin(angle + random(-spread, spread)) * this.speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.02, 0.05);
    this.wobbleAmp = random(0.5, 2.0);
    
    this.history = [];
    this.maxHistory = 12;
  }

  update(time) {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;

    this.history.push({x: this.x, y: this.y});
    if(this.history.length > this.maxHistory) this.history.shift();

    // Reset if way off screen
    if (this.x < -200 || this.x > width + 200 || this.y < -200 || this.y > height + 200) {
      this.reset();
    }
  }

  draw(ctx, time) {
    const pulse = 1 + Math.sin(time * 0.004) * 0.15;
    const r = this.baseRadius * pulse;

    // Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l, 0.2);
      ctx.lineWidth = r * 0.8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // Main Body Glow
    const grd = ctx.createRadialGradient(this.x, this.y, r * 0.2, this.x, this.y, r * 2.5);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.4, hsl(this.color.h, this.color.s, this.color.l));
    grd.addColorStop(1, hsl(this.color.h, this.color.s, this.color.l, 0));

    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Details
    if (this.type === 'jelly') {
      // Tentacles
      ctx.strokeStyle = hsl(this.color.h, this.color.s, 90, 0.7);
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=-1; i<=1; i++) {
        ctx.moveTo(this.x + (i*6), this.y + r);
        ctx.quadraticCurveTo(
          this.x + (i*6) + Math.sin(time*0.01 + i)*15, 
          this.y + r + 15, 
          this.x + (i*6) + Math.cos(time*0.01 + i)*10, 
          this.y + r + 25
        );
      }
      ctx.stroke();
    } else {
      // Spirit Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x - 5, this.y - 3, 3, 0, Math.PI*2);
      ctx.arc(this.x + 5, this.y - 3, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

class Net {
  constructor() {
    this.x = width / 2; // Start center-ish
    this.y = height / 2;
    this.radius = 40;
    this.angle = 0;
    this.bobOffset = 0;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    this.angle += 0.02;
    // Bobbing effect
    this.bobOffset = Math.sin(Date.now() * 0.005) * 3;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + this.bobOffset);
    
    // Outer Ring Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 210, 255, 0.6)';
    
    // Outer Ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Web
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0, 210, 255, 0.6)';
    ctx.lineWidth = 1.5;
    
    // Rotating Cross
    ctx.rotate(this.angle);
    
    // Radial lines
    for(let i=0; i<4; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(-this.radius, 0);
      ctx.lineTo(this.radius, 0);
      ctx.stroke();
    }
    
    // Concentric circles
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    
    // Center Reticle
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;

function init() {
  resize();
  initStars();
  createDust();
  net = new Net();
  
  // Initial creatures
  for(let i=0; i<4; i++) {
    const c = new Creature();
    // Force them to spawn inside initially for visual impact
    c.x = random(width * 0.2, width * 0.8);
    c.y = random(height * 0.2, height * 0.8);
    creatures.push(c);
  }
  
  window.addEventListener('resize', resize);
  
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  const handleCatch = () => {
    checkCatch();
  };

  container.addEventListener('mousedown', handleCatch);
  container.addEventListener('touchstart', e => {
     updatePos(e.touches[0].clientX, e.touches[0].clientY);
     handleCatch();
  }, {passive: false});

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  
  bgCanvas.width = width * dpr;
  bgCanvas.height = height * dpr;
  bgCtx.scale(dpr, dpr);
  
  // Re-init stars to fill new size
  initStars();
}

function checkCatch() {
  let caught = false;
  // Filter creatures
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - (net.y + net.bobOffset); // Account for bob
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < net.radius + c.baseRadius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      
      // Simple pop animation
      scoreEl.style.transform = "scale(1.4)";
      setTimeout(() => scoreEl.style.transform = "scale(1)", 150);
      
      caught = true;
      return false; 
    }
    return true; 
  });

  if (caught) {
    setTimeout(() => {
      if (creatures.length < 5) creatures.push(new Creature());
    }, 500);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<25; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  ctx.clearRect(0, 0, width, height);
  
  drawBackground(time);

  // Draw Net
  net.update();
  net.draw(ctx);

  // Draw Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx, time);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
