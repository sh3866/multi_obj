<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Catcher: Nebula Drift</title>
<style>
  :root {
    --bg-deep: #030014;
    --bg-mid: #0f0c29;
    --accent-cyan: #00f2ff;
    --accent-purple: #bd00ff;
    --accent-pink: #ff0099;
    --glass-surface: rgba(15, 10, 40, 0.65);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.25);
    --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: #000;
    color: #fff;
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: none; /* Hide default cursor for immersion */
  }

  /* --- MAIN CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    background: radial-gradient(circle at 50% 120%, #1a1a3a 0%, #09091a 60%, #000000 100%);
    overflow: hidden;
    box-shadow: 0 0 100px rgba(100, 50, 200, 0.15);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 92vh;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.05);
    }
  }

  /* --- PARALLAX LAYERS --- */
  .layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  /* Layer 1: Deep Nebula (CSS) */
  .nebula-layer { z-index: 1; opacity: 0.5; mix-blend-mode: screen; }
  
  .nebula-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    animation: drift 25s infinite alternate ease-in-out;
  }
  
  .blob-1 { width: 50vw; height: 50vw; background: #4b0082; top: -10%; left: -10%; animation-duration: 30s; }
  .blob-2 { width: 40vw; height: 40vw; background: #008b8b; bottom: -10%; right: -10%; animation-duration: 40s; animation-direction: alternate-reverse; }
  .blob-3 { width: 30vw; height: 30vw; background: #ff0099; top: 30%; left: 20%; opacity: 0.3; filter: blur(60px); animation: pulse 15s infinite ease-in-out; }

  /* Layer 2: Canvas (Stars + Particles) */
  #bg-canvas { z-index: 2; }

  /* Layer 3: Foreground Dust (CSS) */
  .dust-layer { z-index: 12; opacity: 0.4; }
  .dust-particle {
    position: absolute;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 4px rgba(255,255,255,0.8);
  }

  /* Layer 4: Game Canvas (Creatures + Net) */
  #gameCanvas { 
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    z-index: 10; 
  }

  /* Layer 5: UI */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none; /* Let clicks pass through to canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* --- HUD --- */
  .hud-top {
    padding: 32px 24px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .title-group h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
    text-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .title-group span {
    font-size: 10px;
    color: var(--accent-cyan);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
    text-shadow: 0 0 10px var(--accent-cyan);
  }

  .score-pill {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 6px 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    pointer-events: auto;
    transition: transform 0.1s;
  }

  .score-pill:active { transform: scale(0.95); }

  .score-icon { color: var(--accent-pink); }
  .score-val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; }

  /* --- CONTROLS --- */
  .controls-bottom {
    padding: 24px 24px 40px;
    pointer-events: auto;
  }

  .collection-btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: #fff;
    height: 60px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
  }

  .collection-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .collection-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 0 25px rgba(0, 242, 255, 0.2);
    transform: translateY(-2px);
  }
  
  .collection-btn:hover::before {
    transform: translateX(100%);
  }

  .collection-btn:active {
    transform: scale(0.97);
  }

  /* --- ANIMATIONS --- */
  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 40px) scale(1.1); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.2); }
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Layer 1: Deep Atmosphere -->
  <div class="layer nebula-layer">
    <div class="nebula-blob blob-1"></div>
    <div class="nebula-blob blob-2"></div>
    <div class="nebula-blob blob-3"></div>
  </div>

  <!-- Layer 2: Stars (Canvas) -->
  <canvas id="bg-canvas" class="layer"></canvas>

  <!-- Layer 3: Foreground Dust (CSS) -->
  <div id="dust-container" class="layer dust-layer"></div>

  <!-- Layer 4: Game (Canvas) -->
  <canvas id="gameCanvas" class="layer"></canvas>

  <!-- Layer 5: UI -->
  <div class="layer ui-layer">
    <div class="hud-top">
      <div class="title-group">
        <h1>Star Catcher</h1>
        <span>Nebula Sector 7</span>
      </div>
      <div class="score-pill">
        <svg class="score-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2"></polygon>
        </svg>
        <span class="score-val" id="score">0</span>
      </div>
    </div>

    <div class="controls-bottom">
      <button class="collection-btn" aria-label="View Collection">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        View Collection
      </button>
    </div>
  </div>
</div>

<script>
/**
 * STAR CATCHER - Visual Logic
 */

const gameCanvas = document.getElementById('gameCanvas');
const gameCtx = gameCanvas.getContext('2d');
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const scoreEl = document.getElementById('score');
const dustContainer = document.getElementById('dust-container');

// State
let width, height;
let dpr = window.devicePixelRatio || 1;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- CSS DUST GENERATION ---
function createDust() {
  dustContainer.innerHTML = '';
  for(let i=0; i<20; i++) {
    const el = document.createElement('div');
    el.classList.add('dust-particle');
    const size = random(1, 3);
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = random(0, 100) + '%';
    el.style.top = random(0, 100) + '%';
    // Random drift animation
    const duration = random(10, 30) + 's';
    const delay = random(-20, 0) + 's';
    el.style.transition = `all ${duration} linear`;
    // We animate via JS for parallax or CSS keyframes. Let's use simple CSS transform here
    el.style.animation = `drift ${duration} infinite linear alternate`;
    dustContainer.appendChild(el);
  }
}

// --- BACKGROUND STARS ---
const stars = [];
function initStars() {
  stars.length = 0;
  for(let i=0; i<120; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      alpha: Math.random(),
      speed: Math.random() * 0.05 + 0.01,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawBackground(time) {
  bgCtx.clearRect(0, 0, width, height);
  
  stars.forEach(star => {
    // Twinkle
    star.alpha += Math.sin(time * 0.003 + star.phase) * 0.01;
    if(star.alpha < 0.1) star.alpha = 0.1;
    if(star.alpha > 1) star.alpha = 1;

    bgCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    bgCtx.beginPath();
    bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    bgCtx.fill();
  });
}

// --- ENTITIES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.02, 0.05);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(2, 8);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.92; 
    this.vy *= 0.92;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    // Color Palette
    const typeRoll = Math.random();
    if (typeRoll < 0.5) {
      this.color = { h: 180, s: 100, l: 60 }; // Cyan
      this.type = 'spirit';
    } else if (typeRoll < 0.8) {
      this.color = { h: 280, s: 90, l: 65 }; // Purple
      this.type = 'jelly';
    } else {
      this.color = { h: 330, s: 100, l: 60 }; // Pink
      this.type = 'shard';
    }
    this.reset();
  }

  reset() {
    // Spawn off-screen
    const side = Math.floor(Math.random() * 4);
    if(side === 0) { this.x = -60; this.y = random(0, height); }
    else if(side === 1) { this.x = width + 60; this.y = random(0, height); }
    else if(side === 2) { this.x = random(0, width); this.y = -60; }
    else { this.x = random(0, width); this.y = height + 60; }
    
    this.baseRadius = random(18, 28);
    
    // Movement Logic
    const targetX = random(width * 0.2, width * 0.8);
    const targetY = random(height * 0.2, height * 0.8);
    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    
    this.speed = random(0.5, 1.2);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    // Animation properties
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.02, 0.05);
    this.wobbleAmp = random(1, 3);
    this.rotAngle = 0;
    this.rotSpeed = random(-0.02, 0.02);
    
    this.history = [];
    this.maxHistory = 10;
  }

  update(time) {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.rotAngle += this.rotSpeed;

    // Trail history
    if (Math.random() > 0.5) {
      this.history.push({x: this.x, y: this.y, r: this.baseRadius * 0.8});
      if(this.history.length > this.maxHistory) this.history.shift();
    }

    // Reset if way off screen
    if (this.x < -200 || this.x > width + 200 || this.y < -200 || this.y > height + 200) {
      this.reset();
    }
  }

  draw(ctx, time) {
    const pulse = 1 + Math.sin(time * 0.005) * 0.1;
    const r = this.baseRadius * pulse;

    // Draw Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l, 0.15);
      ctx.lineWidth = r * 0.6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotAngle);

    // Glow Aura
    const grd = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.5);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.4, hsl(this.color.h, this.color.s, this.color.l));
    grd.addColorStop(1, hsl(this.color.h, this.color.s, this.color.l, 0));

    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Draw Shape based on type
    ctx.fillStyle = hsl(this.color.h, this.color.s, 90, 0.9);
    
    if (this.type === 'jelly') {
      // Jellyfish shape
      ctx.beginPath();
      ctx.arc(0, -r*0.2, r, Math.PI, 0); // Dome
      ctx.bezierCurveTo(r, r*0.5, -r, r*0.5, -r, -r*0.2); // Body
      
      // Tentacles
      ctx.strokeStyle = hsl(this.color.h, this.color.s, 90, 0.7);
      ctx.lineWidth = 3;
      ctx.beginPath();
      for(let i=-1; i<=1; i+=2) {
        ctx.moveTo(i*r*0.5, 0);
        ctx.quadraticCurveTo(
          i*r*0.5 + Math.sin(time*0.01)*10, r, 
          i*r*0.5 + Math.cos(time*0.01)*10, r*2
        );
      }
      ctx.stroke();
      ctx.fill(); // Fill dome
      
    } else if (this.type === 'shard') {
      // Geometric Shard
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r*0.6, r*0.5);
      ctx.lineTo(0, r);
      ctx.lineTo(-r*0.6, r*0.5);
      ctx.closePath();
      ctx.fill();
      
    } else {
      // Spirit / Orb
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      
      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-r*0.3, -r*0.1, r*0.15, 0, Math.PI*2);
      ctx.arc(r*0.3, -r*0.1, r*0.15, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.radius = 45;
    this.angle = 0;
    this.bobOffset = 0;
    this.scale = 1;
  }

  update() {
    // Smooth follow (Lerp)
    this.x += (mouseX - this.x) * 0.12;
    this.y += (mouseY - this.y) * 0.12;
    this.angle += 0.015;
    
    // Bobbing
    this.bobOffset = Math.sin(Date.now() * 0.004) * 4;
    
    // Breathing effect
    this.scale = 1 + Math.sin(Date.now() * 0.003) * 0.05;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + this.bobOffset);
    ctx.scale(this.scale, this.scale);
    
    // Outer Ring Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.5)';
    
    // Outer Ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Mesh
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.6)';
    ctx.lineWidth = 1.5;
    
    ctx.rotate(this.angle);
    
    // Cross hairs
    ctx.beginPath();
    ctx.moveTo(-this.radius, 0);
    ctx.lineTo(this.radius, 0);
    ctx.moveTo(0, -this.radius);
    ctx.lineTo(0, this.radius);
    ctx.stroke();
    
    // Rotating Diamond
    ctx.rotate(Math.PI / 4);
    ctx.beginPath();
    ctx.moveTo(-this.radius*0.7, 0);
    ctx.lineTo(this.radius*0.7, 0);
    ctx.moveTo(0, -this.radius*0.7);
    ctx.lineTo(0, this.radius*0.7);
    ctx.stroke();

    // Center Reticle
    ctx.rotate(-this.angle); // Reset rotation for center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Mesh Fill (Subtle)
    ctx.fillStyle = 'rgba(0, 242, 255, 0.05)';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;

function init() {
  resize();
  initStars();
  createDust();
  net = new Net();
  
  // Spawn initial creatures
  for(let i=0; i<5; i++) {
    const c = new Creature();
    // Force initial spawn inside
    c.x = random(width * 0.2, width * 0.8);
    c.y = random(height * 0.2, height * 0.8);
    creatures.push(c);
  }
  
  window.addEventListener('resize', resize);
  
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = gameCanvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  const handleCatch = (e) => {
    // If it's a touch event, we might want to prevent the button click if it overlaps, 
    // but the UI layer is on top, so clicks on buttons won't hit canvas.
    checkCatch();
  };

  container.addEventListener('mousedown', handleCatch);
  container.addEventListener('touchstart', e => {
     updatePos(e.touches[0].clientX, e.touches[0].clientY);
     handleCatch();
  }, {passive: false});

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  dpr = window.devicePixelRatio || 1;
  
  gameCanvas.width = width * dpr;
  gameCanvas.height = height * dpr;
  gameCtx.scale(dpr, dpr);
  
  bgCanvas.width = width * dpr;
  bgCanvas.height = height * dpr;
  bgCtx.scale(dpr, dpr);
  
  initStars();
}

function checkCatch() {
  let caught = false;
  
  // Check collision
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - (net.y + net.bobOffset);
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    // Hitbox is slightly generous
    if (dist < net.radius + c.baseRadius * 0.8) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      
      // UI Feedback
      scoreEl.parentElement.style.transform = "scale(1.1)";
      setTimeout(() => scoreEl.parentElement.style.transform = "scale(1)", 150);
      
      caught = true;
      return false; // Remove creature
    }
    return true; 
  });

  // Respawn logic
  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 800);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<30; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  gameCtx.clearRect(0, 0, width, height);
  
  drawBackground(time);

  // Draw Net
  net.update();
  net.draw(gameCtx);

  // Draw Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(gameCtx, time);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(gameCtx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
