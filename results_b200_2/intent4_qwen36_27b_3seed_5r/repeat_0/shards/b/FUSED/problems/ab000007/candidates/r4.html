<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cosmic Collector</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-panel: rgba(10, 15, 30, 0.6);
    --accent-cyan: #00f0ff;
    --accent-purple: #b026ff;
    --accent-pink: #ff2a6d;
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: #000;
    color: #fff;
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- MAIN CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    background: radial-gradient(circle at 50% 150%, #1a1a3a 0%, #09091a 60%, #000000 100%);
    overflow: hidden;
    box-shadow: 0 0 120px rgba(100, 50, 200, 0.1);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 92vh;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.05);
    }
  }

  /* --- PARALLAX LAYERS --- */
  .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Layer 1: Deep Nebula (CSS) */
  .nebula-layer { z-index: 1; opacity: 0.6; mix-blend-mode: screen; }
  
  .nebula-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    animation: drift 30s infinite alternate ease-in-out;
  }
  
  .blob-1 { width: 60vw; height: 60vw; background: #4b0082; top: -20%; left: -10%; animation-duration: 35s; }
  .blob-2 { width: 50vw; height: 50vw; background: #005f73; bottom: -15%; right: -15%; animation-duration: 45s; animation-direction: alternate-reverse; }
  .blob-3 { width: 40vw; height: 40vw; background: #9d0208; top: 40%; left: 30%; opacity: 0.2; filter: blur(80px); animation: pulse 20s infinite ease-in-out; }

  /* Layer 2: Canvas (Stars) */
  #bg-canvas { z-index: 2; }

  /* Layer 3: Game Canvas */
  #gameCanvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: none; }

  /* Layer 4: UI */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* --- HUD --- */
  .hud-top {
    padding: 32px 24px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
  }

  .title-group h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .title-group span {
    font-size: 10px;
    color: var(--accent-cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.8;
  }

  .score-pill {
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 8px 16px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }

  .score-icon { color: var(--accent-pink); filter: drop-shadow(0 0 5px var(--accent-pink)); }
  .score-val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 18px; letter-spacing: 1px; }

  /* --- CONTROLS --- */
  .controls-bottom {
    padding: 24px 24px 48px;
    pointer-events: auto;
    display: flex;
    justify-content: center;
  }

  .collection-btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-top: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .collection-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }

  .collection-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.2);
    transform: translateY(-2px);
  }
  
  .collection-btn:hover::before { transform: translateX(100%); }
  .collection-btn:active { transform: scale(0.98); }

  /* --- ANIMATIONS --- */
  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, 50px) scale(1.1); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.15); }
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Layer 1: Deep Atmosphere -->
  <div class="layer nebula-layer">
    <div class="nebula-blob blob-1"></div>
    <div class="nebula-blob blob-2"></div>
    <div class="nebula-blob blob-3"></div>
  </div>

  <!-- Layer 2: Stars (Canvas) -->
  <canvas id="bg-canvas" class="layer"></canvas>

  <!-- Layer 3: Game (Canvas) -->
  <canvas id="gameCanvas" class="layer"></canvas>

  <!-- Layer 4: UI -->
  <div class="layer ui-layer">
    <div class="hud-top">
      <div class="title-group">
        <h1>Cosmic Collector</h1>
        <span>Sector 7 &middot; Live</span>
      </div>
      <div class="score-pill">
        <svg class="score-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        </svg>
        <span class="score-val" id="score">00</span>
      </div>
    </div>

    <div class="controls-bottom">
      <button class="collection-btn" aria-label="View Collection">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        View Collection
      </button>
    </div>
  </div>
</div>

<script>
/**
 * COSMIC COLLECTOR - Visual Logic
 */

const gameCanvas = document.getElementById('gameCanvas');
const gameCtx = gameCanvas.getContext('2d');
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const scoreEl = document.getElementById('score');

// State
let width, height;
let dpr = window.devicePixelRatio || 1;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- BACKGROUND STARS ---
const stars = [];
function initStars() {
  stars.length = 0;
  for(let i=0; i<150; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.8,
      alpha: Math.random(),
      speed: Math.random() * 0.05 + 0.01,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawBackground(time) {
  bgCtx.clearRect(0, 0, width, height);
  
  stars.forEach(star => {
    star.alpha += Math.sin(time * 0.002 + star.phase) * 0.01;
    if(star.alpha < 0.2) star.alpha = 0.2;
    if(star.alpha > 1) star.alpha = 1;

    bgCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    bgCtx.beginPath();
    bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    bgCtx.fill();
  });
}

// --- ENTITIES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.02, 0.04);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 6);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(1, 4);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95; 
    this.vy *= 0.95;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    const typeRoll = Math.random();
    if (typeRoll < 0.33) {
      this.color = { h: 185, s: 100, l: 60 }; // Cyan
      this.type = 'spirit';
    } else if (typeRoll < 0.66) {
      this.color = { h: 270, s: 80, l: 65 }; // Purple
      this.type = 'jelly';
    } else {
      this.color = { h: 330, s: 100, l: 60 }; // Pink
      this.type = 'shard';
    }
    this.reset();
  }

  reset() {
    // Spawn off-screen
    const side = Math.floor(Math.random() * 4);
    if(side === 0) { this.x = -80; this.y = random(0, height); }
    else if(side === 1) { this.x = width + 80; this.y = random(0, height); }
    else if(side === 2) { this.x = random(0, width); this.y = -80; }
    else { this.x = random(0, width); this.y = height + 80; }
    
    this.baseRadius = random(16, 24);
    
    const targetX = random(width * 0.1, width * 0.9);
    const targetY = random(height * 0.1, height * 0.9);
    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    
    this.speed = random(0.4, 1.0);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.03, 0.06);
    this.wobbleAmp = random(1, 3);
    this.rotAngle = 0;
    this.rotSpeed = random(-0.02, 0.02);
    
    this.history = [];
    this.maxHistory = 8;
  }

  update(time) {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.rotAngle += this.rotSpeed;

    if (Math.random() > 0.5) {
      this.history.push({x: this.x, y: this.y, r: this.baseRadius * 0.7});
      if(this.history.length > this.maxHistory) this.history.shift();
    }

    if (this.x < -250 || this.x > width + 250 || this.y < -250 || this.y > height + 250) {
      this.reset();
    }
  }

  draw(ctx, time) {
    const pulse = 1 + Math.sin(time * 0.004) * 0.08;
    const r = this.baseRadius * pulse;

    // Draw Trail
    if (this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l, 0.15);
      ctx.lineWidth = r * 0.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotAngle);

    // Glow Aura
    const grd = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 2.2);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.4, hsl(this.color.h, this.color.s, this.color.l));
    grd.addColorStop(1, hsl(this.color.h, this.color.s, this.color.l, 0));

    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Draw Shape based on type
    ctx.fillStyle = hsl(this.color.h, this.color.s, 95, 0.9);
    
    if (this.type === 'jelly') {
      // Jellyfish
      ctx.beginPath();
      ctx.arc(0, -r*0.2, r, Math.PI, 0); // Dome
      ctx.bezierCurveTo(r, r*0.5, -r, r*0.5, -r, -r*0.2); // Body
      ctx.fill();
      
      // Tentacles
      ctx.strokeStyle = hsl(this.color.h, this.color.s, 90, 0.8);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for(let i=-1; i<=1; i+=2) {
        ctx.moveTo(i*r*0.4, 0);
        ctx.quadraticCurveTo(
          i*r*0.4 + Math.sin(time*0.008)*12, r*0.8, 
          i*r*0.4 + Math.cos(time*0.008)*12, r*1.8
        );
      }
      ctx.stroke();
      
      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-r*0.3, -r*0.3, r*0.12, 0, Math.PI*2);
      ctx.arc(r*0.3, -r*0.3, r*0.12, 0, Math.PI*2);
      ctx.fill();

    } else if (this.type === 'shard') {
      // Geometric Shard
      ctx.beginPath();
      ctx.moveTo(0, -r*1.2);
      ctx.lineTo(r*0.7, r*0.3);
      ctx.lineTo(0, r*1.2);
      ctx.lineTo(-r*0.7, r*0.3);
      ctx.closePath();
      ctx.fill();
      
      // Inner detail
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, -r*0.6);
      ctx.lineTo(r*0.2, 0);
      ctx.lineTo(0, r*0.6);
      ctx.lineTo(-r*0.2, 0);
      ctx.fill();

      // Eyes (Floating)
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-r*0.2, -r*0.2, r*0.15, 0, Math.PI*2);
      ctx.arc(r*0.2, -r*0.2, r*0.15, 0, Math.PI*2);
      ctx.fill();

    } else {
      // Spirit / Orb
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      
      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-r*0.35, -r*0.1, r*0.18, 0, Math.PI*2);
      ctx.arc(r*0.35, -r*0.1, r*0.18, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }
}

class Player {
  constructor() {
    this.x = width / 2;
    this.y = height / 2;
    this.targetX = width / 2;
    this.targetY = height / 2;
    this.angle = 0;
    this.bobOffset = 0;
    this.scale = 1;
  }

  update() {
    // Smooth follow (Lerp)
    this.x += (this.targetX - this.x) * 0.12;
    this.y += (this.targetY - this.y) * 0.12;
    
    // Bobbing
    this.bobOffset = Math.sin(Date.now() * 0.004) * 4;
    
    // Breathing effect
    this.scale = 1 + Math.sin(Date.now() * 0.003) * 0.03;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y + this.bobOffset);
    ctx.scale(this.scale, this.scale);

    // --- DRAW NET (Behind Astronaut) ---
    // Net is attached to the astronaut's hand
    // Astronaut is at 0,0. Hand is roughly at -15, -5 (relative).
    // Net extends outwards.
    
    const handX = -18;
    const handY = -5;
    
    ctx.save();
    ctx.translate(handX, handY);
    ctx.rotate(0.3); // Slight angle for the arm/net

    // Net Mesh (Holographic)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    // Net shape
    ctx.moveTo(0, 0);
    ctx.lineTo(60, 60);
    ctx.quadraticCurveTo(80, 0, 60, -60);
    ctx.lineTo(0, 0);
    ctx.fillStyle = 'rgba(0, 242, 255, 0.05)';
    ctx.fill();
    ctx.stroke();

    // Grid lines for mesh
    ctx.beginPath();
    for(let i=1; i<4; i++) {
        let x = i * 15;
        ctx.moveTo(x, x);
        ctx.lineTo(x, -x);
    }
    ctx.stroke();

    // Net Rim Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.8)';
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(60, 60);
    ctx.quadraticCurveTo(80, 0, 60, -60);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore(); // End Net

    // --- DRAW ASTRONAUT (Foreground) ---
    ctx.translate(-handX, -handY); // Back to center
    
    // Body
    ctx.fillStyle = '#eef';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI*2);
    ctx.fill();

    // Backpack
    ctx.fillStyle = '#ccc';
    ctx.fillRect(-12, -12, 10, 24);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.strokeRect(-12, -12, 10, 24);

    // Helmet Visor
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(5, 0, 8, 0, Math.PI*2);
    ctx.fill();
    
    // Visor Reflection
    ctx.fillStyle = 'rgba(0, 242, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(7, -2, 3, 0, Math.PI*2);
    ctx.fill();

    // Arm (Connecting to net)
    ctx.strokeStyle = '#eef';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.lineTo(-15, -5);
    ctx.stroke();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let player;

function init() {
  resize();
  initStars();
  player = new Player();
  
  // Spawn initial creatures
  for(let i=0; i<5; i++) {
    const c = new Creature();
    c.x = random(width * 0.2, width * 0.8);
    c.y = random(height * 0.2, height * 0.8);
    creatures.push(c);
  }
  
  window.addEventListener('resize', resize);
  
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = gameCanvas.getBoundingClientRect();
    player.targetX = x - rect.left;
    player.targetY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  const handleCatch = (e) => {
    checkCatch();
  };

  container.addEventListener('mousedown', handleCatch);
  container.addEventListener('touchstart', e => {
     updatePos(e.touches[0].clientX, e.touches[0].clientY);
     handleCatch();
  }, {passive: false});

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  dpr = window.devicePixelRatio || 1;
  
  gameCanvas.width = width * dpr;
  gameCanvas.height = height * dpr;
  gameCtx.scale(dpr, dpr);
  
  bgCanvas.width = width * dpr;
  bgCanvas.height = height * dpr;
  bgCtx.scale(dpr, dpr);
  
  initStars();
}

function checkCatch() {
  let caught = false;
  
  // Collision logic: Distance between Player Center and Creature Center
  // The net extends about 60px from player center
  const catchRadius = 70; 

  creatures = creatures.filter(c => {
    const dx = c.x - player.x;
    const dy = c.y - (player.y + player.bobOffset);
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < catchRadius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score < 10 ? '0' + score : score;
      
      // UI Feedback
      scoreEl.parentElement.style.transform = "scale(1.15)";
      setTimeout(() => scoreEl.parentElement.style.transform = "scale(1)", 150);
      
      caught = true;
      return false; // Remove creature
    }
    return true; 
  });

  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 800);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<25; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  gameCtx.clearRect(0, 0, width, height);
  
  drawBackground(time);

  // Draw Player
  player.update();
  player.draw(gameCtx);

  // Draw Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(gameCtx, time);
  });

  // Draw Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(gameCtx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
