<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --grid-line: rgba(255, 0, 255, 0.4);
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffeb3b;
            --neon-purple: #bc13fe;
            --neon-blue: #0051ff;
            --hit-line: #ffffff;
            --pixel: 4px; /* Base unit */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND SCENE --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Stars Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Synthwave Sun - Vibrant Gradient */
        .sun {
            position: absolute;
            bottom: 28%; /* Horizon line */
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 350px;
            background: linear-gradient(to top, var(--neon-yellow), var(--neon-pink) 60%, #ff00aa);
            border-radius: 50%;
            box-shadow: 0 0 80px var(--neon-pink);
            z-index: 2;
            /* Pixelated Retro Stripes */
            -webkit-mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 20%,
                transparent 20%, transparent 23%,
                black 23%, black 35%,
                transparent 35%, transparent 39%,
                black 39%, black 55%,
                transparent 55%, transparent 60%,
                black 60%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 12%,
                black 12%, black 20%,
                transparent 20%, transparent 23%,
                black 23%, black 35%,
                transparent 35%, transparent 39%,
                black 39%, black 55%,
                transparent 55%, transparent 60%,
                black 60%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
        }

        /* The Grid Floor - Active & Glowing */
        .floor {
            position: absolute;
            bottom: -150px; /* Push down to create horizon depth */
            left: -50%;
            width: 200%;
            height: 60vh;
            background: 
                linear-gradient(transparent 0%, var(--bg-dark) 15%, var(--bg-dark) 100%),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px),
                linear-gradient(0deg, var(--grid-line) 2px, transparent 2px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: bottom center;
            z-index: 3;
            animation: gridMove 0.8s linear infinite;
            box-shadow: 0 0 100px var(--neon-purple);
        }

        @keyframes gridMove {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 60px; }
        }

        /* --- MAIN CONTENT --- */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            margin-top: -50px; /* Visual balance */
        }

        /* --- GAME TITLE --- */
        .title-container {
            position: absolute;
            top: 8%;
            text-align: center;
            width: 100%;
            z-index: 20;
            /* Text glow for readability against sun */
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        h1 {
            font-size: 6rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: #fff;
            /* Crisp Pixel Text Shadow */
            text-shadow: 
                4px 4px 0px var(--neon-purple),
                8px 8px 0px var(--neon-cyan);
            margin: 0;
            animation: titleFloat 3s ease-in-out infinite;
            /* Force crisp rendering */
            -webkit-font-smoothing: none;
        }

        h1 span {
            color: var(--neon-yellow);
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                8px 8px 0px var(--neon-blue);
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 360px; /* Wider for better aspect ratio */
            height: 400px;
            margin-top: 100px;
            perspective: 600px;
            z-index: 15;
            /* Shadow to ground the highway */
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
        }

        /* The Highway Board */
        .highway {
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.9);
            border: var(--pixel) solid var(--neon-cyan);
            box-shadow: 
                inset 0 0 50px rgba(0, 255, 255, 0.1),
                0 0 20px var(--neon-cyan);
            transform: rotateX(40deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            overflow: hidden;
            /* Pixel Art Border Trick */
            border-bottom-width: calc(var(--pixel) * 2);
        }

        /* Lane Dividers - Bright Neon Cyan */
        .lane {
            flex: 1;
            position: relative;
            border-right: 2px solid rgba(0, 255, 255, 0.3);
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--hit-line);
            box-shadow: 
                0 0 10px white, 
                0 0 20px var(--neon-pink);
            z-index: 5;
        }

        /* Falling Notes - Pixel Art Shapes */
        .note {
            position: absolute;
            width: 70%;
            left: 15%;
            height: 40px;
            animation: fall linear infinite;
            /* Pixelated rendering */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Lane 1: Pink - Solid Block */
        .lane:nth-child(1) .note { 
            background: #ff0055; 
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.4),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                0 0 15px #ff0055;
            animation-duration: 1.6s; 
            animation-delay: 0.0s; 
        }

        /* Lane 2: Cyan - Hollow Square (Pixel Frame) */
        .lane:nth-child(2) .note { 
            background: transparent;
            border: 6px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            animation-duration: 2.0s; 
            animation-delay: 0.4s; 
        }

        /* Lane 3: Green - Vertical Split (Double Bar) */
        .lane:nth-child(3) .note { 
            background: transparent;
            /* CSS Grid to make two bars */
            background: linear-gradient(to right, #00ff00 45%, transparent 45%, transparent 55%, #00ff00 55%);
            box-shadow: 0 0 15px #00ff00;
            animation-duration: 1.8s; 
            animation-delay: 0.2s; 
        }

        /* Lane 4: Yellow - Triangle/Arrow Top */
        .lane:nth-child(4) .note { 
            background: transparent;
            /* CSS Clip Path for Arrow */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            background-color: var(--neon-yellow);
            box-shadow: 0 0 15px var(--neon-yellow);
            /* Note: box-shadow doesn't work well with clip-path, so we use drop-shadow filter on the note itself */
            filter: drop-shadow(0 0 10px var(--neon-yellow));
            animation-duration: 1.7s; 
            animation-delay: 0.8s; 
        }

        @keyframes fall {
            0% { top: -60px; opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* --- BUTTONS --- */
        .btn-container {
            margin-top: 30px;
            position: relative;
        }

        .btn-start {
            background: #111;
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 1rem 3.5rem;
            border: none;
            cursor: pointer;
            position: relative;
            /* No Skew - Flat UI Overlay approach for Hierarchy */
            transform: none;
            transition: all 0.1s;
            text-shadow: 2px 2px 0px #000;
            z-index: 20;
            /* Pixel Border */
            outline: 4px solid var(--neon-yellow);
            outline-offset: -4px;
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.2),
                inset -4px -4px 0px rgba(0,0,0,0.5),
                6px 6px 0px var(--neon-cyan); /* Hard Shadow */
        }

        .btn-start:hover {
            background: #222;
            transform: scale(1.05) translateY(-2px);
            color: #fff;
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.2),
                inset -4px -4px 0px rgba(0,0,0,0.5),
                8px 8px 0px var(--neon-cyan),
                0 0 30px var(--neon-cyan);
        }

        .btn-start:active {
            transform: scale(0.95);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.5),
                inset -4px -4px 0px rgba(255,255,255,0.2),
                2px 2px 0px var(--neon-cyan);
        }

        /* Scanline overlay for CRT effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            /* Vignette effect */
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway-wrapper { width: 90%; height: 320px; }
            .sun { width: 220px; height: 220px; bottom: 30%; }
            .btn-start { font-size: 1.4rem; padding: 0.8rem 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Scanlines Overlay -->
    <div class="scanlines"></div>

    <!-- Background Scene -->
    <div class="scene-container">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content-layer">
        
        <div class="title-container">
            <h1>PIXEL <span>DANCE</span></h1>
        </div>

        <!-- Visual Representation of Gameplay -->
        <div class="highway-wrapper">
            <div class="highway">
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders retro moving stars on the canvas behind the sun.
         * Uses square pixels to match the aesthetic.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        // Disable smoothing for pixel art look
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let stars = [];
        const starCount = 150;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
                // Randomize y initially so they don't all start at top
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.z = Math.random() * 4 + 0.5; // Depth/Speed
                // Varied pixel sizes for depth
                this.size = Math.random() > 0.9 ? 3 : (Math.random() > 0.5 ? 2 : 1); 
                // Color palette: White, Cyan, Magenta
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 1.2; // Move down faster for "speed"
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.8;
                // Draw squares, not circles
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Adds a controlled RGB Glitch effect to the title when hovering the start button.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        const titleSpan = document.querySelector('h1 span');
        let glitchInterval;

        btn.addEventListener('mouseenter', () => {
            glitchInterval = setInterval(() => {
                // Random offset for RGB split
                const offset = Math.random() * 6 - 3;
                
                // Apply glitch styles
                title.style.textShadow = `
                    ${offset * 2}px 0 0px #ff0000, 
                    ${offset * -2}px 0 0px #00ffff` + 
                    `, 4px 4px 0px var(--neon-purple)`;
                
                titleSpan.style.textShadow = `
                    ${offset * -2}px 0 0px #0000ff, 
                    ${offset * 2}px 0 0px #ffff00` + 
                    `, 4px 4px 0px var(--neon-pink)`;

                // Slight jitter
                title.style.transform = `translateX(${offset}px)`;

            }, 60);
        });

        btn.addEventListener('mouseleave', () => {
            clearInterval(glitchInterval);
            // Reset to clean state
            title.style.textShadow = `
                4px 4px 0px var(--neon-purple),
                8px 8px 0px var(--neon-cyan)
            `;
            titleSpan.style.textShadow = `
                4px 4px 0px var(--neon-pink),
                8px 8px 0px var(--neon-blue)
            `;
            title.style.transform = 'translateX(0)';
        });
    </script>
</body>
</html>
