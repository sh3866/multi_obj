<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE: RHYTHM PROTOCOL</title>
    <style>
        :root {
            /* Synthwave / Cyberpunk Palette */
            --bg-deep: #050011;
            --bg-grid: #120024;
            
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffeb3b;
            --neon-purple: #bc13fe;
            --neon-white: #ffffff;

            /* Pixel Grid Unit */
            --p: 4px; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--neon-white);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND --- */
        .scene-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* The Sun */
        .sun-container {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 240px;
            z-index: 1;
        }

        .sun {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--neon-yellow), var(--neon-pink));
            border-radius: 50%;
            /* Pixelated Stripes */
            -webkit-mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 15%,
                transparent 15%, transparent 20%
            );
            mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 15%,
                transparent 15%, transparent 20%
            );
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
            animation: sunPulse 4s infinite alternate ease-in-out;
        }

        /* The Grid Floor */
        .grid-floor {
            position: absolute;
            top: 50%;
            left: -50%;
            width: 200%;
            height: 100vh;
            background: 
                linear-gradient(to bottom, rgba(5,0,17,0.8) 0%, rgba(5,0,17,1) 40%, transparent 100%),
                linear-gradient(90deg, var(--neon-purple) 2px, transparent 2px),
                linear-gradient(0deg, var(--neon-purple) 2px, transparent 2px);
            background-size: 100% 100%, 60px 60px, 80px 80px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            animation: gridScroll 1s linear infinite;
            opacity: 0.4;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 60px, 0 80px; }
        }

        @keyframes sunPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.05); filter: brightness(1.2); }
        }

        /* --- CONTENT LAYER --- */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* --- TYPOGRAPHY --- */
        .title-wrapper {
            margin-top: -40px;
            margin-bottom: 50px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--neon-white);
            letter-spacing: 6px;
            line-height: 1;
            position: relative;
            display: inline-block;
            /* Refined RGB Split for Legibility */
            text-shadow: 
                3px 3px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            animation: titleFloat 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: var(--neon-cyan);
            margin-top: 10px;
            /* High contrast background for legibility against sun */
            background: var(--bg-deep);
            display: inline-block;
            padding: 4px 12px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple);
            position: relative;
            z-index: 2;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 320px;
            height: 400px;
            perspective: 800px;
            margin-bottom: 50px;
            /* Pixelated Border Container */
            border: var(--p) solid var(--neon-white);
            box-shadow: 
                8px 8px 0px var(--neon-purple),
                inset 0 0 0 var(--p) var(--neon-purple);
            background: #000;
        }

        .highway-viewport {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #000 0%, #1a0033 100%);
            transform: rotateX(40deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            overflow: hidden;
            /* Fade out at the top (vanishing point) */
            mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
        }

        /* Lane Dividers */
        .lane {
            flex: 1;
            position: relative;
            /* Dashed Neon Dividers */
            border-right: 2px dashed rgba(0, 243, 255, 0.3);
        }
        .lane:last-child { border-right: none; }
        .lane:nth-child(even) { border-right-color: rgba(255, 0, 85, 0.3); }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 20px; /* Near the bottom of the screen */
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--neon-yellow);
            box-shadow: 0 0 15px var(--neon-yellow), 0 0 30px var(--neon-yellow);
            z-index: 10;
            /* Pixelated edges */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        /* --- PIXEL NOTES --- */
        .note {
            position: absolute;
            width: 30px;
            height: 30px;
            left: 50%;
            transform: translateX(-50%);
            /* Pixel Rendering */
            image-rendering: pixelated;
            animation: fall linear infinite;
        }

        /* Uniform Pixel Block Styles */
        .note::after {
            /* Inner pixel detail */
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            background: rgba(255,255,255,0.4);
            opacity: 0.5;
        }

        /* Lane 1: Pink */
        .note.l1 {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            animation-duration: 1.2s;
            animation-delay: 0.1s;
        }

        /* Lane 2: Cyan */
        .note.l2 {
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            animation-duration: 1.4s;
            animation-delay: 0.5s;
        }

        /* Lane 3: Green */
        .note.l3 {
            background: var(--neon-green); /* Added var */
            box-shadow: 0 0 10px var(--neon-green);
            animation-duration: 1.1s;
            animation-delay: 0.8s;
        }
        /* Define var in root if missing, but let's just use a value */
        .note.l3 { background: #00ff41; box-shadow: 0 0 10px #00ff41; }

        /* Lane 4: Purple */
        .note.l4 {
            background: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple);
            animation-duration: 1.3s;
            animation-delay: 0.3s;
        }

        /* Staggered Notes for Pattern */
        .note:nth-child(2) { animation-delay: 0.6s; }
        .note:nth-child(3) { animation-delay: 1.1s; }

        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* --- BUTTON --- */
        .btn-wrapper {
            position: relative;
            z-index: 20;
        }

        .btn-pixel {
            background: #000;
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 16px 48px;
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            
            /* Strong Outer Glow */
            box-shadow: 
                0 0 15px var(--neon-yellow),
                6px 6px 0px var(--neon-cyan);
            
            /* Pulse Animation */
            animation: btnPulse 2s infinite;
        }

        .btn-pixel:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 
                0 0 30px var(--neon-yellow),
                8px 8px 0px var(--neon-pink);
            transform: translate(-2px, -2px);
            animation: none; /* Stop pulse on hover */
        }

        .btn-pixel:active {
            transform: translate(4px, 4px);
            box-shadow: 
                0 0 5px var(--neon-yellow),
                0px 0px 0px var(--neon-cyan);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 15px var(--neon-yellow), 6px 6px 0px var(--neon-cyan); }
            50% { box-shadow: 0 0 25px var(--neon-yellow), 6px 6px 0px var(--neon-cyan); }
            100% { box-shadow: 0 0 15px var(--neon-yellow), 6px 6px 0px var(--neon-cyan); }
        }

        /* --- SCANLINES --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 50%,
                rgba(0,0,0,0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            box-shadow: inset 0 0 150px rgba(5,0,17,0.9);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .highway-wrapper { width: 80vw; height: 300px; }
            .sun-container { width: 180px; height: 180px; }
            .btn-pixel { padding: 12px 32px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlay -->
    <div class="scanlines"></div>

    <!-- Background -->
    <div class="scene-container">
        <div class="sun-container">
            <div class="sun"></div>
        </div>
        <div class="grid-floor"></div>
        <!-- Canvas for pixel stars -->
        <canvas id="starfield"></canvas>
    </div>

    <!-- Foreground -->
    <div class="content-layer">
        
        <div class="title-wrapper">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <!-- The Highway Preview -->
        <div class="highway-wrapper">
            <div class="highway-viewport">
                
                <!-- Lane 1 -->
                <div class="lane">
                    <div class="note l1"></div>
                    <div class="note l1" style="animation-delay: 0.8s;"></div>
                </div>
                
                <!-- Lane 2 -->
                <div class="lane">
                    <div class="note l2"></div>
                    <div class="note l2" style="animation-delay: 0.9s;"></div>
                </div>
                
                <!-- Lane 3 -->
                <div class="lane">
                    <div class="note l3"></div>
                    <div class="note l3" style="animation-delay: 0.4s;"></div>
                </div>
                
                <!-- Lane 4 -->
                <div class="lane">
                    <div class="note l4"></div>
                    <div class="note l4" style="animation-delay: 1.2s;"></div>
                </div>

                <!-- Hit Line -->
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-wrapper">
            <button class="btn-pixel" id="startBtn">INITIALIZE</button>
        </div>
    </div>

    <script>
        // Pixelated Starfield Logic
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let stars = [];
        const starCount = 80;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -10;
                this.z = Math.random() * 2 + 0.5; 
                this.size = Math.random() > 0.9 ? 3 : 1;
                
                // Synthwave colors
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 1.5;
                if (this.y > height) this.reset();
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); initStars(); });
        resize();
        initStars();
        animate();

        // Button Glitch Effect
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        
        btn.addEventListener('mouseenter', () => {
            // Simple RGB shift glitch on title
            let glitchCount = 0;
            const interval = setInterval(() => {
                const offset = Math.random() * 10 - 5;
                title.style.textShadow = `
                    ${offset}px 0 0 #ff0000, 
                    ${-offset}px 0 0 #00ffff,
                    3px 3px 0px var(--neon-pink)
                `;
                glitchCount++;
                if(glitchCount > 10) {
                    clearInterval(interval);
                    title.style.textShadow = `3px 3px 0px var(--neon-pink), -2px -2px 0px var(--neon-cyan)`;
                }
            }, 50);
        });

        btn.addEventListener('mouseleave', () => {
            title.style.textShadow = `3px 3px 0px var(--neon-pink), -2px -2px 0px var(--neon-cyan)`;
        });
    </script>
</body>
</html>
