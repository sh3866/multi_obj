<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --grid-color: rgba(255, 0, 255, 0.3);
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffeb3b;
            --neon-purple: #bc13fe;
            --neon-blue: #0051ff;
            --hit-line: #ffffff;
            --pixel-size: 4px; /* Base unit for pixel art scaling */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND SCENE --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* CSS Sun - Retro Synthwave Style */
        .sun {
            position: absolute;
            bottom: 35%; /* Horizon line */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: linear-gradient(to top, var(--neon-yellow), var(--neon-pink));
            border-radius: 50%;
            box-shadow: 0 0 60px var(--neon-pink);
            z-index: 2;
            /* Hard-edged retro stripes */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 78%,
                transparent 78%, transparent 82%,
                black 82%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 78%,
                transparent 78%, transparent 82%,
                black 82%, black 100%
            );
        }

        /* The Grid Floor */
        .floor {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 40%;
            background: 
                linear-gradient(transparent 0%, var(--bg-dark) 100%),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
                linear-gradient(0deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: bottom center;
            z-index: 3;
            animation: gridMove 1s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 40px; }
        }

        /* --- MAIN CONTENT --- */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        /* --- GAME TITLE --- */
        .title-container {
            position: absolute;
            top: 10%;
            text-align: center;
            width: 100%;
            z-index: 20;
        }

        h1 {
            font-size: 5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: white;
            /* Pixelated text shadow effect */
            text-shadow: 
                4px 4px 0px var(--neon-purple),
                8px 8px 0px var(--neon-cyan);
            margin: 0;
            animation: titlePulse 2s ease-in-out infinite alternate;
            /* Force crisp rendering */
            -webkit-font-smoothing: none;
            image-rendering: pixelated; 
        }

        h1 span {
            color: var(--neon-yellow);
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                8px 8px 0px var(--neon-blue);
        }

        @keyframes titlePulse {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-5px) scale(1.02); }
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 320px;
            height: 350px;
            margin-top: 120px;
            perspective: 800px;
            z-index: 15;
        }

        /* Dark overlay behind highway to separate from sun */
        .highway-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            transform: rotateX(40deg);
            transform-origin: top center;
            z-index: -1;
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 30, 0.85);
            border: 4px solid var(--neon-cyan);
            /* Crisp edges for the container */
            shape-rendering: crispEdges; 
            box-shadow: 
                0 0 20px var(--neon-cyan),
                inset 0 0 30px rgba(0, 255, 255, 0.2);
            transform: rotateX(45deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            overflow: hidden;
            /* Pixel border trick */
            border-bottom-width: 8px;
        }

        /* Lanes */
        .lane {
            flex: 1;
            position: relative;
            /* Distinct lane dividers */
            border-right: 2px solid rgba(255, 255, 255, 0.15);
            /* Ensure dividers are crisp */
            shape-rendering: crispEdges;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line - Glowing & Thick */
        .hit-line {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--hit-line);
            box-shadow: 
                0 0 10px white, 
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink);
            z-index: 5;
            /* Pixelated look */
            border-radius: 0;
        }

        /* Falling Notes - Pixel Blocks */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 32px; /* 8x8 grid units */
            /* Force pixelated rendering */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5); /* 3D block depth */
            animation: fall linear infinite;
        }

        /* Pixel Art Shapes via Masking */
        /* Lane 1: Pink - Solid Block */
        .lane:nth-child(1) .note { 
            background: #ff0055; 
            box-shadow: 0 4px 0 #80002a, 0 0 15px #ff0055;
            animation-duration: 1.8s; 
            animation-delay: 0.0s; 
        }

        /* Lane 2: Cyan - Hollow Square */
        .lane:nth-child(2) .note { 
            background: #00ffff; 
            box-shadow: 0 4px 0 #008080, 0 0 15px #00ffff;
            /* Mask to make it hollow */
            mask: linear-gradient(transparent, transparent) center/40% 40% no-repeat,
                  linear-gradient(#000, #000) 0 0/100% 100%;
            mask-composite: exclude;
            -webkit-mask: linear-gradient(transparent, transparent) center/40% 40% no-repeat,
                          linear-gradient(#000, #000) 0 0/100% 100%;
            -webkit-mask-composite: xor;
            animation-duration: 2.2s; 
            animation-delay: 0.5s; 
        }

        /* Lane 3: Green - Vertical Split */
        .lane:nth-child(3) .note { 
            background: #00ff00; 
            box-shadow: 0 4px 0 #008000, 0 0 15px #00ff00;
            /* Mask to make it split */
            mask: linear-gradient(transparent, transparent) 50% 0/20% 100%,
                  linear-gradient(#000, #000) 0 0/40% 100%;
            mask-position: 0 0, 30% 0;
            -webkit-mask: linear-gradient(transparent, transparent) 50% 0/20% 100%,
                          linear-gradient(#000, #000) 0 0/40% 100%;
            -webkit-mask-position: 0 0, 30% 0;
            animation-duration: 1.6s; 
            animation-delay: 0.2s; 
        }

        /* Lane 4: Yellow - Triangle/Arrow Top */
        .lane:nth-child(4) .note { 
            background: #ffff00; 
            box-shadow: 0 4px 0 #808000, 0 0 15px #ffff00;
            animation-duration: 1.9s; 
            animation-delay: 0.8s; 
        }

        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- BUTTONS --- */
        .btn-start {
            background: #111;
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 1.2rem 3rem;
            border: none;
            cursor: pointer;
            position: relative;
            margin-top: 2rem;
            /* Retro Arcade Button Style */
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.5), /* Inner shadow top-left */
                inset -4px -4px 0px rgba(255,255,255,0.2), /* Inner highlight bottom-right */
                4px 4px 0px var(--neon-cyan), /* Hard shadow */
                0 0 20px rgba(0, 255, 255, 0.4); /* Glow */
            transform: skewX(-10deg); /* Slight tilt for speed */
            transition: all 0.1s;
            text-shadow: 2px 2px 0px #000;
            z-index: 20;
            /* Pixel border implementation */
            outline: 4px solid var(--neon-yellow);
            outline-offset: -4px;
        }

        .btn-start:hover {
            background: #222;
            transform: skewX(-10deg) scale(1.05);
            color: #fff;
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.5),
                inset -4px -4px 0px rgba(255,255,255,0.2),
                6px 6px 0px var(--neon-cyan),
                0 0 30px rgba(0, 255, 255, 0.6);
        }

        .btn-start:active {
            transform: skewX(-10deg) scale(0.95);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.5),
                inset -4px -4px 0px rgba(255,255,255,0.2),
                2px 2px 0px var(--neon-cyan);
        }

        /* Scanline overlay for CRT effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .highway-wrapper { width: 90%; height: 300px; }
            .sun { width: 200px; height: 200px; }
            .btn-start { font-size: 1.2rem; padding: 1rem 2rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Scanlines Overlay -->
    <div class="scanlines"></div>

    <!-- Background Scene -->
    <div class="scene-container">
        <canvas id="starfield"></canvas>
        <div class="stars"></div>
        <div class="sun"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content-layer">
        
        <div class="title-container">
            <h1>PIXEL <span>DANCE</span></h1>
        </div>

        <!-- Visual Representation of Gameplay -->
        <div class="highway-wrapper">
            <div class="highway">
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders retro moving stars on the canvas behind the sun.
         * Uses square pixels to match the aesthetic.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        // Disable smoothing for pixel art look
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let stars = [];
        const starCount = 120;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
                // Randomize y initially so they don't all start at top
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.z = Math.random() * 3 + 0.5; // Depth/Speed
                this.size = Math.random() > 0.9 ? 3 : (Math.random() > 0.5 ? 2 : 1); // Varied pixel sizes
                // Color palette: White, Cyan, Magenta
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 0.8; // Move down
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.8;
                // Draw squares, not circles
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Adds a glitch effect to the title when hovering the start button.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        let glitchInterval;

        btn.addEventListener('mouseenter', () => {
            // Rapidly change text shadow for glitch effect
            glitchInterval = setInterval(() => {
                const rX = Math.random() * 10 - 5;
                const rY = Math.random() * 10 - 5;
                title.style.textShadow = `
                    ${rX}px ${rY}px 0px var(--neon-pink),
                    ${rX * -1}px ${rY * -1}px 0px var(--neon-cyan)
                `;
                title.style.transform = `skewX(${Math.random() * 20 - 10}deg)`;
            }, 50);
        });

        btn.addEventListener('mouseleave', () => {
            clearInterval(glitchInterval);
            title.style.textShadow = `
                4px 4px 0px var(--neon-purple),
                8px 8px 0px var(--neon-cyan)
            `;
            title.style.transform = 'skewX(0deg)';
        });
    </script>
</body>
</html>
