<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-deep: #050011;
            --bg-grid: #1a0b2e;
            
            /* Synthwave Palette */
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffeb3b;
            --neon-green: #00ff41;
            --neon-purple: #bc13fe;
            
            --pixel: 4px; /* The base grid unit for pixel art */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Essential for pixel fonts */
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND SCENE (The Atmosphere) --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Pixelated Sun */
        .sun-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            z-index: 1;
        }

        .sun {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--neon-yellow), var(--neon-pink));
            border-radius: 50%;
            /* Pixelated Stripes via Masking */
            -webkit-mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 80%,
                transparent 80%, transparent 90%
            );
            mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 80%,
                transparent 80%, transparent 90%
            );
            /* Hard shadow instead of blur */
            box-shadow: 10px 10px 0 rgba(0,0,0,0.5);
            animation: sunPulse 4s infinite alternate;
        }

        /* The Perspective Grid Floor */
        .grid-floor {
            position: absolute;
            top: 55%; /* Horizon line */
            left: -50%;
            width: 200%;
            height: 100vh;
            background: 
                linear-gradient(rgba(20,0,40,0) 0%, var(--bg-deep) 100%),
                linear-gradient(90deg, var(--neon-purple) 2px, transparent 2px),
                linear-gradient(0deg, var(--neon-purple) 2px, transparent 2px);
            background-size: 100% 100%, 80px 80px, 150px 150px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: top center;
            z-index: 2;
            animation: gridScroll 2s linear infinite;
            opacity: 0.6;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 80px, 0 150px; }
        }

        @keyframes sunPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.1); }
        }

        /* --- MAIN CONTENT --- */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* --- TITLE --- */
        .title-wrapper {
            margin-top: -80px; /* Visual balance with sun */
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: 4px;
            position: relative;
            display: inline-block;
            /* Hard 3D Pixel Shadow */
            text-shadow: 
                4px 4px 0px var(--neon-purple),
                8px 8px 0px var(--neon-cyan);
            animation: titleFloat 3s ease-in-out infinite;
        }
        
        /* Subtitle */
        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 8px;
            color: var(--neon-cyan);
            margin-top: -10px;
            text-shadow: 2px 2px 0px #000;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- HIGHWAY (The Game View) --- */
        .highway-container {
            position: relative;
            width: 400px;
            height: 350px;
            perspective: 600px;
            margin-bottom: 60px;
        }

        .highway-board {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            /* Pixelated Border */
            border: var(--pixel) solid #fff;
            box-shadow: 
                10px 10px 0px var(--neon-purple),
                inset 0 0 0 var(--pixel) var(--neon-purple);
            transform: rotateX(45deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* The Grid inside the Highway */
        .highway-board::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 100px 40px; /* Lane width, row height */
            pointer-events: none;
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 2px solid rgba(255,255,255,0.1);
        }
        .lane:last-child { border-right: none; }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow);
            z-index: 5;
            /* Blinking effect */
            animation: hitBlink 0.5s steps(2) infinite;
        }

        @keyframes hitBlink {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* --- PIXEL NOTES --- */
        .note {
            position: absolute;
            width: 50px;
            height: 50px;
            left: 50%;
            transform: translateX(-50%);
            /* Pixel Rendering */
            image-rendering: pixelated;
            animation: fall linear infinite;
        }

        /* Trail Effect */
        .note::after {
            content: '';
            position: absolute;
            top: -100px; /* Length of trail */
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, transparent, currentColor);
            opacity: 0.4;
            z-index: -1;
        }

        /* Lane 1: Pink Square */
        .note.pink {
            background: var(--neon-pink);
            color: var(--neon-pink); /* For trail */
            box-shadow: inset 0 0 0 4px #fff; /* Pixel detail */
            animation-duration: 1.5s;
            animation-delay: 0s;
        }

        /* Lane 2: Cyan Hollow Box */
        .note.cyan {
            background: transparent;
            border: 4px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 4px 4px 0 rgba(0, 243, 255, 0.3);
            animation-duration: 1.8s;
            animation-delay: 0.4s;
        }

        /* Lane 3: Green Vertical Bar */
        .note.green {
            width: 30px;
            background: var(--neon-green);
            color: var(--neon-green);
            border: 2px solid #fff;
            animation-duration: 1.3s;
            animation-delay: 0.2s;
        }

        /* Lane 4: Yellow Triangle (Pixelated via clip-path) */
        .note.yellow {
            background: var(--neon-yellow);
            color: var(--neon-yellow);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            /* Clip-path cuts shadows, so we use a pseudo element for the shadow if needed, or simple border */
            border: 2px solid #fff; 
            animation-duration: 1.6s;
            animation-delay: 0.7s;
        }

        @keyframes fall {
            0% { top: -60px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- START BUTTON --- */
        .btn-wrapper {
            position: relative;
            z-index: 20;
        }

        .btn-pixel {
            background: #000;
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 15px 40px;
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            
            /* The Pixel Block Shadow */
            box-shadow: 
                8px 8px 0px var(--neon-cyan),
                inset 4px 4px 0px rgba(255,255,255,0.2);
        }

        .btn-pixel:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 
                12px 12px 0px var(--neon-pink),
                inset 4px 4px 0px rgba(255,255,255,0.4);
            transform: translate(-2px, -2px);
        }

        .btn-pixel:active {
            transform: translate(4px, 4px);
            box-shadow: 
                0px 0px 0px var(--neon-cyan),
                inset 4px 4px 0px rgba(0,0,0,0.2);
        }

        /* --- SCANLINES OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            /* Vignette */
            box-shadow: inset 0 0 150px rgba(5,0,17,0.9);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .highway-container { width: 90%; }
            .sun-container { width: 200px; height: 200px; top: 10%; }
            .btn-pixel { padding: 12px 30px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlay -->
    <div class="scanlines"></div>

    <!-- Background -->
    <div class="scene-container">
        <div class="sun-container">
            <div class="sun"></div>
        </div>
        <div class="grid-floor"></div>
        <!-- Canvas for pixel stars -->
        <canvas id="starfield"></canvas>
    </div>

    <!-- Foreground -->
    <div class="content-layer">
        
        <div class="title-wrapper">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <!-- The Highway Preview -->
        <div class="highway-container">
            <div class="highway-board">
                <div class="lane">
                    <div class="note pink"></div>
                </div>
                <div class="lane">
                    <div class="note cyan"></div>
                </div>
                <div class="lane">
                    <div class="note green"></div>
                </div>
                <div class="lane">
                    <div class="note yellow"></div>
                </div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-wrapper">
            <button class="btn-pixel" id="startBtn">INITIALIZE</button>
        </div>
    </div>

    <script>
        // Pixelated Starfield Logic
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // Force pixelated rendering

        let width, height;
        let stars = [];
        const starCount = 100;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -10;
                this.z = Math.random() * 2 + 0.5; // Speed
                this.size = Math.random() > 0.95 ? 3 : (Math.random() > 0.8 ? 2 : 1);
                
                // Synthwave colors
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 1.5;
                if (this.y > height) this.reset();
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw squares for pixel look
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); initStars(); });
        resize();
        initStars();
        animate();

        // Button Glitch Effect
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        
        btn.addEventListener('mouseenter', () => {
            btn.style.animation = "none";
            
            // Simple RGB shift glitch on title
            let glitchCount = 0;
            const interval = setInterval(() => {
                const offset = Math.random() * 10 - 5;
                title.style.textShadow = `
                    ${offset}px 0 0 #ff0000, 
                    ${-offset}px 0 0 #00ffff,
                    4px 4px 0px var(--neon-purple)
                `;
                glitchCount++;
                if(glitchCount > 10) {
                    clearInterval(interval);
                    title.style.textShadow = `4px 4px 0px var(--neon-purple), 8px 8px 0px var(--neon-cyan)`;
                }
            }, 50);
        });

        btn.addEventListener('mouseleave', () => {
            title.style.textShadow = `4px 4px 0px var(--neon-purple), 8px 8px 0px var(--neon-cyan)`;
        });

    </script>
</body>
</html>
