<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #050011;
            --bg-grid: #120024;
            
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffeb3b;
            --neon-purple: #bc13fe;
            --neon-white: #ffffff;

            /* Pixel Unit */
            --p: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--neon-white);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND LAYERS --- */
        .scene-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* The Sun - Positioned behind content */
        .sun-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            z-index: 2;
        }

        .sun {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--neon-yellow), var(--neon-pink));
            border-radius: 50%;
            /* Pixelated Stripes */
            -webkit-mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 14%
            );
            mask-image: repeating-linear-gradient(
                to bottom,
                black 0%, black 10%,
                transparent 10%, transparent 14%
            );
            box-shadow: 0 0 40px var(--neon-pink);
            animation: sunPulse 4s infinite alternate ease-in-out;
        }

        /* The Grid Floor - Scrolling Animation */
        .grid-floor {
            position: absolute;
            top: 50%;
            left: -50%;
            width: 200%;
            height: 100vh;
            background: 
                linear-gradient(to bottom, rgba(5,0,17,0.8) 0%, rgba(5,0,17,0.9) 40%, transparent 100%),
                linear-gradient(90deg, var(--neon-purple) 2px, transparent 2px),
                linear-gradient(0deg, var(--neon-purple) 2px, transparent 2px);
            background-size: 100% 100%, 80px 80px, 80px 80px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: top center;
            z-index: 3;
            /* Slower scroll for better visual flow */
            animation: gridScroll 2s linear infinite;
            opacity: 0.6;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 80px, 0 80px; }
        }

        @keyframes sunPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.02); filter: brightness(1.15); }
        }

        /* --- CONTENT LAYER --- */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* --- TYPOGRAPHY --- */
        .title-wrapper {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--neon-white);
            letter-spacing: 4px;
            line-height: 0.9;
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
            
            /* Precise Glitch Effect */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            animation: titleFloat 4s ease-in-out infinite;
        }

        /* The Glitch Layers */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: var(--neon-cyan);
            z-index: -1;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-2px, -2px);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--neon-pink);
            z-index: -2;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            transform: translate(2px, 2px);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 8px;
            color: var(--neon-cyan);
            background: rgba(5, 0, 17, 0.9); /* Dark backing for legibility */
            padding: 8px 20px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 5px;
            position: relative;
            z-index: 5;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(-2px,0); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(2px,0); }
            40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-2px,0); }
            60% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); transform: translate(2px,0); }
            80% { clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%); transform: translate(-2px,0); }
            100% { clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%); transform: translate(2px,0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: polygon(0 75%, 100% 75%, 100% 80%, 0 80%); transform: translate(2px,0); }
            20% { clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%); transform: translate(-2px,0); }
            40% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); transform: translate(2px,0); }
            60% { clip-path: polygon(0 80%, 100% 80%, 100% 85%, 0 85%); transform: translate(-2px,0); }
            80% { clip-path: polygon(0 10%, 100% 10%, 100% 10%, 0 10%); transform: translate(2px,0); }
            100% { clip-path: polygon(0 55%, 100% 55%, 100% 55%, 0 55%); transform: translate(-2px,0); }
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 280px;
            height: 360px;
            perspective: 600px;
            margin-bottom: 40px;
            /* Bold Pixel Border */
            border: var(--p) solid var(--neon-white);
            box-shadow: 
                8px 8px 0px var(--neon-purple),
                0 0 20px var(--neon-purple);
            background: #000;
            overflow: hidden;
        }

        .highway-viewport {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #000 0%, #1a0033 100%);
            transform: rotateX(45deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            /* Fade out at the top */
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
        }

        /* Solid Glowing Neon Lanes */
        .lane {
            flex: 1;
            position: relative;
            border-right: 3px solid;
            border-left: 3px solid;
        }

        /* Lane Colors & Glows */
        .lane:nth-child(1) {
            border-color: var(--neon-pink);
            box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.2);
        }
        .lane:nth-child(2) {
            border-color: var(--neon-cyan);
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .lane:nth-child(3) {
            border-color: #00ff41; /* Green */
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.2);
        }
        .lane:nth-child(4) {
            border-color: var(--neon-purple);
            box-shadow: inset 0 0 15px rgba(188, 19, 254, 0.2);
        }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-yellow);
            z-index: 10;
        }

        /* --- PIXEL NOTES (Distinct Shapes) --- */
        .note {
            position: absolute;
            width: 32px;
            height: 32px;
            left: 50%;
            transform: translateX(-50%);
            image-rendering: pixelated;
            animation: fall linear infinite;
            /* Pixel Art Arrow Shape via Clip Path */
            clip-path: polygon(
                20% 0%, 80% 0%, 
                80% 20%, 100% 20%, 
                100% 80%, 80% 80%, 
                80% 100%, 20% 100%, 
                20% 80%, 0% 80%, 
                0% 20%, 20% 20%
            );
        }

        /* Note Inner Detail */
        .note::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: brightness(1.5);
            clip-path: polygon(30% 30%, 70% 30%, 70% 70%, 30% 70%);
        }

        /* Lane Specific Note Styles */
        .note.l1 { background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .note.l2 { background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .note.l3 { background: #00ff41; box-shadow: 0 0 10px #00ff41; }
        .note.l4 { background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }

        /* Animation Delays for Loop */
        .note:nth-child(1) { animation-duration: 1.5s; animation-delay: 0s; }
        .note:nth-child(2) { animation-duration: 1.5s; animation-delay: 0.75s; }
        
        /* Stagger lanes */
        .lane:nth-child(2) .note { animation-delay: 0.3s !important; }
        .lane:nth-child(3) .note { animation-delay: 0.6s !important; }
        .lane:nth-child(4) .note { animation-delay: 0.9s !important; }

        @keyframes fall {
            0% { top: -40px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* --- BUTTON --- */
        .btn-wrapper {
            position: relative;
            z-index: 20;
        }

        .btn-pixel {
            background: #000;
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 16px 56px;
            /* Single Bold Pixel Border */
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            
            /* Strong Glow */
            box-shadow: 
                0 0 15px var(--neon-yellow),
                inset 0 0 15px rgba(255, 235, 59, 0.2);
            
            /* Pulse Animation */
            animation: btnPulse 2s infinite;
        }

        .btn-pixel:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 
                0 0 40px var(--neon-yellow),
                8px 8px 0px var(--neon-pink);
            transform: translate(-2px, -2px);
            animation: none; 
        }

        .btn-pixel:active {
            transform: translate(4px, 4px);
            box-shadow: 
                0 0 5px var(--neon-yellow),
                0px 0px 0px var(--neon-cyan);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 15px rgba(255, 235, 59, 0.2); }
            50% { box-shadow: 0 0 25px var(--neon-yellow), inset 0 0 25px rgba(255, 235, 59, 0.4); }
            100% { box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 15px rgba(255, 235, 59, 0.2); }
        }

        /* --- SCANLINES --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            box-shadow: inset 0 0 150px rgba(5,0,17,0.8);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway-wrapper { width: 85vw; height: 300px; }
            .sun-container { width: 160px; height: 160px; }
            .btn-pixel { padding: 14px 40px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlay -->
    <div class="scanlines"></div>

    <!-- Background -->
    <div class="scene-container">
        <canvas id="starfield"></canvas>
        <div class="sun-container">
            <div class="sun"></div>
        </div>
        <div class="grid-floor"></div>
    </div>

    <!-- Foreground -->
    <div class="content-layer">
        
        <div class="title-wrapper">
            <!-- data-text used for glitch effect duplication -->
            <h1 data-text="PIXEL DANCE">PIXEL DANCE</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <!-- The Highway Preview -->
        <div class="highway-wrapper">
            <div class="highway-viewport">
                
                <!-- Lane 1: Pink -->
                <div class="lane">
                    <div class="note l1"></div>
                    <div class="note l1" style="animation-delay: 0.75s;"></div>
                </div>
                
                <!-- Lane 2: Cyan -->
                <div class="lane">
                    <div class="note l2"></div>
                    <div class="note l2" style="animation-delay: 1.05s;"></div>
                </div>
                
                <!-- Lane 3: Green -->
                <div class="lane">
                    <div class="note l3"></div>
                    <div class="note l3" style="animation-delay: 1.35s;"></div>
                </div>
                
                <!-- Lane 4: Purple -->
                <div class="lane">
                    <div class="note l4"></div>
                    <div class="note l4" style="animation-delay: 1.65s;"></div>
                </div>

                <!-- Hit Line -->
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-wrapper">
            <button class="btn-pixel" id="startBtn">START</button>
        </div>
    </div>

    <script>
        // Pixelated Starfield Logic
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let stars = [];
        const starCount = 100;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -10;
                this.z = Math.random() * 2 + 0.5; // Speed/Depth
                this.size = Math.random() > 0.9 ? 3 : 1;
                
                // Synthwave colors
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 1.5;
                if (this.y > height) this.reset();
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw square pixels
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); initStars(); });
        resize();
        initStars();
        animate();

        // Button Interaction
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        
        // Optional: Intensify glitch on hover
        btn.addEventListener('mouseenter', () => {
            title.style.animation = 'titleFloat 0.2s infinite, glitch-anim-1 0.3s infinite';
        });
        
        btn.addEventListener('mouseleave', () => {
            title.style.animation = 'titleFloat 4s ease-in-out infinite';
        });
    </script>
</body>
</html>
