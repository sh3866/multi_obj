<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --clr-bg-deep: #030308;
    --clr-bg-mid: #080914;
    --clr-primary: #00f0ff;
    --clr-primary-dim: rgba(0, 240, 255, 0.2);
    --clr-accent: #ff00aa;
    --clr-glass: rgba(255, 255, 255, 0.04);
    --clr-glass-border: rgba(255, 255, 255, 0.08);
    --clr-text: #ffffff;
    --clr-text-muted: rgba(255, 255, 255, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: #000;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: var(--font-ui);
    color: var(--clr-text);
  }

  /* --- DEVICE FRAME --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 390px; /* Slightly narrower for elegance */
    max-height: 844px;
    background-color: var(--clr-bg-deep);
    overflow: hidden;
    box-shadow: 0 0 0 14px #1a1a1a, 0 20px 60px rgba(0,0,0,0.9);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 92vh;
      border-radius: 48px;
      border: 12px solid #2a2a2a;
    }
  }

  /* --- BACKGROUND SCENE --- */
  .scene-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 0%, #1a1b41 0%, transparent 60%),
      radial-gradient(circle at 80% 100%, #2d1b4e 0%, transparent 50%),
      radial-gradient(circle at 10% 50%, #0d1b2a 0%, transparent 50%),
      linear-gradient(to bottom, #030308, #0a0f24);
  }
  
  /* Ambient floating particles (CSS only) */
  .dust-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 80% 40%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.3), transparent);
    background-size: 200px 200px;
    animation: drift 30s linear infinite;
    opacity: 0.4;
  }

  @keyframes drift {
    from { background-position: 0 0; }
    to { background-position: -100px 100px; }
  }

  /* --- HUD --- */
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 64px 24px 24px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .title-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .title-main {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--clr-text);
    line-height: 0.9;
    /* Metallic Gradient Text */
    background: linear-gradient(180deg, #ffffff 0%, #a5a5a5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0, 240, 255, 0.2));
  }

  .title-sub {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--clr-text-muted);
    text-transform: uppercase;
    margin-left: 1px;
  }

  .score-pill {
    background: rgba(10, 10, 15, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--clr-glass-border);
    border-radius: 100px;
    padding: 4px 4px 4px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .score-pill.pop {
    transform: scale(1.1);
  }

  .score-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.05));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--clr-primary);
    font-size: 12px;
    border: 1px solid rgba(0, 240, 255, 0.2);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
  }

  .score-val {
    font-size: 16px;
    font-weight: 600;
    color: var(--clr-text);
    min-width: 16px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    padding-right: 10px;
  }

  /* --- CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    touch-action: none;
  }

  /* --- CONTROLS --- */
  .controls {
    position: absolute;
    bottom: 48px;
    left: 0; width: 100%;
    z-index: 30;
    display: flex;
    justify-content: center;
    pointer-events: none; 
  }

  .catch-btn {
    pointer-events: auto;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 
      0 0 0 16px rgba(0, 240, 255, 0.02),
      0 12px 32px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .catch-btn::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--clr-primary), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    animation: spin 6s linear infinite;
  }
  
  @keyframes spin { to { transform: rotate(360deg); } }

  .catch-btn:active {
    transform: scale(0.92);
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--clr-primary);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
  }

  .catch-icon {
    width: 28px; height: 28px;
    stroke: var(--clr-text);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    z-index: 2;
    opacity: 0.9;
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Background Layers -->
  <div class="scene-bg"></div>
  <div class="dust-layer"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="title-group">
      <div class="title-main">AETHER<br>CATCH</div>
      <div class="title-sub">Collection</div>
    </div>
    <div class="score-pill" id="scorePill">
      <div class="score-icon">✦</div>
      <span class="score-val" id="scoreVal">0</span>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Controls -->
  <div class="controls">
    <button class="catch-btn" id="catchBtn" aria-label="Catch">
      <svg class="catch-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="6" stroke-dasharray="2 2"/>
        <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
      </svg>
    </button>
  </div>
</div>

<script>
/**
 * AETHER CATCH - REBUILT
 * Visual overhaul: Organic movement, additive blending, particle systems.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreVal = document.getElementById('scoreVal');
const scorePill = document.getElementById('scorePill');
const catchBtn = document.getElementById('catchBtn');

// --- CONFIGURATION ---
const CONFIG = {
  colors: [
    { h: 185, s: 100, l: 60 }, // Cyan
    { h: 280, s: 85, l: 70 },  // Purple
    { h: 330, s: 95, l: 65 },  // Pink
    { h: 45, s: 100, l: 65 },  // Gold
    { h: 120, s: 70, l: 55 }   // Emerald
  ],
  creatureCount: 5,
};

// --- STATE ---
let width, height;
let score = 0;
let mouse = { x: -100, y: -100, active: false };
let creatures = [];
let particles = [];
let time = 0;

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

// --- INITIALIZATION ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  
  // Init Creatures
  for(let i=0; i<CONFIG.creatureCount; i++) {
    spawnCreature(true);
  }

  // Input Handling
  const container = document.getElementById('app-container');
  
  const updateMouse = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = x - rect.left;
    mouse.y = y - rect.top;
    mouse.active = true;
  };

  container.addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY));
  
  container.addEventListener('touchmove', e => {
    e.preventDefault(); 
    updateMouse(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  container.addEventListener('touchstart', e => {
    updateMouse(e.touches[0].clientX, e.touches[0].clientY);
    attemptCatch();
  }, {passive: false});

  container.addEventListener('mousedown', () => attemptCatch());

  catchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    attemptCatch();
  });

  // Start Loop
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  // Hi-DPI scaling
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}

// --- CLASSES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = random(0.02, 0.05);
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.9; 
    this.vy *= 0.9;
    this.life -= this.decay;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
    this.reset(true);
  }

  reset(initial = false) {
    if (initial) {
      this.x = random(50, width - 50);
      this.y = random(100, height - 100);
    } else {
      // Pick a random edge
      const edge = Math.floor(Math.random() * 4);
      if (edge === 0) { this.x = random(0, width); this.y = -50; } 
      else if (edge === 1) { this.x = width + 50; this.y = random(0, height); } 
      else if (edge === 2) { this.x = random(0, width); this.y = height + 50; } 
      else { this.x = -50; this.y = random(0, height); } 
    }

    this.radius = random(16, 24);
    this.baseRadius = this.radius;
    
    // Movement: drift towards center-ish but random
    const targetX = random(width * 0.2, width * 0.8);
    const targetY = random(height * 0.2, height * 0.8);
    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    
    this.speed = random(0.5, 1.0);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    // Wobble
    this.wobbleOffset = Math.random() * 100;
    this.wobbleSpeed = random(0.02, 0.04);
    
    // Trail history
    this.history = [];
    this.maxHistory = 12;
  }

  update(time) {
    // Organic movement
    this.x += this.vx + Math.sin(time * 0.002 + this.wobbleOffset) * 0.5;
    this.y += this.vy + Math.cos(time * 0.002 + this.wobbleOffset) * 0.5;
    
    // Pulse
    this.radius = this.baseRadius + Math.sin(time * 0.005) * 3;

    // Update Trail
    this.history.push({x: this.x, y: this.y});
    if (this.history.length > this.maxHistory) this.history.shift();

    // Bounds check
    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
      this.reset();
    }
  }

  draw(ctx) {
    // Draw Trail (Bezier)
    if (this.history.length > 2) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for (let i = 1; i < this.history.length - 1; i++) {
        const xc = (this.history[i].x + this.history[i+1].x) / 2;
        const yc = (this.history[i].y + this.history[i+1].y) / 2;
        ctx.quadraticCurveTo(this.history[i].x, this.history[i].y, xc, yc);
      }
      // Connect last point
      ctx.lineTo(this.history[this.history.length-1].x, this.history[this.history.length-1].y);
      
      ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l, 0.15);
      ctx.lineWidth = this.radius * 0.6;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Draw Glow (Additive blending)
    const grd = ctx.createRadialGradient(this.x, this.y, this.radius * 0.1, this.x, this.y, this.radius * 3);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.3, hsl(this.color.h, this.color.s, this.color.l));
    grd.addColorStop(1, hsl(this.color.h, this.color.s, this.color.l, 0));

    ctx.fillStyle = grd;
    ctx.globalCompositeOperation = 'screen'; 
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // Draw Core
    ctx.fillStyle = '#fff';
    ctx.shadowColor = hsl(this.color.h, this.color.s, this.color.l);
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// --- GAME LOGIC ---

function spawnCreature(initial = false) {
  creatures.push(new Creature());
}

function createExplosion(x, y, color) {
  for(let i=0; i<24; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function attemptCatch() {
  let caught = false;
  
  // Check collision with mouse position (which acts as the "net")
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];
    const d = dist(mouse.x, mouse.y, c.x, c.y);
    
    // Hitbox is slightly larger than visual radius
    if (d < c.radius + 30) {
      createExplosion(c.x, c.y, c.color);
      creatures.splice(i, 1);
      caught = true;
      
      // Update Score
      score++;
      scoreVal.innerText = score;
      
      // UI Animation
      scorePill.classList.remove('pop');
      void scorePill.offsetWidth; // Trigger reflow
      scorePill.classList.add('pop');
      
      // Button Animation
      catchBtn.style.transform = 'scale(0.85)';
      catchBtn.style.borderColor = 'var(--clr-primary)';
      setTimeout(() => {
        catchBtn.style.transform = 'scale(1)';
        catchBtn.style.borderColor = '';
      }, 150);
      
      break; // Catch one at a time
    }
  }

  if (caught) {
    setTimeout(() => spawnCreature(), 600);
  }
}

// --- RENDER LOOP ---

function drawNet() {
  if (!mouse.active) return;

  const x = mouse.x;
  const y = mouse.y;
  const r = 38;

  ctx.save();
  ctx.translate(x, y);
  
  // Outer Ring
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.stroke();

  // Inner Crosshair
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-r - 8, 0); ctx.lineTo(r + 8, 0);
  ctx.moveTo(0, -r - 8); ctx.lineTo(0, r + 8);
  ctx.stroke();

  // Rotating Dashed Ring
  ctx.rotate(Date.now() * 0.001);
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
  ctx.stroke();

  // Center Dot
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function loop(time) {
  time += 16; // approximate ms per frame
  
  // Clear
  ctx.clearRect(0, 0, width, height);
  
  // Update & Draw Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Draw Net (Cursor)
  drawNet();

  requestAnimationFrame(loop);
}

// Boot
init();

</script>
</body>
</html>
