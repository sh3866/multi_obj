<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Game of Life</title>
    <style>
        :root {
            --bg-color: #030305;
            --panel-bg: rgba(12, 13, 18, 0.65);
            --panel-border: rgba(255, 255, 255, 0.06);
            --accent-primary: #00f2ff;
            --accent-secondary: #bd00ff;
            --text-primary: #f0f0f0;
            --text-secondary: #8892b0;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Main Layout */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Canvas Area */
        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            overflow: hidden;
        }
        
        .viewport:active {
            cursor: grabbing;
        }

        /* Subtle Background Grain/Gradient */
        .viewport::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(20, 20, 30, 1) 0%, rgba(3, 3, 5, 1) 80%);
            z-index: -1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Control Panel */
        .sidebar {
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border-left: 1px solid var(--panel-border);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            gap: 48px;
            height: 100%;
            overflow-y: auto;
            box-shadow: -10px 0 80px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Typography */
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
            font-weight: 400;
            max-width: 300px;
        }

        /* Controls */
        .control-section {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .label-val {
            color: var(--text-primary);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
            text-transform: none;
            font-size: 12px;
        }

        /* Custom Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        
        /* Firefox Slider Support */
        input[type=range]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border: none;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-stack);
            letter-spacing: 0.01em;
            outline: none;
        }

        button:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid rgba(0, 242, 255, 0.3);
            color: var(--accent-primary);
        }

        button.primary:hover {
            background: rgba(0, 242, 255, 0.15);
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }

        button.danger {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.15);
            width: 100%;
        }
        
        button.danger:hover {
            background: rgba(255, 107, 107, 0.08);
            border-color: rgba(255, 107, 107, 0.4);
        }

        /* Stats Area */
        .stats-container {
            margin-top: auto;
            padding-top: 32px;
            border-top: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-val {
            font-size: 28px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 45%;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                padding: 32px;
                box-shadow: 0 -10px 60px rgba(0,0,0,0.5);
            }
            .viewport {
                height: 55%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="viewport" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="sidebar">
            <div class="header-section">
                <h1>Sphere Life</h1>
                <p class="description">A cellular automaton simulation projected onto a 3D spherical manifold. Drag to rotate the sphere.</p>
            </div>

            <div class="control-section">
                <div class="control-item">
                    <div class="label-row">
                        <span>Simulation Speed</span>
                        <span class="label-val" id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div class="control-item">
                    <div class="label-row">
                        <span>Grid Resolution</span>
                        <span class="label-val" id="densityVal">High</span>
                    </div>
                    <input type="range" id="densitySlider" min="15" max="60" value="30">
                </div>
            </div>

            <div class="control-section">
                <div class="label-row">
                    <span>Actions</span>
                </div>
                <div class="btn-group">
                    <button class="primary" id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button class="danger" id="clearBtn">Clear Grid</button>
            </div>

            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;
        const dpr = Math.min(window.devicePixelRatio, 2); // Cap DPR for performance

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 30, 
            speed: 10, 
            baseHue: 190, // Cyan-ish
            evolutionRate: 0.05
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellColors = []; // Store hue offsets for each cell
        let cellAges = []; // Store age for visual variety
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.3; // Initial tilt
        let rotationY = 0;
        let targetRotationX = 0.3;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value; 
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                // Invert text logic slightly for UX
                document.getElementById('densityVal').innerText = val < 30 ? "High" : (val < 50 ? "Med" : "Low");
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
                document.getElementById('toggleBtn').classList.toggle('primary');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellColors = cellColors.map(row => row.fill(0));
                cellAges = cellAges.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            // HiDPI scaling
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            // CSS size
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; // 2:1 Aspect Ratio for sphere mapping
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellColors = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAges = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Random initialization
                    const isAlive = Math.random() > 0.5;
                    grid[y][x] = isAlive ? 1 : 0;
                    
                    // Initial random hue shift
                    cellColors[y][x] = Math.random() * 60 - 30; 
                    cellAges[y][x] = Math.random() * 100;
                    
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellColors[y][x] = 0; // Newborn reset color
                        cellAges[y][x] = 0;
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) {
                            cellColors[y][x] += CONFIG.evolutionRate;
                            cellAges[y][x]++;
                        }
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            // Update DOM every 10 frames to reduce IO
            if (frameCount % 10 === 0) {
                document.getElementById('genCount').innerText = generation;
                document.getElementById('popCount').innerText = population;
            }
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);

            // Smooth rotation
            if (!isDragging) {
                targetRotationY += 0.002; // Elegant auto-spin
            }
            rotationX += (targetRotationX - rotationX) * 0.08;
            rotationY += (targetRotationY - rotationY) * 0.08;

            // Draw Sphere Atmosphere/Glow (Subtle)
            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.3);
            gradient.addColorStop(0, 'rgba(0, 242, 255, 0.03)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.3, 0, Math.PI * 2);
            ctx.fill();

            // Draw Grid Cells
            // We iterate all cells. To fake depth sorting properly for additive blending,
            // we ideally draw back to front, but for a dense grid, we just draw all 
            // and rely on alpha.
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        drawCell(x, y);
                    }
                }
            }
        }

        function drawCell(col, row) {
            // Map grid coordinates to Sphere Surface
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates on Sphere
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Apply Rotation (Y axis then X axis)
            // Rotate Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotate X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective Projection
            const fov = 800;
            const scale = fov / (fov + z2);
            
            // Don't draw if behind the sphere or too small
            if (scale < 0.05) return;

            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            // Calculate cell size
            // We want the cells to touch at the equator, so size depends on arc length
            const cellSize = (radius * 0.055) * scale; 

            // Color Logic
            // Base cyan/blue, shift based on age
            const hue = (CONFIG.baseHue + cellColors[row][col] * 15 + cellAges[row][col] * 0.5) % 360;
            
            // Brightness based on Z-depth (front is brighter)
            // z2 ranges from -radius (front) to +radius (back)
            const depthFactor = (-z2 + radius) / (2 * radius); // 1.0 at front, 0.0 at back
            
            // Use a smoother curve for lighting
            const lightness = 50 + (Math.pow(depthFactor, 2) * 40); 
            const alpha = Math.min(1, Math.pow(depthFactor, 0.5) * 1.5); 
            
            // Don't draw if too transparent
            if (alpha < 0.05) return;

            ctx.fillStyle = `hsla(${hue}, 95%, ${lightness}%, ${alpha})`;
            
            // Additive blending for glow effect
            ctx.globalCompositeOperation = 'lighter';

            // Add glow to front cells
            if (z2 < -radius * 0.3) {
                ctx.shadowBlur = 10 * scale;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.5)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.arc(screenX, screenY, cellSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow and composite
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'source-over';
        }

        function loop() {
            if (isRunning) {
                // Run simulation steps based on speed slider
                // If speed is 20 (slow), we update every 20 frames
                // If speed is 1 (fast), we update every frame
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
