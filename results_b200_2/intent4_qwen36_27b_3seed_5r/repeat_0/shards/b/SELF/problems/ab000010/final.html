<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifold: Spherical Life</title>
    <style>
        :root {
            --bg: #050508;
            --panel-bg: rgba(10, 10, 12, 0.65);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --text-main: #eef2ff;
            --text-muted: #6b7c93;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Roboto Mono", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Ambient Background */
        .ambient-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.5) 0%, rgba(5,5,8,1) 80%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Layout */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        /* Viewport */
        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            overflow: hidden;
        }
        
        .viewport:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 420px;
            background: var(--panel-bg);
            backdrop-filter: blur(50px) saturate(130%);
            -webkit-backdrop-filter: blur(50px) saturate(130%);
            border-left: 1px solid var(--panel-border);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            gap: 50px;
            height: 100%;
            overflow-y: auto;
            box-shadow: -20px 0 80px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Typography */
        .brand {
            margin-bottom: 10px;
        }
        
        h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            line-height: 1;
        }

        .description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            font-weight: 400;
            border-left: 2px solid var(--accent);
            padding-left: 16px;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.03) 0%, transparent 100%);
            padding-top: 8px;
            padding-bottom: 8px;
        }

        /* Controls */
        .control-section {
            display: flex;
            flex-direction: column;
            gap: 45px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .label-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        .label-val {
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 13px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* High-end Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -9px;
            box-shadow: 0 0 0 4px rgba(0,0,0,0.4), 0 0 15px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.4), 0 0 20px var(--accent);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            font-family: var(--font-ui);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        button:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        button.primary {
            background: rgba(0, 240, 255, 0.08);
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
        }

        button.primary:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        button.danger {
            color: #ff5c72;
            border-color: rgba(255, 92, 114, 0.15);
            width: 100%;
            margin-top: 8px;
        }
        
        button.danger:hover {
            background: rgba(255, 92, 114, 0.1);
            border-color: rgba(255, 92, 114, 0.5);
            box-shadow: 0 0 20px rgba(255, 92, 114, 0.15);
        }

        /* Stats */
        .stats-container {
            margin-top: auto;
            padding-top: 40px;
            border-top: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-val {
            font-size: 48px;
            font-weight: 200;
            font-family: var(--font-mono);
            color: #fff;
            letter-spacing: -0.04em;
            line-height: 1;
            text-shadow: 0 0 30px rgba(255,255,255,0.15);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { 
                width: 100%; 
                height: auto; 
                flex: 0 0 45%; 
                border-left: none; 
                border-top: 1px solid var(--panel-border);
                padding: 40px;
                box-shadow: 0 -20px 80px rgba(0,0,0,0.4);
            }
            .viewport { flex: 1; }
        }
    </style>
</head>
<body>

    <div class="ambient-layer"></div>

    <div class="app-container">
        <div class="viewport" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="sidebar">
            <div class="brand">
                <h1>Manifold</h1>
                <p class="description">A cellular automaton simulation projected onto a 3D spherical manifold. Drag to rotate the sphere.</p>
            </div>

            <div class="control-section">
                <div class="control-item">
                    <div class="label-row">
                        <span class="label-title">Simulation Speed</span>
                        <span class="label-val" id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div class="control-item">
                    <div class="label-row">
                        <span class="label-title">Grid Resolution</span>
                        <span class="label-val" id="densityVal">High</span>
                    </div>
                    <input type="range" id="densitySlider" min="15" max="60" value="30">
                </div>
            </div>

            <div class="control-section">
                <div class="label-row">
                    <span class="label-title">Actions</span>
                </div>
                <div class="btn-group">
                    <button class="primary" id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button class="danger" id="clearBtn">Clear Grid</button>
            </div>

            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;
        const dpr = Math.min(window.devicePixelRatio, 2);

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 30, 
            speed: 10, 
            baseHue: 180, // Cyan/Blue base
            evolutionRate: 0.05
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellColors = []; 
        let cellAges = []; 
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.3; 
        let rotationY = 0;
        let targetRotationX = 0.3;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value; 
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                document.getElementById('densityVal').innerText = val < 30 ? "High" : (val < 50 ? "Med" : "Low");
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
                document.getElementById('toggleBtn').classList.toggle('primary');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellColors = cellColors.map(row => row.fill(0));
                cellAges = cellAges.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellColors = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAges = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const isAlive = Math.random() > 0.55;
                    grid[y][x] = isAlive ? 1 : 0;
                    
                    // More vibrant initial colors
                    cellColors[y][x] = Math.random() * 120 - 60; 
                    cellAges[y][x] = Math.random() * 100;
                    
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellColors[y][x] = 0; 
                        cellAges[y][x] = 0;
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) {
                            cellColors[y][x] += CONFIG.evolutionRate;
                            cellAges[y][x]++;
                        }
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            if (frameCount % 10 === 0) {
                document.getElementById('genCount').innerText = generation;
                document.getElementById('popCount').innerText = population;
            }
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            // Smooth rotation
            if (!isDragging) {
                targetRotationY += 0.001; 
            }
            rotationX += (targetRotationX - rotationX) * 0.08;
            rotationY += (targetRotationY - rotationY) * 0.08;

            // Draw Sphere Atmosphere (Subtle)
            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.6);
            gradient.addColorStop(0, 'rgba(0, 240, 255, 0.03)'); 
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.6, 0, Math.PI * 2);
            ctx.fill();

            // Draw Grid Cells
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        drawCell(x, y);
                    }
                }
            }
        }

        function drawCell(col, row) {
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Rotate Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotate X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            const fov = 800;
            const scale = fov / (fov + z2);
            
            if (scale < 0.05) return;

            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            const cellSize = (radius * 0.055) * scale; 

            // Color Logic - Cyan/Magenta/Purple
            const hue = (CONFIG.baseHue + cellColors[row][col] * 25 + cellAges[row][col] * 0.5) % 360;
            
            // Depth lighting
            const depthFactor = (-z2 + radius) / (2 * radius); 
            
            // Sharper lighting contrast
            const lightness = 50 + (Math.pow(depthFactor, 1.5) * 50); 
            const alpha = Math.min(1, Math.pow(depthFactor, 0.8) * 1.2); 
            
            if (alpha < 0.05) return;

            ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
            
            ctx.globalCompositeOperation = 'lighter';

            // Enhanced glow for front cells
            if (z2 < -radius * 0.3) {
                ctx.shadowBlur = 12 * scale;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.arc(screenX, screenY, cellSize, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'source-over';
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        init();

    </script>
</body>
</html>
