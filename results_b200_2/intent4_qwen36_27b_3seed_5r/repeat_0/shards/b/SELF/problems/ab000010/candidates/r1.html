<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Game of Life</title>
    <style>
        :root {
            --bg-color: #050507;
            --panel-bg: rgba(10, 12, 16, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff;
            --accent-alt: #7000ff;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Background */
        .ambient-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 242, 255, 0.03) 0%, rgba(0,0,0,0) 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 360px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: grab;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        /* Control Panel */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-left: 1px solid var(--panel-border);
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            height: 100%;
            overflow-y: auto;
            box-shadow: -20px 0 60px rgba(0,0,0,0.4);
            z-index: 10;
        }

        /* Header */
        .panel-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 400;
            max-width: 280px;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .label-val {
            color: var(--text-primary);
            font-family: monospace;
            text-transform: none;
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-top: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-stack);
            letter-spacing: 0.01em;
        }

        button:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.primary {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid rgba(0, 242, 255, 0.4);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.05);
        }

        button.primary:hover {
            background: rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.15);
        }

        button.danger {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.15);
            margin-top: 4px;
            width: 100%;
        }
        button.danger:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.4);
        }

        /* Stats */
        .stats {
            margin-top: auto;
            padding-top: 32px;
            border-top: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: auto;
                max-height: 45vh;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                padding: 32px;
                border-radius: 24px 24px 0 0;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h1>Sphere Life</h1>
                <p class="subtitle">A cellular automaton simulation projected onto a 3D spherical manifold. Drag to rotate.</p>
            </div>

            <div class="control-group">
                <div>
                    <div class="label-row">
                        <span>Simulation Speed</span>
                        <span class="label-val" id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div>
                    <div class="label-row">
                        <span>Grid Resolution</span>
                        <span class="label-val" id="densityVal">High</span>
                    </div>
                    <input type="range" id="densitySlider" min="15" max="50" value="25">
                </div>
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Actions</span>
                </div>
                <div class="btn-group">
                    <button class="primary" id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button class="danger" id="clearBtn">Clear Grid</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 25, 
            speed: 10, 
            baseHue: 190, // Cyan-ish
            evolutionRate: 0.05
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellColors = []; // Store hue offsets for each cell
        let cellAges = []; // Store age for visual variety
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.4; // Initial tilt
        let rotationY = 0;
        let targetRotationX = 0.4;
        let targetRotationY = 0;
        let autoRotateY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value; 
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                // Invert text logic slightly for UX
                document.getElementById('densityVal').innerText = val < 25 ? "High" : (val < 40 ? "Med" : "Low");
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
                document.getElementById('toggleBtn').classList.toggle('primary');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellColors = cellColors.map(row => row.fill(0));
                cellAges = cellAges.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            // HiDPI scaling
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            // CSS size
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.32;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2;
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellColors = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAges = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Random initialization
                    const isAlive = Math.random() > 0.55;
                    grid[y][x] = isAlive ? 1 : 0;
                    
                    // Initial random hue shift
                    cellColors[y][x] = Math.random() * 60 - 30; 
                    cellAges[y][x] = Math.random() * 100;
                    
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellColors[y][x] = 0; // Newborn reset color
                        cellAges[y][x] = 0;
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) {
                            cellColors[y][x] += CONFIG.evolutionRate;
                            cellAges[y][x]++;
                        }
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, width, height);

            // Smooth rotation
            if (!isDragging) {
                targetRotationY += 0.0015; // Slower, more elegant auto-spin
            }
            rotationX += (targetRotationX - rotationX) * 0.08;
            rotationY += (targetRotationY - rotationY) * 0.08;

            // Draw Sphere Atmosphere/Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.9, centerX, centerY, radius * 1.15);
            gradient.addColorStop(0, 'rgba(0, 242, 255, 0.02)');
            gradient.addColorStop(0.5, 'rgba(0, 100, 255, 0.05)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Grid Cells
            // We iterate all cells. To fake depth sorting properly for additive blending,
            // we ideally draw back to front, but for a dense grid, we just draw all 
            // and rely on alpha.
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        drawCell(x, y);
                    }
                }
            }
        }

        function drawCell(col, row) {
            // Map grid coordinates to Sphere Surface
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates on Sphere
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Apply Rotation (Y axis then X axis)
            // Rotate Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotate X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective Projection
            const fov = 900;
            const scale = fov / (fov + z2);
            
            // Don't draw if behind the sphere
            if (scale < 0.1) return;

            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            // Calculate cell size
            // We want the cells to touch at the equator, so size depends on arc length
            const cellSize = (radius * 0.065) * scale; 

            // Color Logic
            // Base cyan/blue, shift based on age
            const hue = (CONFIG.baseHue + cellColors[row][col] * 15 + cellAges[row][col] * 0.5) % 360;
            
            // Brightness based on Z-depth (front is brighter)
            // z2 ranges from -radius (front) to +radius (back)
            const depthFactor = (-z2 + radius) / (2 * radius); // 1.0 at front, 0.0 at back
            const lightness = 40 + (depthFactor * 40); // 40% to 80% lightness
            const alpha = Math.min(1, depthFactor * 1.8); // Fade out back cells
            
            ctx.fillStyle = `hsla(${hue}, 90%, ${lightness}%, ${alpha})`;
            
            // Additive blending for glow effect
            ctx.globalCompositeOperation = 'lighter';

            // Add glow to front cells
            if (z2 < -radius * 0.2) {
                ctx.shadowBlur = 8 * scale;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.6)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.arc(screenX, screenY, cellSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow and composite
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'source-over';
        }

        function loop() {
            if (isRunning) {
                // Run simulation steps based on speed slider
                // If speed is 20 (slow), we update every 20 frames
                // If speed is 1 (fast), we update every frame
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
