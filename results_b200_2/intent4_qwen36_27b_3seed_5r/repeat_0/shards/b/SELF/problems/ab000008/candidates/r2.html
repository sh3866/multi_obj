<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --bg-light: #1a0033;
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffea00;
            --neon-purple: #bc13fe;
            --grid-line: rgba(188, 19, 254, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND LAYERS --- */
        
        /* 1. The Canvas (Stars) */
        #starfield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* 2. The Retro Sun (CSS) */
        .sun-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            z-index: 1;
            pointer-events: none;
        }

        .sun {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--neon-pink) 0%, #ff9900 100%);
            /* The "Blade Runner" horizontal stripes mask */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 50%,
                transparent 50%, transparent 53%,
                black 53%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 72%,
                transparent 72%, transparent 77%,
                black 77%, black 85%,
                transparent 85%, transparent 90%,
                black 90%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 50%,
                transparent 50%, transparent 53%,
                black 53%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 72%,
                transparent 72%, transparent 77%,
                black 77%, black 85%,
                transparent 85%, transparent 90%,
                black 90%, black 100%
            );
            box-shadow: 0 0 60px var(--neon-pink), 0 0 100px rgba(255, 0, 85, 0.4);
            opacity: 0.9;
        }

        /* 3. The Grid Floor (CSS) */
        .floor-container {
            position: absolute;
            bottom: -30%;
            left: -50%;
            width: 200%;
            height: 80%;
            perspective: 600px;
            z-index: 2;
            pointer-events: none;
        }

        .grid-floor {
            width: 100%;
            height: 100%;
            background: 
                /* Fade to black at horizon */
                linear-gradient(to bottom, rgba(5,0,17,0) 0%, rgba(5,0,17,1) 60%),
                /* Vertical lines */
                repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 2px, transparent 2px, transparent 80px),
                /* Horizontal lines */
                repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 2px, transparent 2px, transparent 80px);
            transform: rotateX(75deg);
            transform-origin: center top;
            animation: gridScroll 2s linear infinite;
            box-shadow: 0 0 100px var(--neon-purple) inset;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 80px; }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-layer > * {
            pointer-events: auto;
        }

        /* --- TITLE --- */
        .title-wrapper {
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: 0.1em;
            color: #fff;
            position: relative;
            /* 3D Layering Effect */
            text-shadow: 
                0 0 5px var(--neon-cyan),
                0 0 10px var(--neon-cyan),
                4px 4px 0px var(--neon-pink);
            animation: floatTitle 3s ease-in-out infinite;
        }

        h1 span {
            display: block;
            font-size: 0.5em;
            color: var(--neon-yellow);
            letter-spacing: 0.5em;
            margin-top: 10px;
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
            margin-bottom: 3rem;
        }

        /* The angled road container */
        .highway {
            width: 200px;
            height: 100%;
            position: relative;
            /* The trapezoid shape */
            transform: rotateX(40deg) scale(1.2);
            transform-style: preserve-3d;
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid var(--neon-cyan);
            border-right: 4px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            /* Mask to fade top */
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
            overflow: hidden;
        }

        /* Lane markers */
        .highway::before, .highway::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.1);
        }
        .highway::before { left: 33%; }
        .highway::after { left: 66%; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 60px;
            left: -20px; right: -20px;
            height: 6px;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--neon-pink);
            z-index: 5;
            border-radius: 2px;
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 22%; /* Slightly less than lane width for spacing */
            height: 20px;
            left: 1%;
            border-radius: 4px;
            box-shadow: 0 0 15px currentColor;
            opacity: 0;
            animation: dropNote linear infinite;
        }

        /* Specific Note Styles */
        .note-1 { 
            background: var(--neon-pink); color: var(--neon-pink); 
            left: 0%; 
            animation-duration: 1.5s; animation-delay: 0.2s; 
        }
        .note-2 { 
            background: var(--neon-cyan); color: var(--neon-cyan); 
            left: 28%; 
            animation-duration: 1.8s; animation-delay: 0.8s; 
        }
        .note-3 { 
            background: var(--neon-yellow); color: var(--neon-yellow); 
            left: 56%; 
            animation-duration: 1.4s; animation-delay: 0.5s; 
        }
        .note-4 { 
            background: var(--neon-purple); color: var(--neon-purple); 
            left: 84%; 
            animation-duration: 1.6s; animation-delay: 1.1s; 
        }

        @keyframes dropNote {
            0% { top: -10%; opacity: 0; transform: scaleY(1.5); }
            10% { opacity: 1; transform: scaleY(1); }
            80% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* --- BUTTON --- */
        .btn-wrapper {
            position: relative;
        }

        .btn-start {
            background: rgba(0,0,0,0.5);
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1.2rem 4rem;
            border: 3px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            letter-spacing: 0.2em;
            box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 15px var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
            overflow: hidden;
        }

        .btn-start:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 30px var(--neon-yellow);
            transform: scale(1.05);
            text-shadow: none;
        }

        /* Glitch Effect on Hover */
        .btn-start::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transition: 0.5s;
        }

        .btn-start:hover::before {
            left: 100%;
        }

        /* --- CRT OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, #000 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 0.6em; letter-spacing: 0.2em; }
            .sun-container { width: 300px; height: 300px; top: 10%; }
            .highway-wrapper { width: 300px; height: 300px; }
            .btn-start { padding: 1rem 2.5rem; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background Scene -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="sun"></div>
    </div>

    <div class="floor-container">
        <div class="grid-floor"></div>
    </div>

    <!-- Main Content -->
    <div class="ui-layer">
        
        <div class="title-wrapper">
            <h1>PIXEL <span>DANCE</span></h1>
        </div>

        <div class="highway-wrapper">
            <div class="highway">
                <div class="note note-1"></div>
                <div class="note note-2"></div>
                <div class="note note-3"></div>
                <div class="note note-4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-wrapper">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>

    </div>

    <script>
        /**
         * Starfield Logic
         * Renders a retro 3D perspective starfield.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 200;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                // Spread stars wide to avoid empty center
                this.x = (Math.random() - 0.5) * width * 2.5; 
                this.y = (Math.random() - 0.5) * height * 2.5;
                this.z = initial ? Math.random() * 2000 : 2000;
            }

            update() {
                this.z -= 5; // Speed
                if (this.z <= 0) {
                    this.reset();
                }
            }

            draw() {
                // Perspective projection
                const x = (this.x / this.z) * (width / 2) + (width / 2);
                const y = (this.y / this.z) * (height / 2) + (height / 2);
                
                // Size based on depth
                const s = (1 - this.z / 2000) * 2.5;

                if (x < 0 || x > width || y < 0 || y > height) return;

                // Color shift based on depth
                ctx.fillStyle = this.z < 500 ? '#ff00ff' : (this.z < 1000 ? '#bc13fe' : '#ffffff');
                
                // Draw square pixels
                ctx.globalAlpha = (1 - this.z / 2000);
                ctx.fillRect(x, y, s, s);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Interactive Glitch Effect
         * When hovering the button, the title glitches.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        const originalShadow = "0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 4px 4px 0px var(--neon-pink)";
        let glitchInterval;

        btn.addEventListener('mouseenter', () => {
            glitchInterval = setInterval(() => {
                const x = (Math.random() * 10 - 5).toFixed(1);
                const y = (Math.random() * 10 - 5).toFixed(1);
                title.style.transform = `translate(${x}px, ${y}px)`;
                title.style.textShadow = `
                    ${Math.random()*10}px ${Math.random()*10}px 0px var(--neon-pink),
                    -${Math.random()*10}px -${Math.random()*10}px 0px var(--neon-cyan)
                `;
            }, 50);
        });

        btn.addEventListener('mouseleave', () => {
            clearInterval(glitchInterval);
            title.style.transform = 'translate(0,0)';
            title.style.textShadow = originalShadow;
        });
    </script>
</body>
</html>
