<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-yellow: #ffea00;
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- LAYOUT CONTAINER --- */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            /* Center everything vertically */
            padding: 2rem;
        }

        /* --- TITLE SECTION --- */
        .title-section {
            position: relative;
            margin-bottom: 2rem;
            text-align: center;
            z-index: 20;
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -0.05em;
            color: #fff;
            /* Pixelated look */
            text-shadow: 
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-purple),
                4px 4px 0px var(--neon-pink);
            /* Slight skew for dynamism */
            transform: skew(-5deg);
            animation: titlePulse 4s ease-in-out infinite;
        }

        h1 span {
            display: block;
            font-size: 0.4em;
            color: var(--neon-yellow);
            letter-spacing: 0.8em;
            margin-top: 0.5rem;
            text-shadow: 0 0 15px var(--neon-yellow);
            transform: skew(5deg); /* Counter skew */
        }

        @keyframes titlePulse {
            0%, 100% { opacity: 1; transform: skew(-5deg) scale(1); }
            50% { opacity: 0.95; transform: skew(-5deg) scale(1.02); }
        }

        /* --- GAME HIGHWAY (CANVAS) --- */
        .highway-container {
            position: relative;
            width: 600px;
            height: 200px; /* Viewport height of the game */
            margin-bottom: 3rem;
            perspective: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            /* Clip the canvas to a futuristic trapezoid shape */
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
            background: rgba(0, 0, 0, 0.4);
            border-top: 2px solid var(--neon-cyan);
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        /* Overlay decorative elements for the highway */
        .highway-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(5,0,17,0.8) 0%, transparent 20%, transparent 80%, rgba(5,0,17,0.8) 100%);
            z-index: 5;
        }

        /* --- START BUTTON --- */
        .btn-wrapper {
            position: relative;
        }

        .btn-start {
            background: rgba(0, 0, 0, 0.6);
            color: var(--neon-yellow);
            font-family: var(--font-main);
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1.2rem 5rem;
            border: 2px solid var(--neon-yellow);
            cursor: pointer;
            letter-spacing: 0.2em;
            box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 15px rgba(255, 234, 0, 0.2);
            text-shadow: 0 0 5px var(--neon-yellow);
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            /* Pixelated corners */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
        }

        .btn-start:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 40px var(--neon-yellow);
            transform: scale(1.05) skew(-2deg);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- CRT EFFECTS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.5;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, #000 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            h1 span { letter-spacing: 0.3em; }
            .highway-container { width: 90%; height: 150px; }
            .btn-start { font-size: 1.5rem; padding: 1rem 3rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background: Synthwave Sun & Grid -->
    <canvas id="bg-canvas"></canvas>

    <!-- Main Content -->
    <div class="main-container">
        
        <div class="title-section">
            <h1>PIXEL <span>DANCE</span></h1>
        </div>

        <div class="highway-container">
            <div class="highway-overlay"></div>
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="btn-wrapper">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>

    </div>

    <script>
        /**
         * 1. BACKGROUND SCENE RENDERER (Sun, Grid, Stars)
         * Uses Canvas for a unified, performant retro aesthetic.
         */
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let w, h;

        function resizeBg() {
            w = window.innerWidth;
            h = window.innerHeight;
            bgCanvas.width = w;
            bgCanvas.height = h;
        }

        // Grid Animation State
        let gridOffset = 0;
        const gridSpeed = 2;

        function drawBackground() {
            // Clear with deep space color
            bgCtx.fillStyle = '#050011';
            bgCtx.fillRect(0, 0, w, h);

            // 1. Draw Stars
            bgCtx.fillStyle = '#fff';
            for(let i=0; i<50; i++) {
                const sx = (Math.sin(i * 132.1) * w + w) % w;
                const sy = (Math.cos(i * 45.3) * h * 0.5) % (h/2); // Top half only
                const size = (Math.sin(Date.now() * 0.001 + i) + 1) * 1.5;
                bgCtx.globalAlpha = 0.3 + Math.random() * 0.4;
                bgCtx.fillRect(sx, sy, size, size);
            }
            bgCtx.globalAlpha = 1;

            // 2. Draw Retro Sun
            const sunY = h * 0.45;
            const sunSize = Math.min(w, h) * 0.25;
            
            // Sun Gradient
            const sunGrad = bgCtx.createLinearGradient(0, sunY - sunSize, 0, sunY + sunSize);
            sunGrad.addColorStop(0, '#ffea00');
            sunGrad.addColorStop(1, '#ff0055');

            bgCtx.save();
            bgCtx.translate(w/2, sunY);
            bgCtx.beginPath();
            bgCtx.arc(0, 0, sunSize, 0, Math.PI * 2);
            bgCtx.fillStyle = sunGrad;
            bgCtx.fill();

            // Sun Stripes (The "Blade Runner" cut)
            bgCtx.fillStyle = '#050011'; // Match bg color to cut out
            for(let i=0; i<10; i++) {
                const ly = (i * sunSize * 0.25) - sunSize + 20;
                const lh = 4 + (i * 1.5); // Lines get thicker towards bottom
                bgCtx.fillRect(-sunSize, ly, sunSize * 2, lh);
            }
            bgCtx.restore();

            // 3. Draw Floor Grid
            const horizonY = h * 0.45;
            const floorH = h - horizonY;
            
            bgCtx.save();
            bgCtx.beginPath();
            bgCtx.rect(0, horizonY, w, floorH);
            bgCtx.clip(); // Clip grid to floor area

            // Vertical Perspective Lines
            bgCtx.strokeStyle = 'rgba(188, 19, 254, 0.4)'; // Neon Purple
            bgCtx.lineWidth = 2;
            bgCtx.beginPath();
            // Center vanishing point
            const cx = w / 2;
            
            // Draw lines radiating from center
            for (let i = -10; i <= 10; i++) {
                const x = cx + (i * 100); 
                // Fan them out
                bgCtx.moveTo(cx + (i * 10), horizonY); // Start near center at horizon
                bgCtx.lineTo(cx + (i * w * 0.8), h); // End wide at bottom
            }
            bgCtx.stroke();

            // Horizontal Moving Lines
            // We simulate movement by changing the logarithmic spacing offset
            gridOffset = (gridOffset + gridSpeed) % 40; 
            
            // Draw horizontal lines with perspective spacing
            for (let i = 0; i < 20; i++) {
                // Exponential spacing for depth
                const perspective = (i * i) / 100; 
                const y = horizonY + perspective * (floorH / 20) + (gridOffset * (perspective/20));
                
                if (y > h) continue;

                // Fade in from horizon
                const alpha = Math.min(1, (y - horizonY) / (floorH * 0.5));
                bgCtx.strokeStyle = `rgba(0, 243, 255, ${alpha * 0.5})`; // Neon Cyan
                bgCtx.beginPath();
                bgCtx.moveTo(0, y);
                bgCtx.lineTo(w, y);
                bgCtx.stroke();
            }
            bgCtx.restore();

            requestAnimationFrame(drawBackground);
        }

        /**
         * 2. GAME HIGHWAY RENDERER
         * Renders the 4 lanes, hit line, and falling notes.
         */
        const gameCanvas = document.getElementById('game-canvas');
        const gCtx = gameCanvas.getContext('2d');
        let gw, gh;

        function resizeGame() {
            // Get CSS dimensions
            const rect = gameCanvas.getBoundingClientRect();
            gw = rect.width;
            gh = rect.height;
            // Set internal resolution (slightly higher for crispness)
            gameCanvas.width = gw * 2; 
            gameCanvas.height = gh * 2;
            gCtx.scale(2, 2);
        }

        // Note Logic
        const lanes = [0.1, 0.3, 0.5, 0.7]; // Center positions of 4 lanes (0-1)
        const laneColors = ['#ff0055', '#bc13fe', '#00f3ff', '#ffea00']; // Pink, Purple, Cyan, Yellow
        const notes = [];

        class Note {
            constructor() {
                this.lane = Math.floor(Math.random() * 4);
                this.y = -50; // Start above
                this.speed = 3 + Math.random() * 2;
                this.active = true;
                this.width = (gw / 4) * 0.6; // Note width
            }

            update() {
                this.y += this.speed;
                if (this.y > gh + 50) this.active = false;
            }

            draw() {
                const x = (this.lane * (gw/4)) + (gw/8) - (this.width/2); // Center in lane
                
                gCtx.shadowBlur = 15;
                gCtx.shadowColor = laneColors[this.lane];
                gCtx.fillStyle = laneColors[this.lane];
                
                // Draw Note (Rounded Rect)
                gCtx.beginPath();
                gCtx.roundRect(x, this.y, this.width, 15, 4);
                gCtx.fill();

                // Inner white core for "hot" look
                gCtx.fillStyle = '#fff';
                gCtx.shadowBlur = 0;
                gCtx.fillRect(x + 4, this.y + 4, this.width - 8, 7);
            }
        }

        function drawGame() {
            gCtx.clearRect(0, 0, gw, gh);

            // 1. Draw Lanes (Faint vertical lines)
            gCtx.lineWidth = 1;
            gCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            for(let i=1; i<4; i++) {
                const x = i * (gw/4);
                gCtx.beginPath();
                gCtx.moveTo(x, 0);
                gCtx.lineTo(x, gh);
                gCtx.stroke();
            }

            // 2. Draw Hit Line
            const hitY = gh - 30;
            gCtx.shadowBlur = 10;
            gCtx.shadowColor = '#fff';
            gCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            gCtx.fillRect(0, hitY, gw, 4);
            
            // Hit Line "Perfect" markers
            gCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for(let i=0; i<4; i++) {
                const cx = (i * (gw/4)) + (gw/8);
                gCtx.fillRect(cx - 2, hitY - 2, 4, 8);
            }

            // 3. Update & Draw Notes
            if (Math.random() < 0.05) { // Spawn rate
                notes.push(new Note());
            }

            for (let i = notes.length - 1; i >= 0; i--) {
                notes[i].update();
                notes[i].draw();
                if (!notes[i].active) {
                    notes.splice(i, 1);
                }
            }

            requestAnimationFrame(drawGame);
        }

        // --- INITIALIZATION ---

        window.addEventListener('resize', () => {
            resizeBg();
            resizeGame();
        });

        // Start loops
        resizeBg();
        drawBackground();
        resizeGame();
        drawGame();

        // --- INTERACTION ---
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        
        // Glitch effect on hover
        btn.addEventListener('mouseenter', () => {
            btn.style.letterSpacing = '0.4em';
            
            // Randomize title shadow slightly
            title.style.textShadow = `
                ${Math.random()*10 - 5}px ${Math.random()*10 - 5}px 0px var(--neon-pink),
                ${Math.random()*10 - 5}px ${Math.random()*10 - 5}px 0px var(--neon-cyan),
                0 0 20px var(--neon-purple)
            `;
        });

        btn.addEventListener('mouseleave', () => {
            btn.style.letterSpacing = '0.2em';
            title.style.textShadow = `
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-purple),
                4px 4px 0px var(--neon-pink)
            `;
        });

    </script>
</body>
</html>
