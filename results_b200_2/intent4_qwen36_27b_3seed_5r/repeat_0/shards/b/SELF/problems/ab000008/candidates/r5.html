<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --c-pink: #ff0055;
            --c-cyan: #00f3ff;
            --c-purple: #9d00ff;
            --c-yellow: #ffea00;
            --c-dark: #050014;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-dark);
            color: #fff;
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- CANVAS --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- UI OVERLAY --- */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Let clicks pass to interactive elements */
        }

        /* --- TYPOGRAPHY --- */
        .title-group {
            margin-top: 10vh;
            text-align: center;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            line-height: 0.9;
            color: #fff;
            /* Hard pixelated shadow look */
            text-shadow: 
                4px 4px 0px var(--c-pink),
                -2px -2px 0px var(--c-cyan);
            mix-blend-mode: screen;
            position: relative;
        }

        /* Glitch Animation */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: var(--c-cyan);
            z-index: -1;
            animation: glitch-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--c-pink);
            z-index: -2;
            animation: glitch-2 3s infinite linear alternate-reverse;
        }

        .subtitle {
            font-size: clamp(0.8rem, 2vw, 1.5rem);
            color: var(--c-yellow);
            letter-spacing: 0.6em;
            margin-top: 1rem;
            text-shadow: 0 0 10px var(--c-yellow);
            font-weight: bold;
            opacity: 0.9;
        }

        /* --- BUTTON --- */
        .controls {
            position: absolute;
            bottom: 15vh;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-start {
            background: rgba(0, 0, 0, 0.6);
            color: var(--c-cyan);
            font-family: var(--font-stack);
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            padding: 1.5rem 5rem;
            border: 3px solid var(--c-cyan);
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            /* Cyberpunk angled corners */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
            box-shadow: 0 0 15px var(--c-cyan), inset 0 0 20px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 8px var(--c-cyan);
            backdrop-filter: blur(4px);
        }

        .btn-start:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--c-cyan), inset 0 0 10px #fff;
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- CRT & VHS OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 90;
            opacity: 0.6;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 100%);
            pointer-events: none;
            z-index: 91;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glitch-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
            40% { clip-path: inset(30% 0 20% 0); transform: translate(2px, 1px); }
            60% { clip-path: inset(10% 0 80% 0); transform: translate(-1px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, 2px); }
            100% { clip-path: inset(70% 0 10% 0); transform: translate(-2px, 1px); }
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- UI Layer -->
    <div class="ui-container">
        <div class="title-group">
            <h1 data-text="PIXEL DANCE">PIXEL DANCE</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn">START</button>
        </div>
    </div>

    <script>
        /**
         * PIXEL DANCE - VISUAL ENGINE
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        // Configuration
        const colors = {
            pink: '#ff0055',
            cyan: '#00f3ff',
            purple: '#9d00ff',
            yellow: '#ffea00',
            grid: '#bc13fe'
        };

        const lanes = [
            { offset: -0.25, color: colors.pink },
            { offset: -0.08, color: colors.purple },
            { offset: 0.08, color: colors.cyan },
            { offset: 0.25, color: colors.yellow }
        ];

        // Resize Handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * RENDERER: BACKGROUND (Sun, Grid, Stars)
         */
        const stars = Array.from({length: 150}, () => ({
            x: Math.random(),
            y: Math.random(),
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.05
        }));

        let gridOffset = 0;
        const perspective = 0.003; // Controls how "deep" the grid looks

        function drawBackground(time) {
            // Clear
            ctx.fillStyle = colors.pink; // Fallback
            ctx.clearRect(0, 0, width, height);
            
            const horizonY = height * 0.45; // Horizon line position

            // 1. Draw Stars
            ctx.save();
            ctx.globalAlpha = 0.8;
            stars.forEach(star => {
                star.y -= star.speed * 0.1;
                if(star.y < 0) star.y = 1;
                ctx.fillStyle = '#fff';
                ctx.fillRect(star.x * width, star.y * horizonY, star.size, star.size);
            });
            ctx.restore();

            // 2. Draw Sun
            const sunRadius = Math.min(width, height) * 0.25;
            const sunY = horizonY - (sunRadius * 0.2);
            
            // Sun Glow
            ctx.shadowBlur = 60;
            ctx.shadowColor = colors.pink;

            // Sun Gradient
            const grad = ctx.createLinearGradient(0, sunY - sunRadius, 0, sunY + sunRadius);
            grad.addColorStop(0, colors.yellow);
            grad.addColorStop(0.4, colors.pink);
            grad.addColorStop(1, colors.purple);

            ctx.beginPath();
            ctx.arc(width/2, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.shadowBlur = 0; // Reset

            // Sun Stripes (Retro Cutout)
            ctx.fillStyle = '#050014'; // Match background
            // Draw rects to "cut" the sun
            for(let i = 0; i < 10; i++) {
                // Calculate Y position relative to sun center
                // Using a logarithmic-ish spread for bottom half
                const y = sunY + (i * 12) + 10;
                const h = 4 + (i * 1.5); // Get thicker lower down
                if(y < sunY + sunRadius) {
                    ctx.fillRect(width/2 - sunRadius, y, sunRadius * 2, h);
                }
            }

            // 3. Draw Perspective Grid
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, horizonY, width, height - horizonY);
            ctx.clip(); // Only draw below horizon

            // Grid Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.grid;
            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 2;

            // Vertical Rays
            const cx = width / 2;
            // Draw 20 rays spreading out
            for(let i = -20; i <= 20; i++) {
                ctx.beginPath();
                // Start at vanishing point
                ctx.moveTo(cx, horizonY);
                // End at bottom, spread out
                ctx.lineTo(cx + (i * width * 0.15), height);
                ctx.stroke();
            }

            // Horizontal Lines (Moving)
            gridOffset = (gridOffset + 4) % 100;
            
            // Draw 15 lines
            for(let i = 0; i < 15; i++) {
                // Exponential spacing for perspective
                const t = (i + (gridOffset / 100)) / 15;
                const y = horizonY + Math.pow(t, 2.5) * (height - horizonY);
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        /**
         * RENDERER: GAME HIGHWAY & NOTES
         */
        class Note {
            constructor(laneIndex) {
                this.laneIndex = laneIndex;
                this.z = 0; // 0 = horizon, 1 = screen bottom
                this.speed = 0.008 + (Math.random() * 0.004);
                this.hit = false;
            }

            update() {
                this.z += this.speed;
                return this.z < 1.1; // Return false when off screen
            }

            draw(ctx) {
                if (this.z < 0 || this.z > 1) return;

                const horizonY = height * 0.45;
                const bottomY = height;
                const centerX = width / 2;

                // Highway Dimensions
                const topWidth = 0; // Converges to point
                const bottomWidth = width * 0.8; // 80% of screen width at bottom

                // Interpolate Y
                const y = horizonY + (this.z * (bottomY - horizonY));
                
                // Interpolate Width at this Z
                const currentWidth = topWidth + (Math.pow(this.z, 1.5) * bottomWidth); // Slight curve
                
                // Calculate X position
                // Map lane offset (-0.25 to 0.25) to current width
                const lane = lanes[this.laneIndex];
                const x = centerX + (lane.offset * currentWidth);

                // Note Dimensions (Scale with Z)
                const noteW = (currentWidth * 0.15); // 15% of highway width
                const noteH = 10 + (this.z * 40); // Gets taller

                // Color
                const color = lane.color;

                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = color;
                ctx.fillStyle = color;

                // Draw Note (Trapezoid-ish for perspective)
                // Top face
                const topW = noteW * 0.8;
                const topY = y - noteH;
                
                ctx.beginPath();
                ctx.moveTo(x - topW/2, topY);
                ctx.lineTo(x + topW/2, topY);
                ctx.lineTo(x + noteW/2, y);
                ctx.lineTo(x - noteW/2, y);
                ctx.closePath();
                ctx.fill();

                // Inner Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.shadowBlur = 0;
                ctx.fillRect(x - topW/4, topY + 4, topW/2, noteH - 8);

                ctx.restore();
            }
        }

        const notes = [];
        const highwayLaneWidthRatio = 0.8; // Highway takes 80% of screen width at bottom

        function spawnNote() {
            const lane = Math.floor(Math.random() * 4);
            notes.push(new Note(lane));
        }

        function drawHighway() {
            const horizonY = height * 0.45;
            const centerX = width / 2;
            const bottomWidth = width * 0.8;

            // 1. Highway Floor (Glassy)
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(centerX, horizonY);
            ctx.lineTo(centerX + bottomWidth/2, height);
            ctx.lineTo(centerX - bottomWidth/2, height);
            ctx.closePath();
            
            const grad = ctx.createLinearGradient(0, horizonY, 0, height);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.5, 'rgba(0, 243, 255, 0.05)');
            grad.addColorStop(1, 'rgba(0, 243, 255, 0.2)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Borders
            ctx.strokeStyle = colors.cyan;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.cyan;
            ctx.stroke();
            ctx.restore();

            // 2. Draw Notes
            // Sort by Z (far to near)
            notes.sort((a, b) => a.z - b.z);
            
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].update()) {
                    notes.splice(i, 1);
                } else {
                    notes[i].draw(ctx);
                }
            }

            // 3. Hit Line (Target)
            // Positioned near bottom
            const hitY = height - 60;
            
            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            ctx.fillRect(centerX - bottomWidth/2, hitY, bottomWidth, 4);
            ctx.restore();

            // Lane Indicators at Hit Line
            lanes.forEach((lane, index) => {
                const x = centerX + (lane.offset * bottomWidth);
                const w = bottomWidth * 0.15;
                
                ctx.save();
                ctx.fillStyle = lane.color;
                ctx.globalAlpha = 0.3;
                ctx.fillRect(x - w/2, hitY - 20, w, 40);
                ctx.restore();
            });
        }

        /**
         * MAIN LOOP
         */
        function loop(time) {
            drawBackground(time);
            drawHighway();

            // Randomly spawn notes
            if (Math.random() < 0.03) spawnNote();

            requestAnimationFrame(loop);
        }

        // Init
        requestAnimationFrame(loop);

        // Button Logic
        document.getElementById('startBtn').addEventListener('click', () => {
            // Visual feedback
            const btn = document.getElementById('startBtn');
            btn.innerHTML = "LOADING...";
            btn.style.backgroundColor = "#fff";
            btn.style.color = "#000";
            
            // Simulate loading
            setTimeout(() => {
                alert("INITIATING RHYTHM PROTOCOL...");
                location.reload();
            }, 800);
        });

    </script>
</body>
</html>
