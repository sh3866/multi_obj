<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        :root {
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-yellow: #ffea00;
            --bg-dark: #03000a;
            --grid-color: rgba(188, 19, 254, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Courier New', Courier, monospace; /* Fallback, we use pixel rendering */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- CANVAS LAYERS --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #bg-canvas { z-index: 0; }
        #game-canvas { z-index: 5; }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }

        /* --- TYPOGRAPHY & TITLE --- */
        .title-container {
            position: absolute;
            top: 15%;
            text-align: center;
            transform: translateY(-50%);
            filter: drop-shadow(0 0 15px var(--neon-cyan));
            animation: floatTitle 6s ease-in-out infinite;
        }

        h1 {
            font-family: 'Courier New', monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #fff;
            margin: 0;
            position: relative;
            /* Pixel font rendering trick */
            -webkit-font-smoothing: antialiased; 
            text-shadow: 
                2px 2px 0px var(--neon-pink), 
                -1px -1px 0 var(--neon-purple);
            mix-blend-mode: lighten;
        }

        .subtitle {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: var(--neon-yellow);
            letter-spacing: 0.5em;
            margin-top: 10px;
            text-shadow: 0 0 10px var(--neon-yellow);
            opacity: 0.9;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-55%) scale(1.02); }
        }

        /* --- BUTTON --- */
        .btn-container {
            position: absolute;
            bottom: 12%;
            pointer-events: auto;
        }

        .btn-start {
            background: rgba(0, 0, 0, 0.8);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1.2rem 4rem;
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            letter-spacing: 0.3em;
            position: relative;
            transition: all 0.2s;
            /* Cyberpunk clipped corners */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px rgba(0, 243, 255, 0.3);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .btn-start:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--neon-cyan);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* --- CRT & VHS EFFECTS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 90;
            opacity: 0.6;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, #000 100%);
            pointer-events: none;
            z-index: 91;
        }

        /* Chromatic Aberration Animation for Title */
        @keyframes glitch {
            0% { text-shadow: 2px 2px 0px var(--neon-pink), -2px -2px 0 var(--neon-cyan); }
            25% { text-shadow: -2px 2px 0px var(--neon-pink), 2px -2px 0 var(--neon-cyan); }
            50% { text-shadow: 2px -2px 0px var(--neon-pink), -2px 2px 0 var(--neon-cyan); }
            75% { text-shadow: -2px -2px 0px var(--neon-pink), 2px 2px 0 var(--neon-cyan); }
            100% { text-shadow: 2px 2px 0px var(--neon-pink), -2px -2px 0 var(--neon-cyan); }
        }

        .glitch-effect {
            animation: glitch 3s infinite linear alternate-reverse;
        }

    </style>
</head>
<body>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Canvas Layers -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="game-canvas"></canvas>

    <!-- UI Content -->
    <div class="ui-layer">
        <div class="title-container">
            <h1 class="glitch-effect">PIXEL DANCE</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <div class="btn-container">
            <button class="btn-start" id="startBtn">START</button>
        </div>
    </div>

    <script>
        /**
         * UTILITIES
         */
        const getCtx = (id) => document.getElementById(id).getContext('2d');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = getCtx('bg-canvas');
        const gameCanvas = document.getElementById('game-canvas');
        const gCtx = getCtx('game-canvas');
        
        let W, H;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            bgCanvas.width = W;
            bgCanvas.height = H;
            gameCanvas.width = W;
            gameCanvas.height = H;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * BACKGROUND RENDERER (Sun, Stars, Grid)
         */
        const stars = Array(100).fill().map(() => ({
            x: Math.random(),
            y: Math.random(),
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.0005
        }));

        let gridOffset = 0;
        const gridSpeed = 3;

        function drawBackground(time) {
            bgCtx.clearRect(0, 0, W, H);

            // 1. Stars
            bgCtx.fillStyle = '#fff';
            stars.forEach(star => {
                star.y -= star.speed;
                if(star.y < 0) star.y = 0.5; // Reset to horizon
                bgCtx.globalAlpha = Math.random() * 0.5 + 0.3;
                bgCtx.fillRect(star.x * W, star.y * H, star.size, star.size);
            });
            bgCtx.globalAlpha = 1;

            // 2. Synthwave Sun
            const horizonY = H * 0.5;
            const sunSize = Math.min(W, H) * 0.25;
            const sunY = horizonY - sunSize * 0.3; // Sitting on horizon

            // Sun Glow
            bgCtx.shadowBlur = 50;
            bgCtx.shadowColor = '#ff0055';

            // Sun Gradient
            const sunGrad = bgCtx.createLinearGradient(0, sunY - sunSize, 0, sunY + sunSize);
            sunGrad.addColorStop(0, '#ffea00');
            sunGrad.addColorStop(0.5, '#ff0055');
            sunGrad.addColorStop(1, '#bc13fe');

            bgCtx.beginPath();
            bgCtx.arc(W/2, sunY, sunSize, 0, Math.PI * 2);
            bgCtx.fillStyle = sunGrad;
            bgCtx.fill();
            bgCtx.shadowBlur = 0; // Reset shadow

            // Sun Stripes (Masking)
            bgCtx.fillStyle = '#03000a'; // Match BG
            // Use destination-out to cut holes, or just draw rects over it
            // Drawing rects over is easier for retro look
            for(let i=0; i<12; i++) {
                const ly = sunY - sunSize + (i * (sunSize * 2 / 12));
                const lh = 4 + (i * 1.2); // Perspective thickness
                // Only draw if below center
                if(ly > sunY - 20) {
                    bgCtx.fillRect(W/2 - sunSize, ly, sunSize * 2, lh);
                }
            }

            // 3. Perspective Grid
            bgCtx.save();
            // Clip to bottom half
            bgCtx.beginPath();
            bgCtx.rect(0, horizonY, W, H/2);
            bgCtx.clip();

            bgCtx.strokeStyle = 'rgba(188, 19, 254, 0.4)';
            bgCtx.lineWidth = 2;
            bgCtx.shadowBlur = 10;
            bgCtx.shadowColor = 'rgba(188, 19, 254, 0.8)';

            // Horizon Line
            bgCtx.beginPath();
            bgCtx.moveTo(0, horizonY);
            bgCtx.lineTo(W, horizonY);
            bgCtx.stroke();

            // Vertical Rays
            const cx = W / 2;
            for (let i = -15; i <= 15; i++) {
                bgCtx.beginPath();
                bgCtx.moveTo(cx + (i * 10), horizonY); // Converge at horizon
                bgCtx.lineTo(cx + (i * W * 0.8), H); // Spread at bottom
                bgCtx.stroke();
            }

            // Horizontal Moving Lines
            // Logarithmic spacing
            gridOffset = (gridOffset + gridSpeed) % 100;
            
            for (let i = 0; i < 20; i++) {
                // Map i (0-20) to exponential Y distance
                const t = i / 20;
                const y = horizonY + Math.pow(t, 2.5) * (H/2);
                
                // Movement effect: shift lines down
                const move = (y + gridOffset * 5) % (H/2); 
                const finalY = horizonY + move;

                bgCtx.beginPath();
                bgCtx.moveTo(0, finalY);
                bgCtx.lineTo(W, finalY);
                bgCtx.stroke();
            }
            bgCtx.restore();
        }

        /**
         * GAME HIGHWAY RENDERER
         * Simulates a 3D perspective view of the note highway
         */
        const lanes = [
            { x: 0.1, color: '#ff0055' }, // Pink
            { x: 0.3, color: '#bc13fe' }, // Purple
            { x: 0.7, color: '#00f3ff' }, // Cyan
            { x: 0.9, color: '#ffea00' }  // Yellow
        ];

        const notes = [];

        class Note {
            constructor() {
                this.laneIndex = Math.floor(Math.random() * 4);
                this.z = 0; // 0 (far) to 1 (near)
                this.speed = 0.015 + Math.random() * 0.005;
                this.hit = false;
            }

            update() {
                this.z += this.speed;
                if (this.z > 1.1) return false; // Remove
                return true;
            }

            draw(ctx) {
                if (this.z < 0) return;

                // Perspective Projection
                // Highway params
                const horizonY = H * 0.5;
                const bottomY = H;
                const centerX = W / 2;
                
                // Highway width at horizon vs bottom
                const topW = 0.1 * W;
                const botW = 0.9 * W;

                // Interpolate Y
                const y = horizonY + (this.z * (bottomY - horizonY));
                
                // Interpolate Width
                const currentW = topW + (this.z * (botW - topW));
                
                // Lane X Position
                // We map the 0.1-0.9 lane coordinates to the current width
                const laneXRatio = lanes[this.laneIndex].x;
                // Center the highway horizontally
                // Left edge of highway at this Z:
                const hLeft = centerX - (currentW / 2);
                const hRight = centerX + (currentW / 2);
                
                const x = hLeft + (laneXRatio * currentW);
                
                // Scale note size based on Z
                const noteW = (currentW / 4) * 0.6;
                const noteH = 10 + (this.z * 30); // Gets taller as it gets closer

                const color = lanes[this.laneIndex].color;

                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.fillStyle = color;
                
                // Draw Note
                // Skew it slightly based on perspective
                ctx.beginPath();
                ctx.rect(x - noteW/2, y - noteH, noteW, noteH);
                ctx.fill();

                // Inner highlight
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = 0.6;
                ctx.fillRect(x - noteW/4, y - noteH + 2, noteW/2, noteH - 4);
                
                ctx.restore();
            }
        }

        function drawGame() {
            gCtx.clearRect(0, 0, W, H);

            const horizonY = H * 0.5;
            const centerX = W / 2;
            const topW = 0.1 * W;
            const botW = 0.9 * W;

            // 1. Draw Highway Floor (Glassy reflection)
            gCtx.save();
            gCtx.beginPath();
            gCtx.moveTo(centerX - topW/2, horizonY);
            gCtx.lineTo(centerX + topW/2, horizonY);
            gCtx.lineTo(centerX + botW/2, H);
            gCtx.lineTo(centerX - botW/2, H);
            gCtx.closePath();
            
            // Gradient floor
            const floorGrad = gCtx.createLinearGradient(0, horizonY, 0, H);
            floorGrad.addColorStop(0, 'rgba(0,0,0,0)');
            floorGrad.addColorStop(0.5, 'rgba(0, 243, 255, 0.05)');
            floorGrad.addColorStop(1, 'rgba(0, 243, 255, 0.15)');
            gCtx.fillStyle = floorGrad;
            gCtx.fill();

            // Border Lines
            gCtx.strokeStyle = 'rgba(0, 243, 255, 0.5)';
            gCtx.lineWidth = 2;
            gCtx.stroke();

            // Lane Dividers
            gCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            gCtx.lineWidth = 1;
            [0.3, 0.5, 0.7].forEach(ratio => {
                // Draw line from horizon to bottom
                // Actually, for perspective, we calculate points at z=0 and z=1
                // But simple lines work if we draw them relative to the polygon
                
                // Calculate X at top and bottom
                const xTop = (centerX - topW/2) + (ratio * topW);
                const xBot = (centerX - botW/2) + (ratio * botW);
                
                gCtx.beginPath();
                gCtx.moveTo(xTop, horizonY);
                gCtx.lineTo(xBot, H);
                gCtx.stroke();
            });
            gCtx.restore();

            // 2. Spawn Notes
            if (Math.random() < 0.04) {
                notes.push(new Note());
            }

            // 3. Draw Notes
            // Sort by Z so far notes draw first (painter's algo)
            notes.sort((a, b) => a.z - b.z);
            
            for (let i = notes.length - 1; i >= 0; i--) {
                if (!notes[i].update()) {
                    notes.splice(i, 1);
                } else {
                    notes[i].draw(gCtx);
                }
            }

            // 4. Draw Hit Line (Target)
            // The hit line is at z=1 (bottom)
            const hitY = H - 50; // Slightly above very bottom
            const hitW = botW * 0.9; // Slightly narrower than highway

            gCtx.save();
            gCtx.shadowBlur = 20;
            gCtx.shadowColor = '#fff';
            gCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            gCtx.fillRect(centerX - hitW/2, hitY, hitW, 4);
            
            // Lane Indicators at Hit Line
            for(let i=0; i<4; i++) {
                const laneXRatio = lanes[i].x;
                const x = (centerX - botW/2) + (laneXRatio * botW);
                
                gCtx.fillStyle = lanes[i].color;
                gCtx.globalAlpha = 0.3;
                gCtx.fillRect(x - (hitW/4)/2, hitY - 20, hitW/4, 40);
            }
            gCtx.restore();
        }

        /**
         * MAIN LOOP
         */
        function loop(time) {
            drawBackground(time);
            drawGame();
            requestAnimationFrame(loop);
        }

        // Start
        requestAnimationFrame(loop);

        // Interaction
        const btn = document.getElementById('startBtn');
        btn.addEventListener('click', () => {
            // Simple transition effect
            document.body.style.transition = 'transform 0.5s, opacity 0.5s';
            document.body.style.transform = 'scale(1.1)';
            document.body.style.opacity = '0';
            setTimeout(() => {
                alert("GAME STARTED (Demo)");
                location.reload();
            }, 500);
        });

    </script>
</body>
</html>
