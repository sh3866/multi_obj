<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-deep: #050014;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffe600;
            --neon-purple: #bc13fe;
            --grid-color: rgba(188, 19, 254, 0.3);
            --sun-color-top: #ff00ff;
            --sun-color-bot: #ffeb3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND SCENE --- */
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Retro Sun */
        .sun-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            z-index: 1;
            opacity: 0.9;
        }

        .sun {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--sun-color-top), var(--sun-color-bot));
            box-shadow: 0 0 60px var(--neon-pink), 0 0 20px var(--neon-yellow);
            /* Mask for the "Blade Runner" horizontal lines */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 60%,
                transparent 60%, transparent 63%,
                black 63%, black 70%,
                transparent 70%, transparent 74%,
                black 74%, black 82%,
                transparent 82%, transparent 87%,
                black 87%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 60%,
                transparent 60%, transparent 63%,
                black 63%, black 70%,
                transparent 70%, transparent 74%,
                black 74%, black 82%,
                transparent 82%, transparent 87%,
                black 87%, black 100%
            );
        }

        /* Grid Floor */
        .floor-container {
            position: absolute;
            bottom: -10%;
            left: -50%;
            width: 200%;
            height: 60%;
            perspective: 400px;
            z-index: 2;
        }

        .grid-floor {
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(transparent 0%, var(--bg-deep) 100%),
                linear-gradient(90deg, var(--grid-color) 2px, transparent 2px),
                linear-gradient(0deg, var(--grid-color) 2px, transparent 2px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            transform: rotateX(65deg);
            transform-origin: center top;
            animation: gridScroll 1.5s linear infinite;
            box-shadow: 0 0 100px var(--neon-purple) inset;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 60px; }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            width: 100%;
            padding: 40px 0;
            pointer-events: none; /* Let clicks pass through to specific elements */
        }

        .ui-layer > * {
            pointer-events: auto;
        }

        /* --- TITLE --- */
        .title-wrapper {
            margin-top: 5vh;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: 0.05em;
            color: #fff;
            position: relative;
            /* Chromatic Aberration / 3D Stack */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan),
                6px 6px 0px rgba(0,0,0,0.5);
            animation: glitchTitle 4s infinite;
        }

        h1 span {
            color: var(--neon-yellow);
            display: block;
            font-size: 0.6em;
            letter-spacing: 0.4em;
            margin-top: 10px;
            text-shadow: 3px 3px 0px var(--neon-purple);
        }

        @keyframes glitchTitle {
            0%, 90%, 100% { transform: translate(0, 0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-1px, -1px); }
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-container {
            position: relative;
            width: 500px;
            height: 350px;
            margin-top: -5vh; /* Overlap sun slightly */
            display: flex;
            justify-content: center;
            perspective: 600px;
        }

        .highway {
            width: 300px;
            height: 100%;
            position: relative;
            transform: rotateX(25deg) scale(0.9);
            transform-style: preserve-3d;
            /* Gradient background for depth */
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 100%);
            border-left: 4px solid var(--neon-cyan);
            border-right: 4px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            display: flex;
        }

        /* Lane Dividers */
        .highway::before, .highway::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .highway::before { left: 33.33%; }
        .highway::after { left: 66.66%; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 40px;
            left: -10px;
            right: -10px;
            height: 6px;
            background: white;
            box-shadow: 
                0 0 10px white,
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink);
            z-index: 5;
            border-radius: 2px;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 25%;
            height: 25px;
            left: 0;
            border-radius: 4px;
            box-shadow: 0 0 15px currentColor;
            animation: dropNote linear infinite;
        }
        
        /* Lane Colors & Timing */
        .note:nth-child(1) { 
            background: #ff0055; color: #ff0055; 
            left: 0; 
            animation-duration: 1.2s; animation-delay: 0s; 
        }
        .note:nth-child(2) { 
            background: #00ffff; color: #00ffff; 
            left: 25%; 
            animation-duration: 1.5s; animation-delay: 0.3s; 
        }
        .note:nth-child(3) { 
            background: #00ff00; color: #00ff00; 
            left: 50%; 
            animation-duration: 1.1s; animation-delay: 0.7s; 
        }
        .note:nth-child(4) { 
            background: #ffe600; color: #ffe600; 
            left: 75%; 
            animation-duration: 1.4s; animation-delay: 0.1s; 
        }

        @keyframes dropNote {
            0% { top: -50px; opacity: 0; transform: scaleY(1.5); }
            10% { opacity: 1; transform: scaleY(1); }
            80% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* --- BUTTON --- */
        .btn-wrapper {
            margin-bottom: 8vh;
            position: relative;
        }

        .btn-start {
            background: transparent;
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1.2rem 4rem;
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            letter-spacing: 0.15em;
            box-shadow: 
                0 0 10px var(--neon-yellow), 
                inset 0 0 10px var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
            overflow: hidden;
        }

        .btn-start::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .btn-start:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 
                0 0 20px var(--neon-yellow), 
                0 0 50px var(--neon-yellow);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:hover::before {
            left: 100%;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* --- CRT OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.7;
        }
        
        /* Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, black 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            h1 span { font-size: 0.8em; }
            .highway-container { width: 90%; height: 250px; }
            .sun-container { width: 250px; height: 250px; top: 15%; }
            .btn-start { padding: 1rem 2.5rem; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- CRT Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Background Scene -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun-container">
            <div class="sun"></div>
        </div>
        <div class="floor-container">
            <div class="grid-floor"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="ui-layer">
        
        <div class="title-wrapper">
            <h1>PIXEL <span>DANCE</span></h1>
        </div>

        <div class="highway-container">
            <div class="highway">
                <div class="note"></div>
                <div class="note"></div>
                <div class="note"></div>
                <div class="note"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-wrapper">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>

    </div>

    <script>
        /**
         * Starfield Logic
         * Renders a retro 3D perspective starfield.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 150;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 2; // Spread wide
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = initial ? Math.random() * 2000 : 2000; // Depth
                this.pz = this.z; // Previous z
            }

            update() {
                this.z -= 4; // Move speed
                if (this.z < 1) {
                    this.reset();
                }
            }

            draw() {
                // Project 3D to 2D
                const x = (this.x / this.z) * (width / 2) + (width / 2);
                const y = (this.y / this.z) * (height / 2) + (height / 2);
                
                // Calculate size based on depth
                const s = (1 - this.z / 2000) * 3;

                if (x < 0 || x > width || y < 0 || y > height) return;

                ctx.fillStyle = this.z < 500 ? '#ff00ff' : '#ffffff';
                ctx.globalAlpha = (1 - this.z / 2000);
                
                // Draw square stars for pixel look
                ctx.fillRect(x, y, s, s);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Adds a glitch effect to the title when hovering the start button.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        const originalShadow = "4px 4px 0px var(--neon-pink), -2px -2px 0px var(--neon-cyan), 6px 6px 0px rgba(0,0,0,0.5)";

        btn.addEventListener('mouseenter', () => {
            let glitchInterval = setInterval(() => {
                const xOff = (Math.random() * 10 - 5).toFixed(1);
                const yOff = (Math.random() * 10 - 5).toFixed(1);
                title.style.textShadow = `
                    ${xOff}px ${yOff}px 0px var(--neon-pink),
                    ${-xOff}px ${-yOff}px 0px var(--neon-cyan)
                `;
                title.style.transform = `skewX(${Math.random() * 10 - 5}deg)`;
            }, 50);

            btn.dataset.glitchInterval = glitchInterval;
        });

        btn.addEventListener('mouseleave', () => {
            clearInterval(btn.dataset.glitchInterval);
            title.style.textShadow = originalShadow;
            title.style.transform = 'skewX(0deg)';
        });
    </script>
</body>
</html>
