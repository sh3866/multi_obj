<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #030305;
            --bg-gradient: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #030305 70%);
            
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #7a5c18;
            
            --text-main: #e8e8e8;
            --text-muted: #7a7a8c;
            
            --card-bg: rgba(20, 20, 30, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(212, 175, 55, 0.5);
            
            --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background FX --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Layout --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .logo-mark {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.7;
        }

        .currency-pill {
            background: linear-gradient(90deg, rgba(0,0,0,0.4) 0%, rgba(20,15,5,0.6) 50%, rgba(0,0,0,0.4) 100%);
            border: 1px solid var(--gold-dark);
            border-radius: 4px;
            padding: 0.6rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .currency-pill::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            pointer-events: none;
        }

        .currency-pill:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.2), inset 0 0 15px rgba(212, 175, 55, 0.15);
            transform: translateY(-1px);
        }

        .gold-icon {
            width: 22px;
            height: 22px;
            fill: var(--gold-primary);
            filter: drop-shadow(0 0 2px var(--gold-primary));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--gold-light);
            letter-spacing: 0.05em;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 2vh;
            position: relative;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 4.5rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin: 0;
            line-height: 1;
            position: relative;
            color: transparent;
            /* Metallic Gradient */
            background: linear-gradient(to bottom, #fff 0%, #b0b0b0 40%, #666 100%);
            -webkit-background-clip: text;
            background-clip: text;
            /* Glow */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.15));
        }
        
        /* Decorative line under title */
        .title-ornament {
            width: 300px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            margin: 1.5rem auto 1rem auto;
            opacity: 0.6;
            position: relative;
        }
        .title-ornament::after {
            content: '♦';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold-primary);
            font-size: 12px;
            background: var(--bg-deep); /* Mask background */
            padding: 0 10px;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 2rem auto;
            padding-bottom: 1rem;
        }

        /* --- Card Design --- */
        .nav-card {
            position: relative;
            height: 260px;
            background: linear-gradient(160deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.4) 100%);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            group: card;
            /* Glassmorphism */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Inner glow on hover */
        .nav-card::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0);
            transition: box-shadow 0.4s ease;
            pointer-events: none;
        }

        .nav-card:hover {
            transform: translateY(-8px);
            border-color: var(--card-hover-border);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        .nav-card:hover::after {
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .card-content {
            z-index: 2;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .nav-card:hover .card-content {
            transform: scale(1.05);
        }

        .card-icon {
            width: 56px;
            height: 56px;
            margin-bottom: 1.5rem;
            fill: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
            transition: all 0.4s;
        }

        .nav-card:hover .card-icon {
            fill: var(--gold-light);
            filter: drop-shadow(0 0 15px var(--gold-primary));
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 0.25rem;
        }

        .card-subtitle {
            font-size: 0.7rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.3s ease 0.1s;
            font-weight: 600;
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            opacity: 0.4;
            margin-top: auto;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            h1.game-title {
                font-size: 3rem;
            }
            .ui-layer {
                padding: 1.5rem;
            }
        }
        
        @media (max-width: 500px) {
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .nav-card {
                height: 80px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 2rem;
            }
            .card-icon {
                width: 32px;
                height: 32px;
                margin-bottom: 0;
                margin-right: 1.5rem;
            }
            .card-subtitle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <div class="logo-mark">Aetheria</div>
            
            <div class="currency-pill">
                <!-- More detailed coin icon -->
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <h1 class="game-title">Spirit Summoning</h1>
            <div class="title-ornament"></div>
            <p class="subtitle">Awaken the Ancient Bonds</p>
        </section>

        <nav class="nav-grid">
            
            <!-- Summon Card -->
            <div class="nav-card" onclick="interact('summon')">
                <div class="card-content">
                    <!-- Star Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L9.2,8.6L2,9.2L7.5,14L5.8,21L12,17.2L18.2,21L16.5,14L22,9.2L14.8,8.6L12,2Z" />
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="nav-card" onclick="interact('roster')">
                <div class="card-content">
                    <!-- User/Spirit Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="nav-card" onclick="interact('battle')">
                <div class="card-content">
                    <!-- Sword Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6.9,19L19,6.9L17.6,5.5L5.5,17.6L6.9,19M19.6,2.4L18.2,1L15.8,3.4L17.2,4.8L19.6,2.4M13,10.9L15.1,13L13.7,14.4L11.6,12.3L13,10.9M3,21L5.1,18.9L7.2,21H3Z" />
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="nav-card" onclick="interact('grind')">
                <div class="card-content">
                    <!-- Gem/Resource Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L2,12L12,22L22,12L12,2Z" />
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Refined) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80;
        const connectionDistance = 120;
        const mouseDistance = 180;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                // Base color is cool blue/white
                this.baseColor = `rgba(200, 210, 255, ${Math.random() * 0.5 + 0.1})`;
                // Occasional gold particle
                this.isGold = Math.random() > 0.9;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction (Repel)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        const directionX = forceDirectionX * force * 0.8;
                        const directionY = forceDirectionY * force * 0.8;

                        this.vx -= directionX;
                        this.vy -= directionY;
                    }
                }
                
                // Damping to return to normal speed
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                // Minimum speed to keep them moving
                if(Math.abs(this.vx) < 0.1) this.vx += (Math.random() - 0.5) * 0.1;
                if(Math.abs(this.vy) < 0.1) this.vy += (Math.random() - 0.5) * 0.1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.isGold ? `rgba(212, 175, 55, 0.8)` : this.baseColor;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        
                        // If both are gold, draw gold line, otherwise cool blue
                        let lineColor = (particles[i].isGold && particles[j].isGold) 
                            ? `rgba(212, 175, 55, ${opacity * 0.3})` 
                            : `rgba(150, 160, 200, ${opacity * 0.1})`;
                            
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            // Visual ripple effect
            const card = event.currentTarget;
            
            // Create a flash effect
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.background = 'rgba(255,255,255,0.2)';
            flash.style.pointerEvents = 'none';
            flash.style.transition = 'opacity 0.5s';
            card.appendChild(flash);
            
            // Trigger reflow
            void flash.offsetWidth;
            flash.style.opacity = '0';
            
            setTimeout(() => {
                flash.remove();
            }, 500);
        }
    </script>
</body>
</html>
