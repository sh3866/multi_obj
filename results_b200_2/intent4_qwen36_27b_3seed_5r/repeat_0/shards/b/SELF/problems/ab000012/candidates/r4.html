<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning - Aetheria</title>
    <style>
        /* 
         * DESIGN SYSTEM: ETHEREAL VOID
         * High-end, atmospheric, "Game of the Year" UI aesthetic.
         */
        :root {
            --bg-deep: #050508;
            --bg-gradient: radial-gradient(ellipse at 50% -20%, #161824 0%, #050508 60%);
            
            --text-main: #e2e2e6;
            --text-muted: #6e7078;
            
            --gold-accent: #d4af37;
            --gold-dim: #7a6115;
            --gold-glow: #ffe680;
            
            --card-surface: linear-gradient(180deg, rgba(20, 21, 26, 0.7) 0%, rgba(10, 11, 14, 0.9) 100%);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-highlight: rgba(255, 255, 255, 0.15);
            
            /* Using system fallbacks that look closest to Cinzel/Playfair for offline use */
            --font-serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-sans: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- FX Layers --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* High-quality noise texture for film grain effect */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Deep vignette to focus attention */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.8);
        }

        /* --- UI Layout --- */
        .ui-container {
            position: relative;
            z-index: 10;
            height: 100%;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 4rem;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2.5rem;
            margin-bottom: 1rem;
        }

        .logo-mark {
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 600;
        }
        
        .logo-mark::before {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-muted));
        }

        /* Currency Pill - Minimalist & Premium */
        .currency-pill {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--gold-dim);
            border-radius: 2px;
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .currency-pill::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .currency-pill:hover {
            border-color: var(--gold-accent);
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.15);
        }

        .gold-icon {
            width: 20px;
            height: 20px;
            fill: var(--gold-accent);
            filter: drop-shadow(0 0 4px var(--gold-accent));
        }

        .currency-amount {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 2rem;
        }

        h1.game-title {
            font-family: var(--font-serif);
            font-size: 5.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 0;
            line-height: 0.9;
            position: relative;
            color: transparent;
            
            /* Metallic Silver Gradient */
            background: linear-gradient(to bottom, #fff 10%, #a0a0a0 40%, #505050 100%);
            -webkit-background-clip: text;
            background-clip: text;
            
            /* Subtle Glow */
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.1));
            font-weight: 400;
        }
        
        /* The second line has a slightly different, darker gradient */
        h1.game-title span {
            display: block;
            background: linear-gradient(to bottom, #888 0%, #444 100%);
            -webkit-background-clip: text;
            background-clip: text;
            font-size: 6.5rem; /* Larger for visual weight */
        }

        .title-ornament {
            width: 400px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold-accent), var(--gold-dim), transparent);
            margin: 2.5rem auto 1.5rem auto;
            position: relative;
            opacity: 0.8;
        }
        
        .title-ornament::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 7px;
            height: 7px;
            background: var(--bg-deep);
            border: 1px solid var(--gold-accent);
            box-shadow: 0 0 10px var(--gold-accent);
        }

        .subtitle {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: 0.5rem;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            width: 100%;
            margin-bottom: 3rem;
        }

        /* --- Card Design - Refined Glass --- */
        .nav-card {
            position: relative;
            height: 280px;
            background: var(--card-surface);
            border: 1px solid var(--card-border);
            border-top: 1px solid rgba(255,255,255,0.15); /* Top highlight */
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Gradient overlay for depth */
        .nav-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .nav-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            background: linear-gradient(180deg, rgba(30, 32, 40, 0.8) 0%, rgba(15, 16, 20, 0.95) 100%);
        }

        .card-content {
            z-index: 2;
            text-align: center;
            position: relative;
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .nav-card:hover .card-content {
            transform: translateY(-5px);
        }

        .card-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            fill: var(--text-main);
            opacity: 0.9;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
            transition: all 0.4s ease;
        }

        .nav-card:hover .card-icon {
            fill: #fff;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
            transform: scale(1.1);
        }

        .card-title {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            color: #fff;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            font-size: 0.7rem;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease 0.1s;
            font-weight: 600;
            height: 0;
            overflow: hidden;
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
            height: auto;
            margin-top: 8px;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            opacity: 0.4;
            margin-top: auto;
            padding-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        /* --- Responsive --- */
        @media (max-width: 1200px) {
            .nav-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
            h1.game-title { font-size: 4rem; }
            h1.game-title span { font-size: 4.5rem; }
            .ui-container { padding: 0 2rem; }
        }
        
        @media (max-width: 800px) {
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .nav-card {
                height: 90px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 2rem;
            }
            .card-icon {
                width: 32px;
                height: 32px;
                margin-bottom: 0;
                margin-right: 1.5rem;
            }
            .card-subtitle { display: none; }
            h1.game-title { font-size: 3rem; }
            h1.game-title span { font-size: 3.5rem; }
            .ui-container { padding: 0 1.5rem; }
            header { padding-top: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="ui-container">
        <header>
            <div class="logo-mark">Aetheria</div>
            
            <div class="currency-pill">
                <!-- Detailed Coin Icon -->
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <h1 class="game-title">Spirit<br><span>Summoning</span></h1>
            <div class="title-ornament"></div>
            <p class="subtitle">Awaken the Ancient Bonds</p>
        </section>

        <nav class="nav-grid">
            
            <!-- Summon Card -->
            <div class="nav-card" onclick="interact(this)">
                <div class="card-content">
                    <!-- Star Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L9.2,8.6L2,9.2L7.5,14L5.8,21L12,17.2L18.2,21L16.5,14L22,9.2L14.8,8.6L12,2Z" />
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="nav-card" onclick="interact(this)">
                <div class="card-content">
                    <!-- User/Spirit Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="nav-card" onclick="interact(this)">
                <div class="card-content">
                    <!-- Sword Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6.9,19L19,6.9L17.6,5.5L5.5,17.6L6.9,19M19.6,2.4L18.2,1L15.8,3.4L17.2,4.8L19.6,2.4M13,10.9L15.1,13L13.7,14.4L11.6,12.3L13,10.9M3,21L5.1,18.9L7.2,21H3Z" />
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="nav-card" onclick="interact(this)">
                <div class="card-content">
                    <!-- Gem/Resource Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L2,12L12,22L22,12L12,2Z" />
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Refined) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80;
        const connectionDistance = 150;
        const mouseDistance = 200;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2; 
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                // Base color is cool blue/white
                this.baseColor = `rgba(200, 210, 255, ${Math.random() * 0.4 + 0.1})`;
                // Occasional gold particle
                this.isGold = Math.random() > 0.95;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction (Repel)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        const directionX = forceDirectionX * force * 0.8;
                        const directionY = forceDirectionY * force * 0.8;

                        this.vx -= directionX;
                        this.vy -= directionY;
                    }
                }
                
                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                // Minimum speed
                if(Math.abs(this.vx) < 0.02) this.vx += (Math.random() - 0.5) * 0.02;
                if(Math.abs(this.vy) < 0.02) this.vy += (Math.random() - 0.5) * 0.02;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.isGold ? `rgba(212, 175, 55, 0.8)` : this.baseColor;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        
                        // If both are gold, draw gold line, otherwise cool blue
                        let lineColor = (particles[i].isGold && particles[j].isGold) 
                            ? `rgba(212, 175, 55, ${opacity * 0.4})` 
                            : `rgba(150, 160, 200, ${opacity * 0.08})`;
                            
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(card) {
            // Create a flash effect
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.background = 'rgba(255,255,255,0.1)';
            flash.style.pointerEvents = 'none';
            flash.style.transition = 'opacity 0.6s ease-out';
            flash.style.backdropFilter = 'brightness(1.5)';
            card.appendChild(flash);
            
            // Trigger reflow
            void flash.offsetWidth;
            flash.style.opacity = '0';
            
            setTimeout(() => {
                flash.remove();
            }, 600);
        }
    </script>
</body>
</html>
