<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning - Aetheria</title>
    <style>
        /* 
         * DESIGN SYSTEM: VOID ALCHEMY
         * Refined Palette: Deep Space, Bone, Mithril, Gold Dust
         */
        :root {
            --bg-deep: #030305;
            --bg-gradient: radial-gradient(circle at 50% 15%, #1a1a2e 0%, #030305 70%);
            
            --text-primary: #f0f0f5;
            --text-secondary: #7a7a85;
            
            --gold-dim: #5c4d1c;
            --gold-bright: #cfb53b;
            --gold-glow: #e8d79d;
            
            --card-bg: rgba(10, 10, 12, 0.6);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-border-hover: rgba(207, 181, 59, 0.5);
            
            --font-display: "Cinzel", "Palatino Linotype", "Times New Roman", serif;
            --font-ui: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            outline: none;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background FX --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        /* Noise overlay for texture */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* --- UI Layout --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 4rem 5rem;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo-mark {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            text-transform: uppercase;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-mark::before {
            content: '';
            display: block;
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-secondary));
        }

        /* Currency Pill - Elegant & Refined */
        .currency-pill {
            background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(20,18,10,0.8) 50%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--gold-dim);
            border-radius: 2px;
            padding: 0.6rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            cursor: pointer;
        }

        .currency-pill:hover {
            border-color: var(--gold-bright);
            box-shadow: 0 0 25px rgba(207, 181, 59, 0.15);
            transform: translateY(-1px);
            background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(30,25,10,0.9) 50%, rgba(0,0,0,0) 100%);
        }

        .gold-icon {
            width: 22px;
            height: 22px;
            fill: var(--gold-bright);
            filter: drop-shadow(0 0 6px var(--gold-bright));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--gold-glow);
            letter-spacing: 0.05em;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 3rem;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0;
            line-height: 1;
            position: relative;
            color: transparent;
            /* Metallic Gradient - Polished */
            background: linear-gradient(to bottom, #fff 0%, #d0d0d0 30%, #707070 70%, #404040 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.15));
            font-weight: 400;
        }
        
        /* Decorative line under title */
        .title-ornament {
            width: 500px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
            margin: 2rem auto 1rem auto;
            opacity: 0.6;
            position: relative;
        }
        
        .title-ornament::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 8px;
            height: 8px;
            background: var(--bg-deep);
            border: 1px solid var(--gold-bright);
            box-shadow: 0 0 10px var(--gold-bright);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 3rem;
        }

        /* --- Card Design - Glass & Gold --- */
        .nav-card {
            position: relative;
            height: 320px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.4) 100%);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Inner glow on hover */
        .nav-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(207, 181, 59, 0.15), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .nav-card:hover {
            transform: translateY(-12px);
            border-color: var(--card-border-hover);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.6) 100%);
        }

        .nav-card:hover::after {
            opacity: 1;
        }

        .card-content {
            z-index: 2;
            text-align: center;
            position: relative;
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .nav-card:hover .card-content {
            transform: scale(1.05);
        }

        .card-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 2rem;
            fill: #fff;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
            transition: all 0.4s;
        }

        .nav-card:hover .card-icon {
            fill: var(--gold-glow);
            filter: drop-shadow(0 0 25px var(--gold-bright));
            transform: scale(1.1);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 2rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            font-size: 0.75rem;
            color: var(--gold-bright);
            text-transform: uppercase;
            letter-spacing: 0.25em;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease 0.1s;
            font-weight: 600;
            height: 0;
            overflow: hidden;
        }

        .nav-card:hover .card-subtitle {
            opacity: 0.9;
            transform: translateY(0);
            height: auto;
            margin-top: 8px;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: auto;
            padding-top: 2rem;
            letter-spacing: 0.1em;
        }

        /* --- Responsive --- */
        @media (max-width: 1200px) {
            .nav-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
            h1.game-title {
                font-size: 4.5rem;
            }
            .ui-layer {
                padding: 3rem;
            }
        }
        
        @media (max-width: 800px) {
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .nav-card {
                height: 100px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 3rem;
            }
            .card-icon {
                width: 40px;
                height: 40px;
                margin-bottom: 0;
                margin-right: 2rem;
            }
            .card-subtitle {
                display: none;
            }
            h1.game-title {
                font-size: 3rem;
            }
            .ui-layer {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <div class="logo-mark">Aetheria</div>
            
            <div class="currency-pill">
                <!-- Detailed Coin Icon -->
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <h1 class="game-title">Spirit<br>Summoning</h1>
            <div class="title-ornament"></div>
            <p class="subtitle">Awaken the Ancient Bonds</p>
        </section>

        <nav class="nav-grid">
            
            <!-- Summon Card -->
            <div class="nav-card" onclick="interact('summon')">
                <div class="card-content">
                    <!-- Star Icon - Refined -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L9.2,8.6L2,9.2L7.5,14L5.8,21L12,17.2L18.2,21L16.5,14L22,9.2L14.8,8.6L12,2Z" />
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="nav-card" onclick="interact('roster')">
                <div class="card-content">
                    <!-- User/Spirit Icon - Refined -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="nav-card" onclick="interact('battle')">
                <div class="card-content">
                    <!-- Sword Icon - Refined -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M6.9,19L19,6.9L17.6,5.5L5.5,17.6L6.9,19M19.6,2.4L18.2,1L15.8,3.4L17.2,4.8L19.6,2.4M13,10.9L15.1,13L13.7,14.4L11.6,12.3L13,10.9M3,21L5.1,18.9L7.2,21H3Z" />
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="nav-card" onclick="interact('grind')">
                <div class="card-content">
                    <!-- Gem/Resource Icon - Refined -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L2,12L12,22L22,12L12,2Z" />
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Refined) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 70;
        const connectionDistance = 160;
        const mouseDistance = 220;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.15; // Slower, more ethereal
                this.vy = (Math.random() - 0.5) * 0.15;
                this.size = Math.random() * 1.5 + 0.5;
                // Base color is cool blue/white
                this.baseColor = `rgba(200, 210, 255, ${Math.random() * 0.4 + 0.1})`;
                // Occasional gold particle
                this.isGold = Math.random() > 0.92;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction (Repel)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        const directionX = forceDirectionX * force * 0.6;
                        const directionY = forceDirectionY * force * 0.6;

                        this.vx -= directionX;
                        this.vy -= directionY;
                    }
                }
                
                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                // Minimum speed
                if(Math.abs(this.vx) < 0.02) this.vx += (Math.random() - 0.5) * 0.02;
                if(Math.abs(this.vy) < 0.02) this.vy += (Math.random() - 0.5) * 0.02;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.isGold ? `rgba(207, 181, 59, 0.9)` : this.baseColor;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        
                        // If both are gold, draw gold line, otherwise cool blue
                        let lineColor = (particles[i].isGold && particles[j].isGold) 
                            ? `rgba(207, 181, 59, ${opacity * 0.3})` 
                            : `rgba(150, 160, 200, ${opacity * 0.1})`;
                            
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            
            // Create a flash effect
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.background = 'rgba(255,255,255,0.15)';
            flash.style.pointerEvents = 'none';
            flash.style.transition = 'opacity 0.6s ease-out';
            flash.style.backdropFilter = 'brightness(1.5)';
            card.appendChild(flash);
            
            // Trigger reflow
            void flash.offsetWidth;
            flash.style.opacity = '0';
            
            setTimeout(() => {
                flash.remove();
            }, 600);
        }
    </script>
</body>
</html>
