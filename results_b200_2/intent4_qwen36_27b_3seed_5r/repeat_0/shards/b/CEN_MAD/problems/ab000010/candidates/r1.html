<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Game of Life</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #121212;
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --accent-secondary: #8b9bb4;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 320px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: grab;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }

        /* Background Ambient Glow */
        .ambient-glow {
            position: absolute;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle at center, rgba(60, 20, 100, 0.2) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
            border-radius: 50%;
        }

        canvas {
            display: block;
        }

        /* Control Panel */
        .panel {
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            height: 100%;
            overflow-y: auto;
        }

        /* Typography */
        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 400;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .label-val {
            color: var(--text-primary);
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-top: 8px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            margin-top: -5px;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 1px;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-stack);
            text-align: center;
        }

        button:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        button.primary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Stats */
        .stats {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 400;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: auto;
                max-height: 45vh;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                padding: 32px;
            }
            .canvas-wrapper {
                height: 55vh;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="panel">
            <div>
                <h1>Sphere Life</h1>
                <p class="subtitle">A cellular automaton simulation projected onto a 3D manifold. Drag to rotate.</p>
            </div>

            <div class="control-group">
                <div>
                    <div class="label-row">
                        <span>Simulation Speed</span>
                        <span class="label-val" id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div>
                    <div class="label-row">
                        <span>Resolution</span>
                        <span class="label-val" id="densityVal">High</span>
                    </div>
                    <input type="range" id="densitySlider" min="40" max="100" value="60">
                </div>
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Actions</span>
                </div>
                <div class="btn-group">
                    <button class="primary" id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button id="clearBtn" style="width: 100%; margin-top: 12px;">Clear All</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 60, // Base for the slider
            speed: 10, // frames per step (lower is faster)
            evolutionRate: 0.015
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellColors = []; // Stores hue offset
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            const container = document.getElementById('canvasContainer');
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value; 
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                // Update text based on slider value
                let text = "High";
                if (val < 50) text = "Very High";
                else if (val < 80) text = "High";
                else text = "Medium";
                document.getElementById('densityVal').innerText = text;
                
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                const btn = document.getElementById('toggleBtn');
                btn.innerText = isRunning ? "Pause" : "Resume";
                // Toggle visual weight
                if(isRunning) {
                    btn.style.background = "rgba(255, 255, 255, 0.1)";
                    btn.style.borderColor = "rgba(255, 255, 255, 0.2)";
                } else {
                    btn.style.background = "transparent";
                    btn.style.borderColor = "rgba(255, 255, 255, 0.1)";
                }
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellColors = cellColors.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellColors = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() > 0.6 ? 1 : 0;
                    cellColors[y][x] = Math.random() * 360; 
                    if (grid[y][x]) population++;
                }
            }
            updateStats();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellColors[y][x] = 280; // Newborns are magenta/purple
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) {
                            // Age shifts color from purple -> blue -> cyan
                            cellColors[y][x] = (cellColors[y][x] + CONFIG.evolutionRate * 5) % 360;
                        }
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            updateStats();
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        function updateStats() {
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear with transparent black to handle trail effects if we wanted them, 
            // but for clean design we clear fully.
            ctx.clearRect(0, 0, width, height);

            if (!isDragging) {
                targetRotationY += 0.002; 
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // 1. Draw Sphere Back Volume (Atmosphere)
            const bgGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.5, centerX, centerY, radius);
            bgGrad.addColorStop(0, 'rgba(20, 20, 25, 0)');
            bgGrad.addColorStop(1, 'rgba(10, 10, 15, 0.8)');
            ctx.fillStyle = bgGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw Grid Cells
            // We iterate and project. 
            // Optimization: We could sort by Z for transparency, but with solid additive-like colors, order matters less.
            // We will draw back cells first implicitly by iterating, but since it's a sphere, 
            // we just need to ensure we don't draw cells that are technically "clipped" if we wanted a cutaway.
            // Here we draw the whole sphere.
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        drawCell(x, y);
                    }
                }
            }
            
            // 3. Draw Outer Glow/Rim
            const rimGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.9, centerX, centerY, radius * 1.05);
            rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
            rimGrad.addColorStop(0.5, 'rgba(100, 100, 255, 0.1)');
            rimGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = rimGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.1, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCell(col, row) {
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Rotation Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotation X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective
            const fov = 800;
            const scale = fov / (fov + z2);
            
            // Simple Back-face culling (optional, but adds realism if we want a solid sphere)
            // For this "holographic" look, we draw everything but fade the back.
            
            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            // Size calculation
            // Using a fixed small size based on resolution to create a "dense" look
            const cellSize = (radius / CONFIG.gridResolution) * 1.8 * scale; 

            // Color & Depth Logic
            // Base palette: Indigo (260) -> Cyan (180)
            const hue = cellColors[row][col]; 
            
            // Depth cue: z2 ranges from -radius (front) to +radius (back)
            // We want front (-radius) to be bright, back (+radius) to be dim.
            const depthFactor = (z2 + radius) / (2 * radius); // 0 at front, 1 at back
            const alpha = Math.max(0.1, 1.0 - (depthFactor * 0.9)); // 1.0 front, 0.1 back
            const brightness = 50 + (1 - depthFactor) * 40; // 50% base, up to 90% front

            ctx.fillStyle = `hsla(${hue}, 80%, ${brightness}%, ${alpha})`;
            
            // Glow only for very front cells
            if (z2 < -radius * 0.5) {
                ctx.shadowBlur = 4 * scale;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.5)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            // Draw square-ish cells for that "tech" look, or circles for organic
            // Using circles for smoother sphere approximation
            ctx.arc(screenX, screenY, cellSize, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
