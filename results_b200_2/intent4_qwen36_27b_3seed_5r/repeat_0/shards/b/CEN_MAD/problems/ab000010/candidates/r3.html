<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT: SPHERICAL AUTOMATON</title>
    <style>
        :root {
            --bg-color: #030304;
            --glass-bg: rgba(10, 10, 12, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            
            /* Palette: Electric, Deep, Hot */
            --c-cyan: #00f0ff;
            --c-violet: #9d4edd;
            --c-orange: #ff5e00;
            --c-text-main: #ececec;
            --c-text-dim: #6e6e73;
            
            /* Typography */
            --font-stack: "SF Mono", "Menlo", "Monaco", "Consolas", "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--c-text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* Background Grain/Noise Texture (CSS Generated) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* Layout */
        .canvas-wrapper {
            position: relative;
            flex-grow: 1;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            z-index: 1;
        }
        .canvas-wrapper:active { cursor: grabbing; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism Panel */
        .panel {
            width: 320px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 32px;
            z-index: 10;
            box-shadow: -20px 0 60px rgba(0,0,0,0.6);
            overflow-y: auto;
        }

        /* Typography & Hierarchy */
        .panel-header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--c-text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background: var(--c-cyan);
            box-shadow: 0 0 8px var(--c-cyan);
            border-radius: 50%;
        }

        .subtitle {
            font-size: 10px;
            color: var(--c-text-dim);
            margin-top: 6px;
            letter-spacing: 0.05em;
        }

        /* Dashboard / Stats */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 48px; /* Increased whitespace */
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--c-text-dim);
            font-weight: 600;
        }

        .stat-val {
            font-family: var(--font-stack);
            font-size: 22px;
            font-weight: 400;
            color: var(--c-text-main);
            letter-spacing: -0.03em;
        }
        
        .stat-val.cyan { color: var(--c-cyan); text-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
        .stat-val.violet { color: var(--c-violet); text-shadow: 0 0 10px rgba(157, 78, 221, 0.3); }

        /* Control Components */
        .control-group {
            margin-bottom: 48px; /* Increased whitespace */
        }

        .section-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--c-text-dim);
            margin-bottom: 24px;
            display: block;
            border-left: 1px solid var(--c-text-dim);
            padding-left: 10px;
        }

        /* Custom Slider */
        .slider-row {
            margin-bottom: 28px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .slider-val {
            font-family: var(--font-stack);
            font-size: 10px;
            color: var(--c-text-main);
            opacity: 0.8;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px;
            width: 10px;
            background: var(--c-text-main);
            cursor: pointer;
            margin-top: -4.5px; /* Center on 1px track */
            border: 0;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.5); /* Halo */
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 1px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
        }

        /* Buttons: Ghost Style */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-full {
            grid-column: span 2;
        }

        button {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            color: var(--c-text-dim);
            padding: 12px;
            border-radius: 2px;
            font-size: 10px;
            font-family: var(--font-stack);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        button:hover {
            border-color: rgba(255,255,255,0.4);
            color: var(--c-text-main);
            background: rgba(255,255,255,0.05);
        }

        button:active {
            background: rgba(255,255,255,0.1);
        }

        /* Primary Button Variant (Subtle) */
        button.primary {
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--c-cyan);
        }
        
        button.primary:hover {
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        /* Relocated Legend */
        .legend-overlay {
            position: absolute;
            bottom: 32px;
            left: 32px;
            z-index: 20;
            display: flex;
            gap: 24px;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--c-text-main);
            font-family: var(--font-stack);
            opacity: 0.8;
            letter-spacing: 0.05em;
        }

        .dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 1px; /* Square for "tech" feel */
        }
        .dot.birth { background: var(--c-cyan); box-shadow: 0 0 6px var(--c-cyan); }
        .dot.life { background: var(--c-violet); }
        .dot.death { background: var(--c-orange); opacity: 0.8; }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            .canvas-wrapper { height: 60vh; }
            .panel { width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--glass-border); }
            .legend-overlay { bottom: 16px; left: 16px; }
        }
    </style>
</head>
<body>

    <!-- Main Simulation View -->
    <div class="canvas-wrapper" id="canvasContainer">
        <canvas id="lifeCanvas"></canvas>
        
        <!-- Legend Overlay (Bottom Left) -->
        <div class="legend-overlay">
            <div class="legend-item"><div class="dot birth"></div>GENESIS</div>
            <div class="legend-item"><div class="dot life"></div>SUSTAIN</div>
            <div class="legend-item"><div class="dot death"></div>ENTROPY</div>
        </div>
    </div>

    <!-- Control Panel (Right) -->
    <div class="panel">
        <div class="panel-header">
            <h1>Spherical Automaton</h1>
            <p class="subtitle">VOLUMETRIC RENDER // CELLULAR_TOPOLOGY</p>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
            <div class="stat-card">
                <span class="stat-label">Cycles</span>
                <span class="stat-val cyan" id="genCount">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Active Cells</span>
                <span class="stat-val violet" id="popCount">0</span>
            </div>
        </div>

        <!-- Parameters -->
        <div class="control-group">
            <span class="section-label">Simulation Parameters</span>
            
            <div class="slider-row">
                <div class="slider-header">
                    <span class="stat-label">Clock Speed</span>
                    <span class="slider-val" id="speedVal">100%</span>
                </div>
                <input type="range" id="speedSlider" min="1" max="20" value="10">
            </div>
            
            <div class="slider-row">
                <div class="slider-header">
                    <span class="stat-label">Grid Density</span>
                    <span class="slider-val" id="densityVal">MEDIUM</span>
                </div>
                <input type="range" id="densitySlider" min="30" max="80" value="50">
            </div>
        </div>

        <!-- Commands -->
        <div class="control-group">
            <span class="section-label">Command Center</span>
            <div class="btn-grid">
                <button class="primary" id="toggleBtn">Pause System</button>
                <button id="resetBtn">Randomize</button>
                <button id="clearBtn" class="btn-full">Terminate All</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 50, // Start medium
            speed: 10, // Frames per step
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellState = []; // 0: Dead, 1: Born, 2: Alive, 3: Dying
        let cellAge = [];   // For visual effects
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.2; 
        let rotationY = 0;
        let targetRotationX = 0.2;
        let targetRotationY = 0;

        // Background Stars
        let stars = [];

        /**
         * Initialization
         */
        function init() {
            resize();
            createStars();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            const container = document.getElementById('canvasContainer');
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                // Invert logic: higher slider = faster (lower frames per step)
                const val = parseInt(e.target.value);
                CONFIG.speed = Math.max(1, 21 - val); 
                document.getElementById('speedVal').innerText = Math.round((val/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                let text = "MEDIUM";
                if (val < 45) text = "LOW";
                else if (val > 65) text = "HIGH";
                document.getElementById('densityVal').innerText = text;
                
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                const btn = document.getElementById('toggleBtn');
                btn.innerText = isRunning ? "Pause System" : "Resume System";
                if(isRunning) {
                    btn.classList.add('primary');
                } else {
                    btn.classList.remove('primary');
                }
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellState = cellState.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellState = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() > 0.7 ? 1 : 0;
                    cellState[y][x] = grid[y][x] ? 2 : 0; // Start as 'Alive'
                    cellAge[y][x] = 0;
                    if (grid[y][x]) population++;
                }
            }
            updateStats();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function createStars() {
            stars = [];
            for(let i=0; i<300; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    size: Math.random() * 1.5,
                    alpha: Math.random() * 0.6
                });
            }
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    const currentState = cellState[y][x];

                    // Game of Life Rules
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellState[y][x] = 1; // BIRTH
                        cellAge[y][x] = 0;
                    } else if (state === 1) {
                        if (neighbors < 2 || neighbors > 3) {
                            nextGrid[y][x] = 0;
                            cellState[y][x] = 3; // DYING
                        } else {
                            nextGrid[y][x] = 1;
                            if (currentState === 1) {
                                cellState[y][x] = 2; // Transition from Birth to Life
                            } else {
                                cellState[y][x] = 2; // Stay Life
                            }
                            cellAge[y][x]++;
                        }
                    } else {
                        nextGrid[y][x] = 0;
                        if (currentState === 3) {
                            cellAge[y][x]++;
                        } else {
                            cellState[y][x] = 0; // DEAD
                            cellAge[y][x] = 0;
                        }
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            updateStats();
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        function updateStats() {
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear & Background
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars (Parallax effect could be added here)
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + Math.sin(frameCount * 0.02 + star.x * 10) * 0.5);
                ctx.beginPath();
                ctx.arc(star.x * width, star.y * height, star.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Auto-rotation
            if (!isDragging) {
                targetRotationY += 0.0015; 
            }
            rotationX += (targetRotationX - rotationX) * 0.08;
            rotationY += (targetRotationY - rotationY) * 0.08;

            // 1. Volumetric Glow (Back)
            // Soft radial gradient matching the internal sphere colors
            const glowGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.6, centerX, centerY, radius * 1.8);
            glowGrad.addColorStop(0, 'rgba(157, 78, 221, 0.0)');
            glowGrad.addColorStop(0.5, 'rgba(0, 240, 255, 0.05)');
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.8, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw Grid Cells (Sorted by Z for correct overlap if we had alpha blending)
            // Since we draw opaque-ish shapes, simple iteration is fine, but let's group by Z roughly
            // For true 3D correctness we'd sort, but for 2D projection of sphere, 
            // back-to-front is best.
            
            // We calculate all points first
            const pointsToDraw = [];
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1 || cellState[y][x] === 3) {
                        const pos = getProjectPoint(x, y);
                        pointsToDraw.push({
                            pos: pos,
                            col: x,
                            row: y
                        });
                    }
                }
            }

            // Sort by Z (far to near)
            pointsToDraw.sort((a, b) => b.pos.z - a.pos.z);

            // Draw them
            pointsToDraw.forEach(item => {
                drawCell(item.col, item.row, item.pos);
            });

            // 3. Inner Shadow / Atmosphere for volume
            const innerShadow = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius);
            innerShadow.addColorStop(0, 'rgba(0,0,0,0)');
            innerShadow.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = innerShadow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCell(col, row, pos) {
            const scale = pos.scale;
            const z = pos.z;

            // Size logic
            const cellSize = (radius / CONFIG.gridResolution) * 1.3 * scale; 

            // Color Logic
            let color, glow = 0;
            const state = cellState[row][col];
            const age = cellAge[row][col];

            if (state === 1) {
                // BIRTH: Electric Cyan
                color = `hsla(185, 100%, 70%, 1)`;
                glow = 15 * scale;
            } else if (state === 2) {
                // LIFE: Deep Violet
                // Shift hue slightly based on age for subtle texture
                const hueShift = (age * 2) % 40; 
                color = `hsla(${270 + hueShift}, 80%, 60%, 1)`;
                glow = 5 * scale;
            } else if (state === 3) {
                // DEATH: Ember Orange
                const opacity = Math.max(0, 1 - (age / 5));
                color = `hsla(25, 100%, 50%, ${opacity})`;
                if (opacity < 0.1) return;
            }

            // Depth Cueing & Occlusion
            // z ranges from -radius (front) to radius (back)
            // Calculate normalized depth (0 = front, 1 = back)
            const depthFactor = (z + radius) / (2 * radius); 
            
            // Hide cells on the very back
            if (depthFactor > 0.9) return; 

            // Dim cells on the far side
            let alpha = 1.0;
            if (depthFactor > 0.4) {
                // Fade out as it goes back
                alpha = 1.0 - ((depthFactor - 0.4) * 1.5); 
            }

            // Apply depth dimming to color
            // We parse the color string roughly or just use globalAlpha for simplicity in this loop
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

            // Apply glow (Expensive, so limit it to bright cells or front cells)
            if (glow > 0 && depthFactor < 0.5) {
                ctx.shadowBlur = glow;
                ctx.shadowColor = color;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fillStyle = color;

            // Draw Shape
            ctx.beginPath();
            if (state === 2) {
                // Squares for stable life
                ctx.rect(pos.x - cellSize/2, pos.y - cellSize/2, cellSize, cellSize);
            } else {
                // Circles for events
                ctx.arc(pos.x, pos.y, cellSize/2, 0, Math.PI * 2);
            }
            ctx.fill();
            
            // Reset context
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        function getProjectPoint(col, row) {
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Rotation Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotation X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective
            const fov = 800;
            const scale = fov / (fov + z2);
            
            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            return { x: screenX, y: screenY, z: z2, scale: scale };
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
