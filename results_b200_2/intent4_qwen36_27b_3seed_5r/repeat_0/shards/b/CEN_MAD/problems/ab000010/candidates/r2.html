<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Game of Life // HUD</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0a0a0a;
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f0ff;
            --accent-violet: #8a2be2;
            --accent-orange: #ff5e00;
            --text-primary: #e0e0e0;
            --text-secondary: #666666;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Roboto Mono", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 340px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: grab;
            background: radial-gradient(circle at center, #0f0f12 0%, #000000 100%);
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            z-index: 1;
        }

        /* Control Panel */
        .panel {
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            padding: 32px;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 10;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        /* Header */
        .panel-header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        /* Live Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--panel-border);
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        
        .stat-val.cyan { color: var(--accent-cyan); }
        .stat-val.violet { color: var(--accent-violet); }

        /* Controls Section */
        .control-group {
            margin-bottom: 32px;
        }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: block;
        }

        /* Sliders */
        .slider-row {
            margin-bottom: 20px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .slider-val {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            background: var(--text-primary);
            cursor: pointer;
            margin-top: -5px;
            border: 2px solid #000;
            box-shadow: 0 0 0 1px var(--text-secondary);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 1px;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
        }

        /* Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-full {
            grid-column: span 2;
        }

        button {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-secondary);
            padding: 10px;
            border-radius: 2px;
            font-size: 11px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
        }

        button:active {
            background: rgba(255,255,255,0.08);
        }

        button.primary {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        
        button.primary:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* Footer / Legend */
        .legend {
            margin-top: auto;
            display: flex;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid var(--panel-border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .dot { width: 6px; height: 6px; }
        .dot.birth { background: var(--accent-cyan); box-shadow: 0 0 5px var(--accent-cyan); }
        .dot.life { background: var(--accent-violet); }
        .dot.death { background: var(--accent-orange); }

        /* Responsive */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: 40vh;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Simulation View -->
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <!-- UI Panel -->
        <div class="panel">
            <div class="panel-header">
                <h1>Sphere Logic</h1>
                <p class="subtitle">AUTOMATON // MANIFOLD_PROJECTION</p>
            </div>

            <!-- Dashboard -->
            <div class="dashboard">
                <div class="stat-card">
                    <span class="stat-label">Generations</span>
                    <span class="stat-val cyan" id="genCount">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Population</span>
                    <span class="stat-val violet" id="popCount">0</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="control-group">
                <span class="section-label">Parameters</span>
                
                <div class="slider-row">
                    <div class="slider-header">
                        <span class="stat-label">Clock Speed</span>
                        <span class="slider-val" id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div class="slider-row">
                    <div class="slider-header">
                        <span class="stat-label">Resolution</span>
                        <span class="slider-val" id="densityVal">High</span>
                    </div>
                    <input type="range" id="densitySlider" min="40" max="100" value="60">
                </div>
            </div>

            <div class="control-group">
                <span class="section-label">Command Center</span>
                <div class="btn-grid">
                    <button class="primary" id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                    <button id="clearBtn" class="btn-full">Clear All</button>
                </div>
            </div>

            <!-- Legend -->
            <div class="legend">
                <div class="legend-item"><div class="dot birth"></div>BIRTH</div>
                <div class="legend-item"><div class="dot life"></div>LIFE</div>
                <div class="legend-item"><div class="dot death"></div>DEATH</div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 60, // Base for the slider
            speed: 10, // frames per step (lower is faster)
            evolutionRate: 0.02
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellState = []; // 0: Dead, 1: Born, 2: Alive, 3: Dying
        let cellAge = [];   // For aging logic
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        // Starfield
        let stars = [];

        /**
         * Initialization
         */
        function init() {
            resize();
            createStars();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            const container = document.getElementById('canvasContainer');
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value; 
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                let text = "High";
                if (val < 50) text = "Very High";
                else if (val < 80) text = "High";
                else text = "Medium";
                document.getElementById('densityVal').innerText = text;
                
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                const btn = document.getElementById('toggleBtn');
                btn.innerText = isRunning ? "Pause" : "Resume";
                if(isRunning) {
                    btn.classList.add('primary');
                } else {
                    btn.classList.remove('primary');
                }
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellState = cellState.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellState = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() > 0.6 ? 1 : 0;
                    // 1 = Alive, 0 = Dead
                    cellState[y][x] = grid[y][x] ? 2 : 0; // Start as 'Alive'
                    cellAge[y][x] = 0;
                    if (grid[y][x]) population++;
                }
            }
            updateStats();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function createStars() {
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    size: Math.random() * 1.5,
                    alpha: Math.random() * 0.5
                });
            }
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    const currentState = cellState[y][x];

                    // Logic
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellState[y][x] = 1; // BIRTH
                        cellAge[y][x] = 0;
                    } else if (state === 1) {
                        if (neighbors < 2 || neighbors > 3) {
                            nextGrid[y][x] = 0;
                            cellState[y][x] = 3; // DYING
                        } else {
                            nextGrid[y][x] = 1;
                            if (currentState === 1) {
                                cellState[y][x] = 2; // Transition from Birth to Life
                            } else {
                                cellState[y][x] = 2; // Stay Life
                            }
                            cellAge[y][x]++;
                        }
                    } else {
                        nextGrid[y][x] = 0;
                        if (currentState === 3) {
                            // Fade out logic handled in render via age
                            cellAge[y][x]++;
                        } else {
                            cellState[y][x] = 0; // DEAD
                            cellAge[y][x] = 0;
                        }
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            updateStats();
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        function updateStats() {
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // Background Stars
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + Math.sin(frameCount * 0.05 + star.x * 10) * 0.5);
                ctx.beginPath();
                ctx.arc(star.x * width, star.y * height, star.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            if (!isDragging) {
                targetRotationY += 0.001; 
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // 1. Draw Sphere Wireframe (The "Shell")
            drawWireframe();

            // 2. Draw Grid Cells
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Draw if Alive OR recently Dead (for the Ember effect)
                    if (grid[y][x] === 1 || cellState[y][x] === 3) {
                        drawCell(x, y);
                    }
                }
            }
            
            // 3. Atmospheric Vignette/Rim
            const rimGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.2);
            rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
            rimGrad.addColorStop(0.8, 'rgba(0, 240, 255, 0.02)');
            rimGrad.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = rimGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawWireframe() {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            
            // Draw Latitude lines
            for (let y = 0; y < rows; y += 4) {
                ctx.beginPath();
                for (let x = 0; x < cols; x++) {
                    const pos = getProjectPoint(x, y);
                    if (x === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                ctx.stroke();
            }

            // Draw Longitude lines
            for (let x = 0; x < cols; x += 4) {
                ctx.beginPath();
                for (let y = 0; y < rows; y++) {
                    const pos = getProjectPoint(x, y);
                    if (y === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                ctx.stroke();
            }
        }

        function drawCell(col, row) {
            const pos = getProjectPoint(col, row);
            const scale = pos.scale;
            const z = pos.z;

            // Size: Small, sharp geometric primitive
            const cellSize = (radius / CONFIG.gridResolution) * 1.4 * scale; 

            // Color Logic based on Lifecycle State
            let color, glow = 0;
            const state = cellState[row][col];
            const age = cellAge[row][col];

            if (state === 1) {
                // BIRTH: Electric Cyan
                color = `hsla(185, 100%, 70%, 1)`;
                glow = 10 * scale;
            } else if (state === 2) {
                // LIFE: Deep Violet
                // Shift hue slightly based on age for subtle texture
                const hueShift = (age * 2) % 40; 
                color = `hsla(${270 + hueShift}, 80%, 60%, 1)`;
                glow = 2 * scale;
            } else if (state === 3) {
                // DEATH: Ember Orange
                // Fade out based on age
                const opacity = Math.max(0, 1 - (age / 5));
                color = `hsla(25, 100%, 50%, ${opacity})`;
                if (opacity < 0.1) return; // Don't draw if invisible
            }

            // Depth Cueing
            // z ranges from -radius (front) to radius (back)
            const depthFactor = (z + radius) / (2 * radius); 
            // We only draw if somewhat visible or if it's a bright birth/death event
            if (depthFactor > 0.95 && state !== 1) return; 

            ctx.fillStyle = color;
            
            // Apply glow
            ctx.shadowBlur = glow;
            ctx.shadowColor = color;

            // Draw Sharp Square/Dot
            ctx.beginPath();
            if (state === 2) {
                // Squares for life
                ctx.rect(pos.x - cellSize/2, pos.y - cellSize/2, cellSize, cellSize);
            } else {
                // Circles for birth/death events
                ctx.arc(pos.x, pos.y, cellSize/2, 0, Math.PI * 2);
            }
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        function getProjectPoint(col, row) {
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Rotation Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotation X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective
            const fov = 800;
            const scale = fov / (fov + z2);
            
            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            return { x: screenX, y: screenY, z: z2, scale: scale };
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
