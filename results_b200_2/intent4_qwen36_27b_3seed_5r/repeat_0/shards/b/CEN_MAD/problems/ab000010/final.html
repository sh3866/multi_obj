<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPHERICAL AUTOMATON // V2</title>
    <style>
        :root {
            /* Palette: Deep Space & Neon */
            --bg-deep: #020204;
            --bg-panel: rgba(10, 10, 14, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-highlight: rgba(255, 255, 255, 0.15);
            
            /* Dynamic Colors (defined in JS for simulation) */
            --c-accent: #00f0ff; /* Cyan */
            
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-dim: #52525b;

            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-data: "SF Mono", "Menlo", "Monaco", "Consolas", "Liberation Mono", monospace;
            
            /* Geometry */
            --radius-ui: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            outline: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* Layout */
        .canvas-wrapper {
            position: relative;
            flex-grow: 1;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            z-index: 1;
            background: radial-gradient(circle at 30% 30%, #10101a 0%, #020204 70%);
        }
        .canvas-wrapper:active { cursor: grabbing; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Control Panel - Clean, Minimal */
        .panel {
            width: 320px;
            height: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 40px 32px;
            z-index: 10;
            box-shadow: -20px 0 60px rgba(0,0,0,0.4);
            overflow-y: auto;
        }

        /* Header */
        .panel-header {
            margin-bottom: 48px;
        }

        h1 {
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: var(--font-data);
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        /* Dashboard / Stats - Stripped back */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            font-weight: 500;
        }

        .stat-val {
            font-family: var(--font-data);
            font-size: 28px;
            font-weight: 700; /* Heavier weight */
            color: var(--text-primary);
            line-height: 1;
        }

        /* Controls Section */
        .control-section {
            margin-bottom: 40px;
        }

        .section-divider {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            margin-bottom: 24px;
            display: block;
            font-weight: 600;
        }

        /* Buttons - Dominant */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 16px;
            border-radius: var(--radius-ui);
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            text-transform: uppercase;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: var(--border-highlight);
            transform: translateY(-1px);
        }

        button.primary {
            background: var(--text-primary);
            color: var(--bg-deep);
            border: 1px solid var(--text-primary);
        }

        button.primary:hover {
            background: #e2e8f0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Sliders - Refined */
        .slider-row {
            margin-bottom: 28px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }
        
        .slider-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .slider-val {
            font-family: var(--font-data);
            font-size: 11px;
            color: var(--text-dim);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        /* Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px; /* Thicker track */
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Thumb */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            margin-top: -5px;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.5); /* Ring for contrast */
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* Legend (Simplified) */
        .legend {
            display: flex;
            gap: 16px;
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--border-subtle);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            font-family: var(--font-data);
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            .canvas-wrapper { height: 55vh; }
            .panel { width: 100%; height: 45vh; border-left: none; border-top: 1px solid var(--border-subtle); }
        }
    </style>
</head>
<body>

    <!-- Main Simulation View -->
    <div class="canvas-wrapper" id="canvasContainer">
        <canvas id="lifeCanvas"></canvas>
    </div>

    <!-- Control Panel -->
    <div class="panel">
        <div class="panel-header">
            <h1>Spherical Automaton</h1>
            <div class="subtitle">Conway's Game of Life // 3D Projection</div>
        </div>

        <!-- Dashboard / Stats -->
        <div class="dashboard">
            <div class="stat-group">
                <span class="stat-label">Cycles</span>
                <span class="stat-val" id="genCount">0</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Population</span>
                <span class="stat-val" id="popCount">0</span>
            </div>
        </div>

        <!-- Primary Actions -->
        <div class="control-section">
            <div class="btn-grid">
                <button class="primary" id="toggleBtn">Pause</button>
                <button id="resetBtn">Randomize</button>
            </div>
        </div>

        <!-- Parameters -->
        <div class="control-section">
            <span class="section-divider">Parameters</span>
            
            <div class="slider-row">
                <div class="slider-header">
                    <span class="slider-label">Clock Speed</span>
                    <span class="slider-val" id="speedVal">100%</span>
                </div>
                <input type="range" id="speedSlider" min="1" max="20" value="10">
            </div>
            
            <div class="slider-row">
                <div class="slider-header">
                    <span class="slider-label">Resolution</span>
                    <span class="slider-val" id="densityVal">80</span>
                </div>
                <input type="range" id="densitySlider" min="40" max="128" value="80">
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: #fff"></div>Born</div>
            <div class="legend-item"><div class="dot" style="background: #00f0ff"></div>Alive</div>
            <div class="legend-item"><div class="dot" style="background: #ff0055"></div>Dying</div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 0,
            gridResolution: 80,
            speed: 10,
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellState = []; // 0: Dead, 1: Born, 2: Alive, 3: Dying
        let cellAge = [];   // For color mapping
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.3; 
        let rotationY = 0;
        let targetRotationX = 0.3;
        let targetRotationY = 0;

        // Background Stars
        let stars = [];

        /**
         * Initialization
         */
        function init() {
            resize();
            createStars();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            const container = document.getElementById('canvasContainer');
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                CONFIG.speed = Math.max(1, 21 - val); 
                document.getElementById('speedVal').innerText = Math.round((val/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                document.getElementById('densityVal').innerText = val;
                
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                const btn = document.getElementById('toggleBtn');
                btn.innerText = isRunning ? "Pause" : "Resume";
                if(isRunning) {
                    btn.classList.add('primary');
                } else {
                    btn.classList.remove('primary');
                }
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellState = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() > 0.7 ? 1 : 0; 
                    cellState[y][x] = grid[y][x] ? 2 : 0; 
                    cellAge[y][x] = 0;
                    if (grid[y][x]) population++;
                }
            }
            updateStats();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function createStars() {
            stars = [];
            for(let i=0; i<400; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    size: Math.random() * 1.5,
                    alpha: Math.random() * 0.4
                });
            }
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    const currentState = cellState[y][x];

                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellState[y][x] = 1; // BIRTH
                        cellAge[y][x] = 0;
                    } else if (state === 1) {
                        if (neighbors < 2 || neighbors > 3) {
                            nextGrid[y][x] = 0;
                            cellState[y][x] = 3; // DYING
                        } else {
                            nextGrid[y][x] = 1;
                            if (currentState === 1) {
                                cellState[y][x] = 2; // Transition from Birth to Life
                            } else {
                                cellState[y][x] = 2; // Stay Life
                            }
                            cellAge[y][x]++;
                        }
                    } else {
                        nextGrid[y][x] = 0;
                        if (currentState === 3) {
                            cellAge[y][x]++;
                        } else {
                            cellState[y][x] = 0; // DEAD
                            cellAge[y][x] = 0;
                        }
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            updateStats();
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        function updateStats() {
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear & Background
            ctx.clearRect(0, 0, width, height);
            
            // Draw Stars (Static background)
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha * (0.5 + Math.sin(frameCount * 0.01 + star.x * 10) * 0.5);
                ctx.beginPath();
                ctx.arc(star.x * width, star.y * height, star.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Auto-rotation
            if (!isDragging) {
                targetRotationY += 0.001; 
            }
            rotationX += (targetRotationX - rotationX) * 0.05;
            rotationY += (targetRotationY - rotationY) * 0.05;

            // 1. Volumetric Bloom (Layered)
            // Outer glow (Cyan/Magenta mix)
            const glowGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 2.0);
            glowGrad.addColorStop(0, 'rgba(0, 240, 255, 0.0)');
            glowGrad.addColorStop(0.5, 'rgba(100, 0, 255, 0.03)');
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 2.0, 0, Math.PI * 2);
            ctx.fill();

            // 2. Wireframe / Depth Cues (Atmosphere)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI*2);
            ctx.stroke();
            
            // Inner shadow for volume
            const innerShadow = ctx.createRadialGradient(centerX, centerY, radius * 0.7, centerX, centerY, radius);
            innerShadow.addColorStop(0, 'rgba(0,0,0,0)');
            innerShadow.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = innerShadow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Prepare Points
            const pointsToDraw = [];
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1 || cellState[y][x] === 3) {
                        const pos = getProjectPoint(x, y);
                        pointsToDraw.push({
                            pos: pos,
                            col: x,
                            row: y
                        });
                    }
                }
            }

            // Sort by Z (far to near)
            pointsToDraw.sort((a, b) => b.pos.z - a.pos.z);

            // Draw them
            pointsToDraw.forEach(item => {
                drawCell(item.col, item.row, item.pos);
            });
        }

        function drawCell(col, row, pos) {
            const scale = pos.scale;
            const z = pos.z;

            // Size logic: Smaller, denser cells
            const cellSize = (radius / (CONFIG.gridResolution * 0.8)) * 1.5 * scale; 

            // Color Logic - Spectrum based on age/state
            let color, glow = 0;
            const state = cellState[row][col];
            const age = cellAge[row][col];

            if (state === 1) {
                // BIRTH: White / High Energy
                color = `hsla(0, 0%, 100%, 1)`;
                glow = 15 * scale;
            } else if (state === 2) {
                // LIFE: Spectrum (Cyan -> Magenta -> Indigo) based on age
                // Cycle hue: 180 (Cyan) -> 280 (Purple) -> 320 (Magenta)
                const hue = 180 + (age * 2) % 140; 
                color = `hsla(${hue}, 100%, 60%, 1)`;
                glow = 5 * scale;
            } else if (state === 3) {
                // DEATH: Red/Hot Pink fading out
                const opacity = Math.max(0, 1 - (age / 5));
                color = `hsla(330, 100%, 60%, ${opacity})`;
                if (opacity < 0.1) return;
            }

            // Depth Cueing & Occlusion
            const depthFactor = (z + radius) / (2 * radius); 
            
            // Hide cells on the very back
            if (depthFactor > 0.92) return; 

            // Dim cells on the far side
            let alpha = 1.0;
            if (depthFactor > 0.3) {
                alpha = 1.0 - ((depthFactor - 0.3) * 1.4); 
            }

            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

            // Apply glow (Expensive, limit to front)
            if (glow > 0 && depthFactor < 0.5) {
                ctx.shadowBlur = glow;
                ctx.shadowColor = color;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fillStyle = color;

            // Draw Shape: Sharp Circles
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, cellSize/2, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset context
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        function getProjectPoint(col, row) {
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Rotation Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotation X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective
            const fov = 800;
            const scale = fov / (fov + z2);
            
            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            return { x: screenX, y: screenY, z: z2, scale: scale };
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
