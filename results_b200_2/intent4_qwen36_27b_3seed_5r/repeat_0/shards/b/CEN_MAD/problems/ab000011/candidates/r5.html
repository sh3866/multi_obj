<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX: GRID PROTOCOL</title>
<style>
    :root {
        /* Palette: Refined Industrial */
        --bg-deep: #050608;
        --bg-panel: #12141a;
        
        --flux-primary: #00f3ff;
        --flux-glow: rgba(0, 243, 255, 0.6);
        
        --alert-red: #ff2a2a;
        --alert-glow: rgba(255, 42, 42, 0.5);
        
        --iron-dark: #1a1c23;
        --iron-light: #2d313d;
        --iron-highlight: #4a5063;
        
        --text-main: #e2e8f0;
        --text-dim: #64748b;
        
        /* Typography */
        --font-ui: system-ui, -apple-system, sans-serif;
        --font-mono: "SF Mono", "Roboto Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Subtle Vignette Background */
        background: radial-gradient(circle at 50% 30%, #161b22 0%, #050608 100%);
    }

    /* --- MAIN CONTAINER --- */
    .machine-case {
        width: 100%;
        max-width: 720px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    /* --- HUD & HEADER --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 0.25rem;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 1rem;
    }

    .title-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    h1 {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: var(--text-main);
        text-transform: uppercase;
        line-height: 1;
        margin: 0;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    
    .subtitle {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--flux-primary);
        letter-spacing: 0.15em;
        font-weight: 600;
        text-transform: uppercase;
        opacity: 0.9;
    }

    .hud-stats {
        display: flex;
        gap: 2.5rem;
        text-align: right;
    }

    .stat-group {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
    }

    .stat-label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-dim);
        font-weight: 700;
        letter-spacing: 0.1em;
    }

    .stat-val {
        font-family: var(--font-mono);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
        text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* --- THE BOARD --- */
    .viewport-frame {
        position: relative;
        /* Rugged Metal Frame */
        background: linear-gradient(145deg, #2d313d 0%, #1a1c23 100%);
        padding: 12px;
        border-radius: 4px;
        box-shadow: 
            0 20px 50px rgba(0,0,0,0.7),
            inset 0 1px 0 rgba(255,255,255,0.1),
            inset 0 -1px 0 rgba(0,0,0,0.5);
        border: 1px solid #000;
    }

    /* Screws in the frame */
    .viewport-frame::before, .viewport-frame::after {
        content: '';
        position: absolute;
        width: 6px; height: 6px;
        background: #0a0c10;
        border-radius: 50%;
        box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8), 0 0 1px rgba(255,255,255,0.2);
        top: 6px;
        z-index: 20;
    }
    .viewport-frame::before { left: 6px; }
    .viewport-frame::after { right: 6px; }

    .viewport {
        position: relative;
        background: #0b0c10;
        border: 1px solid #000;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
        display: flex;
        justify-content: center;
        overflow: hidden;
        border-radius: 2px;
    }

    #grid-canvas {
        display: block;
        z-index: 10;
        cursor: crosshair;
        image-rendering: pixelated; /* Crisp edges */
    }

    /* --- CONTROLS --- */
    .control-panel {
        display: flex;
        justify-content: center;
        gap: 4rem;
        padding: 1rem 0 0.5rem;
        position: relative;
    }
    
    /* Decorative line above controls */
    .control-panel::before {
        content: '';
        position: absolute;
        top: 0; left: 50%; transform: translateX(-50%);
        width: 60%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    .control-module {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .key-stencil {
        background: transparent;
        color: var(--flux-primary);
        padding: 4px 10px;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        border: 1px solid var(--flux-primary);
        border-radius: 2px;
        font-weight: 600;
        opacity: 0.8;
        box-shadow: 0 0 8px var(--flux-glow);
        text-align: center;
        min-width: 24px;
        letter-spacing: 0.05em;
    }

    .action-label {
        font-size: 0.8rem;
        color: var(--text-dim);
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

</style>
</head>
<body>

<div class="machine-case">
    <header>
        <div class="title-block">
            <h1>Iron & Flux</h1>
            <span class="subtitle">Grid Protocol</span>
        </div>
        <div class="hud-stats">
            <div class="stat-group">
                <span class="stat-label">LEVEL</span>
                <span class="stat-val">01</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">MOVES</span>
                <span class="stat-val" id="move-counter">00</span>
            </div>
        </div>
    </header>

    <div class="viewport-frame">
        <div class="viewport">
            <canvas id="grid-canvas"></canvas>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-module">
            <div class="key-stencil">▲</div>
            <div class="key-stencil">▼</div>
            <div class="key-stencil">◄</div>
            <div class="key-stencil">►</div>
            <span class="action-label">Move / Push</span>
        </div>
        <div class="control-module">
            <div class="key-stencil">SPC</div>
            <span class="action-label">Pull Lever</span>
        </div>
    </div>
</div>

<script>
/**
 * VISUAL ENGINE - REDESIGNED
 * Focus: Materiality, Lighting, Hierarchy
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
const moveCounter = document.getElementById('move-counter');

// Configuration - Strict 8x8 Grid
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;
let moveCount = 0;

// Game State
let gameState = {
    player: { x: 1, y: 3 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}
    ]
};

function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- RENDERING HELPERS ---

function getTile(x, y) {
    return { x: x * TILE_SIZE, y: y * TILE_SIZE };
}

function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

// --- DRAWING FUNCTIONS ---

function drawFloor() {
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            const {x: px, y: py} = getTile(x, y);
            
            // 1. Base Floor - Dark Matte
            drawRect(px, py, TILE_SIZE, TILE_SIZE, '#0e1014');
            
            // 2. Subtle Grid Lines (1px stroke)
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 0.5, py + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
        }
    }
}

function drawWalls() {
    gameState.walls.forEach(w => {
        const {x: px, y: py} = getTile(w.x, w.y);
        const pad = 4;
        
        // 1. Recessed Shadow (The "Hole")
        ctx.fillStyle = '#000';
        ctx.fillRect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2);
        
        // 2. Wall Surface (Heavy Iron/Concrete)
        // Using a gradient to simulate depth and texture
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, '#3a4150'); // Highlight Top-Left
        grad.addColorStop(0.5, '#232730');
        grad.addColorStop(1, '#111318'); // Shadow Bottom-Right
        
        ctx.fillStyle = grad;
        ctx.fillRect(px + pad + 2, py + pad + 2, TILE_SIZE - pad*2 - 4, TILE_SIZE - pad*2 - 4);

        // 3. Bevel (Inner Highlight)
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.moveTo(px + pad, py + TILE_SIZE - pad);
        ctx.lineTo(px + pad, py + pad);
        ctx.lineTo(px + TILE_SIZE - pad, py + pad);
        ctx.stroke();
        
        // 4. Rivets
        ctx.fillStyle = '#0a0c10';
        ctx.beginPath();
        ctx.arc(px + 14, py + 14, 2, 0, Math.PI*2);
        ctx.arc(px + TILE_SIZE - 14, py + TILE_SIZE - 14, 2, 0, Math.PI*2);
        ctx.fill();
    });
}

function drawTarget() {
    const t = gameState.target;
    const {x: px, y: py} = getTile(t.x, t.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    ctx.save();
    
    // 1. Floor Decal Glow
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ff9900';
    
    // 2. The "X"
    ctx.strokeStyle = '#ff9900';
    ctx.lineWidth = 4;
    ctx.lineCap = 'square';
    
    ctx.beginPath();
    const off = 18;
    ctx.moveTo(cx - off, cy - off); ctx.lineTo(cx + off, cy + off);
    ctx.moveTo(cx + off, cy - off); ctx.lineTo(cx - off, cy + off);
    ctx.stroke();
    
    ctx.restore();
}

function drawDoor() {
    const d = gameState.door;
    const {x: px, y: py} = getTile(d.x, d.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    if (d.open) {
        // --- OPEN STATE (Portal) ---
        
        // Void Background
        ctx.fillStyle = '#000';
        ctx.fillRect(px + 6, py + 6, TILE_SIZE - 12, TILE_SIZE - 12);
        
        // Portal Glow (Flux Color)
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#00f3ff';
        
        // Frame
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);
        
        // Inner Core
        ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
        ctx.fillRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);
        
        ctx.shadowBlur = 0;
    } else {
        // --- CLOSED STATE (Warning/Archway) ---
        
        // Floor Decal
        ctx.fillStyle = 'rgba(255, 42, 42, 0.05)';
        ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);

        // Archway Shape
        ctx.strokeStyle = '#ff2a2a';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255, 42, 42, 0.4)';
        
        ctx.beginPath();
        ctx.moveTo(px + 12, py + TILE_SIZE - 12); // Bottom Left
        ctx.lineTo(px + 12, py + 25); // Up Left
        ctx.bezierCurveTo(px + 12, py + 12, px + TILE_SIZE - 12, py + 12, px + TILE_SIZE - 12, py + 25); // Arch
        ctx.lineTo(px + TILE_SIZE - 12, py + TILE_SIZE - 12); // Down Right
        ctx.stroke();
        
        // Lock Icon
        ctx.fillStyle = '#ff2a2a';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx, cy - 4, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(cx - 4, cy + 1, 8, 6);
    }
}

function drawLever() {
    const l = gameState.lever;
    const {x: px, y: py} = getTile(l.x, l.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. Base Plate (Dark Metal)
    ctx.fillStyle = '#15171c';
    ctx.fillRect(px + 16, py + 16, TILE_SIZE - 32, TILE_SIZE - 32);
    
    // Plate Detail
    ctx.strokeStyle = '#2d343f';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 16, py + 16, TILE_SIZE - 32, TILE_SIZE - 32);

    // 2. Mechanical Arm
    const armColor = l.active ? '#ff2a2a' : '#5a6270';
    
    ctx.save();
    ctx.strokeStyle = armColor;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    
    if(l.active) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(255, 42, 42, 0.6)';
    }
    
    ctx.beginPath();
    ctx.moveTo(cx, cy + 18); // Pivot
    
    // Arm Angle
    const angle = l.active ? -Math.PI/3 : Math.PI/3; 
    const len = 22;
    const endX = cx + Math.cos(angle) * len;
    const endY = cy + Math.sin(angle) * len;
    
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // 3. Handle Knob
    ctx.fillStyle = l.active ? '#fff' : '#718096';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(endX, endY, 7, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

function drawCrates() {
    gameState.crates.forEach(c => {
        const {x: px, y: py} = getTile(c.x, c.y);
        const pad = 8;
        
        // 1. Drop Shadow (Heavy - implies height)
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(px + pad + 6, py + pad + 6, TILE_SIZE - pad*2 - 6, TILE_SIZE - pad*2 - 6);

        // 2. Body (Lighter Metal)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, '#6a7283'); 
        grad.addColorStop(1, '#3a4150');
        drawRect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2, grad);

        // 3. Rim Highlight
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + pad, py + TILE_SIZE - pad);
        ctx.lineTo(px + pad, py + pad);
        ctx.lineTo(px + TILE_SIZE - pad, py + pad);
        ctx.stroke();

        // 4. Stamped Markings (Industrial)
        ctx.strokeStyle = '#1a1d24';
        ctx.lineWidth = 4;
        ctx.beginPath();
        const off = 18;
        ctx.moveTo(px + pad + off, py + pad + off);
        ctx.lineTo(px + TILE_SIZE - pad - off, py + TILE_SIZE - pad - off);
        ctx.moveTo(px + TILE_SIZE - pad - off, py + pad + off);
        ctx.lineTo(px + pad + off, py + TILE_SIZE - pad - off);
        ctx.stroke();
        
        // Center Rivet
        ctx.fillStyle = '#0a0c10';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 6, 0, Math.PI*2);
        ctx.fill();
    });
}

function drawPlayer() {
    const p = gameState.player;
    const {x: px, y: py} = getTile(p.x, p.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. Flux Aura (Bloom)
    ctx.save();
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#00f3ff';

    // 2. Core Shape (Squircle)
    // A squircle is a rounded square with radius = half width
    const size = 28;
    const radius = size / 2;
    
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx - radius + radius, cy - radius); 
    ctx.arcTo(cx + radius, cy - radius, cx + radius, cy + radius, radius);
    ctx.arcTo(cx + radius, cy + radius, cx - radius, cy + radius, radius);
    ctx.arcTo(cx - radius, cy + radius, cx - radius, cy - radius, radius);
    ctx.arcTo(cx - radius, cy - radius, cx + radius, cy - radius, radius);
    ctx.closePath();
    ctx.fill();

    // 3. Inner Flux Eye
    ctx.fillStyle = '#00f3ff';
    ctx.shadowBlur = 0;
    
    // Smaller inner squircle
    const innerSize = 12;
    const innerR = innerSize / 2;
    ctx.beginPath();
    ctx.moveTo(cx - innerR + innerR, cy - innerR); 
    ctx.arcTo(cx + innerR, cy - innerR, cx + innerR, cy + innerR, innerR);
    ctx.arcTo(cx + innerR, cy + innerR, cx - innerR, cy + innerR, innerR);
    ctx.arcTo(cx - innerR, cy + innerR, cx - innerR, cy - innerR, innerR);
    ctx.arcTo(cx - innerR, cy - innerR, cx + innerR, cy - innerR, innerR);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFloor();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Bounds
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Walls
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Door (Closed)
    if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) return;

    // Crates
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        // Check Crate Collision
        const blocked = 
            newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS ||
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY) ||
            (gameState.door.x === newCrateX && gameState.door.y === newCrateY);

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            
            moveCount++;
            moveCounter.innerText = moveCount.toString().padStart(2, '0');
            draw();
        }
    } else {
        gameState.player.x = newX;
        gameState.player.y = newY;
        
        moveCount++;
        moveCounter.innerText = moveCount.toString().padStart(2, '0');
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    
    // Adjacency Check
    if (Math.abs(p.x - l.x) + Math.abs(p.y - l.y) === 1) {
        l.active = !l.active;
        gameState.door.open = l.active;
        draw();
    }
}

window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
