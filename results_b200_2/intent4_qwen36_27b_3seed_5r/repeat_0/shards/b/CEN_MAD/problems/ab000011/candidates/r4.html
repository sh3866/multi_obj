<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX: GRID PROTOCOL</title>
<style>
    :root {
        /* Palette: Industrial Sci-Fi */
        --bg-base: #0f1115;
        --bg-panel: #161920;
        
        --flux-cyan: #00f3ff;
        --flux-glow: rgba(0, 243, 255, 0.5);
        
        --alert-red: #ff3333;
        
        --steel-dark: #1e222b;
        --steel-light: #2a2f3a;
        --wall-matte: #0a0c10;
        
        --text-main: #e2e8f0;
        --text-dim: #64748b;
        
        /* Typography */
        --font-ui: system-ui, -apple-system, sans-serif;
        --font-mono: "SF Mono", "Roboto Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-base);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Deep ambient background */
        background: radial-gradient(circle at 50% 40%, #1a202c 0%, #090a0f 100%);
    }

    /* --- MAIN CONTAINER --- */
    .machine-case {
        width: 100%;
        max-width: 700px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    /* --- HUD & HEADER --- */
    header {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0 0.5rem;
    }

    .title-block {
        display: flex;
        flex-direction: column;
    }

    h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.25em; /* Tracking per critique */
        color: var(--text-main);
        text-transform: uppercase;
        line-height: 1;
        margin-bottom: 0.25rem;
    }
    
    .subtitle {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--flux-cyan);
        letter-spacing: 0.1em;
        font-weight: 700;
        text-transform: uppercase;
    }

    .hud-bar {
        display: flex;
        gap: 2rem;
        font-family: var(--font-mono);
        font-size: 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 0.5rem;
    }

    .stat-group {
        display: flex;
        flex-direction: row;
        align-items: baseline;
        gap: 0.5rem;
    }

    .stat-label {
        font-size: 0.7rem;
        color: var(--text-dim);
        font-weight: 600;
    }

    .stat-val {
        color: var(--text-main);
        text-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    /* --- THE BOARD --- */
    .viewport-frame {
        position: relative;
        /* Bevelled Frame */
        background: linear-gradient(180deg, #3a4150 0%, #1e222b 100%);
        padding: 6px;
        border-radius: 2px;
        box-shadow: 
            0 15px 40px rgba(0,0,0,0.6),
            inset 0 1px 0 rgba(255,255,255,0.3),
            inset 0 -1px 0 rgba(0,0,0,0.8);
        border: 1px solid #000;
    }

    .viewport {
        position: relative;
        background: #12141a;
        border: 1px solid #000;
        box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
        display: flex;
        justify-content: center;
        overflow: hidden;
    }
    
    /* CRT Scanline & Vignette */
    .viewport::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: 
            linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
            radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6) 100%);
        background-size: 100% 4px, 100% 100%;
        pointer-events: none;
        z-index: 20;
    }

    #grid-canvas {
        display: block;
        z-index: 10;
        cursor: crosshair;
    }

    /* --- CONTROLS --- */
    .control-panel {
        display: flex;
        justify-content: center;
        gap: 3rem;
        padding: 0.5rem 0;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    .control-module {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .key-stencil {
        background: #232730;
        color: var(--text-main);
        padding: 6px 12px;
        font-family: var(--font-mono);
        font-size: 0.85rem; /* Larger */
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.15);
        font-weight: 700;
        box-shadow: 0 4px 0 #0f1115;
        text-align: center;
        min-width: 30px;
        letter-spacing: 0.05em;
    }

    .action-label {
        font-size: 0.9rem;
        color: var(--text-dim);
        font-weight: 500;
        letter-spacing: 0.02em;
    }

</style>
</head>
<body>

<div class="machine-case">
    <header>
        <div class="title-block">
            <h1>Iron & Flux</h1>
            <span class="subtitle">Grid Protocol</span>
        </div>
        <div class="hud-bar">
            <div class="stat-group">
                <span class="stat-label">LEVEL</span>
                <span class="stat-val">01</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">MOVES</span>
                <span class="stat-val" id="move-counter">00</span>
            </div>
        </div>
    </header>

    <div class="viewport-frame">
        <div class="viewport">
            <canvas id="grid-canvas"></canvas>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-module">
            <div class="key-stencil">ARROWS</div>
            <span class="action-label">Move / Push</span>
        </div>
        <div class="control-module">
            <div class="key-stencil">SPACE</div>
            <span class="action-label">Pull Lever</span>
        </div>
    </div>
</div>

<script>
/**
 * VISUAL ENGINE - REDESIGNED
 * Focus: Depth, Contrast, Hierarchy
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
const moveCounter = document.getElementById('move-counter');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;
let moveCount = 0;

// Game State
let gameState = {
    player: { x: 1, y: 3 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}
    ]
};

function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- RENDERING HELPERS ---

function getTile(x, y) {
    return { x: x * TILE_SIZE, y: y * TILE_SIZE };
}

function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

// --- DRAWING FUNCTIONS ---

function drawFloor() {
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            const {x: px, y: py} = getTile(x, y);
            
            // Base Floor - Dark Matte
            drawRect(px, py, TILE_SIZE, TILE_SIZE, '#12141a');
            
            // Grid Lines - Subtle but visible
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 0.5, py + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
        }
    }
}

function drawWalls() {
    gameState.walls.forEach(w => {
        const {x: px, y: py} = getTile(w.x, w.y);
        const pad = 2;
        
        // 1. Recessed Shadow (The "Hole")
        ctx.fillStyle = '#050608';
        ctx.fillRect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2);
        
        // 2. Wall Surface (Matte Dark Grey/Concrete)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, '#232730'); // Lighter edge
        grad.addColorStop(1, '#111318'); // Darker center
        
        ctx.fillStyle = grad;
        ctx.fillRect(px + pad + 4, py + pad + 4, TILE_SIZE - pad*2 - 8, TILE_SIZE - pad*2 - 8);

        // 3. Inner Bevel (Highlight top/left to show recess)
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.moveTo(px + pad, py + TILE_SIZE - pad);
        ctx.lineTo(px + pad, py + pad);
        ctx.lineTo(px + TILE_SIZE - pad, py + pad);
        ctx.stroke();
    });
}

function drawTarget() {
    const t = gameState.target;
    const {x: px, y: py} = getTile(t.x, t.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. High Contrast Glowing X
    ctx.save();
    
    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff9900';
    
    // X Shape
    ctx.strokeStyle = '#ff9900';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    // Outer X
    const off = 18;
    ctx.moveTo(cx - off, cy - off); ctx.lineTo(cx + off, cy + off);
    ctx.moveTo(cx + off, cy - off); ctx.lineTo(cx - off, cy + off);
    ctx.stroke();
    
    // Center Dot
    ctx.fillStyle = '#ff9900';
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

function drawDoor() {
    const d = gameState.door;
    const {x: px, y: py} = getTile(d.x, d.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    if (d.open) {
        // --- OPEN STATE (Portal) ---
        
        // Background Void
        ctx.fillStyle = '#000';
        ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
        
        // Portal Glow
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00f3ff';
        
        // Frame
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 4;
        ctx.strokeRect(px + 10, py + 10, TILE_SIZE - 20, TILE_SIZE - 20);
        
        // Inner Core
        ctx.fillStyle = 'rgba(0, 243, 255, 0.2)';
        ctx.fillRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);
        
        ctx.shadowBlur = 0;
    } else {
        // --- CLOSED STATE (Warning) ---
        
        // Floor Decal
        ctx.fillStyle = 'rgba(255, 50, 50, 0.05)';
        ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);

        // Frame
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 8, py + 8, TILE_SIZE - 16, TILE_SIZE - 16);
        
        // Lock Icon (Simple)
        ctx.fillStyle = '#ff3333';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff3333';
        ctx.beginPath();
        ctx.arc(cx, cy - 2, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(cx - 5, cy + 2, 10, 8);
        
        ctx.shadowBlur = 0;
    }
}

function drawLever() {
    const l = gameState.lever;
    const {x: px, y: py} = getTile(l.x, l.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. Base Plate (Dark Metal)
    ctx.fillStyle = '#1a1d24';
    ctx.fillRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);
    
    // Plate Detail
    ctx.strokeStyle = '#2d343f';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);

    // 2. Mechanical Arm
    const armColor = l.active ? '#ff3333' : '#5a6270';
    const glowColor = l.active ? 'rgba(255, 51, 51, 0.6)' : 'transparent';
    
    ctx.save();
    ctx.strokeStyle = armColor;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    
    // Shadow/Glow
    if(l.active) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = glowColor;
    }
    
    ctx.beginPath();
    ctx.moveTo(cx, cy + 16); // Pivot
    
    // Arm Angle (Active = Up/Left, Inactive = Down/Right)
    const angle = l.active ? -Math.PI/2.5 : Math.PI/2.5; 
    const len = 20;
    const endX = cx + Math.cos(angle) * len;
    const endY = cy + Math.sin(angle) * len;
    
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // 3. Handle Knob (Large)
    ctx.fillStyle = l.active ? '#fff' : '#718096';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(endX, endY, 8, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

function drawCrates() {
    gameState.crates.forEach(c => {
        const {x: px, y: py} = getTile(c.x, c.y);
        const pad = 6;
        
        // 1. Drop Shadow (Heavy)
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(px + pad + 5, py + pad + 5, TILE_SIZE - pad*2, TILE_SIZE - pad*2);

        // 2. Body (Lighter Metal - Distinct from Walls)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, '#5a6270'); // Lighter than walls
        grad.addColorStop(1, '#3a4150');
        drawRect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2, grad);

        // 3. Rim Highlight (Raised Effect)
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + pad, py + TILE_SIZE - pad);
        ctx.lineTo(px + pad, py + pad);
        ctx.lineTo(px + TILE_SIZE - pad, py + pad);
        ctx.stroke();

        // 4. Stamped Markings (Industrial)
        ctx.strokeStyle = '#1a1d24';
        ctx.lineWidth = 4;
        ctx.beginPath();
        // Diagonal Cross
        const off = 16;
        ctx.moveTo(px + pad + off, py + pad + off);
        ctx.lineTo(px + TILE_SIZE - pad - off, py + TILE_SIZE - pad - off);
        ctx.moveTo(px + TILE_SIZE - pad - off, py + pad + off);
        ctx.lineTo(px + pad + off, py + TILE_SIZE - pad - off);
        ctx.stroke();
        
        // Center Rivet
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 6, 0, Math.PI*2);
        ctx.fill();
    });
}

function drawPlayer() {
    const p = gameState.player;
    const {x: px, y: py} = getTile(p.x, p.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. Flux Aura (Strongest Glow)
    ctx.save();
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#00f3ff';

    // 2. Core Shape
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();

    // 3. Inner Flux Eye
    ctx.fillStyle = '#00f3ff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFloor();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Bounds
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Walls
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Door (Closed)
    if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) return;

    // Crates
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        // Check Crate Collision
        const blocked = 
            newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS ||
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY) ||
            (gameState.door.x === newCrateX && gameState.door.y === newCrateY);

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            
            moveCount++;
            moveCounter.innerText = moveCount.toString().padStart(2, '0');
            draw();
        }
    } else {
        gameState.player.x = newX;
        gameState.player.y = newY;
        
        moveCount++;
        moveCounter.innerText = moveCount.toString().padStart(2, '0');
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    
    // Adjacency Check
    if (Math.abs(p.x - l.x) + Math.abs(p.y - l.y) === 1) {
        l.active = !l.active;
        gameState.door.open = l.active;
        draw();
    }
}

window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
