<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX: GRID PROTOCOL</title>
<style>
    :root {
        /* Palette: Heavy Industrial / Flux Energy */
        --bg-base: #121418;
        --bg-panel: #1a1d24;
        
        --flux-core: #00f3ff;
        --flux-glow: rgba(0, 243, 255, 0.6);
        --hazard-orange: #ff9900;
        --hazard-glow: rgba(255, 153, 0, 0.5);
        
        --steel-light: #5a6270;
        --steel-mid: #2d343f;
        --steel-dark: #181c24;
        
        --text-main: #e0e6ed;
        --text-dim: #8b9bb4;
        
        /* Typography */
        --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-base);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Subtle texture for the room */
        background-image: radial-gradient(circle at 50% 50%, #1a1d24 0%, #0f1114 100%);
    }

    /* --- MAIN CONTAINER --- */
    .machine-case {
        position: relative;
        width: 100%;
        max-width: 800px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    /* --- HUD --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 0.5rem;
    }

    .title-group {
        display: flex;
        flex-direction: column;
    }

    h1 {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        text-transform: uppercase;
        line-height: 1;
    }
    
    .subtitle {
        font-size: 0.7rem;
        color: var(--flux-core);
        letter-spacing: 0.2em;
        font-weight: 600;
        margin-top: 4px;
        opacity: 0.8;
    }

    .hud-stats {
        display: flex;
        gap: 2rem;
        font-family: var(--font-stack);
        font-weight: 700;
        font-size: 1.2rem;
    }

    .stat-group {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .stat-label {
        font-size: 0.6rem;
        color: var(--text-dim);
        margin-bottom: 2px;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    .stat-val {
        color: var(--text-main);
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* --- THE BOARD (Viewport) --- */
    .viewport-frame {
        position: relative;
        background: #000;
        padding: 8px;
        border-radius: 4px;
        /* Heavy Metal Frame */
        background: linear-gradient(145deg, var(--steel-light), var(--steel-dark));
        box-shadow: 
            0 20px 50px rgba(0,0,0,0.8),
            inset 0 1px 0 rgba(255,255,255,0.2),
            inset 0 -1px 0 rgba(0,0,0,0.5);
        border: 1px solid #000;
    }

    .viewport {
        position: relative;
        background: #161920; /* Deep floor color */
        border: 2px solid #050608;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        overflow: hidden;
    }
    
    /* CRT/Scanline Overlay */
    .viewport::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 20;
        opacity: 0.4;
        box-shadow: inset 0 0 60px rgba(0,0,0,0.6); /* Vignette */
    }

    #grid-canvas {
        display: block;
        z-index: 10;
        cursor: crosshair;
    }

    /* --- CONTROLS LEGEND --- */
    .control-panel {
        display: flex;
        justify-content: center;
        gap: 3rem;
        margin-top: 0.5rem;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 1rem;
    }

    .control-module {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .key-stencil {
        background: #232730;
        color: var(--text-main);
        padding: 4px 8px;
        font-size: 0.7rem;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.1);
        font-weight: 600;
        box-shadow: 0 2px 0 rgba(0,0,0,0.6);
        min-width: 24px;
        text-align: center;
    }

    .action-label {
        font-size: 0.75rem;
        color: var(--text-dim);
        font-weight: 500;
        letter-spacing: 0.05em;
    }

</style>
</head>
<body>

<div class="machine-case">
    <header>
        <div class="title-group">
            <h1>Iron & Flux</h1>
            <span class="subtitle">Grid Protocol</span>
        </div>
        <div class="hud-stats">
            <div class="stat-group">
                <span class="stat-label">LEVEL</span>
                <span class="stat-val">01</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">MOVES</span>
                <span class="stat-val" id="move-counter">00</span>
            </div>
        </div>
    </header>

    <div class="viewport-frame">
        <div class="viewport">
            <canvas id="grid-canvas"></canvas>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-module">
            <div class="key-stencil">↑↓←→</div>
            <span class="action-label">Move / Push</span>
        </div>
        <div class="control-module">
            <div class="key-stencil">SPACE</div>
            <span class="action-label">Pull Lever</span>
        </div>
    </div>
</div>

<script>
/**
 * VISUAL ENGINE - REVISED
 * Focus: "Heavy Industrial" materials, 3D depth, Flux aesthetics.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');
const moveCounter = document.getElementById('move-counter');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;
let moveCount = 0;

// Game State
let gameState = {
    player: { x: 1, y: 3 },
    crates: [{ x: 3, y: 3 }, { x: 5, y: 2 }],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 },
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}
    ]
};

function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- RENDERING HELPERS ---

function getTile(x, y) {
    return { x: x * TILE_SIZE, y: y * TILE_SIZE };
}

function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

// --- DRAWING FUNCTIONS ---

function drawFloor() {
    for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
            const {x: px, y: py} = getTile(x, y);
            
            // Base Floor
            drawRect(px, py, TILE_SIZE, TILE_SIZE, '#161920');
            
            // Subtle Grid Lines (Low Contrast)
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 0.5, py + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
        }
    }
}

function drawWalls() {
    gameState.walls.forEach(w => {
        const {x: px, y: py} = getTile(w.x, w.y);
        const pad = 2;
        
        // 1. Main Body (Metallic Gradient)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, '#4a5568'); // Light
        grad.addColorStop(0.5, '#2d3748'); // Mid
        grad.addColorStop(1, '#1a202c'); // Dark
        
        // 2. Shadow/Depth (3D Block effect)
        ctx.fillStyle = '#050608';
        ctx.fillRect(px + pad, py + pad + 8, TILE_SIZE - pad*2, TILE_SIZE - pad*2); // Shadow extrusion
        
        // 3. Top Surface
        ctx.fillStyle = grad;
        ctx.fillRect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2);

        // 4. Bevel Highlights (Top & Left)
        ctx.lineWidth = 2;
        
        // Top Edge
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(px + pad, py + TILE_SIZE - pad);
        ctx.lineTo(px + pad, py + pad);
        ctx.lineTo(px + TILE_SIZE - pad, py + pad);
        ctx.stroke();

        // 5. Industrial Rivets
        ctx.fillStyle = '#111';
        const rSize = 2.5;
        const offset = 12;
        // Rivets with slight highlights
        const drawRivet = (rx, ry) => {
            ctx.beginPath(); ctx.arc(rx, ry, rSize, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.arc(rx-0.5, ry-0.5, 1, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#111'; // Reset
        };

        drawRivet(px + offset, py + offset);
        drawRivet(px + TILE_SIZE - offset, py + offset);
        drawRivet(px + offset, py + TILE_SIZE - offset);
        drawRivet(px + TILE_SIZE - offset, py + TILE_SIZE - offset);
    });
}

function drawTarget() {
    const t = gameState.target;
    const {x: px, y: py} = getTile(t.x, t.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;
    const pad = 16;

    // 1. Floor Decal Base
    ctx.fillStyle = 'rgba(255, 153, 0, 0.1)';
    ctx.beginPath();
    ctx.rect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2);
    ctx.fill();

    // 2. Hazard Stripes
    ctx.save();
    ctx.beginPath();
    ctx.rect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2);
    ctx.clip();
    
    ctx.strokeStyle = 'rgba(255, 153, 0, 0.7)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    // Angled Stripes
    for (let i = -TILE_SIZE; i < TILE_SIZE * 2; i += 12) {
        ctx.moveTo(px + i, py);
        ctx.lineTo(px + i - TILE_SIZE, py + TILE_SIZE);
    }
    ctx.stroke();
    ctx.restore();

    // 3. Outer Ring
    ctx.strokeStyle = '#ff9900';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2);
    
    // 4. Inner Crosshair
    ctx.strokeStyle = 'rgba(255, 153, 0, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
    ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
    ctx.stroke();
}

function drawDoor() {
    const d = gameState.door;
    const {x: px, y: py} = getTile(d.x, d.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. Floor Decal (Warning)
    ctx.fillStyle = 'rgba(255, 50, 50, 0.1)';
    ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);

    if (d.open) {
        // --- OPEN STATE (Portal) ---
        
        // Glow
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#00f3ff';
        
        // Portal Background
        ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
        ctx.fillRect(px + 6, py + 6, TILE_SIZE - 12, TILE_SIZE - 12);
        
        // Frame
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 4;
        ctx.strokeRect(px + 10, py + 10, TILE_SIZE - 20, TILE_SIZE - 20);
        
        // Core Energy
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI*2);
        ctx.fill();
        
        ctx.shadowBlur = 0; // Reset
    } else {
        // --- CLOSED STATE (Heavy Gate) ---
        
        // Gate Surface
        const grad = ctx.createLinearGradient(px, py, px, py + TILE_SIZE);
        grad.addColorStop(0, '#2d343f');
        grad.addColorStop(1, '#1a1d24');
        
        ctx.fillStyle = grad;
        ctx.fillRect(px + 6, py + 6, TILE_SIZE - 12, TILE_SIZE - 12);
        
        // Gate Frame (Bevel)
        ctx.strokeStyle = '#4a5568';
        ctx.lineWidth = 3;
        ctx.strokeRect(px + 6, py + 6, TILE_SIZE - 12, TILE_SIZE - 12);
        
        // Lock Mechanism (Heavy Iron)
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI*2);
        ctx.fill();
        
        // Lock Pin
        ctx.fillStyle = '#ff9900';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawLever() {
    const l = gameState.lever;
    const {x: px, y: py} = getTile(l.x, l.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. Base Plate (Industrial Grey)
    ctx.fillStyle = '#1a1d24';
    ctx.fillRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);
    
    // Plate Border
    ctx.strokeStyle = '#2d343f';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);

    // 2. Mechanical Arm
    const armColor = l.active ? '#ff9900' : '#5a6270';
    const glowColor = l.active ? 'rgba(255, 153, 0, 0.6)' : 'transparent';
    
    ctx.strokeStyle = armColor;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    
    // Shadow for depth
    ctx.shadowBlur = l.active ? 15 : 5;
    ctx.shadowColor = glowColor;
    
    ctx.beginPath();
    ctx.moveTo(cx, cy + 12); // Pivot point
    
    // Arm Angle
    const angle = l.active ? -Math.PI/3 : Math.PI/3 + Math.PI/2; 
    const endX = cx + Math.cos(angle) * 18;
    const endY = cy + Math.sin(angle) * 18;
    
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // 3. Handle Knob
    ctx.fillStyle = l.active ? '#fff' : '#718096';
    ctx.shadowBlur = 0; // Reset shadow for knob
    ctx.beginPath();
    ctx.arc(endX, endY, 6, 0, Math.PI*2);
    ctx.fill();
    
    // Knob Detail
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(endX, endY, 2, 0, Math.PI*2);
    ctx.fill();
}

function drawCrates() {
    gameState.crates.forEach(c => {
        const {x: px, y: py} = getTile(c.x, c.y);
        const pad = 6;
        
        // 1. Drop Shadow (Heavy Weight)
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(px + pad + 4, py + pad + 4, TILE_SIZE - pad*2, TILE_SIZE - pad*2);

        // 2. Body (Rusted Metal / Cargo)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, '#4a5568');
        grad.addColorStop(1, '#2d3748');
        drawRect(px + pad, py + pad, TILE_SIZE - pad*2, TILE_SIZE - pad*2, grad);

        // 3. Bevel Highlight (Top/Left)
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + pad, py + TILE_SIZE - pad);
        ctx.lineTo(px + pad, py + pad);
        ctx.lineTo(px + TILE_SIZE - pad, py + pad);
        ctx.stroke();

        // 4. Rivets
        ctx.fillStyle = '#000';
        const rSize = 3;
        const off = 12;
        ctx.beginPath(); ctx.arc(px + pad + off, py + pad + off, rSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - off, py + pad + off, rSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + pad + off, py + TILE_SIZE - pad - off, rSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - off, py + TILE_SIZE - pad - off, rSize, 0, Math.PI*2); ctx.fill();

        // 5. Hazard Markings (Center)
        ctx.strokeStyle = '#1a202c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(px + pad + 15, py + pad + 15);
        ctx.lineTo(px + TILE_SIZE - pad - 15, py + TILE_SIZE - pad - 15);
        ctx.stroke();
        
        ctx.strokeStyle = '#1a202c';
        ctx.beginPath();
        ctx.moveTo(px + TILE_SIZE - pad - 15, py + pad + 15);
        ctx.lineTo(px + pad + 15, py + TILE_SIZE - pad - 15);
        ctx.stroke();
    });
}

function drawPlayer() {
    const p = gameState.player;
    const {x: px, y: py} = getTile(p.x, p.y);
    const cx = px + TILE_SIZE/2;
    const cy = py + TILE_SIZE/2;

    // 1. Flux Glow (Aura)
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00f3ff';

    // 2. Core Shape (Circle - Geometric)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI*2);
    ctx.fill();

    // 3. Inner Flux Core
    ctx.fillStyle = '#00f3ff';
    ctx.shadowBlur = 10; // Slight inner glow
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = 0; // Reset
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFloor();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- LOGIC ---

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Bounds
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Walls
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Door (Closed)
    if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) return;

    // Crates
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        // Check Crate Collision
        const blocked = 
            newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS ||
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY) ||
            (gameState.door.x === newCrateX && gameState.door.y === newCrateY);

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            
            moveCount++;
            moveCounter.innerText = moveCount.toString().padStart(2, '0');
            draw();
        }
    } else {
        gameState.player.x = newX;
        gameState.player.y = newY;
        
        moveCount++;
        moveCounter.innerText = moveCount.toString().padStart(2, '0');
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    
    // Adjacency Check
    if (Math.abs(p.x - l.x) + Math.abs(p.y - l.y) === 1) {
        l.active = !l.active;
        gameState.door.open = l.active;
        draw();
    }
}

window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

init();
</script>
</body>
</html>
