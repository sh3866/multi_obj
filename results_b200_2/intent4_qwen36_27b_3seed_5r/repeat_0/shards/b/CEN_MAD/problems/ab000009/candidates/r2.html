<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grandmaster Chess</title>
<style>
  :root {
    /* Palette - Grandmaster Theme */
    --bg-color: #18181b; /* Deep Zinc 900 */
    --panel-bg: #27272a; /* Zinc 800 */
    --board-dark: #4b5320; /* Rich Olive/Espresso */
    --board-light: #e8dcc5; /* Warm Cream */
    --highlight: rgba(255, 255, 0, 0.35);
    --text-primary: #f4f4f5; /* Zinc 100 */
    --text-secondary: #a1a1aa; /* Zinc 400 */
    --accent: #ffffff;
    
    /* Typography */
    --font-serif: "Playfair Display", "Georgia", "Times New Roman", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-sans);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    display: flex;
    gap: 40px;
    padding: 40px;
    max-width: 1400px;
    width: 100%;
    height: 95vh;
    align-items: center;
  }

  /* --- Board Area --- */
  .board-wrapper {
    position: relative;
    /* Elegant border for the board area */
    background: #111;
    padding: 12px;
    border-radius: 4px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    flex-shrink: 0;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 640px;
    height: 640px;
    user-select: none;
    position: relative;
  }

  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Palette Update: Grandmaster Contrast */
  .square.light { background-color: var(--board-light); }
  .square.dark { background-color: var(--board-dark); }
  
  .square.last-move { 
    background-color: var(--highlight) !important;
  }

  /* Coordinates Styling */
  .coordinates {
    position: absolute;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    pointer-events: none;
    z-index: 10;
    display: flex;
  }
  
  /* Bottom File Labels (a-h) */
  .file-labels {
    bottom: -22px;
    left: 12px;
    width: 640px;
    display: flex;
    justify-content: space-around;
    color: var(--text-secondary);
  }
  
  /* Left Rank Labels (1-8) */
  .rank-labels {
    left: -22px;
    top: 12px;
    height: 640px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    color: var(--text-secondary);
  }

  /* --- Pieces (SVG Styling) --- */
  .piece {
    width: 85%;
    height: 85%;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    z-index: 2;
  }
  
  .piece:hover {
    transform: scale(1.1) translateY(-2px);
  }

  .piece svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  
  /* White Pieces: Solid White + Dark Stroke */
  .piece.white svg {
    filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.4)); 
  }
  .piece.white svg path, .piece.white svg circle { 
    fill: #ffffff; 
    stroke: #333; 
    stroke-width: 1.5px; 
    stroke-linejoin: round; 
  }

  /* Black Pieces: Solid Charcoal + Darker Stroke */
  .piece.black svg {
    filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5));
  }
  .piece.black svg path, .piece.black svg circle { 
    fill: #222222; 
    stroke: #000000; 
    stroke-width: 1.5px; 
    stroke-linejoin: round; 
  }

  /* --- Side Panel --- */
  .sidebar {
    flex: 1;
    background: var(--panel-bg);
    border-radius: 8px;
    padding: 30px;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .header {
    margin-bottom: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 20px;
  }

  /* Typography: Serif Header */
  h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    margin-bottom: 20px;
  }

  /* Status: Distinct Pill Shape */
  .status-pill {
    display: inline-flex;
    align-items: center;
    background: rgba(0,0,0,0.2);
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.5px;
  }

  .turn-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #000;
    margin-right: 10px;
    box-shadow: 0 0 8px rgba(255,255,255,0.4);
    transition: all 0.3s ease;
  }
  .turn-indicator.black-turn { 
    background: #222; 
    border-color: #fff;
    box-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  /* Move History: Structured Table */
  .move-history {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 25px;
    background: rgba(0,0,0,0.15);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Table Header */
  .history-header {
    display: flex;
    padding: 10px 15px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    font-weight: 700;
    position: sticky;
    top: 0;
  }

  .history-body {
    padding: 0;
  }

  .move-row {
    display: flex;
    padding: 8px 15px;
    font-family: var(--font-mono);
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.02);
    color: var(--text-secondary);
  }
  
  .move-row:nth-child(even) { background: rgba(255,255,255,0.02); }
  .move-row:last-child { color: var(--text-primary); font-weight: 700; }
  
  .move-num { 
    width: 35px; 
    color: #666; 
    font-size: 12px;
  }
  .move-ply { 
    flex: 1; 
    cursor: pointer; 
    transition: color 0.2s;
  }
  .move-ply:hover { color: var(--accent); }

  /* Controls: Grouped */
  .controls-wrapper {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .controls-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary);
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  button:hover {
    background: rgba(255,255,255,0.05);
    border-color: var(--text-secondary);
    color: var(--text-primary);
  }
  
  button.primary {
    background: var(--text-primary);
    color: var(--bg-color);
    border: 1px solid var(--text-primary);
    font-weight: 700;
  }
  
  button.primary:hover {
    background: #fff;
    border-color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,255,255,0.1);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #666; }

  @media (max-width: 1000px) {
    .container { flex-direction: column; height: auto; overflow-y: auto; padding: 20px; }
    .board { width: 100%; height: auto; aspect-ratio: 1/1; }
    .sidebar { width: 100%; min-height: 300px; }
    .file-labels { width: 100%; }
    .rank-labels { height: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="board-wrapper">
    <div class="coordinates rank-labels" id="rank-labels"></div>
    <div class="board" id="board"></div>
    <div class="coordinates file-labels" id="file-labels"></div>
  </div>

  <div class="sidebar">
    <div class="header">
      <h1>Grandmaster</h1>
      <div class="status-pill">
        <div class="turn-indicator" id="turn-dot"></div>
        <span id="status-text">White to move</span>
      </div>
    </div>

    <div class="move-history">
      <div class="history-header">
        <div class="move-num">#</div>
        <div class="move-ply">White</div>
        <div class="move-ply">Black</div>
      </div>
      <div class="history-body" id="move-list">
        <!-- Moves injected via JS -->
        <div class="move-row" style="justify-content: center; opacity: 0.5; font-style: italic; font-family: sans-serif;">
          Waiting for moves...
        </div>
      </div>
    </div>

    <div class="controls-wrapper">
      <button class="primary">Analyze Position</button>
      <div class="controls-group">
        <button onclick="resetGame()">New Game</button>
        <button onclick="alert('Flip feature disabled in demo')">Flip Board</button>
      </div>
    </div>
  </div>
</div>

  // --- Game State ---
  // Standard orientation: White at bottom (index 7,6), Black at top (index 0,1)
  let boardState = [
    ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'], // Row 0 (Top - Black)
    ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'], // Row 6
    ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']  // Row 7 (Bottom - White)
  ];

  let turn = 'w';
  let moveCount = 1;
  const moveList = document.getElementById('move-list');
  const statusText = document.getElementById('status-text');
  const turnDot = document.getElementById('turn-dot');

  // --- Initialization ---
  function initBoard() {
    const boardEl = document.getElementById('board');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    
    // Render Board Grid
    boardEl.innerHTML = '';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = document.createElement('div');
        // Light/Dark Logic: (0,0) is Dark (a8)
        square.className = `square ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
        square.dataset.r = r;
        square.dataset.c = c;
        
        const pieceCode = boardState[r][c];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieces[color][type];
          
          // Simple Click Interaction
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handlePieceClick(r, c, color, type);
          };
          
          square.appendChild(pieceEl);
        }
        
        square.onclick = () => {
           // Click on empty square logic could go here
        };
        
        boardEl.appendChild(square);
      }
    }

    // Render Coordinates
    const fileLabels = document.getElementById('file-labels');
    const rankLabels = document.getElementById('rank-labels');
    fileLabels.innerHTML = '';
    rankLabels.innerHTML = '';
    
    // Files (a-h)
    files.forEach(f => {
      const span = document.createElement('span');
      span.innerText = f;
      fileLabels.appendChild(span);
    });
    
    // Ranks (8 at top -> 1 at bottom)
    for(let i=8; i>0; i--) {
      const span = document.createElement('span');
      span.innerText = i;
      rankLabels.appendChild(span);
    }
  }

  // --- Logic ---
  function handlePieceClick(r, c, color, type) {
    if (color !== (turn === 'w' ? 'w' : 'b')) return; // Not your turn

    // Visual Feedback: Highlight clicked piece
    const squares = document.querySelectorAll('.square');
    squares.forEach(sq => sq.classList.remove('last-move'));
    const currentSq = squares[r * 8 + c];
    currentSq.classList.add('last-move');

    // Simulate a move for visual effect (random valid-ish move)
    let tr = r + (Math.random() > 0.5 ? 1 : -1);
    let tc = c + (Math.random() > 0.5 ? 1 : -1);
    
    // Bounds check
    if (tr < 0 || tr > 7 || tc < 0 || tc > 7) return;

    // Update State
    const targetCode = boardState[tr][tc];
    boardState[tr][tc] = boardState[r][c];
    boardState[r][c] = '';
    
    // Generate notation (Simplified)
    const pieceName = type === 'p' ? '' : type.toUpperCase();
    const capture = targetCode ? 'x' : '';
    const notation = `${pieceName}${capture}${String.fromCharCode(97+tc)}${8-tr}`;
    
    addMoveToHistory(notation);
    
    // Switch Turn
    turn = turn === 'w' ? 'b' : 'w';
    updateStatus();
    initBoard(); // Re-render
  }

  function addMoveToHistory(notation) {
    // Clear "Waiting" placeholder if it exists
    if (moveList.innerText.includes('Waiting')) {
      moveList.innerHTML = '';
    }

    if (turn === 'b') {
      // White just moved
      const row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = `
        <div class="move-num">${moveCount}.</div>
        <div class="move-ply">${notation}</div>
        <div class="move-ply" id="last-black"></div>
      `;
      moveList.appendChild(row);
    } else {
      // Black just moved
      const lastRow = moveList.lastElementChild;
      if (lastRow) {
        lastRow.querySelector('#last-black').innerText = notation;
        moveCount++;
      }
    }
    moveList.scrollTop = moveList.scrollHeight;
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  function resetGame() {
    location.reload();
  }

  // Start
  initBoard();

</script>
