<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            /* Palette: Retro Synthwave */
            --c-deep-purple: #240046;
            --c-neon-purple: #7b2cbf;
            --c-hot-pink: #f72585;
            --c-sun-top: #ff9e00;
            --c-sun-bot: #ff0054;
            --c-cyan: #00f3ff;
            --c-grid: rgba(255, 0, 255, 0.4);
            --c-white: #ffffff;
            
            /* Pixel Scale */
            --px: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            /* 1. Atmosphere: Retro-futuristic gradient background */
            background: linear-gradient(to bottom, var(--c-deep-purple) 0%, #10002b 60%, var(--c-neon-purple) 100%);
            color: var(--c-white);
            /* 5. Typography: Fallback to crisp monospace if system pixel font exists */
            font-family: "Press Start 2P", "Courier New", monospace; 
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- ATMOSPHERE & BACKGROUND --- */

        /* CRT Scanlines & Vignette */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            background-size: 100% 4px, 100% 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        /* 1. Retro Sun */
        .sun-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            height: 360px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Clip the bottom of the sun */
            clip-path: polygon(0 0, 100% 0, 100% 75%, 0 75%);
        }

        .sun-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--c-sun-top), var(--c-sun-bot));
            border-radius: 50%;
            box-shadow: 0 0 40px var(--c-hot-pink);
            position: relative;
            overflow: hidden;
        }

        /* Sun Cutouts (Horizontal Stripes) */
        .sun-strip {
            position: absolute;
            left: 0;
            width: 100%;
            background: var(--c-deep-purple); /* Matches top BG */
        }
        /* Generate strips manually for pixel precision */
        .sun-strip:nth-child(1) { bottom: 60%; height: 6px; }
        .sun-strip:nth-child(2) { bottom: 50%; height: 10px; }
        .sun-strip:nth-child(3) { bottom: 38%; height: 16px; }
        .sun-strip:nth-child(4) { bottom: 24%; height: 24px; }

        /* 1. Glowing Horizon Line */
        .horizon-glow {
            position: absolute;
            top: 42%; /* Aligns with bottom of sun */
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--c-hot-pink);
            box-shadow: 0 0 20px 5px var(--c-hot-pink), 0 0 60px var(--c-sun-top);
            z-index: 2;
        }

        /* --- SCENE LAYOUT --- */

        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            perspective: 800px;
            overflow: hidden;
        }

        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 42%; /* Stars only in sky */
            z-index: 0;
        }

        /* Floor Grid */
        .floor {
            position: absolute;
            top: 42%; /* Starts at horizon */
            left: -50%;
            width: 200%;
            height: 60%;
            background: 
                linear-gradient(to top, rgba(36, 0, 70, 0.9) 0%, transparent 100%),
                repeating-linear-gradient(90deg, var(--c-grid) 0px, var(--c-grid) 2px, transparent 2px, transparent 80px),
                repeating-linear-gradient(0deg, var(--c-grid) 0px, var(--c-grid) 2px, transparent 2px, transparent 80px);
            background-size: 100% 100%, 80px 80px, 80px 80px;
            transform: rotateX(75deg);
            transform-origin: top center;
            opacity: 0.6;
            animation: gridScroll 1s linear infinite;
            z-index: 3;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 80px; }
        }

        /* --- UI & HIGHWAY --- */

        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            padding-top: 10%;
        }

        /* 5. Typography: Pixel Title */
        .title-container {
            z-index: 20;
            text-align: center;
            margin-bottom: 40px;
            /* Floating animation */
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 4rem;
            line-height: 1.1;
            text-transform: uppercase;
            color: var(--c-white);
            /* Hard Drop Shadow (No blur) */
            text-shadow: 
                6px 6px 0px var(--c-hot-pink),
                10px 10px 0px rgba(0,0,0,0.5);
            letter-spacing: -2px;
            /* Slight skew for speed */
            transform: skewX(-5deg);
        }

        h1 span {
            color: var(--c-cyan);
            text-shadow: 
                6px 6px 0px var(--c-neon-purple),
                10px 10px 0px rgba(0,0,0,0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 2. Highway Geometry: Correct Perspective */
        .highway-wrapper {
            position: relative;
            width: 300px;
            height: 350px;
            z-index: 15;
            display: flex;
            justify-content: center;
        }

        /* The Highway Container */
        .highway {
            width: 100%;
            height: 100%;
            /* Dark semi-transparent background */
            background: rgba(0, 0, 0, 0.7);
            /* Taper effect: Top is narrower than bottom */
            clip-path: polygon(25% 0, 75% 0, 100% 100%, 0% 100%);
            /* Border simulation using SVG overlay or pseudo elements is better for clip-path, 
               but we'll use a solid background with a container border for the "Pixel" look */
            position: relative;
            overflow: hidden;
        }

        /* Lane Dividers */
        .highway::before, .highway::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 4px;
            background: var(--c-hot-pink);
            z-index: 5;
            box-shadow: 0 0 10px var(--c-hot-pink);
        }
        .highway::before { left: 0; }
        .highway::after { right: 0; }

        /* Inner Lane Grid */
        .lane-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            /* Dividers */
            border-left: 2px dashed rgba(0, 243, 255, 0.3);
            border-right: 2px dashed rgba(0, 243, 255, 0.3);
            background-image: linear-gradient(90deg, transparent 49%, rgba(0, 243, 255, 0.3) 49%, rgba(0, 243, 255, 0.3) 51%, transparent 51%);
        }

        /* 3. Hit Line: High Contrast */
        .hit-line {
            position: absolute;
            bottom: 30px;
            left: -10%;
            width: 120%; /* Extend slightly past edges for style */
            height: 6px;
            background: var(--c-white);
            z-index: 20;
            /* Heavy Glow */
            box-shadow: 
                0 0 10px var(--c-white),
                0 0 20px var(--c-cyan),
                0 0 40px var(--c-cyan);
            border-radius: 2px;
        }

        /* Notes */
        .note {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 24px;
            background: var(--c-cyan);
            border: 2px solid var(--c-white);
            /* Pixelated shape */
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            animation: fall linear infinite;
        }
        
        /* Color variation for notes */
        .note:nth-child(odd) { background: var(--c-hot-pink); }

        /* Animation for falling notes */
        @keyframes fall {
            0% { top: -20px; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            100% { top: 110%; opacity: 1; transform: scale(1.2); }
        }

        /* Note timing */
        .note:nth-child(1) { animation-duration: 1.2s; animation-delay: 0.1s; }
        .note:nth-child(2) { animation-duration: 1.4s; animation-delay: 0.5s; }
        .note:nth-child(3) { animation-duration: 1.1s; animation-delay: 0.8s; }
        .note:nth-child(4) { animation-duration: 1.5s; animation-delay: 0.2s; }

        /* 4. START Button: Elevated CTA */
        .btn-container {
            position: absolute;
            /* Overlap the bottom of the highway */
            top: 68%; 
            width: 300px;
            z-index: 30;
        }

        .btn-start {
            width: 100%;
            height: 80px;
            background-color: var(--c-hot-pink);
            color: var(--c-white);
            font-family: inherit;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            position: relative;
            outline: none;
            
            /* Angled Edges (Chamfered) */
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            
            /* Neon Glow */
            box-shadow: 0 0 20px var(--c-hot-pink);
            
            /* Animation */
            animation: btnPulse 1.5s infinite alternate ease-in-out;
            transition: filter 0.2s;
        }

        .btn-start:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 15px var(--c-hot-pink); }
            100% { box-shadow: 0 0 35px var(--c-hot-pink), 0 0 10px var(--c-white); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .sun-container { width: 240px; height: 240px; }
            .highway-wrapper { width: 240px; }
            .btn-container { width: 240px; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlay -->
    <div class="crt-overlay"></div>

    <!-- Background Environment -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        
        <!-- 1. Retro Sun -->
        <div class="sun-container">
            <div class="sun-circle">
                <div class="sun-strip"></div>
                <div class="sun-strip"></div>
                <div class="sun-strip"></div>
                <div class="sun-strip"></div>
            </div>
        </div>
        
        <!-- 1. Horizon Line -->
        <div class="horizon-glow"></div>

        <!-- Grid Floor -->
        <div class="floor"></div>
    </div>

    <!-- UI Content -->
    <div class="ui-layer">
        
        <div class="title-container">
            <h1>PIXEL<br><span>DANCE</span></h1>
        </div>

        <!-- 2. Highway Perspective -->
        <div class="highway-wrapper">
            <div class="highway">
                <div class="lane-grid"></div>
                
                <!-- Notes -->
                <div class="note"></div>
                <div class="note"></div>
                <div class="note"></div>
                <div class="note"></div>
                
                <!-- 3. Hit Line -->
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- 4. Start Button -->
        <div class="btn-container">
            <button class="btn-start" id="startBtn">START</button>
        </div>

    </div>

    <script>
        /**
         * Starfield Renderer
         * Draws pixelated stars moving towards the viewer
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 80;
        
        // Disable smoothing for pixel look
        ctx.imageSmoothingEnabled = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight * 0.42; // Only render in sky area
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 1.5; 
                this.y = initial ? Math.random() * height : -10; 
                this.z = Math.random() * 2 + 0.5; // Speed
                this.size = Math.random() > 0.9 ? 3 : 1; // Pixel size
                
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 0.8; 
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw square pixels
                ctx.fillRect(
                    Math.round(width/2 + this.x), 
                    Math.round(this.y), 
                    this.size, 
                    this.size
                );
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Glitch Interaction
         * Adds a jitter effect to the title on button hover
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        let glitchInterval;

        btn.addEventListener('mouseenter', () => {
            glitchInterval = setInterval(() => {
                const rX = Math.random() * 10 - 5;
                const rY = Math.random() * 6 - 3;
                title.style.transform = `skewX(-5deg) translate(${rX}px, ${rY}px)`;
                // Randomize shadow color slightly
                const pink = Math.random() > 0.5 ? '#f72585' : '#ff0054';
                title.style.textShadow = `
                    ${6 + rX}px 6px 0px ${pink},
                    ${10 + rX}px 10px 0px rgba(0,0,0,0.5)
                `;
            }, 50);
        });

        btn.addEventListener('mouseleave', () => {
            clearInterval(glitchInterval);
            title.style.transform = `skewX(-5deg) translate(0, 0)`;
            title.style.textShadow = `
                6px 6px 0px var(--c-hot-pink),
                10px 10px 0px rgba(0,0,0,0.5)
            `;
        });
    </script>
</body>
</html>
