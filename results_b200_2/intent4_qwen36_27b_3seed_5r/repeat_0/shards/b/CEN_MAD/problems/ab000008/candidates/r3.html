<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            /* Palette: Synthwave Neon */
            --c-bg: #08001a;
            --c-grid: rgba(255, 0, 255, 0.3);
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-white: #ffffff;
            --c-black: #000000;
            
            /* Scale */
            --pixel: 4px;
            --glow-cyan: 0 0 10px var(--c-cyan), 0 0 20px var(--c-cyan);
            --glow-magenta: 0 0 10px var(--c-magenta), 0 0 20px var(--c-magenta);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Disable anti-aliasing for fonts */
        }

        body {
            background-color: var(--c-bg);
            color: var(--c-white);
            /* System Monospace stack for strict pixel look without external fonts */
            font-family: 'Courier New', 'Lucida Console', 'Andale Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- ATMOSPHERE & OVERLAYS --- */
        
        /* CRT Scanlines & Vignette */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1000;
            /* Scanlines */
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            /* Vignette */
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            /* Subtle flicker */
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            100% { opacity: 0.97; }
        }

        /* --- SCENE & BACKGROUND --- */

        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        /* Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* Retro Sun */
        .sun {
            position: absolute;
            top: 25%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--c-yellow), var(--c-magenta));
            z-index: 2;
            box-shadow: 0 0 40px var(--c-magenta);
            /* Masking to create horizontal stripes */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 42%,
                black 42%, black 50%,
                transparent 50%, transparent 53%,
                black 53%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 42%,
                black 42%, black 50%,
                transparent 50%, transparent 53%,
                black 53%, black 60%,
                transparent 60%, transparent 64%,
                black 64%, black 100%
            );
        }

        /* Floor Grid */
        .floor {
            position: absolute;
            bottom: -20%; /* Extend below screen */
            left: -50%;
            width: 200%;
            height: 60%;
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 100%), /* Fade to horizon */
                repeating-linear-gradient(90deg, var(--c-grid) 0px, var(--c-grid) 2px, transparent 2px, transparent 80px),
                repeating-linear-gradient(0deg, var(--c-grid) 0px, var(--c-grid) 2px, transparent 2px, transparent 80px);
            background-size: 100% 100%, 80px 80px, 80px 80px;
            transform: rotateX(60deg); /* Flattened perspective */
            transform-origin: top center;
            animation: gridScroll 1s linear infinite;
            z-index: 3;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 80px; }
        }

        /* --- MAIN UI LAYER --- */

        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Title Block */
        .title-container {
            margin-bottom: 60px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 4rem;
            line-height: 1;
            text-transform: uppercase;
            color: var(--c-white);
            font-weight: 900;
            letter-spacing: -2px;
            position: relative;
            display: inline-block;
            
            /* CRITIQUE: Hard blocky RGB split, no blur */
            text-shadow: 
                4px 0px 0px var(--c-cyan), 
                -4px 0px 0px var(--c-magenta);
            
            animation: titleBob 4s steps(12) infinite;
        }

        h1 span {
            display: block;
            font-size: 5rem;
            color: var(--c-white);
            /* Inverted split for second word */
            text-shadow: 
                -4px 0px 0px var(--c-cyan), 
                4px 0px 0px var(--c-magenta);
        }

        @keyframes titleBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* --- THE HIGHWAY --- */
        
        .highway-wrapper {
            position: relative;
            width: 320px;
            height: 380px;
            perspective: 800px;
            margin-bottom: 40px;
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            /* CRITIQUE: Flatter angle, glowing borders */
            transform: rotateX(15deg); 
            transform-origin: top center;
            border: 4px solid var(--c-cyan);
            box-shadow: var(--glow-cyan);
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* Lanes */
        .lane {
            flex: 1;
            position: relative;
            /* CRITIQUE: Solid glowing dividers */
            border-right: 2px solid rgba(0, 243, 255, 0.4);
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 30px;
            left: -5px;
            right: -5px;
            height: 6px;
            background: var(--c-white);
            z-index: 5;
            /* CRITIQUE: Distinct glowing bar */
            box-shadow: 0 0 8px var(--c-white), 0 0 15px var(--c-magenta);
            border-radius: 2px;
        }

        /* Notes */
        .note {
            position: absolute;
            left: 10%;
            width: 80%;
            height: 24px;
            border: 2px solid var(--c-white);
            box-shadow: 0 0 8px currentColor;
            animation: fall linear infinite;
        }

        /* Note Colors & Timing */
        .lane:nth-child(1) .note { 
            background: var(--c-magenta); 
            color: var(--c-magenta);
            animation-duration: 1.4s; 
            animation-delay: 0s; 
        }
        .lane:nth-child(2) .note { 
            background: var(--c-cyan); 
            color: var(--c-cyan);
            animation-duration: 1.7s; 
            animation-delay: 0.5s; 
        }
        .lane:nth-child(3) .note { 
            background: var(--c-cyan); 
            color: var(--c-cyan);
            animation-duration: 1.5s; 
            animation-delay: 0.2s; 
        }
        .lane:nth-child(4) .note { 
            background: var(--c-magenta); 
            color: var(--c-magenta);
            animation-duration: 1.8s; 
            animation-delay: 0.8s; 
        }

        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 100%; opacity: 1; }
        }

        /* --- START BUTTON --- */

        .btn-container {
            position: relative;
            z-index: 20;
            width: 280px;
            /* CRITIQUE: Elevated slightly above bottom edge */
            margin-top: 20px;
        }

        .btn-start {
            width: 100%;
            height: 64px;
            background-color: var(--c-bg);
            color: var(--c-white);
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            position: relative;
            outline: none;

            /* CRITIQUE: Thick aliased pixel border, no vector blur */
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.8), /* Highlight */
                inset -4px -4px 0px rgba(0,0,0,0.6),    /* Inner Shadow */
                0px 0px 0px 4px var(--c-cyan),          /* Inner Border */
                0px 0px 0px 8px var(--c-black),         /* Outer Border */
                0px 0px 20px var(--c-cyan);             /* Bloom/Glow */

            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-start:hover {
            background-color: var(--c-magenta);
            color: var(--c-white);
            transform: translateY(-2px);
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.8),
                inset -4px -4px 0px rgba(0,0,0,0.2),
                0px 0px 0px 4px var(--c-yellow),
                0px 0px 0px 8px var(--c-black),
                0px 0px 30px var(--c-magenta);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.6),
                inset -4px -4px 0px rgba(255,255,255,0.2),
                0px 0px 0px 4px var(--c-cyan),
                0px 0px 0px 8px var(--c-black),
                0px 0px 10px var(--c-cyan);
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            h1 span { font-size: 3rem; }
            .highway-wrapper { width: 280px; height: 320px; }
            .sun { width: 200px; height: 200px; }
        }

    </style>
</head>
<body>

    <!-- CRT & Scanlines Overlay -->
    <div class="crt-overlay"></div>

    <!-- Background Environment -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="floor"></div>
    </div>

    <!-- UI Content -->
    <div class="ui-layer">
        
        <div class="title-container">
            <h1>PIXEL<br><span>DANCE</span></h1>
        </div>

        <div class="highway-wrapper">
            <div class="highway">
                <!-- Lane 1 -->
                <div class="lane">
                    <div class="note"></div>
                </div>
                <!-- Lane 2 -->
                <div class="lane">
                    <div class="note"></div>
                </div>
                <!-- Lane 3 -->
                <div class="lane">
                    <div class="note"></div>
                </div>
                <!-- Lane 4 -->
                <div class="lane">
                    <div class="note"></div>
                </div>
                
                <!-- Hit Line -->
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>

    </div>

    <script>
        /**
         * Starfield Renderer
         * Draws pixelated stars moving towards the viewer
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 150;
        
        // Disable smoothing for pixel look
        ctx.imageSmoothingEnabled = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 2; // Spread wide
                this.y = initial ? Math.random() * height : -20; // Start above screen
                this.z = Math.random() * 2 + 0.5; // Speed/Depth
                this.size = Math.random() > 0.9 ? 3 : (Math.random() > 0.7 ? 2 : 1);
                
                // Synthwave palette
                const colors = ['#ffffff', '#00ffff', '#ff00ff', '#ffe600'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 2; // Fall speed
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw square pixels
                ctx.fillRect(
                    Math.round(width/2 + this.x), 
                    Math.round(this.y), 
                    this.size, 
                    this.size
                );
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Interaction Logic
         * Adds a glitch effect to the title on button hover
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');

        btn.addEventListener('mouseenter', () => {
            // Randomize offset slightly for glitch feel
            const rX = Math.random() * 4 - 2;
            title.style.textShadow = `
                ${4 + rX}px 0px 0px var(--c-cyan), 
                ${-4 + rX}px 0px 0px var(--c-magenta)
            `;
        });

        btn.addEventListener('mouseleave', () => {
            // Reset to standard split
            title.style.textShadow = `
                4px 0px 0px var(--c-cyan), 
                -4px 0px 0px var(--c-magenta)
            `;
        });
    </script>
</body>
</html>
