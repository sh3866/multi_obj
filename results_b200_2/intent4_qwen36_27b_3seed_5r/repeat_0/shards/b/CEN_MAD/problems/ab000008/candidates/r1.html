<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Retro Rhythm</title>
    <style>
        :root {
            --c-bg: #080014;
            --c-grid: #ff00ff;
            --c-grid-alt: #2b002b;
            --c-cyan: #00ffff;
            --c-pink: #ff00ff;
            --c-yellow: #ffee00;
            --c-white: #ffffff;
            --c-black: #000000;
            
            --pixel-size: 4px; /* Base unit for chunky UI */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg);
            color: var(--c-white);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- CRT OVERLAY (Global) --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 999;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* --- BACKGROUND SCENE --- */
        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            perspective: 600px;
            overflow: hidden;
        }

        /* Pixel Sun */
        .sun {
            position: absolute;
            bottom: 35%; /* Horizon line */
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            z-index: 1;
            /* Pixelated Gradient */
            background: linear-gradient(to top, var(--c-pink), var(--c-yellow));
            /* The Cutouts */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 58%,
                transparent 58%, transparent 63%,
                black 63%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 58%,
                transparent 58%, transparent 63%,
                black 63%, black 75%,
                transparent 75%, transparent 80%,
                black 80%, black 100%
            );
            /* Hard pixel rendering */
            image-rendering: pixelated;
            box-shadow: 0 0 40px var(--c-pink);
        }

        /* 3D Grid Floor */
        .floor {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 40%; /* Horizon height */
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 100%),
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            transform-origin: bottom center;
            transform: rotateX(85deg); /* Steep perspective */
            animation: gridScroll 1s linear infinite;
            z-index: 2;
            box-shadow: 0 0 50px var(--c-pink);
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 60px; }
        }

        /* --- MAIN CONTENT LAYER --- */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: flex-start;
            padding-top: 10vh;
        }

        /* Title */
        .title-block {
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Courier New', monospace;
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--c-white);
            letter-spacing: 5px;
            line-height: 1;
            /* Crisp RGB Split */
            text-shadow: 
                4px 0px 0px rgba(255,0,0,0.7), 
                -4px -2px 0px rgba(0,255,255,0.7);
            animation: titleBob 4s ease-in-out infinite;
        }

        h1 span {
            color: var(--c-cyan);
        }

        @keyframes titleBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- THE GAME BLOCK (Highway + Button) --- */
        .game-console {
            position: relative;
            width: 320px;
            height: 300px;
            perspective: 800px;
            margin-top: 20px;
        }

        /* The Highway */
        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            border: 4px solid var(--c-cyan);
            box-shadow: 0 0 20px var(--c-cyan);
            /* 3D Tilt */
            transform: rotateX(40deg);
            transform-origin: top center;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        /* Lanes */
        .lane {
            flex: 1;
            border-right: 2px solid rgba(0, 255, 255, 0.3);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 40px;
            left: -10px;
            right: -10px;
            height: 6px;
            background: var(--c-white);
            box-shadow: 0 0 10px var(--c-white), 0 0 20px var(--c-pink);
            z-index: 5;
        }

        /* Notes (Blocky) */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            border: 2px solid var(--c-black);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            animation: fall linear infinite;
            image-rendering: pixelated;
        }

        /* Lane Colors */
        .lane:nth-child(1) .note { background: var(--c-pink); animation-duration: 1.2s; animation-delay: 0s; }
        .lane:nth-child(2) .note { background: var(--c-cyan); animation-duration: 1.5s; animation-delay: 0.5s; }
        .lane:nth-child(3) .note { background: var(--c-cyan); animation-duration: 1.3s; animation-delay: 0.2s; }
        .lane:nth-child(4) .note { background: var(--c-pink); animation-duration: 1.6s; animation-delay: 0.7s; }

        @keyframes fall {
            0% { top: -30px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 100%; opacity: 1; }
        }

        /* --- THE REVAMPED BUTTON --- */
        .btn-start {
            position: absolute;
            bottom: -20px; /* Overlaps highway */
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 60px;
            background-color: var(--c-pink);
            color: var(--c-white);
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            /* Chunky Pixel Border using box-shadow */
            box-shadow: 
                inset 4px 4px 0px 0px rgba(255,255,255,0.5),
                inset -4px -4px 0px 0px rgba(0,0,0,0.4),
                0px 0px 0px 6px var(--c-cyan), /* The thick border */
                0px 0px 0px 10px var(--c-black), /* The outline */
                0px 0px 30px var(--c-pink); /* Glow */
            z-index: 20;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }

        .btn-start:hover {
            transform: translateX(-50%) scale(1.05);
            background-color: #ff33ff;
        }

        .btn-start:active {
            transform: translateX(-50%) scale(0.98);
            box-shadow: 
                inset 4px 4px 0px 0px rgba(0,0,0,0.4),
                inset -4px -4px 0px 0px rgba(255,255,255,0.2),
                0px 0px 0px 6px var(--c-cyan),
                0px 0px 0px 10px var(--c-black);
        }

        /* Pulse Animation for Button */
        @keyframes btnPulse {
            0% { box-shadow: inset 4px 4px 0px 0px rgba(255,255,255,0.5), inset -4px -4px 0px 0px rgba(0,0,0,0.4), 0px 0px 0px 6px var(--c-cyan), 0px 0px 0px 10px var(--c-black), 0px 0px 20px var(--c-pink); }
            50% { box-shadow: inset 4px 4px 0px 0px rgba(255,255,255,0.5), inset -4px -4px 0px 0px rgba(0,0,0,0.4), 0px 0px 0px 6px var(--c-cyan), 0px 0px 0px 10px var(--c-black), 0px 0px 50px var(--c-pink); }
            100% { box-shadow: inset 4px 4px 0px 0px rgba(255,255,255,0.5), inset -4px -4px 0px 0px rgba(0,0,0,0.4), 0px 0px 0px 6px var(--c-cyan), 0px 0px 0px 10px var(--c-black), 0px 0px 20px var(--c-pink); }
        }
        
        .btn-start { animation: btnPulse 2s infinite; }

        /* --- STARFIELD CANVAS --- */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .game-console { width: 280px; height: 240px; }
            .sun { width: 150px; height: 150px; }
        }

    </style>
</head>
<body>

    <!-- CRT Scanlines & Vignette -->
    <div class="crt-overlay"></div>

    <!-- Background Layer -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content">
        <div class="title-block">
            <h1>PIXEL<br><span>DANCE</span></h1>
        </div>

        <div class="game-console">
            <!-- The Highway -->
            <div class="highway">
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="hit-line"></div>
            </div>

            <!-- The Button (Overlapping) -->
            <button class="btn-start" id="startBtn">START</button>
        </div>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders square pixels moving towards the screen
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 150;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false; // Keep stars pixelated
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Scatter initially
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 2; // Wider spread
                this.y = -10;
                this.z = Math.random() * 2 + 0.5; // Speed
                this.size = Math.random() * 3 + 1;
                // Palette: White, Cyan, Pink
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 2; // Move down
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(Math.round(this.x - width/2), Math.round(this.y), Math.ceil(this.size), Math.ceil(this.size));
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            // Clear with slight transparency for trails? No, clean clear for retro feel
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Simple glitch effect on hover
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');

        btn.addEventListener('mouseenter', () => {
            title.style.textShadow = `
                ${Math.random()*10 - 5}px 0px 0px rgba(255,0,0,0.8), 
                ${Math.random()*-10 + 5}px -2px 0px rgba(0,255,255,0.8)
            `;
        });

        btn.addEventListener('mouseleave', () => {
            title.style.textShadow = `4px 0px 0px rgba(255,0,0,0.7), -4px -2px 0px rgba(0,255,255,0.7)`;
        });
    </script>
</body>
</html>
