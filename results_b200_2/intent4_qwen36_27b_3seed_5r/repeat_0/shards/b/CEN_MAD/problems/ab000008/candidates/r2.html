<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        /* 
           SYSTEM FONTS: Using a robust stack of monospace fonts to simulate 
           a pixel aesthetic without external requests. 
        */
        :root {
            --c-bg: #050011;
            --c-grid: #ff00ff;
            --c-cyan: #00ffff;
            --c-pink: #ff00ff;
            --c-yellow: #ffee00;
            --c-white: #ffffff;
            --c-black: #000000;
            
            /* Pixel Scale */
            --pixel: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg);
            color: var(--c-white);
            font-family: 'Courier New', 'Lucida Console', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Changed from center to allow vertical shift */
            position: relative;
        }

        /* --- GLOBAL PIXELATION --- */
        /* Forces the entire page to render crisply if scaled */
        html, body, div, h1, button {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* --- CRT & SCANLINES (Atmosphere) --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Scanlines */
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 999;
            pointer-events: none;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.9);
            /* Scanline flicker */
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        /* --- BACKGROUND SCENE --- */
        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            /* Create the vanishing point */
            perspective: 800px; 
            perspective-origin: 50% 30%;
        }

        /* Pixel Sun */
        .sun {
            position: absolute;
            bottom: 30%; /* Horizon line */
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 240px;
            z-index: 1;
            background: linear-gradient(to top, var(--c-pink), var(--c-yellow));
            /* Hard cutouts for retro sun look */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 44%,
                black 44%, black 50%,
                transparent 50%, transparent 54%,
                black 54%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 40%,
                transparent 40%, transparent 44%,
                black 44%, black 50%,
                transparent 50%, transparent 54%,
                black 54%, black 60%,
                transparent 60%, transparent 65%,
                black 65%, black 100%
            );
            box-shadow: 0 0 20px var(--c-pink);
        }

        /* 3D Grid Floor */
        .floor {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 45%; /* Horizon height */
            /* Stronger contrast grid */
            background: 
                linear-gradient(transparent 0%, var(--c-bg) 100%),
                linear-gradient(90deg, var(--c-grid) 2px, transparent 2px),
                linear-gradient(0deg, var(--c-grid) 2px, transparent 2px);
            background-size: 100% 100%, 80px 80px, 80px 80px;
            transform-origin: bottom center;
            transform: rotateX(75deg); /* Steep perspective */
            animation: gridScroll 2s linear infinite;
            z-index: 2;
            opacity: 0.8;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 80px; }
        }

        /* --- MAIN CONTENT LAYER --- */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            /* CRITIQUE: Lower vertical position by ~15% */
            padding-top: 25vh; 
        }

        /* Title */
        .title-block {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            z-index: 20;
        }

        h1 {
            /* CRITIQUE: Strict bitmap font styling */
            font-family: 'Courier New', monospace;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--c-white);
            letter-spacing: -2px;
            line-height: 0.9;
            
            /* CRITIQUE: Hard, blocky chromatic aberration (no blur) */
            text-shadow: 
                4px 0px 0px var(--c-pink), 
                -4px 0px 0px var(--c-cyan);
            
            /* Pixelated bobbing */
            animation: titleBob 4s steps(10) infinite;
        }

        h1 span {
            color: var(--c-yellow);
            /* Invert split for second word */
            text-shadow: 
                -4px 0px 0px var(--c-pink), 
                4px 0px 0px var(--c-cyan);
        }

        @keyframes titleBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- THE GAME BLOCK (Highway + Button) --- */
        .game-console {
            position: relative;
            width: 360px;
            height: 320px;
            perspective: 1000px; /* Deep perspective */
            margin-top: 20px;
        }

        /* The Highway */
        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            /* CRITIQUE: Crisp borders, no blur */
            border: var(--pixel) solid var(--c-cyan);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5); /* Hard shadow */
            
            /* CRITIQUE: Single clear vanishing point via transform */
            transform: rotateX(45deg);
            transform-origin: top center;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        /* Lanes */
        .lane {
            flex: 1;
            /* CRITIQUE: Distinct, crisp lines */
            border-right: 2px dashed rgba(255, 255, 255, 0.3);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 20px;
            left: -10px;
            right: -10px;
            height: 4px;
            background: var(--c-white);
            /* CRITIQUE: Sharp bright core, tight bloom */
            box-shadow: 0 0 2px var(--c-white), 0 0 8px var(--c-pink);
            z-index: 5;
        }

        /* Notes (Blocky) */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            border: 2px solid var(--c-white);
            /* CRITIQUE: Hard shadow, no blur */
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            animation: fall linear infinite;
            /* Ensure pixels are crisp */
            image-rendering: pixelated; 
        }

        /* Lane Colors */
        .lane:nth-child(1) .note { background: var(--c-pink); animation-duration: 1.2s; animation-delay: 0s; }
        .lane:nth-child(2) .note { background: var(--c-cyan); animation-duration: 1.5s; animation-delay: 0.5s; }
        .lane:nth-child(3) .note { background: var(--c-cyan); animation-duration: 1.3s; animation-delay: 0.2s; }
        .lane:nth-child(4) .note { background: var(--c-pink); animation-duration: 1.6s; animation-delay: 0.7s; }

        @keyframes fall {
            0% { top: -30px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 100%; opacity: 1; }
        }

        /* --- THE REVAMPED BUTTON --- */
        .btn-container {
            /* CRITIQUE: Integrate button into perspective (on the grid/floor) */
            position: absolute;
            bottom: -40px;
            left: 50%;
            width: 280px;
            /* Move it back slightly in Z-space to sit 'on' the floor */
            transform: translateX(-50%) perspective(800px) rotateX(10deg);
            z-index: 30;
        }

        .btn-start {
            width: 100%;
            height: 56px;
            background-color: var(--c-bg);
            color: var(--c-white);
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            
            /* CRITIQUE: Stepped gradient, hard pixelated drop shadow */
            background: 
                linear-gradient(
                    45deg, 
                    transparent 45%, 
                    rgba(255,255,255,0.1) 45%, 
                    rgba(255,255,255,0.1) 55%, 
                    transparent 55%
                ),
                var(--c-pink);
                
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.6),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                0px 0px 0px 4px var(--c-cyan), /* Border */
                0px 0px 0px 8px var(--c-black), /* Outline */
                8px 8px 0px rgba(0,0,0,0.5);   /* Hard Shadow */

            transition: transform 0.1s, box-shadow 0.1s;
            /* Reduce glow intensity compared to title */
            filter: drop-shadow(0 0 5px var(--c-pink)); 
        }

        .btn-start:hover {
            /* CRITIQUE: Hover state color shift */
            background-color: var(--c-cyan);
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.6),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                0px 0px 0px 4px var(--c-pink),
                0px 0px 0px 8px var(--c-black),
                8px 8px 0px rgba(0,0,0,0.5);
            color: var(--c-black);
            transform: scale(1.02);
        }

        .btn-start:active {
            transform: scale(0.98) perspective(800px) rotateX(10deg);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.4),
                inset -4px -4px 0px rgba(255,255,255,0.2),
                0px 0px 0px 4px var(--c-cyan),
                0px 0px 0px 8px var(--c-black);
        }

        /* --- STARFIELD CANVAS --- */
        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .game-console { width: 300px; height: 280px; }
            .sun { width: 180px; height: 180px; }
        }

    </style>
</head>
<body>

    <!-- CRT Scanlines & Vignette -->
    <div class="crt-overlay"></div>

    <!-- Background Layer -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        <div class="sun"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content">
        <div class="title-block">
            <h1>PIXEL<br><span>DANCE</span></h1>
        </div>

        <div class="game-console">
            <!-- The Highway -->
            <div class="highway">
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="hit-line"></div>
            </div>

            <!-- The Button (Integrated into scene) -->
            <div class="btn-container">
                <button class="btn-start" id="startBtn">START</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders square pixels moving towards the screen
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 120;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false; // Keep stars pixelated
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Scatter initially
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 2; 
                this.y = -10;
                this.z = Math.random() * 2 + 0.5; 
                this.size = Math.random() * 3 + 1;
                // Palette: White, Cyan, Pink
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 1.5; // Move down
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(
                    Math.round(this.x - width/2), 
                    Math.round(this.y), 
                    Math.ceil(this.size), 
                    Math.ceil(this.size)
                );
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Hard glitch effect on hover
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');

        btn.addEventListener('mouseenter', () => {
            // Hard offset glitch
            title.style.textShadow = `
                ${Math.random()*8 - 4}px 0px 0px rgba(255,0,0,1), 
                ${Math.random()*-8 + 4}px 0px 0px rgba(0,255,255,1)
            `;
        });

        btn.addEventListener('mouseleave', () => {
            // Reset to standard split
            title.style.textShadow = `
                4px 0px 0px var(--c-pink), 
                -4px 0px 0px var(--c-cyan)
            `;
        });
    </script>
</body>
</html>
