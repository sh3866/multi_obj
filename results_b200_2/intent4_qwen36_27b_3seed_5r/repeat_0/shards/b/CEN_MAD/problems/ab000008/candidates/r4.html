<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            /* Palette */
            --c-bg: #050010;
            --c-grid: #ff00ff;
            --c-cyan: #00f3ff;
            --c-magenta: #ff00ff;
            --c-yellow: #ffe600;
            --c-white: #ffffff;
            --c-black: #000000;
            
            /* Pixel Scale */
            --px: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--c-bg);
            color: var(--c-white);
            font-family: 'Courier New', 'Lucida Console', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- GLOBAL PIXEL GEOMETRY & ATMOSPHERE --- */

        /* CRT Overlay with Scanlines */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 4px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            animation: flicker 0.2s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.92; }
            100% { opacity: 0.96; }
        }

        /* --- SCENE BACKGROUND --- */

        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* Pixel Sun: Hard strips, no gradients */
        .sun-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Mask to cut off bottom so highway emerges */
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        .sun-strip {
            width: 100%;
            background: linear-gradient(90deg, var(--c-yellow) 0%, var(--c-magenta) 100%);
            margin-bottom: var(--px);
        }
        
        /* Generate varying widths for the pixel look */
        .sun-strip:nth-child(1) { height: 20px; width: 60%; }
        .sun-strip:nth-child(2) { height: 20px; width: 70%; }
        .sun-strip:nth-child(3) { height: 20px; width: 80%; }
        .sun-strip:nth-child(4) { height: 20px; width: 90%; }
        .sun-strip:nth-child(5) { height: 20px; width: 100%; }
        .sun-strip:nth-child(6) { height: 20px; width: 100%; }
        .sun-strip:nth-child(7) { height: 20px; width: 100%; }
        .sun-strip:nth-child(8) { height: 20px; width: 100%; }

        /* Floor Grid */
        .floor {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 100%;
            background: 
                linear-gradient(to top, var(--c-bg) 0%, transparent 40%),
                repeating-linear-gradient(90deg, var(--c-grid) 0px, var(--c-grid) 2px, transparent 2px, transparent 60px),
                repeating-linear-gradient(0deg, var(--c-grid) 0px, var(--c-grid) 2px, transparent 2px, transparent 60px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            transform: rotateX(60deg);
            transform-origin: center top;
            opacity: 0.4;
            animation: gridScroll 2s linear infinite;
            z-index: 3;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 60px; }
        }

        /* --- MAIN UI LAYOUT --- */

        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* --- TYPOGRAPHY & GLITCH --- */

        .title-container {
            position: relative;
            z-index: 20;
            margin-bottom: 0; /* Remove gap for integration */
            text-align: center;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.9;
            text-transform: uppercase;
            color: var(--c-white);
            font-weight: 900;
            letter-spacing: -2px;
            position: relative;
            display: inline-block;
            /* Hard blocky RGB split */
            text-shadow: 
                4px 0px 0px var(--c-cyan), 
                -4px 0px 0px var(--c-magenta);
            animation: titleBob 3s steps(10) infinite;
        }

        h1 span {
            display: block;
            font-size: 6rem;
            /* Inverted split */
            text-shadow: 
                -4px 0px 0px var(--c-cyan), 
                4px 0px 0px var(--c-magenta);
        }

        @keyframes titleBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- THE HIGHWAY & INTEGRATION --- */

        .highway-wrapper {
            position: relative;
            width: 320px;
            height: 400px;
            perspective: 800px;
            margin-top: -20px; /* Pull up into title */
            z-index: 15;
            display: flex;
            justify-content: center;
        }

        /* Vertical Lines Extending Upwards (The 'Emergence') */
        .bg-lines {
            position: absolute;
            top: -250px; /* Extend way up behind title */
            bottom: 0;
            width: 100%;
            display: flex;
            z-index: -1;
            pointer-events: none;
            opacity: 0.3;
        }

        .bg-line {
            flex: 1;
            border-left: 4px solid var(--c-cyan);
            border-right: 4px solid var(--c-magenta);
            background: rgba(0, 243, 255, 0.05);
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            transform: rotateX(20deg); 
            transform-origin: top center;
            /* Hard neon borders, no glow blur */
            border: 4px solid var(--c-cyan);
            box-shadow: 
                0 0 0 4px var(--c-black),
                0 0 0 8px var(--c-magenta);
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* Lanes & Dividers */
        .lane {
            flex: 1;
            position: relative;
            /* High contrast dividers */
            border-right: 4px solid var(--c-magenta);
        }
        .lane:last-child { border-right: none; }
        
        /* Alternating lane backgrounds for clarity */
        .lane:nth-child(even) { background: rgba(255, 0, 255, 0.05); }
        .lane:nth-child(odd) { background: rgba(0, 243, 255, 0.05); }

        /* Hit Line: Stepped Glow */
        .hit-line {
            position: absolute;
            bottom: 40px;
            left: -4px;
            right: -4px;
            height: 8px;
            background: var(--c-white);
            z-index: 20;
            /* Stepped pixel glow using box-shadow */
            box-shadow: 
                0 0 0 4px var(--c-black),
                0 0 0 8px var(--c-yellow);
        }

        /* Notes: Blocky Rectangles */
        .note {
            position: absolute;
            left: 4px;
            width: calc(100% - 8px);
            height: 32px;
            border: 4px solid var(--c-white);
            box-shadow: 
                4px 4px 0px var(--c-black); /* Hard shadow */
            animation: fall linear infinite;
        }

        .lane:nth-child(1) .note { background: var(--c-magenta); animation-duration: 1.5s; animation-delay: 0s; }
        .lane:nth-child(2) .note { background: var(--c-cyan); animation-duration: 1.8s; animation-delay: 0.4s; }
        .lane:nth-child(3) .note { background: var(--c-cyan); animation-duration: 1.6s; animation-delay: 0.8s; }
        .lane:nth-child(4) .note { background: var(--c-magenta); animation-duration: 1.9s; animation-delay: 0.2s; }

        @keyframes fall {
            0% { top: -60px; opacity: 0; }
            5% { opacity: 1; }
            100% { top: 110%; opacity: 1; }
        }

        /* --- START BUTTON --- */

        .btn-container {
            position: relative;
            z-index: 30;
            width: 300px;
            margin-top: 30px;
        }

        .btn-start {
            width: 100%;
            height: 70px;
            background-color: var(--c-black);
            color: var(--c-white);
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            position: relative;
            outline: none;
            
            /* Chunky Pixel Border Style */
            box-shadow: 
                inset 4px 4px 0px var(--c-cyan),
                inset -4px -4px 0px var(--c-magenta),
                4px 4px 0px var(--c-black);
            
            transition: transform 0.1s;
            animation: btnPulse 1.5s infinite alternate;
        }

        .btn-start:hover {
            background-color: var(--c-cyan);
            color: var(--c-black);
            box-shadow: 
                inset 4px 4px 0px var(--c-white),
                inset -4px -4px 0px var(--c-magenta),
                4px 4px 0px var(--c-black),
                0 0 0 4px var(--c-white);
            transform: translateY(-2px);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: inset 4px 4px 0px var(--c-black);
        }

        @keyframes btnPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            h1 span { font-size: 4rem; }
            .highway-wrapper { width: 280px; height: 320px; }
            .sun-container { width: 240px; height: 240px; top: 15%; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlay -->
    <div class="crt-overlay"></div>

    <!-- Background Environment -->
    <div class="scene">
        <canvas id="starfield"></canvas>
        
        <!-- Pixel Sun -->
        <div class="sun-container">
            <div class="sun-strip"></div>
            <div class="sun-strip"></div>
            <div class="sun-strip"></div>
            <div class="sun-strip"></div>
            <div class="sun-strip"></div>
            <div class="sun-strip"></div>
            <div class="sun-strip"></div>
            <div class="sun-strip"></div>
        </div>
        
        <div class="floor"></div>
    </div>

    <!-- UI Content -->
    <div class="ui-layer">
        
        <div class="title-container">
            <h1>PIXEL<br><span>DANCE</span></h1>
        </div>

        <div class="highway-wrapper">
            <!-- Vertical Lines Emerging Behind Title -->
            <div class="bg-lines">
                <div class="bg-line"></div>
                <div class="bg-line"></div>
                <div class="bg-line"></div>
                <div class="bg-line"></div>
            </div>

            <div class="highway">
                <!-- Lanes -->
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                
                <!-- Hit Line -->
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>

    </div>

    <script>
        /**
         * Starfield Renderer
         * Draws pixelated stars moving towards the viewer
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 100;
        
        // Disable smoothing for pixel look
        ctx.imageSmoothingEnabled = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 2; 
                this.y = initial ? Math.random() * height : -50; 
                this.z = Math.random() * 3 + 0.5; // Speed
                this.size = Math.random() > 0.8 ? 3 : 2; // Pixel size
                
                const colors = ['#ffffff', '#00ffff', '#ff00ff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.z * 1.5; 
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw square pixels
                ctx.fillRect(
                    Math.round(width/2 + this.x), 
                    Math.round(this.y), 
                    this.size, 
                    this.size
                );
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Glitch Interaction
         * Adds a jitter effect to the title on button hover
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');
        let glitchInterval;

        btn.addEventListener('mouseenter', () => {
            glitchInterval = setInterval(() => {
                const rX = Math.random() * 8 - 4;
                const rY = Math.random() * 4 - 2;
                title.style.transform = `translate(${rX}px, ${rY}px)`;
                title.style.textShadow = `
                    ${4 + Math.random()*4}px 0px 0px var(--c-cyan), 
                    ${-4 - Math.random()*4}px 0px 0px var(--c-magenta)
                `;
            }, 50);
        });

        btn.addEventListener('mouseleave', () => {
            clearInterval(glitchInterval);
            title.style.transform = `translate(0, 0)`;
            title.style.textShadow = `
                4px 0px 0px var(--c-cyan), 
                -4px 0px 0px var(--c-magenta)
            `;
        });
    </script>
</body>
</html>
