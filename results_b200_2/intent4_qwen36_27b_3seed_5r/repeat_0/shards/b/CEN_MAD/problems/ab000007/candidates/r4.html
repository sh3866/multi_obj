<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #020108;
    --bg-horizon: #12102b;
    --accent-cyan: #00f0ff;
    --accent-cyan-dim: rgba(0, 240, 255, 0.15);
    --accent-white: #ffffff;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    
    --ui-radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: #000;
    color: var(--accent-white);
    font-family: var(--font-ui);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 540px;
    max-height: 960px;
    overflow: hidden;
    /* Deep atmospheric background */
    background: radial-gradient(ellipse at bottom, var(--bg-horizon) 0%, var(--bg-deep) 80%);
    box-shadow: 0 0 100px rgba(0,0,0,0.8);
  }

  @media (min-width: 600px) {
    #app-container {
      height: 90vh;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  }

  /* --- ATMOSPHERE LAYERS --- */
  
  /* Animated Fog/Aether */
  .aether-layer {
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(40, 20, 80, 0.3) 0%, transparent 60%);
    filter: blur(40px);
    animation: drift 20s infinite alternate ease-in-out;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-5%, 5%) scale(1.1); }
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.6) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* --- HUD --- */
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 24px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none; 
  }

  /* Title Zone */
  .title-group {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .title-block h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent-white);
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    line-height: 1;
  }

  .title-sub {
    font-size: 11px;
    color: var(--accent-cyan);
    font-weight: 600;
    letter-spacing: 1px;
    opacity: 0.8;
    margin-top: 2px;
  }

  /* Counter Zone */
  .counter-pill {
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--accent-white);
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .counter-pill span {
    color: var(--accent-cyan);
  }

  /* --- CONTROLS --- */
  .controls-area {
    position: absolute;
    bottom: 32px;
    left: 0;
    width: 100%;
    padding: 0 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 30;
    pointer-events: none;
  }

  /* Primary Action: CATCH */
  .catch-btn {
    pointer-events: auto;
    background: var(--accent-cyan);
    color: #000;
    border: none;
    height: 56px;
    padding: 0 32px;
    border-radius: var(--ui-radius);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  }

  .catch-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
    background: #fff;
  }

  .catch-btn:active {
    transform: scale(0.95);
  }

  /* Secondary Action: COLLECTION */
  .collection-btn {
    pointer-events: auto;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: rgba(255, 255, 255, 0.8);
    height: 48px;
    padding: 0 24px;
    border-radius: var(--ui-radius);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
  }

  .collection-btn:hover {
    border-color: var(--accent-white);
    color: var(--accent-white);
    background: rgba(255, 255, 255, 0.05);
  }

  /* --- GAME CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none;
  }

  /* SVG Icons */
  .icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

</style>
</head>
<body>

<div id="app-container">
  
  <!-- Environmental Layers -->
  <div class="aether-layer"></div>
  <div class="vignette"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="title-group">
      <h1>Aether Catch</h1>
      <div class="title-sub">SECTOR 7G</div>
    </div>
    <div class="counter-pill">
      <span id="score">0</span> / 10
    </div>
  </div>

  <!-- Main Game Area -->
  <canvas id="gameCanvas"></canvas>

  <!-- Controls -->
  <div class="controls-area">
    <!-- Collection (Secondary) -->
    <button class="collection-btn" aria-label="View Collection">
      <svg class="icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
      COLLECTION
    </button>

    <!-- Catch (Primary) -->
    <button class="catch-btn" id="catchBtn" aria-label="Catch Creature">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v8"></path>
        <path d="M8 12h8"></path>
      </svg>
      CATCH
    </button>
  </div>

</div>

<script>
/**
 * AETHER CATCH - Visual Logic (Revised)
 * Organic blobs, atmospheric canvas, force-field net.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const catchBtn = document.getElementById('catchBtn');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// Configuration
const COLORS = [
  { h: 180, s: 90, l: 60 }, // Cyan
  { h: 270, s: 80, l: 65 }, // Violet
  { h: 330, s: 85, l: 65 }  // Pink
];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- CLASSES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.01, 0.03);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 4);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.reset();
  }

  reset() {
    // Spawn logic
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { this.x = random(0, width); this.y = -80; }
    else if (side === 1) { this.x = width + 80; this.y = random(0, height); }
    else if (side === 2) { this.x = random(0, width); this.y = height + 80; }
    else { this.x = -80; this.y = random(0, height); }
    
    this.radius = random(25, 45);
    this.baseRadius = this.radius;
    
    // Movement
    const angleToCenter = Math.atan2((height/2) - this.y, (width/2) - this.x);
    const speed = random(0.3, 0.9);
    this.vx = Math.cos(angleToCenter) * speed;
    this.vy = Math.sin(angleToCenter) * speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.005, 0.012);
    this.phase = random(0, Math.PI * 2);
  }

  update(time) {
    // Drift
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.3;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.3;

    // Pulse
    this.radius = this.baseRadius + Math.sin(time * 0.003 + this.phase) * 3;

    // Bounds check
    if (this.x < -150 || this.x > width + 150 || this.y < -150 || this.y > height + 150) {
      this.reset();
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Create Organic Blob Shape
    ctx.beginPath();
    const points = 12;
    for (let i = 0; i <= points; i++) {
      const angle = (i / points) * Math.PI * 2;
      // Vary radius based on angle to create organic wobble
      const r = this.radius + Math.sin(angle * 3 + this.wobbleOffset) * (this.radius * 0.15);
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();

    // Internal Gradient (Volume)
    const grad = ctx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, 0, 0, 0, this.radius * 1.2);
    grad.addColorStop(0, hsl(this.color.h, this.color.s, 90, 0.9)); // Highlight
    grad.addColorStop(0.4, hsl(this.color.h, this.color.s, this.color.l, 0.8)); // Body
    grad.addColorStop(1, hsl(this.color.h, this.color.s, 20, 0.6)); // Shadow

    ctx.fillStyle = grad;
    
    // Bioluminescent Glow
    ctx.shadowBlur = 30;
    ctx.shadowColor = hsl(this.color.h, this.color.s, this.color.l, 0.6);
    
    ctx.fill();
    
    // Subtle Inner Core
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(this.radius * 0.2, -this.radius * 0.2, this.radius * 0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.radius = 50;
    this.angle = 0;
    this.active = false;
    this.activeScale = 1;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.12;
    this.y += (mouseY - this.y) * 0.12;
    
    if (this.active) {
      this.angle += 0.5; 
      this.activeScale = 1.4; 
    } else {
      this.angle += 0.02;
      this.activeScale += (1 - this.activeScale) * 0.1;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.activeScale, this.activeScale);
    
    // Force Field Polygon
    const sides = 6;
    const rot = this.angle;
    
    // Outer Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'var(--accent-cyan)';
    ctx.strokeStyle = 'var(--accent-cyan)';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = rot + (i * Math.PI * 2 / sides);
      const r = this.radius;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.stroke();

    // Inner Grid (Faint)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
    ctx.fill();

    // Crosshairs / Tech details
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-this.radius, 0); ctx.lineTo(this.radius, 0);
    ctx.moveTo(0, -this.radius); ctx.lineTo(0, this.radius);
    ctx.stroke();
    
    // Center Point
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class Player {
  constructor() {
    this.x = 0; 
    this.y = 0; 
    this.targetX = 0;
  }

  update() {
    this.targetX = (mouseX - width/2) * 0.15;
    this.x += (this.targetX - this.x) * 0.1;
    this.y = height - 100;
  }

  draw(ctx) {
    const px = width/2 + this.x;
    const py = this.y;

    ctx.save();
    ctx.translate(px, py);

    // Drone Body - Dark Silhouette with Cyan Edge
    ctx.fillStyle = '#050510'; 
    ctx.strokeStyle = 'var(--accent-cyan)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'var(--accent-cyan)';
    
    // Sleek Drone Shape
    ctx.beginPath();
    ctx.moveTo(-15, 20); 
    ctx.lineTo(15, 20);  
    ctx.lineTo(5, -15); 
    ctx.lineTo(-5, -15); 
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Visor
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 5;
    ctx.shadowColor = '#fff';
    ctx.beginPath();
    ctx.moveTo(-4, -5);
    ctx.lineTo(4, -5);
    ctx.lineTo(0, -2);
    ctx.fill();

    // Arm connecting to Net
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    
    // Line to Net Center
    ctx.lineTo(this.x - (width/2 + this.x - mouseX), this.y - mouseY);
    ctx.stroke();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;
let player;

function init() {
  resize();
  net = new Net();
  player = new Player();
  
  // Initial Creatures
  for(let i=0; i<5; i++) {
    const c = new Creature();
    c.x = random(50, width-50);
    c.y = random(50, height-150);
    creatures.push(c);
  }
  
  window.addEventListener('resize', resize);
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  container.addEventListener('touchstart', e => {
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
    triggerCatch();
  }, {passive: false});
  
  container.addEventListener('mousedown', () => triggerCatch());
  
  catchBtn.addEventListener('click', (e) => {
    e.stopPropagation(); 
    triggerCatch();
  });

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  
  if(player) player.y = height - 100;
}

function triggerCatch() {
  // Visual feedback on button
  catchBtn.style.transform = 'scale(0.95)';
  setTimeout(() => catchBtn.style.transform = 'scale(1)', 100);

  net.active = true;
  setTimeout(() => net.active = false, 200);

  let caught = false;
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < net.radius * 1.2 + c.radius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      caught = true;
      return false; 
    }
    return true; 
  });

  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 1000);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  ctx.clearRect(0, 0, width, height);

  player.update();
  player.draw(ctx);

  net.update();
  net.draw(ctx);

  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
