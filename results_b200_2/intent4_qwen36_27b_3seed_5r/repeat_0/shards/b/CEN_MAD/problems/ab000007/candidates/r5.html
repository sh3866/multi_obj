<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-horizon: #1a1a3a;
    --accent-cyan: #00f0ff;
    --accent-cyan-dim: rgba(0, 240, 255, 0.2);
    --glass-bg: rgba(20, 20, 35, 0.4);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: #000;
    color: #ffffff;
    font-family: var(--font-ui);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 540px;
    max-height: 960px;
    overflow: hidden;
    /* Deep atmospheric background */
    background: radial-gradient(circle at 50% 100%, var(--bg-horizon) 0%, var(--bg-deep) 100%);
    box-shadow: 0 0 100px rgba(0,0,0,0.8);
  }

  @media (min-width: 600px) {
    #app-container {
      height: 90vh;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  }

  /* --- ATMOSPHERE LAYERS --- */
  /* CSS Particle System (Spores/Dust) */
  .particle-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .spore {
    position: absolute;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- HUD --- */
  /* Unified Header Bar with Glassmorphism */
  .hud-bar {
    position: absolute;
    top: 20px; left: 20px; right: 20px;
    height: 64px;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .title-group {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title-block h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .title-sub {
    font-size: 10px;
    color: var(--accent-cyan);
    font-weight: 600;
    letter-spacing: 2px;
    opacity: 0.9;
    margin-top: 4px;
  }

  .counter-pill {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  .counter-pill span {
    color: var(--accent-cyan);
  }

  /* --- CONTROLS --- */
  .controls-area {
    position: absolute;
    bottom: 32px;
    left: 0;
    width: 100%;
    padding: 0 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 30;
    pointer-events: none;
  }

  /* Secondary Action: COLLECTION (Glass) */
  .collection-btn {
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: rgba(255, 255, 255, 0.7);
    height: 48px;
    padding: 0 24px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s ease;
  }

  .collection-btn:hover {
    border-color: rgba(255, 255, 255, 0.5);
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  /* Primary Action: CATCH (Solid/Glowing) */
  .catch-btn {
    pointer-events: auto;
    background: var(--accent-cyan);
    color: #000;
    border: none;
    height: 56px;
    padding: 0 36px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 0 20px var(--accent-cyan-dim);
    position: relative;
    overflow: hidden;
  }

  .catch-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.3s;
  }
  
  .catch-btn:hover::after {
    transform: translateX(100%);
  }

  .catch-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
    background: #fff;
  }

  .catch-btn:active {
    transform: scale(0.96);
  }

  /* --- GAME CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none;
  }

  /* SVG Icons */
  .icon {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

</style>
</head>
<body>

<div id="app-container">
  
  <!-- Environmental Layers -->
  <div class="particle-layer" id="particleLayer"></div>
  <div class="vignette"></div>

  <!-- HUD: Unified Header -->
  <div class="hud-bar">
    <div class="title-group">
      <h1>Aether Catch</h1>
      <div class="title-sub">SECTOR 7G</div>
    </div>
    <div class="counter-pill">
      <span id="score">0</span> / 10
    </div>
  </div>

  <!-- Main Game Area -->
  <canvas id="gameCanvas"></canvas>

  <!-- Controls: Balanced Composition -->
  <div class="controls-area">
    <!-- Collection (Secondary) -->
    <button class="collection-btn" aria-label="View Collection">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 4h16v16H4z"></path>
        <path d="M4 9h16"></path>
        <path d="M9 4v16"></path>
      </svg>
      Collection
    </button>

    <!-- Catch (Primary) -->
    <button class="catch-btn" id="catchBtn" aria-label="Catch Creature">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v8"></path>
        <path d="M8 12h8"></path>
      </svg>
      Catch
    </button>
  </div>

</div>

<script>
/**
 * AETHER CATCH - Visual Logic (Revised)
 * 1. CSS Particle System (Spores)
 * 2. Geometric Player Avatar (Hexagon Net)
 * 3. Creature Variety (Shapes)
 */

// --- CSS PARTICLE GENERATION ---
const particleLayer = document.getElementById('particleLayer');
for(let i=0; i<25; i++) {
  const s = document.createElement('div');
  s.className = 'spore';
  const size = Math.random() * 4 + 2;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + '%';
  s.style.animationDuration = (Math.random() * 10 + 10) + 's';
  s.style.animationDelay = (Math.random() * 5) + 's';
  particleLayer.appendChild(s);
}

// --- CANVAS LOGIC ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const catchBtn = document.getElementById('catchBtn');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// Configuration
const COLORS = [
  { h: 180, s: 90, l: 60 }, // Cyan
  { h: 270, s: 80, l: 65 }, // Violet
  { h: 330, s: 85, l: 65 }  // Pink
];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- CLASSES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.01, 0.03);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 4);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= this.decay;
    this.size *= 0.96;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    // Variety: 0=Blob, 1=Spiky, 2=Elongated
    this.type = Math.floor(Math.random() * 3); 
    this.reset();
  }

  reset() {
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { this.x = random(0, width); this.y = -80; }
    else if (side === 1) { this.x = width + 80; this.y = random(0, height); }
    else if (side === 2) { this.x = random(0, width); this.y = height + 80; }
    else { this.x = -80; this.y = random(0, height); }
    
    this.radius = random(25, 40);
    this.baseRadius = this.radius;
    
    const angleToCenter = Math.atan2((height/2) - this.y, (width/2) - this.x);
    const speed = random(0.3, 0.8);
    this.vx = Math.cos(angleToCenter) * speed;
    this.vy = Math.sin(angleToCenter) * speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.005, 0.012);
    this.phase = random(0, Math.PI * 2);
  }

  update(time) {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.3;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.3;

    this.radius = this.baseRadius + Math.sin(time * 0.003 + this.phase) * 3;

    if (this.x < -150 || this.x > width + 150 || this.y < -150 || this.y > height + 150) {
      this.reset();
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Internal Gradient (Volume)
    const grad = ctx.createRadialGradient(-this.radius*0.3, -this.radius*0.3, 0, 0, 0, this.radius * 1.2);
    grad.addColorStop(0, hsl(this.color.h, this.color.s, 90, 0.9)); 
    grad.addColorStop(0.4, hsl(this.color.h, this.color.s, this.color.l, 0.8)); 
    grad.addColorStop(1, hsl(this.color.h, this.color.s, 20, 0.6)); 
    
    ctx.fillStyle = grad;
    ctx.shadowBlur = 20;
    ctx.shadowColor = hsl(this.color.h, this.color.s, this.color.l, 0.6);
    
    ctx.beginPath();
    
    // Shape Variety Logic
    if (this.type === 0) {
      // Blob (Organic)
      const points = 12;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2;
        const r = this.radius + Math.sin(angle * 3 + this.wobbleOffset) * (this.radius * 0.15);
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else if (this.type === 1) {
      // Spiky (Star-like)
      const spikes = 5;
      for (let i = 0; i < spikes * 2; i++) {
        const angle = (i * Math.PI) / spikes;
        const r = (i % 2 === 0) ? this.radius : this.radius * 0.5;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else {
      // Elongated (Diamond/Crystal)
      ctx.moveTo(0, -this.radius * 1.3);
      ctx.lineTo(this.radius * 0.6, 0);
      ctx.lineTo(0, this.radius * 1.3);
      ctx.lineTo(-this.radius * 0.6, 0);
      ctx.closePath();
    }

    ctx.fill();
    
    // Inner Core
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.radius = 45;
    this.angle = 0;
    this.active = false;
    this.activeScale = 1;
  }

  update() {
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    
    if (this.active) {
      this.angle += 0.8; 
      this.activeScale = 1.5; 
    } else {
      this.angle += 0.02;
      this.activeScale += (1 - this.activeScale) * 0.1;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.activeScale, this.activeScale);
    
    const sides = 6;
    const rot = this.angle;
    
    // Outer Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    
    // Hexagon Wireframe
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = rot + (i * Math.PI * 2 / sides);
      const r = this.radius;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.stroke();

    // Inner Grid (Faint)
    ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.fill();

    // Tech details
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-this.radius, 0); ctx.lineTo(this.radius, 0);
    ctx.moveTo(0, -this.radius); ctx.lineTo(0, this.radius);
    ctx.stroke();
    
    // Center Point
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;

function init() {
  resize();
  net = new Net();
  
  for(let i=0; i<5; i++) {
    const c = new Creature();
    c.x = random(50, width-50);
    c.y = random(50, height-150);
    creatures.push(c);
  }
  
  window.addEventListener('resize', resize);
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  container.addEventListener('touchstart', e => {
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
    triggerCatch();
  }, {passive: false});
  
  container.addEventListener('mousedown', () => triggerCatch());
  
  catchBtn.addEventListener('click', (e) => {
    e.stopPropagation(); 
    triggerCatch();
  });

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}

function triggerCatch() {
  // Visual feedback on button
  catchBtn.style.transform = 'scale(0.95)';
  setTimeout(() => catchBtn.style.transform = 'scale(1)', 100);

  net.active = true;
  setTimeout(() => net.active = false, 200);

  let caught = false;
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < net.radius * 1.2 + c.radius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      caught = true;
      return false; 
    }
    return true; 
  });

  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 1000);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  ctx.clearRect(0, 0, width, height);

  net.update();
  net.draw(ctx);

  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
