<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #05050a;
    --bg-horizon: #1a1c35;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff007f;
    --accent-white: #ffffff;
    --glass-bg: rgba(10, 12, 20, 0.6);
    --glass-border: rgba(255, 255, 255, 0.15);
    --ui-radius: 12px;
    --font-tech: "Courier New", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background-color: #000;
    color: var(--accent-white);
    font-family: var(--font-tech);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- LAYOUT CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 540px;
    max-height: 960px;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--bg-deep) 0%, var(--bg-horizon) 100%);
    box-shadow: 0 0 100px rgba(0,0,0,0.8);
  }

  @media (min-width: 600px) {
    #app-container {
      height: 90vh;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  }

  /* --- BACKGROUND ATMOSPHERE --- */
  /* Vignette for depth */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Horizon Line */
  .horizon-line {
    position: absolute;
    bottom: 25%;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
    z-index: 0;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
  }

  /* Ground Grid - Perspective */
  .ground-grid {
    position: absolute;
    bottom: 0;
    left: -50%;
    width: 200%;
    height: 25%;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(400px) rotateX(60deg);
    transform-origin: center top;
    mask-image: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    z-index: 0;
    pointer-events: none;
  }

  /* --- HUD --- */
  .hud {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 24px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none; 
  }

  /* Title Zone */
  .title-group {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .title-block h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-white);
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    line-height: 1;
  }

  .title-sub {
    font-size: 10px;
    color: var(--accent-cyan);
    letter-spacing: 1px;
    opacity: 0.8;
  }

  /* Counter Zone (Top Right) */
  .counter-pill {
    pointer-events: auto;
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
  }

  .counter-pill::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background-color: var(--accent-cyan);
    border-radius: 50%;
    box-shadow: 0 0 5px var(--accent-cyan);
  }

  /* --- CONTROLS --- */
  .controls-area {
    position: absolute;
    bottom: 32px;
    left: 0;
    width: 100%;
    padding: 0 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 30;
    pointer-events: none;
  }

  /* Catch Button (Secondary) */
  .catch-btn {
    pointer-events: auto;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: rgba(255, 255, 255, 0.9);
    height: 48px;
    padding: 0 24px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: var(--font-tech);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s ease;
    backdrop-filter: blur(4px);
  }

  .catch-btn:hover {
    border-color: var(--accent-white);
    background: rgba(255, 255, 255, 0.05);
  }

  .catch-btn:active {
    transform: scale(0.95);
    background: rgba(255, 255, 255, 0.1);
  }

  /* Collection Button (Primary) */
  .collection-btn {
    pointer-events: auto;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-white);
    height: 64px;
    padding: 0 28px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-family: var(--font-tech);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    position: relative;
    overflow: hidden;
  }

  /* Button Shine Effect */
  .collection-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
    transition: 0.5s;
  }

  .collection-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    border-color: #fff;
  }

  .collection-btn:hover::after {
    left: 100%;
  }

  .collection-btn:active {
    transform: scale(0.98);
  }

  /* --- GAME CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none;
  }

  /* SVG Icons */
  .icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

</style>
</head>
<body>

<div id="app-container">
  
  <!-- Environmental Layers -->
  <div class="horizon-line"></div>
  <div class="ground-grid"></div>
  <div class="vignette"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="title-group">
      <h1>Aether Catch</h1>
      <div class="title-sub">SECTOR 7G</div>
    </div>
    <div class="counter-pill">
      <span id="score">0</span> / 10
    </div>
  </div>

  <!-- Main Game Area -->
  <canvas id="gameCanvas"></canvas>

  <!-- Controls -->
  <div class="controls-area">
    <button class="catch-btn" id="catchBtn" aria-label="Catch Creature">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"></circle>
        <path d="M12 2v10"></path>
        <path d="M12 12l8 8"></path>
      </svg>
      CATCH
    </button>

    <button class="collection-btn" aria-label="View Collection">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        <line x1="8" y1="7" x2="16" y2="7"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      COLLECTION
    </button>
  </div>

</div>

<script>
/**
 * AETHER CATCH - Visual Logic
 * Renders organic entities, a stylized player, and particle effects.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const catchBtn = document.getElementById('catchBtn');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let lastTime = 0;

// Configuration
const COLORS = [
  { h: 180, s: 100, l: 50 }, // Cyan
  { h: 280, s: 80, l: 60 },  // Violet
  { h: 320, s: 90, l: 60 }   // Pink
];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- CLASSES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.02, 0.05);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 5);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size = random(1, 3);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.type = Math.floor(Math.random() * 3); // 0: Hex, 1: Triangle, 2: Circle
    this.reset();
  }

  reset() {
    // Spawn logic
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { this.x = random(0, width); this.y = -50; }
    else if (side === 1) { this.x = width + 50; this.y = random(0, height); }
    else if (side === 2) { this.x = random(0, width); this.y = height + 50; }
    else { this.x = -50; this.y = random(0, height); }
    
    this.radius = random(20, 35);
    this.baseRadius = this.radius;
    
    // Movement
    const angleToCenter = Math.atan2((height/2) - this.y, (width/2) - this.x);
    const speed = random(0.5, 1.2);
    this.vx = Math.cos(angleToCenter) * speed;
    this.vy = Math.sin(angleToCenter) * speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.005, 0.015);
    this.rotation = 0;
    this.rotSpeed = random(-0.02, 0.02);
    this.pulseSpeed = random(0.002, 0.005);
  }

  update(time) {
    // Drift
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * 0.5;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * 0.5;

    // Pulse
    this.radius = this.baseRadius + Math.sin(time * this.pulseSpeed) * 2;
    this.rotation += this.rotSpeed;

    // Bounds check
    if (this.x < -150 || this.x > width + 150 || this.y < -150 || this.y > height + 150) {
      this.reset();
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    // Style: Wireframe with 2px stroke
    ctx.lineWidth = 2;
    ctx.strokeStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l, 0.1);
    ctx.shadowBlur = 10;
    ctx.shadowColor = hsl(this.color.h, this.color.s, this.color.l, 0.5);

    ctx.beginPath();
    
    if (this.type === 0) { // Hexagon
      for (let i = 0; i < 6; i++) {
        const angle = i * Math.PI / 3;
        ctx.lineTo(this.radius * Math.cos(angle), this.radius * Math.sin(angle));
      }
    } else if (this.type === 1) { // Triangle
      for (let i = 0; i < 3; i++) {
        const angle = i * Math.PI * 2 / 3 - Math.PI / 2;
        ctx.lineTo(this.radius * Math.cos(angle), this.radius * Math.sin(angle));
      }
    } else { // Circle
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    }
    
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner Core (Bright dot)
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class Net {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.radius = 40;
    this.angle = 0;
    this.active = false;
    this.activeScale = 1;
  }

  update() {
    // Smooth follow
    this.x += (mouseX - this.x) * 0.15;
    this.y += (mouseY - this.y) * 0.15;
    
    if (this.active) {
      this.angle += 0.4; 
      this.activeScale = 1.3; 
    } else {
      this.angle += 0.03;
      this.activeScale += (1 - this.activeScale) * 0.1;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.activeScale, this.activeScale);
    
    // Outer Ring - High Contrast
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Web (Rotating)
    ctx.rotate(this.angle);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1; // Slightly thinner for details
    
    // Concentric circles
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(-this.radius, 0); ctx.lineTo(this.radius, 0);
    ctx.moveTo(0, -this.radius); ctx.lineTo(0, this.radius);
    ctx.stroke();
    
    // Targeting Dot
    ctx.fillStyle = 'var(--accent-cyan)';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

class Player {
  constructor() {
    this.x = 0; 
    this.y = 0; 
    this.targetX = 0;
  }

  update() {
    // Player tracks mouse X slightly, stays low
    this.targetX = (mouseX - width/2) * 0.15;
    this.x += (this.targetX - this.x) * 0.1;
    this.y = height - 100;
  }

  draw(ctx) {
    const px = width/2 + this.x;
    const py = this.y;

    ctx.save();
    ctx.translate(px, py);

    // Style: Tech/Wireframe
    ctx.fillStyle = '#050510'; 
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
    
    // Geometric Drone Body
    ctx.beginPath();
    ctx.moveTo(-15, 20); 
    ctx.lineTo(15, 20);  
    ctx.lineTo(5, -15); 
    ctx.lineTo(-5, -15); 
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Visor (Cyan Glow)
    ctx.fillStyle = 'var(--accent-cyan)';
    ctx.shadowColor = 'var(--accent-cyan)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(-4, -5);
    ctx.lineTo(4, -5);
    ctx.lineTo(0, -2);
    ctx.fill();

    // Arm pointing to net
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    
    const dx = mouseX - px;
    const dy = mouseY - py;
    const angle = Math.atan2(dy, dx);
    
    // Arm joint
    const armLen = 20;
    const jointX = Math.cos(angle) * armLen;
    const jointY = Math.sin(angle) * armLen;
    
    ctx.lineTo(jointX, jointY);
    ctx.stroke();

    // Hand/Grabber
    ctx.beginPath();
    ctx.arc(jointX, jointY, 3, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    ctx.restore();
  }
}

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;
let player;

function init() {
  resize();
  net = new Net();
  player = new Player();
  
  // Initial Creatures
  for(let i=0; i<5; i++) {
    const c = new Creature();
    c.x = random(50, width-50);
    c.y = random(50, height-150);
    creatures.push(c);
  }
  
  window.addEventListener('resize', resize);
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = x - rect.left;
    mouseY = y - rect.top;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  container.addEventListener('touchstart', e => {
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
    triggerCatch();
  }, {passive: false});
  
  container.addEventListener('mousedown', () => triggerCatch());
  
  catchBtn.addEventListener('click', (e) => {
    e.stopPropagation(); 
    triggerCatch();
  });

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  
  if(player) player.y = height - 100;
}

function triggerCatch() {
  // Visual feedback
  catchBtn.style.transform = 'scale(0.95)';
  setTimeout(() => catchBtn.style.transform = 'scale(1)', 100);

  net.active = true;
  setTimeout(() => net.active = false, 200);

  let caught = false;
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < net.radius * 1.2 + c.radius) {
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      caught = true;
      return false; 
    }
    return true; 
  });

  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 1000);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  ctx.clearRect(0, 0, width, height);

  player.update();
  player.draw(ctx);

  net.update();
  net.draw(ctx);

  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
