<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #05020a;
            --void-purple: #2a1b3d;
            --void-blue: #0f172a;
            
            /* Gold Accents */
            --gold-main: #FFD700;
            --gold-dim: #B8860B;
            --gold-light: #FFF8DC;
            --gold-glow: rgba(255, 215, 0, 0.5);
            --gold-glow-intense: rgba(255, 215, 0, 0.8);
            
            /* Glass & UI */
            --glass-bg: rgba(10, 10, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            
            /* Typography */
            /* Using system serif stack to ensure offline consistency */
            --font-display: "Cinzel", "Palatino Linotype", "Times New Roman", serif;
            --font-ui: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #e0e0e0;
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- 1. Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Deep Void Gradient */
        .atmosphere-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Radial gradient: Dark Purple to Black */
            background: 
                radial-gradient(circle at 50% 50%, #1a0f2e 0%, #05020a 70%, #000000 100%);
            pointer-events: none;
        }

        /* Vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle, transparent 30%, #000000 100%);
            pointer-events: none;
        }

        /* --- 2. Layout & Hierarchy --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 3rem;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header: Currency Top Right */
        header {
            display: flex;
            justify-content: flex-end; /* Currency to right */
            align-items: center;
            height: 60px;
            width: 100%;
        }

        /* Currency Widget: Ornate Box */
        .currency-pill {
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.9), rgba(30, 20, 10, 0.8));
            border: 1px solid var(--gold-dim);
            /* Ornate corners via clip-path or border-radius + inset shadow */
            border-radius: 4px;
            position: relative;
            padding: 0.4rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.5), 
                inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        /* Decorative corners for currency */
        .currency-pill::before, .currency-pill::after {
            content: '';
            position: absolute;
            width: 6px; height: 6px;
            border: 1px solid var(--gold-light);
            transition: all 0.3s;
        }
        .currency-pill::before { top: 2px; left: 2px; border-right: none; border-bottom: none; }
        .currency-pill::after { bottom: 2px; right: 2px; border-left: none; border-top: none; }

        .currency-pill:hover {
            border-color: var(--gold-main);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            transform: translateY(-1px);
        }

        .gold-gem-icon {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main));
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 5px var(--gold-glow);
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--gold-light);
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- Main Content & Hero Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Title: Top Center, Reduced Size, Etched */
        .hero-area {
            position: absolute;
            top: 10%; /* Moved up */
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 3.5rem; /* Reduced size */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #fff;
            margin-bottom: 0.5rem;
            /* Etched/Glowing effect */
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.3),
                0 2px 4px rgba(0,0,0,1);
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .hero-subtitle {
            font-family: var(--font-display); /* Serif for subtitle */
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.4em; /* Tightened but spaced */
            text-shadow: 0 2px 4px rgba(0,0,0,1);
        }

        /* --- Ritual Altar (Summoning Circle) --- */
        .ritual-altar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            pointer-events: none;
            z-index: 3;
            opacity: 0.6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .altar-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 15px rgba(100, 50, 200, 0.1);
        }

        .ring-1 { width: 100%; height: 100%; animation: spin 60s linear infinite; border-style: dashed; }
        .ring-2 { width: 85%; height: 85%; animation: spin-rev 40s linear infinite; border-width: 2px; border-color: rgba(255, 215, 0, 0.1); }
        .ring-3 { width: 70%; height: 70%; animation: spin 25s linear infinite; border-style: dotted; }
        
        /* Central Glow behind cards */
        .altar-core {
            width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            filter: blur(20px);
            animation: pulse 4s ease-in-out infinite;
        }

        /* --- Navigation Grid --- */
        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center; /* Vertically aligns row */
            gap: 2rem;
            width: 100%;
            z-index: 5;
            position: relative;
            margin-top: 2rem;
        }

        /* --- 3. Refined Secondary Cards (Glassmorphism) --- */
        .nav-card {
            /* Glassmorphism */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            /* Layout */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .nav-card.secondary {
            width: 160px;
            height: 200px;
        }

        .nav-card.secondary:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(20, 20, 30, 0.7);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* --- 4. Primary Action (Summon Portal) --- */
        .nav-card.primary {
            /* Significantly larger */
            width: 260px;
            height: 340px;
            margin: 0 1rem;
            
            /* Distinct Shape (Clipped Hexagon-ish) */
            clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
            
            /* Heavy Ornate Border Effect */
            background: linear-gradient(180deg, rgba(30, 20, 10, 0.8), rgba(10, 5, 15, 0.9));
            border: none; /* Clip-path eats border, so we use a pseudo-element wrapper or internal border */
            box-shadow: 0 0 30px rgba(100, 50, 200, 0.3);
        }

        /* Inner border for primary to simulate frame */
        .nav-card.primary::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
            pointer-events: none;
        }

        .nav-card.primary:hover {
            transform: scale(1.05);
            background: linear-gradient(180deg, rgba(50, 30, 10, 0.9), rgba(20, 10, 30, 0.95));
            box-shadow: 0 0 50px var(--gold-glow);
        }
        
        .nav-card.primary:hover::after {
            border-color: var(--gold-light);
            box-shadow: inset 0 0 20px var(--gold-glow);
        }

        /* --- Icons & Typography in Cards --- */
        .card-icon-wrap {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Unified Gold Glowing SVGs */
        .card-icon {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #fff;
            stroke-width: 1.5;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: all 0.3s;
        }

        /* Primary Card Icon Styling */
        .nav-card.primary .card-icon {
            width: 70px;
            height: 70px;
            stroke: url(#gold-grad);
            stroke-width: 1;
            filter: drop-shadow(0 0 15px var(--gold-glow));
            animation: float 3s ease-in-out infinite;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .nav-card.primary .card-title {
            font-size: 1.8rem;
            color: var(--gold-light);
            text-shadow: 0 0 15px var(--gold-glow);
            margin-top: 0.5rem;
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.8;
        }
        
        .nav-card:hover .card-subtitle {
            color: #fff;
            opacity: 1;
        }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- Responsive --- */
        @media (max-width: 1100px) {
            .nav-container { flex-wrap: wrap; gap: 1.5rem; }
            .nav-card.secondary { width: 140px; height: 180px; }
            .nav-card.primary { width: 220px; height: 300px; order: -1; margin-bottom: 1rem; }
            .hero-area { top: 5%; }
        }

        @media (max-width: 600px) {
            .ui-layer { padding: 1rem; }
            .hero-title { font-size: 2.2rem; }
            .ritual-altar { width: 600px; height: 600px; }
            .nav-container { flex-direction: column; }
            .nav-card.secondary, .nav-card.primary { 
                width: 100%; max-width: 300px; 
                height: 80px; 
                flex-direction: row; 
                justify-content: flex-start; 
                padding: 0 2rem;
                clip-path: none; /* Reset shape for mobile row layout */
                border-radius: 8px;
            }
            .nav-card.primary {
                border: 1px solid var(--gold-dim);
                background: linear-gradient(90deg, rgba(30,20,10,0.8), rgba(10,5,15,0.9));
            }
            .card-icon-wrap { margin-bottom: 0; margin-right: 1.5rem; }
            .card-title { font-size: 1.1rem; margin-bottom: 0; }
            .card-subtitle { display: none; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Embers -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Atmosphere & Vignette -->
    <div class="atmosphere-layer"></div>
    <div class="vignette"></div>

    <!-- 1. Ritual Altar (CSS Summoning Circle) -->
    <div class="ritual-altar">
        <div class="altar-core"></div>
        <div class="altar-ring ring-1"></div>
        <div class="altar-ring ring-2"></div>
        <div class="altar-ring ring-3"></div>
    </div>

    <div class="ui-layer">
        <header>
            <!-- 2. Currency Top Right, Ornate -->
            <div class="currency-pill">
                <div class="gold-gem-icon"></div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <main class="main-content">
            
            <!-- 2. Title Top Center -->
            <div class="hero-area">
                <h1 class="hero-title">Spirit Summoning</h1>
                <p class="hero-subtitle">Awaken the ancient bonds</p>
            </div>

            <!-- 3. Restructured Layout -->
            <nav class="nav-container">
                
                <!-- Secondary: Roster -->
                <div class="nav-card secondary" onclick="interact('roster')">
                    <div class="card-icon-wrap">
                        <!-- Rune Shield -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linejoin="round"/>
                            <path d="M12 8v4m0 4h.01" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>

                <!-- Primary: Summon (Visual Anchor) -->
                <div class="nav-card primary" onclick="interact('summon')">
                    <div class="card-icon-wrap">
                        <!-- Rune Crystal/Portal -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <defs>
                                <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
                                    <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <path d="M12 2L2 12l10 10 10-10L12 2z" stroke-linejoin="round" />
                            <path d="M12 22V12" />
                            <path d="M2 12h20" />
                            <path d="M7 7l5 5 5-5" />
                        </svg>
                    </div>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from Void</div>
                </div>

                <!-- Secondary: Battle -->
                <div class="nav-card secondary" onclick="interact('battle')">
                    <div class="card-icon-wrap">
                        <!-- Rune Sword -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M14.5 17.5L3 6V3h3l11.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M13 19l6-6" stroke-linecap="round"/>
                            <path d="M16 16l4 4" stroke-linecap="round"/>
                            <path d="M19 21l2-2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>

                <!-- Secondary: Grind -->
                <div class="nav-card secondary" onclick="interact('grind')">
                    <div class="card-icon-wrap">
                        <!-- Rune Flame -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M12 2c0 0-7 4.5-7 12 0 3.9 3.1 7 7 7 3.9 0 7-3.1 7-7 0-7.5-7-12-7-12z" stroke-linejoin="round"/>
                            <path d="M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>

            </nav>
        </main>
    </div>

    <script>
        // --- Canvas Particle System (Embers) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.vx = (Math.random() - 0.5) * 0.5; // Drift sideways
                this.vy = -(Math.random() * 1 + 0.5); // Float up
                
                this.size = Math.random() * 2 + 0.5;
                this.life = 0;
                this.maxLife = Math.random() * 200 + 100;
                
                // Gold and Purple mix
                const type = Math.random();
                if(type > 0.8) {
                    // Gold Ember
                    this.color = `rgba(255, 215, 0, ${Math.random() * 0.8 + 0.2})`;
                    this.glow = true;
                } else if (type > 0.5) {
                    // Purple Mist
                    this.color = `rgba(150, 100, 255, ${Math.random() * 0.4})`;
                    this.size *= 3; // Larger, softer
                    this.glow = false;
                } else {
                    // White/Grey Ash
                    this.color = `rgba(200, 200, 200, ${Math.random() * 0.3})`;
                    this.glow = false;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;

                // Sine wave drift
                this.x += Math.sin(this.life * 0.05) * 0.2;

                if (this.y < -10 || this.life > this.maxLife) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                if (this.glow) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.5)";
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Simple scale down effect
            card.style.transform = "scale(0.95)";
            setTimeout(() => {
                card.style.transform = ""; 
            }, 150);
        }
    </script>
</body>
</html>
