<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: rgba(20, 20, 30, 0.6);
            --accent-gold: #d4af37;
            --accent-gold-dim: #8a7020;
            --accent-glow: rgba(212, 175, 55, 0.5);
            --text-main: #e0e0e0;
            --text-muted: #888899;
            --font-display: "Georgia", "Times New Roman", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 90%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .currency-pill {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-gold-dim);
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            transition: transform 0.2s ease;
        }

        .currency-pill:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .gold-icon {
            width: 20px;
            height: 20px;
            fill: var(--accent-gold);
            filter: drop-shadow(0 0 5px var(--accent-glow));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            margin-top: 5vh;
            position: relative;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: transparent;
            background: linear-gradient(to bottom, #fff, #999);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 0.5rem;
            position: relative;
            display: inline-block;
        }

        h1.game-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 1rem;
        }

        /* --- Navigation Grid --- */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            margin-bottom: 3rem;
        }

        /* --- Card Design --- */
        .nav-card {
            position: relative;
            height: 220px;
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 2rem;
            group: card;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
        }

        .nav-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px var(--accent-gold));
        }

        /* Card Backgrounds (SVG patterns/colors) */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
            transition: opacity 0.4s;
        }
        
        .nav-card:hover .card-bg {
            opacity: 0.7;
        }

        .card-content {
            z-index: 2;
            text-align: center;
            width: 100%;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            fill: var(--text-main);
            transition: all 0.4s;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-subtitle {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
        }

        .nav-card:hover .card-subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* Specific Card Accents */
        .card-summon .card-bg { background: radial-gradient(circle at center, #2a1a3a, #000); }
        .card-roster .card-bg { background: radial-gradient(circle at center, #1a2a3a, #000); }
        .card-battle .card-bg { background: radial-gradient(circle at center, #3a1a1a, #000); }
        .card-grind .card-bg { background: radial-gradient(circle at center, #1a3a1a, #000); }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding-bottom: 1rem;
            opacity: 0.5;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
            }
            h1.game-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <!-- Decoration on left -->
            <div style="width: 120px;"></div>

            <!-- Center Logo (Small) -->
            <div style="font-family: var(--font-display); font-weight: bold; color: var(--text-muted); font-size: 0.9rem; letter-spacing: 2px;">
                AETHERIA
            </div>

            <!-- Currency -->
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Awaken the ancient bonds</p>
        </section>

        <nav class="nav-grid">
            
            <!-- Summon Card -->
            <div class="nav-card card-summon" onclick="interact('summon')">
                <div class="card-bg"></div>
                <div class="card-content">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L9.2,8.6L2,9.2L7.5,14L5.8,21L12,17.2L18.2,21L16.5,14L22,9.2L14.8,8.6L12,2Z" />
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from the Void</div>
                </div>
            </div>

            <!-- Roster Card -->
            <div class="nav-card card-roster" onclick="interact('roster')">
                <div class="card-bg"></div>
                <div class="card-content">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>
            </div>

            <!-- Battle Card -->
            <div class="nav-card card-battle" onclick="interact('battle')">
                <div class="card-bg"></div>
                <div class="card-content">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M7,2H17A2,2 0 0,1 19,4V20A2,2 0 0,1 17,22H7A2,2 0 0,1 5,20V4A2,2 0 0,1 7,2M7,4V8H17V4H7M7,10V20H17V10H7Z" />
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>
            </div>

            <!-- Grind Card -->
            <div class="nav-card card-grind" onclick="interact('grind')">
                <div class="card-bg"></div>
                <div class="card-content">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12,2L15.09,8.26L22,9.27L17,14.14L18.18,21.02L12,17.77L6.82,21.02L8,14.14L3,9.27L9.91,8.26L12,2Z" />
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>
            </div>

        </nav>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 60;
        const connectionDistance = 100;
        const mouseDistance = 150;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2 + 0.5;
                this.color = `rgba(200, 200, 255, ${Math.random() * 0.5 + 0.1})`;
                // Add some gold particles
                if(Math.random() > 0.8) {
                    this.color = `rgba(212, 175, 55, ${Math.random() * 0.5 + 0.2})`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        const directionX = forceDirectionX * force * 0.6;
                        const directionY = forceDirectionY * force * 0.6;

                        this.vx -= directionX;
                        this.vy -= directionY;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw subtle connecting lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(150, 150, 180, ${opacity * 0.15})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            console.log(`Interacting with: ${type}`);
            // Visual ripple effect could go here
            const card = event.currentTarget;
            card.style.transform = "scale(0.95)";
            setTimeout(() => {
                card.style.transform = "";
            }, 150);
        }
    </script>
</body>
</html>
