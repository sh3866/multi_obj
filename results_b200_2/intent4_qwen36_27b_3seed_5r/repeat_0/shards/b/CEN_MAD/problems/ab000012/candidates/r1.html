<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #050508;
            --bg-void: #0a0a12;
            --void-blue: #121826;
            --void-purple: #1e152e;
            
            --gold-light: #fff0a8;
            --gold-main: #d4af37;
            --gold-dark: #8a6d1c;
            --gold-glow: rgba(212, 175, 55, 0.4);
            
            --glass-bg: rgba(15, 15, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --text-main: #e0e0e0;
            --text-muted: #888899;
            
            /* Typography */
            --font-display: "Georgia", "Times New Roman", serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background Layers --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .atmosphere-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Volumetric Radial Gradient */
            background: radial-gradient(circle at 50% 40%, var(--void-purple) 0%, var(--void-blue) 40%, var(--bg-deep) 100%);
            pointer-events: none;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        /* Brand Logo */
        .brand-logo {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: var(--text-main);
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-logo::before {
            content: '';
            display: block;
            width: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-main));
        }

        /* Currency Pill */
        .currency-pill {
            background: linear-gradient(90deg, rgba(0,0,0,0.4), rgba(20,15,5,0.6));
            border: 1px solid var(--gold-dark);
            border-radius: 4px;
            padding: 0.4rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .currency-pill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .currency-pill:hover {
            border-color: var(--gold-main);
            box-shadow: 0 0 15px var(--gold-glow), inset 0 0 10px rgba(0,0,0,0.8);
            transform: translateY(-1px);
        }

        .gold-icon {
            width: 20px;
            height: 20px;
            fill: url(#gold-grad);
            filter: drop-shadow(0 0 3px var(--gold-main));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.1rem;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold-main));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: -2rem; /* Optical centering */
        }

        /* --- Summoning Circle (Hero) --- */
        .summoning-circle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
            transition: opacity 0.5s;
        }

        .summoning-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.1);
            transform: translate(-50%, -50%);
        }

        .ring-1 { width: 400px; height: 400px; border-color: rgba(212, 175, 55, 0.2); border-style: dashed; animation: spin 60s linear infinite; }
        .ring-2 { width: 320px; height: 320px; border-color: rgba(100, 200, 255, 0.15); border-width: 2px; animation: spin-reverse 40s linear infinite; }
        .ring-3 { width: 240px; height: 240px; border-color: rgba(212, 175, 55, 0.3); box-shadow: 0 0 30px rgba(212, 175, 55, 0.05); }

        .hero-title {
            font-family: var(--font-display);
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #fff;
            text-align: center;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3), 0 10px 20px rgba(0,0,0,0.8);
            background: linear-gradient(to bottom, #ffffff 20%, #b0b0c0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            position: relative;
            z-index: 2;
            line-height: 1;
        }

        .hero-subtitle {
            font-family: var(--font-ui);
            font-size: 1rem;
            color: var(--gold-main);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin-bottom: 3rem;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 2;
        }

        /* --- Navigation Grid --- */
        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            width: 100%;
            z-index: 5;
        }

        /* --- Card Design (Glassmorphism) --- */
        .nav-card {
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Secondary Tiles (Flanking) */
        .nav-card.secondary {
            width: 160px;
            height: 220px;
            border-radius: 12px;
        }

        /* Primary Action (Summon) */
        .nav-card.primary {
            width: 280px;
            height: 320px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.7), rgba(40, 30, 10, 0.6));
            animation: pulse-glow 4s ease-in-out infinite;
        }

        /* Card Hover Effects */
        .nav-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .nav-card.secondary:hover {
            background: rgba(30, 30, 50, 0.6);
        }

        .nav-card.primary:hover {
            border-color: var(--gold-main);
            box-shadow: 0 0 40px var(--gold-glow);
        }

        /* Card Content */
        .card-icon-wrap {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            fill: var(--text-main);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: all 0.4s;
        }

        .nav-card.primary .card-icon {
            width: 72px;
            height: 72px;
            fill: url(#gold-grad);
            filter: drop-shadow(0 0 15px var(--gold-glow));
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .nav-card.primary .card-title {
            font-size: 2rem;
            background: linear-gradient(to bottom, #fff, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        
        .nav-card:hover .card-subtitle {
            opacity: 1;
            color: #fff;
        }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 0 rgba(212, 175, 55, 0); }
            50% { box-shadow: 0 0 30px var(--gold-glow), inset 0 0 20px rgba(212, 175, 55, 0.1); }
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding-top: 1rem;
            opacity: 0.4;
            letter-spacing: 1px;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .hero-title { font-size: 3.5rem; }
            .summoning-circle-container { transform: translate(-50%, -50%) scale(0.7); }
            .nav-container { flex-wrap: wrap; }
            .nav-card.primary { order: -1; width: 100%; max-width: 300px; height: 200px; flex-direction: row; justify-content: space-between; padding: 0 3rem; }
            .nav-card.primary .card-icon-wrap { margin-bottom: 0; margin-right: 2rem; }
            .nav-card.primary .card-icon { width: 50px; height: 50px; }
            .nav-card.secondary { flex: 1; min-width: 120px; }
        }

        @media (max-width: 600px) {
            .hero-title { font-size: 2.5rem; }
            .nav-card.secondary { height: 150px; }
            .brand-logo span { display: none; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Volumetric Atmosphere -->
    <div class="atmosphere-layer"></div>

    <div class="ui-layer">
        <header>
            <!-- Brand Logo -->
            <div class="brand-logo">
                Aetheria
            </div>

            <!-- Currency -->
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <defs>
                        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--gold-light);stop-opacity:1" />
                            <stop offset="50%" style="stop-color:var(--gold-main);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:var(--gold-dark);stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <main class="main-content">
            
            <!-- Summoning Circle Background -->
            <div class="summoning-circle-container">
                <div class="summoning-ring ring-1"></div>
                <div class="summoning-ring ring-2"></div>
                <div class="summoning-ring ring-3"></div>
            </div>

            <h1 class="hero-title">Spirit Summoning</h1>
            <p class="hero-subtitle">Awaken the ancient bonds</p>

            <nav class="nav-container">
                
                <!-- Roster (Secondary) -->
                <div class="nav-card secondary" onclick="interact('roster')">
                    <div class="card-icon-wrap">
                        <!-- Shield Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,11.95H7V10H12V7.5L16,11L12,14.5V11.95Z" />
                        </svg>
                    </div>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>

                <!-- Summon (Primary) -->
                <div class="nav-card primary" onclick="interact('summon')">
                    <div class="card-icon-wrap">
                        <!-- Crystal/Orb Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M12,2L2,12L12,22L22,12L12,2M12,6L17.5,12L12,18L6.5,12L12,6Z" />
                            <path d="M12,2L12,22" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                            <path d="M2,12L22,12" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                        </svg>
                    </div>
                    <div class="card-content" style="text-align: center;">
                        <div class="card-title">Summon</div>
                        <div class="card-subtitle">Call from the Void</div>
                    </div>
                </div>

                <!-- Battle (Secondary) -->
                <div class="nav-card secondary" onclick="interact('battle')">
                    <div class="card-icon-wrap">
                        <!-- Sword Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M19.36,2.64L21.36,4.64L13.69,12.31L14.34,18.34L11.66,19.34L10.66,16.66L4.64,21.34L2.64,19.34L7.34,13.34L4.66,12.34L7.34,9.66L15.34,1.66L19.36,2.64M17.69,4.31L15.69,6.31L18.69,9.31L20.69,7.31L17.69,4.31M12.34,14.34L13.34,15.34L12.34,16.34L11.34,15.34L12.34,14.34Z" />
                        </svg>
                    </div>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>

                <!-- Grind (Secondary) -->
                <div class="nav-card secondary" onclick="interact('grind')">
                    <div class="card-icon-wrap">
                        <!-- Anvil/Gear Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.03 19.27,4.95 19.03,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.97,5.05C4.73,4.95 4.46,5.03 4.34,5.27L2.34,8.93C2.21,9.17 2.26,9.44 2.45,9.59L4.56,11.22C4.53,11.55 4.5,11.87 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.93C4.46,19.17 4.73,19.25 4.97,19.15L7.44,18.15C7.96,18.54 8.5,18.88 9.13,19.13L9.5,21.78C9.54,22.02 9.75,22.2 10,22.2H14C14.25,22.2 14.46,22.02 14.5,21.78L14.87,19.13C15.5,18.88 16.04,18.54 16.56,18.15L19.03,19.15C19.27,19.25 19.54,19.17 19.66,18.93L21.66,15.27C21.78,15.03 21.73,14.76 21.54,14.61L19.43,12.97Z" />
                        </svg>
                    </div>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>

            </nav>
        </main>

        <footer>
            AETHERIA &bull; VOID PROTOCOL v1.0
        </footer>
    </div>

    <script>
        // --- Canvas Particle System ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80;
        const connectionDistance = 120;
        const mouseDistance = 180;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2 + 0.5;
                
                // Mix of ethereal blue/white and rare gold
                const isGold = Math.random() > 0.9;
                if(isGold) {
                    this.color = `rgba(212, 175, 55, ${Math.random() * 0.6 + 0.2})`;
                    this.size = Math.random() * 1.5 + 0.5;
                } else {
                    this.color = `rgba(200, 220, 255, ${Math.random() * 0.4 + 0.1})`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        // Gentle push away
                        this.vx -= forceDirectionX * force * 0.05;
                        this.vy -= forceDirectionY * force * 0.05;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw subtle connecting lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        // Subtle blueish connections
                        ctx.strokeStyle = `rgba(100, 150, 255, ${opacity * 0.1})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            console.log(`Interacting with: ${type}`);
            const card = event.currentTarget;
            
            // Simple visual feedback
            card.style.transform = "scale(0.98)";
            card.style.filter = "brightness(1.2)";
            
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
